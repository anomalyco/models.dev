# Lab metadata carried over from providers/openrouter/models/thedrummer/skyfall-36b-v2.toml (curated catalogue
#   data already in this repo),
# with provider-specific fields (cost, reasoning_options, status) stripped.
# Sampling: open weights, so temperature, top_p and top_k are runtime sampler settings on any host.
schema = 2
name = "Skyfall 36B V2"
description = "Open-weight instruction model for adaptable chat and self-hosted production workloads"
open_weights = true
knowledge = "2024-06-30"
release_date = "2025-03-10"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 32_768
output = 29_491
