# Announced 2026-05-12 as Krea's first foundation image model: https://www.krea.ai/krea-2
#   Variants and API: https://www.krea.ai/docs/developers/krea-2/overview (style references by URL or data URI)
#   Output image/png through OpenRouter's Images API (2026-10-20); input formats per https://www.eachlabs.ai/krea/krea-3/krea-3-image-edit/llms.txt
schema = 2
v2_only = true
type = "image"
name = "Krea 2 Medium"
description = "Balanced Krea 2 image model for general and expressive styles"
open_weights = false
release_date = "2026-05-12"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp"]
output = ["image/png"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
