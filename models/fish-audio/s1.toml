# Released June 2025; deprecated, retiring 2026-12-31: https://docs.fish.audio/developer-guide/getting-started/changelog
# Output formats (mp3, wav, pcm, opus): https://docs.fish.audio/api-reference/endpoint/openapi-v1/text-to-speech
schema = 2
v2_only = true
type = "speech"
name = "S1"
description = "Multilingual text-to-speech model with parenthetical emotion controls"
open_weights = false
release_date = "2025-06"

[modalities]
input = ["text"]
output = ["audio/mpeg", "audio/wav", "audio/pcm", "audio/opus"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
