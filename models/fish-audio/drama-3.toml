# Released 2026-10-13: https://docs.fish.audio/developer-guide/getting-started/changelog
# Output formats (mp3, wav, pcm, opus): https://docs.fish.audio/api-reference/endpoint/openapi-v1/text-to-speech
schema = 2
v2_only = true
type = "speech"
name = "Drama 3"
description = "Text-to-speech model directed with plain-language performance notes"
open_weights = false
release_date = "2026-10-13"

[modalities]
input = ["text"]
output = ["audio/mpeg", "audio/wav", "audio/pcm", "audio/opus"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
