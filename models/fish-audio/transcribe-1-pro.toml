# Released 2026-09-18: https://docs.fish.audio/developer-guide/getting-started/changelog
# Input formats: the common list in OpenRouter's speech-to-text docs (the lab lists none here):
#   https://openrouter.ai/docs/guides/overview/multimodal/stt
schema = 2
v2_only = true
type = "transcription"
name = "Transcribe 1 Pro"
description = "Speech-to-text model with speaker markers and emotion and vocal-event cues"
open_weights = false
release_date = "2026-09-18"

[modalities]
input = ["audio/wav", "audio/mpeg", "audio/flac", "audio/mp4", "audio/ogg", "audio/webm", "audio/aac"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
