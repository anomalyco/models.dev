# https://huggingface.co/BAAI/bge-multilingual-gemma2
# release_date is the Hugging Face repository creation date (API createdAt 2024-07-25).
# Context from config.json: max_position_embeddings 8192 (embedding dimension 3584).
# Embedding model: no sampling, output is embeddings.
schema = 2
v2_only = true
type = "embedding"
name = "BGE Multilingual Gemma2"
description = "Multilingual embedding model built on Gemma 2 9B for retrieval, search and clustering"
family = "bge"
open_weights = true
release_date = "2024-07-25"
license = "Gemma"

[modalities]
input = ["text"]
output = ["embedding"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 8_192
output = 0

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/BAAI/bge-multilingual-gemma2"
