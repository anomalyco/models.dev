# Xing4.1-Preview — lab model file. The filename is the model ID (xing4.1-preview),
# matching the id returned by the provider's /v1/models list.
# Weights card goes live at public release: https://huggingface.co/XingChen-AGI/Xing4.1-Preview
schema = 2
name = "Xing4.1-Preview"
description = "Xing4.1-Preview is a high-performance, low-activation MoE model from the Xing series (285B total, 17B active). Optimized for agentic coding and long-horizon agent workflows, it delivers deep reasoning, structured output and function calling with a native 1M-token context (extrapolatable to 512K). Trained on domestic accelerators for enterprise-grade deployment."
family = "xing"
open_weights = true
knowledge = "2026-03"
release_date = "2026-11-18"

[modalities]
input  = ["text"]
output = ["text"]

# structured_output, cache and reasoning controls are per-host and live in provider files.
[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
# top_k = false: the OpenAI-compatible endpoint does not expose top_k.
# (Lab files require an explicit value for every capability flag.)
top_k = false

[limit]
# Public API window: 192k (native 1M, extrapolatable to 512K at the model level).
context = 192_000
input   = 192_000
output  = 192_000
