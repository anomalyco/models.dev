# Lab metadata for a model hosted by several providers (Open Uncensored, NanoGPT, Venice, ...),
# carried over from the existing curated provider entries in this repo; provider fields stripped.
# Source: https://huggingface.co/heabsy/CyberHeabsy
schema = 2
name = "CyberHeabsy"
description = "A low-refusal text model for authorized security research, roleplay, and creative writing. It preserves tool calling after refusal removal, supports optional reasoning, and has a 1M-token context window."
open_weights = false
release_date = "2026-09-27"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = false
top_p = false
top_k = false

[limit]
context = 1_048_576
input = 1_048_576
output = 65_536
