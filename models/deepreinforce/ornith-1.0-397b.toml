# https://huggingface.co/ornith-ai/Ornith-1.0-397B
# Sampling: open weights; the Ornith model cards use temperature=0.6, top_p=0.95, top_k=20
#   (https://huggingface.co/ornith-ai/Ornith-1.0-9B, https://huggingface.co/ornith-ai/Ornith-1.5-35B-A3B).
# Input: image input comes from the Qwen3.5 vision stack (config.json image_token_id). Neither the model card nor
#   DeepReinforce (no first-party API) lists image formats, so input stays generic `image`.
schema = 2
name = "Ornith 1.0 397B"
description = "Large coding-reasoning model for agentic software tasks and RL search"
family = "ornith"
open_weights = true
release_date = "2026-06-25"
license = "MIT"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 262_144

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/deepreinforce-ai/Ornith-1.0-397B"

[[weights]]
label = "Hugging Face (FP8)"
url = "https://huggingface.co/deepreinforce-ai/Ornith-1.0-397B-FP8"
quantization = "fp8"

[[links]]
label = "Model card"
url = "https://huggingface.co/deepreinforce-ai/Ornith-1.0-397B"
type = "model_card"

[[links]]
label = "Announcement"
url = "https://deep-reinforce.com/ornith_1_0.html"
type = "announcement"

[[benchmarks]]
name = "SWE-Bench Verified"
