# Sources:
# - https://docs.x.ai/developers/models/grok-imagine-video-1.5-lite (modalities text, image -> video; $0.020/sec output)
# - https://docs.x.ai/developers/models (Imagine pricing: grok-imagine-video-1.5-lite $0.020/sec)
# - https://cryptobriefing.com/grok-imagine-lite-venice-ai-video/ (first observed 2026-10-01; 15s clips up to 1080p with native audio)
# Pricing: $0.020/sec output (not token-based; no [cost] authored)
# Release: no official xAI release date published; using first-observed date 2026-10-01
# Image and video MIME types: https://docs.x.ai/developers/rest-api-reference/inference/videos (image inputs JPEG, PNG or WebP; video inputs and generated videos are .mp4)
schema = 2
type = "video"
name = "Grok Imagine Video 1.5 Lite"
description = "Cost-efficient video model for text-to-video and image-to-video generation"
family = "grok"
open_weights = false
release_date = "2026-10-01"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp"]
output = ["video/mp4"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 1_024
output = 0
