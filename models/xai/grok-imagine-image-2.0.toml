# Sources:
# - https://docs.x.ai/docs/models
# - https://docs.x.ai/developers/models/grok-imagine-image-2.0
# - https://docs.x.ai/docs/guides/image-generation
# - https://x.ai/news/grok-imagine-image-2
# Pricing: $0.04 per image (not token-based; no [cost] authored)
# Release: 2026-08-07 (GA as Quality Mode; API model id grok-imagine-image-2.0)
# Context: GET https://api.x.ai/v1/image-generation-models reports max_prompt_length = 64000 (2026-10-19).
# Image MIME types: https://docs.x.ai/developers/rest-api-reference/inference/images (inputs JPEG, PNG or WebP; outputs image/jpeg unless the requested quality produces PNG)
schema = 2
type = "image"
name = "Grok Imagine Image 2.0"
description = "Image model for prompt-driven generation, editing, and visual design workflows"
family = "grok"
open_weights = false
release_date = "2026-08-07"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp"]
output = ["image/jpeg", "image/png"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 64_000
output = 0
