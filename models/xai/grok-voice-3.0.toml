# Sources:
# - https://docs.x.ai/developers/models/grok-voice-3.0
# - https://docs.x.ai/developers/model-capabilities/audio/speech-to-speech (session.update: tools, reasoning.effort high|none)
# - https://docs.x.ai/developers/release-notes (2026-10-14: grok-voice-3.0 available; grok-voice-latest points to it)
# xAI publishes no token context or output window for Speech to Speech; zero denotes not published.
schema = 2
v2_only = true
type = "realtime"
name = "Grok Voice 3.0"
description = "Speech-to-speech model for real-time voice agents with tool use and optional reasoning"
family = "grok"
open_weights = false
release_date = "2026-10-14"

[modalities]
input = ["text", "audio"]
output = ["text", "audio"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
