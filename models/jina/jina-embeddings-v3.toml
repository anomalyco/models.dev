# Sources (accessed 2026-09-15):
# https://jina.ai/models/jina-embeddings-v3/
# https://jina.ai/news/jina-embeddings-v3-a-frontier-multilingual-embedding-model/
# https://huggingface.co/jinaai/jina-embeddings-v3 (license cc-by-nc-4.0)
# https://arxiv.org/abs/2409.10173
# limit.output = default embedding dimension (1024; Matryoshka down to 32).
name = "jina-embeddings-v3"
description = "Multilingual text embedding model with task-specific LoRA adapters and Matryoshka truncation"
release_date = "2024-09-18"
last_updated = "2024-09-18"
attachment = false
reasoning = false
temperature = false
tool_call = false
open_weights = true
license = "CC-BY-NC-4.0"

[limit]
context = 8_192
output = 1_024

[modalities]
input = ["text"]
output = ["text"]

[[weights]]
label = "Model weights"
url = "https://huggingface.co/jinaai/jina-embeddings-v3"
format = "safetensors"
