# Lab metadata for xtools-at's model, hosted by NanoGPT and OpenUncensored.
# Source: https://huggingface.co/xtools-at/DeepSeek-V4-Pro-Qwen3.5-9B-UNCENSORED-heretic (accessed 2026-11-24):
#   Apache-2.0, repo created 2026-10-30, base model Jackrong/DeepSeek-V4-Pro-Qwen3.5-9B, pipeline_tag text-generation.
#   The card calls it "a compact 9B reasoning model distilled from DeepSeek-V4-Pro" and reports small gains in tool
#   calling; its tags include reasoning and tool-use.
# Context: config.json text_config.max_position_embeddings = 262,144; output as the base family's lab,
