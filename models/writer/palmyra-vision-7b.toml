# The Bedrock model card documents client-side tool calling on the mantle endpoint.
# The model card lists Image + Text inputs but does not publish an exhaustive image MIME allowlist.
# Source: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-writer-palmyra-vision-7b.html.
# https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-writer-palmyra-vision-7b.html
# Bedrock model card records the launch date, image/text input and 4K context/output limits.
# Sampling follows Bedrock Converse inferenceConfig (temperature and topP).
schema = 2
name = "Palmyra Vision 7B"
description = "Writer multimodal model for enterprise image understanding and visual analysis"
open_weights = false
release_date = "2026-03-26"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = false

[limit]
context = 4_000
output = 4_000
