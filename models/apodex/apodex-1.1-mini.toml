schema = 2
name = "Apodex 1.1 Mini"
description = "Open-weight 35B MoE model for long-horizon research, forecasting, and tool-assisted work"
open_weights = true
release_date = "2026-08-24"
license = "Apache-2.0"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 262_144
