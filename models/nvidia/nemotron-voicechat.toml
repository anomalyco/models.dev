schema = 2
name = "Nemotron VoiceChat"
description = "Nemotron multimodal model for visual reasoning and agentic AI workflows"
family = "nemotron"
open_weights = true
release_date = "2026-03-16"

[modalities]
input = ["text", "audio"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 128_000
output = 8_192
