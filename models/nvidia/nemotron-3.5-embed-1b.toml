# Released 2026-10-20: https://build.nvidia.com/nvidia/nemotron-3_5-embed-1b/modelcard
# https://huggingface.co/nvidia/Nemotron-3.5-Embed-1B-BF16 (OpenMDW-1.1)
# Card: text, document-image or image+text input (queries text only); 2048-dimensional output; "The source models'
#   max context length is 32,768 tokens". Images: the card's examples send data:image/png; PNG and JPEG data URLs
#   both return vectors on the hosted API (live 2026-11-08).
schema = 2
v2_only = true
type = "embedding"
name = "Nemotron 3.5 Embed 1B"
description = "Multimodal multilingual embedding model for text and document-image retrieval"
family = "nemotron"
open_weights = true
release_date = "2026-10-20"
license = "OpenMDW-1.1"

[modalities]
input = ["text", "image/png", "image/jpeg"]
output = ["embedding"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 32_768
output = 0

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/nvidia/Nemotron-3.5-Embed-1B-BF16"
