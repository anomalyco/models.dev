# Knowledge: pre-training data cutoff September 2024: https://huggingface.co/nvidia/NVIDIA-Nemotron-Nano-9B-v2
# Sampling: open weights, so temperature/top_p/top_k are runtime features of the host;
#   the model card recommends temperature 0.6 and top_p 0.95 with reasoning on.
schema = 2
name = "Nemotron Nano 9B v2"
description = "Compact Nemotron model for efficient reasoning and deployable AI agents"
family = "nemotron"
open_weights = true
knowledge = "2024-09"
release_date = "2025-08-18"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 131_072
output = 131_072
