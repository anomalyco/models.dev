# Sampling: open weights, so temperature/top_p/top_k are runtime features of the host.
schema = 2
name = "Llama 3.1 Nemotron 70B Instruct"
description = "Nemotron model for efficient reasoning, coding, and specialized AI agents"
family = "nemotron"
open_weights = true
release_date = "2025-04-15"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 128_000
output = 8_192
