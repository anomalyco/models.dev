# Knowledge: pre-training data cutoff June 25, 2025 (post-training November 28, 2025):
#   https://huggingface.co/nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
# Sampling: open weights, so temperature/top_p/top_k are runtime features of the host;
#   the model card recommends temperature 1.0 and top_p 1.0 for reasoning.
schema = 2
name = "Nemotron 3 Nano 30B A3B"
description = "Small Nemotron 3 MoE for efficient coding, math, and long-context agents"
family = "nemotron"
open_weights = true
knowledge = "2025-06-25"
release_date = "2025-12-15"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 262_144
output = 262_144
