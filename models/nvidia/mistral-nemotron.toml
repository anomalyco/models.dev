# Not open weights: offered as an API endpoint on build.nvidia.com; self-hosting needs a license from Mistral AI
#   (https://build.nvidia.com/mistralai/mistral-nemotron/modelcard). No public checkpoint exists.
# Sampling: the endpoint's API samples pass temperature and top_p; no top_k.
schema = 2
name = "Mistral Nemotron"
description = "Mistral model for multilingual chat, reasoning, and tool-assisted workflows"
family = "nemotron"
open_weights = false
release_date = "2025-06-11"
last_updated = "2025-06-12"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = false

[limit]
context = 128_000
output = 8_192
