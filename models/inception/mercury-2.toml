# Sources:
# - https://docs.inceptionlabs.ai/get-started/models (Mercury 2: 128K context, 50,000 max output, text, tool calling, structured outputs)
# - https://www.businesswire.com/news/home/20260224034496/en/ (launch, 2026-02-24)
# Sampling: temperature 0.5-1 is the only sampling parameter on the chat completions API, no top_p or top_k
# (https://docs.inceptionlabs.ai/api-reference/chat/create-a-chat-completion).
schema = 2
name = "Mercury 2"
description = "Reasoning model for deliberate analysis, multi-step problem solving, and tool use"
family = "mercury"
open_weights = false
release_date = "2026-02-24"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = false
top_k = false

[limit]
context = 128_000
output = 50_000
