# Sources (accessed 2026-10-21):
# - https://docs.inceptionlabs.ai/get-started/models (Mercury Edit 2: /v1/fim/completions and /v1/edit/completions,
#   FIM and NextEdit context 32K, 8,192 max output, text, no tool calling or structured outputs)
# - https://www.inceptionlabs.ai/blog/introducing-mercury-edit-2
# - Text input only: https://docs.inceptionlabs.ai/resources/faq
# - No reasoning: the FIM and edit request schemas have no reasoning field, and reasoning_effort applies to chat models
#   only (https://docs.inceptionlabs.ai/capabilities/reasoning-efforts).
# Sampling (https://api.inceptionlabs.ai/openapi.json): the edit endpoint takes temperature (0-2) and top_p; the FIM
#   endpoint takes top_p and top_k.
schema = 2
name = "Mercury Edit 2"
description = "Code editing dLLM for autocomplete (FIM) and next-edit suggestions"
family = "mercury"
open_weights = false
release_date = "2026-03-30"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 32_000
output = 8_192
