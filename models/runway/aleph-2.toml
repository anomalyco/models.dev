# Released in June 2026; on the Runway API since 2026-06-02: https://www.youtube.com/watch?v=mO5PAxbE5Cs,
#   https://docs.dev.runwayml.com/api-details/api_changelog (Gen-4 Aleph users moved to aleph2)
# Inputs: images JPEG, PNG or WebP; videos MP4 or MOV: https://docs.dev.runwayml.com/assets/inputs/
# Output: MP4.
schema = 2
v2_only = true
type = "video"
name = "Aleph 2.0"
description = "In-context video editing model that applies text and keyframe edits across existing footage"
family = "runway"
open_weights = false
release_date = "2026-06"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp", "video/mp4", "video/quicktime"]
output = ["video/mp4"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
