# Sources: https://blog.cloudflare.com/clef-decision-models/ (2026-10-01),
# https://blog.cloudflare.com/clef-faster-cheaper-multimodal/ (2026-10-09),
# https://developers.cloudflare.com/workers-ai/models/clef-flash/ and
# https://huggingface.co/Cloudflare/clef-flash (all accessed 2026-10-20).
# Clef Flash generates no free-form text, so output is 0 (provider entries set
# structured_output = true). Context: the 2026-10-09 update says "The Clef-flash weights on Hugging Face
# are unchanged and support up to a 256K context window if you self-host", while
# Cloudflare's hosted endpoint caps Flash at 24K for price. The lab limit is the
# weights capability; each host entry records its own cap. Input follows the
# same-model Workers AI and OpenRouter entries: text and images (PNG, JPEG, WebP per the Workers AI model page). Temperature follows
# Cloudflare's first-party Workers AI entry (true); Melious's System One surface
# takes only model, state, questions and images, so that provider entry overrides
# temperature = false. Apache-2.0 weights, 9B parameters, post-trained from
# Qwen3.5-9B.
schema = 2
type = "decision"
name = "Clef Flash"
description = "Cloudflare's fast 9B open-weight decision model that returns probabilities for typed choice, score and yes/no questions about text or images"
open_weights = true
release_date = "2026-10-01"
license = "Apache-2.0"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 262_144
output = 0

[[links]]
label = "Announcement"
url = "https://blog.cloudflare.com/clef-decision-models/"
type = "announcement"

[[links]]
label = "Model card"
url = "https://huggingface.co/Cloudflare/clef-flash"
type = "model_card"

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/Cloudflare/clef-flash"
