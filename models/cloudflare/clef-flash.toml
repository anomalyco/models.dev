# Sources: https://blog.cloudflare.com/clef-decision-models/ (2026-10-01),
# https://blog.cloudflare.com/clef-faster-cheaper-multimodal/ (2026-10-09),
# https://developers.cloudflare.com/workers-ai/models/clef-flash/ and
# https://huggingface.co/Cloudflare/clef-flash (all accessed 2026-10-20).
# Clef Flash generates no free-form text, so output is 0 and structured_output is
# true. Context: the 2026-10-09 update says "The Clef-flash weights on Hugging Face
# are unchanged and support up to a 256K context window if you self-host", while
# Cloudflare's hosted endpoint caps Flash at 24K for price. The lab limit is the
# weights capability; each host entry records its own cap. Input follows the
# same-model Workers AI and OpenRouter entries: text and images. Temperature: the
# System One request takes model, state, questions and images only, with no
# temperature or sampling parameter, so temperature is false. Apache-2.0 weights,
# 9B parameters, post-trained from Qwen3.5-9B.
type = "decision"
name = "Clef Flash"
description = "Cloudflare's fast 9B open-weight decision model that returns probabilities for typed choice, score and yes/no questions about text or images"
release_date = "2026-10-01"
last_updated = "2026-10-01"
attachment = true
reasoning = false
temperature = false
tool_call = false
structured_output = true
open_weights = true
license = "Apache-2.0"

[limit]
context = 262_144
output = 0

[modalities]
input = ["text", "image"]
output = ["text"]

[[links]]
label = "Announcement"
url = "https://blog.cloudflare.com/clef-decision-models/"
type = "announcement"

[[links]]
label = "Model card"
url = "https://huggingface.co/Cloudflare/clef-flash"
type = "model_card"

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/Cloudflare/clef-flash"
