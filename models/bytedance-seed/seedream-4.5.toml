# Released 2025-12-03: https://www.byteplus.com/en/blog/seedream4-5
#   Input formats jpeg, png, webp, bmp, tiff, gif, heic, heif:
#   https://ai.byteplus.com/resources/seedream-5-0-overview-what-we-know-about-this-version
#   Output is JPEG and can't be changed for 4.5 (output_format applies to 5.0 only).
schema = 2
v2_only = true
type = "image"
name = "Seedream 4.5"
description = "Unified image generation and editing model with multi-image references"
family = "seed"
open_weights = false
release_date = "2025-12-03"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp", "image/bmp", "image/tiff", "image/gif", "image/heic", "image/heif"]
output = ["image/jpeg"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
