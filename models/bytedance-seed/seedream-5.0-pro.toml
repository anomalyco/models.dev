schema = 2
v2_only = true
type = "image"
name = "Seedream 5.0 Pro"
description = "Image generation and interactive editing model for commercial visual production"
family = "seed"
open_weights = false
release_date = "2026-07-08"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp", "image/bmp", "image/tiff", "image/gif", "image/heic", "image/heif"]
output = ["image/jpeg", "image/png"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
