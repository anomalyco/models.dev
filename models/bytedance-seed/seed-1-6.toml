# Sources (accessed 2026-08-14):
# - https://seed.bytedance.com/en/seed2
# - https://www.volcengine.com/docs/82379/1330310
# Sampling: the Ark Chat API takes temperature and top_p and has no top_k: https://www.volcengine.com/docs/82379/1494384
schema = 2
name = "Seed 1.6"
description = "ByteDance Seed model for long-context reasoning, instruction following, and tool-assisted tasks"
family = "seed"
open_weights = false
release_date = "2025-10-15"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = false

[limit]
context = 256_000
output = 64_000
