name = "Doubao-Seedance-2.0"
description = "Seedance 2.0 delivers ultra-realistic, highly stable audiovisual output: with outstanding motion stability and fine visual detail, it produces imagery with a live-action-quality look and an almost indistinguishable blend of real and virtual visual impact. It can handle complex scenes with ease—vividly recreating everything from subtle micro-expressions and intense physical confrontations to dynamic, high-energy song-and-dance performances. It also comes with professional camera movement, multi-shot storytelling, and text-to-video generation capabilities, enhancing narrative tension.\nAudio and visuals are generated natively in sync, accurately matching the visuals with rich sound effects. It supports performances in multiple languages, accents, and dialects, giving videos exceptional completeness and immersion.\nSeedance 2.0 is deeply optimized for three key scenarios: commercial advertising, film/TV production, and social media marketing. With industrial-grade generation quality, the hit rate for successful generations is significantly improved, lowering the barrier and cost of producing high-quality content, streamlining the workflow from idea to final cut, and delivering substantial efficiency gains for the industry."
