# Async video-generation task API: no temperature/tool/structured-output controls;
# billed per video token / second of output, so no text token limits (limit = 0).
name = "Seedance 2.0"
description = "Multimodal video model for text/image/omni-reference-to-video, video editing and extension with native audio (up to 4K, 15 s)"
family = "seed"
release_date = "2026-02-12"
last_updated = "2026-04-14"
attachment = true
reasoning = false
temperature = false
tool_call = false
open_weights = false

[limit]
context = 0
output = 0

[modalities]
input = ["text", "image", "video", "audio"]
output = ["video"]
