# Model card (https://huggingface.co/ByteDance-Seed/UI-TARS-1.5-7B, accessed 2026-11-28): open multimodal GUI agent
#   (image-text-to-text, built on Qwen2.5-VL), Apache-2.0. config.json: max_position_embeddings 128,000.
# Release: https://github.com/bytedance/UI-TARS (News: "2025.04.16: ... we open-sourced the UI-TARS-1.5-7B").
# Tools: the model writes GUI actions as text ("Thought: ... Action: ...", https://github.com/bytedance/UI-TARS), with no
#   function-calling format, so tools = false. Its thought is part of that text, not a separate reasoning output, so
#   reasoning = false. Image formats aren't documented, so input is generic image.
# No separate output cap is published, so output = context.
# Sampling: open weights, so temperature/top_p/top_k are runtime features of the host.
schema = 2
name = "UI-TARS 1.5 7B"
description = "Open ByteDance Seed vision-language agent for computer, browser, and phone GUI tasks"
family = "ui-tars"
open_weights = true
release_date = "2025-04-16"
license = "Apache-2.0"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 128_000
output = 128_000

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/ByteDance-Seed/UI-TARS-1.5-7B"
