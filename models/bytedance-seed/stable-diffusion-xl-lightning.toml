# Released 2024-02-21 by ByteDance: https://arxiv.org/abs/2402.13929
# Weights under CreativeML Open RAIL++-M: https://huggingface.co/ByteDance/SDXL-Lightning
# Few-step (1 to 8) distillation of Stable Diffusion XL for 1024px text-to-image. Output stays generic `image`: the open
# weights produce pixels and the format is chosen by the host. Prompts are not chat tokens, so context and output are 0.
schema = 2
v2_only = true
type = "image"
name = "SDXL-Lightning"
description = "Few-step distilled Stable Diffusion XL model for fast 1024px text-to-image"
family = "stable-diffusion"
open_weights = true
release_date = "2024-02-21"
license = "CreativeML Open RAIL++-M"

[modalities]
input = ["text"]
output = ["image"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/ByteDance/SDXL-Lightning"
