# Model IDs: https://elevenlabs.io/docs/overview/models
# Released 2023-08-22: https://elevenlabs.io/blog/eleven-multilingual-v2
# Output formats: output_format mp3_*, pcm_*, wav_*, opus_*, ulaw_8000, alaw_8000:
#   https://elevenlabs.io/docs/api-reference/text-to-speech/convert
schema = 2
v2_only = true
type = "speech"
name = "Eleven Multilingual v2"
description = "Lifelike multilingual text-to-speech model for long-form narration in 29 languages"
family = "elevenlabs"
open_weights = false
release_date = "2023-08-22"

[modalities]
input = ["text"]
output = ["audio/mpeg", "audio/pcm", "audio/wav", "audio/opus", "audio/basic", "audio/alaw"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
