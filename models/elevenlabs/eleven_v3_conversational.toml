# Model IDs: https://elevenlabs.io/docs/overview/models
# Added 2026-02-09: https://elevenlabs.io/docs/changelog/2026/2/9
# Output formats: output_format mp3_*, pcm_*, wav_*, opus_*, ulaw_8000, alaw_8000:
#   https://elevenlabs.io/docs/api-reference/text-to-speech/convert
schema = 2
v2_only = true
type = "speech"
name = "Eleven v3 Conversational"
description = "Real-time variant of Eleven v3 tuned for conversational agents"
family = "elevenlabs"
open_weights = false
release_date = "2026-02-09"

[modalities]
input = ["text"]
output = ["audio/mpeg", "audio/pcm", "audio/wav", "audio/opus", "audio/basic", "audio/alaw"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
