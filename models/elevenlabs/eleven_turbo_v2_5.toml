# Model IDs: https://elevenlabs.io/docs/overview/models
# Released 2024-07-19: https://elevenlabs.io/blog/introducing-turbo-v25
# Output formats: output_format mp3_*, pcm_*, wav_*, opus_*, ulaw_8000, alaw_8000:
#   https://elevenlabs.io/docs/api-reference/text-to-speech/convert
schema = 2
v2_only = true
type = "speech"
name = "Eleven Turbo v2.5"
description = "Low-latency multilingual text-to-speech model, superseded by Flash v2.5"
family = "elevenlabs"
open_weights = false
release_date = "2024-07-19"

[modalities]
input = ["text"]
output = ["audio/mpeg", "audio/pcm", "audio/wav", "audio/opus", "audio/basic", "audio/alaw"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
