# Model IDs: https://elevenlabs.io/docs/overview/models
# Released 2026-09-28: https://elevenlabs.io/docs/changelog/2026/9/28
# Output formats: output_format mp3_*, pcm_*, wav_*, opus_*, ulaw_8000, alaw_8000:
#   https://elevenlabs.io/docs/api-reference/text-to-speech/convert
schema = 2
v2_only = true
type = "speech"
name = "Eleven v4 Turbo"
description = "Low-latency Eleven v4 text-to-speech model for real-time agents"
family = "elevenlabs"
open_weights = false
release_date = "2026-09-28"

[modalities]
input = ["text"]
output = ["audio/mpeg", "audio/pcm", "audio/wav", "audio/opus", "audio/basic", "audio/alaw"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
