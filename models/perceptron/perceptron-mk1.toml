# Lab metadata carried over from providers/openrouter/models/perceptron/perceptron-mk1.toml (curated catalogue data already in this repo),
# with provider-specific fields (cost, reasoning_options, status) stripped.
schema = 2
name = "Perceptron Mk1"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"
open_weights = false
release_date = "2026-05-12"

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 32_768
output = 8_192
