# Lab metadata carried over from providers/openrouter/models/perceptron/perceptron-mk1.toml (curated catalogue
#   data already in this repo),
# with provider-specific fields (cost, reasoning_options, status) stripped.
# Sources:
# - https://docs.perceptron.inc/perceptron-mk1/index.md (launch 2026-05-12, 32K context, closed source;
#   supported image formats JPEG, PNG, WebP; video formats MP4, WebM)
# - https://docs.perceptron.inc/perceptron-mk1/api-reference/endpoint/chat-completions (MIME types image/png,
#   image/jpeg, image/webp, video/mp4, video/webm; temperature, top_p and top_k request fields; 8K output)
# - https://docs.perceptron.inc/perceptron-mk1/changelog.md
schema = 2
name = "Perceptron Mk1"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"
open_weights = false
release_date = "2026-05-12"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "video/mp4", "video/webm"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 32_768
output = 8_192
