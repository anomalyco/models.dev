# Sources (accessed 2026-10-02):
# https://reka.ai/news/reka-edge-frontier-level-edge-intelligence-for-physical-ai (announced 2026-03-11; release_date)
# https://huggingface.co/RekaAI/reka-edge-2603 (Reka Edge 2603 license)
# https://developer.reka.ai/models (16,384-token context)
# limit.output: max output declared by Reka for its own endpoint, published at
# https://openrouter.ai/rekaai/reka-edge (max_completion_tokens, accessed 2026-10-03).
# Model card: "the model does not currently support reasoning".
name = "Reka Edge 2603"
description = "Efficient 7B multimodal model for physical AI with image and video understanding, object detection, and tool use"
family = "reka"
release_date = "2026-03-11"
last_updated = "2026-03-11"
attachment = true
reasoning = false
temperature = true
tool_call = true
structured_output = true
open_weights = true
license = "Reka Edge 2603 License"

[limit]
context = 16_384
output = 14_745

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/RekaAI/reka-edge-2603"
format = "safetensors"

[[benchmarks]]
name = "VQA-v2"
score = 88.4
metric = "accuracy"
source = "https://huggingface.co/RekaAI/reka-edge-2603"

