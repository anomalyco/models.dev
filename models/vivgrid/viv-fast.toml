# Sources:
# - https://docs.vivgrid.com/models/viv-fast
# - https://docs.vivgrid.com/api/model-api
# Image input: the model page lists "Modalities: Text, Image" and the Model API docs list no formats, so the input
#   stays generic `image`. Sampling flags are unchanged from the earlier entry (temperature false).
schema = 2
name = "Viv Fast"
description = "Fast coding model"
open_weights = false
knowledge = "2026-09"
release_date = "2026-09-21"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = false
top_p = false
top_k = false

[limit]
context = 1_000_000
output = 256_000

[[links]]
label = "Model docs"
url = "https://docs.vivgrid.com/models/viv-fast"
