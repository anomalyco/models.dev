# Sources (accessed 2026-08-19):
# - https://z.ai/blog/glm-4.6v
# - https://huggingface.co/zai-org/GLM-4.6V-Flash
# Input formats (Z.AI / Zhipu Chat API, vision request content items, accessed 2026-10-20):
# image_url: jpg, jpeg, png (≤5 MB, ≤6000×6000 px); video_url: mp4, mkv, mov (≤200 MB).
# - https://docs.z.ai/api-reference/llm/chat-completion
# - https://docs.bigmodel.cn/api-reference/模型-api/对话补全 (names the GLM-5.3-Flash, GLM-5V-Turbo, GLM-4.6V and GLM-4.5V series)
schema = 2
name = "GLM-4.6V-Flash"
description = "Lightweight GLM vision model for visual reasoning, documents, and multimodal agents"
family = "glm-flash"
open_weights = true
release_date = "2025-12-08"

[modalities]
input = ["text", "image/jpeg", "image/png", "video/mp4", "video/x-matroska", "video/quicktime"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 128_000
output = 32_768

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/zai-org/GLM-4.6V-Flash"
