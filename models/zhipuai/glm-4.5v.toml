# Input formats (Z.AI / Zhipu Chat API, vision request content items, accessed 2026-10-20):
# image_url: jpg, jpeg, png (≤5 MB, ≤6000×6000 px); video_url: mp4, mkv, mov (≤200 MB).
# - https://docs.z.ai/api-reference/llm/chat-completion
# - https://docs.bigmodel.cn/api-reference/模型-api/对话补全 (names the GLM-5.3-Flash, GLM-5V-Turbo, GLM-4.6V and GLM-4.5V series)
schema = 2
name = "GLM-4.5V"
description = "GLM vision model for visual reasoning, documents, and multimodal agents"
family = "glm"
open_weights = true
knowledge = "2025-04"
release_date = "2025-08-11"

[modalities]
input = ["text", "image/jpeg", "image/png", "video/mp4", "video/x-matroska", "video/quicktime"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 64_000
output = 16_384

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/zai-org/GLM-4.5V"

[[benchmarks]]
name = "Artificial Analysis Coding Index"
score = 10.9
metric = "index"
source = "https://openrouter.ai/z-ai/glm-4.5v/benchmarks"
date = "2026-04-29"

[[benchmarks]]
name = "SciCode"
score = 22.1
metric = "percent correct"
source = "https://openrouter.ai/z-ai/glm-4.5v/benchmarks"
date = "2026-04-29"

[[benchmarks]]
name = "Terminal-Bench Hard"
score = 5.3
metric = "success rate"
source = "https://openrouter.ai/z-ai/glm-4.5v/benchmarks"
date = "2026-04-29"
