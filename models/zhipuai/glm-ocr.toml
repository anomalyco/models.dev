# Generated from EUrouter's public catalog, GET https://api.eurouter.ai/v1/models, model "zhipu/glm-ocr".
# Fix a wrong value in the catalog or in the generator (apps/core/scripts/modelsdev-generate.ts in the EUrouter repository), never in this file.
# models.dev has no lab entry for this model, so this one comes from the catalog fields name, description, release_date,
#   knowledge_cutoff, license, open_weights, architecture, supported_parameters, context_length,
#   top_provider.max_completion_tokens and hugging_face_id (https://huggingface.co/zai-org/GLM-OCR).
schema = 2
name = "GLM-OCR"
description = "GLM-OCR is Z.ai's lightweight (about 0.9B) open-weight multimodal OCR model for complex document understanding: text, formula and table recognition, plus information extraction into a JSON template given in the prompt. Built on the GLM-V encoder-decoder architecture with a CogViT visual encoder and a GLM-0.5B decoder."
open_weights = true
release_date = "2026-02-03"
license = "MIT"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = false

[limit]
context = 8192

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/zai-org/GLM-OCR"
