# Published December 2024 (Apache-2.0): https://huggingface.co/hexgrad/Kokoro-82M
# Output formats: mp3 and pcm, as documented for OpenRouter's speech API (the lab lists none here):
#   https://openrouter.ai/docs/guides/overview/multimodal/tts
schema = 2
v2_only = true
type = "speech"
name = "Kokoro 82M"
description = "Lightweight open text-to-speech model"
open_weights = true
release_date = "2024-12"
license = "Apache-2.0"

[modalities]
input = ["text"]
output = ["audio/mpeg", "audio/pcm"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/hexgrad/Kokoro-82M"
