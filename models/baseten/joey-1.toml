# Sources (accessed 2026-11-24):
# - https://huggingface.co/baselabs/joey-1 (license mit-and-apache-2.0; created 2026-10-27; post-trained from Qwen3.5-2B,
#   text and image input, max sequence length 16,384 tokens; returns a calibrated probability for
#   every option, no generated text)
# - https://docs.baseten.co/inference/model-apis/decision-models (POST /v1/systemone with a state and typed questions)
# Images: System One takes base64 PNG, JPEG or WebP data URLs
#   (https://docs.baseten.co/reference/inference-api/system-one#image-inputs).
# Sampling: GET https://inference.baseten.co/v1/models lists no supported sampling parameters.
schema = 2
v2_only = true
type = "decision"
name = "joey-1"
family = "joey"
description = "Base Labs' 2B open-weight decision model on Qwen3.5-2B that returns calibrated probabilities for typed choice, score and yes/no questions about text and images"
open_weights = true
release_date = "2026-10-27"
license = "MIT AND Apache-2.0"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp"]
output = ["decision"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 16_384
output = 0

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/baselabs/joey-1"
