# Sources (accessed 2026-11-24):
# - https://huggingface.co/baselabs/groundhog-1 (license mit-and-apache-2.0; created 2026-11-20; post-trained from Gemma 4 26B A4B,
#   text and image input, max sequence length 131,072 tokens; returns a calibrated probability for
#   every option, no generated text)
# - https://docs.baseten.co/inference/model-apis/decision-models (POST /v1/systemone with a state and typed questions)
# Images: System One takes base64 PNG, JPEG or WebP data URLs
#   (https://docs.baseten.co/reference/inference-api/system-one#image-inputs).
# Sampling: GET https://inference.baseten.co/v1/models lists no supported sampling parameters.
# Baseten Model APIs serves it with a 16,384-token context (GET /v1/models context_length); that limit belongs in the host file.
schema = 2
v2_only = true
type = "decision"
name = "groundhog-1"
family = "groundhog"
description = "Base Labs' 26B mixture-of-experts open-weight decision model (about 4B active) on Gemma 4 26B A4B that returns calibrated probabilities for typed choice, score and yes/no questions about long text and images"
open_weights = true
release_date = "2026-11-20"
license = "MIT AND Apache-2.0"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp"]
output = ["decision"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 131_072
output = 0

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/baselabs/groundhog-1"
