# Sources:
# - providers/nano-gpt/models/agnes-3.0-flash.toml (the only entry describing 3.0; Agnes ships no
#   first-party entry for it, so name, description, dates and limits come from that relay)
# - https://agnes-ai.com/doc (provider documentation)
# Note: no reasoning control is declared here. Kenari reports none for this id, Agnes ships no
# first-party entry to copy one from, and the relay above records `reasoning_options = []`.
# `temperature` is omitted because no cited source states it.

name = "Agnes 3.0 Flash"
description = "Agnes 3.0 Flash is a low-cost model for coding, tool use, and multi-turn agent tasks. It supports text and image input, optional thinking, and a 512K-token context window."
release_date = "2026-09-09"
last_updated = "2026-09-09"
attachment = true
reasoning = true
tool_call = true
structured_output = false
open_weights = false

[limit]
context = 524_288
input = 524_288
output = 65_536

[modalities]
input = ["text", "image"]
output = ["text"]
