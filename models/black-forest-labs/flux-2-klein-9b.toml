# Released 2026-01-15 under the FLUX Non-Commercial License: https://bfl.ai/blog/flux2-klein-towards-interactive-visual-intelligence,
#   https://huggingface.co/black-forest-labs/FLUX.2-klein-9B (license_name flux-non-commercial-license)
#   Inputs PNG, JPEG or WebP: https://docs.bfl.ml/llms-full.txt ("Images can be PNG, JPEG, or WebP")
#   Output: output_format jpeg (default), png or webp on POST /v1/flux-2-klein-9b (https://api.bfl.ai/openapi.json)
schema = 2
v2_only = true
type = "image"
name = "FLUX.2 [klein] 9B"
description = "Fast 9B open-weight image generation and multi-reference editing model"
family = "flux"
open_weights = true
release_date = "2026-01-15"
license = "FLUX Non-Commercial License"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp"]
output = ["image/jpeg", "image/png", "image/webp"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/black-forest-labs/FLUX.2-klein-9B"
