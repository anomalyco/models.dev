# Released 2026-10-01: https://docs.bfl.ml/release-notes, https://docs.bfl.ml/flux_3/flux3_image_overview
#   Inputs PNG, JPEG or WebP: https://docs.bfl.ml/llms-full.txt ("Images can be PNG, JPEG, or WebP")
#   Output: the API has no output_format for this model (Flux3ImageInputs in https://api.bfl.ai/openapi.json);
#   it returned image/png through OpenRouter's Images API on 2026-10-20.
schema = 2
v2_only = true
type = "image"
name = "FLUX 3 Image"
description = "Image generation and editing model with bounding-box layout control and up to ten references"
family = "flux"
open_weights = false
release_date = "2026-10-01"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp"]
output = ["image/png"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
