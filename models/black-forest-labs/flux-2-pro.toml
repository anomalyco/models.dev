# Released 2025-11-25: https://bfl.ai/blog/flux-2, https://docs.bfl.ml/release-notes
#   Inputs PNG, JPEG or WebP: https://docs.bfl.ml/llms-full.txt ("Images can be PNG, JPEG, or WebP")
#   Output: output_format jpeg (default), png or webp (OutputFormat in https://api.bfl.ai/openapi.json)
schema = 2
v2_only = true
type = "image"
name = "FLUX.2 [pro]"
description = "Production image generation and multi-reference editing model"
family = "flux"
open_weights = false
release_date = "2025-11-25"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp"]
output = ["image/jpeg", "image/png", "image/webp"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
