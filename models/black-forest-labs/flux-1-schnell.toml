# Model card (https://huggingface.co/black-forest-labs/FLUX.1-schnell, mirrored at
# https://build.nvidia.com/black-forest-labs/flux_1-schnell): 12B rectified-flow text-to-image model; release date
# "August 1, 2024" (NVIDIA card); Apache 2.0.
# Output stays generic `image`: the open weights produce pixels and the format is chosen by the host.
# No sampling temperature; prompts are not chat tokens, so context and output are 0.
schema = 2
type = "image"
name = "FLUX.1 [schnell]"
description = "Fast few-step FLUX.1 text-to-image model under Apache 2.0"
family = "flux"
open_weights = true
release_date = "2024-08-01"
license = "Apache 2.0"

[modalities]
input = ["text"]
output = ["image"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/black-forest-labs/FLUX.1-schnell"
