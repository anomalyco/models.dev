# Lab metadata carried over from providers/openrouter/models/rekaai/reka-edge.toml (curated catalogue data already in this repo),
# with provider-specific fields (cost, reasoning_options, status) stripped.
schema = 2
name = "Reka Edge"
description = "Multimodal model for analyzing text, images, documents, and rich media"
family = "reka"
open_weights = true
release_date = "2026-03-20"

[modalities]
input = ["image", "text", "video"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 16_384
output = 14_745
