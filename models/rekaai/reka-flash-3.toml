# Lab metadata carried over from providers/openrouter/models/rekaai/reka-flash-3.toml (curated catalogue data
#   already in this repo),
# with provider-specific fields (cost, reasoning_options, status) stripped.
# Sources:
# - Release 2025-03-10: https://reka.ai/news/introducing-reka-flash ("Reasoning with Reka Flash 3", Mar 10, 2025)
# - https://huggingface.co/RekaAI/reka-flash-3 (Apache-2.0 weights)
# Sampling: open weights, so temperature, top_p and top_k are runtime sampler settings on any host;
#   generation_config.json sets temperature 0.6, top_p 0.95, top_k 1024.
schema = 2
name = "Reka Flash 3"
description = "Efficient model for low-latency assistance, extraction, and routine automation"
family = "reka"
open_weights = true
knowledge = "2025-01-31"
release_date = "2025-03-10"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 65_536
output = 58_982
