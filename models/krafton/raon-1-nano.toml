# Sources (accessed 2026-11-18):
#   https://huggingface.co/KRAFTON/Raon-1-nano
# The model card states a dense model with 1.5B effective parameters (3.1B total, including a
# 1.5B per-layer embedding table) distilled from Raon-1 mini preview, a native context of
# 262,144 tokens, built-in thinking, tool calling, and the Apache-2.0 license. The Hugging Face
# repository was created on 2026-10-29; KRAFTON AI announced the model on 2026-11-11.
# The card states no output-token cap, so this file sets none.
schema = 2
name = "Raon-1 nano"
description = "KRAFTON AI's 1.5B-effective dense model, distilled from Raon-1 mini preview for Korean and English tool use on device"
open_weights = true
release_date = "2026-11-11"
license = "Apache-2.0"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 262_144

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/KRAFTON/Raon-1-nano"

[[benchmarks]]
