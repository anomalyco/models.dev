# Sources:
# https://developers.openai.com/api/docs/models/gpt-realtime
# https://developers.openai.com/api/docs/changelog
# Realtime audio MIME types: https://developers.openai.com/api/reference/resources/realtime (audio/pcm, audio/pcmu, audio/pcma)
schema = 2
v2_only = true
type = "realtime"
name = "GPT-Realtime"
description = "Realtime speech-to-speech model for low-latency voice agents over WebRTC, WebSocket, or SIP"
family = "gpt"
open_weights = false
knowledge = "2023-10-01"
release_date = "2025-08-28"

[modalities]
input = ["text", "audio/pcm", "audio/pcmu", "audio/pcma", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text", "audio/pcm", "audio/pcmu", "audio/pcma"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 32_000
output = 4_096
