# Sources:
# https://developers.openai.com/api/docs/models/gpt-realtime-2.1-mini
# https://developers.openai.com/api/docs/changelog
# Realtime audio MIME types: https://developers.openai.com/api/reference/resources/realtime (audio/pcm, audio/pcmu, audio/pcma)
schema = 2
v2_only = true
type = "realtime"
name = "GPT-Realtime-2.1 Mini"
description = "Distilled realtime reasoning model for faster, lower-cost voice interactions"
family = "gpt-mini"
open_weights = false
knowledge = "2024-09-30"
release_date = "2026-07-06"

[modalities]
input = ["text", "audio/pcm", "audio/pcmu", "audio/pcma", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text", "audio/pcm", "audio/pcmu", "audio/pcma"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = false
top_p = false
top_k = false

[limit]
context = 128_000
output = 32_000
