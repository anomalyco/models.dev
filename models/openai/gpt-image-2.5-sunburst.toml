# Image output MIME types: https://developers.openai.com/api/docs/guides/image-generation#output-format (output_format: png, jpeg, webp)
schema = 2
type = "image"
name = "GPT Image 2.5 Sunburst"
description = "Image model for prompt-driven generation, editing, and visual design workflows"
family = "gpt-image"
open_weights = false
release_date = "2026-09-08"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp"]
output = ["image/png", "image/jpeg", "image/webp"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
