# Limits: context from https://huggingface.co/openai/gpt-oss-safeguard-120b/blob/main/config.json (max_position_embeddings 131,072), the same as the 20B file.
# Output is the configured decoder-context ceiling, not a published hosted-API output maximum; prompt, reasoning and final output share the 131,072-token budget.
# No separate fixed output cap: https://huggingface.co/openai/gpt-oss-safeguard-120b/blob/main/generation_config.json
schema = 2
name = "GPT OSS Safeguard 120B"
description = "Safety model for policy screening, moderation, and risk-aware routing workflows"
family = "gpt-oss"
open_weights = true
release_date = "2025-10-29"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 131_072
output = 131_072

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/openai/gpt-oss-safeguard-120b"
