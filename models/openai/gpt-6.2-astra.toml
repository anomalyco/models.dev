# Sampling: not probed (no API access on 2026-11-18); the model page says reasoning effort "none" is rejected,
# so temperature and top_p stay false as on GPT-6.1 Sol and GPT-6 Astra.
# Spec: https://developers.openai.com/api/docs/models/gpt-6.2-astra
# Announcement: https://openai.com/index/introducing-gpt-6-2-astra-sol/
schema = 2
name = "GPT-6.2 Astra"
description = "OpenAI's frontier model for the hardest projects in coding, computer use, science, and professional work."
family = "gpt-astra"
open_weights = false
knowledge = "2026-05-18"
release_date = "2026-11-17"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = false
top_p = false
top_k = false

[limit]
context = 1_050_000
input = 922_000
output = 128_000
