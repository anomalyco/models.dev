# Sources:
# https://developers.openai.com/api/docs/models/whisper-1
# https://openai.com/index/introducing-chatgpt-and-whisper-apis/
# Audio MIME types: https://developers.openai.com/api/reference/resources/audio/subresources/transcriptions/methods/create (file: flac, mp3, mp4, mpeg, mpga, m4a, ogg, wav, webm)
schema = 2
v2_only = true
type = "transcription"
name = "Whisper"
description = "General-purpose speech recognition model for transcription and translation"
family = "whisper"
open_weights = false
release_date = "2023-03-01"

[modalities]
input = ["audio/flac", "audio/mpeg", "audio/mp4", "audio/ogg", "audio/wav", "audio/webm"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = true
top_p = false
top_k = false

[limit]
context = 0
output = 0
