# Native model details: 16,000-token context and 2,000 max output tokens.
# https://developers.openai.com/api/docs/models/gpt-realtime-whisper
# Realtime audio MIME types: https://developers.openai.com/api/reference/resources/realtime (audio/pcm, audio/pcmu, audio/pcma)
schema = 2
type = "transcription"
name = "GPT Realtime Whisper"
description = "Streaming speech-to-text model for low-latency transcript deltas from live audio"
family = "whisper"
open_weights = false
release_date = "2026-05-07"

[modalities]
input = ["audio/pcm", "audio/pcmu", "audio/pcma"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = false

[limit]
context = 16_000
output = 2_000
