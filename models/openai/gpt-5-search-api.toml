# Sources:
# https://developers.openai.com/api/docs/pricing (Search: gpt-5-search-api)
# No model page; probed on /v1/chat/completions (snapshot gpt-5-search-api-2025-10-14):
# 200,000-token context and 100,000 max completion tokens from API errors; tools,
# temperature, top_p and reasoning_effort are rejected; text-only input.
schema = 2
v2_only = true
type = "chat"
name = "GPT-5 Search API"
description = "GPT-5 model trained for web search in the Chat Completions API"
family = "gpt"
open_weights = false
release_date = "2025-10-14"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 200_000
output = 100_000
