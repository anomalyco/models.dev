# Sources (accessed 2026-09-15):
# https://developers.openai.com/api/docs/models/text-embedding-3-small
# https://developers.openai.com/api/docs/guides/embeddings (max input 8,192 tokens)
# limit.context = 8_192 follows that guide's "Max input" table (re-checked 2026-09-18);
# some existing provider rows still carry the older 8_191.
# limit.output = embedding dimension (1_536; shortenable via the dimensions parameter).
name = "text-embedding-3-small"
description = "Embedding model for semantic search, retrieval, clustering, and ranking pipelines"
family = "text-embedding"
release_date = "2024-01-25"
last_updated = "2024-01-25"
attachment = false
reasoning = false
temperature = false
tool_call = false
open_weights = false

[limit]
context = 8_192
output = 1_536

[modalities]
input = ["text"]
output = ["text"]
