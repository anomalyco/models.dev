# Sources:
# https://developers.openai.com/api/docs/models/gpt-transcribe
# https://developers.openai.com/api/docs/changelog
# Temperature: /v1/audio/transcriptions takes `temperature` (0-1); see CreateTranscriptionRequest in
# https://github.com/openai/openai-openapi/blob/manual_spec/openapi.yaml. Live API accepts it for gpt-transcribe (2026-10-19).
# Audio MIME types: https://developers.openai.com/api/reference/resources/audio/subresources/transcriptions/methods/create (file: flac, mp3, mp4, mpeg, mpga, m4a, ogg, wav, webm)
# Realtime audio MIME types: https://developers.openai.com/api/reference/resources/realtime (audio/pcm, audio/pcmu, audio/pcma)
schema = 2
v2_only = true
type = "transcription"
name = "GPT-Transcribe"
description = "High-accuracy speech-to-text model for audio files and committed Realtime turns"
family = "gpt"
open_weights = false
release_date = "2026-07-28"

[modalities]
input = ["text", "audio/flac", "audio/mpeg", "audio/mp4", "audio/ogg", "audio/wav", "audio/webm", "audio/pcm", "audio/pcmu", "audio/pcma"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = true
top_p = false
top_k = false

[limit]
context = 0
output = 0
