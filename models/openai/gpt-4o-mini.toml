schema = 2
name = "GPT-4o mini"
description = "Small omni GPT for cheap multimodal assistance and production-scale traffic"
family = "gpt-mini"
open_weights = false
knowledge = "2023-09"
release_date = "2024-07-18"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = false

[limit]
context = 128_000
output = 16_384

[[benchmarks]]
name = "Aider Polyglot"
score = 3.6
metric = "percent correct"
source = "https://aider.chat/docs/leaderboards/"
date = "2024-12-21"

[[benchmarks]]
name = "SciCode"
score = 22.9
metric = "percent correct"
source = "https://openrouter.ai/openai/gpt-4o-mini/benchmarks"
date = "2026-03-11"
