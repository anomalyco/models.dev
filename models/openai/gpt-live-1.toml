# Sources:
# https://developers.openai.com/api/docs/models/gpt-live-1
# https://developers.openai.com/api/docs/changelog
# Live audio MIME types: https://developers.openai.com/api/docs/guides/realtime-websocket (session.audio.format: audio/pcm, audio/pcmu, audio/pcma)
schema = 2
v2_only = true
type = "realtime"
name = "GPT-Live 1"
description = "Full-duplex voice model for natural conversations that delegates reasoning and tools to a backend agent"
family = "gpt"
open_weights = false
knowledge = "2025-07-31"
release_date = "2026-09-10"

[modalities]
input = ["text", "audio/pcm", "audio/pcmu", "audio/pcma"]
output = ["text", "audio/pcm", "audio/pcmu", "audio/pcma"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
