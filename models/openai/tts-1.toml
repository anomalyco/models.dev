# Sources:
# https://developers.openai.com/api/docs/models/tts-1
# https://openai.com/index/new-models-and-developer-products-announced-at-devday/
# Audio MIME types: https://developers.openai.com/api/reference/resources/audio/subresources/speech/methods/create (response_format: mp3, opus, aac, flac, wav, pcm)
schema = 2
v2_only = true
type = "speech"
name = "TTS-1"
description = "Text-to-speech model optimized for low latency"
open_weights = false
release_date = "2023-11-06"

[modalities]
input = ["text"]
output = ["audio/mpeg", "audio/opus", "audio/aac", "audio/flac", "audio/wav", "audio/pcm"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
