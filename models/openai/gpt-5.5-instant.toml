# OpenAI's chat-latest alias currently serves the Instant model with a 272K
# maximum input inside the 400K total context window.
# https://developers.openai.com/api/docs/models/chat-latest
name = "GPT-5.5 Instant"
description = "Compact GPT model for low-latency assistance and high-volume workloads"
release_date = "2026-05-05"
last_updated = "2026-05-28"
attachment = true
reasoning = true
temperature = true
tool_call = true
structured_output = true
knowledge = "2025-12-01"
open_weights = false

[limit]
context = 400_000
input = 272_000
output = 128_000

[modalities]
input = ["text", "image", "pdf"]
output = ["text"]
