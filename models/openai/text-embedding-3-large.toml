# Released 2024-01-25: https://openai.com/index/new-embedding-models-and-api-updates/
# https://developers.openai.com/api/docs/models/text-embedding-3-large
schema = 2
v2_only = true
type = "embedding"
name = "text-embedding-3-large"
description = "Most capable OpenAI embedding model for English and non-English text"
family = "text-embedding"
open_weights = false
release_date = "2024-01-25"

[modalities]
input = ["text"]
output = ["embedding"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 8_191
output = 0
