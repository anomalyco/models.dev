# Sources:
# https://developers.openai.com/api/docs/models/gpt-audio-mini
# https://developers.openai.com/api/docs/changelog
# Audio MIME types: https://developers.openai.com/api/reference/resources/chat/subresources/completions/methods/create (input_audio.format: wav, mp3; audio.format: wav, aac, mp3, flac, opus, pcm16)
schema = 2
v2_only = true
type = "chat"
name = "GPT-Audio Mini"
description = "Cost-efficient audio model for speech input and output with the Chat Completions API"
family = "gpt-mini"
open_weights = false
knowledge = "2023-10-01"
release_date = "2025-10-06"

[modalities]
input = ["text", "audio/wav", "audio/mpeg"]
output = ["text", "audio/wav", "audio/aac", "audio/mpeg", "audio/flac", "audio/opus", "audio/pcm"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = false

[limit]
context = 128_000
output = 16_384
