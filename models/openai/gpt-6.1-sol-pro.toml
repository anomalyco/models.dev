# GPT-6.1 Sol with Pro reasoning mode. Same underlying weights as gpt-6.1-sol.
# Sources: https://openrouter.ai/openai/gpt-6.1-sol-pro
schema = 2
name = "GPT-6.1 Sol Pro"
description = "GPT-6.1 Sol served with Pro reasoning for higher-quality responses on complex coding and professional work"
family = "gpt-sol"
open_weights = false
knowledge = "2026-04-30"
release_date = "2026-09-29"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = false
top_p = false
top_k = false

[limit]
context = 1_050_000
input = 922_000
output = 128_000
