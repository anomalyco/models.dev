# Sources:
# https://developers.openai.com/api/docs/models/gpt-live-1.1
# https://developers.openai.com/api/docs/changelog (Nov 19 2026: gpt-live-1.1 on v1/live/sessions)
# Knowledge cutoff isn't published for 1.1, so it's left out.
# Live audio MIME types: https://developers.openai.com/api/docs/guides/realtime-websocket (session.audio.format: audio/pcm, audio/pcmu, audio/pcma)
schema = 2
v2_only = true
type = "realtime"
name = "GPT-Live 1.1"
description = "Full-duplex voice model for multilingual conversations, with more accurate transcription and steadier accents than GPT-Live 1"
family = "gpt"
open_weights = false
release_date = "2026-11-19"

[modalities]
input = ["text", "audio/pcm", "audio/pcmu", "audio/pcma"]
output = ["text", "audio/pcm", "audio/pcmu", "audio/pcma"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
