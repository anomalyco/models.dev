# Sources:
# https://developers.openai.com/api/docs/models/gpt-live-transcribe
# https://developers.openai.com/api/docs/changelog
# Temperature: realtime-only (no /v1/audio/transcriptions); the realtime transcription config has no
# temperature field ("Unknown parameter: 'session.audio.input.transcription.temperature'", 2026-10-19).
# Realtime audio MIME types: https://developers.openai.com/api/reference/resources/realtime (audio/pcm, audio/pcmu, audio/pcma)
schema = 2
v2_only = true
type = "transcription"
name = "GPT-Live-Transcribe"
description = "Low-latency streaming speech-to-text model with keyword and language hints"
family = "gpt"
open_weights = false
release_date = "2026-07-28"

[modalities]
input = ["text", "audio/pcm", "audio/pcmu", "audio/pcma"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
