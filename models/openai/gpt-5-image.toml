# Lab metadata carried over from providers/openrouter/models/openai/gpt-5-image.toml (curated catalogue data already in this repo),
# with provider-specific fields (cost, reasoning_options, status) stripped.
# Image output MIME types: https://developers.openai.com/api/docs/guides/tools-image-generation (GPT Image tool output_format: png, jpeg, webp)
schema = 2
type = "image"
name = "GPT-5 Image"
description = "Image model for prompt-driven generation, editing, and visual design workflows"
family = "gpt"
open_weights = false
knowledge = "2024-10-01"
release_date = "2025-10-14"

[modalities]
input = ["image/jpeg", "image/png", "image/gif", "image/webp", "text", "application/pdf"]
output = ["image/png", "image/jpeg", "image/webp", "text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = false

[limit]
context = 400_000
output = 128_000
