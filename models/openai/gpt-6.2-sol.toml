# Sources: https://developers.openai.com/api/docs/models/gpt-6.2-sol (limits, modalities, knowledge cutoff), https://openai.com/index/introducing-gpt-6-2-astra-sol/ (launch 2026-11-17).
# Sampling: live 2026-11-17: effort none is rejected (400) and any temperature other than 1 (or top_p other than 1) returns 400
# "Unsupported parameter: temperature", so temperature and top_p stay false.
schema = 2
name = "GPT-6.2 Sol"
description = "An efficient reasoning model for everyday work, multistep agentic workflows, and coding."
family = "gpt-sol"
open_weights = false
knowledge = "2026-06-01"
release_date = "2026-11-17"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = false
top_p = false
top_k = false

[limit]
context = 1_050_000
input = 922_000
output = 128_000

[[benchmarks]]
name = "AA-3D"
score = 1259
metric = "Elo"
source = "https://openai.com/index/introducing-gpt-6-2-astra-sol/"
date = "2026-11-17"
