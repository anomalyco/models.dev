# OpenAI GPT-4o mini with built-in web search (search-preview variant).
# Sources: https://platform.openai.com/docs/models/gpt-4o-mini-search-preview
schema = 2
name = "GPT-4o mini Search Preview"
description = "GPT-4o mini variant with built-in web search for up-to-date answers"
family = "gpt-mini"
open_weights = false
knowledge = "2024-07-18"
release_date = "2025-03-11"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = false

[limit]
context = 128_000
output = 16_384
