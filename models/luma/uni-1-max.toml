# Token limits are unspecified (0); each serving host supplies its own limits.
# https://lumalabs.ai/legal/training-content-summary-uni
# Luma records May 21, 2026 as the Uni-1 Max placement date.
# Limits that the lab does not publish are left to each serving host.
schema = 2
v2_only = true
type = "image"
name = "Uni-1 Max"
description = "Higher-quality Uni image generation and editing model from Luma"
open_weights = false
release_date = "2026-05-21"

[modalities]
input = ["text", "image"]
output = ["image"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
