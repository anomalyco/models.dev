# Lab metadata for OpenUncensored's own uncensored build of Inkling 2 Small (OpenUncensored made these weights).
# Source: https://huggingface.co/OpenUncensored/Inkling-2-Small-Uncensored (accessed 2026-11-24): Apache-2.0, uploaded
#   2026-11-13, base model thinkingmachines/Inkling-2-Small-MXFP8, refusal direction removed from the weights.
# Architecture, modalities, capabilities and limits are unchanged from the base model's lab,
#   models/thinkingmachines/inkling-2-small.toml.
# Sampling: open weights, so temperature, top_p and top_k are runtime sampler settings on any host.
schema = 2
name = "Inkling 2 Small Uncensored"
description = "OpenUncensored's uncensored build of Inkling 2 Small, a multimodal MoE reasoning model (594B total, 17B active) for agentic coding, vision, and knowledge work"
family = "inkling-small"
open_weights = true
release_date = "2026-11-13"
license = "Apache-2.0"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_048_576
output = 131_072

[[weights]]
label = "Hugging Face (MXFP8)"
url = "https://huggingface.co/OpenUncensored/Inkling-2-Small-Uncensored"
quantization = "mxfp8"
