# Image formats: https://docs.mistral.ai/studio/conversations/vision (PNG, JPEG, WEBP, non-animated GIF)
schema = 2
name = "Mistral Small 3.1 24B"
description = "Efficient multimodal model for instruction following, coding, reasoning, and function calling"
family = "mistral-small"
open_weights = true
knowledge = "2024-06"
release_date = "2025-03-17"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 128_000
output = 16_384

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/mistralai/Mistral-Small-3.1-24B-Instruct-2503"
