# Lab metadata carried over from providers/openrouter/models/mistralai/mistral-large.toml (curated catalogue data already in this repo),
# with provider-specific fields (cost, reasoning_options, status) stripped.
schema = 2
name = "Mistral Large"
description = "Flagship Mistral model for advanced reasoning, coding, and multilingual work"
family = "mistral-large"
open_weights = false
knowledge = "2024-11-30"
release_date = "2024-02-26"

[modalities]
input = ["text", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 128_000
output = 102_400
