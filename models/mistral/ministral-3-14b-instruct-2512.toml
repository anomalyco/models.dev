# Sources (accessed 2026-09-11):
# https://huggingface.co/mistralai/Ministral-3-14B-Instruct-2512 (Apache 2.0, public safetensors)
# https://mistral.ai/news/mistral-3
# limit.output 262_144: the HF card states a 256k (= 262,144) context window, its vLLM
# section defaults --max-model-len to 262144, and its own examples request
# max_tokens = 262144; Mistral publishes no separate generation cap. Current-gen Mistral
# flagships in this catalog (mistral-large-2512, mistral-medium-2604, devstral-2512) set
# the same output = 262_144.

name = "Ministral 3 14B Instruct"
description = "Efficient Mistral edge model balancing speed and cost for general-purpose tasks"
family = "ministral"
release_date = "2025-12-02"
last_updated = "2025-12-02"
attachment = true
reasoning = false
temperature = true
tool_call = true
structured_output = true
open_weights = true
license = "Apache 2.0"

[limit]
context = 262_144
output = 262_144

[modalities]
input = ["text", "image"]
output = ["text"]

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/mistralai/Ministral-3-14B-Instruct-2512"
