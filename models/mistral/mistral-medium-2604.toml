# Same model as models/mistral/mistral-medium-3-5.toml: https://docs.mistral.ai/models/mistral-medium-3-5 (released 2026-04-28,
#   Modified MIT weights).
# No PDF input: PDF is a Mistral API feature (Document QnA, https://docs.mistral.ai/studio/document-processing/document_qna),
#   not a property of the open weights. The hosts using this file (greenpt, scaleway, evroc, sap-ai-core, lowrouter, edenai's
#   mistral-medium-2604) serve the weights or list text and image input only.
# Image formats: https://docs.mistral.ai/studio/conversations/vision (PNG, JPEG, WEBP, non-animated GIF)
# Sampling: temperature and top_p only; Mistral's chat API has no top_k (https://docs.mistral.ai/api/endpoint/chat; 400 "top_k sampling is not enabled for this model", 2026-10-19)
schema = 2
name = "Mistral Medium 3.5"
description = "Balanced Mistral model for enterprise assistants, multilingual work, and tools"
family = "mistral-medium"
open_weights = true
release_date = "2026-04-28"
license = "Modified MIT"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = false

[limit]
context = 262_144
output = 262_144

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/mistralai/Mistral-Medium-3.5-128B"

[[benchmarks]]
name = "SWE-Bench Verified"
score = 77.6
metric = "resolved"
source = "https://huggingface.co/mistralai/Mistral-Medium-3.5-128B"

[[benchmarks]]
name = "τ³-Telecom"
score = 91.4
metric = "accuracy"
variant = "public preview"
source = "https://mistral.ai/news/vibe-remote-agents-mistral-medium-3-5/"
date = "2026-05-22"
