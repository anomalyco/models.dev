# Sources: https://docs.mistral.ai/models/codestral-25-08 (128k context, $0.3/$0.9 pricing, July 30 2025, FIM/code generation)
# https://docs.mistral.ai/inference/pricing (Codestral $0.3 input, $0.03 cached, $0.9 output)
# https://mistral.ai/news/codestral-25-08 (Codestral 25.08 announcement July 30 2025)
# https://docs.mistral.ai/resources/known-limitations (Codestral 128k max context)
# Fallback for max output: https://opper.ai/mistral/codestral-2508 (Mistral-route 8K max output, text in/out)
schema = 2
name = "Codestral 25.08"
description = "Mistral code model for low-latency completion, fill-in-the-middle, and code generation"
family = "codestral"
open_weights = false
release_date = "2025-07-30"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 128_000
output = 8_192
