# Released 2026-03-23 (API IDs voxtral-mini-tts-2603, voxtral-mini-tts-latest): https://docs.mistral.ai/models/voxtral-tts-26-03
# Output formats (response_format pcm, wav, mp3, flac, opus): https://docs.mistral.ai/studio/audio/text_to_speech/speech
# Weights (CC BY-NC 4.0): https://huggingface.co/mistralai/Voxtral-4B-TTS-2603
schema = 2
v2_only = true
type = "speech"
name = "Voxtral Mini TTS"
description = "Multilingual text-to-speech model with zero-shot voice cloning"
family = "voxtral"
open_weights = true
release_date = "2026-03-23"
license = "CC-BY-NC-4.0"

[modalities]
input = ["text"]
output = ["audio/pcm", "audio/wav", "audio/mpeg", "audio/flac", "audio/opus"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/mistralai/Voxtral-4B-TTS-2603"
