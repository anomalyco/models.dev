# Sources:
#   https://docs.mistral.ai/models/ocr-3-25-12 (OCR 3, API ID mistral-ocr-2512; released 2025-12-18; image and document
#     input, text and image output; $2 per 1,000 pages, $3 per 1,000 annotated pages)
#   https://docs.mistral.ai/studio/document-processing/basic_ocr (POST /v1/ocr; files up to 50 MB and 1,000 pages).
#     Its FAQ lists formats by extension; these are their registered MIME types. Also accepted but not listed, because
#     the v1 translation has no modality for other application/* types or they have no registered MIME type: Word
#     (.docx, .doc), PowerPoint (.pptx, .ppt), Excel (.xlsx), EPUB, RTF, ODT, .bib, .fb2, .ipynb, .tex and .opml.
#   GET https://api.mistral.ai/v1/models (live 2026-11-09): max_context_length 16384 for this model and its aliases.
#     The 1,000-page file limit above is limit.pdf.max_pages; output stays 0 because no output token limit is published.
#   Extracted images come back as JPEG: every OCR response example shows data:image/jpeg;base64 / img-N.jpeg, and live
#   2026-10-19 both OCR models returned data:image/jpeg for an arXiv PDF page.
schema = 2
v2_only = true
name = "Mistral OCR 3"
description = "Document OCR model that extracts interleaved text and images from documents"
open_weights = false
release_date = "2025-12-18"

[modalities]
input = ["image/jpeg", "image/png", "image/avif", "image/tiff", "image/gif", "image/heic", "image/heif", "image/bmp", "image/webp", "application/pdf", "text/csv", "text/plain", "text/xml", "text/troff"]
output = ["text", "image/jpeg"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 16_384
output = 0
pdf = { max_pages = 1_000 }
