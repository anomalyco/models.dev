# https://mistral.ai/news/mistral-3
# Image formats: https://docs.mistral.ai/studio/conversations/vision (PNG, JPEG, WEBP, non-animated GIF)
# Knowledge: Mistral's published system prompt says "Your knowledge base was last updated on 2023-10-01"
#   (https://huggingface.co/mistralai/Mistral-Large-3-675B-Instruct-2512/blob/main/SYSTEM_PROMPT.txt).
schema = 2
name = "Mistral Large 3"
description = "Mistral's largest general model for enterprise agents, coding, and multilingual reasoning"
family = "mistral-large"
open_weights = true
knowledge = "2023-10"
release_date = "2025-12-02"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 262_144
output = 262_144

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/mistralai/Mistral-Large-3-675B-Instruct-2512"

[[benchmarks]]
name = "Artificial Analysis Coding Index"
score = 22.7
metric = "index"
source = "https://openrouter.ai/mistralai/mistral-large-2512/benchmarks"
date = "2026-06-04"

[[benchmarks]]
name = "SciCode"
score = 36.2
metric = "percent correct"
source = "https://openrouter.ai/mistralai/mistral-large-2512/benchmarks"
date = "2026-06-04"

[[benchmarks]]
name = "Terminal-Bench Hard"
score = 15.9
metric = "success rate"
source = "https://openrouter.ai/mistralai/mistral-large-2512/benchmarks"
date = "2026-06-04"
