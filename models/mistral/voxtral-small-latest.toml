# Sources (accessed 2026-08-16):
#   https://docs.mistral.ai/models/model-cards/voxtral-small-25-07
#   https://mistral.ai/news/voxtral/
# Field values mirror Mistral's own first-party host entry in this repo
# (providers/mistral/models/voxtral-small-latest.toml); host-scoped keys
# (cost, status) are intentionally left to the provider files.
schema = 2
name = "Voxtral Small (latest)"
description = "Instruct model with native audio input for speech understanding and tool use"
family = "voxtral"
open_weights = true
release_date = "2025-07-15"

[modalities]
input = ["text", "audio"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 32_000
output = 32_000
