# Lab metadata carried over from providers/openrouter/models/mistralai/mistral-medium-3.1.toml (curated catalogue data already in this repo),
# with provider-specific fields (cost, reasoning_options, status) stripped.
# Image formats: https://docs.mistral.ai/studio/conversations/vision (PNG, JPEG, WEBP, non-animated GIF)
# Sampling: temperature and top_p only; Mistral's chat API has no top_k (https://docs.mistral.ai/api/endpoint/chat; 400 "top_k sampling is not enabled for this model", 2026-10-19)
# Release date: https://docs.mistral.ai/models/mistral-medium-3-1-25-08 (2025-08-12)
schema = 2
name = "Mistral Medium 3.1"
description = "Mistral model for multilingual chat, reasoning, and tool-assisted workflows"
family = "mistral-medium"
open_weights = false
knowledge = "2025-06-30"
release_date = "2025-08-12"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = false

[limit]
context = 131_072
output = 104_857
