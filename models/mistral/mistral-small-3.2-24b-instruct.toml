# Lab metadata carried over from providers/openrouter/models/mistralai/mistral-small-3.2-24b-instruct.toml (curated catalogue data already in this repo),
# with provider-specific fields (cost, reasoning_options, status) stripped.
schema = 2
name = "Mistral Small 3.2 24B"
description = "Efficient Mistral model for fast chat, extraction, and production assistants"
family = "mistral-small"
open_weights = true
knowledge = "2023-10-31"
release_date = "2025-06-20"

[modalities]
input = ["image", "text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 256_000
output = 16_384
