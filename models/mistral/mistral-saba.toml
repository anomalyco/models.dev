# Lab metadata carried over from providers/openrouter/models/mistralai/mistral-saba.toml (curated catalogue data already in this repo),
# with provider-specific fields (cost, reasoning_options, status) stripped.
# Sampling: temperature and top_p only; Mistral's chat API has no top_k (https://docs.mistral.ai/api/endpoint/chat; 400 "top_k sampling is not enabled for this model", 2026-10-19)
schema = 2
name = "Saba"
description = "Mistral model for multilingual chat, reasoning, and tool-assisted workflows"
family = "mistral"
open_weights = false
knowledge = "2024-09-30"
release_date = "2025-02-17"

[modalities]
input = ["text", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = false

[limit]
context = 32_768
output = 26_214
