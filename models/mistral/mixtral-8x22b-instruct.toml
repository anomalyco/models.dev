# Lab metadata carried over from providers/openrouter/models/mistralai/mixtral-8x22b-instruct.toml (curated catalogue data already in this repo),
# with provider-specific fields (cost, reasoning_options, status) stripped.
schema = 2
name = "Mixtral 8x22B Instruct"
description = "Mistral model for multilingual chat, reasoning, and tool-assisted workflows"
family = "mistral"
open_weights = true
