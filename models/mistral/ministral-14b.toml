# Sources:
# https://mistral.ai/news/mistral-3/
# https://huggingface.co/mistralai/Ministral-3-14B-Instruct-2512
schema = 2
name = "Ministral 14B"
description = "Compact multimodal Mistral model for local assistants, edge agents, and efficient tool use"
family = "ministral"
open_weights = true
release_date = "2025-12-02"
license = "Apache-2.0"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 262_144
output = 262_144

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/mistralai/Ministral-3-14B-Instruct-2512"
