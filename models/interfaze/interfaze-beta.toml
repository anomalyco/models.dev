# Attachment follows the image/PDF modalities. The conservative tool_call=false
# default mirrors the same-ID Vercel peer; MiniRouter's verified tool surface is
# documented as a provider-specific override. Sources accessed 2026-08-22.
name = "Interfaze Beta"
description = "Interfaze is an AI model built on a new architecture that merges specialized DNN/CNN models with LLMs for developer tasks that require deterministic output and high consistency like OCR, scraping, classification, STT and more."
release_date = "2025-10-07"
last_updated = "2025-10-07"
attachment = true
reasoning = true
temperature = true
tool_call = false
open_weights = false

[limit]
context = 1_000_000
output = 32_000

[modalities]
input = ["text", "image", "pdf"]
output = ["text"]
