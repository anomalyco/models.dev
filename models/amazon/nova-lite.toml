# Sources: https://docs.aws.amazon.com/nova/latest/userguide/what-is-nova.html
# https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-amazon-nova-lite.html
# Launch: https://aws.amazon.com/blogs/aws/introducing-amazon-nova-frontier-intelligence-and-industry-leading-price-performance/
# PDF document input is supported through Bedrock Converse.
# Output: the Nova V1 guide's 10K is confirmed by US Bedrock Converse boundary checks (2026-09-09).
# Formats: https://docs.aws.amazon.com/nova/latest/userguide/modalities.html (images PNG, JPG, JPEG, GIF, WebP;
#   video MP4, MOV, MKV, WebM, FLV, MPEG, MPG, WMV, 3GP; media documents PDF, DOCX), as MIME types
# Sampling: temperature, topP and topK are inferenceConfig fields:
#   https://docs.aws.amazon.com/nova/latest/userguide/complete-request-schema.html
schema = 2
name = "Nova Lite"
description = "Efficient model for low-latency assistance, extraction, and routine automation"
family = "nova-lite"
open_weights = false
knowledge = "2024-10"
release_date = "2024-12-03"

[modalities]
input = [
  "text",
  "image/png",
  "image/jpeg",
  "image/gif",
  "image/webp",
  "video/mp4",
  "video/quicktime",
  "video/x-matroska",
  "video/webm",
  "video/x-flv",
  "video/mpeg",
  "video/x-ms-wmv",
  "video/3gpp",
  "application/pdf",
]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 300_000
output = 10_000
