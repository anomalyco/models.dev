# Lab metadata carried over from providers/openrouter/models/amazon/nova-micro-v1.toml (curated catalogue data already in this repo),
# with provider-specific fields (cost, reasoning_options, status) stripped.
schema = 2
name = "Nova Micro 1.0"
description = "Efficient model for low-latency assistance, extraction, and routine automation"
family = "nova-micro"
open_weights = false
knowledge = "2024-10-31"
release_date = "2024-12-05"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 128_000
output = 5_120
