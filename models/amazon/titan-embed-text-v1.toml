# Sources:
# - https://docs.aws.amazon.com/bedrock/latest/userguide/titan-embedding-models.html
#   (Titan Embeddings G1 - Text accepts up to 8,192 tokens; takes only inputText, no parameters;
#   1,536-dimension output, confirmed live 2026-11-08)
# - Release: generally available with Amazon Bedrock on 2023-09-28
#   (https://aws.amazon.com/about-aws/whats-new/2023/09/amazon-bedrock-generally-available/)
schema = 2
v2_only = true
type = "embedding"
name = "Titan Embeddings G1 - Text"
description = "First-generation Titan text embedding model producing 1,536-dimensional vectors"
family = "titan-embed"
open_weights = false
release_date = "2023-09-28"

[modalities]
input = ["text"]
output = ["embedding"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 8_192
output = 0
