# Lab metadata carried over from providers/openrouter/models/amazon/nova-pro-v1.toml (curated catalogue data already in this repo),
# with provider-specific fields (cost, reasoning_options, status) stripped.
schema = 2
name = "Nova Pro 1.0"
description = "Flagship model for demanding analysis, coding, and production agent workflows"
family = "nova-pro"
open_weights = false
knowledge = "2024-10-31"
release_date = "2024-12-05"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 300_000
output = 5_120
