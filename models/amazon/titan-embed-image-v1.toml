# Sources:
# - Model card (launch Nov 29, 2023; text and image in, embedding out): https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-amazon-titan-multimodal-embeddings-g1.html
# - Max input 256 text tokens; images up to 25 MB and 2048x2048; output 1,024 (default), 384 or 256 dimensions:
#   https://docs.aws.amazon.com/bedrock/latest/userguide/titan-multiemb-models.html (image formats listed there: PNG, JPEG)
# - Request fields (inputText, inputImage, embeddingConfig; no sampling): https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-titan-embed-mm.html
schema = 2
v2_only = true
type = "embedding"
name = "Titan Multimodal Embeddings G1"
description = "Amazon embedding model that maps text, images or both into one vector space for multimodal search"
family = "titan-embed"
open_weights = false
release_date = "2023-11-29"

[modalities]
input = ["text", "image/png", "image/jpeg"]
output = ["embedding"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 256
output = 1_024
