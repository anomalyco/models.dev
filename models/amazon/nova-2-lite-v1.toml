# Lab metadata carried over from providers/openrouter/models/amazon/nova-2-lite-v1.toml (curated catalogue data already in this repo),
# with provider-specific fields (cost, reasoning_options, status) stripped.
# Knowledge cutoff (Oct 2025): https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-amazon-nova-2-lite.html
# Formats: https://docs.aws.amazon.com/nova/latest/nova2-userguide/using-multimodal-models.html (images PNG, JPEG,
#   GIF, WebP; video MP4, MOV, MKV, WebM, FLV, MPEG, MPG, WMV, 3GP; documents include PDF), as MIME types
# Sampling: temperature, topP and topK are accepted (not together with maxReasoningEffort):
#   https://docs.aws.amazon.com/nova/latest/nova2-userguide/using-converse-api.html
schema = 2
name = "Nova 2 Lite"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"
family = "nova"
open_weights = false
knowledge = "2025-10"
release_date = "2025-12-02"

[modalities]
input = [
  "text",
  "image/png",
  "image/jpeg",
  "image/gif",
  "image/webp",
  "video/mp4",
  "video/quicktime",
  "video/x-matroska",
  "video/webm",
  "video/x-flv",
  "video/mpeg",
  "video/x-ms-wmv",
  "video/3gpp",
  "application/pdf",
]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_000_000
output = 65_535
