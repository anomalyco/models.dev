# Sources:
# - https://docs.aws.amazon.com/bedrock/latest/userguide/titan-embedding-models.html
#   (8,192 tokens or 50,000 characters; 1,024 (default), 512 or 256 dimensions; English plus 100+ languages)
# - Release: Bedrock ListFoundationModels startOfLifeTime 2024-04-30; GA announcement
#   https://aws.amazon.com/about-aws/whats-new/2024/04/amazon-titan-text-embeddings-v2-amazon-bedrock/
schema = 2
v2_only = true
type = "embedding"
name = "Titan Text Embeddings V2"
description = "Text embedding model for retrieval, semantic similarity, and clustering with selectable output dimensions"
family = "titan-embed"
open_weights = false
release_date = "2024-04-30"

[modalities]
input = ["text"]
output = ["embedding"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 8_192
output = 0
