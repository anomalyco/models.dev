# Sources:
# - Model card (launch Apr 30, 2024; text in, embedding out): https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-amazon-titan-text-embeddings-v2.html
# - Max input 8,192 tokens or 50,000 characters; output 1,024 (default), 512 or 256 dimensions: https://docs.aws.amazon.com/bedrock/latest/userguide/titan-embedding-models.html
# - Request fields (inputText, dimensions, normalize, embeddingTypes; no sampling): https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-titan-embed-text.html
schema = 2
v2_only = true
type = "embedding"
name = "Titan Text Embeddings V2"
description = "Amazon's second-generation text embedding model with selectable output dimensions"
family = "titan-embed"
open_weights = false
release_date = "2024-04-30"

[modalities]
input = ["text"]
output = ["embedding"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 8_192
output = 1_024
