# Sources:
# - https://www.respan.ai/docs/documentation/span-01/concept
# - https://www.respan.ai/blog/introducing-span-1
# The context maximum is unpublished; 0 preserves the existing catalog's unknown limit.
# Scores are read in one forward pass, with no generated output or thinking controls.
schema = 2
type = "decision"
name = "Span-01"
description = "Behavior classifier for agent traces that applies plain-language definitions and returns present, absent, and not-observable probabilities in one forward pass"
open_weights = false
release_date = "2026-09-24"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0

[[links]]
type = "docs"
url = "https://www.respan.ai/docs/documentation/span-01/concept"

[[links]]
type = "announcement"
url = "https://www.respan.ai/blog/introducing-span-1"
