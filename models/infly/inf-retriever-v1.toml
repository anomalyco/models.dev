# Generated from EUrouter's public catalog, GET https://api.eurouter.ai/v1/models, model "inf-retriever-v1".
# Fix a wrong value in the catalog or in the generator (apps/core/scripts/modelsdev-generate.ts in the EUrouter repository), never in this file.
# models.dev has no lab entry for this model, so this one comes from the catalog fields name, description, release_date,
#   knowledge_cutoff, license, open_weights, architecture, supported_parameters, context_length,
#   top_provider.max_completion_tokens and hugging_face_id (https://huggingface.co/infly/inf-retriever-v1).
schema = 2
v2_only = true
type = "embedding"
name = "INF Retriever v1"
description = "INF Retriever v1 is INF Tech's LLM-based dense retrieval embedding model, optimized for English and Chinese retrieval."
open_weights = true
release_date = "2024-12-23"
license = "Apache-2.0"

[modalities]
input = ["text"]
output = ["embedding"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 32_768
output = 0

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/infly/inf-retriever-v1"
