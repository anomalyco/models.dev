# Sampling: open weights; generation_config.json sets temperature and top_p, and the model card samples with
#   top_k=20 (https://huggingface.co/poolside/Laguna-XS-2.1).
schema = 2
name = "Laguna XS 2.1"
description = "Agentic coding model from Poolside in the XS size class for local deployment"
family = "laguna"
open_weights = true
release_date = "2026-07-02"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 262_144
output = 32_768

[[benchmarks]]
name = "SWE-Bench Verified"
score = 70.9
metric = "resolved"
harness = "Harbor"
source = "https://poolside.ai/blog/introducing-laguna-xs-2-1"
date = "2026-07-02"

[[benchmarks]]
name = "SWE-Bench Multilingual"
score = 63.1
metric = "resolve rate"
harness = "Harbor"
source = "https://poolside.ai/blog/introducing-laguna-xs-2-1"
date = "2026-07-02"

[[benchmarks]]
name = "SWE-Bench Pro"
score = 47.6
metric = "resolve rate"
harness = "Harbor"
source = "https://poolside.ai/blog/introducing-laguna-xs-2-1"
date = "2026-07-02"

[[benchmarks]]
name = "Terminal-Bench"
score = 37.5
metric = "success rate"
harness = "Harbor"
version = "2.0"
source = "https://poolside.ai/blog/introducing-laguna-xs-2-1"
date = "2026-07-02"
