# Lab file for humans& Ampersand v0.1. Sources: https://ampersand.humansand.ai/docs (model card).
schema = 2
name = "Ampersand v0.1"
description = "humans& agent model served through a server-held Agents API session; tuned for long-running, tool-heavy work"
open_weights = false
# Release date from the launch announcement (x.com/humansand, 2026-10-20). Knowledge cutoff not published.
release_date = "2026-10-20"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = false
top_p = false
top_k = false

[limit]
context = 1_000_000
output = 32_768
