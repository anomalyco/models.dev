# Lab file for humans& Ampersand v0.1 (humans&, https://ampersand.humansand.ai/blog/: post-trained from GLM 5.3).
# Sources, by field:
# - limit.context: https://ampersand.humansand.ai/docs/GUIDES.html "Input limits": "Full model input with High
#   effort 241,664 tokens", "Full model input with Max effort 225,280 tokens". Plus the per-call output limit
#   (16,384 high / 32,768 max) both give a 258,048-token model context.
# - limit.output: https://ampersand.humansand.ai/docs/API_REFERENCE.html: "The Ampersand presets use high with up to
#   16,384 generated tokens per model call by default, or max with up to 32,768. These limits include reasoning and
#   the answer".
# - tools/reasoning: same API reference (agent.tools, agent.reasoning.effort = "high" | "max").
# - temperature/top_p/top_k: not accepted by the Agents API (no sampling fields on agent or session).
# - release_date: launch announcement, x.com/humansand, 2026-10-20. Knowledge cutoff is not published.
schema = 2
name = "Ampersand v0.1"
description = "humans& agent model served through a server-held Agents API session; tuned for long-running, tool-heavy work"
open_weights = false
release_date = "2026-10-20"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = false
top_p = false
top_k = false

[limit]
context = 258_048
output = 32_768
