# Output limit: max_completion_tokens defaults to 131072 and "can be set up to 1048576" for the K3-series models, listed as kimi-k3.1-pro, kimi-k3.1-pro-highspeed and kimi-k3 (https://platform.kimi.ai/docs/api/chat, accessed 2026-11-13). The limit is the maximum, not the default.
# Sources:
# - Release and availability (2026-10-23): https://www.kimi.com/en/blog/kimi-k3-1-pro
# - API guide: https://platform.kimi.ai/docs/guide/kimi-k3-1-pro-quickstart
# - Open weights: https://huggingface.co/moonshotai/Kimi-K3.1-Pro
# - Input formats: https://platform.kimi.ai/docs/guide/use-kimi-vision-model#supported-image-and-video-formats
# Highspeed: the same Kimi K3.1 Pro model served at 2-3x the output speed, under its own API id kimi-k3.1-pro-highspeed
#   (https://platform.kimi.ai/docs/guide/kimi-k3-1-pro-quickstart; https://developers.cloudflare.com/ai/models/moonshotai/kimi-k3.1-pro-highspeed/),
#   so everything but the name and description matches models/moonshotai/kimi-k3.1-pro.toml, like kimi-k2.7-code-highspeed.
# Sampling is fixed at temperature=1.0 and top_p=0.95; top_k is not documented.
schema = 2
name = "Kimi K3.1 Pro Highspeed"
description = "Faster-serving Kimi K3.1 Pro with a 1M-token context window and always-on reasoning"
family = "kimi-pro"
open_weights = true
release_date = "2026-10-23"

[modalities]
input = [
  "text",
  "image/jpeg",
  "image/png",
  "image/gif",
  "image/webp",
  "image/bmp",
  "image/heic",
  "image/heif",
  "video/mp4",
  "video/mpeg",
  "video/mov",
  "video/avi",
  "video/x-flv",
  "video/mpg",
  "video/webm",
  "video/wmv",
  "video/3gpp",
]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = false
top_p = false
top_k = false

[limit]
context = 1_048_576
output = 1_048_576

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/moonshotai/Kimi-K3.1-Pro"
