# Sources:
# - Release: https://www.kimi.com/blog/kimi-k3, https://platform.kimi.ai/docs/guide/kimi-k3-quickstart
# - 1M context, max_completion_tokens default 131072: https://platform.kimi.ai/docs/api/chat
# - Input formats: https://platform.kimi.ai/docs/guide/use-kimi-vision-model#supported-image-and-video-formats lists them
#   literally as MIME types ("Images support the following formats (MIME types): image/jpeg, image/png, image/gif,
#   image/webp, image/bmp, image/heic, image/heif"; "Videos support the following formats (MIME types): video/mp4,
#   video/mpeg, video/mov, video/avi, video/x-flv, video/mpg, video/webm, video/wmv, video/3gpp"), so the strings are kept
#   as written, the same as the Gemini lab files.
# Sampling: Moonshot fixes temperature (1.0) and top_p (0.95) for this model and documents no top_k
# (https://platform.kimi.ai/docs/api/models-overview); the lab keeps all three off.
schema = 2
name = "Kimi K3"
description = "Multimodal Kimi model with 1M context and toggleable max-effort thinking for long-horizon agent work"
family = "kimi-k3"
open_weights = true
release_date = "2026-07-16"

[modalities]
input = [
  "text",
  "image/jpeg",
  "image/png",
  "image/gif",
  "image/webp",
  "image/bmp",
  "image/heic",
  "image/heif",
  "video/mp4",
  "video/mpeg",
  "video/mov",
  "video/avi",
  "video/x-flv",
  "video/mpg",
  "video/webm",
  "video/wmv",
  "video/3gpp",
]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = false
top_p = false
top_k = false

[limit]
context = 1_048_576
output = 131_072

[[benchmarks]]
name = "DeepSWE"
score = 67.5
metric = "resolve rate"
variant = "max effort"
harness = "Kimi Code"
version = "1.1"
source = "https://www.kimi.com/blog/kimi-k3"
date = "2026-07-16"

