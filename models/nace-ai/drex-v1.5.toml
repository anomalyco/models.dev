# Sources:
# - https://huggingface.co/nace-ai/drex-v1.5
# - https://drex.nace.ai/docs/reference/models
# - https://drex.nace.ai/docs/reference/limits
# - https://drex.nace.ai/models (price: $0.00000005 per input token, output unbilled)
# The 139,264-token context is the maximum published by the Drex catalog feed;
# the state may be up to 131,072 tokens, and the limit applies to the state
# plus the longest single question (questions are read one at a time).
schema = 2
type = "decision"
name = "Drex 1.5"
description = "System One decision model for typed, calibrated probabilistic answers over text or structured state"
open_weights = true
release_date = "2026-09-28"
license = "Nace.AI Open RAIL-M"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 139_264
output = 0

[[links]]
label = "Documentation"
url = "https://drex.nace.ai/docs"
type = "docs"

[[links]]
label = "License"
url = "https://huggingface.co/nace-ai/drex-v1.5/blob/main/LICENSE"
type = "license"

[[weights]]
url = "https://huggingface.co/nace-ai/drex-v1.5"
format = "safetensors"
