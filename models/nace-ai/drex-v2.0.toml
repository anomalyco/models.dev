# Sources:
# - https://huggingface.co/nace-ai/drex-v2.0
# - https://github.com/nace-ai/drex-decision-models/blob/main/docs/context-length.md
# - https://console.nace.ai/docs/drex/reference/models
# Context is the model's maximum state-plus-one-question length, not the
# first-party API's smaller Drex 2.0 limit before fallback to Drex 1.5.
# Output: decision probabilities, not generated text. Sampling: no tokens are sampled, so the
#   generation_config.json temperature/top_p/top_k values have no effect (https://huggingface.co/nace-ai/drex-v2.0).
schema = 2
type = "decision"
name = "Drex 2.0"
description = "35B mixture-of-experts System One decision model with 3B active parameters, returning typed, calibrated probabilities over text or structured state without generating text"
open_weights = true
release_date = "2026-10-06"
last_updated = "2026-10-12"
license = "Nace.AI Open RAIL-M"

[modalities]
input = ["text"]
output = ["decision"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 131_072
output = 0

[[links]]
label = "Documentation"
url = "https://github.com/nace-ai/drex-decision-models"
type = "docs"

[[links]]
label = "License"
url = "https://huggingface.co/nace-ai/drex-v2.0/blob/main/LICENSE"
type = "license"

[[weights]]
url = "https://huggingface.co/nace-ai/drex-v2.0"
format = "safetensors"
