# Lab metadata carried over from providers/openrouter/models/relace/relace-search.toml (curated catalogue data already in this repo),
# with provider-specific fields (cost, reasoning_options, status) stripped.
schema = 2
name = "Relace Search"
description = "Tool-capable chat model for instruction following and agentic application workflows"
open_weights = false
release_date = "2025-12-08"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 256_000
output = 128_000
