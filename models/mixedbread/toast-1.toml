# Sources (accessed 2026-09-19):
# https://www.mixedbread.com/docs/agent/models
# https://www.mixedbread.com/docs/agent/chat-completions
# Sampling: the chat completions API takes temperature and top_p, no top_k
# (https://www.mixedbread.com/api-reference/endpoints/chat/create-chat-completion).
schema = 2
name = "Toast 1"
description = "Specialized search model for knowledge-intensive questions, multi-step retrieval, and evidence synthesis"
open_weights = false
release_date = "2026-08-13"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = false

[limit]
context = 131_000
output = 4_000
