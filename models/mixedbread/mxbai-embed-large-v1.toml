# https://huggingface.co/mixedbread-ai/mxbai-embed-large-v1 (Apache-2.0; 512-token input, 1024 dimensions with Matryoshka truncation)
# Repository created 2024-03-07 (Hugging Face API createdAt).
schema = 2
v2_only = true
type = "embedding"
name = "mxbai-embed-large-v1"
description = "English text embedding model for retrieval with Matryoshka and binary quantization support"
open_weights = true
release_date = "2024-03-07"
license = "Apache-2.0"

[modalities]
input = ["text"]
output = ["embedding"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 512
output = 0

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/mixedbread-ai/mxbai-embed-large-v1"
