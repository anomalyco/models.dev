# Model ID and release (2026-05-05, "Realtime TTS-2"): https://docs.inworld.ai/release-notes/tts
# Output formats (audioConfig.audioEncoding LINEAR16/WAV, MP3, OGG_OPUS, ALAW, MULAW, FLAC, PCM);
# temperature is ignored on inworld-tts-2 (deliveryMode instead):
#   https://docs.inworld.ai/api-reference/ttsAPI/texttospeech/synthesize-speech
schema = 2
v2_only = true
type = "speech"
name = "Realtime TTS-2"
description = "Expressive text-to-speech model with natural-language steering, voice cloning and cross-lingual synthesis"
open_weights = false
release_date = "2026-05-05"

[modalities]
input = ["text"]
output = ["audio/wav", "audio/mpeg", "audio/ogg", "audio/alaw", "audio/basic", "audio/flac", "audio/pcm"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
