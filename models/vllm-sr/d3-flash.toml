# Sources (accessed 2026-10-21): https://huggingface.co/vllm-sr/d3-flash (Apache-2.0; Hub createdAt 2026-10-10; base model Qwen3.5-9B):
#   9B multimodal decision model of vLLM Semantic Router's Decision 3.0. Inputs are text or JSON plus images and videos;
#   decision types choice, yes/no and score. The card lists no exact image or video formats.
# Context 32,768: "Inputs up to 32,768 tokens" (AMD Token Factory listing). Decision models generate no text.
schema = 2
v2_only = true
type = "decision"
name = "d3-flash"
description = "vLLM Semantic Router 9B decision model that answers typed choice, yes/no and score questions about text, images or video with probabilities"
open_weights = true
release_date = "2026-10-10"
license = "Apache-2.0"

[modalities]
input = ["text", "image", "video"]
output = ["decision"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 32_768
output = 0

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/vllm-sr/d3-flash"
