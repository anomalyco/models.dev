# Sources (accessed 2026-10-27): https://huggingface.co/vllm-sr/d3-mini (Apache-2.0; Hub createdAt 2026-10-10).
# The model card documents PNG/JPEG/WebP images and MP4/WebM/MOV/MKV videos. Decision models generate no text.
# Context: decision_config.json sets max_length = null and config.json sets text_config.max_position_embeddings = 262144:
# https://huggingface.co/vllm-sr/d3-mini/raw/main/decision_config.json
# https://huggingface.co/vllm-sr/d3-mini/raw/main/config.json
schema = 2
v2_only = true
type = "decision"
name = "d3-mini"
description = "vLLM Semantic Router 4B decision model that answers typed choice, yes/no and score questions about text, images or video with probabilities"
open_weights = true
release_date = "2026-10-10"
license = "Apache-2.0"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "video/mp4", "video/webm", "video/quicktime", "video/x-matroska"]
output = ["decision"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 262_144
output = 0

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/vllm-sr/d3-mini"
