# Released 2026-09-23: https://www.recraft.ai/blog/meet-recraft-v4-1-flash (text-to-image only, raster)
#   Inputs PNG, JPG or WEBP; raster output lossless WebP (default) or PNG, vector output SVG:
#   https://www.recraft.ai/docs/api-reference/endpoints
schema = 2
v2_only = true
type = "image"
name = "Recraft V4.1 Flash"
description = "Fast, low-cost text-to-image model with quality close to Recraft V4.1"
family = "recraft"
open_weights = false
release_date = "2026-09-23"

[modalities]
input = ["text"]
output = ["image/webp", "image/png"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
