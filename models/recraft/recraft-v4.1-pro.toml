# Released 2026-05-14: https://www.recraft.ai/docs/recraft-models/recraft-v4-1
#   Inputs PNG, JPG or WEBP; raster output lossless WebP (default) or PNG, vector output SVG:
#   https://www.recraft.ai/docs/api-reference/endpoints
schema = 2
v2_only = true
type = "image"
name = "Recraft V4.1 Pro"
description = "2K Recraft V4.1 image model for print-ready detail"
family = "recraft"
open_weights = false
release_date = "2026-05-14"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp"]
output = ["image/webp", "image/png"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
