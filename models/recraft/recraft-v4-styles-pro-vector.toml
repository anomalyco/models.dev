# Released 2026-08-26: https://www.recraft.ai/blog/meet-recraft-v4-styles, https://www.recraft.ai/docs/api-reference/models/recraft-v4-styles
#   Inputs PNG, JPG or WEBP; raster output lossless WebP (default) or PNG, vector output SVG:
#   https://www.recraft.ai/docs/api-reference/endpoints
schema = 2
v2_only = true
type = "image"
name = "Recraft V4 Styles Pro Vector"
description = "Higher-detail style-consistent SVG image model driven by reference images"
family = "recraft"
open_weights = false
release_date = "2026-08-26"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp"]
output = ["image/svg+xml"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
