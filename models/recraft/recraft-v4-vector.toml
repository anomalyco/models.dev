# Released in February 2026 with Recraft V4 (https://www.recraft.ai/docs/api-reference/models/recraft-v4); 2026-02-17 per https://vercel.com/ai-gateway/models/providers/recraft
#   Inputs PNG, JPG or WEBP; raster output lossless WebP (default) or PNG, vector output SVG:
#   https://www.recraft.ai/docs/api-reference/endpoints
schema = 2
v2_only = true
type = "image"
name = "Recraft V4 Vector"
description = "Recraft V4 model that generates editable SVG images"
family = "recraft"
open_weights = false
release_date = "2026-02-17"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp"]
output = ["image/svg+xml"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
