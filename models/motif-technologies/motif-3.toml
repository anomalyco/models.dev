name = "Motif 3"
family = "motif"
description = "Motif 3 is a large-scale, decoder-only Mixture-of-Experts (MoE) language model with 314 billion total parameters and 13.2 billion parameters activated per token."
release_date = "2026-08-07"
last_updated = "2026-08-07"
attachment = false
reasoning = true
temperature = true
tool_call = true
structured_output = false
open_weights = true
license = "MIT"

[limit]
context = 262_144
output = 262_144

[modalities]
input = ["text"]
output = ["text"]

[[weights]]
label = "Model weights"
url = "https://huggingface.co/Motif-Technologies/Motif-3"
format = "safetensors"
