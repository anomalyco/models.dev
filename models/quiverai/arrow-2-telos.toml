# Sources (accessed 2026-09-19):
# https://docs.quiver.ai/developers/models
# https://docs.quiver.ai/developers/models/arrow-2-telos
# Sampling: https://docs.quiver.ai/api-reference/create-svgs/generate-svg (Arrow 2 Telos rejects
#   any temperature or top_p value with HTTP 400; there is no top_k field).
schema = 2
name = "Arrow 2 Telos"
description = "High-fidelity SVG generation model for complex vector work and long-context refinement"
open_weights = false
release_date = "2026-09-16"

[modalities]
input = ["text", "image"]
output = ["text", "image"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = false
top_p = false
top_k = false

[limit]
context = 1_050_000
output = 65_536
