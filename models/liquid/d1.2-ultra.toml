# https://www.liquid.ai/blog/d1-2 (hosted release, 2026-11-16)
# https://docs.liquid.ai/lfm/models/d1 (per-question input limit and typed answers without generated tokens)
# d1.2 image formats (JPEG, PNG, WebP): https://github.com/Liquid4All/docs/blob/d4c58eb76305b9d20d7167ee7d1fffcb976aea98/lfm/models/d1.mdx#L1220-L1224
# d1.2 audio formats (WAV with PCM or float samples, MP3, FLAC, Ogg Opus or Vorbis): https://github.com/Liquid4All/docs/blob/d4c58eb76305b9d20d7167ee7d1fffcb976aea98/lfm/models/d1.mdx#L1314-L1318
schema = 2
v2_only = true
type = "decision"
name = "d1.2-ultra"
description = "Higher-accuracy Liquid decision model for classification, span extraction and object localization over shared multimodal state."
family = "liquid-decision"
open_weights = false
release_date = "2026-11-16"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp", "audio/wav", "audio/mpeg", "audio/flac", "audio/ogg"]
output = ["decision"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 65_536
output = 0
