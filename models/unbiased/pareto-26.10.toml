# Pareto 26.10: preview 2026-10-01, stable (GA) 2026-10-15. On Unbiased's API, `pareto` now points to 26.10;
# `pareto-26.9` stays live, and the 26.9-era `unbiased/pareto` lab entry (262,144 context) is left as is.
# Sources (accessed 2026-10-30):
# - https://unbiased.ai/blog/pareto-26-10/ (GA date, 1M context, `pareto` -> 26.10)
# - https://unbiased.ai/pareto-26-10/ ("Context window 1M tokens", "API input / output Text + images / text", tool calling)
# - https://unbiased.ai/model-card/ ("Pareto accepts text and image inputs")
# - https://openrouter.ai/api/v1/models/unbiased/pareto-26.10/endpoints (context 1,048,576, max output 131,072,
#   input text+image; supported params max_tokens, temperature, top_p, tools, tool_choice: no reasoning params)
# Reasoning: no Unbiased doc exposes a reasoning toggle, effort or budget, so it stays false.
# Image input: no Unbiased doc lists formats, so the input stays generic `image` (same as unbiased/pareto).
schema = 2
name = "Pareto 26.10"
description = "Blended multimodal model that selects frontier and open models for each request and blends their outputs into one answer"
open_weights = false
release_date = "2026-10-15"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = false

[limit]
context = 1_048_576
output = 131_072
