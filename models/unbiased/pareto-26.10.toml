schema = 2
name = "Pareto 26.10"
description = "Unbiased Pareto multimodal blend for text and image understanding"
open_weights = false
release_date = "2026-10-15"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
