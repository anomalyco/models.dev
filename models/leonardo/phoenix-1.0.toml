# Full release 2024-12-18 ("Flux + Phoenix 1.0 have landed ... the full release of Phoenix 1.0, our foundational
# model"): https://x.com/LeonardoAi_/status/1869351934576205869
# Leonardo.Ai's foundational text-to-image model. Leonardo doesn't document an output format, so output stays generic
# `image`. Prompts are not chat tokens, so context and output are 0.
schema = 2
v2_only = true
type = "image"
name = "Phoenix 1.0"
description = "Leonardo.Ai's foundational text-to-image model with strong prompt adherence and coherent text"
family = "phoenix"
open_weights = false
release_date = "2024-12-18"

[modalities]
input = ["text"]
output = ["image"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
