# Released January 2026 (Apache-2.0): https://huggingface.co/Qwen/Qwen3-ASR-1.7B
# Input formats: the common list in OpenRouter's speech-to-text docs (the lab lists none here):
#   https://openrouter.ai/docs/guides/overview/multimodal/stt
schema = 2
v2_only = true
type = "transcription"
name = "Qwen3 ASR 1.7B"
description = "Open multilingual speech recognition model covering 30 languages and 22 Chinese dialects"
family = "qwen"
open_weights = true
release_date = "2026-01"
license = "Apache-2.0"

[modalities]
input = ["audio/wav", "audio/mpeg", "audio/flac", "audio/mp4", "audio/ogg", "audio/webm", "audio/aac"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/Qwen/Qwen3-ASR-1.7B"
