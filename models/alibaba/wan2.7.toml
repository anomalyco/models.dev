# Released 2026-04-03 (wan2.7-t2v, -i2v, -r2v): https://www.alibabacloud.com/help/en/model-studio/newly-released-models
# Formats: images JPEG, JPG, PNG, BMP or WEBP; audio WAV or MP3:
#   https://www.alibabacloud.com/help/en/model-studio/image-to-video-api-reference
# Video references: MP4.
# Output: MP4; generated sound is a track inside the MP4, so no audio MIME type is listed.
schema = 2
v2_only = true
type = "video"
name = "Wan2.7"
description = "Video model for text, image and reference to video, with mixed image and video references and voice timbre cloning"
open_weights = false
release_date = "2026-04-03"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/bmp", "image/webp", "video/mp4", "audio/wav", "audio/mpeg"]
output = ["video/mp4"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
