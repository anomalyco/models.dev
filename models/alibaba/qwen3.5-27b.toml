# Input MIME types: images and video per https://www.alibabacloud.com/help/en/model-studio/vision (Image limits, Video limits; video lists extensions, registered MIME types used)
# No audio input (accessed 2026-10-20): the model card https://huggingface.co/Qwen/Qwen3.5-27B states "Type: Causal Language Model with Vision Encoder"
#   (README line 42), its pipeline_tag is image-text-to-text, and its benchmarks cover image and video understanding only (no audio encoder or audio benchmark).
#   Model Studio documents image and video input for the "qwen3.5 series"/"qwen3.6 series" (https://www.alibabacloud.com/help/en/model-studio/vision, Image limits and Video limits) and no audio input.
# Sampling: temperature, top_p and top_k are request parameters on Model Studio: https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions
schema = 2
name = "Qwen3.5 27B"
description = "Qwen vision-language model for visual reasoning, documents, and agent tasks"
family = "qwen"
open_weights = true
release_date = "2026-02-23"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic", "video/mp4", "video/x-msvideo", "video/x-matroska", "video/quicktime", "video/x-flv", "video/x-ms-wmv"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 262_144
output = 65_536

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/Qwen/Qwen3.5-27B"

[[benchmarks]]
name = "SWE-Bench Verified"
score = 72.4
metric = "resolved"
source = "https://huggingface.co/Qwen/Qwen3.5-27B"
