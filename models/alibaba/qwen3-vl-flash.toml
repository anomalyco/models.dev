# Sources (accessed 2026-09-15):
# https://www.alibabacloud.com/help/en/model-studio/qwen3-vl-flash
# https://www.alibabacloud.com/help/en/model-studio/vision
# Snapshots qwen3-vl-flash-2025-10-15 (first) and qwen3-vl-flash-2026-01-22 (latest).
# Hybrid thinking: enable_thinking (default false) + thinking_budget (max 81,920 CoT tokens).
# Max input 260,096 (258,048 in thinking mode). Knowledge cutoff not published.
name = "Qwen3-VL Flash"
description = "Compact Qwen3 vision-language model with hybrid thinking for image, video, and long-document understanding"
family = "qwen"
release_date = "2025-10-15"
last_updated = "2026-01-22"
attachment = true
reasoning = true
temperature = true
tool_call = true
structured_output = true
open_weights = false

[limit]
context = 262_144
input = 260_096
output = 32_768

[modalities]
input = ["text", "image", "video"]
output = ["text"]
