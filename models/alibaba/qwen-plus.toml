# Sampling: temperature, top_p and top_k are request parameters on Model Studio: https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions
schema = 2
name = "Qwen Plus"
description = "Qwen instruction model for multilingual chat, reasoning, and tool use"
family = "qwen"
open_weights = false
knowledge = "2024-04"
release_date = "2024-01-25"
last_updated = "2025-09-11"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_000_000
output = 32_768
