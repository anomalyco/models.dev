# Sources (accessed 2026-11-04): https://huggingface.co/Qwen/Qwen3-0.6B (Apache-2.0; Qwen3 release
#   2025-04-29, https://qwenlm.github.io/blog/qwen3/). Dense 0.6B; thinking and non-thinking modes
#   (enable_thinking); tool calling; context 32,768. Output 32,768 from the same model card: "We
#   recommend using an output length of 32,768 tokens for most queries" (matches models/alibaba/qwen3-8b.toml).
# Sampling: open weights, so temperature, top_p and top_k are runtime sampler settings on any host.
schema = 2
name = "Qwen3 0.6B"
description = "Smallest dense Qwen3 model with switchable thinking, for titles, short rewrites and quick classification"
family = "qwen"
open_weights = true
release_date = "2025-04-29"
license = "Apache-2.0"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 32_768
output = 32_768

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/Qwen/Qwen3-0.6B"
