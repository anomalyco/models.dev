# Sampling: temperature, top_p and top_k are request parameters on Model Studio: https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions
schema = 2
name = "QwQ Plus"
description = "Qwen reasoning model for deliberate problem solving, math, and coding"
family = "qwen"
open_weights = false
knowledge = "2024-04"
release_date = "2025-03-05"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 131_072
output = 8_192
