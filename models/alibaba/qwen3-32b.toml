# Sampling: temperature, top_p and top_k are request parameters on Model Studio: https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions
# Release: Qwen3 blog, published 2025-04-29 04:00 +08:00 (2025-04-28 UTC): https://qwenlm.github.io/blog/qwen3/
schema = 2
name = "Qwen3 32B"
description = "Dense open Qwen model for self-hosted chat, reasoning, and coding"
family = "qwen"
open_weights = true
knowledge = "2025-04"
release_date = "2025-04-28"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 131_072
output = 16_384

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/Qwen/Qwen3-32B"

[[benchmarks]]
name = "Aider Polyglot"
score = 40.0
metric = "percent correct"
source = "https://aider.chat/docs/leaderboards/"
date = "2025-05-08"
