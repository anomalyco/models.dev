# Sources (accessed 2026-09-15):
# https://www.alibabacloud.com/help/en/model-studio/wan2-7-r2v
# https://www.alibabacloud.com/help/en/model-studio/wan-video-to-video-api-reference
# https://www.alibabacloud.com/blog/alibaba-unveils-wan2-7-video-to-elevate-creators-from-executors-to-directors_603009
# Snapshot wan2.7-r2v-2026-06-12 (reference_voice audio + reference_video inputs).
# Async DashScope video-synthesis endpoint: no temperature/tool/structured-output controls;
# billed per second of output video, so no token limits (limit = 0).
name = "Wan2.7 Reference-to-Video"
description = "Video model for reference-guided generation from up to 5 mixed image/video references with voice timbre cloning"
release_date = "2026-04-07"
last_updated = "2026-06-12"
attachment = true
reasoning = false
temperature = false
tool_call = false
open_weights = false

[limit]
context = 0
output = 0

[modalities]
input = ["text", "image", "video", "audio"]
output = ["video"]
