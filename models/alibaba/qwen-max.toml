# Sampling: temperature, top_p and top_k are request parameters on Model Studio: https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions
schema = 2
name = "Qwen Max"
description = "Flagship Qwen model for complex reasoning, coding, and agentic workflows"
family = "qwen"
open_weights = false
knowledge = "2024-04"
release_date = "2024-04-03"
last_updated = "2025-01-25"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 32_768
output = 8_192

[[benchmarks]]
name = "Aider Polyglot"
score = 21.8
metric = "percent correct"
source = "https://aider.chat/docs/leaderboards/"
date = "2025-01-28"
