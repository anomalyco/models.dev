# Sources (accessed 2026-09-24):
# https://vercel.com/ai-gateway/models/qwen3.8-max-prime
# https://openrouter.ai/qwen/qwen3.8-max-prime
# High-throughput Alibaba Qwen3.8 Max SKU; OpenRouter lists video input in
# addition to the text and image input exposed by Vercel's gateway.
# Input MIME types: images and video per https://www.alibabacloud.com/help/en/model-studio/vision (Image limits, Video limits; video lists extensions, registered MIME types used)
# Sampling: temperature, top_p and top_k are request parameters on Model Studio: https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions
schema = 2
name = "Qwen 3.8 Max Prime"
description = "High-throughput edition of Qwen3.8 Max for coding, professional work, multimodal understanding, and long-running agent workflows"
family = "qwen3.8-max"
open_weights = false
release_date = "2026-09-23"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic", "video/mp4", "video/x-msvideo", "video/x-matroska", "video/quicktime", "video/x-flv", "video/x-ms-wmv"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_000_000
output = 131_072
