name = "Qwen-MT Flash"
description = "Qwen3-based translation model for rapid, cost-effective translation across 92 languages with terminology and domain control"
family = "qwen"
release_date = "2025-09-17"
last_updated = "2025-09-17"
attachment = false
reasoning = false
tool_call = false
structured_output = false
open_weights = false

[limit]
context = 16_384
input = 8_192
output = 8_192

[modalities]
input = ["text"]
output = ["text"]
