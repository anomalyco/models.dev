# Released 2026-08-06 (wan3.0-video): https://www.alibabacloud.com/help/en/model-studio/newly-released-models
# Formats: images JPEG, JPG, PNG, BMP or WEBP; audio WAV or MP3:
#   https://www.alibabacloud.com/help/en/model-studio/image-to-video-api-reference
# Video references: MP4.
# Output: MP4; generated sound is a track inside the MP4, so no audio MIME type is listed.
schema = 2
v2_only = true
type = "video"
name = "Wan3.0"
description = "All-in-one video model for reference, editing and image-to-video generation with audio, up to 30 seconds"
open_weights = false
release_date = "2026-08-06"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/bmp", "image/webp", "video/mp4", "audio/wav", "audio/mpeg"]
output = ["video/mp4"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
