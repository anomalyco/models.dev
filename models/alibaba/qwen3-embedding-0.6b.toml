# https://huggingface.co/Qwen/Qwen3-Embedding-0.6B (Context Length: 32k; config.json max_position_embeddings 32768)
# Released 2025-06-05 with Qwen3 Embedding 4B and 8B: https://qwenlm.github.io/blog/qwen3-embedding/
schema = 2
v2_only = true
type = "embedding"
name = "Qwen3 Embedding 0.6B"
description = "Compact multilingual text embedding model for retrieval, code search, classification, and clustering"
family = "qwen"
open_weights = true
release_date = "2025-06-05"
license = "Apache-2.0"

[modalities]
input = ["text"]
output = ["embedding"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 32_768
output = 0

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/Qwen/Qwen3-Embedding-0.6B"
