# Sampling: temperature, top_p and top_k are request parameters on Model Studio: https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions
schema = 2
name = "Qwen3-Next 80B-A3B Instruct"
description = "Qwen instruction model for multilingual chat, reasoning, and tool use"
family = "qwen"
open_weights = true
knowledge = "2025-04"
release_date = "2025-09"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 131_072
output = 32_768

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/Qwen/Qwen3-Next-80B-A3B-Instruct"
