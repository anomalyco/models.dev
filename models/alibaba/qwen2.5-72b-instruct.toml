# Model card (https://huggingface.co/Qwen/Qwen2.5-72B-Instruct, accessed 2026-11-28): 72.7B instruction-tuned,
#   "Context Length: Full 131,072 tokens and generation 8192 tokens" (config.json ships 32,768; YaRN extends it),
#   structured output (JSON); tool use through the chat template; Qwen license.
# Release: Qwen2.5 blog, 2024-09-19 (https://qwenlm.github.io/blog/qwen2.5/), as for qwen2.5-7b-instruct.
# Sampling: open weights, so temperature/top_p/top_k are runtime features of the host.
schema = 2
name = "Qwen2.5 72B Instruct"
description = "Large open Qwen2.5 instruction model for chat, coding, math, structured output, and tool use"
family = "qwen"
open_weights = true
release_date = "2024-09-19"
license = "Qwen"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 131_072
output = 8_192

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/Qwen/Qwen2.5-72B-Instruct"
