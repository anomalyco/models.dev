# Released 2026-04-22 (happyhorse-1.0-t2v, -i2v): https://www.alibabacloud.com/help/en/model-studio/newly-released-models
# Formats: images JPEG, JPG, PNG, BMP or WEBP; audio WAV or MP3:
#   https://www.alibabacloud.com/help/en/model-studio/image-to-video-api-reference
# Output: MP4.
schema = 2
v2_only = true
type = "video"
name = "HappyHorse-1.0"
description = "Video model for text, image and reference to video with realistic motion"
open_weights = false
release_date = "2026-04-22"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/bmp", "image/webp"]
output = ["video/mp4"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
