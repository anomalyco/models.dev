# Max Output Length 131072 per Alibaba Model Studio qwen3.7-max (Context Window 1000000):
# https://www.alibabacloud.com/help/en/model-studio/qwen3-7-max
# Sampling: temperature, top_p and top_k are request parameters on Model Studio: https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions
schema = 2
name = "Qwen3.7 Max"
description = "Qwen frontier model tuned for agent frameworks, coding assistants, and long tasks"
family = "qwen"
open_weights = false
release_date = "2026-05-21"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_000_000
output = 131_072

