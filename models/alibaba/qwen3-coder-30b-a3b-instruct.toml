# Sampling: temperature, top_p and top_k are request parameters on Model Studio: https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions
# Release: Hugging Face repo Qwen/Qwen3-Coder-30B-A3B-Instruct created 2025-07-31
schema = 2
name = "Qwen3-Coder 30B-A3B Instruct"
description = "Smaller Qwen coder for efficient local agents and repo-level fixes"
family = "qwen"
open_weights = true
knowledge = "2025-04"
