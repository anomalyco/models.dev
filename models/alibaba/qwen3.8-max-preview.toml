name = "Qwen3.8 Max Preview"
description = "Preview Qwen flagship for million-token multimodal reasoning and long-horizon agentic workflows"
family = "qwen"
release_date = "2026-07-19"
last_updated = "2026-07-19"
attachment = true
reasoning = true
temperature = true
tool_call = true
open_weights = false

[limit]
context = 1_000_000
output = 131_072

[modalities]
input = ["text", "image", "video"]
output = ["text"]

