# https://huggingface.co/Qwen/Qwen3-30B-A3B-Instruct-2507 (model card, accessed 2026-10-20):
# - Non-thinking only ("supports only non-thinking mode and does not generate <think></think> blocks").
# - Context length 262,144 natively; recommended output length 16,384 tokens (same as the 235B sibling).
# - Tool usage covered in the card's agentic section (Qwen-Agent tool calling); Apache-2.0.
# - release_date: Hugging Face repository creation, 2025-07-28 (https://huggingface.co/api/models/Qwen/Qwen3-30B-A3B-Instruct-2507).
# Sampling: temperature, top_p and top_k are request parameters on Model Studio: https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions
schema = 2
name = "Qwen3 30B-A3B Instruct 2507"
description = "Updated compact Qwen3 MoE instruct model for multilingual chat, coding, and tool use"
family = "qwen"
open_weights = true
release_date = "2025-07-28"
license = "Apache 2.0"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 262_144
output = 16_384

[[weights]]
label = "Hugging Face"
