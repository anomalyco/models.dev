# Sources (accessed 2026-11-13):
# https://www.alibabacloud.com/help/en/model-studio/qwen4-max-preview
# https://docs.qwencloud.com/token-plan/personal/token-plan-personal-overview
# https://docs.qwencloud.com/developer-guides/getting-started/text-generation-models
# https://docs.qwencloud.com/developer-guides/text-generation/thinking
# https://www.alibabacloud.com/help/en/model-studio/pdf-understanding
# https://www.alibabacloud.com/help/en/model-studio/vision
# Preview: Token Plan only, 2026-11-11 10:00 to 2026-11-25 24:00 (UTC+8).
# The alias qwen4.0-max-preview is also accepted; bills use that ID.
# Input MIME types follow the shared Model Studio vision limits, plus PDF understanding.
schema = 2
name = "Qwen4 Max Preview"
description = "Preview flagship multimodal model for coding, office productivity, frontend design, and complex agentic tasks"
family = "qwen"
open_weights = false
release_date = "2026-11-11"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic", "video/mp4", "video/x-msvideo", "video/x-matroska", "video/quicktime", "video/x-flv", "video/x-ms-wmv", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_000_000
output = 393_216