# Generated from EUrouter's public catalog, GET https://api.eurouter.ai/v1/models, model "alibaba/qwen3-vl-embedding-8b".
# Fix a wrong value in the catalog or in the generator (apps/core/scripts/modelsdev-generate.ts in the EUrouter repository), never in this file.
# models.dev has no lab entry for this model, so this one comes from the catalog fields name, description, release_date,
#   knowledge_cutoff, license, open_weights, architecture, supported_parameters, context_length,
#   top_provider.max_completion_tokens and hugging_face_id (https://huggingface.co/Qwen/Qwen3-VL-Embedding-8B).
schema = 2
v2_only = true
type = "embedding"
name = "Qwen3 VL Embedding 8B"
description = "Qwen3 VL Embedding 8B is Alibaba's multimodal embedding model for mapping text, images, document images, and video into a shared vector space for multilingual retrieval and clustering."
open_weights = true
release_date = "2026-01-08"
license = "Apache-2.0"

[modalities]
input = ["text", "image", "video"]
output = ["embedding"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 32_768
output = 0

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/Qwen/Qwen3-VL-Embedding-8B"
