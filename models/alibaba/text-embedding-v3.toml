# https://www.alibabacloud.com/help/en/model-studio/embedding (dimensions 64-1024, 8,192 tokens per input row)
# Release: 2024-07-12 on https://www.alibabacloud.com/help/en/model-studio/newly-released-models. Accessed 2026-11-08.
schema = 2
v2_only = true
type = "embedding"
name = "Text Embedding v3"
description = "Multilingual text embedding model covering 50+ languages with 64 to 1,024 dimensions"
open_weights = false
release_date = "2024-07-12"

[modalities]
input = ["text"]
output = ["embedding"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 8_192
output = 0
