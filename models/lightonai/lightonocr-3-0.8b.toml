name = "LightOnOCR-3 0.8B"
description = "LightOnOCR-3-0.8B is the lightest model of LightOn's LightOnOCR-3 family, with the same layout and visual understanding features as its larger siblings."
release_date = "2026-10-08"
last_updated = "2026-10-14"
attachment = true
reasoning = false
temperature = true
tool_call = false
structured_output = false
open_weights = true
license = "apache-2.0"

[limit]
context = 262_144
output = 16_384

[modalities]
input = ["text", "image"]
output = ["text"]

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/lightonai/LightOnOCR-3-0.8B"

[[benchmarks]]
name = "olmOCR-bench"
score = 85.5
metric = "score"
source = "https://huggingface.co/lightonai/LightOnOCR-3-0.8B"

[[benchmarks]]
name = "ParseBench"
score = 74.6
metric = "mean"
source = "https://huggingface.co/lightonai/LightOnOCR-3-0.8B"
