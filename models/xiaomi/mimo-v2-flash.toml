# Sampling: open weights, so temperature/top_p/top_k are runtime features of the host. The checkpoint's
#   generation_config.json sets temperature 1.0 and top_p 0.95; the MiMo API pins both in thinking mode
#   (https://mimo.mi.com/docs/en-US/api/chat/openai-api).
schema = 2
name = "MiMo-V2-Flash"
description = "MiMo flash model for fast multimodal assistance and agent workflows"
family = "mimo"
open_weights = true
knowledge = "2024-12-01"
release_date = "2025-12-16"
last_updated = "2026-02-04"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 262_144
output = 65_536

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/XiaomiMiMo/MiMo-V2-Flash"
