# Source: https://huggingface.co/PixilabAI/Blink-v0.3-26B-A4B-NVFP4 and the FP8 build (model cards
# and config.json, accessed 2026-10-20). A fine-tune of Gemma 4 26B A4B IT that answers with a
# probability per option from one forward pass, so output is 0. v0.3 ships only as NVFP4 and FP8
# weights (2026-10-02). The card names no input format; the vision tower is kept from Gemma 4.
# Context is max_position_embeddings in config.json.
schema = 2
v2_only = true
type = "decision"
name = "Blink v0.3 26B A4B"
description = "Pixilab's open-weight 26B-A4B decision model that returns calibrated probabilities for typed choice, score and yes/no questions about a state"
open_weights = true
release_date = "2026-10-02"
license = "Apache-2.0"

[modalities]
input = ["text", "image"]
output = ["decision"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 262_144
output = 0

[[links]]
label = "Model card"
url = "https://huggingface.co/PixilabAI/Blink-v0.3-26B-A4B-NVFP4"
type = "model_card"

[[weights]]
label = "Hugging Face (NVFP4)"
url = "https://huggingface.co/PixilabAI/Blink-v0.3-26B-A4B-NVFP4"

[[weights]]
label = "Hugging Face (FP8)"
url = "https://huggingface.co/PixilabAI/Blink-v0.3-26B-A4B-FP8"
