# Sampling: open weights, so temperature, top_p and top_k are runtime sampler settings on any host; SDAIA's ALLaM
#   7B instruct card samples with temperature 0.6, top_p 0.95, top_k 50
#   (https://huggingface.co/ALLaM-AI/ALLaM-7B-Instruct-preview).
schema = 2
name = "ALLaM-2-7b"
description = "ALLaM-2-7b instruction tuned model by SDAIA"
open_weights = true
release_date = "2025-01-23"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 4_096
output = 4_096

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/ALLaM-AI/ALLaM-2.0-7B-Instruct"
