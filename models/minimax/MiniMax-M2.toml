# Sampling: top_p defaults to 0.9 on M2.x and top_k is ignored
# (https://platform.minimax.io/docs/api-reference/text-anthropic-api).
schema = 2
name = "MiniMax-M2"
description = "Efficient open MiniMax model built for coding agents and tool-heavy workflows"
family = "minimax"
open_weights = true
release_date = "2025-10-27"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = false

[limit]
context = 204_800
output = 131_072

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/MiniMaxAI/MiniMax-M2"

[[benchmarks]]
name = "SWE-Bench Verified"
score = 69.4
metric = "resolved"
source = "https://huggingface.co/MiniMaxAI/MiniMax-M2"
