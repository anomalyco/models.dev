# https://huggingface.co/MiniMaxAI/MiniMax-M1-80k
# https://www.minimax.io/news/minimaxm1
# Recommended sampling: temperature 1.0, top_p 0.95 (model card); top_k not exposed.
schema = 2
name = "MiniMax M1 80K"
description = "Open hybrid-attention MoE reasoning model with a million-token context and an 80K thinking budget"
family = "minimax"
open_weights = true
release_date = "2025-06-17"
license = "Apache-2.0"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = false

[limit]
context = 1_000_000
output = 80_000

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/MiniMaxAI/MiniMax-M1-80k"
