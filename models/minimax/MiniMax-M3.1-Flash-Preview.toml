# Sources (accessed 2026-09-27):
# - https://platform.minimax.io/docs/api-reference/api-overview
# - https://platform.minimaxi.com/docs/api-reference/api-overview
# - https://platform.minimax.io/docs/api-reference/text-anthropic-api
# - https://platform.minimax.io/docs/api-reference/text-openai-api
# - https://platform.minimax.io/docs/guides/models-intro
# Input formats: images JPEG/PNG/GIF/WEBP, videos MP4/AVI/MOV/MKV (MediaSource schema in
# https://platform.minimax.io/docs/api-reference/text-chat-anthropic).
# Sampling: temperature and top_p are request parameters; top_k is ignored
# (https://platform.minimax.io/docs/api-reference/text-anthropic-api).
schema = 2
name = "MiniMax-M3.1-Flash-Preview"
description = "Frontier multimodal coding model with 1M context window and tunable thinking depth"
family = "minimax"
open_weights = false
release_date = "2026-09-27"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "video/mp4", "video/x-msvideo", "video/quicktime", "video/x-matroska"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = false

[limit]
context = 1_000_000
output = 512_000
