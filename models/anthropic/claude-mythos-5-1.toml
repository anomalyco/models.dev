# tools.choice: forced tool use (any/tool) returns a 400 on every host: https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools#forcing-tool-use
# Sources:
# https://platform.claude.com/docs/en/models/mythos-5-1/overview
# https://www.anthropic.com/claude-fable-and-mythos-5-1
# Claude Mythos 5.1 is the same model as Claude Fable 5.1 with restricted access;
# same 1M context, 128K output, Jun 2026 cutoff, released 2026-09-01.
schema = 2
name = "Claude Mythos 5.1"
description = "Restricted Claude model for advanced cybersecurity and biology research workflows"
family = "claude-mythos"
open_weights = false
knowledge = "2026-06"
release_date = "2026-09-01"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none"] }
reasoning = { supported = true }
temperature = false
top_p = false
top_k = false

[limit]
context = 1_000_000
output = 128_000
