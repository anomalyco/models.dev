# tools.choice: forced tool use (any/tool) returns a 400 on every host: https://platform.claude.com/docs/en/models/fable-5-2/whats-new-fable-5-2#thinking-and-tool-choice
# Sources:
# https://platform.claude.com/docs/en/models/mythos-5-2/overview
# https://www.anthropic.com/claude-fable-and-mythos-5-2
# Claude Mythos 5.2 is the same model as Claude Fable 5.2 with restricted access;
# same 1M context, 128K output, Jun 2026 cutoff, released 2026-11-09.
schema = 2
name = "Claude Mythos 5.2"
description = "Restricted Claude model for advanced cybersecurity and biology research workflows"
family = "claude-mythos"
open_weights = false
knowledge = "2026-06"
release_date = "2026-11-09"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none"] }
reasoning = { supported = true }
temperature = false
top_p = false
top_k = false

[limit]
context = 1_000_000
output = 128_000
