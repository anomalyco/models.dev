# Knowledge: "Reliable knowledge cutoff: Jan 2025" (training data cutoff Jul 2025): https://platform.claude.com/docs/en/models/sonnet-4-5/overview
schema = 2
name = "Claude Sonnet 4.5 (latest)"
description = "Balanced Claude model for coding, analysis, agent workflows, and cost control"
family = "claude-sonnet"
open_weights = false
knowledge = "2025-01-31"
release_date = "2025-09-29"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 200_000
output = 64_000

[[benchmarks]]
name = "SWE-Bench Pro"
score = 43.6
metric = "resolve rate"
dataset = "public"
source = "https://labs.scale.com/leaderboard/swe_bench_pro_public"
