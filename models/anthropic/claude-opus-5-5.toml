# Launch evaluations use adaptive thinking and production safeguards, with Opus 4.8 fallback for cyber and Opus 5 for bio/frontier-LLM development.
# AutomationBench disables fallback and counts safeguard-triggered tasks as failures; Terminal-Bench uses xhigh effort.
name = "Claude Opus 5.5"
description = "Claude model for long-running agentic coding and knowledge work"
family = "claude-opus"
release_date = "2026-09-22"
last_updated = "2026-09-22"
attachment = true
reasoning = true
temperature = false
tool_call = true
open_weights = false
knowledge = "2026-06"

[limit]
context = 1_000_000
output = 128_000

[modalities]
input = ["text", "image", "pdf"]
output = ["text"]

[[benchmarks]]
name = "Terminal-Bench"
score = 66.4
metric = "score"
variant = "xhigh effort; production safeguards with fallback"
