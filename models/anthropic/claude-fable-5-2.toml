# Name, description, context (1M), max output (128K), knowledge cutoff (Jun 2026), release date (November 9, 2026): https://platform.claude.com/docs/en/models/fable-5-2/overview and https://platform.claude.com/docs/en/about-claude/models/overview
# Image and PDF input: https://platform.claude.com/docs/en/build-with-claude/vision and https://platform.claude.com/docs/en/build-with-claude/pdf-support list claude-fable-5-2; GET /v1/models reports image_input and pdf_input (2026-11-09).
# temperature/top_p/top_k: non-default values return a 400 (https://platform.claude.com/docs/en/build-with-claude/thinking#sampling-parameters); live 2026-11-09: temperature, top_p and top_k each returned 400 "is deprecated for this model".
# tools.choice: forced tool use (any/tool) returns a 400 on every host: https://platform.claude.com/docs/en/models/fable-5-2/whats-new-fable-5-2#thinking-and-tool-choice
# Benchmarks: launch post table. Scores are with safeguards on and at the highest available effort unless the post notes an effort level.
schema = 2
name = "Claude Fable 5.2"
description = "Claude model for demanding reasoning and long-horizon agentic work"
family = "claude-fable"
open_weights = false
knowledge = "2026-06"
release_date = "2026-11-09"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none"] }
reasoning = { supported = true }
temperature = false
top_p = false
top_k = false

[limit]
context = 1_000_000
output = 128_000

