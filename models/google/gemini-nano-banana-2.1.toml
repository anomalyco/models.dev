# Source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/nano-banana-2-1
# Image output formats: https://ai.google.dev/gemini-api/docs/image-generation (response_format mime_type image/png or image/jpeg).
schema = 2
type = "image"
name = "Nano Banana 2.1"
description = "Image model for prompt-driven generation, multi-turn editing, and visual design workflows"
family = "gemini-flash"
open_weights = false
release_date = "2026-10-06"

[modalities]
input = [
  "text",
  "image/png",
  "image/jpeg",
  "image/webp",
  "image/heic",
  "image/heif",
  "video/mp4",
  "video/mpeg",
  "video/mov",
  "video/avi",
  "video/x-flv",
  "video/mpg",
  "video/webm",
  "video/wmv",
  "video/3gpp",
]
output = ["text", "image/png", "image/jpeg"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true }
temperature = false
top_p = false
top_k = false

[limit]
context = 131_072
output = 32_768
