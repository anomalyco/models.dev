# Sources:
# - https://ai.google.dev/gemini-api/docs/models/antigravity-preview-09-2026 (text + image in, text out; 1,048,576 / 65,536)
# - https://ai.google.dev/gemini-api/docs/antigravity-agent (built with Gemini 3.8 Flash; custom functions and MCP tools;
#   temperature, top_p and top_k return a 400 error; "only text and image inputs are supported")
# - https://ai.google.dev/gemini-api/docs/deprecations (released 2026-09-17)
# Image MIME types: https://ai.google.dev/gemini-api/docs/image-understanding
schema = 2
v2_only = true
name = "Antigravity Agent Preview 09-2026"
description = "Managed agent that plans, runs code, manages files, and browses the web inside a Google-hosted Linux sandbox"
family = "gemini"
open_weights = false
release_date = "2026-09-17"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = false
top_p = false
top_k = false

[limit]
context = 1_048_576
output = 65_536
