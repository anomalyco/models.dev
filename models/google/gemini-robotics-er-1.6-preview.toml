# Sources:
# - https://ai.google.dev/gemini-api/docs/models/gemini-robotics-er-1.6-preview
# - https://ai.google.dev/gemini-api/docs/robotics-overview
# - https://blog.google/innovation-and-ai/models-and-research/google-deepmind/gemini-robotics-er-1-6
# - https://storage.googleapis.com/deepmind-media/Model-Cards/Gemini-Robotics-ER-1-6-Model-Card.pdf
schema = 2
name = "Gemini Robotics-ER 1.6 Preview"
description = "Vision-language model for embodied reasoning: spatial understanding, task planning, and physical-world agentic robotics"
family = "gemini"
open_weights = false
knowledge = "2025-01"
release_date = "2026-04-14"

[modalities]
input = [
  "text",
  "image/png",
  "image/jpeg",
  "image/webp",
  "image/heic",
  "image/heif",
  "video/mp4",
  "video/mpeg",
  "video/mov",
  "video/avi",
  "video/x-flv",
  "video/mpg",
  "video/webm",
  "video/wmv",
  "video/3gpp",
  "audio/wav",
  "audio/mp3",
  "audio/aiff",
  "audio/aac",
  "audio/ogg",
  "audio/flac",
  "audio/mpeg",
  "audio/m4a",
  "audio/l16",
  "audio/opus",
  "audio/alaw",
  "audio/mulaw",
  "audio/webm",
]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 131_072
output = 65_536
