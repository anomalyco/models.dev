# Release date: 2025-02-05, the GA release of gemini-2.0-flash (https://ai.google.dev/gemini-api/docs/deprecations, Release date column).
schema = 2
name = "Gemini 2.0 Flash"
description = "Earlier Gemini Flash workhorse for responsive multimodal apps and tool use"
family = "gemini-flash"
open_weights = false
knowledge = "2024-06"
release_date = "2025-02-05"

[modalities]
input = [
  "text",
  "image/png",
  "image/jpeg",
  "image/webp",
  "image/heic",
  "image/heif",
  "audio/wav",
  "audio/mp3",
  "audio/aiff",
  "audio/aac",
  "audio/ogg",
  "audio/flac",
  "audio/mpeg",
  "audio/m4a",
  "audio/l16",
  "audio/opus",
  "audio/alaw",
  "audio/mulaw",
  "audio/webm",
  "video/mp4",
  "video/mpeg",
  "video/mov",
  "video/avi",
  "video/x-flv",
  "video/mpg",
  "video/webm",
  "video/wmv",
  "video/3gpp",
  "application/pdf",
]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_048_576
output = 8_192
