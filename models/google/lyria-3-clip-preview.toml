# https://ai.google.dev/gemini-api/docs/models/lyria-3-clip-preview
# https://ai.google.dev/gemini-api/docs/music-generation
# https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/lyria/lyria-3
# https://ai.google.dev/gemini-api/docs/pricing
# https://cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing
# Audio output format: https://ai.google.dev/gemini-api/docs/music-generation and the model page (MP3).
# Image MIME types: Gemini API supported formats, which Lyria takes as Interactions image inputs
# (https://ai.google.dev/gemini-api/docs/music-generation): https://ai.google.dev/gemini-api/docs/image-understanding (Supported image formats: image/png, image/jpeg, image/webp, image/heic, image/heif)
schema = 2
type = "audio"
name = "Lyria 3 Clip Preview"
description = "Music generation model for short 30-second clips, loops, and previews from text or image prompts"
family = "lyria"
open_weights = false
release_date = "2026-03-25"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif"]
output = ["text", "audio/mp3"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 131_072
output = 65_536
