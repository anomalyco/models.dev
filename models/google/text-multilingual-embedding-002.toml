# Sources (checked 2026-11-08):
# - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/embeddings/get-text-embeddings
#   ("Specialized in multilingual tasks", up to 768 dimensions, 2048-token max sequence length)
# - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/learn/model-versions (release date May 14, 2024)
# - Research paper: https://arxiv.org/abs/2403.20327 (Gecko)
schema = 2
v2_only = true
type = "embedding"
name = "Text Multilingual Embedding 002"
description = "Gecko-based multilingual text embedding model producing up to 768-dimensional vectors"
family = "text-embedding"
open_weights = false
release_date = "2024-05-14"

[modalities]
input = ["text"]
output = ["embedding"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 2_048
output = 0
