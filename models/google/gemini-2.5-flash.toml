schema = 2
name = "Gemini 2.5 Flash"
description = "Fast Gemini workhorse for multimodal apps where latency and price matter"
family = "gemini-flash"
open_weights = false
knowledge = "2025-01"
release_date = "2025-06-17"

[modalities]
input = [
  "text",
  "image/png",
  "image/jpeg",
  "image/webp",
  "image/heic",
  "image/heif",
  "audio/wav",
  "audio/mp3",
  "audio/aiff",
  "audio/aac",
  "audio/ogg",
  "audio/flac",
  "audio/mpeg",
  "audio/m4a",
  "audio/l16",
  "audio/opus",
  "audio/alaw",
  "audio/mulaw",
  "audio/webm",
  "video/mp4",
  "video/mpeg",
  "video/mov",
  "video/avi",
  "video/x-flv",
  "video/mpg",
  "video/webm",
  "video/wmv",
  "video/3gpp",
  "application/pdf",
]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_048_576
output = 65_536

[[benchmarks]]
name = "Aider Polyglot"
score = 55.1
metric = "percent correct"
source = "https://aider.chat/docs/leaderboards/"
date = "2025-05-25"

[[benchmarks]]
name = "Artificial Analysis Coding Index"
score = 22.2
metric = "index"
source = "https://openrouter.ai/google/gemini-2.5-flash/benchmarks"
date = "2026-06-02"

[[benchmarks]]
name = "SciCode"
score = 39.4
metric = "percent correct"
