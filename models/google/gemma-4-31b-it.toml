# Image MIME types: served on the Gemini API (https://ai.google.dev/gemma/docs/core/gemma_on_gemini_api).
# Gemini API image formats: https://ai.google.dev/gemini-api/docs/image-understanding (Supported image formats: image/png, image/jpeg, image/webp, image/heic, image/heif)
schema = 2
name = "Gemma 4 31B IT"
description = "Largest Gemma 4 instruction model for open, self-hosted chat and reasoning"
family = "gemma"
open_weights = true
release_date = "2026-04-02"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 262_144
output = 32_768

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/google/gemma-4-31B-it"
