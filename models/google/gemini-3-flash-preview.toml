schema = 2
name = "Gemini 3 Flash Preview"
description = "New Gemini flash lane bringing frontier-style multimodal reasoning to cheaper runs"
family = "gemini-flash"
open_weights = false
knowledge = "2025-01"
release_date = "2025-12-17"

[modalities]
input = ["text", "image", "video", "audio", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true

[limit]
context = 1_048_576
output = 65_536

