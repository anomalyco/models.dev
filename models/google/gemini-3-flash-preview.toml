schema = 2
name = "Gemini 3 Flash Preview"
description = "New Gemini flash lane bringing frontier-style multimodal reasoning to cheaper runs"
family = "gemini-flash"
open_weights = false
knowledge = "2025-01"
release_date = "2025-12-17"

[modalities]
input = [
  "text",
  "image/png",
  "image/jpeg",
  "image/webp",
  "image/heic",
  "image/heif",
  "video/mp4",
  "video/mpeg",
  "video/mov",
  "video/avi",
  "video/x-flv",
  "video/mpg",
  "video/webm",
  "video/wmv",
  "video/3gpp",
  "audio/wav",
  "audio/mp3",
  "audio/aiff",
  "audio/aac",
  "audio/ogg",
  "audio/flac",
  "audio/mpeg",
  "audio/m4a",
  "audio/l16",
  "audio/opus",
  "audio/alaw",
  "audio/mulaw",
  "audio/webm",
  "application/pdf",
]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_048_576
output = 65_536

[[benchmarks]]
name = "SWE-Bench Pro"
score = 34.63
metric = "resolve rate"
dataset = "public"
source = "https://labs.scale.com/leaderboard/swe_bench_pro_public"

[[benchmarks]]
name = "SWE-Atlas Codebase QnA"
score = 8.2
metric = "score"
harness = "Mini-SWE-Agent"
source = "https://labs.scale.com/leaderboard/sweatlas-qna"

[[benchmarks]]
name = "SWE-Atlas Refactoring"
score = 10
metric = "score"
harness = "Mini-SWE-Agent"
source = "https://labs.scale.com/leaderboard/sweatlas-refactoring"

[[benchmarks]]
name = "SWE-Atlas Test Writing"
score = 30.3
metric = "score"
harness = "Mini-SWE-Agent"
source = "https://labs.scale.com/leaderboard/sweatlas-tw"
