# Preview snapshot of Gemini 2.5 Flash-Lite (https://developers.googleblog.com/en/gemini-2-5-thinking-model-updates/ and
# https://blog.google/products/gemini/gemini-2-5-model-family-expands/, 2025-06-17). Modalities, limits, knowledge and
# capabilities are the same as the GA model (models/google/gemini-2.5-flash-lite.toml, https://ai.google.dev/gemini-api/docs/models#gemini-2.5-flash-lite).
schema = 2
name = "Gemini 2.5 Flash-Lite Preview 06-17"
description = "First preview of Gemini 2.5 Flash-Lite, the low-cost, low-latency 2.5 model"
family = "gemini-flash-lite"
open_weights = false
knowledge = "2025-01"
release_date = "2025-06-17"

[modalities]
input = [
  "text",
  "image/png",
  "image/jpeg",
  "image/webp",
  "image/heic",
  "image/heif",
  "audio/wav",
  "audio/mp3",
  "audio/aiff",
  "audio/aac",
  "audio/ogg",
  "audio/flac",
  "audio/mpeg",
  "audio/m4a",
  "audio/l16",
  "audio/opus",
  "audio/alaw",
  "audio/mulaw",
  "audio/webm",
  "video/mp4",
  "video/mpeg",
  "video/mov",
  "video/avi",
  "video/x-flv",
  "video/mpg",
  "video/webm",
  "video/wmv",
  "video/3gpp",
  "application/pdf",
]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_048_576
output = 65_536
