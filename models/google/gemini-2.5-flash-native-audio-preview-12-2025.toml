# Sources:
# - https://ai.google.dev/gemini-api/docs/models/gemini-2.5-flash-native-audio-preview-12-2025
# - https://ai.google.dev/gemini-api/docs/live-api/capabilities
# - https://ai.google.dev/gemini-api/docs/changelog (released 2025-12-12)
# - https://generativelanguage.googleapis.com/v1beta/models (limits, topP/topK)
# `video` stays generic: the Live API takes video as a stream of image/jpeg or image/png frames
# (https://ai.google.dev/gemini-api/docs/live-api/capabilities, "Sending video"), with no container format, so the
# video stream has no MIME type of its own. The frame types are listed as image/jpeg and image/png.
schema = 2
v2_only = true
type = "realtime"
name = "Gemini 2.5 Flash Native Audio Preview 12-2025"
description = "Gemini 2.5 Flash Live API model with native audio for real-time conversational agents"
family = "gemini-flash"
open_weights = false
knowledge = "2025-01"
release_date = "2025-12-12"

[modalities]
input = ["text", "image/jpeg", "image/png", "video", "audio/pcm"]
output = ["text", "audio/pcm"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 131_072
output = 8_192
