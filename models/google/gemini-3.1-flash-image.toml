# Image output formats: https://ai.google.dev/gemini-api/docs/image-generation (response_format mime_type image/png or image/jpeg).
schema = 2
type = "image"
name = "Nano Banana 2"
description = "Image model for prompt-driven generation, editing, and visual design workflows"
family = "gemini-flash"
open_weights = false
knowledge = "2025-01"
release_date = "2026-05-28"

[modalities]
input = [
  "text",
  "image/png",
  "image/jpeg",
  "image/webp",
  "image/heic",
  "image/heif",
  "video/mp4",
  "video/mpeg",
  "video/mov",
  "video/avi",
  "video/x-flv",
  "video/mpg",
  "video/webm",
  "video/wmv",
  "video/3gpp",
  "application/pdf",
]
output = ["text", "image/png", "image/jpeg"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 131_072
output = 32_768
