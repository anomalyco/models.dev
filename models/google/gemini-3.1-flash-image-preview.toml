schema = 2
name = "Nano Banana 2 Preview"
description = "Image model for prompt-driven generation, editing, and visual design workflows"
family = "gemini-flash"
open_weights = false
knowledge = "2025-01"
release_date = "2026-02-26"

[modalities]
input = [
  "text",
  "image/png",
  "image/jpeg",
  "image/webp",
  "image/heic",
  "image/heif",
  "application/pdf",
]
output = ["text", "image"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 65_536
output = 65_536
