# Sources:
# - https://ai.google.dev/gemini-api/docs/models/gemini-3.1-flash-live-preview
# - https://blog.google/innovation-and-ai/technology/developers-tools/build-with-gemini-3-1-flash-live/
# - https://deepmind.google/models/model-cards/gemini-3-1-flash-audio/
# `video` stays generic: the Live API takes video as a stream of image/jpeg or image/png frames
# (https://ai.google.dev/gemini-api/docs/live-api/capabilities, "Sending video"), with no container format, so the
# video stream has no MIME type of its own. The frame types are listed as image/jpeg and image/png.
schema = 2
type = "realtime"
name = "Gemini 3.1 Flash Live Preview"
description = "High-quality, low-latency Live API model for real-time dialogue and voice-first AI applications"
family = "gemini-flash"
open_weights = false
knowledge = "2025-01"
release_date = "2026-03-26"

[modalities]
input = ["text", "image/jpeg", "image/png", "video", "audio/pcm"]
output = ["text", "audio/pcm"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 131_072
output = 65_536
