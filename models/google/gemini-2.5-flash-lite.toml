schema = 2
name = "Gemini 2.5 Flash-Lite"
description = "Lean Gemini 2.5 lane for cheap multimodal traffic and quick agents"
family = "gemini-flash-lite"
open_weights = false
knowledge = "2025-01"
release_date = "2025-06-17"

[modalities]
input = [
  "text",
  "image/png",
  "image/jpeg",
  "image/webp",
  "image/heic",
  "image/heif",
  "audio/wav",
  "audio/mp3",
  "audio/aiff",
  "audio/aac",
  "audio/ogg",
  "audio/flac",
  "audio/mpeg",
  "audio/m4a",
  "audio/l16",
  "audio/opus",
  "audio/alaw",
  "audio/mulaw",
  "audio/webm",
  "video/mp4",
  "video/mpeg",
  "video/mov",
  "video/avi",
  "video/x-flv",
  "video/mpg",
  "video/webm",
  "video/wmv",
  "video/3gpp",
  "application/pdf",
]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_048_576
output = 65_536

[[benchmarks]]
name = "Artificial Analysis Coding Index"
score = 9.5
metric = "index"
source = "https://openrouter.ai/google/gemini-2.5-flash-lite/benchmarks"
date = "2026-03-11"

[[benchmarks]]
name = "SciCode"
score = 19.3
metric = "percent correct"
source = "https://openrouter.ai/google/gemini-2.5-flash-lite/benchmarks"
date = "2026-03-11"

[[benchmarks]]
name = "Terminal-Bench Hard"
score = 4.5
metric = "success rate"
source = "https://openrouter.ai/google/gemini-2.5-flash-lite/benchmarks"
date = "2026-03-11"
