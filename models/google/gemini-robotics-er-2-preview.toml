# Sources:
# - https://ai.google.dev/gemini-api/docs/models/gemini-robotics-er-2-preview
# - https://ai.google.dev/gemini-api/docs/robotics-overview
# - https://ai.google.dev/gemini-api/docs/changelog (preview 2026-07-30)
# - https://generativelanguage.googleapis.com/v1beta/models (limits, topP/topK)
schema = 2
name = "Gemini Robotics-ER 2 Preview"
description = "Embodied reasoning model for robotics: spatial understanding, video progress, and multi-robot orchestration"
family = "gemini"
open_weights = false
release_date = "2026-07-30"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "video/mp4", "video/mpeg", "video/mov", "video/avi", "video/x-flv", "video/mpg", "video/webm", "video/wmv", "video/3gpp", "audio/wav", "audio/mp3", "audio/aiff", "audio/aac", "audio/ogg", "audio/flac", "audio/mpeg", "audio/m4a", "audio/l16", "audio/opus", "audio/alaw", "audio/mulaw", "audio/webm"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 131_072
output = 65_536
