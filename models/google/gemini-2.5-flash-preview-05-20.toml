# Preview snapshot of Gemini 2.5 Flash (https://developers.googleblog.com/en/gemini-2-5-thinking-model-updates/, 2025-05-20;
# deprecated preview list: https://ai.google.dev/gemini-api/docs/changelog). Modalities, limits, knowledge and
# capabilities are the same as the GA model (models/google/gemini-2.5-flash.toml, https://ai.google.dev/gemini-api/docs/models#gemini-2.5-flash).
schema = 2
name = "Gemini 2.5 Flash Preview 05-20"
description = "Preview snapshot of Gemini 2.5 Flash with controllable thinking budgets"
family = "gemini-flash"
open_weights = false
knowledge = "2025-01"
release_date = "2025-05-20"

[modalities]
input = [
  "text",
  "image/png",
  "image/jpeg",
  "image/webp",
  "image/heic",
  "image/heif",
  "audio/wav",
  "audio/mp3",
  "audio/aiff",
  "audio/aac",
  "audio/ogg",
  "audio/flac",
  "audio/mpeg",
  "audio/m4a",
  "audio/l16",
  "audio/opus",
  "audio/alaw",
  "audio/mulaw",
  "audio/webm",
  "video/mp4",
  "video/mpeg",
  "video/mov",
  "video/avi",
  "video/x-flv",
  "video/mpg",
  "video/webm",
  "video/wmv",
  "video/3gpp",
  "application/pdf",
]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_048_576
output = 65_536
