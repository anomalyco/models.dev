# API ID chirp_3, public preview 2025-08-29: https://docs.cloud.google.com/speech-to-text/docs/release-notes
# https://docs.cloud.google.com/speech-to-text/docs/models/chirp-3
# Input formats: the common list in OpenRouter's speech-to-text docs (the lab lists none here):
#   https://openrouter.ai/docs/guides/overview/multimodal/stt
schema = 2
v2_only = true
type = "transcription"
name = "Chirp 3"
description = "Multilingual speech-to-text model with diarization and automatic language detection"
open_weights = false
release_date = "2025-08-29"

[modalities]
input = ["audio/wav", "audio/mpeg", "audio/flac", "audio/mp4", "audio/ogg", "audio/webm", "audio/aac"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
