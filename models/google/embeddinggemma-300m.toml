# https://huggingface.co/google/embeddinggemma-300m (Gemma license; 2048-token input, 768 dimensions with Matryoshka truncation)
# Announced 2025-09-04: https://developers.googleblog.com/en/introducing-embeddinggemma/
schema = 2
v2_only = true
type = "embedding"
name = "EmbeddingGemma 300M"
description = "Compact multilingual open text embedding model with Matryoshka output dimensions"
family = "gemma"
open_weights = true
release_date = "2025-09-04"
license = "Gemma Terms of Use"

[modalities]
input = ["text"]
output = ["embedding"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 2_048
output = 0

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/google/embeddinggemma-300m"
