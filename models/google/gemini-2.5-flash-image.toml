# Image output formats: https://ai.google.dev/gemini-api/docs/image-generation (response_format mime_type image/png or image/jpeg).
schema = 2
type = "image"
name = "Nano Banana"
description = "Nano Banana image model for fast generation, edits, and character-consistent assets"
family = "gemini-flash"
open_weights = false
knowledge = "2024-06"
release_date = "2025-08-26"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif"]
output = ["text", "image/png", "image/jpeg"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 32_768
output = 32_768
