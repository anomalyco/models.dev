# Sources (accessed 2026-10-24):
#   https://huggingface.co/Aleph-Alpha/Kolibri-1
# The model card states 78B total and 3.46B active parameters, a context of 1,048,576 tokens
# (262,144 native, extended with a max_position_embeddings override), German and English,
# a reasoning mode, tool calling, a knowledge cutoff of 18 June 2026, a release on 3 October 2026,
# and the Apache-2.0 license. It states no output limit, so this file sets none.
schema = 2
name = "Kolibri 1"
description = "Aleph Alpha's German and English mixture-of-experts reasoning model (78B total, 3.46B active) for chat, RAG and agents"
open_weights = true
knowledge = "2026-06-18"
release_date = "2026-10-03"
license = "Apache-2.0"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_048_576

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/Aleph-Alpha/Kolibri-1"
