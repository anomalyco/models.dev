# Reflection Beam 1.0 (API model ID Beam-1.0-501B-A23B).
# Model card: https://huggingface.co/reflection/Beam-1.0-501B-A23B
#   Sparse MoE, 501.3B total / 23.4B active parameters; text in, text out; 1M context;
#   knowledge cutoff June 30, 2026; Apache 2.0 weights in BF16, FP8, and NVFP4.
#   Benchmarks are the card's final BF16 results (temperature 0.7, top_p 0.99).
# API limits: 1_048_576 context (prompt + output), 131_072 max output (includes reasoning):
#   https://developers.reflection.ai/models (created 2026-10-05)
# Text-only input; temperature, tools, and json_object/json_schema structured outputs:
#   https://developers.reflection.ai/openai-compatibility
# Announcements: https://reflection.ai/blog/introducing-beam, https://reflection.ai/blog/beam-is-available
# Sampling: open weights, so temperature, top_p and top_k are runtime sampler settings on any host;
#   generation_config.json sets temperature 0.7 and top_p 0.99.
schema = 2
name = "Beam 1.0 501B A23B"
description = "Sparse mixture-of-experts reasoning model with 23B active parameters for coding and agentic workflows"
family = "beam"
open_weights = true
knowledge = "2026-06-30"
release_date = "2026-10-05"
last_updated = "2026-10-16"
license = "Apache-2.0"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_048_576
output = 131_072

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/reflection/Beam-1.0-501B-A23B"

[[weights]]
label = "Hugging Face (FP8)"
url = "https://huggingface.co/reflection/Beam-1.0-501B-A23B-FP8"
quantization = "fp8"

[[weights]]
label = "Hugging Face (NVFP4)"
url = "https://huggingface.co/reflection/Beam-1.0-501B-A23B-NVFP4"
quantization = "nvfp4"

