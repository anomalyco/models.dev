# Sampling: the Sonar chat completions reference documented temperature (0-2) and top_p, and no top_k
#   (https://web.archive.org/web/20260804172333/https://docs.perplexity.ai/api-reference/sonar-post).
schema = 2
name = "Sonar"
description = "Fast web-grounded Sonar for current answers, citations, and lightweight retrieval"
family = "sonar"
open_weights = false
knowledge = "2025-09-01"
release_date = "2024-01-01"
last_updated = "2025-09-01"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = false

[limit]
context = 128_000
output = 4_096

[[benchmarks]]
name = "SciCode"
score = 22.9
metric = "percent correct"
source = "https://openrouter.ai/perplexity/sonar/benchmarks"
date = "2026-03-11"
