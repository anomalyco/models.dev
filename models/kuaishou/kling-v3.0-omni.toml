# Released 2026-02-05 with Video 3.0: https://ir.kuaishou.com/news-releases/news-release-details/kling-ai-launches-30-model-ushering-era-where-everyone-can-be
# Sources (accessed 2026-11-12):
# - https://kling.ai/document-api/guides/capability-map/video (Kling 3.0 Omni, API ID kling-v3-omni: text, image and video input, 3-15s)
# - https://kling.ai/document-api/api/video/3-0-omni/video-omni (images .jpg/.jpeg/.png; reference and edited videos .mp4/.mov)
# Output: MP4; generated sound is a track inside the MP4, so no audio MIME type is listed.
schema = 2
v2_only = true
type = "video"
name = "Kling VIDEO 3.0 Omni"
description = "Kling 3.0 multimodal video model for reference-based generation and editing with images, videos and elements, multi-shot storyboards and native audio"
open_weights = false
release_date = "2026-02-05"

[modalities]
input = ["text", "image/jpeg", "image/png", "video/mp4", "video/quicktime"]
output = ["video/mp4"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
