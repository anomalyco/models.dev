# Released 2025-09-23: https://ir.kuaishou.com/news-releases/news-release-details/kling-ai-launches-25-turbo-video-model-industry-leading
# Sources (accessed 2026-11-12):
# - https://kling.ai/document-api/guides/capability-map/video (Kling 2.5 Turbo, API ID kling-v2-5-turbo: text and image input, no native audio)
# - https://kling.ai/document-api/api/video/2-5-turbo/image-to-video (images .jpg/.jpeg/.png)
# Output: MP4.
schema = 2
v2_only = true
type = "video"
name = "Kling VIDEO 2.5 Turbo"
description = "Faster, lower-cost Kling video model for text-to-video and image-to-video with first and last frame control"
open_weights = false
release_date = "2025-09-23"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["video/mp4"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
