# Sources (accessed 2026-11-12):
# - https://kling.ai/document-api/guides/capability-map/video (Kling 3.0 Turbo, API ID kling-3.0-turbo: text and image input, 3-15s)
# - https://kling.ai/document-api/api/video/3-0-turbo/image-to-video (first frame only; images .jpg/.jpeg/.png)
# Released 2026-06-17 ("Kling 3.0 Turbo Officially Released"): https://kling.ai/document-api/updates/api
# Output: MP4; generated sound is a track inside the MP4, so no audio MIME type is listed.
schema = 2
v2_only = true
type = "video"
name = "Kling VIDEO 3.0 Turbo"
description = "Lower-cost Kling 3.0 tier for text-to-video and first-frame image-to-video with native audio"
open_weights = false
release_date = "2026-06-17"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["video/mp4"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
