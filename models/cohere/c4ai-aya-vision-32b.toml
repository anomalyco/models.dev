# https://huggingface.co/CohereLabs/aya-vision-32b
# Image formats: https://docs.cohere.com/docs/image-inputs ("Limitations > File types": PNG, JPEG, WEBP,
#   non-animated GIF; listed as extensions, so the registered MIME types are used).
schema = 2
name = "Aya Vision 32B"
description = "Open multilingual vision model for OCR, visual reasoning, and image question answering"
open_weights = true
release_date = "2025-03-04"
last_updated = "2025-05-14"
license = "CC-BY-NC-4.0"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 16_000
output = 4_000

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/CohereLabs/aya-vision-32b"
