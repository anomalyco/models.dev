# Sources:
# - Models: https://docs.cohere.com/docs/cohere-embed (modalities, dimensions, context length)
# - Image MIME types: https://docs.cohere.com/reference/embed ("The image must be in either `image/jpeg`,
#   `image/png`, `image/webp`, or `image/gif` format.")
# - Release: https://docs.cohere.com/changelog ("Announcing Embed Multimodal v4", April 15, 2025)
schema = 2
v2_only = true
type = "embedding"
name = "Embed 4"
description = "Multimodal embedding model for text, images, and mixed text-and-image documents"
family = "cohere-embed"
open_weights = false
release_date = "2025-04-15"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp", "image/gif"]
output = ["embedding"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 128_000
output = 1_536
