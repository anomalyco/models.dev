# Release: https://docs.cohere.com/changelog ("Announcing Command R7b", December 13, 2024) and
#   https://cohere.com/blog/command-r7b (Dec 13, 2024).
schema = 2
name = "Command R7B"
description = "Cohere retrieval model for long-context chat and enterprise RAG workflows"
family = "command-r"
open_weights = true
knowledge = "2024-06-01"
release_date = "2024-12-13"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 128_000
output = 4_000

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/CohereLabs/c4ai-command-r7b-12-2024"
