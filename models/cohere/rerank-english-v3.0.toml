# Sources:
# - Models: https://docs.cohere.com/docs/rerank (text-only, context length)
# - Release: https://www.elastic.co/search-labs/blog/elasticsearch-cohere-rerank (Rerank 3 launch partner post, April 11, 2024)
# Reranking returns relevance scores, not generated tokens (limit.output = 0).
schema = 2
v2_only = true
type = "reranking"
name = "Rerank English 3"
description = "English reranker for documents and semi-structured data"
open_weights = false
release_date = "2024-04-11"

[modalities]
input = ["text"]
output = ["reranking"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 4_096
output = 0
