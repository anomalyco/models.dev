# Sources:
# - Models: https://docs.cohere.com/docs/cohere-embed (modalities, dimensions, context length)
# - Image MIME types: https://docs.cohere.com/reference/embed ("The image must be in either `image/jpeg`,
#   `image/png`, `image/webp`, or `image/gif` format.")
# - Release: https://docs.cohere.com/changelog ("Announcing Cohere's Embed 5 Models", September 30, 2026)
schema = 2
v2_only = true
type = "embedding"
name = "Embed 5 Fast"
description = "Faster, lighter Embed 5 model sharing Embed 5 Pro's embedding space"
family = "cohere-embed"
open_weights = false
release_date = "2026-09-30"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp", "image/gif"]
output = ["embedding"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 128_000
output = 2_048
