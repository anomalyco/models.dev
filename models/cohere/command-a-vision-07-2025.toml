# https://docs.cohere.com/docs/command-a-vision
# https://huggingface.co/CohereLabs/command-a-vision-07-2025
# Image formats: https://docs.cohere.com/docs/image-inputs ("Limitations > File types": PNG, JPEG, WEBP,
#   non-animated GIF; listed as extensions, so the registered MIME types are used).
# License: https://huggingface.co/CohereLabs/command-a-vision-07-2025 (model card metadata: license: cc-by-nc-4.0).
schema = 2
name = "Command A Vision"
description = "Cohere vision model for multilingual document analysis, OCR, and image understanding"
family = "command-a"
open_weights = true
knowledge = "2024-06-01"
release_date = "2025-07-31"
license = "CC-BY-NC-4.0"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 128_000
output = 8_000

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/CohereLabs/command-a-vision-07-2025"
