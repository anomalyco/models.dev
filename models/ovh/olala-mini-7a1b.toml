# Sources (accessed 2026-11-20):
# - https://corporate.ovhcloud.com/en-ie/newsroom/news/ovh-olala-mini/
# - Hugging Face collection: https://huggingface.co/collections/OVHaiLLM/olala-v10-mini-7a1b
# Hybrid MoE (7B total / ~1B active), Differential-TPA + Mamba-3, Apache-2.0, runs on 8GB GPU or CPU.
schema = 2
name = "Olala mini 7A1B"
description = "Compact open-weight hybrid MoE language model (7B total, 1B active) from OVHcloud, trained on European supercomputers"
family = "olala"
open_weights = true
release_date = "2026-11-19"
license = "Apache-2.0"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 32_000
output = 8_192

[[weights]]
label = "Hugging Face (Olala mini)"
url = "https://huggingface.co/collections/OVHaiLLM/olala-v10-mini-7a1b"

[[links]]
url = "https://corporate.ovhcloud.com/en-ie/newsroom/news/ovh-olala-mini/"
