# https://huggingface.co/PaddlePaddle/PaddleOCR-VL
schema = 2
name = "PaddleOCR VL"
description = "Compact vision-language model for multilingual document parsing, OCR, tables, formulas, and charts"
open_weights = true
release_date = "2025-10-16"
license = "Apache-2.0"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 131_072
output = 16_384

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/PaddlePaddle/PaddleOCR-VL"
