# Sources (accessed 2026-11-18):
# - https://microsoft.ai/pdf/MAI-Image-2.7-Model-Card.pdf: release date 2026-11-17, text and image (editing) input,
#   32K-token context, image output.
# - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/use-foundry-models-mai-image: edits take up to
#   five JPEG or PNG references; output is always PNG; prompt up to 32,000 tokens; no sampling parameters.
# - https://microsoft.ai/news/introducing-mai-image-2-7/ (launch 2026-11-17)
schema = 2
v2_only = true
type = "image"
name = "MAI-Image-2.7"
description = "Image generation and precise multi-reference editing model with transparent backgrounds"
family = "mai"
open_weights = false
release_date = "2026-11-17"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["image/png"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 32_000
output = 0

[[links]]
label = "Model card"
url = "https://microsoft.ai/pdf/MAI-Image-2.7-Model-Card.pdf"
type = "model_card"

[[links]]
label = "Announcement"
url = "https://microsoft.ai/news/introducing-mai-image-2-7/"
type = "announcement"
