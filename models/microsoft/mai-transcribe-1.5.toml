# Released 2026-06-02: https://microsoft.ai/news/mai-transcribe-1-5more-accurate-context-aware-and-built-for-production/
# Input formats: the common list in OpenRouter's speech-to-text docs (the lab lists none here):
#   https://openrouter.ai/docs/guides/overview/multimodal/stt
schema = 2
v2_only = true
type = "transcription"
name = "MAI-Transcribe-1.5"
description = "Multilingual speech-to-text model across 43 languages"
family = "mai"
open_weights = false
release_date = "2026-06-02"

[modalities]
input = ["audio/wav", "audio/mpeg", "audio/flac", "audio/mp4", "audio/ogg", "audio/webm", "audio/aac"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
