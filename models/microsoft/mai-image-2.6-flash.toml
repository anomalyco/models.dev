# Released 2026-09-04: https://microsoft.ai/news/pushing-the-quality-cost-frontier-with-mai-image-2-6/
#   Edits take JPEG or PNG references; output is always PNG; prompt up to 32,000 tokens:
#   https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/use-foundry-models-mai-image
schema = 2
v2_only = true
type = "image"
name = "MAI-Image-2.6-Flash"
description = "Faster, lower-cost MAI-Image-2.6 for high-throughput generation and editing"
family = "mai"
open_weights = false
release_date = "2026-09-04"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["image/png"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 32_000
output = 0
