# Model card: https://microsoft.ai/pdf/MAI-Code-2-And-MAI-Code-2-Flash-Model-Card.pdf (last updated 2026-11-17): text and image input,
#   922,000 input tokens, 128,000 output tokens, 1,050,000 context, released 2026-11-17, configurable reasoning effort.
# Announcement: https://microsoft.ai/news/introducing-mai-code-2-and-mai-code-2-flash/
# Name: Microsoft styles these "MAI Code 2" and "MAI Code 2 Flash" with spaces (model card title, announcement, GitHub changelog), unlike the hyphenated 1.x names.
# Image MIME types aren't listed by Microsoft, so input stays the generic kind, as on MAI-Code-1.1-Flash.
# temperature, top_p, top_k = false: the model card documents no sampling parameters.
schema = 2
name = "MAI Code 2 Flash"
description = "Microsoft's lightweight coding model for explanations, targeted edits and routine fixes at high volume"
family = "mai-code-flash"
open_weights = false
release_date = "2026-11-17"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = false
top_p = false
top_k = false

[limit]
context = 1_050_000
input = 922_000
output = 128_000

[[links]]
label = "Announcement"
url = "https://microsoft.ai/news/introducing-mai-code-2-and-mai-code-2-flash/"
type = "announcement"
