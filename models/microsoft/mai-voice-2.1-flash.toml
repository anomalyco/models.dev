# Released 2026-10-01: https://microsoft.ai/news/our-first-streaming-transcription-model/
# Output formats: mp3 and pcm, as documented for OpenRouter's speech API (the lab lists none here):
#   https://openrouter.ai/docs/guides/overview/multimodal/tts
schema = 2
v2_only = true
type = "speech"
name = "MAI-Voice-2.1-Flash"
description = "Low-latency MAI-Voice-2.1 text-to-speech model"
family = "mai"
open_weights = false
release_date = "2026-10-01"

[modalities]
input = ["text"]
output = ["audio/mpeg", "audio/pcm"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
