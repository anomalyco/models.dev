# Model card: https://huggingface.co/microsoft/Phi-4-multimodal-instruct (text, image and audio in, text out; 128K context;
# "Function and tool calling"; data cutoff June 2024; MIT). Input formats from NVIDIA's card
# (https://build.nvidia.com/microsoft/phi-4-multimodal-instruct): "[.png, .jpg, .jpeg], [.mp3, .wav]".
# Release day: https://azure.microsoft.com/en-us/blog/empowering-innovation-the-next-generation-of-the-phi-family/ (2025-02-26).
# No separate output cap is published, so output = context.
# Sampling: open weights, so temperature/top_p/top_k are runtime features of the host.
schema = 2
name = "Phi-4-multimodal-instruct"
description = "Compact Microsoft multimodal model for text, image, and speech understanding"
family = "phi"
open_weights = true
knowledge = "2024-06"
release_date = "2025-02-26"
license = "MIT"

[modalities]
input = ["text", "image/png", "image/jpeg", "audio/mpeg", "audio/wav"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 131_072
output = 131_072

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/microsoft/Phi-4-multimodal-instruct"
