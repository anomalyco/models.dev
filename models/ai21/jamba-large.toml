# Sources:
# - https://docs.ai21.com/docs/jamba-foundation-models (jamba-large points to jamba-large-1.7-2025-07; 256K context; knowledge cutoff August 22nd, 2024; text in and out)
# - https://docs.ai21.com/changelog ("Introducing Jamba 1.7!", Release Date: July 3, 2025)
# - https://docs.ai21.com/reference/jamba-1-6-api-ref (max_tokens up to 4096)
# - https://huggingface.co/ai21labs/AI21-Jamba-Large-1.7 (open weights, Jamba Open Model License)
# Sampling: open weights, so temperature, top_p and top_k all apply when self-hosted; AI21's own API takes only temperature and top_p.
schema = 2
name = "Jamba Large"
description = "AI21's hybrid SSM-Transformer long-context model for enterprise agents and grounded generation"
family = "jamba"
open_weights = true
knowledge = "2024-08-22"
release_date = "2025-07-03"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 256_000
output = 4_096

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/ai21labs/AI21-Jamba-Large-1.7"
