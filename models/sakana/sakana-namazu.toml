# https://console.sakana.ai/models?model=sakana-namazu
# Sampling: the Messages API fields list temperature, top_p and top_k; Responses lists temperature and top_p.
# Input: image input via URL or base64 with no formats listed, so it stays generic `image`; file input
#   includes PDF.
schema = 2
name = "Sakana Namazu"
description = "Japanese-specialized reasoning model based on Kimi K2.6 and tuned for Japanese language, culture, and business workflows"
family = "sakana-namazu"
open_weights = false
release_date = "2026-08-03"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 262_144
output = 65_536

