# Sampling: https://console.sakana.ai/models?model=fugu lists temperature and top_p as "Accepted but ignored" on
#   Responses and Chat Completions and documents no top_k, so all three are off.
# Input: the Sakana docs list no image formats (image input only), so input stays generic `image`.
schema = 2
name = "Fugu Ultra"
description = "Quality-first multi-agent model for hard research, analysis, and competitions"
family = "fugu"
open_weights = false
release_date = "2026-06-15"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = false
top_p = false
top_k = false

[limit]
context = 1_000_000

[[links]]
label = "Official model catalog"
url = "https://raw.githubusercontent.com/SakanaAI/fugu/refs/heads/main/configs/files/fugu.json"
type = "docs"

