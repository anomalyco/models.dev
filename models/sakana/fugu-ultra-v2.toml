# Lab metadata carried over from providers/openrouter/models/sakana/fugu-ultra-v2.toml (curated catalogue data already in this repo),
# with provider-specific fields (cost, reasoning_options, status) stripped.
# Sampling: https://console.sakana.ai/models?model=fugu lists temperature and top_p as "Accepted but ignored" on
#   Responses and Chat Completions and documents no top_k, so all three are off.
# Input: the Sakana docs list no image formats (image input only), so input stays generic `image`.
# Knowledge: "Fugu Ultra's training cutoff date is 20260828" (https://console.sakana.ai/models?model=fugu).
schema = 2
name = "Fugu Ultra v2"
description = "Quality-first multi-agent model for hard research, analysis, and competitions"
family = "fugu"
open_weights = false
knowledge = "2026-08-28"
release_date = "2026-09-11"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = false
top_p = false
top_k = false

[limit]
context = 1_000_000
output = 128_000
