# https://api-docs.deepseek.com/news/news251201
# https://huggingface.co/deepseek-ai/DeepSeek-V3.2
name = "DeepSeek V3.2"
description = "Hybrid-reasoning DeepSeek model with thinking and non-thinking modes, sparse attention, and tool-use"
family = "deepseek"
release_date = "2025-12-01"
last_updated = "2025-12-01"
attachment = false
reasoning = true
temperature = true
tool_call = true
structured_output = true
knowledge = "2024-07"
open_weights = true
license = "MIT License"

[limit]
context = 128_000
output = 64_000

# Same V3 architecture family (37B per-token active per the lab's V3
# announcement) with DSA sparse attention added; the exact safetensors
# sum (685.4B, FP8 + BF16 + F32) is used as total. Also the checkpoint
# served by the API's deepseek-chat / deepseek-reasoner aliases.
[parameters]
total = 685_396_921_376
active = 37_000_000_000
architecture = "moe"
source = "https://huggingface.co/deepseek-ai/DeepSeek-V3.2"

[modalities]
input = ["text"]
output = ["text"]

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/deepseek-ai/DeepSeek-V3.2"
