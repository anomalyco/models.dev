# Open weights (Apache-2.0): https://huggingface.co/deepseek-ai/DeepSeek-OCR-2
# Sampling: open weights, so temperature/top_p/top_k are runtime features of the host.
schema = 2
name = "DeepSeek OCR 2"
description = "High-accuracy OCR model for extracting text from documents, screenshots, receipts, and natural scenes"
open_weights = true
release_date = "2026-01-27"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 8_192
output = 8_192
