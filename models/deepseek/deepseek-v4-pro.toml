# Added benchmarks are from the original V4 preview instruct-model comparison, not the later 0731/0813 releases.
name = "DeepSeek V4 Pro"
description = "Open MoE flagship with million-token context for coding and long agent runs"
family = "deepseek-thinking"
release_date = "2026-04-24"
last_updated = "2026-04-24"
attachment = false
reasoning = true
temperature = true
tool_call = true
structured_output = true
knowledge = "2025-05"
open_weights = true

[limit]
context = 1_000_000
output = 384_000

[modalities]
input = ["text"]
output = ["text"]

