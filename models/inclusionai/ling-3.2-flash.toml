# Sources (accessed 2026-11-08):
# - Release 2026-11-05 (changelog v2.0.6): https://developer.ant-ling.com/zh-CN/docs/getting-started/changelog/
# - Model page (560B total / 25B active, 1M context): https://developer.ant-ling.com/zh-CN/docs/models/ling/
# No documented output max exists (no model card; the Anthropic API's max_tokens default
# of 32000 is a default, not a cap). output = 32_768 follows this repo's Ling family
# convention (every Ling lab file uses it; the official multimodal tutorial example
# passes max_completion_tokens: 32768). Flagged for maintainer input in the PR.
# top_k follows the sibling weights cards (temperature/top_p/top_k recommended); the
# first-party API documents no top_k, which the bailing provider overrides to false.
# Not open-weights as of 2026-11-08 (no checkpoint on https://huggingface.co/inclusionAI).
# Input stays generic: the API docs name text/image/video input but no formats
# (https://developer.ant-ling.com/zh-CN/docs/api-reference/chat/openai).
schema = 2
name = "Ling 3.2 Flash"
description = "Native multimodal MoE model with 560B total and 25B active parameters for complex visual understanding, multimodal agents, 3D interaction, and medical imaging"
family = "ling"
open_weights = false
release_date = "2026-11-05"

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_000_000
output = 32_768
