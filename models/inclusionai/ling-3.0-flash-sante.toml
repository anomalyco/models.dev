# https://vercel.com/changelog/ling-3-0-flash-sante-is-now-available-on-ai-gateway-for-free
# https://novita.ai/models/model-detail/inclusionai-ling-3.0-flash-sante
# The open Ling backbone does not establish that Sante's medical fine-tune has public weights.
# Sampling: no Sante-specific docs; this is a fine-tune of Ling 3.0 Flash, whose model card recommends temperature,
#   top_p and top_k (https://huggingface.co/inclusionAI/Ling-3.0-flash).
schema = 2
name = "Ling 3.0 Flash Sante"
description = "Health and medicine specialization of Ling 3.0 Flash for medical reasoning and evidence-based retrieval"
family = "ling"
open_weights = false
release_date = "2026-09-04"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 262_144
output = 32_768
