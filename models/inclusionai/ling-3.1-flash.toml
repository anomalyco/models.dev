# Open weights: MIT-licensed checkpoint published 2026-10-13 at https://huggingface.co/inclusionAI/Ling-3.1-flash.
# Sampling: open weights; the model card recommends temperature, top_p and top_k (temperature=1.0, top_p=0.95, top_k=20)
#   (https://huggingface.co/inclusionAI/Ling-3.1-flash).
schema = 2
name = "Ling 3.1 Flash"
description = "Efficient model for low-latency assistance, extraction, and routine automation"
family = "ling"
open_weights = true
release_date = "2026-09-29"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 262_144
output = 32_768
