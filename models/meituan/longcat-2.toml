name = "LongCat 2"
description = "A large-scale MoE language model trained on AI ASIC SuperPods"
attachment = false           # or false - supports file attachments
reasoning = false           # or true - supports reasoning / chain-of-thought
tool_call = true            # or false - supports tool calling
structured_output = false    # or false - supports a dedicated structured output feature
temperature = true          # or false - supports temperature control
knowledge = "2024-04"       # Knowledge-cutoff date
release_date = "2026-06-30" # First public release date
last_updated = "2025-06-30" # Most recent update date
open_weights = true         # or false  - model’s trained weights are publicly available

[cost]
input = 0.75                # Cost per million input tokens (USD)
output = 2.95              # Cost per million output tokens (USD)
reasoning = 2.95           # Cost per million reasoning tokens (USD)
cache_read = 0.015           # Cost per million cached read tokens (USD)

[limit]
context = 1_000_000           # Maximum context window (tokens)
input = 1_000_000             # Maximum input tokens
output = 384_000              # Maximum output tokens

[modalities]
input = ["text"]   # Supported input modalities
output = ["text"]           # Supported output modalities

[interleaved]
field = "reasoning_content" # Name of the interleaved field "reasoning_content" or "reasoning_details"
