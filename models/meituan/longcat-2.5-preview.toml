# https://longcat.chat/platform/docs/change-log
# https://longcat.chat/platform/docs/
schema = 2
name = "LongCat-2.5-Preview"
description = "Meituan's multimodal reasoning model for coding and agent tasks, with image understanding and a 1M-token context window"
family = "longcat"
open_weights = false
release_date = "2026-09-25"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_000_000
output = 131_072
