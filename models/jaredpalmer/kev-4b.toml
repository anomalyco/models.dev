# Source: https://huggingface.co/jaredpalmer/kev-4b (model card, accessed 2026-10-20).
# Kev 1.0, first published 2026-09-24: a LoRA adapter and pointer head on Qwen3.5-4B-Base that
# returns a probability per option and generates no text, so output is 0. States of up to
# 65,536 tokens are served; the card validates accuracy to 8,192. English only.
schema = 2
v2_only = true
type = "decision"
name = "Kev 4B"
description = "Jared Palmer's open-weight 4B decision model that returns calibrated probabilities for typed choice, score and yes/no questions about a text or JSON state"
open_weights = true
release_date = "2026-09-24"
license = "Apache-2.0"

[modalities]
input = ["text"]
output = ["decision"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 65_536
output = 0

