# Lab metadata carried over from providers/openrouter/models/nousresearch/hermes-4-405b.toml (curated catalogue data already in this repo),
# with provider-specific fields (cost, reasoning_options, status) stripped.
# Sampling: open weights; temperature, top_p and top_k are standard sampling controls for this checkpoint
#   (the model card recommends temperature=0.6, top_p=0.95, top_k=20: https://huggingface.co/NousResearch/Hermes-4-405B).
# Tools: the model card's "Function Calling & Tool Use" section documents tool calls emitted as
#   <tool_call>{...}</tool_call>, with tool definitions read from the request's tools field via the chat template
#   (https://huggingface.co/NousResearch/Hermes-4-405B, accessed 2026-10-20).
schema = 2
name = "Hermes 4 405B"
description = "Reasoning model for deliberate analysis, multi-step problem solving, and tool use"
family = "hermes"
open_weights = true
knowledge = "2024-08-31"
release_date = "2025-08-26"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 131_072
output = 117_964
