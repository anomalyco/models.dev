# Published May 2023 (MIT, 512-token input): https://huggingface.co/intfloat/e5-large-v2
# Paper: https://arxiv.org/abs/2212.03533
schema = 2
v2_only = true
type = "embedding"
name = "E5 Large v2"
description = "English text embedding model for retrieval and semantic similarity"
open_weights = true
