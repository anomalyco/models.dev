# Lab metadata for a model hosted by several providers (OpenUncensored, NanoGPT, Venice, ...),
# carried over from the existing curated provider entries in this repo; provider fields stripped.
# Sampling: temperature only, as the maker's own entry authors it (providers/abliteration-ai/models/abliterated-model.toml).
# Source: abliteration.ai's own model, served on its API (https://abliteration.ai)
# Limits are the maker's: a shared 262,144-token context with up to 262,134 output tokens
#   (https://docs.abliteration.ai/models, accessed 2026-11-26); hosts with smaller caps override them.
# Weights: not published; the maker lists API model IDs only and has no Hugging Face repo, so open_weights is false.
schema = 2
name = "Abliterated Model"
description = "Multimodal model for analyzing text, images, documents, and rich media"
open_weights = false
release_date = "2026-01-06"
last_updated = "2026-07-28"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = false
top_k = false

[limit]
context = 262_144
input = 262_144
output = 262_134
