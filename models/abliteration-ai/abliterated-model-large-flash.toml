# Lab metadata for a model hosted by several providers (OpenUncensored, NanoGPT, Venice, ...).
# Name, description and release date as the maker's own entry, providers/abliteration-ai/models/abliterated-model-large-flash.toml;
# capabilities from the curated provider entries in this repo (provider fields stripped).
# Sampling: temperature only, as this maker's own API entries author it (providers/abliteration-ai/models/*.toml); the base model is DeepSeek V4.1-Flash-1017
# (https://docs.abliteration.ai/models). Limits are the maker's: a shared 1,048,576-token context with
# up to 262,144 output tokens (https://docs.abliteration.ai/models); hosts with smaller caps override them.
# Image types: https://docs.abliteration.ai/capabilities/images (as models/abliteration-ai/abliterated-model.toml).
# Source: abliteration.ai's own model, served on its API (https://abliteration.ai)
schema = 2
name = "Abliterated Model Large Flash"
description = "DeepSeek-V4.1-Flash model abliterated and finetuned for cyber, ML red teaming, and agent testing"
open_weights = false
release_date = "2026-10-23"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = false
top_k = false

[limit]
context = 1_048_576
input = 1_048_576
output = 262_144
