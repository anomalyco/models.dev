# Lab metadata for a model hosted by several providers (Open Uncensored, NanoGPT, Venice, ...),
# Name, description, limits and capabilities from the curated provider entries in this repo (provider fields
# stripped). Sampling: temperature only, as this maker's own API entries author it
# (providers/abliteration-ai/models/*.toml); the base model is DeepSeek V4.1-Flash-1017
# (https://docs.abliteration.ai/models).
# Source: abliteration.ai's own model, served on its API (https://abliteration.ai)
schema = 2
name = "Abliterated Large Flash"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"
open_weights = false
release_date = "2026-10-23"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = false
top_k = false

[limit]
context = 1_000_000
output = 131_072
