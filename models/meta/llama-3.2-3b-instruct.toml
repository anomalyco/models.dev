# Model card: https://github.com/meta-llama/llama-models/blob/main/models/llama3_2/MODEL_CARD.md (mirrored at
# https://build.nvidia.com/meta/llama-3.2-3b-instruct): released September 25, 2024; text only; 128k context
# ("Context Length: 131,072 tokens", "Function Calling: Supported" on NVIDIA's card); pre-training cutoff December 2023.
# No separate output cap is published, so output = context.
# Sampling: open weights, so temperature/top_p/top_k are runtime features of the host.
schema = 2
name = "Llama 3.2 3B Instruct"
description = "Small instruction-tuned Llama model for multilingual dialogue and agentic retrieval"
family = "llama"
open_weights = true
knowledge = "2023-12"
release_date = "2024-09-25"
license = "Llama 3.2 Community License"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 131_072
output = 131_072

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/meta-llama/Llama-3.2-3B-Instruct"
