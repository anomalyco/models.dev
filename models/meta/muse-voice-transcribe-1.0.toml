# Released 2026-09-01: https://research.meta.ai/blog/introducing-muse-voice-transcribe
# https://dev.meta.ai/docs/speech-to-text
# Input formats: the common list in OpenRouter's speech-to-text docs (the lab lists none here):
#   https://openrouter.ai/docs/guides/overview/multimodal/stt
schema = 2
v2_only = true
type = "transcription"
name = "Muse Voice Transcribe 1.0"
description = "Speech-to-text model with speaker diarization and endpointing"
family = "muse"
open_weights = false
release_date = "2026-09-01"

[modalities]
input = ["audio/wav", "audio/mpeg", "audio/flac", "audio/mp4", "audio/ogg", "audio/webm", "audio/aac"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
