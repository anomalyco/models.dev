type = "model_card"

[[links]]
label = "Developer docs"
url = "https://dev.meta.ai/docs/muse-spark-open"
type = "docs"

[[links]]
label = "License"
url = "https://huggingface.co/meta-models/Muse-Spark-Open-816B-A42B/blob/main/LICENSE.md"
type = "license"

