# Sources (accessed 2026-10-15):
# https://research.meta.ai/blog/muse-spark-open (816B total/42B active, 1M context, released Oct 15 2026, coding/agentic)
# https://huggingface.co/meta-models/Muse-Spark-Open-816B-A42B (1M context, Input Text+Image+Video+Audio/Output Text, reasoning effort low/medium/high/xhigh default xhigh, temp 1.0, tool calling, Muse Model License, release Oct 15 2026)
# https://huggingface.co/blog/meta-muse-spark-open (inputs text/images/audio/video, output text, knowledge cutoff 2026-01-04, reasoning cannot be disabled, tool calling)
# https://dev.meta.ai/models/muse-spark-open/ (takes text, image, video and audio input, 1M context, 816B/42B)
# https://openrouter.ai/meta/muse-spark-open/llms.txt (temperature, tools, response_format, reasoning_effort accepted)
# Output 131072 follows Muse Spark 1.2/1.3 lab convention (1M context / 131K output); no separate first-party max-output doc found for Open yet.
name = "Muse Spark Open"
description = "Muse Spark Open is an 816B total / 42B active open-weight multimodal reasoning model from Meta for coding and long-horizon agentic work, with 1M-token context."
family = "muse"
release_date = "2026-10-15"
last_updated = "2026-10-15"
attachment = true
reasoning = true
tool_call = true
temperature = true
structured_output = true
knowledge = "2026-01-04"
open_weights = true
license = "Muse Model License"

[limit]
context = 1_048_576
output = 131_072

[modalities]
input = ["text", "image", "video", "audio"]
output = ["text"]

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/meta-models/Muse-Spark-Open-816B-A42B"

[[links]]
label = "Announcement"
url = "https://research.meta.ai/blog/muse-spark-open"
type = "announcement"

[[links]]
label = "Model card"
url = "https://huggingface.co/meta-models/Muse-Spark-Open-816B-A42B"
type = "model_card"
