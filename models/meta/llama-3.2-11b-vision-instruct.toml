# `image` stays generic: Meta publishes no image format list for Llama 3.2 Vision. Its vision guide
# (https://www.llama.com/docs/how-to-guides/vision-capabilities/) and model card name none, and Meta's API format lists
# (Llama API, Meta Model API) cover the models those APIs served (Llama 4, Muse).
schema = 2
name = "Llama-3.2-11B-Vision-Instruct"
description = "Open multimodal Llama model for image understanding, captioning, and visual QA"
family = "llama"
open_weights = true
knowledge = "2023-12"
release_date = "2024-09-25"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 128_000
output = 4_096

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/meta-llama/Llama-3.2-11B-Vision-Instruct"
