# Sources:
# https://research.meta.ai/blog/muse-ember (announcement, 2026-11-09; benchmark scores at max effort)
# https://dev.meta.ai/docs/muse-ember (context 1,048,576; max output 524,288; text, image, video, audio and PDF input)
# https://dev.meta.ai/docs/choose-a-model (same request body as Muse Spark and Muse Wonder)
# Meta has not published a knowledge cutoff.
# Sampling (temperature, top_p; no top_k): https://dev.meta.ai/docs/protocols/chat-completions, https://dev.meta.ai/docs/protocols/messages
# Image, video and audio MIME types: https://dev.meta.ai/docs/media-understanding (image/jpeg, image/png, image/gif, image/webp; video/mp4; audio/mpeg, audio/wav)
schema = 2
name = "Muse Ember"
description = "Muse Ember is Meta's smallest and most efficient reasoning model, built for the work agents repeat all day: tool calls, coding subtasks, routing, extraction, and long-document parsing. It pairs with Muse Wonder or Muse Spark, which plan while Muse Ember handles the volume."
family = "muse"
open_weights = false
release_date = "2026-11-09"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "video/mp4", "application/pdf", "audio/mpeg", "audio/wav"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = false

[limit]
context = 1_048_576
output = 524_288

[[links]]
label = "Announcement"
url = "https://research.meta.ai/blog/muse-ember"
type = "announcement"

