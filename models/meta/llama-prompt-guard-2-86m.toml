# Model card: https://github.com/meta-llama/PurpleLlama/blob/main/Llama-Prompt-Guard-2/86M/MODEL_CARD.md (covers 22M and 86M:
# base models, "Both Llama Prompt Guard 2 models support a 512-token context window"). Weights:
# https://huggingface.co/meta-llama/Llama-Prompt-Guard-2-86M (Llama 4 Community License, pipeline text-classification).
# Output 512: no generated text (a score), kept at the context size because lab files need an output limit.
# Released 2025-04-29 with Llama Guard 4 and LlamaFirewall: https://ai.meta.com/blog/llamacon-llama-news/
# (repository created 2025-04-28, Hugging Face API createdAt).
# A classifier: it returns a jailbreak / prompt-injection probability, not generated text, so it takes no sampling parameters.
schema = 2
name = "Llama Prompt Guard 2 86M"
description = "86M-parameter (mDeBERTa-base) multilingual classifier that detects prompt injection and jailbreak attempts"
family = "llama"
open_weights = true
release_date = "2025-04-29"
license = "Llama 4 Community License"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 512
output = 512

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/meta-llama/Llama-Prompt-Guard-2-86M"
