# Lab metadata carried over from providers/openrouter/models/morph/morph-v3-large.toml (curated catalogue data already in this repo),
# with provider-specific fields (cost, reasoning_options, status) stripped.
# Sampling: Morph's docs take temperature ("Always set temperature: 0 for Apply") and document no top_p or top_k
# (https://docs.morphllm.com/llms-full.txt).
schema = 2
name = "Morph V3 Large"
description = "Flagship model for demanding analysis, coding, and production agent workflows"
family = "morph"
open_weights = false
release_date = "2025-07-07"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = true
top_p = false
top_k = false

[limit]
context = 262_144
output = 131_072
