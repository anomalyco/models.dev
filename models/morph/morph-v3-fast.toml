# Lab metadata carried over from providers/openrouter/models/morph/morph-v3-fast.toml (curated catalogue data already in this repo),
# with provider-specific fields (cost, reasoning_options, status) stripped.
# Sampling: Morph's docs take temperature ("Always set temperature: 0 for Apply") and document no top_p or top_k
# (https://docs.morphllm.com/llms-full.txt).
# Limits: 262,144 context and 131,072 output (https://www.morphllm.com/api/models/json?prices=list, accessed 2026-10-25).
schema = 2
name = "Morph V3 Fast"
description = "Efficient model for low-latency assistance, extraction, and routine automation"
family = "morph"
open_weights = false
release_date = "2025-07-07"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = true
top_p = false
top_k = false

[limit]
context = 262_144
output = 131_072
