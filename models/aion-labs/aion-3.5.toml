# Lab metadata for a model hosted by several providers (Open Uncensored, NanoGPT, Venice, ...),
# carried over from the existing curated provider entries in this repo; provider fields stripped.
# Source: Aion Labs model (https://aionlabs.ai)
# Sampling: https://www.aionlabs.ai/docs/api-reference/ documents temperature only (no top_p or top_k),
# the same API as models/aion-labs/aion-3.0.toml.
schema = 2
name = "Aion 3.5"
description = "Reasoning model for deliberate analysis, multi-step problem solving, and tool use"
open_weights = false
release_date = "2026-09-23"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = false
top_k = false

[limit]
context = 262_144
output = 32_768
