# Lab metadata for a model hosted by several providers (Open Uncensored, NanoGPT, Venice, ...),
# carried over from the existing curated provider entries in this repo; provider fields stripped.
# Source: Aion Labs model (https://aionlabs.ai)
schema = 2
name = "Aion 3.5"
description = "Reasoning model for deliberate analysis, multi-step problem solving, and tool use"
open_weights = false
release_date = "2026-09-23"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = false
top_p = false
top_k = false

[limit]
context = 262_144
output = 32_768
