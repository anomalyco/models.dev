# Sampling follows the documented Aion API, which exposes temperature only: https://www.aionlabs.ai/docs/api-reference/.
# Model: https://www.aionlabs.ai/docs/models/
# Shared model metadata extracted from providers/openrouter/models/aion-labs/aion-3.5.toml.
# API controls, cache and prices are defined by each host.
schema = 2
name = "Aion 3.5"
description = "Reasoning model for deliberate analysis, multi-step problem solving, and tool use"
open_weights = false
release_date = "2026-09-23"

[modalities]
input = ["text"]
output = ["text"]

[limit]
context = 262144
output = 32768

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = false
top_k = false
