# Lab metadata carried over from providers/openrouter/models/aion-labs/aion-2.0.toml (curated catalogue data already in this repo),
# with provider-specific fields (cost, reasoning_options, status) stripped.
# Release date: the `date` field of https://api.aionlabs.ai/v1/models (2025-12-21).
# Sampling: https://www.aionlabs.ai/docs/api-reference/ documents temperature only (no top_p or top_k).
schema = 2
name = "Aion-2.0"
description = "Reasoning model for deliberate analysis, multi-step problem solving, and tool use"
open_weights = false
release_date = "2025-12-21"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = false
top_k = false

[limit]
context = 131_072
output = 32_768
