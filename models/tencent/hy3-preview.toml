# Sampling: open weights; generation_config.json sets temperature 0.9, top_p 1, top_k -1 and the model card
#   recommends temperature=0.9, top_p=1.0 (https://huggingface.co/tencent/Hy3-preview).
schema = 2
name = "Hy3 preview"
description = "Tencent Hy reasoning model for coding, instruction following, and agent tasks"
family = "Hy"
open_weights = true
release_date = "2026-04-20"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 256_000
output = 64_000

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/tencent/Hy3-preview"

[[benchmarks]]
name = "SWE-Bench Verified"
score = 74.4
metric = "resolved"
source = "https://huggingface.co/tencent/Hy3-preview"
