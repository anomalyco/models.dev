# Sampling: open weights; generation_config.json sets temperature 0.9, top_p 1, top_k -1 and the model card
#   recommends temperature=0.9, top_p=1.0 (https://huggingface.co/tencent/Hy4-preview).
# Context: config.json sets max_position_embeddings = 1048576
#   (https://huggingface.co/tencent/Hy4-preview/blob/main/config.json) and the model card lists 1M.
#   Tencent's TokenHub lists a 1024k context window (960k input, 64k output) for both hy4-preview and hy4
#   (https://cloud.tencent.com/document/product/1823/132252, accessed 2026-11-15); tencent/hy4 already uses 1_048_576.
schema = 2
name = "Hy4 preview"
description = "A next-generation productivity model with significantly enhanced Agent and complex task execution capabilities."
family = "Hy"
open_weights = true
release_date = "2026-08-28"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_048_576
output = 64_000
