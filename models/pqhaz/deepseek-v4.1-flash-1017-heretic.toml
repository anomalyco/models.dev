# Lab metadata for a model hosted by several providers (Open Uncensored, NanoGPT, Venice, ...),
# carried over from the existing curated provider entries in this repo; provider fields stripped.
# Source: https://huggingface.co/pqhaz/DeepSeek-V4.1-Flash-1017-heretic
schema = 2
name = "DeepSeek V4.1 Flash Heretic"
description = "pqhaz's Heretic checkpoint of DeepSeek V4.1 Flash 1017, served by Sable at original mixed precision (FP8 dense/Engram and MXFP4 experts). Supports text and image input, tools, structured output, and optional reasoning. Separate from the DeAlign uncensored checkpoint."
family = "deepseek"
open_weights = true
release_date = "2026-10-31"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 512_000
input = 512_000
output = 128_000
