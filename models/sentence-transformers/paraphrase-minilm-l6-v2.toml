# https://huggingface.co/sentence-transformers/paraphrase-MiniLM-L6-v2
# Released 2021-05-19: initial commit of the model repository (https://huggingface.co/sentence-transformers/paraphrase-MiniLM-L6-v2/commits/main)
# Context: max_seq_length 128 (https://huggingface.co/sentence-transformers/paraphrase-MiniLM-L6-v2/blob/main/sentence_bert_config.json);
#   384-dimensional output.
schema = 2
v2_only = true
type = "embedding"
name = "paraphrase-MiniLM-L6-v2"
description = "Sentence embedding model for paraphrase detection and semantic similarity"
open_weights = true
release_date = "2021-05-19"
license = "Apache-2.0"

[modalities]
input = ["text"]
output = ["embedding"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 128
output = 0

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/sentence-transformers/paraphrase-MiniLM-L6-v2"
