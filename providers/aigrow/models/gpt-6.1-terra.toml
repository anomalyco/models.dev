# Prices: https://aigrow.gg/ai-api, table "USD per million tokens", row "GPT-6.1 Terra" (read 2026-11-11): input $0.50, output $3.125, cache read $0.05, cache write $0.625. These are the USD a buyer pays per 1M tokens, copied with no conversion. One flat rate at every context length (no long-context tier); cache writes bill at 1.25x the input rate.
# API: OpenAI Chat Completions only (POST /v1/chat/completions); there is no Responses API.
# Effort: reasoning_effort is forwarded unchanged; levels as on providers/openai; each level returned 200 on this host (2026-11-11). A JSON schema response_format, a PNG image and a PDF file part all worked (probed 2026-11-11).
# Cache: automatic prefix caching; minimum copied from providers/openai.
# Tools: custom (freeform) tools do not reach the model on this host, so freeform is left out. Probed 2026-11-11 on Chat Completions with one custom tool per format (text, a regex grammar ZZ[0-9]{3}, the same grammar in lark): with tool_choice "required" each request returned 400 "Tool choice 'required' must be specified with 'tools' parameter", and with no tool_choice each returned 200 with no tool call and the model answering that the tool is not available.
schema = 2
base_model = "openai/gpt-6.1-terra"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = { min_tokens = 1_024 } }

[cost.text.input]
price = 0.5
cache = { read = 0.05, write = 0.625 }

[cost.text.output]
price = 3.125
