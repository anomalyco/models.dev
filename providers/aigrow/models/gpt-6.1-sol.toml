# Prices: https://aigrow.gg/ai-api (read 2026-11-11). One flat rate at every context length (no long-context tier); cache writes bill at 1.25x the input rate.
# API: OpenAI Chat Completions only (POST /v1/chat/completions); there is no Responses API.
# Effort: reasoning_effort is forwarded unchanged; levels as on providers/openai; each level returned 200 on this host (2026-11-11). A JSON schema response_format, a PNG image and a PDF file part all worked (probed 2026-11-11).
# Cache: automatic prefix caching; minimum copied from providers/openai.
# Tools: custom (freeform) tools were not probed on this host, so freeform is left out.
schema = 2
base_model = "openai/gpt-6.1-sol"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = { min_tokens = 1_024 } }

[cost.text.input]
price = 1
cache = { read = 0.1, write = 1.25 }

[cost.text.output]
price = 6.25
