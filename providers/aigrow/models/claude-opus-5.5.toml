# Prices: https://aigrow.gg/ai-api, table "USD per million tokens", row "Claude Opus 5.5" (read 2026-11-11): input $1.00, output $5.00, cache read $0.20, cache write $1.25. These are the USD a buyer pays per 1M tokens, copied with no conversion. Cache writes bill at 1.25x the input rate for the 5m and the 1h TTL alike.
# APIs: Anthropic Messages (POST /v1/messages) and OpenAI Chat Completions (POST /v1/chat/completions) on the same key: https://aigrow.gg/ai-api/guide
# Effort: output_config.effort (Messages) and reasoning_effort (Chat Completions) are forwarded unchanged; levels as on providers/anthropic; each level returned 200 on this host (2026-11-11).
# Cache: cache_control breakpoints are forwarded on Messages; TTLs, breakpoints and minimum copied from providers/anthropic.
# Mid-conversation flags, tool strict/search and fast mode are left unset: not tested on this host.
# Structured output: a JSON schema is enforced on Messages (output_config.format); on Chat Completions response_format returned JSON in a code fence, so the schema is not enforced there (probed 2026-11-11); the flag is per model and has to hold on every API listed, so it is false.
# Input: a PNG image and a PDF were read on both APIs (probed 2026-11-11). Context: a 580K-token prompt was accepted and the limit error names 1,000,000 tokens.
# Tools: a function tool returned a tool call with the right arguments on Chat Completions with tool_choice "auto" (probed 2026-11-11).
schema = 2
base_model = "anthropic/claude-opus-5-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = false
cache = { explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 512 } }

[api.messages]
base_url = "https://aigrow.gg/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[api.chat-completions]

[cost.text.input]
price = 1
cache = { read = 0.2, write = { "5m" = 1.25, "1h" = 1.25 } }

[cost.text.output]
price = 5
