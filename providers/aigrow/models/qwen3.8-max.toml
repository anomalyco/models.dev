# Prices: https://aigrow.gg/ai-api, price table "US dollars per million input / output tokens", row "Qwen3.8 Max", column "With AIGROW credit" (read 2026-11-16): input $1.00, output $3.00, cache read $0.125, cache write $1.25. These are the USD a buyer pays per 1M tokens, copied with no conversion. One flat rate at every context length; cache writes bill at 1.25x the input rate.
# API: OpenAI Chat Completions only (POST /v1/chat/completions); the Messages endpoint does not serve this model (404, probed 2026-11-16).
# Effort: reasoning_effort; levels as on providers/alibaba; low, medium and xhigh each returned 200 with reasoning tokens reported, and so did high, an alias of xhigh on providers/alibaba (2026-11-16). The reasoning comes back in reasoning_content, and an assistant turn sent back with its reasoning_content was accepted (200). No default is stated: this host's default was not confirmed.
# Cache: implicit prefix caching; minimum copied from providers/alibaba. A second identical 4,111-token prompt reported 4,096 cached tokens (probed 2026-11-16). Explicit cache_control breakpoints are left out: not tested on this host.
# Structured output: a JSON schema response_format returned bare JSON, also on a prompt that did not ask for JSON (probed 2026-11-16).
# Input: a PNG image was read. A PDF file part returned 502 on both of two attempts (2026-11-16), so PDF is left out; video is left out because it was not tested on this host.
# Tools: a function tool returned a tool call with the right arguments on Chat Completions with tool_choice "auto" (probed 2026-11-16).
# Streaming: with stream_options.include_usage the last chunk before [DONE] carried the usage (probed 2026-11-16).
schema = 2
base_model = "alibaba/qwen3.8-max"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "xhigh"] }
structured_output = true
stream_usage = true
cache = { implicit = { min_tokens = 1_024 } }

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1
cache = { read = 0.125, write = 1.25 }

[cost.text.output]
price = 3
