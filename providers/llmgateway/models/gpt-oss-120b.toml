# effort_updates = false, tools.updates = false: Chat Completions takes reasoning_effort per request and has no tool-change message (https://docs.llmgateway.io/features/reasoning)
schema = 2
base_model = "openai/gpt-oss-120b"
description = "Open-weight GPT model for self-hosted reasoning and instruction-following workloads"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
output = 32_766

[cost.text.input]
price = 0.032
cache = { read = 0.032 }

[cost.text.output]
price = 0.14
