# effort_updates = false, tools.updates = false: Chat Completions takes reasoning_effort per request and has no tool-change message (https://docs.llmgateway.io/features/reasoning)
schema = 2
name = "Llama 3.2 3B Instruct"
description = "Open Llama instruction model for multilingual chat, reasoning, and coding"
family = "llama"
open_weights = true
release_date = "2024-09-18"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = true
temperature = true

[limit]
context = 32_768
output = 32_000

[cost.text.input]
price = 0.03

[cost.text.output]
price = 0.05
