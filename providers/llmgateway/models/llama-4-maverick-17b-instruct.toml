# effort_updates = false, tools.updates = false: Chat Completions takes reasoning_effort per request and has no tool-change message (https://docs.llmgateway.io/features/reasoning)
schema = 2
base_model = "meta/llama-4-maverick-17b-instruct"
description = "Open multimodal Llama model for strong reasoning and fast responses"

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = false

[limit]
context = 1_048_576
output = 2_048

[cost.text.input]
price = 0.27

[cost.text.output]
price = 0.85
