# effort_updates = false, tools.updates = false: Chat Completions takes reasoning_effort per request and has no tool-change message (https://docs.llmgateway.io/features/reasoning)
# Output limit: no host-specific cap is documented, so output is capped at the context served here (the lab's raised cap would exceed it).
schema = 2
base_model = "moonshotai/kimi-k3"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[limit]
context = 1_040_384
output = 1_040_384

[cost.text.input]
price = 4.5
cache = { read = 0.45 }

[cost.text.output]
price = 22.5
