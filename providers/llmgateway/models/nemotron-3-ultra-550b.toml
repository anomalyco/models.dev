# Reasoning: no caller on/off control. The reasoning mapping (Nebius) is deactivated, and the remaining hosts get no thinking switch: the gateway drops reasoning_effort = "none" for them (theopenco/llmgateway@1a1791f packages/actions/src/prepare-request-body.ts).
# structured_output = false: /v1/models structured_outputs, strict json_schema (https://docs.llmgateway.io/learn/structured-outputs)
# effort_updates = false, tools.updates = false: Chat Completions takes reasoning_effort per request and has no tool-change message (https://docs.llmgateway.io/features/reasoning)
schema = 2
base_model = "nvidia/nemotron-3-ultra-550b-a55b"

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
structured_output = false

[limit]
context = 1_048_576

[cost.text.input]
price = 0.5
cache = { read = 0.1 }

[cost.text.output]
price = 2.2
