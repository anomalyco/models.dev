# Modalities: image formats from models/xai/grok-4.7.toml (same model)
# effort_updates = false, tools.updates = false: Chat Completions takes reasoning_effort per request and has no tool-change message (https://docs.llmgateway.io/features/reasoning)
schema = 2
base_model = "xai/grok-4.7"
description = "Grok model for agentic tool use, reasoning, coding, and live assistance"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh"] }
structured_output = false

[limit]
context = 524_288

[cost.text.input]
price = 2
cache = { read = 0.5 }

[cost.text.output]
price = 6
