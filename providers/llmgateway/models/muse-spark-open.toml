# Capabilities the catalog doesn't state (capabilities.structured_output) come from muse-spark-1.3, this host's previous model in the family.
schema = 2
base_model = "meta/muse-spark-open"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 1.25
cache = { read = 0.15 }

[cost.text.output]
price = 4.25
