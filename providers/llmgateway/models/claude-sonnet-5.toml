schema = 2
base_model = "anthropic/claude-sonnet-5"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[limit]
output = 1_000_000

[cost.text.input]
price = 2
cache = { read = 0.2, write = 2.5 }

[cost.text.output]
price = 10
