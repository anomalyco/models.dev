# Modalities: image formats from models/anthropic/claude-sonnet-5.toml (same model)
# system_updates = true: the gateway keeps later system messages in place on anthropic, aws-bedrock, azure-anthropic, vertex-anthropic (theopenco/llmgateway@1a1791f packages/actions/src/prepare-request-body.ts: Claude native or <system-reminder> user turn, Gemini user turn, OpenAI/xAI forwarded)
# effort_updates = false, tools.updates = false: Chat Completions takes reasoning_effort per request and has no tool-change message (https://docs.llmgateway.io/features/reasoning)
# Cache: the gateway adds cache_control by default (Automatic mode); explicit cache_control 5m/1h, 4 breakpoints (https://docs.llmgateway.io/features/caching/provider-cache-control); min_tokens = min_cacheable_tokens and 1h write = input_cache_write_1h on /v1/models
schema = 2
base_model = "anthropic/claude-sonnet-5"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
system_updates = true
effort_updates = false
cache = { implicit = true, explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, min_tokens = 4_096 } }

[limit]
output = 1_000_000

[cost.text.input]
price = 2
cache = { read = 0.2, write = { "5m" = 2.5, "1h" = 4 } }

[cost.text.output]
price = 10
