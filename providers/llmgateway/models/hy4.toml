# Capabilities the catalog doesn't state (capabilities.structured_output) come from hy4-preview, this host's previous model in the family.
schema = 2
base_model = "tencent/hy4"
base_model_omit = ["limit.input"]

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 0.834
cache = { read = 0.042 }

[cost.text.output]
price = 2.501
