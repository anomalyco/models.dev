# effort_updates = false, tools.updates = false: Chat Completions takes reasoning_effort per request and has no tool-change message (https://docs.llmgateway.io/features/reasoning)
schema = 2
name = "Kimi K2"
description = "Kimi model for long-context chat, coding, and agentic reasoning"
family = "kimi-k2"
open_weights = true
release_date = "2025-07-11"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = false }
structured_output = true
temperature = true
effort_updates = false

[limit]
context = 256_000
output = 16_384

[cost.text.input]
price = 0.57
cache = { read = 0.5 }

[cost.text.output]
price = 2.3
