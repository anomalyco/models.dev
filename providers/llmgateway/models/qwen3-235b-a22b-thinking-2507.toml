# Gateway-wide $.reasoning_effort = "none" (or $.reasoning.effort = "none")
# disables non-OpenAI reasoning; this model has no documented effort tiers
# or exact reasoning-token budget.
# https://docs.llmgateway.io/features/reasoning (accessed 2026-07-23)
schema = 2
name = "Qwen3 235B A22B Thinking (2507)"
description = "Qwen reasoning model for deliberate problem solving, math, and coding"
family = "qwen"
open_weights = true
release_date = "2025-07-08"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true }
structured_output = true
temperature = true

[limit]
context = 262_000
output = 8_192

[cost.text.input]
price = 0.3

[cost.text.output]
price = 3
