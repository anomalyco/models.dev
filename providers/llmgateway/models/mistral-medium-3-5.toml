# Modalities: image formats from models/mistral/mistral-medium-3-5.toml (same model)
# effort_updates = false, tools.updates = false: Chat Completions takes reasoning_effort per request and has no tool-change message (https://docs.llmgateway.io/features/reasoning)
schema = 2
base_model = "mistral/mistral-medium-3-5"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
structured_output = true

[limit]
output = 262_144

[cost.text.input]
price = 1.5

[cost.text.output]
price = 7.5
