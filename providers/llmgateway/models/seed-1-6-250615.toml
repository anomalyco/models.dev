# Modalities: image formats from models/bytedance-seed/seed-1-6-vision.toml (same model)
# effort_updates = false, tools.updates = false: Chat Completions takes reasoning_effort per request and has no tool-change message (https://docs.llmgateway.io/features/reasoning)
schema = 2
name = "Seed 1.6 (250615)"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"
family = "seed"
open_weights = true
release_date = "2025-06-25"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/tiff", "image/x-icon", "image/x-icns", "image/sgi", "image/jp2", "image/heic"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true
temperature = true
effort_updates = false

[limit]
context = 256_000
output = 8_192

[cost.text.input]
price = 0.25
cache = { read = 0.05 }

[cost.text.output]
price = 2
