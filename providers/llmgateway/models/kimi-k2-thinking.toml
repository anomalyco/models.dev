# structured_output = false: /v1/models structured_outputs, strict json_schema (https://docs.llmgateway.io/learn/structured-outputs)
# effort_updates = false, tools.updates = false: Chat Completions takes reasoning_effort per request and has no tool-change message (https://docs.llmgateway.io/features/reasoning)
# status = deprecated: deactivated_at 2026-10-21 on https://api.llmgateway.io/v1/models (accessed 2026-10-20)
schema = 2
base_model = "moonshotai/kimi-k2-thinking"
status = "deprecated"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
structured_output = false
effort_updates = false

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.6
cache = { read = 0.06 }

[cost.text.output]
price = 2.5
