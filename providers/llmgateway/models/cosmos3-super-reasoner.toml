# Gateway-wide $.reasoning_effort = "none" (or $.reasoning.effort = "none")
# disables non-OpenAI reasoning; this model has no documented effort tiers
# or exact reasoning-token budget.
# https://docs.llmgateway.io/features/reasoning (accessed 2026-07-23)
name = "Cosmos 3 Super Reasoner"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"
release_date = "2026-06-01"
last_updated = "2026-06-01"
attachment = true
reasoning = true
temperature = true
tool_call = true
structured_output = false
open_weights = false

[[reasoning_options]]
type = "toggle" # API: {"reasoning_effort": "none"} or {"reasoning": {"effort": "none"}}

[cost]
input = 0.1
output = 0.3

[limit]
context = 262_144
output = 262_144

[modalities]
input = ["text", "image"]
output = ["text"]
