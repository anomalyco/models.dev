# structured_output = true: /v1/models structured_outputs, strict json_schema (https://docs.llmgateway.io/learn/structured-outputs)
# system_updates = true: the gateway keeps later system messages in place on anthropic, azure-anthropic, aws-bedrock (theopenco/llmgateway@1a1791f packages/actions/src/prepare-request-body.ts: Claude native or <system-reminder> user turn, Gemini user turn, OpenAI/xAI forwarded)
# effort_updates = false, tools.updates = false: Chat Completions takes reasoning_effort per request and has no tool-change message (https://docs.llmgateway.io/features/reasoning)
# Cache: the gateway adds cache_control by default (Automatic mode); explicit cache_control 5m/1h, 4 breakpoints (https://docs.llmgateway.io/features/caching/provider-cache-control); min_tokens = min_cacheable_tokens and 1h write = input_cache_write_1h on /v1/models
schema = 2
base_model = "anthropic/claude-fable-5-1"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
system_updates = true
cache = { implicit = true, explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, min_tokens = 512 } }

[cost.text.input]
price = 10
cache = { read = 0.25, write = { "5m" = 12.5, "1h" = 20 } }

[cost.text.output]
price = 50
