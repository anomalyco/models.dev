# Gateway-wide $.reasoning_effort = "none" (or $.reasoning.effort = "none")
# disables non-OpenAI reasoning; this model has no documented effort tiers
# or exact reasoning-token budget.
# https://docs.llmgateway.io/features/reasoning (accessed 2026-07-23)
name = "Nemotron 3 Nano Omni"
description = "Omni-modal model for text, vision, audio, and multimodal agent tasks"
family = "nemotron"
release_date = "2026-04-28"
last_updated = "2026-04-28"
attachment = true
reasoning = true
temperature = true
tool_call = true
structured_output = false
open_weights = false

[[reasoning_options]]
type = "toggle" # API: {"reasoning_effort": "none"} or {"reasoning": {"effort": "none"}}

[cost]
input = 0.06
output = 0.24

[limit]
context = 262_144
output = 262_144

[modalities]
input = ["text", "image"]
output = ["text"]
