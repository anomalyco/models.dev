# effort_updates = false, tools.updates = false: Chat Completions takes reasoning_effort per request and has no tool-change message (https://docs.llmgateway.io/features/reasoning)
schema = 2
name = "GLM-4.5 AirX"
description = "Flagship GLM model for hybrid reasoning, coding, and agentic engineering"
family = "glm"
open_weights = false
release_date = "2025-07-28"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = false }
structured_output = true
temperature = true
effort_updates = false

[limit]
context = 128_000
output = 16_384

[cost.text.input]
price = 1.1
cache = { read = 0.22 }

[cost.text.output]
price = 4.5
