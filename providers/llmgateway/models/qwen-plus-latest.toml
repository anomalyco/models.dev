schema = 2
name = "Qwen Plus Latest"
description = "Qwen vision-language model for visual reasoning, documents, and agent tasks"
family = "qwen"
open_weights = false
release_date = "2025-01-25"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
structured_output = true
temperature = true

[limit]
context = 1_000_000
output = 8_192

[cost.text.input]
price = 0.4
cache = { read = 0.08, write = 0.5 }

[cost.text.output]
price = 1.2
