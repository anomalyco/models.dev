# MiniMax mapping lists $.reasoning_effort / $.reasoning.effort =
# low|medium|high|xhigh|max. No exact token budget documented.
# https://docs.llmgateway.io/features/reasoning (accessed 2026-07-23)
# https://api.llmgateway.io/v1/models providers[].reasoning_efforts (accessed 2026-07-23)
# structured_output = false: /v1/models structured_outputs, strict json_schema (https://docs.llmgateway.io/learn/structured-outputs)
# effort_updates = false, tools.updates = false: Chat Completions takes reasoning_effort per request and has no tool-change message (https://docs.llmgateway.io/features/reasoning)
schema = 2
base_model = "minimax/MiniMax-M2.7"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = false

[cost.text.input]
price = 0.08
cache = { read = 0.017, write = 0.375 }

[cost.text.output]
price = 0.32
