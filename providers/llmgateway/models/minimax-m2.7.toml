# MiniMax mapping lists $.reasoning_effort / $.reasoning.effort =
# low|medium|high|xhigh|max. No exact token budget documented.
# https://docs.llmgateway.io/features/reasoning (accessed 2026-07-23)
# https://api.llmgateway.io/v1/models providers[].reasoning_efforts (accessed 2026-07-23)
schema = 2
base_model = "minimax/MiniMax-M2.7"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 0.08
cache = { read = 0.017, write = 0.375 }

[cost.text.output]
price = 0.32
