# MiniMax mapping lists $.reasoning_effort / $.reasoning.effort =
# none|minimal|low|medium|high|xhigh|max. No exact token budget documented.
# https://docs.llmgateway.io/features/reasoning (accessed 2026-07-23)
# https://api.llmgateway.io/v1/models providers[].reasoning_efforts (accessed 2026-07-23)
# structured_output = true: /v1/models structured_outputs, strict json_schema (https://docs.llmgateway.io/learn/structured-outputs)
# effort_updates = false, tools.updates = false: Chat Completions takes reasoning_effort per request and has no tool-change message (https://docs.llmgateway.io/features/reasoning)
schema = 2
base_model = "minimax/MiniMax-M3"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 0.28
cache = { read = 0.05 }

[cost.text.output]
price = 1.1
