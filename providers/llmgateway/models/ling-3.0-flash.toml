# effort_updates = false, tools.updates = false: Chat Completions takes reasoning_effort per request and has no tool-change message (https://docs.llmgateway.io/features/reasoning)
schema = 2
base_model = "inclusionai/ling-3.0-flash"
name = "InclusionAI Ling 3.0 Flash"
description = "Efficient model for low-latency assistance, extraction, and routine automation"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none"] }
structured_output = false

[limit]
output = 262_144

[cost.text.input]
price = 0.06
cache = { read = 0.012 }

[cost.text.output]
price = 0.18
