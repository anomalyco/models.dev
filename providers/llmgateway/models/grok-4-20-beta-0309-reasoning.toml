# This model is restricted here to $.reasoning_effort or $.reasoning.effort
# = "low"|"medium"|"high"; no exact token budget is documented for it.
# https://docs.llmgateway.io/features/reasoning (accessed 2026-06-25)
schema = 2
base_model = "xai/grok-4.20-0309-reasoning"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
context = 2_000_000

[cost.text.input]
price = 2
cache = { read = 0.2 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 2.5
cache = { read = 0.4 }

[cost.text.output]
price = 6

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 5
