# This model is restricted here to $.reasoning_effort or $.reasoning.effort
# = "low"|"medium"|"high"; no exact token budget is documented for it.
# https://docs.llmgateway.io/features/reasoning (accessed 2026-06-25)
# system_updates = true: the gateway keeps later system messages in place on xai (theopenco/llmgateway@1a1791f packages/actions/src/prepare-request-body.ts: Claude native or <system-reminder> user turn, Gemini user turn, OpenAI/xAI forwarded)
# effort_updates = false, tools.updates = false: Chat Completions takes reasoning_effort per request and has no tool-change message (https://docs.llmgateway.io/features/reasoning)
schema = 2
base_model = "xai/grok-build-0.1"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
system_updates = true

[cost.text.input]
price = 1
cache = { read = 0.2 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 2
cache = { read = 0.4 }

[cost.text.output]
price = 2

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 4
