# system_updates = true: the gateway keeps later system messages in place on openai, azure, aws-mantle (theopenco/llmgateway@1a1791f packages/actions/src/prepare-request-body.ts: Claude native or <system-reminder> user turn, Gemini user turn, OpenAI/xAI forwarded)
# effort_updates = false, tools.updates = false: Chat Completions takes reasoning_effort per request and has no tool-change message (https://docs.llmgateway.io/features/reasoning)
# Cache: automatic, plus prompt_cache_options explicit mode with prompt_cache_breakpoint and optional 30m TTL on GPT-5.6+ (https://docs.llmgateway.io/features/caching/provider-cache-control)
schema = 2
base_model = "openai/gpt-5.6-sol"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
system_updates = true
effort_updates = false
cache = { implicit = true, explicit = { ttl = ["30m"] } }

[cost.text.input]
price = 4
cache = { read = 0.4, write = 5 }

[cost.text.output]
price = 20
