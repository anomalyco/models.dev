# effort_updates = false, tools.updates = false: Chat Completions takes reasoning_effort per request and has no tool-change message (https://docs.llmgateway.io/features/reasoning)
schema = 2
base_model = "alibaba/qwen3-vl-235b-a22b-thinking"
description = "Qwen vision-language model for visual reasoning, documents, and agent tasks"

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
structured_output = true

[limit]
output = 8_192

[cost.text.input]
price = 0.98

[cost.text.output]
price = 3.95
