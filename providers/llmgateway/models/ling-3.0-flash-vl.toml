# Modalities: image formats JPEG, PNG, WebP, GIF (https://docs.llmgateway.io/features/vision)
# effort_updates = false, tools.updates = false: Chat Completions takes reasoning_effort per request and has no tool-change message (https://docs.llmgateway.io/features/reasoning)
schema = 2
base_model = "inclusionai/ling-3.0-flash-vl"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
effort_updates = false

[limit]
context = 131_072
output = 131_072

[cost.text.input]
price = 0.06
cache = { read = 0.012 }

[cost.text.output]
price = 0.18
