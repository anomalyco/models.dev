# Capabilities the catalog doesn't state (capabilities.system_updates, capabilities.structured_output, capabilities.cache) come from gpt-6-astra, this host's previous model in the family.
schema = 2
base_model = "openai/gpt-6.2-astra"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
system_updates = true
structured_output = true
cache = { implicit = true, explicit = { ttl = ["30m"] } }

[cost.text.input]
price = 8
cache = { read = 0.4, write = 10 }

[cost.text.output]
price = 40
