# structured_output = true: /v1/models structured_outputs, strict json_schema (https://docs.llmgateway.io/learn/structured-outputs)
# effort_updates = false, tools.updates = []: Chat Completions takes reasoning_effort per request and has no tool-change message (https://docs.llmgateway.io/features/reasoning)
schema = 2
base_model = "xiaomi/mimo-v2.6-flash"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 0.133
cache = { read = 0.00266 }

[cost.text.output]
price = 0.266
