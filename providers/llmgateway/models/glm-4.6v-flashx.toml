# Toggle: $.reasoning_effort (or $.reasoning.effort) = "none" disables thinking; any other value enables it.
# On the Z.AI mapping the gateway sends thinking.type = "disabled"|"enabled" (theopenco/llmgateway@1a1791f packages/actions/src/prepare-request-body.ts, case "zai").
# Modalities: image formats from models/zhipuai/glm-4.6v.toml (same model)
# effort_updates = false, tools.updates = false: Chat Completions takes reasoning_effort per request and has no tool-change message (https://docs.llmgateway.io/features/reasoning)
schema = 2
name = "GLM-4.6V FlashX"
description = "GLM vision model for visual reasoning, documents, and multimodal agents"
family = "glm-flash"
open_weights = false
release_date = "2025-12-08"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true }
structured_output = true
temperature = true

[limit]
context = 128_000
output = 16_000

[cost.text.input]
price = 0.04
cache = { read = 0.004 }

[cost.text.output]
price = 0.4
