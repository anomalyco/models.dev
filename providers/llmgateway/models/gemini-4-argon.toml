# Modalities: audio formats from models/google/gemini-4-argon.toml (same model)
# system_updates = true: the gateway keeps later system messages in place on google-ai-studio, google-vertex (theopenco/llmgateway@1a1791f packages/actions/src/prepare-request-body.ts: Claude native or <system-reminder> user turn, Gemini user turn, OpenAI/xAI forwarded)
# effort_updates = false, tools.updates = false: Chat Completions takes reasoning_effort per request and has no tool-change message (https://docs.llmgateway.io/features/reasoning)
schema = 2
base_model = "google/gemini-4-argon"
description = "Gemini multimodal model for text, image, audio, video, and document tasks"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "audio/wav", "audio/mp3", "audio/aiff", "audio/aac", "audio/ogg", "audio/flac", "audio/mpeg", "audio/m4a", "audio/l16", "audio/opus", "audio/alaw", "audio/mulaw", "audio/webm"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["high"] }
structured_output = true
system_updates = true
effort_updates = false

[limit]
output = 1_048_576

[cost.text.input]
price = 4
cache = { read = 0.2, write = 0.375 }

[cost.text.output]
price = 20
