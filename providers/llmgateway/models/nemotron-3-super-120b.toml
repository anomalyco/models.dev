# Gateway-wide $.reasoning_effort = "none" (or $.reasoning.effort = "none")
# disables non-OpenAI reasoning; this model has no documented effort tiers
# or exact reasoning-token budget.
# https://docs.llmgateway.io/features/reasoning (accessed 2026-07-23)
name = "Nemotron 3 Super 120B"
description = "Nemotron model for efficient reasoning, coding, and specialized AI agents"
family = "nemotron"
release_date = "2026-03-11"
last_updated = "2026-03-11"
attachment = false
reasoning = true
temperature = true
tool_call = true
structured_output = false
open_weights = false

[[reasoning_options]]
type = "toggle" # API: {"reasoning_effort": "none"} or {"reasoning": {"effort": "none"}}

[cost]
input = 0.3
output = 0.9

[limit]
context = 262_144
output = 262_144

[modalities]
input = ["text"]
output = ["text"]
