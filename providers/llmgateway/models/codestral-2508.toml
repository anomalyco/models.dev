schema = 2
name = "Codestral"
description = "Mistral coding model for code completion, generation, and developer workflows"
family = "mistral"
open_weights = true
release_date = "2025-07-30"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = true
temperature = true

[limit]
context = 256_000
output = 16_384

[cost.text.input]
price = 0.3

[cost.text.output]
price = 0.9
