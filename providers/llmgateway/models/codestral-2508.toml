# effort_updates = false, tools.updates = false: Chat Completions takes reasoning_effort per request and has no tool-change message (https://docs.llmgateway.io/features/reasoning)
schema = 2
base_model = "mistral/codestral-2508"
name = "Codestral"
description = "Mistral coding model for code completion, generation, and developer workflows"

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = true
effort_updates = false

[limit]
context = 256_000
output = 16_384

[cost.text.input]
price = 0.3

[cost.text.output]
price = 0.9
