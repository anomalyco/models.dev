# Z.AI mapping lists $.reasoning_effort / $.reasoning.effort = high|max.
# Gateway-wide $.reasoning_effort = "none" (or $.reasoning.effort = "none")
# disables non-OpenAI reasoning.
# https://docs.llmgateway.io/features/reasoning (accessed 2026-07-23)
# https://api.llmgateway.io/v1/models providers[].reasoning_efforts (accessed 2026-07-23)
base_model = "zhipuai/glm-5.2"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["none", "minimal", "low", "medium", "high", "xhigh", "max"]

[cost]
input = 0.55
output = 1.784
cache_read = 0.111
cache_write = 0

[limit]
context = 1_048_576
