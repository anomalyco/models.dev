# Toggle: any $.reasoning_effort value turns thinking on; omitting it (or "none", which the gateway drops here) leaves it off.
# The Novita mapping (requiresEnableThinking) receives chat_template_kwargs.thinking = true instead of reasoning_effort
# (theopenco/llmgateway@1a1791f packages/actions/src/prepare-request-body.ts; packages/models/src/models/deepseek.ts).
# Modalities: image formats JPEG, PNG, WebP, GIF (https://docs.llmgateway.io/features/vision)
# effort_updates = false, tools.updates = false: Chat Completions takes reasoning_effort per request and has no tool-change message (https://docs.llmgateway.io/features/reasoning)
schema = 2
base_model = "deepseek/deepseek-v3.2"
description = "DeepSeek chat model for instruction following, coding, and analysis"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
context = 163_840
output = 16_384

[cost.text.input]
price = 0.26
cache = { read = 0.13 }

[cost.text.output]
price = 0.38
