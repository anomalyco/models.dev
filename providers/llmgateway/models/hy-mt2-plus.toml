# effort_updates = false, tools.updates = false: Chat Completions takes reasoning_effort per request and has no tool-change message (https://docs.llmgateway.io/features/reasoning)
schema = 2
name = "Hy-MT2 Plus"
description = "Tool-capable chat model for instruction following and agentic application workflows"
family = "Hy"
open_weights = false
release_date = "2026-05-21"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = false }
structured_output = false
temperature = true
effort_updates = false

[limit]
context = 8_192
output = 8_192

[cost.text.input]
price = 0.074

[cost.text.output]
price = 0.295
