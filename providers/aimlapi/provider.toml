# Every model is served on POST /v1/chat/completions (@ai-sdk/openai-compatible).
# Per-model request schema: https://api.aimlapi.com/docs-json?model=<id>&endpoint=openai/chat-completions
# - effort_updates, tools.updates and system_updates are left out (false): the schema has a
#   per-request reasoning_effort and tools array, no configuration_update or tool-change
#   message, and AI/ML API doesn't document where a mid-conversation system message ends up.
# - capabilities.cache: the schema lists cache_control (5m/1h) on every model, including
#   ones whose upstream has no explicit caching, so on its own it isn't evidence. Explicit
#   5m/1h caching is set only where the chat-completions catalog row (/v1/models?include=pricing)
#   also prices cache writes at both TTLs (cache_write, cache_write_1h): the Claude models.
# - Cache write prices come from the catalog: one per TTL in cost.text.input.cache.write
#   on those Claude files, and a single write price elsewhere (cache_write).
name = "AI/ML API"
env = ["AIMLAPI_API_KEY"]
npm = "@ai-sdk/openai-compatible"
opencodeai = "@opencode/ai/providers/openai-compatible"
api = "https://api.aimlapi.com/v1"
doc = "https://docs.aimlapi.com"
