# Mid-conversation: served on POST /v1/chat/completions, where reasoning_effort and tools are per-request fields; the request schema has no per-turn effort or tool-change message (effort_updates = false, tools.updates = false). https://api.aimlapi.com/docs-json?model=inception%2Fmercury-2&endpoint=openai%2Fchat-completions
schema = 2
base_model = "inception/mercury-2"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
effort_updates = false
tools = { supported = true, updates = false }

[cost.text.input]
price = 0.34385
cache = { read = 0.034385 }

[cost.text.output]
price = 1.03155
