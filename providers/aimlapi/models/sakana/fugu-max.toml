# Mid-conversation: served on POST /v1/chat/completions, where reasoning_effort and tools are per-request fields; the request schema has no per-turn effort or tool-change message (effort_updates = false, tools.updates = false). https://api.aimlapi.com/docs-json?model=sakana%2Ffugu-max&endpoint=openai%2Fchat-completions
schema = 2
base_model = "sakana/fugu-max"

[capabilities]
reasoning = { supported = true, effort = ["high"] }
structured_output = true
effort_updates = false
tools = { supported = true, updates = false }

[cost.text.input]
price = 2.116
cache = { read = 0.2645 }

[cost.text.output]
price = 6.348
