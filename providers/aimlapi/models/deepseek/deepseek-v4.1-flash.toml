# Mid-conversation: served on POST /v1/chat/completions, where reasoning_effort and tools are per-request fields; the request schema has no per-turn effort or tool-change message (effort_updates = false, tools.updates = false). https://api.aimlapi.com/docs-json?model=deepseek%2Fdeepseek-v4.1-flash&endpoint=openai%2Fchat-completions
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "high"] }
structured_output = true
effort_updates = false
tools = { supported = true, updates = false }

[limit]
context = 1_048_576

[cost.text.input]
price = 0.39
cache = { read = 0.0078 }

[cost.text.output]
price = 1.56
