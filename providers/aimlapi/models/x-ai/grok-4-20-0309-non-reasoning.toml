# Mid-conversation: served on POST /v1/chat/completions, where reasoning_effort and tools are per-request fields; the request schema has no per-turn effort or tool-change message (effort_updates = false, tools.updates = false). https://api.aimlapi.com/docs-json?model=x-ai%2Fgrok-4-20-0309-non-reasoning&endpoint=openai%2Fchat-completions
schema = 2
base_model = "xai/grok-4.20-0309-non-reasoning"
name = "Grok 4.20 Non-Reasoning"

[capabilities]
structured_output = true
effort_updates = false
tools = { supported = true, updates = false }

[limit]
context = 2_000_000
output = 1_999_000

[cost.text.input]
price = 1.25
cache = { read = 0.2 }

[cost.text.output]
price = 2.5
