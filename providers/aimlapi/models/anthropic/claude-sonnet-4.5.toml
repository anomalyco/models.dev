# No caller control: reasoning_effort is validated (invalid value -> 400) but low/high
# do not order reasoning tokens; toggle/budget fields are dropped by the gateway.
# Cache: the chat-completions catalog row prices cache writes at 5m (cache_write) and 1h (cache_write_1h), and the request schema takes cache_control { type: ephemeral, ttl: 5m | 1h }. https://api.aimlapi.com/v1/models?include=pricing,modalities
schema = 2
base_model = "anthropic/claude-sonnet-4-5"
name = "Claude 4.5 Sonnet"

[capabilities]
reasoning = { supported = true }
tools = { supported = true }
cache = { explicit = { ttl = ["5m", "1h"] } }

[cost.text.input]
price = 3.174
cache = { read = 0.3174, write = { "5m" = 3.9675, "1h" = 6.348 } }

[cost.text.output]
price = 15.87
