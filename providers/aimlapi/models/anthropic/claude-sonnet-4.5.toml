# No caller control: reasoning_effort is validated (invalid value -> 400) but low/high
# do not order reasoning tokens; toggle/budget fields are dropped by the gateway.
# Mid-conversation: served on POST /v1/chat/completions, where reasoning_effort and tools are per-request fields; the request schema has no per-turn effort or tool-change message (effort_updates = false, tools.updates = false). https://api.aimlapi.com/docs-json?model=anthropic%2Fclaude-sonnet-4.5&endpoint=openai%2Fchat-completions
# system_updates = false: the lab's own API keeps no mid-conversation system message for this closed-weight model (system_updates = false in its first-party file here), so a relay can't keep one in place.
# Cache: the chat-completions catalog row prices cache writes at 5m (cache_write) and 1h (cache_write_1h), and the request schema takes cache_control { type: ephemeral, ttl: 5m | 1h }. https://api.aimlapi.com/v1/models?include=pricing,modalities
schema = 2
base_model = "anthropic/claude-sonnet-4-5"
name = "Claude 4.5 Sonnet"

[capabilities]
reasoning = { supported = true }
system_updates = false
effort_updates = false
tools = { supported = true, updates = false }
cache = { supported = true, explicit = { ttl = ["5m", "1h"] } }

[cost.text.input]
price = 4.1262
cache = { read = 0.41262, write = { "5m" = 5.15775, "1h" = 8.2524 } }

[cost.text.output]
price = 20.631
