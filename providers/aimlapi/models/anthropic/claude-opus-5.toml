# Mid-conversation: served on POST /v1/chat/completions, where reasoning_effort and tools are per-request fields; the request schema has no per-turn effort or tool-change message (effort_updates = false, tools.updates = false). https://api.aimlapi.com/docs-json?model=anthropic%2Fclaude-opus-5&endpoint=openai%2Fchat-completions
schema = 2
base_model = "anthropic/claude-opus-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
effort_updates = false
tools = { supported = true, updates = false }

[cost.text.input]
price = 6.5
cache = { read = 0.65 }

[cost.text.output]
price = 32.5
