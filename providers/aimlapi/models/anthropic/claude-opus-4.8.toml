# Off: reasoning_effort = none (0 reasoning tokens); no toggle field on this surface.
# Mid-conversation: served on POST /v1/chat/completions, where reasoning_effort and tools are per-request fields; the request schema has no per-turn effort or tool-change message (effort_updates = false, tools.updates = false). https://api.aimlapi.com/docs-json?model=anthropic%2Fclaude-opus-4.8&endpoint=openai%2Fchat-completions
schema = 2
base_model = "anthropic/claude-opus-4-8"
name = "Claude 4.8 Opus"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
effort_updates = false
tools = { supported = true, updates = false }

[cost.text.input]
price = 6.877
cache = { read = 0.6877 }

[cost.text.output]
price = 34.385
