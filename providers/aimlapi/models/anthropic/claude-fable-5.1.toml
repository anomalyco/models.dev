# Mid-conversation: served on POST /v1/chat/completions, where reasoning_effort and tools are per-request fields; the request schema has no per-turn effort or tool-change message (effort_updates = false, tools.updates = false). https://api.aimlapi.com/docs-json?model=anthropic%2Fclaude-fable-5.1&endpoint=openai%2Fchat-completions
schema = 2
base_model = "anthropic/claude-fable-5-1"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
effort_updates = false
tools = { supported = true, updates = false }

[cost.text.input]
price = 13
cache = { read = 0.325 }

[cost.text.output]
price = 65
