# Mid-conversation: served on POST /v1/chat/completions, where reasoning_effort and tools are per-request fields; the request schema has no per-turn effort or tool-change message (effort_updates = false, tools.updates = false). https://api.aimlapi.com/docs-json?model=thinkingmachines%2Finkling-small&endpoint=openai%2Fchat-completions
schema = 2
base_model = "thinkingmachines/inkling-small"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
effort_updates = false
tools = { supported = true, updates = false }

[limit]
context = 524_288
output = 262_144

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_details" }

[cost.text.input]
price = 0.61364
cache = { read = 0.122728 }

[cost.text.output]
price = 1.52352
