# Mid-conversation: served on POST /v1/chat/completions, where reasoning_effort and tools are per-request fields; the request schema has no per-turn effort or tool-change message (effort_updates = false, tools.updates = false). https://api.aimlapi.com/docs-json?model=thinkingmachines%2Finkling&endpoint=openai%2Fchat-completions
schema = 2
base_model = "thinkingmachines/inkling"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
effort_updates = false
tools = { supported = true, updates = false }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_details" }

[cost.text.input]
price = 1.058
cache = { read = 0.17986 }

[cost.text.output]
price = 4.2849
