# No caller control: reasoning_effort is not read (an invalid value returns 200),
# and toggle/budget fields are dropped by the gateway (unknown top-level keys -> 200).
# Mid-conversation: served on POST /v1/chat/completions, where reasoning_effort and tools are per-request fields; the request schema has no per-turn effort or tool-change message (effort_updates = false, tools.updates = false). https://api.aimlapi.com/docs-json?model=google%2Fgemma-4-26b-a4b-it&endpoint=openai%2Fchat-completions
schema = 2
base_model = "google/gemma-4-26b-a4b-it"

[capabilities]
reasoning = { supported = true }
structured_output = true
effort_updates = false
tools = { supported = true, updates = false }

[limit]
output = 128_000

[cost.text.input]
price = 0.20631
cache = { read = 0.20631 }

[cost.text.output]
price = 0.82524
