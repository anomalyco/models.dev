# and toggle/budget fields are dropped by the gateway (unknown top-level keys -> 200).
schema = 2
base_model = "google/gemma-4-26b-a4b-it"

[capabilities]
reasoning = { supported = true }
structured_output = true

[limit]
output = 128_000

[cost.text.input]
price = 0.20631
cache = { read = 0.20631 }

[cost.text.output]
price = 0.82524
