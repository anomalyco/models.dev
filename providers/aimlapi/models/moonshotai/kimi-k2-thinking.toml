# No caller control: reasoning_effort is validated (invalid value -> 400) but low/high
# do not order reasoning tokens; toggle/budget fields are dropped by the gateway.
# Mid-conversation: served on POST /v1/chat/completions, where reasoning_effort and tools are per-request fields; the request schema has no per-turn effort or tool-change message (effort_updates = false, tools.updates = false). https://api.aimlapi.com/docs-json?model=moonshotai%2Fkimi-k2-thinking&endpoint=openai%2Fchat-completions
schema = 2
base_model = "moonshotai/kimi-k2-thinking"

[capabilities]
reasoning = { supported = true }
effort_updates = false
tools = { supported = true, updates = false }

[limit]
output = 98_304

[cost.text.input]
price = 0.82524
cache = { read = 0.20631 }

[cost.text.output]
price = 3.4385
