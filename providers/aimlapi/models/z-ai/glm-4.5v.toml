# No caller control: reasoning_effort is validated (invalid value -> 400) but low/high
# do not order reasoning tokens; toggle/budget fields are dropped by the gateway.
# Mid-conversation: served on POST /v1/chat/completions, where reasoning_effort and tools are per-request fields; the request schema has no per-turn effort or tool-change message (effort_updates = false, tools.updates = false). https://api.aimlapi.com/docs-json?model=z-ai%2Fglm-4.5v&endpoint=openai%2Fchat-completions
schema = 2
base_model = "zhipuai/glm-4.5v"
name = "GLM 4.5V"

[capabilities]
reasoning = { supported = true }
effort_updates = false
tools = { supported = true, updates = false }

[limit]
context = 65_536

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_details" }

[cost.text.input]
price = 0.6348
cache = { read = 0.11638 }

[cost.text.output]
price = 1.9044
