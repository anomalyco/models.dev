# No caller control: reasoning_effort is not read (an invalid value returns 200),
# and toggle/budget fields are dropped by the gateway (unknown top-level keys -> 200).
# Mid-conversation: served on POST /v1/chat/completions, where reasoning_effort and tools are per-request fields; the request schema has no per-turn effort or tool-change message (effort_updates = false, tools.updates = false). https://api.aimlapi.com/docs-json?model=z-ai%2Fglm-5v-turbo&endpoint=openai%2Fchat-completions
schema = 2
base_model = "zhipuai/glm-5v-turbo"
name = "GLM 5V Turbo"

[capabilities]
reasoning = { supported = true }
effort_updates = false
tools = { supported = true, updates = false }

[limit]
context = 202_752

[cost.text.input]
price = 1.2
cache = { read = 0.24 }

[cost.text.output]
price = 4
