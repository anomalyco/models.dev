# Mid-conversation: served on POST /v1/chat/completions, where reasoning_effort and tools are per-request fields; the request schema has no per-turn effort or tool-change message (effort_updates = false, tools.updates = false). https://api.aimlapi.com/docs-json?model=upstage%2Fsolar-pro4&endpoint=openai%2Fchat-completions
schema = 2
base_model = "upstage/solar-pro4"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
effort_updates = false
tools = { supported = true, updates = false }

[cost.text.input]
price = 0.041262
cache = { read = 0.008252 }

[cost.text.output]
price = 0.165048
