# No caller control: reasoning_effort is validated (invalid value -> 400) but low/high
# do not order reasoning tokens; toggle/budget fields are dropped by the gateway.
# Mid-conversation: served on POST /v1/chat/completions, where reasoning_effort and tools are per-request fields; the request schema has no per-turn effort or tool-change message (effort_updates = false, tools.updates = false). https://api.aimlapi.com/docs-json?model=xiaomi%2Fmimo-v2.5-pro&endpoint=openai%2Fchat-completions
schema = 2
base_model = "xiaomi/mimo-v2.5-pro"
name = "MiMo V2.5 Pro"

[capabilities]
reasoning = { supported = true }
effort_updates = false
tools = { supported = true, updates = false }

[limit]
context = 1_000_000
output = 128_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_details" }

[cost.text.input]
price = 0.598299
cache = { read = 0.004951 }

[cost.text.output]
price = 1.196598
