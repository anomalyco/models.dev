# No caller control: reasoning_effort is validated (invalid value -> 400) but low/high
# do not order reasoning tokens; toggle/budget fields are dropped by the gateway.
schema = 2
base_model = "xiaomi/mimo-v2.5"
name = "MiMo V2.5"

[capabilities]
reasoning = { supported = true }

[limit]
context = 1_000_000
output = 128_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_details" }

[cost.text.input]
price = 0.192556
cache = { read = 0.003851 }

[cost.text.output]
price = 0.385112
