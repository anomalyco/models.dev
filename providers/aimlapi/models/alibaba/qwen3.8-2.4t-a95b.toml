# Mid-conversation: served on POST /v1/chat/completions, where reasoning_effort and tools are per-request fields; the request schema has no per-turn effort or tool-change message (effort_updates = false, tools.updates = false). https://api.aimlapi.com/docs-json?model=alibaba%2Fqwen3.8-2.4t-a95b&endpoint=openai%2Fchat-completions
schema = 2
base_model = "alibaba/qwen3.8-2.4t-a95b"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium"] }
structured_output = true
effort_updates = false
tools = { supported = true, updates = false }

[limit]
output = 52_429

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_details" }

[cost.text.input]
price = 3.4385
cache = { read = 0.6877 }

[cost.text.output]
price = 8.59625
