# Mid-conversation: served on POST /v1/chat/completions, where reasoning_effort and tools are per-request fields; the request schema has no per-turn effort or tool-change message (effort_updates = false, tools.updates = false). https://api.aimlapi.com/docs-json?model=alibaba%2Fqwen-max&endpoint=openai%2Fchat-completions
schema = 2
base_model = "alibaba/qwen-max"

[capabilities]
effort_updates = false
tools = { supported = true, updates = false }

[limit]
context = 32_000

[cost.text.input]
price = 1.6
cache = { read = 0.32 }

[cost.text.output]
price = 6.4
