# Mid-conversation: served on POST /v1/chat/completions, where reasoning_effort and tools are per-request fields; the request schema has no per-turn effort or tool-change message (effort_updates = false, tools.updates = false). https://api.aimlapi.com/docs-json?model=alibaba%2Fqwen3.8-max-prime&endpoint=openai%2Fchat-completions
schema = 2
base_model = "alibaba/qwen3.8-max-prime"
name = "Qwen3.8 Max Prime"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh"] }
structured_output = true
effort_updates = false
tools = { supported = true, updates = false }

[cost.text.input]
price = 4.232
cache = { read = 0.529 }

[cost.text.output]
price = 12.696
