# Mid-conversation: served on POST /v1/chat/completions, where reasoning_effort and tools are per-request fields; the request schema has no per-turn effort or tool-change message (effort_updates = false, tools.updates = false). https://api.aimlapi.com/docs-json?model=stepfun%2Fstep-5-preview&endpoint=openai%2Fchat-completions
schema = 2
base_model = "stepfun/step-5-preview"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
effort_updates = false
tools = { supported = true, updates = false }

[limit]
output = 64_000

[cost.text.input]
price = 1.058
cache = { read = 0.0529 }

[cost.text.output]
price = 2.8566
