# Mid-conversation: served on POST /v1/chat/completions, where reasoning_effort and tools are per-request fields; the request schema has no per-turn effort or tool-change message (effort_updates = false, tools.updates = false). https://api.aimlapi.com/docs-json?model=openai%2Fgpt-4&endpoint=openai%2Fchat-completions
schema = 2
base_model = "openai/gpt-4"

[capabilities]
structured_output = false
effort_updates = false
tools = { supported = true, updates = false }

[limit]
context = 8_000

[cost.text.input]
price = 30
cache = { read = 30 }

[cost.text.output]
price = 60
