# Mid-conversation: served on POST /v1/chat/completions, where reasoning_effort and tools are per-request fields; the request schema has no per-turn effort or tool-change message (effort_updates = false, tools.updates = false). https://api.aimlapi.com/docs-json?model=openai%2Fgpt-4.1&endpoint=openai%2Fchat-completions
schema = 2
base_model = "openai/gpt-4.1"

[capabilities]
structured_output = true
effort_updates = false
tools = { supported = true, updates = false }

[cost.text.input]
price = 2.6
cache = { read = 0.65 }

[cost.text.output]
price = 10.4
