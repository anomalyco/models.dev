# Mid-conversation: served on POST /v1/chat/completions, where reasoning_effort and tools are per-request fields; the request schema has no per-turn effort or tool-change message (effort_updates = false, tools.updates = false). https://api.aimlapi.com/docs-json?model=openai%2Fgpt-oss-safeguard-20b&endpoint=openai%2Fchat-completions
schema = 2
base_model = "openai/gpt-oss-safeguard-20b"
name = "gpt-oss-safeguard-20b"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
effort_updates = false
tools = { supported = true, updates = false }

[limit]
output = 65_536

[cost.text.input]
price = 0.103155
cache = { read = 0.051578 }

[cost.text.output]
price = 0.41262
