# Mid-conversation: served on POST /v1/chat/completions, where reasoning_effort and tools are per-request fields; the request schema has no per-turn effort or tool-change message (effort_updates = false, tools.updates = false). https://api.aimlapi.com/docs-json?model=openai%2Fgpt-5.1-codex-max&endpoint=openai%2Fchat-completions
schema = 2
base_model = "openai/gpt-5.1-codex-max"
name = "GPT-5.1-Codex-Max"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
effort_updates = false
tools = { supported = true, updates = false }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_details" }

[cost.text.input]
price = 2.645
cache = { read = 0.2645 }

[cost.text.output]
price = 21.16
