# Mid-conversation: served on POST /v1/chat/completions, where reasoning_effort and tools are per-request fields; the request schema has no per-turn effort or tool-change message (effort_updates = false, tools.updates = false). https://api.aimlapi.com/docs-json?model=openai%2Fgpt-4o-2024-08-06&endpoint=openai%2Fchat-completions
schema = 2
base_model = "openai/gpt-4o-2024-08-06"
name = "GPT-4o"

[capabilities]
structured_output = true
effort_updates = false
tools = { supported = true, updates = false }

[cost.text.input]
price = 2.5
cache = { read = 1.25 }

[cost.text.output]
price = 10
