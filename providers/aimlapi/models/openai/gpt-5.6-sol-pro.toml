# Mid-conversation: served on POST /v1/chat/completions, where reasoning_effort and tools are per-request fields; the request schema has no per-turn effort or tool-change message (effort_updates = false, tools.updates = false). https://api.aimlapi.com/docs-json?model=openai%2Fgpt-5.6-sol-pro&endpoint=openai%2Fchat-completions
schema = 2
base_model = "openai/gpt-5.6-sol"
name = "GPT-5.6 Sol Pro"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
effort_updates = false
tools = { supported = true, updates = false }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_details" }

[cost.text.input]
price = 5.5016
cache = { read = 0.55016 }

[cost.text.output]
price = 27.508
