# Mid-conversation: served on POST /v1/chat/completions, where reasoning_effort and tools are per-request fields; the request schema has no per-turn effort or tool-change message (effort_updates = false, tools.updates = false). https://api.aimlapi.com/docs-json?model=openai%2Fgpt-5-2&endpoint=openai%2Fchat-completions
schema = 2
base_model = "openai/gpt-5.2"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
effort_updates = false
tools = { supported = true, updates = false }

[cost.text.input]
price = 2.275
cache = { read = 0.2275 }

[cost.text.output]
price = 18.2
