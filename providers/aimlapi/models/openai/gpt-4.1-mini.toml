# Mid-conversation: served on POST /v1/chat/completions, where reasoning_effort and tools are per-request fields; the request schema has no per-turn effort or tool-change message (effort_updates = false, tools.updates = false). https://api.aimlapi.com/docs-json?model=openai%2Fgpt-4.1-mini&endpoint=openai%2Fchat-completions
schema = 2
base_model = "openai/gpt-4.1-mini"
name = "GPT-4.1 Mini"

[capabilities]
structured_output = true
effort_updates = false
tools = { supported = true, updates = false }

[limit]
context = 1_000_000

[cost.text.input]
price = 0.4
cache = { read = 0.1 }

[cost.text.output]
price = 1.6
