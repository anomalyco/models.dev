# Mid-conversation: served on POST /v1/chat/completions, where reasoning_effort and tools are per-request fields; the request schema has no per-turn effort or tool-change message (effort_updates = false, tools.updates = false). https://api.aimlapi.com/docs-json?model=openai%2Fgpt-5.4-nano&endpoint=openai%2Fchat-completions
schema = 2
base_model = "openai/gpt-5.4-nano"
name = "GPT-5.4 Nano"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
effort_updates = false
tools = { supported = true, updates = false }

[cost.text.input]
price = 0.2116
cache = { read = 0.02116 }

[cost.text.output]
price = 1.3225
