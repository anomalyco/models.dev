# Mid-conversation: served on POST /v1/chat/completions, where reasoning_effort and tools are per-request fields; the request schema has no per-turn effort or tool-change message (effort_updates = false, tools.updates = false). https://api.aimlapi.com/docs-json?model=openai%2Fgpt-5-pro&endpoint=openai%2Fchat-completions
schema = 2
base_model = "openai/gpt-5-pro"

[capabilities]
reasoning = { supported = true, effort = ["high"] }
structured_output = true
effort_updates = false
tools = { supported = true, updates = false }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_details" }

[cost.text.input]
price = 15.87

[cost.text.output]
price = 126.96
