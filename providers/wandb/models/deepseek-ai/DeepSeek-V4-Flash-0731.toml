# Mid-conversation: CoreWeave serves this model on POST /v1/chat/completions; reasoning and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://docs.wandb.ai/inference
schema = 2
base_model = "deepseek/deepseek-v4-flash-0731"
description = "DeepSeek V4-Flash-0731 is an MoE model great for coding, reasoning, and agentic workloads."

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
context = 262_144
output = 262_144

[cost.text.input]
price = 0.13
cache = { read = 0.07 }

[cost.text.output]
price = 0.28
