# Mid-conversation: CoreWeave serves this model on POST /v1/chat/completions; reasoning and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://docs.wandb.ai/inference
schema = 2
base_model = "google/gemma-4-31b-it"
name = "Gemma 4 31B"
description = "Gemma 4 31B Dense is designed for advanced reasoning, agentic workflows, and longer context and is natively trained on 140+ languages."

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true }
structured_output = true
effort_updates = false

[limit]
output = 262_144

[cost.text.input]
price = 0.1
cache = { read = 0.1 }

[cost.text.output]
price = 0.34
