# W&B lists always-on reasoning with low/high/max effort; no on/off toggle.
# Effort: reasoning_effort = low|high|max, matching the lab and relay peers.
# https://trace.wandb.ai/inference/catalog/models
# Mid-conversation: CoreWeave serves this model on POST /v1/chat/completions; reasoning and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://docs.wandb.ai/inference
schema = 2
base_model = "zhipuai/glm-5.3"
name = "GLM 5.3"
description = "GLM-5.3 is a 744B-parameter MoE model built for advanced reasoning, software engineering, and long-horizon agentic tasks."

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
context = 1_048_576
output = 1_048_576

[cost.text.input]
price = 1.2
cache = { read = 0.19 }

[cost.text.output]
price = 4
