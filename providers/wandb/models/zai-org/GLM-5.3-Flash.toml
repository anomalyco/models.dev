# W&B lists always-on reasoning with low/high/max effort; no on/off toggle.
# https://trace.wandb.ai/inference/catalog/models
# Mid-conversation: CoreWeave serves this model on POST /v1/chat/completions; reasoning and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://docs.wandb.ai/inference
# Input MIME types: the lab's image list; CoreWeave's catalog reports image input without formats (https://trace.wandb.ai/inference/modelsdev/models).
schema = 2
base_model = "zhipuai/glm-5.3-flash"
name = "GLM 5.3 Flash"
description = "GLM-5.3-Flash is a natively multimodal model with 320B total parameters and 18B active parameters."

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
structured_output = true
effort_updates = false

[limit]
context = 1_048_576
output = 1_048_576

[cost.text.input]
price = 0.15
cache = { read = 0.02 }

[cost.text.output]
price = 0.5
