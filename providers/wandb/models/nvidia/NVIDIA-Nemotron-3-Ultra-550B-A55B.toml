# Mid-conversation: CoreWeave serves this model on POST /v1/chat/completions; reasoning and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://docs.wandb.ai/inference
schema = 2
base_model = "nvidia/nemotron-3-ultra-550b-a55b"
name = "Nemotron 3 Ultra"
description = "Nemotron 3 Ultra is a powerful MoE model designed for long-running agents across coding, deep research, and enterprise automation."

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true }
structured_output = true
effort_updates = false

[limit]
context = 262_144
output = 262_144

[cost.text.input]
price = 0.5
cache = { read = 0.1 }

[cost.text.output]
price = 2.15
