# Mid-conversation: CoreWeave serves this model on POST /v1/chat/completions; reasoning and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://docs.wandb.ai/inference
schema = 2
base_model = "ibm/granite-4.2-8b"
description = "Granite 4.2 8B is an instruct model capable of enhanced tool calling, instruction following, and chat capabilities."

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true }
structured_output = true
effort_updates = false

[limit]
output = 131_072

[cost.text.input]
price = 0.1
cache = { read = 0.05 }

[cost.text.output]
price = 0.15
