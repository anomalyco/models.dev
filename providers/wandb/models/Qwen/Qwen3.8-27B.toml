schema = 2
base_model = "alibaba/qwen3.8-27b"
description = "Qwen3.8-27B is a dense multimodal model suited for coding, research, vision, and long-running agent tasks."

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
output = 262_144

[cost.text.input]
price = 0.4
cache = { read = 0.15 }

[cost.text.output]
price = 3
