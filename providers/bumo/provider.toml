# Bumo Router is a multi-model relay selling official upstream APIs at the
# official price + 6% service fee, billed in USD. Models and prices were read
# from https://router.bumo.ai/v1/models on 2026-10-26.
# Docs: https://bumo.ai/docs/api
name = "Bumo Router"
env = ["BUMO_API_KEY"]
npm = "@ai-sdk/openai-compatible"
opencodeai = "@opencode/ai/providers/openai-compatible"
api = "https://router.bumo.ai/v1"
doc = "https://bumo.ai/docs/api"
