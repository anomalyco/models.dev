# Bumo Router (multi-model relay, OpenAI-compatible Chat Completions), billed in USD.
# Prices: https://router.bumo.ai/api/v1/models (accessed 2026-11-02); flat rate, the catalog row has no tiers.
# Docs: https://bumo.ai/docs/api
# Effort: reasoning_effort = none|low|medium|high|xhigh (request body is forwarded unchanged)
# tools.freeform: live probe 2026-11-04 on POST /v1/chat/completions (custom tool, tool_choice=required) on gpt-5.3-codex: regex ZZ[0-9]{3} and the equivalent lark grammar both returned ZZ plus three digits when asked for HELLO (grammar enforced), and format text returned HELLO.
schema = 2
base_model = "openai/gpt-5.3-codex"

[capabilities]
tools = { supported = true, freeform = ["text", "lark", "regex"] }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 1.855
cache = { read = 0.1855 }

[cost.text.output]
price = 14.84
