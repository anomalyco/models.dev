# Bumo Router (multi-model relay, OpenAI-compatible Chat Completions), billed in USD.
# Prices: https://router.bumo.ai/api/v1/models (accessed 2026-11-02); flat rate, the catalog row has no tiers.
# Docs: https://bumo.ai/docs/api
# Effort: reasoning_effort = none|low|medium|high|xhigh|max (request body is forwarded unchanged)
# Freeform custom tools: not probed on this host, not declared.
schema = 2
base_model = "openai/gpt-5.6-sol"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true, explicit = { ttl = ["30m"] } }

[cost.text.input]
price = 5.3
cache = { read = 0.53 }

[cost.text.output]
price = 31.8
