# Bumo Router relay: official upstream API price + 6% service fee, billed in USD.
# Prices and model list from https://router.bumo.ai/v1/models (accessed 2026-10-26);
# see https://bumo.ai/docs/api for the gateway docs.
# Reasoning and cache metadata mirror the underlying lab provider entries.
schema = 2
base_model = "openai/gpt-6-luna"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
tools = { supported = true }
cache = { implicit = true, explicit = { ttl = ["30m"] } }

[cost.text.input]
price = 0.106
cache = { read = 0.0106, write = 0.1325 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 0.212
cache = { read = 0.0212, write = 0.265 }

[cost.text.output]
price = 0.53

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 0.795
