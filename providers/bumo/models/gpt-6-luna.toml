# Bumo Router (multi-model relay, OpenAI-compatible Chat Completions), billed in USD.
# Prices: https://router.bumo.ai/api/v1/models (accessed 2026-11-02); the catalog row lists prompt-length tiers, mirrored as overrides.
# Docs: https://bumo.ai/docs/api
# Effort: reasoning_effort = none|low|medium|high|xhigh|max (request body is forwarded unchanged)
# tools.freeform: live probe 2026-11-04 on POST /v1/chat/completions (custom tool, tool_choice=required) on gpt-6-luna: regex ZZ[0-9]{3} and the equivalent lark grammar both returned ZZ plus three digits when asked for HELLO (grammar enforced), and format text returned HELLO.
schema = 2
base_model = "openai/gpt-6-luna"

[capabilities]
tools = { supported = true, freeform = ["text", "lark", "regex"] }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true, explicit = { ttl = ["30m"] } }

[cost.text.input]
price = 0.106
cache = { read = 0.0106, write = 0.1325 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 0.212
cache = { read = 0.0212, write = 0.265 }

[cost.text.output]
price = 0.53

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 0.795
