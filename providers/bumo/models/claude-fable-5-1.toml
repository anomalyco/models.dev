# Bumo Router (multi-model relay, OpenAI-compatible Chat Completions), billed in USD.
# Prices: https://router.bumo.ai/api/v1/models (accessed 2026-11-02); flat rate, the catalog row has no tiers.
# Docs: https://bumo.ai/docs/api
# Effort: reasoning_effort = low|medium|high|xhigh|max (request body is forwarded unchanged)
schema = 2
base_model = "anthropic/claude-fable-5-1"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { explicit = { ttl = ["5m", "1h"], max_breakpoints = 4 } }

[cost.text.input]
price = 10.6
cache = { read = 0.265, write = { "5m" = 13.25, "1h" = 21.2 } }

[cost.text.output]
price = 53
