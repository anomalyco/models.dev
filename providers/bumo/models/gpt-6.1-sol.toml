# Bumo Router (multi-model relay, OpenAI-compatible Chat Completions), billed in USD.
# Prices: https://router.bumo.ai/api/v1/models (accessed 2026-11-02); the catalog row lists prompt-length tiers, mirrored as overrides.
# Docs: https://bumo.ai/docs/api
# Effort: reasoning_effort = low|medium|high|xhigh|max (request body is forwarded unchanged)
# tools.freeform: live probe 2026-11-04 on POST /v1/chat/completions (custom tool, tool_choice=required) on gpt-6.1-sol: regex ZZ[0-9]{3} and the equivalent lark grammar both returned ZZ plus three digits when asked for HELLO (grammar enforced), and format text returned HELLO.
schema = 2
base_model = "openai/gpt-6.1-sol"

[capabilities]
tools = { supported = true, freeform = ["text", "lark", "regex"] }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true, explicit = { ttl = ["30m"] } }

[cost.text.input]
price = 2.12
cache = { read = 0.106, write = 2.65 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 4.24
cache = { read = 0.212, write = 5.3 }

[cost.text.output]
price = 10.6

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 15.9
