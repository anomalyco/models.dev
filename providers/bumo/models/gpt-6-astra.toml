# Bumo Router (multi-model relay, OpenAI-compatible Chat Completions), billed in USD.
# Prices: https://router.bumo.ai/api/v1/models (accessed 2026-11-02); the catalog row lists prompt-length tiers, mirrored as overrides.
# Docs: https://bumo.ai/docs/api
# Effort: reasoning_effort = low|medium|high|xhigh|max (request body is forwarded unchanged)
# Freeform custom tools: not probed on this host, not declared.
schema = 2
base_model = "openai/gpt-6-astra"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true, explicit = { ttl = ["30m"] } }

[cost.text.input]
price = 10.6
cache = { read = 1.06, write = 13.25 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 21.2
cache = { read = 2.12, write = 26.5 }

[cost.text.output]
price = 53

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 79.5
