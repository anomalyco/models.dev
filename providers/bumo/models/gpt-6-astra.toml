# Bumo Router relay: official upstream API price + 6% service fee, billed in USD.
# Prices and model list from https://router.bumo.ai/v1/models (accessed 2026-10-26);
# see https://bumo.ai/docs/api for the gateway docs.
# Reasoning and cache metadata mirror the underlying lab provider entries.
schema = 2
base_model = "openai/gpt-6-astra"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
tools = { supported = true }
cache = { implicit = true, explicit = { ttl = ["30m"] } }

[cost.text.input]
price = 10.6
cache = { read = 1.06, write = 13.25 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 21.2
cache = { read = 2.12, write = 26.5 }

[cost.text.output]
price = 53

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 79.5
