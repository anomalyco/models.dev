# Bumo Router (multi-model relay, OpenAI-compatible Chat Completions), billed in USD.
# Prices: https://router.bumo.ai/api/v1/models (accessed 2026-11-02); flat rate, the catalog row has no tiers.
# Docs: https://bumo.ai/docs/api
# Effort: reasoning_effort = low|medium|high|max (request body is forwarded unchanged)
schema = 2
base_model = "anthropic/claude-sonnet-4-6"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "max"] }
structured_output = true
cache = { explicit = { ttl = ["5m", "1h"], max_breakpoints = 4 } }

[cost.text.input]
price = 3.18
cache = { read = 0.318, write = { "5m" = 3.975, "1h" = 6.36 } }

[cost.text.output]
price = 15.9
