# Ezkielyna serves alibaba/qwen4-max under the id `qwen4-max` (Standard key group, 1x).
# Prices: public price list GET https://api.ezkielyna.store/api/pricing (read 2026-11-17 11:16 UTC),
#   USD/MTok = model_ratio x 2 x group_ratio; output = input x completion_ratio; cache read = input x cache_ratio.
#   Same prices in IDR: https://ezkielyna.store/harga-api-ai
# Live status and success rate: https://api.ezkielyna.store/status
# Reasoning controls follow the underlying model's peers on other relays; the gateway forwards
#   reasoning_effort / thinking unchanged to an upstream serving the same model.
# Effort: reasoning_effort = none|low|high|xhigh (none turns reasoning off; forwarded unchanged)
# Reasoning field: this route goes to a different upstream than the other Qwen entries (gateway channel config,
#   read 2026-11-17). That upstream's Chat Completions endpoint returns reasoning in message.reasoning, and the
#   gateway passes it through, so no reasoning_field is set: v2 accepts "reasoning", but v1's interleaved.field
#   only allows reasoning_content|reasoning_details, so leaving it out is better than a wrong value.
schema = 2
base_model = "alibaba/qwen4-max"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "xhigh"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 3.62
cache = { read = 0.181 }

[cost.text.output]
price = 10.86
