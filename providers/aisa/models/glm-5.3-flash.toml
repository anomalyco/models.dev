# Source: https://aisa.one/models (AIsa pricing API https://aisa.one/api/pricing/models,
# catalog cached_at 2026-10-26, accessed 2026-10-26). All cost values USD per 1M tokens as published by AIsa.
# AIsa is a multi-model relay: reasoning controls mirror the underlying lab API (pass-through).
# Effort: reasoning_effort = low|high|max
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.15
cache = { write = 0.03 }

[cost.text.output]
price = 0.5
