# Source: https://aisa.one/models (AIsa pricing API https://aisa.one/api/pricing/models,
# catalog cached_at 2026-10-26, accessed 2026-10-26). All cost values USD per 1M tokens as published by AIsa.
# AIsa is a multi-model relay: reasoning controls mirror the underlying lab API (pass-through).
# Published through v2 with the model-specific API; non-chat prices are not exposed as chat token prices.
schema = 2
v2_only = true
base_model = "openai/gpt-image-2"

[api.images]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/protocols/openai-images" }

[cost.text.input]
price = 8
cache = { write = 2 }

[cost.text.output]
price = 30
