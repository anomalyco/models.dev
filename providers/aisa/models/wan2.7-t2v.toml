# Source: https://aisa.one/models (AIsa pricing API https://aisa.one/api/pricing/models,
# catalog cached_at 2026-10-26, accessed 2026-10-26). Video prices are USD per generated second as published by AIsa.
# Published through v2 with the model-specific API; non-chat prices are not exposed as chat token prices.
# Base video rate: 720p / standard; other resolutions use the published overrides.
# Route metadata and media formats: https://www.alibabacloud.com/help/en/model-studio/text-to-video-api-reference (accessed 2026-10-26).
# This AIsa ID exposes one route of the shared wan2.7 model; keep its input format override on the provider.
schema = 2
v2_only = true
base_model = "alibaba/wan2.7"
name = "Wan2.7 Text-to-Video"
description = "Video model for text-to-video generation with auto-generated or user-supplied audio track"

[modalities]
input = ["text", "audio/wav", "audio/mpeg"]
output = ["video/mp4"]

[api.videos]
path = "/video/generations"
sdk = { aisdk = "none", opencodeai = "none" }

[cost.video.output]
price = 0.060208
unit = "second"

[[cost.video.output.overrides]]
when = { resolution = { equals = "1080p" }, quality = { equals = "standard" } }
price = 0.100347
