# Source: https://aisa.one/models (AIsa pricing API https://aisa.one/api/pricing/models,
# catalog cached_at 2026-10-26, accessed 2026-10-26). Token prices are USD per 1M tokens.
# AIsa is a multi-model relay: reasoning controls follow the underlying lab API and relay peers.
# Reasoning baseline: providers/google/models/gemini-3.8-flash.toml (native generateContent).
schema = 2
base_model = "google/gemini-3.8-flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[api.generate-content]
base_url = "https://api.aisa.one/v1beta"
sdk = { aisdk = "@ai-sdk/google", opencodeai = "@opencode/ai/providers/google" }

[cost.text.input]
price = 0.75
cache = { read = 0.075 }

[cost.text.output]
price = 3.75
