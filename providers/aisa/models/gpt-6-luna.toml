# Source: https://aisa.one/models (AIsa pricing API https://aisa.one/api/pricing/models,
# catalog cached_at 2026-10-26, accessed 2026-10-26). Token prices are USD per 1M tokens.
# AIsa is a multi-model relay: reasoning controls follow the underlying lab API and relay peers.
# Reasoning baseline: OpenAI native controls and OpenRouter peers.
# Per-model route evidence: name=gpt-6-luna; routes=POST /v1/messages (anthropic); POST /v1/chat/completions (openai); POST /v1/responses (openai-response).
# Source: https://aisa.one/api/pricing/models (cached 2026-10-26 02:20:40 UTC).
# AIsa lists cache_read=0.125 and cache_write=0.01 against input=0.1 USD/MTok; the cache labels appear inverted.
# Omit both cache rates pending provider clarification; native OpenAI prices do not establish this relay's rates.
schema = 2
base_model = "openai/gpt-6-luna"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.1

[cost.text.output]
price = 0.5
