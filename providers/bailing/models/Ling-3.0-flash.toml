name = "Ling-3.0-flash"
description = "Cost-effective hybrid reasoning model with 5.1B activated parameters — high TPS for high-frequency tasks, peak inference speed up to 1000 tokens/s — fast, stable, and low cost"
family = "ling"
release_date = "2026-07"
last_updated = "2026-07"
attachment = false
reasoning = true
temperature = true
knowledge = "2025-07"
tool_call = true
open_weights = true

[[reasoning_options]]
type = "toggle"

[interleaved]
field = "reasoning_content"

[cost]
input = 0.125
output = 0.375
cache_read = 0.025
cache_write = 0

[limit]
context = 256_000
output = 262144

[modalities]
input = ["text"]
output = ["text"]
