# Sources (developer.ant-ling.com, accessed 2026-11-08):
# - API: POST /v1/chat/completions and Anthropic-compatible POST /anthropic/v1/messages.
#   Request surface: temperature [0,1], top_p, tools, response_format (json_object /
#   json_schema per the structured-outputs tutorial), enable_search; no top_k, no
#   documented output cap (the Anthropic API defaults max_tokens to 32000).
# - Thinking (3.0 series): thinking.type = enabled|disabled, default enabled
#   (changelog v2.0.0: "支持开启/关闭深度思考").
# - Served context 256K, extendable to 1M (model page); matches the open weights.
# - Pricing (list, CNY per Mtok): input ¥0.5 / output ¥1.5 / cache read ¥0.1
#   (https://developer.ant-ling.com/zh-CN/docs/models/price/). CNY→USD rate 6.690826,
#   2026-11-08, source: https://open.er-api.com/v6/latest/USD; converted and rounded to
#   3 decimals (0.075 / 0.224 / 0.015).
# - Cache: implicit (cache-hit pricing, no explicit cache markers documented).
schema = 2
base_model = "inclusionai/ling-3.0-flash"

[capabilities]
reasoning = { supported = true, toggle = true, default = { type = "toggle", value = true } }
structured_output = true
top_k = false
cache = { implicit = true }

[api.chat-completions]

[api.messages]
base_url = "https://api.ant-ling.com/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.075
cache = { read = 0.015 }

[cost.text.output]
price = 0.224
