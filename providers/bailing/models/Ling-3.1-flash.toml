name = "Ling-3.1-flash"
description = "New-generation hybrid reasoning model, purpose-built for everyday office work, long-horizon software development, and complex Agent tasks"
family = "ling"
release_date = "2026-10"
last_updated = "2026-10"
attachment = false
reasoning = true
temperature = true
knowledge = "2025-07"
