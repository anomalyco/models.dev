# Legacy v1 provider alias for Bailing. It now resolves Ant Ling models under the old
# provider id and env var so the published v1 catalog remains backward-compatible.
name = "Bailing"
env = ["BAILING_API_TOKEN"]
npm = "@ai-sdk/openai-compatible"
api = "https://api.ant-ling.com/v1"
doc = "https://developer.ant-ling.com/en/docs/"

[v1_alias]
provider = "ant-ling"
env = { ANT_LING_API_TOKEN = "BAILING_API_TOKEN" }
