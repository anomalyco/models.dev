schema = 2
base_model = "zhipuai/glm-5"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
context = 200_000
output = 128_000

[cost.text.input]
price = 0.6
cache = { read = 0.16, write = 0.6 }

[[cost.text.input.overrides]]
when = { context = { gt = 32_000 } }
price = 0.8
cache = { read = 0.2, write = 0.8 }

[cost.text.output]
price = 3

[[cost.text.output.overrides]]
when = { context = { gt = 32_000 } }
price = 3.4
