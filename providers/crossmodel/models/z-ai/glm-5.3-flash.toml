schema = 2
base_model = "zhipuai/glm-5.3-flash"

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { supported = true }

[limit]
output = 128_000

[cost.text.input]
price = 0.15
cache = { read = 0.03, write = 0.15 }

[cost.text.output]
price = 0.5
