# Synced from CrossModel's catalog, https://www.crossmodel.ai/api/models (accessed 2026-10-21):
# prices (USD micro/1M, threshold tiers -> context overrides), limits, modalities,
# reasoning controls, structured_output.json_schema, context.caching, release_stage.
# Effort: reasoning_effort (/v1/chat/completions), reasoning.effort (/v1/responses)
# (https://www.crossmodel.ai/docs/api-reference/chat.md, responses.md)
# MIME: the lab's types for the media kinds CrossModel lists; CrossModel documents no format list.
# Cache: catalog context.caching = true; CrossModel documents no mechanism (implicit/explicit, TTL).
# Mid-conversation flags unset: CrossModel documents none and nothing was tested live.
# APIs: /v1/chat/completions, /v1/responses, /v1/messages (https://www.crossmodel.ai/docs/models-and-capabilities.md).
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[modalities]
input = ["text", "image/jpeg", "image/png", "video/mp4", "video/x-matroska", "video/quicktime"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[limit]
output = 128_000

[cost.text.input]
price = 0.15
cache = { read = 0.03, write = 0.15 }

[cost.text.output]
price = 0.5
