schema = 2
base_model = "zhipuai/glm-5.1"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
cache = { supported = true }

[limit]
output = 128_000

[cost.text.input]
price = 1
cache = { read = 0.2, write = 1 }

[[cost.text.input.overrides]]
when = { context = { gt = 32_000 } }
price = 1.2
cache = { read = 0.3, write = 1.2 }

[cost.text.output]
price = 3.8

[[cost.text.output.overrides]]
when = { context = { gt = 32_000 } }
price = 4.4
