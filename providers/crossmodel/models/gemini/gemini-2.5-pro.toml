schema = 2
base_model = "google/gemini-2.5-pro"

[modalities]
input = ["text", "image", "audio", "video"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high"] }
structured_output = true
cache = { supported = true }

[cost.text.input]
price = 1.25
cache = { read = 0.125, write = 1.25 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 2.5
cache = { read = 0.25, write = 2.5 }

[cost.text.output]
price = 10

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 15
