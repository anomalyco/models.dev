schema = 2
base_model = "xiaomi/mimo-v2.5"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true

[limit]
context = 1_000_000
output = 128_000

[cost.text.input]
price = 0.16
cache = { read = 0.004, write = 0.16 }

[cost.text.output]
price = 0.32
