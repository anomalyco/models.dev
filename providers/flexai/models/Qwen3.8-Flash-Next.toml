# Toggle: chat_template_kwargs.enable_thinking = true | false (default: true)
# thinking.type is accepted but does NOT disable reasoning on this model; the
# chat-template switch is the control that works.
# Measured on FlexAI 2026-10-05 (length of reasoning_content, max_tokens 32000):
#   default 516 · thinking.type disabled 702 · enable_thinking=false 0 (12/12)
#   low 690 (no reduction vs default)
# No effort levels are declared: through FlexAI's gateway, reasoning_effort
# medium/high/max return 400 ("Unexpected reasoning effort high"), xhigh is
# rejected by the gateway's enum, and low has no measurable effect.
# Modalities: reads images (verified on two solid-colour fixtures), but video
# is NOT served here -- a video_url part is coerced to image_url and rejected,
# and input_video returns 500 -- so input is the lab's image MIME list without video.
# https://docs.flex.ai/inference-api/agents/langchain
schema = 2
base_model = "alibaba/qwen3.8-flash-next"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.15
cache = { read = 0.0225 }

[cost.text.output]
price = 0.47
