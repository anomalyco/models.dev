# Always-on reasoner: {"thinking": {"type": "disabled"}} is accepted but the
# model still reasons, and every reasoning_effort level saturates the token
# budget identically, so no caller-facing control is exposed.
# Measured on FlexAI 2026-10-02 (reasoning tokens, n=3, max_tokens 3000):
#   default 2019 · enabled 3000 · disabled 2579 · every effort level 2364-3000
# Modalities: reads images (verified on two solid-colour fixtures), but video
# is NOT served here -- a video_url part is coerced to image_url and rejected,
# and input_video returns 500 -- so the base entry's video input is overridden.
# https://docs.flex.ai/inference-api/agents/langchain
base_model = "alibaba/qwen3.8-flash-next"

reasoning_options = []

[cost]
input = 0.15
output = 0.47
cache_read = 0.0225

[modalities]
input = ["text", "image"]
output = ["text"]

[interleaved]
field = "reasoning_content"
