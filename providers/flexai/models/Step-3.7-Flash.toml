# Effort: reasoning_effort = low | medium | high (the lab's set; all honoured)
# CAUTION -- inverted on this host. Measured on FlexAI 2026-10-05 (length of
# reasoning_content; 3 prompts x 4 runs, max_tokens 32000):
#   default 1898 · low 2553 · medium 616 · high 562 (medians, same direction on
#   every prompt). medium/high reason 3-4x LESS than low or the default.
# No switch disables reasoning: thinking.type disabled 1675,
# chat_template_kwargs enable_thinking=false 2017 / thinking=false 1922.
# Context: 262_144 is the served window (GET /v1/models context_length, and the
# server's max_tokens error states "maximum context length of 262144").
# https://docs.flex.ai/inference-api/agents/langchain
base_model = "stepfun/step-3.7-flash"

[interleaved]
field = "reasoning_content"

[cost]
input = 0.2
output = 1.15
cache_read = 0.03

[limit]
context = 262_144

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]
