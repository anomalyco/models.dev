# Speech: POST https://api.flex.ai/v1/audio/speech (https://docs.flex.ai/inference-api/guides/audio).
# Price: GET /v1/models media_pricing, $9.9e-07 per input character (billing_unit character), 2026-10-22;
# stored per 1M characters as the schema requires: 0.99.
schema = 2
base_model = "hexgrad/kokoro-82m"

[api.speech]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/protocols/openai-speech" }

[cost.text.input]
unit = "character"
price = 0.99
