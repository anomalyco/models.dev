# Toggle: thinking.type = "enabled" | "disabled" (default: disabled)
# Effort: reasoning_effort = high | max
# Re-measured on FlexAI 2026-10-05 (length of reasoning_content; 3 prompts x 3
# runs, max_tokens 32000):
#   default 0 (9/9 no reasoning) · thinking disabled 0 · minimal 0 · low 0
#   medium 98 · high 103 · max 582 · thinking enabled 582 (medians)
# minimal and low return no reasoning (the off state the toggle expresses);
# medium and high are one band, named `high` as every peer entry names it.
# https://docs.flex.ai/inference-api/agents/langchain
base_model = "zhipuai/glm-5.3-flash"

[interleaved]
field = "reasoning_content"

[cost]
input = 0.09
output = 0.28
cache_read = 0.0135

[limit]
context = 1_048_576

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["high", "max"]
