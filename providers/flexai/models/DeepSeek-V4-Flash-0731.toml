# Toggle: thinking.type = "enabled" | "disabled" (default: disabled)
# Effort: reasoning_effort = high | max
# Measured on FlexAI 2026-10-02 (reasoning tokens, n=4, max_tokens 4000):
#   default 0 · minimal 0 · low 0 · medium 1783 · high 1978 · max 4000 (capped)
# minimal and low return zero reasoning tokens, i.e. they are the disabled
# state the toggle already expresses; medium and high overlap and are not
# separable; max saturates the budget. Only the two separable on-levels are
# declared. The gateway validates reasoning_effort against a uniform
# minimal|low|medium|high|max enum shared across models, so acceptance of a
# value is not evidence that it is honoured here.
# medium and high are one measured band; it is named `high` here because
# that is the name every peer entry for this model uses.
# Context: 1_048_576 is the served window (GET /v1/models context_length, and the
# server's max_tokens error states "maximum context length of 1048576").
# https://docs.flex.ai/inference-api/agents/langchain
schema = 2
base_model = "deepseek/deepseek-v4-flash-0731"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["high", "max"] }

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.06
cache = { read = 0.009 }

[cost.text.output]
price = 0.18
