# Toggle: thinking.type = "enabled" | "disabled" (default: disabled)
# Measured on FlexAI 2026-10-02: reasoning_tokens 0 by default and when
# disabled, non-zero when enabled. reasoning_effort is accepted by the
# gateway for this model but produces no distinct effect, so no effort
# levels are declared.
# Context: FlexAI serves 40_960 (no YaRN scaling): GET /v1/models context_length,
# and the server's max_tokens error states "maximum context length of 40960".
# https://docs.flex.ai/inference-api/agents/langchain
schema = 2
base_model = "alibaba/qwen3-8b"

[capabilities]
reasoning = { supported = true, toggle = true }

[limit]
context = 40_960

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.117
cache = { read = 0.0175 }

[cost.text.output]
price = 0.455
