# Always-on reasoner: FlexAI's catalog lists this model as always_thinking, so no
# toggle is declared. The catalog also lists reasoning_effort, but its effect has
# not yet been measured on this host, so no effort levels are declared.
# Context: 1_048_576 is the served window (GET /v1/models context_length).
# https://docs.flex.ai/inference-api/agents/langchain
schema = 2
base_model = "minimax/MiniMax-M3.1-Flash"

[capabilities]
reasoning = { supported = true }

[limit]
context = 1_048_576

[cost.text.input]
price = 0.15
cache = { read = 0.0225 }

[cost.text.output]
price = 0.6
