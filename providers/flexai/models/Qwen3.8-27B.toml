# Toggle: thinking.type = "enabled" | "disabled" (default: disabled)
# Effort: reasoning_effort = low | high
# Measured on FlexAI 2026-10-02 (reasoning tokens, n=4, max_tokens 4000):
#   default 0 · minimal 0 · low 688 · medium 897 · high 4000 (capped) · max 3660
# minimal returns zero, i.e. the disabled state the toggle already expresses.
# low and medium overlap (496-1084 vs 886-1446) and are reported as one band;
# high and max both saturate the budget. Two separable on-levels are declared.
# https://docs.flex.ai/inference-api/agents/langchain
base_model = "alibaba/qwen3.8-27b"

[cost]
input = 0.15
output = 1.875
cache_read = 0.0225

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "high"]
