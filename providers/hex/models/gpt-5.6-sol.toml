# HEX prices (USD per million tokens): https://hexapi.io/api/models
# API: https://hexapi.io/docs | Client limits and attachments: https://api.hexapi.io/v1/setup/model-limits.json
# HEX documents local function calling. Custom tool grammar formats are not advertised.
# Effort: reasoning.effort = none|low|medium|high|xhigh|max
schema = 2
base_model = "openai/gpt-5.6-sol"
base_model_omit = ["limit.input"]

[modalities]
input = ["text","image/jpeg","image/png","image/webp"]
output = ["text"]

[limit]
context = 1000000

[capabilities]
reasoning = { supported = true, effort = ["none","low","medium","high","xhigh","max"] }
cache = { implicit = true }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.9342325
cache = { read = 0.09342325, write = 1.167790625 }

[cost.text.output]
price = 5.605395
