# HEX prices (USD per million tokens): https://hexapi.io/api/models
# API: https://hexapi.io/docs | Client limits and attachments: https://api.hexapi.io/v1/setup/model-limits.json
schema = 2
base_model = "zhipuai/glm-5.3-flash"
name = "GLM 5.3 Flash Abliterated"
description = "GLM 5.3 Flash Abliterated served by HEX."
base_model_omit = ["weights","benchmarks"]
open_weights = false

[modalities]
input = ["text","image/jpeg","image/png","image/webp"]
output = ["text"]

[limit]
output = 8192
input = 917504

[capabilities]
reasoning = { supported = false }
cache = { implicit = true }

[cost.text.input]
price = 0.75
cache = { read = 0.3, write = 0.75 }

[cost.text.output]
price = 2.5
