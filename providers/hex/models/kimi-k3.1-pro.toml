# HEX prices (USD per million tokens): https://hexapi.io/api/models
# API: https://hexapi.io/docs | Client limits and attachments: https://api.hexapi.io/v1/setup/model-limits.json
# Effort: reasoning_effort = low|high|max
schema = 2
base_model = "moonshotai/kimi-k3.1-pro"

[modalities]
input = ["text"]
output = ["text"]

[limit]
context = 1000000
output = 32000

[capabilities]
reasoning = { supported = true, effort = ["low","high","max"] }
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.5
cache = { read = 0.05, write = 0.5 }

[cost.text.output]
price = 2.5
