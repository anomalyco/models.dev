# HEX prices (USD per million tokens): https://hexapi.io/api/models
# API: https://hexapi.io/docs | Client limits and attachments: https://api.hexapi.io/v1/setup/model-limits.json
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"
name = "DeepSeek V4.1 Flash 1017 Abliterated"
description = "DeepSeek V4.1 Flash 1017 Abliterated served by HEX."
base_model_omit = ["weights","benchmarks"]
open_weights = false

[modalities]
input = ["text","image/jpeg","image/png","image/webp"]
output = ["text"]

[limit]
output = 65536

[capabilities]
reasoning = { supported = false }
cache = { implicit = true }

[cost.text.input]
price = 0.75
cache = { read = 0.1375, write = 0.75 }

[cost.text.output]
price = 3.125
