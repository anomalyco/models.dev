# HEX prices (USD per million tokens): https://hexapi.io/api/models
# API: https://hexapi.io/docs | Client limits and attachments: https://api.hexapi.io/v1/setup/model-limits.json
schema = 2
base_model = "moonshotai/kimi-k3.1-pro"
name = "Kimi K3.1 Pro Uncensored"
description = "Kimi K3.1 Pro Uncensored served by HEX."
base_model_omit = ["weights"]
open_weights = false

[modalities]
input = ["text"]
output = ["text"]

[limit]
context = 1000000
output = 8192

[capabilities]
reasoning = { supported = false }
cache = { implicit = true }

[cost.text.input]
price = 0.75
cache = { read = 0.075, write = 0.75 }

[cost.text.output]
price = 3.75
