# HEX prices (USD per million tokens): https://hexapi.io/api/models
# API: https://hexapi.io/docs | Client limits and attachments: https://api.hexapi.io/v1/setup/model-limits.json
# Effort: output_config.effort = low|medium|high|xhigh|max
schema = 2
base_model = "anthropic/claude-opus-5"

[modalities]
input = ["text","image/jpeg","image/png","image/webp"]
output = ["text"]

[limit]
output = 64000

[capabilities]
reasoning = { supported = true, effort = ["low","medium","high","xhigh","max"] }
cache = { explicit = true }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 2.2421525
cache = { read = 0.22421525, write = 2.802690625 }

[cost.text.output]
price = 11.2107625
