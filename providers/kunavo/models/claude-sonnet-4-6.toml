# Kunavo is an OpenAI-compatible gateway; the ids here are Kunavo's own and are
# matched exactly (no date-suffixed aliases).
#
# Prices are Kunavo's list rates in USD per 1M tokens, re-verified 2026-09-23:
# input, output and the long-context tiers against the live catalog at
# https://kunavo.com/llms.txt, cache prices against the per-model cache table
# at https://kunavo.com/pricing. Each token class follows the vendor's own
# price structure at the model's discount. cache_read is 0.10x input, and
# 0.025x on Claude Fable 5.1, which Anthropic lists at that ratio. cache_write
# is 1.25x input on the Claude models and on GPT-5.6 / GPT-6 Astra, and equals
# input on GPT-5.5, which has no per-token write price. Where the vendor has a
# long-context tier (Kunavo's GPT models, over 272K prompt tokens),
# [[cost.tiers]] bills the whole request at 2x input, cache reads and writes
# included, and 1.5x output. Claude has no tier.
#
# reasoning_options is empty by measurement, not by uncertainty. On the surface
# this provider registers (OpenAI /v1/chat/completions), Kunavo builds the
# upstream Anthropic request from an explicit field list — model, max_tokens,
# messages, stream, temperature/top_p/top_k, stop, tools, tool_choice, system —
# and carries no reasoning or thinking field across, so a caller-supplied
# reasoning control has no effect on this endpoint. Anthropic `thinking` does
# work on Kunavo's native Messages route (origin https://api.kunavo.com, client
# appends /v1/messages), which relays the body untranslated; that surface is not
# what this entry registers.
base_model = "anthropic/claude-sonnet-4-6"
reasoning_options = []

[cost]
input = 1.2
output = 6
cache_read = 0.12
cache_write = 1.5
