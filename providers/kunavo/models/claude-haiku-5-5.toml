# Price: https://kunavo.com/pricing.json (read 2026-11-22), USD per 1M tokens.
# Cache: read 0.1x and write 1.25x input, the vendor's structure at Kunavo's rate.
# Long context: past 100_000 input tokens the whole request bills at
# 5x input (cache too) and 5x output, as the vendor bills it.
# Reasoning: no caller control on this surface. For a Claude id Kunavo builds
# the Anthropic request on /v1/chat/completions from a fixed field list, so
# reasoning_effort, reasoning and thinking are dropped, never forwarded:
# https://kunavo.com/docs/chat#reasoning (the Claude row).
schema = 2
base_model = "anthropic/claude-haiku-5-5"

[capabilities]
reasoning = { supported = true }

[cost.text.input]
price = 0.07
cache = { read = 0.007, write = 0.0875 }

[[cost.text.input.overrides]]
when = { context = { gt = 100_000 } }
price = 0.35
cache = { read = 0.035, write = 0.4375 }

[cost.text.output]
price = 0.35

[[cost.text.output.overrides]]
when = { context = { gt = 100_000 } }
price = 1.75
