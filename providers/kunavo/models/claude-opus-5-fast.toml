base_model = "anthropic/claude-opus-5"
name = "Claude Opus 5 Fast"

# reasoning_options is intentionally empty: Kunavo relays the request body
# verbatim, so reasoning fields are accepted, but which controls the upstream
# channel actually honours has not been verified end-to-end. Left empty rather
# than declaring controls we cannot yet demonstrate; will be widened to the
# real effort/toggle/budget_tokens set once probed.
reasoning_options = []

[cost]
# Source: https://kunavo.com/llms.txt (per-model input/output USD per 1M
# tokens, generated from the live catalog). cache_read is 0.10x input on the
# Anthropic-protocol models and 0.20x elsewhere; cache_write bills at the
# plain input rate because Kunavo absorbs Anthropic's cache-write surcharge
# rather than passing it through.
input = 7
output = 35
cache_read = 0.7
cache_write = 7
