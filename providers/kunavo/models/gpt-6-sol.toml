# Kunavo is an OpenAI-compatible gateway; the ids here are Kunavo's own and are
# matched exactly (no date-suffixed aliases).
#
# Prices are Kunavo's list rates in USD per 1M tokens, re-verified 2026-09-25:
# input, output and the long-context tiers against the live catalog at
# https://kunavo.com/llms.txt, cache prices against the per-model cache table
# at https://kunavo.com/pricing. Each token class follows the vendor's own
# price structure at the model's discount. cache_read is 0.10x input, 0.025x
# on Claude Fable 5.1 and 0.05x on Claude Opus 5.5, which Anthropic lists at
# those ratios. cache_write is 1.25x input on the Claude models and on GPT-5.6
# / GPT-6, and equals input on GPT-5.5, which has no per-token write price. Where the vendor has a
# long-context tier (Kunavo's GPT models, over 272K prompt tokens),
# [[cost.tiers]] bills the whole request at 2x input, cache reads and writes
# included, and 1.5x output. Claude has no tier.
#
# `reasoning_effort` is forwarded on this surface: Kunavo maps the OpenAI chat
# field onto the Responses request as `reasoning.effort` before dispatch.
# Values follow the lab set as carried by same-surface peers for this model.
base_model = "openai/gpt-6-sol"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 0.8
output = 4
cache_read = 0.08
cache_write = 1

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 1.6
output = 6
cache_read = 0.16
cache_write = 2
