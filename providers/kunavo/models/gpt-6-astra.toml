# Price: https://kunavo.com/pricing.json (read 2026-10-24), USD per 1M tokens.
# Cache: read 0.1x and write 1.25x input, the vendor's structure at Kunavo's rate.
# Long context: past 272_000 input tokens the whole request bills at
# 2x input (cache too) and 1.5x output, as the vendor bills it.
# Effort: reasoning_effort on /v1/chat/completions is sent on as
# reasoning.effort, value for value: https://kunavo.com/docs/chat#reasoning.
schema = 2
base_model = "openai/gpt-6-astra"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 4
cache = { read = 0.4, write = 5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 8
cache = { read = 0.8, write = 10 }

[cost.text.output]
price = 20

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 30
