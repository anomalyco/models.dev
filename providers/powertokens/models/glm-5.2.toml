# Pricing: https://powertokens.ai/pricing (USD per 1M tokens, accessed 2026-10-01)
# Request fields: https://docs.powertokens.ai/en/zmodelChat/zhipu/glm-5.2.md (accessed 2026-10-01)
# Endpoint matrix: https://docs.powertokens.ai/en/ecosystem-tools/text-model-protocols.md
# Effort: reasoning_effort; none|minimal skip thinking, low|medium map to high,
# xhigh maps to max, so effective levels are high|max (default max)
base_model = "zhipuai/glm-5.2"

[[reasoning_options]]
type = "effort"
values = ["high", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 1.4
output = 4.4
cache_read = 0.26
cache_write = 0
