# Pricing: https://powertokens.ai/pricing (USD per 1M tokens, re-checked 2026-10-08)
# Request fields: https://docs.powertokens.ai/en/zmodelChat/byteplus/deepseek-v3-2-251201.md (re-checked 2026-10-08)
# Endpoint matrix: https://docs.powertokens.ai/en/ecosystem-tools/text-model-protocols.md
# Served via BytePlus ModelArk (model ID deepseek-v3-2-251201).
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = minimal|low|medium|high
# Host OpenAPI enum for this model is only those four effort values.
# The docs example sends thinking.type=enabled together with reasoning_effort.
# none is not in the documented enum, and minimal is.
base_model = "deepseek/deepseek-v3.2"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["minimal", "low", "medium", "high"]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.28
output = 0.42

[[cost.tiers]]
tier = { type = "context", size = 32_000 }
input = 0.56
output = 0.84
