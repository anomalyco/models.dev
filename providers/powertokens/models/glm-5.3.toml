# Pricing: https://powertokens.ai/pricing (USD per 1M tokens, accessed 2026-10-01)
# Request fields: https://docs.powertokens.ai/en/zmodelChat/zhipu/glm-5.3.md (accessed 2026-10-01)
# Endpoint matrix: https://docs.powertokens.ai/en/ecosystem-tools/text-model-protocols.md
# Effort: reasoning_effort = low|high|max (GLM-5.3 accepts only these tiers; default max)
base_model = "zhipuai/glm-5.3"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 1.4
output = 4.4
cache_read = 0.26
cache_write = 0
