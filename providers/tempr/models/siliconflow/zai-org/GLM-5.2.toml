# Tempr Gateway: https://temprhq.io/docs/gateway-chat-completions#reasoning
# Prices: bring-your-own-key, billed by the upstream provider at its own rates (https://temprhq.io/faq);
# GET https://api.temprhq.io/v1/catalog lists them.
# Effort: reasoning.effort = high|max (alias: top-level reasoning_effort)
# /v1/messages: output_config.effort = high|max
# /v1/responses: reasoning.effort = high|max
schema = 2
base_model = "zhipuai/glm-5.2"

[capabilities]
reasoning = { supported = true, effort = ["high", "max"] }
structured_output = true

[limit]
context = 1_049_000
output = 262_000

[cost.text.input]
price = 1.302
cache = { read = 0.26, write = 0 }

[cost.text.output]
price = 4.092
