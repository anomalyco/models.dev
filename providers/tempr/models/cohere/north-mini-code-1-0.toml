# Tempr Gateway: https://temprhq.io/docs/gateway-chat-completions#reasoning
# Prices: bring-your-own-key, billed by the upstream provider at its own rates (https://temprhq.io/faq);
# GET https://api.temprhq.io/v1/catalog lists them.
# Off: reasoning.effort = "none" (or reasoning.enabled = false)
# Effort: reasoning.effort = none|high (alias: top-level reasoning_effort)
# /v1/messages: thinking.type = enabled|disabled; output_config.effort = high
# /v1/responses: reasoning.effort = none|high
schema = 2
base_model = "cohere/north-mini-code-1-0"

[capabilities]
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = false

[cost.text.input]
price = 0

[cost.text.output]
price = 0
