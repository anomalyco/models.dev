# Tempr Gateway: https://temprhq.io/docs/gateway-chat-completions#reasoning
# Prices: bring-your-own-key, billed by the upstream provider at its own rates (https://temprhq.io/faq);
# GET https://api.temprhq.io/v1/catalog lists them.
# Toggle: reasoning.enabled = true|false (reasoning.effort = "none" also turns it off)
# Budget: reasoning.max_tokens (integer reasoning tokens)
# /v1/messages: thinking.type = enabled|disabled; thinking.budget_tokens
# /v1/responses: reasoning.effort = "none" turns it off, any other level turns it on
schema = 2
base_model = "cohere/command-a-plus-05-2026"

[capabilities]
reasoning = { supported = true, toggle = true, budget = { min = 1 } }
structured_output = true

[cost.text.input]
price = 2.5

[cost.text.output]
price = 10
