# Tempr serves this model on /v1/embeddings, which takes OpenAI's embeddings shape, and
# Gemini gets text input only there: image, audio, video and PDF input isn't reachable.
base_model = "google/gemini-embedding-2"
attachment = false

[cost]
input = 0.2
output = 0

[limit]
output = 1

[modalities]
input = ["text"]
output = ["text"]
