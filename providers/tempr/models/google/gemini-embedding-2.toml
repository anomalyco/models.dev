# Tempr Gateway: https://temprhq.io/docs/gateway-reference
# Prices: bring-your-own-key, billed by the upstream provider at its own rates (https://temprhq.io/faq);
# GET https://api.temprhq.io/v1/catalog lists them, checked 2026-10-21.
# Tempr serves this model on /v1/embeddings, which takes OpenAI's embeddings shape, and
# Gemini gets text input only there: image, audio, video and PDF input isn't reachable.
schema = 2
base_model = "google/gemini-embedding-2"

[modalities]
input = ["text"]
output = ["text"]

[limit]
output = 1

[cost.text.input]
price = 0.2

[cost.text.output]
price = 0
