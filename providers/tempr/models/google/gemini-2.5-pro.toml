# Tempr gap, not uncertainty: verified against Tempr's own source (Program.cs registers
# only Anthropic/Gemini/Cohere behind a request translator; AnthropicRequestTranslator.cs /
# GeminiRequestTranslator.cs / CohereRequestTranslator.cs implement no reasoning/thinking
# field mapping in either direction) -- a caller of Tempr's OpenAI-compatible endpoint has
# no way to set this lab's native reasoning control today.
base_model = "google/gemini-2.5-pro"

reasoning_options = []

[cost]
input = 1.25
output = 10
cache_read = 0.125

[[cost.tiers]]
tier = { type = "context", size = 200000 }
input = 2.5
output = 15
cache_read = 0.25
