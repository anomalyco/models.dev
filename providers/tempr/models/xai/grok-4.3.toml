# Tempr Gateway: https://temprhq.io/docs/gateway-chat-completions#reasoning
# Prices: bring-your-own-key, billed by the upstream provider at its own rates (https://temprhq.io/faq);
# GET https://api.temprhq.io/v1/catalog lists them, checked 2026-10-21.
# Off: reasoning.effort = "none" (or reasoning.enabled = false)
# Effort: reasoning.effort = none|low|medium|high|xhigh (alias: top-level reasoning_effort)
# /v1/messages: thinking.type = enabled|disabled; output_config.effort = low|medium|high|xhigh
# /v1/responses: reasoning.effort = none|low|medium|high|xhigh
# Prompt caching (https://temprhq.io/docs/gateway-reference#prompt-caching): the provider caches long
# prompts automatically, with no request changes.
schema = 2
base_model = "xai/grok-4.3"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
cache = { supported = true, implicit = true }
structured_output = true

[cost.text.input]
price = 1.25
cache = { read = 0.2 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 2.5
cache = { read = 0.4 }

[cost.text.output]
price = 2.5

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 5
