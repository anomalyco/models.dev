# Tempr Gateway: https://temprhq.io/docs/gateway-chat-completions#reasoning
# Prices: bring-your-own-key, billed by the upstream provider at its own rates (https://temprhq.io/faq);
# GET https://api.temprhq.io/v1/catalog lists them, checked 2026-10-21.
# Toggle: reasoning.enabled = true|false (reasoning.effort = "none" also turns it off)
# Effort: reasoning.effort = none|low|high|max (alias: top-level reasoning_effort)
# /v1/messages: thinking.type = enabled|disabled; output_config.effort = low|high|max
# /v1/responses: reasoning.effort = none|low|high|max
# Price: DeepSeek's pricing page lists V4 Pro at 0.66 in / 1.98 out / 0.022 cache hit (off-peak,
# which is what providers/deepseek records for Flash); checked 2026-09-22.
# https://api-docs.deepseek.com/quick_start/pricing
# Prompt caching (https://temprhq.io/docs/gateway-reference#prompt-caching): the provider caches long
# prompts automatically, with no request changes.
schema = 2
base_model = "deepseek/deepseek-v4-pro-0813"
name = "DeepSeek V4 Pro"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
cache = { implicit = true }
structured_output = true

[cost.text.input]
price = 0.66
cache = { read = 0.022 }

[cost.text.output]
price = 1.98
reasoning = 1.98
