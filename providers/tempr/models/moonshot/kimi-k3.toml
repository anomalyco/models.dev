# Tempr Gateway: https://temprhq.io/docs/gateway-chat-completions#reasoning
# No off switch on this host: reasoning.effort = "none" maps to the lowest level below.
# Effort: reasoning.effort = low|high|max (alias: top-level reasoning_effort)
# /v1/messages: output_config.effort = low|high|max
# /v1/responses: reasoning.effort = low|high|max
base_model = "moonshotai/kimi-k3"

reasoning_options = [
  { type = "effort", values = ["low", "high", "max"] },
]

[cost]
input = 3
output = 15
cache_read = 0.3
