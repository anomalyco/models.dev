# Tempr Gateway: https://temprhq.io/docs/gateway-chat-completions#reasoning
# No reasoning control for this model: it reasons at its own depth, and the
# x-tempr-reasoning-effort response header reports "default".
schema = 2
base_model = "moonshotai/kimi-k2.7-code-highspeed"

[capabilities]
reasoning = { supported = true }
structured_output = true

[cost.text.input]
price = 1.9
cache = { read = 0.38 }

[cost.text.output]
price = 8
