# Tempr Gateway: https://temprhq.io/docs/gateway-reference
# Prices: bring-your-own-key, billed by the upstream provider at its own rates (https://temprhq.io/faq);
# GET https://api.temprhq.io/v1/catalog lists them.
# API: POST https://api.temprhq.io/v1/embeddings (https://temprhq.io/docs/gateway-reference.html)
schema = 2
base_model = "openai/text-embedding-3-small"

[limit]
context = 8_191
output = 1_536

[api.embeddings]
sdk = { opencodeai = "none" }

[cost.text.input]
price = 0.02

[cost.text.output]
price = 0
