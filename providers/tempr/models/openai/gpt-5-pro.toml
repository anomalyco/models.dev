# Tempr Gateway: https://temprhq.io/docs/gateway-chat-completions#reasoning
# Prices: bring-your-own-key, billed by the upstream provider at its own rates (https://temprhq.io/faq);
# GET https://api.temprhq.io/v1/catalog lists them.
# Effort: reasoning.effort = high (alias: top-level reasoning_effort)
# /v1/messages: output_config.effort = high
# /v1/responses: reasoning.effort = high
schema = 2
base_model = "openai/gpt-5-pro"

[capabilities]
reasoning = { supported = true, effort = ["high"] }
structured_output = true

[cost.text.input]
price = 15

[cost.text.output]
price = 120
