# Tempr Gateway: https://temprhq.io/docs/gateway-chat-completions#reasoning
# Effort: reasoning.effort = high (alias: top-level reasoning_effort)
# /v1/messages: output_config.effort = high
# /v1/responses: reasoning.effort = high
base_model = "openai/gpt-5-pro"

reasoning_options = [
  { type = "effort", values = ["high"] },
]

[cost]
input = 15
output = 120
