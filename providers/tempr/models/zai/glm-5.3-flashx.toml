# Tempr Gateway: https://temprhq.io/docs/gateway-chat-completions#reasoning
# Prices: bring-your-own-key, billed by the upstream provider at its own rates (https://temprhq.io/faq);
# GET https://api.temprhq.io/v1/catalog lists them, checked 2026-10-21.
# Effort: reasoning.effort = low|high|max (alias: top-level reasoning_effort)
# /v1/messages: output_config.effort = low|high|max
# /v1/responses: reasoning.effort = low|high|max
schema = 2
base_model = "zhipuai/glm-5.3-flash"
name = "GLM-5.3-FlashX"
description = "High-speed GLM-5.3-Flash serving option for coding and agent workflows"
release_date = "2026-09-18"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[cost.text.input]
price = 0.37
cache = { read = 0.075, write = 0 }

[cost.text.output]
price = 1.25
