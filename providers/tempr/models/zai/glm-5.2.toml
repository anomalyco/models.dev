# Tempr Gateway: https://temprhq.io/docs/gateway-chat-completions#reasoning
# Effort: reasoning.effort = high|max (alias: top-level reasoning_effort)
# /v1/messages: output_config.effort = high|max
# /v1/responses: reasoning.effort = high|max
schema = 2
base_model = "zhipuai/glm-5.2"

[capabilities]
reasoning = { supported = true, effort = ["high", "max"] }
structured_output = true

[cost.text.input]
price = 1.4
cache = { read = 0.26, write = 0 }

[cost.text.output]
price = 4.4
