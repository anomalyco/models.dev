# Tempr Gateway: https://temprhq.io/docs/gateway-chat-completions#reasoning
# No caller control on Tempr: Tempr forwards no reasoning settings to this host at
# all. It routes each model to whichever upstream provider serves it, and those providers
# disagree -- most of its models have more than one, and every reasoning model does, so
# there is no deterministic behaviour to expose (checked live 2026-09-20).
base_model = "moonshotai/kimi-k3"
description = "Kimi multimodal agent model for visual understanding, coding, and planning"

reasoning_options = []

[cost]
input = 3
output = 15

[limit]
context = 1_000_000

[modalities]
input = ["text", "image"]
