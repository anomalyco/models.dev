# Tempr Gateway: https://temprhq.io/docs/gateway-chat-completions#reasoning
# Prices: bring-your-own-key, billed by the upstream provider at its own rates (https://temprhq.io/faq);
# GET https://api.temprhq.io/v1/catalog lists them.
# No caller control on Tempr: Tempr forwards no reasoning settings to this host at
# all. It routes each model to whichever upstream provider serves it, and those providers
# disagree, so there is no deterministic behaviour to expose.
schema = 2
base_model = "zhipuai/glm-4.5v"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true }

[limit]
context = 65_536

[cost.text.input]
price = 0.6

[cost.text.output]
price = 1.8
