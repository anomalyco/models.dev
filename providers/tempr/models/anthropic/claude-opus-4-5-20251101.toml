# Tempr Gateway: https://temprhq.io/docs/gateway-chat-completions#reasoning
# Prices: bring-your-own-key, billed by the upstream provider at its own rates (https://temprhq.io/faq);
# GET https://api.temprhq.io/v1/catalog lists them, checked 2026-10-21.
# Toggle: reasoning.enabled = true|false (reasoning.effort = "none" also turns it off)
# Effort: reasoning.effort = none|low|medium|high (alias: top-level reasoning_effort)
# Budget: reasoning.max_tokens (integer reasoning tokens)
# /v1/messages: thinking.type = enabled|disabled; output_config.effort = low|medium|high; thinking.budget_tokens
# /v1/responses: reasoning.effort = none|low|medium|high
# Prompt caching (https://temprhq.io/docs/gateway-reference#prompt-caching): Anthropic caches only at
# cache_control breakpoints (Tempr places them when the account or key turns prompt caching on, or
# passes the client's own); 5m or 1h lifetime, writes at 1.25x (5m) or 2x (1h) input.
schema = 2
base_model = "anthropic/claude-opus-4-5-20251101"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high"], budget = { min = 1_024 } }
cache = { explicit = { ttl = ["5m", "1h"] } }
structured_output = true

[cost.text.input]
price = 5
cache = { read = 0.5, write = { "5m" = 6.25, "1h" = 10 } }

[cost.text.output]
price = 25
