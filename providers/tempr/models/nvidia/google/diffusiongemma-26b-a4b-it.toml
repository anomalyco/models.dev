# Tempr Gateway: https://temprhq.io/docs/gateway-chat-completions#reasoning
# Prices: bring-your-own-key, billed by the upstream provider at its own rates (https://temprhq.io/faq);
# GET https://api.temprhq.io/v1/catalog lists them.
# Off: reasoning.effort = "none" (or reasoning.enabled = false)
# Effort: reasoning.effort = none|minimal|low|medium|high|xhigh|max (alias: top-level reasoning_effort)
# /v1/messages: thinking.type = enabled|disabled; output_config.effort = minimal|low|medium|high|xhigh|max
# /v1/responses: reasoning.effort = none|minimal|low|medium|high|xhigh|max
schema = 2
base_model = "google/diffusiongemma-26b-a4b-it"

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }

[limit]
context = 250_000

[cost.text.input]
price = 0

[cost.text.output]
price = 0
