# Tempr Gateway: https://temprhq.io/docs/gateway-chat-completions#reasoning
# Prices: bring-your-own-key, billed by the upstream provider at its own rates (https://temprhq.io/faq);
# GET https://api.temprhq.io/v1/catalog lists them.
# Effort: reasoning.effort = low|medium|xhigh (alias: top-level reasoning_effort)
# Budget: reasoning.max_tokens (integer reasoning tokens)
# /v1/messages: output_config.effort = low|medium|xhigh; thinking.budget_tokens
# /v1/responses: reasoning.effort = low|medium|xhigh
schema = 2
base_model = "alibaba/qwen3.8-2.4t-a95b"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "xhigh"], budget = {} }
structured_output = true

[limit]
context = 1_000_000

[cost.text.input]
price = 2
cache = { read = 0.25 }

[cost.text.output]
price = 6
