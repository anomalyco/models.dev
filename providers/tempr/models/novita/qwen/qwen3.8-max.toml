# Tempr Gateway: https://temprhq.io/docs/gateway-chat-completions#reasoning
# Prices: bring-your-own-key, billed by the upstream provider at its own rates (https://temprhq.io/faq);
# GET https://api.temprhq.io/v1/catalog lists them.
# Toggle: reasoning.enabled = true|false (reasoning.effort = "none" also turns it off)
# Effort: reasoning.effort = none|low|medium|xhigh (alias: top-level reasoning_effort)
# /v1/messages: thinking.type = enabled|disabled; output_config.effort = low|medium|xhigh
# /v1/responses: reasoning.effort = none|low|medium|xhigh
schema = 2
base_model = "alibaba/qwen3.8-max"

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "xhigh"] }
structured_output = true

[cost.text.input]
price = 2
cache = { read = 0.25, write = 2.5 }

[cost.text.output]
price = 6
