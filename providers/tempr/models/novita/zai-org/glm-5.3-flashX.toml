# Tempr Gateway: https://temprhq.io/docs/gateway-chat-completions#reasoning
# Prices: bring-your-own-key, billed by the upstream provider at its own rates (https://temprhq.io/faq);
# GET https://api.temprhq.io/v1/catalog lists them.
# Effort: reasoning.effort = low|max (alias: top-level reasoning_effort)
# /v1/messages: output_config.effort = low|max
# /v1/responses: reasoning.effort = low|max
schema = 2
base_model = "zhipuai/glm-5.3-flash"
name = "GLM 5.3 FlashX"

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "max"] }
structured_output = true

[limit]
context = 1_048_576

[cost.text.input]
price = 0.37
cache = { read = 0.075 }

[cost.text.output]
price = 1.25
