# Tempr Gateway: https://temprhq.io/docs/gateway-chat-completions#reasoning
# Prices: bring-your-own-key, billed by the upstream provider at its own rates (https://temprhq.io/faq);
# GET https://api.temprhq.io/v1/catalog lists them.
# No caller control on Tempr for this model on this host, deliberately: its effort levels
# don't behave as labelled here, so Tempr exposes none rather than a picker that does the
# opposite of what it says.
schema = 2
base_model = "zhipuai/glm-5.3"

[capabilities]
reasoning = { supported = true }
structured_output = true

[limit]
context = 1_048_575
output = 262_144

[cost.text.input]
price = 1.4
cache = { read = 0.26 }

[cost.text.output]
price = 4.4
