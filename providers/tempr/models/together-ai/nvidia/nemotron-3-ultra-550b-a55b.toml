# Tempr Gateway: https://temprhq.io/docs/gateway-chat-completions#reasoning
# Toggle: reasoning.enabled = true|false (reasoning.effort = "none" also turns it off)
# /v1/messages: thinking.type = enabled|disabled
# /v1/responses: reasoning.effort = "none" turns it off, any other level turns it on
base_model = "nvidia/nemotron-3-ultra-550b-a55b"
structured_output = true

reasoning_options = [
  { type = "toggle" },
]

[cost]
input = 0.60
output = 3.60
cache_read = 0.20

[limit]
context = 512_300
output = 512_300
