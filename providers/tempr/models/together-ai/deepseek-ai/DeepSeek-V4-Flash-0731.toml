# Tempr Gateway: https://temprhq.io/docs/gateway-chat-completions#reasoning
# Toggle: reasoning.enabled = true|false (reasoning.effort = "none" also turns it off)
# Effort: reasoning.effort = none|high|max (alias: top-level reasoning_effort)
# /v1/messages: thinking.type = enabled|disabled; output_config.effort = high|max
# /v1/responses: reasoning.effort = none|high|max
base_model = "deepseek/deepseek-v4-flash-0731"

reasoning_options = [
  { type = "toggle" },
  { type = "effort", values = ["high", "max"] },
]

[cost]
input = 0.14
output = 0.28
cache_read = 0.03
