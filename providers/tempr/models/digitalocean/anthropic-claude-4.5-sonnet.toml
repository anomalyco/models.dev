# Tempr Gateway: https://temprhq.io/docs/gateway-chat-completions#reasoning
# Prices: bring-your-own-key, billed by the upstream provider at its own rates (https://temprhq.io/faq);
# GET https://api.temprhq.io/v1/catalog lists them.
# Toggle: reasoning.enabled = true|false (reasoning.effort = "none" also turns it off)
# Effort: reasoning.effort = none|low|medium|high (alias: top-level reasoning_effort)
# /v1/messages: thinking.type = enabled|disabled; output_config.effort = low|medium|high
# /v1/responses: reasoning.effort = none|low|medium|high
schema = 2
base_model = "anthropic/claude-sonnet-4-5"
name = "Anthropic Claude 4.5 Sonnet"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high"] }

[cost.text.input]
price = 3
cache = { read = 0.3, write = 3.75 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 6
cache = { read = 0.6, write = 7.5 }

[cost.text.output]
price = 15

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 22.5
