# Tempr Gateway: https://temprhq.io/docs/gateway-chat-completions#reasoning
# Effort: reasoning.effort = low|medium|high|xhigh|max (alias: top-level reasoning_effort)
# /v1/messages: output_config.effort = low|medium|high|xhigh|max
# /v1/responses: reasoning.effort = low|medium|high|xhigh|max
base_model = "openai/gpt-6-astra"
base_model_omit = ["cost.context_over_200k", "experimental.modes.fast"]
name = "GPT-6 Astra (Global)"

reasoning_options = [
  { type = "effort", values = ["low", "medium", "high", "xhigh", "max"] },
]

[cost]
input = 10.00
output = 50.00
cache_read = 1.00
cache_write = 12.50

[[cost.tiers]]
tier = { size = 272_000 }
input = 20.00
output = 75.00
cache_read = 2.00
cache_write = 25.00

[modalities]
input = ["text", "image"]
