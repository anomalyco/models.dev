# Tempr Gateway: https://temprhq.io/docs/gateway-chat-completions#reasoning
# Off: reasoning.effort = "none" (or reasoning.enabled = false)
# Effort: reasoning.effort = none|low|medium|high|xhigh|max (alias: top-level reasoning_effort)
# /v1/messages: thinking.type = enabled|disabled; output_config.effort = low|medium|high|xhigh|max
# /v1/responses: reasoning.effort = none|low|medium|high|xhigh|max
base_model = "openai/gpt-5.6-sol"
base_model_omit = ["cost.context_over_200k", "experimental.modes.fast"]
name = "GPT-5.6 Sol (US)"
structured_output = false

reasoning_options = [
  { type = "effort", values = ["none", "low", "medium", "high", "xhigh", "max"] },
]

[cost]
input = 4.40
output = 22.00
cache_read = 0.44
cache_write = 5.50

[[cost.tiers]]
tier = { size = 272_000 }
input = 8.80
output = 33.00
cache_read = 0.88
cache_write = 11.00

[modalities]
input = ["text", "image"]
