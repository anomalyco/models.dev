# Tempr Gateway: https://temprhq.io/docs/gateway-chat-completions#reasoning
# Prices: bring-your-own-key, billed by the upstream provider at its own rates (https://temprhq.io/faq);
# GET https://api.temprhq.io/v1/catalog lists them.
# Off: reasoning.effort = "none" (or reasoning.enabled = false)
# Effort: reasoning.effort = none|low|medium|high|xhigh|max (alias: top-level reasoning_effort)
# /v1/messages: thinking.type = enabled|disabled; output_config.effort = low|medium|high|xhigh|max
# /v1/responses: reasoning.effort = none|low|medium|high|xhigh|max
schema = 2
base_model = "openai/gpt-5.6-sol"
base_model_omit = ["cost.context_over_200k", "experimental.modes.fast"]
name = "GPT-5.6 Sol (US)"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 4.4
cache = { read = 0.44, write = 5.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 8.8
cache = { read = 0.88, write = 11 }

[cost.text.output]
price = 22

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 33
