# Tempr Gateway: https://temprhq.io/docs/gateway-chat-completions#reasoning
# Prices: bring-your-own-key, billed by the upstream provider at its own rates (https://temprhq.io/faq);
# GET https://api.temprhq.io/v1/catalog lists them.
# No reasoning control for this model on this host: it reasons at its own depth,
# and the x-tempr-reasoning-effort response header reports "default".
schema = 2
base_model = "bytedance-seed/seed-2.0-pro"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true

[cost.text.input]
price = 0.5
cache = { read = 0.1 }

[cost.text.output]
price = 3
