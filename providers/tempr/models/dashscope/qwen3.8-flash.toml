# Toggle: enable_thinking = true|false
# Budget: thinking_budget (integer reasoning tokens)
base_model = "alibaba/qwen3.8-flash"

reasoning_options = [
  { type = "toggle" },
  { type = "effort", values = ["low", "medium", "xhigh"] },
  { type = "budget_tokens", max = 262144 },
]

[cost]
input = 0.15
output = 0.47
cache_read = 0.016
cache_write = 0.2
