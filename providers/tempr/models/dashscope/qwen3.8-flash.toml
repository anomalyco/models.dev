# Tempr Gateway: https://temprhq.io/docs/gateway-chat-completions#reasoning
# Toggle: reasoning.enabled = true|false (reasoning.effort = "none" also turns it off)
# Effort: reasoning.effort = none|low|medium|xhigh (alias: top-level reasoning_effort)
# Budget: reasoning.max_tokens (integer reasoning tokens)
# /v1/messages: thinking.type = enabled|disabled; output_config.effort = low|medium|xhigh; thinking.budget_tokens
# /v1/responses: reasoning.effort = none|low|medium|xhigh
base_model = "alibaba/qwen3.8-flash"

reasoning_options = [
  { type = "toggle" },
  { type = "effort", values = ["low", "medium", "xhigh"] },
  { type = "budget_tokens", max = 262144 },
]

[cost]
input = 0.15
output = 0.47
cache_read = 0.016
cache_write = 0.2
