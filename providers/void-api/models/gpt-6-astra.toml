# Effort: reasoning_effort (/v1/chat/completions).
# Freeform probe 2026-11-09: /v1/chat/completions, custom regex ZZ[0-9]{3}, reasoning_effort=low: HTTP 200.
# Despite a conflicting prompt, returned ZZ000 in tool_calls[].function.arguments (type=function), not custom.input.
# Freeform omitted: grammar enforced, but custom-tool response shape incompatible; text/lark untested.
schema = 2
base_model = "openai/gpt-6-astra"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 1.5
cache = { read = 0.144, write = 1.62 }

[cost.text.output]
price = 6
