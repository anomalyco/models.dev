# Pricing, limits and API surface (Chat Completions only):
# https://vivgrid.com/docs/models/gemini-4-neon (accessed 2026-11-20)
# Effort: reasoning_effort = low|medium|high|xhigh, as on Google's
# OpenAI-compatible endpoint for this model.
schema = 2
base_model = "google/gemini-4-neon"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true

[api.chat-completions]
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible" }

[cost.text.input]
price = 3
cache = { read = 0.15 }

[cost.text.output]
price = 15
