# Pricing, context window and max output:
# https://docs.vivgrid.com/models/gpt-6-sol (accessed 2026-09-23)
base_model = "openai/gpt-6-sol"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 2
output = 10
cache_read = 0.2
cache_write = 2.5

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 4
output = 15
cache_read = 0.4
cache_write = 5
