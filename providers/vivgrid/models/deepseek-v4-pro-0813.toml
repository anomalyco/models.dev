# Pricing and capabilities:
# https://docs.vivgrid.com/models/deepseek-v4-pro-0813 (accessed 2026-09-07)
# Reasoning tokens bill at the output rate (no separate CoT price).
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = high|max
# Served on Chat Completions only: every API surface listed for this model uses
# /chat/completions, so it needs the openai-compatible SDK rather than the
# provider default (Responses). https://docs.vivgrid.com/models/deepseek-v4-pro-0813 (accessed 2026-10-21)
schema = 2
base_model = "deepseek/deepseek-v4-pro-0813"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["high", "max"] }
structured_output = true

[api.chat-completions]
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible" }
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.35
cache = { read = 0.05 }

[cost.text.output]
price = 3
reasoning = 3
