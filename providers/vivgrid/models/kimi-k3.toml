# Pricing, context window and max output:
# https://docs.vivgrid.com/models/kimi-k3 (accessed 2026-09-18)
schema = 2
base_model = "moonshotai/kimi-k3"
description = "Kimi multimodal agent model for visual understanding, coding, and planning"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true

[limit]
context = 1_000_000

[cost.text.input]
price = 3
cache = { read = 0.3 }

[cost.text.output]
price = 15
