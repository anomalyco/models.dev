# Pricing, limits and API surface (Chat Completions only):
# https://vivgrid.com/docs/models/gemini-4-carbon (accessed 2026-11-20)
# Effort: reasoning_effort = low|medium|high, as on Google's OpenAI-compatible
# endpoint for this model.
schema = 2
base_model = "google/gemini-4-carbon"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[api.chat-completions]
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible" }

[cost.text.input]
price = 4
cache = { read = 0.2 }

[cost.text.output]
price = 20
