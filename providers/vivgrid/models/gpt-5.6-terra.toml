# Pricing, context window and max output:
# https://docs.vivgrid.com/models/gpt-5.6-terra (accessed 2026-09-18)
schema = 2
base_model = "openai/gpt-5.6-terra"
name = "GPT 5.6 Terra"
description = "GPT model for general reasoning, writing, coding, and tool-assisted tasks"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
temperature = true

[cost.text.input]
price = 2.5
cache = { read = 0.25, write = 3.125 }

[cost.text.output]
price = 15
