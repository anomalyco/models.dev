# Pricing, context window and max output:
# https://docs.vivgrid.com/models/gpt-6-astra (accessed 2026-09-18)
base_model = "openai/gpt-6-astra"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 10
output = 50
cache_read = 1
cache_write = 12.5

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 20
output = 75
cache_read = 2
cache_write = 25