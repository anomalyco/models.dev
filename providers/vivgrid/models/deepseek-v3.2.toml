# Raw POST /v1/chat/completions is documented for this model, but no reasoning
# request field is specified; /v1/responses limits reasoning to GPT-5/o-series.
# https://docs.vivgrid.com/models/deepseek-v3.2 (accessed 2026-06-25)
# https://docs.vivgrid.com/api/model-api (accessed 2026-06-25)
schema = 2
name = "DeepSeek-V3.2"
description = "DeepSeek chat model for instruction following, coding, and analysis"
family = "deepseek"
open_weights = true
knowledge = "2024-07"
release_date = "2025-12-01"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
temperature = true

[limit]
context = 128_000
output = 128_000

[api.chat-completions]
sdk = { aisdk = "@ai-sdk/openai-compatible" }

[cost.text.input]
price = 0.28

[cost.text.output]
price = 0.42
