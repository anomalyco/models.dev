# Pricing, context window and max output:
# https://docs.vivgrid.com/models/claude-haiku-5-5 (accessed 2026-10-08)
# Toggle: thinking.type = adaptive|disabled (disabled is accepted at effort high or below)
# Effort: output_config.effort = low|medium|high|xhigh|max
# https://platform.claude.com/docs/en/build-with-claude/effort#recommended-effort-levels-for-claude-haiku-5-5
base_model = "anthropic/claude-haiku-5-5"
reasoning_options = [{ type = "toggle" }, { type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 0.1
output = 0.5
cache_read = 0.01
cache_write = 0.125

[[cost.tiers]]
tier = { type = "context", size = 100_000 }
input = 0.5
output = 2.5
cache_read = 0.05
cache_write = 0.625

[provider]
npm = "@ai-sdk/anthropic"
