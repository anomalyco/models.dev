# Pricing, context window and max output:
# https://docs.vivgrid.com/models/claude-sonnet-5-5 (accessed 2026-09-30)
base_model = "anthropic/claude-sonnet-5-5"
structured_output = true
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 2.0
output = 10.0
cache_read = 0.20
cache_write = 2.5

[provider]
npm = "@ai-sdk/anthropic"
