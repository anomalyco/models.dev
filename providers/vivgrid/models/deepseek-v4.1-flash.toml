# Pricing, context window and max output:
# https://docs.vivgrid.com/models/deepseek-v4.1-flash (accessed 2026-09-21)
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|high|max
# Served on Chat Completions only: every API surface listed for this model uses
# /chat/completions, so it needs the openai-compatible SDK rather than the
# provider default (Responses). https://docs.vivgrid.com/models/deepseek-v4.1-flash (accessed 2026-10-21)
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true

[api.chat-completions]
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible" }
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.31
cache = { read = 0.01 }

[cost.text.output]
price = 1.23
