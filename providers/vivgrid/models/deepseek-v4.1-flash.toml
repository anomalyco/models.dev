# Pricing, context window and max output:
# https://docs.vivgrid.com/models/deepseek-v4.1-flash (accessed 2026-09-21)
base_model = "deepseek/deepseek-v4.1-flash"

# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|high|max
[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.31
output = 1.23
cache_read = 0.01
