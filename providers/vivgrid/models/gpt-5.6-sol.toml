# Pricing, context window and max output:
# https://docs.vivgrid.com/models/gpt-5.6-sol (accessed 2026-09-18)
schema = 2
base_model = "openai/gpt-5.6-sol"
name = "GPT 5.6 Sol"
description = "GPT model for general reasoning, writing, coding, and tool-assisted tasks"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
temperature = true

[cost.text.input]
price = 5
cache = { read = 0.5, write = 6.25 }

[cost.text.output]
price = 30
