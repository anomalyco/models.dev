# Pricing, context window and max output:
# https://docs.vivgrid.com/models/gpt-5.6-luna (accessed 2026-09-18)
schema = 2
base_model = "openai/gpt-5.6-luna"
name = "GPT 5.6 Luna"
description = "GPT model for general reasoning, writing, coding, and tool-assisted tasks"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
temperature = true

[cost.text.input]
price = 1
cache = { read = 0.1, write = 1.25 }

[cost.text.output]
price = 6
