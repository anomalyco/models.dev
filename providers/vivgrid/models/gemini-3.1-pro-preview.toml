# Raw POST /v1/chat/completions is documented for this model, but no reasoning
# request field is specified; /v1/responses limits reasoning to GPT-5/o-series.
# https://docs.vivgrid.com/models/gemini-3.1-pro-preview (accessed 2026-06-25)
# https://docs.vivgrid.com/api/model-api (accessed 2026-06-25)
schema = 2
name = "Gemini 3.1 Pro Preview"
description = "Advanced Gemini model for complex reasoning, coding, and multimodal analysis"
family = "gemini-pro"
open_weights = false
knowledge = "2025-01"
release_date = "2026-02-19"

[modalities]
input = ["text", "image", "video", "audio", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
temperature = true

[limit]
context = 1_048_576
output = 65_536

[api.chat-completions]
sdk = { aisdk = "@ai-sdk/openai-compatible" }

[cost.text.input]
price = 2
cache = { read = 0.2 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 4
cache = { read = 0.4 }

[cost.text.output]
price = 12

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 18
