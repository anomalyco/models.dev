# Raw POST /v1/chat/completions is documented for this model, but no reasoning
# request field is specified; /v1/responses limits reasoning to GPT-5/o-series.
# https://docs.vivgrid.com/models/gemini-3.1-pro-preview (accessed 2026-06-25)
# https://docs.vivgrid.com/api/model-api (accessed 2026-06-25)
# Base pricing: https://docs.vivgrid.com/models/gemini-3.1-pro-preview (accessed 2026-10-21); the page lists no long-context rate, so the >200K override is unchanged.
schema = 2
base_model = "google/gemini-3.1-pro-preview"
description = "Advanced Gemini model for complex reasoning, coding, and multimodal analysis"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true

[api.chat-completions]
sdk = { aisdk = "@ai-sdk/openai-compatible" }

[cost.text.input]
price = 3
cache = { read = 0.3 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 4
cache = { read = 0.4 }

[cost.text.output]
price = 12

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 18
