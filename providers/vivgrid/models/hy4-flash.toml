# Pricing: https://vivgrid.com/docs/models/hy4-flash (accessed 2026-11-18):
# input $0.07 / cached input $0.01 / output $0.281 per 1M tokens.
# Served on Chat Completions only: every API surface listed for this model uses
# /chat/completions, so it needs the openai-compatible SDK rather than the
# provider default (Responses). https://vivgrid.com/docs/models/hy4-flash (accessed 2026-11-18)
# structured_output: response_format json_schema (strict) is enforced on /v1/chat/completions: asked for a two-line poem under a schema demanding {lines: integer, code: "ZZ123"}, the model returned only {"code": "ZZ123", "lines": 2} (live 2026-11-18).
schema = 2
base_model = "tencent/hy4-flash"

[capabilities]
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = true

[api.chat-completions]
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible" }
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.07
cache = { read = 0.01 }

[cost.text.output]
price = 0.281
