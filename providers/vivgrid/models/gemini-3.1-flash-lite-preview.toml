# Raw POST /v1/chat/completions is documented for this model, but no reasoning
# request field is specified; /v1/responses limits reasoning to GPT-5/o-series.
# https://docs.vivgrid.com/models/gemini-3.1-flash-lite-preview (accessed 2026-06-25)
# https://docs.vivgrid.com/api/model-api (accessed 2026-06-25)
schema = 2
name = "Gemini 3.1 Flash Lite Preview"
description = "Low-latency Gemini model for high-volume multimodal and agent workloads"
family = "gemini-flash-lite"
open_weights = false
knowledge = "2025-01"
release_date = "2026-03-03"

[modalities]
input = ["text", "image", "video", "audio", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
temperature = true

[limit]
context = 1_048_576
output = 65_536

[api.chat-completions]
sdk = { aisdk = "@ai-sdk/openai-compatible" }

[cost.text.input]
price = 0.25
cache = { read = 0.025, write = 1 }

[cost.text.output]
price = 1.5
