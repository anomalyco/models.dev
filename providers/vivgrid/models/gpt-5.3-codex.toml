# Modalities: Text, Image (https://docs.vivgrid.com/models/gpt-5.3-codex, accessed 2026-10-21).
# Pricing, context window and max output:
# https://docs.vivgrid.com/models/gpt-5.3-codex (accessed 2026-09-18)
schema = 2
base_model = "openai/gpt-5.3-codex"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true
temperature = false

[cost.text.input]
price = 1.75
cache = { read = 0.175 }

[cost.text.output]
price = 14
