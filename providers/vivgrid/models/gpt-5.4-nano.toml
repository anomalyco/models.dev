# Raw POST /v1/chat/completions is documented for this ID without a reasoning
# field. POST /v1/responses has an opaque reasoning object for GPT-5/o-series,
# but its documented model list excludes this ID, so no control is verified.
# https://docs.vivgrid.com/models/gpt-5.4-nano (accessed 2026-06-25)
# https://docs.vivgrid.com/api/model-api (accessed 2026-06-25)
# Sunset: Vivgrid legacy model, superseded by gpt-6-luna.
# https://docs.vivgrid.com/models#legacy-models (accessed 2026-10-23)
schema = 2
base_model = "openai/gpt-5.4-nano"
status = "deprecated"
name = "GPT-5.4 Nano"
description = "Compact GPT model for low-latency assistance and high-volume workloads"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
temperature = false

[api.chat-completions]
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible" }

[cost.text.input]
price = 0.2
cache = { read = 0.02 }

[cost.text.output]
price = 1.25
