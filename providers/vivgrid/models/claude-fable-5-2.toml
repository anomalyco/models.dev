# Pricing, context window and max output:
# https://vivgrid.com/docs/models/claude-fable-5-2 (accessed 2026-11-18)
# Effort: output_config.effort = low|medium|high|xhigh|max
# APIs: Messages and Chat Completions. https://vivgrid.com/docs/models/claude-fable-5-2 (accessed 2026-11-18)
schema = 2
base_model = "anthropic/claude-fable-5-2"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[api.chat-completions]
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible" }

[cost.text.input]
price = 8.8
cache = { read = 0.22, write = 11 }

[cost.text.output]
price = 44
