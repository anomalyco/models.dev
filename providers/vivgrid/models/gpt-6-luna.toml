# Pricing, context window and max output:
# https://docs.vivgrid.com/models/gpt-6-luna (accessed 2026-09-23)
base_model = "openai/gpt-6-luna"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 0.1
output = 0.5
cache_read = 0.01
cache_write = 0.125

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 0.2
output = 0.75
cache_read = 0.02
cache_write = 0.25
