# Pricing, context window and max output:
# https://docs.vivgrid.com/models/claude-opus-5 (accessed 2026-09-07)
schema = 2
base_model = "anthropic/claude-opus-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
