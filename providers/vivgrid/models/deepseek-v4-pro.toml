# Raw POST /v1/chat/completions is documented for this model, but no reasoning
# request field is specified; /v1/responses limits reasoning to GPT-5/o-series.
# https://vivgrid.com/docs/models/deepseek-v4-pro (accessed 2026-06-25)
# https://vivgrid.com/docs/api/model-api/vibe-coding (accessed 2026-06-25)
base_model = "deepseek/deepseek-v4-pro"
structured_output = true
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high"] }]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.435
output = 0.87
cache_read = 0.003625

[provider]
npm = "@ai-sdk/openai-compatible"
