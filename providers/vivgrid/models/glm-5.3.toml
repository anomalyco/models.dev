# Pricing, context window and max output:
# https://docs.vivgrid.com/models/glm-5.3 (accessed 2026-10-21)
# Served on Chat Completions only: every API surface listed for this model uses
# /chat/completions, so it needs the openai-compatible SDK rather than the
# provider default (Responses). https://docs.vivgrid.com/models/glm-5.3 (accessed 2026-10-21)
schema = 2
base_model = "zhipuai/glm-5.3"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[api.chat-completions]
sdk = { aisdk = "@ai-sdk/openai-compatible" }
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.2
cache = { read = 0.3 }

[cost.text.output]
price = 4.2
