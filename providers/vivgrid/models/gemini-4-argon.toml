# Pricing, limits and API surface (Chat Completions only):
# https://vivgrid.com/docs/models/gemini-4-argon (accessed 2026-11-15)
# Vivgrid documents 1,048,576 max output for this model, above the 65,536 a
# single Gemini API request returns.
# Effort: reasoning_effort = low|medium|high, as on Google's OpenAI-compatible
# endpoint for this model.
schema = 2
base_model = "google/gemini-4-argon"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
output = 1_048_576

[api.chat-completions]
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible" }

[cost.text.input]
price = 4
cache = { read = 0.2 }

[cost.text.output]
price = 20
