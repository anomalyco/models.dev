# Sources and live wire probes checked 2026-09-24:
# https://docs.infercrane.com/model-apis
# https://huggingface.co/Qwen/Qwen3.8-27B
# Toggle: reasoning.enabled = true|false; both returned HTTP 200.
# Effort: reasoning_effort = low|medium|xhigh; each returned HTTP 200 with
# distinct reasoning_content, while high returned HTTP 400 with the supported set.
# Input boundary: an image_url content block returned HTTP 400 with
# "This model endpoint accepts text input only"; video and file blocks share this guard.
# Interleaved output: thinking responses returned choices[].message.reasoning_content.
base_model = "alibaba/qwen3.8-27b"
attachment = false
reasoning_options = [
  { type = "toggle" },
  { type = "effort", values = ["low", "medium", "xhigh"] },
]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.10
output = 2.20

[limit]
context = 32_768
output = 2_048

[modalities]
input = ["text"]
output = ["text"]
