# CheapestToken — OpenAI-compatible gateway (LiteLLM) relaying DigitalOcean GenAI + Azure Foundry.
# Catalog + billed prices: GET https://api.cheapest-token.com/api/v1/models
# Prices are our billed reseller USD per 1M tokens, intentionally different from upstream list prices.
name = "CheapestToken"
npm = "@ai-sdk/openai-compatible"
opencodeai = "@opencode/ai/providers/openai-compatible"
api = "https://api.cheapest-token.com/v1"
env = ["CHEAPEST_TOKEN_API_KEY"]
doc = "https://cheapest-token.com/docs/opencode"
