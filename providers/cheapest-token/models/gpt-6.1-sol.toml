# CheapestToken relay of openai/gpt-6.1-sol (routed via azure: azure/gpt-6.1-sol). Override-only file:
# identity/description/dates/limits inherit from the base_model lab entry.
# Prices: our billed reseller USD per 1M from GET https://api.cheapest-token.com/api/v1/models
# (input 2 / our output 8 / cached 0.1 / cache write 2.5; long 4 / 12 / 0.2 / 5) — intentionally
# different from upstream list prices.
# Long tier: the whole call bills at the long prices when input tokens STRICTLY exceed 272,000
# (short_context_limit 272000, gt semantics — Azure-style strictly-greater boundary).
# Tools: live on our /v1 chat/completions 2026-10-31: strict function tools, tool_choice
# none/auto/required/named, custom tools freeform text + lark + regex grammar (regex ZZ[0-9]{3}
# returned ZZ731 — grammar enforced). No tool_search on chat/completions (400 "Supported values
# are: 'function' and 'custom'"); plain tool-call round trip verified 2026-10-31.
# Effort: reasoning_effort = low|medium|high|xhigh (chat/completions; an invalid value → 400 listing
# exactly these four, and none → 400 "reasoning_effort=none is not supported", live 2026-10-31 —
# no "max" on this route.
schema = 2
base_model = "openai/gpt-6.1-sol"

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none", "required", "tool"], freeform = ["text", "lark", "regex"] }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }

[cost.text.input]
price = 2
cache = { read = 0.1, write = 2.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 4
cache = { read = 0.2, write = 5 }

[cost.text.output]
price = 8

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 12
