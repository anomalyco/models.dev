# Cheapest Token relay of deepseek/deepseek-v4.1-flash-1017 (routed via digitalocean: openai/deepseek-v4.1-flash-1017).
# Override-only file: identity/description/dates inherit from the base_model lab entry.
# Prices are our billed USD per 1M tokens; output price is what we charge for completions (not the list price).
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"
name = "DeepSeek V4.1 Flash 1017"

[capabilities]
tools = { supported = true }   # verified live on /v1 (tool-call round trip, 2026-10-31)
reasoning = { supported = true, default = { type = "effort", value = "high" }, toggle = true, effort = ["low", "high", "max"] }

[limit]
context = 1_048_576
output = 393_216   # lab output limit; our BE tracks context only

[cost.text.input]
price = 0.3
cache = { read = 0.006 }

[cost.text.output]
price = 1.2
