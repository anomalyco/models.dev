# CheapestToken relay of openai/gpt-6-astra (routed via azure: azure/gpt-6-astra). Override-only file:
# identity/description/dates/limits inherit from the base_model lab entry.
# Prices: our billed reseller USD per 1M from GET https://api.cheapest-token.com/api/v1/models
# (input 10 / our output 35 / cached 1 / cache write 12.5; long 20 / 52.5 / 2 / 25) — intentionally
# different from upstream list prices.
# Long tier: the whole call bills at the long prices when input tokens STRICTLY exceed 272,000
# (short_context_limit 272000, gt semantics — Azure-style strictly-greater boundary).
# Tools: live on our /v1 chat/completions 2026-10-31: strict function tools (work without
# effort=none here, unlike Azure's own chat/completions), tool_choice none/auto/required/named,
# custom tools freeform text + lark + regex grammar (regex ZZ[0-9]{3} returned ZZ123 — grammar
# enforced). No tool_search on chat/completions (400 "Supported values are: 'function' and 'custom'");
# plain tool-call round trip verified 2026-10-31.
# Effort: reasoning_effort = low|medium|high|xhigh (chat/completions; an invalid value → 400 listing
# exactly these four, live 2026-10-31 — "none" and "max" are not supported values on this route.
schema = 2
base_model = "openai/gpt-6-astra"

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none", "required", "tool"], freeform = ["text", "lark", "regex"] }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }

[cost.text.input]
price = 10
cache = { read = 1, write = 12.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 20
cache = { read = 2, write = 25 }

[cost.text.output]
price = 35

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 52.5
