# Regional EU host of the Munito provider; catalog from public
# GET https://api.eu.munito.ai/inference/v1/models (accessed 2026-10-18; the
# same 7 chat models as the global host). Limits and reasoning controls match
# the global host files; read them from providers/munito/.
# Prices are published nowhere: "The console shows the prices of each model"
# (https://docs.munito.ai/speech-to-text, accessed 2026-10-18).
# Requests that keep data (store: true, OCR jobs) must use the host matching
# the account's data region; the other regional host answers 421.
# https://docs.munito.ai/reference/regions
name = "Munito (EU)"
env = ["MUNITO_API_KEY"]
npm = "@ai-sdk/openai-compatible"
api = "https://api.eu.munito.ai/inference/v1"
doc = "https://docs.munito.ai"
