# reasoning = true is the lab capability (Zhipu documents this model as
# always-reasoning, providers/zhipuai/models/glm-5.3-flash.toml);
# reasoning_options = [] records the affirmative absence of a caller control on
# the declared surface: the Munito /chat/completions documentation enumerates its
# accepted request fields and includes none for reasoning
# (https://docs.munito.ai/llms-full.txt, accessed 2026-10-19). thinking.type on
# POST /messages (https://docs.munito.ai/api/createMessage) is a different
# surface than the declared OpenAI-compatible chat api and is not
# interchangeable with it.
# Host modality values are privately-sourced (org-scoped admin model list)
# pending public evidence: input = text + image + video only (the lab's pdf
# input is not offered on this host), and the chat surface documents
# image_url/video_url/input_audio as the media parts a model supports
# (https://docs.munito.ai/api/createChatCompletion).
base_model = "zhipuai/glm-5.3-flash"
reasoning_options = []

[modalities]
input = ["text", "image", "video"]
