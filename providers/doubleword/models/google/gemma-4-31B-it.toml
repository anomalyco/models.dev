# Pricing: realtime tariff from GET https://api.doubleword.ai/v1/models?include=pricing (2026-11-05),
# matching https://docs.doubleword.ai/inference-api/models/google-gemma-4-31b-it. Async/batch tiers are cheaper and not modelled here.
# Reasoning: reasoning_effort only; the gateway rejects `thinking` and `chat_template_kwargs.enable_thinking`
# with a 400 ("use 'reasoning_effort'"), so there is no toggle. It validates none|minimal|low|medium|high|xhigh|max
# and maps them to the model's native levels; effort lists the native/peer set. Live probe 2026-11-05:
# see PR body for per-level reasoning-token counts.
# No reasoning unless reasoning_effort is sent (default request: 0 reasoning tokens).
# Tools and json_schema structured output probed live 2026-11-12.
# Cache hits verified live 2026-11-12.
# Cache: implicit by default, explicit via cache_control (ttl 5m|1h, min prefix 1024 tokens):
# https://docs.doubleword.ai/inference-api/prompt-caching
schema = 2
base_model = "google/gemma-4-31b-it"

[capabilities]
reasoning = { supported = true, effort = ["none", "high"], default = { type = "effort", value = "none" } }
structured_output = true
cache = { implicit = true, explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, min_tokens = 1_024 } }

[cost.text.input]
price = 0.12
cache = { read = 0.12, write = { "5m" = 0.15, "1h" = 0.24 } }

[cost.text.output]
price = 0.35
