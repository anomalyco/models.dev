# Reasoning (verified 2026-09-09): Doubleword forwards reasoning_effort on
# POST https://api.doubleword.ai/v1/chat/completions, validated server-side
# against none|minimal|low|medium|high|xhigh|max (any other value returns 400),
# uniformly across the catalog; effort is honoured (reasoning tokens scale with it).
