# Sources (accessed 2026-10-21):
# - Model card (1M context, 64k max output, text/image/video input, JSON Mode and JSON Schema, effort, prompt cache):
#   https://platform.stepfun.com/docs/zh/guides/models/step-5-preview
# - Pricing (CNY per 1M tokens): 7 input, 0.70 cache hit, 20 output: https://platform.stepfun.com/docs/zh/guides/pricing/details
#   The cache-hit price rose from 0.35 to 0.70 on 2026-10-14 00:30 (UTC+8); accounts that called the model before
#   then keep 0.35 (https://platform.stepfun.com/docs/zh/announcements/step-5-preview-price-adjustment). The standard price is used.
# CNY→USD rate: 6.691314, 2026-10-21, source: https://open.er-api.com/v6/latest/USD
# - Caching: automatic prefix cache from 256 tokens, no cache_control; cache writes bill at the cache-miss input
#   price: https://platform.stepfun.com/docs/zh/guides/developer/prompt-cache
# Effort: reasoning_effort (Chat), output_config.effort (Messages), reasoning.effort (Responses) = low|medium|high
#   (https://platform.stepfun.com/docs/zh/api-reference/chat/chat-completion-create, https://platform.stepfun.com/docs/zh/api-reference/chat/messages-create,
#   https://platform.stepfun.com/docs/zh/api-reference/responses/responses-create).
# Chat Completions returns reasoning in both `reasoning` and `reasoning_content`.
# Sampling: Chat and Responses document temperature and top_p; Messages also documents top_k (0-500).
# Mid-conversation flags (system_updates, effort_updates, tools.updates) unset: undocumented, and no StepFun key to test.
schema = 2
base_model = "stepfun/step-5-preview"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
cache = { implicit = { min_tokens = 256 } }

[limit]
output = 65_536

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 1.04613
cache = { read = 0.10461 }

[cost.text.output]
price = 2.98895
