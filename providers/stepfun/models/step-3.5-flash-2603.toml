# Chat `reasoning_effort` and Messages `output_config.effort` accept low/high
# (accessed 2026-06-25).
# https://platform.stepfun.com/docs/zh/guides/models/step-3.5-flash
schema = 2
name = "Step 3.5 Flash 2603"
description = "StepFun flash model for efficient multimodal reasoning, coding, and tool use"
open_weights = true
knowledge = "2025-01"
release_date = "2026-04-02"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "high"] }
temperature = true

[limit]
context = 256_000
input = 256_000
output = 256_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.1
cache = { read = 0.02 }

[cost.text.output]
price = 0.3
