# CNY→USD rate: 6.679299, 2026-11-24, source: https://open.er-api.com/v6/latest/USD
# - Caching: listed with a cache-hit price; StepFun's prefix cache starts at 256 tokens (https://platform.stepfun.com/docs/zh/guides/developer/prompt-cache).
