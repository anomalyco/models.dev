# Price and limits: https://api.oceantoken.ai/public/model_hub (accessed 2026-10-18), USD per 1M tokens.
# Effort: reasoning_effort on POST /v1/chat/completions
base_model = "meta/muse-spark-1.3"
reasoning_options = [
  { type = "effort", values = ["minimal", "low", "medium", "high", "xhigh", "max"] },
]

[cost]
input = 1.25
output = 4.25
cache_read = 0.15

[modalities]
input = ["text", "image", "video", "pdf"]
output = ["text"]
