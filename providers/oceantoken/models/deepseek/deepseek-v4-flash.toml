# Price and limits: https://api.oceantoken.ai/public/model_hub (accessed 2026-10-18), USD per 1M tokens.
# Effort: reasoning_effort on POST /v1/chat/completions
base_model = "deepseek/deepseek-v4-flash"
reasoning_options = [
  { type = "effort", values = ["none", "high", "xhigh"] },
]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.098
output = 0.196
cache_read = 0.0196
