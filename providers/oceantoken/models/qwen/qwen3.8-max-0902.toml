# Price and limits: https://api.oceantoken.ai/public/model_hub (accessed 2026-10-18), USD per 1M tokens.
# Effort: reasoning_effort on POST /v1/chat/completions
base_model = "alibaba/qwen3.8-max-0902"
reasoning_options = [
  { type = "effort", values = ["minimal", "low", "medium", "high", "xhigh"] },
]

[cost]
input = 2
output = 6
cache_read = 0.25
cache_write = 2.5

[limit]
context = 983_616

[modalities]
input = ["text", "image", "video"]
output = ["text"]
