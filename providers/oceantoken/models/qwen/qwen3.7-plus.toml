# Price and limits: https://api.oceantoken.ai/public/model_hub (accessed 2026-10-18), USD per 1M tokens.
# Toggle: reasoning_effort = "none" turns thinking off on POST /v1/chat/completions; omit it for the model default
base_model = "alibaba/qwen3.7-plus"
reasoning_options = [
  { type = "toggle" },
]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.32
output = 1.28
cache_read = 0.064
cache_write = 0.4

[[cost.tiers]]
tier = { type = "context", size = 256_000 }
input = 0.96
output = 3.84
cache_read = 0.192
cache_write = 1.2

[limit]
context = 983_616

[modalities]
input = ["text", "image"]
output = ["text"]
