# Price and limits: https://api.oceantoken.ai/public/model_hub (accessed 2026-10-18), USD per 1M tokens.
# Toggle: reasoning_effort = "none" turns thinking off on POST /v1/chat/completions; omit it for the model default
base_model = "alibaba/qwen3.6-35b-a3b"
reasoning_options = [
  { type = "toggle" },
]

[cost]
input = 0.15
output = 1
cache_read = 0.05

[modalities]
input = ["text", "image", "video"]
output = ["text"]
