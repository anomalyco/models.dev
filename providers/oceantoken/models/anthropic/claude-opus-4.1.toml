# Price and limits: https://api.oceantoken.ai/public/model_hub (accessed 2026-10-18), USD per 1M tokens.
# Claude models use the Anthropic Messages API: POST https://api.oceantoken.ai/v1/messages
# Toggle: thinking.type = enabled|disabled
base_model = "anthropic/claude-opus-4-1"
reasoning_options = [
  { type = "toggle" },
]

[provider]
npm = "@ai-sdk/anthropic"
api = "https://api.oceantoken.ai/v1"

[cost]
input = 15
output = 75
cache_read = 1.5
cache_write = 18.75
