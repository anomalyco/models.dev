# Price and limits: https://api.oceantoken.ai/public/model_hub (accessed 2026-10-18), USD per 1M tokens.
# Effort: reasoning_effort on POST /v1/chat/completions
base_model = "bytedance-seed/seed-2.0-lite"
reasoning_options = [
  { type = "effort", values = ["none", "minimal", "low", "medium", "high"] },
]

[cost]
input = 0.25
output = 2

[[cost.tiers]]
tier = { type = "context", size = 128_000 }
input = 0.5
output = 4
