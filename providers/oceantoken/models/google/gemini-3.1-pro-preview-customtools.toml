# Price and limits: https://api.oceantoken.ai/public/model_hub (accessed 2026-10-18), USD per 1M tokens.
# Effort: reasoning_effort on POST /v1/chat/completions
base_model = "google/gemini-3.1-pro-preview-customtools"
reasoning_options = [
  { type = "effort", values = ["low", "medium", "high"] },
]

[interleaved]
field = "reasoning_content"

[cost]
input = 2
output = 12
cache_read = 0.2
cache_write = 2.375

[[cost.tiers]]
tier = { size = 200_000 }
input = 4.0
output = 18.0
cache_read = 0.4
