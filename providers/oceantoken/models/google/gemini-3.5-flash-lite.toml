# Price and limits: https://api.oceantoken.ai/public/model_hub (accessed 2026-10-18), USD per 1M tokens.
# Effort: reasoning_effort on POST /v1/chat/completions
base_model = "google/gemini-3.5-flash-lite"
reasoning_options = [
  { type = "effort", values = ["minimal", "low", "medium", "high"] },
]

[cost]
input = 0.3
output = 2.5
cache_read = 0.03
cache_write = 0.383333
