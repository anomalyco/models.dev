# Price and limits: https://api.oceantoken.ai/public/model_hub (accessed 2026-10-18), USD per 1M tokens.
# Effort: reasoning_effort on POST /v1/chat/completions
base_model = "openai/gpt-5.6-sol"
reasoning_options = [
  { type = "effort", values = ["none", "low", "medium", "high", "xhigh", "max"] },
]

[cost]
input = 4
output = 20
cache_read = 0.4
cache_write = 5

[[cost.tiers]]
tier = { size = 272_000 }
input = 8.0
output = 30.0
cache_read = 0.8
cache_write = 10.0
