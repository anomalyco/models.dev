# Price and limits: https://api.oceantoken.ai/public/model_hub (accessed 2026-10-18), USD per 1M tokens.
# Price: 90% of the lab's list price (the catalog's official price x 0.9); every customer is billed this since 2026-10-18.
# Effort: reasoning_effort on POST /v1/chat/completions
base_model = "openai/gpt-5.4-nano"
reasoning_options = [
  { type = "effort", values = ["none", "low", "medium", "high", "xhigh"] },
]

[cost]
input = 0.18
output = 1.125
cache_read = 0.018
