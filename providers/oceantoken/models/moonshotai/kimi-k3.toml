# Price and limits: https://api.oceantoken.ai/public/model_hub (accessed 2026-10-18), USD per 1M tokens.
# Effort: reasoning_effort on POST /v1/chat/completions
base_model = "moonshotai/kimi-k3"
reasoning_options = [
  { type = "effort", values = ["none", "low", "high", "max"] },
]

[interleaved]
field = "reasoning_content"

[cost]
input = 3
output = 15
cache_read = 0.3
