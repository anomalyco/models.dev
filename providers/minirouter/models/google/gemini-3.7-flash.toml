base_model = "google/gemini-3.7-flash"
description = "Fast Gemini model balancing multimodal reasoning, tool use, and cost"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
input = 0.7875
output = 3.9375
cache_read = 0.07875

[limit]
context = 1_000_000

[modalities]
input = ["text", "image", "pdf"]
