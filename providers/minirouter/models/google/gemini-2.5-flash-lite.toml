# Off: reasoning.effort=none; omit reasoning to use the model default/on mode.
base_model = "google/gemini-2.5-flash-lite"
name = "Gemini 2.5 Flash Lite"

[[reasoning_options]]
type = "effort"
values = ["none"]

[[reasoning_options]]
type = "budget_tokens"
min = 512
max = 24_576

[cost]
input = 0.105
output = 0.42
cache_read = 0.0105

[modalities]
input = ["text", "image", "pdf"]
