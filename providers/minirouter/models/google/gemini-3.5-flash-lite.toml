base_model = "google/gemini-3.5-flash-lite"
description = "Low-latency Gemini model for high-volume multimodal and agent workloads"

[[reasoning_options]]
type = "effort"
values = ["minimal", "low", "medium", "high"]

[cost]
input = 0.315
output = 2.625
cache_read = 0.0315

[limit]
context = 1_000_000
output = 65_000

[modalities]
input = ["text", "image", "pdf"]
