# Off: reasoning.effort=none; omit reasoning to use the model default/on mode.
base_model = "alibaba/qwen3.6-27b"

[[reasoning_options]]
type = "effort"
values = ["none"]

[[reasoning_options]]
type = "budget_tokens"
min = 1
max = 131_072

[cost]
input = 0.63
output = 3.78

[limit]
context = 256_000
output = 256_000

[modalities]
input = ["text", "image", "pdf"]
