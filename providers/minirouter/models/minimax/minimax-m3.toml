# Off: reasoning.effort=none; omit reasoning to use the model default/on mode.
base_model = "minimax/MiniMax-M3"

[[reasoning_options]]
type = "effort"
values = ["none"]

[cost]
input = 0.315
output = 1.26
cache_read = 0.063

[limit]
context = 1_000_000
output = 1_000_000

[modalities]
input = ["text", "image", "pdf"]
