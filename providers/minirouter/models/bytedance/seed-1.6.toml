# Off: reasoning.effort=none; omit reasoning to use the model default/on mode.
# MiniRouter's exact-ID snapshot records image+text input on the reasoning Seed
# 1.6 model; attachment/modalities are the host delta from the shared text lab row.
# Source: https://github.com/SolWorks-Dev/minirouter/blob/35ac01a7b87b5feec3984c49c1eb995d74f0ae23/parity/snapshots/2026-08-06/artifacts/models.json
base_model = "bytedance-seed/seed-1-6"
attachment = true

[[reasoning_options]]
type = "effort"
values = ["none"]

[cost]
input = 0.2625
output = 2.1
cache_read = 0.0525

[limit]
output = 32_000

[modalities]
input = ["text", "image"]
