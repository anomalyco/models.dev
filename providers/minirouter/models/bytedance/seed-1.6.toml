# MiniRouter's exact-ID snapshot describes a multimodal deep-thinking model and
# records image+text input, so this maps to the Vision lab identity with reasoning
# re-enabled as a host-specific capability.
# Source: https://github.com/SolWorks-Dev/minirouter/blob/35ac01a7b87b5feec3984c49c1eb995d74f0ae23/parity/snapshots/2026-08-06/artifacts/models.json
base_model = "bytedance-seed/seed-1-6-vision"
name = "Seed 1.6"
reasoning = true
reasoning_options = []

[cost]
input = 0.2625
output = 2.1
cache_read = 0.0525

[limit]
output = 32_000

[modalities]
input = ["text", "image"]
