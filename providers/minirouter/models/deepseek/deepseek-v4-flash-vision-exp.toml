# MiniRouter forwards this request to Vercel AI Gateway. Keep the graded
# effort values from that same-surface peer; MiniRouter rejects its toggle field.
# https://vercel.com/docs/ai-gateway/models-and-providers/reasoning
base_model = "deepseek/deepseek-v4-flash-vision-exp"

[[reasoning_options]]
type = "effort"
values = ["high", "xhigh"]

[cost]
input = 0.231
output = 0.693
cache_read = 0.00735
