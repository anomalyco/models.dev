# Reasoning controls for POST /v1/chat/completions:
# Effort: reasoning.effort = none|minimal|low|medium|high|xhigh|max
# Budget: reasoning.max_tokens = positive integer
# MiniRouter rejects reasoning.enabled, so no toggle is advertised; omit the
# reasoning object to use the selected model's default behavior.
name = "minirouter"
env = ["MINIROUTER_API_KEY"]
npm = "@ai-sdk/openai-compatible"
api = "https://api.minirouter.sh/v1"
doc = "https://minirouter.sh/docs/models"
