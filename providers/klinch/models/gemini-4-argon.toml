# Price: https://klinch.app/en/models/gemini-4-argon/ (read 2026-11-27), USD per 1M tokens.
# Cache: Klinch adds cache_control breakpoints itself when a request has none
# and the prefix is likely re-sent, and keeps a client's own cache_control on
# the Messages API; cached reads are billed at the published cache-read price.
# Reasoning: Chat Completions reasoning_effort (and Messages output_config.effort)
# is forwarded as low | medium | high; none and minimal map to low, xhigh and max
# to high, so only the three levels that reach the model are listed.
schema = 2
base_model = "google/gemini-4-argon"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
cache = { implicit = true }

[api.chat-completions]

[api.messages]
base_url = "https://api.klinch.cloud/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.455
cache = { read = 0.0455 }

[cost.text.output]
price = 1.2
