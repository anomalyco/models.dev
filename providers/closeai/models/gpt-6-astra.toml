schema = 2
base_model = "openai/gpt-6-astra"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
system_updates = true
store = true
cache = { implicit = { min_tokens = 1024 }, explicit = { ttl = ["30m", "12h"], max_breakpoints = 4, min_tokens = 1024 } }
prompt_cache_key = true

[api.chat-completions]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible" }
