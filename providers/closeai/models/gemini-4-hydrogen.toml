# Pricing is per account: the effective per-token price depends on the account's plan and is
# only shown in the console after sign-in (https://platform.closeai-asia.com/pricing).
# Cost is intentionally omitted.
schema = 2
base_model = "google/gemini-4-hydrogen"

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, default = { type = "effort", value = "high" }, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
cache = { implicit = { min_tokens = 4096 } }
temperature = true

[api.generate-content]
base_url = "https://api.openai-proxy.org/google/v1beta"
sdk = { aisdk = "@ai-sdk/google", opencodeai = "@opencode/ai/providers/google" }
