# Pricing is per account: the effective per-token price depends on the account's plan and is
# only shown in the console after sign-in (https://platform.closeai-asia.com/pricing).
# Cost is intentionally omitted.
schema = 2
base_model = "moonshotai/kimi-k3"

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none", "required"] }
reasoning = { supported = true, default = { type = "effort", value = "max" }, effort = ["low", "high", "max"] }
structured_output = true
system_updates = true
stream_usage = true
prompt_cache_key = true
cache = { implicit = { ttl = ["5m", "1h"] } }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
