# Toggle: thinking.type = adaptive|disabled
# Effort: output_config.effort = low|medium|high|xhigh|max
# Pricing is per account: the effective per-token price depends on the account's plan and is
# only shown in the console after sign-in (https://platform.closeai-asia.com/pricing).
# Cost is intentionally omitted.
schema = 2
base_model = "anthropic/claude-sonnet-5"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 1024 } }

[api.messages]
base_url = "https://api.openai-proxy.org/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }
