# OCI list price, pay as you go, USD (public price list, part B108080, accessed 2026-09-14):
# $0.0018 per 10,000 transactions, where one transaction is one character of input or
# output. OCI's model pages estimate four characters per token, so the per-token price used
# here is $0.0018 / 10,000 * 4 * 1,000,000 = $0.72 per 1M input and output tokens.
# Limits from https://docs.oracle.com/en-us/iaas/Content/generative-ai/meta-llama-3-3-70b.htm
# The endpoint returns tool-call arguments as JSON strings and requires the first message
# of a tool-calling request to be a user message.
# opencode sends its system prompt first with tools; OCI rejects that for Llama models
# (400 "Tool calling for this Llama model requires the first message to be a user message").
# Deprecated: OCI's on-demand retirement table lists Meta Llama 3.3 70B with retirement "P1" (at least one month after
# the first replacement) and names Llama 4 Maverick and Scout as replacements, so retirement is scheduled.
# https://docs.oracle.com/en-us/iaas/Content/generative-ai/deprecating-on-demand.htm (checked 2026-10-21)
schema = 2
base_model = "meta/llama-3.3-70b-instruct"
status = "deprecated"

[capabilities]
tools = { supported = false }

[cost.text.input]
price = 0.72

[cost.text.output]
price = 0.72
