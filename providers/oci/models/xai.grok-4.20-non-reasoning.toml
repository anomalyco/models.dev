# OCI list price, pay as you go, USD per 1M tokens (public price list "Grok 4.2" parts
# B111910/B111911/B112076-B112079, accessed 2026-09-14); the higher band applies above 200K
# prompt tokens. Model is hosted by xAI and called through OCI. Limits from
# https://docs.oracle.com/en-us/iaas/Content/generative-ai/xai-grok-4-20.htm (1M context).
# Only text and base64 images were verified through this endpoint; PDF input is not declared.
schema = 2
base_model = "xai/grok-4.20-0309-non-reasoning"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
structured_output = true

[cost.text.input]
price = 1.25
cache = { read = 0.2 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 2.5
cache = { read = 0.4 }

[cost.text.output]
price = 2.5

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 5
