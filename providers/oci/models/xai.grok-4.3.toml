# OCI list price, pay as you go, USD per 1M tokens (public price list, parts B112080-B112085,
# accessed 2026-09-14); the higher band applies above 200K prompt tokens. Model is hosted by
# xAI and called through OCI (see the OCI model page). Limits from
# https://docs.oracle.com/en-us/iaas/Content/generative-ai/xai-grok-4-3.htm (1M context).
# Effort: reasoning_effort mirrors xAI's controls for this model.
# Only text and base64 images were verified through this endpoint; PDF input is not declared.
schema = 2
base_model = "xai/grok-4.3"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 1.25
cache = { read = 0.2 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 2.5
cache = { read = 0.4 }

[cost.text.output]
price = 2.5

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 5
