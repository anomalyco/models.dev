# OCI list price, pay as you go, USD per 1M tokens (public price list, parts B112006/B112007,
# accessed 2026-09-14). Context and output limits from
# https://docs.oracle.com/en-us/iaas/Content/generative-ai/openai-gpt-oss-20b.htm: 128,000 tokens
# prompt + response; Oracle documents a 16,000-token response cap in its playground and no
# larger API cap, so 16,384 is used here.
# Effort: reasoning_effort = low|medium|high (accepted on this endpoint, 2026-09-14).
# Reasoning is streamed in `reasoning_content` deltas.
schema = 2
base_model = "openai/gpt-oss-20b"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
context = 128_000
output = 16_384

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.07

[cost.text.output]
price = 0.3
