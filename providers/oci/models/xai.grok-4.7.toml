# OCI list price, pay as you go, USD per 1M tokens (public price list parts B113303-B113308,
# accessed 2026-11-05); the higher band applies above 200K prompt tokens ("long context").
# OCI also sells a priority tier (service_tier = priority, parts B113309-B113314) at twice these
# prices: the priority multiplier. Model is hosted by xAI and called through OCI.
# Facts from https://docs.oracle.com/en-us/iaas/Content/generative-ai/x-ai-grok-4-7.htm: 500K
# context, reasoning cannot be disabled, effort low|medium|high (default)|xhigh, function calling,
# structured outputs, cached input tokens, on-demand in us-ashburn-1, us-chicago-1, us-phoenix-1.
# Effort: reasoning_effort = low|medium|high|xhigh (mirrors xAI's controls for this model).
# Only text and image input are documented for Grok on OCI; PDF input is not declared.
schema = 2
base_model = "xai/grok-4.7"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "high" }, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
service_tier = ["priority"]

[cost.text.input]
price = 2
cache = { read = 0.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 4
cache = { read = 1 }

[cost.text.output]
price = 6

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 12

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 2
