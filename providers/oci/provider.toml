# OCI Generative AI, OpenAI-compatible endpoint (accessed 2026-11-05):
# POST https://inference.generativeai.<region>.oci.oraclecloud.com/openai/v1/chat/completions
# Auth: an OCI Generative AI API key sent as `Authorization: Bearer <key>` (create one with
# `oci generative-ai api-key create`; keys are regional and compartment-scoped, no other
# header is needed). API keys exist in six regions: eu-frankfurt-1, ap-hyderabad-1, ap-osaka-1,
# us-ashburn-1, us-chicago-1 and us-phoenix-1 (https://docs.oracle.com/en-us/iaas/Content/generative-ai/api-keys.htm).
# The key must be in the same region as the model, and not every model is served in every region
# (https://docs.oracle.com/en-us/iaas/Content/generative-ai/model-endpoint-regions.htm): Grok is
# on-demand in Ashburn, Chicago and Phoenix; gpt-oss in Chicago, Frankfurt and Osaka; Llama 4 in
# Chicago. The default URL below targets us-chicago-1, the one region that serves every model
# listed here; for another region set the provider baseURL option in the consuming tool.
# Reasoning: reasoning_effort = low|medium|high on gpt-oss and Grok 4.3, low|medium|high|xhigh on
# Grok 4.6/4.7; the Grok 4.20 reasoning variants reject reasoning_effort (400). gpt-oss streams
# reasoning as `reasoning_content` deltas. Streaming clients must accept gzip (the endpoint
# negotiates zstd and compresses each streamed chunk as a separate frame).
# Models below are the ones Oracle lists for API-key access to this endpoint (Meta Llama,
# xAI Grok, OpenAI gpt-oss); Cohere, Google and commercial OpenAI models are served by the native
# OCI API only. The Grok 4.20 ids are OCI's undated aliases (xai.grok-4.20-reasoning ->
# xai.grok-4.20-0309-reasoning, etc.). On-demand retirements (xai.grok-3*, xai.grok-4,
# xai.grok-4-fast-*, xai.grok-4-1-fast-*, xai.grok-code-fast-1, retired 2026-08-15) were never
# listed here: https://docs.oracle.com/en-us/iaas/Content/generative-ai/deprecating-on-demand.htm
# Sources:
# https://docs.oracle.com/en-us/iaas/Content/generative-ai/openai-compatible-api.htm
# https://docs.oracle.com/en-us/iaas/Content/generative-ai/api-keys.htm
# https://docs.oracle.com/en-us/iaas/Content/generative-ai/pretrained-models.htm
name = "OCI Generative AI"
env = ["OCI_GENAI_API_KEY"]
npm = "@ai-sdk/openai-compatible"
opencodeai = "@opencode/ai/providers/openai-compatible"
api = "https://inference.generativeai.us-chicago-1.oci.oraclecloud.com/openai/v1"
doc = "https://docs.oracle.com/en-us/iaas/Content/generative-ai/pretrained-models.htm"
