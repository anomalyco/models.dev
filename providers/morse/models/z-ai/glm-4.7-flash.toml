cache = { implicit = true }

[limit]
output = 128_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.0875
cache = { read = 0.0125 }

[cost.text.output]
price = 0.5
