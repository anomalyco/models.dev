# Sources: Morse model catalog (https://api.trymorse.ai/v1/catalog) and https://trymorse.ai/inference/models, accessed 2026-11-23.
# Input: text only on Morse. The catalog lists no image input for this model and the endpoint refuses images, though the lab model accepts them.
schema = 2
base_model = "alibaba/qwen3.8-27b"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["low", "medium", "xhigh"] }
top_k = false
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.5
cache = { read = 0.1 }

[cost.text.output]
price = 3
