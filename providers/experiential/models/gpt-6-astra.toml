# Source: https://api.experientiallabs.ai/api/models/gpt-6-astra
# List prices in USD per million tokens; temporary promotions are excluded.
# Host docs describe function tools; freeform formats remain unadvertised without grammar-enforcement evidence.
# Reasoning baseline: providers/openai/models/gpt-6-astra.toml; restricted to all default serving routes.
# Effort: top-level reasoning_effort = low|medium|high|xhigh.
# Host protocol: https://platform.experientiallabs.ai/docs/openai-compatibility
# Cache: host docs describe provider prefix reuse; published cache prices establish support.
schema = 2
base_model = "openai/gpt-6-astra"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 10
cache = { read = 1, write = 12.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 20
cache = { read = 2 }

[cost.text.output]
price = 50

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 75
