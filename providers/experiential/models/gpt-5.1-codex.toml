# Source: https://api.experientiallabs.ai/api/models/gpt-5.1-codex
# List prices in USD per million tokens; temporary promotions are excluded.
# Reasoning baseline: providers/openrouter/models/openai/gpt-5.1-codex.toml; restricted to all default serving routes.
# Effort: top-level reasoning_effort = low|medium|high.
# Host protocol: https://platform.experientiallabs.ai/docs/openai-compatibility
schema = 2
base_model = "openai/gpt-5.1-codex"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 1.25
cache = { read = 0.13 }

[cost.text.output]
price = 10
