# Source: https://api.experientiallabs.ai/api/models/gpt-5.4-mini
# List prices in USD per million tokens; temporary promotions are excluded.
# Reasoning baseline: providers/openai/models/gpt-5.4-mini.toml; restricted to all default serving routes.
# Effort: top-level reasoning_effort = none|low|medium|high|xhigh.
# Host protocol: https://platform.experientiallabs.ai/docs/openai-compatibility
schema = 2
base_model = "openai/gpt-5.4-mini"
name = "GPT-5.4 Mini"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true
temperature = false

[cost.text.input]
price = 0.75
cache = { read = 0.075 }

[cost.text.output]
price = 4.5
