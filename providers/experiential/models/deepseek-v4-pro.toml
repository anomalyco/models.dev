# Source: https://api.experientiallabs.ai/api/models/deepseek-v4-pro
# List prices in USD per million tokens; temporary promotions are excluded.
# Reasoning baseline: https://api-docs.deepseek.com/guides/thinking_mode/; intersected with published default-route efforts.
# Effort: top-level reasoning_effort = low|high|max.
# Host protocol: https://platform.experientiallabs.ai/docs/openai-compatibility
schema = 2
base_model = "deepseek/deepseek-v4-pro"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = false

[limit]
context = 1_048_576
input = 655_360

[cost.text.input]
price = 1.74
cache = { read = 0.145 }

[cost.text.output]
price = 3.48
