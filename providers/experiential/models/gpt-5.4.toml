# Source: https://api.experientiallabs.ai/api/models/gpt-5.4
# List prices in USD per million tokens; temporary promotions are excluded.
# Reasoning baseline: providers/openai/models/gpt-5.4.toml; restricted to all default serving routes.
# Effort: top-level reasoning_effort = low|medium|high|xhigh.
# Host protocol: https://platform.experientiallabs.ai/docs/openai-compatibility
schema = 2
base_model = "openai/gpt-5.4"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true

[cost.text.input]
price = 2.5
cache = { read = 0.25, write = 3.125 }

[cost.text.output]
price = 15
