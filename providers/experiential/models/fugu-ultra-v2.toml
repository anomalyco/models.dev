# Source: https://api.experientiallabs.ai/api/models/fugu-ultra-v2
# List prices in USD per million tokens; temporary promotions are excluded.
# Reasoning baseline: providers/openrouter/models/sakana/fugu-ultra-v2.toml; restricted to all default serving routes.
# Effort: top-level reasoning_effort = high|xhigh|max.
# Host protocol: https://platform.experientiallabs.ai/docs/openai-compatibility
schema = 2
base_model = "sakana/fugu-ultra-v2"

[capabilities]
reasoning = { supported = true, effort = ["high", "xhigh", "max"] }
structured_output = true

[limit]
input = 872_000

[cost.text.input]
price = 5
cache = { read = 0.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 10
cache = { read = 1 }

[cost.text.output]
price = 30

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 45
