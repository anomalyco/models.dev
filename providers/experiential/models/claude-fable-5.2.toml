# Source: https://api.experientiallabs.ai/api/models/claude-fable-5.2
# List prices in USD per million tokens; temporary promotions are excluded.
# Reasoning baseline: providers/anthropic/models/claude-fable-5-2.toml; restricted to all default serving routes.
# Effort: top-level reasoning_effort = low|medium|high|xhigh|max.
# Host protocol: https://platform.experientiallabs.ai/docs/openai-compatibility
# Cache: host docs describe provider prefix reuse; published cache prices establish support.
schema = 2
base_model = "anthropic/claude-fable-5-2"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true }

[limit]
input = 1_000_000

[cost.text.input]
price = 8
cache = { read = 0.2, write = 10 }

[cost.text.output]
price = 40
