# Source: https://api.experientiallabs.ai/api/models/grok-4.7
# List prices in USD per million tokens; temporary promotions are excluded.
# Reasoning baseline: providers/xai/models/grok-4.7.toml; restricted to all default serving routes.
# Effort: top-level reasoning_effort = low|medium|high|xhigh.
# Host protocol: https://platform.experientiallabs.ai/docs/openai-compatibility
schema = 2
base_model = "xai/grok-4.7"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true

[limit]
input = 372_000
output = 128_000

[cost.text.input]
price = 2
cache = { read = 0.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 199_999 } }
price = 4
cache = { read = 1 }

[cost.text.output]
price = 6

[[cost.text.output.overrides]]
when = { context = { gt = 199_999 } }
price = 12
