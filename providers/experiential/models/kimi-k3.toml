# Source: https://api.experientiallabs.ai/api/models/kimi-k3
# List prices in USD per million tokens; temporary promotions are excluded.
# Catalog omits max_output_tokens; inherit the canonical lab output limit.
# Reasoning baseline: https://api.experientiallabs.ai/api/models/kimi-k3; intersected with published default-route efforts.
# Effort: top-level reasoning_effort = low|high|max.
# Host protocol: https://platform.experientiallabs.ai/docs/openai-compatibility
# Cache: host docs describe provider prefix reuse; published cache prices establish support.
schema = 2
base_model = "moonshotai/kimi-k3"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = false
cache = { implicit = true }

[limit]
input = 1_048_576

[cost.text.input]
price = 3
cache = { read = 0.23 }

[cost.text.output]
price = 15
