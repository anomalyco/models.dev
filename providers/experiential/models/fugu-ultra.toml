# Source: https://api.experientiallabs.ai/api/models/fugu-ultra
# List prices in USD per million tokens; temporary promotions are excluded.
# Reasoning baseline: providers/sakana/models/fugu-ultra.toml; restricted to all default serving routes.
# Effort: top-level reasoning_effort = high|xhigh.
# Host protocol: https://platform.experientiallabs.ai/docs/openai-compatibility
schema = 2
base_model = "sakana/fugu-ultra"

[capabilities]
reasoning = { supported = true, effort = ["high", "xhigh"] }
structured_output = true

[limit]
input = 872_000
output = 128_000

[cost.text.input]
price = 5
cache = { read = 0.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 10
cache = { read = 1 }

[cost.text.output]
price = 30

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 45
