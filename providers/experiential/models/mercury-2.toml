# Source: https://api.experientiallabs.ai/api/models/mercury-2
# List prices in USD per million tokens; temporary promotions are excluded.
# Reasoning baseline: providers/inception/models/mercury-2.toml; restricted to all default serving routes.
# Effort: top-level reasoning_effort = low|medium|high.
# Host protocol: https://platform.experientiallabs.ai/docs/openai-compatibility
schema = 2
base_model = "inception/mercury-2"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
input = 78_000

[cost.text.input]
price = 0.25
cache = { read = 0.025, write = 0.25 }

[cost.text.output]
price = 0.75
