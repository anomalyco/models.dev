# Source: https://api.experientiallabs.ai/api/models/gpt-5-mini
# List prices in USD per million tokens; temporary promotions are excluded.
# Reasoning baseline: providers/openai/models/gpt-5-mini.toml; restricted to all default serving routes.
# Effort: top-level reasoning_effort = minimal|low|medium|high.
# Host protocol: https://platform.experientiallabs.ai/docs/openai-compatibility
schema = 2
base_model = "openai/gpt-5-mini"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 0.25
cache = { read = 0.025 }

[cost.text.output]
price = 2
