# Reasoning HTTP format (accessed 2026-06-25):
# POST https://api.together.ai/v1/chat/completions
# JSON reasoning.enabled: true | false; thinking is on by default.
# Sources: https://docs.together.ai/docs/inference/chat/reasoning#enable-and-disable-reasoning
# Deprecated: no longer listed in the Together.ai serverless catalog (accessed 2026-07-18).
# Source: https://docs.together.ai/docs/serverless-models
schema = 2
base_model = "zhipuai/glm-5"
name = "GLM-5"
family = "glm"
open_weights = true
release_date = "2026-02-11"
status = "deprecated"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true }
structured_output = true
temperature = true

[limit]
context = 202_752
output = 131_072

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1

[cost.text.output]
price = 3.2
