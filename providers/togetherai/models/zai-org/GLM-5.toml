# Reasoning HTTP format (accessed 2026-06-25):
# POST https://api.together.ai/v1/chat/completions
# JSON reasoning.enabled: true | false; thinking is on by default.
# Sources: https://docs.together.ai/docs/inference/chat/reasoning#enable-and-disable-reasoning
# Deprecated: removed from serverless on 2026-06-22 (https://docs.together.ai/docs/deprecations,
# accessed 2026-10-21); requests return 400 "Unable to access non-serverless model".
schema = 2
base_model = "zhipuai/glm-5"
status = "deprecated"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
context = 202_752

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1

[cost.text.output]
price = 3.2
