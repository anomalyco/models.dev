schema = 2
name = "MiniMax-M3"
description = "MiniMax multimodal coding model for long-context reasoning and agent tasks"
family = "minimax"
open_weights = true
release_date = "2026-06-12"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
structured_output = true
temperature = true

[limit]
context = 524_288
output = 250_000

[cost.text.input]
price = 0.3
cache = { read = 0.06 }

[cost.text.output]
price = 1.2
