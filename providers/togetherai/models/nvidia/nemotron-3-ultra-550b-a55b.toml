# Reasoning HTTP format (accessed 2026-06-25):
# POST https://api.together.ai/v1/chat/completions
# JSON reasoning.enabled: true | false. Medium effort instead uses
# chat_template_kwargs.medium_effort: true; otherwise effort defaults to high.
# Sources: https://docs.together.ai/docs/inference/chat/reasoning#reasoning-effort
# Deprecated: removed from serverless on 2026-08-27 (https://docs.together.ai/docs/deprecations,
# accessed 2026-10-21); requests return 400 "Unable to access non-serverless model".
schema = 2
base_model = "nvidia/nemotron-3-ultra-550b-a55b"
status = "deprecated"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
context = 512_300
output = 512_300

[cost.text.input]
price = 0.6
cache = { read = 0.2 }

[cost.text.output]
price = 3.6
