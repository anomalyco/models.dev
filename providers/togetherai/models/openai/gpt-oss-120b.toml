# Reasoning HTTP format (accessed 2026-06-25):
# POST https://api.together.ai/v1/chat/completions
# JSON reasoning_effort: "low" | "medium" | "high".
# Sources: https://docs.together.ai/docs/inference/chat/reasoning#reasoning-effort
schema = 2
name = "GPT OSS 120B"
description = "Open-weight GPT model for self-hosted reasoning and instruction-following workloads"
family = "gpt-oss"
open_weights = true
knowledge = "2025-08"
release_date = "2025-08-05"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
temperature = true

[limit]
context = 131_072
output = 131_072

[cost.text.input]
price = 0.15

[cost.text.output]
price = 0.6
