# Reasoning HTTP format (accessed 2026-06-25):
# POST https://api.together.ai/v1/chat/completions
# JSON reasoning_effort: "low" | "medium" | "high".
# Sources: https://docs.together.ai/docs/inference/chat/reasoning#reasoning-effort
# Live 2026-10-21 (rendered prompt): low, medium and high set "Reasoning: <level>" in the leading
# system block (minimal renders as low; none, xhigh and max as the medium default).
# Serverless: $0.15 input, $0.60 output per 1M, no cached-input price; structured outputs: yes
# (https://docs.together.ai/docs/serverless-models, accessed 2026-10-21).
# Mid-conversation (live 2026-10-21, rendered prompt): a late system message stays in place after
# the earlier turns; the tool list is rendered in the developer block before the first user turn.
schema = 2
base_model = "openai/gpt-oss-120b"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
system_updates = true

[limit]
output = 131_072

[cost.text.input]
price = 0.15

[cost.text.output]
price = 0.6
