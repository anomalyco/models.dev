# Price and context: GET https://api.together.xyz/v1/models (accessed 2026-11-23): $0.30 input, $0.03 cached input, $1.00 output per 1M; context 1,048,576.
# Effort: reasoning_effort = minimal|low|medium|high|max, the set most hosts of this model publish (OpenRouter, Kilo, Vercel and
#   others). This host has no earlier inkling-small model; flags follow its Inkling entry (structured output, implicit cache).
schema = 2
base_model = "thinkingmachines/inkling-2-small"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "max"] }
cache = { implicit = true }
structured_output = true
prompt_cache_key = true

[cost.text.input]
price = 0.3
cache = { read = 0.03 }

[cost.text.output]
price = 1
