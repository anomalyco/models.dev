# Reasoning HTTP format (accessed 2026-06-25):
# POST https://api.together.ai/v1/chat/completions
# JSON reasoning.enabled: true | false (thinking is on by default).
# Sources: https://docs.together.ai/docs/inference/chat/reasoning#supported-models
# Toggle confirmed live 2026-10-21 (reasoning.enabled = false: no reasoning).
# Serverless: $0.17 input, $0.25 output per 1M, no cached-input price; context 262,144
# (https://docs.together.ai/docs/serverless-models, accessed 2026-10-21).
# Inputs (live 2026-10-21): PNG, JPEG, GIF and WebP images and MP4 video are read; audio is rejected.
# Mid-conversation (live 2026-10-21): a system message after the first turn is rejected with
# 400 "Input validation error". The route reports no cached tokens, so tool changes weren't measured.
schema = 2
base_model = "alibaba/qwen3.5-9b"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "video/mp4"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
system_updates = false
effort_updates = false

[cost.text.input]
price = 0.17

[cost.text.output]
price = 0.25
