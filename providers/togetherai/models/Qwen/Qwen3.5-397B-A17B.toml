# Reasoning HTTP format (accessed 2026-06-25):
# POST https://api.together.ai/v1/chat/completions
# JSON reasoning.enabled: true | false (thinking is on by default).
# Compatibility: chat_template_kwargs.thinking or .enable_thinking: boolean.
# Sources: https://docs.together.ai/docs/inference/chat/reasoning#enable-and-disable-reasoning
# Deprecated: removed from serverless on 2026-06-29 (https://docs.together.ai/docs/deprecations,
# accessed 2026-10-21); requests return 400 "Unable to access non-serverless model".
# Inputs: text and images, as the entry listed before (the image types are the lab's). The old
# entry had attachment = false next to image input; image input makes it true.
schema = 2
base_model = "alibaba/qwen3.5-397b-a17b"
name = "Qwen3.5 397B A17B"
status = "deprecated"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }

[limit]
output = 130_000

[cost.text.input]
price = 0.6
cache = { read = 0.35 }

[cost.text.output]
price = 3.6
