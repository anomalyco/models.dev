# Price: GET https://api.together.xyz/v1/models and the serverless table at https://www.together.ai/pricing (accessed 2026-11-24):
#   $1.50 input, $0.075 cached input, $4.50 output per 1M; context 1,000,000. (Was $1.05 / $0.0525 / $3.15 on 2026-11-23.)
# Controls and flags follow this host's Qwen3.7-Max (same qwen-max line): Together forwards the route to Alibaba and documents
#   no reasoning control for it (https://docs.together.ai/docs/inference/chat/reasoning).
schema = 2
base_model = "alibaba/qwen4-max"

[capabilities]
reasoning = { supported = true }
cache = { implicit = true }
structured_output = true
prompt_cache_key = true

[cost.text.input]
price = 1.5
cache = { read = 0.075 }

[cost.text.output]
price = 4.5
