# Reasoning HTTP format (accessed 2026-06-25):
# POST https://api.together.ai/v1/chat/completions
# JSON reasoning.enabled: true | false (thinking is on by default).
# Sources: https://docs.together.ai/docs/inference/chat/reasoning#supported-models
name = "Qwen3.6 Plus"
description = "Qwen instruction model for multilingual chat, reasoning, and tool use"
family = "qwen"
release_date = "2026-04-30"
last_updated = "2026-04-30"
attachment = false
reasoning = true
reasoning_options = [{ type = "toggle" }]
temperature = true
tool_call = true
# Proprietary hosted model (Alibaba Model Studio / Together serverless); open_weights was incorrectly set to true.
open_weights = false

[cost]
input = 0.50
output = 3.00

[limit]
context = 1_000_000
# Verified 2026-10-20: max_tokens > 65536 rejected with
# "Range of max_tokens should be [1, 65536]" (Alibaba Model Studio backend).
# Matches https://www.alibabacloud.com/help/en/model-studio/qwen3-6-plus
output = 65_536

[modalities]
input = ["text"]
output = ["text"]
