# Reasoning HTTP format (accessed 2026-06-25):
# POST https://api.together.ai/v1/chat/completions
# JSON reasoning.enabled: true | false (thinking is on by default).
# Sources: https://docs.together.ai/docs/inference/chat/reasoning#supported-models
# Output limit 65_536 per Alibaba Model Studio qwen3.6-plus (Max Output Length 65536 normal + thinking):
# https://www.alibabacloud.com/help/en/model-studio/qwen3-6-plus
# Weights: proprietary hosted-only (no Plus weights on HF; open releases are Qwen3.6-35B-A3B / Qwen3.6-27B).
name = "Qwen3.6 Plus"
description = "Qwen instruction model for multilingual chat, reasoning, and tool use"
family = "qwen"
release_date = "2026-04-30"
last_updated = "2026-04-30"
attachment = false
reasoning = true
reasoning_options = [{ type = "toggle" }]
temperature = true
tool_call = true
open_weights = false

[cost]
input = 0.50
output = 3.00

[limit]
context = 1_000_000
output = 65_536

[modalities]
input = ["text"]
output = ["text"]
