# Reasoning HTTP format (accessed 2026-06-25):
# POST https://api.together.ai/v1/chat/completions
# JSON reasoning.enabled: true | false (thinking is on by default).
# Sources: https://docs.together.ai/docs/inference/chat/reasoning#supported-models
# Output limit 65_536 per Alibaba Model Studio qwen3.6-plus (Max Output Length 65536 normal + thinking):
# https://www.alibabacloud.com/help/en/model-studio/qwen3-6-plus
# Serverless: $0.50 input, $3.00 output per 1M, no cached-input price; context 1,000,000;
# structured outputs: yes (https://docs.together.ai/docs/serverless-models, accessed 2026-10-21).
# Text only: Together's serverless vision list doesn't include it
# (https://docs.together.ai/docs/serverless-models#vision-models).
# Not probed: the route forwards prompts to a third-party provider and returns 403 unless the
# organization enables third-party data sharing.
schema = 2
base_model = "alibaba/qwen3.6-plus"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
effort_updates = false

[cost.text.input]
price = 0.5

[cost.text.output]
price = 3
