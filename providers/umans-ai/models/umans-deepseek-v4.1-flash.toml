# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|high|max (string aliases of the V4.1 numeric
# 1-100 budget: low=50 / high=75 / max=100; numerics pass through)
# `none` is a REAL disable (can_disable=true on the live card — a non-thinking
# "chat" mode); think-HIGH is the default. Verified against the released repo
# 2026-09-10 and the live card since then. Live metadata:
# levels none/low/high/max, default high: https://api.code.umans.ai/v1/models/info
# Pay-per-token (llm-gateway 00357, released 2026-09-18): Umans AI's public
# rate, which is what GET /v1/models renders ($0.15 / $0.60 / $0.028 per 1M).
# limit.context/output mirror the gateway card exactly (1048576 native;
# 393216 max output) — limit.output is cap-1 on purpose: the gateway 400s
# max_tokens >= max_completion_tokens (393216), so 393215 is the largest
# value that serves (its advertised `recommended_max_tokens`).
# Since 2026-10-20 this id serves the 1017 weights: the live card lists
# base_model DeepSeek-V4.1-Flash-1017 (lifecycle update "1017"), so it links to
# that lab and keeps its display name (checked 2026-10-21).
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"
name = "DeepSeek V4.1 Flash"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
context = 1_048_576
output = 393_215

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.15
cache = { read = 0.028 }

[cost.text.output]
price = 0.6
