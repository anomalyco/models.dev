# NetMind model ID: anthropic/claude-haiku-5-5.
# Pricing source: https://platform-api.netmind.ai/inference/modelPrice (checked 2026-10-12).
# Pricing maps input/output/cache fields and context tiers from that response.
# Toggle: reasoning.enabled = true|false
# Effort: reasoning_effort = <level>
# Relay baseline: https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
# https://www.netmind.ai/product/inference
base_model = "anthropic/claude-haiku-5-5"
reasoning_options = [{ type = "toggle" }, { type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 0.1
output = 0.5
cache_read = 0.01
cache_write = 0.125

[[cost.tiers]]
tier = { type = "context", size = 100000 }
input = 0.5
output = 2.5
cache_read = 0.05
cache_write = 0.625
