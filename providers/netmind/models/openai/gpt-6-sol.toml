# NetMind model ID: openai/gpt-6-sol.
# Pricing source: https://platform-api.netmind.ai/inference/modelPrice (checked 2026-10-12).
# Pricing maps input/output/cache fields and context tiers from that response.
# Effort: reasoning_effort = <level>
# https://www.netmind.ai/product/inference
base_model = "openai/gpt-6-sol"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 2.0
output = 10.0
cache_read = 0.2
cache_write = 2.5

[[cost.tiers]]
tier = { type = "context", size = 272000 }
input = 4.0
output = 15.0
cache_read = 0.4
cache_write = 5.0
