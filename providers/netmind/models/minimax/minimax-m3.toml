# Pricing source: https://platform-api.netmind.ai/inference/modelPrice (checked 2026-10-12).
base_model = "minimax/MiniMax-M3"
name = "minimax-m3"
reasoning_options = []
reasoning = true
tool_call = true

[limit]
context = 1000000
output = 128000

[modalities]
input = ["text", "image"]
output = ["text"]

[cost]
input = 0.3
output = 1.2
cache_read = 0.06

[[cost.tiers]]
tier = { type = "context", size = 524288 }
input = 1.2
output = 4.8
cache_read = 0.24
cache_write = 0.0
