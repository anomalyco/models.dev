# Host-unique: Divyam is a model router that answers each request with a backing model it picks from Claude Opus, Sonnet and Haiku 5.5, so this entry has no base_model.
# Catalog: https://console.preview.divyam.ai/api/v1/catalog/models?available_only=true lists a 1,000,000 context window (checked 2026-11-22).
# Pricing: "50% of that model's price" (https://docs.divyam.ai/self-serve/models/, checked 2026-11-22), applied to providers/anthropic/models/claude-opus-5-5.toml.
# Output: 128,000, the cap Claude Opus, Sonnet and Haiku 5.5 share.
# Release date: the model's first listing in Divyam's docs catalog.
# Tools: "Streaming and tool calls follow the OpenAI format" (https://docs.divyam.ai/self-serve/api-reference/)
# Reasoning: reasoning tokens are billed as output (https://docs.divyam.ai/self-serve/logs-and-usage/).
schema = 2
name = "Claude Opus 5.5 Router"
description = "Model router for Opus-grade answers, routing each prompt to Sonnet or Haiku when the evidence allows it"
family = "model-router"
open_weights = false
release_date = "2026-11-13"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = false
cache = { implicit = true }

[limit]
context = 1_000_000
output = 128_000

[cost.text.input]
price = 2
cache = { read = 0.1, write = 2.5 }

[cost.text.output]
price = 10
