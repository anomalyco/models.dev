# Host-unique: Divyam is a model router that answers each request with a backing model it picks from Claude Opus, Sonnet and Haiku 5.5, so this entry has no base_model.
# Catalog: https://console.preview.divyam.ai/api/v1/catalog/models?available_only=true lists a 1,000,000 context window (checked 2026-11-22).
# Pricing: "50% of that model's price" (https://docs.divyam.ai/self-serve/models/, checked 2026-11-22), applied to providers/anthropic/models/claude-opus-5-5.toml.
# Output: 128,000, the cap Claude Opus, Sonnet and Haiku 5.5 share.
# Release date: the model's first listing in Divyam's docs catalog.
# Tools: "Streaming and tool calls follow the OpenAI format" (https://docs.divyam.ai/self-serve/api-reference/)
# Effort: reasoning_effort = none|low|medium|high. none turns thinking off, minimal is served as low, and xhigh and max as high (https://github.com/Divyam-AI/divyam-llm-interop/blob/v0.5.1/src/divyam_llm_interop/translate/chat/reasoning_state.py#L162-L169 and #L264).
# Sampling: temperature, top_p and top_k as on the Claude 5.5 models it routes between, which take only their defaults (https://github.com/Divyam-AI/divyam-llm-interop/blob/v0.5.1/src/divyam_llm_interop/translate/chat/anthropic_messages/request/unified_to_anthropic.py#L657).
# Modalities: Chat Completions takes image_url parts (ChatCompletionContentPartImageParam in https://docs.divyam.ai/openapi/divyam-openapi.json, checked 2026-11-24) as JPEG, PNG, GIF or WebP (unified_to_anthropic.py#L368 at the same tag).
schema = 2
name = "Claude Opus 5.5 Router"
description = "Model router for Opus-grade answers, routing each prompt to Sonnet or Haiku when the evidence allows it"
family = "model-router"
open_weights = false
release_date = "2026-11-13"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
temperature = false
top_p = false
top_k = false
cache = { implicit = true }

[limit]
context = 1_000_000
output = 128_000

[cost.text.input]
price = 2
cache = { read = 0.1, write = 2.5 }

[cost.text.output]
price = 10
