schema = 2
base_model = "moonshotai/kimi-k3.1-pro"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
temperature = true

[limit]
context = 524_288
output = 65_536

[api.chat-completions]
compatibility = { reasoning_field = "reasoning" }

[cost.text.input]
price = 2
cache = { read = 0.20 }

[cost.text.output]
price = 10
