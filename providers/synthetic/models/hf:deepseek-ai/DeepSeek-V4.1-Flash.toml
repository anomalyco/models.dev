# GET https://api.synthetic.new/openai/v1/models (accessed 2026-09-16) lists
# hf:deepseek-ai/DeepSeek-V4.1-Flash with reasoning_parameters.efforts
# none|low|high|xhigh|max, text+image input, fp8 quantization.
# Live probes: `reasoning_effort = "none"` disables reasoning; `"xhigh"` streams it.
# Reasoning is returned in the `reasoning` message field.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "xhigh", "max"] }
structured_output = true

[limit]
context = 524_288
output = 65_536

[api.chat-completions]
compatibility = { replay_reasoning = true }

[cost.text.input]
price = 0.6
cache = { read = 0.03 }

[cost.text.output]
price = 1.2
