# Catalog: GET https://api.synthetic.new/openai/v1/models (accessed 2026-10-21).
# Effort: reasoning_effort (reasoning_parameters.efforts in the catalog).
# Lists reasoning efforts none|low|medium|high, max_output_length 65536 and
# input_cache_reads $0.00000002.
schema = 2
base_model = "openai/gpt-oss-120b"
description = "Open-weight GPT model for self-hosted reasoning and instruction-following workloads"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }

[limit]
output = 65_536

[cost.text.input]
price = 0.1
cache = { read = 0.02 }

[cost.text.output]
price = 0.1
