# Catalog: GET https://api.synthetic.new/openai/v1/models (accessed 2026-10-21).
# Effort: reasoning_effort (reasoning_parameters.efforts in the catalog).
# Lists reasoning efforts none|low|medium|high and input_cache_reads $0.00000006.
schema = 2
base_model = "nvidia/nemotron-3-super-120b-a12b"

[capabilities]
