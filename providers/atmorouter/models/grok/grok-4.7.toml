# AtmoRouter model catalog: GET https://atmorouter.dev/v1/models (accessed 2026-10-25).
# Effort: top-level reasoning_effort = low|medium|high|xhigh (the lab's levels for this model; accepted live 2026-10-25).
# Mid-conversation: system_updates, effort_updates and tools.updates are unset; AtmoRouter documents none of them.
# Input MIME types: the lab's entries for each kind AtmoRouter lists (text); AtmoRouter documents no formats.
# Cost omitted: the price depends on the offer tier that serves each request (see provider.toml).
schema = 2
base_model = "xai/grok-4.7"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
