# AtmoRouter model catalog: GET https://atmorouter.dev/v1/models (accessed 2026-10-25).
# Effort: top-level reasoning_effort = low|medium|high (the lab's levels for this model; accepted live 2026-10-25).
# Mid-conversation: system_updates, effort_updates and tools.updates are unset; AtmoRouter documents none of them.
# Input MIME types: the lab's entries for each kind AtmoRouter lists (text, image, video); AtmoRouter documents no formats.
# Cost omitted: the price depends on the offer tier that serves each request (see provider.toml).
schema = 2
base_model = "google/gemini-3.1-pro-preview"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "video/mp4", "video/mpeg", "video/mov", "video/avi", "video/x-flv", "video/mpg", "video/webm", "video/wmv", "video/3gpp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[limit]
context = 1_000_000
