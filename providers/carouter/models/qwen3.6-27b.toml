# CARouter routes this model to OVHcloud AI Endpoints (Gravelines, FR; foreign-owned, off by default).
# Price: Free plan CAD 0.7401 in / 4.9956 out per 1M tokens (https://carouter.ai/llms-full.txt,
#   https://carouter.ai/api/public/models, accessed 2026-11-04), converted at 1.3961 CAD per USD
#   (Bank of Canada, 2026-11-04).
# Effort: reasoning_effort passes through to OVHcloud: none|minimal|low|medium|high
#   (providers/ovhcloud/models/qwen3.6-27b.toml). CARouter documents image input, not video.
schema = 2
base_model = "alibaba/qwen3.6-27b"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 0.5301

[cost.text.output]
price = 3.5783
