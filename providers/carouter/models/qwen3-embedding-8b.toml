# CARouter routes this model to CARouter Cloud (Ottawa, ON; Canadian-owned, on by default).
# Other live routes: ovhcloud-eu, scaleway (used only when the account enables them).
# Price: Free plan CAD 0.2035 in / 0.0 out per 1M tokens (https://carouter.ai/llms-full.txt,
#   https://carouter.ai/api/public/models, accessed 2026-11-04), converted at 1.3961 CAD per USD
#   (Bank of Canada, 2026-11-04).
# CARouter Cloud serves an 8,192-token context (OVHcloud and Scaleway serve 32,768 when an account
#   enables them).
schema = 2
base_model = "alibaba/qwen3-embedding-8b"

[limit]
context = 8192

[api.embeddings]
sdk = { opencodeai = "none" }

[cost.text.input]
price = 0.1458

[cost.text.output]
price = 0
