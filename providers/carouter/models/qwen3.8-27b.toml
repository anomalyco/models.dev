# CARouter routes this model to Scaleway (Paris, FR; foreign-owned, off by default).
# Price: Free plan CAD 1.1101 in / 0.222 cached input / 6.1058 out per 1M tokens (https://carouter.ai/llms-full.txt,
#   https://carouter.ai/api/public/models, accessed 2026-11-04), converted at 1.3961 CAD per USD
#   (Bank of Canada, 2026-11-04).
# Effort: reasoning_effort passes through to Scaleway: none|low|medium|xhigh
#   (providers/scaleway/models/qwen3.8-27b.toml). CARouter documents image input, not video.
schema = 2
base_model = "alibaba/qwen3.8-27b"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "xhigh"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.7951
cache = { read = 0.159 }

[cost.text.output]
price = 4.3735
