# CARouter serves this model from two live routes, both off until the account enables them
#   (https://carouter.ai/api/public/models, default_enabled = false): Augure (Canada) and Scaleway
#   (Paris). SPUR Compute is announced, not live. Live requests on 2026-11-09 were served by Scaleway
#   (X-CArouter-Provider: Scaleway, tier fast), so the controls and limits below are Scaleway's.
# Price: Free plan CAD 3.45 in / 8.05 out per 1M tokens (https://carouter.ai/llms-full.txt,
#   https://carouter.ai/api/public/models, accessed 2026-11-04), converted at 1.3961 CAD per USD
#   (Bank of Canada, 2026-11-04).
# Effort: reasoning_effort = none|low|high|max. Verified live 2026-11-09 with
#   POST /v1/chat/completions {"model": "glm-5.3", "reasoning_effort": ...}, two runs per level:
#   none returned 0 reasoning tokens (both runs); low < high < max in reasoning tokens on the same
#   prompt (low 372-392, high 684-738, max 1,757-1,905); max returned 200, not an error.
#   medium is accepted but did not land between low and high, so it is left out. Scaleway documents
#   low|high|max (providers/scaleway/models/glm-5.3.toml); none is added from the live test.
#   If an account enables Augure, Augure accepts reasoning_effort without error but "no setting
#   shortens the thinking as served today" (https://augureai.ca/docs/models).
# Output: 16,384, Scaleway's cap and the lower of the two routes (Augure caps at 49,152).
schema = 2
base_model = "zhipuai/glm-5.3"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true

[limit]
context = 262_144
output = 16_384

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 2.4712

[cost.text.output]
price = 5.7661
