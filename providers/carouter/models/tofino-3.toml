# CARouter routes this model to Augure (Canada; Canadian-owned, off by default).
# Price: Free plan CAD 0.69 in / 2.3 out per 1M tokens (https://carouter.ai/llms-full.txt,
#   https://carouter.ai/api/public/models, accessed 2026-11-04), converted at 1.3961 CAD per USD
#   (Bank of Canada, 2026-11-04).
# No thinking phase. CARouter documents image input only (no PDF), so PDF is left out.
schema = 2
base_model = "augure/tofino-3"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
structured_output = true

[cost.text.input]
price = 0.4942

[cost.text.output]
price = 1.6474
