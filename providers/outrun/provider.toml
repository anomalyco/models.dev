# Outrun: OpenAI-compatible API gateway, one key for many models, prepaid, published per-token prices.
# Sources (accessed 2026-10-29):
# - Base URL and setup: https://outrun.to/docs/
# - Live price list (USD per 1M tokens): https://api.outrun.to/pricing
