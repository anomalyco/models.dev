base_model = "google/gemini-3.1-pro-preview"
# Cost, limits and modalities reflect Gondola's Venice supply. Cost is the
# fee-inclusive marketplace "from" price and floats with live supply.
# https://api.gondola-ai.com/v1/models (accessed 2026-07-24); modalities/limits
# mirror providers/venice/ for the same model.
reasoning_options = []

[cost]
input = 1.1985
output = 7.191

[limit]
context = 1000000
output = 32768

[modalities]
input = ["text", "image", "audio", "video"]
output = ["text"]
