# OpenAI-compatible host for open-weight models served through Swarm Inference.
# Endpoint: POST https://api.fortytwo.network/v1/chat/completions (chat completions only; no Responses API).
# Reasoning: top-level reasoning_effort = none|minimal|low|medium|high|xhigh|max,
# Live SSE (2026-10-30) returns delta.reasoning. Prompt caching is automatic,
# cached tokens reported in usage.prompt_tokens_details.cached_tokens.
# https://docs.fortytwo.network/docs/models (accessed 2026-10-30)
# https://docs.fortytwo.network/docs/pricing (accessed 2026-10-30)
name = "Fortytwo"
npm = "@ai-sdk/openai-compatible"
opencodeai = "@opencode/ai/providers/openai-compatible"
api = "https://api.fortytwo.network/v1"
env = ["FORTYTWO_API_KEY"]
doc = "https://docs.fortytwo.network/docs/models"
