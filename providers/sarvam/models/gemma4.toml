# Pricing: https://www.sarvam.ai/token-factory/pricing (accessed 2026-11-17): Gemma 4 INR 35.00 input / 10.00 cached input / 90.00 output per 1M tokens.
# INR->USD at 94 INR per USD, the rate Sarvam publishes for its USD view on https://www.sarvam.ai/token-factory/pricing (accessed 2026-11-17), rounded to 8 decimals.
# Served on the provider's OpenAI-compatible /v2 endpoint.
# Thinking is off by default and enabled with reasoning_effort; images are png, jpeg and webp only.
# Reasoning: https://docs.sarvam.ai/api/token-factory/models/gemma-4-31b (accessed 2026-11-18): reasoning_effort = low|high|max, omitted or "none" = no reasoning.
# Image cap: GET https://api.sarvam.ai/v2/models publishes input_media.image.max_per_request = 30 (accessed 2026-11-17).
# Context: GET https://api.sarvam.ai/v2/models publishes context_length 262144 (accessed 2026-11-17).
schema = 2
base_model = "google/gemma-4-31b-it"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"], default = { type = "effort", value = "none" } }
cache = { implicit = true }

[limit]
image = { max_per_request = 30 }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content", max_tokens_field = "max_tokens" }

[cost.text.input]
price = 0.37234043
cache = { read = 0.10638298 }

[cost.text.output]
price = 0.95744681
