# Passthrough to the official MiMo API (api.xiaomimimo.com).
# The commercial release of the UltraSpeed beta Xiaomi withdrew on 2026-09-07,
# priced for throughput rather than cost: same V2.6 Pro weights, roughly 10x
# the standard route. Measured through above.dev on 2026-09-22, an identical
# 120-token completion ran at 67.6 tok/s here against 14.3 tok/s on
# mimo-v2.6-pro. Upstream rate limits are tighter than the standard route.
# RMB upstream (CNY 30/0.25/60 per MTok; overseas USD list $4.35/$0.036/$8.70)
# converted at 6.5 CNY/USD, then a flat 10% markup; rounded to 4dp.
base_model = "xiaomi/mimo-v2.6-pro-ultraspeed"
name = "MiMo V2.6 Pro UltraSpeed"

