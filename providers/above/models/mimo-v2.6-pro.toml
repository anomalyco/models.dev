# Passthrough to the official MiMo API (api.xiaomimimo.com).
# Toggle: `thinking.type = enabled|disabled`, as providers/xiaomi; verified
# end-to-end on this host 2026-08-29.
# Xiaomi deprecated mimo-v2.5-pro; the above.dev route now serves
# mimo-v2.6-pro at identical rates.
# Sources:
#   https://mimo.mi.com/docs/en-US/quick-start/summary/model  ("mimo-v2.5-pro
#     and mimo-v2.5 will be officially deprecated at 10:00 (Beijing time) on
#     October 21,2026")
#   https://mimo.mi.com/docs/en-US/price/pay-as-you-go  (mimo-v2.6-pro and
#     mimo-v2.5-pro both CNY 3 / 0.025 / 6 per MTok, so no price change)
# RMB upstream (CNY 3/0.025/6 per MTok)
# converted at 6.5 CNY/USD (operator rate set 2026-07, spot ~6.79; buffer
# covers FX drift), then a flat 10% markup; rounded to 4dp. Rechecked 2026-09-22.
base_model = "xiaomi/mimo-v2.6-pro"
name = "MiMo V2.6 Pro"

[[reasoning_options]]
type = "toggle"

[interleaved]
field = "reasoning_content"

[cost]
input = 0.5077
output = 1.0154
cache_read = 0.0042
