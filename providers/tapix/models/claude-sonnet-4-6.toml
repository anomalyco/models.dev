# Prices: Tapix public sell prices in USD per 1M tokens (https://tapixai.com/api/models, read 2026-11-17) — our own list prices, not a converted third-party list.
# Relayed by Tapix AI (https://tapixai.com/v1); upstream model is anthropic/claude-sonnet-4-6.
# Reasoning: request-side only — Tapix accepts reasoning_effort (per-model validation is real: claude-fable-5 rejects "none"), but this relay does not return the thinking text: a 2026-11-17 probe saw no reasoning field and reasoning_tokens = 0. No response field is declared for that reason.
schema = 2
base_model = "anthropic/claude-sonnet-4-6"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "max"] }
structured_output = true

[cost.text.input]
price = 2.1

[cost.text.output]
price = 10.5

