# Prices: Tapix public sell prices in USD per 1M tokens (https://tapixai.com/api/models, read 2026-11-17) — our own list prices, not a converted third-party list.
# Relayed by Tapix AI (https://tapixai.com/v1); upstream model is alibaba/qwen3.7-max.
# Toggle: reasoning_effort = none disables thinking on /v1/chat/completions (lab surface: thinking.type = enabled|disabled; we forward effort only, so none is the off switch).
# Streams reasoning via reasoning_content deltas.
schema = 2
base_model = "alibaba/qwen3.7-max"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[cost.text.input]
price = 1.19

[cost.text.output]
price = 3.54

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
