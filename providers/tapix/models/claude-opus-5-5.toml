# Tapix AI relays this model over the OpenAI-compatible chat-completions API
# (https://tapixai.com/v1). Reasoning is exposed only through the OpenAI
# `reasoning_effort` request field; Tapix does not pass through Anthropic-style
# thinking toggles or budget_tokens, so only the effort range is declared here.
# Price verified 2026-11-26 against https://tapixai.com/pricing
schema = 2
base_model = "anthropic/claude-opus-5-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 2.8

[cost.text.output]
price = 14
