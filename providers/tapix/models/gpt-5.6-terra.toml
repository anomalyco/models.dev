# Prices: Tapix public sell prices in USD per 1M tokens (https://tapixai.com/api/models, read 2026-11-17) — our own list prices, not a converted third-party list.
# Relayed by Tapix AI (https://tapixai.com/v1); upstream model is openai/gpt-5.6-terra.
# Reasoning: reasoning_effort = none, low, medium, high, xhigh, max on /v1/chat/completions, forwarded verbatim from the lab surface (a lab toggle field is not in our whitelist and is not forwarded).
# Streams reasoning via reasoning_content deltas.
schema = 2
base_model = "openai/gpt-5.6-terra"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 1.4

[cost.text.output]
price = 8.4

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
