# Prices: https://tapixai.com/pricing and https://tapixai.com/api/models (USD per 1M tokens).
# Relayed via Tapix AI (https://tapixai.com/v1); upstream model is openai/gpt-6.1-sol.
# Streams reasoning via reasoning_content deltas.
schema = 2
base_model = "openai/gpt-6.1-sol"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 1.4

[cost.text.output]
price = 7
