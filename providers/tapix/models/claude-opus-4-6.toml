# Prices: Tapix public sell prices in USD per 1M tokens (https://tapixai.com/api/models, read 2026-11-17) — our own list prices, not a converted third-party list.
# Relayed by Tapix AI (https://tapixai.com/v1); upstream model is anthropic/claude-opus-4-6.
# Reasoning: reasoning_effort = low, medium, high, max on /v1/chat/completions, forwarded verbatim from the lab surface (a lab toggle field is not in our whitelist and is not forwarded).
# Streams reasoning via reasoning_content deltas.
schema = 2
base_model = "anthropic/claude-opus-4-6"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "max"] }
structured_output = true

[cost.text.input]
price = 2.15

[cost.text.output]
price = 9.22

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
