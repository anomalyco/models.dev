# Prices: https://tapixai.com/pricing and https://tapixai.com/api/models (USD per 1M tokens).
# Relayed via Tapix AI (https://tapixai.com/v1); upstream model is zhipuai/glm-5.3.
# Streams reasoning via reasoning_content deltas.
schema = 2
base_model = "zhipuai/glm-5.3"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "max" }, effort = ["low", "high", "max"] }
structured_output = true

[cost.text.input]
price = 0.73472

[cost.text.output]
price = 2.557806
