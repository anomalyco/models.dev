# Prices: https://tapixai.com/pricing and https://tapixai.com/api/models (USD per 1M tokens).
# Relayed via Tapix AI (https://tapixai.com/v1); upstream model is anthropic/claude-fable-5-1.
schema = 2
base_model = "anthropic/claude-fable-5-1"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[api.chat-completions]
capabilities = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 7

[cost.text.output]
price = 35
