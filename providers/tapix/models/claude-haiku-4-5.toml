# Prices: Tapix public sell prices in USD per 1M tokens (https://tapixai.com/api/models, read 2026-11-17) — our own list prices, not a converted third-party list.
# Relayed by Tapix AI (https://tapixai.com/v1); upstream model is anthropic/claude-haiku-4-5.
# Reasoning: thinking cannot be enabled through this API — the lab control is a thinking budget, which our request whitelist does not forward, and a live call on 2026-11-17 returned no reasoning output.
# Streams reasoning via reasoning_content deltas.
schema = 2
base_model = "anthropic/claude-haiku-4-5"

[capabilities]
reasoning = { supported = true }
structured_output = true

[cost.text.input]
price = 0.7

[cost.text.output]
price = 3.5

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
