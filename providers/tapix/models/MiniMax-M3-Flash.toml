# Prices: Tapix public sell prices in USD per 1M tokens (https://tapixai.com/api/models, read 2026-11-17) — our own list prices, not a converted third-party list.
# Relayed by Tapix AI (https://tapixai.com/v1); upstream model is minimax/MiniMax-M3.1-Flash.
# Reasoning: reasoning_effort = low, medium, high, xhigh, max on /v1/chat/completions, forwarded verbatim from the lab surface (a lab toggle field is not in our whitelist and is not forwarded).
# Streams reasoning via reasoning_content deltas.
schema = 2
base_model = "minimax/MiniMax-M3.1-Flash"
name = "MiniMax M3 Flash"
release_date = "2026-08-05"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 0.34

[cost.text.output]
price = 1.34

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
