# Prices: https://tapixai.com/pricing and https://tapixai.com/api/models (USD per 1M tokens).
# Relayed via Tapix AI (https://tapixai.com/v1); upstream model is google/gemini-4-argon.
# Streams reasoning via reasoning_content deltas.
schema = 2
base_model = "google/gemini-4-argon"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "medium" }, effort = ["low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 1.4

[cost.text.output]
price = 7
