# Prices: Tapix public sell prices in USD per 1M tokens (https://tapixai.com/api/models, read 2026-11-17) — our own list prices, not a converted third-party list.
# Relayed by Tapix AI (https://tapixai.com/v1); upstream model is tencent/hy3.
# Reasoning: reasoning_effort = none, low, high on /v1/chat/completions, forwarded verbatim from the lab surface (a lab toggle field is not in our whitelist and is not forwarded).
# Streams reasoning via reasoning_content deltas.
schema = 2
base_model = "tencent/hy3"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high"] }
structured_output = true

[cost.text.input]
price = 0.12

[cost.text.output]
price = 0.42

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
