# Prices: https://tapixai.com/pricing and https://tapixai.com/api/models (USD per 1M tokens).
# Relayed via Tapix AI (https://tapixai.com/v1); upstream model is google/gemini-3-flash-preview.
# Streams reasoning via reasoning_content deltas.
schema = 2
base_model = "google/gemini-3-flash-preview"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "high" }, effort = ["minimal", "low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 0.857143

[cost.text.output]
price = 3.428572
