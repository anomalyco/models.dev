# Prices: Tapix public sell prices in USD per 1M tokens (https://tapixai.com/api/models, read 2026-11-17) — our own list prices, not a converted third-party list.
# Relayed by Tapix AI (https://tapixai.com/v1); upstream model is deepseek/deepseek-v4-pro.
# Reasoning: reasoning_effort = none, low, high, max on /v1/chat/completions (none disables thinking; the lab documents it and a live probe accepted it); forwarded verbatim, lab toggle field not in our whitelist.
# Streams reasoning via reasoning_content deltas.
schema = 2
base_model = "deepseek/deepseek-v4-pro"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true

[cost.text.input]
price = 0.76

[cost.text.output]
price = 2.23

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
