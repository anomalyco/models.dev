# Prices: Tapix public sell prices in USD per 1M tokens (https://tapixai.com/api/models, read 2026-11-17) — our own list prices, not a converted third-party list.
# Relayed by Tapix AI (https://tapixai.com/v1); upstream model is alibaba/qwen3.8-flash.
# Reasoning: reasoning_effort = low, medium, xhigh on /v1/chat/completions, forwarded verbatim (copy of the lab surface; the lab toggle field is not in our whitelist and is not forwarded).
# Streams reasoning via reasoning_content deltas.
schema = 2
base_model = "alibaba/qwen3.8-flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "xhigh"] }
structured_output = true

[cost.text.input]
price = 0.12

[cost.text.output]
price = 0.38

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
