# Prices: Tapix public sell prices in USD per 1M tokens (https://tapixai.com/api/models, read 2026-11-17) — our own list prices, not a converted third-party list.
# Relayed by Tapix AI (https://tapixai.com/v1); upstream model is alibaba/qwen3.8-max.
# Reasoning: reasoning_effort = none, low, medium, xhigh on /v1/chat/completions (none disables thinking; the lab documents it and a live probe accepted it); forwarded verbatim, lab toggle field not in our whitelist.
# Streams reasoning via reasoning_content deltas.
schema = 2
base_model = "alibaba/qwen3.8-max"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "xhigh"] }
structured_output = true

[cost.text.input]
price = 2.12

[cost.text.output]
price = 5.64

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
