# Prices: https://tapixai.com/pricing and https://tapixai.com/api/models (USD per 1M tokens).
# Relayed via Tapix AI (https://tapixai.com/v1); upstream model is anthropic/claude-haiku-5-5.
# Reasoning effort is exposed through reasoning_effort on /v1/chat/completions; no separate on/off toggle is claimed.
schema = 2
base_model = "anthropic/claude-haiku-5-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 0.07

[cost.text.output]
price = 0.35
