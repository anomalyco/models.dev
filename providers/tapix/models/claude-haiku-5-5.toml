# Prices: https://tapixai.com/pricing and https://tapixai.com/api/models (USD per 1M tokens).
# Relayed via Tapix AI (https://tapixai.com/v1); upstream model is anthropic/claude-haiku-5-5.
# Reasoning toggle: thinking.type = enabled|disabled (forwarded verbatim on /v1/chat/completions).
# Streams reasoning via reasoning_content deltas.
schema = 2
base_model = "anthropic/claude-haiku-5-5"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 0.07

[cost.text.output]
price = 0.35
