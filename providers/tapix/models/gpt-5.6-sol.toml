# Tapix AI relays this model over the OpenAI-compatible chat-completions API
# (https://tapixai.com/v1). Reasoning is exposed only through the OpenAI
# `reasoning_effort` request field; Tapix does not pass through Anthropic-style
# thinking toggles or budget_tokens, so only the effort range is declared here.
# Custom/freeform tools: dated probe 2026-11-26 on gpt-5.5 over
# POST /v1/chat/completions - tools=[{type:"custom",custom:{format:{type:"text"}}}]
# returned HTTP 200, and format {type:"grammar",grammar:{syntax:"regex"}} also
# returned HTTP 200. Both are therefore declared below. The identical request
# against claude-sonnet-5 returns HTTP 400 "no verified mapping for hosted tool
# custom", so freeform is OpenAI-model only on this relay.
# Price verified 2026-11-26 against https://tapixai.com/pricing
schema = 2
base_model = "openai/gpt-5.6-sol"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
freeform = ["text", "regex"]

[cost.text.input]
price = 2.8

[cost.text.output]
price = 14
