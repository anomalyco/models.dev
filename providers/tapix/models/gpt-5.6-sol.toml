# Prices: https://tapixai.com/pricing and https://tapixai.com/api/models (USD per 1M tokens).
# Relayed via Tapix AI (https://tapixai.com/v1); upstream model is openai/gpt-5.6-sol.
schema = 2
base_model = "openai/gpt-5.6-sol"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[api.chat-completions]
capabilities = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 2.8

[cost.text.output]
price = 14
