# Prices: Tapix public sell prices in USD per 1M tokens (https://tapixai.com/api/models, read 2026-11-17) — our own list prices, not a converted third-party list.
# Relayed by Tapix AI (https://tapixai.com/v1); upstream model is moonshotai/kimi-k3.
# Reasoning: reasoning_effort = low, high, max on /v1/chat/completions, forwarded verbatim (copy of the lab surface; the lab toggle field is not in our whitelist and is not forwarded).
# Streams reasoning via reasoning_content deltas.
schema = 2
base_model = "moonshotai/kimi-k3"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[cost.text.input]
price = 2.4

[cost.text.output]
price = 12

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
