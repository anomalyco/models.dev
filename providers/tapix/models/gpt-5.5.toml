# Prices: Tapix public sell prices in USD per 1M tokens (https://tapixai.com/api/models, read 2026-11-17) — our own list prices, not a converted third-party list.
# Relayed by Tapix AI (https://tapixai.com/v1); upstream model is openai/gpt-5.5.
# Reasoning: reasoning_effort = none, low, medium, high, xhigh on /v1/chat/completions, forwarded verbatim from the lab surface (a lab toggle field is not in our whitelist and is not forwarded).
# Custom tools: grammar-constrained (freeform) custom tools were not verified on this host, so no freeform formats are published.
# Streams reasoning via reasoning_content deltas.
schema = 2
base_model = "openai/gpt-5.5"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true

[cost.text.input]
price = 3.5

[cost.text.output]
price = 21

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
