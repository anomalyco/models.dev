# Prices: Tapix public sell prices in USD per 1M tokens (https://tapixai.com/api/models, read 2026-11-17) — our own list prices, not a converted third-party list.
# Relayed by Tapix AI (https://tapixai.com/v1); upstream model is minimax/MiniMax-M3.
# Reasoning: thinking is always on upstream for this model — a 2026-11-17 probe sent reasoning_effort=none and still received reasoning_content, so no caller-side off switch or effort ladder is published.
# Streams reasoning via reasoning_content deltas.
schema = 2
base_model = "minimax/MiniMax-M3"

[capabilities]
reasoning = { supported = true }

[cost.text.input]
price = 0.24

[cost.text.output]
price = 0.96

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
