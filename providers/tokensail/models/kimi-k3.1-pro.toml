# TokenSail entry for moonshotai/kimi-k3.1-pro.
# Reasoning controls (live-verified on api.tokensail.ai, 2026-11-16):
#   toggle - `thinking = { "type": "disabled" }` turns reasoning off
#            (reasoning_tokens 31 -> 0, no reasoning_content). Moonshot's own API has no
#            off switch; TokenSail implements the off path.
#            `enable_thinking = false` is accepted but ignored (still 28 tokens).
#   effort - `reasoning_effort` low | high | max (default max).
# Pricing (read 2026-11-16): USD, converted from the vendor's CNY list price at
# 1 USD = 6.6864 CNY and rounded to 8 decimals. TokenSail charges 95% of that list price.
schema = 2
