# TokenSail entry for alibaba/qwen3.8-max-0902.
# Reasoning controls (live-verified on api.tokensail.ai, 2026-11-16 and 2026-11-17):
#   toggle - `thinking = { "type": "disabled" }` turns reasoning off (no reasoning_content;
#            this vendor omits reasoning_tokens from usage in every mode).
#            `enable_thinking = false` and `reasoning_effort = "none"` have the same effect.
#   effort - accepted, but no effort set is declared. Probed 2026-11-17 with three runs per
#            level on one prompt: reasoning_tokens low [30, 44, 30], medium [29, 29, 44],
#            xhigh [29, 24, 25] - overlapping and non-monotonic, i.e. sampling noise around a
#            single behaviour, not depth. The adapter rewrites `reasoning_effort` into
#            `enable_thinking: true|false` on DashScope-compatible routes and never forwards
#            a strength, so a ladder would promise control the route cannot deliver.
#   budget - `thinking_budget_tokens` 1..262144 is the depth control and is enforced as a cap
#            (probe 2026-11-17: 16 -> reasoning_tokens 16, 256 -> 256 exactly; 512 -> 31 when
#            the model finishes early, so the value is a ceiling, not a target).
#            0 returns HTTP 400 validation_error ("must be an integer greater than or equal to
#            1"), 262145 returns HTTP 400 capability_unsupported ("the maximum for this model
#            is 262144"), and sending it together with `reasoning_effort` returns HTTP 400
#            ("must not be combined with 'reasoning_effort'").
# Cache - implicit and explicit, both priced below. Implicit hits are billed at
#         cache.read (1/8 of input); cache-write traffic is billed at cache.write
#         (1.25x input) but has no separate usage counter on this path.
# structured_output - live-probed 2026-11-16 with `response_format.type = "json_schema"`
#         (strict): HTTP 200 and `{"answer":"ok"}`.
# Limit - no override. TokenSail publishes contextWindow = 1,000,000 for this route
#         (GET https://api.tokensail.ai/api/public/models), the same as the canonical value,
#         so context and output are both inherited.
# Pricing (read 2026-11-16): USD, transcribed from what TokenSail publishes for this model
# (GET https://api.tokensail.ai/api/public/models -> priceShape). TokenSail charges 75% of
# Alibaba's list price.
# Sources: https://docs.modelstudio.console.alibabacloud.com/zh/model-studio/model-pricing
#          (vendor list)
#          https://tokensail.ai/pricing-compare (published USD)
schema = 2
v2_only = true
base_model = "alibaba/qwen3.8-max-0902"

[capabilities]
reasoning = { supported = true, default = { type = "toggle", value = true }, toggle = true, budget = { min = 1, max = 262_144 } }
structured_output = true
cache = { implicit = true, explicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.52553020
cache = { read = 0.19069128, write = 1.90691275 }

[cost.text.output]
price = 4.57659059
