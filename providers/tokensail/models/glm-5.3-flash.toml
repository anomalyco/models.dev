# TokenSail entry for zhipuai/glm-5.3-flash.
# Reasoning controls (live-verified on api.tokensail.ai, 2026-11-16):
#   toggle - `thinking = { "type": "disabled" }` turns reasoning off
#            (reasoning_tokens 97 -> 0, no reasoning_content). The vendor's own API only
#            accepts `type = "enabled"`; TokenSail implements the off path.
#            `enable_thinking = false` is accepted but ignored (still 42 tokens).
#   effort - `reasoning_effort` low | high | max (default max).
#   top_k - accepted and ignored. The gateway forwards the raw JSON body, but Zhipu
#           documents no top_k support (providers/zhipuai sets top_k = false: temperature
#           and top_p only) and a live probe with top_k = 5 returns HTTP 200 with no
#           parameter error, so the value never reaches sampling. Declared false.
# Cache - implicit only. Zhipu's prompt cache is automatic with no write price; hits are
#         billed at the cache-read price below.
# structured_output - omitted on purpose: `response_format.type = "json_schema"` returns
#         HTTP 400 ("`json_schema` is not supported by this mode") on TokenSail, while
#         `json_object` is accepted. Declaring it true would mislead JSON-schema clients.
# Pricing (read 2026-11-16): USD, transcribed from what TokenSail publishes for this model
# (GET https://api.tokensail.ai/api/public/models -> priceShape). TokenSail charges 80% of
# Zhipu's list price.
# Sources: https://docs.z.ai/guides/overview/pricing (vendor list)
#          https://tokensail.ai/pricing-compare (published USD)
schema = 2
v2_only = true
base_model = "zhipuai/glm-5.3-flash"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "max" }, toggle = true, effort = ["low", "high", "max"] }
top_k = false
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[limit]
context = 1_048_576

[cost.text.input]
price = 0.09571954
cache = { read = 0.02751937 }

[cost.text.output]
price = 0.33501840
