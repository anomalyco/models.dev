# Sources (accessed 2026-08-28):
# https://platform.sensenova.cn/docs
# GET /v1/models: context 262144, max output 65536, fp8, text+image -> text,
# supported features tools+json_mode+reasoning; pricing all zero (public beta
# free on TokenPlan).
# Preview launched 2026-08-11: https://www.ithome.com/0/988/416.htm
# Reasoning: reasoning_effort documented enum none|low|medium|high (default
# medium). A reasoning side channel is returned as message.reasoning, which is
# not a schema-supported interleaved field, so no interleaved is authored.
schema = 2
name = "SenseNova 6.8 Flash Lite"
description = "SenseNova lightweight multimodal agent model for real-world complex tasks, data analysis, and complex information presentation"
open_weights = false
release_date = "2026-08-11"
last_updated = "2026-08-28"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
temperature = true

[limit]
context = 262_144
output = 65_536

[cost.text.input]
price = 0
cache = { read = 0 }

[cost.text.output]
price = 0
