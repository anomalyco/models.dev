# Limits: max output 131K on the model page (https://www.siliconflow.com/models/glm-5, 2026-10-21), as in the lab.
schema = 2
base_model = "zhipuai/glm-5"
name = "zai-org/GLM-5"
description = "Flagship GLM model for hybrid reasoning, coding, and agentic engineering"

[capabilities]
reasoning = { supported = true, budget = { min = 128, max = 32_768 } }
structured_output = true

[limit]
context = 205_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.95
cache = { read = 0.2 }

[cost.text.output]
price = 2.55
