# Sources: https://www.siliconflow.com/models (2026-09-08)
# SiliconFlow serves image input but not video/pdf for this model
# (model page "Support image input: Yes"): https://www.siliconflow.com/models/glm-5-3-flash
base_model = "zhipuai/glm-5.3-flash"
structured_output = true


reasoning_options = [{ type = "effort", values = ["low", "high", "max"] }]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.15
output = 0.5
cache_read = 0.03
cache_write = 0

[limit]
context = 1_049_000
output = 262_000

[modalities]
input = ["text", "image"]
output = ["text"]
