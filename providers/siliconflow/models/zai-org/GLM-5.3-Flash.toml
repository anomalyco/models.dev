# Sources: https://www.siliconflow.com/models (2026-09-08)
# SiliconFlow serves image input but not video/pdf for this model
# (model page "Support image input: Yes"): https://www.siliconflow.com/models/glm-5-3-flash
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
context = 1_049_000
output = 262_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.15
cache = { read = 0.03, write = 0 }

[cost.text.output]
price = 0.5
