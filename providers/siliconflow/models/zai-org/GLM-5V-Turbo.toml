# Toggle: enable_thinking = true|false (top-level request field)
# Budget: thinking_budget = 128..32768 (top-level request field)
# https://docs.siliconflow.com/en/api-reference/chat-completions/chat-completions
schema = 2
base_model = "zhipuai/glm-5v-turbo"
name = "zai-org/GLM-5V-Turbo"
description = "GLM vision model for visual reasoning, documents, and multimodal agents"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, budget = { min = 128, max = 32_768 } }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.2
cache = { read = 0.24, write = 0 }

[cost.text.output]
price = 4
