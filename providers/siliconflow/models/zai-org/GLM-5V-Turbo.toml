schema = 2
name = "zai-org/GLM-5V-Turbo"
description = "GLM vision model for visual reasoning, documents, and multimodal agents"
family = "glm"
open_weights = false
release_date = "2026-04-01"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true, budget = { min = 128, max = 32_768 } }
temperature = true

[limit]
context = 200_000
output = 131_072

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.2
cache = { read = 0.24, write = 0 }

[cost.text.output]
price = 4
