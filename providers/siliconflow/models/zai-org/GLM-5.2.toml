# Sources: https://www.siliconflow.com/models (2026-09-08)
# Cost values are the published USD list prices on SiliconFlow international
# (https://www.siliconflow.com/pricing, accessed 2026-09-08), not FX conversions by this PR.
schema = 2
base_model = "zhipuai/glm-5.2"

[capabilities]
reasoning = { supported = true, effort = ["high", "max"] }
structured_output = true

[limit]
context = 1_049_000
output = 262_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.302
cache = { read = 0.26, write = 0 }

[cost.text.output]
price = 4.092
