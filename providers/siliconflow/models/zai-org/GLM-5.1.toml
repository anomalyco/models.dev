# Prices verified against SiliconFlow international, GLM-5.1 model page
# (https://www.siliconflow.com/models/glm-5-1, accessed 2026-09-08):
# input $1.19, cached input $0.6, output $3.74 per M tokens.
schema = 2
name = "zai-org/GLM-5.1"
description = "Flagship GLM model for hybrid reasoning, coding, and agentic engineering"
family = "glm"
open_weights = true
release_date = "2026-04-08"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, budget = { min = 128, max = 32_768 } }
structured_output = true
temperature = true

[limit]
context = 205_000
output = 131_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.19
cache = { read = 0.6, write = 0 }

[cost.text.output]
price = 3.74
