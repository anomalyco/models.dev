# Prices verified against SiliconFlow international, GLM-5.1 model page
# (https://www.siliconflow.com/models/glm-5-1, accessed 2026-09-08):
# input $1.19, cached input $0.6, output $3.74 per M tokens.
name = "zai-org/GLM-5.1"
description = "Flagship GLM model for hybrid reasoning, coding, and agentic engineering"
family = "glm"
release_date = "2026-04-08"
last_updated = "2026-04-08"
attachment = false
reasoning = true
reasoning_options = [{ type = "budget_tokens", min = 128, max = 32_768 }]
temperature = true
tool_call = true
structured_output = true
open_weights = true

[interleaved]
field = "reasoning_content"

[cost]
input = 1.19
output = 3.74
cache_read = 0.6
cache_write = 0

[limit]
context = 205_000
output = 131_000

[modalities]
input = ["text"]
output = ["text"]
