# Budget: thinking_budget (integer reasoning tokens, 128..32768) — SiliconFlow documents
# thinking_budget for all reasoning models; enable_thinking is not enumerated for MiniMax
# models on this host, so no toggle.
# Sources: https://www.siliconflow.com/models (2026-09-08),
# https://docs.siliconflow.com/en/api-reference/chat-completions/chat-completions
# SiliconFlow serves image input but not video for this model
# (model page "Support image input: Yes"): https://www.siliconflow.com/models/minimax-m3
schema = 2
base_model = "minimax/MiniMax-M3"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, budget = { min = 128, max = 32_768 } }

[limit]
output = 131_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.3
cache = { read = 0.06 }

[cost.text.output]
price = 1.2
