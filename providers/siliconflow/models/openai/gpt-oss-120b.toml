# Tools: the model page lists "Tools: Not supported" (https://www.siliconflow.com/models/gpt-oss-120b, 2026-10-21).
schema = 2
base_model = "openai/gpt-oss-120b"
name = "openai/gpt-oss-120b"
description = "Open-weight GPT model for self-hosted reasoning and instruction-following workloads"

[capabilities]
tools = { supported = false }
reasoning = { supported = true, budget = { min = 128, max = 32_768 } }
structured_output = true

[limit]
context = 131_000
output = 8_000

[cost.text.input]
price = 0.05

[cost.text.output]
price = 0.45
