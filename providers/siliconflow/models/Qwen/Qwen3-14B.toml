schema = 2
name = "Qwen/Qwen3-14B"
description = "Qwen instruction model for multilingual chat, reasoning, and tool use"
family = "qwen"
open_weights = true
release_date = "2025-04-30"
last_updated = "2025-11-25"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
