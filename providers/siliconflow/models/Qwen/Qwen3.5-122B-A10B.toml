# Modalities: image input but no video, per the model page ("Support image input: Supported",
# https://www.siliconflow.com/models/qwen3-5-122b-a10b, 2026-10-21); image formats from the lab.
schema = 2
base_model = "alibaba/qwen3.5-122b-a10b"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
reasoning = { supported = false }
structured_output = true

[limit]
context = 262_144
output = 262_144

[cost.text.input]
price = 0.26

[cost.text.output]
price = 2.08
