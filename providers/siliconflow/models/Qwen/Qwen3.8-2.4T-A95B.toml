# Budget: thinking_budget (integer reasoning tokens, 128..32768) — SiliconFlow exposes no
# reasoning_effort parameter; thinking_budget is documented for all reasoning models.
# Sources: https://www.siliconflow.com/models (2026-09-08),
# https://docs.siliconflow.com/en/api-reference/chat-completions/chat-completions
base_model = "alibaba/qwen3.8-2.4t-a95b"

reasoning_options = [{ type = "budget_tokens", min = 128, max = 32_768 }]

[cost]
input = 2.0
output = 6.0
cache_read = 0.25

[limit]
context = 1_049_000
output = 131_000
