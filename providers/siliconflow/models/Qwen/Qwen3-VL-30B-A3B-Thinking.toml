# Budget: thinking_budget = 128..32768 (top-level request field); the reasoning guide says the Qwen3 series
# natively enforces it (https://docs.siliconflow.com/en/userguide/capabilities/reasoning).
schema = 2
name = "Qwen/Qwen3-VL-30B-A3B-Thinking"
description = "Qwen vision-language model for visual reasoning, documents, and agent tasks"
family = "qwen"
open_weights = false
release_date = "2025-10-11"
last_updated = "2025-11-25"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, budget = { min = 128, max = 32_768 } }
structured_output = true
temperature = true

[limit]
context = 262_000
output = 262_000

[cost.text.input]
price = 0.29

[cost.text.output]
price = 1
