# Sources: https://www.siliconflow.com/models (2026-09-08)
# Cost values are the published USD list prices on SiliconFlow international
# (https://www.siliconflow.com/pricing), not FX conversions by this PR.
# SiliconFlow serves image input but not video for this model
# (model page "Support image input: Yes"): https://www.siliconflow.com/models/kimi-k2-7-code
# Image formats are the lab's.
schema = 2
base_model = "moonshotai/kimi-k2.7-code"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, budget = { min = 128, max = 32_768 } }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.85916
cache = { read = 0.17993 }

[cost.text.output]
price = 3.8
