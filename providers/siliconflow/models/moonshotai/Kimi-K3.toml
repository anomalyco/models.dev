# Sources: https://www.siliconflow.com/models (2026-09-08)
# SiliconFlow serves image input but not video for this model
# (model page "Support image input: Yes"): https://www.siliconflow.com/models/kimi-k3
# Image formats are the lab's.
schema = 2
base_model = "moonshotai/kimi-k3"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, budget = { min = 128, max = 32_768 } }
structured_output = true

[limit]
output = 262_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 2.7
cache = { read = 0.27 }

[cost.text.output]
price = 13.5
