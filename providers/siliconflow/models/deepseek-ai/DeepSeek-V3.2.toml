# Toggle: enable_thinking = true|false (top-level request field)
# Budget: thinking_budget = 128..32768 (top-level request field)
# https://docs.siliconflow.com/en/api-reference/chat-completions/chat-completions
schema = 2
base_model = "deepseek/deepseek-v3.2"
name = "deepseek-ai/DeepSeek-V3.2"
description = "DeepSeek chat model for instruction following, coding, and analysis"

[capabilities]
reasoning = { supported = true, toggle = true, budget = { min = 128, max = 32_768 } }
structured_output = true

[limit]
context = 164_000
output = 164_000

[cost.text.input]
price = 0.27
cache = { read = 0.135 }

[cost.text.output]
price = 0.42
