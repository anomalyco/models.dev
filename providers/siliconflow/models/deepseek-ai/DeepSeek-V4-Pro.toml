# Cost values are the published USD list prices on SiliconFlow international
# (https://www.siliconflow.com/pricing, accessed 2026-09-08), not FX conversions by this PR.
# Budget: thinking_budget = 128..32768 (top-level request field)
# https://docs.siliconflow.com/en/api-reference/chat-completions/chat-completions
schema = 2
base_model = "deepseek/deepseek-v4-pro"

[capabilities]
reasoning = { supported = true, budget = { min = 128, max = 32_768 } }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.50162
cache = { read = 0.135 }

[cost.text.output]
price = 3.135
