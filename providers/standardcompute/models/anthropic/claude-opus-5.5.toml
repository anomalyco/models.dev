# Model ID anthropic/claude-opus-5.5; reference rates $4 / $20 / $0.2 / $5 per 1M tokens (input/output/cache read/cache write), charged against the plan's monthly compute budget.
# https://docs.standardcompute.com/budgets-and-limits (accessed 2026-10-16)
base_model = "anthropic/claude-opus-5-5"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]

[interleaved]
field = "reasoning_details"

[cost]
input = 4
output = 20
cache_read = 0.2
cache_write = 5

[limit]
input = 850_000
output = 50_000

[provider]
npm = "@openrouter/ai-sdk-provider"
