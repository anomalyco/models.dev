# Model ID openai/gpt-6-luna; reference rates $0.1 / $0.5 / $0.01 / $0.125 per 1M tokens (input/output/cache read/cache write), charged against the plan's monthly compute budget.
# https://docs.standardcompute.com/budgets-and-limits (accessed 2026-10-16)
base_model = "openai/gpt-6-luna"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh", "max"] }]

[interleaved]
field = "reasoning_details"

[cost]
input = 0.1
output = 0.5
cache_read = 0.01
cache_write = 0.125

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 0.2
output = 0.75
cache_read = 0.02
cache_write = 0.25

[limit]
input = 850_000
output = 50_000

[provider]
npm = "@openrouter/ai-sdk-provider"
