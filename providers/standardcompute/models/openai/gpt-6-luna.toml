# Model ID openai/gpt-6-luna. Each request is charged against the plan's monthly compute budget
# (https://docs.standardcompute.com/budgets-and-limits, accessed 2026-10-16). Costs are the current price
# of the endpoint Standard Compute routes this model to, as charged against the budget
# (price listing: https://openrouter.ai/api/v1/models/openai/gpt-6-luna/endpoints, accessed 2026-10-16).
# Context tiers start at 272,000 prompt tokens.
schema = 2
base_model = "openai/gpt-6-luna"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[limit]
input = 850_000
output = 50_000

[api.chat-completions]
sdk = { aisdk = "@openrouter/ai-sdk-provider", opencodeai = "@opencode/ai/providers/openrouter" }
compatibility = { reasoning_field = "reasoning_details" }

[cost.text.input]
price = 0.1
cache = { read = 0.01, write = 0.125 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 0.2
cache = { read = 0.02, write = 0.25 }

[cost.text.output]
price = 0.5

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 0.75
