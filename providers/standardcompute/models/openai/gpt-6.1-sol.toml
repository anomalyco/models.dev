# Model ID openai/gpt-6.1-sol, listed by GET https://api.stdcmpt.com/v1/models (public, accessed 2026-11-08).
# Each request is charged against the plan's monthly compute budget
# (https://docs.standardcompute.com/budgets-and-limits). Standard Compute does not
# publish a per-model rate table for this id, so no cost is listed.
schema = 2
base_model = "openai/gpt-6.1-sol"

[capabilities]
