# Model ID openai/gpt-5.6-luna; reference rates $0.2 / $1.2 / $0.02 per 1M tokens (input/output/cache read), charged against the plan's monthly compute budget.
# https://docs.standardcompute.com/budgets-and-limits (accessed 2026-10-16)
base_model = "openai/gpt-5.6-luna"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh", "max"] }]

[interleaved]
field = "reasoning_details"

[cost]
input = 0.2
output = 1.2
cache_read = 0.02

[limit]
input = 850_000
output = 50_000

[provider]
npm = "@openrouter/ai-sdk-provider"
