# Model ID openai/gpt-5.6-sol; reference rates $4 / $20 per 1M tokens (input/output), charged against the plan's monthly compute budget.
# Current OpenAI list rate; older catalog value $5 / $30 is obsolete.
# https://docs.standardcompute.com/budgets-and-limits (accessed 2026-10-16)
base_model = "openai/gpt-5.6-sol"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh", "max"] }]

[interleaved]
field = "reasoning_details"

[cost]
input = 4
output = 20

[limit]
input = 850_000
output = 50_000

[provider]
npm = "@openrouter/ai-sdk-provider"
