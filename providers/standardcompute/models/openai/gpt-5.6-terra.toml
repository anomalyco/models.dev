# Model ID openai/gpt-5.6-terra. Each request is charged against the plan's monthly compute budget
# (https://docs.standardcompute.com/budgets-and-limits, accessed 2026-10-16). Costs are the current price
# of the endpoint Standard Compute routes this model to, as charged against the budget
# (price listing: https://openrouter.ai/api/v1/models/openai/gpt-5.6-terra/endpoints, accessed 2026-10-16).
# Context tiers start at 272,000 prompt tokens.
base_model = "openai/gpt-5.6-terra"
structured_output = true
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh", "max"] }]

[interleaved]
field = "reasoning_details"

[cost]
input = 2
output = 12
cache_read = 0.2
cache_write = 2.5

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 4
output = 18
cache_read = 0.4
cache_write = 5

[limit]
input = 850_000
output = 50_000

[provider]
npm = "@openrouter/ai-sdk-provider"
