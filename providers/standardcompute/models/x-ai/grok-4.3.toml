# Model ID x-ai/grok-4.3. Each request is charged against the plan's monthly compute budget
# (https://docs.standardcompute.com/budgets-and-limits, accessed 2026-10-16) at the upstream cost
# OpenRouter reports for that request, so the rates are OpenRouter's "xAI" endpoint
# pricing (https://openrouter.ai/api/v1/models/x-ai/grok-4.3/endpoints, accessed 2026-10-16).
# Context tiers start at 200,000 prompt tokens, as on that endpoint.
base_model = "xai/grok-4.3"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high"] }]

[interleaved]
field = "reasoning_details"

[cost]
input = 1.25
output = 2.5
cache_read = 0.2

[[cost.tiers]]
tier = { type = "context", size = 200_000 }
input = 2.5
output = 5
cache_read = 0.4

[limit]
input = 850_000

[provider]
npm = "@openrouter/ai-sdk-provider"
