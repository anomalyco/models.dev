# Model ID x-ai/grok-4.3. Each request is charged against the plan's monthly compute budget
# (https://docs.standardcompute.com/budgets-and-limits, accessed 2026-10-16). Costs are the current price
# of the endpoint Standard Compute routes this model to, as charged against the budget
# (price listing: https://openrouter.ai/api/v1/models/x-ai/grok-4.3/endpoints, accessed 2026-10-16).
# Context tiers start at 200,000 prompt tokens.
base_model = "xai/grok-4.3"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high"] }]

[interleaved]
field = "reasoning_details"

[cost]
input = 1.25
output = 2.5
cache_read = 0.2

[[cost.tiers]]
tier = { type = "context", size = 200_000 }
input = 2.5
output = 5
cache_read = 0.4

[limit]
input = 850_000

[provider]
npm = "@openrouter/ai-sdk-provider"
