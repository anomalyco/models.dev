# Model ID qwen/qwen3.7-flash. Each request is charged against the plan's monthly compute budget
# (https://docs.standardcompute.com/budgets-and-limits, accessed 2026-10-16). Costs are the current price
# of the endpoint Standard Compute routes this model to, as charged against the budget
# (price listing: https://openrouter.ai/api/v1/models/qwen/qwen3.7-flash/endpoints, accessed 2026-10-16).
# Context tiers start at 32,000 and 256,000 prompt tokens.
# Toggle: reasoning.enabled = true|false (https://docs.standardcompute.com/reasoning)
# Budget: reasoning.max_tokens (passed through as the upstream thinking budget)
schema = 2
base_model = "alibaba/qwen3.7-flash"

[capabilities]
reasoning = { supported = true, toggle = true, budget = { max = 262_144 } }
structured_output = true

[limit]
input = 850_000
output = 50_000

[api.chat-completions]
sdk = { aisdk = "@openrouter/ai-sdk-provider" }
compatibility = { reasoning_field = "reasoning_details" }

[cost.text.input]
price = 0.03
cache = { read = 0.006, write = 0.038 }

[[cost.text.input.overrides]]
when = { context = { gt = 32_000 } }
price = 0.1
cache = { read = 0.02, write = 0.125 }

[[cost.text.input.overrides]]
when = { context = { gt = 256_000 } }
price = 0.2
cache = { read = 0.04, write = 0.25 }

[cost.text.output]
price = 0.13

[[cost.text.output.overrides]]
when = { context = { gt = 32_000 } }
price = 0.4

[[cost.text.output.overrides]]
when = { context = { gt = 256_000 } }
price = 0.8
