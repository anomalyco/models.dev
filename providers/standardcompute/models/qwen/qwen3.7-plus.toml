# Model ID qwen/qwen3.7-plus. Each request is charged against the plan's monthly compute budget
# (https://docs.standardcompute.com/budgets-and-limits, accessed 2026-10-16). Costs are the current price
# of the endpoint Standard Compute routes this model to, as charged against the budget
# (price listing: https://openrouter.ai/api/v1/models/qwen/qwen3.7-plus/endpoints, accessed 2026-10-16).
# Context tiers start at 256,000 prompt tokens.
# Toggle: reasoning.enabled = true|false (https://docs.standardcompute.com/reasoning)
# Budget: reasoning.max_tokens (passed through as the upstream thinking budget)
schema = 2
base_model = "alibaba/qwen3.7-plus"

[capabilities]
reasoning = { supported = true, toggle = true, budget = {} }

[limit]
input = 850_000
output = 50_000

[api.chat-completions]
sdk = { aisdk = "@openrouter/ai-sdk-provider" }
compatibility = { reasoning_field = "reasoning_details" }

[cost.text.input]
price = 0.32
cache = { read = 0.064, write = 0.4 }

[[cost.text.input.overrides]]
when = { context = { gt = 256_000 } }
price = 0.96
cache = { read = 0.192, write = 1.2 }

[cost.text.output]
price = 1.28

[[cost.text.output.overrides]]
when = { context = { gt = 256_000 } }
price = 3.84
