# Model ID qwen/qwen3.8-flash. Each request is charged against the plan's monthly compute budget
# (https://docs.standardcompute.com/budgets-and-limits, accessed 2026-10-16). Costs are the current price
# of the endpoint Standard Compute routes this model to, as charged against the budget
# (price listing: https://openrouter.ai/api/v1/models/qwen/qwen3.8-flash/endpoints, accessed 2026-10-16).
# Toggle: reasoning.enabled = true|false (https://docs.standardcompute.com/reasoning)
# Effort: reasoning_effort or reasoning.effort = low|medium|xhigh
# Budget: reasoning.max_tokens (passed through as the upstream thinking budget)
schema = 2
base_model = "alibaba/qwen3.8-flash"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "xhigh"], budget = { max = 262_144 } }
structured_output = true

[limit]
input = 850_000
output = 50_000

[api.chat-completions]
sdk = { aisdk = "@openrouter/ai-sdk-provider", opencodeai = "@opencode/ai/providers/openrouter" }
compatibility = { reasoning_field = "reasoning_details" }

[cost.text.input]
price = 0.15
cache = { read = 0.016, write = 0.2 }

[cost.text.output]
price = 0.47
