# Model ID z-ai/glm-5.3-flash. Each request is charged against the plan's monthly compute budget
# (https://docs.standardcompute.com/budgets-and-limits, accessed 2026-10-16) at the upstream cost
# OpenRouter reports for that request. The gateway routes this model to OpenRouter's "Near AI"
# endpoint first (DeepInfra as fallback), so the rates are that endpoint's current pricing
# (https://openrouter.ai/api/v1/models/z-ai/glm-5.3-flash/endpoints, accessed 2026-10-16).
base_model = "zhipuai/glm-5.3-flash"
reasoning_options = [{ type = "effort", values = ["low", "high", "max"] }]

[interleaved]
field = "reasoning_details"

[cost]
input = 0.08
output = 0.5
cache_read = 0.012

[limit]
input = 850_000
output = 50_000

[provider]
npm = "@openrouter/ai-sdk-provider"
