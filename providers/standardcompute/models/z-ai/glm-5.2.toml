# Model ID z-ai/glm-5.2. Each request is charged against the plan's monthly compute budget
# (https://docs.standardcompute.com/budgets-and-limits, accessed 2026-10-16) at the upstream cost
# OpenRouter reports for that request, so the rates are OpenRouter's "Z.AI" endpoint
# pricing (https://openrouter.ai/api/v1/models/z-ai/glm-5.2/endpoints, accessed 2026-10-16).
base_model = "zhipuai/glm-5.2"
reasoning_options = [{ type = "effort", values = ["none", "high", "xhigh"] }]

[interleaved]
field = "reasoning_details"

[cost]
input = 1.4
output = 4.4
cache_read = 0.26

[limit]
input = 850_000
output = 50_000

[provider]
npm = "@openrouter/ai-sdk-provider"
