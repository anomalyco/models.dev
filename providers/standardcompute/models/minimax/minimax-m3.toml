# Model ID minimax/minimax-m3. Each request is charged against the plan's monthly compute budget
# (https://docs.standardcompute.com/budgets-and-limits, accessed 2026-10-16). Costs are the current price
# of the endpoint Standard Compute routes this model to, as charged against the budget
# (price listing: https://openrouter.ai/api/v1/models/minimax/minimax-m3/endpoints, accessed 2026-10-16).
# The price is flat (no context tier), unlike MiniMax's first-party 512K tier.
# Toggle: reasoning.enabled = true|false (https://docs.standardcompute.com/reasoning)
schema = 2
base_model = "minimax/MiniMax-M3"

[capabilities]
reasoning = { supported = true, toggle = true }

[limit]
input = 850_000
output = 50_000

[api.chat-completions]
sdk = { aisdk = "@openrouter/ai-sdk-provider" }
compatibility = { reasoning_field = "reasoning_details" }

[cost.text.input]
price = 0.3
cache = { read = 0.06 }

[cost.text.output]
price = 1.2
