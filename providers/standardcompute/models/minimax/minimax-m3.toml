# Model ID minimax/minimax-m3; reference rates $0.3 / $1.2 / $0.06 per 1M tokens (input/output/cache read), charged against the plan's monthly compute budget.
# https://docs.standardcompute.com/budgets-and-limits (accessed 2026-10-16)
# Toggle: reasoning.enabled = true|false (https://docs.standardcompute.com/reasoning)
base_model = "minimax/MiniMax-M3"
reasoning_options = [{ type = "toggle" }]

[interleaved]
field = "reasoning_details"

[cost]
input = 0.3
output = 1.2
cache_read = 0.06

[limit]
input = 850_000
output = 50_000

[provider]
npm = "@openrouter/ai-sdk-provider"
