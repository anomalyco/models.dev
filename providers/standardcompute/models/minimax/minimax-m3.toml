# Model ID minimax/minimax-m3. Each request is charged against the plan's monthly compute budget
# (https://docs.standardcompute.com/budgets-and-limits, accessed 2026-10-16) at the upstream cost
# OpenRouter reports for that request. The gateway assigns each API key to OpenRouter's "Novita"
# or "Minimax" endpoint for this model; both list the same current pricing
# (https://openrouter.ai/api/v1/models/minimax/minimax-m3/endpoints, accessed 2026-10-16).
# Both endpoints are flat-priced (no context tier), unlike MiniMax's first-party 512K tier.
# Toggle: reasoning.enabled = true|false (https://docs.standardcompute.com/reasoning)
base_model = "minimax/MiniMax-M3"
reasoning_options = [{ type = "toggle" }]

[interleaved]
field = "reasoning_details"

[cost]
input = 0.3
output = 1.2
cache_read = 0.06

[limit]
input = 850_000
output = 50_000

[provider]
npm = "@openrouter/ai-sdk-provider"
