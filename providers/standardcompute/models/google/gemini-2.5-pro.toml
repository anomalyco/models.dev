# Model ID google/gemini-2.5-pro. Each request is charged against the plan's monthly compute budget
# (https://docs.standardcompute.com/budgets-and-limits, accessed 2026-10-16) at the upstream cost
# OpenRouter reports for that request, so the rates are OpenRouter's "Google AI Studio" endpoint
# pricing (https://openrouter.ai/api/v1/models/google/gemini-2.5-pro/endpoints, accessed 2026-10-16).
# Context tiers start at 200,000 prompt tokens, as on that endpoint.
base_model = "google/gemini-2.5-pro"
reasoning_options = [{ type = "budget_tokens", min = 128, max = 32_768 }]

[interleaved]
field = "reasoning_details"

[cost]
input = 1.25
output = 10
cache_read = 0.125
cache_write = 0.375

[[cost.tiers]]
tier = { type = "context", size = 200_000 }
input = 2.5
output = 15
cache_read = 0.25

[limit]
input = 850_000
output = 50_000

[provider]
npm = "@openrouter/ai-sdk-provider"
