# Model ID google/gemini-2.5-pro; reference rates $1.25 / $10 / $0.125 per 1M tokens (input/output/cache read), charged against the plan's monthly compute budget.
# https://docs.standardcompute.com/budgets-and-limits (accessed 2026-10-16)
base_model = "google/gemini-2.5-pro"
reasoning_options = [{ type = "budget_tokens", min = 128, max = 32_768 }]

[interleaved]
field = "reasoning_details"

[cost]
input = 1.25
output = 10
cache_read = 0.125

[limit]
input = 850_000
output = 50_000

[provider]
npm = "@openrouter/ai-sdk-provider"
