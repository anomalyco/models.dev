# Model ID google/gemini-2.5-flash. Each request is charged against the plan's monthly compute budget
# (https://docs.standardcompute.com/budgets-and-limits, accessed 2026-10-16) at the upstream cost
# OpenRouter reports for that request, so the rates are OpenRouter's "Google AI Studio" endpoint
# pricing (https://openrouter.ai/api/v1/models/google/gemini-2.5-flash/endpoints, accessed 2026-10-16).
# Toggle: reasoning.enabled = true|false (https://docs.standardcompute.com/reasoning)
# Budget: reasoning.max_tokens (passed through as the upstream thinking budget)
base_model = "google/gemini-2.5-flash"
reasoning_options = [{ type = "toggle" }, { type = "budget_tokens", min = 0, max = 24_576 }]

[interleaved]
field = "reasoning_details"

[cost]
input = 0.3
output = 2.5
cache_read = 0.03
cache_write = 0.083333

[limit]
input = 850_000
output = 50_000

[provider]
npm = "@openrouter/ai-sdk-provider"
