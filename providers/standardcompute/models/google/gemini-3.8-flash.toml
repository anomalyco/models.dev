# Model ID google/gemini-3.8-flash. Each request is charged against the plan's monthly compute budget
# (https://docs.standardcompute.com/budgets-and-limits, accessed 2026-10-16) at the upstream cost
# OpenRouter reports for that request, so the rates are OpenRouter's "Google AI Studio" endpoint
# pricing (https://openrouter.ai/api/v1/models/google/gemini-3.8-flash/endpoints, accessed 2026-10-16).
# The current rate includes a 50% promotion listed by OpenRouter (regular $1.5 / $7.5).
base_model = "google/gemini-3.8-flash"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high"] }]

[interleaved]
field = "reasoning_details"

[cost]
input = 0.75
output = 3.75
cache_read = 0.075
cache_write = 0.041667

[limit]
input = 850_000
output = 50_000

[provider]
npm = "@openrouter/ai-sdk-provider"
