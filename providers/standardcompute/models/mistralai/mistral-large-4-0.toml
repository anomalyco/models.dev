# Model ID mistralai/mistral-large-4-0. Each request is charged against the plan's monthly compute budget
# (https://docs.standardcompute.com/budgets-and-limits, accessed 2026-10-16) at the upstream cost
# OpenRouter reports for that request, so the rates are OpenRouter's "Mistral" endpoint
# pricing (https://openrouter.ai/api/v1/models/mistralai/mistral-large-4-0/endpoints, accessed 2026-10-16).
# The current rate includes a 50% promotion listed by OpenRouter (regular $1.36 / $4.18).
base_model = "mistral/mistral-large-4"
reasoning_options = [{ type = "effort", values = ["none", "high"] }]

[interleaved]
field = "reasoning_details"

[cost]
input = 0.68
output = 2.09
cache_read = 0.07

[limit]
input = 850_000
output = 50_000

[provider]
npm = "@openrouter/ai-sdk-provider"
