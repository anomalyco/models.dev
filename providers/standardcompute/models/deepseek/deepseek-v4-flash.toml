# Model ID deepseek/deepseek-v4-flash. Each request is charged against the plan's monthly compute budget
# (https://docs.standardcompute.com/budgets-and-limits, accessed 2026-10-16) at the upstream cost
# OpenRouter reports for that request. The gateway routes this model to OpenRouter's "StreamLake"
# endpoint, so the rates are that endpoint's current pricing
# (https://openrouter.ai/api/v1/models/deepseek/deepseek-v4-flash/endpoints, accessed 2026-10-16).
# Includes a 41% promotion (end date not published); regular $0.14 / $0.28, cache read $0.028.
base_model = "deepseek/deepseek-v4-flash"
reasoning_options = [{ type = "effort", values = ["none", "high", "xhigh"] }]

[interleaved]
field = "reasoning_details"

[cost]
input = 0.0826
output = 0.1652
cache_read = 0.01652

[limit]
input = 850_000
output = 50_000

[provider]
npm = "@openrouter/ai-sdk-provider"
