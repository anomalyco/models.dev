# Model ID deepseek/deepseek-v4.1-flash; reference rates $0.3 / $1.2 per 1M tokens (input/output), charged against the plan's monthly compute budget.
# https://docs.standardcompute.com/budgets-and-limits (accessed 2026-10-16)
base_model = "deepseek/deepseek-v4.1-flash"
reasoning_options = [{ type = "effort", values = ["none", "low", "high", "max"] }]

[interleaved]
field = "reasoning_details"

[cost]
input = 0.3
output = 1.2

[limit]
input = 850_000
output = 50_000

[provider]
npm = "@openrouter/ai-sdk-provider"
