# Model ID deepseek/deepseek-v4.1-flash. Each request is charged against the plan's monthly compute budget
# (https://docs.standardcompute.com/budgets-and-limits, accessed 2026-10-16) at the upstream cost
# OpenRouter reports for that request. The gateway routes this model to OpenRouter's "DeepInfra"
# endpoint first (Novita as fallback), so the rates are that endpoint's current pricing
# (https://openrouter.ai/api/v1/models/deepseek/deepseek-v4.1-flash/endpoints, accessed 2026-10-16).
# Includes a 30% promotion (end date not published); regular $0.20 / $0.60, cache read $0.006.
base_model = "deepseek/deepseek-v4.1-flash"
reasoning_options = [{ type = "effort", values = ["none", "low", "high", "max"] }]

[interleaved]
field = "reasoning_details"

[cost]
input = 0.14
output = 0.42
cache_read = 0.0042

[limit]
input = 850_000
output = 50_000

[provider]
npm = "@openrouter/ai-sdk-provider"
