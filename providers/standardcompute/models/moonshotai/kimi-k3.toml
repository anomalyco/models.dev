# Model ID moonshotai/kimi-k3. Each request is charged against the plan's monthly compute budget
# (https://docs.standardcompute.com/budgets-and-limits, accessed 2026-10-16) at the upstream cost
# OpenRouter reports for that request, so the rates are OpenRouter's "Moonshot AI" endpoint
# pricing (https://openrouter.ai/api/v1/models/moonshotai/kimi-k3/endpoints, accessed 2026-10-16).
base_model = "moonshotai/kimi-k3"
reasoning_options = [{ type = "effort", values = ["none", "low", "high", "max"] }]

[interleaved]
field = "reasoning_details"

[cost]
input = 3
output = 15
cache_read = 0.3

[limit]
input = 850_000
output = 50_000

[provider]
npm = "@openrouter/ai-sdk-provider"
