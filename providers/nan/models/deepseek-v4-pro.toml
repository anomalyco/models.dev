# Source: https://nan.builders/docs/models (accessed 2026-11-10)
# Relayed from an external provider and served as the DeepSeek V4-Pro 0813
# release. Text only, 1M context, 393K max answer. "Larger model" tier.
# Pricing: credits per 1M tokens from https://cloud.nan.builders/tokens (behind
# login, accessed 2026-11-10): 66 input / 2.20 cached / 198 output. Converted at
# the 1,000-credit pack list price (26 EUR) x 1.08, the EUR->USD factor the page
# itself uses: 0.02808 USD per credit. Larger packs and the subscriber discount
# are cheaper.
# Cache: the price page lists a Cached input rate for this model, so prompt
# caching is implicit; NaN documents no cache_control markers. Cached reads are
# billed at 2.20 credits per 1M.
# Reasoning: "To turn reasoning off, send none. That is the whole switch. It
# works on every model except GLM", and the thinking/enable_thinking aliases are
# not mapped on this model. Off is effort=none, so no toggle; the graded levels
# are the lab's low|high|max, since NaN leaves them out of its contract here.
# https://nan.builders/docs/models#controlling-reasoning
schema = 2
base_model = "deepseek/deepseek-v4-pro-0813"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
cache = { implicit = true }

[cost.text.input]
price = 1.85328
cache = { read = 0.061776 }

[cost.text.output]
price = 5.55984
