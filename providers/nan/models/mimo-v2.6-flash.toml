# Source: https://nan.builders/docs/models (accessed 2026-09-26)
# The newest Xiaomi MiMo, natively omnimodal with dedicated vision and audio
# encoders. 1M context. Same limits as mimo-v2.5: 1.0B token monthly quota per
# member, 1.5M tpm and 5 concurrent requests. No video input on this host.
# Included in the membership, so no per-token price.
# Context is inherited: NaN publishes "1M tokens", the same wording it uses for
# deepseek-v4-flash and glm5.3-flash, with no documented trim of the model's
# native 1_048_576 window. The docs/examples opencode.json snippet caps
# contextWindow at 500000, but that snippet also trims maxTokens to a
# per-request value rather than the ceiling.
# NaN reasoning table (checked 2026-10-21): reasoning_effort values none, minimal, low, medium,
# high, xhigh, max; https://nan.builders/docs/models#controlling-reasoning
# Update: none turns reasoning off; low, medium, high, max (minimal is applied as low, xhigh as max).
schema = 2
base_model = "xiaomi/mimo-v2.6-flash"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "audio/mpeg", "audio/wav", "audio/flac", "audio/mp4", "audio/ogg"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"] }

[cost.text.input]
price = 0

[cost.text.output]
price = 0
