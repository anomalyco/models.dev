# Source: https://nan.builders/docs/models (accessed 2026-11-10)
# The newest Xiaomi MiMo, natively omnimodal with vision and audio input; relayed
# from an external provider. 1M context. No video input on this host. Reasoning
# counts inside max_tokens.
# Context is inherited: NaN publishes "1M tokens" with no documented trim of the
# model's native 1_048_576 window.
# Pricing: credits per 1M tokens from https://cloud.nan.builders/tokens (behind
# login, accessed 2026-11-10): 7 input / 0.14 cached / 14 output. Converted at the
# 1,000-credit pack list price (26 EUR) x 1.08, the EUR->USD factor the page
# itself uses: 0.02808 USD per credit. Larger packs and the subscriber discount
# are cheaper.
# NaN reasoning table (checked 2026-11-10): none turns reasoning off; low,
# medium, high, max (minimal is applied as low, xhigh as max).
# https://nan.builders/docs/models#controlling-reasoning
schema = 2
base_model = "xiaomi/mimo-v2.6-flash"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "audio/mpeg", "audio/wav", "audio/flac", "audio/mp4", "audio/ogg"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"] }
cache = { implicit = true }

[cost.text.input]
price = 0.19656
cache = { read = 0.0039312 }

[cost.text.output]
price = 0.39312
