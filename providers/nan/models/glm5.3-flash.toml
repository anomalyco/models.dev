# Source: https://nan.builders/docs/models (accessed 2026-11-10)
# 320B-18B MoE, FP8, natively multimodal. 1M token context; output budgets above
# 131072 are lowered to 131072. MIT license. Input is text and image on this
# host: no video or PDF.
# Pricing: credits per 1M tokens from https://cloud.nan.builders/tokens (behind
# login, accessed 2026-11-10): 5.25 input / 1.05 cached / 17.50 output. Converted
# at the 1,000-credit pack list price (26 EUR) x 1.08, the EUR->USD factor the
# page itself uses: 0.02808 USD per credit. Larger packs and the subscriber
# discount are cheaper.
# Cache: the price page lists a Cached input rate for this model, so prompt
# caching is implicit; NaN documents no cache_control markers. Cached reads are
# billed at 1.05 credits per 1M.
# Reasoning: NaN's table for glm5.3-flash says "Not possible: GLM always reasons.
# none is applied as minimal, its shortest reasoning (a few tokens). minimal to
# max; higher values reason longer before answering." So no toggle, and the
# documented levels are kept over the lab's narrower set.
# https://nan.builders/docs/models#controlling-reasoning
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.14742
cache = { read = 0.029484 }

[cost.text.output]
price = 0.4914
