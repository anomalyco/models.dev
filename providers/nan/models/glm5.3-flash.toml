# Source: https://nan.builders/docs/models (accessed 2026-09-11)
# 320B-18B MoE, FP8, natively multimodal. 1M token context. 2B token monthly
# quota per member. MIT license. Input is text and image on this host: no video
# or PDF. Included in the membership, so no per-token price.
# NaN reasoning table (checked 2026-10-21): reasoning_effort values none, minimal, low, medium,
# high, xhigh, max; https://nan.builders/docs/models#controlling-reasoning
# Update: GLM always reasons; none is applied as minimal, its shortest level, so no toggle.
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 0

[cost.text.output]
price = 0
