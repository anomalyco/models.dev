# Source: https://nan.builders/docs/models (accessed 2026-09-11)
# NaN documents this id as the Vision-Exp variant, but the endpoint serves
# DeepSeek V4.1 Flash. Evidence (2026-09-11): forced-choice self-identification
# with randomized option order returned deepseek/deepseek-v4.1-flash 8/8; the id
# deepseek-v4.1-flash is not directly callable here (401) while deepseek-v4-flash
# is, matching DeepSeek's own legacy alias
# (providers/deepseek/models/deepseek-v4-flash.toml). The model takes images
# (text+image), consistent with V4.1 Flash; NaN serves open-weight models, which
# V4.1 Flash is (MIT) and the experimental Vision-Exp entry is not.
# 1M token context, 3B token monthly quota per member, 1.5M tpm. Included in the
# membership, so no per-token price.
# NaN reasoning table (checked 2026-10-21): reasoning_effort values none, minimal, low, medium,
# high, xhigh, max; https://nan.builders/docs/models#controlling-reasoning
# Update: none now turns reasoning off and minimal..max steer its depth (hints, not caps).
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 0

[cost.text.output]
price = 0
