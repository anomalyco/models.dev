# Source: https://nan.builders/docs/models (accessed 2026-11-10)
# NaN keeps the deepseek-v4-flash id but serves DeepSeek V4.1 Flash: the
# 2026-09-11 live check self-identified it as V4.1 Flash, and NaN's portal now
# names the model "DeepSeek V4-Flash (4.1-1017 version)"
# (https://cloud.nan.builders/tokens, accessed 2026-11-10), so it points at the
# 1017 update. Text + image input, 1M context; output budgets above 393216 are
# lowered to 393216.
# Pricing: credits per 1M tokens from https://cloud.nan.builders/tokens (behind
# login, accessed 2026-11-10): 10.50 input / 0.21 cached / 42 output. Converted at
# the 1,000-credit pack list price (26 EUR) x 1.08, the EUR->USD factor the page
# itself uses: 0.02808 USD per credit. Larger packs and the subscriber discount
# are cheaper.
# NaN reasoning table (checked 2026-11-10): none turns reasoning off and
# minimal..max steer its depth (hints, not caps);
# https://nan.builders/docs/models#controlling-reasoning
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.29484
cache = { read = 0.0058968 }

[cost.text.output]
price = 1.17936
