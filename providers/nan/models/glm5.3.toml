# Source: https://nan.builders/docs/models (accessed 2026-09-11)
# ~753B MoE, FP8, sparse attention, text only: it does not take images.
# Premium tier: callable only with a key on the GLM 5.3 premium membership.
# 1M token context, 3,000M token quota per billing period, capped at 400M tokens
# per rolling 4h window, 5 concurrent requests. Included in the tier, so no
# per-token price.
# Effort: reasoning_effort = low|medium|high|max. NaN's reasoning table ("the
# table is the contract", accessed 2026-09-28) lists glm5.3 and glm5.3-flash as
# "Fully controllable"; max is the deepest. No off value, so no toggle.
base_model = "zhipuai/glm-5.3"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "max"] }]

[cost]
input = 0
output = 0
