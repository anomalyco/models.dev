# Source: https://nan.builders/docs/models (accessed 2026-11-10)
# ~753B MoE, NVFP4, sparse attention. The docs list text, image, audio and video
# input; modalities stay text-only like the lab until the host documents the
# formats. 1M token context. "Larger model" tier, also capped at 400M tokens per
# rolling 4h window.
# Pricing: credits per 1M tokens from https://cloud.nan.builders/tokens (behind
# login, accessed 2026-11-10): 49 input / 1.05 cached / 154 output. Converted at
# the 1,000-credit pack list price (26 EUR) x 1.08, the EUR->USD factor the page
# itself uses: 0.02808 USD per credit. Larger packs and the subscriber discount
# are cheaper.
# Cache: the price page lists a Cached input rate for this model, so prompt
# caching is implicit; NaN documents no cache_control markers. Cached reads are
# billed at 1.05 credits per 1M.
# Reasoning: NaN's table for glm5.3 says "Not possible: GLM always reasons. none
# is applied as minimal, its shortest reasoning (a few tokens). minimal to max;
# higher values reason longer before answering." So no toggle, and the documented
# levels are kept over the lab's narrower set.
# https://nan.builders/docs/models#controlling-reasoning
schema = 2
base_model = "zhipuai/glm-5.3"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 1.37592
cache = { read = 0.029484 }

[cost.text.output]
price = 4.32432
