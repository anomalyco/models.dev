# Source: https://nan.builders/docs/models (accessed 2026-09-11)
# 310B-15B MoE, FP8, natively omnimodal with dedicated vision and audio encoders.
# 1M token context, 1.0B token monthly quota per member, 1.5M tpm. MIT license.
# Input is text, image and audio on this host: no video. Included in the
# membership, so no per-token price.
# Reasoning: no caller control on this surface. NaN lists a reasoning mode
# (recommends max_tokens >= 300) but exposes no request field for it.
base_model = "xiaomi/mimo-v2.5"
reasoning_options = []

[cost]
input = 0
output = 0

[modalities]
input = ["text", "image", "audio"]
