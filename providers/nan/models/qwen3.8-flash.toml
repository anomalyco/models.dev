# Source: https://nan.builders/docs/models (accessed 2026-09-11)
# 125B-6B MoE, multimodal with vision, 262K token context (the model's native
# window), 500M token monthly quota per member. qwen-community-1.0 license.
# Included in the membership, so no per-token price.
# Reasoning: on by default, with no caller control on this surface. NaN exposes
# no request field to disable it.
schema = 2
base_model = "alibaba/qwen3.8-flash"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true

[limit]
context = 262_144

[cost.text.input]
price = 0

[cost.text.output]
price = 0
