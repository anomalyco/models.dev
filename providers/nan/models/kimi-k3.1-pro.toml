# Source: https://nan.builders/docs/models (accessed 2026-11-10)
# Relayed from an external provider. Text + image input on this host (no video
# listed), 1M context and 1M max answer. "Larger model" tier.
# Pricing: credits per 1M tokens from https://cloud.nan.builders/tokens (behind
# login, accessed 2026-11-10): 100 input / 10 cached / 100 cache write / 500
# output. Converted at the 1,000-credit pack list price (26 EUR) x 1.08, the
# EUR->USD factor the page itself uses: 0.02808 USD per credit. Larger packs and
# the subscriber discount are cheaper.
# Effort: reasoning_effort only. NaN does not map the thinking/enable_thinking
# aliases on this model and leaves the levels out of its contract, so the lab's
# low|high|max are recorded (K3.1 Pro always reasons).
# https://nan.builders/docs/models#controlling-reasoning
schema = 2
base_model = "moonshotai/kimi-k3.1-pro"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
cache = { implicit = true }

[limit]
output = 1_048_576

[cost.text.input]
price = 2.808
cache = { read = 0.2808, write = 2.808 }

[cost.text.output]
price = 14.04
