# NaN is a builders community that shares dedicated GPUs to serve open-weight models,
# plus a few larger models relayed from external providers. OpenAI-compatible API
# at https://api.nan.builders/v1.
# Billing: memberships include a pool of credits per billing period (nan_member
# 70 EUR/month: 7,000 credits; Premium 200 EUR/month: 20,000), shared by every
# model marked "credits"; each request draws credits by the model's price per
# token. Credit packs are sold on top. gemma4 and qwen3.6 draw no credits.
# Per-model credit rates: https://cloud.nan.builders/tokens (behind login).
# Rate limits: 60 rpm per key; 7 (base) / 10 (premium) concurrent requests.
# https://nan.builders/docs/getting-started
# https://nan.builders/docs/choose-a-model (accessed 2026-11-10)
name = "NaN"
env = ["NAN_API_KEY"]
npm = "@ai-sdk/openai-compatible"
opencodeai = "@opencode/ai/providers/openai-compatible"
api = "https://api.nan.builders/v1"
doc = "https://nan.builders/docs/models"
