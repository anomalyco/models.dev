# v2 capabilities and prices:
# - https://ai.google.dev/gemini-api/docs/image-understanding (and /audio, /video-understanding)
# - https://generativelanguage.googleapis.com/v1beta/models (topP/topK per model)
# Image output formats: https://ai.google.dev/gemini-api/docs/image-generation (response_format mime_type image/png or image/jpeg).
# Grounding with Google Search: $14 per 1,000 search queries (each query the model runs is billed). Price: https://ai.google.dev/gemini-api/docs/pricing#pricing-for-tools ("Gemini 3 and newer models"); support ("Search grounding: Supported"): https://ai.google.dev/gemini-api/docs/models/gemini-3.1-flash-image-preview
# Interactions API: https://ai.google.dev/gemini-api/docs/interactions-overview (confirmed live 2026-10-22). OpenCode's google/interactions reads text output only.
schema = 2
type = "image"
name = "Nano Banana 2"
description = "Image model for prompt-driven generation, editing, and visual design workflows"
family = "gemini-flash"
open_weights = false
knowledge = "2025-01"
release_date = "2026-02-26"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "application/pdf"]
output = ["text", "image/png", "image/jpeg"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true, effort = ["minimal", "high"] }
temperature = true
top_p = true
top_k = true

[limit]
context = 65_536
output = 65_536

[api.images]
sdk = { opencodeai = "@opencode/ai/providers/google/images" }

[api.generate-content]

[api.interactions]
sdk = { opencodeai = "none" }

[cost.text.input]
price = 0.5

[cost.text.output]
price = 60

[cost.web_search]
price = 14
