# Sources:
# - https://ai.google.dev/gemini-api/docs/models/gemini-robotics-er-2-streaming-preview
# - https://ai.google.dev/gemini-api/docs/pricing
# - Introductory rates through 2026-12-31 double from 2027-01-01.
# Mid-conversation updates: https://ai.google.dev/api/caching#Content (role is "user" or "model");
# systemInstruction, thinking config and tools are request-level in generateContent and Interactions.
schema = 2
v2_only = true
base_model = "google/gemini-robotics-er-2-streaming-preview"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
structured_output = false
cache = { supported = false }
system_updates = false
effort_updates = false

[api.realtime]
sdk = { opencodeai = "none" }

[cost.text.input]
price = 1

[cost.text.output]
price = 5

[[cost.multipliers]]
when = { date = { gte = "2027-01-01" } }
factor = 2
