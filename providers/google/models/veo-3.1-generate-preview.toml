name = "Veo 3.1 Preview"
description = "Video model for prompt-guided generation, editing, and motion workflows"
family = "veo"
release_date = "2025-10-15"
last_updated = "2026-01"
attachment = true
reasoning = false
temperature = false
tool_call = false
open_weights = false
