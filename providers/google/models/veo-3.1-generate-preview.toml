# Sources:
# - https://ai.google.dev/gemini-api/docs/models/veo-3.1-generate-preview (model card: id, modalities, limits, last update)
# - https://ai.google.dev/gemini-api/docs/veo (Veo 3.1 Preview capabilities; status Preview)
# - https://ai.google.dev/gemini-api/docs/pricing (Veo 3.1 Standard video with audio: $0.40/s 720p/1080p, $0.60/s 4k; v2 cost only)
# - https://developers.googleblog.com/introducing-veo-3-1-and-new-creative-capabilities-in-the-gemini-api (release 2025-10-15)
schema = 2
base_model = "google/veo-3.1-generate-preview"
name = "Veo 3.1"
status = "beta"

[limit]
context = 480
output = 8_192

[api.videos]
sdk = { opencodeai = "@opencode/ai/protocols/google-video" }

[cost.video.output]
unit = "second"
price = 0.4

[[cost.video.output.overrides]]
when = { resolution = { equals = "4k" } }
price = 0.6
