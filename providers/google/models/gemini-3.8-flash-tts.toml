# Sources:
# - https://ai.google.dev/gemini-api/docs/models/gemini-3.8-flash-tts
# - https://ai.google.dev/gemini-api/docs/pricing
# - https://ai.google.dev/gemini-api/docs/flex-inference
# - Text input $0.50 and audio output $9 through 2026-12-31, doubling from 2027-01-01.
# - Priority is 1.8x and Flex 0.5x Standard.
schema = 2
v2_only = true
base_model = "google/gemini-3.8-flash-tts"

[capabilities]
structured_output = false
cache = { supported = false }
service_tier = ["flex", "priority"]

[api.speech]
sdk = { opencodeai = "@opencode/ai/protocols/google-speech" }

[cost.text.input]
price = 0.5

[cost.text.output]
price = 9

[cost.audio.output]
price = 9

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.8

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.5

[[cost.multipliers]]
when = { date = { gte = "2027-01-01" } }
factor = 2
