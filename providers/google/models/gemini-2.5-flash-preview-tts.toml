# v2 capabilities and prices:
# - https://ai.google.dev/gemini-api/docs/models/gemini-2.5-flash-preview-tts
# - https://ai.google.dev/gemini-api/docs/speech-generation (audio/l16 default output)
# - https://generativelanguage.googleapis.com/v1beta/models (topP/topK per model)
schema = 2
name = "Gemini 2.5 Flash Preview TTS"
description = "Speech generation model for controllable voice, narration, and audio delivery"
family = "gemini-flash"
open_weights = false
knowledge = "2025-01"
release_date = "2025-05-01"

[modalities]
input = ["text"]
output = ["audio/l16"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true
cache = { supported = false }

[limit]
context = 8_192
output = 16_384

[cost.text.input]
price = 0.5

[cost.text.output]
price = 10
