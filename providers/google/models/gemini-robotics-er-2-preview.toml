# Sources:
# - https://ai.google.dev/gemini-api/docs/models/gemini-robotics-er-2-preview
# - https://ai.google.dev/gemini-api/docs/pricing
# - https://ai.google.dev/gemini-api/docs/thinking (default high)
# - https://ai.google.dev/gemini-api/docs/generate-content/caching
# - Introductory rates through 2026-12-31 double from 2027-01-01 (cache storage too).
# Mid-conversation updates: https://ai.google.dev/api/caching#Content (role is "user" or "model");
# systemInstruction, thinking config and tools are request-level in generateContent and Interactions.
# Grounding with Google Search: $14 per 1,000 search queries (each query the model runs is billed). Price: https://ai.google.dev/gemini-api/docs/pricing#gemini-robotics-er-2; support ("Search grounding: Supported"): https://ai.google.dev/gemini-api/docs/models/gemini-robotics-er-2-preview
# Token-only multipliers (object factor, so cost.web_search is unscaled): Grounding keeps its price under Priority, Flex and the scheduled increases (https://ai.google.dev/gemini-api/docs/pricing).
# APIs: generateContent, the OpenAI-compatible Chat Completions endpoint (https://ai.google.dev/gemini-api/docs/openai) and Interactions (https://ai.google.dev/gemini-api/docs/interactions-overview); Chat Completions and Interactions confirmed live 2026-10-22.
# tools.strict/choice: functionCallingConfig modes AUTO, ANY, NONE and VALIDATED (constrained decoding of function calls, which strict tools map to); ANY with one allowedFunctionNames entry forces that tool: https://ai.google.dev/api/caching#FunctionCallingConfig, https://ai.google.dev/gemini-api/docs/function-calling#function_calling_modes (Interactions tool_choice has the same modes). Chat Completions accepted tool_choice required/named and strict tools live on Gemini 3.8 Flash 2026-10-24.
# tools: ANY with allowedFunctionNames, VALIDATED and NONE also verified live on this model 2026-10-24.
schema = 2
v2_only = true
base_model = "google/gemini-robotics-er-2-preview"

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, default = { type = "effort", value = "high" }, effort = ["minimal", "low", "medium", "high"] }
structured_output = true
cache = { implicit = true, explicit = true }

[api.generate-content]

[api.chat-completions]
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible" }

[api.interactions]
sdk = { opencodeai = "@opencode/ai/providers/google/interactions" }

[cost.text.input]
price = 1
cache = { read = 0.1, storage = 0.5 }

[cost.text.output]
price = 5

[cost.web_search]
price = 14

[[cost.multipliers]]
when = { date = { gte = "2027-01-01" } }
factor = { text = 2 }
