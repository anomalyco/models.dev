# Alias for the current Gemini Flash-Lite release (gemini-3.5-flash-lite).
# Keep reasoning_options and cost in sync with gemini-3.5-flash-lite.
schema = 2
name = "Gemini Flash-Lite Latest"
description = "Fast Gemini model balancing multimodal reasoning, tool use, and cost"
family = "gemini-flash-lite"
open_weights = false
knowledge = "2026-03"
release_date = "2026-07-21"

[modalities]
input = ["text", "image", "video", "audio", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true
temperature = true

[limit]
context = 1_048_576
output = 65_536

[cost.text.input]
price = 0.3
cache = { read = 0.03 }

[cost.text.output]
price = 2.5
