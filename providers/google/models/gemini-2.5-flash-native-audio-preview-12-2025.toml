# Sources:
# - https://ai.google.dev/gemini-api/docs/models/gemini-2.5-flash-native-audio-preview-12-2025
# - https://ai.google.dev/gemini-api/docs/pricing
# Mid-conversation updates: https://ai.google.dev/api/caching#Content (role is "user" or "model");
# systemInstruction, thinking config and tools are request-level in generateContent and Interactions.
schema = 2
v2_only = true
base_model = "google/gemini-2.5-flash-native-audio-preview-12-2025"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
structured_output = false
cache = { supported = false }
system_updates = false
effort_updates = false

[api.bidi-generate-content]
sdk = { opencodeai = "none" }

[cost.text.input]
price = 0.5

[cost.text.output]
price = 2

[cost.audio.input]
price = 3

[cost.audio.output]
price = 12

[cost.video.input]
price = 3
