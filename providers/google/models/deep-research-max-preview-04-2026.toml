# Sources:
# - https://ai.google.dev/gemini-api/docs/models/deep-research-max-preview-04-2026
#   (modalities, context 1_048_576, output 65_536, preview ID, April 2026 update)
# - https://ai.google.dev/gemini-api/docs/deep-research
#   (agent role, tool use / MCP, pay-as-you-go on underlying Gemini rates)
# - https://ai.google.dev/gemini-api/docs/pricing
#   (Deep Research Agent billed at standard Gemini list rates; Gemini 3.1 Pro
#    $2/$12 per 1M in/out <=200k, $4/$18 >200k; cache_read $0.20/$0.40)
# - https://ai.google.dev/gemini-api/docs/changelog
#   (released 2026-04-21)
# - https://blog.google/innovation-and-ai/models-and-research/gemini-models/next-generation-gemini-deep-research/
#   (built on Gemini 3.1 Pro; Max = maximum comprehensiveness)
# v2 capabilities and prices:
# - https://ai.google.dev/gemini-api/docs/caching (Interactions API: implicit caching only)
# Mid-conversation updates: https://ai.google.dev/api/caching#Content (role is "user" or "model");
# systemInstruction, thinking config and tools are request-level in generateContent and Interactions.
schema = 2
base_model = "google/deep-research-max-preview-04-2026"
name = "Deep Research Max Preview (Apr-21-2026)"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
temperature = true
cache = { supported = true, implicit = true, explicit = false }
system_updates = false
effort_updates = false

[limit]
context = 131_072

[cost.text.input]
price = 2
cache = { read = 0.2 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 4
cache = { read = 0.4 }

[cost.text.output]
price = 12

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 18
