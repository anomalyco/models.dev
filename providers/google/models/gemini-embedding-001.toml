# v2 capabilities and prices:
# - https://generativelanguage.googleapis.com/v1beta/models (topP/topK per model)
# APIs: embedContent, and /embeddings on the OpenAI-compatible endpoint (https://ai.google.dev/gemini-api/docs/openai#embeddings, confirmed live 2026-10-22).
schema = 2
type = "embedding"
name = "Gemini Embedding 001"
description = "Embedding model for semantic search, retrieval, clustering, and ranking pipelines"
family = "gemini"
open_weights = false
knowledge = "2025-05"
release_date = "2025-05-20"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 2_048
output = 1

[api.embed-content]
sdk = { opencodeai = "none" }

[api.embeddings]
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "none" }

[cost.text.input]
price = 0.15

[cost.text.output]
price = 0
