# Grounding with Google Search: $14 per 1,000 search queries (each query the model runs is billed). Price: https://ai.google.dev/gemini-api/docs/pricing#pricing-for-tools ("Gemini 3 and newer models"); support ("Search grounding: Supported"): https://ai.google.dev/gemini-api/docs/models/gemini-3-pro-image-preview
# Interactions API: https://ai.google.dev/gemini-api/docs/interactions-overview (confirmed live 2026-10-22). OpenCode's google/interactions reads text output only.
schema = 2
base_model = "google/gemini-3-pro-image-preview"
name = "Nano Banana Pro"

[capabilities]
reasoning = { supported = true }

[limit]
context = 131_072

[api.images]
sdk = { opencodeai = "@opencode/ai/providers/google/images" }

[api.generate-content]

[api.interactions]
sdk = { opencodeai = "none" }

[cost.text.input]
price = 2

[cost.text.output]
price = 120

[cost.web_search]
price = 14
