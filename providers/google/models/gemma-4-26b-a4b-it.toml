# v2 capabilities and prices:
# - https://generativelanguage.googleapis.com/v1beta/models (topP/topK per model)
# Mid-conversation updates: https://ai.google.dev/api/caching#Content (role is "user" or "model");
# systemInstruction, thinking config and tools are request-level in generateContent and Interactions.
# Image MIME types: https://ai.google.dev/gemini-api/docs/image-understanding (Supported image formats: image/png, image/jpeg, image/webp, image/heic, image/heif)
schema = 2
name = "Gemma 4 26B A4B IT"
description = "Open Gemma instruction model for efficient chat and self-hosted deployments"
family = "gemma"
open_weights = true
release_date = "2026-04-02"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true }
structured_output = true
temperature = true
top_p = true
top_k = true
system_updates = false
effort_updates = false

[limit]
context = 262_144
output = 32_768
