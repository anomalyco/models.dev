schema = 2
base_model = "google/deep-research-preview-04-2026"
name = "Deep Research Preview (Apr-21-2026)"

[capabilities]
reasoning = { supported = true }
temperature = true

[limit]
context = 131_072

[cost.text.input]
price = 2
cache = { read = 0.2 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 4
cache = { read = 0.4 }

[cost.text.output]
price = 12

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 18
