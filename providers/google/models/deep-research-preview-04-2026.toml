# Sources:
# - https://ai.google.dev/gemini-api/docs/models/deep-research-preview-04-2026
# - https://ai.google.dev/gemini-api/docs/deep-research
# - https://blog.google/innovation-and-ai/models-and-research/gemini-models/next-generation-gemini-deep-research/
# - https://ai.google.dev/gemini-api/docs/pricing (Gemini 3.1 Pro rates; agent bills underlying model usage)
# v2 capabilities and prices:
# - https://ai.google.dev/gemini-api/docs/caching (Interactions API: implicit caching only)
# Mid-conversation updates: https://ai.google.dev/api/caching#Content (role is "user" or "model");
# systemInstruction, thinking config and tools are request-level in generateContent and Interactions.
schema = 2
base_model = "google/deep-research-preview-04-2026"
name = "Deep Research Preview (Apr-21-2026)"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
temperature = true
cache = { implicit = true }
system_updates = false
effort_updates = false

[limit]
context = 131_072

[api.interactions]
sdk = { opencodeai = "@opencode/ai/providers/google/interactions" }

[cost.text.input]
price = 2
cache = { read = 0.2 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 4
cache = { read = 0.4 }

[cost.text.output]
price = 12

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 18
