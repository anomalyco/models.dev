# Sources:
# - https://ai.google.dev/gemini-api/docs/pricing (Gemini 3.5 Live Translate: $3.50 input / $21.00 output per 1M audio tokens)
# - https://ai.google.dev/gemini-api/docs/models/gemini-3.5-live-translate-preview
# - https://ai.google.dev/gemini-api/docs/live-api/live-translate
# - https://deepmind.google/models/model-cards/gemini-3-5-audio/
# - https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-live-3-5-translate/
schema = 2
base_model = "google/gemini-3.5-live-translate-preview"

[capabilities]
temperature = true
cache = { supported = false }

[limit]
context = 16_384
output = 32_768

[api.bidi-generate-content]
sdk = { opencodeai = "none" }

[cost.text.input]
price = 3.5

[cost.text.output]
price = 21

[cost.audio.input]
price = 3.5

[cost.audio.output]
price = 21
