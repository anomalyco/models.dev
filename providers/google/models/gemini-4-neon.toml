# Sources:
# - https://ai.google.dev/gemini-api/docs/pricing#gemini-4-neon
# - https://ai.google.dev/gemini-api/docs/models/gemini-4-neon
# - https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-neon/
# Flat pricing across the whole context window, no introductory discount or scheduled increase. Only implicit caching is supported (explicit caching is not).
# v2 capabilities and prices:
# - https://ai.google.dev/gemini-api/docs/generate-content/caching
# - https://ai.google.dev/gemini-api/docs/flex-inference
# - https://ai.google.dev/gemini-api/docs/priority-inference
# - https://ai.google.dev/gemini-api/docs/thinking
# Flex is 0.5x ($1.50/$7.50/$0.075) and Priority 1.8x ($5.40/$27.00/$0.27) Standard per the pricing page. Batch is 0.5x too (not modelled).
# Mid-conversation updates: https://ai.google.dev/api/caching#Content (role is "user" or "model");
# systemInstruction, thinking config and tools are request-level in generateContent and Interactions.
# Grounding with Google Search: $14 per 1,000 search queries (each query the model runs is billed). Price: https://ai.google.dev/gemini-api/docs/pricing#gemini-4-neon; support ("Search grounding: Supported"): https://ai.google.dev/gemini-api/docs/models/gemini-4-neon
# Token-only multipliers (object factor, so cost.web_search is unscaled): Grounding keeps its price under Priority and Flex (https://ai.google.dev/gemini-api/docs/pricing).
# APIs: generateContent, the OpenAI-compatible Chat Completions endpoint (https://ai.google.dev/gemini-api/docs/openai) and Interactions (https://ai.google.dev/gemini-api/docs/interactions-overview), as for the other Gemini 4 models. Neon's thinking levels are low|medium|high|xhigh, high default (https://ai.google.dev/gemini-api/docs/whats-new-gemini-4-neon). Neon isn't on the Free tier.
# tools.strict/choice: functionCallingConfig modes AUTO, ANY, NONE and VALIDATED (constrained decoding of function calls, which strict tools map to); ANY with one allowedFunctionNames entry forces that tool: https://ai.google.dev/api/caching#FunctionCallingConfig, https://ai.google.dev/gemini-api/docs/function-calling#function_calling_modes (Interactions tool_choice has the same modes). Chat Completions accepted tool_choice required/named and strict tools live on Gemini 3.8 Flash 2026-10-24.
# recommended_api: Google recommends Interactions for all new projects and lists this model as supported: https://ai.google.dev/gemini-api/docs/interactions-overview#supported-models-agents
schema = 2
base_model = "google/gemini-4-neon"
recommended_api = "interactions"

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, default = { type = "effort", value = "high" }, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
cache = { implicit = { min_tokens = 4_096 } }
service_tier = ["flex", "priority"]
temperature = true

[api.generate-content]

[api.chat-completions]
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible" }

[api.interactions]
sdk = { opencodeai = "@opencode/ai/providers/google/interactions" }

[cost.text.input]
price = 3
cache = { read = 0.15 }

[cost.text.output]
price = 15

[cost.audio.input]
price = 3
cache = { read = 0.15 }

[cost.web_search]
price = 14

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = { text = 1.8, audio = 1.8 }

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = { text = 0.5, audio = 0.5 }
