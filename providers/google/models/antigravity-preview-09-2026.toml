# Sources:
# - https://ai.google.dev/gemini-api/docs/models/antigravity-preview-09-2026 (Interactions API agent code)
# - https://ai.google.dev/gemini-api/docs/antigravity-agent (no structured outputs; no thinking control, only
#   agent_config.max_total_tokens; default model gemini-3.8-flash, configurable through agent_config.model)
# - https://ai.google.dev/gemini-api/docs/pricing (managed agents: model inference at standard Gemini list rates;
#   sandbox compute not billed during preview)
# - https://ai.google.dev/gemini-api/docs/caching (Interactions API: implicit caching only)
# Cost is the default model's (gemini-3.8-flash), including its 2027-01-01 doubling; another agent_config.model
# bills at that model's rates.
# Mid-conversation updates: https://ai.google.dev/api/caching#Content (role is "user" or "model");
# systemInstruction, thinking config and tools are request-level in generateContent and Interactions.
schema = 2
v2_only = true
base_model = "google/antigravity-preview-09-2026"
name = "Antigravity Agent Preview"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
structured_output = false
cache = { supported = true, implicit = true, explicit = false }
system_updates = false
effort_updates = false

[api.interactions]

[cost.text.input]
price = 0.75
cache = { read = 0.075 }

[cost.text.output]
price = 3.75

[[cost.multipliers]]
when = { date = { gte = "2027-01-01" } }
factor = 2
