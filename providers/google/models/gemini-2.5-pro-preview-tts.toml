# Output limit: capped at the 8,192 context; no host cap is documented and the 16,384 from the base model or host listing is larger.
# v2 capabilities and prices:
# - https://ai.google.dev/gemini-api/docs/models/gemini-2.5-pro-preview-tts
# - https://ai.google.dev/gemini-api/docs/speech-generation (audio/l16 default output)
# - https://generativelanguage.googleapis.com/v1beta/models (topP/topK per model)
schema = 2
type = "speech"
name = "Gemini 2.5 Pro Preview TTS"
description = "Speech generation model for controllable voice, narration, and audio delivery"
family = "gemini-flash"
open_weights = false
knowledge = "2025-01"
release_date = "2025-05-01"

[modalities]
input = ["text"]
output = ["audio/l16"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true
cache = false

[limit]
context = 8_192
output = 8_192

[api.speech]
sdk = { opencodeai = "@opencode/ai/protocols/google-speech" }

[cost.text.input]
price = 1

[cost.text.output]
price = 20
