schema = 2
name = "Gemini 2.5 Flash-Lite"
description = "Lean Gemini 2.5 lane for cheap multimodal traffic and quick agents"
family = "gemini-flash-lite"
open_weights = false
knowledge = "2025-01"
release_date = "2025-06-17"

[modalities]
input = ["text", "image", "audio", "video", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true, budget = { min = 512, max = 24_576 } }
structured_output = true
temperature = true

[limit]
context = 1_048_576
output = 65_536

[cost.text.input]
price = 0.1
cache = { read = 0.01 }

[cost.text.output]
price = 0.4

[cost.audio.input]
price = 0.3
