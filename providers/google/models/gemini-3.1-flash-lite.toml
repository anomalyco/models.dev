# v2 capabilities and prices:
# - https://ai.google.dev/gemini-api/docs/models/gemini-3.1-flash-lite
# - https://ai.google.dev/gemini-api/docs/pricing
# - https://ai.google.dev/gemini-api/docs/generate-content/caching
# - https://ai.google.dev/gemini-api/docs/flex-inference
# - https://ai.google.dev/gemini-api/docs/priority-inference
# - https://ai.google.dev/gemini-api/docs/image-understanding (and /audio, /video-understanding)
# - https://generativelanguage.googleapis.com/v1beta/models (topP/topK per model)
# Mid-conversation updates: https://ai.google.dev/api/caching#Content (role is "user" or "model");
# systemInstruction, thinking config and tools are request-level in generateContent and Interactions.
# Grounding with Google Search: $14 per 1,000 search queries (each query the model runs is billed). Price: https://ai.google.dev/gemini-api/docs/pricing#gemini-3.1-flash-lite; support ("Search grounding: Supported"): https://ai.google.dev/gemini-api/docs/models/gemini-3.1-flash-lite
# Token-only multipliers (object factor, so cost.web_search is unscaled): Grounding keeps its price under Priority, Flex and the scheduled increases (https://ai.google.dev/gemini-api/docs/pricing).
# APIs: generateContent, the OpenAI-compatible Chat Completions endpoint (https://ai.google.dev/gemini-api/docs/openai) and Interactions (https://ai.google.dev/gemini-api/docs/interactions-overview); Chat Completions and Interactions confirmed live 2026-10-22.
schema = 2
name = "Gemini 3.1 Flash Lite"
description = "Low-latency Gemini model for high-volume multimodal and agent workloads"
family = "gemini-flash-lite"
open_weights = false
knowledge = "2025-01"
release_date = "2026-05-07"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "video/mp4", "video/mpeg", "video/mov", "video/avi", "video/x-flv", "video/mpg", "video/webm", "video/wmv", "video/3gpp", "audio/wav", "audio/mp3", "audio/aiff", "audio/aac", "audio/ogg", "audio/flac", "audio/mpeg", "audio/m4a", "audio/l16", "audio/opus", "audio/alaw", "audio/mulaw", "audio/webm", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true
temperature = true
top_p = true
top_k = true
cache = { implicit = true, explicit = true }
service_tier = ["flex", "priority"]
system_updates = false
effort_updates = false

[limit]
context = 1_048_576
output = 65_536

[api.generate-content]

[api.chat-completions]
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible" }

[api.interactions]
sdk = { opencodeai = "@opencode/ai/providers/google/interactions" }

[cost.text.input]
price = 0.25
cache = { read = 0.025, storage = 1 }

[cost.text.output]
price = 1.5

[cost.audio.input]
price = 0.5
cache = { read = 0.05, storage = 1 }

[cost.web_search]
price = 14

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = { text = 1.8, audio = 1.8 }

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = { text = 0.5, audio = 0.5 }
