# Sources (accessed 2026-11-20):
# - https://ai.google.dev/gemini-api/docs/models/genie-4
# - https://ai.google.dev/gemini-api/docs/pricing#genie-4 (paid tier only: $1.50 per 1M input tokens for text and the
#   reference image; $9.00 per 1M text output tokens; $17.50 per 1M video output tokens with audio included, 240 tokens
#   per frame at 24 fps, about $0.10 per second; no Free tier, Batch, Flex or Priority)
# APIs: the Interactions API (https://ai.google.dev/gemini-api/docs/genie), over WebRTC or WebSocket. @opencode/ai has no
#   Genie client, so the table names none.
schema = 2
v2_only = true
base_model = "google/genie-4"

[limit]
context = 1_048_576
output = 65_536

[api.interactions]
sdk = { opencodeai = "none" }

[cost.text.input]
price = 1.5

[cost.text.output]
price = 9

[cost.image.input]
price = 1.5

[cost.video.output]
price = 17.5
