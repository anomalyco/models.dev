# Sources:
# - https://ai.google.dev/gemini-api/docs/models/gemini-embedding-2
#   Model ID gemini-embedding-2; input text/image/video/audio/PDF; input limit 8192;
#   output dims 128-3072; stable; latest update April 2026
# - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/embedding-2
#   GA release 2026-04-22; knowledge cutoff November 2025; multimodal inputs
# - https://ai.google.dev/gemini-api/docs/pricing
#   Paid standard: text $0.20, image $0.45, audio $6.50, video $12.00 per 1M tokens
#   (catalog cost.input uses text rate; cost.input_audio uses audio rate)
# APIs: embedContent, and /embeddings on the OpenAI-compatible endpoint (https://ai.google.dev/gemini-api/docs/openai#embeddings, confirmed live 2026-10-22).
schema = 2
base_model = "google/gemini-embedding-2"

[limit]
output = 1

[api.embed-content]
sdk = { opencodeai = "none" }

[api.embeddings]
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "none" }

[cost.text.input]
price = 0.2

[cost.text.output]
price = 0

[cost.audio.input]
price = 6.5

[cost.image.input]
price = 0.45

[cost.video.input]
price = 12
