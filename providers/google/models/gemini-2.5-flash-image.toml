# v2 capabilities and prices:
# - https://ai.google.dev/gemini-api/docs/pricing
# Interactions API: https://ai.google.dev/gemini-api/docs/interactions-overview (confirmed live 2026-10-22). OpenCode's google/interactions reads text output only.
schema = 2
base_model = "google/gemini-2.5-flash-image"

[api.images]
sdk = { opencodeai = "@opencode/ai/providers/google/images" }

[api.generate-content]

[api.interactions]
sdk = { opencodeai = "none" }

[cost.text.input]
price = 0.3
cache = { read = 0.075 }

[cost.text.output]
price = 30

[cost.image.output]
price = 30
