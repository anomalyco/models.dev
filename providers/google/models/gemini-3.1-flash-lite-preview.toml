# v2 capabilities and prices:
# - https://ai.google.dev/gemini-api/docs/models/gemini-3.1-flash-lite-preview
# - https://ai.google.dev/gemini-api/docs/image-understanding (and /audio, /video-understanding)
# - https://generativelanguage.googleapis.com/v1beta/models (topP/topK per model)
# Mid-conversation updates: https://ai.google.dev/api/caching#Content (role is "user" or "model");
# systemInstruction, thinking config and tools are request-level in generateContent and Interactions.
# Grounding with Google Search: $14 per 1,000 search queries (each query the model runs is billed). Price: https://ai.google.dev/gemini-api/docs/pricing#pricing-for-tools ("Gemini 3 and newer models"); support ("Search grounding: Supported"): https://ai.google.dev/gemini-api/docs/models/gemini-3.1-flash-lite-preview
# APIs: generateContent, the OpenAI-compatible Chat Completions endpoint (https://ai.google.dev/gemini-api/docs/openai) and Interactions (https://ai.google.dev/gemini-api/docs/interactions-overview); Chat Completions and Interactions confirmed live 2026-10-22.
schema = 2
name = "Gemini 3.1 Flash Lite Preview"
description = "Legacy model retained for compatibility with older integrations"
family = "gemini-flash-lite"
open_weights = false
knowledge = "2025-01"
release_date = "2026-03-03"
status = "deprecated"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "video/mp4", "video/mpeg", "video/mov", "video/avi", "video/x-flv", "video/mpg", "video/webm", "video/wmv", "video/3gpp", "audio/wav", "audio/mp3", "audio/aiff", "audio/aac", "audio/ogg", "audio/flac", "audio/mpeg", "audio/m4a", "audio/l16", "audio/opus", "audio/alaw", "audio/mulaw", "audio/webm", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true
temperature = true
top_p = true
top_k = true
cache = { implicit = true, explicit = true }
service_tier = ["flex", "priority"]
system_updates = false
effort_updates = false

[limit]
context = 1_048_576
output = 65_536

[api.generate-content]

[api.chat-completions]
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible" }

[api.interactions]
sdk = { opencodeai = "@opencode/ai/providers/google/interactions" }

[cost.text.input]
price = 0.25
cache = { read = 0.025 }

[cost.text.output]
price = 1.5

[cost.audio.input]
price = 0.5

[cost.web_search]
price = 14
