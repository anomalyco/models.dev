# Kimi Code models (accessed 2026-10-27): https://www.kimi.com/code/docs/en/kimi-code/models.html and https://www.kimi.com/code/docs/kimi-code/models.html
# k3.1-pro-highspeed is the Coding Plan ID; the open-platform ID is kimi-k3.1-pro-highspeed.
# Highspeed serves the same model intelligence at 2-3x the speed and about 2x the subscription consumption.
# Always thinks: reasoning_effort = "low" | "high" | "max" (default "high"); none/disabled returns HTTP 400.
# Switching reasoning effort invalidates the context cache. Cost is zeroed per this provider's subscription convention.
# prompt_cache_key is required for good cache hit rates on Kimi Code Plan (https://platform.kimi.ai/docs/api/chat).
schema = 2
base_model = "moonshotai/kimi-k3.1-pro"
name = "Kimi K3.1 Pro Highspeed"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "high" }, effort = ["low", "high", "max"] }
structured_output = true
prompt_cache_key = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/moonshot/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/moonshot/messages" }

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
