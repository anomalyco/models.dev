# Prices: https://api.pirislabs.io/v1/models (verified 2026-10-27).
# Serving behavior verified live 2026-10-27: text-only, 1_048_576-token context;
# output limit inherited from the base model. Implicit cache hits confirmed.
# reasoning_effort=none does not disable reasoning on this host, so it is omitted.
schema = 2
base_model = "zhipuai/glm-5.3"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[limit]
context = 1_048_576

[cost.text.input]
price = 1.40
cache = { read = 0.14 }

[cost.text.output]
price = 4.40
