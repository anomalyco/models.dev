# Toggle: chat_template_kwargs.thinking = true|false
# Effort: reasoning_effort = low|high|max
# Prices: https://api.engy.ai/v1/models; limits: authed https://engy.ai/api/v1/models (2026-10-16;
# max_input was 262,144 on 2026-09-12; context is max_input + max_output, above the lab's 1M).
# Reasoning is off unless asked; thinking=false and none suppress it 40/40.
# engy maps effort per template (engy.ai/docs, 2026-09-19): low/medium -> low, high -> high, xhigh/max -> max.
# Probe 2026-09-12, n=40/level at 32k: low, medium and high did not separate (paired p>=0.04);
# high vs max paired p=1e-04.
# Mid-conversation: engy serves this model on POST /v1/chat/completions; reasoning and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://engy.ai/pricing
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true
effort_updates = false

[limit]
context = 1_048_576
input = 983_040
output = 65_536

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.03
cache = { read = 0.006 }

[cost.text.output]
price = 0.12
