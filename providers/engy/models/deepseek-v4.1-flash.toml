# Toggle: chat_template_kwargs.thinking = true|false
# Effort: reasoning_effort = low|high|max
# Prices: https://api.engy.ai/v1/models; limits: authed https://engy.ai/api/v1/models (2026-10-16;
# max_input was 262,144 on 2026-09-12; context is max_input + max_output, above the lab's 1M).
# Reasoning is off unless asked; thinking=false and none suppress it 40/40.
# engy maps effort per template (engy.ai/docs, 2026-09-19): low/medium -> low, high -> high, xhigh/max -> max.
# Probe 2026-09-12, n=40/level at 32k: low, medium and high did not separate (paired p>=0.04);
# high vs max paired p=1e-04.
base_model = "deepseek/deepseek-v4.1-flash"
structured_output = true

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 0.04
output = 0.08
cache_read = 0.008

[limit]
context = 1_048_576
input = 983_040
output = 65_536
