# Toggle: chat_template_kwargs.thinking = true|false
# Effort: reasoning_effort = high|max
# Prices: https://api.engy.ai/v1/models; limits: authed https://engy.ai/api/v1/models (2026-09-12).
# Reasoning is off unless asked. Live probe 2026-09-12, n=40/level at 32k: low, medium and high one
# rung (adjacent paired p>=0.04), xhigh and max another (p=0.57), high vs max paired p=1e-04 (MWU
# p=0.11); thinking=false and none suppress reasoning 40/40.
base_model = "deepseek/deepseek-v4.1-flash"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["high", "max"]

[cost]
input = 0.04
output = 0.08
cache_read = 0.008

[limit]
context = 327_680
input = 262_144
output = 65_536
