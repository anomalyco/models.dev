# Toggle: chat_template_kwargs.thinking = true|false
# Effort: reasoning_effort = low|high|max
# Sources: https://api.engy.ai/v1/models (deepseek-v4.1-flash-1017: pricing prompt 0.00000004/completion 0.00000008/cache_read 0.000000008, input_modalities image+text, output text, context_length 1048576, identical to deepseek-v4.1-flash); https://engy.ai/docs (DeepSeek V4.1 column covers V4.1-Flash; thinking=false toggle); https://api-docs.deepseek.com/news/news261017/ (1017 released 2026-10-17 as minor update to V4.1-Flash); https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash-1017 (MIT open weights, image-text-to-text).
# Limits: context from public API; input/output split carried from sibling deepseek-v4.1-flash.toml (authed https://engy.ai/api/v1/models 2026-10-16) pending authed re-read for 1017.
# Reasoning controls mirror sibling providers/engy/models/deepseek-v4.1-flash.toml and native providers/deepseek/models/deepseek-flash.toml.
base_model = "deepseek/deepseek-v4.1-flash"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 0.04
output = 0.08
cache_read = 0.008

[limit]
context = 1_048_576
input = 983_040
output = 65_536
