# Toggle: chat_template_kwargs.enable_thinking = true|false
# Prices: https://api.engy.ai/v1/models; limits: authed https://engy.ai/api/v1/models (2026-08-28/30).
# engy serves this deployment text-only, so modalities and attachment are narrowed.
# Live probe 2026-08-31, n=36/level at 8,192 (the cap): reasoning_effort inert, every pair p>=0.39
# (MWU); toggle and none suppress reasoning 36/36. No effort control is offered.
# Mid-conversation: engy serves this model on POST /v1/chat/completions; reasoning and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://engy.ai/pricing
schema = 2
base_model = "alibaba/qwen3.6-35b-a3b"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
context = 208_192
input = 200_000
output = 8_192

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.045
cache = { read = 0.015 }

[cost.text.output]
price = 0.3
