# Toggle: chat_template_kwargs.thinking = true|false
# Effort: reasoning_effort = low|high|max
# Prices: https://api.engy.ai/v1/models; limits: authed https://engy.ai/api/v1/models (2026-08-28/30).
# Reasoning is off unless asked; thinking=false and none suppress it 18/18.
# engy maps effort per template (engy.ai/docs, 2026-09-19): low/medium -> low, high -> high, xhigh/max -> max.
# Probe 2026-08-30, n=113-126/level at 64k: low, medium and high did not separate (p>=0.89);
# high vs max p=0.0064.
base_model = "deepseek/deepseek-v4-flash-0731"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 0.045
output = 0.09
cache_read = 0.009

[limit]
context = 1_048_576
input = 920_576
output = 128_000
