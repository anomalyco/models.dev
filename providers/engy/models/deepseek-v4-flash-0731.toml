# Toggle: chat_template_kwargs.thinking = true|false
# Effort: reasoning_effort = low|high|max
# Prices: https://api.engy.ai/v1/models; limits: authed https://engy.ai/api/v1/models (2026-08-28/30).
# Reasoning is off unless asked; thinking=false and none suppress it 18/18.
# engy maps effort per template (engy.ai/docs, 2026-09-19): low/medium -> low, high -> high, xhigh/max -> max.
# Probe 2026-08-30, n=113-126/level at 64k: low, medium and high did not separate (p>=0.89);
# high vs max p=0.0064.
# Mid-conversation: engy serves this model on POST /v1/chat/completions; reasoning and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://engy.ai/pricing
schema = 2
base_model = "deepseek/deepseek-v4-flash-0731"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
context = 1_048_576
input = 920_576
output = 128_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.045
cache = { read = 0.009 }

[cost.text.output]
price = 0.09
