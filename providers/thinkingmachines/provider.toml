# Tinker's Anthropic-compatible API serves base models such as
# `thinkingmachines/Inkling`; the OpenAI-compatible API documents
# `tinker://.../sampler_weights/...` checkpoint paths instead.
# https://tinker-docs.thinkingmachines.ai/tinker/compatible-apis/anthropic/ (accessed 2026-07-22)
# https://tinker-docs.thinkingmachines.ai/tinker/compatible-apis/openai/ (accessed 2026-07-22)
name = "Thinking Machines"
env = ["TINKER_API_KEY"]
npm = "@ai-sdk/anthropic"
api = "https://tinker.thinkingmachines.dev/services/tinker-prod/anthropic/api/v1"
doc = "https://tinker-docs.thinkingmachines.ai/tinker/compatible-apis/anthropic/"
