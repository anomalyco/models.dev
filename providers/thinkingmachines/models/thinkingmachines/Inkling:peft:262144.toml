# Sources (accessed 2026-07-22):
# - API and exact model ID: https://tinker-docs.thinkingmachines.ai/tinker/compatible-apis/anthropic/
# - Pricing and served context: https://tinker-docs.thinkingmachines.ai/tinker/models/
# API: {"output_config":{"effort":"low"|"medium"|"high"|"xhigh"|"max"}}
# Disable reasoning with {"thinking":{"type":"disabled"}}.
schema = 2
base_model = "thinkingmachines/inkling"
name = "Inkling (256K)"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[limit]
context = 262_144
output = 262_144

[cost.text.input]
price = 3.74
cache = { read = 0.748 }

[cost.text.output]
price = 9.36
