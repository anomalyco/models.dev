# Verified 2026-09-18 against https://api.kimi.ai/coding/v1/chat/completions
# with kimi-code OAuth credentials; reasoning returned via reasoning_content.
# reasoning_options mirror the Moonshot AI platform API surface:
#   thinking.type = "enabled" | "disabled" | "adaptive"
#   output_config.effort = "low" | "high" | "max"
# Cost is zeroed per this provider's subscription convention.
base_model = "moonshotai/kimi-k3"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 0
output = 0
cache_read = 0
cache_write = 0

[interleaved]
field = "reasoning_content"
