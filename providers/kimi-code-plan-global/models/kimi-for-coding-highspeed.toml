# Verified 2026-09-18 against https://api.kimi.ai/coding/v1/chat/completions
# with kimi-code OAuth credentials; reasoning returned via reasoning_content.
# Kimi Code docs (accessed 2026-10-19): https://www.kimi.com/code/docs/en/kimi-code/models.html
# K2.7 Code HighSpeed with thinking always on (no effort setting).
# prompt_cache_key is required for good cache hit rates on Kimi Code Plan (https://platform.kimi.ai/docs/api/chat).
# Cost is zeroed per this provider's subscription convention.
schema = 2
base_model = "moonshotai/kimi-k2.7-code-highspeed"
name = "Kimi For Coding HighSpeed"

[capabilities]
reasoning = { supported = true }
structured_output = true
prompt_cache_key = true
cache = { implicit = true }

[limit]
output = 32_768

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/moonshot/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/moonshot/messages" }

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
