# Source: deeprelay's catalog, GET https://api.deeprelay.ai/v1/models (accessed 2026-11-25):
# context_length, max_completion_tokens, supported_parameters, pricing.
# Reasoning controls: live probe of POST https://api.deeprelay.ai/v1/chat/completions (2026-11-25).
# Generated by tools/modelsdev/generate.py in deeprelay's repo.
# Toggle: reasoning_effort = none turns thinking off; any other value turns it on.
# Reasoning tokens are reported in usage, but the reasoning text is not returned.
schema = 2
base_model = "alibaba/qwen3.6-plus"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }

[cost.text.input]
price = 0.5

[cost.text.output]
price = 3

[cost.web_search]
price = 2
