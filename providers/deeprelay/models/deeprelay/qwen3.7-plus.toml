# Source: deeprelay's catalog, GET https://api.deeprelay.ai/v1/models (accessed 2026-11-26):
# context_length, max_completion_tokens, supported_parameters, pricing.
# Reasoning controls: live probe of POST https://api.deeprelay.ai/v1/chat/completions (2026-11-26).
# Generated by tools/modelsdev/generate.py in deeprelay's repo.
# Toggle: reasoning_effort = none turns thinking off; any other value turns it on.
# Reasoning is returned in message.reasoning_content.
schema = 2
base_model = "alibaba/qwen3.7-plus"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
output = 131_072

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.32

[cost.text.output]
price = 1.28

[cost.web_search]
price = 2
