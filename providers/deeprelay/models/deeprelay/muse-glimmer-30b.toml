# Source: deeprelay's catalog, GET https://api.deeprelay.ai/v1/models (accessed 2026-11-26):
# context_length, max_completion_tokens, supported_parameters, pricing.
# Reasoning controls: live probe of POST https://api.deeprelay.ai/v1/chat/completions (2026-11-26).
# Generated by tools/modelsdev/generate.py in deeprelay's repo.
# Effort: reasoning_effort = low|medium|high|xhigh. These are the lab's documented
#   levels that deeprelay accepted in the live probe (one request per level).
# `none` is accepted but the model still reasons, so it isn't listed (reasoning is always on).
# Reasoning is returned in message.reasoning_content.
schema = 2
base_model = "meta/muse-glimmer-30b"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
cache = { implicit = true }
structured_output = true

[limit]
output = 16_384

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.35
cache = { read = 0.04 }

[cost.text.output]
price = 1.5

[cost.web_search]
price = 2
