# Source: deeprelay's catalog, GET https://api.deeprelay.ai/v1/models (accessed 2026-11-25):
# context_length, max_completion_tokens, supported_parameters, reasoning_efforts, pricing.
# Generated by tools/modelsdev/generate.py in deeprelay's repo.
# Effort: reasoning_effort = none|low|high; `none` turns thinking off.
# Levels are the lab's native set that deeprelay passed a live probe for.
# Reasoning is returned in message.reasoning_content.
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "high"] }
cache = { implicit = true }
structured_output = true

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.15
cache = { read = 0.03 }

[cost.text.output]
price = 0.5

[cost.web_search]
price = 2
