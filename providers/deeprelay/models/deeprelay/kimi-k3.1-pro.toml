# Source: deeprelay's catalog, GET https://api.deeprelay.ai/v1/models (accessed 2026-11-25):
# context_length, max_completion_tokens, supported_parameters, pricing.
# Reasoning controls: live probe of POST https://api.deeprelay.ai/v1/chat/completions (2026-11-25).
# Generated by tools/modelsdev/generate.py in deeprelay's repo.
# Effort: reasoning_effort = low|high|max. These are the lab's documented
#   levels that deeprelay accepted in the live probe (one request per level).
# `none` is accepted and returns no reasoning, but isn't listed: Moonshot serves thinking-off K3 requests with another model.
# Reasoning is returned in message.reasoning_content.
schema = 2
base_model = "moonshotai/kimi-k3.1-pro"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
cache = { implicit = true }
structured_output = true

[limit]
output = 131_072

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 2
cache = { read = 0.2 }

[cost.text.output]
price = 10

[cost.web_search]
price = 2
