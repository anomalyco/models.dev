# Source: deeprelay's catalog, GET https://api.deeprelay.ai/v1/models (accessed 2026-11-25):
# context_length, max_completion_tokens, supported_parameters, pricing.
# Reasoning controls: live probe of POST https://api.deeprelay.ai/v1/chat/completions (2026-11-25).
# Generated by tools/modelsdev/generate.py in deeprelay's repo.
# Effort: reasoning_effort = low|medium|high|xhigh. These are the lab's documented
#   levels that deeprelay accepted in the live probe (one request per level).
# `none` is accepted but the model still reasons, so it isn't listed (reasoning is always on).
# Reasoning is returned in message.reasoning_content.
schema = 2
base_model = "minimax/MiniMax-M3.1-Flash"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
cache = { implicit = true }
structured_output = true

[limit]
context = 1_048_576
output = 524_288

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.15
cache = { read = 0.02 }

[cost.text.output]
price = 0.6

[cost.web_search]
price = 2
