# Source: deeprelay's catalog, GET https://api.deeprelay.ai/v1/models (accessed 2026-11-25):
# context_length, max_completion_tokens, supported_parameters, reasoning_efforts, pricing.
# Generated by tools/modelsdev/generate.py in deeprelay's repo.
# Effort: reasoning_effort = none|low|medium|high|xhigh; `none` turns thinking off.
# Levels are the lab's native set that deeprelay passed a live probe for.
# Reasoning is returned in message.reasoning_content.
schema = 2
base_model = "meta/muse-spark-open"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
cache = { implicit = true }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.25
cache = { read = 0.15 }

[cost.text.output]
price = 4.25

[cost.web_search]
price = 2
