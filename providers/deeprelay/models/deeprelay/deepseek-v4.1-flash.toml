# Source: deeprelay's catalog, GET https://api.deeprelay.ai/v1/models (accessed 2026-11-25):
# context_length, max_completion_tokens, supported_parameters, reasoning_efforts, pricing.
# Generated by tools/modelsdev/generate.py in deeprelay's repo.
# Effort: reasoning_effort = none|low|high|max; `none` turns thinking off.
# Levels are the lab's native set that deeprelay passed a live probe for.
# Reasoning is returned in message.reasoning_content.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true

[limit]
context = 1_048_576
output = 393_216

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.14

[cost.text.output]
price = 0.54

[cost.web_search]
price = 2
