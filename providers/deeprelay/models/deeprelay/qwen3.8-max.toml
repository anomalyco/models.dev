# Source: deeprelay's catalog, GET https://api.deeprelay.ai/v1/models (accessed 2026-11-26):
# context_length, max_completion_tokens, supported_parameters, pricing.
# Reasoning controls: live probe of POST https://api.deeprelay.ai/v1/chat/completions (2026-11-26).
# Generated by tools/modelsdev/generate.py in deeprelay's repo.
# Effort: reasoning_effort = none|low|medium|xhigh; `none` turns thinking off. These are the lab's documented
#   levels that deeprelay accepted in the live probe (one request per level).
# Reasoning is returned in message.reasoning_content.
schema = 2
base_model = "alibaba/qwen3.8-max"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "xhigh"] }
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 2
cache = { read = 0.25 }

[cost.text.output]
price = 6

[cost.web_search]
price = 2
