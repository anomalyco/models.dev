# Pricing, output cap, and modalities from GET https://void.blackbit.sh/v1/models (accessed 2026-09-22).
# https://docs.blackbit.sh/docs/void/models/language
# limit.context = max_input_tokens; limit.output = max_output_tokens. max_input_tokens=1000000 max_output_tokens=128000 (GET /v1/models 2026-09-22).
# Live catalog accepts text and image. Lab entry also lists video and pdf.
# Toggle: enable_thinking true|false
# Effort: reasoning_effort = low|medium|xhigh. high is an alias of xhigh.
# Budget: thinking_budget 0..262144, not combined with reasoning_effort.
# https://docs.qwencloud.com/developer-guides/text-generation/thinking (accessed 2026-09-22)
base_model = "alibaba/qwen3.8-max"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "xhigh"]

[[reasoning_options]]
type = "budget_tokens"
min = 0
max = 262_144

[cost]
input = 2.00
output = 6.00

[limit]
output = 128_000

[modalities]
input = ["text", "image"]
