# Prices: Teapot Router public pricing endpoint https://teapotrouter.com/api/pricing (retrieved 2026-11-08).
# Standard account group: USD per million tokens = model_ratio x 2 x 0.35 standard group ratio;
# output = input x completion_ratio. Prompt-cache pricing is not published, so none is declared.
# Reasoning: $.reasoning_effort passthrough on /v1/chat/completions, same as the upstream OpenAI API.
# Ratios from https://teapotrouter.com/api/pricing (retrieved 2026-11-08): model_ratio=5, completion_ratio=5 —
# the standard-group list price now follows the official 5x output ratio (previously billed at a 2x ratio).
schema = 2
base_model = "openai/gpt-6-astra"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 3.5

[cost.text.output]
price = 17.5
