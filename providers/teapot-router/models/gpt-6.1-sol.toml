# Prices: Teapot Router public pricing endpoint https://teapotrouter.com/api/pricing (retrieved 2026-11-15).
# Standard account group: USD per million tokens = model_ratio x 2 x 0.065 standard group ratio (codex);
# output = input x completion_ratio. Prompt-cache reads are billed at the endpoint's cache_ratio; cache writes bill as regular input.
# Cache: automatic (OpenAI-style) prompt caching; cached tokens bill at the published cache_ratio.
# Reasoning: $.reasoning_effort passthrough on /v1/chat/completions, same as the upstream OpenAI API.
# Ratios from https://teapotrouter.com/api/pricing (retrieved 2026-11-15): model_ratio=1, completion_ratio=5 —
# the standard-group list price now follows the official 5x output ratio (previously billed at a 2x ratio).
# Freeform probe (2026-11-09, operator, live): chat-completions accepts requests carrying
# freeform custom tools without erroring but does not execute them — a regex-grammar probe
# (syntax "regex", definition ZZ[0-9]{3}) came back as plain content "ZZ000" with
# finish_reason "stop" (no tool_calls object), and a text-format probe had the model state
# it had no such tool. No format is enforced or callable, so freeform is omitted.
schema = 2
base_model = "openai/gpt-6.1-sol"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
cache = { implicit = true }

[cost.text.input]
price = 0.13
cache = { read = 0.0065 }

[cost.text.output]
price = 0.65
