# Prices: Teapot Router public pricing endpoint https://teapotrouter.com/api/pricing (retrieved 2026-11-15).
# Standard account group: USD per million tokens = model_ratio x 2 x 0.34 standard group ratio (claudecode);
# output = input x completion_ratio. Prompt-cache reads are billed at the endpoint's cache_ratio; cache writes bill as regular input.
# Reasoning: passthrough of the upstream Anthropic Messages controls on the /v1/messages
# surface declared below; chat-completions (provider default) does not expose them.
# Effort: $.output_config.effort = "low"|"medium"|"high"|"xhigh"|"max" on /v1/messages.
schema = 2
base_model = "anthropic/claude-opus-5-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[api.messages]
base_url = "https://api.teapotrouter.com/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 1.36
cache = { read = 0.068 }

[cost.text.output]
price = 6.8
