# knowledge: kept from v1, where the generator copied the Helicone registry trainingDate; unsourced (lab: 2024-09-30).
# Effort: reasoning_effort = high. Helicone's gateway schema accepts minimal|low|medium|high
# and OpenAI routes pass it through, so these are the model's native values within that set.
# https://docs.helicone.ai/gateway/concepts/reasoning
schema = 2
base_model = "openai/gpt-5-pro"
name = "OpenAI: GPT-5 Pro"
knowledge = "2025-01"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true, effort = ["high"] }

[limit]
context = 128_000
output = 32_768

[cost.text.input]
price = 15

[cost.text.output]
price = 120
