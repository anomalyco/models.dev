# Native exception (accessed 2026-06-25): `thinking.type` is enabled or disabled;
# manual `budget_tokens` is >=1024 and below max_tokens, hence this 63,999 cap.
# https://docs.anthropic.com/en/docs/build-with-claude/extended-thinking
# knowledge: kept from v1, where the generator copied the Helicone registry trainingDate; unsourced (lab: 2025-07-31).
schema = 2
base_model = "anthropic/claude-sonnet-4-5-20250929"
name = "Anthropic: Claude Sonnet 4.5 (20250929)"
knowledge = "2025-09"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, budget = { min = 1_024, max = 63_999 } }

[cost.text.input]
price = 3
cache = { read = 0.30000000000000004, write = 3.75 }

[cost.text.output]
price = 15
