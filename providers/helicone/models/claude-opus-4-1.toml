# Native exception (accessed 2026-06-25): `thinking.type` is enabled or disabled;
# manual `budget_tokens` is >=1024 and below max_tokens, hence this 31,999 cap.
# https://docs.anthropic.com/en/docs/build-with-claude/extended-thinking
# knowledge: kept from v1, where the generator copied the Helicone registry trainingDate; unsourced (lab: 2025-03-31).
schema = 2
base_model = "anthropic/claude-opus-4-1"
name = "Anthropic: Claude Opus 4.1"
knowledge = "2025-08"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, budget = { min = 1_024, max = 31_999 } }

[cost.text.input]
price = 15
cache = { read = 1.5, write = 18.75 }

[cost.text.output]
price = 75
