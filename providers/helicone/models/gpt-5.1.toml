# knowledge: kept from v1, where the generator copied the Helicone registry trainingDate; unsourced (lab: 2024-09-30).
# Effort: reasoning_effort = low|medium|high. Helicone's gateway schema accepts minimal|low|medium|high
# and OpenAI routes pass it through, so these are the model's native values within that set.
# https://docs.helicone.ai/gateway/concepts/reasoning
schema = 2
base_model = "openai/gpt-5.1"
name = "OpenAI GPT-5.1"
knowledge = "2025-01"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
temperature = false

[cost.text.input]
price = 1.25
cache = { read = 0.12500000000000003 }

[cost.text.output]
price = 10
