# knowledge: kept from v1, where the generator copied the Helicone registry trainingDate; unsourced (lab: 2024-10-31).
# Toggle: thinking.type = enabled|disabled. Budget: thinking.budget_tokens >= 1024 (and below max_tokens; no fixed max).
# Helicone translates reasoning_effort / reasoning_options.budget_tokens to these for Anthropic routes.
# https://docs.anthropic.com/en/docs/build-with-claude/extended-thinking
# Cache writes: 5m and 1h prices from the Helicone registry's Anthropic endpoint (cacheMultipliers write5m, write1h).
schema = 2
base_model = "anthropic/claude-3-7-sonnet-20250219"
name = "Anthropic: Claude 3.7 Sonnet"
knowledge = "2025-02"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, budget = { min = 1_024 } }

[cost.text.input]
price = 3
cache = { read = 0.3, write = { "5m" = 3.75, "1h" = 6 } }

[cost.text.output]
price = 15
