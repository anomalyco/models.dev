# Native exception (accessed 2026-06-25): `thinking.type` is enabled or disabled;
# manual `budget_tokens` is >=1024 and below max_tokens, hence this 31,999 cap.
# https://docs.anthropic.com/en/docs/build-with-claude/extended-thinking
schema = 2
name = "Anthropic: Claude Opus 4.1 (20250805)"
description = "Flagship Claude model for deep reasoning, coding, and long-horizon agents"
family = "claude-opus"
open_weights = false
knowledge = "2025-08"
release_date = "2025-08-05"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true, budget = { min = 1_024, max = 31_999 } }
temperature = true

[limit]
context = 200_000
output = 32_000

[cost.text.input]
price = 15
cache = { read = 1.5, write = 18.75 }

[cost.text.output]
price = 75
