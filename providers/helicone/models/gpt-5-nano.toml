# knowledge: kept from v1, where the generator copied the Helicone registry trainingDate; unsourced (lab: 2024-05-30).
# Effort: reasoning_effort = minimal|low|medium|high. Helicone's gateway schema accepts minimal|low|medium|high
# and OpenAI routes pass it through, so these are the model's native values within that set.
# https://docs.helicone.ai/gateway/concepts/reasoning
schema = 2
base_model = "openai/gpt-5-nano"
name = "OpenAI GPT-5 Nano"
knowledge = "2025-01"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }

[cost.text.input]
price = 0.049999999999999996
cache = { read = 0.005 }

[cost.text.output]
price = 0.39999999999999997
