# knowledge: kept from v1, where the generator copied the Helicone registry trainingDate; unsourced (lab: 2023-09).
# Effort: reasoning_effort = low|medium|high. Helicone's gateway schema accepts minimal|low|medium|high
# and OpenAI routes pass it through, so these are the model's native values within that set.
# https://docs.helicone.ai/gateway/concepts/reasoning
schema = 2
base_model = "openai/o1"
name = "OpenAI: o1"
knowledge = "2025-01"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[cost.text.input]
price = 15
cache = { read = 7.5 }

[cost.text.output]
price = 60
