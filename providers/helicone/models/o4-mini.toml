# knowledge: kept from v1, where the generator copied the Helicone registry trainingDate; unsourced (lab: 2024-05).
# Effort: reasoning_effort = low|medium|high. Helicone's gateway schema accepts minimal|low|medium|high
# and OpenAI routes pass it through, so these are the model's native values within that set.
# https://docs.helicone.ai/gateway/concepts/reasoning
schema = 2
base_model = "openai/o4-mini"
name = "OpenAI o4 Mini"
knowledge = "2024-06"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[cost.text.input]
price = 1.1
cache = { read = 0.275 }

[cost.text.output]
price = 4.4
