# Image MIME types: this file serves OpenAI's chatgpt-4o-latest; formats are the lab's, per
#   https://developers.openai.com/api/docs/guides/images-vision ("PNG, JPEG, WEBP, and non-animated GIF").
#   Helicone lists no formats, so it is assumed to relay the lab's.
schema = 2
name = "OpenAI ChatGPT-4o"
description = "GPT model for general reasoning, writing, coding, and tool-assisted tasks"
family = "gpt"
open_weights = false
knowledge = "2024-08"
release_date = "2024-08-14"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true

[limit]
context = 128_000
output = 16_384

[cost.text.input]
price = 5
cache = { read = 2.5 }

[cost.text.output]
price = 20
