# Native exception (accessed 2026-06-25): `reasoning_effort` is minimal, low,
# medium, or high; no numeric reasoning-token budget is documented.
# https://docs.perplexity.ai/api-reference/sonar-post
# knowledge: kept from v1, where the generator copied the Helicone registry trainingDate; unsourced (lab: 2025-09-01).
schema = 2
base_model = "perplexity/sonar-reasoning-pro"
name = "Perplexity Sonar Reasoning Pro"
knowledge = "2025-01"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }

[limit]
context = 127_000

[cost.text.input]
price = 2

[cost.text.output]
price = 8
