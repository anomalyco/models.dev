# Native exception (accessed 2026-06-25): `thinking.type` is enabled or disabled;
# manual `budget_tokens` is >=1024 and below max_tokens, hence this 63,999 cap.
# https://docs.anthropic.com/en/docs/build-with-claude/extended-thinking
schema = 2
name = "Anthropic: Claude Opus 4.5"
description = "Flagship Claude model for deep reasoning, coding, and long-horizon agents"
family = "claude-opus"
open_weights = false
knowledge = "2025-11"
release_date = "2025-11-24"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true, budget = { min = 1_024, max = 63_999 } }
temperature = true

[limit]
context = 200_000
output = 64_000

[cost.text.input]
price = 5
cache = { read = 0.5, write = 6.25 }

[cost.text.output]
price = 25
