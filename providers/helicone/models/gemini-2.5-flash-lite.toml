# Native exception (accessed 2026-06-25): `thinkingBudget` 0 disables and -1 is
# dynamic; enabled manual budgets are 512..24576 tokens.
# https://ai.google.dev/gemini-api/docs/thinking
# knowledge: kept from v1, where the generator copied the Helicone registry trainingDate; unsourced (lab: 2025-01).
schema = 2
base_model = "google/gemini-2.5-flash-lite"
name = "Google Gemini 2.5 Flash Lite"
knowledge = "2025-07"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, budget = { min = 512, max = 24_576 } }

[limit]
output = 65_535

[cost.text.input]
price = 0.09999999999999999
cache = { read = 0.024999999999999998, write = 0.09999999999999999 }

[cost.text.output]
price = 0.39999999999999997
