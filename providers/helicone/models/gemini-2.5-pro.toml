# Native exception (accessed 2026-06-25): `thinkingBudget` -1 is dynamic and the
# manual range is 128..32768; thinking cannot be disabled with budget 0.
# https://ai.google.dev/gemini-api/docs/thinking
schema = 2
name = "Google Gemini 2.5 Pro"
description = "Advanced Gemini model for complex reasoning, coding, and multimodal analysis"
family = "gemini-pro"
open_weights = false
knowledge = "2025-06"
release_date = "2025-06-17"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, budget = { min = 128, max = 32_768 } }
temperature = true

[limit]
context = 1_048_576
output = 65_536

[cost.text.input]
price = 1.25
cache = { read = 0.3125, write = 1.25 }

[cost.text.output]
price = 10
