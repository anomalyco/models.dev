# Native exception (accessed 2026-06-25): `reasoning_effort` is minimal, low,
# medium, or high; no numeric reasoning-token budget is documented.
# https://docs.perplexity.ai/api-reference/sonar-post
schema = 2
base_model = "perplexity/sonar-deep-research"
name = "Perplexity Sonar Deep Research"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
temperature = true

[limit]
context = 127_000
output = 4_096

[cost.text.input]
price = 2

[cost.text.output]
price = 8
