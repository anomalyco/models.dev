# Native exception (accessed 2026-06-25): `thinkingLevel` supports low and high
# for Gemini 3 Pro; numeric `thinkingBudget` is a Gemini 2.5 control.
# https://ai.google.dev/gemini-api/docs/thinking
schema = 2
name = "Google Gemini 3 Pro Preview"
description = "Advanced Gemini model for complex reasoning, coding, and multimodal analysis"
family = "gemini-pro"
open_weights = false
knowledge = "2025-11"
release_date = "2025-11-18"

[modalities]
input = ["text", "image", "audio", "video"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "high"] }
temperature = true

[limit]
context = 1_048_576
output = 65_536

[cost.text.input]
price = 2
cache = { read = 0.19999999999999998 }

[cost.text.output]
price = 12
