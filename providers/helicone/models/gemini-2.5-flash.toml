# Native exception (accessed 2026-06-25): `thinkingBudget` 0 disables, -1 is
# dynamic, and the manual range is 0..24576 tokens.
# https://ai.google.dev/gemini-api/docs/thinking
# knowledge: kept from v1, where the generator copied the Helicone registry trainingDate; unsourced (lab: 2025-01).
schema = 2
base_model = "google/gemini-2.5-flash"
name = "Google Gemini 2.5 Flash"
knowledge = "2025-06"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, budget = { min = 0, max = 24_576 } }

[limit]
output = 65_535

[cost.text.input]
price = 0.3
cache = { read = 0.075, write = 0.3 }

[cost.text.output]
price = 2.5
