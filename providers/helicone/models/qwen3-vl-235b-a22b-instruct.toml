# Video: the Helicone registry lists video input. Video MIME types come from the lab's docs,
#   https://www.alibabacloud.com/help/en/model-studio/vision (Video limits: "MP4, AVI, MKV, MOV, FLV, WMV", open-source
#   Qwen3-VL included), with registered MIME types, as in models/alibaba/qwen3.5-4b.toml.
# knowledge: kept from v1, where the generator copied the Helicone registry trainingDate; unsourced (lab: 2025-03-31).
schema = 2
base_model = "alibaba/qwen3-vl-235b-a22b-instruct"
knowledge = "2025-09"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic", "video/mp4", "video/x-msvideo", "video/x-matroska", "video/quicktime", "video/x-flv", "video/x-ms-wmv"]
output = ["text"]

[limit]
context = 256_000
output = 16_384

[cost.text.input]
price = 0.3

[cost.text.output]
price = 1.5
