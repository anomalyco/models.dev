# Image input verified on this host through the /v1/responses layer this route requires: a 32x32
# solid-colour PNG as a data: URI was named correctly on 4 of 5 attempts, the fifth a transient 502
# (probed 2026-09-17).
# /v1/chat/completions returns 400 "Pro reasoning mode requires the /v1/responses endpoint", and /v1/responses
# answers, so this route is responses-shaped. There effort medium and high are accepted, low returns 400 and
# xhigh fails upstream (probed 2026-09-16).
# Rates: GET https://api.cheaperinference.com/v1/models, kept current by the cheaperinference sync module.
base_model = "openai/gpt-5.5-pro"

[[reasoning_options]]
type = "effort"
values = ["medium", "high"]

[cost]
input = 21
output = 126
cache_read = 21
cache_write = 21

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 42
output = 189
cache_read = 42
cache_write = 42

[limit]
context = 1_000_000

[provider]
shape = "responses"
