# No usable image input on this host: the request is accepted but the image never reaches the model -
# NOIMAGE or an empty message on 6 of 6 colour probes (probed 2026-09-17).
# Reasoning is returned in a reasoning_details field on the message: present on 3 of 3 untruncated probes
# (runs cut short by max_tokens carry none), so the side channel is declared below (probed 2026-09-16).
# Rates: GET https://api.cheaperinference.com/v1/models, kept current by the cheaperinference sync module.
base_model = "meta/muse-spark-1.2"
attachment = false

[interleaved]
field = "reasoning_details"

[[reasoning_options]]
type = "effort"
values = ["minimal", "low", "medium", "high", "xhigh"]

[cost]
input = 0.875
output = 2.975
cache_read = 0.105
cache_write = 0.875

[limit]
output = 943_718

[modalities]
input = ["text"]
