[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["high", "xhigh"]

[cost]
input = 0.462
output = 1.386
cache_read = 0.0154
cache_write = 0.462

[limit]
output = 128_000
