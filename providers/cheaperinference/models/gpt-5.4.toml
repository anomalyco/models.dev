# Image input verified on this host: 3 of 4 colour probes exact and the fourth called "orange" for
# yellow (probed 2026-09-17).
# Rates: GET https://api.cheaperinference.com/v1/models, kept current by the cheaperinference sync module.
base_model = "openai/gpt-5.4"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "xhigh"]

[cost]
input = 1.75
output = 10.5
cache_read = 0.175
cache_write = 1.75

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 3.5
output = 15.75
cache_read = 0.35
cache_write = 3.5

[limit]
context = 1_000_000
output = 131_072
