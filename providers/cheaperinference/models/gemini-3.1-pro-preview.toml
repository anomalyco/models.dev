# Image input verified on this host: a 32x32 solid-colour PNG as a data: URI was named correctly on
# 4 of 4 colour probes (probed 2026-09-17).
# Effort: reasoning_effort = minimal|low|medium|high, and thinking cannot be turned off - the host
# rejects reasoning_effort = "none" with unsupported_reasoning_effort, "Gemini 3 thinking cannot be
# disabled. Supported reasoning effort values are minimal, low, medium, and high." (probed 2026-09-17).
# Rates: GET https://api.cheaperinference.com/v1/models, kept current by the cheaperinference sync module.
base_model = "google/gemini-3.1-pro-preview"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["minimal", "low", "medium", "high"]

[cost]
input = 1.4
output = 8.4
cache_read = 0.14
cache_write = 1.4

[[cost.tiers]]
tier = { type = "context", size = 200_000 }
input = 2.8
output = 12.6
cache_read = 0.28
cache_write = 2.8

[limit]
context = 1_000_000
output = 32_768
