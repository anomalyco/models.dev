schema = 2
base_model = "anthropic/claude-sonnet-4-6"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[limit]
context = 200_000
output = 128_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.9
cache = { read = 0.09 }

[cost.text.output]
price = 5.55
reasoning = 5.55
