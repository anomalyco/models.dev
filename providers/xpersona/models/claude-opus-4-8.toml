schema = 2
base_model = "anthropic/claude-opus-4-8"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[limit]
context = 200_000
output = 128_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.5
cache = { read = 0.15 }

[cost.text.output]
price = 9.25
reasoning = 9.25
