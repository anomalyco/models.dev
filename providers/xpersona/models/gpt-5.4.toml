base_model = "openai/gpt-5.4"
base_model_omit = ["limit.input"]

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh", "max"]

[cost]
input = 0.75
output = 6.00
reasoning = 6.00
cache_read = 0.075

[limit]
context = 1_050_000
output = 128_000

[modalities]
input = ["text", "image"]
output = ["text"]
