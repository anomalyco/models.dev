schema = 2
base_model = "openai/gpt-5.4"
base_model_omit = ["limit.input"]

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[limit]
context = 1_050_000
output = 128_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.75
cache = { read = 0.075 }

[cost.text.output]
price = 6
reasoning = 6
