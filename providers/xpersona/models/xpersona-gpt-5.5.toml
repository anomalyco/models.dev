# Image input: https://www.xpersona.co/docs#vision documents image_url parts.
# knowledge: kept from the earlier entry; unsourced.
# Deprecated: no longer listed by GET https://www.xpersona.co/v1/models or /v1/pricing
# (accessed 2026-10-21).
schema = 2
base_model = "openai/gpt-5.5"
base_model_omit = ["limit.input"]
knowledge = "2025-12-30"
status = "deprecated"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[limit]
context = 1_000_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 3
cache = { read = 0.3 }

[cost.text.output]
price = 18
reasoning = 18
