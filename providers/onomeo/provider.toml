# onomeo has no per-token USD price, so its model files carry no [cost] table.
# Calls spend site credits: each reply deducts usage.total_tokens (visible text
# sent plus received; reasoning is not charged), and premium models deduct more
# per call. Credits come from a free daily check-in (1,200 a day, rising to
# 3,500 on a 7-day streak); optional $5 membership and top-up packs add credits.
# Limits: 12 requests/min per key, 60 requests per 5 hours per account.
# https://onomeo.com/docs (accessed 2026-09-21)
# https://onomeo.com/integrations/opencode (accessed 2026-09-21)
name = "onomeo"
env = ["ONOMEO_API_KEY"]
npm = "@ai-sdk/openai-compatible"
api = "https://onomeo.com/v1"
doc = "https://onomeo.com/docs"
