# onomeo is in public beta: not every feature is guaranteed to work, and user
# feedback is welcome at https://onomeo.com/feedback.
# onomeo has no per-token USD price, so its model files carry no [cost] table.
# Calls spend site credits; the cost per reply varies by model and is listed at
# https://onomeo.com/models. Credits come from a free daily check-in: 50,000 on
# day 1, rising to 200,000 a day from day 7 of a streak (a missed day resets it).
# The bigger premium models (none are listed here) are capped at 50,000 credits
# a day per account that has not paid. Optional: $5 one-time buys 1,000,000
# credits. Limits: 12 requests/min per key, 60 requests per 5 hours per account,
# 120 per 5 hours per IP, and a site-wide pool of 450 per 5 hours shared by
# accounts that have not bought credits.
# https://onomeo.com/api/info (accessed 2026-09-26)
# https://onomeo.com/integrations/opencode (accessed 2026-09-21)
name = "onomeo"
env = ["ONOMEO_API_KEY"]
npm = "@ai-sdk/openai-compatible"
api = "https://onomeo.com/v1"
doc = "https://onomeo.com/docs"
