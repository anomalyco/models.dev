# Pricing: https://therouter.ai/models/ (checked 2026-11-04).
# The authenticated GET /v1/models catalog reports USD per token; prices below
# are USD per million tokens. The catalog states text and image inputs;
# https://therouter.ai/guides/multimodal/vision/ lists JPEG, PNG, GIF and WebP.
schema = 2
base_model = "openai/gpt-4o-mini"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[cost.text.input]
price = 0.162

[cost.text.output]
price = 0.648
