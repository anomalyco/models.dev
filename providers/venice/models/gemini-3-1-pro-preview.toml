# Live /models (2026-06-25): low|medium|high; no dedicated reasoning budget.
# https://api.venice.ai/api/v1/models?type=text (accessed 2026-06-25)
schema = 2
base_model = "google/gemini-3.1-pro-preview"

[modalities]
input = ["text", "image", "audio", "video"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
context = 1_000_000
output = 32_768

[cost.text.input]
price = 2.5
cache = { read = 0.5, write = 0.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 5
cache = { read = 0.5, write = 0.5 }

[cost.text.output]
price = 15

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 22.5
