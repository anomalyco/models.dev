base_model = "openai/gpt-5.6-luna"
base_model_omit = ["limit.input"]
name = "GPT-5.6 Luna Pro"
description = "Frontier GPT model for professional reasoning, coding, and multimodal work"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "xhigh", "max"]

[cost]
input = 1.25
output = 7.5
cache_read = 0.125

[limit]
context = 1_000_000

[modalities]
input = ["text", "image"]
