schema = 2
base_model = "openai/gpt-5.6-luna"
base_model_omit = ["limit.input"]
name = "GPT-5.6 Luna Pro"
description = "Frontier GPT model for professional reasoning, coding, and multimodal work"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[limit]
context = 1_000_000

[cost.text.input]
price = 0.2
cache = { read = 0.02, write = 0.25 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 0.4
cache = { read = 0.04, write = 0.5 }

[cost.text.output]
price = 1.2

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 1.8
