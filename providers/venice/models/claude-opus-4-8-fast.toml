# Effort: reasoning_effort (or reasoning.effort) = low|medium|high|xhigh|max, from GET /api/v1/models reasoningEffortOptions (2026-10-20).
# https://api.venice.ai/api/v1/models?type=text
# Modalities: image from anthropic/claude-opus-4-8. Venice documents audio (input_audio.format) and video (video_url) formats and file parts (PDF) in https://docs.venice.ai/swagger.yaml, but no image formats.
# Mid-conversation (Venice /api/v1/chat/completions, live probes 2026-10-20): system_updates = false. Venice hoists a later system message into the
# leading system block: with W = [system, user, assistant, system, user], W + [assistant, user] read W from cache but W + [assistant, system, user] read 0,
# on 12 models across Anthropic, OpenAI, Google, xAI, Moonshot, MiniMax, Z.AI, Qwen, DeepSeek, Xiaomi and NVIDIA routes (anonymized and private).
# effort_updates = false: reasoning_effort / reasoning.effort are request-level, with no per-turn field (https://docs.venice.ai/swagger.yaml).
# tools.updates = false: `tools` is request-level, with no tool addition/removal message.
# Cache: implicit = true, prompt_cache_key = true. Caching is automatic and `prompt_cache_key` is a routing hint (https://docs.venice.ai/guides/features/prompt-caching).
# Cache (Claude): Venice adds cache_control breakpoints to the system prompt and the second-to-last user message itself; callers can add `cache_control` (ephemeral, 5m) on system and message content blocks, up to 4 breakpoints per request (same page).
schema = 2
base_model = "anthropic/claude-opus-4-8"
name = "Claude Opus 4.8 Fast"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
system_updates = false
effort_updates = false
cache = { implicit = true, explicit = { ttl = ["5m"], max_breakpoints = 4, targets = ["system", "messages"] } }
prompt_cache_key = true

[api.chat-completions]

[api.responses]
base_url = "https://api.venice.ai/api/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 10
cache = { read = 1, write = 12.5 }

[cost.text.output]
price = 50

[cost.web_search]
price = 10
