schema = 2
name = "GPT-6 Astra Pro"
description = "Frontier GPT model for professional reasoning, coding, and multimodal work"
family = "gpt"
open_weights = false
release_date = "2026-09-05"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[limit]
context = 1_050_000
output = 128_000

[cost.text.input]
price = 10
cache = { read = 1, write = 12.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 20
cache = { read = 2, write = 25 }

[cost.text.output]
price = 50

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 75
