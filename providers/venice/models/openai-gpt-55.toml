# Live /models (2026-06-25): none|minimal|low|medium|high; no dedicated reasoning budget.
# https://api.venice.ai/api/v1/models?type=text (accessed 2026-06-25)
schema = 2
base_model = "openai/gpt-5.5"
last_updated = "2026-06-11"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true

[limit]
context = 1_000_000
output = 131_072

[cost.text.input]
price = 5
cache = { read = 0.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 10
cache = { read = 1 }

[cost.text.output]
price = 30

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 45
