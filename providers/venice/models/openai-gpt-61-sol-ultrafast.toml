# Modalities: image from openai/gpt-6.1-sol. Venice documents audio (input_audio.format) and video (video_url) formats and file parts (PDF) in https://docs.venice.ai/swagger.yaml, but no image formats.
# Mid-conversation (Venice /api/v1/chat/completions, live probes 2026-10-20): system_updates = false. Venice hoists a later system message into the
# leading system block: with W = [system, user, assistant, system, user], W + [assistant, user] read W from cache but W + [assistant, system, user] read 0,
# on 12 models across Anthropic, OpenAI, Google, xAI, Moonshot, MiniMax, Z.AI, Qwen, DeepSeek, Xiaomi and NVIDIA routes (anonymized and private).
# effort_updates = false: reasoning_effort / reasoning.effort are request-level, with no per-turn field (https://docs.venice.ai/swagger.yaml).
# tools.updates = false: `tools` is request-level, with no tool addition/removal message.
# Cache: implicit = true, prompt_cache_key = true. Caching is automatic and `prompt_cache_key` is a routing hint (https://docs.venice.ai/guides/features/prompt-caching).
# tools.freeform on [api.responses] only: /api/v1/responses accepted text, lark and regex custom tools and enforced the grammars (regex ZZ[0-9]{3} and the equivalent lark grammar both returned ZZ plus three digits, live 2026-10-28 on this model). /api/v1/chat/completions rejects the nested custom tool (400 "Invalid request parameters") and returns the flat form as a plain function call with no grammar (openai-gpt-54, live 2026-10-28).
schema = 2
base_model = "openai/gpt-6.1-sol"
name = "GPT-6.1 Sol Ultrafast"
description = "GPT model for general reasoning, writing, coding, and tool-assisted tasks"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true }
prompt_cache_key = true

[api.chat-completions]

[api.responses]
base_url = "https://api.venice.ai/api/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }
capabilities = { tools = { freeform = ["text", "lark", "regex"] } }

[cost.text.input]
price = 12
cache = { read = 0.6, write = 15 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 24
cache = { read = 1.2, write = 30 }

[cost.text.output]
price = 60

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 90

[cost.web_search]
price = 10
