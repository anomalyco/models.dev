# Live /models (2026-06-25): none|low|medium|high; no dedicated reasoning budget.
# https://api.venice.ai/api/v1/models?type=text (accessed 2026-06-25)
schema = 2
base_model = "deepseek/deepseek-v3.2"
description = "DeepSeek chat model for instruction following, coding, and analysis"
status = "deprecated"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true

[limit]
context = 160_000
output = 32_768

[cost.text.input]
price = 0.33
cache = { read = 0.16 }

[cost.text.output]
price = 0.48
