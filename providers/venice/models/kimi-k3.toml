schema = 2
base_model = "moonshotai/kimi-k3"
description = "Kimi multimodal agent model for visual understanding, coding, and planning"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true

[limit]
context = 1_000_000

[cost.text.input]
price = 3.75
cache = { read = 0.375 }

[cost.text.output]
price = 18.75
