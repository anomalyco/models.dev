base_model = "openai/gpt-5.6-luna"
base_model_omit = ["limit.input"]
description = "GPT model for general reasoning, writing, coding, and tool-assisted tasks"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "xhigh", "max"]

[cost]
input = 1.25
output = 7.5
cache_read = 0.125
cache_write = 1.5625

[limit]
context = 1_000_000

[modalities]
input = ["text", "image"]
