schema = 2
base_model = "xai/grok-4.7"
description = "Grok model for agentic tool use, reasoning, coding, and live assistance"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true

[limit]
output = 200_000

[cost.text.input]
price = 2.27
cache = { read = 0.57 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 4.53
cache = { read = 1.13 }

[cost.text.output]
price = 6.8

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 13.6
