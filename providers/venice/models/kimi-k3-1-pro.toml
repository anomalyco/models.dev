schema = 2
base_model = "moonshotai/kimi-k3.1-pro"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true

[limit]
context = 1_000_000

[api.chat-completions]

[api.responses]
base_url = "https://api.venice.ai/api/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 3.75
cache = { read = 0.375 }

[cost.text.output]
price = 18.75

[cost.web_search]
price = 10
