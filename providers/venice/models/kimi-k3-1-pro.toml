# Output limit: https://api.venice.ai/api/v1/models lists maxCompletionTokens 131072 (accessed 2026-11-13); the lab's raised cap would exceed this host's context.
schema = 2
base_model = "moonshotai/kimi-k3.1-pro"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true

[limit]
context = 1_000_000
output = 131_072

[api.chat-completions]

[api.responses]
base_url = "https://api.venice.ai/api/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 2
cache = { read = 0.2 }

[cost.text.output]
price = 10

[cost.web_search]
price = 10
