base_model = "zhipuai/glm-5.3-flash"
name = "GLM 5.3 Flash"
description = "GLM vision model for visual reasoning, documents, and multimodal agents"
release_date = "2026-08-21"
open_weights = true

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high"]

[cost]
input = 0.15
output = 0.5
cache_read = 0.03

[limit]
context = 1_048_576

[modalities]
input = ["text", "image", "video"]
