# Live metadata: reasoning only; no effort control or dedicated budget (2026-06-25).
# https://api.venice.ai/api/v1/models?type=text
# Mid-conversation (Venice /api/v1/chat/completions, live probes 2026-10-20): system_updates = false. Venice hoists a later system message into the
# leading system block: with W = [system, user, assistant, system, user], W + [assistant, user] read W from cache but W + [assistant, system, user] read 0,
# on 12 models across Anthropic, OpenAI, Google, xAI, Moonshot, MiniMax, Z.AI, Qwen, DeepSeek, Xiaomi and NVIDIA routes (anonymized and private).
# effort_updates = false: reasoning_effort / reasoning.effort are request-level, with no per-turn field (https://docs.venice.ai/swagger.yaml).
# Cache: implicit = true, prompt_cache_key = true. Caching is automatic and `prompt_cache_key` is a routing hint (https://docs.venice.ai/guides/features/prompt-caching).
# Modalities: image from xai/grok-4.20-0309-reasoning. Venice documents audio (input_audio.format) and video (video_url) formats and file parts (PDF) in https://docs.venice.ai/swagger.yaml, but no image formats.
schema = 2
name = "Grok 4.20 Multi-Agent"
description = "Grok model for agentic tool use, reasoning, coding, and live assistance"
family = "grok"
open_weights = false
release_date = "2026-03-12"
last_updated = "2026-06-11"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true }
structured_output = true
system_updates = false
effort_updates = false
cache = { implicit = true }
prompt_cache_key = true

[limit]
context = 2_000_000
output = 128_000

[cost.text.input]
price = 1.42
cache = { read = 0.23 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 2.83
cache = { read = 0.45 }

[cost.text.output]
price = 2.83

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 5.67
