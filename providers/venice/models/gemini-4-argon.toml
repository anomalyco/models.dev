# Modalities: image from google/gemini-4-argon; audio from google/gemini-4-argon; video from google/gemini-4-argon. Venice documents audio (input_audio.format) and video (video_url) formats and file parts (PDF) in https://docs.venice.ai/swagger.yaml, but no image formats.
# Mid-conversation (Venice /api/v1/chat/completions, live probes 2026-10-20): system_updates = false. Venice hoists a later system message into the
# leading system block: with W = [system, user, assistant, system, user], W + [assistant, user] read W from cache but W + [assistant, system, user] read 0,
# on 12 models across Anthropic, OpenAI, Google, xAI, Moonshot, MiniMax, Z.AI, Qwen, DeepSeek, Xiaomi and NVIDIA routes (anonymized and private).
# effort_updates = false: reasoning_effort / reasoning.effort are request-level, with no per-turn field (https://docs.venice.ai/swagger.yaml).
# tools.updates = false: `tools` is request-level, with no tool addition/removal message.
# Cache: implicit = true, prompt_cache_key = true. Caching is automatic and `prompt_cache_key` is a routing hint (https://docs.venice.ai/guides/features/prompt-caching).
schema = 2
base_model = "google/gemini-4-argon"
description = "Gemini multimodal model for text, image, audio, video, and document tasks"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "audio/wav", "audio/mp3", "audio/aiff", "audio/aac", "audio/ogg", "audio/flac", "audio/mpeg", "audio/m4a", "audio/l16", "audio/opus", "audio/alaw", "audio/mulaw", "audio/webm", "video/mp4", "video/mpeg", "video/mov", "video/avi", "video/x-flv", "video/mpg", "video/webm", "video/wmv", "video/3gpp"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
structured_output = true
system_updates = false
effort_updates = false
cache = { implicit = true }
prompt_cache_key = true

[limit]
context = 1_000_000

[cost.text.input]
price = 2.5
cache = { read = 0.125 }

[cost.text.output]
price = 12.5
