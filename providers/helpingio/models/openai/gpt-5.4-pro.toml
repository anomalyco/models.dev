# Source: https://api.helping.io/models, our public model list: prices, limits, reasoning efforts,
# input types and structured output. Limits and input types are stated where they differ from the lab file.
# Prices are list prices in US dollars per million tokens (https://docs.helping.io/billing/credits/).
# Reasoning: reasoning_effort is the only reasoning control this endpoint takes, and it accepts exactly the efforts GET /models lists for this model (none alone is no caller control); by default any other effort is refused with a 400, and a thinking field or a reasoning budget always is.
# Custom tools: refused, this endpoint takes function tools only, and a request that offers a custom (freeform) tool is a 400.
schema = 2
base_model = "openai/gpt-5.4-pro"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["medium", "high", "xhigh"] }
structured_output = false
cache = false

[cost.text.input]
price = 30

[[cost.text.input.overrides]]
when = { context = { gt = 272000 } }
price = 60

[cost.text.output]
price = 180

[[cost.text.output.overrides]]
when = { context = { gt = 272000 } }
price = 270
