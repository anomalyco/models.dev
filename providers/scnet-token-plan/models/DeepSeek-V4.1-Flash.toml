# Toggle: enable_thinking = true|false
# Effort: reasoning_effort = high|max
# https://www.scnet.cn/ac/openapi/doc/2.0/moduleapi/api/chat.html (accessed 2026-09-15)
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["high", "max"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0
cache = { read = 0 }

[cost.text.output]
price = 0
