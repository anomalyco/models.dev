# Context and prices: https://you.com/product/inference-router/models (accessed 2026-11-06)
# Effort: reasoning_effort = none|low|high|max
# Moonshot's levels (low/high/max); none disables thinking (0 reasoning tokens) on this endpoint. Tested live 2026-11-06.
schema = 2
base_model = "moonshotai/kimi-k3.1-pro"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }

[limit]
context = 1_000_000

[cost.text.input]
price = 1.9
cache = { read = 0.19 }

[cost.text.output]
price = 9.5
