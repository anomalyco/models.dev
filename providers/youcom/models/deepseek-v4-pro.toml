# Prices: https://you.com/product/inference-router/models (accessed 2026-10-22)
# Effort: reasoning_effort = none|low|high|max
# DeepSeek's levels (low/high/max); none disables thinking (0 reasoning tokens). Tested live 2026-10-22.
# Snapshot: You.com's model page (https://you.com/product/inference-router/models/deepseek-v4-pro) lists release Apr 24, 2026 and links huggingface.co/deepseek-ai/DeepSeek-V4-Pro, matching this base_model.
# Cache: automatic prefix caching, no markers; a repeated ~17k-token prompt returned usage.prompt_tokens_details.cached_tokens on the next request (tested live 2026-11-19).
schema = 2
base_model = "deepseek/deepseek-v4-pro"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
cache = { implicit = true }

[cost.text.input]
price = 1.65
cache = { read = 0.1 }

[cost.text.output]
price = 3.65
