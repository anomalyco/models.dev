# Prices: https://you.com/product/inference-router/models (accessed 2026-10-22)
# Effort: reasoning_effort = none|low|high|max
# DeepSeek's levels (low/high/max); none disables thinking (0 reasoning tokens). Tested live 2026-10-22.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }

[cost.text.input]
price = 0.3
cache = { read = 0.007 }

[cost.text.output]
price = 1.2
