# Xing4.1-Preview @ XingChen-AGI — provider model file, overrides only
# (fields identical to the lab file are inherited via base_model).
#
# Pricing (USD per 1M tokens) — public price card:
#   https://xingchen-agi.github.io/pricing/
#   List price: input $0.225 / cache read $0.01125 / output $0.90.
#   Limited-time offer (20% of list, valid through 2026-12-20):
#               input $0.045 / cache read $0.00225 / output $0.18.
#   Cache-hit price is 5% of the corresponding input price. Peak/off-peak time
#   tiers have been retired; one price applies at all hours.
#   The single-value cost fields below carry the offer price currently in
#   effect. Because "through 2026-12-20" is inclusive, the date multiplier
#   starts on 2026-12-21 and restores list prices (list = 5x the offer for all
#   three values), matching the inclusive-boundary convention in
#   providers/google/models/gemini-4-argon.toml.
#
# Reasoning controls — per API surface (sources updated 2026-11-24/26):
# - Chat Completions (https://www.teleai.com.cn/doc/cQo5DXMRNoHECdaPasOv/hjQ3zhABy0YZFlT3o42b):
#     toggle chat_template_kwargs.enable_thinking = true|false (default true).
#     reasoning_effort is documented as unsupported; no effort tiers.
# - Anthropic Messages (https://www.teleai.com.cn/doc/AKxJsPoX7N11msPFN7UM/R5HZSEjwFqL7M0XismLR):
#     toggle thinking.type = enabled|disabled (default enabled).
#     output_config.effort is documented as unsupported.
# - Responses (https://www.teleai.com.cn/doc/kwbjg00Gl0k4e5V3hrFZ/gnAv94SmMlMXptipTp2F):
#     reasoning.effort = minimal|low|medium|high, and "none" turns thinking off.
#   Authored as the union: toggle = true plus the graded effort list without
#   "none" (off is the toggle, not an effort level — mixin both is the
#   anti-pattern AGENTS.md warns about). Follows
#   providers/deepseek/models/deepseek-v4-pro.toml.
#
# Answer surfaces: Chat Completions returns the chain of thought in
#   message.reasoning_content (also mirrored in message.reasoning); Messages
#   returns thinking blocks; Responses returns reasoning summary items.
#
# Caching: usage.prompt_tokens_details.cached_tokens reports implicit cache hits;
#   explicit cache_control markers are not supported. No minimum-token threshold
#   is published, so the kind is declared bare per AGENTS.md.
#
# top_k: restated as false here because the host request schema exposes no top_k
#   field on any of the three APIs.
#
# structured_output is deliberately not set: Chat Completions supports
#   response_format json_object only and documents json_schema as unsupported
#   (text.format json_schema is documented on the Responses page only; capability
#   flags here are per-model, so the narrower Chat Completions behavior governs).
#
# APIs (all documented as serving Xing4.1-Preview):
#   Chat Completions  POST https://api-maas.teleai.com.cn/v1/chat/completions
#   Anthropic Messages POST https://api-maas.teleai.com.cn/v1/messages (x-api-key)
#   Responses         POST https://api-maas.teleai.com.cn/v1/responses
schema = 2
base_model = "xingchen-agi/xing4.1-preview"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["minimal", "low", "medium", "high"] }
top_k = false
cache = { implicit = true }

[cost.text.input]
price = 0.045
cache = { read = 0.00225 }

[cost.text.output]
price = 0.18

[[cost.multipliers]]
when = { date = { gte = "2026-12-21" } }
factor = 5

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.messages]
base_url = "https://api-maas.teleai.com.cn/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }