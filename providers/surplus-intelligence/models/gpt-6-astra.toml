# Effort: reasoning_effort = low|medium|high|xhigh|max (top-level field on /v1/chat/completions).
# The catalog row lists reasoning_effort (GET https://api.surplusintelligence.ai/v1/models, 2026-11-19) and Surplus forwards it to the seller as sent (https://www.surplusintelligence.ai/docs/reference/reasoning). Levels mirror providers/openrouter/models/openai/gpt-6-astra.toml.
# Live 2026-11-19, one request per level: every level above accepted; reasoning_content returned at low|medium|high|xhigh|max.
# Host deltas: input is narrowed to the catalog row's input_modalities (no file).
schema = 2
base_model = "openai/gpt-6-astra"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
