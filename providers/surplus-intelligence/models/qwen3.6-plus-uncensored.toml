# Toggle: reasoning.enabled true|false (OpenRouter-style `reasoning` object,
# forwarded to the seller unchanged); effort: reasoning_effort.
# Controls mirror the canonical model's lab + same-surface relay peers.
name = "Qwen 3.6 Plus Uncensored"
description = "Qwen vision-language model for visual reasoning, documents, and agent tasks"
family = "qwen3.6"
release_date = "2025-01-01"
last_updated = "2025-01-01"
attachment = true
reasoning = true
temperature = true
tool_call = true
structured_output = true
open_weights = false

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "budget_tokens"
min = 1
max = 81_920

[limit]
context = 1_000_000
output = 128_000

[modalities]
input = ["text", "image"]
output = ["text"]
