# Effort: reasoning_effort = low|medium|high (top-level field on /v1/chat/completions).
# The catalog row lists reasoning_effort (GET https://api.surplusintelligence.ai/v1/models, 2026-11-19) and Surplus forwards it to the seller as sent (https://www.surplusintelligence.ai/docs/reference/reasoning). Levels mirror providers/openrouter/models/google/gemini-3.7-flash.toml.
# Live 2026-11-19, one request per level: every level above accepted; reasoning_content returned at high, none at low|medium; Surplus rewrites the field for Google sellers (X-SI-Adapted-Params: reasoning_effort).
schema = 2
base_model = "google/gemini-3.7-flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
