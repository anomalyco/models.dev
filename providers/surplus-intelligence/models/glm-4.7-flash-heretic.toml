# Toggle: reasoning.enabled true|false (OpenRouter-style `reasoning` object,
# forwarded to the seller unchanged); effort: reasoning_effort.
# Controls mirror the canonical model's lab + same-surface relay peers.
name = "GLM 4.7 Flash Heretic"
description = "Efficient GLM model for fast reasoning, coding, and agent workflows"
family = "glm"
release_date = "2025-01-01"
last_updated = "2025-01-01"
attachment = false
reasoning = true
temperature = true
tool_call = true
structured_output = true
open_weights = true

[[reasoning_options]]
type = "toggle"

[limit]
context = 200_000
output = 32_768

[modalities]
input = ["text"]
output = ["text"]
