# Effort: reasoning_effort = low|medium|high|xhigh|max (top-level field on /v1/chat/completions).
# The catalog row lists reasoning_effort (GET https://api.surplusintelligence.ai/v1/models, 2026-11-19) and Surplus forwards it to the seller as sent (https://www.surplusintelligence.ai/docs/reference/reasoning). Levels mirror providers/openrouter/models/openai/gpt-6.1-sol.toml.
schema = 2
base_model = "openai/gpt-6.1-sol"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
