# Pricing and context length: https://onlist.io/models/z-ai/glm-5 (accessed 2026-09-07)
# Toggle: top-level `thinking` = { type: "enabled"|"disabled" } (Z.AI field, not OpenRouter's `reasoning.enabled`)
base_model = "zhipuai/glm-5"

[[reasoning_options]]
type = "toggle"

[interleaved]
field = "reasoning_content"

[cost]
input = 0.95
output = 3.15
cache_read = 0.19

[limit]
output = 128_000
context = 198_000
