# Available at https://dashboard.wylon.cn/models (read 2026-11-15).
# The dashboard declares text input; do not inherit the lab's image-editing inputs.
# The public price page does not list this model, so no unverified price is authored.
# Image API: https://portal.wylon.cn/zh/api-image-generations.html
schema = 2
v2_only = true
base_model = "alibaba/qwen-image-2.1"

[modalities]
input = ["text"]
output = ["image/png"]

[api.images]
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible/images" }
