# GLM-5.2; reasoning_effort effective levels high|max (default max).
# low|medium map to high, xhigh maps to max; see providers/zhipuai/models/glm-5.2.toml.
# `none` (off) is accepted via the effort field to disable thinking.
# Pricing: https://zro.moonmath.ai/pricing
base_model = "zhipuai/glm-5.2"
reasoning_options = [{ type = "effort", values = ["high", "max"] }]

[interleaved]
field = "reasoning_content"

[cost]
input = 1.10
output = 4.00
cache_read = 0.20

[limit]
context = 524_288
output = 64_000