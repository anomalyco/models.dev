# Pricing: https://lazu.ai/api/pricing (`channel_group = "direct"`, USD per MTok, published directly in USD, accessed 2026-11-18).
# Toggle: enable_thinking true|false
# Effort: reasoning_effort = low|medium|xhigh (https://api.lazu.ai/v1/models; providers/alibaba and relay peers teamorouter, 302ai)
# Budget: thinking_budget (integer reasoning tokens, forwarded unchanged to Alibaba Cloud Model Studio).
# Cache: implicit caching ($0.25/MTok read) and explicit 5m cache_control ($2.50/MTok write) per https://lazu.ai/api/pricing.
schema = 2
base_model = "alibaba/qwen3.8-max"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "xhigh"], budget = {} }
structured_output = true
cache = { implicit = true, explicit = { ttl = ["5m"] } }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 2
cache = { read = 0.25, write = { "5m" = 2.5 } }

[cost.text.output]
price = 6
