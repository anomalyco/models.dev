# Impossibl is a gateway: each model is served by an upstream, and a reasoning control
# is published here only where a caller-settable field on one of our HTTP surfaces is
# verified to reach that upstream. Controls the gateway accepts but does not forward are
# not published, per the audit rule that a silently-ignored field is not a control.
#
# reasoning_effort on POST /v1/chat/completions — forwarded:
#   - gateway rejects out-of-enum values: reasoning_effort=max and =banana -> 400 "reasoning_effort
#     is unsupported" (negative control; the field is validated, not dropped)
#   - upstream receives it: openai/gpt-5.4-mini with reasoning_effort=minimal -> 502 carrying
#     OpenAI's own "Unsupported value: 'minimal' is not supported with the 'gpt-5.4-mini' model.
#     Supported values are: ..." (proves forwarding + gives the per-model ladder)
# generationConfig.thinkingConfig.thinkingBudget on POST /v1beta/models/{model}:generateContent — forwarded:
#   - upstream receives it: thinkingBudget=99999999 -> 502 carrying Google's own
#     "GenerateContentRequest.generation_config.thinking_config.thinking_budget: thinking_budget
#     must be in the range [-1, 65536]" (proves forwarding and bounds)
#   - accepted in range: thinkingBudget=1024 and thinkingLevel=high -> 200
# thinking on POST /v1/messages — forwarded:
#   - budget_tokens is honored and scales: with visible text held roughly constant, budgets 1024 /
#     4096 / 16000 produced 1070 / 1843 / 2440 output tokens (implied reasoning ~786 / ~1586 /
#     ~2095)
#   - toggle is real: budget_tokens=30000 -> 2232 output tokens vs thinking.type=disabled -> 1060,
#     for near-identical visible text (~1900 chars both)
#   - gateway enforces the floor: thinking.budget_tokens=100 -> 400 "must be a finite integer of at
#     least 1024"; thinking.type=bogus -> 400 (negative controls, so the field is validated rather
#     than dropped)
#   - KNOWN GAP: the thinking content block is stripped from the response (messages-adapter.ts maps
#     thinking on the request side only), so callers are billed for reasoning they cannot read. That
#     is a response bug, not a missing control.
#
# Generated by scripts/gen-modelsdev-reasoning.mjs in the Impossibl gateway repo from
# its model registry; see the PR body for the full per-model table and citations.
name = "Impossibl"
npm = "@ai-sdk/openai-compatible"
api = "https://api.impossibl.com/v1"
env = ["IMPOSSIBL_API_KEY"]
doc = "https://impossibl.com/docs/models"
