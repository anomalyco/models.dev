# Pricing: https://api.impossibl.com/v1/models
# Toggle: {"thinking":{"type":"disabled"}}
# Budget: {"thinking":{"type":"enabled","budget_tokens":<n>}}
# Effort: {"output_config":{"effort":"high"}}
schema = 2
base_model = "anthropic/claude-sonnet-4-6"

[capabilities]
reasoning = { supported = true, toggle = true, budget = { min = 1_024 }, effort = ["low", "medium", "high", "max"] }

[cost.text.input]
price = 3
cache = { read = 0.3, write = 3.75 }

[cost.text.output]
price = 15
