# Pricing: https://api.impossibl.com/v1/models
# Toggle: {"thinking":{"type":"disabled"}}
# Effort: {"output_config":{"effort":"high"}}
schema = 2
base_model = "anthropic/claude-sonnet-5"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 2
cache = { read = 0.2, write = 2.5 }

[cost.text.output]
price = 10
