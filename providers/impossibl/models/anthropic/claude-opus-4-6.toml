# Pricing: https://api.impossibl.com/v1/models
# Toggle: {"thinking":{"type":"adaptive"|"enabled"|"disabled"}} on POST /v1/messages
base_model = "anthropic/claude-opus-4-6"

[cost]
input = 5.00
output = 25.00
cache_read = 0.50
cache_write = 6.25

[[reasoning_options]]
type = "toggle" # API: {"thinking":{"type":"adaptive"|"enabled"|"disabled"}} on POST /v1/messages

[[reasoning_options]]
type = "budget_tokens" # API: {"thinking":{"type":"enabled","budget_tokens":<n>}} on POST /v1/messages
min = 1024

[[reasoning_options]]
type = "effort" # API: {"output_config":{"effort":"<value>"}} on POST /v1/messages
values = ["low", "medium", "high", "max"]
