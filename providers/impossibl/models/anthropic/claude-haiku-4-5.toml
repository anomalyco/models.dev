# Pricing: https://api.impossibl.com/v1/models
# Toggle: {"thinking":{"type":"disabled"}}
# Budget: {"thinking":{"type":"enabled","budget_tokens":<n>}}
schema = 2
base_model = "anthropic/claude-haiku-4-5"

[capabilities]
reasoning = { supported = true, toggle = true, budget = { min = 1_024 } }

[cost.text.input]
price = 1
cache = { read = 0.1, write = 1.25 }

[cost.text.output]
price = 5
