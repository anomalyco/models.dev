# Pricing: https://api.impossibl.com/v1/models
# Billing (https://impossibl.com/docs/billing): prepaid credits at the GET /v1/models rates, no usage
# markup; buying credits adds a 5% platform fee (not representable here). Catalog checked 2026-10-21.
# Reasoning (https://impossibl.com/docs/reasoning): Chat Completions reasoning_effort / Responses reasoning.effort
# accept none|minimal|low|medium|high|xhigh|max and move to the nearest level the model has.
# No off switch: Fable 5 always thinks (https://impossibl.com/docs/reasoning#claude).
# Effort: {"output_config":{"effort":"high"}}
# Prompt caching (https://impossibl.com/docs/prompt-caching): cache_control breakpoints (or the request-level
# marker), ttl "5m" (default) or "1h"; 1h write = catalog cache_write_1h_per_mtok_usd.
schema = 2
base_model = "anthropic/claude-fable-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
cache = { explicit = { ttl = ["5m", "1h"] } }

[cost.text.input]
price = 10
cache = { read = 1, write = { "5m" = 12.5, "1h" = 20 } }

[cost.text.output]
price = 50
