# Pricing: https://api.impossibl.com/v1/models
# Toggle: {"thinking":{"type":"disabled"}}
# Budget: {"thinking":{"type":"enabled","budget_tokens":<n>}}
# Effort: {"output_config":{"effort":"high"}}
base_model = "anthropic/claude-opus-4-5"

[cost]
input = 5.00
output = 25.00
cache_read = 0.50
cache_write = 6.25

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "budget_tokens"
min = 1024

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]
