# Source for every value below: https://api.impossibl.com/v1/models (accessed 2026-08-01),
# which reports a 65_536 context window, text+image input, and 1.87 / 4.68 / 0.374 pricing
# for this model.
#
# limit: the base model declares 1_048_576 / 1_048_576 — the largest window any host offers.
# The served window is 65_536, so context is overridden down to it rather than inherited, and
# output is capped at the same figure since a response cannot exceed the served context.
#
# modalities: the base model additionally declares audio input, which is not served for this
# model, so input is overridden to text+image rather than advertising an input that would be
# rejected.
base_model = "thinkingmachines/inkling"

[cost]
input = 1.87
output = 4.68
cache_read = 0.374

[limit]
context = 65_536
output = 65_536

[modalities]
input = ["text", "image"]
output = ["text"]

[[reasoning_options]]
type = "effort"
values = ["none", "minimal", "low", "medium", "high", "xhigh"]
