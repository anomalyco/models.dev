# Pricing: https://api.impossibl.com/v1/models
# Sources (accessed 2026-07-28):
# - https://tinker-docs.thinkingmachines.ai/tinker/models/ (served context + pricing)
# - https://tinker-docs.thinkingmachines.ai/tinker/compatible-apis/anthropic/ (effort control)
#
# limit: unlike Impossibl's other entries this route is FIXED to a single upstream —
# Thinking Machines' own Tinker API — so the served window is Tinker's 64K tier. That
# matches the first-party entry in this repo (providers/thinkingmachines/models/
# thinkingmachines/Inkling.toml), which publishes the same 65_536/65_536 limits and the
# same 1.87/4.68/0.374 pricing. Tinker's 256K window is a separately priced tier
# (Inkling:peft:262144, 3.74/9.36), not this route. The base model omits limit.output
# because the served cap varies by host (16_384 NVIDIA, 32_768 Baseten, 1_048_576
# OpenRouter), so each provider entry supplies its own; context is overridden for the
# same reason.
#
# reasoning_options: Tinker documents its effort control only on the ANTHROPIC-compatible
# surface — {"output_config":{"effort":"low"|"medium"|"high"|"xhigh"|"max"}}, with
# {"thinking":{"type":"disabled"}} to turn reasoning off. Impossibl reaches Tinker over its
# OPENAI-compatible endpoint (/oai/api/v1), for which no reasoning control is documented,
# so none is asserted here. Compare providers/nvidia, which publishes [] for the same
# reason. The differing ladders other hosts publish for this one model (xhigh but no max on
# Baseten, max but no xhigh on OpenRouter, four rungs on Venice) describe each host's
# surface rather than Inkling itself.
base_model = "thinkingmachines/inkling"
reasoning_options = []

[cost]
input = 1.87
output = 4.68
cache_read = 0.374

[limit]
context = 65_536
output = 65_536
