# Pricing: https://api.impossibl.com/v1/models
base_model = "thinkingmachines/inkling"
# Impossibl forwards reasoning_effort verbatim to whichever upstream serves the model; it
# is not validated or mapped per model, so the values a request happens to be accepted with
# describe the serving host request validator, not this model. No per-model control set can
# be asserted from this API surface (verified 2026-07-28).
reasoning_options = []

[cost]
input = 1.87
output = 4.68
cache_read = 0.374

# The base model omits limit.output because it varies per host, so every provider entry
# supplies its own. Impossibl serves this model through Thinking Machines' own Tinker API,
# so their published served limits apply verbatim (providers/thinkingmachines/models/
# thinkingmachines/Inkling.toml, sourced from https://tinker-docs.thinkingmachines.ai/tinker/models/).
[limit]
context = 65_536
output = 65_536
