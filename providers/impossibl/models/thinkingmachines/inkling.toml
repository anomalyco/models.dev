# Pricing: https://api.impossibl.com/v1/models
# reasoning_options: Impossibl forwards reasoning_effort verbatim to whichever upstream
# serves the model; it is not validated or mapped per model, so the values a request
# happens to be accepted with describe the serving host request validator, not this model.
# No per-model control set can be asserted from this API surface (verified 2026-07-28).
# limit: the base model omits limit.output because the served output cap varies by host, so
# each provider entry supplies its own. Impossibl serves Inkling through Thinking Machines
# Tinker API at its 64K served context, matching the gateway catalog
# (https://api.impossibl.com/v1/models; https://tinker-docs.thinkingmachines.ai/tinker/models/).
base_model = "thinkingmachines/inkling"
reasoning_options = []

[cost]
input = 1.87
output = 4.68
cache_read = 0.374

[limit]
context = 65_536
output = 65_536
