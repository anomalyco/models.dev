# Pricing: https://api.impossibl.com/v1/models
base_model = "openai/gpt-5-nano"
# Impossibl forwards reasoning_effort verbatim to whichever upstream serves the model; it
# is not validated or mapped per model, so the values a request happens to be accepted with
# describe the serving host request validator, not this model. No per-model control set can
# be asserted from this API surface (verified 2026-07-28).
reasoning_options = []

[cost]
input = 0.05
output = 0.40
cache_read = 0.005
