# Pricing: https://api.impossibl.com/v1/models
# Billing (https://impossibl.com/docs/billing): prepaid credits at the GET /v1/models rates, no usage
# markup; buying credits adds a 5% platform fee (not representable here). Catalog checked 2026-10-21.
# Reasoning (https://impossibl.com/docs/reasoning): Chat Completions reasoning_effort / Responses reasoning.effort
# accept none|minimal|low|medium|high|xhigh|max and move to the nearest level the model has.
# Toggle: {"reasoning_effort":"none"}
schema = 2
base_model = "zhipuai/glm-5"

[capabilities]
reasoning = { supported = true, toggle = true }

[cost.text.input]
price = 1
cache = { read = 0.2 }

[cost.text.output]
price = 3.2
