# Source: https://hallpassai.com/models.json (checked 2026-11-27)
# Toggle: thinking.type = adaptive|enabled|disabled; budget_tokens >= 1024 on /v1/messages.
# Protocols: models.json lists ["chat/completions", "messages"] (no /v1/responses endpoint for this model).
schema = 2
base_model = "anthropic/claude-opus-4-6"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "max"], budget = { min = 1_024 } }
cache = { explicit = true }

[api.chat-completions]

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 5
cache = { read = 0.5, write = 6.25 }

[cost.text.output]
price = 25
