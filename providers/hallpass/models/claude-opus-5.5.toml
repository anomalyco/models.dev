# Source: https://hallpassai.com/models.json (checked 2026-11-27)
# HallPass forwards reasoning_effort verbatim to upstream Anthropic.
# Protocols: models.json lists ["chat/completions", "messages"] (no /v1/responses endpoint for this model).
schema = 2
base_model = "anthropic/claude-opus-5-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"], default = { type = "effort", value = "medium" } }
cache = { explicit = true }

[api.chat-completions]

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 4
cache = { read = 0.2, write = 5 }

[cost.text.output]
price = 20
