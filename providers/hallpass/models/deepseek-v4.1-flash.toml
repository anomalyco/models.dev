# Source: https://hallpassai.com/models.json (checked 2026-11-27)
# Toggle: thinking.type = enabled|disabled on /v1/messages; reasoning_effort is forwarded verbatim.
# Chat Completions emits reasoning_content for interleaved reasoning.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"], default = { type = "effort", value = "high" } }
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.15
cache = { read = 0.007 }

[cost.text.output]
price = 0.6
