# Prices: FreeModel's site price table (https://freemodel.dev, bundled cost table, checked 2026-10-21), USD per 1M tokens.
schema = 2
base_model = "openai/gpt-5.4-mini"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true

[api.chat-completions]
base_url = "https://api.freemodel.dev/v1"
sdk = { aisdk = "@ai-sdk/openai-compatible" }

[cost.text.input]
price = 0.75
cache = { read = 0.075, write = 0.75 }

[cost.text.output]
price = 4.5
