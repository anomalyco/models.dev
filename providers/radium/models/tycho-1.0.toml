# Radium is the first-party provider of this model, so this is a full definition.
# Sources (accessed 2026-11-16): https://docs.radium.cloud/models/tycho (128,000 context, 8,192
# output cap, USD prices, cached-input price; reasoning and vision not supported),
# https://docs.radium.cloud/models/overview (capabilities matrix),
# https://docs.radium.cloud/core-concepts/compatibility-and-limits (temperature 0-2, top_p 0-1;
# JSON mode only on tycho-1.0, JSON schema on hal-1.0 and clarke-1.0; cache_control on all
# models; no Responses API),
# https://docs.radium.cloud/core-concepts/tool-calling (strict schema validation on all three;
# multi-step tool loops are "Limited" on this model), and
# https://docs.radium.cloud/guides/provenance (initial release).
# Prices: USD per 1M tokens as published, no conversion: $0.10 in / $0.02 cached in / $1.50 out.
# Radium states pricing is dynamic (https://radium.cloud/pricing).
# Cache: cache_control markers are documented, so explicit caching is listed; usage also reports
# cached_tokens without any marker, so implicit caching is listed too. Cache hits bill at
# 20% of the input price. No cache write price, TTL or breakpoint limit is published.
# structured_output is left out: this model supports JSON mode but not JSON schema.
# Release date: the provenance page gives "Q2 2026" and a version stamp of tycho-1.0-20260101,
# which disagree; the month the quarter starts is used.
# top_k: not in Radium's docs, but top_k = 1 gave identical output on 8 of 8 runs at temperature 2
# against varied output without it, so top_k = true.
# Docs followed over the live probe: the probe saw this model emit reasoning, accept images and
# enforce a JSON schema, but Radium documents no reasoning, no vision and JSON mode only.
# Knowledge cutoff is not published by Radium.
schema = 2
name = "Tycho 1.0"
description = "Radium's fast efficiency tier for high-volume classification, extraction, summarization and routing"
open_weights = false
release_date = "2026-04"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, strict = true }
reasoning = { supported = false }
cache = { implicit = true, explicit = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 128_000
output = 8_192

[api.chat-completions]

[api.messages]
base_url = "https://api.radium.cloud/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.10
cache = { read = 0.02 }

[cost.text.output]
price = 1.50
