# Catalog: https://console.tenstorrent.com/v1/openrouter/models (2026-11-04): text input only, 1M context, fp8,
# USD per token prompt 0.00000005, cached_prompt 0.000000005, completion 0.0000002.
# The feed lists max_tokens up to 1M (the whole context window); output keeps the lab's 512K.
# Effort: reasoning_effort = none|low|medium|high|xhigh|max (none = thinking off), the same ladder as Nebius.
#   Live probe 2026-11-04 on /v1/chat/completions, temperature 0, 3 runs each: none -> no reasoning; every other
#   level is accepted (51-52 reasoning tokens), and levels weren't separable on the test prompt. The no-effort
#   baseline matches max. chat_template_kwargs.enable_thinking = false and thinking.type = disabled also turn
#   thinking off but duplicate effort=none.
# Modalities: text only, verified live 2026-11-05. Image and video parts return 200 but are dropped: prompt tokens
#   are 213 with a PNG, JPEG, WebP, GIF, BMP, TIFF or HEIC image and 212 with none, every image is described as
#   "White" whatever its real color, and for MP4 and QuickTime video the model says nothing was attached. A PDF file
#   part returns 400.
# Reasoning is returned in message.reasoning_content.
# Tools: tool_choice auto and none work; required and named return 400 ("this worker does not implement:
#   guided_decoding"), as does response_format json_schema, so structured_output is not set (live 2026-11-04).
schema = 2
base_model = "minimax/MiniMax-M3.1-Flash"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none"] }
reasoning = { supported = true, default = { type = "effort", value = "max" }, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.05
cache = { read = 0.005 }

[cost.text.output]
price = 0.2
