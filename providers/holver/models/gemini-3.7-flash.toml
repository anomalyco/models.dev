# Served by Holver (https://api.holver.id/v1, OpenAI-compatible,
# Bearer $HOLVER_API_KEY). Catalog: https://holver.id/models.
# Holver bills via credit packages, not per-model USD rates, so cost is
# intentionally omitted.
# Reasoning on this host: Holver forwards only the OpenAI-style top-level
# `reasoning_effort` field upstream (`thinking`/`enable_thinking`/
# `thinking_budget` are not on Holver's chat-completions forward whitelist, and
# Holver's /v1/messages translation drops Anthropic `thinking` before
# forwarding). Holver does not interpret `reasoning_effort` itself — it passes
# it through to the routed upstream model, so the lab's own effort levels apply.
base_model = "google/gemini-3.7-flash"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high"] }]
