# Served by Holver (https://api.holver.id/v1, OpenAI-compatible,
# Bearer $HOLVER_API_KEY). Catalog: https://holver.id/models.
# Holver bills via credit packages, not per-model USD rates, so cost is
# intentionally omitted.
# Reasoning on this host: Holver forwards only the OpenAI-style top-level
# `reasoning_effort` field upstream. The Anthropic-native `thinking.budget_tokens`
# control is not reachable: Holver's chat-completions whitelist excludes it and
# the /v1/messages translation drops `thinking` before forwarding. Holver does
# not interpret `reasoning_effort` — it passes it through to the routed Claude
# endpoint, so the effort ladder is used.
base_model = "anthropic/claude-opus-5"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]
