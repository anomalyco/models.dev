# Sherlock's published Chat request surface documents no toggle, effort, or
# reasoning-token budget for this reasoning-only model.
# https://docs.sherlock.cloudferro.com/ (accessed 2026-06-25)
# knowledge: unsourced host value kept from the v1 file so v1 doesn't change.
schema = 2
base_model = "minimax/MiniMax-M2.5"
description = "MiniMax model for chat, coding, office work, and agentic tasks"
knowledge = "2026-01"

[capabilities]
reasoning = { supported = true }
structured_output = true

[limit]
context = 196_000
input = 180_000
output = 16_000

[cost.text.input]
price = 0.3

[cost.text.output]
price = 1.2
