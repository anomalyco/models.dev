# Cost: GreenPT EUR list prices (EUR 0.44 in / EUR 2.20 out / EUR 0.11 cache read per 1M)
# converted at 1.1215 USD/EUR (ECB, 2026-10-20), the rate minimax-m2.5 uses at the same EUR price.
# Sources: https://docs.greenpt.ai/pricing and https://docs.greenpt.ai/model-cards
# FX: https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/eurofxref-graph-usd.en.html
# Effort: reasoning_effort = none|minimal|low|medium|high (https://docs.greenpt.ai/reasoning);
# xhigh and max are refused with a 400. Measured on a multi-step maths prompt: none and minimal
# return no reasoning; low, medium and high reason (about 1.4k to 6k reasoning tokens, with
# little difference between the levels). A thinking = { type = ... } body field is ignored, so
# reasoning_effort is the only control and no toggle is authored.
# Input: JPEG, PNG, GIF and WebP images are read; video is not offered.
# Tool calls and response_format json_schema work; max_completion_tokens 512000 is accepted.
# Checked on api.greenpt.ai 2026-11-19.
# Cache writes are not charged: https://docs.greenpt.ai/prompt-caching
schema = 2
base_model = "minimax/MiniMax-M3"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 0.49346
cache = { read = 0.123365 }

[cost.text.output]
price = 2.4673
