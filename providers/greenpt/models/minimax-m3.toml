# Cost: converted from GreenPT's EUR list price at 1.14 USD/EUR (rate captured 2026-07-24).
# Sources: https://docs.greenpt.ai/pricing and https://docs.greenpt.ai/model-cards
# reasoning_effort: GreenPT documents minimal, low, medium and high for minimax-m3 in the
# per-model table at https://docs.greenpt.ai/reasoning, and refuses "none" (thinking cannot be
# turned off) and any unlisted value with a 400. GreenPT forwards the level to the model; on the
# production API (2026-10-19) one prompt spent about 290 / 480 / 610 / 970 reasoning tokens at
# minimal / low / medium / high.
# cache_read: discounted rate for cached prompt tokens. Cache writes are not
# charged. See https://docs.greenpt.ai/prompt-caching
base_model = "minimax/MiniMax-M3"
structured_output = true
reasoning_options = [{ type = "effort", values = ["minimal", "low", "medium", "high"] }]

[cost]
input = 0.5016
cache_read = 0.1254
output = 2.508

[limit]
context = 1_000_000
output = 64_000

[modalities]
input = ["text", "image"]
