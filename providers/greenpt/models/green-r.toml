# Cost: converted from GreenPT's EUR list price at 1.14 USD/EUR (rate captured 2026-07-24).
# Sources: https://docs.greenpt.ai/pricing and https://docs.greenpt.ai/model-cards
# reasoning_effort: this endpoint accepts only the values below; the remaining
# documented values are rejected with a 400. Verified against the production API.
# See https://docs.greenpt.ai/chat-completion
# Limits: max_completion_tokens above 32768 is refused with a 400 ("max_completion_tokens is
# limited to 32768 for gpt-oss-120b"); 32768 is accepted, and a 130k-token prompt is answered.
# Input: text only. An attached image is not seen by the model (it asks for the image).
# Checked on api.greenpt.ai 2026-11-19.
schema = 2
base_model = "openai/gpt-oss-120b"
name = "Green R"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
output = 32_768

[cost.text.input]
price = 0.399

[cost.text.output]
price = 1.083
