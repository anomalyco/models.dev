# Cost: GreenPT EUR list prices (EUR 0.36 in / EUR 1.45 out / EUR 0.04 cache read per 1M)
# converted at 1.1172 USD/EUR (ECB, 2026-10-30).
# Sources: https://docs.greenpt.ai/pricing and https://docs.greenpt.ai/model-cards
# FX: https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/eurofxref-graph-usd.en.html
# Effort: reasoning_effort = none|minimal|low|medium|high, the set GreenPT documents and
# validates for this model (https://docs.greenpt.ai/reasoning); no budget field.
# none turns thinking off (usage.reasoning_tokens = 0, no reasoning_content). max is
# refused with a 400: `deepseek-v4.1-flash-1017 does not accept reasoning_effort "max"`.
# thinking = { type = "disabled" } is also forwarded (reasoning_tokens = 0); not authored
# as a toggle because none is already in the effort list. Without either, the model reasons.
# Structured output: response_format json_schema is refused with a 400 ("does not support
# JSON schema mode. Use 'json_object' mode instead"); json_object works.
# Checked on api.greenpt.ai 2026-11-01.
# Cache writes are not charged: https://docs.greenpt.ai/prompt-caching
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high"] }
structured_output = false

[cost.text.input]
price = 0.402192
cache = { read = 0.044688 }

[cost.text.output]
price = 1.61994
