# Cost: GreenPT EUR list prices (EUR 0.36 in / EUR 1.45 out / EUR 0.04 cache read per 1M)
# converted at 1.1172 USD/EUR (ECB, 2026-10-30).
# Sources: https://docs.greenpt.ai/pricing and https://docs.greenpt.ai/model-cards
# FX: https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/eurofxref-graph-usd.en.html
# Effort: reasoning_effort is the host's only control; no toggle and no budget field.
# GreenPT accepts none|minimal|low|medium|high (https://docs.greenpt.ai/reasoning) and
# forwards the value unchanged. The published levels are the distinct ones: the lab's
# low/high plus none, which turns thinking off (usage.reasoning_tokens = 0, no
# reasoning_content). minimal and medium are accepted but are the lab's aliases for low
# and high, and do not separate here. max is refused before it reaches the model:
# 400 `deepseek-v4.1-flash-1017 does not accept reasoning_effort "max"`.
# Measured on api.greenpt.ai 2026-11-01, 3 samples per level, reasoning tokens on one
# prompt: minimal 580-954, low 742-912, medium 1067-1300, high 752-997.
# Cache writes are not charged: https://docs.greenpt.ai/prompt-caching
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high"] }
structured_output = true

[cost.text.input]
price = 0.402192
cache = { read = 0.044688 }

[cost.text.output]
price = 1.61994
