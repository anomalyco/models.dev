# Cost: GreenPT EUR list prices (EUR 0.44 input / 0.11 cached / 2.20 output per 1M, https://api.greenpt.ai/v1/pricing (accessed 2026-10-21); the id is not on the model-cards page) converted at 1.1215 USD/EUR (ECB, 2026-10-20).
# FX: https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/eurofxref-graph-usd.en.html
# Sources: https://docs.greenpt.ai/pricing and https://docs.greenpt.ai/model-cards
# reasoning_effort: thinking is enabled by default and "none" disables it.
# Values verified against the production API. See https://docs.greenpt.ai/chat-completion
# cache_read: discounted rate for cached prompt tokens. Cache writes are not
# charged. See https://docs.greenpt.ai/prompt-caching
# Served by minimax-m3: GreenPT answers this id with minimax-m3 and bills it at that price
# (https://docs.greenpt.ai/support/changelog, 5 October 2026), so base_model is MiniMax-M3,
# as green-r points at gpt-oss-120b. On this id JPEG, PNG, GIF, WebP, BMP and TIFF images
# are read (HEIC and HEIF are refused with a 400 (the image cannot be decoded)),
# max_completion_tokens 512000 and a 259k-token prompt are accepted, and reasoning_effort
# none|minimal|low|medium|high is accepted (xhigh is a 400); tool calls and
# response_format json_schema work. Checked on api.greenpt.ai 2026-11-20.
schema = 2
base_model = "minimax/MiniMax-M3"
name = "MiniMax-M2.5"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/tiff"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.49346
cache = { read = 0.123365 }

[cost.text.output]
price = 2.4673
