# Cost: GreenPT EUR list prices (EUR 0.77 input / 0.198 cached / 3.85 output per 1M; cached input raised from 0.165 on 2026-09-24, model-cards change log; https://api.greenpt.ai/v1/pricing) converted at 1.1215 USD/EUR (ECB, 2026-10-20).
# FX: https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/eurofxref-graph-usd.en.html
# Sources: https://docs.greenpt.ai/pricing and https://docs.greenpt.ai/model-cards
# reasoning_effort: thinking is enabled by default and "none" disables it.
# Values verified against the production API. See https://docs.greenpt.ai/chat-completion
# cache_read: discounted rate for cached prompt tokens. Cache writes are not
# charged. See https://docs.greenpt.ai/prompt-caching
schema = 2
base_model = "moonshotai/kimi-k2.7-code"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 0.863555
cache = { read = 0.222057 }

[cost.text.output]
price = 4.317775
