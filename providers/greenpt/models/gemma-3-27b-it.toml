# Cost: converted from GreenPT's EUR list price at 1.14 USD/EUR (rate captured 2026-07-24).
# Sources: https://docs.greenpt.ai/pricing and https://docs.greenpt.ai/model-cards
schema = 2
name = "Gemma 3 27B"
description = "Google Gemma 3 multimodal model for chat, reasoning, and image understanding"
family = "gemma"
open_weights = true
knowledge = "2024-08"
release_date = "2025-03-12"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
structured_output = true
temperature = true

[limit]
context = 40_000
output = 8_192

[cost.text.input]
price = 0.342

[cost.text.output]
price = 0.684
