# Cost: converted from GreenPT's EUR list price at 1.14 USD/EUR (rate captured 2026-07-24).
# Sources: https://docs.greenpt.ai/pricing and https://docs.greenpt.ai/model-cards
# GreenPT accepts reasoning_effort = none|minimal|low|medium|high.
# Source: https://docs.greenpt.ai/reasoning
# Cache writes are not charged: https://docs.greenpt.ai/prompt-caching
# structured_output = false: on the production API (2026-10-20) a response_format of type
# json_schema returns 400 "The model 'glm-5.3-flash' does not support JSON schema mode. Use
# 'json_object' mode instead"; json_object returns 200 with valid JSON.
base_model = "zhipuai/glm-5.3-flash"
reasoning_options = [{ type = "effort", values = ["none", "minimal", "low", "medium", "high"] }]
structured_output = false

[cost]
input = 0.1254
cache_read = 0.02508
output = 0.5016

[modalities]
input = ["text", "image"]
