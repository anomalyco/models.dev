# Cost: converted from GreenPT's EUR list price at 1.14 USD/EUR (rate captured 2026-07-24).
# Sources: https://docs.greenpt.ai/pricing and https://docs.greenpt.ai/model-cards
# reasoning_effort: thinking is enabled by default and "none" disables it.
# Values verified against the production API. See https://docs.greenpt.ai/chat-completion
# Input: BMP, JPEG, PNG, TIFF and WebP images are read; HEIC is refused with a 400 (the image
# cannot be decoded). Checked on api.greenpt.ai 2026-11-20.
schema = 2
base_model = "alibaba/qwen3.6-35b-a3b"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high"] }
structured_output = true

[limit]
output = 32_768

[cost.text.input]
price = 0.342

[cost.text.output]
price = 2.052
