# Cost: converted from GreenPT's EUR list price at 1.14 USD/EUR (rate captured 2026-07-24).
# Sources: https://docs.greenpt.ai/pricing and https://docs.greenpt.ai/model-cards
# Speech-to-text is billed per hour of audio and converted to a per-minute USD
# rate for this catalog. cost.input is the standard EUR 0.23/hour pre-recorded
# rate (0.23 / 60 * 1.14 = 0.00437). A 50% promotion runs through 2026-08-31
# (EUR 0.12/hour, about USD 0.00228/minute); the durable standard rate is
# published here so the catalog stays correct after the promotion ends.
# Live and multilingual tiers are priced higher and cannot be represented in
# this single-rate field.
