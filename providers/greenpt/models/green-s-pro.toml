# Sources: https://docs.greenpt.ai/pricing and https://docs.greenpt.ai/model-cards (accessed 2026-10-21).
# Speech-to-text, billed per hour of audio: EUR 0.23/hour pre-recorded (standard rate; the 50% launch promotion
# ended 2026-08-31). Converted at 1.14 USD/EUR (rate captured 2026-07-24): 0.23 * 1.14 / 60 = USD 0.00437 per minute.
# v1 has no per-minute price, so v1 shows no cost.
# Needs discussion: live audio (EUR 0.31/hour), multilingual pre-recorded (EUR 0.28/hour), multilingual live
# (EUR 0.37/hour) and the add-ons (redaction, entity detection, streaming diarization, keyterm prompting; free during
# the promo) have no v2 condition. Multichannel audio is billed per channel.
# The host lists no audio formats, so modalities stay generic.
schema = 2
type = "transcription"
name = "Green S Pro"
description = "GreenPT advanced speech-to-text model with multilingual transcription support"
open_weights = false
release_date = "2025-02"

[modalities]
input = ["audio"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false

[limit]
context = 0
output = 8_192

[cost.audio.input]
unit = "minute"
price = 0.00437
