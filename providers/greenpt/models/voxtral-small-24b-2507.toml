# Cost: converted from GreenPT's EUR list price at 1.14 USD/EUR (rate captured 2026-07-24).
# Sources: https://docs.greenpt.ai/pricing and https://docs.greenpt.ai/model-cards
schema = 2
name = "Voxtral Small 24B"
description = "Mistral Voxtral audio-understanding model for speech and transcription tasks"
family = "mistral"
open_weights = true
knowledge = "2025-07"
release_date = "2025-07-15"

[modalities]
input = ["text", "audio"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
structured_output = false
temperature = true

[limit]
context = 32_768
output = 16_384

[cost.text.input]
price = 0.228

[cost.text.output]
price = 0.513
