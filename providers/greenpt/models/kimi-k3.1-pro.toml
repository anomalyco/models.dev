# Cost: GreenPT EUR list prices (EUR 3.30 in / EUR 16.50 out / EUR 0.825 cache read per 1M)
# converted at 1.14 USD/EUR (rate captured 2026-08-01, as kimi-k3 at the same EUR price).
# Sources: https://docs.greenpt.ai/pricing and https://docs.greenpt.ai/model-cards
# FX: https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/eurofxref-graph-usd.en.html
# Effort: reasoning_effort = none|minimal|low|medium|high (https://docs.greenpt.ai/reasoning);
# none turns thinking off (reasoning_tokens = 0); xhigh and max are refused with a 400. On a
# multi-step maths prompt reasoning grows with the level (minimal ~0.4-0.5k, low ~0.5-0.9k,
# high ~2.8-3k reasoning tokens).
# Input: JPEG, PNG, GIF and WebP images are read; video is not offered.
# Tool calls and response_format json_schema work; max_completion_tokens 1045000 is accepted.
# Checked on api.greenpt.ai 2026-11-19.
# Cache writes are not charged: https://docs.greenpt.ai/prompt-caching
schema = 2
base_model = "moonshotai/kimi-k3.1-pro"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 3.762
cache = { read = 0.9405 }

[cost.text.output]
price = 18.81
