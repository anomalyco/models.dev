# Linked to openai/gpt-oss-20b (Databricks endpoint databricks-gpt-oss-20b).
# Output 25_000 is the existing host value (same cap as gpt-oss-120b, measured there 2026-08-08).
# Catalog: https://neon.com/models.json and https://neon.com/docs/ai-gateway/overview (accessed 2026-10-21).
schema = 2
base_model = "openai/gpt-oss-20b"
description = "Open-weight GPT model for self-hosted reasoning and instruction-following workloads"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
output = 25_000

[cost.text.input]
price = 0.07

[cost.text.output]
price = 0.3
