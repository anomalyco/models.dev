base_model = "openai/gpt-5.1-codex-max"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh"] }]

[cost]
input = 1.25
output = 10
cache_read = 0.125

[modalities]
input = ["text", "image"]
output = ["text", "image"]

[provider]
npm = "@ai-sdk/openai"
api = "${NEON_AI_GATEWAY_BASE_URL}/ai-gateway/openai/v1"
shape = "responses"
