# Cost: https://neon.com/models.json grok-4-7 (USD / 1M tokens).
# Effort: Chat Completions `reasoning_effort` and Responses `reasoning.effort`,
# same lab/peer set as grok-4-6. Native dialect is openai-responses.
# Output limit is inherited (500_000): 500_001 returns 200; no response names a cap.
schema = 2
base_model = "xai/grok-4.7"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true

[api.responses]
base_url = "${NEON_AI_GATEWAY_BASE_URL}/openai/v1"
sdk = { aisdk = "@ai-sdk/openai" }

[cost.text.input]
price = 2.5
cache = { read = 0.5 }

[cost.text.output]
price = 7.5
