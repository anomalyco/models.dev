# Cost: https://neon.com/models.json grok-4-7 (USD / 1M tokens).
# Effort: Chat Completions `reasoning_effort` and Responses `reasoning.effort`,
# same lab/peer set as grok-4-6. Native dialect is openai-responses.
# Output limit is inherited (500_000): 500_001 returns 200; no response names a cap.
# Cache: implicit. neon.com/models.json publishes a cache_read price for this model (accessed 2026-10-21), and none of
# Neon's routes for it take a cache-control field (Neon documents cache_control only for Claude on /anthropic/v1/messages),
# so cached reads can only come from automatic prefix caching.
# Catalog: https://neon.com/models.json and https://neon.com/docs/ai-gateway/overview (accessed 2026-10-21).
# Modalities: text only. Neon's docs overview table lists inputs "text" and models.json has input ["text"], attachment false.
schema = 2
base_model = "xai/grok-4.7"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
cache = { implicit = true }

[api.responses]
base_url = "${NEON_AI_GATEWAY_BASE_URL}/openai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }
legacy_shape = "responses"

[cost.text.input]
price = 2.5
cache = { read = 0.5 }

[cost.text.output]
price = 7.5
