# The gateway does not honour response_format json_schema here: it answers
# 200 with finish_reason "abort" and empty content, with strict true or
# false, at any token budget. Plain requests work. Measured 2026-08-08.
# Toggle: {"thinking": {"type": "enabled"|"disabled"}}
# Effort: {"reasoning_effort": <v>}
# The Neon gateway caps output below the upstream entry: `max_tokens` one above
# 65_536 returns 400. Measured at the boundary 2026-08-08. `context` is inherited.
schema = 2
base_model = "thinkingmachines/inkling"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["none", "minimal", "low", "medium", "high", "max"] }
structured_output = false

[limit]
output = 65_536

[cost.text.input]
price = 1
cache = { read = 0.17 }

[cost.text.output]
price = 4.05
