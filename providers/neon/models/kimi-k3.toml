# The Neon gateway accepts `temperature` on this model; the base entry says
# otherwise because the upstream provider rejects it. Measured 2026-08-07.
# Toggle: {"thinking": {"type": "enabled"|"disabled"}}
# Effort: {"reasoning_effort": <v>}
# The Neon gateway caps output below the upstream entry: `max_tokens` one above
# 65_536 returns 400. Measured at the boundary 2026-08-08. `context` is inherited.
schema = 2
base_model = "moonshotai/kimi-k3"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["none", "minimal", "low", "medium", "high", "max"] }
structured_output = true
temperature = true

[limit]
output = 65_536

[cost.text.input]
price = 3
cache = { read = 0.3 }

[cost.text.output]
price = 15
