# Chat Completions `reasoning_effort` is rejected (`Extra inputs are not permitted`).
# Effort is the Anthropic Messages control: thinking.type adaptive + output_config.effort.
# No toggle: thinking.type.disabled is rejected, same as claude-fable-5-1.
# json_schema on /v1/chat/completions is translated via forced tool use; this
# model rejects that (INVALID_PARAMETER_VALUE). Measured 2026-10-03.
schema = 2
base_model = "anthropic/claude-opus-5-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = false

[cost.text.input]
price = 4
cache = { read = 0.2, write = 5 }

[cost.text.output]
price = 20
