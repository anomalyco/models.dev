# Cost: https://neon.com/models.json gemini-3-8-flash (USD / 1M tokens).
# Google's own API takes temperature; the Neon gateway answers
# "Model gemini-3.8-flash does not support the temperature parameter".
# `minimal` effort is rejected: "Thinking level is unsupported: THINKING_LEVEL_MINIMAL".
# Measured 2026-10-13.
schema = 2
base_model = "google/gemini-3.8-flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
temperature = false

[cost.text.input]
price = 1.5
cache = { read = 0.15 }

[cost.text.output]
price = 7.5
