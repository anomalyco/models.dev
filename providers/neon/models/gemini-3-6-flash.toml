# Google's own API takes temperature; the Neon gateway does not, and answers
# `BAD_REQUEST: Model gemini-3.6-flash does not support the temperature
# parameter`. Measured 2026-08-07. Inheriting the base value would advertise a
# parameter every caller gets a 400 for.
# Cache: implicit. neon.com/models.json publishes a cache_read price for this model (accessed 2026-10-21), and none of
# Neon's routes for it take a cache-control field (Neon documents cache_control only for Claude on /anthropic/v1/messages),
# so cached reads can only come from automatic prefix caching.
# Catalog: https://neon.com/models.json and https://neon.com/docs/ai-gateway/overview (accessed 2026-10-21).
schema = 2
base_model = "google/gemini-3.6-flash"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true
temperature = false
cache = { implicit = true }

[api.chat-completions]

[api.generate-content]
base_url = "${NEON_AI_GATEWAY_BASE_URL}/gemini/v1beta"
sdk = { aisdk = "@ai-sdk/google", opencodeai = "@opencode/ai/providers/google" }

[cost.text.input]
price = 1.5
cache = { read = 0.15 }

[cost.text.output]
price = 7.5

[cost.audio.input]
price = 1.5
