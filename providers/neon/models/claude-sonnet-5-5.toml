# Cost: https://neon.com/models.json claude-sonnet-5-5 (USD / 1M tokens).
# json_schema on /v1/chat/completions is translated via forced tool use; this
# model rejects that ("Structured output is not supported for this model because
# its translation requires forced tool use"). Measured 2026-10-13.
# No toggle: thinking.type.disabled is rejected ("send thinking.type between_tools
# instead"), same as claude-opus-5-5.
schema = 2
base_model = "anthropic/claude-sonnet-5-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = false

[cost.text.input]
price = 2
cache = { read = 0.2, write = 2.5 }

[cost.text.output]
price = 10
