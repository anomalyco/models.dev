# Cost: https://neon.com/models.json claude-sonnet-5-5 (USD / 1M tokens).
# json_schema on /v1/chat/completions is translated via forced tool use; this
# model rejects that ("Structured output is not supported for this model because
# its translation requires forced tool use"). Measured 2026-10-13.
# No toggle: thinking.type.disabled is rejected ("send thinking.type between_tools
# instead"), same as claude-opus-5-5.
# Catalog: https://neon.com/models.json and https://neon.com/docs/ai-gateway/overview (accessed 2026-10-21).
# Cache: explicit. POST /anthropic/v1/messages forwards `cache_control` unchanged and caching "works exactly as described"
# in Anthropic's docs (https://neon.com/docs/ai-gateway/anthropic-messages#prompt-caching); breakpoints, targets and
# min_tokens follow providers/anthropic. Only 5m is listed because Neon publishes a single cache_write price.
# Effort: {"thinking": {"type": "adaptive"}, "output_config": {"effort": <v>}}
schema = 2
base_model = "anthropic/claude-sonnet-5-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = false
cache = { supported = true, implicit = false, explicit = { ttl = ["5m"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 512 } }

[cost.text.input]
price = 2
cache = { read = 0.2, write = 2.5 }

[cost.text.output]
price = 10
