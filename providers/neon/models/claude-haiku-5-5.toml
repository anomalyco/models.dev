# Cost: https://neon.com/models.json claude-haiku-5-5 (USD / 1M tokens).
# json_schema on /v1/chat/completions is translated via forced tool use; this
# model rejects that ("Structured output is not supported for this model because
# its translation requires forced tool use"). Measured 2026-10-13.
schema = 2
base_model = "anthropic/claude-haiku-5-5"

[capabilities]
reasoning = { supported = true, toggle = true, budget = { min = 1_024, max = 63_999 } }
structured_output = false

[cost.text.input]
price = 0.1
cache = { read = 0.01, write = 0.125 }

[[cost.text.input.overrides]]
when = { context = { gt = 100_000 } }
price = 0.5
cache = { read = 0.05, write = 0.625 }

[cost.text.output]
price = 0.5

[[cost.text.output.overrides]]
when = { context = { gt = 100_000 } }
price = 2.5
