base_model = "openai/gpt-5"
reasoning_options = [{ type = "effort", values = ["minimal", "low", "medium", "high"] }]

[cost]
input = 1.25
output = 10
cache_read = 0.125

[modalities]
input = ["text", "image"]
output = ["text", "image"]

[provider]
npm = "@ai-sdk/openai"
api = "${NEON_AI_GATEWAY_BASE_URL}/openai/v1"
shape = "responses"
