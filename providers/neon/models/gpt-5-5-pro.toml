# Served only on the Responses API: /v1/chat/completions returns
# `model "gpt-5-5-pro" is not available on the chat_completions endpoint`.
# Modalities: the lab's. Image generation through the Responses `image_generation` tool doesn't make the model an
# image-output model, so output is the lab's text.
# Catalog: https://neon.com/models.json and https://neon.com/docs/ai-gateway/overview (accessed 2026-10-21).
schema = 2
base_model = "openai/gpt-5.5-pro"

[capabilities]
reasoning = { supported = true, effort = ["medium", "high", "xhigh"] }
structured_output = true

[api.responses]
base_url = "${NEON_AI_GATEWAY_BASE_URL}/openai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }
legacy_shape = "responses"

[cost.text.input]
price = 30

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 60

[cost.text.output]
price = 180

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 270
