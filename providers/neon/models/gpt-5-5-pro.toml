# Served only on the Responses API: /v1/chat/completions returns
# `model "gpt-5-5-pro" is not available on the chat_completions endpoint`.
base_model = "openai/gpt-5.5-pro"
reasoning_options = [{ type = "effort", values = ["medium", "high", "xhigh"] }]

[cost]
input = 30
output = 180

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 60
output = 270

[modalities]
input = ["text", "image", "pdf"]
output = ["text", "image"]

[provider]
npm = "@ai-sdk/openai"
api = "${NEON_AI_GATEWAY_BASE_URL}/openai/v1"
shape = "responses"
