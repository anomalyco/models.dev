# Served only on the Responses API: /v1/chat/completions returns
# `model "gpt-5-5-pro" is not available on the chat_completions endpoint`.
# Modalities: input image types are the lab's (v2 modalities replace the lab's as a whole, so input is restated).
# Image output is the existing v1 value and neon.com/models.json lists output ["text", "image"]; Neon serves it with the
# Responses `image_generation` tool
# (https://neon.com/docs/ai-gateway/openai-responses), whose output_format is png, jpeg or webp:
# https://developers.openai.com/api/docs/guides/tools-image-generation
# Catalog: https://neon.com/models.json and https://neon.com/docs/ai-gateway/overview (accessed 2026-10-21).
schema = 2
base_model = "openai/gpt-5.5-pro"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text", "image/png", "image/jpeg", "image/webp"]

[capabilities]
reasoning = { supported = true, effort = ["medium", "high", "xhigh"] }
structured_output = true

[api.responses]
base_url = "${NEON_AI_GATEWAY_BASE_URL}/openai/v1"
sdk = { aisdk = "@ai-sdk/openai" }

[cost.text.input]
price = 30

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 60

[cost.text.output]
price = 180

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 270
