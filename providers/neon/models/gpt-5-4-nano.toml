# The Neon gateway accepts `temperature` on this model; the base entry says
# otherwise because the upstream provider rejects it. Measured 2026-08-07.
schema = 2
base_model = "openai/gpt-5.4-nano"

[modalities]
input = ["text", "image"]
output = ["text", "image"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true
temperature = true

[api.responses]
base_url = "${NEON_AI_GATEWAY_BASE_URL}/openai/v1"
sdk = { aisdk = "@ai-sdk/openai" }

[cost.text.input]
price = 0.2
cache = { read = 0.02 }

[cost.text.output]
price = 1.25
