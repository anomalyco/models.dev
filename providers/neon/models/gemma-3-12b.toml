# Linked to google/gemma-3-12b-it: Databricks serves "Gemma 3 12B ... multimodal and vision language model" (databricks-gemma-3-12b).
# Knowledge 2024-08-31 is unsourced (the lab has 2024-08); kept so v1 doesn't change.
# Output 8_192 is the existing host value; Neon publishes no output cap.
# Catalog: https://neon.com/models.json and https://neon.com/docs/ai-gateway/overview (accessed 2026-10-21).
schema = 2
base_model = "google/gemma-3-12b-it"
name = "Gemma 3 12B"
description = "Google's open-weight Gemma 3 vision-language model for text and image understanding"
knowledge = "2024-08-31"

[capabilities]
structured_output = true

[limit]
output = 8_192

[cost.text.input]
price = 0.15

[cost.text.output]
price = 0.5
