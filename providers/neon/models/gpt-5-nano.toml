base_model = "openai/gpt-5-nano"
reasoning_options = [{ type = "effort", values = ["minimal", "low", "medium", "high"] }]

[cost]
input = 0.05
output = 0.4
cache_read = 0.005

[modalities]
input = ["text", "image"]
output = ["text", "image"]

[provider]
npm = "@ai-sdk/openai"
api = "${NEON_AI_GATEWAY_BASE_URL}/openai/v1"
shape = "responses"
