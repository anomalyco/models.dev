schema = 2
base_model = "openai/gpt-5-nano"

[modalities]
input = ["text", "image"]
output = ["text", "image"]

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true

[api.responses]
base_url = "${NEON_AI_GATEWAY_BASE_URL}/openai/v1"
sdk = { aisdk = "@ai-sdk/openai" }

[cost.text.input]
price = 0.05
cache = { read = 0.005 }

[cost.text.output]
price = 0.4
