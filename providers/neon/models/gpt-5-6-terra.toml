base_model = "openai/gpt-5.6-terra"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 2
output = 12
cache_read = 0.2
cache_write = 2.5

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 4
output = 18
cache_read = 0.4
cache_write = 5

[modalities]
input = ["text", "image", "pdf"]
output = ["text", "image"]

[provider]
npm = "@ai-sdk/openai"
api = "${NEON_AI_GATEWAY_BASE_URL}/openai/v1"
shape = "responses"
