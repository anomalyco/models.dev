# Chat Completions `reasoning_effort` is rejected (`Extra inputs are not permitted`).
# Effort is the Anthropic Messages control: thinking.type adaptive + output_config.effort.
# No toggle: thinking.type.disabled is rejected, same as claude-fable-5.
# json_schema on /v1/chat/completions is translated via forced tool use; this
# model rejects that (INVALID_PARAMETER_VALUE). Measured 2026-09-04.
# [cost] is the neon.com/models list for this id (10 / 50 / cache_read 0.25 /
# cache_write 12.5). Sibling claude-fable-5 publishes cache_read = 1; do not
# copy that onto 5.1.
# Catalog: https://neon.com/models.json and https://neon.com/docs/ai-gateway/overview (accessed 2026-10-21).
# Cache: explicit. POST /anthropic/v1/messages forwards `cache_control` unchanged and caching "works exactly as described"
# in Anthropic's docs (https://neon.com/docs/ai-gateway/anthropic-messages#prompt-caching); breakpoints, targets and
# min_tokens follow providers/anthropic. Only 5m is listed because Neon publishes a single cache_write price.
schema = 2
base_model = "anthropic/claude-fable-5-1"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = false
cache = { explicit = { ttl = ["5m"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 512 } }

[api.chat-completions]

[api.messages]
base_url = "${NEON_AI_GATEWAY_BASE_URL}/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 10
cache = { read = 0.25, write = 12.5 }

[cost.text.output]
price = 50
