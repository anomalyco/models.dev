# Model ID: GET https://inference.eu-west-3.impossibleapi.net/openai/v1/models (2026-11-26).
# Limits and reasoning behaviour: provided by Impossible Cloud for its inference API (2026-11-27).
# Effort: reasoning_effort low|high|max. The model always reasons, so none isn't listed.
# Reasoning field unpinned: the trace can come back in message.reasoning, which v1 can't express.
# Pricing: https://www.impossiblecloud.com/pricing#prices is the source of truth and prices change,
#   so no [cost] tables are set here.
schema = 2
base_model = "moonshotai/kimi-k3.1-pro"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }

[limit]
output = 65_536
