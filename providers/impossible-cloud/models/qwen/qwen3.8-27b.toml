# Model ID: GET https://inference.eu-west-3.impossibleapi.net/openai/v1/models (2026-11-26).
# Limits and reasoning behaviour: provided by Impossible Cloud for its inference API (2026-11-27).
# Effort: reasoning_effort none|low|medium|xhigh (none = off).
# Pricing: https://www.impossiblecloud.com/pricing#prices is the source of truth and prices change,
#   so no [cost] tables are set here.
schema = 2
base_model = "alibaba/qwen3.8-27b"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "xhigh"] }

[limit]
output = 65_536

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
