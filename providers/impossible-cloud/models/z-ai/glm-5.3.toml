# Source: https://www.impossiblecloud.com/en-us/managed-inference (context and category; accessed 2026-11-26).
# Pricing: https://www.impossiblecloud.com/pricing#prices is the source of truth and prices change,
#   so no [cost] tables are set here.
# Reasoning controls and structured_output follow the most common entries for this model on other
#   OpenAI-compatible hosts: IC serves through vLLM/SGLang and documents no model-specific controls.
# Effort: top-level reasoning_effort on POST /v1/chat/completions.
schema = 2
base_model = "zhipuai/glm-5.3"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

