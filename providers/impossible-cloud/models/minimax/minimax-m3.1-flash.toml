# Model ID: GET https://inference.eu-west-3.impossibleapi.net/openai/v1/models (2026-11-26).
# Not on the website's model list yet, so limits and modalities follow the lab entry.
# Effort: reasoning_effort low|medium|high|xhigh|max, the most common levels for this model on other
#   OpenAI-compatible hosts.
# Pricing: https://www.impossiblecloud.com/pricing#prices is the source of truth and prices change,
#   so no [cost] tables are set here.
schema = 2
base_model = "minimax/MiniMax-M3.1-Flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
