# https://iteracompute.com/models/minimax-h3-max/#pricing
# https://api.iteracompute.com/v1/models lists this exact ID on /v1/videos.
schema = 2
v2_only = true
base_model = "minimax/MiniMax-H3-Max"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp", "image/heic", "image/heif"]
output = ["video/mp4"]

[api.videos]
sdk = { aisdk = "none", opencodeai = "none" }

[cost.video.output]
unit = "second"
price = 0.045

[[cost.video.output.overrides]]
when = { resolution = { equals = "768P" } }
price = 0.072
