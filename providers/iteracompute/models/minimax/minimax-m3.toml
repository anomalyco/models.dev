# Sources (accessed 2026-10-10):
# https://api.iteracompute.com/v1/models (available ID and reasoning capabilities)
# https://api.iteracompute.com/openrouter/v1/models (output limit and supported parameters)
# https://iteracompute.com/models/minimax-m3/ (retail USD/MTok prices, context, and vision)
# The host explicitly advertises mandatory = true, effort_support = not_supported, and no toggle.
# Host capability recheck (2026-10-15), exact record id = "minimax/minimax-m3":
# /v1/models data[id].reasoning: mandatory=true, supports_enable_disable=false,
# effort_support="not_supported", supported_efforts=[]. These affirm no caller control.
# /openrouter/v1/models data[id].description: "Reasoning cannot be disabled on this route".
# Prices updated 2026-10-21 from the public GET https://api.iteracompute.com/v1/models pricing object (USD per 1M tokens).
schema = 2
base_model = "minimax/MiniMax-M3"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = false

[limit]
output = 524_288

[cost.text.input]
price = 0.3
cache = { read = 0.05 }

[cost.text.output]
price = 1.19
