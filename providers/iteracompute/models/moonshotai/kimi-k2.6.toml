# Sources (accessed 2026-10-22):
# https://api.iteracompute.com/v1/models (served ID, retail USD/MTok prices, limits and reasoning)
# https://iteracompute.com/models/kimi-k2-6/ (host capabilities and pricing)
# Toggle wire path: thinking.type = enabled|disabled.
# Control baseline: providers/moonshotai and providers/openrouter for Kimi K2.6.
# Exact host record (2026-10-23), /v1/models data[].id="moonshotai/kimi-k2.6": max_output_tokens=16384.
# This is the published host cap; the lab's larger generation ceiling is not the host serving limit.
schema = 2
base_model = "moonshotai/kimi-k2.6"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
output = 16_384

[cost.text.input]
price = 0.87
cache = { read = 0.07 }

[cost.text.output]
price = 3.51
