# The retail price cells on the linked host page publish exact USD per output second in HTML data[value].
# https://iteracompute.com/models/kling-o1/#pricing
# https://api.iteracompute.com/v1/models lists this exact ID on /v1/videos.
schema = 2
v2_only = true
base_model = "kuaishou/kling-video-o1"
name = "Kling O1"

[modalities]
input = ["text", "image/jpeg", "image/png", "video/mp4"]
output = ["video/mp4"]

[api.videos]
sdk = { aisdk = "none", opencodeai = "none" }

[cost.video.output]
unit = "second"
price = 0.07007898456

[[cost.video.output.overrides]]
when = { resolution = { equals = "1080P" }, input_video = { equals = false } }
price = 0.09343864608

[[cost.video.output.overrides]]
when = { resolution = { equals = "720P" }, input_video = { equals = true } }
price = 0.10511847684

[[cost.video.output.overrides]]
when = { resolution = { equals = "1080P" }, input_video = { equals = true } }
price = 0.14015796912
