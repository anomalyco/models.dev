# Limits and retail cache-write price rechecked 2026-10-22 against /v1/models and the model page.
# Sources (accessed 2026-10-10):
# https://api.iteracompute.com/v1/models (available ID and reasoning capabilities)
# https://api.iteracompute.com/openrouter/v1/models (output limit and supported parameters)
# https://iteracompute.com/models/deepseek-v4-pro/ (retail USD/MTok prices, context, and vision)
# Effort wire path: reasoning_effort = low|high|max; reasoning.effort is also accepted.
# The host advertises mandatory = true and supports_enable_disable = false.
# Host capability recheck (2026-10-15), exact record id = "deepseek/deepseek-v4-pro-0813":
# /v1/models data[id].reasoning: mandatory=true, supports_enable_disable=false,
# supported_efforts=["low","high","max"]. This host exposes effort and rejects reasoning off.
# Prices updated 2026-10-21 from the public GET https://api.iteracompute.com/v1/models pricing object (USD per 1M tokens).
# Exact /v1/models record (2026-10-23), id="deepseek/deepseek-v4-pro-0813":
# pricing.currency="USD", unit="per_1m_tokens", cache_write="0" (an explicit zero, not null/missing).
# The host model page also prints Cache Write $0; keep write=0 for this published free-write rate.
schema = 2
base_model = "deepseek/deepseek-v4-pro-0813"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
context = 1_048_576
output = 393_216

[cost.text.input]
price = 0.79
cache = { read = 0.026, write = 0 }

[cost.text.output]
price = 2.38
