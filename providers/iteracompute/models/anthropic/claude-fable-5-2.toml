# Chat Completions, Responses and Messages are listed on https://iteracompute.com/models/claude-fable-5-2/#interface-contract
# https://iteracompute.com/models/claude-fable-5-2/
# https://api.iteracompute.com/v1/models (verified 2026-11-22).
schema = 2
base_model = "anthropic/claude-fable-5-2"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 8
cache = { read = 0.2, write = { "5m" = 10, "1h" = 16 } }

[cost.text.output]
price = 40
