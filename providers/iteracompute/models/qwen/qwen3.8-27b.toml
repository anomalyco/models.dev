# Sources (accessed 2026-10-10):
# https://api.iteracompute.com/v1/models (available ID and reasoning capabilities)
# https://api.iteracompute.com/openrouter/v1/models (output limit and supported parameters)
# https://iteracompute.com/models/qwen3-8-27b/ (retail USD/MTok prices, context, and vision)
# Effort wire path: reasoning_effort = none|low|medium|xhigh; reasoning.effort is also accepted.
# reasoning_effort = none disables thinking; do not add a separate toggle.
# Free accounts start at 32K context; recharge tiers unlock 128K and 256K. Maximum output is 8,192.
base_model = "alibaba/qwen3.8-27b"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "xhigh"] }]

[cost]
input = 0
output = 0
cache_read = 0

[limit]
context = 32_768
output = 8_192

[modalities]
input = ["text", "image"]
