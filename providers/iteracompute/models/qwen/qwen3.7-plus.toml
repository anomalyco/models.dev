# https://iteracompute.com/models/qwen3-7-plus/
# https://api.iteracompute.com/v1/models (verified 2026-11-22).
# Toggle: enable_thinking true/false on the Alibaba-compatible chat route.
schema = 2
base_model = "alibaba/qwen3.7-plus"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
output = 131072

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
