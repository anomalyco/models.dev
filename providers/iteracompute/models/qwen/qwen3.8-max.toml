# Sources (accessed 2026-10-28):
# https://api.iteracompute.com/v1/models (exact ID, USD/MTok prices, limits and reasoning)
# https://iteracompute.com/models/qwen3-8-max/ (host capabilities and pricing)
# Toggle wire path: reasoning = true|false; reasoning.enabled is also accepted.
# Effort wire path: reasoning_effort = low|medium|xhigh.
# The host lists text and image input; video and PDF input are not advertised.
schema = 2
base_model = "alibaba/qwen3.8-max"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "xhigh"] }
structured_output = true

[limit]
context = 1_048_576

[cost.text.input]
price = 1.95
cache = { read = 0.25 }

[cost.text.output]
price = 5.7
