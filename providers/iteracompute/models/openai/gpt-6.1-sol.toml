# Sources (accessed 2026-10-22):
# https://api.iteracompute.com/v1/models (served ID, retail USD/MTok prices, limits and reasoning)
# https://iteracompute.com/models/gpt-6-1-sol/ (host capabilities and pricing)
# Effort wire path: reasoning_effort = low|medium|high|xhigh; reasoning.effort is also accepted.
# The host advertises mandatory reasoning and no enable/disable control.
# Host capability recheck (2026-10-23), exact /v1/models data[].id = "openai/gpt-6.1-sol":
# reasoning.mandatory=true, supports_enable_disable=false,
# supported_efforts=["low","medium","high","xhigh"].
# This host does not advertise "max"; no additional native effort level is inferred.
# Model-page mapping (2026-10-23): full context=1_050_000; Gateway input=922_000; output=128_000.
# /v1/models context_window=922000 matches the page's input budget, not its full model context.
# Inherit the lab's combined window and distinct input/output ceilings.
schema = 2
base_model = "openai/gpt-6.1-sol"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true

[cost.text.input]
price = 1.6
cache = { read = 0.08, write = 2.0 }

[cost.text.output]
price = 8
