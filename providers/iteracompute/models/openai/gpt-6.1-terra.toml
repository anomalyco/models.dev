# The model page identifies 922,000 as the input budget of the 1,050,000-token context, with 128,000 output.
# Chat Completions, Responses and Messages are listed on https://iteracompute.com/models/gpt-6-1-terra/#interface-contract
# https://iteracompute.com/models/gpt-6-1-terra/
# https://api.iteracompute.com/v1/models (verified 2026-11-22).
# Reasoning levels follow the native model and same-host GPT Chat surface. The public host contract documents JSON tools only.
schema = 2
base_model = "openai/gpt-6.1-terra"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 1
cache = { read = 0.05, write = 1.25 }

[[cost.text.input.overrides]]
when = { context = { gt = 272000 } }
price = 2
cache = { read = 0.1, write = 2.5 }

[cost.text.output]
price = 5

[[cost.text.output.overrides]]
when = { context = { gt = 272000 } }
price = 7.5
