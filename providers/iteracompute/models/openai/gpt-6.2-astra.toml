# The model page identifies 922,000 as the input budget of the 1,050,000-token context, with 128,000 output.
# Chat Completions, Responses and Messages are listed on https://iteracompute.com/models/gpt-6-2-astra/#interface-contract
# https://iteracompute.com/models/gpt-6-2-astra/
# https://api.iteracompute.com/v1/models (verified 2026-11-22).
# Reasoning levels follow the native model and same-host GPT Chat surface. The public host contract documents JSON tools only.
schema = 2
base_model = "openai/gpt-6.2-astra"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 8
cache = { read = 0.4, write = { "30m" = 10, "12h" = 20 } }

[[cost.text.input.overrides]]
when = { context = { gt = 272000 } }
price = 16
cache = { read = 0.8, write = { "30m" = 20, "12h" = 40 } }

[cost.text.output]
price = 40

[[cost.text.output.overrides]]
when = { context = { gt = 272000 } }
price = 60
