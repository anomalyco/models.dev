# Sources (accessed 2026-10-10):
# https://api.iteracompute.com/v1/models (available ID and reasoning capabilities)
# https://api.iteracompute.com/openrouter/v1/models (output limit and supported parameters)
# https://iteracompute.com/models/glm-5-3-flash/ (retail USD/MTok prices, context, and vision)
# Effort wire path: reasoning_effort = low|high|max; reasoning.effort is also accepted.
# The host advertises mandatory = true and supports_enable_disable = false.
# Prices updated 2026-10-21 from the public GET https://api.iteracompute.com/v1/models pricing object (USD per 1M tokens).
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = false

[limit]
context = 1_048_576

[cost.text.input]
price = 0.08
cache = { read = 0.023 }

[cost.text.output]
price = 0.28
