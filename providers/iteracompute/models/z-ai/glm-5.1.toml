# Sources (accessed 2026-10-22):
# https://api.iteracompute.com/v1/models (served ID, retail USD/MTok prices, limits and reasoning)
# https://iteracompute.com/models/glm-5-1/ (host capabilities and pricing)
# Toggle wire path: thinking.type = enabled|disabled (native GLM chat control).
# Control baseline: providers/zai and providers/openrouter for the same model.
# Host page API-parameters table (2026-10-23): tools/tool_calls are unavailable on this interface;
# response_format.type=json_object format enforcement is also unavailable.
# These host limitations explain tools.supported=false and structured_output=false.
schema = 2
base_model = "zhipuai/glm-5.1"

[capabilities]
reasoning = { supported = true, toggle = true }
tools = { supported = false }
structured_output = false

[limit]
context = 206_848

[cost.text.input]
price = 1.18
cache = { read = 0.12 }

[cost.text.output]
price = 4.17
