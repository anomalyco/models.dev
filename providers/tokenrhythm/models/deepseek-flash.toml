# Source: https://tokenrhythm.studio/api/models (public, accessed 2026-10-13).
# `deepseek-flash` is DeepSeek's alias for DeepSeek-V4.1-Flash (text + image input).
# Host lists contextWindow 1000000, maxOutputTokens 384000, input modalities ["text","image"].
# Toggle: thinking.type = enabled|disabled (reasoning.enabled and enable_thinking are also accepted)
# Effort: reasoning_effort = low|high|max (reasoning_effort = none also disables thinking)
# Live-tested on POST /v1/chat/completions (2026-10-14): disabling returns no reasoning_content; the host
# validates reasoning_effort (invalid values return 400) and max reasons more than low.
# thinking_budget, reasoning.max_tokens and thinking.budget_tokens are rejected as unknown fields (400).
# Pricing: published in CNY per 1M tokens (input 1 / output 4 / cache read 0.02); converted to USD at
# 1 USD = 7 CNY (2026-10-13).
base_model = "deepseek/deepseek-v4.1-flash"
reasoning_options = [{ type = "toggle" }, { type = "effort", values = ["low", "high", "max"] }]

[cost]
input = 0.1429
output = 0.5714
cache_read = 0.0029
