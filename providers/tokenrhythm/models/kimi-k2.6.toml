# Source: https://tokenrhythm.studio/api/models (public, accessed 2026-10-13).
# Host lists contextWindow 256000, maxOutputTokens 128000, input modalities ["text","image"].
# Toggle: reasoning.enabled = true|false (reasoningMode = "optional"; the TokenRhythm
# playground sends this field). reasoningSupportedEfforts = [] and
# reasoningSupportsMaxTokens = false, so no effort or budget control.
# Pricing: published in CNY per 1M tokens (input 6.5 / output 27 / cache read 1.3); converted to USD at
# 1 USD = 7 CNY (2026-10-13).
base_model = "moonshotai/kimi-k2.6"
reasoning_options = [{ type = "toggle" }]

[cost]
input = 0.9286
output = 3.8571
cache_read = 0.1857

[limit]
context = 256_000
output = 128_000

[modalities]
input = ["text", "image"]
