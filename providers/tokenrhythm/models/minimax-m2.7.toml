# Source: https://tokenrhythm.studio/api/models (public, accessed 2026-10-13).
# Host lists contextWindow 200000, maxOutputTokens 192000, input modalities ["text"].
# Reasoning: reasoningMode = "required" (always on, cannot be disabled) and
# reasoningSupportedEfforts = [], so callers have no reasoning control.
# Pricing: published in CNY per 1M tokens (input 2.1 / output 8.4); converted to USD at
# 1 USD = 7 CNY (2026-10-13).
base_model = "minimax/MiniMax-M2.7"
reasoning_options = []

[cost]
input = 0.3
output = 1.2

[limit]
context = 200_000
output = 192_000
