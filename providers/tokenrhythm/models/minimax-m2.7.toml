# Source: https://tokenrhythm.studio/api/models (public, accessed 2026-10-13).
# Host lists contextWindow 200000, maxOutputTokens 192000, input modalities ["text"].
# Reasoning: always on. Live-tested on POST /v1/chat/completions (2026-10-14):
# thinking.type = disabled, reasoning.enabled = false and enable_thinking = false
# all return 400 "当前模型必须开启深度思考" (thinking must be enabled).
# reasoning_effort is not forwarded: invalid values are accepted and low/max do not change reasoning.
# thinking_budget, reasoning.max_tokens and thinking.budget_tokens are rejected as unknown fields (400).
# Pricing: published in CNY per 1M tokens (input 2.1 / output 8.4); converted to USD at
# 1 USD = 7 CNY (2026-10-13).
base_model = "minimax/MiniMax-M2.7"
reasoning_options = []

[cost]
input = 0.3
output = 1.2

[limit]
context = 200_000
output = 192_000
