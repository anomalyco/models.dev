# Toggle: reasoning.enabled = true|false
# Same-surface peer: providers/openrouter/models/elorian/glimpse.toml (reasoning.enabled).
# IranRouter GET /api/v1/models lists reasoning_effort for this id; peer toggle is restored on the relay.
# Sources:
# - https://iranrouter.net/docs
# - https://iranrouter.net/models
# - GET https://iranrouter.net/api/v1/models (pricing_per_million + context_length)
schema = 2
base_model = "elorian/glimpse"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[cost.text.input]
price = 0.6

[cost.text.output]
price = 3
