# Sources:
# - https://iranrouter.net/docs
# - https://iranrouter.net/models
# - GET https://iranrouter.net/api/v1/models (pricing_per_million + context_length)
# Same-surface peers (Venice / DigitalOcean) keep always-on reasoning with no toggle; IranRouter only
# advertises reasoning_effort generically and has no documented enable_thinking forward, so no toggle.
schema = 2
base_model = "nvidia/nemotron-3.5-super-vl-120b-a12b"

[capabilities]
reasoning = { supported = true }
structured_output = true

[cost.text.input]
price = 0.15

[cost.text.output]
price = 0.5
