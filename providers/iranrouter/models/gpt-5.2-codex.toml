# Sources:
# - https://iranrouter.net/docs
# - https://iranrouter.net/models
# - GET https://iranrouter.net/api/v1/models (pricing_per_million + per-model context_length)
# IranRouter is an OpenAI-compatible multi-model relay; reasoning controls follow lab / same-surface peers.
# Freeform (live 2026-11-09): POST /api/v1/chat/completions rejects type=custom tools (400 invalid_request / "Provider returned error"; gpt-6.1-sol: "Reasoning is mandatory..."). POST /api/v1/responses accepts custom tools with text|lark|regex formats (HTTP 200) but did not return custom_tool_call / enforce ZZ[0-9]{3} as a tool input (model replied in output_text or empty), so freeform is left unset. Regex probe definition: ZZ[0-9]{3}.
# Host context_length from GET /api/v1/models for `gpt-5.2-codex` = 128_000 (lab openai/gpt-5.2-codex = 400_000).
schema = 2
base_model = "openai/gpt-5.2-codex"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true

[limit]
context = 128_000

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 1.75

[cost.text.output]
price = 14
