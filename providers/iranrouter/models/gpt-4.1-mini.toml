# Sources:
# - https://iranrouter.net/docs
# - https://iranrouter.net/models
# - GET https://iranrouter.net/api/v1/models (pricing_per_million + per-model context_length)
# IranRouter is an OpenAI-compatible multi-model relay; reasoning controls follow lab / same-surface peers.
# Host context_length from GET /api/v1/models for `gpt-4.1-mini` = 128_000 (lab openai/gpt-4.1-mini = 1_047_576).
schema = 2
base_model = "openai/gpt-4.1-mini"

[capabilities]
structured_output = true

[limit]
context = 128_000

[cost.text.input]
price = 0.4

[cost.text.output]
price = 1.6
