# Sources:
# - https://iranrouter.net/docs
# - https://iranrouter.net/models
# - GET https://iranrouter.net/api/v1/models (pricing_per_million + per-model context_length)
# IranRouter is an OpenAI-compatible multi-model relay; reasoning controls follow lab / same-surface peers.
# Host dump 2026-11-10 GET /api/v1/models id=`gpt-4.1-mini`: context_length=128_000; pricing_per_million prompt=0.4 completion=1.6 (USD/MTok).
# Truncated host context=128_000 vs lab 1_047_576; base_model_omit=["limit.input"] so inherited lab input cannot exceed context.
schema = 2
base_model = "openai/gpt-4.1-mini"

[capabilities]
structured_output = true

[limit]
context = 128_000

[cost.text.input]
price = 0.4

[cost.text.output]
price = 1.6
