# - GET https://iranrouter.net/api/v1/models (pricing_per_million + per-model context_length)
# IranRouter is an OpenAI-compatible multi-model relay; reasoning controls follow lab / same-surface peers.
# Host dump 2026-11-10 GET /api/v1/models id=`step-5-preview`: context_length=1_048_576; pricing_per_million prompt=1 completion=2.7 (USD/MTok).
schema = 2
base_model = "stepfun/step-5-preview"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
context = 1_048_576

[cost.text.input]
price = 1

[cost.text.output]
price = 2.7
