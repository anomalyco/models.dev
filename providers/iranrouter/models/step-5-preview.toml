# Sources:
# - https://iranrouter.net/docs
# - https://iranrouter.net/models
# - GET https://iranrouter.net/api/v1/models (pricing_per_million + per-model context_length)
# IranRouter is an OpenAI-compatible multi-model relay; reasoning controls follow lab / same-surface peers.
# Host context_length from GET /api/v1/models for `step-5-preview` = 1_048_576 (lab stepfun/step-5-preview = 1_000_000).
schema = 2
base_model = "stepfun/step-5-preview"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
context = 1_048_576

[cost.text.input]
price = 1

[cost.text.output]
price = 2.7
