# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|high|max
# Sources:
# - https://iranrouter.net/docs
# - https://iranrouter.net/models
# - GET https://iranrouter.net/api/v1/models (pricing_per_million, context_length)
# IranRouter is a multi-model OpenAI-compatible relay; reasoning controls follow the underlying lab / same-surface peers.
schema = 2
v2_only = true
base_model = "deepseek/deepseek-v4.1-flash-1017"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.15

[cost.text.output]
price = 0.6
