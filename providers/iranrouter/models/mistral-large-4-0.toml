# - https://iranrouter.net/models
# - GET https://iranrouter.net/api/v1/models (pricing_per_million + per-model context_length)
# IranRouter is an OpenAI-compatible multi-model relay; reasoning controls follow lab / same-surface peers.
# Host dump 2026-11-10 GET /api/v1/models id=`mistral-large-4-0`: context_length=1_048_576; pricing_per_million prompt=0.7 completion=2.1 (USD/MTok).
schema = 2
base_model = "mistral/mistral-large-4"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 0.7

[cost.text.output]
price = 2.1
