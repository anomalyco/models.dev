# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|high|max
# Sources:
# - https://iranrouter.net/docs
# - https://iranrouter.net/models
# - GET https://iranrouter.net/api/v1/models (pricing_per_million + per-model context_length)
# IranRouter is an OpenAI-compatible multi-model relay; reasoning controls follow lab / same-surface peers.
# Host dump 2026-11-10 GET /api/v1/models id=`deepseek-v4-pro`: context_length=1_048_576; pricing_per_million prompt=0.894012 completion=1.788024 (USD/MTok).
schema = 2
base_model = "deepseek/deepseek-v4-pro"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.894012

[cost.text.output]
price = 1.788024
