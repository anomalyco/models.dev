# Sources:
# - https://iranrouter.net/docs
# - https://iranrouter.net/models
# - GET https://iranrouter.net/api/v1/models (pricing_per_million + per-model context_length)
# IranRouter is an OpenAI-compatible multi-model relay; reasoning controls follow lab / same-surface peers.
# Effort includes none to match providers/xai/models/grok-4.3.toml (lab GET /models reasoning_effort).
# Host dump 2026-11-10 GET /api/v1/models id=`grok-4.3`: context_length=1_000_000; pricing_per_million prompt=1.25 completion=2.5 (USD/MTok).
schema = 2
base_model = "xai/grok-4.3"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true

[cost.text.input]
price = 1.25

[cost.text.output]
price = 2.5
