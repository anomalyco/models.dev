# Sources:
# - https://iranrouter.net/docs
# - https://iranrouter.net/models
# - GET https://iranrouter.net/api/v1/models (pricing_per_million + per-model context_length)
# IranRouter is an OpenAI-compatible multi-model relay; reasoning controls follow lab / same-surface peers.
# Freeform custom tools not probed on this host; omitted (Chat Completions path only).
# Host context_length from GET /api/v1/models for `minimax-m3.1-flash` = 1_048_576 (lab minimax/MiniMax-M3.1-Flash = 1_000_000).
schema = 2
base_model = "minimax/MiniMax-M3.1-Flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[limit]
context = 1_048_576

[cost.text.input]
price = 0.075

[cost.text.output]
price = 0.3
