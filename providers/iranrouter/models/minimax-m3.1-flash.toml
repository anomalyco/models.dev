# Sources:
# - https://iranrouter.net/docs
# - https://iranrouter.net/models
# - GET https://iranrouter.net/api/v1/models (pricing_per_million + per-model context_length)
# IranRouter is an OpenAI-compatible multi-model relay; reasoning controls follow lab / same-surface peers.
# Host dump 2026-11-10 GET /api/v1/models id=`minimax-m3.1-flash`: context_length=1_048_576; pricing_per_million prompt=0.075 completion=0.3 (USD/MTok).
# Structured output (live 2026-11-10): response_format.type=json_schema returns 400
# ("response_format.json_schema is required…") even with a full json_schema object;
# json_object is accepted. First-party providers/minimax/models/MiniMax-M3.1-Flash.toml
# and OpenRouter MiniMax peers set structured_output = false (schema not enforced).
schema = 2
base_model = "minimax/MiniMax-M3.1-Flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = false

[limit]
context = 1_048_576

[cost.text.input]
price = 0.075

[cost.text.output]
price = 0.3
