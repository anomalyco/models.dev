schema = 2
name = "OpenAI: GPT Terra Latest"
description = "This model always redirects to the latest model in the OpenAI GPT Terra family."
family = "gpt-terra"
open_weights = false
release_date = "2026-09-11"

[modalities]
input = ["application/pdf", "image", "text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
temperature = false

[limit]
context = 1_050_000
output = 128_000

[cost.text.input]
price = 2
cache = { read = 0.2, write = 2.5 }

[cost.text.output]
price = 12
