schema = 2
name = "OpenAI: GPT Luna Latest"
description = "This model always redirects to the latest model in the OpenAI GPT Luna family."
family = "gpt-luna"
open_weights = false
release_date = "2026-09-11"

[modalities]
input = ["application/pdf", "image", "text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
temperature = false

[limit]
context = 1_050_000
output = 128_000

[cost.text.input]
price = 0.1
cache = { read = 0.01, write = 0.125 }

[cost.text.output]
price = 0.5
