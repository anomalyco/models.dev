name = "StepFun: Step 5 Preview (free)"
description = "Step 5 Preview is StepFun's flagship model for agentic work, with strong capabilities in software engineering, professional knowledge work, and finance. It natively supports text, image, and video input with a 1M-token context window and up to 64K output tokens. The model supports tool calling, structured outputs, and selectable reasoning levels (low/medium/high) for long-context research, coding, and multi-step workflows."
family = "step"
release_date = "2025-08-26"
last_updated = "2025-08-26"
attachment = true
reasoning = true
temperature = true
tool_call = true
structured_output = false
open_weights = false

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
input = 0
output = 0
reasoning = 0
cache_read = 0

[limit]
context = 1_000_000
output = 64_000

[modalities]
input = ["text", "image"]
output = ["text"]
