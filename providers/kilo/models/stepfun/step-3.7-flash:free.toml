base_model = "stepfun/step-3.7-flash"
base_model_omit = ["limit.input"]
name = "StepFun: Step 3.7 Flash (free)"
description = "Step 3.7 Flash is StepFun's latest high-efficiency multimodal Mixture-of-Experts model. It pairs a 196B-parameter language backbone with a vision encoder for native image and video understanding, activating roughly 11B parameters per token. The model supports a 256K context window and exposes selectable reasoning levels (high/medium/low), letting callers trade off speed, cost, and depth of reasoning. Designed for coding, agentic workflows, structured outputs, and long-context productivity tasks."
structured_output = false

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
input = 0
output = 0
reasoning = 0
cache_read = 0

[limit]
context = 262_144
output = 262_144

[modalities]
input = ["text", "image"]
