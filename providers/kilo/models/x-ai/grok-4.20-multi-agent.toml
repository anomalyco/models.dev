schema = 2
name = "SpaceXAI: Grok 4.20 Multi-Agent"
description = "Grok model for agentic tool use, reasoning, coding, and live assistance"
family = "grok"
open_weights = false
release_date = "2026-03-31"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
temperature = true

[limit]
context = 2_000_000
output = 1_800_000

[cost.text.input]
price = 1.25
cache = { read = 0.2 }

[cost.text.output]
price = 2.5
