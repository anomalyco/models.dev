# Mid-conversation (Kilo Chat Completions; https://kilo.ai/docs/gateway/api-reference): effort_updates = false and tools.updates = false:
# system messages take string content only, with no per-turn effort or tool addition/removal mechanism.
# system_updates unset: Kilo routes each request to Vercel AI Gateway, OpenRouter or a direct upstream and doesn't document where a mid-conversation system message ends up.
schema = 2
base_model = "xai/grok-4.5"
description = "Grok 4.5 is SpaceXAI's smartest model with frontier performance on coding, knowledge work, and STEM."

[modalities]
input = ["text", "image/jpeg", "image/png", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
effort_updates = false

[limit]
output = 450_000

[cost.text.input]
price = 2
cache = { read = 0.3 }

[cost.text.output]
price = 6
