# Tracks the current Claude Haiku alias target on Kilo (Claude Haiku 4.5).
# Mid-conversation (Kilo Chat Completions; https://kilo.ai/docs/gateway/api-reference): effort_updates = false and tools.updates = false:
# system messages take string content only, with no per-turn effort or tool addition/removal mechanism.
# system_updates unset: Kilo routes each request to Vercel AI Gateway, OpenRouter or a direct upstream and doesn't document where a mid-conversation system message ends up.
# Cache: implicit = true: Kilo adds cache_control breakpoints (system + last user/tool message) when the request has none (https://github.com/Kilo-Org/cloud/blob/d26988c12beabe7d276220e101507a807d4ea0cf/packages/web-shared/src/lib/ai-gateway/providers/anthropic.ts, https://github.com/Kilo-Org/cloud/blob/d26988c12beabe7d276220e101507a807d4ea0cf/packages/web-shared/src/lib/ai-gateway/providers/openrouter/request-helpers.ts)
# Modalities: Kilo documents no formats; this alias redirects to the latest Claude Haiku, and every current Claude Haiku model in the lab catalog lists the same formats. Claude image formats JPEG, PNG, GIF, WebP: https://platform.claude.com/docs/en/build-with-claude/vision#supported-formats
schema = 2
name = "Anthropic: Claude Haiku Latest"
description = "Fast Claude model for responsive assistance, classification, and lightweight agents"
family = "claude-haiku"
open_weights = false
release_date = "2026-04-27"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
temperature = false
effort_updates = false
cache = { implicit = true }

[limit]
context = 1_000_000
output = 128_000

[cost.text.input]
price = 0.1
cache = { read = 0.01, write = 0.125 }

[cost.text.output]
price = 0.5

[cost.web_search]
price = 10
