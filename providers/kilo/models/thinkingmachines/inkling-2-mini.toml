# Reasoning field: reasoning_content, the field Inkling's chat template reads back (https://huggingface.co/thinkingmachines/Inkling-2-Mini). Kilo routes to Vercel AI Gateway or OpenRouter; OpenRouter reads reasoning_content back on earlier assistant turns for Inkling 2 Mini (live 2026-11-23).
schema = 2
base_model = "thinkingmachines/inkling-2-mini"
name = "Thinking Machines: Inkling 2 Mini"
description = "Inkling 2 Mini is an open-weight multimodal looped transformer from Thinking Machines Lab, with 3.4B active parameters out of 26.4B total (MoE). Its middle layers run three times with shared..."

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "max"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.0375
cache = { read = 0.0075 }

[cost.text.output]
price = 0.15
