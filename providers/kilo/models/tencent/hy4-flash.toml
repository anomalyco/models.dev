schema = 2
base_model = "tencent/hy4-flash"
base_model_omit = ["limit.input"]
name = "Tencent: Hy4 flash"
description = "Tencent Hy4 Flash is a lower-cost model in the Hy4 family for coding, reasoning, and agentic workflows. It supports deep reasoning with preserved thinking, tool calling, structured outputs, prompt caching, and image understanding, with a 1M-token context window."

[capabilities]
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = true

[cost.text.input]
price = 0.07
cache = { read = 0.003 }

[cost.text.output]
price = 0.281
