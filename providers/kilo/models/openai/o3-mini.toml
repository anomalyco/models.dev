schema = 2
base_model = "openai/o3-mini"
name = "OpenAI: o3-mini"
description = "o3-mini is OpenAI's most recent small reasoning model, providing high intelligence at the same cost and latency targets of o1-mini."

[modalities]
input = ["text", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 1.1
cache = { read = 0.55 }

[cost.text.output]
price = 4.4
