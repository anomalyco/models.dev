schema = 2
base_model = "openai/o4-mini"
description = "O-series reasoning model for hard analysis, math, coding, and planning"

[modalities]
input = ["image/jpeg", "image/png", "image/gif", "image/webp", "text", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["high"] }
structured_output = true

[cost.text.input]
price = 1.1
cache = { read = 0.275 }

[cost.text.output]
price = 4.4
