schema = 2
base_model = "openai/gpt-5.1"
description = "GPT model for general reasoning, writing, coding, and tool-assisted tasks"

[modalities]
input = ["image", "text", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
temperature = false

[cost.text.input]
price = 1.25
cache = { read = 0.125 }

[cost.text.output]
price = 10
