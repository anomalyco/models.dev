# Mid-conversation (Kilo Chat Completions; https://kilo.ai/docs/gateway/api-reference): effort_updates = false and tools.updates = false:
# system messages take string content only, with no per-turn effort or tool addition/removal mechanism.
# system_updates unset: Kilo routes each request to Vercel AI Gateway, OpenRouter or a direct upstream and doesn't document where a mid-conversation system message ends up.
schema = 2
name = "OpenAI: GPT-6 Luna Pro"
description = "GPT-6 Luna Pro is the same underlying model as [GPT-6 Luna](https://openrouter.ai/openai/gpt-6-luna), served with `reasoning.mode` set to `pro` for higher-quality responses on complex tasks. Learn more in OpenAI's docs: https://developers.openai.com/api/docs/guides/reasoning#reasoning-mode"
family = "gpt"
open_weights = false
release_date = "2026-09-22"

[modalities]
input = ["application/pdf", "image", "text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
temperature = false
effort_updates = false

[limit]
context = 1_050_000
output = 128_000

[cost.text.input]
price = 0.1
cache = { read = 0.01, write = 0.125 }

[cost.text.output]
price = 0.5
