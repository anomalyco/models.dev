schema = 2
base_model = "openai/gpt-5.6-terra"
name = "OpenAI: GPT 5.6 Terra (Fast)"
description = "GPT-5.6 Terra is a balanced GPT-5.6 model for everyday work, with performance comparable to the previous generation at half the cost."

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
temperature = false

[cost.text.input]
price = 2
cache = { read = 0.2, write = 2.5 }

[cost.text.output]
price = 12
reasoning = 0

[cost.web_search]
price = 10
