schema = 2
base_model = "openai/gpt-5.1-codex-max"
description = "Coding-optimized GPT model for repository edits, reviews, and agentic software work"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true

[cost.text.input]
price = 1.25
cache = { read = 0.125 }

[cost.text.output]
price = 10
