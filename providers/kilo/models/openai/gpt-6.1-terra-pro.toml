schema = 2
name = "OpenAI: GPT-6.1 Terra Pro"
description = "GPT-6.1 Terra Pro is the same underlying model as [GPT-6.1 Terra](https://openrouter.ai/openai/gpt-6.1-terra), served with `reasoning.mode` set to `pro` for higher-quality responses on complex tasks. **Cost note:** pro mode spends far more..."
family = "gpt"
open_weights = false
release_date = "2026-10-26"

[modalities]
input = ["application/pdf", "image", "text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
temperature = false

[limit]
context = 1_050_000
output = 128_000

[cost.text.input]
price = 1
cache = { read = 0.05, write = 1.25 }

[cost.text.output]
price = 5

[cost.web_search]
price = 10
