schema = 2
base_model = "openai/gpt-6.2-astra"
name = "OpenAI: GPT-6.2 Astra (Fast)"
description = "GPT-6.2 Astra is OpenAI's frontier reasoning model for coding and professional work. It can build and revise software, use a computer, and work with documents. It accepts text and images, generates text, and supports a 1,050,000-token context window with up to 128,000 output tokens, along with structured outputs, prompt caching, and Responses API tools such as web search."

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 16
cache = { read = 0.8, write = 20 }

[cost.text.output]
price = 80
reasoning = 0

[cost.web_search]
price = 10
