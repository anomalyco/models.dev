# Mid-conversation (Kilo Chat Completions; https://kilo.ai/docs/gateway/api-reference): effort_updates = false and tools.updates = false:
# system messages take string content only, with no per-turn effort or tool addition/removal mechanism.
# system_updates unset: Kilo routes each request to Vercel AI Gateway, OpenRouter or a direct upstream and doesn't document where a mid-conversation system message ends up.
# Modalities: Kilo documents no formats; assumed to relay OpenAI's chat-latest alias (the latest Instant chat model; OpenAI's image formats are the same for every model). OpenAI image inputs PNG, JPEG, WEBP, non-animated GIF: https://platform.openai.com/docs/guides/images-vision
schema = 2
name = "OpenAI: GPT Chat Latest"
description = "Chat-tuned GPT model for conversational assistance, writing, and tool workflows"
family = "gpt"
open_weights = false
release_date = "2026-05-05"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
structured_output = true
temperature = false

[limit]
context = 400_000
output = 128_000

[cost.text.input]
price = 5
cache = { read = 0.5 }

[cost.text.output]
price = 30

[cost.web_search]
price = 10
