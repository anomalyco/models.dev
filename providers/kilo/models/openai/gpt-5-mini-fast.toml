schema = 2
base_model = "openai/gpt-5-mini"
name = "OpenAI: GPT-5 mini (Fast)"
description = "GPT-5 mini is a cost optimized model that excels at reasoning/chat tasks. It offers an optimal balance between speed, cost, and capability."

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 0.45
cache = { read = 0.045 }

[cost.text.output]
price = 3.6
