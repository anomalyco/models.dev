schema = 2
base_model = "meta/muse-glimmer-30b"
description = "Muse Glimmer 30B is a dense, open-weight multimodal model from Meta Superintelligence Labs, distilled from Muse Spark and optimized for autonomous agents on consumer hardware. It is suited for long-horizon..."

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true

[limit]
output = 16_384

[cost.text.input]
price = 0.3
cache = { read = 0.04 }

[cost.text.output]
price = 1.2
