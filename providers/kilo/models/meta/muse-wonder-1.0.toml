schema = 2
base_model = "meta/muse-wonder-1.0"
name = "Meta: Muse Wonder"
description = "Muse Wonder is Meta’s model for frontier coding, long-running agents, and advanced computer use. It plans long tasks, delegates work to sub-agents, and recovers from errors."

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[limit]
output = 1_048_576

[cost.text.input]
price = 4
cache = { read = 0.2 }

[cost.text.output]
price = 20
