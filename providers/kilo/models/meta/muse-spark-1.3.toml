schema = 2
base_model = "meta/muse-spark-1.3"
description = "Muse Spark 1.3 is a multimodal reasoning model from Meta for long-running agentic, multi-agent, and coding workflows. It is designed to keep track of information across extended tasks, work through..."

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "video/mp4", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[limit]
output = 943_718

[cost.text.input]
price = 1.25
cache = { read = 0.15 }

[cost.text.output]
price = 4.25
