# Mid-conversation (Kilo Chat Completions; https://kilo.ai/docs/gateway/api-reference): effort_updates = false and tools.updates = false:
# system messages take string content only, with no per-turn effort or tool addition/removal mechanism.
# system_updates unset: Kilo routes each request to Vercel AI Gateway, OpenRouter or a direct upstream and doesn't document where a mid-conversation system message ends up.
# Modalities: Kilo documents no formats; assumed to relay Meta's Muse Wonder on the Model API (meta/muse-wonder-1.0). Meta image formats https://dev.meta.ai/docs/image-understanding; video and audio formats https://dev.meta.ai/docs/video-understanding#supported-formats
schema = 2
name = "Meta: Muse Wonder"
description = "Muse Wonder is a frontier reasoning model from Meta, designed for complex personal and professional agentic tasks. It accepts text, images, video, audio, and PDF documents and returns text, with..."
family = "muse"
open_weights = false
release_date = "2026-10-12"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "video/mp4", "application/pdf", "audio/mpeg", "audio/wav"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
temperature = true
effort_updates = false

[limit]
context = 1_048_576
output = 943_718

[cost.text.input]
price = 4
cache = { read = 0.2 }

[cost.text.output]
price = 20

[cost.web_search]
price = 2.5
