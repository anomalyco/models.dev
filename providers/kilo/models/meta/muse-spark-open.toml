# Mid-conversation (Kilo Chat Completions; https://kilo.ai/docs/gateway/api-reference): effort_updates = false and tools.updates = false:
# system messages take string content only, with no per-turn effort or tool addition/removal mechanism.
# system_updates unset: Kilo routes each request to Vercel AI Gateway, OpenRouter or a direct upstream and doesn't document where a mid-conversation system message ends up.
schema = 2
base_model = "meta/muse-spark-open"
description = "Muse Spark Open is a coding-optimized open-weight model. Trained specifically for agentic coding workflows, it delivers higher first-attempt accuracy, reliable tool calling, and deep codebase understanding across the repos developers..."

[modalities]
input = ["text", "image", "video", "application/pdf", "audio/wav", "audio/mpeg"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true

[limit]
output = 943_718

[cost.text.input]
price = 1.25
cache = { read = 0.15 }

[cost.text.output]
price = 4.25
