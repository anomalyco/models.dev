# Mid-conversation (Kilo Chat Completions; https://kilo.ai/docs/gateway/api-reference): effort_updates = false and tools.updates = false:
# system messages take string content only, with no per-turn effort or tool addition/removal mechanism.
# system_updates unset: Kilo routes each request to Vercel AI Gateway, OpenRouter or a direct upstream and doesn't document where a mid-conversation system message ends up.
# Modalities: Kilo documents no formats; assumed to relay Meta's Muse Spark 1.3 at the contributor tier (meta/muse-spark-1.3). Meta image formats https://dev.meta.ai/docs/image-understanding; video and audio formats https://dev.meta.ai/docs/video-understanding#supported-formats
schema = 2
name = "Meta: Muse Spark 1.3 Contributor"
description = "Muse Spark 1.3 Contributor is the cost-efficient contributor tier of Meta’s multimodal reasoning model for experimentation, learning, and early-stage agentic, multi-agent, and coding workflows. It is designed to track information..."
family = "muse"
open_weights = false
release_date = "2026-09-02"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "video/mp4", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
temperature = true
effort_updates = false

[limit]
context = 1_048_576
output = 943_718

[cost.text.input]
price = 0.1
cache = { read = 0.002 }

[cost.text.output]
price = 0.2

[cost.web_search]
price = 2.5
