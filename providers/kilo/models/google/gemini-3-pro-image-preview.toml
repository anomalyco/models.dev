schema = 2
base_model = "google/gemini-3-pro-image-preview"
description = "Image model for prompt-driven generation, editing, and visual design workflows"

[modalities]
input = ["image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "text", "application/pdf"]
output = ["text", "image/png", "image/jpeg"]

[capabilities]
reasoning = { supported = true, effort = ["high"] }
structured_output = true

[cost.text.input]
price = 1
cache = { read = 0.1, write = 0.1875 }

[cost.text.output]
price = 6
reasoning = 6
