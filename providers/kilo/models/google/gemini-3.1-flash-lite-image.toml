schema = 2
base_model = "google/gemini-3.1-flash-lite-image"
description = "Nano Banana 2 Lite (Gemini 3.1 Flash Lite Image) is Google's fastest, most cost-efficient Gemini image model, built for high-velocity developer pipelines and rapid-fire visual exploration. It delivers text-to-image generation..."

[modalities]
input = ["image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "text", "application/pdf"]
output = ["text", "image/png", "image/jpeg"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true, effort = ["none", "minimal", "high"] }
structured_output = false

[limit]
output = 58_982

[cost.text.input]
price = 0.25

[cost.text.output]
price = 1.5

[cost.web_search]
price = 14
