schema = 2
base_model = "google/gemini-2.5-flash-image"
description = "Image model for prompt-driven generation, editing, and visual design workflows"

[modalities]
input = ["image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "text", "application/pdf"]
output = ["text", "image/png", "image/jpeg"]

[capabilities]
structured_output = true

[limit]
output = 8_192

[cost.text.input]
price = 0.3
cache = { read = 0.03, write = 0.083333 }

[cost.text.output]
price = 2.5
