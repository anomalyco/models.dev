schema = 2
base_model = "google/gemini-3-pro-image"
description = "Nano Banana Pro is Google’s most advanced image-generation and editing model, built on Gemini 3 Pro. It extends the original Nano Banana with significantly improved multimodal reasoning, real-world grounding, and..."

[modalities]
input = ["image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "text", "application/pdf"]
output = ["text", "image/png", "image/jpeg"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["high"] }
structured_output = true

[cost.text.input]
price = 2
cache = { read = 0.2, write = 0.375 }

[cost.text.output]
price = 12
reasoning = 12
