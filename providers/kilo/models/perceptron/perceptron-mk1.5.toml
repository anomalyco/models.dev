# Mid-conversation (Kilo Chat Completions; https://kilo.ai/docs/gateway/api-reference): effort_updates = false and tools.updates = false:
# system messages take string content only, with no per-turn effort or tool addition/removal mechanism.
# system_updates unset: Kilo routes each request to Vercel AI Gateway, OpenRouter or a direct upstream and doesn't document where a mid-conversation system message ends up.
schema = 2
name = "Perceptron: Perceptron Mk1.5"
description = "Perceptron Mk1.5 is Perceptron's embodied reasoning model for physical agents. It accepts text, image, video, and audio input, and answers with text plus optional structured annotations: points, boxes, polygons, tracks,..."
open_weights = false
release_date = "2026-09-25"

[modalities]
input = ["text", "image", "video", "audio"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high"] }
structured_output = true
temperature = true
effort_updates = false

[limit]
context = 36_864
output = 8_192

[cost.text.input]
price = 0.15

[cost.text.output]
price = 1.5
