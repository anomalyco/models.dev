# Tracks the current Gemini Flash alias target (Gemini 3.5 Flash).
# Mid-conversation (Kilo Chat Completions; https://kilo.ai/docs/gateway/api-reference): effort_updates = false and tools.updates = false:
# system messages take string content only, with no per-turn effort or tool addition/removal mechanism.
# system_updates unset: Kilo routes each request to Vercel AI Gateway, OpenRouter or a direct upstream and doesn't document where a mid-conversation system message ends up.
# Modalities: Kilo documents no formats; this alias redirects to the latest Gemini Flash, and every current Gemini Flash model in the lab catalog lists the same formats. Gemini API formats, as in models/google/gemini-3.8-flash.toml: https://ai.google.dev/gemini-api/docs/image-understanding, https://ai.google.dev/gemini-api/docs/video-understanding, https://ai.google.dev/gemini-api/docs/audio
schema = 2
name = "Google: Gemini Flash Latest"
description = "Fast Gemini model balancing multimodal reasoning, tool use, and cost"
family = "gemini-flash"
open_weights = false
release_date = "2026-04-27"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "video/mp4", "video/mpeg", "video/mov", "video/avi", "video/x-flv", "video/mpg", "video/webm", "video/wmv", "video/3gpp", "application/pdf", "audio/wav", "audio/mp3", "audio/aiff", "audio/aac", "audio/ogg", "audio/flac", "audio/mpeg", "audio/m4a", "audio/l16", "audio/opus", "audio/alaw", "audio/mulaw", "audio/webm"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
temperature = true
effort_updates = false

[limit]
context = 1_048_576
output = 65_536

[cost.text.input]
price = 0.75
cache = { read = 0.075, write = 0.041667 }

[cost.text.output]
price = 3.75
reasoning = 3.75

[cost.web_search]
price = 14
