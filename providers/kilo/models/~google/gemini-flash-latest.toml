# Tracks the current Gemini Flash alias target (Gemini 3.5 Flash).
name = "Google Gemini Flash Latest"
description = "Fast Gemini model balancing multimodal reasoning, tool use, and cost"
family = "gemini-flash"
release_date = "2026-04-27"
last_updated = "2026-04-27"
attachment = true
reasoning = true
temperature = true
tool_call = true
structured_output = true
open_weights = false

[[reasoning_options]]
type = "effort"
values = ["minimal", "low", "medium", "high"]

[cost]
input = 0.375
output = 1.875
reasoning = 1.875
cache_read = 0.0375
cache_write = 0.041667

[limit]
context = 1_048_576
output = 65_536

[modalities]
input = ["text", "image", "video", "pdf", "audio"]
output = ["text"]
