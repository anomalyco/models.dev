# Mid-conversation (Kilo Chat Completions; https://kilo.ai/docs/gateway/api-reference): effort_updates = false and tools.updates = false:
# system messages take string content only, with no per-turn effort or tool addition/removal mechanism.
# system_updates unset: Kilo routes each request to Vercel AI Gateway, OpenRouter or a direct upstream and doesn't document where a mid-conversation system message ends up.
# Deprecated: Kilo's catalog names it "ByteDance Seed: Seed 1.6 Flash (retires Nov 11)" (GET https://api.kilo.ai/api/gateway/models, 2026-10-20)
# Video formats (Kilo documents none; ByteDance's Volcengine Ark list): video understanding, 视频格式说明 table
#   (MP4 video/mp4, AVI video/x-msvideo, MOV video/quicktime): https://www.volcengine.com/docs/82379/1895586
schema = 2
base_model = "bytedance-seed/seed-1-6-flash"
name = "ByteDance Seed: Seed 1.6 Flash (retires Nov 11)"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"
status = "deprecated"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = true

[limit]
context = 262_144
output = 32_768

[cost.text.input]
price = 0.075

[cost.text.output]
price = 0.3
