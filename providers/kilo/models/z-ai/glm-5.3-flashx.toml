# Mid-conversation (Kilo Chat Completions; https://kilo.ai/docs/gateway/api-reference): effort_updates = false and tools.updates = false:
# system messages take string content only, with no per-turn effort or tool addition/removal mechanism.
# system_updates unset: Kilo routes each request to Vercel AI Gateway, OpenRouter or a direct upstream and doesn't document where a mid-conversation system message ends up.
# Modalities: Kilo documents no formats; assumed to relay Z.ai's GLM-5.3-FlashX (GLM-5.3-Flash series). Z.ai chat API vision items image_url jpg/jpeg/png, video_url mp4/mkv/mov: https://docs.z.ai/api-reference/llm/chat-completion
schema = 2
name = "Z.ai: GLM 5.3 FlashX"
description = "GLM-5.3-FlashX is the high-speed variant of Z.ai's GLM-5.3-Flash, a native multimodal model delivering inference speeds of up to 200 tokens/s. Built on the same hybrid sparse and linear attention architecture..."
family = "glm"
open_weights = false
release_date = "2026-09-18"

[modalities]
input = ["text", "image/jpeg", "image/png", "video/mp4", "video/x-matroska", "video/quicktime"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = false
temperature = true
effort_updates = false

[limit]
context = 1_048_576
output = 131_072

[cost.text.input]
price = 0.37
cache = { read = 0.09 }

[cost.text.output]
price = 1.25
