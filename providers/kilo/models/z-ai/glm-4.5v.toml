schema = 2
base_model = "zhipuai/glm-4.5v"
description = "GLM vision model for visual reasoning, documents, and multimodal agents"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = false

[limit]
context = 65_536

[cost.text.input]
price = 0.6
cache = { read = 0.11 }

[cost.text.output]
price = 1.8
