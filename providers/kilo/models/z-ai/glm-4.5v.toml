base_model = "zhipuai/glm-4.5v"
description = "GLM vision model for visual reasoning, documents, and multimodal agents"
structured_output = false

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["high", "xhigh"]

[cost]
input = 0.6
output = 1.8
cache_read = 0.11

[limit]
context = 65_536

[modalities]
input = ["text", "image"]
