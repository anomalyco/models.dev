schema = 2
base_model = "zhipuai/glm-5v-turbo"
description = "GLM vision model for visual reasoning, documents, and multimodal agents"

[modalities]
input = ["image/jpeg", "image/png", "text", "video/mp4", "video/quicktime", "video/x-matroska"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = false

[limit]
context = 202_752

[cost.text.input]
price = 1.2
cache = { read = 0.24 }

[cost.text.output]
price = 4
