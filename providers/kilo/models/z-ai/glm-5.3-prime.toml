# Mid-conversation (Kilo Chat Completions; https://kilo.ai/docs/gateway/api-reference): effort_updates = false and tools.updates = false:
# system messages take string content only, with no per-turn effort or tool addition/removal mechanism.
# system_updates unset: Kilo routes each request to Vercel AI Gateway, OpenRouter or a direct upstream and doesn't document where a mid-conversation system message ends up.
schema = 2
name = "Z.ai: GLM 5.3 Prime"
description = "GLM-5.3-Prime is the high-speed variant of Z.ai's GLM-5.3, inheriting its full capabilities while delivering 1.5–2× the output throughput through inference acceleration. It supports text input and output with a 1M-token..."
family = "glm"
open_weights = false
release_date = "2026-09-23"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = false
temperature = true

[limit]
context = 1_000_000
output = 131_072

[cost.text.input]
price = 2.8
cache = { read = 0.56 }

[cost.text.output]
price = 8.8
