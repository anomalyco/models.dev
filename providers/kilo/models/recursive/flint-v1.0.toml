schema = 2
name = "Recursive: Flint"
description = "Flint is Recursive's open-weight mixture-of-experts model for agentic coding, with 40 billion total parameters and 2.5 billion active per token. It returns its reasoning alongside the answer and supports tool calling and structured outputs."
family = "flint"
open_weights = false
release_date = "2026-11-16"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
temperature = true

[limit]
context = 262_144
output = 262_144

[cost.text.input]
price = 0

[cost.text.output]
price = 0
reasoning = 0
