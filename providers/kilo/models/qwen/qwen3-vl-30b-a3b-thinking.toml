# Mid-conversation (Kilo Chat Completions; https://kilo.ai/docs/gateway/api-reference): effort_updates = false and tools.updates = false:
# system messages take string content only, with no per-turn effort or tool addition/removal mechanism.
# system_updates unset: Kilo routes each request to Vercel AI Gateway, OpenRouter or a direct upstream and doesn't document where a mid-conversation system message ends up.
# Modalities: Kilo documents no formats; assumed to relay Alibaba's Qwen3-VL-30B-A3B-Thinking. Alibaba Model Studio image and video limits: https://www.alibabacloud.com/help/en/model-studio/vision
schema = 2
name = "Qwen: Qwen3 VL 30B A3B Thinking"
description = "Qwen vision-language model for visual reasoning, documents, and agent tasks"
family = "qwen"
open_weights = false
release_date = "2025-10-06"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["high"] }
structured_output = true
temperature = true
effort_updates = false

[limit]
context = 262_144
output = 235_929

[cost.text.input]
price = 0.29

[cost.text.output]
price = 1
