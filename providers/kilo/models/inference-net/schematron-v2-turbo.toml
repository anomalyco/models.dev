# Mid-conversation (Kilo Chat Completions; https://kilo.ai/docs/gateway/api-reference): effort_updates = false and tools.updates = false:
# system messages take string content only, with no per-turn effort or tool addition/removal mechanism.
# system_updates unset: Kilo routes each request to Vercel AI Gateway, OpenRouter or a direct upstream and doesn't document where a mid-conversation system message ends up.
schema = 2
base_model = "inference-net/schematron-v2-turbo"
name = "Inference.net: Schematron V2 Turbo"
description = "Schematron V2 Turbo is a 3B-parameter HTML-to-JSON extraction model from Inference.net. It prioritizes throughput for high-volume extraction workloads. Extraction instructions must be supplied through a JSON schema in response_format rather..."

[capabilities]
structured_output = true

[cost.text.input]
price = 0.03
cache = { read = 0.03 }

[cost.text.output]
price = 0.15
