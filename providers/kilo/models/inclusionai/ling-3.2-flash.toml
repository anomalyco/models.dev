schema = 2
base_model = "inclusionai/ling-3.2-flash"
name = "inclusionAI: Ling 3.2 Flash"
description = "Ling 3.2 Flash is a hybrid reasoning model from inclusionAI that accepts text and image input, with a 1M-token context window and up to 200 images per request. Thinking can..."

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = true

[limit]
context = 1_048_576
output = 262_144

[cost.text.input]
price = 0.3
cache = { read = 0.06 }

[cost.text.output]
price = 0.9
