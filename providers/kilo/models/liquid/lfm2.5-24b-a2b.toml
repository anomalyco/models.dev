schema = 2
name = "LiquidAI: LFM2.5-24B-A2B"
description = "LFM2.5-24B-A2B is a text-generation model from Liquid AI with a 128,000-token context window."
family = "liquid"
open_weights = false
release_date = "2026-10-13"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
temperature = true

[limit]
context = 128_000
output = 8_200

[cost.text.input]
price = 0.05
cache = { read = 0.025 }

[cost.text.output]
price = 0.7
