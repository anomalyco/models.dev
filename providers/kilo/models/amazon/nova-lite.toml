schema = 2
name = "Amazon: Nova Lite"
description = "A very low cost multimodal model that is lightning fast for processing image, video, and text inputs."
family = "nova-lite"
open_weights = false
release_date = "2024-12-03"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
structured_output = true
temperature = true

[limit]
context = 300_000
output = 8_192

[cost.text.input]
price = 0.06
cache = { read = 0.015 }

[cost.text.output]
price = 0.24
