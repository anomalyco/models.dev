schema = 2
name = "Amazon: Nova Micro"
description = "A text-only model that delivers the lowest latency responses at very low cost."
family = "nova-micro"
open_weights = false
release_date = "2024-12-03"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
structured_output = true
temperature = true

[limit]
context = 128_000
output = 8_192

[cost.text.input]
price = 0.035
cache = { read = 0.0087 }

[cost.text.output]
price = 0.14
