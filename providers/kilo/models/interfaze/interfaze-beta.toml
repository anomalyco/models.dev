schema = 2
name = "Interfaze Beta"
description = "Interfaze is an AI model built on a new architecture that merges specialized DNN/CNN models with LLMs for developer tasks that require deterministic output and high consistency like OCR, scraping, classification, STT and more."
open_weights = false
release_date = "2025-10-07"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
temperature = true

[limit]
context = 1_000_000
output = 32_000

[cost.text.input]
price = 1.5

[cost.text.output]
price = 3.5
