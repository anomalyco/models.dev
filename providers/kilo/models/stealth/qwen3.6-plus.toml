# Mid-conversation (Kilo Chat Completions; https://kilo.ai/docs/gateway/api-reference): effort_updates = false and tools.updates = false:
# system messages take string content only, with no per-turn effort or tool addition/removal mechanism.
# system_updates unset: Kilo routes each request to Vercel AI Gateway, OpenRouter or a direct upstream and doesn't document where a mid-conversation system message ends up.
# Cache: implicit = true: Kilo adds cache_control breakpoints (system + last user/tool message) when the request has none (https://github.com/Kilo-Org/cloud/blob/d26988c12beabe7d276220e101507a807d4ea0cf/packages/web-shared/src/lib/ai-gateway/providers/qwen.ts, https://github.com/Kilo-Org/cloud/blob/d26988c12beabe7d276220e101507a807d4ea0cf/packages/web-shared/src/lib/ai-gateway/providers/openrouter/request-helpers.ts)
# Modalities: Kilo documents no formats; assumed to relay Alibaba's Qwen3.6 Plus (alibaba/qwen3.6-plus). Alibaba Model Studio image and video limits: https://www.alibabacloud.com/help/en/model-studio/vision
schema = 2
name = "Stealth: Qwen3.6 Plus (50% off)"
description = "Your prompts and completions may be retained and used to train or improve the provider's services. This third-party-served variant of Qwen3.6 Plus is offered at 50% lower cost than standard Qwen3.6 Plus pricing and is not served by Alibaba or Kilo Code. Note: a surcharge applies to long-context workloads exceeding 256K input tokens."
family = "qwen3.6"
open_weights = false
release_date = "2025-08-26"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh"] }
structured_output = false
temperature = true
effort_updates = false
cache = { implicit = true }

[limit]
context = 1_000_000
output = 65_536

[cost.text.input]
price = 0.25
cache = { read = 0.025, write = 0.3125 }

[cost.text.output]
price = 1.5
reasoning = 0
