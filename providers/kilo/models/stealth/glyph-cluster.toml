# Mid-conversation (Kilo Chat Completions; https://kilo.ai/docs/gateway/api-reference): effort_updates = false and tools.updates = false:
# system messages take string content only, with no per-turn effort or tool addition/removal mechanism.
# system_updates unset: Kilo routes each request to Vercel AI Gateway, OpenRouter or a direct upstream and doesn't document where a mid-conversation system message ends up.
schema = 2
name = "Stealth: Glyph Cluster (free)"
description = "Your prompts and completions may be retained and used to train or improve the provider's services. Glyph Cluster is a reasoning model for coding and long-context analysis, served through Vercel AI Gateway during its stealth period at no cost. It supports function calling and streaming, takes text input only, and does not support structured outputs. Zero Data Retention is not available for this model."
open_weights = false
release_date = "2025-08-26"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = false
temperature = true
effort_updates = false

[limit]
context = 256_000
output = 256_000

[cost.text.input]
price = 0
cache = { read = 0 }

[cost.text.output]
price = 0
reasoning = 0
