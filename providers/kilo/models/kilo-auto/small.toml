schema = 2
name = "Auto Small"
description = "Automatic model router for matching prompts to suitable backends and budgets"
family = "auto"
open_weights = false
release_date = "1970-01-01"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
structured_output = false
temperature = true

[limit]
context = 262_144
output = 32_768

[cost.text.input]
price = 0.05
cache = { read = 0.005 }

[cost.text.output]
price = 0.4
reasoning = 0
