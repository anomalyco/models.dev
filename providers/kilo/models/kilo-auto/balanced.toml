schema = 2
name = "Auto Balanced"
description = "Automatic model router for matching prompts to suitable backends and budgets"
family = "auto"
open_weights = false
release_date = "1970-01-01"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
structured_output = false
temperature = true

[limit]
context = 1_000_000
output = 65_536

[cost.text.input]
price = 0.325
cache = { read = 0.0325, write = 0.40625 }

[cost.text.output]
price = 1.95
reasoning = 0
