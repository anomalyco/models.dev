schema = 2
name = "Auto Frontier"
description = "Automatic model router for matching prompts to suitable backends and budgets"
family = "auto"
open_weights = false
release_date = "1970-01-01"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
structured_output = false
temperature = true

[limit]
context = 1_000_000
output = 128_000

[cost.text.input]
price = 5
cache = { read = 0.5, write = 6.25 }

[cost.text.output]
price = 25
reasoning = 0
