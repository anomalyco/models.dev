# Mid-conversation (Kilo Chat Completions; https://kilo.ai/docs/gateway/api-reference): effort_updates = false and tools.updates = false:
# system messages take string content only, with no per-turn effort or tool addition/removal mechanism.
# system_updates unset: Kilo routes each request to Vercel AI Gateway, OpenRouter or a direct upstream and doesn't document where a mid-conversation system message ends up.
# Cache: implicit = true: Kilo adds cache_control breakpoints (system + last user/tool message) when the request has none (https://github.com/Kilo-Org/cloud/blob/d26988c12beabe7d276220e101507a807d4ea0cf/packages/web-shared/src/lib/ai-gateway/providers/anthropic.ts, https://github.com/Kilo-Org/cloud/blob/d26988c12beabe7d276220e101507a807d4ea0cf/packages/web-shared/src/lib/ai-gateway/providers/openrouter/request-helpers.ts)
schema = 2
base_model = "anthropic/claude-fable-5-1"
description = "Claude Fable 5.1 improves on Claude Fable 5 across the board, with the biggest gains in agentic coding, long-running agentic workflows, and knowledge work: long code refactors, front-end and visual..."

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
effort_updates = false
cache = { implicit = true }

[cost.text.input]
price = 10
cache = { read = 0.25, write = 12.5 }

[cost.text.output]
price = 50

[cost.web_search]
price = 10
