# Mid-conversation (Kilo Chat Completions; https://kilo.ai/docs/gateway/api-reference): effort_updates = false and tools.updates = false:
# system messages take string content only, with no per-turn effort or tool addition/removal mechanism.
# system_updates unset: Kilo routes each request to Vercel AI Gateway, OpenRouter or a direct upstream and doesn't document where a mid-conversation system message ends up.
# Modalities: Kilo documents no formats; assumed to relay Perplexity's Sonar. Perplexity image formats PNG, JPEG, WEBP, GIF: https://docs.perplexity.ai/docs/agent-api/image-attachments
schema = 2
name = "Perplexity: Sonar"
description = "Sonar search model for current answers, retrieval, and citation-backed chat"
family = "sonar"
open_weights = false
release_date = "2025-01-27"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = false
temperature = true

[limit]
context = 127_072
output = 114_364

[cost.text.input]
price = 1

[cost.text.output]
price = 1

[cost.web_search]
price = 5
