# Mid-conversation (Kilo Chat Completions; https://kilo.ai/docs/gateway/api-reference): effort_updates = false and tools.updates = false:
# system messages take string content only, with no per-turn effort or tool addition/removal mechanism.
# system_updates unset: Kilo routes each request to Vercel AI Gateway, OpenRouter or a direct upstream and doesn't document where a mid-conversation system message ends up.
# Modalities: Kilo documents no formats; assumed to relay Perplexity's Sonar Pro in Pro Search mode (perplexity/sonar-pro). Perplexity image formats PNG, JPEG, WEBP, GIF: https://docs.perplexity.ai/docs/agent-api/image-attachments
schema = 2
name = "Perplexity: Sonar Pro Search"
description = "Advanced Sonar search model for deeper research and cited synthesis"
family = "sonar-pro"
open_weights = false
release_date = "2025-10-30"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true, effort = ["high"] }
structured_output = true
temperature = true

[limit]
context = 200_000
output = 8_000

[cost.text.input]
price = 3

[cost.text.output]
price = 15

[cost.web_search]
price = 18
