schema = 2
base_model = "xiaomi/mimo-v2.5"

[capabilities]
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.14
cache = { read = 0.003 }

[[cost.text.input.overrides]]
when = { context = { gt = 256_000 } }
