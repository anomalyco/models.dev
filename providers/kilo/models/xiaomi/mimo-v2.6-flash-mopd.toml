schema = 2
name = "Xiaomi: MiMo-V2.6-Flash-MOPD"
description = "MiMo-V2.6-Flash-MOPD is an updated checkpoint of Xiaomi's MiMo-V2.6-Flash, a Mixture-of-Experts model with 309B total and 15B active parameters, a 1M-token context window, and native multimodal input. It adds a multi-teacher..."
family = "mimo"
open_weights = false
release_date = "2026-11-23"

[modalities]
input = ["text", "image", "video", "audio"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = true
temperature = true

[limit]
context = 1_048_576
output = 32_768

[cost.text.input]
price = 0.5
cache = { read = 0.05 }

[cost.text.output]
price = 1
