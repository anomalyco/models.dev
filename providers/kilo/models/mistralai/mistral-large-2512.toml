schema = 2
base_model = "mistral/mistral-large-2512"
description = "Mistral Large 3 2512 is Mistral’s most capable model to date, featuring a sparse mixture-of-experts architecture with 41B active parameters (675B total), and released under the Apache 2.0 license."

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif", "application/pdf"]
output = ["text"]

[capabilities]
structured_output = true

[limit]
output = 209_715

[cost.text.input]
price = 0.5
cache = { read = 0.05 }

[cost.text.output]
price = 1.5
