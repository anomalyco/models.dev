schema = 2
name = "Mistral: Mistral Codestral"
description = "Mistral's cutting-edge language model for coding released end of July 2025, Codestral specializes in low-latency, high-frequency tasks such as fill-in-the-middle (FIM), code correction and test generation."
family = "codestral"
open_weights = false
release_date = "2024-05-29"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
structured_output = true
temperature = true

[limit]
context = 128_000
output = 4_000

[cost.text.input]
price = 0.3
cache = { read = 0.03 }

[cost.text.output]
price = 0.9
