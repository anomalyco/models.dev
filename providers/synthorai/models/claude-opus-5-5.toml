# Effort: reasoning_effort low|medium|high|xhigh|max -> thinking.type = adaptive +
# output_config.effort at the same level (see provider.toml).
# Price: https://synthorai.io/api/pricing (read 2026-10-26), USD per million tokens.
schema = 2
base_model = "anthropic/claude-opus-5-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 4
cache = { read = 0.2, write = { "5m" = 5, "1h" = 8 } }

[cost.text.output]
price = 20
