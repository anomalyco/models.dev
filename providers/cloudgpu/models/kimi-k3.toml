# GET https://cloudgpu.app/v1/models checked 2026-11-11: input_modalities ["text"], output_modalities ["text"], context_length 262144. No output token cap is published.
# Effort: reasoning_effort = low|high|max
schema = 2
base_model = "moonshotai/kimi-k3"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }

[limit]
context = 262_144

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
