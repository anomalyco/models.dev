schema = 2
base_model = "moonshotai/kimi-k2.6"
description = "Kimi reasoning model for long-horizon research, planning, and tool use"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
context = 256_000
output = 256_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.475
cache = { read = 0.1 }

[cost.text.output]
price = 2.97
