# Toggle: thinking.type = enabled|disabled; Cortecs maps reasoning_effort to Kimi thinking.type (see provider.toml,
# https://docs.cortecs.ai/routing/reasoning).
# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions; reasoning_effort and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://docs.cortecs.ai/api/chat-completions
# Cache: automatic prefix caching on every routed provider (inceptron). https://docs.cortecs.ai/routing/prompt-caching
# Input MIME types: the lab's types for each kind the Cortecs catalog lists (https://api.cortecs.ai/v1/models input_modalities).
schema = 2
base_model = "moonshotai/kimi-k2.6"
description = "Kimi reasoning model for long-horizon research, planning, and tool use"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true }
cache = { supported = true, implicit = true }
structured_output = true
effort_updates = false

[limit]
context = 256_000
output = 256_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.475
cache = { read = 0.1 }

[cost.text.output]
price = 2.97
