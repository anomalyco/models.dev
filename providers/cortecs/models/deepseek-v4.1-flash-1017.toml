# Effort: reasoning_effort = low|medium|high, as on deepseek-v4.1-flash. Both routed providers take it: Tensorix enables DeepSeek reasoning only when reasoning_effort is set; Sference accepts none..xhigh (https://docs.cortecs.ai/routing/reasoning).
# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions; reasoning_effort and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://docs.cortecs.ai/api/chat-completions
# Cache: automatic prefix caching on every routed provider (tensorix, sference). https://docs.cortecs.ai/routing/prompt-caching
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
cache = { supported = true, implicit = true }
structured_output = true
effort_updates = false

[limit]
context = 1_048_576
output = 1_048_576

[cost.text.input]
price = 0.511
cache = { read = 0.128 }

[cost.text.output]
price = 1.534
