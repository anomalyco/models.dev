schema = 2
base_model = "amazon/nova-lite-v1"
description = "Nova Lite is a fast, low-cost multimodal foundation model capable of reasoning over text, images, and video in 200+ languages."

[modalities]
input = ["text", "image/png", "image/jpeg", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true
temperature = false

[limit]
output = 10_000

[cost.text.input]
price = 0.069

[cost.text.output]
price = 0.275
