# Output limit: the catalog's max_output_tokens equals its context_size (131,000), which is not a per-request cap. OpenAI documents 131,072 max output tokens (https://developers.openai.com/api/docs/models/gpt-oss-20b), which would exceed the context served here, so output is capped at the context. The lab file carries 131,072 once https://github.com/anomalyco/models.dev/pull/13588 merges.
# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions; reasoning_effort and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://docs.cortecs.ai/api/chat-completions
# Cache: not supported by the routed providers (ovh, amazon_ireland). https://docs.cortecs.ai/routing/prompt-caching
schema = 2
base_model = "openai/gpt-oss-20b"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
cache = false
structured_output = true

[limit]
context = 131_000
output = 131_000

[cost.text.input]
price = 0.045

[cost.text.output]
price = 0.167
