schema = 2
base_model = "google/gemini-3.1-flash-lite"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "audio/wav", "audio/mp3", "audio/aiff", "audio/aac", "audio/ogg", "audio/flac", "audio/mpeg", "audio/m4a", "audio/l16", "audio/opus", "audio/alaw", "audio/mulaw", "audio/webm", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true

[limit]
output = 65_535

[cost.text.input]
price = 0.272
cache = { read = 0.025, write = 0.082 }

[cost.text.output]
price = 1.631
