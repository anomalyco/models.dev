# Sources (accessed 2026-08-16):
# https://huggingface.co/Qwen/Qwen3.8-2.4T-A95B
# Lab reasoning_effort is low|medium|xhigh (not high). Cortecs cost/limits retained.
# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions; reasoning_effort and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://docs.cortecs.ai/api/chat-completions
# Cache: automatic prefix caching on every routed provider (tensorix). https://docs.cortecs.ai/routing/prompt-caching
schema = 2
base_model = "alibaba/qwen3.8-2.4t-a95b"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "xhigh"] }
cache = { implicit = true }
structured_output = true
effort_updates = false

[limit]
output = 262_144

[cost.text.input]
price = 2.5
cache = { read = 0.625 }

[cost.text.output]
price = 6
