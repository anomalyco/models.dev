# Effort: reasoning_effort = none|low|medium|high. Kolibri's chat template takes those levels,
# and none turns thinking off (https://huggingface.co/Aleph-Alpha/Kolibri-1, "Reasoning mode").
# Cortecs forwards reasoning_effort to the routed provider and turns thinking off for none where
# the model allows it (https://docs.cortecs.ai/routing/reasoning, "Controlling reasoning").
schema = 2
base_model = "aleph-alpha/kolibri-1"
name = "kolibri-1"
description = "Kolibri-1 is Aleph Alpha’s open-weight English-German MoE language model, designed for enterprise use with efficient inference and advanced reasoning."

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
temperature = false

[limit]
context = 262_144
output = 81_920

[cost.text.input]
price = 0.167
cache = { read = 0.084 }

[cost.text.output]
price = 0.613
