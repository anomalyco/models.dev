# Effort: OpenAI reasoning_effort, mapped by Cortecs to Claude output_config.effort.
# Matches the other Cortecs Claude 5.5 entries; Haiku 5.5 has adaptive thinking only,
# so no manual budget_tokens control.
schema = 2
base_model = "anthropic/claude-haiku-5-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 0.113
cache = { read = 0.011, write = 0.14 }

[cost.text.output]
price = 0.563
