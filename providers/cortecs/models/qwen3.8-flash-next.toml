# Sources (accessed 2026-08-28):
# https://huggingface.co/Qwen/Qwen3.8-Flash-Next
# https://docs.cortecs.ai/usage/reasoning
# Effort: reasoning_effort = low|medium|xhigh, matching the lab and Cortecs Qwen3.8 peers.
# No lab-only toggle or thinking budget claimed for this relay route.
# Output limit: https://api.cortecs.ai/v1/models (max_output_tokens, not context_size).
# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions; reasoning_effort and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://docs.cortecs.ai/api/chat-completions
# Cache: automatic prefix caching on every routed provider (tensorix). https://docs.cortecs.ai/routing/prompt-caching
# Input MIME types: the lab's types for each kind the Cortecs catalog lists (https://api.cortecs.ai/v1/models input_modalities).
schema = 2
base_model = "alibaba/qwen3.8-flash-next"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "xhigh"] }
cache = { implicit = true }
structured_output = true

[limit]
output = 64_000

[cost.text.input]
price = 0.201
cache = { read = 0.05 }

[cost.text.output]
price = 0.5
