schema = 2
name = "gemma-3-27b:latest"
description = "Gemma 3 is a family of lightweight, multimodal models from Google, supporting text and image inputs, multilingual capabilities, and a 131K context window."
open_weights = false
release_date = "2025-03-12"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = true
temperature = false

[limit]
context = 131_000
output = 110_000

[cost.text.input]
price = 0.099

[cost.text.output]
price = 0.299
