# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions; reasoning_effort and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://docs.cortecs.ai/api/chat-completions
# Cache: not supported by the routed providers (nebius). https://docs.cortecs.ai/routing/prompt-caching
schema = 2
name = "minicpm-v-4.5"
description = "MiniCPM-V 4.5 is a compact, high-performance vision-language model excelling in video understanding, OCR, and multimodal reasoning with efficient deployment."
open_weights = false
release_date = "2026-06-02"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = false }
cache = false
structured_output = true
temperature = false
effort_updates = false

[limit]
context = 32_000
output = 32_000

[cost.text.input]
price = 0.651

[cost.text.output]
price = 1.097
