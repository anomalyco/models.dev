schema = 2
base_model = "amazon/nova-2-lite"
description = "Nova 2 Lite is an advanced multimodal reasoning model that combines efficiency and performance, delivering reliable AI for agentic workflows and enterprise applications."

[modalities]
input = ["text", "image/png", "image/jpeg", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true
temperature = false

[limit]
output = 65_535

[cost.text.input]
price = 0.373

[cost.text.output]
price = 3.144
