# Reasoning: inherits the lab's supported = false. The /v1/models "reasoning" feature tag is not model evidence (it is also set on gpt-4o and gpt-4.1).
# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions; reasoning_effort and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://docs.cortecs.ai/api/chat-completions
# Cache: not supported by the routed providers (scaleway). https://docs.cortecs.ai/routing/prompt-caching
schema = 2
base_model = "mistral/pixtral-12b"
name = "pixtral-12b-2409"
description = "Pixtral 2409 12B is a state-of-the-art multimodal model with 12B parameters and a 400M vision encoder, natively trained on interleaved text and image data. It excels in tasks spanning vision-language reasoning, instruction following, and pure text understanding, making it highly effective for real-world multimodal applications."

[capabilities]
tools = { supported = true, updates = false }
cache = { supported = false }
structured_output = true
temperature = false
effort_updates = false

[limit]
output = 4_096

[cost.text.input]
price = 0.223

[cost.text.output]
price = 0.223
