# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions; reasoning_effort and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://docs.cortecs.ai/api/chat-completions
schema = 2
base_model = "mistral/ministral-14b-2512"
description = "Ministral 3 14B is a frontier-level 14B multimodal model optimized for local deployment, delivering state-of-the-art text and vision reasoning with a 256K context window and strong agentic capabilities."

[capabilities]
tools = { supported = true }
structured_output = true
temperature = false

[limit]
context = 256_000
output = 256_000

[cost.text.input]
price = 0.24
cache = { read = 0.022 }

[cost.text.output]
price = 0.24
