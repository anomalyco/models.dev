# Effort: reasoning_effort = low|medium|high
# https://docs.cortecs.ai/routing/reasoning
# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions; reasoning_effort and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://docs.cortecs.ai/api/chat-completions
# Cache: automatic prefix caching on every routed provider (azure_sc). https://docs.cortecs.ai/routing/prompt-caching
schema = 2
base_model = "openai/gpt-6-astra"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
cache = { implicit = true }
structured_output = true
effort_updates = false

[cost.text.input]
price = 12.272
cache = { read = 1.228, write = 15.34 }

[cost.text.output]
price = 61.359
