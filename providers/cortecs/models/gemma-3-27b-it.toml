# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions; reasoning_effort is a per-request field with no per-turn effort mechanism (effort_updates = false). https://docs.cortecs.ai/api/chat-completions
# Cache: not supported by the routed providers (nebius). https://docs.cortecs.ai/routing/prompt-caching
schema = 2
base_model = "google/gemma-3-27b-it"
description = "Gemma 3 is a family of lightweight, multimodal models from Google, supporting text and image inputs, multilingual capabilities, and a 131K context window."

[capabilities]
tools = { supported = false }
reasoning = { supported = true }
cache = { supported = false }
structured_output = true
temperature = false
effort_updates = false

[limit]
context = 131_000
output = 110_000

[cost.text.input]
price = 0.099

[cost.text.output]
price = 0.299
