# Sources (accessed 2026-08-28):
# https://docs.bigmodel.cn/cn/guide/models/vlm/glm-5.3-flash
# https://docs.cortecs.ai/usage/reasoning
# Effort: reasoning_effort = low|high|max, matching the lab and relay peers.
# Thinking is always enabled; no toggle or reasoning-token budget.
# Output limit: https://api.cortecs.ai/v1/models (max_output_tokens, not context_size).
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
context = 1_048_576
output = 1_048_576

[cost.text.input]
price = 0.1
cache = { read = 0.018 }

[cost.text.output]
price = 0.35
