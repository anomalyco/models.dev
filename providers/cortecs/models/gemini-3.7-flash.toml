# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions; reasoning_effort and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://docs.cortecs.ai/api/chat-completions
# Cache: automatic prefix caching on every routed provider (google, google_priority). https://docs.cortecs.ai/routing/prompt-caching
# Input MIME types: the lab's types for each kind the Cortecs catalog lists (https://api.cortecs.ai/v1/models input_modalities).
schema = 2
base_model = "google/gemini-3.7-flash"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "audio/wav", "audio/mp3", "audio/aiff", "audio/aac", "audio/ogg", "audio/flac", "audio/mpeg", "audio/m4a", "audio/l16", "audio/opus", "audio/alaw", "audio/mulaw", "audio/webm", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
cache = { supported = true, implicit = true }
structured_output = true
effort_updates = false

[limit]
output = 65_535

[cost.text.input]
price = 0.75
cache = { read = 0.075, write = 0.038 }

[cost.text.output]
price = 3.75
