base_model = "tencent/hy3"
# Cortecs Chat maps OpenAI `reasoning_effort`; Hy3 accepts none/low/high
# (HF: no_think/low/high via chat_template_kwargs.reasoning_effort).
# Cortecs API prices in EUR (0.359/0.898/0.090); converted to USD/1M at
# EURUSD 1.1418 (2026-07-21).
# https://api.cortecs.ai/v1/models (accessed 2026-07-22)
# https://huggingface.co/tencent/Hy3
structured_output = true
reasoning_options = [{ type = "effort", values = ["none", "low", "high"] }]

[cost]
input = 0.410
output = 1.025
cache_read = 0.103

[limit]
context = 262_144
