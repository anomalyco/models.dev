# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions; reasoning_effort is a per-request field with no per-turn effort mechanism (effort_updates = false). https://docs.cortecs.ai/api/chat-completions
# Cache: not supported by the routed providers (amazon_ireland, amazon_paris). https://docs.cortecs.ai/routing/prompt-caching
schema = 2
name = "mistral-7b-instruct-v0.2"
description = "Mistral 7B Instruct is a compact, 7B parameter model optimized for fast and efficient text and code generation with a 32K token context window."
open_weights = false
release_date = "2025-05-26"

[modalities]
input = ["text", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
cache = { supported = false }
structured_output = false
temperature = false
effort_updates = false

[limit]
context = 32_000
output = 8_192

[cost.text.input]
price = 0.159

[cost.text.output]
price = 0.219
