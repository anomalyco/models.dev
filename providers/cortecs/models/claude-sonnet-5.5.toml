# Effort: OpenAI reasoning_effort, mapped by Cortecs to Claude output_config.effort.
# Matches the other Cortecs Claude entries; Sonnet 5.5 has adaptive thinking only,
# so no manual budget_tokens control.
schema = 2
base_model = "anthropic/claude-sonnet-5-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 2.25
cache = { read = 0.225, write = 2.813 }

[cost.text.output]
price = 11.249
