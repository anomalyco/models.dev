# Reasoning: inherits the lab's supported = false. The /v1/models "reasoning" feature tag is not model evidence (it is also set on gpt-4o and gpt-4.1).
# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions; reasoning_effort is a per-request field with no per-turn effort mechanism (effort_updates = false). https://docs.cortecs.ai/api/chat-completions
# Cache: not supported by the routed providers (ovh). https://docs.cortecs.ai/routing/prompt-caching
schema = 2
base_model = "alibaba/qwen2-5-vl-72b-instruct"
name = "qwen2.5-vl-72b-instruct"
description = "Qwen2.5-VL is a powerful vision-language model with advanced capabilities in visual understanding, long video reasoning, and structured output generation."

[capabilities]
tools = { supported = false }
cache = false
structured_output = true
temperature = false

[limit]
context = 32_000
output = 32_000

[cost.text.input]
price = 1.014

[cost.text.output]
price = 1.014
