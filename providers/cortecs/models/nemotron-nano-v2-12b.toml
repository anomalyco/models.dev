# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions; reasoning_effort and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://docs.cortecs.ai/api/chat-completions
# Cache: not supported by the routed providers (amazon_ireland). https://docs.cortecs.ai/routing/prompt-caching
# Input MIME types: the lab's types for each kind the Cortecs catalog lists (https://api.cortecs.ai/v1/models input_modalities).
schema = 2
base_model = "nvidia/nemotron-nano-12b-v2-vl"
name = "nemotron-nano-v2-12b"
description = "NVIDIA Nemotron Nano v2 12B is a 12-billion-parameter multimodal reasoning model designed for advanced video understanding, document intelligence, and visual reasoning, built with a hybrid Transformer-Mamba architecture for high efficiency and low latency."

[modalities]
input = ["text", "image/png", "image/jpeg"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
cache = { supported = false }
structured_output = true
temperature = false
effort_updates = false

[cost.text.input]
price = 0.24

[cost.text.output]
price = 0.707
