# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions; reasoning_effort and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://docs.cortecs.ai/api/chat-completions
# Cache: automatic prefix caching on every routed provider (azure_sc, azure_spc). https://docs.cortecs.ai/routing/prompt-caching
schema = 2
base_model = "openai/gpt-5.6-sol"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
cache = { implicit = true }
structured_output = true
effort_updates = false

[cost.text.input]
price = 4.399
cache = { read = 0.44, write = 5.5 }

[cost.text.output]
price = 21.998
