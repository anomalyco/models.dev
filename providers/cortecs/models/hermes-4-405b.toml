# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions; reasoning_effort and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://docs.cortecs.ai/api/chat-completions
# Cache: not supported by the routed providers (nebius). https://docs.cortecs.ai/routing/prompt-caching
schema = 2
base_model = "nousresearch/hermes-4-405b"
description = "Hermes 4 405B is a frontier hybrid-mode reasoning model built on Llama 3.1, optimized for advanced logic, math, coding, and structured output generation."

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = false }
cache = false
structured_output = true
temperature = false
effort_updates = false

[limit]
context = 128_000
output = 128_000

[cost.text.input]
price = 0.996

[cost.text.output]
price = 2.989
