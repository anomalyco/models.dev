# Effort: reasoning_effort = low|medium|high, the Cortecs-level control it translates per routed backend (tensorix, inceptron, scaleway, sference); no
# toggle or max is documented for every route (Entrim alone documents low|high|max and thinking off). https://docs.cortecs.ai/routing/reasoning
# Cost converted from EUR at 1 EUR = 1.1515 USD (rate 2026-08-04).
# EUR list: input €0.224 / output €0.269 / cache_read €0.056 per MTok.
# https://api.cortecs.ai/v1/models (accessed 2026-08-04)
# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions; reasoning_effort and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://docs.cortecs.ai/api/chat-completions
schema = 2
base_model = "deepseek/deepseek-v4-flash-0731"
base_model_omit = ["structured_output"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
effort_updates = false

[limit]
context = 1_048_576
output = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.082
cache = { read = 0.06 }

[cost.text.output]
price = 0.413
