schema = 2
base_model = "mistral/pixtral-large-2502"
description = "Pixtral Large (25.02) is a 124B open-weight multimodal model built on Mistral Large 2, offering advanced image understanding and strong performance across text and code tasks."

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true
temperature = false

[limit]
output = 128_000

[cost.text.input]
price = 1.993

[cost.text.output]
price = 5.978
