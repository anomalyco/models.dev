# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions; reasoning_effort is a per-request field with no per-turn effort mechanism (effort_updates = false). https://docs.cortecs.ai/api/chat-completions
# Cache: not supported by the routed providers (ovh). https://docs.cortecs.ai/routing/prompt-caching
schema = 2
name = "qwen3guard-gen-0.6b"
description = "Qwen3Guard-Gen-0.6B is a lightweight multilingual safety moderation model that classifies prompts and responses into safe, controversial, or unsafe categories."
open_weights = false
release_date = "2026-02-04"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
cache = { supported = false }
structured_output = false
temperature = false
effort_updates = false

[limit]
