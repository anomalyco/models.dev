# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions; reasoning_effort is a per-request field with no per-turn effort mechanism (effort_updates = false). https://docs.cortecs.ai/api/chat-completions
# Cache: not supported by the routed providers (amazon_ireland, amazon_paris). https://docs.cortecs.ai/routing/prompt-caching
schema = 2
base_model = "mistral/mixtral-8x7b-instruct-v0.1"
description = "Reasoning model for deliberate analysis, multi-step problem solving, and tool use"

[modalities]
input = ["text", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true }
cache = false
structured_output = true
effort_updates = false

[limit]
context = 32_000
output = 4_096

[cost.text.input]
price = 0.488

[cost.text.output]
price = 0.758
