# Sources (accessed 2026-08-17):
# https://huggingface.co/Qwen/Qwen3.8-27B
# Lab reasoning_effort is low|medium|xhigh (not high). Cortecs cost/limits retained.
schema = 2
base_model = "alibaba/qwen3.8-27b"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "xhigh"] }
structured_output = true

[limit]
context = 1_000_000
output = 500_000

[cost.text.input]
price = 0.1
cache = { read = 0.04 }

[cost.text.output]
price = 0.4
