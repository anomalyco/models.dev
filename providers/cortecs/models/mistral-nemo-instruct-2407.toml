# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions; reasoning_effort and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://docs.cortecs.ai/api/chat-completions
# Cache: not supported by the routed providers (ovh, ionos). https://docs.cortecs.ai/routing/prompt-caching
schema = 2
base_model = "mistral/mistral-nemo"
name = "mistral-nemo-instruct-2407"
description = "A 12B parameter, instruct-tuned language model by Mistral AI and NVIDIA, designed for advanced instruction following, multi-turn conversations, and generating text and code across multiple languages."

[capabilities]
tools = { supported = true }
cache = false
structured_output = true
temperature = false

[limit]
context = 118_000
output = 118_000

[cost.text.input]
price = 0.145
cache = { read = 0.014 }

[cost.text.output]
price = 0.145
