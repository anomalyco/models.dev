schema = 2
base_model = "amazon/nova-micro-v1"
description = "Nova Micro is a multilingual text-to-text foundation model with strong reasoning capabilities and broad language coverage across 200+ languages."

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true
temperature = false

[limit]
output = 10_000

[cost.text.input]
price = 0.04

[cost.text.output]
price = 0.159
