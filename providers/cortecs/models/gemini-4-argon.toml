# Effort: reasoning_effort = low|medium|high
# Source: https://docs.cortecs.ai/examples/reasoning
schema = 2
base_model = "google/gemini-4-argon"

[modalities]
input = ["text", "image", "audio", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
output = 65_535

[cost.text.input]
price = 2.25
cache = { read = 0.113 }

[cost.text.output]
price = 11.249
