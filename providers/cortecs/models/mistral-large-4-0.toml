# Effort: OpenAI reasoning_effort, routed to Mistral's native none|high levels
# (see providers/mistral/models/mistral-large-4.toml).
# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions; reasoning_effort and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://docs.cortecs.ai/api/chat-completions
# Cache: automatic prefix caching on every routed provider (mistral). https://docs.cortecs.ai/routing/prompt-caching
schema = 2
base_model = "mistral/mistral-large-4"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "high"] }
cache = { implicit = true }
structured_output = true
effort_updates = false

[limit]
context = 1_000_000

[cost.text.input]
price = 0.765
cache = { read = 0.079 }

[cost.text.output]
price = 2.351
