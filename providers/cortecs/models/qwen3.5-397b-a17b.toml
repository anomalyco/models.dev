# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions; reasoning_effort and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://docs.cortecs.ai/api/chat-completions
# Cache: not supported by the routed providers (scaleway, ovh, ionos). https://docs.cortecs.ai/routing/prompt-caching
schema = 2
base_model = "alibaba/qwen3.5-397b-a17b"
base_model_omit = ["structured_output"]

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
cache = { supported = false }
structured_output = true
effort_updates = false

[limit]
context = 262_000
output = 262_000

[cost.text.input]
price = 0.668

[cost.text.output]
price = 4.01
