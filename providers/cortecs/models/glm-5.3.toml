# Effort: reasoning_effort = low|high|max, matching the lab and relay peers.
# Cortecs maps reasoning_effort to backend controls; GLM-5.3 always reasons.
# https://docs.z.ai/guides/llm/glm-5.3
# https://docs.cortecs.ai/examples/reasoning
base_model = "zhipuai/glm-5.3"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 1.4
output = 4.399
cache_read = 0.26

[limit]
context = 1_048_576
output = 1_048_576
