# Effort: reasoning_effort = low|high|max, matching the lab and relay peers.
# Cortecs maps reasoning_effort to backend controls; GLM-5.3 always reasons.
# https://docs.z.ai/guides/llm/glm-5.3
# https://docs.cortecs.ai/examples/reasoning
# Mid-conversation: Cortecs serves this model on POST https://api.cortecs.ai/v1/chat/completions; reasoning_effort and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://docs.cortecs.ai/api/chat-completions
schema = 2
base_model = "zhipuai/glm-5.3"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
context = 1_048_576
output = 1_048_576

[cost.text.input]
price = 0.511
cache = { read = 0.154 }

[cost.text.output]
price = 2.045
