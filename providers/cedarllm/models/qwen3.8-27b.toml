# Toggle: reasoning_effort = none (off) | any other value (on); also chat_template_kwargs.enable_thinking = true|false. Thinking is off by default.
# Effort is not graded on this host: CedarLLM runs llama.cpp, whose Qwen3.8 template only has enable_thinking, and the API maps every
# non-"none" reasoning_effort to enable_thinking = true. Docs (https://cedarllm.com/docs, "Thinking"): "Thinking is off by default" and
# "low, medium and high all switch thinking on, there is no separate effort level". Live probe 2026-11-12 (n=2 each, same prompt):
# no parameter -> no reasoning_content (6 completion tokens); low -> 73/126 tokens; xhigh -> 79/84 tokens (no separation).
# So toggle = true with default off; no effort list (unlike Alibaba's own API and peers that grade effort).
# Source: https://cedarllm.com/docs and https://api.cedarllm.com/v1/models (accessed 2026-11-12)
# Prices from the catalog: prompt 0.00000003, completion 0.00000115, input_cache_read 0.00000003 USD/token.
# Served as a 4-bit GGUF build; input is text and images (documented with JPEG/PNG examples), no video, so modalities.input is narrowed.
# Limits: context_length 262144, max_output_length 32768 (same as the lab file).
# Cache: automatic prefix reuse (docs: shared beginning reused, reported in usage.prompt_tokens_details.cached_tokens, billed at the normal input price), so implicit cache with read price = input price.
# Mid-conversation: reasoning and tools are per-request fields only (no effort_updates / tools.updates).
schema = 2
base_model = "alibaba/qwen3.8-27b"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, default = { type = "toggle", value = false } }
structured_output = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.03
cache = { read = 0.03 }

[cost.text.output]
price = 1.15
