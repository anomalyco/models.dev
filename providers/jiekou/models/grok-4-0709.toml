# Catalog: GET https://api.jiekou.ai/openai/models (2026-10-21): USD per 1M tokens (price_per_m_decimal, after Jiekou's listed discount), context_size, max_output_tokens, features, input_modalities.
# Standalone: no lab file. xAI no longer documents grok-4-0709 (https://docs.x.ai/docs/models/grok-4-0709 now shows the model list), so a lab's output limit and knowledge can't be sourced.
schema = 2
name = "grok-4-0709"
description = "Grok model for agentic tool use, reasoning, coding, and live assistance"
family = "grok"
open_weights = false
release_date = "2026-01"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
structured_output = true
temperature = true

[limit]
context = 256_000
output = 256_000

[cost.text.input]
price = 2.85

[cost.text.output]
price = 14.25
