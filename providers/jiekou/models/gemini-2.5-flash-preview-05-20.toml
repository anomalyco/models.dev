# Catalog: GET https://api.jiekou.ai/openai/models (2026-10-21): USD per 1M tokens (price_per_m_decimal, after Jiekou's listed discount), context_size, max_output_tokens, features, input_modalities.
# Cache: Gemini is implicit-only (no cache_control); minimums per https://docs.jiekou.ai/docs/feature/prompt-caching (2026-10-21).
# Effort: top-level reasoning_effort, converted to a Gemini thinking budget (none/disable 0, low 1024, medium 2048, high 4096); https://docs.jiekou.ai/docs/providers/gemini.
schema = 2
name = "gemini-2.5-flash-preview-05-20"
description = "Fast Gemini model balancing multimodal reasoning, tool use, and cost"
family = "gemini-flash"
open_weights = false
release_date = "2026-01"

[modalities]
input = ["text", "image", "video", "audio"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
cache = { supported = true, implicit = { min_tokens = 1_024 } }
structured_output = true
temperature = true

[limit]
context = 1_048_576
output = 200_000

[cost.text.input]
price = 0.1425
cache = { read = 0.0285 }

[cost.text.output]
price = 3.325
