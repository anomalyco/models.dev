# Status: absent from GET https://api.jiekou.ai/openai/models and GET /openai/models/gemini-2.5-flash-lite-preview-06-17 returns 404 MODEL_NOT_FOUND (2026-10-21). Price, limits and capabilities are the last listed values.
# Cache: Gemini is implicit-only (no cache_control); minimums per https://docs.jiekou.ai/docs/feature/prompt-caching (2026-10-21).
# Effort: top-level reasoning_effort, converted to a Gemini thinking budget (none/disable 0, low 1024, medium 2048, high 4096); https://docs.jiekou.ai/docs/providers/gemini.
schema = 2
name = "gemini-2.5-flash-lite-preview-06-17"
description = "Low-latency Gemini model for high-volume multimodal and agent workloads"
family = "gemini-flash-lite"
open_weights = false
release_date = "2026-01"
status = "deprecated"

[modalities]
input = ["text", "video", "image", "audio"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
cache = { supported = true, implicit = true }
structured_output = true
temperature = true

[limit]
context = 1_048_576
output = 65_535

[cost.text.input]
price = 0.09

[cost.text.output]
price = 0.36
