# Source: https://inference.boundless.network/models (GET https://inference.boundless.network/api/catalog), 2026-11-27
# Reasoning: reasoning_effort on Chat Completions (https://inference.boundless.network/docs/reasoning).
# Values are the ones Boundless's gateway accepts for this model, from its deployed configuration (2026-11-27);
# any other value gets a 400 `invalid_reasoning_effort` whose message lists the accepted set.
# Boundless hosts the weights and maps each value onto the model's own levels in the gateway: none turns thinking off in the chat template (self-hosted weights, unlike Moonshot's API); low -> low, medium and high -> high, max -> max. `minimal` (-> low) and `xhigh` (-> max) are also accepted.
schema = 2
base_model = "moonshotai/kimi-k3.1-pro"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"] }
structured_output = true

[cost.text.input]
price = 1.7
cache = { read = 0.2 }

[cost.text.output]
price = 8.5
