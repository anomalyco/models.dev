# Rate card: https://inference.boundless.network/models — USD per 1M tokens
# Reasoning: reasoning_effort = low|medium|high — this model always reasons, the host rejects 'none' with a 400
# Docs: https://inference.boundless.network/docs/api-compatibility

base_model = "alibaba/qwen3.8-flash"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high"] }]

[cost]
input = 0.15
output = 0.47
cache_read = 0.016

[modalities]
input = ["text", "image"]
