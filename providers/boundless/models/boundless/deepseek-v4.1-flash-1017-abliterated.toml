# Source: https://inference.boundless.network/models (GET https://inference.boundless.network/api/catalog), 2026-11-27
# Boundless hosts an abliterated variant of the base model: the same model with its refusal behaviour removed.
# Reasoning: reasoning_effort on Chat Completions (https://inference.boundless.network/docs/reasoning).
# Values are the ones Boundless's gateway accepts for this model, from its deployed configuration (2026-11-27);
# any other value gets a 400 `invalid_reasoning_effort` whose message lists the accepted set.
# Boundless hosts the weights and maps each value onto the model's own levels in the gateway: none turns thinking off; low -> low, medium and high -> high, xhigh -> xhigh, max -> max. `minimal` is also accepted (-> low).
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"
name = "DeepSeek V4.1 Flash 1017 Abliterated"
description = "Abliterated variant of DeepSeek V4.1 Flash 1017 hosted by Boundless"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[limit]
context = 1_048_576

[cost.text.input]
price = 0.24
cache = { read = 0.012 }

[cost.text.output]
price = 0.96
