# Source: https://inference.boundless.network/models (GET https://inference.boundless.network/api/catalog), 2026-11-27
# Boundless hosts an abliterated variant of the base model: the same model with its refusal behaviour removed.
# Reasoning: reasoning_effort on Chat Completions (https://inference.boundless.network/docs/reasoning).
# Values are the ones Boundless's gateway accepts for this model, from its deployed configuration (2026-11-27);
# any other value gets a 400 `invalid_reasoning_effort` whose message lists the accepted set.
# Boundless hosts the weights and maps each value onto the model's own levels in the gateway: low, medium and high are passed to the chat template as they are.
# The model always reasons, so `none` returns a 400 `thinking_off_unsupported` and is not listed.
# Same serving configuration as thinkingmachines/inkling-2-mini on this host, where this was checked live.
# Input: text only on this host. The catalog row's `supports` is ["text", "reasoning", "tool-use", "abliterated"] (2026-11-28), without the
# `image input` and `vision` labels the catalog gives the host's image models (z-ai/glm-5.3-flash, xiaomi/mimo-v2.6-flash), so the lab's image input is not carried over.
schema = 2
base_model = "thinkingmachines/inkling-2-mini"
name = "Inkling 2 Mini Abliterated"
description = "Abliterated variant of Inkling 2 Mini hosted by Boundless"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 0.18
cache = { read = 0.04 }

[cost.text.output]
price = 0.45
