# Rate card: https://inference.boundless.network/models — USD per 1M tokens
# Reasoning: reasoning_effort = none|low|medium|high (Responses: reasoning.effort)
# Docs: https://inference.boundless.network/docs/api-compatibility

base_model = "openai/gpt-5.6-sol"
base_model_omit = ["limit.input"]
attachment = false
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high"] }]

[cost]
input = 2
output = 10
cache_read = 0.2

[limit]
context = 262_144
output = 128_000

[modalities]
input = ["text"]
