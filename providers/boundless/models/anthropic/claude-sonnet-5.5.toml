# Source: https://inference.boundless.network/models (GET https://inference.boundless.network/api/catalog), 2026-11-27
# Reasoning: reasoning_effort, https://inference.boundless.network/docs/reasoning
schema = 2
base_model = "anthropic/claude-sonnet-5-5"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[cost.text.input]
price = 2
cache = { read = 0.1 }

[cost.text.output]
price = 10
