# Source: https://inference.boundless.network/models (GET https://inference.boundless.network/api/catalog), 2026-11-27
# Reasoning: reasoning_effort on Chat Completions (https://inference.boundless.network/docs/reasoning).
# Values are the ones Boundless's gateway accepts for this model, from its deployed configuration (2026-11-27);
# any other value gets a 400 `invalid_reasoning_effort` whose message lists the accepted set.
# Boundless serves this model through OpenRouter and forwards the value, so the list is OpenRouter's for this model, minus `none`, which the gateway refuses with its own 400 (`thinking_off_unsupported`).
schema = 2
base_model = "anthropic/claude-sonnet-5-5"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 2
cache = { read = 0.1 }

[cost.text.output]
price = 10
