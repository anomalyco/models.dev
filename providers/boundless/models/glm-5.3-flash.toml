schema = 2
base_model = "zhipuai/glm-5.3-flash"

[modalities]
input = ["text", "image/jpeg", "image/png", "video/mp4", "video/x-matroska", "video/quicktime"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high"] }
structured_output = true

[limit]
context = 1_048_576

[cost.text.input]
price = 0.12
cache = { read = 0.024 }

[cost.text.output]
price = 0.4
