# Linked to models/openai/gpt-5.2-chat-latest.toml (same model).
# knowledge: unsourced host value kept as an override (lab: 2025-08-31).
schema = 2
base_model = "openai/gpt-5.2-chat-latest"
name = "GPT-5.2 Chat Latest"
knowledge = "2024-09-30"

[capabilities]
reasoning = { supported = true }
temperature = true

[limit]
context = 400_000
output = 128_000

[cost.text.input]
price = 1.75

[cost.text.output]
price = 14
