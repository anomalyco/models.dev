# Source: https://routellm.abacus.ai/v1/models
# RouteLLM reasoning: /v1/models exposes only `thinking`; the provider API has no
# toggle, effort or budget request field (provider.toml audit, 2026-06-25).
# RouteLLM input_modalities: ["text","image","video"]
# RouteLLM output_modalities: ["text"]
# RouteLLM context_length: 1000000
# RouteLLM max_completion_tokens: 262144
# RouteLLM input_token_rate: 0.0000015
# RouteLLM output_token_rate: 0.0000045
# RouteLLM cached_input_token_rate: 0.000000075
# RouteLLM thinking: None
schema = 2
base_model = "alibaba/qwen4-max"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic", "video/mp4", "video/x-msvideo", "video/x-matroska", "video/quicktime", "video/x-flv", "video/x-ms-wmv"]
output = ["text"]

[capabilities]
reasoning = { supported = true }

[cost.text.input]
price = 1.5
cache = { read = 0.075 }

[cost.text.output]
price = 4.5
