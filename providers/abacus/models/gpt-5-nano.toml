# Source: https://routellm.abacus.ai/v1/models
# RouteLLM API does not report thinking: true for this ID.
# RouteLLM input_modalities: ['text', 'image']
# RouteLLM output_modalities: ['text']
# RouteLLM context_length: 400000
# RouteLLM max_completion_tokens: 128000
# RouteLLM input_token_rate: 0.00000005
# RouteLLM output_token_rate: 0.0000004
# RouteLLM cached_input_token_rate: 0.000000005
schema = 2
base_model = "openai/gpt-5-nano"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true

[limit]
context = 400_000
output = 128_000

[cost.text.input]
price = 0.05
cache = { read = 0.005 }

[cost.text.output]
price = 0.4
