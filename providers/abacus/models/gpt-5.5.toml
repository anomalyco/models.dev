# Source: https://routellm.abacus.ai/v1/models
# RouteLLM input_modalities: ['text', 'image']
# RouteLLM output_modalities: ['text']
# RouteLLM context_length: 1000000
# RouteLLM max_completion_tokens: 128000
# RouteLLM input_token_rate: 0.000005
# RouteLLM output_token_rate: 0.00003
# RouteLLM cached_input_token_rate: 0.0000005
# RouteLLM thinking: True
# tools.freeform: not listed - RouteLLM Chat Completions accepts only
# type "function" tools and documents no custom/grammar field
# (https://abacus.ai/help/route-llm/chat-completions, accessed 2026-11-12).
schema = 2
base_model = "openai/gpt-5.5"
base_model_omit = ["limit.input"]

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true

[limit]
context = 1_000_000

[cost.text.input]
price = 5
cache = { read = 0.5 }

[cost.text.output]
price = 30
