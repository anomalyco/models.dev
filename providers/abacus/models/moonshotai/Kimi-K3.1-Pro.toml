# Source: https://routellm.abacus.ai/v1/models
# RouteLLM reasoning: /v1/models exposes only `thinking`; the provider API has no
# toggle, effort or budget request field (provider.toml audit, 2026-06-25).
# RouteLLM input_modalities: ["text","image","video"]
# RouteLLM output_modalities: ["text"]
# RouteLLM context_length: 1048576
# RouteLLM max_completion_tokens: 131072
# RouteLLM input_token_rate: 0.000002
# RouteLLM output_token_rate: 0.00001
# RouteLLM cached_input_token_rate: 0.0000002
# RouteLLM thinking: None
# Output limit: the lab documents a 131,072 default and 1,048,576 maximum; RouteLLM's
# /v1/models advertises max_completion_tokens 131,072 (live 2026-11-15), treated as the
# host's request ceiling. No ABACUS_API_KEY was available to probe a larger request.
schema = 2
base_model = "moonshotai/kimi-k3.1-pro"

[capabilities]
reasoning = { supported = true }

[limit]
output = 131_072

[cost.text.input]
price = 2
cache = { read = 0.2 }

[cost.text.output]
price = 10
