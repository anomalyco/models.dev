# Source: https://routellm.abacus.ai/v1/models
# RouteLLM input_modalities: ["text","image","audio","video"]
# RouteLLM output_modalities: ["text"]
# RouteLLM context_length: 1048576
# RouteLLM max_completion_tokens: 131072
# RouteLLM input_token_rate: 0.0000001
# RouteLLM output_token_rate: 0.0000002
# RouteLLM cached_input_token_rate: 0.000000002
# RouteLLM thinking: None
schema = 2
base_model = "meta/muse-spark-1.3"
name = "Muse Spark 1.3 Contributor"
description = "Muse Spark 1.3 Contributor is the contributor tier of Muse Spark 1.3, Meta's natively multimodal reasoning model with a 1M token context window and text, image, video, audio, and PDF inputs, with native tool use and parallel tool calling. It is the same model at heavily discounted rates in exchange for Meta using prompts and completions to train future Meta models."

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "video/mp4", "audio/mpeg", "audio/wav"]
output = ["text"]

[capabilities]
reasoning = { supported = true }

[cost.text.input]
price = 0.1
cache = { read = 0.002 }

[cost.text.output]
price = 0.2
