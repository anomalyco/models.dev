# Source: https://routellm.abacus.ai/v1/models
# RouteLLM API does not report thinking: true for this ID.
# RouteLLM input_modalities: ['text']
# RouteLLM output_modalities: ['text']
# RouteLLM context_length: 128000
# RouteLLM max_completion_tokens: 16384
# RouteLLM input_token_rate: 0.00000008
# RouteLLM output_token_rate: 0.00000044
schema = 2
base_model = "openai/gpt-oss-120b"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true

[limit]
context = 128_000
output = 16_384

[cost.text.input]
price = 0.08

[cost.text.output]
price = 0.44
