# Source: https://routellm.abacus.ai/v1/models
# RouteLLM API does not report thinking: true for this ID.
# RouteLLM input_modalities: ['text', 'image']
# RouteLLM output_modalities: ['text']
# RouteLLM context_length: 400000
# RouteLLM max_completion_tokens: 128000
# RouteLLM input_token_rate: 0.0000002
# RouteLLM output_token_rate: 0.00000125
# RouteLLM cached_input_token_rate: 0.00000002
# tools.freeform: not listed - RouteLLM Chat Completions accepts only
# type "function" tools and documents no custom/grammar field
# (https://abacus.ai/help/route-llm/chat-completions, accessed 2026-11-12).
schema = 2
base_model = "openai/gpt-5.4-nano"

[capabilities]
reasoning = { supported = true }
structured_output = true

[cost.text.input]
price = 0.2
cache = { read = 0.02 }

[cost.text.output]
price = 1.25
