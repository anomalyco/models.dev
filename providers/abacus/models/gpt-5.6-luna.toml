# Source: https://routellm.abacus.ai/v1/models
# RouteLLM input_modalities: ['text', 'image']
# RouteLLM output_modalities: ['text']
# RouteLLM context_length: 1000000
# RouteLLM max_completion_tokens: 128000
# RouteLLM input_token_rate: 0.0000002
# RouteLLM output_token_rate: 0.0000012
# RouteLLM cached_input_token_rate: 0.00000002
# RouteLLM thinking: True
# Prices refreshed from https://routellm.abacus.ai/v1/models (accessed 2026-10-21).
schema = 2
base_model = "openai/gpt-5.6-luna"
base_model_omit = ["limit.input"]

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true

[limit]
context = 1_000_000

[cost.text.input]
price = 0.2
cache = { read = 0.02 }

[cost.text.output]
price = 1.2
