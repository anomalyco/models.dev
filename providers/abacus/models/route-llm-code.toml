name = "RouteLLM (Code)"
description = "CodeLLM's agent router: classifies each turn by complexity and routes it to Haiku, GLM, Sonnet or Opus. Built for coding agents, unlike route-llm. Rates shown are the ladder's most common destination; you are billed for the model each turn actually resolves to."
