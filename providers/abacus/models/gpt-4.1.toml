# Source: https://routellm.abacus.ai/v1/models
# RouteLLM input_modalities: ['text', 'image']
# RouteLLM output_modalities: ['text']
# RouteLLM context_length: 1047576
# RouteLLM max_completion_tokens: 32768
# RouteLLM input_token_rate: 0.000002
# RouteLLM output_token_rate: 0.000008
# RouteLLM cached_input_token_rate: 0.0000005
schema = 2
base_model = "openai/gpt-4.1"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = false }
structured_output = true

[limit]
context = 1_047_576
output = 32_768

[cost.text.input]
price = 2
cache = { read = 0.5 }

[cost.text.output]
price = 8
