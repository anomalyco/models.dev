# Source: https://routellm.abacus.ai/v1/models
# RouteLLM input_modalities: ["text","image"]
# RouteLLM output_modalities: ["text"]
# RouteLLM context_length: 1000000
# RouteLLM max_completion_tokens: 128000
# RouteLLM input_token_rate: 0.000004
# RouteLLM output_token_rate: 0.00002
# RouteLLM cached_input_token_rate: 0.0000002
# RouteLLM thinking: None
schema = 2
base_model = "anthropic/claude-opus-5-5"
description = "Claude Opus 5.5 from Anthropic is a step-change improvement over Opus 5, with the biggest gains in agentic coding, long-running agentic tasks, and knowledge work. It excels in tasks requiring long, complex reasoning chains, but is also expensive."

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true }

[cost.text.input]
price = 4
cache = { read = 0.2 }

[cost.text.output]
price = 20
