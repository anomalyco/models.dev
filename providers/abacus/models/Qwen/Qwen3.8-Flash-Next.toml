schema = 2
base_model = "alibaba/qwen3.8-flash-next"
description = "Qwen3.8 Flash Next is a 125B-parameter MoE model (6B active) from Alibaba's Qwen series, featuring hybrid attention (Gated DeltaNet + Qwen Sparse Attention) for ultra-efficient inference, native image and video input, a 1M token context window, and built-in configurable thinking."

[capabilities]
reasoning = { supported = true }

[limit]
context = 1_000_000

