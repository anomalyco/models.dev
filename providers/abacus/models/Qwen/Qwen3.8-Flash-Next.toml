# Source: https://routellm.abacus.ai/v1/models
# RouteLLM reasoning: /v1/models exposes only `thinking`; the provider API has no
# toggle, effort or budget request field (provider.toml audit, 2026-06-25).
# Host context: the feed publishes context_length 1,000,000; the lab documents
# 262,144 native with extension up to 1M. The host advertises the extended window.
# RouteLLM input_modalities: ["text","image","video"]
# RouteLLM output_modalities: ["text"]
# RouteLLM context_length: 1000000
# RouteLLM max_completion_tokens: 131072
# RouteLLM input_token_rate: 0.00000015
# RouteLLM output_token_rate: 0.00000047
# RouteLLM cached_input_token_rate: 0.000000016
# RouteLLM thinking: None
schema = 2
base_model = "alibaba/qwen3.8-flash-next"

[capabilities]
reasoning = { supported = true }

[limit]
context = 1_000_000

[cost.text.input]
price = 0.15
cache = { read = 0.016 }

[cost.text.output]
price = 0.47
