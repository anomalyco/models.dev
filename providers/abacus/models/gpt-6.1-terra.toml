# Source: https://routellm.abacus.ai/v1/models
# RouteLLM reasoning: /v1/models exposes only `thinking`; the provider API has no
# toggle, effort or budget request field (provider.toml audit, 2026-06-25).
# RouteLLM input_modalities: ["text","image"]
# RouteLLM output_modalities: ["text"]
# RouteLLM context_length: 1000000
# RouteLLM max_completion_tokens: 128000
# RouteLLM input_token_rate: 0.000001
# RouteLLM output_token_rate: 0.000005
# RouteLLM cached_input_token_rate: 0.00000005
# RouteLLM thinking: None
# tools.freeform: not listed - RouteLLM Chat Completions accepts only
# type "function" tools and documents no custom/grammar field
# (https://abacus.ai/help/route-llm/chat-completions, accessed 2026-11-12).
schema = 2
base_model = "openai/gpt-6.1-terra"
base_model_omit = ["limit.input"]

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true }

[limit]
context = 1_000_000

[cost.text.input]
price = 1
cache = { read = 0.05 }

[cost.text.output]
price = 5
