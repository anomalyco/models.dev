# Source: https://routellm.abacus.ai/v1/models
# RouteLLM input_modalities: ["text","image"]
# RouteLLM output_modalities: ["text"]
# RouteLLM context_length: 1000000
# RouteLLM max_completion_tokens: 128000
# RouteLLM input_token_rate: 0.000001
# RouteLLM output_token_rate: 0.000005
# RouteLLM cached_input_token_rate: 0.00000005
# RouteLLM thinking: None
schema = 2
base_model = "openai/gpt-6.1-terra"
base_model_omit = ["limit.input"]
description = "GPT-6.1 Terra from OpenAI is a cost-efficient mid-tier model for everyday reasoning, coding and agentic work, with a 1M context window."

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true }

[limit]
context = 1_000_000

[cost.text.input]
price = 1
cache = { read = 0.05 }

[cost.text.output]
price = 5
