# Source: https://routellm.abacus.ai/v1/models
# RouteLLM input_modalities: ["text","image"]
# RouteLLM output_modalities: ["text"]
# RouteLLM context_length: 1000000
# RouteLLM max_completion_tokens: 128000
# RouteLLM input_token_rate: 0.000002
# RouteLLM output_token_rate: 0.00001
# RouteLLM cached_input_token_rate: 0.0000002
# RouteLLM thinking: True
schema = 2
base_model = "openai/gpt-6-sol"
base_model_omit = ["limit.input"]
description = "GPT-6 Sol from OpenAI is a flagship model for complex reasoning, coding and agentic work, with a 1M context window."

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true }

[limit]
context = 1_000_000

[cost.text.input]
price = 2
cache = { read = 0.2 }

[cost.text.output]
price = 10
