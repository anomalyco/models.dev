# Source: https://routellm.abacus.ai/v1/models
# RouteLLM input_modalities: ["text","image"]
# RouteLLM output_modalities: ["text"]
# RouteLLM context_length: 1000000
# RouteLLM max_completion_tokens: 131072
# RouteLLM input_token_rate: 0.00000015
# RouteLLM output_token_rate: 0.0000006
# RouteLLM cached_input_token_rate: 0.000000015
# RouteLLM thinking: None
schema = 2
base_model = "minimax/MiniMax-M3.1-Flash"
name = "MiniMax M3.1 Flash"
description = "MiniMax M3.1 Flash is MiniMax's fast, low-cost reasoning model with a 1,000,000 token context window, taking text and image input. Reasoning is always on and runs at MiniMax's max effort by default. Supports tools and streaming; for schema-bound output use a tool call, as MiniMax ignores response_format."

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true }

[limit]
output = 131_072

[cost.text.input]
price = 0.15
cache = { read = 0.015 }

[cost.text.output]
price = 0.6
