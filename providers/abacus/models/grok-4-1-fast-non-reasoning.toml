# Input MIME types: JPEG and PNG, as in the xAI lab files (models/xai/grok-4.1-fast.toml).
# Status: absent from https://routellm.abacus.ai/v1/models (accessed 2026-10-21).
schema = 2
name = "Grok 4.1 Fast (Non-Reasoning)"
description = "Fast Grok model for responsive chat, reasoning, and tool-assisted work"
family = "grok"
open_weights = false
release_date = "2025-11-17"
status = "deprecated"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true

[limit]
context = 2_000_000
output = 16_384

[cost.text.input]
price = 0.2

[cost.text.output]
price = 0.5
