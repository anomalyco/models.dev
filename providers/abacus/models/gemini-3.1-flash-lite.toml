# Source: https://routellm.abacus.ai/v1/models
# RouteLLM input_modalities: ['text', 'image', 'audio']
# RouteLLM output_modalities: ['text']
# RouteLLM context_length: 1048576
# RouteLLM max_completion_tokens: 65536
# RouteLLM input_token_rate: 0.00000025
# RouteLLM output_token_rate: 0.0000015
# RouteLLM cached_input_token_rate: 0.000000025
# RouteLLM thinking: True
schema = 2
base_model = "google/gemini-3.1-flash-lite"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "audio/wav", "audio/mp3", "audio/aiff", "audio/aac", "audio/ogg", "audio/flac", "audio/mpeg", "audio/m4a", "audio/l16", "audio/opus", "audio/alaw", "audio/mulaw", "audio/webm"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true

[cost.text.input]
price = 0.25
cache = { read = 0.025 }

[cost.text.output]
price = 1.5
