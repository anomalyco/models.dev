# Linked to models/google/gemini-3.1-flash-lite-preview.toml (same model).
schema = 2
base_model = "google/gemini-3.1-flash-lite-preview"

[modalities]
input = ["text", "image", "audio", "video", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true

[cost.text.input]
price = 0.25
cache = { read = 0.025, write = 1 }

[cost.text.output]
price = 1.5
