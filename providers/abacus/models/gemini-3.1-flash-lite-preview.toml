# Linked to models/google/gemini-3.1-flash-lite-preview.toml (same model).
schema = 2
base_model = "google/gemini-3.1-flash-lite-preview"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "audio/wav", "audio/mp3", "audio/aiff", "audio/aac", "audio/ogg", "audio/flac", "audio/mpeg", "audio/m4a", "audio/l16", "audio/opus", "audio/alaw", "audio/mulaw", "audio/webm", "video/mp4", "video/mpeg", "video/mov", "video/avi", "video/x-flv", "video/mpg", "video/webm", "video/wmv", "video/3gpp", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true

[cost.text.input]
price = 0.25
cache = { read = 0.025, write = 1 }

[cost.text.output]
price = 1.5
