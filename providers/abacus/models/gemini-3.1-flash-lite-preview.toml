schema = 2
name = "Gemini 3.1 Flash Lite Preview"
description = "Low-latency Gemini model for high-volume multimodal and agent workloads"
family = "gemini-flash"
open_weights = false
release_date = "2026-03-01"

[modalities]
input = ["text", "image", "audio", "video", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
structured_output = true
temperature = true

[limit]
context = 1_048_576
output = 65_536

[cost.text.input]
price = 0.25
cache = { read = 0.025, write = 1 }

[cost.text.output]
price = 1.5
