# Community fine-tune (not a lab release): base weights meta-llama/Llama-3.1-70B; no models/ lab entry exists,
# so it is authored inline like the providers/nano-gpt peer entries for community fine-tunes.
# Pricing (USD/1M): https://api.demonroute.com/api/pricing (model_ratio x 2, x completion_ratio) and
# https://demonroute.com/models, both checked 2026-09-29. Context: DemonRoute catalog.
# limit.output: API rejects max_tokens above 32768 for this model (probed 2026-09-29).
# Dates: Hugging Face repo createdAt / lastModified for https://huggingface.co/NousResearch/Hermes-4-70B
# reasoning = true, reasoning_options = []: hybrid reasoning is enabled by the Nous "deep thinking" system prompt (no API toggle).
# Probed 2026-09-29 on /v1/chat/completions: with that system prompt the host returned thinking in a separate `reasoning`
# message field; without it, plain answers. Same encoding as providers/nebius/models/NousResearch/Hermes-4-405B.toml.
# No [interleaved]: the host's field name (`reasoning`) is not one of the schema's interleaved fields, and interleaving was not verified.
# tool_call: returned structured tool_calls (finish_reason=tool_calls) on /v1/chat/completions, 2026-09-29.
name = "Hermes 4 70B"
