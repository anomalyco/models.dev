# Pricing: Token Plan Personal Edition (international) list credit coefficients, checked 2026-11-27:
#   Cache-missed input / output / cached input: 312.5 / 1562.5 / 31.25 credits per million tokens;
#   cache write 5m 312.5, 1h 625.
#   https://intl.cloud.tencent.com/document/product/1300/81316 (updated 2026-11-26); promotions excluded.
# Cost omitted: a credit has no single USD value. Plans sell 1,000 / 2,600 / 7,900 / 15,900 credits for
#   USD 7 / 17 / 51 / 103 a month (Lite / Standard / Pro / Max), i.e. USD 0.007 / 0.006538 / 0.006456 /
#   0.006478 per credit (https://intl.cloud.tencent.com/document/product/1300/81315, updated 2026-11-26), and no per-credit price is published.
#   Unknown does not mean free.
# Availability: Token Plan Overview > Available models, https://intl.cloud.tencent.com/document/product/1300/81315
# Specifications: https://intl.cloud.tencent.com/document/product/1300/78934 (1M context, 1M input, 1M output).
# Implicit cache: https://cloud.tencent.com/document/product/1823/131410
# API: https://cloud.tencent.com/document/product/1823/132232
# Effort: reasoning_effort = low|high|max (default max), always thinks. Tencent's reasoning guide
#   (https://cloud.tencent.com/document/product/1823/131208) doesn't list K3.1 Pro yet; controls follow the tencent-token-plan entry for this model.
schema = 2
base_model = "moonshotai/kimi-k3.1-pro"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
