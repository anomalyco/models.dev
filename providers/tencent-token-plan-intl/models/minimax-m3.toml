# Tencent Token Plan International, Singapore. Credits subscription has no
# per-token USD price. Tencent's generic reasoning page omits MiniMax-M3; the
# native API's thinking control is adaptive or disabled. The current Token Plan
# OpenCode configuration and model guide expose this host as text-only.
# Sources: https://www.tencentcloud.com/document/product/1300/78934
# https://www.tencentcloud.com/document/product/1300/81317
# https://platform.minimax.io/docs/guides/text-generation
# Toggle: thinking.type = adaptive|disabled
base_model = "minimax/MiniMax-M3"

attachment = false

[[reasoning_options]]
type = "toggle"

[interleaved]
field = "reasoning_content"

[cost]
input = 0
output = 0
cache_read = 0
cache_write = 0

[modalities]
input = ["text"]
