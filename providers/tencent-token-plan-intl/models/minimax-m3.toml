# Toggle: thinking.type = adaptive|disabled (host default adaptive; enabled is
# rejected -- allowed values are adaptive and disabled, verified live
# 2026-08-30. Adaptive chose not to reason on the test queries, so the
# toggle's effect is the documented control surface rather than an observed
# reasoning difference)
# https://intl.cloud.tencent.com/document/product/1300/80637
base_model = "minimax/MiniMax-M3"

reasoning_options = [{ type = "toggle" }]

[interleaved]
field = "reasoning_content"

[cost]
input = 0
output = 0
cache_read = 0
cache_write = 0
