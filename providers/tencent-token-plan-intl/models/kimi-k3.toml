# Tencent Token Plan International, Singapore. Credits subscription has no
# per-token USD price. Host reasoning_effort supports low, high, and max.
# Sources: https://www.tencentcloud.com/document/product/1300/78934
# https://www.tencentcloud.com/document/product/1300/80635
# https://www.tencentcloud.com/document/product/1300/80637
base_model = "moonshotai/kimi-k3"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 0
output = 0
cache_read = 0
cache_write = 0

[limit]
output = 1_048_576
