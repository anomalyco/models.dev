# Toggle: thinking.type = enabled|disabled (default enabled; verified live
# 2026-08-30: disabled yields zero reasoning tokens, enabled restores them.
# reasoning_effort is silently ignored by this model)
# https://intl.cloud.tencent.com/document/product/1300/80637
base_model = "moonshotai/kimi-k2.6"

reasoning_options = [{ type = "toggle" }]

[interleaved]
field = "reasoning_content"

[cost]
input = 0
output = 0
cache_read = 0
cache_write = 0
