# Sources (accessed 2026-11-25): https://straitly.ai/api/catalog (re-verified price.cacheRead = 0.12), GET https://api.straitly.ai/v1/models, live probes on /v1/chat/completions and /v1/messages.
schema = 2
base_model = "anthropic/claude-sonnet-5-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { explicit = { ttl = ["5m"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 512 } }

[api.chat-completions]

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 1.2
cache = { read = 0.12, write = { "5m" = 1.5 } }

[cost.text.output]
price = 6
