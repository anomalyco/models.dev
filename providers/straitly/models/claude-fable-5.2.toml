# Model ID: exact canonical ID listed in GET https://api.straitly.ai/v1/models and https://straitly.ai/api/catalog is dotted "claude-fable-5.2" (re-verified 2026-11-25; dashed claude-fable-5-2 is not listed).
# Sources (accessed 2026-11-25): https://straitly.ai/api/catalog, GET https://api.straitly.ai/v1/models, live probe on /v1/messages.
schema = 2
base_model = "anthropic/claude-fable-5-2"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { explicit = { ttl = ["5m"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 512 } }

[api.chat-completions]

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 4.8
cache = { read = 0.12, write = { "5m" = 6 } }

[cost.text.output]
price = 24
