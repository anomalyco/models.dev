# Effort: reasoning_effort = low|medium|xhigh (live-verified 2026-11-25 on Straitly /v1/chat/completions: low -> rtok=35, xhigh -> rtok=78; enable_thinking=true/false and thinking.type=enabled/disabled all returned rtok=0, so toggle is omitted)
# Budget: reasoning.max_tokens (live-verified 2026-11-25 on Straitly /v1/chat/completions: max_tokens=256/1024 -> rtok=175/224)
# Sources (accessed 2026-11-25): https://straitly.ai/api/catalog, GET https://api.straitly.ai/v1/models, live probes on /v1/chat/completions.
schema = 2
base_model = "alibaba/qwen3.8-flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "xhigh"], budget = {} }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.0678
cache = { read = 0.0084 }

[cost.text.output]
price = 0.2292
