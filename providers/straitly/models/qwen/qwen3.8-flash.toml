# Toggle: enable_thinking = true|false (lab baseline; note live 2026-11-25 probe on Straitly /v1/chat/completions showed reasoning_effort low|medium|xhigh and reasoning.max_tokens active while enable_thinking returned 0 reasoning tokens)
# Effort: reasoning_effort = low|medium|xhigh
# Budget: thinking_budget / reasoning.max_tokens
# Sources (accessed 2026-11-25): https://straitly.ai/api/catalog, GET https://api.straitly.ai/v1/models, live probes on /v1/chat/completions.
schema = 2
base_model = "alibaba/qwen3.8-flash"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "xhigh"], budget = {} }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.0678
cache = { read = 0.0084 }

[cost.text.output]
price = 0.2292
