# Toggle: thinking.type = enabled|disabled and enable_thinking = true|false (both live-verified 2026-11-25 on Straitly /v1/chat/completions: false/disabled returned reasoning_tokens=0, true/enabled returned 16-22)
# Effort: reasoning_effort = low|high|max (live-verified 2026-11-25)
# Reasoning response field: message.reasoning_content (live-verified 2026-11-25 on Straitly /v1/chat/completions)
# Pricing: live Straitly catalog (https://straitly.ai/api/catalog, checked 2026-11-25) intentionally publishes distinct per-model rates for deepseek/deepseek-v4-1-flash ($0.038169/$0.152946) vs deepseek/deepseek-v4-1-flash-1017 ($0.09/$0.36).
# Sources (accessed 2026-11-25): https://straitly.ai/api/catalog, GET https://api.straitly.ai/v1/models, live probes on /v1/chat/completions.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[limit]
context = 1_048_576

[cost.text.input]
price = 0.038169
cache = { read = 0.00379 }

[cost.text.output]
price = 0.152946
