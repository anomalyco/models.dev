# Prices: https://go2llm.tech/api/pricing (catalog version 54, generated 2026-11-27T03:24:20.081Z), USD per 1M tokens. Cache mechanism is undocumented, so implicit; cached tokens are billed at the cache rates.
# Input: https://go2llm.tech/errors/400-unsupported-content-type (images only where GET https://api.go2llm.tech/v1/models lists image; PDF, file, audio and video are rejected for every model).
# Reasoning: chat.completions forwards the request body unchanged, so the controls are copied from providers/alibaba/models/qwen3.8-max.toml.
# Toggle: enable_thinking true|false (hybrid)
# Effort: reasoning_effort = low|medium|xhigh (default xhigh)
# Budget: thinking_budget (integer reasoning tokens, not combined with reasoning_effort)
schema = 2
base_model = "alibaba/qwen3.8-max"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "xhigh" }, toggle = true, effort = ["low", "medium", "xhigh"], budget = { min = 0, max = 262_144 } }
cache = { implicit = true }

[cost.text.input]
price = 0.166
cache = { read = 0.01377, write = 0.208 }

[cost.text.output]
price = 0.498
