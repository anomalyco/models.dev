# Prices: https://go2llm.tech/api/pricing (catalog version 54, generated 2026-11-27T03:24:20.081Z), USD per 1M tokens. Cache mechanism is undocumented, so implicit; cached tokens are billed at the cache rates.
# Input: https://go2llm.tech/errors/400-unsupported-content-type (images only where GET https://api.go2llm.tech/v1/models lists image; PDF, file, audio and video are rejected for every model).
# Reasoning: chat.completions forwards the request body unchanged, so the controls are copied from providers/openai/models/gpt-6.2-astra.toml.
# Custom tools: live probe 2026-11-28 on chat.completions, tool_choice=required returned 400 and auto produced no call (function tools work), so freeform is not declared.
schema = 2
base_model = "openai/gpt-6.2-astra"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
cache = { implicit = true }

[cost.text.input]
price = 1.4
cache = { read = 0.068, write = 1.75 }

[cost.text.output]
price = 6.8
