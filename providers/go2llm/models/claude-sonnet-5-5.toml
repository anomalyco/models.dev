# Prices: https://go2llm.tech/api/pricing (catalog version 54, generated 2026-11-27T03:24:20.081Z), USD per 1M tokens.
# Input modalities follow https://go2llm.tech/errors/400-unsupported-content-type: images only where modalities.input in
# GET https://api.go2llm.tech/v1/models lists image; PDF, file, audio and video blocks are rejected for every model.
# Reasoning: go2llm documents no reasoning request controls, so none are declared.
schema = 2
base_model = "anthropic/claude-sonnet-5-5"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true }

[cost.text.input]
price = 1.5
cache = { read = 0.075, write = 1.875 }

[cost.text.output]
price = 7.5
