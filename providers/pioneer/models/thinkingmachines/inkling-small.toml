# Source: https://api.pioneer.ai/v1/models (accessed 2026-09-11)
schema = 2
base_model = "thinkingmachines/inkling-small"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[limit]
context = 1_000_000
output = 131_072

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.5
cache = { read = 0.1, write = 0.5 }

[cost.text.output]
price = 1.2
