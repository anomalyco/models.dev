schema = 2
base_model = "mistral/magistral-small-2506"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[limit]
context = 128_000
output = 64_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.5
cache = { read = 0.5, write = 0.5 }

[cost.text.output]
price = 1.5
