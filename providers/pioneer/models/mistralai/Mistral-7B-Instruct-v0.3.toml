# Status: deprecated. Not listed by GET https://api.fastino.ai/v1/models or GET https://api.fastino.ai/v1/base-models (2026-10-20); the inference catalog at https://docs.fastino.ai/concepts/models no longer lists it.
# Reasoning: none. Mistral-7B-Instruct-v0.3 is a instruction model without a thinking mode (https://huggingface.co/mistralai/Mistral-7B-Instruct-v0.3); Pioneer's catalog listed the same boilerplate levels on every model.
# Mid-conversation (Fastino /v1/chat/completions, https://docs.fastino.ai/openapi.json ChatCompletionRequest): tools.updates = false: `tools` is request-level, with no tool addition/removal field.
# system_updates unset: Fastino renders each request to the upstream's native API and doesn't document where a later system message goes.
schema = 2
name = "Mistral 7B Instruct v0.3"
description = "Mistral model for multilingual chat, reasoning, and tool-assisted workflows"
open_weights = false
release_date = "2023-04-30"
status = "deprecated"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = false }
temperature = true

[limit]
context = 32_768
output = 32_768

[cost.text.input]
price = 0.2
cache = { read = 0.2, write = 0.2 }

[cost.text.output]
price = 0.2
