# Source: https://api.pioneer.ai/v1/models (accessed 2026-09-11)
schema = 2
base_model = "mistral/magistral-medium-latest"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[limit]
output = 64_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 2
cache = { read = 2, write = 2 }

[cost.text.output]
price = 5
