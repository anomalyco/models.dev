# Status: deprecated. Not listed by GET https://api.fastino.ai/v1/models or GET https://api.fastino.ai/v1/base-models (2026-10-20); the inference catalog at https://docs.fastino.ai/concepts/models no longer lists it.
# Reasoning: the underlying model's controls from providers/alibaba/models/qwen3-8b.toml; Pioneer's catalog listed the same boilerplate levels on every model.
# Toggle: reasoning.enabled = true|false in Fastino's normalized `reasoning` object (https://docs.fastino.ai/openapi.json ChatCompletionRequest.reasoning).
# Budget: reasoning.max_tokens (Anthropic-style budget) in the same object.
# Mid-conversation (Fastino /v1/chat/completions, https://docs.fastino.ai/openapi.json ChatCompletionRequest): effort_updates = false and
# tools.updates = false: `reasoning` and `tools` are request-level, with no per-turn effort or tool addition/removal field.
# system_updates unset: Fastino renders each request to the upstream's native API and doesn't document where a later system message goes.
schema = 2
name = "Qwen3 8B"
description = "Qwen instruction model for multilingual chat, reasoning, and tool use"
family = "qwen"
open_weights = true
knowledge = "2025-03-31"
release_date = "2025-03-31"
last_updated = "2025-04-28"
status = "deprecated"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true, budget = {} }
temperature = true
effort_updates = false

[limit]
context = 40_960
output = 40_960

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.2
cache = { read = 0.2, write = 0.2 }

[cost.text.output]
price = 0.2
