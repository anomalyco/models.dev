schema = 2
name = "Qwen3 4B Instruct"
description = "Qwen instruction model for multilingual chat, reasoning, and tool use"
open_weights = false
release_date = "2025-07-31"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
temperature = true

[limit]
context = 32_768
output = 32_768

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.2
cache = { read = 0.2, write = 0.2 }

[cost.text.output]
price = 0.2
