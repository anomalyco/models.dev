# Status: deprecated. Not listed by GET https://api.fastino.ai/v1/models or GET https://api.fastino.ai/v1/base-models (2026-10-20); the inference catalog at https://docs.fastino.ai/concepts/models no longer lists it.
# Reasoning: none. SmolLM3-3B-Base is a pretrained base checkpoint; thinking mode is in SmolLM3-3B (https://huggingface.co/HuggingFaceTB/SmolLM3-3B-Base); Pioneer's catalog listed the same boilerplate levels on every model.
# Mid-conversation (Fastino /v1/chat/completions, https://docs.fastino.ai/openapi.json ChatCompletionRequest): tools.updates = false: `tools` is request-level, with no tool addition/removal field.
# system_updates unset: Fastino renders each request to the upstream's native API and doesn't document where a later system message goes.
schema = 2
name = "SmolLM3 3B Base"
description = "Tool-capable chat model for instruction following and agentic application workflows"
open_weights = false
release_date = "2025-06-30"
status = "deprecated"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = false }
temperature = true

[limit]
context = 32_768
output = 32_768

[cost.text.input]
price = 0.15
cache = { read = 0.15, write = 0.15 }

[cost.text.output]
price = 0.15
