schema = 2
name = "GLiNER2 Multi"
description = "Tool-capable chat model for instruction following and agentic application workflows"
open_weights = false
release_date = "2025-11-30"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
temperature = true

[limit]
context = 8_192
output = 8_192

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.15
cache = { read = 0.15, write = 0.15 }

[cost.text.output]
price = 0.15
