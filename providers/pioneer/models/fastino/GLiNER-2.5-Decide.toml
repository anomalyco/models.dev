# Sources:
# - Pioneer live catalog GET https://api.fastino.ai/v1/base-models (id fastino/GLiNER-2.5-Decide: label "GLiNER-2.5-Decide", description "Classification-tuned GLiNER2 large. Entities, relations, and JSON extraction still work.", context_window 8192, max_input_tokens 8192, input/output $0.15, cache $0.15, license Apache-2.0, release Sep 2026, is_chat_model true, task_type encoder)
# - Model card https://huggingface.co/fastino/GLiNER2.5-Decide (340M English classification model, DeBERTa-v3-large encoder, Apache-2.0, released Sep 24 2026; "does not reason, explain, or answer open questions")
# - Release announcement https://fastino.ai/blog/gliner-2-5-decide-open-weight-decision-model (released Sep 24 2026; 340M open-weight schema-defined decision model, Apache-2.0)
# Pioneer is the first-party Fastino inference API; full inline entry follows existing providers/pioneer/models/fastino/* pattern.
# Encoder: GET https://api.fastino.ai/v1/base-models (2026-10-20) task_type = "encoder", license Apache-2.0, tier open. GLiNER models extract and classify
# through /v1/chat/completions with a top-level `schema` (https://docs.fastino.ai/inference/chat-completions); they don't generate text, reason or call tools.
# Cost: GET https://api.fastino.ai/v1/base-models and https://docs.fastino.ai/pricing (2026-10-20): input $0.03, output $0, cache read/write $0.03 per 1M tokens.
# Mid-conversation (Fastino /v1/chat/completions, https://docs.fastino.ai/openapi.json ChatCompletionRequest): no reasoning or tools, so no effort or tool updates.
# system_updates unset: Fastino renders each request to the upstream's native API and doesn't document where a later system message goes.
schema = 2
name = "GLiNER-2.5-Decide"
description = "Classification-tuned GLiNER2 large. Entities, relations, and JSON extraction still work."
open_weights = true
release_date = "2026-09-24"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = true

[limit]
context = 8_192
output = 8_192

[cost.text.input]
price = 0.03
cache = { read = 0.03, write = 0.03 }

[cost.text.output]
price = 0
