schema = 2
name = "GLiNER2-Guardrails-PII-Multi"
description = "A 300M-parameter multilingual model that runs LLM safety moderation and PII detection in a single forward pass."
open_weights = true
release_date = "2026-07-08"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
temperature = true

[limit]
context = 8_192
output = 8_192

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.15
cache = { read = 0.15, write = 0.15 }

[cost.text.output]
price = 0.15
