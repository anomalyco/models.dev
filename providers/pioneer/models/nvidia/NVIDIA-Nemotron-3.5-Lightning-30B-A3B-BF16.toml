# Sources (accessed 2026-08-19):
# - https://api.pioneer.ai/base-models (id=nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16)
# - https://api.pioneer.ai/v1/models
# - https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
# - https://agent.pioneer.ai/llms-full.txt#reasoning--thinking-controls
# Effort: reasoning.effort via Pioneer unified reasoning object (low|medium|high),
# matching other Pioneer Nemotron entries; reasoning traces on reasoning_content.
schema = 2
base_model = "nvidia/nemotron-3.5-lightning"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true

[limit]
context = 8_192
output = 4_096

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.5
cache = { read = 0.5, write = 0.5 }

[cost.text.output]
price = 0.5
