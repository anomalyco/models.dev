# Sources (accessed 2026-08-19):
# - https://api.pioneer.ai/base-models (id=nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16)
# - https://api.pioneer.ai/v1/models
# - https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
# - https://agent.pioneer.ai/llms-full.txt#reasoning--thinking-controls
# Effort: reasoning.effort via Pioneer unified reasoning object (low|medium|high),
# matching other Pioneer Nemotron entries; reasoning traces on reasoning_content.
# Cost: GET https://api.fastino.ai/v1/models and /v1/base-models (2026-10-20): input $0.07, output $0.2, cache read $0.035, cache write $0.07 per 1M tokens.
# Mid-conversation (Fastino /v1/chat/completions, https://docs.fastino.ai/openapi.json ChatCompletionRequest): effort_updates = false and
# tools.updates = false: `reasoning` and `tools` are request-level, with no per-turn effort or tool addition/removal field.
# system_updates unset: Fastino renders each request to the upstream's native API and doesn't document where a later system message goes.
schema = 2
base_model = "nvidia/nemotron-3.5-lightning"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true

[limit]
context = 65_536
output = 4_096

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.07
cache = { read = 0.035, write = 0.07 }

[cost.text.output]
price = 0.2
