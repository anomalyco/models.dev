# Status: deprecated. Not listed by GET https://api.fastino.ai/v1/models or GET https://api.fastino.ai/v1/base-models (2026-10-20); the inference catalog at https://docs.fastino.ai/concepts/models no longer lists it.
# Reasoning: the underlying model's controls from providers/mistral/models/mistral-medium-2604.toml; Pioneer's catalog listed the same boilerplate levels on every model.
# Effort: reasoning.effort = none|high in the same object, rendered to the upstream's native field.
# Mid-conversation (Fastino /v1/chat/completions, https://docs.fastino.ai/openapi.json ChatCompletionRequest): effort_updates = false and
# tools.updates = false: `reasoning` and `tools` are request-level, with no per-turn effort or tool addition/removal field.
# system_updates unset: Fastino renders each request to the upstream's native API and doesn't document where a later system message goes.
schema = 2
base_model = "mistral/mistral-medium-2604"
status = "deprecated"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = true
effort_updates = false

[limit]
context = 256_000
output = 131_072

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.5
cache = { read = 1.5, write = 1.5 }

[cost.text.output]
price = 7.5
