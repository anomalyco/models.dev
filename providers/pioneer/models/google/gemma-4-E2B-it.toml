schema = 2
base_model = "google/gemma-4-E2B-it"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
context = 32_768
output = 32_768

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.1
cache = { read = 0.1, write = 0.1 }

[cost.text.output]
price = 0.1
