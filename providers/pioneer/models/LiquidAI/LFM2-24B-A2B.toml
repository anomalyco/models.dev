# Status: deprecated. Not listed by GET https://api.fastino.ai/v1/models or GET https://api.fastino.ai/v1/base-models (2026-10-20); the inference catalog at https://docs.fastino.ai/concepts/models no longer lists it.
# Reasoning: none. LFM2-24B-A2B is a "general-purpose instruct model (without reasoning traces)" (https://huggingface.co/LiquidAI/LFM2-24B-A2B); Pioneer's catalog listed the same boilerplate levels on every model.
# Mid-conversation (Fastino /v1/chat/completions, https://docs.fastino.ai/openapi.json ChatCompletionRequest): no reasoning or tools, so no effort or tool updates.
# system_updates unset: Fastino renders each request to the upstream's native API and doesn't document where a later system message goes.
schema = 2
name = "LFM2 24B A2B"
description = "Open-weight instruction model for adaptable chat and self-hosted production workloads"
family = "liquid"
open_weights = true
release_date = "2026-01-31"
last_updated = "2026-02-25"
status = "deprecated"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = true

[limit]
context = 32_768
