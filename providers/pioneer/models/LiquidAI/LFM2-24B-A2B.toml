schema = 2
name = "LFM2 24B A2B"
description = "Open-weight instruction model for adaptable chat and self-hosted production workloads"
family = "liquid"
open_weights = true
release_date = "2026-01-31"
last_updated = "2026-02-25"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
temperature = true

[limit]
context = 32_768
output = 32_768

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.03
cache = { read = 0.03, write = 0.03 }

[cost.text.output]
price = 0.12
