# Source: https://api.pioneer.ai/v1/models (accessed 2026-09-11)
# Status: deprecated. Not listed by GET https://api.fastino.ai/v1/models or GET https://api.fastino.ai/v1/base-models (2026-10-20); the inference catalog at https://docs.fastino.ai/concepts/models no longer lists it.
# Reasoning: the underlying model's controls from providers/moonshotai/models/kimi-k3.toml; Pioneer's catalog listed the same boilerplate levels on every model.
# Effort: reasoning.effort = low|high|max in the same object, rendered to the upstream's native field.
# Mid-conversation (Fastino /v1/chat/completions, https://docs.fastino.ai/openapi.json ChatCompletionRequest): effort_updates = false and
# tools.updates = false: `reasoning` and `tools` are request-level, with no per-turn effort or tool addition/removal field.
# system_updates unset: Fastino renders each request to the upstream's native API and doesn't document where a later system message goes.
# Output limit: the model is no longer listed by https://api.fastino.ai/v1/models (checked 2026-11-13), so the sync no longer writes max_tokens for it and the hand cap stays; no cap is documented, so output is capped at the context served here (the lab's raised cap would exceed it).
schema = 2
base_model = "moonshotai/kimi-k3"
status = "deprecated"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
context = 1_000_000
output = 1_000_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 4.5
cache = { read = 0.45, write = 4.5 }

[cost.text.output]
price = 22.5
