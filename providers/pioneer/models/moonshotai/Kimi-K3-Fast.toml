# Source: https://api.pioneer.ai/v1/models (accessed 2026-09-11)
schema = 2
base_model = "moonshotai/kimi-k3"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
context = 1_000_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 4.5
cache = { read = 0.45, write = 4.5 }

[cost.text.output]
price = 22.5
