schema = 2
base_model = "moonshotai/kimi-k2.7-code"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
context = 256_000
output = 32_768

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.95
cache = { read = 0.19, write = 0.95 }

[cost.text.output]
price = 4
