schema = 2
base_model = "openai/gpt-5-nano"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.05
cache = { read = 0.005, write = 0.05 }

[cost.text.output]
price = 0.4
