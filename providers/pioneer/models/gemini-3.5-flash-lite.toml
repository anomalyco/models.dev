schema = 2
base_model = "google/gemini-3.5-flash-lite"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
context = 1_000_000
output = 65_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.3
cache = { read = 0.03, write = 0.3 }

[cost.text.output]
price = 2.5
