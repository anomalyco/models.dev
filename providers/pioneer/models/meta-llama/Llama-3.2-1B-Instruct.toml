# Lab: meta/llama-3.2-1b-instruct (Pioneer id meta-llama/Llama-3.2-1B-Instruct is the Hugging Face repo name).
# Reasoning: none. Llama 3.2 1B Instruct is not a reasoning model; the effort levels Pioneer's catalog listed are the same boilerplate on every model.
# Tools: inherited from the lab; the old `tools = false` had no Pioneer source (the catalog has no tool-calling field).
# Status: deprecated. Not listed by GET https://api.fastino.ai/v1/models or GET https://api.fastino.ai/v1/base-models (2026-10-20); the inference catalog at https://docs.fastino.ai/concepts/models no longer lists it.
# Mid-conversation (Fastino /v1/chat/completions, https://docs.fastino.ai/openapi.json ChatCompletionRequest): tools.updates = false: `tools` is request-level, with no tool addition/removal field.
# system_updates unset: Fastino renders each request to the upstream's native API and doesn't document where a later system message goes.
schema = 2
base_model = "meta/llama-3.2-1b-instruct"
status = "deprecated"

[capabilities]
tools = { supported = true, updates = false }

[limit]
output = 60_000

[cost.text.input]
price = 0.1
cache = { read = 0.1, write = 0.1 }

[cost.text.output]
price = 0.201
