schema = 2
name = "Llama 3.1 8B Instruct"
description = "Open Llama instruction model for multilingual chat, reasoning, and coding"
family = "llama"
open_weights = true
knowledge = "2023-12-31"
release_date = "2024-06-30"
last_updated = "2024-07-23"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
temperature = true

[limit]
context = 128_000
output = 8_192

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.2
cache = { read = 0.2, write = 0.2 }

[cost.text.output]
price = 0.2
