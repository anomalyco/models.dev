# Bitdeer wire (probed 2026-11-25): POST https://api-inference.bitdeer.ai/v1/chat/completions
# model = "zai-org/GLM-5.3"
# Reasoning: top-level reasoning_effort = low|high|max (default max); output in reasoning_content.
# Text-only at this host; image input is not accepted.
# Prompt caching: implicit. Probed 2026-11-25: resending a ~4.9k-token prompt returned
# usage.prompt_tokens_details.cached_tokens = 4864 with no cache_control. Cached-input price is on the pricing page.
# Structured output: response_format json_schema (strict) verified live 2026-11-25; the reply followed a schema
# whose enum values the prompt never mentioned.
# Pricing: https://www.bitdeer.ai/en/pricing/ai-models (accessed 2026-11-25). Recorded prices are the SALE prices the
# page shows as current, with no end date; its list prices are $1.40 input, $4.40 output, $0.26 cached input.
schema = 2
base_model = "zhipuai/glm-5.3"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "max" }, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.63
cache = { read = 0.117 }

[cost.text.output]
price = 1.98
