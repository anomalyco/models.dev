# Mid-conversation: OVHcloud AI Endpoints serves this model on POST /v1/chat/completions; reasoning and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://www.ovhcloud.com/en/public-cloud/ai-endpoints/catalog/
schema = 2
base_model = "alibaba/qwen2-5-vl-72b-instruct"
name = "Qwen2.5-VL-72B-Instruct"
description = "Multimodal model for analyzing text, images, documents, and rich media"

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = true
effort_updates = false

[limit]
context = 32_768
output = 32_768

[cost.text.input]
price = 1.01

[cost.text.output]
price = 1.01
