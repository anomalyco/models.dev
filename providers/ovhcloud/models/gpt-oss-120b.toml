# Chat: `reasoning_effort = low|medium|high`; Responses: `reasoning.effort`.
# https://www.ovhcloud.com/en/public-cloud/ai-endpoints/catalog/gpt-oss-120b/
# Mid-conversation: OVHcloud AI Endpoints serves this model on POST /v1/chat/completions; reasoning and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://www.ovhcloud.com/en/public-cloud/ai-endpoints/catalog/
schema = 2
base_model = "openai/gpt-oss-120b"
name = "gpt-oss-120b"
description = "Open-weight GPT model for self-hosted reasoning and instruction-following workloads"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
effort_updates = false

[limit]
output = 131_072

[cost.text.input]
price = 0.09

[cost.text.output]
price = 0.47
