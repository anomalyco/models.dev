# Sources (accessed 2026-09-02):
# https://oai.endpoints.kepler.ai.cloud.ovh.net/doc/Qwen3.8-27B/openapi.json
# https://catalog.endpoints.ai.ovh.net/rest/v2/openrouter
# Effort: reasoning_effort = none|minimal|low|medium|high (OVHcloud's API enum,
# not the lab's low|medium|xhigh). Responses uses reasoning.effort.
# Blank catalog prompt/completion rates default to zero in the sync.
schema = 2
base_model = "alibaba/qwen3.8-27b"
name = "Qwen3.8-27B"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high"] }
structured_output = true

[limit]
output = 262_144

[cost.text.input]
price = 0.47

[cost.text.output]
price = 3.19
