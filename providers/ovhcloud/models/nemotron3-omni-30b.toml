# Price (USD per Mtoken, accessed 2026-11-24): $0.19 input / $0.57 output on
# https://www.ovhcloud.com/en/public-cloud/ai-endpoints/catalog/nemotron3-omni-30b/ and the same rates in
# https://catalog.endpoints.ai.ovh.net/rest/v2/openrouter. OVHcloud publishes USD prices here, so no currency conversion.
# Effort: Chat `reasoning_effort` / Responses `reasoning.effort` = low|medium|high, the levels
# OVHcloud documents for reasoning_effort on its AI Endpoints catalog pages
# (e.g. https://www.ovhcloud.com/en/public-cloud/ai-endpoints/catalog/nemotron3-nano-30b/).
# Modalities: OVHcloud's catalog lists text and image input only, without formats; image formats are the lab's (https://catalog.endpoints.ai.ovh.net/rest/v2/openrouter).
# Limits: catalog context_length 131_072, max_output_length 65_536 (https://catalog.endpoints.ai.ovh.net/rest/v2/openrouter).
# Mid-conversation: OVHcloud AI Endpoints serves this model on POST /v1/chat/completions; reasoning and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://www.ovhcloud.com/en/public-cloud/ai-endpoints/catalog/
schema = 2
base_model = "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"
name = "nemotron3-omni-30b"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
context = 131_072

[cost.text.input]
price = 0.19

[cost.text.output]
price = 0.57
