# Chat `reasoning_effort` supports none|low|medium|high; `none` disables it.
# https://www.ovhcloud.com/en/public-cloud/ai-endpoints/catalog/qwen-3-5-397b/
schema = 2
base_model = "alibaba/qwen3.5-397b-a17b"
name = "Qwen3.5-397B-A17B"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true

[limit]
output = 262_144

[cost.text.input]
price = 0.71

[cost.text.output]
price = 4.25
