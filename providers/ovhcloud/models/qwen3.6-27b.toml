# Chat `reasoning_effort` supports none|minimal|low|medium|high; `none` disables it.
# https://www.ovhcloud.com/en/public-cloud/ai-endpoints/catalog/qwen-3-6-27b/
schema = 2
base_model = "alibaba/qwen3.6-27b"
name = "Qwen3.6-27B"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high"] }
structured_output = true

[limit]
output = 262_144

[cost.text.input]
price = 0.47

[cost.text.output]
price = 3.19
