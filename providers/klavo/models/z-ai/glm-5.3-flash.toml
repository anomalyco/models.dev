# Pricing: https://ai.klavo.ru/models/glm-5.3-flash lists 13 / 2.5 / 44 RUB per 1M input / cached input / output
# tokens (checked 2026-11-11); RUB converted to USD at the CBR rate 82.5486 RUB/USD (2026-11-11), rounded to 4
# decimals.
# Klavo AI is a relay. Input types, structured_output and cache follow the same-model entry
# providers/openrouter/models/z-ai/glm-5.3-flash.toml. Limits and reasoning controls are this API's own.
# Limits: GET https://api.klavo.ru/v1/models reports context_length 1_048_576 and meta.max_output 131_072 (checked
# 2026-11-11); a request with max_tokens = 131_072 was accepted live on 2026-11-10.
# Cache: implicit, done by the hosts behind the API. Cached input tokens come back in
# usage.prompt_tokens_details.cached_tokens and are billed at the cache price below. No TTL is published.
# Effort: reasoning_effort = low|high|max; other levels map to the nearest.
# Live check 2026-11-10 through https://api.klavo.ru/v1, 2 requests per variant, median reasoning tokens: none keeps
# reasoning (44 tokens), so there is no off switch; low 10, high 17, max 50.
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[modalities]
input = ["text", "image/jpeg", "image/png", "video/mp4"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 1_048_576

[cost.text.input]
price = 0.1575
cache = { read = 0.0303 }

[cost.text.output]
price = 0.533
