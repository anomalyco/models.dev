# Pricing: https://ai.klavo.ru/models/glm-5.3-flash lists 13 / 2.5 / 44 RUB per 1M input / cached input /
# output tokens (checked 2026-11-10); RUB converted to USD at the CBR rate 82.5486 RUB/USD (2026-11-11), rounded to 4 decimals.
# Klavo AI routes each request to one of several providers of the model (see the page); limits are the
# smallest across them.
# Effort: reasoning_effort = low|high|max; other levels map to the nearest.
# Live check 2026-11-10 through https://api.klavo.ru/v1: none keeps reasoning (44 tokens); low 10, high 17, max 50.
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[modalities]
input = ["text", "image/jpeg", "image/png"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }

[limit]
context = 1_048_576

[cost.text.input]
price = 0.1575
cache = { read = 0.0303 }

[cost.text.output]
price = 0.533
