# Pricing: https://ai.klavo.ru/models/mimo-v2.6-pro lists 70 / 1 / 140 RUB per 1M input / cached input /
# output tokens (checked 2026-11-10); RUB converted to USD at the CBR rate 82.5486 RUB/USD (2026-11-11), rounded to 4 decimals.
# Klavo AI routes each request to one of several providers of the model (see the page); limits are the
# smallest across them.
# Toggle: reasoning.enabled = true|false; reasoning_effort = "none" also turns it off. No graded levels.
# Live check 2026-11-10 through https://api.klavo.ru/v1: none -> 0; effort has no effect.
schema = 2
base_model = "xiaomi/mimo-v2.6-pro"

[modalities]
input = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }

[cost.text.input]
price = 0.848
cache = { read = 0.0121 }

[cost.text.output]
price = 1.696
