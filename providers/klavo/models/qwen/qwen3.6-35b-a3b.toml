# Pricing: https://ai.klavo.ru/models/qwen3.6-35b-a3b lists 28 / 6 / 170 RUB per 1M input / cached input / output
# tokens (checked 2026-11-10); RUB converted to USD at the CBR rate 82.5486 RUB/USD (2026-11-11), rounded to 4
# decimals.
# Klavo AI is a relay: a request goes to one of the upstream providers of the model, and the limits are the smallest
# across them.
# Limits: GET https://api.klavo.ru/v1/models reports context_length 208_192 and meta.max_output 8_192 (checked
# 2026-11-10); a request with max_tokens = 8_192 was accepted live on 2026-11-10.
# Toggle: reasoning.enabled = false turns reasoning off (thinking.type = disabled is taken too); it is on by default.
# No graded levels.
# Live check 2026-11-10 through https://api.klavo.ru/v1, 2 requests per variant, median reasoning tokens: off -> 0
# reasoning tokens (sent as reasoning_effort = "none", which the API maps to the same switch); the levels do not
# differ (282-447 tokens at every level).
schema = 2
base_model = "alibaba/qwen3.6-35b-a3b"

[modalities]
input = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }

[limit]
context = 208_192
output = 8_192

[cost.text.input]
price = 0.3392
cache = { read = 0.0727 }

[cost.text.output]
price = 2.0594
