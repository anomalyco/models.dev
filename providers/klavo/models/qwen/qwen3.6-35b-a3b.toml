# Pricing: https://ai.klavo.ru/models/qwen3.6-35b-a3b lists 28 / 6 / 170 RUB per 1M input / cached input / output
# tokens (checked 2026-11-11); RUB converted to USD at the CBR rate 82.5486 RUB/USD (2026-11-11), rounded to 4
# decimals.
# Klavo AI is a relay. Input types, structured_output and cache follow the same-model entries
# providers/engy/models/qwen3.6-35b-a3b.toml and providers/openrouter/models/qwen/qwen3.6-35b-a3b.toml (the input
# types they share). Limits and reasoning controls are this API's own.
# Limits: GET https://api.klavo.ru/v1/models reports context_length 208_192 and meta.max_output 8_192 (checked
# 2026-11-11); a request with max_tokens = 8_192 was accepted live on 2026-11-10.
# Cache: implicit, done by the hosts behind the API. Cached input tokens come back in
# usage.prompt_tokens_details.cached_tokens and are billed at the cache price below. No TTL is published.
# Toggle: reasoning.enabled = false turns reasoning off (thinking.type = disabled is taken too); it is on by default.
# No graded levels.
# Live check 2026-11-10 through https://api.klavo.ru/v1, 2 requests per variant, median reasoning tokens: off -> 0
# reasoning tokens (sent as reasoning_effort = "none", which the API maps to the same switch); the levels do not
# differ (282-447 tokens at every level).
# No budget: the API takes reasoning.max_tokens and thinking.budget_tokens, but turns them into an effort level (up to
# 4096 low, up to 16384 medium, up to 32768 high, above that xhigh), and the hosts behind it have no reasoning-budget
# field. No token budget reaches the model.
schema = 2
base_model = "alibaba/qwen3.6-35b-a3b"

[modalities]
input = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
cache = { implicit = true }

[limit]
context = 208_192
output = 8_192

[cost.text.input]
price = 0.3392
cache = { read = 0.0727 }

[cost.text.output]
price = 2.0594
