# Pricing: https://ai.klavo.ru/models/deepseek-v4-flash-0731 lists 36 / 7 / 110 RUB per 1M input / cached input /
# output tokens (checked 2026-11-10); RUB converted to USD at the CBR rate 82.5486 RUB/USD (2026-11-11), rounded to 4 decimals.
# Klavo AI routes each request to one of several providers of the model (see the page); limits are the
# smallest across them.
# Effort: reasoning_effort = none|low|high|max; none turns reasoning off (no separate toggle); other levels map to the nearest.
# Live check 2026-11-10 through https://api.klavo.ru/v1: none -> 0.
schema = 2
base_model = "deepseek/deepseek-v4-flash-0731"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }

[limit]
context = 1_048_576
output = 128_000

[cost.text.input]
price = 0.4361
cache = { read = 0.0848 }

[cost.text.output]
price = 1.3325
