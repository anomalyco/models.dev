# Pricing: https://ai.klavo.ru/models/deepseek-v4.1-flash lists 25 / 5 / 100 RUB per 1M input / cached input / output
# tokens (checked 2026-11-11); RUB converted to USD at the CBR rate 82.5486 RUB/USD (2026-11-11), rounded to 4
# decimals.
# Klavo AI is a relay. Limits, input types and capabilities follow the same-model entries
# providers/engy/models/deepseek-v4.1-flash.toml and providers/openrouter/models/deepseek/deepseek-v4.1-flash.toml:
# the smaller limit and the input types they share. Reasoning controls are those of this API.
# Limits: GET https://api.klavo.ru/v1/models reports context_length 1_048_576 and meta.max_output 65_536 (checked
# 2026-11-11); a request with max_tokens = 65_536 was accepted live on 2026-11-10.
# Cache: implicit, done by the hosts behind the API. Cached input tokens come back in
# usage.prompt_tokens_details.cached_tokens and are billed at the cache price below. No TTL is published.
# Toggle: reasoning.enabled = false turns reasoning off (thinking.type = disabled is taken too); any reasoning_effort
# level turns it on.
# Effort: reasoning_effort = low|high|max; other levels map to the nearest.
# Live check 2026-11-10 through https://api.klavo.ru/v1, 2 requests per variant, median reasoning tokens: off -> 0
# reasoning tokens (sent as reasoning_effort = "none", which the API maps to the same switch).
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 1_048_576
input = 983_040
output = 65_536

[cost.text.input]
price = 0.3029
cache = { read = 0.0606 }

[cost.text.output]
price = 1.2114
