# Pricing: https://ai.klavo.ru/models/deepseek-v4.1-flash lists 25 / 5 / 100 RUB per 1M input / cached input / output
# tokens (checked 2026-11-10); RUB converted to USD at the CBR rate 82.5486 RUB/USD (2026-11-11), rounded to 4
# decimals.
# Klavo AI is a relay: a request goes to one of the upstream providers of the model, and the limits are the smallest
# across them.
# Limits: GET https://api.klavo.ru/v1/models reports context_length 1_048_576 and meta.max_output 65_536 (checked
# 2026-11-10); a request with max_tokens = 65_536 was accepted live on 2026-11-10.
# Toggle: reasoning.enabled = false turns reasoning off (thinking.type = disabled is taken too); any reasoning_effort
# level turns it on.
# Effort: reasoning_effort = low|high|max; other levels map to the nearest.
# Live check 2026-11-10 through https://api.klavo.ru/v1, 2 requests per variant, median reasoning tokens: off -> 0
# reasoning tokens (sent as reasoning_effort = "none", which the API maps to the same switch).
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[modalities]
input = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }

[limit]
context = 1_048_576
output = 65_536

[cost.text.input]
price = 0.3029
cache = { read = 0.0606 }

[cost.text.output]
price = 1.2114
