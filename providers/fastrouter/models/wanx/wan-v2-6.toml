# Source: GET https://go.fastrouter.ai/api/v1/models (public catalog, 2026-10-21); prices are USD per token there, per MTok here.
# Video: catalog videoCost rows per clip length (seconds) and resolution, priced here per second of output.
# Limits: context is the catalog's context_length (400000; max_completion_tokens 4096).
schema = 2
base_model = "alibaba/wan2.6"
name = "Wan 2.6"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/bmp", "image/webp"]
output = ["video/mp4"]

[limit]
context = 400_000

[cost.video.output]
unit = "second"
price = 0.15

[[cost.video.output.overrides]]
when = { resolution = { equals = "720p" } }
price = 0.1
