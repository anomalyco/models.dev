# Price: FastRouter list price, GET https://api.fastrouter.ai/api/v1/models (2026-10-21).
#   pricing.audio_output_per_minute, USD per minute of generated audio; pricing.duration is the same rate per second.
schema = 2
v2_only = true
base_model = "openai/gpt-live-1"

[cost.audio.output]
unit = "minute"
