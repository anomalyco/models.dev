# Source: GET https://go.fastrouter.ai/api/v1/models (public catalog, 2026-11-16); prices are USD per token there, per MTok here.
# Service tiers: catalog <tier>_service_tier_pricing as multipliers of the default prices.
# Not represented: web search $0.01 per request (no v2 per-request field).
# Effort: reasoning.effort = low|medium|high|xhigh|max
#   Live GET https://api.fastrouter.ai/api/v1/models (2026-11-16): supported_parameters lists reasoning (schemas empty, no enum).
#   Baseline: lab providers/openai gpt-6-astra = effort low|medium|high|xhigh|max; peer providers/openrouter openai/gpt-6-astra = effort low|medium|high|xhigh|max.
#   https://docs.fastrouter.ai/explore-features/reasoning-tokens (accessed 2026-10-25)
# Limit: not overridden. The catalog reports context_length 1050000 and max_completion_tokens 128000 for this route, the same as the lab (context 1_050_000, input 922_000, output 128_000), so the lab limits are inherited.
schema = 2
base_model = "openai/gpt-6-astra"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
service_tier = ["flex", "fast", "ultrafast"]

[cost.text.input]
price = 10
cache = { read = 1, write = 12.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 20
cache = { read = 2, write = 25 }

[cost.text.output]
price = 50

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 75

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.5

[[cost.multipliers]]
when = { service_tier = { equals = "fast" } }
factor = 2.0

[[cost.multipliers]]
when = { service_tier = { equals = "ultrafast" } }
factor = 6.0
