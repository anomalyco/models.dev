# Source: GET https://go.fastrouter.ai/api/v1/models (public catalog, 2026-11-16); prices are USD per token there, per MTok here.
# Service tiers: catalog <tier>_service_tier_pricing as multipliers of the default prices.
# Not represented: web search $0.01 per request (no v2 per-request field).
# Effort: reasoning.effort = none|low|medium|high|xhigh|max
#   Live GET https://api.fastrouter.ai/api/v1/models (2026-11-16): supported_parameters lists reasoning (schemas empty, no enum).
#   Baseline: lab providers/openai gpt-5.6-sol = effort none|low|medium|high|xhigh|max; peer providers/openrouter openai/gpt-5.6-sol = effort none|low|medium|high|xhigh|max.
#   effort = none disables reasoning on FastRouter (same as reasoning.enabled = false), so no separate toggle.
#   https://docs.fastrouter.ai/explore-features/reasoning-tokens (accessed 2026-10-25)
# Limit: not overridden. The catalog reports context_length 1050000 and max_completion_tokens 128000 for this route, the same as the lab (context 1_050_000, input 922_000, output 128_000), so the lab limits are inherited.
# Cache above 272k: the catalog lists input_cache_read_more_than_272k_input = $0.0000008 and input_cache_write_more_than_272k_input = $0.00001 per token ($0.8 and $10 per MTok); the catalog is served inconsistently across requests, and these fields appear in some responses (checked over 18 requests on 2026-11-17). providers/openai and providers/openrouter gpt-5.6-sol use the same $0.8 read in that band.
schema = 2
base_model = "openai/gpt-5.6-sol"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
service_tier = ["flex"]

[cost.text.input]
price = 4
cache = { read = 0.4, write = 5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 8
cache = { read = 0.8, write = 10 }

[cost.text.output]
price = 20

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 30

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.5
