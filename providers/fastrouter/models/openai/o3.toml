# Effort: reasoning.effort = low|medium|high
#   FastRouter sends reasoning_effort for OpenAI o-series models (model-dependent subset); o3 natively
#   accepts low|medium|high and cannot be switched off, so no toggle (providers/openai o3).
#   Live GET https://api.fastrouter.ai/api/v1/models (2026-10-21): supported_parameters lists reasoning (schema empty, no enum).
#   https://docs.fastrouter.ai/explore-features/reasoning-tokens (accessed 2026-10-21)
base_model = "openai/o3"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high"] }]

[cost]
input = 2
output = 8
cache_read = 0.5
