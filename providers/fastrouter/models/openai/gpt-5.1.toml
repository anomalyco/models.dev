# Source: GET https://go.fastrouter.ai/api/v1/models (public catalog, 2026-11-16); prices are USD per token there, per MTok here.
# Service tiers: catalog <tier>_service_tier_pricing as multipliers of the default prices.
# Not represented: web search $0.01 per request (no v2 per-request field).
# Effort: reasoning.effort = none|low|medium|high
#   Live GET https://api.fastrouter.ai/api/v1/models (2026-11-16): supported_parameters lists include_reasoning, reasoning (schemas empty, no enum).
#   Baseline: lab providers/openai gpt-5.1 = effort none|low|medium|high; peer providers/openrouter openai/gpt-5.1 = effort none|low|medium|high.
#   effort = none disables reasoning on FastRouter (same as reasoning.enabled = false), so no separate toggle.
#   https://docs.fastrouter.ai/explore-features/reasoning-tokens (accessed 2026-10-25)
# Limit: not overridden. The catalog reports context_length 400000 and max_completion_tokens 128000 for this route, the same as the lab (context 400_000, input 272_000, output 128_000), so the lab limits are inherited.
schema = 2
base_model = "openai/gpt-5.1"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
service_tier = ["flex", "fast"]

[cost.text.input]
price = 1.25
cache = { read = 0.125 }

[cost.text.output]
price = 10

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.5

[[cost.multipliers]]
when = { service_tier = { equals = "fast" } }
factor = 2.0
