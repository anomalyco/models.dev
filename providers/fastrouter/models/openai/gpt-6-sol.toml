# Source: GET https://go.fastrouter.ai/api/v1/models (public catalog, 2026-10-25); prices are USD per token there, per MTok here.
# Service tiers: catalog <tier>_service_tier_pricing as multipliers of the default prices.
# Not represented: web search $0.01 per request (no v2 per-request field).
# Effort: reasoning.effort = none|low|medium|high|xhigh|max
#   Live GET https://api.fastrouter.ai/api/v1/models (2026-10-25): supported_parameters lists reasoning; published enum reasoning = none|low|medium|high|xhigh|max.
#   Baseline: lab providers/openai gpt-6-sol = effort none|low|medium|high|xhigh|max; peer providers/openrouter openai/gpt-6-sol = effort none|low|medium|high|xhigh|max.
#   effort = none disables reasoning on FastRouter (same as reasoning.enabled = false), so no separate toggle.
#   https://docs.fastrouter.ai/explore-features/reasoning-tokens (accessed 2026-10-25)
# Limit: catalog context_length 400000 and max_completion_tokens 128000 for this route; the lab's input = 922_000 is omitted via base_model_omit because it exceeds the served window.
schema = 2
base_model = "openai/gpt-6-sol"
base_model_omit = ["limit.input"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
service_tier = ["flex", "fast"]

[limit]
context = 400_000

[cost.text.input]
price = 2
cache = { read = 0.2, write = 2.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 4
cache = { read = 0.4, write = 5 }

[cost.text.output]
price = 10

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 15

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.5

[[cost.multipliers]]
when = { service_tier = { equals = "fast" } }
factor = 2.0
