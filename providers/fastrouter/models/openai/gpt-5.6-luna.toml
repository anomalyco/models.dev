# Effort: reasoning.effort = none|low|medium|high|xhigh|max
#   Live GET https://api.fastrouter.ai/api/v1/models (2026-10-21): supported_parameters lists reasoning (schemas empty, no enum).
#   Baseline: lab providers/openai gpt-5.6-luna = effort none|low|medium|high|xhigh|max; peer providers/openrouter openai/gpt-5.6-luna = effort none|low|medium|high|xhigh|max.
#   effort = none disables reasoning on FastRouter (same as reasoning.enabled = false), so no separate toggle.
#   https://docs.fastrouter.ai/explore-features/reasoning-tokens (accessed 2026-10-21)
base_model = "openai/gpt-5.6-luna"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 0.2
output = 1.2
cache_read = 0.02
cache_write = 0.25

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 0.4
output = 1.8
cache_read = 0.04
