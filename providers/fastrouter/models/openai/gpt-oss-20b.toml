# Source: GET https://go.fastrouter.ai/api/v1/models (public catalog, 2026-10-21); prices are USD per token there, per MTok here.
# Reasoning: the catalog lists `reasoning`, `reasoning_effort` in supported_parameters; the control set is unchanged from v1 (not re-tested, no API key).
schema = 2
base_model = "openai/gpt-oss-20b"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[cost.text.input]
price = 0.07
cache = { read = 0.007 }

[cost.text.output]
price = 0.25
