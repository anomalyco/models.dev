# Effort: reasoning_effort = low|high|max
# Kimi K3 has no on/off field. FastRouter publishes reasoning_effort with an empty schema.
# Limit: max_completion_tokens 1048576
base_model = "moonshotai/kimi-k3"
reasoning_options = [{ type = "effort", values = ["low", "high", "max"] }]

[cost]
input = 2.7
output = 13.5
cache_read = 0.27

[limit]
output = 1_048_576
