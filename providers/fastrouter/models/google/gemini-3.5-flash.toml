# Source: GET https://go.fastrouter.ai/api/v1/models (public catalog, 2026-10-21); prices are USD per token there, per MTok here.
# Service tiers: catalog <tier>_service_tier_pricing as multipliers of the default prices.
# Not represented: flex cache read is $0.08 in the catalog, x0.5333 rather than x0.5 (rounding).
# Not represented: web search $14 per 1K requests (no v2 per-request field).
schema = 2
base_model = "google/gemini-3.5-flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
service_tier = ["flex"]

[cost.text.input]
price = 1.5
cache = { read = 0.15 }

[cost.text.output]
price = 9

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.5
