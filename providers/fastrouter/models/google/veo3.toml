# Price: FastRouter list price, GET https://api.fastrouter.ai/api/v1/models (2026-10-21).
#   pricing.videoCost default 0.2 per 1s clip = 0.2 per second (lowest listed length; other lengths, resolutions and tiers differ).
#   With generated audio: videoCostWithAudio default 0.4 per 1s (not represented).
schema = 2
v2_only = true
base_model = "google/veo-3"

[cost.video.output]
unit = "second"
price = 0.2
