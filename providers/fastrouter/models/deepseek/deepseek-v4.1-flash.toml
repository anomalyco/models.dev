# Toggle: thinking true|false
# Effort: reasoning_effort enum is low|medium|high. max is not in the enum.
# Limit: context_length 1048576, max_completion_tokens 943718
base_model = "deepseek/deepseek-v4.1-flash"
reasoning_options = [
  { type = "toggle" },
  { type = "effort", values = ["low", "medium", "high"] },
]

[cost]
input = 0.2
output = 0.6
cache_read = 0.006

[limit]
context = 1_048_576
output = 943_718
