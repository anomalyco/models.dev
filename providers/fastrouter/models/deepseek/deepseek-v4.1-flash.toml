# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|high|max
# Limit: context_length 1048576, max_completion_tokens 943718
base_model = "deepseek/deepseek-v4.1-flash"
reasoning_options = [
  { type = "toggle" },
  { type = "effort", values = ["low", "high", "max"] },
]

[cost]
input = 0.2
output = 0.6
cache_read = 0.006

[limit]
context = 1_048_576
output = 943_718
