# Price: FastRouter list price, GET https://api.fastrouter.ai/api/v1/models (2026-10-21).
#   pricing.videoCost default 0.05 per 1s clip = 0.05 per second (lowest listed length; other lengths, resolutions and tiers differ).
#   pricing.image 0.002 per input image is not represented.
schema = 2
v2_only = true
base_model = "xai/grok-imagine-video"

[cost.video.output]
unit = "second"
price = 0.05
