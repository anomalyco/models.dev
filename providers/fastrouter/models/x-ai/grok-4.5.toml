# Effort: reasoning.effort = low|medium|high
#   FastRouter docs name Grok 4.5 explicitly: reasoning_effort low|medium|high (default high), with xhigh
#   added only on Grok 4.6 and later; their example maps effort xhigh on Grok 4.5 to high. That is the
#   wire control for this route, so xhigh from the lab set (providers/xai grok-4.5) is not forwarded.
#   Live GET https://api.fastrouter.ai/api/v1/models (2026-10-21): the catalog entry omits reasoning fields for this route (the grok-4.6 entry publishes
#   reasoning_effort low|medium|high|xhigh); the docs table above is the source for the control shape.
#   https://docs.fastrouter.ai/explore-features/reasoning-tokens (accessed 2026-10-21)
base_model = "xai/grok-4.5"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high"] }]

[cost]
input = 2
output = 6
cache_read = 0.3

[[cost.tiers]]
tier = { type = "context", size = 200_000 }
input = 4
output = 12
cache_read = 0.6
