# Effort: reasoning_effort = low|medium|high|xhigh
#   Live GET https://api.fastrouter.ai/api/v1/models (2026-10-21): supported_parameters lists reasoning_effort; published enum reasoning_effort = low|medium|high|xhigh.
#   Baseline: lab providers/xai grok-4.6 = effort low|medium|high|xhigh; peer providers/openrouter x-ai/grok-4.6 = effort low|medium|high|xhigh.
#   https://docs.fastrouter.ai/explore-features/reasoning-tokens (accessed 2026-10-21)
base_model = "xai/grok-4.6"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh"] }]

[cost]
input = 2
output = 6
cache_read = 0.5

[[cost.tiers]]
tier = { type = "context", size = 200_000 }
input = 4
output = 12
cache_read = 1
