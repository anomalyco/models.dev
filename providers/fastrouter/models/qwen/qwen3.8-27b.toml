# Toggle: enable_thinking = true|false
#   Live GET https://api.fastrouter.ai/api/v1/models (2026-10-21): supported_params_details.enable_thinking is a bool enum [true, false] and it is the only
#   reasoning field on this route; no reasoning_effort, thinking_budget or reasoning object is listed
#   (the sibling qwen/qwen3.8-max route does publish reasoning_effort with enum low|medium|xhigh).
#   Lab set is toggle + reasoning_effort low|medium|xhigh + thinking_budget (providers/alibaba qwen3.8-27b)
#   and providers/openrouter qwen3.8-27b is none|low|medium|xhigh; this host forwards only the toggle.
#   https://docs.fastrouter.ai/explore-features/reasoning-tokens (accessed 2026-10-21)
base_model = "alibaba/qwen3.8-27b"
reasoning_options = [{ type = "toggle" }]

[cost]
input = 0.4
output = 3
cache_read = 0.05
