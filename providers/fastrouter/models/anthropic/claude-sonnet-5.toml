# Effort: reasoning.effort = none|low|medium|high|xhigh|max
#   FastRouter sends Claude 4.6+ and Claude 5 adaptive-thinking effort (low|medium|high|xhigh|max, per
#   model); effort = none disables reasoning (same as reasoning.enabled = false), so no separate toggle,
#   the same wire as providers/fastrouter claude-opus-5 and claude-opus-4.7. Lab set is toggle +
#   low|medium|high|xhigh|max (providers/anthropic claude-sonnet-5); providers/openrouter claude-sonnet-5
#   is none|low|medium|high|xhigh|max.
#   Live GET https://api.fastrouter.ai/api/v1/models (2026-10-21): supported_parameters lists reasoning (schema empty, no enum).
#   https://docs.fastrouter.ai/explore-features/reasoning-tokens (accessed 2026-10-21)
base_model = "anthropic/claude-sonnet-5"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 2
output = 10
cache_read = 0.2
cache_write = 2.5
