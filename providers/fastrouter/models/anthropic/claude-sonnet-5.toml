# Source: GET https://go.fastrouter.ai/api/v1/models (public catalog, 2026-10-25); prices are USD per token there, per MTok here.
# Not represented: web search $0.01 per request (no v2 per-request field).
# Toggle: reasoning.enabled = true|false (lab wire field thinking.type = enabled|disabled, as in providers/anthropic claude-sonnet-5)
# Effort: reasoning.effort = low|medium|high|xhigh|max (the lab set; FastRouter maps it to Anthropic adaptive-thinking effort)
#   Baseline: lab providers/anthropic claude-sonnet-5 = toggle + effort low|medium|high|xhigh|max; none is not listed because the route publishes no enum.
#   Live GET https://api.fastrouter.ai/api/v1/models (2026-10-25): supported_parameters lists reasoning (schema empty, no enum).
#   https://docs.fastrouter.ai/explore-features/reasoning-tokens (accessed 2026-10-25)
schema = 2
base_model = "anthropic/claude-sonnet-5"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 2
cache = { read = 0.2, write = { "5m" = 2.5, "1h" = 4 } }

[cost.text.output]
price = 10
