# Toggle: reasoning true|false
# Effort: low|medium|high|max, matching the OpenRouter peer. No thinking_budget on this route.
base_model = "anthropic/claude-opus-4-6"
reasoning_options = [
  { type = "toggle" },
  { type = "effort", values = ["low", "medium", "high", "max"] },
]

[cost]
input = 5
output = 25
cache_read = 0.5
cache_write = 6.25
