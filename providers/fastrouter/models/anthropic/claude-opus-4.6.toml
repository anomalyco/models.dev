# Effort: reasoning.effort = none|low|medium|high|max
#   FastRouter sends Claude 4.6+ adaptive-thinking effort (low|medium|high|xhigh|max, per model) and maps an
#   unsupported level to the nearest one the model accepts; Opus 4.6 natively takes low|medium|high|max.
#   effort = none disables reasoning (same as reasoning.enabled = false), so no separate toggle.
#   reasoning.max_tokens is a budget only on Claude 4.5 and earlier, so no budget_tokens here.
#   https://docs.fastrouter.ai/explore-features/reasoning-tokens (accessed 2026-10-21)
# Live GET https://api.fastrouter.ai/api/v1/models (2026-10-21): supported_parameters lists reasoning and
#   include_reasoning (schemas empty, no enum); context_length 1000000, max_completion_tokens 128000.
# Peers: providers/anthropic claude-opus-4-6 effort low|medium|high|max; providers/openrouter
#   claude-opus-4.6 effort none|low|medium|high|max.
base_model = "anthropic/claude-opus-4-6"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "max"] }]

[cost]
input = 5
output = 25
cache_read = 0.5
cache_write = 6.25
