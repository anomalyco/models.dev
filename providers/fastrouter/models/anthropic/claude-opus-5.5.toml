# Effort: reasoning.effort = low|medium|high|xhigh|max
#   Live GET https://api.fastrouter.ai/api/v1/models (2026-10-21): supported_parameters lists include_reasoning, reasoning; published enum include_reasoning = True|False; reasoning = low|medium|high|xhigh|max.
#   Baseline: lab providers/anthropic claude-opus-5-5 = effort low|medium|high|xhigh|max; peer providers/openrouter anthropic/claude-opus-5.5 = effort low|medium|high|xhigh|max.
#   https://docs.fastrouter.ai/explore-features/reasoning-tokens (accessed 2026-10-21)
base_model = "anthropic/claude-opus-5-5"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 4
output = 20
cache_read = 0.2
cache_write = 5
