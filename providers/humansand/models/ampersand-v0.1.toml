# Sources: https://ampersand.humansand.ai/docs (API reference, model card, pricing)
# Tools are frozen for the lifetime of a session (updates = false); instructions too (system_updates = false).
# Reasoning effort: `high` (default) or `max`; no reasoning text is returned, only token counts.
schema = 2
base_model = "humansand/ampersand-v0.1"
status = "beta"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["high", "max"], default = { type = "effort", value = "high" } }
system_updates = false
cache = { supported = true, implicit = true, explicit = false }

[cost.text.input]
price = 1.0
cache = { read = 0.2, write = 0 }

[cost.text.output]
price = 5.2

# Agents API (sessions + input events), not chat completions: no @opencode/ai entry point yet.
[api.agents]
base_url = "https://ampersand.humansand.ai/v1"
sdk = { aisdk = "opencode-humansand", opencodeai = "none" }
