# Pricing: CNY 0.75 input / 7.50 output (thinking) / 3.00 output (non-thinking) per 1M tokens
# Converted at ~6.74 CNY/USD; output rate is the thinking-mode rate.
# Source: https://support.huaweicloud.com/price-maas/price-maas-0002.html (2026-08-13)
# Toggle: chat_template_kwargs.enable_thinking true|false
# https://support.huaweicloud.com/model-call-maas/model-call-021.html (accessed 2026-08-13)
base_model = "alibaba/qwen3-30b-a3b"

[[reasoning_options]]
type = "toggle"

[interleaved]
field = "reasoning_content"

[cost]
input = 0.11
output = 1.11

[limit]
context = 128_000
input = 128_000
output = 128_000