# Pricing: CNY 4.00 input / 16.00 output per 1M tokens (converted at ~6.74 CNY/USD)
# Source: https://support.huaweicloud.com/price-maas/price-maas-0002.html (2026-08-13)
base_model = "deepseek/deepseek-r1"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["high", "xhigh"]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.59
output = 2.37

[limit]
context = 128_000
input = 96_000
output = 32_000