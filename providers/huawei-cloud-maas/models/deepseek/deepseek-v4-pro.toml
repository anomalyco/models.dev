# Pricing: CNY 12.00 input / 24.00 output per 1M tokens (converted at ~6.74 CNY/USD)
# Source: https://support.huaweicloud.com/price-maas/price-maas-0002.html (2026-08-13)
base_model = "deepseek/deepseek-v4-pro"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["high", "xhigh"]

[interleaved]
field = "reasoning_content"

[cost]
input = 1.78
output = 3.56

[limit]
context = 1_000_000
input = 1_000_000
output = 128_000