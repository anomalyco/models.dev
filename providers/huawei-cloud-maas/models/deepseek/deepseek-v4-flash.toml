# Pricing: CNY 1.00 input / 2.00 output per 1M tokens (converted at ~6.74 CNY/USD)
# Source: https://support.huaweicloud.com/price-maas/price-maas-0002.html (2026-08-13)
# Toggle: chat_template_kwargs.thinking true|false
# reasoning_effort only supports "high" on this host (no graded control).
# https://support.huaweicloud.com/model-call-maas/model-call-021.html (accessed 2026-08-13)
base_model = "deepseek/deepseek-v4-flash"

[[reasoning_options]]
type = "toggle"

[interleaved]
field = "reasoning_content"

[cost]
input = 0.15
output = 0.30

[limit]
context = 1_000_000
input = 1_000_000
output = 128_000