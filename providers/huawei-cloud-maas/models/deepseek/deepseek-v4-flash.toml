# Pricing: CNY 1.00 input / 2.00 output per 1M tokens (converted at ~6.74 CNY/USD)
# Source: https://support.huaweicloud.com/price-maas/price-maas-0002.html (2026-08-13)
# Toggle: enable_thinking true|false (华为云 MaaS 文档: "深度思考（可开关）")
# Effort: reasoning_effort = low|high|max
base_model = "deepseek/deepseek-v4-flash"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.15
output = 0.30

[limit]
context = 1_000_000
input = 1_000_000
output = 128_000