# Pricing: CNY 2.00 input / 3.00 output per 1M tokens (converted at ~6.74 CNY/USD)
# Source: https://support.huaweicloud.com/price-maas/price-maas-0002.html (2026-08-13)
# Toggle: chat_template_kwargs.thinking true|false (default: non-thinking)
# https://support.huaweicloud.com/model-call-maas/model-call-021.html (accessed 2026-08-13)
base_model = "deepseek/deepseek-v3.2"

[[reasoning_options]]
type = "toggle"

[interleaved]
field = "reasoning_content"

[cost]
input = 0.30
output = 0.45

[limit]
context = 160_000
input = 128_000
output = 32_000