# Source: https://api.lowrouter.ai/v1/models?currency=usd (read 2026-10-10): this ID has 13 routes on anthropic, aws-bedrock, deepinfra.
# Cost is the route a plain request resolved to on 2026-10-10 under the default routing profile:
# Amazon Bedrock, fr-par endpoint; that route bills in USD, so this is its USD quote as the API returns it, with no currency conversion. A Bedrock regional endpoint carries AWS's premium over the global profile, which is why the figure sits
# above Anthropic's own list price.
# USD 3.3 in / 16.5 out / 0.33 cache read / 4.125 cache write per MTok.
# Another route can serve a request (the key's routing policy, or a failover); usage.cost on the
# response carries the amount debited.
# Effort: reasoning_effort = low|medium|high, mapped to Anthropic's adaptive thinking effort of the same
# name (https://lowrouter.ai/docs/guides/request-parameters). xhigh is also accepted and served as a
# 32,768-token thinking budget; max is rejected (400). Verified live 2026-10-10: nothing disclosed as
# unapplied. Anthropic routes do not return the trace on chat completions; thinking tokens are billed
# as output tokens.
# Limit: LowRouter serves 128,000 output tokens on this model (max_output_tokens in /v1/models), as providers/anthropic does; the lab file says 64,000.
base_model = "anthropic/claude-sonnet-4-6"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
input = 3.3
output = 16.5
cache_read = 0.33
cache_write = 4.125

[limit]
output = 128_000
