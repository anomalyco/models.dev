# Source: https://api.lowrouter.ai/v1/models?currency=usd (read 2026-10-12): this ID has 13 routes on anthropic, aws-bedrock, deepinfra.
# Cost is the route a plain request resolved to on 2026-10-12 under the default routing profile:
# Amazon Bedrock, ca-mtr endpoint;
# that route bills in USD, so this is its USD quote as the API returns it, with no currency conversion.
# A Bedrock regional endpoint carries AWS's premium over the global profile, which is why the figure
# sits above Anthropic's own list price.
# USD 3.3 in / 16.5 out / 0.33 cache read / 4.125 cache write per MTok.
# Another route can serve a request (the key's routing policy, or a failover); usage.cost on the
# response carries the amount debited.
# Effort: reasoning_effort = low|medium|high|xhigh. low, medium and high are sent as thinking.type = adaptive
# plus output_config.effort of the same name. This generation has no adaptive xhigh, so LowRouter serves
# xhigh as thinking.type = enabled with a 32,768-token budget; shown live on 2026-10-10: with max_tokens
# 400 it was disclosed max_tokens_too_small ('a thinking budget needs at least 1024 tokens below
# max_tokens', the budget path's own check), with max_tokens unset it was applied. minimal is sent as
# low (not distinct). max is not a LowRouter value: 400 'reasoning_effort "max" is not valid (expected
# one of: none, minimal, low, medium, high, xhigh)'. No thinking.type is exposed, so there is no separate
# on/off control; none sends no thinking parameter. https://lowrouter.ai/docs/guides/request-parameters
# Anthropic routes return no trace on chat completions; thinking tokens are billed as output tokens.
# Limit: LowRouter serves 128,000 output tokens on this model (max_output_tokens in /v1/models), as providers/anthropic does; the lab file says 64,000.
base_model = "anthropic/claude-sonnet-4-6"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh"]

[cost]
input = 3.3
output = 16.5
cache_read = 0.33
cache_write = 4.125

[limit]
output = 128_000
