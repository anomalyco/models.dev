# Source: https://api.lowrouter.ai/v1/models?currency=usd (read 2026-10-12): this ID has 10 routes on anthropic, aws-bedrock, deepinfra.
# Cost is the route a plain request resolved to on 2026-10-12 under the default routing profile:
# Amazon Bedrock, fr-par endpoint;
# that route bills in USD, so this is its USD quote as the API returns it, with no currency conversion.
# A Bedrock regional endpoint carries AWS's premium over the global profile, which is why the figure
# sits above Anthropic's own list price.
# USD 4.4 in / 22 out / 0.22 cache read / 5.5 cache write per MTok.
# Another route can serve a request (the key's routing policy, or a failover); usage.cost on the
# response carries the amount debited.
# Effort: reasoning_effort = low|medium|high|xhigh. LowRouter sends thinking.type = adaptive plus
# output_config.effort of the same name (https://lowrouter.ai/docs/guides/request-parameters). minimal is
# sent as low, so it is not a distinct control. max is not a LowRouter value: the request is refused with
# 400 'reasoning_effort "max" is not valid (expected one of: none, minimal, low, medium, high, xhigh)'.
# LowRouter exposes no thinking.type, so there is no separate on/off control on this host: none sends no
# thinking parameter and leaves Anthropic's default behaviour for the model.
# Verified live 2026-10-10 and 2026-10-12: the four values accepted, nothing disclosed as unapplied.
# Anthropic routes return no trace on chat completions; thinking tokens are billed as output tokens.
# Anthropic rejects thinking.type = disabled on this model; adaptive thinking cannot be turned off.
base_model = "anthropic/claude-opus-5-5"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh"]

[cost]
input = 4.4
output = 22
cache_read = 0.22
cache_write = 5.5
