# Source: https://api.lowrouter.ai/v1/models?currency=usd (read 2026-10-10): this ID has 6 routes on anthropic, aws-bedrock.
# Cost is the route a plain request resolved to on 2026-10-10 under the default routing profile:
# Amazon Bedrock, us-pdx endpoint (served after the first-ranked Bedrock region, ca-mtr, failed on that call;
# every Bedrock regional endpoint of this model carries the same price); that route bills in USD, so this is its USD quote as the API returns it, with no currency conversion. A Bedrock regional endpoint carries AWS's premium over the global profile, which is why the figure sits
# above Anthropic's own list price.
# USD 11 in / 55 out / 0.275 cache read / 13.75 cache write per MTok.
# Another route can serve a request (the key's routing policy, or a failover); usage.cost on the
# response carries the amount debited.
# Effort: reasoning_effort = low|medium|high|xhigh, mapped to Anthropic's adaptive thinking effort of the
# same name (https://lowrouter.ai/docs/guides/request-parameters). max is rejected (400). Verified live
# 2026-10-10: every value accepted and forwarded, nothing disclosed as unapplied. Anthropic routes do not
# return the trace on chat completions; thinking tokens are billed as output tokens.
base_model = "anthropic/claude-fable-5-1"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh"]

[cost]
input = 11
output = 55
cache_read = 0.275
cache_write = 13.75
