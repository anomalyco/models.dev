# Source: https://api.lowrouter.ai/v1/models?currency=usd (read 2026-10-12): this ID has 12 routes on anthropic, aws-bedrock.
# Cost is the route a plain request resolved to on 2026-10-12 under the default routing profile:
# Amazon Bedrock, ca-mtr endpoint;
# that route bills in USD, so this is its USD quote as the API returns it, with no currency conversion.
# A Bedrock regional endpoint carries AWS's premium over the global profile, which is why the figure
# sits above Anthropic's own list price.
# USD 5.5 in / 27.5 out / 0.55 cache read / 6.875 cache write per MTok.
# Another route can serve a request (the key's routing policy, or a failover); usage.cost on the
# response carries the amount debited.
# Effort: reasoning_effort = low|medium|high, the list /v1/models publishes for this ID
# (auto_routing.reasoning_effort). Each is sent as thinking.type = adaptive plus output_config.effort
# of the same name. minimal is sent as low (not distinct). max is not a LowRouter value: 400
# 'reasoning_effort "max" is not valid (expected one of: none, minimal, low, medium, high, xhigh)'.
# No thinking.type is exposed, so there is no separate on/off control; none sends no thinking
# parameter. https://lowrouter.ai/docs/guides/request-parameters
# Reasoning: chat completions return it as signed reasoning_details (plus reasoning_content/reasoning
# text), and only reasoning_details is replayed (live 2026-10-26 on Bedrock and Anthropic routes: the
# other two are dropped on replay); thinking tokens are billed as output tokens.
schema = 2
base_model = "anthropic/claude-opus-4-6"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_details" }

[cost.text.input]
price = 5.5
cache = { read = 0.55, write = 6.875 }

[cost.text.output]
price = 27.5
