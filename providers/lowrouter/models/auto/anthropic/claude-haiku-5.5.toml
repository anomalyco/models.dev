# Source: https://api.lowrouter.ai/v1/models?currency=usd (read 2026-10-10): this ID has 14 routes on aws-bedrock.
# Cost is the route a plain request resolved to on 2026-10-10 under the default routing profile:
# Amazon Bedrock, fr-par endpoint; that route bills in USD, so this is its USD quote as the API returns it, with no currency conversion. A Bedrock regional endpoint carries AWS's premium over the global profile, which is why the figure sits
# above Anthropic's own list price.
# USD 0.11 in / 0.55 out / 0.011 cache read / 0.1375 cache write per MTok.
# Another route can serve a request (the key's routing policy, or a failover); usage.cost on the
# response carries the amount debited.
# Effort: reasoning_effort = low|medium|high|xhigh, mapped to Anthropic's adaptive thinking effort of the
# same name (https://lowrouter.ai/docs/guides/request-parameters). max is rejected (400). Verified live
# 2026-10-10: every value accepted and forwarded, nothing disclosed as unapplied. Anthropic routes do not
# return the trace on chat completions; thinking tokens are billed as output tokens.
base_model = "anthropic/claude-haiku-5-5"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh"]

[cost]
input = 0.11
output = 0.55
cache_read = 0.011
cache_write = 0.1375

[[cost.tiers]]
tier = { type = "context", size = 100_000 }
input = 0.55
output = 2.75
cache_read = 0.055
cache_write = 0.6875
