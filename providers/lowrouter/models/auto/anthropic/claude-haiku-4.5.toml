# Source: https://api.lowrouter.ai/v1/models (read 2026-10-10): this ID has 13 routes on anthropic, aws-bedrock, deepinfra.
# Cost is the route a plain request resolved to on 2026-10-10 under the default routing profile:
# Amazon Bedrock, fr-par endpoint.
# LowRouter bills in EUR; a USD-billed route carries LowRouter's FX buffer and a Bedrock regional endpoint carries AWS's
# regional premium, so the figure sits above Anthropic's own list price.
# EUR 0.9999 in / 4.9993 out / 0.1 cache read / 1.2498 cache write per MTok,
# converted at 1.1186 USD/EUR (ECB reference rate, 2026-10-08). Another route can serve a request
# (the key's routing policy, or a failover); usage.cost on the response carries the amount debited.
# Effort: reasoning_effort = minimal|low|medium|high|xhigh, mapped to an extended-thinking budget of
# 1024 / 2048 / 8192 / 16384 / 32768 tokens (https://lowrouter.ai/docs/guides/request-parameters);
# max is rejected (400). Verified live 2026-10-10: every value accepted with max_tokens unset, nothing
# disclosed as unapplied, completion tokens rise from ~5 to 170-280 with thinking on. Anthropic routes
# do not return the trace on chat completions; thinking tokens are billed as output tokens.
base_model = "anthropic/claude-haiku-4-5"

[[reasoning_options]]
type = "effort"
values = ["minimal", "low", "medium", "high", "xhigh"]

[cost]
input = 1.1184
output = 5.5922
cache_read = 0.1118
cache_write = 1.398
