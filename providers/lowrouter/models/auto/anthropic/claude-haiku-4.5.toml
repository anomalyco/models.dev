# Source: https://api.lowrouter.ai/v1/models?currency=usd (read 2026-10-12): this ID has 13 routes on anthropic, aws-bedrock, deepinfra.
# Cost is the route a plain request resolved to on 2026-10-12 under the default routing profile:
# Amazon Bedrock, ca-mtr endpoint;
# that route bills in USD, so this is its USD quote as the API returns it, with no currency conversion.
# A Bedrock regional endpoint carries AWS's premium over the global profile, which is why the figure
# sits above Anthropic's own list price.
# USD 1.1 in / 5.5 out / 0.11 cache read / 1.375 cache write per MTok.
# Another route can serve a request (the key's routing policy, or a failover); usage.cost on the
# response carries the amount debited.
# Effort: reasoning_effort = minimal|low|medium|high|xhigh, sent as thinking.type = enabled with a budget
# of 1,024 / 2,048 / 8,192 / 16,384 / 32,768 tokens (https://lowrouter.ai/docs/guides/request-parameters).
# max is not a LowRouter value: 400 'reasoning_effort "max" is not valid (expected one of: none,
# minimal, low, medium, high, xhigh)'. No thinking.type is exposed, so there is no separate on/off control;
# none sends no thinking parameter. The budgets are distinct live (2026-10-12, a 12-coin weighing puzzle,
# max_tokens unset): Haiku 4.5 returned 2,062 completion tokens at minimal, 2,567 at low, 7,138 at high,
# 13,353 at xhigh; Opus 4.5 2,719 at minimal and 6,157 at high; nothing disclosed as unapplied.
# Anthropic routes return no trace on chat completions; thinking tokens are billed as output tokens.
base_model = "anthropic/claude-haiku-4-5"

[[reasoning_options]]
type = "effort"
values = ["minimal", "low", "medium", "high", "xhigh"]

[cost]
input = 1.1
output = 5.5
cache_read = 0.11
cache_write = 1.375
