# Source: https://api.lowrouter.ai/v1/models?currency=usd (read 2026-10-12): this ID has 13 routes on anthropic, aws-bedrock, deepinfra.
# Cost is the route a plain request resolved to on 2026-10-12 under the default routing profile:
# Amazon Bedrock, ca-mtr endpoint;
# that route bills in USD, so this is its USD quote as the API returns it, with no currency conversion.
# A Bedrock regional endpoint carries AWS's premium over the global profile, which is why the figure
# sits above Anthropic's own list price.
# USD 1.1 in / 5.5 out / 0.11 cache read / 1.375 cache write per MTok.
# Another route can serve a request (the key's routing policy, or a failover); usage.cost on the
# response carries the amount debited.
# Effort: reasoning_effort = minimal|low|medium|high|xhigh, the list /v1/models publishes for this ID
# (auto_routing.reasoning_effort, reasoning_mode budget; re-read 2026-10-26). Each is sent as
# thinking.type = enabled with a budget of 1,024 / 2,048 / 8,192 / 16,384 / 32,768 tokens
# (https://lowrouter.ai/docs/guides/request-parameters).
# max is not a LowRouter value: 400 'reasoning_effort "max" is not valid (expected one of: none,
# minimal, low, medium, high, xhigh)'. No thinking.type is exposed, so there is no separate on/off control;
# none sends no thinking parameter. Each level is distinct live (2026-10-26, a 12-coin weighing puzzle,
# max_tokens = budget + 2,048): 1,017 completion tokens at minimal, 1,502 at low, 5,103 at medium,
# 8,523 at high and 9,873 at xhigh, each finish_reason stop.
# Reasoning: chat completions return it as signed reasoning_details (plus reasoning_content/reasoning
# text), and only reasoning_details is replayed (live 2026-10-26 on Bedrock and Anthropic routes: the
# other two are dropped on replay); thinking tokens are billed as output tokens.
schema = 2
base_model = "anthropic/claude-haiku-4-5"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh"] }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_details" }

[cost.text.input]
price = 1.1
cache = { read = 0.11, write = 1.375 }

[cost.text.output]
price = 5.5
