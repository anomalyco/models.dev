# Source: https://api.lowrouter.ai/v1/models?currency=usd (read 2026-10-10): this ID has 13 routes on anthropic, aws-bedrock, deepinfra.
# Cost is the route a plain request resolved to on 2026-10-10 under the default routing profile:
# Amazon Bedrock, fr-par endpoint; that route bills in USD, so this is its USD quote as the API returns it, with no currency conversion. A Bedrock regional endpoint carries AWS's premium over the global profile, which is why the figure sits
# above Anthropic's own list price.
# USD 1.1 in / 5.5 out / 0.11 cache read / 1.375 cache write per MTok.
# Another route can serve a request (the key's routing policy, or a failover); usage.cost on the
# response carries the amount debited.
# Effort: reasoning_effort = minimal|low|medium|high|xhigh, mapped to an extended-thinking budget of
# 1024 / 2048 / 8192 / 16384 / 32768 tokens (https://lowrouter.ai/docs/guides/request-parameters);
# max is rejected (400). Verified live 2026-10-10: every value accepted with max_tokens unset, nothing
# disclosed as unapplied, completion tokens rise from ~5 to 170-280 with thinking on. Anthropic routes
# do not return the trace on chat completions; thinking tokens are billed as output tokens.
base_model = "anthropic/claude-haiku-4-5"

[[reasoning_options]]
type = "effort"
values = ["minimal", "low", "medium", "high", "xhigh"]

[cost]
input = 1.1
output = 5.5
cache_read = 0.11
cache_write = 1.375
