# Source: https://api.lowrouter.ai/v1/models?currency=usd (read 2026-10-12): this ID has 9 routes on aws-
# bedrock.
# Cost is the route a plain request resolved to on 2026-10-12 under the default routing profile:
# Amazon Bedrock, br-gru endpoint;
# that route bills in USD, so this is its USD quote as the API returns it, with no currency conversion.
# A Bedrock regional endpoint carries AWS's premium over the global profile.
# USD 0.18 in / 0.73 out per MTok.
# Another route can serve a request (the key's routing policy, or a failover); usage.cost on the
# response carries the amount debited.
# Reasoning: this route (Bedrock) takes no reasoning parameter; every reasoning_effort value sent on
# 2026-10-12 was disclosed as unsupported_on_this_path and the request served without it, so there is
# no caller control (https://lowrouter.ai/docs/guides/request-parameters).
schema = 2
base_model = "openai/gpt-oss-safeguard-120b"

[capabilities]
reasoning = { supported = true }
structured_output = true

[cost.text.input]
price = 0.18

[cost.text.output]
price = 0.73
