# Source: https://api.lowrouter.ai/v1/models (auto_routing, read 2026-10-09)
# Routes: Mistral La Plateforme, eu and global endpoints.
# Cost: highest EUR price across those routes (EUR 0.6358 input / 1.9541 output
# / 0.0654 cached input per MTok), converted at 1.1186 USD/EUR (ECB reference rate, 2026-10-08).
# Effort: reasoning_effort = none|high, forwarded unchanged to Mistral
# (https://lowrouter.ai/docs/guides/request-parameters). Same values as
# providers/mistral for this model.
# Limit: Mistral rejects prompts above 524288 tokens on this model, as
# recorded in providers/mistral/models/mistral-large-4.toml.
schema = 2
base_model = "mistral/mistral-large-4"
status = "beta"

[capabilities]
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = true

[limit]
context = 524_288

[cost.text.input]
price = 0.7112
cache = { read = 0.0732 }

[cost.text.output]
price = 2.1859
