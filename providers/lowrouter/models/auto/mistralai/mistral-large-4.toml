# Source: https://api.lowrouter.ai/v1/models (auto_routing, read 2026-10-21)
# Routes: Mistral La Plateforme, eu and global endpoints.
# Cost: highest EUR price across those routes (EUR 1.2716 input / 3.9083 output
# / 0.1309 cached input per MTok; the launch discount no longer applies), as
# converted by LowRouter at 1.1298 USD/EUR (ECB monthly fixing, 2026-10-01):
# https://api.lowrouter.ai/v1/models?currency=usd (read 2026-10-21).
# Effort: reasoning_effort = none|high, forwarded unchanged to Mistral
# (https://lowrouter.ai/docs/guides/request-parameters). Same values as
# providers/mistral for this model.
# Limit: Mistral rejects prompts above 524288 tokens on this model, as
# recorded in providers/mistral/models/mistral-large-4.toml.
schema = 2
base_model = "mistral/mistral-large-4"
status = "beta"

[capabilities]
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = true

[limit]
context = 524_288

[cost.text.input]
price = 1.4367
cache = { read = 0.1479 }

[cost.text.output]
price = 4.4156
