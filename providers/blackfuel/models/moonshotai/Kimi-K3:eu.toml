# Pricing and limits: Blackfuel serverless catalog (accessed 2026-10-03).
# https://docs.blackfuel.ai/docs/getting-started/models-catalog
# EU-hosted variant: requests are served from European data centers.
# Effort: reasoning_effort = low, high, max
base_model = "moonshotai/kimi-k3"
name = "Kimi K3 (EU)"
reasoning_options = [{ type = "effort", values = ["low", "high", "max"] }]

[cost]
input = 3.00
output = 15.00
cache_read = 0.60

[modalities]
input = ["text", "image"]
output = ["text"]
