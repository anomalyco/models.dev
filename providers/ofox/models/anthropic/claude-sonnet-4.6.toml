name = "Claude Sonnet 4.6"
description = "Claude workhorse for coding agents, careful analysis, and production cost control"
family = "claude-sonnet"
release_date = "2026-02-17"
last_updated = "2026-03-13"
attachment = true
reasoning = true
temperature = true
tool_call = true
knowledge = "2025-08-31"
open_weights = false

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "max"]

[[reasoning_options]]
type = "budget_tokens"
min = 1024

[cost]
input = 3
output = 15
cache_read = 0.3
cache_write = 3.75

[limit]
context = 1000000
output = 128000

[modalities]
input = ["text", "image", "pdf"]
output = ["text"]

[provider]
npm = "@ai-sdk/anthropic"
api = "https://api.ofox.ai/anthropic/v1"
