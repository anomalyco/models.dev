schema = 2
base_model = "anthropic/claude-opus-4-5"
status = "deprecated"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high"], budget = { min = 1_024 } }
system_updates = false
effort_updates = false
cache = { explicit = { ttl = ["5m", "1h"], min_tokens = 4_096 } }

[api.messages]
base_url = "https://api.ofox.ai/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 5
cache = { read = 0.5, write = 6.25 }

[cost.text.output]
