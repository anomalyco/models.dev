# Sources:
# - https://ofox.ai/models/anthropic/claude-opus-4.7 (Ofox model page: id, $5/$25, cache $0.5/$6.25)
# - https://claude.com/pricing (Anthropic API: Opus 4.7 $5/$25 input/output, cache write $6.25 / read $0.50)
# - https://platform.claude.com/docs/en/about-claude/pricing
# Mid-conversation (Ofox Anthropic Messages, https://ofox.ai/docs/api/anthropic/messages): system_updates, effort_updates, tools.updates = false because Anthropic's own API has no such mechanism for this model (providers/anthropic/models/claude-opus-4-7.toml).
# Cache: explicit cache_control only (neither endpoint caches automatically), 5m TTL or 1h with ttl = "1h"; minimum length per Anthropic (https://ofox.ai/docs/develop/models/claude/caching). 1h write price: catalog input_cache_write_1h.
# Effort: output_config.effort = low|medium|high|xhigh|max (https://ofox.ai/docs/develop/models/claude/thinking)
schema = 2
base_model = "anthropic/claude-opus-4-7"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
system_updates = false
effort_updates = false
cache = { explicit = { ttl = ["5m", "1h"], min_tokens = 2_048 } }

[api.messages]
base_url = "https://api.ofox.ai/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 5
cache = { read = 0.5, write = { "5m" = 6.25, "1h" = 10 } }

[cost.text.output]
price = 25
