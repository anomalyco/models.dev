# Sources:
# - https://ofox.ai/models/anthropic/claude-haiku-5.5 (model id anthropic/claude-haiku-5.5, $0.1/$0.5 MTok, cache $0.01/$0.125, 1M/128K, 2026-10-07, prompts >100K billed at 5x base)
# - https://platform.claude.com/docs/en/models/haiku-5-5/overview (first-party $0.10/$0.50 up to 100K then $0.50/$2.50 over, cache tiers, 1M/128K, adaptive thinking)
# - Lab: models/anthropic/claude-haiku-5-5.toml; first-party reasoning: providers/anthropic/models/claude-haiku-5-5.toml
# Toggle: thinking.type = disabled (Anthropic Messages; Ofox anthropic protocol, accepted at high effort or below)
# Effort: effort = low|medium|high|xhigh|max (adaptive thinking, same surface as other ofox anthropic/* entries)
# Mid-conversation (Ofox Anthropic Messages, https://ofox.ai/docs/api/anthropic/messages): system_updates, effort_updates, tools.updates unset: Anthropic supports them, but Ofox's reference doesn't document passing them through.
# Cache: explicit cache_control only (neither endpoint caches automatically), 5m TTL or 1h with ttl = "1h"; minimum length per Anthropic (https://ofox.ai/docs/develop/models/claude/caching). 1h write price: catalog input_cache_write_1h.
schema = 2
base_model = "anthropic/claude-haiku-5-5"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { supported = true, implicit = false, explicit = { ttl = ["5m", "1h"], min_tokens = 512 } }

[api.messages]
base_url = "https://api.ofox.ai/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic" }

[cost.text.input]
price = 0.1
cache = { read = 0.01, write = { "5m" = 0.125, "1h" = 0.2 } }

[[cost.text.input.overrides]]
when = { context = { gt = 100_000 } }
price = 0.5
cache = { read = 0.05, write = { "5m" = 0.625, "1h" = 1 } }

[cost.text.output]
price = 0.5

[[cost.text.output.overrides]]
when = { context = { gt = 100_000 } }
price = 2.5
