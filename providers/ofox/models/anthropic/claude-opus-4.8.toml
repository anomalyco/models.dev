# Mid-conversation (Ofox Anthropic Messages, https://ofox.ai/docs/api/anthropic/messages): effort_updates = false because Anthropic's own API has no such mechanism for this model (providers/anthropic/models/claude-opus-4-8.toml). system_updates, tools.updates unset: Anthropic supports them, but Ofox's reference doesn't document passing them through.
# Cache: explicit cache_control only (neither endpoint caches automatically), 5m TTL or 1h with ttl = "1h"; minimum length per Anthropic (https://ofox.ai/docs/develop/models/claude/caching). 1h write price: catalog input_cache_write_1h.
# Effort: output_config.effort = low|medium|high|xhigh|max (https://ofox.ai/docs/develop/models/claude/thinking)
schema = 2
base_model = "anthropic/claude-opus-4-8"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
effort_updates = false
cache = { explicit = { ttl = ["5m", "1h"], min_tokens = 1_024 } }

[api.messages]
base_url = "https://api.ofox.ai/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 5
cache = { read = 0.5, write = { "5m" = 6.25, "1h" = 10 } }

[cost.text.output]
price = 25
