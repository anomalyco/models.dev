# https://ofox.ai/models/openai/gpt-5.1 — input $1.25/M, output $10/M, cache_read $0.13/M
# Mid-conversation (Ofox Responses, https://ofox.ai/docs/api/openai/responses): effort_updates = false because OpenAI's own API has no such mechanism for this model (providers/openai/models/gpt-5.1.toml). system_updates, tools.updates unset: OpenAI supports them, but Ofox's reference doesn't document passing them through.
# Cache: automatic prefix caching (https://ofox.ai/docs/develop/models/gpt#caching).
# Effort: reasoning.effort = none|low|medium|high (https://ofox.ai/docs/develop/models/gpt/reasoning)
schema = 2
base_model = "openai/gpt-5.1"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
effort_updates = false
cache = { supported = true, implicit = true }

[api.responses]
base_url = "https://api.ofox.ai/v1"
sdk = { aisdk = "@ai-sdk/openai" }

[cost.text.input]
price = 1.25
cache = { read = 0.13 }

[cost.text.output]
price = 10
