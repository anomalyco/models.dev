# Sources:
# - https://ofox.ai/en/models/openai/gpt-5.2-codex (list pricing)
# - https://api.ofox.ai/v1/models/openai/gpt-5.2-codex (prompt/completion/cache_read per-token)
# - https://developers.openai.com/api/docs/models/gpt-5.2-codex (effort: low|medium|high|xhigh)
schema = 2
base_model = "openai/gpt-5.2-codex"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true

[api.responses]
base_url = "https://api.ofox.ai/v1"
sdk = { aisdk = "@ai-sdk/openai" }

[cost.text.input]
price = 1.75
cache = { read = 0.18 }

[cost.text.output]
price = 14
