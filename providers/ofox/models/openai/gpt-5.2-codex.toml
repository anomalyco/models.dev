# Sources:
# - https://ofox.ai/en/models/openai/gpt-5.2-codex (list pricing)
# - https://api.ofox.ai/v1/models/openai/gpt-5.2-codex (prompt/completion/cache_read per-token)
# - https://developers.openai.com/api/docs/models/gpt-5.2-codex (effort: low|medium|high|xhigh)
# Mid-conversation (Ofox Responses, https://ofox.ai/docs/api/openai/responses): system_updates, effort_updates, tools.updates unset: no first-party OpenAI entry to compare and Ofox's reference doesn't cover it.
# Cache: automatic prefix caching (https://ofox.ai/docs/develop/models/gpt#caching).
schema = 2
base_model = "openai/gpt-5.2-codex"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
cache = { implicit = true }

[api.responses]
base_url = "https://api.ofox.ai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }

[cost.text.input]
price = 1.75
cache = { read = 0.18 }

[cost.text.output]
price = 14
