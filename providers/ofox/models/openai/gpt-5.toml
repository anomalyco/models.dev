# Sources:
# - https://ofox.ai/en/models/openai/gpt-5 (list pricing)
# - https://api.ofox.ai/v2/models/catalog?include=provider_price (input/output/cache_read)
# Reasoning effort: OpenAI first-party gpt-5 + relay peers (minimal/low/medium/high)
base_model = "openai/gpt-5"

[[reasoning_options]]
type = "effort"
values = ["minimal", "low", "medium", "high"]

[cost]
input = 1
output = 8
cache_read = 0.104

[provider]
npm = "@ai-sdk/openai"
api = "https://api.ofox.ai/v1"
