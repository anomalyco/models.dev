# Sources:
# https://ofox.ai/models/openai/gpt-5.1-codex-mini
# https://api.ofox.ai/v1/models/openai/gpt-5.1-codex-mini
# https://developers.openai.com/api/docs/models/gpt-5.1-codex-mini
# https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning
# Mid-conversation (Ofox Responses, https://ofox.ai/docs/api/openai/responses): system_updates, effort_updates, tools.updates unset: no first-party OpenAI entry to compare and Ofox's reference doesn't cover it.
# Cache: automatic prefix caching (https://ofox.ai/docs/develop/models/gpt#caching).
# Effort: reasoning.effort = none|low|medium|high (https://ofox.ai/docs/develop/models/gpt/reasoning)
schema = 2
base_model = "openai/gpt-5.1-codex-mini"
base_model_omit = ["limit.input"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
cache = { supported = true, implicit = true }

[limit]
context = 256_000
output = 65_536

[api.responses]
base_url = "https://api.ofox.ai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }

[cost.text.input]
price = 0.25
cache = { read = 0.03 }

[cost.text.output]
price = 2
