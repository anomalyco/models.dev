# Sources:
# https://ofox.ai/models/openai/gpt-5.1-codex-mini
# https://api.ofox.ai/v1/models/openai/gpt-5.1-codex-mini
# https://developers.openai.com/api/docs/models/gpt-5.1-codex-mini
# https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning
base_model = "openai/gpt-5.1-codex-mini"
base_model_omit = ["limit.input"]
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high"] }]

[cost]
input = 0.25
output = 2
cache_read = 0.03

[limit]
context = 256_000
output = 65_536

[provider]
npm = "@ai-sdk/openai"
api = "https://api.ofox.ai/v1"
