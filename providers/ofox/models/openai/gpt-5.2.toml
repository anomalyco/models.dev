# Sources:
# https://ofox.ai/models/openai/gpt-5.2 (input $1.75/M, output $14/M, cache read $0.18/M)
# https://api.ofox.ai/v2/models/catalog (remote model id openai/gpt-5.2)
# Reasoning: OpenAI first-party gpt-5.2 + ofox openai/gpt-5.5 peer
# Mid-conversation (Ofox Responses, https://ofox.ai/docs/api/openai/responses): effort_updates = false because OpenAI's own API has no such mechanism for this model (providers/openai/models/gpt-5.2.toml). system_updates, tools.updates unset: OpenAI supports them, but Ofox's reference doesn't document passing them through.
# Cache: automatic prefix caching (https://ofox.ai/docs/develop/models/gpt#caching).
# Effort: reasoning.effort = none|low|medium|high|xhigh (https://ofox.ai/docs/develop/models/gpt/reasoning)
schema = 2
base_model = "openai/gpt-5.2"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true
effort_updates = false
cache = { implicit = true }

[api.responses]
base_url = "https://api.ofox.ai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }

[cost.text.input]
price = 1.75
cache = { read = 0.18 }

[cost.text.output]
price = 14
