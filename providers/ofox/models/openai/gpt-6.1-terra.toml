# Sources:
# - Ofox model page: https://ofox.ai/models/openai/gpt-6.1-terra
# - Ofox catalog API: https://api.ofox.ai/v2/models/catalog?include=provider_price&search=gpt-6.1-terra (accessed 2026-10-28;
#   $1 / $0.05 cached / $1.25 cache write / $5 output, and $2 / $0.10 / $2.50 / $7.50 above 272K context; provider_price is_override=false)
# - OpenAI model docs (pricing/reasoning): https://developers.openai.com/api/docs/models/gpt-6.1-terra
# Mid-conversation (Ofox Responses, https://ofox.ai/docs/api/openai/responses): system_updates, effort_updates, tools.updates unset: OpenAI supports them, but Ofox's reference doesn't document passing them through.
# Cache: automatic prefix caching (https://ofox.ai/docs/develop/models/gpt#caching).
# Effort: reasoning.effort passes through to OpenAI (https://ofox.ai/docs/develop/models/gpt/reasoning); OpenAI lists none|low|medium|high|xhigh|max for GPT-6.1 Terra.
schema = 2
base_model = "openai/gpt-6.1-terra"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true }

[api.responses]
base_url = "https://api.ofox.ai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }

[cost.text.input]
price = 1
cache = { read = 0.05, write = 1.25 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 2
cache = { read = 0.1, write = 2.5 }

[cost.text.output]
price = 5

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 7.5
