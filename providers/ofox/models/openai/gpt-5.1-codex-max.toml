# Sources:
# - https://ofox.ai/en/models/openai/gpt-5.1-codex-max (Ofox pricing $1.25/$10, cache_read $0.13/M; context 256K)
# - https://api.ofox.ai/v1/models/openai/gpt-5.1-codex-max (per-token pricing; context_length 256000; max_completion 128000)
# - https://developers.openai.com/api/docs/models/gpt-5.1-codex-max (lab model identity, modalities, 400K native context)
# Effort: reasoning_effort = low|medium|high|xhigh (OpenAI Codex Max / established relay peers)
# Mid-conversation (Ofox Responses, https://ofox.ai/docs/api/openai/responses): system_updates, effort_updates, tools.updates unset: no first-party OpenAI entry to compare and Ofox's reference doesn't cover it.
# Cache: automatic prefix caching (https://ofox.ai/docs/develop/models/gpt#caching).
schema = 2
base_model = "openai/gpt-5.1-codex-max"
base_model_omit = ["limit.input"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
cache = { supported = true, implicit = true }

[limit]
context = 256_000
output = 128_000

[api.responses]
base_url = "https://api.ofox.ai/v1"
sdk = { aisdk = "@ai-sdk/openai" }

[cost.text.input]
price = 1.25
cache = { read = 0.13 }

[cost.text.output]
price = 10
