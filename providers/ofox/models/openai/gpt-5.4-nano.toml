# Sources:
# https://ofox.ai/en/models/openai/gpt-5.4-nano (Ofox list price: $0.20/$1.25, cache_read $0.02)
# https://developers.openai.com/api/docs/models/gpt-5.4-nano (lab pricing + reasoning effort)
schema = 2
base_model = "openai/gpt-5.4-nano"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true

[api.responses]
base_url = "https://api.ofox.ai/v1"
sdk = { aisdk = "@ai-sdk/openai" }

[cost.text.input]
price = 0.2
cache = { read = 0.02 }

[cost.text.output]
price = 1.25
