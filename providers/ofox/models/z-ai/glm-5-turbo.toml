# Sources:
# - https://ofox.ai/models/z-ai/glm-5-turbo (pricing $1.2/$4 per MTok, cache_read $0.24; context 200K; output 128K)
# - https://docs.z.ai/guides/overview/concept-param (thinking.type for GLM-5-Turbo; reasoning_effort only GLM-5.2+)
