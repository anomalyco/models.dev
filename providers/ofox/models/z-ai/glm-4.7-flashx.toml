# Sources:
# - https://ofox.ai/models/z-ai/glm-4.7-flashx (pricing, context 200K, max output 128K)
# - https://api.ofox.ai/v1/models/z-ai/glm-4.7-flashx (catalog pricing/limits; supported_parameters includes reasoning)
# - https://docs.z.ai/guides/capabilities/thinking (thinking.type enabled|disabled for GLM-4.7 series)
# - https://docs.z.ai/guides/overview/pricing (lab list price reference)
# Toggle: thinking.type = enabled|disabled
# Mid-conversation (Ofox Chat Completions, https://ofox.ai/docs/api/openai/chat-completions): reasoning and tools are per-request fields with no per-turn change mechanism (effort_updates = false, tools.updates = false).
# system_updates unset: Ofox relays to the upstream cloud and doesn't document where a later system message goes.
# Cache: automatic prefix caching (https://ofox.ai/docs/develop/models/glm).
schema = 2
base_model = "zhipuai/glm-4.7-flashx"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true }
effort_updates = false
cache = { implicit = true }

[limit]
output = 128_000

[cost.text.input]
price = 0.072
cache = { read = 0.01 }

[cost.text.output]
price = 0.4
