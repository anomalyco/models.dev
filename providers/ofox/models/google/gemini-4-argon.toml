# Sources (accessed 2026-10-14):
# - https://ofox.ai/models/google/gemini-4-argon (Providers table: Input $2/$4, Output $10/$20, Cache Read $0.1/$0.2, Audio Input $2/$4; Thinking levels low/medium/high; protocols openai+gemini; Gemini code example uses https://api.ofox.ai/gemini)
# - https://ai.google.dev/gemini-api/docs/pricing#gemini-4-argon (intro $2 input / $10 output through 2026-11-30, then $4/$20; implicit caching only)
# Reasoning: multi-model relay — copy lab effort set low/medium/high from providers/google/models/gemini-4-argon.toml and openrouter/vercel/kilo peers; Ofox page confirms same thinking levels.
# Pricing uses the Ofox discounted (-50%) intro column, matching Ofox google peers (e.g. gemini-3.8-flash 0.75/3.75) and Google intro rates; FAQ/meta show list $4/$20.
# Mid-conversation (Ofox Gemini native API, https://ofox.ai/docs/api/gemini/generate-content): systemInstruction, thinkingConfig and tools are request-level and content roles are user/model, so system_updates, effort_updates and tools.updates are false.
# Cache: implicit, plus explicit cachedContents on the Gemini native API (https://ofox.ai/docs/develop/models/gemini#caching, https://ofox.ai/docs/develop/advanced/gemini-explicit-cache).
schema = 2
base_model = "google/gemini-4-argon"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
system_updates = false
effort_updates = false
cache = { supported = true, implicit = true, explicit = true }

[api.generate-content]
base_url = "https://api.ofox.ai/gemini/v1beta"
sdk = { aisdk = "@ai-sdk/google", opencodeai = "@opencode/ai/providers/google" }

[cost.text.input]
price = 2
cache = { read = 0.1 }

[cost.text.output]
price = 10

[cost.audio.input]
price = 2
