# Sources (accessed 2026-09-11):
# https://ofox.ai/models/google/gemini-3.8-flash
# https://api.ofox.ai/v1/models/google/gemini-3.8-flash
# https://ai.google.dev/gemini-api/docs/models/gemini-3.8-flash
schema = 2
base_model = "google/gemini-3.8-flash"

[modalities]
input = ["text", "image", "audio", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
context = 1_000_000

[api.generate-content]
base_url = "https://api.ofox.ai/gemini/v1beta"
sdk = { aisdk = "@ai-sdk/google" }

[cost.text.input]
price = 0.75
cache = { read = 0.075, write = 0.0415 }

[cost.text.output]
price = 3.75

[cost.audio.input]
price = 0.75
