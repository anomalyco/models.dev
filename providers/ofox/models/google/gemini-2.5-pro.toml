# Sources:
# - https://ofox.ai/en/models/google/gemini-2.5-pro (pricing, capabilities; accessed 2026-08-06)
# - https://api.ofox.ai/v2/models/catalog?include=provider_price&limit=500 (id google/gemini-2.5-pro; input/output/cache $/token)
# Reasoning: Gemini 2.5 Pro native thinkingBudget (lab + OpenRouter/Vertex peers); Ofox exposes Gemini native + OpenAI protocols.
# Mid-conversation (Ofox Chat Completions, https://ofox.ai/docs/api/openai/chat-completions): reasoning and tools are per-request fields with no per-turn change mechanism (effort_updates = false, tools.updates = false).
# system_updates unset: Ofox relays to the upstream cloud and doesn't document where a later system message goes.
# Cache: implicit (https://ofox.ai/docs/develop/models/gemini#caching); explicit cachedContents is on the Gemini native API only.
schema = 2
base_model = "google/gemini-2.5-pro"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, budget = { min = 128, max = 32_768 } }
structured_output = true
effort_updates = false
cache = { implicit = true }

[cost.text.input]
price = 1.25
cache = { read = 0.125, write = 4.5 }

[cost.text.output]
price = 10

[cost.audio.input]
price = 1.25
