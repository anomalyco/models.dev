# Sources (accessed 2026-11-17):
# - https://api.ofox.ai/v2/models/catalog?include=provider_price (pricing: provider_price override is effective, is_override = true: input $2, output $10, cache read $0.1, audio $2 per MTok; list price $4/$20 is the pre-discount rate; context 1,048,576, max output 65,536; thinking levels low/medium (default)/high; implicit caching only per the catalog description; protocols openai+gemini)
# - https://ofox.ai/models/google/gemini-4-carbon
# - https://ai.google.dev/gemini-api/docs/pricing#gemini-4-carbon (intro $2 input / $10 output through 2026-11-30, then $4/$20)
# Reasoning: multi-model relay, so the lab effort set low/medium/high comes from providers/google/models/gemini-4-carbon.toml and the Ofox peer gemini-4-argon.toml. Not probed live (no Ofox key available).
# Modalities, limits and temperature flags inherit the lab file; the Ofox catalog does not list modalities.
# Mid-conversation (Ofox Gemini native API, https://ofox.ai/docs/api/gemini/generate-content): systemInstruction, thinkingConfig and tools are request-level and content roles are user/model, so system_updates, effort_updates and tools.updates are false.
# Cache: implicit only. The Ofox catalog says implicit caching only for this model, and Google rejects explicit caching for Carbon.
schema = 2
base_model = "google/gemini-4-carbon"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[api.generate-content]
base_url = "https://api.ofox.ai/gemini/v1beta"
sdk = { aisdk = "@ai-sdk/google", opencodeai = "@opencode/ai/providers/google" }

[cost.text.input]
price = 2
cache = { read = 0.1 }

[cost.text.output]
price = 10

[cost.audio.input]
price = 2
