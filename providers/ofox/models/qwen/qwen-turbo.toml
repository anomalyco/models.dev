# Sources (accessed 2026-09-11):
# https://ofox.ai/models/qwen/qwen-turbo
# https://api.ofox.ai/v1/models/qwen/qwen-turbo
# Mid-conversation (Ofox Chat Completions, https://ofox.ai/docs/api/openai/chat-completions): reasoning and tools are per-request fields with no per-turn change mechanism (effort_updates = false, tools.updates = false).
# system_updates unset: Ofox relays to the upstream cloud and doesn't document where a later system message goes.
# Cache: automatic prefix caching (https://ofox.ai/docs/develop/models/qwen) with a catalog cache-read price, though the catalog's prompt_caching flag is false.
schema = 2
base_model = "alibaba/qwen-turbo"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = false }
effort_updates = false
cache = { supported = true, implicit = true }

[limit]
context = 128_000
output = 16_000

[cost.text.input]
price = 0.043
cache = { read = 0.0086 }

[cost.text.output]
price = 0.09
