# Sources (accessed 2026-11-17):
# - https://api.ofox.ai/v2/models/catalog?include=provider_price (aliyun: input $1.5, output $4.5, cache read $0.075, cache write $1.875 per MTok; the 1h write price $3 is not published since no request field selects it; the catalog lists context 0, max output 0 and no capabilities, so limits and modalities inherit the lab file)
# - https://ofox.ai/models/qwen/qwen4-max
# Effort: reasoning_effort = none|low|high|xhigh, no separate toggle. Set follows providers/novita-ai/models/qwen/qwen4-max.toml (probed live there) and providers/llmgateway/models/qwen4-max.toml; lab docs list low|high|xhigh (https://www.alibabacloud.com/help/en/model-studio/qwen4-max). Not probed on Ofox (no Ofox key available).
# Cache: automatic prefix caching, as on the other Ofox Qwen entries (https://ofox.ai/docs/develop/models/qwen).
# structured_output: as on the other Ofox Qwen entries (https://ofox.ai/docs/develop/models/qwen).
# Mid-conversation (Ofox Chat Completions, https://ofox.ai/docs/api/openai/chat-completions): reasoning and tools are per-request fields (effort_updates = false, tools.updates = false); system_updates unset as for the other Ofox Qwen entries.
schema = 2
base_model = "alibaba/qwen4-max"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "xhigh"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 1.5
cache = { read = 0.075, write = 1.875 }

[cost.text.output]
price = 4.5
