# Sources (accessed 2026-09-10):
# https://ofox.ai/models/qwen/qwen3.8-flash
# https://api.ofox.ai/v1/models/qwen/qwen3.8-flash
# https://www.qwencloud.com/models/qwen3.8-flash
# https://docs.qwencloud.com/developer-guides/text-generation/thinking
# Toggle: enable_thinking true|false (hybrid; Qwen/DashScope surface through Ofox)
# Budget: thinking_budget
# Mid-conversation (Ofox Chat Completions, https://ofox.ai/docs/api/openai/chat-completions): reasoning and tools are per-request fields with no per-turn change mechanism (effort_updates = false, tools.updates = false).
# system_updates unset: Ofox relays to the upstream cloud and doesn't document where a later system message goes.
# Cache: automatic prefix caching (https://ofox.ai/docs/develop/models/qwen).
schema = 2
base_model = "alibaba/qwen3.8-flash"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true, budget = {} }
structured_output = true
effort_updates = false
cache = { implicit = true }

[cost.text.input]
price = 0.11
cache = { read = 0.011, write = 0.14 }

[cost.text.output]
price = 0.39
