# Sources (accessed 2026-09-10):
# https://ofox.ai/models/qwen/qwen3.8-max
# https://api.ofox.ai/v1/models/qwen/qwen3.8-max
# https://www.qwencloud.com/models/qwen3.8-max
# https://docs.qwencloud.com/developer-guides/text-generation/thinking
# Toggle: enable_thinking true|false (hybrid; Qwen/DashScope surface through Ofox)
# Effort: reasoning_effort = low|medium|xhigh (default xhigh); high accepted as alias → xhigh
# Budget: thinking_budget (0..262144) cannot be combined with reasoning_effort
schema = 2
base_model = "alibaba/qwen3.8-max"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "xhigh"], budget = { min = 0, max = 262_144 } }

[cost.text.input]
price = 1.71
cache = { read = 0.17, write = 2.14 }

[cost.text.output]
price = 5.14
