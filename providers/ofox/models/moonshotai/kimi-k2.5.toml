# https://ofox.ai/en/models/moonshotai/kimi-k2.5
# https://api.ofox.ai/v1/models (id moonshotai/kimi-k2.5)
# Pricing: $0.60/M input, $3/M output, $0.10/M cache read (USD)
# Toggle: thinking.type = enabled|disabled (Moonshot K2.5 lab API; Ofox supported_parameters includes reasoning)
# Mid-conversation (Ofox Chat Completions, https://ofox.ai/docs/api/openai/chat-completions): reasoning and tools are per-request fields with no per-turn change mechanism (effort_updates = false, tools.updates = false).
# system_updates unset: Ofox relays to the upstream cloud and doesn't document where a later system message goes.
# Cache: automatic prefix caching (https://ofox.ai/docs/develop/models/kimi).
# Status: GET https://api.ofox.ai/v1/models/moonshotai/kimi-k2.5 returns 410 model_deprecated ("已下线", taken offline), checked 2026-10-20.
schema = 2
base_model = "moonshotai/kimi-k2.5"
status = "deprecated"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true }
structured_output = true
effort_updates = false
cache = { supported = true, implicit = true }

[cost.text.input]
price = 0.6
cache = { read = 0.1 }

[cost.text.output]
price = 3
