# Sources:
# - Ofox model page: https://ofox.ai/models/moonshotai/kimi-k3.1-pro
# - Ofox catalog API: https://api.ofox.ai/v2/models/catalog?include=provider_price&search=kimi-k3.1 (accessed 2026-10-28;
#   served through Volcengine Beijing, pinned kimi-k3-1-pro-261024; $2 / $0.20 cached / $11 output, web search $0.005 per call;
#   text and image input, video_input false; 1,048,576 context, 131,072 output)
# - Kimi family docs: https://ofox.ai/docs/develop/models/kimi (automatic prefix caching, web_search on the Responses API)
# Effort: Moonshot's surface for K3.1 Pro, reasoning_effort = low|high|max (default max), no off toggle
#   (https://platform.kimi.ai/docs/guide/kimi-k3-1-pro-quickstart). Ofox doesn't document K3.1 Pro's controls on its
#   Volcengine route and they weren't checked live.
# Structured output and mid-conversation flags are left unset for the same reason.
schema = 2
base_model = "moonshotai/kimi-k3.1-pro"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "max" }, effort = ["low", "high", "max"] }
cache = { implicit = true }

[cost.text.input]
price = 2
cache = { read = 0.2 }

[cost.text.output]
price = 11

[cost.web_search]
price = 5
