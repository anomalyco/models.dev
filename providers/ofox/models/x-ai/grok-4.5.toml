# Sources:
# - https://api.ofox.ai/v1/models/x-ai/grok-4.5 (prompt $2/M, completion $6/M, cache_read $0.3/M; context 500K; max_completion_tokens 65536; supported_parameters includes reasoning; accessed 2026-08-19)
# - https://ofox.ai/en/models/x-ai/grok-4.5 (same pricing; context 500K; max output 66K; reasoning; accessed 2026-08-19)
# - https://docs.x.ai/developers/models/grok-4.5 (first-party effort low|medium|high; lab pricing tiers not listed on Ofox)
# reasoning_options: multi-model relay — copy first-party xAI + peer relays (low/medium/high)
# Mid-conversation (Ofox Chat Completions, https://ofox.ai/docs/api/openai/chat-completions): reasoning and tools are per-request fields with no per-turn change mechanism (effort_updates = false, tools.updates = false).
# system_updates unset: Ofox relays to the upstream cloud and doesn't document where a later system message goes.
# Cache: automatic prefix caching (https://ofox.ai/docs/develop/models/grok).
schema = 2
base_model = "xai/grok-4.5"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
effort_updates = false
cache = { implicit = true }

[limit]
output = 65_536

[cost.text.input]
price = 2
cache = { read = 0.3 }

[cost.text.output]
price = 6
