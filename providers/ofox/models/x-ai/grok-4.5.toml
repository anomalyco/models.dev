# Sources:
# - https://api.ofox.ai/v1/models/x-ai/grok-4.5 (prompt $2/M, completion $6/M, cache_read $0.3/M; context 500K; max_completion_tokens 65536; supported_parameters includes reasoning; accessed 2026-08-19)
# - https://ofox.ai/en/models/x-ai/grok-4.5 (same pricing; context 500K; max output 66K; reasoning; accessed 2026-08-19)
# - https://docs.x.ai/developers/models/grok-4.5 (first-party effort low|medium|high; lab pricing tiers not listed on Ofox)
# reasoning_options: multi-model relay — copy first-party xAI + peer relays (low/medium/high)
base_model = "xai/grok-4.5"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high"] }]

[cost]
input = 2
output = 6
cache_read = 0.3

[limit]
output = 65_536
