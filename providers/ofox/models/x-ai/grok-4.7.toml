# Ofox: x-ai/grok-4.7 → xAI Grok 4.7
# Sources:
# - https://api.ofox.ai/v1/models/x-ai/grok-4.7 (prompt $2/M, completion $6/M, cache_read $0.5/M; context 500k; max_completion 65536; supported_parameters includes reasoning)
# - https://ofox.ai/models/x-ai/grok-4.7 (same pricing; max output 66K; reasoning + tools + prompt caching)
# - https://docs.x.ai/developers/models/grok-4.7 (reasoning_effort low|medium|high|xhigh; cannot disable)
# reasoning_options match first-party xAI + relay peers (no none)
base_model = "xai/grok-4.7"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh"] }]

[cost]
input = 2
output = 6
cache_read = 0.5

[limit]
output = 65_536
