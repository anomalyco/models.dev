# Sources:
# - https://ofox.ai/en/models/x-ai/grok-4.20 (Ofox pricing, context 2M, max output 128K; accessed 2026-08-06)
# - https://docs.x.ai/developers/models/grok-4.20-reasoning (`grok-4.20` aliases grok-4.20-0309-reasoning; reasoning always-on)
# reasoning_options = [] matches first-party xAI + relay peers (always-on, no caller control)
# Mid-conversation (Ofox Chat Completions, https://ofox.ai/docs/api/openai/chat-completions): reasoning and tools are per-request fields with no per-turn change mechanism (effort_updates = false, tools.updates = false).
# system_updates unset: Ofox relays to the upstream cloud and doesn't document where a later system message goes.
# Cache: automatic prefix caching (https://ofox.ai/docs/develop/models/grok).
schema = 2
base_model = "xai/grok-4.20-0309-reasoning"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
structured_output = true
effort_updates = false
cache = { implicit = true }

[limit]
context = 2_000_000
output = 128_000

[cost.text.input]
price = 4
cache = { read = 0.4 }

[cost.text.output]
price = 12
