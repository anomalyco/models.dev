# Ofox: x-ai/grok-4.6 → xAI Grok 4.6
# Sources:
# - https://api.ofox.ai/v1/models/x-ai/grok-4.6 (prompt $2/M, completion $6/M, cache_read $0.5/M; context 500k; max_completion 65536; supported_parameters includes reasoning)
# - https://ofox.ai/models/x-ai/grok-4.6 (same pricing; max output 66K; reasoning + tools + prompt caching)
# - https://docs.x.ai/developers/model-capabilities/text/reasoning (reasoning_effort low|medium|high|xhigh; cannot disable)
# reasoning_options match first-party xAI + relay peers (no none)
# Mid-conversation (Ofox Chat Completions, https://ofox.ai/docs/api/openai/chat-completions): reasoning and tools are per-request fields with no per-turn change mechanism (effort_updates = false, tools.updates = false).
# system_updates unset: Ofox relays to the upstream cloud and doesn't document where a later system message goes.
# Cache: automatic prefix caching (https://ofox.ai/docs/develop/models/grok).
schema = 2
base_model = "xai/grok-4.6"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
effort_updates = false
cache = { implicit = true }

[limit]
output = 65_536

[cost.text.input]
price = 2
cache = { read = 0.5 }

[cost.text.output]
price = 6
