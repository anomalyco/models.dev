# Sources:
# - https://ofox.ai/models/bailian/qwen-flash (pricing, context, capabilities)
# - https://api.ofox.ai/v2/models/catalog?include=provider_price&search=qwen-flash&limit=10
#   pricing.input=0.000000022 → $0.022/MTok
#   pricing.output=0.00000022 → $0.22/MTok
#   pricing.input_cache_read=0.0000000043 → $0.0043/MTok
#   pricing.input_cache_write=0.000000027 → $0.027/MTok
# - https://help.aliyun.com/en/model-studio/deep-thinking (qwen-flash hybrid thinking)
# Toggle: enable_thinking true|false
# Budget: thinking_budget (integer reasoning tokens)
# Mid-conversation (Ofox Chat Completions, https://ofox.ai/docs/api/openai/chat-completions): reasoning and tools are per-request fields with no per-turn change mechanism (effort_updates = false, tools.updates = false).
# system_updates unset: Ofox relays to the upstream cloud and doesn't document where a later system message goes.
# Cache: automatic prefix caching (https://ofox.ai/docs/develop/models/qwen).
# structured_output: Ofox's Qwen page documents response_format json_schema (https://ofox.ai/docs/develop/models/qwen); Alibaba's own API agrees (providers/alibaba).
schema = 2
base_model = "alibaba/qwen-flash"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true, budget = {} }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.022
cache = { read = 0.0043, write = 0.027 }

[cost.text.output]
price = 0.22
