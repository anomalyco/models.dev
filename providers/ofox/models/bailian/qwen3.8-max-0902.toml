# Sources (accessed 2026-09-03):
# https://ofox.ai/models/bailian/qwen3.8-max-0902
# https://www.qwencloud.com/models/qwen3.8-max-0902
# https://www.alibabacloud.com/help/en/model-studio/qwen3-8-max
# https://docs.qwencloud.com/developer-guides/text-generation/thinking
# Toggle: enable_thinking true|false (hybrid; same Bailian/DashScope surface as ofox bailian/qwen3.8-max)
# Effort: reasoning_effort = low|medium|xhigh (default xhigh); high accepted as alias → xhigh
# Budget: thinking_budget (0..262144) cannot be combined with reasoning_effort
schema = 2
base_model = "alibaba/qwen3.8-max-0902"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "xhigh"], budget = { min = 0, max = 262_144 } }

[cost.text.input]
price = 2
cache = { read = 0.25, write = 2.5 }

[cost.text.output]
price = 6
