# https://ofox.ai/en/models/bailian/qwen3.5-flash
# https://help.aliyun.com/en/model-studio/qwen3-5-flash
# https://www.alibabacloud.com/help/en/model-studio/deep-thinking
# Toggle: enable_thinking true|false
# Budget: thinking_budget
# Mid-conversation (Ofox Chat Completions, https://ofox.ai/docs/api/openai/chat-completions): reasoning and tools are per-request fields with no per-turn change mechanism (effort_updates = false, tools.updates = false).
# system_updates unset: Ofox relays to the upstream cloud and doesn't document where a later system message goes.
# Cache: automatic prefix caching (https://ofox.ai/docs/develop/models/qwen).
schema = 2
base_model = "alibaba/qwen3.5-flash"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true, budget = {} }
structured_output = true
effort_updates = false
cache = { implicit = true }

[cost.text.input]
price = 0.1
cache = { read = 0.01, write = 0.125 }

[cost.text.output]
price = 0.4
