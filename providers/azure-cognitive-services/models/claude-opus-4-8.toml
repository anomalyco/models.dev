base_model = "anthropic/claude-opus-4-8"
temperature = true
knowledge = "2025-12-31"
# POST /anthropic/v1/messages uses adaptive thinking with output_config.effort
# low/medium/high/xhigh/max; Azure catalog availability alone is not a control.
# https://docs.anthropic.com/en/docs/build-with-claude/adaptive-thinking
#
# Possible values described at https://platform.claude.com/docs/en/build-with-claude/effort#effort-levels
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 5.00
output = 25.00
cache_read = 0.50
cache_write = 6.25

[[cost.tiers]]
tier = { size = 200_000 }
input = 10.00
output = 37.50
cache_read = 1.00
cache_write = 12.50

[limit]
# Model info described at https://platform.claude.com/docs/en/about-claude/models/overview#latest-models-comparison
context = 1_000_000

[provider]
npm = "@ai-sdk/anthropic"
api = "https://${AZURE_COGNITIVE_SERVICES_RESOURCE_NAME}.services.ai.azure.com/anthropic/v1"
