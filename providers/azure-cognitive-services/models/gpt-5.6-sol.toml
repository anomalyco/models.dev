# Fast mode is Azure priority processing (Global Standard): https://azure.microsoft.com/en-us/pricing/details/azure-openai/ and https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/priority-processing
base_model = "openai/gpt-5.6-sol"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 5
output = 30
cache_read = 0.5

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 10
output = 45
cache_read = 1

[experimental.modes.fast]
cost = { input = 8.00, output = 40.00, cache_read = 0.80, cache_write = 10.00 }
provider = { body = { service_tier = "priority" } }
