# Fast mode is Azure priority processing (Global Standard): https://azure.microsoft.com/en-us/pricing/details/azure-openai/ and https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/priority-processing
base_model = "openai/gpt-5.4"
# Azure OpenAI Chat uses top-level reasoning_effort; this model accepts
# none/low/medium/high/xhigh. No separate token-budget field is documented.
# https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh"] }]

[cost]
input = 2.5
output = 15
cache_read = 0.25

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 5
output = 22.5
cache_read = 0.5

[experimental.modes.fast]
cost = { input = 5.00, output = 30.00, cache_read = 0.50 }
provider = { body = { service_tier = "priority" } }
