# Legacy v1 provider id for Azure. It has no model files of its own: v1 serves
# providers/azure's models here with this provider's env vars, and the v2 output
# leaves it out. Add or change models in providers/azure.
name = "Azure Cognitive Services"
env = ["AZURE_COGNITIVE_SERVICES_RESOURCE_NAME", "AZURE_COGNITIVE_SERVICES_API_KEY"]
npm = "@ai-sdk/azure"
doc = "https://learn.microsoft.com/en-us/azure/ai-services/openai/concepts/models"

[v1_alias]
provider = "azure"
env = { AZURE_RESOURCE_NAME = "AZURE_COGNITIVE_SERVICES_RESOURCE_NAME" }
