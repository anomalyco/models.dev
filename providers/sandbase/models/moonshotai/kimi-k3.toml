# Source: https://www.sandbase.ai/docs/api-reference/models/get
# Effort: reasoning_effort = low|high|max
base_model = "moonshotai/kimi-k3"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 3
output = 15
cache_read = 0.3
