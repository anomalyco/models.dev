# Live chat-completions check 2026-11-14: thinking.type = disabled returned zero reasoning tokens.
# Source: https://www.sandbase.ai/model/moonshotai/kimi-k3/docs
# SandBase documents chat-completions reasoning_effort = low|high|max, default max.
# Prices: SandBase model detail API, checked 2026-11-14.
schema = 2
base_model = "moonshotai/kimi-k3"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"], default = { type = "effort", value = "max" } }

[cost.text.input]
price = 3
cache = { read = 0.3 }

[cost.text.output]
price = 15

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
