# Source: https://www.sandbase.ai/docs/api-reference/models/get
# Off is reasoning_effort=none; graded effort is low|medium|high.
base_model = "alibaba/qwen3.7-max"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high"]

[cost]
input = 1.25
output = 3.75
cache_read = 0.25
