# Live Chat Completions check 2026-11-14: thinking_budget = 16 returned 16 reasoning tokens, while 512 returned more.
# Live chat-completions check 2026-11-14: enable_thinking = true|false.
# Source: https://www.sandbase.ai/docs/api-reference/models/get
# Prices: SandBase model detail API, checked 2026-11-14.
schema = 2
base_model = "alibaba/qwen3.7-plus"

[capabilities]
reasoning = { supported = true, toggle = true, budget = {} }

[cost.text.input]
price = 0.4
cache = { read = 0.08 }

[cost.text.output]
price = 1.6

# Long-context threshold from SandBase model detail price_formula.
[[cost.text.input.overrides]]
when = { context = { gte = 256000 } }
price = 1.2

[[cost.text.output.overrides]]
when = { context = { gte = 256000 } }
price = 4.8

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
