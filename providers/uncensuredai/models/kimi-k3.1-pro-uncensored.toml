# Pricing (USD per 1M tokens): https://uncensuredai.com/api/pricing
# Hosted model: https://uncensuredai.com/en/models/kimi-k3.1-pro-uncensored
# Client capabilities: https://uncensuredai.com/model-capabilities.json
# The hosted model page lists Kimi K3.1 Pro as the base model.
# Gateway QA (2026-11-13): low, high, max and a named function call passed
# through an isolated instance of the UncensuredAI gateway binary.
# Chat Completions QA (2026-11-13): reasoning_content in the JSON message and streamed deltas.
# Moonshot documents max as the base model default.
# The text-only input override uses both modality keys as required by AuthoredModelV2.
schema = 2
base_model = "moonshotai/kimi-k3.1-pro"
name = "Kimi K3.1 Pro Uncensored"
description = "Kimi K3.1 Pro Uncensored served by UncensuredAI over Chat Completions."

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"], default = { type = "effort", value = "max" } }
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.42
cache = { read = 0.042 }

[cost.text.output]
price = 2.10
