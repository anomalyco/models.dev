# Pricing (USD per 1M tokens): https://uncensuredai.com/api/pricing
# Public Chat Completions QA (2026-11-13): https://uncensuredai.com/v1/chat/completions
# Hosted model: https://uncensuredai.com/en/models/kimi-k3.1-pro-uncensored
# Client capabilities: https://uncensuredai.com/model-capabilities.json
# The hosted model page lists Kimi K3.1 Pro as the base model.
# Reasoning efforts and max default follow the first-party Models.dev entry.
# Public text and SSE reasoning probes returned HTTP 503, so no host-specific
# reasoning controls or response-field hint are advertised beyond the base.
# The hosted model page and gateway capabilities entry publish a 1,048,576-token
# context and a 131,072-token output limit. Both match the base model.
# Public gateway QA: Chat Completions rejected inline PNG with HTTP 400
# (invalid_prepaid_media). The prepaid gateway media validator blocks file input
# for this model. Both modality keys are required by the schema.
schema = 2
base_model = "moonshotai/kimi-k3.1-pro"
name = "Kimi K3.1 Pro Uncensored"
description = "Kimi K3.1 Pro Uncensored served by UncensuredAI over Chat Completions."

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"], default = { type = "effort", value = "max" } }
cache = { implicit = true }

[cost.text.input]
price = 0.42
cache = { read = 0.042 }

[cost.text.output]
price = 2.10
