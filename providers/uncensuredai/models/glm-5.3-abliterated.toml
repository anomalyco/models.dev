# Pricing (USD per 1M tokens): https://uncensuredai.com/api/pricing
# Hosted model: https://uncensuredai.com/en/models/glm-5.3-abliterated
# Client capabilities: https://uncensuredai.com/model-capabilities.json
# Base lineage: https://routerhub.si/models/glm-5.3-abliterated
# Effort: reasoning_effort = low|high|max, matching the Zhipu lab baseline.
# Gateway QA (2026-11-13): low, high, max and a named function call passed
# through an isolated instance of the production gateway binary on the active route.
schema = 2
base_model = "zhipuai/glm-5.3"
name = "GLM 5.3 Abliterated"
description = "GLM 5.3 Abliterated served by UncensuredAI over Chat Completions."

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
cache = { implicit = true }

[limit]
context = 1_048_576

[cost.text.input]
price = 0.70
cache = { read = 0.28 }

[cost.text.output]
price = 1.95
