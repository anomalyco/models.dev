# Pricing (USD per 1M tokens): https://uncensuredai.com/api/pricing
# Public Chat Completions QA (2026-11-13): https://uncensuredai.com/v1/chat/completions
# Hosted model: https://uncensuredai.com/en/models/qwen3.8-max-uncensored
# Client capabilities: https://uncensuredai.com/model-capabilities.json
# The hosted model page and gateway capabilities entry publish a 1,000,000-token
# context matching the base and a 131,000-token output limit overriding the base.
# Graded reasoning efforts follow the first-party Models.dev entry.
# Public text and SSE reasoning probes returned HTTP 503, so no host-specific
# reasoning controls or response-field hint are advertised beyond the base.
# Public gateway QA: Chat Completions rejected inline PNG with HTTP 400
# (invalid_prepaid_media). The prepaid gateway media validator blocks file input
# for this model. Both modality keys are required by the schema.
schema = 2
base_model = "alibaba/qwen3.8-max"
name = "Qwen 3.8 Max Uncensored"
description = "Qwen 3.8 Max Uncensored served by UncensuredAI over Chat Completions."

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "xhigh"] }
cache = { implicit = true }

[limit]
output = 131_000

[cost.text.input]
price = 0.45
cache = { read = 0.055 }

[cost.text.output]
price = 1.25
