# China personal General and Hy plans share this endpoint and API key.
# The overview comparison table lists Hy3/Hy4 and the shared OpenAI base URL.
# The personal-plan deduction rules also explicitly confirm shared URL/key:
# https://cloud.tencent.com/document/product/1823/133811 (checked 2026-11-02)
# Model access depends on the subscribed plan; no live Hy entitlement test.
# https://cloud.tencent.com/document/product/1823/130060 (accessed 2026-10-26)
name = "Tencent Token Plan"
env = ["TENCENT_TOKEN_PLAN_API_KEY"]
npm = "@ai-sdk/openai-compatible"
opencodeai = "@opencode/ai/providers/openai-compatible"
doc = "https://cloud.tencent.com/document/product/1823/130060"
api = "https://tokenhub.tencentmaas.com/plan/v3"
