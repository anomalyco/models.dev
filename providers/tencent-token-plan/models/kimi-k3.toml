# Tencent China personal Token Plan (accessed 2026-10-26).
# Availability: https://cloud.tencent.com/document/product/1823/130060
# Specifications: https://cloud.tencent.com/document/product/1823/130051
# A paid subscription and plan points are required; zero token prices follow
# the catalog's subscription-plan convention, not free inference.
# API: https://cloud.tencent.com/document/product/1823/132232
# Effort: reasoning_effort = low|high|max; thinking cannot be disabled.
# max_completion_tokens allows 1048576; 131072 is the default, not the maximum.
schema = 2
base_model = "moonshotai/kimi-k3"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[limit]
output = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
