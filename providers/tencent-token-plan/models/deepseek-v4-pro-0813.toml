# Pricing: personal Token Plan non-promotional list rates, checked 2026-11-24.
# https://cloud.tencent.com/document/product/1823/133811
# Input/output/cache-read: 90/270/3 points per million tokens.
# 20 points = CNY 1; USD/MTok = points / 20 / 6.679299.
# FX: USD 1 = CNY 6.679299, 2026-11-24, https://open.er-api.com/v6/latest/USD
# Prepaid-credit equivalents, not extra pay-as-you-go fees; promotions excluded.
# Availability: https://cloud.tencent.com/document/product/1823/130060
# Specifications: https://cloud.tencent.com/document/product/1823/130051
# Implicit cache: https://cloud.tencent.com/document/product/1823/131410; no cache-write price is published.
# Peak pricing since 2026-10-30 22:30: 2x Mon-Fri 09:00-12:00 and 14:00-18:00 Asia/Shanghai
#   (UTC 01:00-04:00, 06:00-10:00), by request receipt time. v1 exposes only the off-peak base.
# API: https://cloud.tencent.com/document/product/1823/132248
# Documented upstream version: DeepSeek-V4-Pro-0813.
# Controls: thinking.type = enabled|disabled; reasoning_effort = low|high|max
schema = 2
base_model = "deepseek/deepseek-v4-pro-0813"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true
top_k = false
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.673723
cache = { read = 0.022457 }

[cost.text.output]
price = 2.02117

[[cost.multipliers]]
when = { utc_days = { in = ["mon", "tue", "wed", "thu", "fri"] }, any = [{ all = [{ utc_hours = { gte = "01:00" } }, { utc_hours = { lt = "04:00" } }] }, { all = [{ utc_hours = { gte = "06:00" } }, { utc_hours = { lt = "10:00" } }] }] }
factor = 2
