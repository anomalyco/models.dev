# Exact documented IDs: minimax-m3 and minimax-m-3-0.
# Both share a Model ID cell in General Token Plan > Available models:
# https://cloud.tencent.com/document/product/1823/130060 (checked 2026-11-02)
# Pricing: personal Token Plan non-promotional list rates, checked 2026-11-02.
# https://cloud.tencent.com/document/product/1823/133811
# Input/output/cache-read: 42/168/8.4 points per million tokens.
# 20 points = CNY 1; USD/MTok = points / 20 / 6.660856.
# FX: USD 1 = CNY 6.660856, 2026-11-02, https://open.er-api.com/v6/latest/USD
# Prepaid-credit equivalents, not extra pay-as-you-go fees; promotions excluded.
# Input above 512,000 tokens (cached + uncached) doubles all token rates.
# Specifications: https://cloud.tencent.com/document/product/1823/130051
# Implicit cache: https://cloud.tencent.com/document/product/1823/131410
# Cached-input deductions: pricing source above; no separate cache-write rate published.
# API: https://cloud.tencent.com/document/product/1823/132246
# Toggle: thinking.type = adaptive|disabled
schema = 2
base_model = "minimax/MiniMax-M3"

[capabilities]
reasoning = { supported = true, toggle = true }
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.31527479
cache = { read = 0.06305496 }

[[cost.text.input.overrides]]
when = { context = { gt = 512_000 } }
price = 0.63054959
cache = { read = 0.12610992 }

[cost.text.output]
price = 1.26109917

[[cost.text.output.overrides]]
when = { context = { gt = 512_000 } }
