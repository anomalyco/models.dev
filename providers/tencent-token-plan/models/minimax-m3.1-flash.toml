# 20 points = CNY 1; USD/MTok = points / 20 / 6.679299.
# FX: USD 1 = CNY 6.679299, 2026-11-24, https://open.er-api.com/v6/latest/USD
# Prepaid-credit equivalents, not extra pay-as-you-go fees; promotions excluded.
# Availability: General Token Plan > Available models, https://cloud.tencent.com/document/product/1823/130060 (updated 2026-11-25)
# Specifications: https://cloud.tencent.com/document/product/1823/130051 (1M context, 512K output; no structured output listed).
# Implicit cache: https://cloud.tencent.com/document/product/1823/131410; no cache-write rate published.
