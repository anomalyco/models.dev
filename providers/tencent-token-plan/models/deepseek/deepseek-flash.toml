# Pricing: personal Token Plan non-promotional list rates, checked 2026-11-02.
# https://cloud.tencent.com/document/product/1823/133811
# Input/output/cache-read: 20/80/0.4 points per million tokens.
# 20 points = CNY 1; USD/MTok = points / 20 / 6.660856.
# FX: USD 1 = CNY 6.660856, 2026-11-02, https://open.er-api.com/v6/latest/USD
# Prepaid-credit equivalents, not extra pay-as-you-go fees; promotions excluded.
# Off-peak base; 2x Mon-Fri 09:00-12:00 and 14:00-18:00 Asia/Shanghai.
# Source: introductory notice and deepseek/deepseek-flash pricing row above; request receipt time.
# Encode Tencent's explicit weekday windows, not native DeepSeek holiday rules.
# v1 exposes only the off-peak base; v2 multiplies input/output/cached input at peak.
# Availability: https://cloud.tencent.com/document/product/1823/130060
# Specifications: https://cloud.tencent.com/document/product/1823/130051
# Implicit cache: https://cloud.tencent.com/document/product/1823/131410
# Cached-input deductions: pricing source above; no separate cache-write rate published.
# API: https://cloud.tencent.com/document/product/1823/132248
# Direct-service IDs: deepseek/deepseek-flash and deepseek/deepseek-v4-pro.
# Use Tencent's recommended IDs; omit aliases to avoid duplicates, not as retired.
# Tencent manages the routed version; mapping is documented in Availability above.
# Current documented upstream version: DeepSeek-V4.1-Flash-1017 (checked 2026-11-02).
# All direct Flash aliases were upgraded to V4.1 Flash 1017 on 2026-10-17.
# https://cloud.tencent.com/announce/detail/2516
# Controls: thinking.type = enabled|disabled; reasoning_effort = low|high|max
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true
top_k = false
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.15013085
cache = { read = 0.00300262 }

[cost.text.output]
price = 0.60052342

[[cost.multipliers]]
when = { utc_days = { in = ["mon", "tue", "wed", "thu", "fri"] }, any = [{ all = [{ utc_hours = { gte = "01:00" } }, { utc_hours = { lt = "04:00" } }] }, { all = [{ utc_hours = { gte = "06:00" } }, { utc_hours = { lt = "10:00" } }] }] }
factor = 2
