# Tencent China personal Token Plan (accessed 2026-10-26).
# Availability: https://cloud.tencent.com/document/product/1823/130060
# Specifications: https://cloud.tencent.com/document/product/1823/130051
# A paid subscription and plan points are required; zero token prices follow
# the catalog's subscription-plan convention, not free inference.
# Cache: TokenHub prefix-cache guide and personal-plan cached-input deductions:
# https://cloud.tencent.com/document/product/1823/131410
# https://cloud.tencent.com/document/product/1823/133811 (checked 2026-11-02)
# Zero cache-read cost follows the subscription convention, not zero plan points.
# Cache-write price is omitted: the plan docs do not publish a separate write rate.
# API: https://cloud.tencent.com/document/product/1823/132232
# Thinking is always enabled; no graded effort control for K2.7 Code.
schema = 2
base_model = "moonshotai/kimi-k2.7-code"

[capabilities]
reasoning = { supported = true }
structured_output = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0
cache = { read = 0 }

[cost.text.output]
price = 0
