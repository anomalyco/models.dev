# Pricing: https://flatkey.ai/models (accessed 2026-10-21), USD per 1M tokens; "Cache" column = cache read.
# Reasoning controls mirror the first-party API on Flatkey's OpenAI-compatible Chat Completions relay.
# Flatkey forwards these provider request fields unchanged to the upstream API.
# Toggle: thinking.type = enabled|disabled (default enabled)
# Effort: reasoning_effort = high|max (default max)
schema = 2
base_model = "zhipuai/glm-5.2"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "max" }, toggle = true, effort = ["high", "max"] }

[cost.text.input]
price = 0.84
cache = { read = 0.156 }

[cost.text.output]
price = 2.64
