# Pricing: https://flatkey.ai/models (accessed 2026-10-21), USD per 1M tokens; "Cache" column = cache read.
# Reasoning controls mirror the first-party API on Flatkey's OpenAI-compatible Chat Completions relay.
# Flatkey forwards these provider request fields unchanged to the upstream API.
# Toggle: thinking.type = enabled|disabled (Anthropic format; adaptive by default)
# Effort: reasoning_effort = low|medium|high|xhigh|max
schema = 2
base_model = "anthropic/claude-sonnet-5"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 1.6
cache = { read = 0.16 }

[cost.text.output]
price = 8
