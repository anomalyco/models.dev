# Pricing: https://flatkey.ai/models (accessed 2026-10-21), USD per 1M tokens; "Cache" column = cache read.
# Reasoning controls mirror the first-party API; Flatkey relays OpenAI-compatible Chat Completions.
schema = 2
base_model = "google/gemini-4-argon"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "medium" }, effort = ["low", "medium", "high"] }

[cost.text.input]
price = 1.6
cache = { read = 0.08 }

[cost.text.output]
price = 8
