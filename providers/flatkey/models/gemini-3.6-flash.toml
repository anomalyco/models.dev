# Pricing: https://flatkey.ai/models (accessed 2026-10-21), USD per 1M tokens; "Cache" column = cache read.
# Reasoning controls mirror the first-party API; Flatkey relays OpenAI-compatible Chat Completions.
schema = 2
base_model = "google/gemini-3.6-flash"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "medium" }, effort = ["minimal", "low", "medium", "high"] }

[cost.text.input]
price = 0.6
cache = { read = 0.06 }

[cost.text.output]
price = 3
