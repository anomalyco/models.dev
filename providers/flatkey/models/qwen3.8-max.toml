# Pricing: https://flatkey.ai/models (accessed 2026-10-21), USD per 1M tokens; "Cache" column = cache read.
# Reasoning controls mirror the first-party API on Flatkey's OpenAI-compatible Chat Completions relay.
# Flatkey forwards these provider request fields unchanged to the upstream API.
# Toggle: enable_thinking true|false (hybrid)
# Effort: reasoning_effort = low|medium|xhigh (default xhigh)
# Budget: thinking_budget (integer reasoning tokens; cannot be combined with reasoning_effort)
schema = 2
base_model = "alibaba/qwen3.8-max"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "xhigh" }, toggle = true, effort = ["low", "medium", "xhigh"], budget = { min = 0, max = 262_144 } }

[cost.text.input]
price = 1.6
cache = { read = 0.2 }

[cost.text.output]
price = 4.8
