# Pricing: https://flatkey.ai/models (accessed 2026-10-21), USD per 1M tokens; "Cache" column = cache read.
# Reasoning controls mirror the first-party API on Flatkey's OpenAI-compatible Chat Completions relay.
# Flatkey forwards these provider request fields unchanged to the upstream API.
# Toggle: enable_thinking true|false
# Budget: thinking_budget (integer reasoning tokens)
# Context: flatkey.ai/models lists 256K for this model.
schema = 2
base_model = "alibaba/qwen3.6-plus"

[capabilities]
reasoning = { supported = true, default = { type = "toggle", value = true }, toggle = true, budget = {} }

[limit]
context = 256_000

[cost.text.input]
price = 0.4
cache = { read = 0.04 }

[cost.text.output]
price = 2.4
