# Pricing: https://flatkey.ai/models (accessed 2026-10-21), USD per 1M tokens; "Cache" column = cache read.
# Effort: reasoning_effort on /v1/chat/completions; levels match the same-surface peer providers/openrouter/models/openai/gpt-5.5.toml.
schema = 2
base_model = "openai/gpt-5.5"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }

[cost.text.input]
price = 3
cache = { read = 0.3 }

[cost.text.output]
price = 18
