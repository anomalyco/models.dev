# Pricing: https://flatkey.ai/models (accessed 2026-10-21), USD per 1M tokens; "Cache" column = cache read.
# Effort: reasoning_effort on /v1/chat/completions; levels match the same-surface peer providers/openrouter/models/openai/gpt-6.1-sol.toml.
schema = 2
base_model = "openai/gpt-6.1-sol"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 1.2
cache = { read = 0.06 }

[cost.text.output]
price = 6
