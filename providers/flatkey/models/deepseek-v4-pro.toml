# Pricing: https://flatkey.ai/models (accessed 2026-10-21), USD per 1M tokens; "Cache" column = cache read.
# Reasoning controls mirror the first-party API on Flatkey's OpenAI-compatible Chat Completions relay.
# Flatkey forwards these provider request fields unchanged to the upstream API.
# Toggle: thinking.type = enabled|disabled (default enabled)
# Effort: reasoning_effort = low|high|max (default high)
# flatkey.ai/models lists DeepSeek prices as "from" (off-peak base, matching DeepSeek's own off-peak/peak split); peak doubles.
schema = 2
base_model = "deepseek/deepseek-v4-pro"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "high" }, toggle = true, effort = ["low", "high", "max"] }

[cost.text.input]
price = 0.396
cache = { read = 0.0132 }

[cost.text.output]
price = 1.188

[[cost.multipliers]]
when = { utc_days = { in = ["mon", "tue", "wed", "thu", "fri"] }, not = { holiday = { equals = "CN" } }, any = [{ all = [{ utc_hours = { gte = "01:00" } }, { utc_hours = { lt = "04:00" } }] }, { all = [{ utc_hours = { gte = "06:00" } }, { utc_hours = { lt = "10:00" } }] }] }
factor = 2
