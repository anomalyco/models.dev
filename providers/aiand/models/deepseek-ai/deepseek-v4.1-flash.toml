# Pricing: GET https://api.aiand.com/v1/api.json (synced hourly by the aiand module)
# Docs: https://docs.aiand.com/models/catalog/
# Effort: reasoning_effort = "none" | "high" | "max"
# Controls: reasoning_effort only (`reasoning_effort` on /v1/chat/completions, `reasoning.effort` on /v1/responses; "none" = off) — no separate toggle or token-budget field on this host.
# Reasoning side channel: message.reasoning_content
# Mid-conversation: ai& serves this model on POST /v1/chat/completions; reasoning and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://docs.aiand.com/api/chat-completions/
# Input MIME types: vision image/png|jpeg|webp|gif, video video/mp4|webm|quicktime, document application/pdf (https://docs.aiand.com/api/file-purposes/).
# Cache: repeated prompt prefixes are cached automatically, no cache_control markers (https://docs.aiand.com/models/pricing/#prompt-caching).
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "high", "max"] }
cache = { supported = true, implicit = true }
structured_output = true
effort_updates = false

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.3
cache = { read = 0.02 }

[cost.text.output]
price = 0.6
