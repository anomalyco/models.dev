# Effort: reasoning_effort = none|high
# Pricing: GET https://api.aiand.com/v1/api.json (accessed 2026-09-14); synced hourly by the aiand module.
# Docs: https://docs.aiand.com/models/catalog/
# Live probe 2026-09-14: none|high → 200; minimal|low|medium|xhigh|max → 400.
# Modalities: image, video, and PDF accepted on this host (2026-07-24 probes).
# Reasoning side channel: message.reasoning_content
schema = 2
base_model = "google/gemma-4-31b-it"

[modalities]
input = ["text", "image", "video", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.2
cache = { read = 0.05 }

[cost.text.output]
price = 0.5
