# Sources (accessed 2026-10-20):
# - https://tokenfactory.nebius.com/api/public/models_info (pricing, max_model_len = 1_048_576, type text2text)
# - https://tokenfactory.nebius.com/model-catalog.md (cached input is priced only through the optional
#   input_cached_price_per_million_tokens field, which this model doesn't have)
# Modalities: text-only, following the catalog type text2text (its use_cases also list image and video;
#   not probed, no key).
# Reasoning: no host control verified, so reasoning_options stays empty.
# Cost: $0.30 in / $1.20 out. No discounted prompt-cache tier is published, so cache_read = input (same
#   rationale as Kimi-K3 / GLM-5.3 on this host).
# Served window: max_model_len = 1_048_576 with no separate output cap, so output takes the full window.
# Responses: POST https://api.tokenfactory.nebius.com/v1/responses (https://docs.tokenfactory.nebius.com/api-reference/inference/create-a-response); the public catalog
#   https://tokenfactory.nebius.com/api/public/models_info lists "responses_api" in this model's use_cases (accessed 2026-10-22).
# Cache read (2026-10-22): https://tokenfactory.nebius.com/api/public/models_info now lists input_cached_price_per_million_tokens = 0.06
#   for this model, which replaces the earlier cache_read = input rule described above.
schema = 2
base_model = "minimax/MiniMax-M3"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true }

[limit]
output = 1_048_576

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.3
cache = { read = 0.06 }

[cost.text.output]
price = 1.2
