# Sources:
# - https://tokenfactory.nebius.com/ (model catalog)
# - https://tokenfactory.nebius.com/api/public/models_info (pricing, context, max length)
# - https://tokenfactory.nebius.com/model-catalog.md
# Accessed 2026-07-27; catalog rechecked 2026-10-20.
# 2026-10-20: models_info now reports type image2text with an image use case (no video) and
# max_model_len = 1_024_000, so input is text + the lab entry's image MIME types and context is 1_024_000.
# Image input not re-probed (no key).
# reasoning_effort verified live against api.tokenfactory.nebius.com/v1/chat/completions.
# The gateway's generic schema accepts none/minimal/low/medium/high/xhigh/max (422 on other
# input), but the model backend itself (sglang) rejects "minimal" and "xhigh" with a 400:
# "Input should be 'none', 'low', 'medium', 'high' or 'max'". Only those 5 actually work.
# Nebius does not offer a discounted prompt-cache tier for Kimi-K3: the models_info API has
# no cache fields, the docs have no cache pricing for this model, and the public endpoint
# page (tokenfactory.nebius.com) lists only "$3.00 / 1M In" and "$15.00 / 1M Out" with no
# cache-hit rate. cache_read is set equal to input to reflect that cached and fresh input
# tokens are billed identically, instead of leaving it unset (which downstream consumers
# such as opencode were treating as $0/M, undercounting cost by ~18x on cache-heavy sessions).
# Responses: POST https://api.tokenfactory.nebius.com/v1/responses (https://docs.tokenfactory.nebius.com/api-reference/inference/create-a-response); the public catalog
#   https://tokenfactory.nebius.com/api/public/models_info lists "responses_api" in this model's use_cases (accessed 2026-10-22).
# Cache read (2026-10-22): https://tokenfactory.nebius.com/api/public/models_info now lists input_cached_price_per_million_tokens = 0.3
#   for this model, which replaces the earlier cache_read = input rule described above.
schema = 2
base_model = "moonshotai/kimi-k3"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"] }
structured_output = true

[limit]
context = 1_024_000
output = 8_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 3
cache = { read = 0.3 }

[cost.text.output]
price = 15
