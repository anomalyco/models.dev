# Sources:
# - https://tokenfactory.nebius.com/ (model catalog)
# - https://tokenfactory.nebius.com/api/public/models_info (pricing, context, max length)
# - https://docs.bigmodel.cn/cn/guide/models/text/glm-5.3 (effort set; thinking cannot
#   be disabled, so there is no toggle — effort per lab: low|high|max, default max)
# Accessed 2026-09-18.
# Served window: models_info max_model_len = 1_024_000 with no separate output cap, so
# context and output both take the full served window.
# No discounted prompt-cache tier is published in the public catalog: cached and fresh
# input are billed identically, so cache_read = input (same rationale as
# GLM-5.3-Flash / DeepSeek-V4-Flash-0731 / Kimi-K3).
# Rechecked 2026-10-20 against models_info: price, max_model_len and model type unchanged; no
# input_cached_price_per_million_tokens listed.
# Responses: POST https://api.tokenfactory.nebius.com/v1/responses (https://docs.tokenfactory.nebius.com/api-reference/inference/create-a-response); the public catalog
#   https://tokenfactory.nebius.com/api/public/models_info lists "responses_api" in this model's use_cases (accessed 2026-10-22).
# Cache read (2026-10-22): https://tokenfactory.nebius.com/api/public/models_info now lists input_cached_price_per_million_tokens = 0.26
#   for this model, which replaces the earlier cache_read = input rule described above.
schema = 2
base_model = "zhipuai/glm-5.3"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
context = 1_024_000
output = 1_024_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 1.4
cache = { read = 0.26 }

[cost.text.output]
price = 4.4
