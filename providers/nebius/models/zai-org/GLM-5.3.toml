# Sources:
# - https://tokenfactory.nebius.com/ (model catalog)
# - https://tokenfactory.nebius.com/api/public/models_info (pricing, context, max length)
# - https://docs.bigmodel.cn/cn/guide/models/text/glm-5.3 (effort set; thinking cannot
#   be disabled, so there is no toggle — effort per lab: low|high|max, default max)
# Accessed 2026-09-18.
# Served window: models_info max_model_len = 1_024_000 with no separate output cap, so
# context and output both take the full served window.
# No discounted prompt-cache tier is published in the public catalog: cached and fresh
# input are billed identically, so cache_read = input (same rationale as
# GLM-5.3-Flash / DeepSeek-V4-Flash-0731 / Kimi-K3).
schema = 2
base_model = "zhipuai/glm-5.3"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
context = 1_024_000
output = 1_024_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.4
cache = { read = 1.4 }

[cost.text.output]
price = 4.4
