# Sources:
# - https://tokenfactory.nebius.com/ (model catalog)
# - https://tokenfactory.nebius.com/model-catalog.md (pricing)
# - https://tokenfactory.nebius.com/api/public/models_info (context, max length)
# - https://docs.bigmodel.cn/cn/guide/models/vlm/glm-5.3-flash (effort set; thinking
#   cannot be disabled, so there is no toggle — effort per lab: low|high|max, default max)
# Accessed 2026-08-29.
# Modalities: models_info now (rechecked 2026-10-20) reports type image2text with an image use case and
# no video or document use case, so input is text + the lab entry's image MIME types (no video, no PDF).
# It was text2text when this entry was added. Image input not re-probed (no key).
# No discounted prompt-cache tier in the public catalog (no cache rate listed for this
# model): cached and fresh input are billed identically, so cache_read = input
# (same rationale as Kimi-K3 / DeepSeek-V4-Flash-0731).
# Responses: POST https://api.tokenfactory.nebius.com/v1/responses (https://docs.tokenfactory.nebius.com/api-reference/inference/create-a-response); the public catalog
#   https://tokenfactory.nebius.com/api/public/models_info lists "responses_api" in this model's use_cases (accessed 2026-10-22).
# Cache read (2026-10-22): https://tokenfactory.nebius.com/api/public/models_info now lists input_cached_price_per_million_tokens = 0.03
#   for this model, which replaces the earlier cache_read = input rule described above.
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
context = 1_024_000
output = 1_024_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.15
cache = { read = 0.03 }

[cost.text.output]
price = 0.5
