# Sources (accessed 2026-10-20):
# - https://tokenfactory.nebius.com/api/public/models_info (pricing, max_model_len = 131_072,
#   use_cases include function_calling and reasoning)
# - https://tokenfactory.nebius.com/model-catalog.md (cached input is priced only through the optional
#   input_cached_price_per_million_tokens field, which this model doesn't have)
# Cost: $1 in / $3 out. No discounted prompt-cache tier is published, so cache_read = input (same rationale
#   as Kimi-K3 / GLM-5.3 on this host). The earlier 0.10 read / 1.25 write had no source and is gone.
# Reasoning: Hermes 4 is hybrid (thinking enabled by system prompt or chat template). No host-specific
#   control has been verified on Token Factory, so reasoning_options stays empty. Reasoning text is returned
#   on message.reasoning_content.
# Limits: input 120_000 / output 8_192 are carried over from the original entry; models_info publishes
#   only max_model_len.
# Responses: POST https://api.tokenfactory.nebius.com/v1/responses (https://docs.tokenfactory.nebius.com/api-reference/inference/create-a-response); the public catalog
#   https://tokenfactory.nebius.com/api/public/models_info lists "responses_api" in this model's use_cases (accessed 2026-10-22).
schema = 2
base_model = "nousresearch/hermes-4-405b"
name = "Hermes-4-405B"

[capabilities]
reasoning = { supported = true }
structured_output = true

[limit]
input = 120_000
output = 8_192

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 1
cache = { read = 1 }

[cost.text.output]
price = 3
reasoning = 3
