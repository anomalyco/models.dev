# Sources:
# - https://tokenfactory.nebius.com/?modals=endpoint-details&model-id=nvidia/Nemotron-3.5-Super-VL
# - https://tokenfactory.nebius.com/api/public/models_info (pricing, context, max length)
# Accessed 2026-10-15.
# Serverless BF16 deployment (us-north1), catalog model type image2text. Probed live against
# api.tokenfactory.nebius.com/v1/chat/completions on 2026-10-15: image_url and video_url
# input both work, so attachment/modalities are inherited from the lab entry. Tool calling
# and strict json_schema response_format both work.
# Effort: reasoning_effort = none|high (none = thinking off), same shape as
# Nemotron-3_5-Lightning on this host. Thinking is ON by default; none returns no
# reasoning_content (6 completion tokens). Every other value (minimal/low/medium/high/
# xhigh/max) is accepted but runs flat with the omitted default (~1.2k-1.9k completion
# tokens, three runs per level), so no graded levels are exposed.
# chat_template_kwargs.enable_thinking = true|false behaves identically.
# Reasoning text is returned on message.reasoning_content.
# Served window: models_info max_model_len = 1_048_576 with no separate output cap
# (max_tokens = 1_048_000 accepted live), so output takes the full served window.
# No discounted prompt-cache tier is published in the public catalog: cached and fresh
# input are billed identically, so cache_read = input (same rationale as
# Nemotron-3_5-Lightning / GLM-5.3 / Kimi-K3).
base_model = "nvidia/nemotron-3.5-super-vl-120b-a12b"
description = "NVIDIA vision-language reasoning model for coding, visual understanding, and agentic tool use"
structured_output = true

[[reasoning_options]]
type = "effort"
values = ["none", "high"]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.3
output = 0.9
cache_read = 0.3

[limit]
output = 1_048_576
