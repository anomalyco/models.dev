# Sources:
# - https://tokenfactory.nebius.com/ (model catalog)
# - https://tokenfactory.nebius.com/model-catalog.md (pricing)
# - https://tokenfactory.nebius.com/api/public/models_info (context, max length)
# Accessed 2026-08-29.
# Effort: reasoning_effort = none|high (none = thinking off). Probed live against
# api.tokenfactory.nebius.com chat completions on 2026-08-29: thinking is ON by default,
# reasoning_effort=none returns zero reasoning tokens, and high enables thinking. Other
# accepted non-none levels did not show a distinct graded effect at probe scale, so they
# are not exposed.
# Served window: models_info max_model_len = 1_048_576 with no separate output cap, so
# context and output both take the full served window.
# Rechecked 2026-10-20 against models_info: price, max_model_len and model type unchanged; no
# input_cached_price_per_million_tokens listed.
# Responses: POST https://api.tokenfactory.nebius.com/v1/responses (https://docs.tokenfactory.nebius.com/api-reference/inference/create-a-response); the public catalog
#   https://tokenfactory.nebius.com/api/public/models_info lists "responses_api" in this model's use_cases (accessed 2026-10-22).
schema = 2
base_model = "nvidia/nemotron-3.5-lightning"

[capabilities]
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = true

[limit]
context = 1_048_576
output = 1_048_576

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.06
cache = { read = 0.06 }

[cost.text.output]
price = 0.24
