# Sources:
# - https://tokenfactory.nebius.com/ (model catalog)
# - https://tokenfactory.nebius.com/api/public/models_info (pricing, context, max length)
# Accessed 2026-08-29.
# Same gateway effort behavior as DeepSeek-V4-Flash on this host: reasoning_effort
# accepts none/minimal/low/medium/high/xhigh/max, but minimal=low=medium and
# high=xhigh collapse, leaving none/low/high/max as the distinct levels.
# No discounted prompt-cache tier on Nebius: cached input is billed at the full
# input rate, so cache_read equals input (same rationale as Kimi-K3 / V4-Flash).
# Context/output use this model's exact models_info max_model_len (1_024_000), which
# intentionally differs from other "1M" IDs on this host (DeepSeek-V4-Pro, GLM-5.2,
# Nemotron entries serve max_model_len = 1_048_576).
# Rechecked 2026-10-20 against models_info: price, max_model_len and model type unchanged; no
# input_cached_price_per_million_tokens listed.
# Responses: POST https://api.tokenfactory.nebius.com/v1/responses (https://docs.tokenfactory.nebius.com/api-reference/inference/create-a-response); the public catalog
#   https://tokenfactory.nebius.com/api/public/models_info lists "responses_api" in this model's use_cases (accessed 2026-10-22).
# Cache read (2026-10-22): https://tokenfactory.nebius.com/api/public/models_info now lists input_cached_price_per_million_tokens = 0.01
#   for this model, which replaces the earlier cache_read = input rule described above.
schema = 2
base_model = "deepseek/deepseek-v4-flash-0731"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true

[limit]
context = 1_024_000
output = 1_024_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.14
cache = { read = 0.01 }

[cost.text.output]
price = 0.28
