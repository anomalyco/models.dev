# Sources:
# - https://tokenfactory.nebius.com/ (model catalog)
# - https://tokenfactory.nebius.com/api/public/models_info (pricing, context, max length)
# Accessed 2026-09-18.
# Effort: reasoning_effort = none|low|high|max (none = thinking off). Same gateway
# behavior as the other DeepSeek V4 entries on this host (DeepSeek-V4-Flash-0731,
# DeepSeek-V4-Pro): the generic schema accepts none/minimal/low/medium/high/xhigh/max,
# but the mid tiers collapse (minimal=low=medium, high=xhigh) and none disables
# thinking, leaving none/low/high/max as the distinct levels.
# Server reports model type image2text, so attachment/modalities are inherited from the
# lab entry.
# Served window: models_info max_model_len = 1_048_000 for this model with no separate
# output cap, so context and output both take the full served window.
# No discounted prompt-cache tier is published in the public catalog: cached and fresh
# input are billed identically, so cache_read = input (same rationale as
# DeepSeek-V4-Flash-0731 / Kimi-K3 / GLM-5.3-Flash).
# Rechecked 2026-10-20 against models_info: price, max_model_len and model type unchanged; no
# input_cached_price_per_million_tokens listed.
# Responses: POST https://api.tokenfactory.nebius.com/v1/responses (https://docs.tokenfactory.nebius.com/api-reference/inference/create-a-response); the public catalog
#   https://tokenfactory.nebius.com/api/public/models_info lists "responses_api" in this model's use_cases (accessed 2026-10-22).
# Cache read (2026-10-22): https://tokenfactory.nebius.com/api/public/models_info now lists input_cached_price_per_million_tokens = 0.01
#   for this model, which replaces the earlier cache_read = input rule described above.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true

[limit]
context = 1_048_000
output = 1_048_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.3
cache = { read = 0.01 }

[cost.text.output]
price = 1.2
