# Sources:
# - https://tokenfactory.nebius.com/ (model catalog)
# - https://tokenfactory.nebius.com/api/public/models_info (pricing, context, max length)
# Accessed 2026-08-29.
# Effort: reasoning_effort = none|low|high|max (none = thinking off). Probed live against
# api.tokenfactory.nebius.com chat completions on 2026-08-29: every schema effort value is
# accepted, none disables thinking (default baseline is non-thinking), the mid tiers run
# flat (same-family collapse note on DeepSeek-V4-Flash-0731: minimal=low=medium,
# high=xhigh), and max is distinctly heavier. The lab's thinking.type field is accepted
# but inert here (type=enabled does not turn thinking on), so reasoning_effort expresses off.
# Served window: models_info max_model_len = 1_048_576 for this model with no separate
# output cap, so context and output both take the full served window.
# Cache: models_info / model-catalog.md (rechecked 2026-10-20) publish no
# input_cached_price_per_million_tokens for this model, so cached input bills at the $1.75 input rate
# (cache_read = input, as on the other V4 entries). The earlier 0.15 had no source on this host.
# Responses: POST https://api.tokenfactory.nebius.com/v1/responses (https://docs.tokenfactory.nebius.com/api-reference/inference/create-a-response); the public catalog
#   https://tokenfactory.nebius.com/api/public/models_info lists "responses_api" in this model's use_cases (accessed 2026-10-22).
schema = 2
base_model = "deepseek/deepseek-v4-pro"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true

[limit]
context = 1_048_576
output = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 1.75
cache = { read = 1.75 }

[cost.text.output]
price = 3.5
