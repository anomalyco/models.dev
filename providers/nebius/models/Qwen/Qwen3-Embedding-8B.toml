# Sources (accessed 2026-10-20):
# - https://tokenfactory.nebius.com/api/public/models_info (type embedding, $0.01 per 1M input tokens,
#   output $0, max_model_len = 40_960)
# - https://docs.tokenfactory.nebius.com/api-reference/inference/create-embeddings (POST /v1/embeddings)
# knowledge = 2025-10 is unsourced: carried over from the original entry (Qwen publishes no cutoff).
# Limits: context/input = models_info max_model_len (40_960), above the lab's 32_768.
schema = 2
base_model = "alibaba/qwen3-embedding-8b"
name = "Qwen3-Embedding-8B"
description = "Embedding model for semantic search, retrieval, clustering, and ranking pipelines"
knowledge = "2025-10"

[capabilities]
structured_output = false

[limit]
context = 40_960
input = 40_960

[cost.text.input]
price = 0.01

[cost.text.output]
price = 0
