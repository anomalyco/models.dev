# Sources:
# - https://tokenfactory.nebius.com/?modals=endpoint-details&model-id=Qwen/Qwen3.8-27B
# - https://tokenfactory.nebius.com/api/public/models_info (pricing, context, max length)
# Accessed 2026-09-28.
# Serverless NVFP4 deployment (us-central1). On 2026-09-28 the catalog reported text2text and an
# image_url part was rejected live with 400 "This model does not support image input". Rechecked
# 2026-10-20: models_info now reports type image2text with an image use case (no video), so input is
# text + the lab entry's image MIME types and video stays off. Image input not re-probed (no key).
# Effort: reasoning_effort = none|low|medium|xhigh (none = thinking off; off is
# effort=none, so no separate toggle). Probed live against
# api.tokenfactory.nebius.com/v1/chat/completions on 2026-09-28 (temperature 0, fixed
# prompt, three runs per level): none returns no reasoning_content (6 completion tokens);
# low (~390-600) and medium (~730-840) are distinct; xhigh matches the omitted default.
# The backend rejects minimal and max with 400 "Supported types are xhigh (default),
# medium, and low"; high is accepted but behaves like xhigh, so it is not listed.
# chat_template_kwargs.enable_thinking = false also disables thinking (same as none).
# Reasoning text is returned on message.reasoning_content.
# Served window: models_info max_model_len = 262_144 with no separate output cap, so
# output takes the full served window (context matches the lab entry).
# No discounted prompt-cache tier is published in the public catalog: cached and fresh
# input are billed identically, so cache_read = input (same rationale as
# DeepSeek-V4-Flash-0731 / Kimi-K3 / GLM-5.3).
# Responses: POST https://api.tokenfactory.nebius.com/v1/responses (https://docs.tokenfactory.nebius.com/api-reference/inference/create-a-response); the public catalog
#   https://tokenfactory.nebius.com/api/public/models_info lists "responses_api" in this model's use_cases (accessed 2026-10-22).
# Cache read (2026-10-22): https://tokenfactory.nebius.com/api/public/models_info now lists input_cached_price_per_million_tokens = 0.1
#   for this model, which replaces the earlier cache_read = input rule described above.
schema = 2
base_model = "alibaba/qwen3.8-27b"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "xhigh"] }
structured_output = true

[limit]
output = 262_144

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.45
cache = { read = 0.1 }

[cost.text.output]
price = 3
