name = "Nebius Token Factory"
env = ["NEBIUS_API_KEY"]
npm = "@ai-sdk/openai-compatible"
# Raw HTTP routes include POST `/v1/chat/completions` and `/v1/responses`;
# Responses uses nested `reasoning.effort`, while Chat Completions accepts
