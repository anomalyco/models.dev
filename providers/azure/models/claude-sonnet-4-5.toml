# Modalities: Claude image formats https://platform.claude.com/docs/en/build-with-claude/vision#supported-formats; PDF support on Foundry https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/claude-models#model-capabilities
# Mid-conversation: Foundry lists "Mid-conversation role: system" (haiku-5-5, opus-5-5, opus-5, sonnet-5-5, sonnet-5) and "Per-turn effort controls" (opus-5-5, opus-5) as Beta:
# https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/claude-models#available-claude-models. Anthropic lists mid-conversation system messages, per-message effort and
# the tool-change beta (tool_addition/tool_removal) for the Claude API, Bedrock and Google Cloud only, not Foundry: https://platform.claude.com/docs/en/build-with-claude/mid-conversation-system-messages
# Web search: $10 per 1,000 searches; Foundry bills Claude in CCUs at Anthropic's standard per-feature rates: https://platform.claude.com/docs/en/about-claude/pricing#claude-in-microsoft-foundry-pricing
schema = 2
name = "Claude Sonnet 4.5"
description = "Balanced Claude model for coding, analysis, agent workflows, and cost control"
family = "claude-sonnet"
open_weights = false
knowledge = "2025-07-31"
release_date = "2025-11-18"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, budget = { min = 1_024 } }
structured_output = true
temperature = true
cache = { supported = true, implicit = false, explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 1_024 } }
system_updates = false
effort_updates = false

[limit]
context = 200_000
output = 64_000

[api.messages]
base_url = "https://${AZURE_RESOURCE_NAME}.services.ai.azure.com/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 3
cache = { read = 0.3, write = 3.75 }

[cost.text.output]
price = 15

[cost.web_search]
price = 10
