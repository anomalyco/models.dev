# Modalities: xAI image inputs are jpg/jpeg or png: https://docs.x.ai/docs/guides/image-understanding
# Mid-conversation: Foundry's partner-model chat API documents no mid-conversation system, per-turn effort or tool-change mechanism
# (https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/use-chat-reasoning). Live (2026-10-19) a mid-conversation system message was accepted by Kimi-K2.5 and Llama-3.3-70B-Instruct.
schema = 2
name = "Grok 4.1 Fast (Reasoning)"
description = "Fast Grok model for responsive chat, reasoning, and tool-assisted work"
family = "grok"
open_weights = false
release_date = "2025-06-27"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
temperature = true
system_updates = false
effort_updates = false

[limit]
context = 128_000
input = 128_000
output = 8_192

[cost.text.input]
price = 0.2
cache = { read = 0.05 }

[cost.text.output]
price = 0.5
