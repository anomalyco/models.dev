# Azure lists 400,000 context with a 272,000 input and 128,000 output limit:
# https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure#gpt-51
schema = 2
base_model = "openai/gpt-5.1-codex-max"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
store = true
cache = { supported = true, implicit = { ttl = ["24h"], min_tokens = 1_024 }, explicit = false }

[cost.text.input]
price = 1.25
cache = { read = 0.125 }

[cost.text.output]
price = 10

[[cost.multipliers]]
when = { region = { in = ["us", "eu"] } }
factor = 1.1
