schema = 2
name = "Claude Opus 4.1"
description = "Flagship Claude model for deep reasoning, coding, and long-horizon agents"
family = "claude-opus"
open_weights = false
knowledge = "2025-03-31"
release_date = "2025-11-18"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, budget = { min = 1_024 } }
structured_output = true
temperature = true

[limit]
context = 200_000
output = 32_000

[api.messages]
base_url = "https://${AZURE_RESOURCE_NAME}.services.ai.azure.com/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic" }

[cost.text.input]
price = 15
cache = { read = 1.5, write = 18.75 }

[cost.text.output]
price = 75
