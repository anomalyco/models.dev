# Source: https://ai.azure.com/catalog/models/grok-4.7
# Lifecycle: GA (retires 2027-10-05): https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/model-retirement-schedule#xai (accessed 2026-11-25)
# Pricing: Azure Retail Prices API, Azure Grok Models product, "4.7 * glbl" meters (2 input, 0.5 cached, 6 output; L meters 4/1/12): https://prices.azure.com/api/retail/prices?$filter=productName eq 'Azure Grok Models'
# Azure catalog lists context/output limits identical to the base model (500k/500k), so no override is needed.
# APIs: Chat Completions and Responses (POST https://<resource>.services.ai.azure.com/openai/v1/chat/completions and /openai/v1/responses), per the API Type column of "Models available in Foundry" in https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/use-foundry-models-grok (accessed 2026-11-25). Chat Completions stays first so v1 keeps its provider.
# Mid-conversation flags: left out. Azure's Grok guide documents no way to change tools or effort mid-conversation and no mid-conversation system messages on either API, so none of the three flags is marked.
# Long context: Azure lists a separate rate (meters ending in L); xAI documents it from 200K prompt tokens (https://docs.x.ai/developers/pricing).
# Data-zone and regional deployments cost 10% more than global (Azure Retail Prices API: the DZ meters are 1.1x the Glbl ones); the global price is the base.
schema = 2
base_model = "xai/grok-4.7"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true

[api.chat-completions]
sdk = { opencodeai = "@opencode/ai/providers/azure/chat" }

[api.responses]

[cost.text.input]
price = 2
cache = { read = 0.5 }

[[cost.text.input.overrides]]
when = { context = { gte = 200_000 } }
price = 4
cache = { read = 1 }

[cost.text.output]
price = 6

[[cost.text.output.overrides]]
when = { context = { gte = 200_000 } }
price = 12

[[cost.multipliers]]
when = { region = { in = ["us", "eu"] } }
factor = { text = 1.1 }
