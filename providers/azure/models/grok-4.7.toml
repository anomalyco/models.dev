# Source: https://ai.azure.com/catalog/models/grok-4.7
# Pricing not yet published on Azure's public pricing page.
# Azure catalog lists context/output limits identical to the base model (500k/500k), so no override is needed.
# API: Chat Completions only. Azure's Responses API lists OpenAI models only (https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/responses, Supported models).
# Mid-conversation flags: left out. This model is only on Azure's Chat Completions API, which has no documented way to change tools or effort mid-conversation and doesn't document mid-conversation system messages, so none of the three flags is marked.
# Long context: Azure lists a separate rate (meters ending in L); xAI documents it from 200K prompt tokens (https://docs.x.ai/developers/pricing).
# Data-zone and regional deployments cost 10% more than global (Azure Retail Prices API: the DZ meters are 1.1x the Glbl ones); the global price is the base.
schema = 2
base_model = "xai/grok-4.7"
status = "beta"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true

[api.chat-completions]
sdk = { opencodeai = "@opencode/ai/providers/azure/chat" }

[cost.text.input]
price = 2
cache = { read = 0.5 }

[[cost.text.input.overrides]]
when = { context = { gte = 200_000 } }
price = 4
cache = { read = 1 }

[cost.text.output]
price = 6

[[cost.text.output.overrides]]
when = { context = { gte = 200_000 } }
price = 12

[[cost.multipliers]]
when = { region = { in = ["us", "eu"] } }
factor = { text = 1.1 }
