schema = 2
base_model = "openai/o3-mini"
base_model_omit = ["structured_output"]
status = "deprecated"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
store = true
cache = { supported = true, implicit = { min_tokens = 1_024 }, explicit = false }

[cost.text.input]
price = 1.1
cache = { read = 0.55 }

[cost.text.output]
price = 4.4

[[cost.multipliers]]
when = { region = { in = ["us", "eu"] } }
factor = 1.1
