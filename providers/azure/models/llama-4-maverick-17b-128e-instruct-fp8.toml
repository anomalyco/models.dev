# Mid-conversation: Foundry's partner-model chat API documents no mid-conversation system, per-turn effort or tool-change mechanism
# (https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/use-chat-reasoning). Live (2026-10-19) a mid-conversation system message was accepted by Kimi-K2.5 and Llama-3.3-70B-Instruct.
# Modalities: Azure names no image formats for Llama 4; these are Meta's (see models/meta/llama-4-maverick-17b-instruct.toml).
schema = 2
name = "Llama 4 Maverick 17B 128E Instruct FP8"
description = "Open multimodal Llama model for strong reasoning and fast responses"
family = "llama"
open_weights = true
knowledge = "2024-08"
release_date = "2025-04-05"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = false }
temperature = true
system_updates = false
effort_updates = false

[limit]
context = 1_000_000
output = 16_384

[cost.text.input]
price = 0.25

[cost.text.output]
price = 1
