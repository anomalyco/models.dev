# Modalities: Azure names no image formats for Llama 4; these are Meta's (see models/meta/llama-4-maverick-17b-instruct.toml).
# API: Chat Completions only. Azure's Responses API lists OpenAI models only (https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/responses, Supported models).
# Mid-conversation flags: left out. This model is only on Azure's Chat Completions API, which has no documented way to change tools or effort mid-conversation and doesn't document mid-conversation system messages, so none of the three flags is marked.
schema = 2
name = "Llama 4 Maverick 17B 128E Instruct FP8"
description = "Open multimodal Llama model for strong reasoning and fast responses"
family = "llama"
open_weights = true
knowledge = "2024-08"
release_date = "2025-04-05"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true

[limit]
context = 1_000_000
output = 16_384

[api.chat-completions]
sdk = { opencodeai = "@opencode/ai/providers/azure/chat" }

[cost.text.input]
price = 0.25

[cost.text.output]
price = 1
