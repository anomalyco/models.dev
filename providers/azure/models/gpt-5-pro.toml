# Azure GPT-5 Pro: 400K context, 272K input, 128K output.
# https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure#gpt-5
# Modalities: Azure OpenAI Responses image inputs (PNG, JPEG, WebP, non-animated GIF) and PDF input for vision models: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/responses#image-input-requirements
schema = 2
base_model = "openai/gpt-5-pro"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["high"] }
structured_output = true
store = true
cache = { supported = false }

[limit]
output = 128_000

[cost.text.input]
price = 15

[cost.text.output]
price = 120

[[cost.multipliers]]
when = { region = { in = ["us", "eu"] } }
factor = 1.1
