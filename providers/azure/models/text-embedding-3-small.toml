# Azure lists an 8,192-token maximum request for text-embedding-3-small:
# https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure#embeddings
schema = 2
name = "text-embedding-3-small"
description = "Embedding model for semantic search, retrieval, clustering, and ranking pipelines"
family = "text-embedding"
open_weights = false
release_date = "2024-01-25"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }

[limit]
context = 8_192
output = 1_536

[api.embeddings]
sdk = { opencodeai = "none" }

[cost.text.input]
price = 0.02

[cost.text.output]
price = 0
