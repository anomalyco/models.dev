# OpenAI lists the 0125 snapshot with a 4,096-token maximum output:
# https://developers.openai.com/api/docs/models/gpt-3.5-turbo
schema = 2
name = "GPT-3.5 Turbo 0125"
description = "Compact GPT model for low-latency assistance and high-volume workloads"
family = "gpt"
open_weights = false
knowledge = "2021-08"
release_date = "2024-01-25"
status = "deprecated"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = true
cache = { supported = false }

[limit]
context = 16_384
output = 4_096

[cost.text.input]
price = 0.5

[cost.text.output]
price = 1.5
