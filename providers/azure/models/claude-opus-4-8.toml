# system_updates: left out. Microsoft documents mid-conversation system messages on Foundry only for Haiku 5.5, Opus 5.5, Opus 5, Sonnet 5.5 and Sonnet 5, and this model couldn't be tested here.
# Effort values described at https://platform.claude.com/docs/en/build-with-claude/effort#effort-levels
# Context window described at https://platform.claude.com/docs/en/about-claude/models/overview#latest-models-comparison
# Mid-conversation: Foundry lists "Mid-conversation role: system" (haiku-5-5, opus-5-5, opus-5, sonnet-5-5, sonnet-5) and "Per-turn effort controls" (opus-5-5, opus-5) as Beta:
# https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/claude-models#available-claude-models. Anthropic lists mid-conversation system messages and
# per-message effort for the Claude API, Bedrock and Google Cloud only, not Foundry: https://platform.claude.com/docs/en/build-with-claude/mid-conversation-system-messages
# tools.updates: tool_addition/tool_removal system blocks (anthropic-beta inline-tools-2026-09-15; by reference also mid-conversation-tool-changes-2026-07-01) work on Foundry's
# Messages endpoint even though Microsoft doesn't document them. Live 2026-10-23: both kept the full cache (same as the control) and the model saw the change.
# Web search: $10 per 1,000 searches; Foundry bills Claude in CCUs at Anthropic's standard per-feature rates: https://platform.claude.com/docs/en/about-claude/pricing#claude-in-microsoft-foundry-pricing
schema = 2
base_model = "anthropic/claude-opus-4-8"
knowledge = "2025-12-31"

[capabilities]
tools = { supported = true, updates = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
cache = { explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 1_024 } }
structured_output = true

[limit]
context = 1_000_000

[api.messages]
base_url = "https://${AZURE_RESOURCE_NAME}.services.ai.azure.com/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 5
cache = { read = 0.5, write = 6.25 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 10
cache = { read = 1, write = 12.5 }

[cost.text.output]
price = 25

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 37.5

[cost.web_search]
price = 10
