# Image prices (accessed 2026-11-12): Azure Retail Prices API, https://prices.azure.com/api/retail/prices?$filter=contains(meterName,'gpt-image-1') (global meters: image input 0.01/1K, cached 0.0025/1K, output 0.04/1K tokens).
schema = 2
base_model = "openai/gpt-image-1"

[api.images]
sdk = { opencodeai = "@opencode/ai/providers/azure/images" }

