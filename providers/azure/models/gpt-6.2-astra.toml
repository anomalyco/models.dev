# Availability, APIs, and limits: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure#gpt-62
# Reasoning and custom tools: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning#python-lark
# Azure documents Lark custom tools on both APIs. Other freeform formats are not verified for this model.
# Strict function tools are listed on Responses only: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/structured-outputs
# Cache controls: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/prompt-caching
# Standard pricing, cache write TTLs, and Data Zone rates: https://techcommunity.microsoft.com/blog/azure-ai-foundry-blog/gpt-6-2-astra-and-gpt-6-2-sol-now-generally-available-in-microsoft-foundry/4574122
# The 272K long-context cutoff follows the OpenAI model card and the existing Azure GPT-6 Astra entry:
# https://developers.openai.com/api/docs/models/gpt-6.2-astra
schema = 2
base_model = "openai/gpt-6.2-astra"

[capabilities]
tools = { supported = true, freeform = ["lark"] }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = { min_tokens = 1_024 }, explicit = { ttl = ["30m", "12h"], max_breakpoints = 4, min_tokens = 1_024 } }

[api.responses]
capabilities = { tools = { strict = true } }

[api.chat-completions]
sdk = { opencodeai = "@opencode/ai/providers/azure/chat" }

[cost.text.input]
price = 8
cache = { read = 0.4, write = { "30m" = 10, "12h" = 20 } }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 16
cache = { read = 0.8, write = { "30m" = 20, "12h" = 40 } }

[cost.text.output]
price = 40

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 60

[[cost.multipliers]]
when = { region = { equals = "us" } }
factor = { text = 1.1 }

[[cost.multipliers]]
when = { region = { in = ["eu", "apac"] } }
factor = { text = 1.2 }
