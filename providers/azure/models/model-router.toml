# Azure OpenAI resource endpoints serve model-router on Chat Completions; it is not in the Responses API model list.
# https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/responses#supported-models
# https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/model-router
schema = 2
name = "Model Router"
description = "Automatic model router for matching prompts to suitable backends and budgets"
family = "model-router"
open_weights = false
release_date = "2025-05-19"
last_updated = "2025-11-18"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }

[limit]
context = 200_000
output = 16_384

[api.chat-completions]
sdk = { aisdk = "@ai-sdk/azure" }

[cost.text.input]
price = 0.14

[cost.text.output]
price = 0
