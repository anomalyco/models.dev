# Direct endpoint: POST /models/chat/completions?api-version=2024-05-01-preview.
# Reasoning: off unless the request sets reasoning_effort; the model then returns its
# chain of thought in `reasoning_content` (live 2026-10-25 on a Foundry resource).
# The endpoint accepts none|minimal|low|medium|high|xhigh|max (from its own 400), but
# DeepSeek's meaningful levels are low, high, max, matching providers/deepseek and
# providers/opencode for this model. Microsoft documents `reasoning_content` for
# non-OpenAI reasoning models:
# https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/use-chat-reasoning (accessed 2026-10-25)
# Tools: supported. The model returns tool_calls (live 2026-10-25).
# Mid-conversation flags: left out. This model is only on Azure's Chat Completions API, which has no documented way to change tools or effort mid-conversation and doesn't document mid-conversation system messages, so none of the three flags is marked.
schema = 2
base_model = "deepseek/deepseek-v4-flash"
name = "DeepSeek-V4-Flash"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true

[api.chat-completions]
base_url = "https://${AZURE_RESOURCE_NAME}.services.ai.azure.com/models"
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible" }
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.19

[cost.text.output]
price = 0.51
