# Direct endpoint: POST /models/chat/completions?api-version=2024-05-01-preview.
# Its published request schema documents no toggle, effort, or reasoning budget.
# https://learn.microsoft.com/en-us/rest/api/microsoftfoundry/model-inference/get-chat-completions/get-chat-completions (accessed 2026-06-25)
# Mid-conversation flags: left out. This model is only on Azure's Chat Completions API, which has no documented way to change tools or effort mid-conversation and doesn't document mid-conversation system messages, so none of the three flags is marked.
schema = 2
base_model = "deepseek/deepseek-v4-flash"
name = "DeepSeek-V4-Flash"

[capabilities]
tools = { supported = false }
reasoning = { supported = true }
structured_output = true

[api.chat-completions]
base_url = "https://${AZURE_RESOURCE_NAME}.services.ai.azure.com/models"
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible" }

[cost.text.input]
price = 0.19

[cost.text.output]
price = 0.51
