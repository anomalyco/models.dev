# Azure catalog: https://ai.azure.com/catalog/models/claude-fable-5
schema = 2
base_model = "anthropic/claude-fable-5"
status = "beta"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
cache = { supported = true, implicit = false, explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 512 } }
structured_output = true

[api.messages]
base_url = "https://${AZURE_RESOURCE_NAME}.services.ai.azure.com/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic" }

[cost.text.input]
price = 10
cache = { read = 1, write = 12.5 }

[cost.text.output]
price = 50
