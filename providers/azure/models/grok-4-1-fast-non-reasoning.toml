# Modalities: xAI image inputs are jpg/jpeg or png: https://docs.x.ai/docs/guides/image-understanding
# APIs: Chat Completions and Responses (POST https://<resource>.services.ai.azure.com/openai/v1/chat/completions and /openai/v1/responses), per the API Type column of "Models available in Foundry" in https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/use-foundry-models-grok (accessed 2026-11-25). Chat Completions stays first so v1 keeps its provider.
# Mid-conversation flags: left out. Azure's Grok guide documents no way to change tools or effort mid-conversation and no mid-conversation system messages on either API, so none of the three flags is marked.
# Limits: input 128,000 and output 128,000 tokens per the SpaceXAI table in https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure?pivots=azure-direct-others (accessed 2026-11-25).
#   Azure lists output separately for each Grok row (grok-4.3: 8,192; grok-4.6: 128,000 max with a 200,000 window), so 128,000 is its documented cap here.
#   The lab's 30,000 comes from a gateway listing (models/xai/grok-4.1-fast.toml), not from xAI or Azure.
schema = 2
name = "Grok 4.1 Fast (Non-Reasoning)"
description = "Fast Grok model for responsive chat, reasoning, and tool-assisted work"
family = "grok"
open_weights = false
release_date = "2025-06-27"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true

[limit]
context = 128_000
input = 128_000
output = 128_000

[api.chat-completions]
sdk = { opencodeai = "@opencode/ai/providers/azure/chat" }

[api.responses]

[cost.text.input]
price = 0.2
cache = { read = 0.05 }

[cost.text.output]
price = 0.5
