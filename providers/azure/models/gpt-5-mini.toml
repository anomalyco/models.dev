# Cached input: Azure Retail Prices API, Global Standard, skuName "GPT 5 Mini cchd Inpt Glbl" (meterId d3fde0bf-d04f-57d4-a8c8-1d8b19d2ca21): 0.025 per 1M.
# https://prices.azure.com/api/retail/prices?$filter=serviceName eq 'Foundry Models' and skuName eq 'GPT 5 Mini cchd Inpt Glbl' (accessed 2026-10-19)
# Modalities: Azure OpenAI Responses image inputs (PNG, JPEG, WebP, non-animated GIF) and PDF input for vision models: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/responses#image-input-requirements
schema = 2
name = "GPT-5 Mini"
description = "Compact GPT model for low-latency assistance and high-volume workloads"
family = "gpt-mini"
open_weights = false
knowledge = "2024-05-30"
release_date = "2025-08-07"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
temperature = false
store = true
cache = { supported = true, implicit = { min_tokens = 1_024 }, explicit = false }

[limit]
context = 400_000
input = 272_000
output = 128_000

[cost.text.input]
price = 0.25
cache = { read = 0.025 }

[cost.text.output]
price = 2

[[cost.multipliers]]
when = { region = { in = ["us", "eu"] } }
factor = 1.1
