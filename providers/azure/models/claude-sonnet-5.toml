# Azure catalog and pricing: https://ai.azure.com/catalog/models/claude-sonnet-5
# Introductory pricing is in effect through August 31, 2026.
# Toggle: thinking.type = adaptive|disabled
# Effort: output_config.effort = low|medium|high|xhigh|max
# system_updates: Foundry lists "Mid-conversation role: system" (Beta) for this model; per-turn effort and tool_addition/tool_removal are not documented on Foundry, so effort_updates and tools.updates are unset.
# https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/claude-models#available-claude-models
schema = 2
base_model = "anthropic/claude-sonnet-5"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { supported = true, implicit = false, explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 1_024 } }
system_updates = true

[api.messages]
base_url = "https://${AZURE_RESOURCE_NAME}.services.ai.azure.com/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic" }

[cost.text.input]
price = 2
cache = { read = 0.2, write = 2.5 }

[cost.text.output]
price = 10
