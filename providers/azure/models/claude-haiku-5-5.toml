# Model ID and pricing: https://platform.claude.com/docs/en/models/haiku-5-5/overview
# Foundry availability: https://platform.claude.com/docs/en/build-with-claude/claude-in-microsoft-foundry
# Toggle: thinking.type = adaptive|disabled (disabled only at low, medium, or high effort)
# Effort: output_config.effort = low|medium|high|xhigh|max
# system_updates: Foundry lists "Mid-conversation role: system" (Beta) for this model; per-turn effort and tool_addition/tool_removal are not documented on Foundry, so effort_updates and tools.updates are unset.
# https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/claude-models#available-claude-models
schema = 2
base_model = "anthropic/claude-haiku-5-5"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { supported = true, implicit = false, explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 512 } }
system_updates = true

[api.messages]
base_url = "https://${AZURE_RESOURCE_NAME}.services.ai.azure.com/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic" }

[cost.text.input]
price = 0.1
cache = { read = 0.01, write = 0.125 }

[[cost.text.input.overrides]]
when = { context = { gt = 100_000 } }
price = 0.5
cache = { read = 0.05, write = 0.625 }

[cost.text.output]
price = 0.5

[[cost.text.output.overrides]]
when = { context = { gt = 100_000 } }
price = 2.5
