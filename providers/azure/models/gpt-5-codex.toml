# tools.choice: tool_choice none/auto/required/named (https://learn.microsoft.com/en-us/azure/foundry/openai/latest); tools.strict: Structured outputs in https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure and https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/structured-outputs#supported-models
# tools.grammar: GPT-5 series lark custom tools (Azure documents lark only): https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning#python-lark
# Cached input: Azure Retail Prices API, Global Standard, skuName "gpt-5-codex-ccchd-inp-glbl" (meterId 8e0495b5-3453-53eb-a27d-b76564e42a97): 0.000125 per 1K = 0.125 per 1M.
# https://prices.azure.com/api/retail/prices?$filter=serviceName eq 'Foundry Models' and skuName eq 'gpt-5-codex-ccchd-inp-glbl' (accessed 2026-10-19)
# Modalities: Azure OpenAI Responses image inputs (PNG, JPEG, WebP, non-animated GIF) and PDF input for vision models: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/responses#image-input-requirements
# Capabilities: gpt-5-codex: "Input: Text/Image - Output: Text only". https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure?pivots=azure-openai#gpt-5
# Mid-conversation (live, aiden-azury-group, 2026-10-19; probe in notes/azure-mid-conversation-probe.ts): Azure OpenAI Responses and Chat Completions accept
# system/developer messages in place; Responses accepts `additional_tools` items (https://developers.openai.com/api/docs/guides/tools-tool-search#add-tools-at-a-specific-point-in-the-input);
# `configuration_update` returns 400 "not supported with this model" except on GPT-6 (accepted on gpt-6-luna; https://developers.openai.com/api/docs/guides/reasoning).
schema = 2
name = "GPT-5-Codex"
description = "Coding-optimized GPT model for repository edits, reviews, and agentic software work"
family = "gpt-codex"
open_weights = false
knowledge = "2024-09-30"
release_date = "2025-09-15"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none", "required", "tool"], grammar = ["lark"], updates = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
temperature = false
store = true
cache = { implicit = { ttl = ["24h"], min_tokens = 1_024 } }
system_updates = true

[limit]
context = 400_000
input = 272_000
output = 128_000

[cost.text.input]
price = 1.25
cache = { read = 0.125 }

[cost.text.output]
price = 10

[[cost.multipliers]]
when = { region = { in = ["us", "eu"] } }
factor = 1.1
