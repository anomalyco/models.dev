schema = 2
name = "GPT-5.1 Codex Mini"
description = "Coding-optimized GPT model for repository edits, reviews, and agentic software work"
family = "gpt-codex"
open_weights = false
knowledge = "2024-09-30"
release_date = "2025-11-14"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
temperature = false
store = true
cache = { supported = true, implicit = { ttl = ["24h"], min_tokens = 1_024 }, explicit = false }

[limit]
context = 400_000
input = 272_000
output = 128_000

[cost.text.input]
price = 0.25
cache = { read = 0.025 }

[cost.text.output]
price = 2

[[cost.multipliers]]
when = { region = { in = ["us", "eu"] } }
factor = 1.1
