# Azure documents POST /models/chat/completions and reasoning output, but no
# toggle, effort, or budget request field for Kimi K2.5. Catalog modes are not
# request controls. https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/how-to/use-chat-reasoning
# Modalities: Kimi image formats https://platform.moonshot.ai/docs/guide/use-kimi-vision-model#supported-image-and-video-formats (Azure documents text and image input, no video)
# Mid-conversation: Foundry's partner-model chat API documents no mid-conversation system, per-turn effort or tool-change mechanism
# (https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/use-chat-reasoning). Live (2026-10-23, Chat Completions) a system message between turns
# keeps the cached prefix and is followed on DeepSeek-V4.1-Flash, Kimi-K2.7-Code and grok-4-1-fast-non-reasoning, and is followed on Llama-3.3/Llama-4-Maverick
# (no cache on Llama); each Kimi, Grok and Llama family follows its tested model (DeepSeek models were tested one by one).
schema = 2
base_model = "moonshotai/kimi-k2.5"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
structured_output = true
temperature = true
system_updates = true
effort_updates = false

[api.chat-completions]
base_url = "https://${AZURE_RESOURCE_NAME}.services.ai.azure.com/models"
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible" }
compatibility = { replay_reasoning = true }

[cost.text.input]
price = 0.6

[cost.text.output]
price = 3
