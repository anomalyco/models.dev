# Availability: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure#gpt-6
# Region matrix: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure-region-availability
# Provisional Global Standard rates: Azure's published GPT-6 Astra/Sol/Luna Global Standard
# rates match OpenAI's direct rates; GPT-6.1 Sol-specific Azure meters are not yet published.
# https://azure.microsoft.com/en-us/blog/gpt-6-astra-sol-and-luna-for-production-agents-in-microsoft-foundry/
# https://developers.openai.com/api/docs/models/gpt-6.1-sol
# Mid-conversation (live, aiden-azury-group, 2026-10-19; probe in notes/azure-mid-conversation-probe.ts): Azure OpenAI Responses and Chat Completions accept
# system/developer messages in place; Responses accepts `additional_tools` items (https://developers.openai.com/api/docs/guides/tools-tool-search#add-tools-at-a-specific-point-in-the-input);
# `configuration_update` returns 400 "not supported with this model" except on GPT-6 (accepted on gpt-6-luna; https://developers.openai.com/api/docs/guides/reasoning).
# Web search: billed as Grounding with Bing Search, $14 per 1,000 Bing search requests (https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/web-search#web-search-usage-and-billing): https://www.microsoft.com/en-us/bing/apis/grounding-pricing
# Token-only multipliers (object factor, so cost.web_search is unscaled): web search is billed separately as Grounding with Bing Search (https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/web-search#web-search-usage-and-billing).
schema = 2
base_model = "openai/gpt-6.1-sol"

[capabilities]
tools = { supported = true, updates = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
store = true
cache = { supported = true, implicit = { min_tokens = 1_024 }, explicit = { ttl = ["30m"], max_breakpoints = 4, min_tokens = 1_024 } }
prompt_cache_key = true
service_tier = ["flex"]
system_updates = true
effort_updates = true

[cost.text.input]
price = 2
cache = { read = 0.1, write = 2.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 4
cache = { read = 0.2, write = 5 }

[cost.text.output]
price = 10

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 15

[cost.web_search]
price = 14

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = { text = 0.5 }

[[cost.multipliers]]
when = { region = { in = ["us", "eu"] } }
factor = { text = 1.1 }
