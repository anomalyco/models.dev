# Pricing source: https://azure.microsoft.com/en-us/pricing/details/ai-foundry-models/kimi/ (accessed 2026-08-05)
schema = 2
base_model = "moonshotai/kimi-k2.7-code"

[modalities]
input = ["text", "image"]
