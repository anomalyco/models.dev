# Azure documents POST /models/chat/completions and reasoning output, but no
# toggle, effort, or budget request field for Kimi K2.6. Catalog modes are not
# request controls. https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/how-to/use-chat-reasoning
# Modalities: Kimi image formats https://platform.moonshot.ai/docs/guide/use-kimi-vision-model#supported-image-and-video-formats (Azure documents text and image input, no video)
# Mid-conversation flags: left out. This model is only on Azure's Chat Completions API, which has no documented way to change tools or effort mid-conversation and doesn't document mid-conversation system messages, so none of the three flags is marked.
# Lifecycle: Kimi-K2.6 is Preview on Foundry: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/model-retirement-schedule#moonshotai (accessed 2026-11-25)
# Data-zone deployments: input and cached input cost 1.1x global, output 1.25x (Azure Retail Prices API, Azure Kimi product: "K2.6 Thinking Inp DZ" 0.001045/1K vs glbl 0.00095, "K2.6 cached DZ" 0.000176 vs 0.00016, "K2.6 Thinking Outp DZ" 0.005 vs 0.004),
# accessed 2026-11-25: https://prices.azure.com/api/retail/prices?$filter=productName eq 'Azure Kimi'. The global price is the base.
schema = 2
base_model = "moonshotai/kimi-k2.6"
status = "beta"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
structured_output = true

[api.chat-completions]
base_url = "https://${AZURE_RESOURCE_NAME}.services.ai.azure.com/models"
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible" }
legacy_interleaved = true

[cost.text.input]
price = 0.95
cache = { read = 0.16 }

[cost.text.output]
price = 4

[[cost.multipliers]]
when = { region = { in = ["us", "eu"] } }
factor = { text = { input = 1.1, output = 1.25 } }
