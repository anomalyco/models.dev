# Azure documents POST /models/chat/completions and reasoning output, but no
# toggle, effort, or budget request field for Kimi K2.6. Catalog modes are not
# request controls. https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/how-to/use-chat-reasoning
schema = 2
base_model = "moonshotai/kimi-k2.6"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }

[api.chat-completions]
base_url = "https://${AZURE_RESOURCE_NAME}.services.ai.azure.com/models"
sdk = { aisdk = "@ai-sdk/openai-compatible" }
compatibility = { replay_reasoning = true }

[cost.text.input]
price = 0.95

[cost.text.output]
price = 4
