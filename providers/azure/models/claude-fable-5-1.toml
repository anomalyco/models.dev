# Effort: output_config.effort = low|medium|high|xhigh. Foundry's effort table lists max as "No" for claude-fable-5-1 ("xhigh produces the same result as max"):
# https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/claude-models#thinking-and-effort
schema = 2
base_model = "anthropic/claude-fable-5-1"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
cache = { supported = true, implicit = false, explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 512 } }

[api.messages]
base_url = "https://${AZURE_RESOURCE_NAME}.services.ai.azure.com/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic" }

[cost.text.input]
price = 10
cache = { read = 0.25, write = 12.5 }

[cost.text.output]
price = 50
