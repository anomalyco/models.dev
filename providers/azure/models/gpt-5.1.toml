# Fast mode is Azure priority processing (Global Standard): https://azure.microsoft.com/en-us/pricing/details/azure-openai/ and https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/priority-processing
name = "GPT-5.1"
description = "Speech generation model for controllable voice, narration, and audio delivery"
family = "gpt"
release_date = "2025-11-14"
last_updated = "2025-11-14"
attachment = true
reasoning = true
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high"] }]
temperature = false
knowledge = "2024-09-30"
tool_call = true
structured_output = true
open_weights = false

[cost]
input = 1.25
output = 10.00
cache_read = 0.125

[limit]
context = 400_000
input = 272_000
output = 128_000

[modalities]
input = ["text", "image", "audio"]
output = ["text", "image", "audio"]

[experimental.modes.fast]
cost = { input = 2.50, output = 20.00, cache_read = 0.25 }
provider = { body = { service_tier = "priority" } }
