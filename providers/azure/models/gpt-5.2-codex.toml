# Modalities: Azure OpenAI Responses image inputs (PNG, JPEG, WebP, non-animated GIF) and PDF input for vision models: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/responses#image-input-requirements
schema = 2
name = "GPT-5.2 Codex"
description = "Coding-optimized GPT model for repository edits, reviews, and agentic software work"
family = "gpt-codex"
open_weights = false
knowledge = "2025-08-31"
release_date = "2026-01-14"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
temperature = false
store = true
cache = { supported = true, implicit = { min_tokens = 1_024 }, explicit = false }

[limit]
context = 400_000
input = 272_000
output = 128_000

[cost.text.input]
price = 1.75
cache = { read = 0.175 }

[cost.text.output]
price = 14

[[cost.multipliers]]
when = { region = { in = ["us", "eu"] } }
factor = 1.1
