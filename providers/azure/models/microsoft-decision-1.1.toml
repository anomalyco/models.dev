# Availability: GA on Foundry, sold by Azure (Global Standard and Data Zone Standard):
#   https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/use-foundry-models-microsoft-decision (accessed 2026-11-25)
# API: System One request body ({model, state, questions}, images as base64 `assets` referenced as image:<name>) at
#   POST https://<resource>.services.ai.azure.com/providers/microsoft/v1/systemone, so the default media_input ("assets") applies.
#   The doc accepts an api-key header or a bearer token; Foundry also takes the resource key as a bearer token
#   (https://learn.microsoft.com/en-us/azure/foundry/how-to/fireworks/enable-fireworks-models, cURL example).
#   No package of its own, so the TypeSafe decisions entry point is used with the host's base_url (AGENTS.md).
# Context: 32,767 tokens (https://ai.azure.com/catalog/models/Microsoft-Decision-1.1, Quick facts, accessed 2026-11-25).
# Pricing: "Decision 1.1 Gl" meter 0.042 per 1M input tokens, no output meter (Microsoft Decision Models product):
#   https://prices.azure.com/api/retail/prices?$filter=productName eq 'Microsoft Decision Models' (accessed 2026-11-25). The data-zone meter is 0.046 (about 1.095x),
#   left out as a multiplier because it isn't a round factor.
schema = 2
v2_only = true
base_model = "microsoft/microsoft-decision-1.1"

[limit]
context = 32_767

[api.systemone]
base_url = "https://${AZURE_RESOURCE_NAME}.services.ai.azure.com/providers/microsoft/v1"
sdk = { aisdk = "@ai-sdk/typesafe-ai", opencodeai = "@opencode/ai/providers/typesafe-ai/decisions" }

[cost.text.input]
price = 0.042

[cost.text.output]
price = 0
