# Source: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/use-foundry-models-grok
# Pricing: https://azure.microsoft.com/en-us/pricing/details/ai-foundry-models/grok/
# API: Chat Completions only. Azure's Responses API lists OpenAI models only (https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/responses, Supported models).
# Mid-conversation flags: left out. This model is only on Azure's Chat Completions API, which has no documented way to change tools or effort mid-conversation and doesn't document mid-conversation system messages, so none of the three flags is marked.
schema = 2
base_model = "xai/grok-4.6"
status = "beta"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true

[limit]
context = 200_000
output = 128_000

[api.chat-completions]
sdk = { opencodeai = "@opencode/ai/providers/azure/chat" }

[cost.text.input]
price = 2
cache = { read = 0.5 }

[cost.text.output]
price = 6
