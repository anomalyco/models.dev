# Sources: https://docs.x.ai/developers/model-capabilities/text/reasoning and https://ai.azure.com/catalog/models/grok-4.6
base_model = "xai/grok-4.6"
status = "beta"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh"]

[cost]
input = 2
output = 6
cache_read = 0.5

[[cost.tiers]]
tier = { type = "context", size = 200_000 }
input = 4
output = 12
cache_read = 1

[limit]
context = 200_000
output = 128_000
