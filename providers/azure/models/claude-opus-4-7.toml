# Azure AI Foundry serves Claude Opus 4.7 at Anthropic list pricing:
# https://platform.claude.com/docs/en/about-claude/pricing
# Claude 4.6+ bills the full 1M context window at standard rates (no long-context
# premium), so no [[cost.tiers]] here — the tiers on azure's claude-opus-4-6/4-8
# entries predate that policy. Model availability:
# https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/claude-models?tabs=pay-go#available-claude-models
# Effort values described at https://platform.claude.com/docs/en/build-with-claude/effort#effort-levels
schema = 2
base_model = "anthropic/claude-opus-4-7"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
cache = { supported = true, implicit = false, explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 2_048 } }
structured_output = true

[api.messages]
base_url = "https://${AZURE_RESOURCE_NAME}.services.ai.azure.com/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic" }

[cost.text.input]
price = 5
cache = { read = 0.5, write = 6.25 }

[cost.text.output]
price = 25
