# Modalities: Claude image formats https://platform.claude.com/docs/en/build-with-claude/vision#supported-formats; PDF support on Foundry https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/claude-models#model-capabilities
schema = 2
name = "Claude Haiku 4.5"
description = "Fast Claude model for responsive assistance, classification, and lightweight agents"
family = "claude-haiku"
open_weights = false
knowledge = "2025-02-28"
release_date = "2025-11-18"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, budget = { min = 1_024 } }
structured_output = true
temperature = true
cache = { supported = true, implicit = false, explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 4_096 } }

[limit]
context = 200_000
output = 64_000

[api.messages]
base_url = "https://${AZURE_RESOURCE_NAME}.services.ai.azure.com/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic" }

[cost.text.input]
price = 1
cache = { read = 0.1, write = 1.25 }

[cost.text.output]
price = 5
