# Azure pricing page publishes GPT-6 pricing in the blog rather than the service pricing page; https://azure.microsoft.com/en-us/blog/gpt-6-astra-sol-and-luna-for-production-agents-in-microsoft-foundry/
# Global Standard rates (short / long context). Data Zone US/EU are +10%/+20% vs Global.
base_model = "openai/gpt-6-sol"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 2.00
output = 10.00
cache_read = 0.20
cache_write = 2.50

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 4.00
output = 15.00
cache_read = 0.40
cache_write = 5.00
