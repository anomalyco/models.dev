# Mid-conversation: Foundry's partner-model chat API documents no mid-conversation system, per-turn effort or tool-change mechanism
# (https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/use-chat-reasoning). Live (2026-10-19) a mid-conversation system message was accepted by Kimi-K2.5 and Llama-3.3-70B-Instruct.
schema = 2
name = "DeepSeek-V3.2"
description = "DeepSeek chat model for instruction following, coding, and analysis"
family = "deepseek"
open_weights = true
knowledge = "2024-07"
release_date = "2025-12-01"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
temperature = true
system_updates = false
effort_updates = false

[limit]
context = 128_000
output = 128_000

[cost.text.input]
price = 0.58

[cost.text.output]
price = 1.68
