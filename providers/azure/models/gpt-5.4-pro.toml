schema = 2
base_model = "openai/gpt-5.4-pro"

[capabilities]
reasoning = { supported = true, effort = ["medium", "high", "xhigh"] }
structured_output = false
store = true
cache = { supported = false }

[cost.text.input]
price = 30

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 60

[cost.text.output]
price = 180

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 270

[[cost.multipliers]]
when = { region = { in = ["us", "eu"] } }
factor = 1.1
