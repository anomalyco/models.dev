# Fast mode is Azure priority processing (Global Standard): https://azure.microsoft.com/en-us/pricing/details/azure-openai/ and https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/priority-processing
name = "GPT-5.2"
description = "GPT model for general reasoning, writing, coding, and tool-assisted tasks"
family = "gpt"
release_date = "2025-12-11"
last_updated = "2025-12-11"
attachment = true
reasoning = true
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh"] }]
temperature = false
knowledge = "2025-08-31"
tool_call = true
structured_output = true
open_weights = false

[cost]
input = 1.75
output = 14.00
cache_read = 0.125

[limit]
context = 400_000
input = 272_000
output = 128_000

[modalities]
input = ["text", "image"]
output = ["text"]

[experimental.modes.fast]
cost = { input = 3.50, output = 28.00, cache_read = 0.35 }
provider = { body = { service_tier = "priority" } }
