schema = 2
base_model = "openai/o3"
base_model_omit = ["structured_output"]

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
store = true
cache = { supported = true, implicit = { min_tokens = 1_024 }, explicit = false }

[cost.text.input]
price = 2
cache = { read = 0.5 }

[cost.text.output]
price = 8

[[cost.multipliers]]
when = { region = { in = ["us", "eu"] } }
factor = 1.1
