# Modalities: Azure OpenAI Responses image inputs (PNG, JPEG, WebP, non-animated GIF) and PDF input for vision models: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/responses#image-input-requirements
schema = 2
base_model = "openai/gpt-5.4-nano"
name = "GPT-5.4 Nano"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true
store = true
cache = { supported = true, implicit = { min_tokens = 1_024 }, explicit = false }

[cost.text.input]
price = 0.2
cache = { read = 0.02 }

[cost.text.output]
price = 1.25

[[cost.multipliers]]
when = { region = { in = ["us", "eu"] } }
factor = 1.1
