# Prices: https://www.modellix.ai/portal/v1/llm-model-pricing fetched 2026-11-19.
# Customer price is the price field, USD per 1M tokens = sub-penny / 10000.
# A higher Input Context tier applies when input + cached read + cached write is greater than threshold.
# Docs: https://docs.modellix.ai/llm/api/api
# Custom tools: text, Lark and regex verified on Modellix Chat Completions on 2026-11-26.
# Grammar probes used tool_choice = "required". The named custom tool choice returned HTTP 400.
# Chat Completions field: reasoning_effort (https://docs.modellix.ai/llm/api/api). Levels were not probed on Modellix.
# Catalog publishes the Modellix customer price. The public list price is higher on at least one component.
schema = 2
base_model = "openai/gpt-5.5"

[capabilities]
tools = { supported = true, freeform = ["text", "lark", "regex"] }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }

[cost.text.input]
price = 4.5
cache = { read = 0.45, write = 0 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 9
cache = { read = 3.6, write = 0 }

[cost.text.output]
price = 27

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 40.5
