# Pricing: https://www.modellix.ai/portal/v1/llm-model-pricing
# Freeform follows the OpenAI Chat Completions contract. Modellix probes covered GPT-5.6 Luna and GPT-6.2 Astra.
schema = 2
base_model = "openai/gpt-6-astra"

[capabilities]
tools = { supported = true, freeform = ["text", "lark", "regex"] }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 9
cache = { read = 0.9, write = 11.25 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 18
cache = { read = 1.8, write = 22.5 }

[cost.text.output]
price = 45

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 67.5
