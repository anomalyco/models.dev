# Prices: https://www.modellix.ai/portal/v1/llm-model-pricing fetched 2026-11-20.
# Customer price is the price field, USD per 1M tokens = sub-penny / 10000.
# A higher Input Context tier applies when input + cached read + cached write is greater than threshold.
# Docs: https://docs.modellix.ai/llm/api/api
# Latest alias ~google/gemini-pro-latest currently routes to google/gemini-3.1-pro.
# Price and controls follow that target on this fetch.
schema = 2
base_model = "google/gemini-3.1-pro-preview"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[limit]
context = 1_050_000

[cost.text.input]
price = 1.8
cache = { read = 0.18, write = 0 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 3.6
cache = { read = 0.36, write = 0 }

[cost.text.output]
price = 10.8

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 16.2
