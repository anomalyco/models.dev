# Prices: https://www.modellix.ai/portal/v1/llm-model-pricing fetched 2026-11-20.
# Customer price is the price field, USD per 1M tokens = sub-penny / 10000.
# A higher Input Context tier applies when input + cached read + cached write is greater than threshold.
# Docs: https://docs.modellix.ai/llm/api/api
# Latest alias ~qwen/qwen-latest currently routes to qwen/qwen4-max.
# Price and controls follow that target on this fetch.
schema = 2
base_model = "alibaba/qwen4-max"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "xhigh"] }

[cost.text.input]
price = 1.5
cache = { read = 0.075, write = 1.875 }

[cost.text.output]
price = 4.5
