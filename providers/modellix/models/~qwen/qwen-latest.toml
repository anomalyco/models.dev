# Pricing: https://www.modellix.ai/portal/v1/llm-model-pricing
# Latest alias of qwen/qwen4-max.
# Effort: reasoning_effort = none|low|high|xhigh; none disables thinking.
# Budget: thinking_budget = 1..262144 (mutually exclusive with reasoning_effort).
# https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions
schema = 2
base_model = "alibaba/qwen4-max"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "xhigh"], budget = { min = 1, max = 262_144 } }

[cost.text.input]
price = 1.5
cache = { read = 0.075, write = 1.875 }

[cost.text.output]
price = 4.5
