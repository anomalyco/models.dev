# Prices: https://www.modellix.ai/portal/v1/llm-model-pricing fetched 2026-11-19.
# Customer price is the price field, USD per 1M tokens = sub-penny / 10000.
# A higher Input Context tier applies when input + cached read + cached write is greater than threshold.
# Docs: https://docs.modellix.ai/llm/api/api
# Chat Completions reasoning_effort accepts low, high, and max.
# Upstream parameter reference: https://www-sg.tencentcloud.com/ind/document/product/1300/80635
# Latest alias ~moonshot/kimi-latest currently routes to moonshot/kimi-k3.1-pro. Price and limits follow that target.
# Host context 1000000 differs from the lab context 1048576. The public catalog value is used.
# Lab output 1048576 exceeds the published host window 1000000. Output is clamped to that window; Modellix does not publish an output cap.
schema = 2
base_model = "moonshotai/kimi-k3.1-pro"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }

[limit]
context = 1_000_000
output = 1_000_000

[cost.text.input]
price = 2
cache = { read = 0.2, write = 0 }

[cost.text.output]
price = 10
