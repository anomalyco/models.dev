# Pricing: https://www.modellix.ai/portal/v1/llm-model-pricing
# Effort: reasoning_effort = low|high|max
schema = 2
base_model = "moonshotai/kimi-k3"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[limit]
context = 1_050_000

[cost.text.input]
price = 3
cache = { read = 0.3, write = 0 }

[cost.text.output]
price = 15
