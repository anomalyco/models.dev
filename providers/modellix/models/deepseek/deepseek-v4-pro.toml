# Effort: reasoning_effort = none|low|high|max (default high).
# https://api-docs.deepseek.com/guides/thinking_mode/
# Context override: public catalog context_window_tokens=1_050_000.
schema = 2
base_model = "deepseek/deepseek-v4-pro"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"], default = { type = "effort", value = "high" } }

[limit]
context = 1_050_000

[cost.text.input]
price = 1.197
cache = { read = 0.0396, write = 0 }

[cost.text.output]
price = 3.564
