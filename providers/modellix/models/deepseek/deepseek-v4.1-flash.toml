# Prices: https://www.modellix.ai/portal/v1/llm-model-pricing fetched 2026-11-20.
# Customer price is the price field, USD per 1M tokens = sub-penny / 10000.
# A higher Input Context tier applies when input + cached read + cached write is greater than threshold.
# Docs: https://docs.modellix.ai/llm/api/api
# tencent-intl deployment uses deepseek-v4.1-flash-1017; tencent-intl-direct uses deepseek-v4.1-flash (docs/llm-data.md).
# base_model stays the undated lab id that matches the public request id.
# Both Modellix Tencent deployments omit reasoning_effort from their supported parameter lists.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[capabilities]
reasoning = { supported = true }

[cost.text.input]
price = 0.3
cache = { read = 0.006, write = 0 }

[cost.text.output]
price = 1.2
