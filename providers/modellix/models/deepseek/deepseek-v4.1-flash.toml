# Pricing: https://www.modellix.ai/portal/v1/llm-model-pricing
# Toggle: thinking.type = enabled|disabled. reasoning_effort = "none" also disables thinking.
# Effort: reasoning_effort = low|high|max (default high).
# https://api-docs.deepseek.com/guides/thinking_mode/
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"], default = { type = "effort", value = "high" } }

[cost.text.input]
price = 0.3
cache = { read = 0.006, write = 0 }

[cost.text.output]
price = 1.2
