# Prices: https://www.modellix.ai/portal/v1/llm-model-pricing fetched 2026-11-20.
# Customer price is the price field, USD per 1M tokens = sub-penny / 10000.
# A higher Input Context tier applies when input + cached read + cached write is greater than threshold.
# Docs: https://docs.modellix.ai/llm/api/api
# Upstream model id is qwen4-max, not the preview id (backend/deploy/litellm/README.md).
# Effort: reasoning_effort = none|low|high|xhigh; none disables thinking.
# Budget: thinking_budget = 1..262144 (mutually exclusive with reasoning_effort).
# Modellix's OpenAI-compatible DashScope route forwards both fields in Chat Completions.
# https://help.aliyun.com/zh/model-studio/qwen-api-via-openai-chat-completions
schema = 2
base_model = "alibaba/qwen4-max"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "xhigh"], budget = { min = 1, max = 262_144 } }

[cost.text.input]
price = 1.5
cache = { read = 0.075, write = 1.875 }

[cost.text.output]
price = 4.5
