# Prices: https://www.modellix.ai/portal/v1/llm-model-pricing fetched 2026-11-19.
# Customer price is the price field, USD per 1M tokens = sub-penny / 10000.
# A higher Input Context tier applies when input + cached read + cached write is greater than threshold.
# Docs: https://docs.modellix.ai/llm/api/api
# Toggle: thinking.type = enabled|disabled
# Modellix's Z.AI route forwards thinking to the native API.
# https://docs.bigmodel.cn/cn/guide/capabilities/thinking-mode
# Host context 203000 differs from the lab context 200000. The public catalog value is used.
schema = 2
base_model = "zhipuai/glm-4.7-flash"

[capabilities]
reasoning = { supported = true, toggle = true }

[limit]
context = 203_000

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
