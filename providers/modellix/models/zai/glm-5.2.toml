# Pricing: https://www.modellix.ai/portal/v1/llm-model-pricing
# Effort: reasoning_effort = none|high|max; none disables thinking.
# On Modellix Chat Completions (2026-11-27), thinking.type="disabled" still returned 109 reasoning tokens.
# The same prompt with reasoning_effort="none" returned zero reasoning tokens and no reasoning content.
# Context override: public catalog context_window_tokens=1_050_000.
schema = 2
base_model = "zhipuai/glm-5.2"

[capabilities]
reasoning = { supported = true, effort = ["none", "high", "max"] }

[limit]
context = 1_050_000

[cost.text.input]
price = 0.9
cache = { read = 0.234, write = 0 }

[cost.text.output]
price = 3.96
