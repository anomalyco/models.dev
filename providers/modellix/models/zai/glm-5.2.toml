# Pricing: https://www.modellix.ai/portal/v1/llm-model-pricing
# Effort: reasoning_effort = none|high|max; none disables thinking.
# Context: lab 1,000,000; https://www.tencentcloud.com/document/product/1300/80634
schema = 2
base_model = "zhipuai/glm-5.2"

[capabilities]
reasoning = { supported = true, effort = ["none", "high", "max"] }

[cost.text.input]
price = 0.9
cache = { read = 0.234, write = 0 }

[cost.text.output]
price = 3.96
