# Prices use the public catalog's "price" field. Divide by 10,000 for USD per million tokens.
# https://www.modellix.ai/portal/v1/llm-model-pricing
# Context uses the public catalog context_window_tokens. Each Latest follows its current public target.
# Freeform GPT tools: https://developers.openai.com/api/reference/resources/chat/subresources/completions/methods/create/
name = "Modellix"
npm = "@ai-sdk/openai-compatible"
opencodeai = "@opencode/ai/providers/openai-compatible"
env = ["MODELLIX_API_KEY"]
api = "https://llm.modellix.ai/v1"
doc = "https://docs.modellix.ai/llm/api/api"
