# Sources (accessed 2026-10-20):
# - Chat models, per-token pricing, tool / image / reasoning support: https://sichang.xyz/docs/models/chat
# - Request contract (image_url passthrough, rejected fields): https://sichang.xyz/developers/SKILL.md
# - Billing (prepaid credits, cache-hit pricing): https://sichang.xyz/docs/billing
# The same API also serves Anthropic Messages at https://sichang.xyz/api/v1/messages.
# Prices are published in credits per million tokens; USD values in this provider
# are converted at the 2,500-credit pack (US$20.99, i.e. US$0.008396 per credit).
# The chat API rejects response_format (HTTP 400) and ignores reasoning request fields
# (reasoning, reasoning_effort, thinking): every model runs with reasoning disabled except
# GLM-5.3 Uncensored, which always reasons at a fixed effort. image_url parts are passed
# through; GLM-5.3 Flash Uncensored, DeepSeek V4.1 Flash and Gemma 4 Uncensored read them,
# the other models get the image replaced by a text placeholder.
name = "Sichang AI"
env = ["SICHANG_API_KEY"]
npm = "@ai-sdk/openai-compatible"
api = "https://sichang.xyz/api/v1"
doc = "https://sichang.xyz/docs"
