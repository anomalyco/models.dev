# Sources (accessed 2026-09-16):
# https://api.verathos.ai/v1/models (model ID, pricing, context length)
# https://github.com/verathos-ai/verathos/blob/main/docs/api.md (request fields)
#
# Verathos ID ornith-1.5-35b serves ornith-ai/Ornith-1.5-35B-A3B (GGUF Q4_K_M
# mesh, tokenizer ornith-ai/Ornith-1.5-35B-A3B). Text-only. No separate output
# cap is published, so output is bounded by the context window. No
# tool-calling parameters are advertised; the mesh runtime accepts only text
# response_format.
# Toggle: enable_thinking = true|false (top-level request field, default true)
base_model = "deepreinforce/ornith-1.5-35b-a3b"
attachment = false
tool_call = false
structured_output = false

[[reasoning_options]]
type = "toggle"

[cost]
input = 0.10
output = 0.40

[limit]
output = 262_144

[modalities]
input = ["text"]
