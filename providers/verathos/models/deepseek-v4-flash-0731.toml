# Sources (accessed 2026-09-16):
# https://api.verathos.ai/v1/models (model ID, pricing, context length)
# https://github.com/verathos-ai/verathos/blob/main/docs/api.md (request fields)
#
# Served as a GGUF Q2_K_XL / Q3_K_XL mesh with a 312,320-token context window.
# No separate output cap is published, so output is bounded by the context
# window. No tool-calling parameters are advertised; the mesh runtime accepts
# only text response_format.
# Toggle: enable_thinking = true|false (top-level request field, default true)
base_model = "deepseek/deepseek-v4-flash-0731"
tool_call = false
structured_output = false

[[reasoning_options]]
type = "toggle"

[cost]
input = 0.07
output = 0.14

[limit]
context = 312_320
output = 312_320
