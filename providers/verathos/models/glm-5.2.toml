# Sources (accessed 2026-09-16):
# https://api.verathos.ai/v1/models (model ID, pricing, context length)
# https://github.com/verathos-ai/verathos/blob/main/docs/api.md (request fields)
#
# Served as a GGUF IQ2_M mesh with an 84,992-token context window. No separate
# output cap is published, so output is bounded by the context window.
# No tool-calling parameters are advertised; the mesh runtime accepts only text
# response_format.
# Toggle: enable_thinking = true|false (top-level request field, default true)
base_model = "zhipuai/glm-5.2"
tool_call = false
structured_output = false

[[reasoning_options]]
type = "toggle"

[cost]
input = 0.25
output = 1.00

[limit]
context = 84_992
output = 84_992
