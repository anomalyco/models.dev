# Budget: thinking.budget_tokens (forwarded unchanged; tested on Haiku 4.5 and
# Sonnet 4.5 on the same route). Effort, as in the lab entry: reasoning_effort = low|medium|high|max
base_model = "anthropic/claude-sonnet-4-6"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "max"]

[[reasoning_options]]
type = "budget_tokens"
min = 1_024

[interleaved]
field = "reasoning_content"

[cost]
input = 2.85
output = 14.25
cache_read = 0.3

[limit]
output = 128_000

[modalities]
input = ["text", "image"]
