# Prices: GET https://routerbase.com/api/models/anthropic/claude-fable-5/pricing (2026-10-30), what RouterBase
# charges: input/output = list x (1 - discount); cache reads and writes bill at list.
# Effort, as in the lab entry (adaptive effort, no budget): reasoning_effort = low|medium|high|xhigh|max
schema = 2
base_model = "anthropic/claude-fable-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 10
cache = { read = 1, write = { "5m" = 12.5, "1h" = 20 } }

[cost.text.output]
price = 50
