# Prices: GET https://routerbase.com/api/models/anthropic/claude-opus-4.6/pricing (2026-10-30), what RouterBase
# charges: input/output = list x (1 - discount); cache reads and writes bill at list.
# Budget: thinking.budget_tokens (forwarded unchanged; tested on Haiku 4.5 and
# Sonnet 4.5 on the same route). Effort, as in the lab entry: reasoning_effort = low|medium|high|max
schema = 2
base_model = "anthropic/claude-opus-4-6"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "max"], budget = { min = 1_024 } }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 4.75
cache = { read = 0.5, write = { "5m" = 6.25, "1h" = 10 } }

[cost.text.output]
price = 23.75
