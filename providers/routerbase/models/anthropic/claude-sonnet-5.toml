# Prices: GET https://routerbase.com/api/models/anthropic/claude-sonnet-5/pricing (2026-10-30), what RouterBase
# charges: input/output = list x (1 - discount); cache reads and writes bill at list.
# No reasoning on this route (tested 2026-09-29 on the upstream route RouterBase
# forwards these fields to unchanged: `reasoning_effort` none/low/high and
# `thinking` disabled/enabled with budget_tokens all return the plain answer with
# no reasoning output), so reasoning = false.
# Re-probed live on this route (2026-10-30) with the native controls: thinking
# enabled (budget_tokens 2048) and adaptive, reasoning_effort low|medium|high|xhigh|max.
# Every call returned the plain answer with no reasoning_content and no reasoning
# tokens, so reasoning = false here.
schema = 2
base_model = "anthropic/claude-sonnet-5"

[capabilities]
reasoning = { supported = false }

[cost.text.input]
price = 2
cache = { read = 0.2, write = { "5m" = 2.5, "1h" = 4 } }

[cost.text.output]
price = 10
