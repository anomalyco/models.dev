# Prices: GET https://routerbase.com/api/models/openai/gpt-5.6-luna/pricing (2026-10-30), what RouterBase
# charges: input/output = list x (1 - discount); cache reads and writes bill at list.
# Effort: reasoning_effort = none|low|medium|high|xhigh|max
# Custom tools: RouterBase's Chat Completions rebuilds every tool as a JSON
# function tool (type, name, description, parameters, strict), so a custom
# tool's grammar is never forwarded; freeform is left out.
schema = 2
base_model = "openai/gpt-5.6-luna"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.17
cache = { read = 0.02 }

[cost.text.output]
price = 1.02
