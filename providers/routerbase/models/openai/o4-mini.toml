# Prices: GET https://routerbase.com/api/models/openai/o4-mini/pricing (2026-10-30), what RouterBase
# charges: input/output = list x (1 - discount); cache reads and writes bill at list.
# Effort: reasoning_effort = low|medium|high
schema = 2
base_model = "openai/o4-mini"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.935
cache = { read = 0.275 }

[cost.text.output]
price = 3.74
