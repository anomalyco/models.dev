# Prices: GET https://routerbase.com/api/models/openai/gpt-5.6-terra/pricing (2026-10-30), what RouterBase
# charges: input/output = list x (1 - discount); cache reads and writes bill at list.
schema = 2
base_model = "openai/gpt-5.6-terra"

[cost.text.input]
price = 1.7
cache = { read = 0.2 }

[cost.text.output]
price = 10.2
