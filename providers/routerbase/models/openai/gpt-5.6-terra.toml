# Effort: reasoning_effort = none|low|medium|high|xhigh|max
base_model = "openai/gpt-5.6-terra"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh", "max"] }]

[interleaved]
field = "reasoning_content"

[cost]
input = 1.7
output = 10.2
cache_read = 0.2

[modalities]
input = ["text", "image"]
