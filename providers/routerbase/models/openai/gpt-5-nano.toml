# Prices: GET https://routerbase.com/api/models/openai/gpt-5-nano/pricing (2026-10-30), what RouterBase
# charges: input/output = list x (1 - discount); cache reads and writes bill at list.
# Effort: reasoning_effort = minimal|low|medium|high
# Custom tools: RouterBase's Chat Completions rebuilds every tool as a JSON
# function tool (type, name, description, parameters, strict), so a custom
# tool's grammar is never forwarded; freeform is left out.
schema = 2
base_model = "openai/gpt-5-nano"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.0425
cache = { read = 0.005 }

[cost.text.output]
price = 0.34
