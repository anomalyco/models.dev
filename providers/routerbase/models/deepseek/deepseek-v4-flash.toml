# Prices: GET https://routerbase.com/api/models/deepseek/deepseek-v4-flash/pricing (2026-10-30), what RouterBase
# charges: input/output = list x (1 - discount); cache reads and writes bill at list.
# Off-peak hours bill lower; the standard (peak) rate is listed.
# Toggle: thinking.type = enabled|disabled (tested 2026-09-29 on the upstream
# route RouterBase forwards these fields to unchanged: reasons by default,
# `thinking.type = "disabled"` turns it off; `reasoning_effort = "none"` does
# not)
# Effort: reasoning_effort = low|high|max, as in the lab entry (forwarded
# unchanged)
schema = 2
base_model = "deepseek/deepseek-v4-flash"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.15
cache = { read = 0.006 }

[cost.text.output]
price = 0.6
