# Prices: GET https://routerbase.com/api/models/stepfun/step-5-preview/pricing (2026-10-30), what RouterBase
# charges: input/output = list x (1 - discount); cache reads and writes bill at list.
# Same upstream controls as providers/novita-ai/models/stepfun/step-5-preview.toml (RouterBase forwards them unchanged):
# Effort: reasoning_effort = low|medium|high (native baseline)
schema = 2
base_model = "stepfun/step-5-preview"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[limit]
output = 64_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1
cache = { read = 0.1 }

[cost.text.output]
price = 2.7
