# Prices: GET https://routerbase.com/api/models/google/gemini-3.1-pro-preview/pricing (2026-10-30), what RouterBase
# charges: input/output = list x (1 - discount); cache reads and writes bill at list.
# Effort: reasoning_effort = low|medium|high
schema = 2
base_model = "google/gemini-3.1-pro-preview"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.7
cache = { read = 0.2 }

[cost.text.output]
price = 10.2
