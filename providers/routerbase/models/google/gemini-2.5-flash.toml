# Effort: reasoning_effort = low|medium|high
base_model = "google/gemini-2.5-flash"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high"] }]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.255
output = 2.125
cache_read = 0.03

[limit]
output = 65_535

[modalities]
input = ["text", "image"]
