# Prices: GET https://routerbase.com/api/models/google/gemini-2.5-pro/pricing (2026-10-30), what RouterBase
# charges: input/output = list x (1 - discount); cache reads and writes bill at list.
# Effort: reasoning_effort = low|high (tested 2026-09-29 on the upstream route
# RouterBase forwards these fields to unchanged: always reasons, `none` does not
# turn it off, `high` spends roughly twice the reasoning of `low`)
schema = 2
base_model = "google/gemini-2.5-pro"

[capabilities]
reasoning = { supported = true, effort = ["low", "high"] }

[limit]
output = 65_535

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.0625
cache = { read = 0.125 }

[cost.text.output]
price = 8.5
