# Prices: GET https://routerbase.com/api/models/minimax/minimax-m3.1-flash/pricing (2026-10-30), what RouterBase
# charges: input/output = list x (1 - discount); cache reads and writes bill at list.
# Same upstream controls as providers/minimax/models/MiniMax-M3.1-Flash.toml (RouterBase forwards them unchanged):
# Effort: output_config.effort = low|medium|high|xhigh|max, default max. Thinking cannot be
#   disabled: thinking.type = disabled or effort none returns 400.
schema = 2
base_model = "minimax/MiniMax-M3.1-Flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.15
cache = { read = 0.015 }

[cost.text.output]
price = 0.6
