# Prices: GET https://routerbase.com/api/models/zai/glm-5.2/pricing (2026-10-30), what RouterBase
# charges: input/output = list x (1 - discount); cache reads and writes bill at list.
# Same upstream controls as providers/novita-ai/models/zai-org/glm-5.2.toml (RouterBase forwards them unchanged):
# Effort: reasoning_effort = none|high|max; none suppresses reasoning. Native graded baseline retained.
schema = 2
