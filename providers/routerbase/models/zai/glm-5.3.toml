# Prices: GET https://routerbase.com/api/models/zai/glm-5.3/pricing (2026-10-30), what RouterBase
# charges: input/output = list x (1 - discount); cache reads and writes bill at list.
# Same upstream controls as providers/novita-ai/models/zai-org/glm-5.3.toml (RouterBase forwards them unchanged):
# Effort: reasoning_effort = none|low|high|max; none suppresses reasoning.
schema = 2
base_model = "zhipuai/glm-5.3"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.7
cache = { read = 0.26 }

[cost.text.output]
price = 2.2
