# Output limit: RouterBase GET /v1/models `max_completion_tokens` (2026-09-29);
# Moonshot documents max_completion_tokens up to 1048576 for Kimi K3
# (https://platform.kimi.ai/docs/api/chat), as providers/moonshotai does.
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|high|max
base_model = "moonshotai/kimi-k3"
reasoning_options = [{ type = "toggle" }, { type = "effort", values = ["low", "high", "max"] }]

[interleaved]
field = "reasoning_content"

[cost]
input = 2.85
output = 14.25
cache_read = 0.3

[limit]
output = 1_048_576

[modalities]
input = ["text", "image"]
