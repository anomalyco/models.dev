# Prices: GET https://routerbase.com/api/models/moonshotai/kimi-k3/pricing (2026-10-30), what RouterBase
# charges: input/output = list x (1 - discount); cache reads and writes bill at list.
# Same upstream controls as providers/novita-ai/models/moonshotai/kimi-k3.toml (RouterBase forwards them unchanged):
# Effort: reasoning_effort = none|low|high|max; none suppresses reasoning on Novita, unlike the native Kimi API.
schema = 2
base_model = "moonshotai/kimi-k3"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 2.85
cache = { read = 0.3 }

[cost.text.output]
price = 14.25
