# Prices: GET https://routerbase.com/api/models/minimaxai/minimax-m1-80k/pricing (2026-10-30), what RouterBase
# charges: input/output = list x (1 - discount); cache reads and writes bill at list.
# Always-on reasoning (tested 2026-09-29 on the upstream route RouterBase
# forwards these fields to unchanged: every request reasons, with or without
# `reasoning_effort` / `thinking`; the trace arrives inline as <think> in
# content, not in reasoning_content)
schema = 2
base_model = "minimax/minimax-m1-80k"

[capabilities]
reasoning = { supported = true }

[limit]
output = 40_000

[cost.text.input]
price = 0.34

[cost.text.output]
price = 1.87
