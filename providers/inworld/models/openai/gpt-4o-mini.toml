# Source: https://api.inworld.ai/llm/v1alpha/models (accessed 2026-11-11).
# Prices are API per-token rates converted to USD per million tokens.
# Tools and schema output: https://docs.inworld.ai/router/capabilities/tool-calling
# https://docs.inworld.ai/router/capabilities/structured-outputs
schema = 2
base_model = "openai/gpt-4o-mini"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.15
cache = { read = 0.075 }

[cost.text.output]
price = 0.6
