# Infersia serves this as `deepseek/deepseek-v4.1-flash-1017`, brokered to OpenRouter with a pinned
# provider order (DeepInfra, Cloudflare, Morph), so the control surface is OpenRouter's for this model.
# It supersedes `deepseek/deepseek-v4.1-flash` on Infersia, which is deprecated but still served.
# Effort: reasoning_effort (or reasoning.effort) = none|low|high|max; none = off, so no separate toggle.
# Reasoning side channel: message.reasoning. reasoning_field = "reasoning" is valid in v2 but v1's
#   interleaved.field only allows reasoning_content|reasoning_details, so no reasoning_field is set
#   rather than a wrong one (same as providers/nebius for this field).
# Limits and pricing (accessed 2026-11-04): https://api.infersia.com/v1/models
# Model page: https://infersia.com/models/deepseek/deepseek-v4.1-flash-1017
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
cache = { implicit = true }
structured_output = true

[limit]
context = 1_048_576
output = 393_216

[api.chat-completions]

[cost.text.input]
price = 0.35
cache = { read = 0.01 }

[cost.text.output]
price = 1.25
