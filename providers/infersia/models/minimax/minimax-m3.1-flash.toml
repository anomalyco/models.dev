# Infersia serves this as `minimax/minimax-m3.1-flash`, brokered to OpenRouter with a pinned
# provider order (Parasail, Together, DigitalOcean, Fireworks, MiniMax, GMICloud), so the control
# surface is OpenRouter's for this model.
# Effort: reasoning_effort (or reasoning.effort) = low|medium|high|xhigh|max
# Reasoning side channel: message.reasoning. reasoning_field = "reasoning" is valid in v2 but v1's
#   interleaved.field only allows reasoning_content|reasoning_details, so no reasoning_field is set
#   rather than a wrong one (same as providers/nebius for this field).
# structured_output left out: /v1/models does not list `structured_outputs` for this model (response_format only).
# Limits and pricing (accessed 2026-11-04): https://api.infersia.com/v1/models
# Model page: https://infersia.com/models/minimax/minimax-m3.1-flash
schema = 2
base_model = "minimax/MiniMax-M3.1-Flash"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
cache = { implicit = true }

[limit]
context = 1_048_576
output = 524_288

[api.chat-completions]

[cost.text.input]
price = 0.2
cache = { read = 0.02 }

[cost.text.output]
price = 0.8
