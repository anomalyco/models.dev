# Infersia serves this as `xiaomi/mimo-v2.6-pro`, brokered to OpenRouter with a pinned provider
# order (GMICloud, Xiaomi), so the control surface is OpenRouter's for this model.
# Toggle: reasoning.enabled = true|false (no graded effort on this host)
# Reasoning side channel: message.reasoning. reasoning_field = "reasoning" is valid in v2 but v1's
#   interleaved.field only allows reasoning_content|reasoning_details, so no reasoning_field is set
#   rather than a wrong one (same as providers/nebius for this field).
# Modalities: text, image and video input; the base entry's audio input is not offered on this host.
# top_k is not accepted on this host (/v1/models supported_parameters).
# Limits and pricing (accessed 2026-11-04): https://api.infersia.com/v1/models
# Model page: https://infersia.com/models/xiaomi/mimo-v2.6-pro
schema = 2
base_model = "xiaomi/mimo-v2.6-pro"

[modalities]
input = [
  "text",
  "image/jpeg",
  "image/png",
  "image/gif",
  "image/webp",
  "image/bmp",
  "video/mp4",
  "video/quicktime",
  "video/x-msvideo",
  "video/x-ms-wmv",
]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, toggle = true }
cache = { implicit = true }
structured_output = true
top_k = false

[api.chat-completions]

[cost.text.input]
price = 0.6
cache = { read = 0.005 }

[cost.text.output]
price = 1.2
