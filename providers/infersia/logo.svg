<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
  <!--
    Three server racks of ascending height, built from stacked units, the
    tallest carrying a tittle so the mark reads as a lowercase "i".

    Unlike the favicon variant of this mark, the faded racks use opacity on
    currentColor rather than pre-flattened indigo, per the models.dev logo
    guidelines: the logo inherits the surrounding text colour and so works in
    both light and dark themes. The vents are gaps rather than drawn lines, so
    they take the page background instead of a hardcoded white.
  -->
  <g opacity="0.35">
    <rect x="2.5" y="19.4" width="5" height="2.6" rx="1.2"/>
    <rect x="2.5" y="15.8" width="5" height="2.6" rx="1.2"/>
  </g>

  <g opacity="0.6">
    <rect x="9.5" y="19.4" width="5" height="2.6" rx="1.2"/>
    <rect x="9.5" y="15.8" width="5" height="2.6" rx="1.2"/>
    <rect x="9.5" y="12.2" width="5" height="2.6" rx="1.2"/>
  </g>

  <rect x="16.5" y="19.4" width="5" height="2.6" rx="1.2"/>
  <rect x="16.5" y="15.8" width="5" height="2.6" rx="1.2"/>
  <rect x="16.5" y="12.2" width="5" height="2.6" rx="1.2"/>
  <rect x="16.5" y="8.6" width="5" height="2.6" rx="1.2"/>

  <rect x="16.5" y="1.2" width="5" height="4" rx="2"/>
</svg>
