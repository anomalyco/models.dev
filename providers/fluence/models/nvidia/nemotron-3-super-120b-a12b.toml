# Source: Fluence Inference public catalog (https://inference.fluence.cloud), snapshot 2026-11-25T13:35Z.
# Prices are ceilings: Fluence prices float with supply, so each is the snapshot price rounded up to 2 significant figures.
# Reasoning controls follow the same base model on peer hosts.
# Budget: none listed. Fluence documents no reasoning-token budget request field; only reasoning effort is passed through.
schema = 2
base_model = "nvidia/nemotron-3-super-120b-a12b"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.056
cache = { read = 0.028 }

[cost.text.output]
price = 0.28
