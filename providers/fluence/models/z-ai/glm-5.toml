# Source: Fluence Inference public catalog (https://inference.fluence.cloud), snapshot 2026-11-25T13:35Z.
# Prices are ceilings: Fluence prices float with supply, so each is the snapshot price rounded up to 2 significant figures.
# Reasoning controls: none listed. Fluence documents no request field that turns reasoning on or off for this model, and
# per-model effort levels are only in the authenticated GET /v1/routing (https://inference.fluence.cloud/docs).
schema = 2
base_model = "zhipuai/glm-5"

[limit]
context = 198_000

[capabilities]
reasoning = { supported = true }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.62
cache = { read = 0.13 }

[cost.text.output]
price = 2
