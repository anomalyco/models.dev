# Pricing: https://xhuoapi.ai/en/pricing.html (accessed 2026-10-23); Standard group, the default for new accounts.
# Effort: reasoning_effort = none|low|medium|high (Tested on XHuoAPI Chat Completions 2026-10-23: none/default → no reasoning; low/medium/high → 313 / 323 / 1465 reasoning tokens; thinking.type had no effect)
schema = 2
base_model = "moonshotai/kimi-k2.6"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }

[cost.text.input]
price = 0.76
cache = { read = 0.128 }

[cost.text.output]
price = 3.157
