# Pricing: https://xhuoapi.ai/en/pricing.html (accessed 2026-10-23); Standard group, the default for new accounts.
# Effort: reasoning_effort = none|low|medium|high|xhigh|max (lab levels plus none; Tested on XHuoAPI Chat Completions 2026-10-23: none returned 200 with no reasoning, high produced reasoning)
schema = 2
base_model = "anthropic/claude-sonnet-5"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 1.6
cache = { read = 0.16 }

[cost.text.output]
price = 8
