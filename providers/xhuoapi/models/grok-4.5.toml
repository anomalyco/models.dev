# Pricing: https://xhuoapi.ai/en/pricing.html (accessed 2026-10-23); Standard group, the default for new accounts.
# Effort: reasoning_effort = low|medium|high|xhigh (levels from the lab entry; Tested on XHuoAPI Chat Completions 2026-10-23: xhigh returned HTTP 200)
# Long-context price: XHuoAPI bills prompts of <= 200000 tokens at the base price, so the override starts at gt = 200000.
schema = 2
base_model = "xai/grok-4.5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }

[cost.text.input]
price = 1.6
cache = { read = 0.24 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 3.2
cache = { read = 0.48 }

[cost.text.output]
price = 4.8

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 9.6
