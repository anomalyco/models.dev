# Pricing: https://xhuoapi.ai/en/pricing.html (accessed 2026-10-23); Standard group, the default for new accounts.
# Effort: reasoning_effort = "low" | "high" | "max"
schema = 2
base_model = "moonshotai/kimi-k3"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "max" }, effort = ["low", "high", "max"] }

[cost.text.input]
price = 2.4
cache = { read = 0.24 }

[cost.text.output]
price = 12
