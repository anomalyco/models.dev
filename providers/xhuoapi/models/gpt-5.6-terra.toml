# Pricing: https://xhuoapi.ai/en/pricing.html (accessed 2026-10-23); Standard group, the default for new accounts.
# Effort: reasoning_effort = none|low|medium|high|xhigh|max (levels from the lab entry)
# Long-context price: XHuoAPI bills prompts of <= 272000 tokens at the base price, so the override starts at gt = 272000.
schema = 2
base_model = "openai/gpt-5.6-terra"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 1.6
cache = { read = 0.16 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 3.2
cache = { read = 0.32 }

[cost.text.output]
price = 9.6

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 14.4
