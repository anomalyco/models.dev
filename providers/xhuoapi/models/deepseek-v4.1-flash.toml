# Pricing: https://xhuoapi.ai/en/pricing.html (accessed 2026-10-09)
# Prices are for the Standard group, the default for new accounts.
# Effort: reasoning_effort = none|low|high|max (none disables thinking; matches DeepSeek Flash graded set + off)
base_model = "deepseek/deepseek-v4.1-flash"
[[reasoning_options]]
type = "effort"
values = ["none","low","high","max"]

[cost]
input = 0.8
output = 3.2
cache_read = 0.016
