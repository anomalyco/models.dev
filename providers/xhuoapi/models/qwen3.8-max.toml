# Pricing: https://xhuoapi.ai/en/pricing.html (accessed 2026-10-23); Standard group, the default for new accounts.
# Toggle: enable_thinking true|false
# Effort: reasoning_effort = low|medium|xhigh
# Budget: thinking_budget
schema = 2
base_model = "alibaba/qwen3.8-max"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "xhigh" }, toggle = true, effort = ["low", "medium", "xhigh"], budget = { min = 0, max = 262_144 } }

[cost.text.input]
price = 1.6
cache = { read = 0.2 }

[cost.text.output]
price = 4.8
