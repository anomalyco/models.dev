# Pricing: https://xhuoapi.ai/en/pricing.html (accessed 2026-10-09)
# Prices are for the Standard group, the default for new accounts.
# Toggle: enable_thinking true|false (hybrid)
# Effort: reasoning_effort = low|medium|xhigh (default xhigh); high accepted as alias → xhigh
# Budget: thinking_budget (0..262144) cannot be combined with reasoning_effort
base_model = "alibaba/qwen3.8-max"
[[reasoning_options]]
type = "toggle"
[[reasoning_options]]
type = "effort"
values = ["low","medium","xhigh"]
[[reasoning_options]]
type = "budget_tokens"
min = 0
max = 262144

[cost]
input = 1.6
output = 4.8
cache_read = 0.2
