# Pricing: https://xhuoapi.ai/en/pricing.html (accessed 2026-10-23); Standard group, the default for new accounts.
# Long-context price: XHuoAPI bills prompts of <= 200000 tokens at the base price, so the override starts at gt = 200000.
schema = 2
base_model = "google/gemini-3.1-pro-preview"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[cost.text.input]
price = 1.6
cache = { read = 0.16 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 3.2
cache = { read = 0.32 }

[cost.text.output]
price = 9.6

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 14.4
