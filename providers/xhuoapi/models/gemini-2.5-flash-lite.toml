# Pricing: https://xhuoapi.ai/en/pricing.html (accessed 2026-10-23); Standard group, the default for new accounts.
# Effort: reasoning_effort = none|low|medium|high (Tested on XHuoAPI Chat Completions 2026-10-23: none/default → 0 reasoning tokens, high → reasoning)
schema = 2
base_model = "google/gemini-2.5-flash-lite"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }

[cost.text.input]
price = 0.08
cache = { read = 0.008 }

[cost.text.output]
price = 0.32
