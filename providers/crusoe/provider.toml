# Prompt caching (chat): automatic cluster-wide KV cache (MemoryAlloy) with cache-aware routing; the chat API defines no cache request field.
# To get a hit: repeat identical prefixes on the same model so requests route to warm nodes; no client control or retention window documented.
# Docs: https://docs.crusoecloud.com/serverless-inference/overview
name = "Crusoe"
env = ["CRUSOE_API_KEY"]
npm = "@ai-sdk/openai-compatible"
api = "https://api.inference.crusoecloud.com/v1"
doc = "https://docs.crusoecloud.com/managed-inference/overview"
