# Sources: https://docs.crusoe.ai/serverless-inference/index.html and
# https://www.crusoe.ai/cloud/pricing (accessed 2026-11-16); GET /v1/models.
# Limits: GET https://api.inference.crusoecloud.com/v1/models (2026-11-16),
# this model has context_length=1,048,576 and top_provider.context_length=1,048,576;
# top_provider.max_completion_tokens=262,144. Large-limit requests not tested.
# Live: Chat Completions tool call, continuation, strict JSON schema and PNG/JPEG vision.
# Implicit cache live: second identical request reused 11,040 of 12,709 input tokens.
# Toggle: reasoning_effort = none (off), high (on); three tests each returned
# 0/0/0 and 36/23/58 reasoning tokens. Other graded levels not verified.
schema = 2
base_model = "nvidia/nemotron-3.5-super-vl-120b-a12b"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
cache = { implicit = true }

[limit]
output = 262_144

[cost.text.input]
price = 0.10
cache = { read = 0.08 }

[cost.text.output]
price = 0.40
