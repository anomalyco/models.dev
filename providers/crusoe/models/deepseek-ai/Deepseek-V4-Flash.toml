# Crusoe's model id really is "Deepseek-V4-Flash" (lowercase "s").
# Probed live endpoint 2026-09-29 (POST /v1/chat/completions, temperature 0):
# reasoning is off by default (no reasoning text on a plain request) and
# reasoning_effort "none" keeps it off; low/high/max enable it. On a harder
# prompt low was shorter than high/max (411 vs 1477/970 completion tokens);
# medium and xhigh are accepted but not distinct rungs, so the native
# DeepSeek low/high/max set plus "none" is advertised (effort-only, no
# toggle). chat_template_kwargs.thinking = true also enables it. Reasoning
# text arrives interleaved with tool_calls, in "reasoning_content".
base_model = "deepseek/deepseek-v4-flash"
reasoning_options = [{ type = "effort", values = ["none", "low", "high", "max"] }]
interleaved = { field = "reasoning_content" }

# Pricing: https://www.crusoe.ai/cloud/pricing and live GET /v1/models
# (accessed 2026-09-29)
[cost]
input = 0.14
output = 0.28
cache_read = 0.03

[limit]
context = 1_048_576
