# Probed live endpoint 2026-09-29 (POST /v1/chat/completions, temperature 0,
# 3 repeats per level): reasoning is on by default; reasoning_effort "none"
# disables it (4 completion tokens). low/medium/xhigh are accepted and
# distinct (175/190/312-1371 tokens; xhigh is the default); "high" and
# "max" return HTTP 400 ("Supported types are xhigh (default), medium, and
# low"). Reasoning text arrives interleaved with tool_calls, in
# "reasoning_content".
base_model = "alibaba/qwen3.8-27b"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "xhigh"] }]
interleaved = { field = "reasoning_content" }

# Pricing: https://www.crusoe.ai/cloud/pricing and live GET /v1/models
# (accessed 2026-09-29)
[cost]
input = 0.25
output = 2.00
cache_read = 0.15
