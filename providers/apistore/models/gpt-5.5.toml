# Prices: API Store public catalog GET https://apistore.cloud/api/public/models (2026-11-24), USD per million tokens.
# Effort: reasoning_effort, passed through to the OpenAI Chat Completions API (levels as on OpenAI's API).
# Long prompts: above 272,000 input tokens the whole request is billed at the catalog's `long_prompt` prices.
schema = 2
base_model = "openai/gpt-5.5"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 3.5
cache = { read = 0.35 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 7
cache = { read = 0.7 }

[cost.text.output]
price = 21

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 31.5
