# Prices: API Store public catalog GET https://apistore.cloud/api/public/models (2026-11-24), USD per million tokens.
# Served on Anthropic's Messages API upstream and translated from Chat Completions: reasoning_effort becomes
# output_config.effort (a thinking budget on 4.5 models), and Anthropic's own `thinking` and
# `output_config` fields are passed through. Without either the model does not think.
# Toggle: thinking.type = enabled|disabled (passed through; values as on Anthropic's API)
# Live 2026-11-24: claude-haiku-4-5 thinking enabled/budget 3000 -> 1,433 chars of reasoning_content;
# claude-opus-4-7 adaptive -> 475 chars, disabled -> none; claude-haiku-4-5 reasoning_effort low/medium/high
# -> 970/1,657/1,667 chars; json_schema output parsed on claude-opus/sonnet/haiku-5-5.
# Cache: cache_control; live 2026-11-24 on claude-sonnet-5-5 a ~4k-token system prompt wrote 4,052 tokens
# and read them back on the second call. Writes are billed at 1.25x input (5m) and 2x input (1h).
schema = 2
base_model = "anthropic/claude-haiku-4-5"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high"], budget = { min = 1_024 } }
structured_output = true
cache = { explicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.7
cache = { read = 0.07, write = { "5m" = 0.875, "1h" = 1.4 } }

[cost.text.output]
price = 3.5
