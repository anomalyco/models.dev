# Prices: API Store public catalog GET https://apistore.cloud/api/public/models (2026-11-24), USD per million tokens.
# Served over Chat Completions and translated to Anthropic Messages by API Store's gateway.
# Toggle: thinking.type = enabled|disabled (Anthropic's `thinking` field, passed through unchanged; values as on Anthropic's API)
# Effort: live 2026-11-24, same prompt, max_tokens 12000: no reasoning_effort -> no thinking; low/medium/high ->
# 970/1,657/1,667 chars of reasoning_content (thinking budgets 2,048/8,192/16,384 tokens, capped below max_tokens).
# Effort: reasoning_effort maps to Claude's output_config.effort (adaptive thinking), or to a
# thinking budget on 4.5 models; `thinking` and `output_config` are also passed through as Anthropic fields.
# Cache: cache_control on message parts and at the top level is passed to Anthropic; API Store
# bills cache writes at the normal input price.
schema = 2
base_model = "anthropic/claude-haiku-4-5"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high"], budget = { min = 1_024 } }
structured_output = true
cache = { explicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.7
cache = { read = 0.07, write = 0.7 }

[cost.text.output]
price = 3.5
