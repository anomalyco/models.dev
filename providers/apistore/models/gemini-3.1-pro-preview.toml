# Prices: API Store public catalog GET https://apistore.cloud/api/public/models (2026-11-24), USD per million tokens.
# Served over Chat Completions and translated to Gemini generateContent by API Store's gateway.
# Reasoning: no caller control listed. Live 2026-11-24 on gemini-4-argon, reasoning_effort low and high gave the same
# output size (750/751 completion tokens, reasoning_tokens 0) and no reasoning_content.
# Input: the gateway converts image_url parts and PDF file parts; audio and video parts are not converted.
# Long prompts: above 200,000 input tokens the whole request is billed at the catalog's `long_prompt` prices.
schema = 2
base_model = "google/gemini-3.1-pro-preview"

[capabilities]
reasoning = { supported = true }
structured_output = true
cache = { implicit = true }

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "application/pdf"]
output = ["text"]

[cost.text.input]
price = 1.4
cache = { read = 0.14 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 2.8
cache = { read = 0.28 }

[cost.text.output]
price = 8.4

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 12.6
