# Prices: API Store public catalog GET https://apistore.cloud/api/public/models (2026-11-24), USD per million tokens.
# Relayed over Chat Completions. Effort: reasoning_effort (levels as on Anthropic's API); without it the model
# does not think. Anthropic's own `thinking` field is not forwarded, so no toggle or budget is listed.
# Live 2026-11-24: claude-haiku-4-5 no effort / low / medium / high -> 0 / 970 / 1,657 / 1,667 chars of
# reasoning_content; claude-sonnet-5-5 low / max -> 475 / 10,689 completion tokens.
# Cache: cache_control on message parts; live 2026-11-24 on claude-sonnet-5-5 a ~4k-token system prompt
# read 4,052 cached tokens on the second call. API Store bills cache writes at the normal input price.
# Long prompts: above 100,000 input tokens the whole request is billed at the catalog's `long_prompt` prices.
schema = 2
base_model = "anthropic/claude-haiku-5-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { explicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.07
cache = { read = 0.007, write = 0.07 }

[[cost.text.input.overrides]]
when = { context = { gt = 100_000 } }
price = 0.35
cache = { read = 0.035, write = 0.35 }

[cost.text.output]
price = 0.35

[[cost.text.output.overrides]]
when = { context = { gt = 100_000 } }
price = 1.75
