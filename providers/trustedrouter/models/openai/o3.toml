# Generated by bun models:sync trustedrouter from https://api.trustedrouter.com/v1/models.
# Prices are USD per million tokens; lab facts are inherited via base_model.
# Effort: reasoning.effort = low|medium|high
# Reasoning probed live 2026-11-24 on POST https://api.trustedrouter.com/v1/chat/completions: reasoning.enabled = false returned 400 ("this model cannot turn reasoning off"); low, medium and high were accepted and an invalid effort returned OpenAI's 400 listing the accepted values (routed to openai; this route reports no reasoning token count).
# Cache: implicit; the selected provider caches prompt prefixes automatically (https://trustedrouter.com/docs/prompt-caching).
# Mid-conversation: system_updates, effort_updates and tools.updates are unset; TrustedRouter documents none of them.
schema = 2
base_model = "openai/o3"
description = "O-series reasoning model for hard analysis, math, coding, and planning"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 2.11
cache = { read = 0.5275 }

[cost.text.output]
price = 8.44
