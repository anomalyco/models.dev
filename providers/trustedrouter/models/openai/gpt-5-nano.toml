# Generated by bun models:sync trustedrouter from https://api.trustedrouter.com/v1/models.
# Prices are USD per million tokens; lab facts are inherited via base_model.
# Effort: reasoning.effort = minimal|low|medium|high
# Reasoning controls are TrustedRouter's published `reasoning` object (OpenRouter's request shape): OpenRouter's
# efforts for the model, narrowed to what the gateway honors on every route (https://trustedrouter.com/docs).
# tools.freeform left out: Chat Completions, the only API listed, rejects custom tools. Text, regex ZZ[0-9]{3} and lark custom tools each returned 501 not_supported_in_alpha on tools[0].type (live 2026-11-24 on this model).
# Cache: implicit; the selected provider caches prompt prefixes automatically (https://trustedrouter.com/docs/prompt-caching).
# Mid-conversation: system_updates, effort_updates and tools.updates are unset; TrustedRouter documents none of them.
schema = 2
base_model = "openai/gpt-5-nano"
description = "Compact GPT model for low-latency assistance and high-volume workloads"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.05275
cache = { read = 0.01 }

[cost.text.output]
price = 0.422
