# Generated by bun models:sync trustedrouter from https://api.trustedrouter.com/v1/models.
# Prices are USD per million tokens; lab facts are inherited via base_model.
# Toggle: reasoning.enabled = true|false
# Reasoning controls are TrustedRouter's published `reasoning` object (OpenRouter's request shape): OpenRouter's
# efforts for the model, narrowed to what the gateway honors on every route (https://trustedrouter.com/docs).
# Mid-conversation: system_updates, effort_updates and tools.updates are unset; TrustedRouter documents none of them.
schema = 2
base_model = "bytedance-seed/seed-2.1-turbo"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/tiff", "image/x-icon", "image/x-icns", "image/sgi", "image/jp2", "image/heic"]
