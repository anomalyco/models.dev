# Generated by bun models:sync trustedrouter from https://api.trustedrouter.com/v1/models.
# Prices are USD per million tokens; lab facts are inherited via base_model.
# Reasoning controls are TrustedRouter's published `reasoning` object: OpenRouter's efforts for the model,
# narrowed to what the gateway honors on every route (https://trustedrouter.com/docs).
# Mid-conversation: system_updates, effort_updates and tools.updates are unset; TrustedRouter documents none of them.
schema = 2
base_model = "alibaba/qwen3.8-27b"
description = "Qwen vision-language model for visual reasoning, documents, and agent tasks"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "xhigh"] }
structured_output = true

[limit]
context = 65_536

[cost.text.input]
price = 0.041145
cache = { read = 0.01 }

[cost.text.output]
price = 0.3376
