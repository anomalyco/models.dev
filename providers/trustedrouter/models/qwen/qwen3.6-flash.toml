# Generated by bun models:sync trustedrouter from https://api.trustedrouter.com/v1/models.
# Prices are USD per million tokens; lab facts are inherited via base_model.
# Effort: reasoning.effort = none|minimal|low|medium|high|xhigh
# Reasoning probed live 2026-11-24 on POST https://api.trustedrouter.com/v1/chat/completions: none and minimal returned no reasoning and low to xhigh returned reasoning; an invalid effort and max returned Alibaba's 400 listing none, minimal, low, medium, high and xhigh; reasoning.enabled = false was ignored, so there is no separate toggle (routed to alibaba).
# Cache: implicit; the selected provider caches prompt prefixes automatically (https://trustedrouter.com/docs/prompt-caching).
# Mid-conversation: system_updates, effort_updates and tools.updates are unset; TrustedRouter documents none of them.
schema = 2
base_model = "alibaba/qwen3.6-flash"
description = "Efficient Qwen model for fast chat, extraction, and high-volume workloads"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh"] }
structured_output = false
temperature = false
cache = { implicit = true }

[limit]
context = 1_048_576

[cost.text.input]
price = 0.26375
cache = { read = 0.026375 }

[cost.text.output]
price = 1.5825
