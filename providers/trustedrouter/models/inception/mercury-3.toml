# Generated by bun models:sync trustedrouter from https://api.trustedrouter.com/v1/models.
# Prices are USD per million tokens; lab facts are inherited via base_model.
# Effort: reasoning.effort = none|low|medium|high
# Reasoning probed live 2026-11-24 on POST https://api.trustedrouter.com/v1/chat/completions: none returned no reasoning and low, medium and high returned reasoning; an invalid effort returned Inception's 400 listing instant, low, medium and high; reasoning.enabled = false was ignored, so there is no separate toggle (routed to inception).
# Cache: implicit; the selected provider caches prompt prefixes automatically (https://trustedrouter.com/docs/prompt-caching).
# Mid-conversation: system_updates, effort_updates and tools.updates are unset; TrustedRouter documents none of them.
schema = 2
base_model = "inception/mercury-3"
description = "Reasoning model for deliberate analysis, multi-step problem solving, and tool use"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.1055
cache = { read = 0.01055 }

[cost.text.output]
price = 0.36925
