# Generated by bun models:sync trustedrouter from https://api.trustedrouter.com/v1/models.
# Prices are USD per million tokens; lab facts are inherited via base_model.
# Toggle: reasoning.enabled = true|false
# Reasoning probed live 2026-11-24 on POST https://api.trustedrouter.com/v1/chat/completions: reasoning.enabled = false returned no reasoning and reasoning.enabled = true returned reasoning (routed to baseten); efforts are not published: an invalid effort was accepted and reasoning did not follow the level.
# Cache: implicit; the selected provider caches prompt prefixes automatically (https://trustedrouter.com/docs/prompt-caching).
# Mid-conversation: system_updates, effort_updates and tools.updates are unset; TrustedRouter documents none of them.
schema = 2
base_model = "nvidia/nemotron-3.5-super-vl-120b-a12b"
name = "Nemotron 3.5 Super VL"
description = "Nemotron multimodal model for visual reasoning and agentic AI workflows"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
cache = { implicit = true }

[limit]
output = 1_048_576

