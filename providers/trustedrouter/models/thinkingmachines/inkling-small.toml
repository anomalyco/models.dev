# Prices are USD per million tokens; lab facts are inherited via base_model.
# Effort: reasoning.effort = none|minimal|low|medium|high|max
# Reasoning controls are TrustedRouter's published `reasoning` object (OpenRouter's request shape): OpenRouter's
