# Generated by bun models:sync trustedrouter from https://api.trustedrouter.com/v1/models.
# Prices are USD per million tokens; lab facts are inherited via base_model.
# Effort: reasoning.effort = low|medium|high
# Reasoning probed live 2026-11-24 on POST https://api.trustedrouter.com/v1/chat/completions: low, medium and high were accepted with reasoning returned; none and an invalid effort returned Mistral's 422 listing high, low and medium, and reasoning.enabled = false was rejected (routed to mistral).
# Cache: implicit; the selected provider caches prompt prefixes automatically (https://trustedrouter.com/docs/prompt-caching).
# Mid-conversation: system_updates, effort_updates and tools.updates are unset; TrustedRouter documents none of them.
schema = 2
base_model = "mistral/mistral-large-4"
description = "Flagship Mistral model for advanced reasoning, coding, and multilingual work"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.7385
cache = { read = 0.07385 }

[cost.text.output]
price = 2.2155
