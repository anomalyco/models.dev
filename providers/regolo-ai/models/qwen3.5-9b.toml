# Price: https://regolo.ai/pricing lists EUR (accessed 2026-10-21); converted to USD at the ECB rate 1 EUR = 1.1215 USD (2026-10-20).
# EUR 0.07 / 0.35 per 1M tokens.
schema = 2
base_model = "alibaba/qwen3.5-9b"
name = "Qwen3.5-9B"
description = "Qwen vision-language model for visual reasoning, documents, and agent tasks"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
reasoning = { supported = true }

[limit]
output = 8_192

[cost.text.input]
price = 0.078505

[cost.text.output]
price = 0.392525
