# Priced per output pixel on https://regolo.ai/pricing (EUR 0.000000015, accessed 2026-10-21), which v2 can't express; the per-token cost below is stale.
schema = 2
type = "image"
name = "Qwen-Image"
description = "Image model for prompt-driven generation, editing, and visual design workflows"
family = "qwen"
open_weights = false
release_date = "2026-03-01"

[modalities]
input = ["text"]
output = ["image"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = true

[limit]
context = 8_192
output = 4_096

[cost.text.input]
price = 0.5

[cost.text.output]
price = 2
