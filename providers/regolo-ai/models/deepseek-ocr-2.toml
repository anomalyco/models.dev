# Per-token price is 0 on Regolo (input_cost_per_token = 0, output_cost_per_token = 0 per API 2026-08-05 and 2026-10-21)
# Priced per request on https://regolo.ai/pricing (EUR 0.02, accessed 2026-10-21), which v2 can't express.
schema = 2
base_model = "deepseek/deepseek-ocr-2"

[limit]
context = 4_000
output = 4_000

[cost.text.input]
price = 0

[cost.text.output]
price = 0
