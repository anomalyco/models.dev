# Regolo documents these fields with gpt-oss-120b; it does not separately map
# them to gpt-oss-20b (accessed 2026-06-25).
# https://docs.regolo.ai/models/features/thinking/
# Price: https://regolo.ai/pricing lists EUR (accessed 2026-10-21); converted to USD at the ECB rate 1 EUR = 1.1215 USD (2026-10-20).
# EUR 0.10 / 0.42 per 1M tokens.
schema = 2
base_model = "openai/gpt-oss-20b"
name = "GPT-OSS-20B"
description = "Open-weight GPT model for self-hosted reasoning and instruction-following workloads"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[limit]
context = 128_000
output = 16_384

[cost.text.input]
price = 0.11215

[cost.text.output]
price = 0.47103
