# Priced per query on https://regolo.ai/pricing (EUR 0.01, accessed 2026-10-21), which v2 can't express; the per-token cost below is stale.
# API: POST https://api.regolo.ai/v1/rerank (https://docs.regolo.ai/models/families/rerank/)
schema = 2
type = "reranking"
name = "Qwen3-Reranker-4B"
description = "Reranking model for improving retrieval quality in search and recommendation systems"
family = "qwen"
open_weights = true
release_date = "2026-02-01"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false

[limit]
context = 32_768
output = 8_192

[api.rerank]
sdk = { aisdk = "none", opencodeai = "none" }

[cost.text.input]
price = 0.12

[cost.text.output]
price = 0.12
