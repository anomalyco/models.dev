# Toggle: chat_template_kwargs.enable_thinking = true|false (default off);
# a reasoning_effort value also turns thinking on, with no graded levels.
# Text input only on this host; context capped at 65,536 tokens, output at 16,384.
# Source: https://inference.raindragon.ai/api-documentation
schema = 2
base_model = "google/gemma-4-31b-it"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, default = { type = "toggle", value = false }, toggle = true }
cache = { implicit = true }

[limit]
context = 65_536
output = 16_384

[cost.text.input]
price = 0.13
cache = { read = 0.03 }

[cost.text.output]
price = 0.38
