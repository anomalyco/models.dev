# Source: https://docs.mistral.ai/models/deepseek-v4-flash-1017 (accessed 2026-10-28; API ID deepseek-v4-1-flash-1017;
# Public Preview, served without Mistral modifications; $0.3 input / $0.007 cached input / $1.2 output; 1M context / 128k max output).
# GET https://api.mistral.ai/v1/models: max_context_length 1,048,576, vision false, function_calling and reasoning true.
# Modalities: Mistral serves it text only (vision false), unlike DeepSeek's own API.
# Effort (live 2026-10-28): reasoning_effort = none|low|high|xhigh|max; "medium" returns 400 listing those values.
#   Omitting reasoning_effort returned 0 reasoning tokens, so the default is none. xhigh is accepted but left out: DeepSeek
#   maps xhigh to high (providers/deepseek/models/deepseek-v4-flash.toml) and the served model is unmodified.
# Tools: https://docs.mistral.ai/api/endpoint/chat (tool_choice auto|none|any|required or a named function; function.strict).
#   All five tool_choice forms worked live with a strict function (2026-10-28).
# Structured output: json_schema response_format returned schema-valid JSON live (model page lists Structured Outputs).
# Cache: Mistral prompt caching (https://docs.mistral.ai/studio/conversations/advanced/prompt-caching) and the model page's
#   cached-input price. Two identical 5.5k-token requests reported no cached tokens live, so no minimum is recorded.
# Mid-conversation flags weren't checked on this model and are left unset.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, default = { type = "effort", value = "none" }, effort = ["none", "low", "high", "max"] }
structured_output = true
stream_usage = true
cache = { implicit = true }

[limit]
context = 1_048_576
output = 128_000

[cost.text.input]
price = 0.3
cache = { read = 0.007 }

[cost.text.output]
price = 1.2
