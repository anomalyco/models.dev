# Cached-input pricing: https://docs.mistral.ai/inference/pricing (2026-09-29)
schema = 2
name = "Mistral Medium 3.5"
description = "Balanced Mistral model for enterprise assistants, multilingual work, and tools"
family = "mistral-medium"
open_weights = true
release_date = "2026-04-29"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = true
temperature = true

[limit]
context = 262_144
output = 262_144

[cost.text.input]
price = 1.5
cache = { read = 0.15 }

[cost.text.output]
price = 7.5
