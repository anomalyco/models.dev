# Versioned Mistral Large 4 route reported by the catalog sync on 2026-10-29.
# POST https://api.mistral.ai/v1/chat/completions verified live 2026-10-29:
# reasoning_effort = low|medium|high returns 200 with thinking output; none and minimal
# return 400 listing exactly low|medium|high. The version remains callable even though
# the current /v1/models response lists only mistral-large-4 and mistral-large-4-0.
# Model, limits and USD/MTok pricing: https://docs.mistral.ai/models/mistral-large-4-0
# PDF input: https://docs.mistral.ai/studio/document-processing/document_qna
schema = 2
base_model = "mistral/mistral-large-4"
name = "Mistral Large 4.0.8"
status = "beta"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
cache = { implicit = { min_tokens = 64 } }

[cost.text.input]
price = 0.7
cache = { read = 0.07 }

[cost.text.output]
price = 2.1
