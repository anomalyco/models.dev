# Image formats: https://docs.mistral.ai/studio/conversations/vision (PNG, JPEG, WEBP, non-animated GIF)
# Sampling: the chat API takes temperature and top_p but has no top_k (https://docs.mistral.ai/api/endpoint/chat).
# tools.updates: adding or removing a tool busts the cache; tools render before the conversation (live 2026-10-22).
schema = 2
name = "Pixtral 12B"
description = "Mistral vision-language model for image understanding and multimodal chat"
family = "pixtral"
open_weights = true
knowledge = "2024-09"
release_date = "2024-09-01"
status = "deprecated"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = false

[limit]
context = 128_000
output = 128_000

[cost.text.input]
price = 0.15

[cost.text.output]
price = 0.15
