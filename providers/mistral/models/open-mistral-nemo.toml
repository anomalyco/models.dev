# Sampling: the chat API takes temperature and top_p but has no top_k (https://docs.mistral.ai/api/endpoint/chat).
# tools.updates: adding or removing a tool busts the cache; tools render before the conversation (live 2026-10-22).
# Tools: https://docs.mistral.ai/api/endpoint/chat (tool_choice auto|none|any|required or a named function; function.strict).
#   strict + a named tool_choice were accepted live for this ID on 2026-10-24 (retired IDs are served by their successor).
schema = 2
name = "Open Mistral Nemo"
description = "Legacy model retained for compatibility with older integrations"
family = "mistral-nemo"
open_weights = true
knowledge = "2024-07"
release_date = "2024-07-01"
status = "deprecated"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = false

[limit]
context = 128_000
output = 128_000

[cost.text.input]
price = 0.15

[cost.text.output]
price = 0.15
