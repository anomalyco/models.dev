# Alias: /v1/models (2026-11-12) lists mistral-large-latest as an alias of mistral-large-4 (reasoning
# true, max_context_length 1048576); it used to point at mistral-large-2512.
# Live checks 2026-11-12 on POST https://api.mistral.ai/v1/chat/completions with model mistral-large-latest:
# - reasoning_effort = low|high returns 200 with reasoning tokens; none returns 400 listing exactly
#   high|low|medium (https://docs.mistral.ai/studio/conversations/reasoning).
# - max_tokens 300000 is rejected: at most 262144 completion tokens.
# Pricing and model: https://docs.mistral.ai/models/mistral-large-4-0 (same as mistral-large-4 here).
# Other behavior (tools, structured output, caching, PDF) matches providers/mistral/models/mistral-large-4.toml.
schema = 2
base_model = "mistral/mistral-large-4"
name = "Mistral Large (latest)"
status = "beta"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
system_updates = true
stream_usage = true
prompt_cache_key = true
cache = { implicit = { min_tokens = 64 } }

[cost.text.input]
price = 0.7
cache = { read = 0.07 }

[cost.text.output]
price = 2.1
