# Cached-input pricing: https://docs.mistral.ai/inference/pricing (2026-09-29)
schema = 2
name = "Mistral Small (latest)"
description = "Efficient Mistral model for fast chat, extraction, and production assistants"
family = "mistral-small"
open_weights = true
knowledge = "2025-06"
release_date = "2026-03-16"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "high"] }
temperature = true

[limit]
context = 262_144
output = 256_000

[cost.text.input]
price = 0.15
cache = { read = 0.015 }

[cost.text.output]
price = 0.6
