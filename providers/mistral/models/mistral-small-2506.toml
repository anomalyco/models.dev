# Image input: https://docs.mistral.ai/models/mistral-small-3-2-25-06 lists text and image input, so attachment is true.
# Image formats: https://docs.mistral.ai/studio/conversations/vision (PNG, JPEG, WEBP, non-animated GIF)
# Sampling: the chat API takes temperature and top_p but has no top_k (https://docs.mistral.ai/api/endpoint/chat).
schema = 2
name = "Mistral Small 3.2"
description = "Efficient Mistral model for fast chat, extraction, and production assistants"
family = "mistral-small"
open_weights = true
knowledge = "2025-03"
release_date = "2025-06-20"
status = "deprecated"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = false

[limit]
context = 128_000
output = 16_384

[cost.text.input]
price = 0.1

[cost.text.output]
price = 0.3
