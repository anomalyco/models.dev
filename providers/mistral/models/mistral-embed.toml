# Model: https://docs.mistral.ai/models/mistral-embed-23-12 (embedding model on POST /v1/embeddings; API IDs
# mistral-embed-2312, mistral-embed; $0.1 per MTok input).
schema = 2
type = "embedding"
name = "Mistral Embed"
description = "Embedding model for semantic search, retrieval, clustering, and ranking pipelines"
family = "mistral-embed"
open_weights = false
release_date = "2023-12-11"

[modalities]
input = ["text"]
