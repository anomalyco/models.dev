# Image input: https://docs.mistral.ai/models/devstral-small-2-25-12 lists text and image input, so attachment is true.
# Image formats: https://docs.mistral.ai/studio/conversations/vision (PNG, JPEG, WEBP, non-animated GIF)
# Sampling: the chat API takes temperature and top_p but has no top_k (https://docs.mistral.ai/api/endpoint/chat).
# tools.updates: adding or removing a tool busts the cache; tools render before the conversation (live 2026-10-22).
schema = 2
name = "Devstral Small 2"
description = "Legacy model retained for compatibility with older integrations"
family = "devstral"
open_weights = true
knowledge = "2025-12"
release_date = "2025-12-09"
status = "deprecated"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = false

[limit]
context = 256_000
output = 256_000

[cost.text.input]
price = 0

[cost.text.output]
price = 0
