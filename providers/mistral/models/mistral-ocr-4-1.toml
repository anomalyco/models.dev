# Sources:
#   GET https://api.mistral.ai/v1/models (mistral-ocr-4-1; served on POST /v1/ocr)
#   https://docs.mistral.ai/models/ocr-4-1 and https://docs.mistral.ai/inference/pricing ($4 per 1,000 pages, $5 per 1,000 annotated pages)
# No [cost]: OCR is billed per page, which the cost schema has no unit for.
# APIs: the /v1/models capabilities (completion_fim: POST /v1/fim/completions; moderation: /v1/moderations; ocr: /v1/ocr), https://docs.mistral.ai/api. No AI SDK or OpenCode package calls them.
schema = 2
v2_only = true
base_model = "mistral/mistral-ocr-4-1"

[api.ocr]
sdk = { aisdk = "none", opencodeai = "none" }
