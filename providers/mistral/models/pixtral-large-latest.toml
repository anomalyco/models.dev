# Image formats: https://docs.mistral.ai/studio/conversations/vision (PNG, JPEG, WEBP, non-animated GIF)
# Sampling: the chat API takes temperature and top_p but has no top_k (https://docs.mistral.ai/api/endpoint/chat).
schema = 2
name = "Pixtral Large (latest)"
description = "Mistral's larger vision model for document-heavy image understanding and chat"
family = "pixtral"
open_weights = true
knowledge = "2024-11"
release_date = "2024-11-01"
last_updated = "2024-11-04"
status = "deprecated"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = false

[limit]
context = 128_000
output = 128_000

[cost.text.input]
price = 2

[cost.text.output]
price = 6
