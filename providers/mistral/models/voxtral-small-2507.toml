# Sources (Mistral first-party, accessed 2026-10-06):
#   https://docs.mistral.ai/models/voxtral-small-25-07 — model ID voxtral-small-2507, 32k context, $0.1/M input + $0.4/M output + $0.004/min audio
#   https://mistral.ai/news/voxtral/ — July 15 2025 release, 24B Apache 2.0, audio understanding + function calling
#   https://huggingface.co/mistralai/Voxtral-Small-24B-2507 — open weights, 32k native (32768 positions)
# Audio billed per minute ($0.004/min) is not modeled in schema; [cost] covers text tokens only.
schema = 2
name = "Voxtral Small"
description = "Instruct model with native audio input for speech understanding and tool use"
family = "voxtral"
open_weights = true
release_date = "2025-07-15"

[modalities]
input = ["text", "audio"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true

[limit]
context = 32_768
output = 32_000

[cost.text.input]
price = 0.1

[cost.text.output]
price = 0.4
