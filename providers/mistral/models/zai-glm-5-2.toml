# Source: https://docs.mistral.ai/models/zai-glm-5-2 (accessed 2026-08-26)
# Effort: reasoning_effort = none|high|max. Verified live 2026-09-17: none
# disables thinking; low|medium map to high, xhigh maps to max (GLM-5.2 native
# mapping). Model reasons by default (default effort: max).
base_model = "zhipuai/glm-5.2"
status = "deprecated"

[[reasoning_options]]
type = "effort"
values = ["none", "high", "max"]

[cost]
input = 1.4
output = 4.4
cache_read = 0.14

[limit]
context = 1_048_576
