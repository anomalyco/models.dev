# Reasoning: https://docs.mistral.ai/studio/conversations/reasoning (reasoning_effort none = minimal/plain string, high = full thinking chunk)
# API reference: https://docs.mistral.ai/api/ (reasoning_effort = none|minimal|low|medium|high|xhigh)
# Effort: reasoning_effort = none|high — sync live rejection probe lists none|high; matches peers mistral-medium-latest, mistral-small-latest, mistral-large-4
# Lifecycle: https://docs.mistral.ai/models/magistral-medium-1-2-25-09 (Magistral Medium 1.2 deprecated 2026-05-22, retired
# 2026-07-31). /v1/models now lists magistral-medium-latest as an alias of mistral-medium-latest (Medium 3.5).
# Mid-conversation (live 2026-10-19 on this alias): a late system message is accepted in place, keeps the cached prefix
# and is obeyed; changing tools between requests drops the cache after the system prompt (live 2026-10-22); switching
# reasoning_effort drops the whole cached prefix (live 2026-10-23: 0 cached tokens none<->high). Caching:
# https://docs.mistral.ai/studio/conversations/advanced/prompt-caching (automatic, 64-token blocks, prompt_cache_key).
# Tools: https://docs.mistral.ai/api/endpoint/chat (tool_choice auto|none|any|required or a named function; function.strict).
#   strict + a named tool_choice were accepted live for this ID on 2026-10-24 (retired IDs are served by their successor).
schema = 2
name = "Magistral Medium (latest)"
description = "Mistral reasoning model for transparent analysis, math, and complex decisions"
family = "magistral-medium"
open_weights = true
knowledge = "2025-06"
release_date = "2025-03-17"
last_updated = "2025-03-20"
status = "deprecated"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["none", "high"] }
temperature = true
top_p = true
top_k = false
system_updates = true
stream_usage = true
prompt_cache_key = true
cache = { implicit = { min_tokens = 64 } }

[limit]
context = 262_144
output = 16_384

[cost.text.input]
price = 2

[cost.text.output]
price = 5
