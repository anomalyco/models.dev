# Sampling: the chat API takes temperature and top_p but has no top_k (https://docs.mistral.ai/api/endpoint/chat).
schema = 2
name = "Mistral Nemo"
description = "Efficient Mistral-NVIDIA open model for multilingual chat and local deployment"
family = "mistral-nemo"
open_weights = true
knowledge = "2024-07"
release_date = "2024-07-01"
status = "deprecated"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = false

[limit]
context = 128_000
output = 128_000

[cost.text.input]
price = 0.15

[cost.text.output]
price = 0.15
