# Sources:
#   GET https://api.mistral.ai/v1/models (mistral-ocr-2512; served on POST /v1/ocr)
#   https://docs.mistral.ai/models/ocr-3-25-12 ($2 per 1,000 pages, $3 per 1,000 annotated pages) and
#     https://docs.mistral.ai/inference/pricing ($2 per 1,000 pages), both accessed 2026-11-11
# Cost: USD per page (the per-1,000-page prices / 1,000); annotated pages are pages of a request that sets
#   bbox_annotation_format or document_annotation_format. Not modeled: the pricing page's "Cached input" column
#   ($0.2 per 1,000 pages), which no Mistral page explains for OCR.
# APIs: the /v1/models capabilities (completion_fim: POST /v1/fim/completions; moderation: /v1/moderations; ocr: /v1/ocr), https://docs.mistral.ai/api. No AI SDK or OpenCode package calls them.
schema = 2
v2_only = true
base_model = "mistral/mistral-ocr-2512"

[api.ocr]
sdk = { aisdk = "none", opencodeai = "none" }

[cost.text.input]
unit = "page"
price = 0.002

[[cost.text.input.overrides]]
when = { annotation = { equals = true } }
price = 0.003
