# Source: https://docs.mistral.ai/models/zai-glm-5-2 (accessed 2026-10-19; deprecated 2026-09-29, retires 2026-10-31).
# /v1/models lists glm-5-2 as the canonical row, with zai-glm-5-2 as its alias (max_context_length 1048576).
# Pricing: $1.4 input / $0.14 cached / $4.4 output per MTok per Mistral docs.
# Effort: reasoning_effort = none|high|max, same native mapping as the zai-glm-5-2 alias. Live 2026-10-19: no
# thinking when reasoning_effort is omitted.
# Mistral API (api.mistral.ai), docs and live checks 2026-10-19:
# - Prompt caching: https://docs.mistral.ai/studio/conversations/advanced/prompt-caching (automatic prefix
#   cache in 64-token blocks, no write price, optional prompt_cache_key). Usage is reported when streaming.
# - Tools: https://docs.mistral.ai/api/endpoint/chat (tool_choice auto|none|any|required or a named
#   function; function.strict). All five tool_choice forms worked live.
# - Structured output: json_schema response_format returned schema-valid JSON live (model page lists it).
# - Mid-conversation (live): a system message after the first assistant turn is accepted in place,
#   keeps the cached prefix and is obeyed. Adding or removing tools between requests
#   drops the cache after the system prompt (live 2026-10-22). Switching reasoning_effort between turns drops it (cached_tokens 0 after each switch).
schema = 2
base_model = "zhipuai/glm-5.2"
status = "deprecated"

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["none", "high", "max"] }
structured_output = true
system_updates = true
stream_usage = true
prompt_cache_key = true
cache = { implicit = { min_tokens = 64 } }

[limit]
context = 1_048_576

[cost.text.input]
price = 1.4
cache = { read = 0.14 }

[cost.text.output]
price = 4.4
