# Prompt cache: automatic prefix cache with per-model cache_hit and cache_create pricing.
# Use body: none; chat schema lists model, messages, stream, temperature, max_tokens, and tools only.
# Use headers: none.
# Prefix/TTL/cost: repeat identical prefix; Cache Read and Cache Write rates per model; no published minimum or expiry.
# Docs: https://hyper.charm.land/docs/api/openai-chat-completions.html
name = "Charm Hyper"
env = ["HYPER_API_KEY"]
npm = "@ai-sdk/openai-compatible"
# Raw HTTP endpoint map (source accessed 2026-07-21): Hyper uses POST
# `/v1/chat/completions` for OpenAI-compatible models, `/v1/responses` for
# OpenAI Responses, and `/v1/messages` for Anthropic-compatible models.
# GET `/v1/models` advertises `capabilities.vision`, optional `reasoning`
# with `effort_levels`, and per-1M `pricing.input`/`output`/`cache_hit`/
# `cache_create`.
# https://hyper.charm.land/v1/models
api = "https://hyper.charm.land/v1"
doc = "https://hyper.charm.land"
