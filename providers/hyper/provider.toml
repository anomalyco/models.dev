name = "Charm Hyper"
env = ["HYPER_API_KEY"]
npm = "@ai-sdk/openai-compatible"
# Raw HTTP endpoint map (source accessed 2026-07-02): Hyper uses POST
# `/v1/chat/completions` for OpenAI-compatible models, `/v1/responses` for
# OpenAI Responses, and `/v1/messages` for Anthropic-compatible models.
# GET `/v1/models` advertises `supports_reasoning`, `supports_reasoning_effort`,
# and per-model `reasoning_effort_levels`; models without effort support expose
# reasoning as a toggle only.
# https://hyper.charm.land/v1/models
api = "https://hyper.charm.land/v1"
doc = "https://hyper.charm.land"
