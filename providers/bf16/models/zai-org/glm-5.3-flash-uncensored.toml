# Catalog & pricing: https://api.bf16.ai/v1/models and https://bf16.ai/models/glm-5-3-flash-uncensored (accessed 2026-11-19).
# Reasoning: reasoning_effort (Chat) / reasoning.effort (Responses) / output_config.effort (Messages) = low|high|max (matching Z.AI GLM-5.3 Flash and relay peer baseline).
# Tools: inherited from base_model (tools.supported = true); strict and per-API tool_choice omitted without per-surface probing.
# Output cap: POST /v1/chat/completions accepts OpenAI max_completion_tokens (preferred; takes precedence over legacy max_tokens) per https://raw.githubusercontent.com/BF16-AI/bf16-openapi/main/openapi.yaml (ChatCompletionRequest).
# Input modalities: bf16.ai vision gateway accepts inline base64 image/jpeg, image/png, image/gif, and image/webp (normalized in memory; video, PDF, BMP, and HEIC/HEIF are not accepted) per https://raw.githubusercontent.com/BF16-AI/bf16-openapi/main/openapi.yaml (ChatMessage).
schema = 2
base_model = "zhipuai/glm-5.3-flash"
name = "GLM-5.3 Flash Vision (Uncensored)"
description = "Multimodal uncensored variant of GLM-5.3 Flash hosted by bf16.ai with 1M context window, vision input, and structured outputs."

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }
stream_usage = true

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.3
cache = { read = 0.065 }

[cost.text.output]
price = 1.12
