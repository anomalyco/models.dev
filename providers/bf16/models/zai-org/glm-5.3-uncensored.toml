# Catalog & pricing: https://api.bf16.ai/v1/models and https://bf16.ai/models/glm-5-3-uncensored (accessed 2026-11-19).
# Reasoning: reasoning_effort (Chat) / reasoning.effort (Responses) / output_config.effort (Messages) = low|high|max (matching Z.AI GLM-5.3 and relay peer baseline).
# Tools: inherited from base_model (tools.supported = true); strict and per-API tool_choice omitted without per-surface probing.
schema = 2
base_model = "zhipuai/glm-5.3"
name = "GLM-5.3 Flagship (Uncensored)"
description = "Uncensored variant of GLM-5.3 hosted by bf16.ai for frontier coding, security analysis, and multi-step agent sessions."

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }
stream_usage = true

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 1.35
cache = { read = 0.25 }

[cost.text.output]
price = 4.2
