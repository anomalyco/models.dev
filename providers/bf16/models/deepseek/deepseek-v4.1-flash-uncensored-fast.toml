# Catalog & pricing: https://api.bf16.ai/v1/models and https://bf16.ai/models/deepseek-v4-1-flash-uncensored-fast (accessed 2026-11-22).
# Base weights: operator-confirmed DeepSeek-V4.1-Flash-1017 (October 17 build; catalog entry created 2026-11-14 in https://api.bf16.ai/v1/models). Because this unpinned wire id tracks the latest build, update base_model if DeepSeek ships a newer release.
# Reasoning: reasoning_effort (Chat) / reasoning.effort (Responses) = none|low|high|max (matching DeepSeek V4.1 Flash relay peer baseline; effort=none disables thinking).
# Tools: inherited from base_model (tools.supported = true); strict and per-API tool_choice omitted without per-surface probing.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"
name = "DeepSeek V4.1 Flash (Uncensored Fast)"
description = "Low-latency uncensored variant of DeepSeek V4.1 Flash hosted by bf16.ai (~155 tok/s) with 1M context window and vision input."

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true
cache = { implicit = true }
stream_usage = true

[limit]
context = 1_048_576
output = 130_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.28
cache = { read = 0.055 }

[cost.text.output]
price = 1.12
