# Catalog & pricing: https://api.bf16.ai/v1/models and https://bf16.ai/models/deepseek-v4-1-flash-uncensored (accessed 2026-11-22).
# Base weights: operator-confirmed DeepSeek-V4.1-Flash-1017 (October 17 build; catalog entry created 2026-11-12 in https://api.bf16.ai/v1/models). Because this unpinned wire id tracks the latest build, update base_model if DeepSeek ships a newer release.
# Reasoning: reasoning_effort (Chat) / reasoning.effort (Responses) = none|low|high|max (matching DeepSeek V4.1 Flash relay peer baseline; effort=none disables thinking).
# Tools: inherited from base_model (tools.supported = true); strict and per-API tool_choice omitted without per-surface probing.
# Output cap: POST /v1/chat/completions accepts OpenAI max_completion_tokens (preferred; takes precedence over legacy max_tokens) per https://raw.githubusercontent.com/BF16-AI/bf16-openapi/main/openapi.yaml (ChatCompletionRequest).
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"
name = "DeepSeek V4.1 Flash (Uncensored)"
description = "Uncensored variant of DeepSeek V4.1 Flash hosted by bf16.ai with 1M context window, vision input, and structured outputs."

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true
cache = { implicit = true }
stream_usage = true

[limit]
context = 1_048_576
output = 130_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.26
cache = { read = 0.045 }

[cost.text.output]
price = 1.0
