# API: Anthropic Messages, POST https://api.zurelay.com/v1/messages with x-api-key; cache_control, thinking
# and output_config pass through (https://zurelay.com/docs/anthropic, accessed 2026-11-15).
# Only Messages is listed. Zurelay also takes Claude on /v1/chat/completions, but documents cache_control
# caching (5m/1h writes) only on Messages, and the explicit cache below doesn't hold on chat completions.
# Live 2026-11-15: a 15,492-token system prompt with cache_control, sent twice, read 0 tokens from the cache on
# /v1/chat/completions (no cache write reported either); on /v1/messages it was written, then read (15,458 tokens).
# PDFs: not read on /v1/messages for this model (live 2026-11-15: a PDF document block was refused with
# "reads files through /v1/chat/completions"), so this Messages entry leaves them out.
# Inputs on this host: text, images, in the formats Zurelay takes
# (https://zurelay.com/docs/multimodal, accessed 2026-11-15).
# Effort: output_config.effort = low|medium|high|xhigh|max on POST /v1/messages.
# Levels: https://zurelay.com/docs/chat#reasoning (accessed 2026-11-15)
# Prices: https://zurelay.com/models/claude-opus-4-8 (USD per 1M tokens, accessed 2026-11-15).
# Cache read: 0.24 = cached_input_per_1m in https://zurelay.com/prices.json (accessed 2026-11-15). Zurelay sets
# its own cached price, so it isn't always the lab's ratio to input (here 10% of the 2.4 input price).
# Cache writes: 1.25x input for 5 minutes, 2x for 1 hour (https://zurelay.com/docs/anthropic#prompt-caching).
schema = 2
base_model = "anthropic/claude-opus-4-8"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
cache = { explicit = { ttl = ["5m", "1h"] } }

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 2.4
cache = { read = 0.24, write = { "5m" = 3, "1h" = 4.8 } }

[cost.text.output]
price = 12
