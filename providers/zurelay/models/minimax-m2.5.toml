# Always reasons; no reasoning control on this host (https://zurelay.com/docs/chat#reasoning, accessed 2026-11-15).
# Prices: https://zurelay.com/models/minimax-m2.5 (USD per 1M tokens, accessed 2026-11-15).
# Cache read: 0.01 = cached_input_per_1m in https://zurelay.com/prices.json (accessed 2026-11-15). Zurelay sets
# its own cached price, so it isn't always the lab's ratio to input (here 10% of the 0.1 input price).
schema = 2
base_model = "minimax/MiniMax-M2.5"

[capabilities]
reasoning = { supported = true }
cache = { implicit = true }

[cost.text.input]
price = 0.1
cache = { read = 0.01 }

[cost.text.output]
price = 0.39
