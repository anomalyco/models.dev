# Inputs on this host: text, images, PDFs, audio, in the formats Zurelay takes
# (https://zurelay.com/docs/multimodal, accessed 2026-11-15).
# Effort: reasoning_effort = low|medium|high on POST /v1/chat/completions; default medium.
# Levels: https://zurelay.com/docs/chat#reasoning (accessed 2026-11-15)
# Levels checked live 2026-11-15 with the x-zurelay-reasoning-effort response header, which names the level each
# request ran at (a level the model doesn't take runs at the closest one it does): none->low, minimal->low, low->low, medium->medium, high->high.
# Prices: https://zurelay.com/models/gemini-4-hydrogen (USD per 1M tokens, accessed 2026-11-15).
# Cache read: 0.03 = cached_input_per_1m in https://zurelay.com/prices.json (accessed 2026-11-15). Zurelay sets
# its own cached price, so it isn't always the lab's ratio to input (here 5% of the 0.6 input price).
schema = 2
base_model = "google/gemini-4-hydrogen"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"], default = { type = "effort", value = "medium" } }
cache = { implicit = true }

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "application/pdf", "audio/wav", "audio/mp3", "audio/mpeg"]
output = ["text"]

[cost.text.input]
price = 0.6
cache = { read = 0.03 }

[cost.text.output]
price = 3
