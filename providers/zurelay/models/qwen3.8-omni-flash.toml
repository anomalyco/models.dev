# Inputs on this host: text, images, video, in the formats Zurelay takes
# (https://zurelay.com/docs/multimodal, accessed 2026-11-15).
# Thinking is switched with reasoning_effort on this host; the lab's enable_thinking / thinking_budget fields aren't part of Zurelay's documented API.
# Effort: reasoning_effort = none|low|medium|xhigh on POST /v1/chat/completions; default xhigh.
# none turns thinking off (tested 2026-11-15: no reasoning came back with none, and it did without).
# Levels: https://zurelay.com/docs/chat#reasoning (accessed 2026-11-15)
# Prices (USD per 1M tokens): https://zurelay.com/models/qwen3.8-omni-flash. Input, output and cache read follow
# https://zurelay.com/prices.json (input_per_1m, output_per_1m, cached_input_per_1m), which the zurelay sync reads.
# Zurelay sets its own cached price, so the cache read isn't a fixed share of input.
schema = 2
base_model = "alibaba/qwen3.8-omni-flash"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp", "video/mp4", "video/quicktime"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "xhigh"], default = { type = "effort", value = "xhigh" } }
cache = { implicit = true }

[cost.text.input]
price = 0.075
cache = { read = 0.007 }

[cost.text.output]
price = 0.235
