# Effort: reasoning_effort = none|low|medium|xhigh on POST /v1/chat/completions.
# none turns thinking off; no reasoning comes back (tested 2026-10-14).
base_model = "alibaba/qwen3.8-omni-flash"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "xhigh"]

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[cost]
input = 0.075
output = 0.235
cache_read = 0.007
