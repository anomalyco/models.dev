# Effort: reasoning_effort = none|low|high|max on POST /v1/chat/completions; default high.
# none is sent upstream as thinking.type = disabled (tested 2026-11-15: no reasoning came back with none, and it did without).
# Levels: https://zurelay.com/docs/chat#reasoning (accessed 2026-11-15)
# Levels checked live 2026-11-15 with the x-zurelay-reasoning-effort response header, which names the level each
# request ran at (a level the model doesn't take runs at the closest one it does): none->none, low->low, medium->low, high->high, max->max.
# Prices: https://zurelay.com/models/deepseek-v4-pro-0813 (USD per 1M tokens, accessed 2026-11-15).
# Cache read: 0.00759 = cached_input_per_1m in https://zurelay.com/prices.json (accessed 2026-11-15). Zurelay sets
# its own cached price, so it isn't always the lab's ratio to input (here 3.3% of the 0.23 input price).
schema = 2
base_model = "deepseek/deepseek-v4-pro-0813"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"], default = { type = "effort", value = "high" } }
cache = { implicit = true }

[cost.text.input]
price = 0.23
cache = { read = 0.00759 }

[cost.text.output]
price = 0.62
