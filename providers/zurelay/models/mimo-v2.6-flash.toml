# Toggle: reasoning_effort = none turns thinking off; leave it out to think (tested 2026-10-14).
# thinking.type = disabled doesn't turn MiMo-V2.6-Flash off on this host.
base_model = "xiaomi/mimo-v2.6-flash"

[[reasoning_options]]
type = "toggle"

[limit]
context = 1_000_000
output = 131_072

[modalities]
input = ["text", "image", "audio"]
output = ["text"]

[cost]
input = 0.06
output = 0.12
cache_read = 0.0012
