# Effort: reasoning_effort = low|medium|high|xhigh|max on POST /v1/chat/completions.
base_model = "openai/gpt-6.1-sol"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh", "max"]

[cost]
input = 0.5
output = 2.5
cache_read = 0.025

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 1
output = 3.75
cache_read = 0.05
