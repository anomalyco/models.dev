# Effort: reasoning_effort = low|medium|high|xhigh|max on POST /v1/chat/completions; default medium.
# Levels: https://zurelay.com/docs/chat#reasoning (accessed 2026-11-03)
# Prices: https://zurelay.com/models/gpt-6.1-sol (USD per 1M tokens, accessed 2026-11-03).
# Prompts over 272,000 tokens: 2x every input price, 1.5x output, as the lab bills them.
schema = 2
base_model = "openai/gpt-6.1-sol"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"], default = { type = "effort", value = "medium" } }
cache = { implicit = true }

[cost.text.input]
price = 0.5
cache = { read = 0.025 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 1
cache = { read = 0.05 }

[cost.text.output]
price = 2.5

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 3.75
