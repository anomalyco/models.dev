# Muse Spark 1.3 at Meta's Contributor tier: Meta may use prompts and completions to train its models.
# https://zurelay.com/models/muse-spark-1.3-contributor
# Inputs on this host: text, images, PDFs, in the formats Zurelay takes
# (https://zurelay.com/docs/multimodal, accessed 2026-11-03).
# Effort: reasoning_effort = minimal|low|medium|high|xhigh on POST /v1/chat/completions; default medium.
# Levels: https://zurelay.com/docs/chat#reasoning (accessed 2026-11-03)
# Prices: https://zurelay.com/models/muse-spark-1.3-contributor (USD per 1M tokens, accessed 2026-11-03).
schema = 2
base_model = "meta/muse-spark-1.3"
name = "Muse Spark 1.3 (Contributor)"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh"], default = { type = "effort", value = "medium" } }
cache = { implicit = true }

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[cost.text.input]
price = 0.04
cache = { read = 0.001 }

[cost.text.output]
price = 0.08
