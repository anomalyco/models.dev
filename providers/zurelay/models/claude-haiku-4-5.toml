# API: Anthropic Messages, POST https://api.zurelay.com/v1/messages with x-api-key; cache_control, thinking
# and output_config pass through (https://zurelay.com/docs/anthropic, accessed 2026-11-03).
# Thinking budget tested 2026-11-03 on /v1/messages: budget_tokens = 1024 returned a thinking block.
# Budget: thinking = { type = "enabled", budget_tokens } on POST /v1/messages; leave it out for no thinking.
# Prices: https://zurelay.com/models/claude-haiku-4-5 (USD per 1M tokens, accessed 2026-11-03).
# Cache writes: 1.25x input for 5 minutes, 2x for 1 hour (https://zurelay.com/docs/anthropic#prompt-caching).
schema = 2
base_model = "anthropic/claude-haiku-4-5"

[capabilities]
reasoning = { supported = true, budget = { min = 1_024 } }
cache = { explicit = { ttl = ["5m", "1h"] } }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.54
cache = { read = 0.054, write = { "5m" = 0.675, "1h" = 1.08 } }

[cost.text.output]
price = 2.7
