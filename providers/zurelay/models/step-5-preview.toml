# Inputs on this host: text, images, in the formats Zurelay takes
# (https://zurelay.com/docs/multimodal, accessed 2026-11-03).
# Effort: reasoning_effort = low|medium|high on POST /v1/chat/completions; default medium.
# Levels: https://zurelay.com/docs/chat#reasoning (accessed 2026-11-03)
# Prices: https://zurelay.com/models/step-5-preview (USD per 1M tokens, accessed 2026-11-03).
schema = 2
base_model = "stepfun/step-5-preview"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"], default = { type = "effort", value = "medium" } }
cache = { implicit = true }

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[cost.text.input]
price = 0.25
cache = { read = 0.025 }

[cost.text.output]
price = 0.68
