# Toggle: reasoning_effort = none turns thinking off;
# any other level, or leaving it out, thinks (tested 2026-11-15: no reasoning came back with none, and it did without).
# https://zurelay.com/docs/chat#reasoning (accessed 2026-11-15)
# Levels checked live 2026-11-15 with the x-zurelay-reasoning-effort response header, which names the level each
# request ran at (a level the model doesn't take runs at the closest one it does): none->none, high->high.
# Prices (USD per 1M tokens): https://zurelay.com/models/hy4-preview. Input, output and cache read follow
# https://zurelay.com/prices.json (input_per_1m, output_per_1m, cached_input_per_1m), which the zurelay sync reads.
# Zurelay sets its own cached price, so the cache read isn't a fixed share of input.
schema = 2
base_model = "tencent/hy4-preview"

[capabilities]
reasoning = { supported = true, toggle = true, default = { type = "toggle", value = true } }
cache = { implicit = true }

[cost.text.input]
price = 0.4
cache = { read = 0.02 }

[cost.text.output]
price = 1.2
