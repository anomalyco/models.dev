# API: Anthropic Messages, POST https://api.zurelay.com/v1/messages with x-api-key; cache_control, thinking
# and output_config pass through (https://zurelay.com/docs/anthropic, accessed 2026-11-03).
# PDFs: Zurelay reads them for this model only through /v1/chat/completions, so they're left out here.
# Inputs on this host: text, images, in the formats Zurelay takes
# (https://zurelay.com/docs/multimodal, accessed 2026-11-03).
# Effort: output_config.effort = low|medium|high|xhigh|max on POST /v1/messages (Zurelay maps reasoning_effort the same way).
# Levels: https://zurelay.com/docs/chat#reasoning (accessed 2026-11-03)
# Prices: https://zurelay.com/models/claude-opus-5 (USD per 1M tokens, accessed 2026-11-03).
# Cache writes: 1.25x input for 5 minutes, 2x for 1 hour (https://zurelay.com/docs/anthropic#prompt-caching).
schema = 2
base_model = "anthropic/claude-opus-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
cache = { explicit = { ttl = ["5m", "1h"] } }

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 1.75
cache = { read = 0.175, write = { "5m" = 2.1875, "1h" = 3.5 } }

[cost.text.output]
price = 8.75
