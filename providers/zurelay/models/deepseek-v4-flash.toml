# Effort: reasoning_effort = none|low|high|max on POST /v1/chat/completions; none turns thinking off.
base_model = "deepseek/deepseek-v4-flash"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "high", "max"]

[modalities]
input = ["text", "image"]
output = ["text"]

[cost]
input = 0.03
output = 0.12
cache_read = 0.00074
