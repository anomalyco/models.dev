# Inputs on this host: text, images, PDFs, audio, video, in the formats Zurelay takes
# (https://zurelay.com/docs/multimodal, accessed 2026-11-03).
# Effort: reasoning_effort = minimal|low|medium|high on POST /v1/chat/completions; default minimal.
# Levels: https://zurelay.com/docs/chat#reasoning (accessed 2026-11-03)
# Prices: https://zurelay.com/models/gemini-3.5-flash-lite (USD per 1M tokens, accessed 2026-11-03).
schema = 2
base_model = "google/gemini-3.5-flash-lite"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"], default = { type = "effort", value = "minimal" } }
cache = { implicit = true }

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "application/pdf", "audio/wav", "audio/mp3", "audio/mpeg", "video/mp4", "video/mov", "video/webm"]
output = ["text"]

[cost.text.input]
price = 0.12
cache = { read = 0.012 }

[cost.text.output]
price = 1.04
