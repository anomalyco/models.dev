# Inputs on this host: text, images, PDFs, audio, video, in the formats Zurelay takes
# (https://zurelay.com/docs/multimodal, accessed 2026-11-03).
# Effort: reasoning_effort = low|medium|high on POST /v1/chat/completions; default high.
# Levels: https://zurelay.com/docs/chat#reasoning (accessed 2026-11-03)
# Prices: https://zurelay.com/models/gemini-3.1-pro (USD per 1M tokens, accessed 2026-11-03).
schema = 2
base_model = "google/gemini-3.1-pro-preview"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"], default = { type = "effort", value = "high" } }
cache = { implicit = true }

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "application/pdf", "audio/wav", "audio/mp3", "audio/mpeg", "video/mp4", "video/mov", "video/webm"]
output = ["text"]

[cost.text.input]
price = 0.5
cache = { read = 0.08 }

[cost.text.output]
price = 3.45
