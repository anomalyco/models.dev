# Inputs on this host: text, images, video, in the formats Zurelay takes
# (https://zurelay.com/docs/multimodal, accessed 2026-11-15).
# Toggle: reasoning_effort = none turns thinking off (Zurelay sends thinking.type = disabled upstream);
# any other level, or leaving it out, thinks (tested 2026-11-15: no reasoning came back with none, and it did without).
# https://zurelay.com/docs/chat#reasoning (accessed 2026-11-15)
# Prices: https://zurelay.com/models/kimi-k2.6 (USD per 1M tokens, accessed 2026-11-15).
# Cache read: 0.05 = cached_input_per_1m in https://zurelay.com/prices.json (accessed 2026-11-15). Zurelay sets
# its own cached price, so it isn't always the lab's ratio to input (here 16.7% of the 0.3 input price).
schema = 2
base_model = "moonshotai/kimi-k2.6"

[capabilities]
reasoning = { supported = true, toggle = true, default = { type = "toggle", value = true } }
cache = { implicit = true }

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "video/mp4", "video/mov", "video/webm"]
output = ["text"]

[cost.text.input]
price = 0.3
cache = { read = 0.05 }

[cost.text.output]
price = 1.3
