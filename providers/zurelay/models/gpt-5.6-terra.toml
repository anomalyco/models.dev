# Effort: reasoning_effort = none|low|medium|high|xhigh|max on POST /v1/chat/completions; default medium.
# none turns thinking off (tested 2026-11-15: ~5 output tokens and no reasoning tokens with none; 35-63 reasoning tokens at high or above).
# Levels: https://zurelay.com/docs/chat#reasoning (accessed 2026-11-15)
# Tools: function tools only; tools.freeform is left out. Custom tools aren't supported on this host: live 2026-11-15,
# a custom tool in each format (text; regex ZZ[0-9]{3}; lark start: "ZZ" DIGIT DIGIT DIGIT) with tool_choice naming it,
# streamed and not, never reached the model (it replied that no such tool was available), while a function tool
# with a named tool_choice was called. Zurelay has no Responses API, so Chat Completions is the only API.
# Prices: https://zurelay.com/models/gpt-5.6-terra (USD per 1M tokens, accessed 2026-11-15).
# Cache read: 0.054 = cached_input_per_1m in https://zurelay.com/prices.json (accessed 2026-11-15). Zurelay sets
# its own cached price, so it isn't always the lab's ratio to input (here 10% of the 0.54 input price).
# Prompts over 272,000 tokens: 2x every input price, 1.5x output, as the lab bills them.
schema = 2
base_model = "openai/gpt-5.6-terra"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"], default = { type = "effort", value = "medium" } }
cache = { implicit = true }

[cost.text.input]
price = 0.54
cache = { read = 0.054 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 1.08
cache = { read = 0.108 }

[cost.text.output]
price = 3.26

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 4.89
