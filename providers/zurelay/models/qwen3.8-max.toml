# Inputs on this host: text, images, PDFs, video, in the formats Zurelay takes
# (https://zurelay.com/docs/multimodal, accessed 2026-11-15).
# Thinking is switched with reasoning_effort on this host; the lab's enable_thinking / thinking_budget fields aren't part of Zurelay's documented API.
# Effort: reasoning_effort = none|low|medium|xhigh on POST /v1/chat/completions; default xhigh.
# none turns thinking off (tested 2026-11-15: no reasoning came back with none, and it did without).
# Levels: https://zurelay.com/docs/chat#reasoning (accessed 2026-11-15)
# Prices: https://zurelay.com/models/qwen3.8-max (USD per 1M tokens, accessed 2026-11-15).
# Cache read: 0.15 = cached_input_per_1m in https://zurelay.com/prices.json (accessed 2026-11-15). Zurelay sets
# its own cached price, so it isn't always the lab's ratio to input (here 12.5% of the 1.2 input price).
schema = 2
base_model = "alibaba/qwen3.8-max"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "xhigh"], default = { type = "effort", value = "xhigh" } }
cache = { implicit = true }

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp", "application/pdf", "video/mp4", "video/quicktime"]
output = ["text"]

[cost.text.input]
price = 1.2
cache = { read = 0.15 }

[cost.text.output]
price = 3.6
