# Effort: reasoning_effort = none|low|medium|xhigh on POST /v1/chat/completions.
# none turns thinking off; no reasoning comes back (tested 2026-10-14).
# Modalities: this host also reads PDFs for this model, sent as file parts and checked
# with a code-word PDF (2026-10-01). https://zurelay.com/docs/chat
base_model = "alibaba/qwen3.8-flash"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "xhigh"]

[modalities]
input = ["text", "image", "pdf", "video"]
output = ["text"]

[cost]
input = 0.07
output = 0.22
cache_read = 0.007
