# Inputs on this host: text, images, in the formats Zurelay takes
# (https://zurelay.com/docs/multimodal, accessed 2026-11-15).
# Effort: reasoning_effort = low|medium|high|xhigh on POST /v1/chat/completions; default high.
# Levels: https://zurelay.com/docs/chat#reasoning (accessed 2026-11-15)
# Prices (USD per 1M tokens): https://zurelay.com/models/grok-4.7. Input, output and cache read follow
# https://zurelay.com/prices.json (input_per_1m, output_per_1m, cached_input_per_1m), which the zurelay sync reads.
# Zurelay sets its own cached price, so the cache read isn't a fixed share of input.
schema = 2
base_model = "xai/grok-4.7"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"], default = { type = "effort", value = "high" } }
cache = { implicit = true }

[cost.text.input]
price = 0.7
cache = { read = 0.175 }

[cost.text.output]
price = 2.1
