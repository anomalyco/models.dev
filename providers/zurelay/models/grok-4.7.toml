# Inputs on this host: text, images, in the formats Zurelay takes
# (https://zurelay.com/docs/multimodal, accessed 2026-11-15).
# Effort: reasoning_effort = low|medium|high|xhigh on POST /v1/chat/completions; default high.
# Levels: https://zurelay.com/docs/chat#reasoning (accessed 2026-11-15)
# Prices: https://zurelay.com/models/grok-4.7 (USD per 1M tokens, accessed 2026-11-15).
# Cache read: 0.175 = cached_input_per_1m in https://zurelay.com/prices.json (accessed 2026-11-15). Zurelay sets
# its own cached price, so it isn't always the lab's ratio to input (here 25% of the 0.7 input price).
schema = 2
base_model = "xai/grok-4.7"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"], default = { type = "effort", value = "high" } }
cache = { implicit = true }

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[cost.text.input]
price = 0.7
cache = { read = 0.175 }

[cost.text.output]
price = 2.1
