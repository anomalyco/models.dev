# API: Anthropic Messages, POST https://api.zurelay.com/v1/messages with x-api-key; cache_control, thinking
# and output_config pass through (https://zurelay.com/docs/anthropic, accessed 2026-11-03).
# Inputs on this host: text, images, in the formats Zurelay takes
# (https://zurelay.com/docs/multimodal, accessed 2026-11-03).
# No budget listed: thinking = { type = "enabled", budget_tokens = 1024 } returned no thinking block on this host (tested 2026-11-03), so only effort is listed.
# Effort: output_config.effort = low|medium|high|max on POST /v1/messages (Zurelay maps reasoning_effort the same way).
# Levels: https://zurelay.com/docs/chat#reasoning (accessed 2026-11-03)
# Prices: https://zurelay.com/models/claude-opus-4-6 (USD per 1M tokens, accessed 2026-11-03).
# Cache writes: 1.25x input for 5 minutes, 2x for 1 hour (https://zurelay.com/docs/anthropic#prompt-caching).
schema = 2
base_model = "anthropic/claude-opus-4-6"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "max"] }
cache = { explicit = { ttl = ["5m", "1h"] } }

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 2.4
cache = { read = 0.24, write = { "5m" = 3, "1h" = 4.8 } }

[cost.text.output]
price = 12
