# Effort: reasoning_effort = low|medium|high|max on POST /v1/chat/completions.
base_model = "anthropic/claude-opus-4-6"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "max"]

[modalities]
input = ["text", "image"]
