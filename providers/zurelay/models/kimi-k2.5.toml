# Inputs on this host: text, images, video, in the formats Zurelay takes
# (https://zurelay.com/docs/multimodal, accessed 2026-11-03).
# Toggle: reasoning_effort = none turns thinking off (Zurelay sends thinking.type = disabled upstream);
# any other level, or leaving it out, thinks (tested 2026-11-03: no reasoning came back with none, and it did without).
# https://zurelay.com/docs/chat#reasoning (accessed 2026-11-03)
# Prices: https://zurelay.com/models/kimi-k2.5 (USD per 1M tokens, accessed 2026-11-03).
schema = 2
base_model = "moonshotai/kimi-k2.5"

[capabilities]
reasoning = { supported = true, toggle = true, default = { type = "toggle", value = true } }
cache = { implicit = true }

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "video/mp4", "video/mov", "video/webm"]
output = ["text"]

[cost.text.input]
price = 0.2
cache = { read = 0.035 }

[cost.text.output]
price = 0.95
