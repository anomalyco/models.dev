# Effort: reasoning_effort = low|high|max on POST /v1/chat/completions; default max.
# Levels: https://zurelay.com/docs/chat#reasoning (accessed 2026-11-15)
# Prices: https://zurelay.com/models/glm-5.3 (USD per 1M tokens, accessed 2026-11-15).
# Cache read: 0.038 = cached_input_per_1m in https://zurelay.com/prices.json (accessed 2026-11-15). Zurelay sets
# its own cached price, so it isn't always the lab's ratio to input (here 10% of the 0.38 input price).
schema = 2
base_model = "zhipuai/glm-5.3"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"], default = { type = "effort", value = "max" } }
cache = { implicit = true }

[cost.text.input]
price = 0.38
cache = { read = 0.038 }

[cost.text.output]
price = 1.21
