# Inputs on this host: text, images, in the formats Zurelay takes
# (https://zurelay.com/docs/multimodal, accessed 2026-11-15).
# Effort: reasoning_effort = low|high|max on POST /v1/chat/completions; default max.
# Levels: https://zurelay.com/docs/chat#reasoning (accessed 2026-11-15)
# Prices: https://zurelay.com/models/kimi-k3 (USD per 1M tokens, accessed 2026-11-15).
# Cache read: 0.127 = cached_input_per_1m in https://zurelay.com/prices.json (accessed 2026-11-15). Zurelay sets
# its own cached price, so it isn't always the lab's ratio to input (here 10% of the 1.27 input price).
schema = 2
base_model = "moonshotai/kimi-k3"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"], default = { type = "effort", value = "max" } }
cache = { implicit = true }

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[cost.text.input]
price = 1.27
cache = { read = 0.127 }

[cost.text.output]
price = 6.37
