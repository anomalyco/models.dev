# Inputs on this host: text only, in the formats Zurelay takes
# (https://zurelay.com/docs/multimodal, accessed 2026-11-15).
# Effort: reasoning_effort = low|high|max on POST /v1/chat/completions; default max.
# Levels: https://zurelay.com/docs/chat#reasoning (accessed 2026-11-15)
# Prices: https://zurelay.com/models/glm-5.3-flash (USD per 1M tokens, accessed 2026-11-15).
# Cache read: 0.0116 = cached_input_per_1m in https://zurelay.com/prices.json (accessed 2026-11-15). Zurelay sets
# its own cached price, so it isn't always the lab's ratio to input (here 20% of the 0.058 input price).
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"], default = { type = "effort", value = "max" } }
cache = { implicit = true }

[modalities]
input = ["text"]
output = ["text"]

[cost.text.input]
price = 0.058
cache = { read = 0.0116 }

[cost.text.output]
price = 0.19
