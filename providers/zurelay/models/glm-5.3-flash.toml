# Effort: reasoning_effort = low|high|max on POST /v1/chat/completions.
# Modalities: text only on this host; an image gets 400 "doesn't read images" (tested 2026-10-14).
# attachment follows.
base_model = "zhipuai/glm-5.3-flash"
attachment = false

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[modalities]
input = ["text"]
output = ["text"]

[cost]
input = 0.06
output = 0.2
cache_read = 0.006
