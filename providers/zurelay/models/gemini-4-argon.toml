# Inputs on this host: text, images, PDFs, audio, video, in the formats Zurelay takes
# (https://zurelay.com/docs/multimodal, accessed 2026-11-15).
# Effort: reasoning_effort = low|medium|high on POST /v1/chat/completions; default medium.
# Levels: https://zurelay.com/docs/chat#reasoning (accessed 2026-11-15)
# Prices (USD per 1M tokens): https://zurelay.com/models/gemini-4-argon. Input, output and cache read follow
# https://zurelay.com/prices.json (input_per_1m, output_per_1m, cached_input_per_1m), which the zurelay sync reads.
# Zurelay sets its own cached price, so the cache read isn't a fixed share of input.
schema = 2
base_model = "google/gemini-4-argon"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "application/pdf", "audio/wav", "audio/mp3", "audio/mpeg", "video/mp4", "video/mov", "video/webm"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"], default = { type = "effort", value = "medium" } }
cache = { implicit = true }

[cost.text.input]
price = 0.8
cache = { read = 0.04 }

[cost.text.output]
price = 4
