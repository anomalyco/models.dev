# Toggle: thinking.type = enabled|disabled (also honored: enable_thinking true|false)
# Measured 2026-10-10 on api.atlascloud.ai: thinking disabled returned no reasoning_content in 5/5 runs, enabled/default in 5/5.
# reasoning_effort (low/high/max) is accepted but showed no measurable effect on reasoning length, so no effort option is claimed.
# Prices: GET https://api.atlascloud.ai/v1/models (pricing.prompt / completion / input_cache_read, per token x 1e6), read 2026-10-10.
base_model = "deepseek/deepseek-v4-pro"
reasoning_options = [{ type = "toggle" }]

[interleaved]
field = "reasoning_content"

[cost]
input = 1.68
output = 3.38
cache_read = 0.13
