# Sources (accessed 2026-11-10):
# - API: POST https://api.minimax.cn/v1/images/generations and POST https://api.minimax.cn/v1/images/edits
#   (https://minimax-zh-feat-h3image-release.mintlify.site/guides/image-generation)
# - Pricing: CNY per 1M tokens — text input 15, image input 10, image output 25
# CNY→USD rate: 6.686583, 2026-11-10, source: https://open.er-api.com/v6/latest/USD
schema = 2
v2_only = true
base_model = "minimax/MiniMax-H3-Image"

[api.images]
base_url = "https://api.minimax.cn/v1"
sdk = { aisdk = "none", opencodeai = "@opencode/ai/providers/openai-compatible/images" }

[cost.text.input]
price = 2.2433

[cost.image.input]
price = 1.4955

[cost.image.output]
price = 3.7388
