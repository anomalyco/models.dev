# Sources (accessed 2026-10-28):
# - API: POST https://api.minimax.cn/v1/image_generation (https://platform.minimaxi.com/docs/api-reference/image-generation-t2i)
# - Pricing: https://platform.minimaxi.com/docs/pricing/overview#图像 (CNY 0.025 per image for image-01 and image-01-live)
# CNY→USD rate: 6.681042, 2026-10-28, source: https://open.er-api.com/v6/latest/USD
schema = 2
v2_only = true
base_model = "minimax/image-01-live"

[api.images]
base_url = "https://api.minimax.cn/v1"
sdk = { aisdk = "none", opencodeai = "@opencode/ai/providers/minimax/images" }

[cost.image.output]
unit = "image"
price = 0.003742
