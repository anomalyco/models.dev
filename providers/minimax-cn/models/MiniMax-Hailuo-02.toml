# Sources (accessed 2026-11-12):
# - API: POST https://api.minimax.cn/v1/video_generation, text-to-video, image-to-video and first & last frame
#   (https://platform.minimaxi.com/docs/api-reference/video-generation-t2v, https://platform.minimaxi.com/docs/api-reference/video-generation-i2v,
#   https://platform.minimaxi.com/docs/api-reference/video-generation-fl2v)
# - Pricing (CNY per video): https://platform.minimaxi.com/docs/pricing/overview#models/video (listed under 历史模型):
#   768P 6s ¥2.00, 768P 10s ¥4.00, 1080P 6s ¥3.50, 512P 6s ¥0.60, 512P 10s ¥1.00 (512P is image-to-video only).
#   Recorded per second of output (price / duration). 1080P is 6s only (duration tables in the T2V, I2V and FL2V references).
# CNY→USD rate: 6.685797, 2026-11-12, source: https://open.er-api.com/v6/latest/USD
schema = 2
v2_only = true
base_model = "minimax/MiniMax-Hailuo-02"

[api.videos]
base_url = "https://api.minimax.cn"
path = "/v1/video_generation"
sdk = { aisdk = "none", opencodeai = "@opencode/ai/providers/minimax/videos" }

[cost.video.output]
unit = "second"
price = 0.049857

[[cost.video.output.overrides]]
when = { all = [{ resolution = { equals = "768P" } }, { duration = { equals = 10 } }] }
price = 0.059828

[[cost.video.output.overrides]]
when = { all = [{ resolution = { equals = "1080P" } }, { duration = { equals = 6 } }] }
price = 0.08725

[[cost.video.output.overrides]]
when = { resolution = { equals = "512P" } }
price = 0.014957
