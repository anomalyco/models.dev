# Sources (accessed 2026-10-19):
# - API: https://platform.minimaxi.com/docs/api-reference/text-anthropic-api, https://platform.minimaxi.com/docs/api-reference/text-chat-anthropic
# - Caching: https://platform.minimaxi.com/docs/api-reference/text-prompt-caching
# - Pricing: https://platform.minimaxi.com/docs/pricing/overview#models/text
# - Context: https://platform.minimaxi.com/docs/guides/text-generation lists 1,000,000 tokens; max_tokens up to 524,288.
# CNY per 1M tokens: ≤512k 2.10 in / 8.40 out / 0.42 cache read; >512k 4.20 / 16.80 / 0.84.
#   CNY→USD rate: 6.693661, 2026-10-19, source: https://open.er-api.com/v6/latest/USD
# Toggle: thinking.type = adaptive|disabled. On the Anthropic-compatible API thinking is off when
#   `thinking` is omitted; output_config.effort is ignored.
# Caching: automatic prefix cache from 512 input tokens; cache_control is not supported.
# tool_choice: only auto (ToolChoice schema); any/tool/none are accepted and ignored.
# Structured output: not documented; output_format/output_config.format are accepted but the
#   schema is not enforced.
# Mid-conversation: role "system" messages after the first turn are accepted in place and keep
#   the cache (the documented mid_conv_system block is accepted too). Changing the tool list drops
#   the cache (prefix order is tools → system → messages).
# Priority: service_tier = priority, billed at 1.5x standard (incl. cache reads).
# Live checks on api.minimax.io, 2026-10-19 (no api.minimax.cn key; the CN docs describe the same API).
schema = 2
name = "MiniMax-M3"
description = "MiniMax multimodal coding model for long-context reasoning and agent tasks"
family = "minimax"
open_weights = true
release_date = "2026-06-01"
last_updated = "2026-06-25"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "video/mp4", "video/x-msvideo", "video/quicktime", "video/x-matroska"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto"], updates = false }
reasoning = { supported = true, default = { type = "toggle", value = false }, toggle = true }
structured_output = false
temperature = true
top_p = true
top_k = false
system_updates = true
cache = { supported = true, implicit = { min_tokens = 512 }, explicit = false }
service_tier = ["priority"]

[limit]
context = 1_000_000
output = 524_288

[cost.text.input]
price = 0.3137
cache = { read = 0.0627 }

[[cost.text.input.overrides]]
when = { context = { gt = 512_000 } }
price = 0.6275
cache = { read = 0.1255 }

[cost.text.output]
price = 1.2549

[[cost.text.output.overrides]]
when = { context = { gt = 512_000 } }
price = 2.5098

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.5
