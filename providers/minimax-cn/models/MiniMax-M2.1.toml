# Listed as retired; still answers for existing keys (checked 2026-10-19)
#   (https://platform.minimaxi.com/docs/faq/models).
# Thinking is always on; thinking.type = disabled is accepted and ignored.
# Caching: cache_control (explicit) and, from M2.1, an automatic prefix cache from 512 input
#   tokens; M2 caches only with cache_control (checked live 2026-10-19).
# CNY per 1M tokens: 2.1 in / 8.4 out / 0.21 cache read / 2.625 cache write, from the CN price list
#   before M2.x was removed (https://web.archive.org/web/20260911060320/https://platform.minimaxi.com/docs/guides/pricing-paygo).
#   CNY→USD rate: 6.693661, 2026-10-19, source: https://open.er-api.com/v6/latest/USD
# Tools: tool_choice supports only auto (ToolChoice schema); no strict tool mode documented
#   (https://platform.minimaxi.com/docs/api-reference/text-chat-anthropic).
schema = 2
name = "MiniMax-M2.1"
description = "MiniMax model for chat, coding, office work, and agentic tasks"
family = "minimax"
open_weights = true
release_date = "2025-12-23"
status = "deprecated"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto"] }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = false
cache = { implicit = { min_tokens = 512 }, explicit = true }

[limit]
context = 204_800
output = 131_072

[api.messages]

[api.chat-completions]
base_url = "https://api.minimax.cn/v1"
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/minimax/chat" }
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
base_url = "https://api.minimax.cn/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/minimax/responses" }

[cost.text.input]
price = 0.3137
cache = { read = 0.0314, write = 0.3922 }

[cost.text.output]
price = 1.2549
