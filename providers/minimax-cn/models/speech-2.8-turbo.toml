# Sources (accessed 2026-11-12):
# - API: POST https://api.minimax.cn/v1/t2a_v2 (https://platform.minimax.io/docs/api-reference/speech-t2a-http); async long-form text uses the same price
# - Pricing (CNY): https://platform.minimaxi.com/docs/pricing/overview#models/speech (¥2.00 per 10,000 characters = ¥200 per 1M; one Chinese character counts as 2 characters)
# CNY→USD rate: 6.685797, 2026-11-12, source: https://open.er-api.com/v6/latest/USD
schema = 2
v2_only = true
base_model = "minimax/speech-2.8-turbo"

[api.speech]
base_url = "https://api.minimax.cn/v1"
path = "/t2a_v2"
sdk = { aisdk = "none", opencodeai = "none" }

[cost.text.input]
unit = "character"
price = 29.9142
