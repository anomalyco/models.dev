# Sources (accessed 2026-10-19):
# - API: https://platform.minimaxi.com/docs/api-reference/text-anthropic-api, https://platform.minimaxi.com/docs/api-reference/text-chat-anthropic
# - Caching: https://platform.minimaxi.com/docs/api-reference/text-prompt-caching
# - Pricing: https://platform.minimaxi.com/docs/pricing/overview#models/text
# CNY 1.00 in / 4.00 out / 0.10 cache read per 1M tokens; CNY→USD rate: 6.693661, 2026-10-19,
#   source: https://open.er-api.com/v6/latest/USD
# Effort: output_config.effort = low|medium|high|xhigh|max, default max. Thinking cannot be
#   disabled: thinking.type = disabled or effort none returns 400.
# Caching: automatic prefix cache from 512 input tokens; cache_control is not supported.
# max_tokens up to 524,288 (CreateMessageReq.max_tokens). service_tier is not supported.
# tool_choice: only auto (ToolChoice schema); any/tool/none are accepted and ignored.
# Structured output: not documented; output_format/output_config.format are accepted but the
#   schema is not enforced.
# Mid-conversation: role "system" messages after the first turn are accepted in place and keep
#   the cache (the documented mid_conv_system block is accepted too). Changing the tool list drops
#   the cache (prefix order is tools → system → messages).
#   Changing effort also drops the cache.
# Live checks on api.minimax.io, 2026-10-19 (no api.minimax.cn key; the CN docs describe the same API).
schema = 2
base_model = "minimax/MiniMax-M3.1-Flash"

[capabilities]
tools = { supported = true, choice = ["auto"], updates = false }
reasoning = { supported = true, default = { type = "effort", value = "max" }, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = false
system_updates = true
effort_updates = false
cache = { supported = true, implicit = { min_tokens = 512 }, explicit = false }

[limit]
output = 524_288

[cost.text.input]
price = 0.1494
cache = { read = 0.0149 }

[cost.text.output]
price = 0.5976
