# Clarifai's POST /v2/ext/openai/v1/chat/completions request surface documents
# no reasoning_effort field; upstream model support does not prove forwarding.
# https://docs.clarifai.com/compute/inference/open-ai
schema = 2
name = "GPT OSS 20B"
description = "Open-weight GPT model for self-hosted reasoning and instruction-following workloads"
family = "gpt-oss"
open_weights = true
release_date = "2025-08-05"
last_updated = "2025-12-12"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
temperature = true

[limit]
context = 131_072
output = 16_384

[cost.text.input]
price = 0.045

[cost.text.output]
price = 0.18
