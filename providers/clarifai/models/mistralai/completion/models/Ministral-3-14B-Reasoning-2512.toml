# Image MIME types: this file serves Mistral's Ministral 3 14B Reasoning 2512; formats are the lab's, per
#   https://docs.mistral.ai/studio/conversations/vision (PNG, JPEG, WEBP, non-animated GIF), as in
#   models/mistral/ministral-3-14b-instruct-2512.toml. Clarifai lists no chat formats, so it is assumed to relay the lab's.
schema = 2
name = "Ministral 3 14B Reasoning 2512"
description = "Compact Mistral model for edge, latency-sensitive, and cost-efficient workloads"
family = "ministral"
open_weights = true
knowledge = "2025-12"
release_date = "2025-12-01"
last_updated = "2025-12-12"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true

[limit]
context = 262_144
output = 262_144

[cost.text.input]
price = 2.5

[cost.text.output]
price = 1.7
