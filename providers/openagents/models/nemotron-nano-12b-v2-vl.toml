# Price source: OpenAgents gateway price table, GET /v1/models (https://api-gateway.openagents.org/v1/models, checked 2026-11-05), USD per 1M tokens.
# Media on this host: verified live with PNG images (2026-11-05); video is not expressible on the Anthropic Messages surface, so it is omitted.
# Reasoning toggle: Messages `thinking.type = enabled|disabled` (verified live on OpenAgents, 2026-11-05).
schema = 2
base_model = "nvidia/nemotron-nano-12b-v2-vl"

[modalities]
input = ["text","image/png","image/jpeg"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }

[cost.text.input]
price = 0.4

[cost.text.output]
price = 1.2

