# Price source: OpenAgents gateway price table, GET /v1/models (https://api-gateway.openagents.org/v1/models, checked 2026-11-05), USD per 1M tokens.
# Media on this host: verified live with PNG images (2026-11-05); video is not expressible on the Anthropic Messages surface and Anthropic document (PDF) blocks are rejected with HTTP 400 (checked 2026-11-05), so they are omitted.
# Toggle: `enable_thinking=true|false`; effort: `reasoning_effort=low|medium|xhigh`; budget: `thinking_budget=0..262144` (budget and effort are mutually exclusive).
schema = 2
base_model = "alibaba/qwen3.8-max"

[modalities]
input = ["text","image/bmp","image/jpeg","image/png","image/tiff","image/webp","image/heic"]
output = ["text"]

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "xhigh" }, toggle = true, effort = ["low", "medium", "xhigh"], budget = { min = 0, max = 262_144 } }

[cost.text.input]
price = 4

[cost.text.output]
price = 12

