# Price source: OpenAgents gateway price table, GET /v1/models (https://api-gateway.openagents.org/v1/models, checked 2026-11-05), USD per 1M tokens.
# Messages effort: `reasoning_effort = none|minimal|low|medium|high|xhigh|max` (Baseten Messages peer baseline).
schema = 2
base_model = "openai/gpt-oss-120b"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "medium" }, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 0.12

[cost.text.output]
price = 0.78

