# Price source: OpenAgents gateway price table, GET /v1/models (https://api-gateway.openagents.org/v1/models, checked 2026-11-05), USD per 1M tokens.
# Reasoning on this host: the gateway returns thinking blocks unconditionally and ignores the
# Anthropic thinking.type toggle (checked live 2026-11-05), so no caller control is published.
# Media on this host: verified live with PNG images (2026-11-05); audio (WAV) is rejected with HTTP 400 and video is not expressible on the Anthropic Messages surface (checked 2026-11-05), so they are omitted.
schema = 2
base_model = "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"

[modalities]
input = ["text","image/jpeg","image/png"]
output = ["text"]

[capabilities]
reasoning = { supported = true }

[cost.text.input]
price = 1

[cost.text.output]
price = 1.8

