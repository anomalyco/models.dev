# BeatAPI public retail pricing (USD per million tokens): https://api.beatapi.io/v1/pricing
# Source snapshot: 2026-09-28. Model ID: gpt-6-sol.
base_model = "openai/gpt-6-sol"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 0.8
output = 4
cache_read = 0.08
cache_write = 1

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 1.6
output = 6
cache_read = 0.16
cache_write = 2
