# BeatAPI public retail pricing (USD per million tokens): https://api.beatapi.io/v1/pricing
# Source snapshot: 2026-09-28. Model ID: gemini-3.1-pro-preview.
base_model = "google/gemini-3.1-pro-preview"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high"] }]

[cost]
input = 1
output = 6
cache_read = 0.1

[[cost.tiers]]
tier = { type = "context", size = 200_000 }
input = 2
output = 9
cache_read = 0.2
