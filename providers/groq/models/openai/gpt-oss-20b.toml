# Reasoning HTTP format (accessed 2026-06-25):
# POST https://api.groq.com/openai/v1/chat/completions
# JSON reasoning_effort: "low" | "medium" | "high".
# Sources: https://console.groq.com/docs/reasoning#options-for-reasoning-effort-gptoss
schema = 2
name = "GPT OSS 20B"
description = "Open-weight GPT model for self-hosted reasoning and instruction-following workloads"
family = "gpt-oss"
open_weights = true
release_date = "2025-08-05"
last_updated = "2025-09-25"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
temperature = true

[limit]
context = 131_072
output = 65_536

[cost.text.input]
price = 0.075
cache = { read = 0.0375 }

[cost.text.output]
price = 0.3
