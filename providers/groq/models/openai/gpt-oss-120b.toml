# Reasoning: Chat Completions `reasoning_effort` = low | medium | high
# (https://console.groq.com/docs/reasoning#options-for-reasoning-effort-gptoss); Responses `reasoning.effort`.
# Price: $0.15 input, $0.075 cached input, $0.60 output per 1M tokens (https://console.groq.com/docs/model/openai/gpt-oss-120b,
# GET /openai/v1/models). Output cap 65,536 (same pages); context 131,072 is the lab's.
# Cache: implicit prefix caching, on by default, 50% off cached input, expires after 2 hours without use
# (https://console.groq.com/docs/prompt-caching). Usage reports prompt_tokens_details.cached_tokens.
# Mid-conversation flags, live probes on Chat Completions (2026-10-21, ~1,550-token prefix in the first user message,
# notes/neon-groq-v2-2026-10-21/groq-probe-loop.ts). Hits are sparse on the free tier, so only misses between control hits count:
#   system_updates = false: a system message appended after the history read 0 cached tokens between two controls that read 1,536.
#   effort_updates = false: changing reasoning_effort low -> high read 0, between controls that read 1,536 (2 trials).
#   tools.updates is unset: adding a tool read 0 twice after a control hit, but the next control also missed.
# Flex: https://console.groq.com/docs/flex-processing (all models, paid customers, on-demand pricing).
# Responses: POST https://api.groq.com/openai/v1/responses ("all models support the Responses API", stateless; https://console.groq.com/docs/responses-api); returned 200 live (2026-10-22).
# Web search: built-in browser_search, Basic Search $5 per 1,000 requests (Visit Website $1 per 1,000 is not expressible) on the last published price list
#   (https://web.archive.org/web/20260804151728/https://groq.com/pricing, "Built-In Tools (GPT-OSS)"); supported models: https://console.groq.com/docs/browser-search.
schema = 2
base_model = "openai/gpt-oss-120b"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
cache = { implicit = { ttl = ["2h"] } }
service_tier = ["flex"]

[limit]
output = 65_536

[api.chat-completions]

[api.responses]
base_url = "https://api.groq.com/openai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.15
cache = { read = 0.075 }

[cost.text.output]
price = 0.6

[cost.web_search]
price = 5
