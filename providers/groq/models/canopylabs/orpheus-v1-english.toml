# Speech: POST https://api.groq.com/openai/v1/audio/speech (https://console.groq.com/docs/text-to-speech/orpheus):
# input up to 200 characters, response_format "wav" (the only supported format, same as the lab).
# Price: $22 per 1M characters (https://console.groq.com/docs/text-to-speech/orpheus, https://console.groq.com/docs/models;
# GET /openai/v1/models pricing.prompt = "0.000022" per character).
# Status: beta; listed under Preview Models on https://console.groq.com/docs/models.
schema = 2
base_model = "canopylabs/orpheus-v1-english"
name = "Canopy Labs Orpheus V1 English"
description = "Speech generation model for controllable voice, narration, and audio delivery"
status = "beta"

[cost.text.input]
unit = "character"
price = 22
