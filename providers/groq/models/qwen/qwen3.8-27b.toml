# Sources (accessed 2026-08-28):
# https://console.groq.com/docs/model/qwen/qwen3.8-27b
# https://console.groq.com/docs/models
# https://console.groq.com/docs/reasoning
# Effort: reasoning_effort = none|default|low|medium|high
# Pricing: $0.80/M input, $4.00/M output. Context 131,072 and max output 16,384 (model page, models page and
# GET /openai/v1/models context_window, accessed 2026-10-21). Up to 3 input images, 20 MB max file size.
# Modalities on Groq: text + images in, text out (no video).
# Status: beta; listed under Preview Models on https://console.groq.com/docs/models.
# Responses: POST https://api.groq.com/openai/v1/responses ("all models support the Responses API", stateless; https://console.groq.com/docs/responses-api); returned 200 live (2026-10-22).
schema = 2
base_model = "alibaba/qwen3.8-27b"
status = "beta"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "default", "low", "medium", "high"] }
structured_output = true

[limit]
context = 131_072
output = 16_384

[api.chat-completions]

[api.responses]
base_url = "https://api.groq.com/openai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.8

[cost.text.output]
price = 4
