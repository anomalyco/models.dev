# Sources (accessed 2026-08-28):
# https://console.groq.com/docs/model/qwen/qwen3.8-27b
# https://console.groq.com/docs/models
# https://console.groq.com/docs/reasoning
# Effort: reasoning_effort = none|default|low|medium|high
# Pricing: $0.80/M input, $4.00/M output. Context 131_042, max output 16_384.
# Modalities on Groq: text + images in, text out (no video). Preview model.
base_model = "alibaba/qwen3.8-27b"
reasoning_options = [{ type = "effort", values = ["none", "default", "low", "medium", "high"] }]

[cost]
input = 0.80
output = 4.00

[limit]
context = 131_042
output = 16_384

[modalities]
input = ["text", "image"]
output = ["text"]
