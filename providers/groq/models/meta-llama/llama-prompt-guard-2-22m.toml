# Chat Completions returns the attack probability as the message content (e.g. "0.9989951252937317"; tested 2026-10-21).
# Price: $0.03 input and output per 1M tokens (https://console.groq.com/docs/model/meta-llama/llama-prompt-guard-2-22m,
# GET /openai/v1/models). Limits: 512 / 512, same as the lab.
# Status: beta; listed under Preview Models on https://console.groq.com/docs/models.
# Flex: https://console.groq.com/docs/flex-processing (all models, paid customers, on-demand pricing).
schema = 2
base_model = "meta/llama-prompt-guard-2-22m"
description = "Safety model for policy screening, moderation, and risk-aware routing workflows"
status = "beta"

[capabilities]
service_tier = ["flex"]

[cost.text.input]
price = 0.03

[cost.text.output]
price = 0.03
