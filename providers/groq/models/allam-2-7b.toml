# ALLaM-2-7B is provided unbilled via the Groq developer tier: GET https://api.groq.com/openai/v1/models lists it with no
# pricing object (accessed 2026-10-21); it isn't on https://console.groq.com/docs/models.
# Limits: context_window 4096 and max_completion_tokens 4096, same as the lab.
# Flex: `service_tier: "flex"` is available for all models to paid customers at on-demand pricing
# (https://console.groq.com/docs/flex-processing, https://console.groq.com/docs/service-tiers).
schema = 2
base_model = "sdaia/allam-2-7b"

[capabilities]
service_tier = ["flex"]

[cost.text.input]
price = 0

[cost.text.output]
price = 0
