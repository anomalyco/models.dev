name = "Alibaba"
env = ["DASHSCOPE_API_KEY"]
npm = "@ai-sdk/openai-compatible"
opencodeai = "@opencode/ai/providers/alibaba/chat"
# Reasoning HTTP format (accessed 2026-06-25):
# OpenAI Chat: POST /compatible-mode/v1/chat/completions; top-level
# `enable_thinking` is true or false and `thinking_budget` is an integer token
# cap (Qwen3/Qwen3.5/Qwen3.6/Qwen3.7/Qwen3-VL thinking mode and Kimi;
# public docs say the default is the model maximum but do not publish bounds).
# Responses: POST /compatible-mode/v1/responses; `reasoning.effort` is none,
# minimal, low, medium (default), or high; no numeric thinking budget is accepted.
# Anthropic: POST /apps/anthropic/v1/messages; `thinking.type` is enabled or
# disabled and `thinking.budget_tokens` is an integer used only when enabled.
# `reasoning_effort` is high or max only for DeepSeek V4 Pro/Flash.
# DashScope text: POST /api/v1/services/aigc/text-generation/generation; put
# `enable_thinking` and `thinking_budget` under `parameters`, not at JSON root.
# Sources:
# https://www.alibabacloud.com/help/en/model-studio/deep-thinking
# https://www.alibabacloud.com/help/en/model-studio/compatibility-with-openai-responses-api
# https://www.alibabacloud.com/help/en/model-studio/anthropic-api-messages
# Tools (docs accessed 2026-10-26): tool_choice by API.
# - Chat Completions: auto, none, required and a named function. Qwen models don't support required
#   (https://www.alibabacloud.com/help/en/model-studio/qwen-function-calling,
#   https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions).
# - Responses: auto, none, and allowed_tools with mode required, which forces one named tool. A plain
#   required needs exactly one tool in the request ("Please set one tool" otherwise), so it isn't listed
#   (https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-responses).
# - Anthropic Messages: auto, any (required), none and tool
#   (https://www.alibabacloud.com/help/en/model-studio/anthropic-api-messages).
# Model files with several APIs set the values most of their APIs share and override the API that differs:
# Qwen gets auto|none|tool with required added on [api.messages]; DeepSeek, GLM and Kimi get all four with
# required removed on [api.responses]. In thinking mode, most Qwen models and kimi-k2.7-code reject required
# and named choices on every API (400 "does not support being set to required or object in thinking mode");
# they work with thinking off (enable_thinking = false, reasoning.effort = "none", thinking.type = "disabled").
# Live on dashscope-intl 2026-10-26: every multi-API model accepted them on every API it lists, except
# qwen3.8-2.4t-a95b, which always thinks and keeps auto|none. Qwen also accepted required on Chat Completions
# with thinking off, but the docs say it can't guarantee a call, so it isn't listed there.
# glm-5, kimi-k2.5, kimi-k2.6 and MiniMax-M2.5 aren't served on dashscope-intl, so they keep auto|none.
# Single-API (Chat Completions only) models still list auto|none. No strict flag for function tools is
# documented. Realtime models don't support tool_choice.
doc = "https://www.alibabacloud.com/help/en/model-studio/models"
api = "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
