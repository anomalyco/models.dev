# Sources (accessed 2026-08-04):
# https://www.qwencloud.com/models/qwen3.8-max
# https://docs.qwencloud.com/developer-guides/text-generation/thinking
# https://docs.qwencloud.com/developer-guides/getting-started/text-generation-models
# https://help.aliyun.com/zh/model-studio/model-pricing (Singapore: qwen3.8-max list)
# Toggle: enable_thinking true|false (hybrid)
# Effort: reasoning_effort = low|medium|xhigh (default xhigh); high accepted as alias → xhigh
# Budget: thinking_budget (0..262144) cannot be combined with reasoning_effort
# API: {"enable_thinking":true,"reasoning_effort":"medium"} or
# {"enable_thinking":true,"thinking_budget":16384}
# Pay-as-you-go on DashScope/QwenCloud (not Token Plan only). Cost USD/MTok from model page.
# v2 capabilities (accessed 2026-10-19): Chat API https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions (sampling, enable_thinking, thinking_budget, reasoning_effort, stream_options.include_usage);
# structured output https://www.alibabacloud.com/help/en/model-studio/json-mode; context cache https://www.alibabacloud.com/help/en/model-studio/context-cache (model lists per region, 1,024-token minimum, explicit: cache_control ephemeral, 5-minute TTL, up to 4 markers on system/user/assistant/tool messages; tool definitions count as part of the system message, so changing tools changes the prefix).
# Live on dashscope-intl.aliyuncs.com 2026-10-19: late system message accepted, obeyed and kept the explicit cache (in place); toggle and reasoning_effort changes missed the cache; adding tools missed the cache.
# effort_updates: left out. Live 2026-10-23 (~8k-token first user message): changing thinking_budget for one turn (100 <-> 2048) keeps the cache (6.7k-9.2k cached, same as the control; the 100 cap holds reasoning at 100 vs 150-226 tokens), but that's a top-level change, not an in-history effort message, so it doesn't count. Changing reasoning_effort (xhigh <-> low) or flipping enable_thinking drops it to 0.
# Explicit cache read: $0.17 per 1M (https://www.qwencloud.com/models/qwen3.8-max, accessed 2026-10-23).
# Web search: $10 per 1,000 calls in Singapore (agent policy, also the Responses and Anthropic web_search tool rate): https://www.alibabacloud.com/help/en/model-studio/web-search (accessed 2026-10-23).
# Per-API flags: system_updates sits on [api.chat-completions] only. The late system message was only checked on Chat Completions (2026-10-23 audit); the Responses and Anthropic-compatible Messages endpoints have no documented or tested in-place system message.
schema = 2
base_model = "alibaba/qwen3.8-max"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, default = { type = "effort", value = "xhigh" }, toggle = true, effort = ["low", "medium", "xhigh"], budget = { min = 0, max = 262_144 } }
structured_output = true
stream_usage = true
cache = { implicit = { min_tokens = 1_024 }, explicit = { ttl = ["5m"], max_breakpoints = 4, targets = ["system", "messages"], min_tokens = 1_024 } }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
capabilities = { system_updates = true }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/alibaba/responses" }

[api.messages]
base_url = "https://dashscope-intl.aliyuncs.com/apps/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/alibaba/messages" }

[cost.text.input]
price = 2
cache = { read = 0.25, write = 2.5, explicit = { read = 0.17 } }

[cost.text.output]
price = 6

[cost.web_search]
price = 10
