# Added as v2-only (served and listed on https://www.alibabacloud.com/help/en/model-studio/model-pricing, Singapore, accessed 2026-10-19).
# Capabilities: Chat API https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions; structured output https://www.alibabacloud.com/help/en/model-studio/json-mode; context cache https://www.alibabacloud.com/help/en/model-studio/context-cache (tool definitions count as part of the system message, so changing tools changes the prefix).
# Thinking only (deep-thinking doc); Effort: reasoning_effort = low|medium|xhigh (default xhigh); Budget: thinking_budget 0-262144, not combinable with reasoning_effort.
# Cache: explicit and implicit (context-cache model lists); prices below.
# Live on dashscope-intl.aliyuncs.com 2026-10-19: enable_thinking=false is rejected ("restricted to True"); late system message accepted, obeyed and kept the explicit cache; reasoning_effort changes missed it; adding tools missed it.
# effort_updates: left out. Live 2026-10-23 (~8k-token first user message): changing thinking_budget for one turn (100 <-> 2048) keeps the cache (6.7k-9.2k cached, same as the control; the 100 cap holds reasoning at 100 vs 150-226 tokens), but that's a top-level change, not an in-history effort message, so it doesn't count. Changing reasoning_effort (xhigh <-> low) drops it to 0.
# Web search: $10 per 1,000 calls in Singapore (agent policy, also the Responses and Anthropic web_search tool rate): https://www.alibabacloud.com/help/en/model-studio/web-search (accessed 2026-10-23).
# Cache prices (all input bands, same ratios per https://www.alibabacloud.com/help/en/model-studio/context-cache): implicit read 12.5%, explicit creation 125%, explicit read 8.5% of input (https://www.qwencloud.com/models/qwen3.8-2.4t-a95b, accessed 2026-10-23).
schema = 2
v2_only = true
base_model = "alibaba/qwen3.8-2.4t-a95b"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, default = { type = "effort", value = "xhigh" }, effort = ["low", "medium", "xhigh"], budget = { min = 0, max = 262_144 } }
structured_output = true
system_updates = true
stream_usage = true
cache = { implicit = { min_tokens = 1_024 }, explicit = { ttl = ["5m"], max_breakpoints = 4, targets = ["system", "messages"], min_tokens = 1_024 } }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/alibaba/responses" }

[api.messages]
base_url = "https://dashscope-intl.aliyuncs.com/apps/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/alibaba/messages" }

[cost.text.input]
price = 2
cache = { read = 0.25, write = 2.5, explicit = { read = 0.17 } }

[cost.text.output]
price = 6

[cost.web_search]
price = 10
