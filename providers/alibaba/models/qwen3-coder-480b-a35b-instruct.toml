# International (Singapore) deployment is tiered on input tokens per request;
# every token in a request bills at its tier's unit price.
# https://www.alibabacloud.com/help/en/model-studio/model-pricing (accessed 2026-08-26)
schema = 2
name = "Qwen3-Coder 480B-A35B Instruct"
description = "Open Qwen coding heavyweight for repository reasoning and agentic engineering"
family = "qwen"
open_weights = true
knowledge = "2025-04"
release_date = "2025-04"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true

[limit]
context = 262_144
output = 65_536

[cost.text.input]
price = 1.5

[[cost.text.input.overrides]]
when = { context = { gt = 32_000 } }
price = 2.7

[[cost.text.input.overrides]]
when = { context = { gt = 128_000 } }
price = 4.5

[cost.text.output]
price = 7.5

[[cost.text.output.overrides]]
when = { context = { gt = 32_000 } }
price = 13.5

[[cost.text.output.overrides]]
when = { context = { gt = 128_000 } }
price = 22.5
