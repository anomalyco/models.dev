# Status: retired on Model Studio international. Live 2026-10-19 the API answers 404 and the model is absent from https://www.alibabacloud.com/help/en/model-studio/model-pricing; retirement policy: https://www.alibabacloud.com/help/en/model-studio/model-depreciation
# Type: realtime (WebSocket) model, not served on chat completions.
# MIME types: images per the archived model page (https://web.archive.org/web/20251116211940/https://www.alibabacloud.com/help/en/model-studio/qwen3-livetranslate-flash-realtime: "streaming audio and image inputs", sent as input_image_buffer.append frames; JPG/JPEG per https://www.alibabacloud.com/help/en/model-studio/realtime); audio pcm16 in/out (audio/L16).
# `video` stays generic: the API takes video as a stream of JPEG frames (input_image_buffer.append) with no container format, so there is no video MIME type to list.
# API: wss://<host>/api-ws/v1/realtime?model=<id> (https://www.alibabacloud.com/help/en/model-studio/realtime)
schema = 2
type = "realtime"
name = "Qwen3-LiveTranslate Flash Realtime"
description = "Speech generation model for controllable voice, narration, and audio delivery"
family = "qwen"
open_weights = false
knowledge = "2024-04"
release_date = "2025-09-22"
status = "deprecated"

[modalities]
input = ["text", "image/jpeg", "audio/L16", "video"]
output = ["text", "audio/L16"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = true

[limit]
context = 53_248
output = 4_096

[api.realtime]
base_url = "wss://dashscope-intl.aliyuncs.com/api-ws/v1/realtime"
sdk = { aisdk = "none", opencodeai = "none" }

[cost.text.input]
price = 10

[cost.text.output]
price = 10

[cost.audio.input]
price = 10

[cost.audio.output]
price = 38
