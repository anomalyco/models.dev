# v2 capabilities (accessed 2026-10-19): Chat API https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions (sampling, enable_thinking, thinking_budget, reasoning_effort, stream_options.include_usage);
# structured output https://www.alibabacloud.com/help/en/model-studio/json-mode; context cache https://www.alibabacloud.com/help/en/model-studio/context-cache (model lists per region, 1,024-token minimum, explicit: cache_control ephemeral, 5-minute TTL, up to 4 markers on system/user/assistant/tool messages; tool definitions count as part of the system message, so changing tools changes the prefix).
# Live on dashscope-intl.aliyuncs.com 2026-10-19: late system message accepted and obeyed; not in the context-cache model lists and no cache hits observed.
# Re-checked live 2026-10-23 (~8k-token first user message): a late system message is accepted and followed; the control gets no cache hits (implicit or explicit), so there is no cached prefix to lose and system_updates stays.
# Input MIME types: https://www.alibabacloud.com/help/en/model-studio/vision (images, video) and https://www.alibabacloud.com/help/en/model-studio/qwen-omni (audio).
# Web search: $10 per 1,000 calls in Singapore (agent policy, also the Responses and Anthropic web_search tool rate): https://www.alibabacloud.com/help/en/model-studio/web-search (accessed 2026-10-23).
# Per-API flags: system_updates sits on [api.chat-completions] only. The late system message was only checked on Chat Completions (2026-10-23 audit); the Responses and Anthropic-compatible Messages endpoints have no documented or tested in-place system message.
# Tools: tool_choice auto|none on every API; no strict tool mode (sources in provider.toml).
schema = 2
name = "Qwen3.5 397B-A17B"
description = "Large open Qwen multimodal MoE for visual agents and long technical tasks"
family = "qwen"
open_weights = true
release_date = "2026-02-15"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic", "video/mp4", "video/x-msvideo", "video/x-matroska", "video/quicktime", "video/x-flv", "video/x-ms-wmv"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none"] }
reasoning = { supported = true, default = { type = "toggle", value = true }, toggle = true, budget = {} }
structured_output = true
temperature = true
top_p = true
top_k = true
stream_usage = true
cache = false

[limit]
context = 262_144
output = 65_536

[api.chat-completions]
capabilities = { system_updates = true }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/alibaba/responses" }

[api.messages]
base_url = "https://dashscope-intl.aliyuncs.com/apps/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/alibaba/messages" }

[cost.text.input]
price = 0.6

[cost.text.output]
price = 3.6

[cost.web_search]
price = 10
