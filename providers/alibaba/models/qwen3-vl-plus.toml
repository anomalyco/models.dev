# v2 capabilities (accessed 2026-10-19): Chat API https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions (sampling, enable_thinking, thinking_budget, reasoning_effort, stream_options.include_usage);
# structured output https://www.alibabacloud.com/help/en/model-studio/json-mode; context cache https://www.alibabacloud.com/help/en/model-studio/context-cache (model lists per region, 1,024-token minimum, explicit: cache_control ephemeral, 5-minute TTL, up to 4 markers on system/user/assistant/tool messages; tool definitions count as part of the system message, so changing tools changes the prefix).
# Live on dashscope-intl.aliyuncs.com 2026-10-19: late system message accepted and obeyed; no cache hit was observed for this model in two runs, so in-place and effort cache behavior are unconfirmed.
# Re-checked live 2026-10-23 (~8k-token first user message): a late system message is accepted and followed; the control gets no cache hits (implicit or explicit), so there is no cached prefix to lose and system_updates stays.
# Input MIME types: https://www.alibabacloud.com/help/en/model-studio/vision (images, video) and https://www.alibabacloud.com/help/en/model-studio/qwen-omni (audio).
# Thinking default: off (live 2026-10-19: no reasoning_content without enable_thinking; enable_thinking=true returns it).
# Prices (Singapore, USD): https://www.alibabacloud.com/help/en/model-studio/model-pricing (accessed 2026-10-19)
# Tiers: 0-32K $0.2/$1.6, 32K-128K $0.3/$2.4, 128K-256K $0.6/$4.8; one output price for thinking and non-thinking modes.
# Cache prices (all input bands, same ratios per https://www.alibabacloud.com/help/en/model-studio/context-cache): implicit read 20%, explicit creation 125%, explicit read 10% of input (https://www.qwencloud.com/models/qwen3-vl-plus, accessed 2026-10-23).
# Per-API flags: system_updates sits on [api.chat-completions] only. The late system message was only checked on Chat Completions (2026-10-23 audit); the Responses and Anthropic-compatible Messages endpoints have no documented or tested in-place system message.
# max_tokens_field: ignores max_completion_tokens, max_tokens caps output (live probe 2026-10-24); Model Studio lists it outside max_completion_tokens support (https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions)
schema = 2
name = "Qwen3-VL Plus"
description = "Qwen vision-language model for visual reasoning, documents, and agent tasks"
family = "qwen"
open_weights = false
knowledge = "2025-04"
release_date = "2025-09-23"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, default = { type = "toggle", value = false }, toggle = true, budget = {} }
structured_output = true
temperature = true
top_p = true
top_k = true
stream_usage = true
cache = { implicit = { min_tokens = 1_024 }, explicit = { ttl = ["5m"], max_breakpoints = 4, targets = ["system", "messages"], min_tokens = 1_024 } }

[limit]
context = 262_144
output = 32_768

[api.chat-completions]
capabilities = { system_updates = true }
compatibility = { max_tokens_field = "max_tokens" }

[api.messages]
base_url = "https://dashscope-intl.aliyuncs.com/apps/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/alibaba/messages" }

[cost.text.input]
price = 0.2
cache = { read = 0.04, explicit = { read = 0.02, write = 0.25 } }

[[cost.text.input.overrides]]
when = { context = { gt = 32_000 } }
price = 0.3
cache = { read = 0.06, explicit = { read = 0.03, write = 0.375 } }

[[cost.text.input.overrides]]
when = { context = { gt = 128_000 } }
price = 0.6
cache = { read = 0.12, explicit = { read = 0.06, write = 0.75 } }

[cost.text.output]
price = 1.6

[[cost.text.output.overrides]]
when = { context = { gt = 32_000 } }
price = 2.4

[[cost.text.output.overrides]]
when = { context = { gt = 128_000 } }
price = 4.8
