# v2 capabilities (accessed 2026-10-19): Chat API https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions (sampling, enable_thinking, thinking_budget, reasoning_effort, stream_options.include_usage);
# structured output https://www.alibabacloud.com/help/en/model-studio/json-mode; context cache https://www.alibabacloud.com/help/en/model-studio/context-cache (model lists per region, 1,024-token minimum, explicit: cache_control ephemeral, 5-minute TTL, up to 4 markers on system/user/assistant/tool messages; tool definitions count as part of the system message, so changing tools changes the prefix).
# Live on dashscope-intl.aliyuncs.com 2026-10-19: late system message accepted and obeyed; no cache hit was observed for this model in two runs, so in-place and effort cache behavior are unconfirmed.
# Input MIME types: https://www.alibabacloud.com/help/en/model-studio/vision (images, video) and https://www.alibabacloud.com/help/en/model-studio/qwen-omni (audio).
# Thinking default: off (live 2026-10-19: no reasoning_content without enable_thinking; enable_thinking=true returns it).
# Prices (Singapore, USD): https://www.alibabacloud.com/help/en/model-studio/model-pricing (accessed 2026-10-19)
# Tiers: 0-32K $0.2/$1.6, 32K-128K $0.3/$2.4, 128K-256K $0.6/$4.8; one output price for thinking and non-thinking modes.
schema = 2
name = "Qwen3-VL Plus"
description = "Qwen vision-language model for visual reasoning, documents, and agent tasks"
family = "qwen"
open_weights = false
knowledge = "2025-04"
release_date = "2025-09-23"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, default = { type = "toggle", value = false }, toggle = true, budget = {} }
structured_output = true
temperature = true
top_p = true
top_k = true
system_updates = true
stream_usage = true
cache = { implicit = { min_tokens = 1_024 }, explicit = { ttl = ["5m"], max_breakpoints = 4, targets = ["system", "messages"], min_tokens = 1_024 } }

[limit]
context = 262_144
output = 32_768

[cost.text.input]
price = 0.2

[[cost.text.input.overrides]]
when = { context = { gt = 32_000 } }
price = 0.3

[[cost.text.input.overrides]]
when = { context = { gt = 128_000 } }
price = 0.6

[cost.text.output]
price = 1.6

[[cost.text.output.overrides]]
when = { context = { gt = 32_000 } }
price = 2.4

[[cost.text.output.overrides]]
when = { context = { gt = 128_000 } }
price = 4.8
