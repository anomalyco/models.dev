# Sources (accessed 2026-09-15):
# https://www.qwencloud.com/models/kimi-k3 (Singapore/international pricing, limits)
# https://www.alibabacloud.com/help/en/model-studio/kimi-k3 (limits, capability table)
# https://www.alibabacloud.com/help/en/model-studio/kimi-api (thinking-only:
# enable_thinking cannot be disabled; no thinking_budget; no reasoning_effort;
# text+image input only, no video; reasoning_content streamed in deltas)
base_model = "moonshotai/kimi-k3"
reasoning_options = []

[interleaved]
field = "reasoning_content"

[cost]
input = 3
output = 15
cache_read = 0.3

[modalities]
input = ["text", "image"]

[limit]
output = 1_048_576
