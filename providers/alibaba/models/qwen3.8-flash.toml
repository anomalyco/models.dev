# Sources (accessed 2026-08-28):
# https://www.qwencloud.com/models/qwen3.8-flash
# Pricing: $0.15 input / $0.47 output / cache read $0.016 / cache create $0.2
# per 1M tokens, flat. (Release blog quotes ~$0.16 input; model page prevails.)
# Toggle: enable_thinking true|false (hybrid)
# Effort: reasoning_effort = low|medium|xhigh (not yet in the API reference; see
# the Qwen3.8-Flash-Next release blog)
# Budget: thinking_budget (Max Reasoning 262K)
# v2 capabilities (accessed 2026-10-19): Chat API https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions (sampling, enable_thinking, thinking_budget, reasoning_effort, stream_options.include_usage);
# structured output https://www.alibabacloud.com/help/en/model-studio/json-mode; context cache https://www.alibabacloud.com/help/en/model-studio/context-cache (model lists per region, 1,024-token minimum, explicit: cache_control ephemeral, 5-minute TTL, up to 4 markers on system/user/assistant/tool messages; tool definitions count as part of the system message, so changing tools changes the prefix).
# Live on dashscope-intl.aliyuncs.com 2026-10-19: late system message accepted, obeyed and kept the explicit cache (in place); toggle, reasoning_effort and cross-tier thinking_budget changes missed the cache; adding tools missed the cache.
schema = 2
base_model = "alibaba/qwen3.8-flash"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, default = { type = "effort", value = "xhigh" }, toggle = true, effort = ["low", "medium", "xhigh"], budget = { max = 262_144 } }
structured_output = true
system_updates = true
effort_updates = false
stream_usage = true
cache = { supported = true, implicit = { min_tokens = 1_024 }, explicit = { ttl = ["5m"], max_breakpoints = 4, targets = ["system", "messages"], min_tokens = 1_024 } }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.15
cache = { read = 0.016, write = 0.2 }

[cost.text.output]
price = 0.47
