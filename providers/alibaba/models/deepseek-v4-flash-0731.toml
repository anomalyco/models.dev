# Sources (accessed 2026-08-08):
# https://www.alibabacloud.com/help/en/model-studio/deepseek-api
# https://www.alibabacloud.com/help/en/model-studio/model-pricing (Singapore list)
# https://www.qwencloud.com/models/deepseek-v4-flash-0731 (implicit cache price)
# Pay-as-you-go on DashScope international, not Token Plan only.
# Toggle: enable_thinking true|false
# v2 capabilities (accessed 2026-10-19): Chat API https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions (sampling, enable_thinking, thinking_budget, reasoning_effort, stream_options.include_usage);
# structured output https://www.alibabacloud.com/help/en/model-studio/json-mode; context cache https://www.alibabacloud.com/help/en/model-studio/context-cache (model lists per region, 1,024-token minimum, explicit: cache_control ephemeral, 5-minute TTL, up to 4 markers on system/user/assistant/tool messages; tool definitions count as part of the system message, so changing tools changes the prefix).
# Live on dashscope-intl.aliyuncs.com 2026-10-19: late system message accepted, obeyed and kept the implicit cache; enable_thinking and reasoning_effort changes missed it; adding tools missed the cache; reasoning_effort=low accepted.
# Effort: reasoning_effort = low|high|max (default high; medium/xhigh map to high) per the Chat API reference
# top_k: the DeepSeek series does not support top_k (Chat API reference)
# Prices (Singapore, USD): https://www.alibabacloud.com/help/en/model-studio/model-pricing (accessed 2026-10-19)
# Peak/off-peak pricing since 2026-08-17: busy hours (08:00-22:00 UTC+8) $0.44/$1.32, idle hours (22:00-08:00 UTC+8, i.e. 14:00-24:00 UTC) $0.22/$0.66. Base = busy price, idle multiplier 0.5. Implicit cache hits bill at 20% of input (context-cache doc; 0731 is not one of the listed exceptions).
# Web search: $10 per 1,000 calls in Singapore (agent policy, also the Responses and Anthropic web_search tool rate): https://www.alibabacloud.com/help/en/model-studio/web-search (accessed 2026-10-23).
# Per-API flags: system_updates sits on [api.chat-completions] only. The late system message was only checked on Chat Completions (2026-10-23 audit); the Responses and Anthropic-compatible Messages endpoints have no documented or tested in-place system message.
# Tools: tool_choice auto|none|required|named on every API except Responses (no required with more than one tool); no strict tool mode (sources in provider.toml).
schema = 2
base_model = "deepseek/deepseek-v4-flash-0731"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, default = { type = "effort", value = "high" }, toggle = true, effort = ["low", "high", "max"] }
structured_output = true
top_k = false
stream_usage = true
cache = { implicit = { min_tokens = 1_024 } }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
capabilities = { system_updates = true }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/alibaba/responses" }
capabilities = { tools = { choice = ["auto", "none", "tool"] } }

[api.messages]
base_url = "https://dashscope-intl.aliyuncs.com/apps/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/alibaba/messages" }

[cost.text.input]
price = 0.44
cache = { read = 0.088 }

[cost.text.output]
price = 1.32

[[cost.multipliers]]
when = { utc_hours = { gte = "14:00" } }
factor = { text = 0.5 }

[cost.web_search]
price = 10
