# Status: retired on Model Studio international. Live 2026-10-19 the API answers 404 and the model is absent from https://www.alibabacloud.com/help/en/model-studio/model-pricing; retirement policy: https://www.alibabacloud.com/help/en/model-studio/model-depreciation
# max_tokens_field: Model Studio's Chat API lists this model outside max_completion_tokens support (https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions, accessed 2026-10-24)
# Tools: tool_choice auto|none on every API; no strict tool mode (sources in provider.toml).
schema = 2
name = "Qwen3-Next 80B-A3B Instruct"
description = "Qwen instruction model for multilingual chat, reasoning, and tool use"
family = "qwen"
open_weights = true
knowledge = "2025-04"
release_date = "2025-09"
status = "deprecated"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none"] }
reasoning = { supported = false }
temperature = true

[limit]
context = 131_072
output = 32_768

[api.chat-completions]
compatibility = { max_tokens_field = "max_tokens" }

[cost.text.input]
price = 0.5

[cost.text.output]
price = 2
