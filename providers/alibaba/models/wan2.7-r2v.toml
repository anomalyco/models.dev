# Sources (accessed 2026-11-12):
# - Pricing (Singapore, USD): https://www.alibabacloud.com/help/en/model-studio/model-pricing
#   per second of output video: 1080P $0.15, 720P $0.1
#   base price is 1080P, the default resolution in the API reference below
#   reference videos are billed per second at the same rate, capped at 5 seconds of input per task
# - API: POST https://dashscope-intl.aliyuncs.com/api/v1/services/aigc/video-generation/video-synthesis with `X-DashScope-Async: enable`,
#   then poll GET /api/v1/tasks/{task_id} (https://www.alibabacloud.com/help/en/model-studio/wan-video-to-video-api-reference)
# - Inputs: reference images JPEG, JPG, PNG, BMP or WEBP; reference videos MP4 or MOV; reference voice WAV or MP3; output MP4 (H.264)
# base_url is passed as @ai-sdk/alibaba's videoBaseURL. No @opencode/ai package covers this API.
schema = 2
v2_only = true
base_model = "alibaba/wan2.7"
name = "Wan2.7 Reference-to-Video"

[api.videos]
base_url = "https://dashscope-intl.aliyuncs.com"
sdk = { aisdk = "@ai-sdk/alibaba", opencodeai = "none" }

[cost.video.output]
unit = "second"
price = 0.15

[[cost.video.output.overrides]]
when = { resolution = { equals = "720P" } }
price = 0.1

[cost.video.input]
unit = "second"
price = 0.15

[[cost.video.input.overrides]]
when = { resolution = { equals = "720P" } }
price = 0.1
