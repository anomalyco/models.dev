# Status: retired on Model Studio international. Live 2026-10-19 the API answers 404 and the model is absent from https://www.alibabacloud.com/help/en/model-studio/model-pricing; retirement policy: https://www.alibabacloud.com/help/en/model-studio/model-depreciation
# Type: realtime (WebSocket) model, not served on chat completions.
# MIME types: https://www.alibabacloud.com/help/en/model-studio/realtime — images (and video, sent as image frames) "must be JPG or JPEG"; audio in/out is raw 16-bit PCM ("pcm"), registered as audio/L16.
# API: wss://<host>/api-ws/v1/realtime?model=<id> (https://www.alibabacloud.com/help/en/model-studio/realtime)
schema = 2
type = "realtime"
name = "Qwen-Omni Turbo Realtime"
description = "Qwen omni model for text, vision, audio, and multimodal agent tasks"
family = "qwen"
open_weights = false
knowledge = "2024-04"
release_date = "2025-05-08"
status = "deprecated"

[modalities]
input = ["text", "image/jpeg", "audio/L16"]
output = ["text", "audio/L16"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true

[limit]
context = 32_768
output = 2_048

[api.realtime]
base_url = "wss://dashscope-intl.aliyuncs.com/api-ws/v1/realtime"
sdk = { aisdk = "none", opencodeai = "none" }

[cost.text.input]
price = 0.27

[cost.text.output]
price = 1.07

[cost.audio.input]
price = 4.44

[cost.audio.output]
price = 8.89
