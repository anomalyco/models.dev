# Type: realtime (WebSocket) model, not served on chat completions.
schema = 2
type = "realtime"
name = "Qwen-Omni Turbo Realtime"
description = "Qwen omni model for text, vision, audio, and multimodal agent tasks"
family = "qwen"
open_weights = false
knowledge = "2024-04"
release_date = "2025-05-08"
