# First-party API rejects max_tokens=131073 with range [1, 131072]
# (POST https://dashscope-intl.aliyuncs.com/compatible-mode/v1/chat/completions,
# model qwen3.7-max, checked 2026-09-23).
# Model card: https://www.qwencloud.com/models/qwen3.7-max
# v2 capabilities (accessed 2026-10-19): Chat API https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions (sampling, enable_thinking, thinking_budget, reasoning_effort, stream_options.include_usage);
# structured output https://www.alibabacloud.com/help/en/model-studio/json-mode; context cache https://www.alibabacloud.com/help/en/model-studio/context-cache (model lists per region, 1,024-token minimum, explicit: cache_control ephemeral, 5-minute TTL, up to 4 markers on system/user/assistant/tool messages; tool definitions count as part of the system message, so changing tools changes the prefix).
# Live on dashscope-intl.aliyuncs.com 2026-10-19: late system message accepted, obeyed and kept the explicit cache (in place); enable_thinking and thinking_budget changes kept the cache; adding tools missed the cache.
# Re-checked live 2026-10-23 (~8k-token first user message): with cache_control on that message, enable_thinking and thinking_budget changes keep the explicit cache (7.2k-9.3k cached, same as the control); without markers the implicit cache misses after an enable_thinking flip.
# effort_updates: left out. Changing enable_thinking or thinking_budget on the next request keeps the cache, but there's no in-history effort message, so it doesn't count.
# Explicit cache read: $0.25 per 1M (https://www.qwencloud.com/models/qwen3.7-max, accessed 2026-10-23).
# Web search: $10 per 1,000 calls in Singapore (agent policy, also the Responses and Anthropic web_search tool rate): https://www.alibabacloud.com/help/en/model-studio/web-search (accessed 2026-10-23).
schema = 2
name = "Qwen3.7 Max"
description = "Qwen frontier model tuned for agent frameworks, coding assistants, and long tasks"
family = "qwen"
open_weights = false
release_date = "2026-05-21"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, default = { type = "toggle", value = true }, toggle = true, budget = {} }
structured_output = true
temperature = true
top_p = true
top_k = true
system_updates = true
stream_usage = true
cache = { implicit = { min_tokens = 1_024 }, explicit = { ttl = ["5m"], max_breakpoints = 4, targets = ["system", "messages"], min_tokens = 1_024 } }

[limit]
context = 1_000_000
output = 131_072

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/alibaba/responses" }

[api.messages]
base_url = "https://dashscope-intl.aliyuncs.com/apps/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/alibaba/messages" }

[cost.text.input]
price = 2.5
cache = { read = 0.5, write = 3.125, explicit = { read = 0.25 } }

[cost.text.output]
price = 7.5

[cost.web_search]
price = 10
