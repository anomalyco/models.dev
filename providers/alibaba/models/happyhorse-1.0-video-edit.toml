# Sources (accessed 2026-11-12):
# - Pricing (Singapore, USD): https://www.alibabacloud.com/help/en/model-studio/model-pricing
#   per second of output video: 1080P $0.24, 720P $0.14
#   base price is 1080P, the default resolution in the API reference below
#   input video is billed per second at the same rate as output
# - API: POST https://dashscope-intl.aliyuncs.com/api/v1/services/aigc/video-generation/video-synthesis with `X-DashScope-Async: enable`,
#   then poll GET /api/v1/tasks/{task_id} (https://www.alibabacloud.com/help/en/model-studio/happyhorse-video-edit-api-reference)
# - Inputs: input video MP4 or MOV; reference images JPEG, JPG, PNG or WEBP; output MP4 (H.264)
# @ai-sdk/alibaba does not map an input video to edit, so no SDK is listed.
# Not recorded: the Singapore free trial quota (valid for 90 days after activation).
schema = 2
v2_only = true
base_model = "alibaba/happyhorse-1.0"
name = "HappyHorse-1.0 Video Edit"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp", "video/mp4", "video/quicktime"]
output = ["video/mp4"]

[api.videos]
base_url = "https://dashscope-intl.aliyuncs.com"
sdk = { aisdk = "none", opencodeai = "none" }

[cost.video.output]
unit = "second"
price = 0.24

[[cost.video.output.overrides]]
when = { resolution = { equals = "720P" } }
price = 0.14

[cost.video.input]
unit = "second"
price = 0.24

[[cost.video.input.overrides]]
when = { resolution = { equals = "720P" } }
price = 0.14
