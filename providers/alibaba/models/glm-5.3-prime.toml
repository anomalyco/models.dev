# Prices (Singapore, USD): $2.8 input, $8.8 output (https://www.alibabacloud.com/help/en/model-studio/model-pricing, accessed 2026-11-24); implicit cache hits $0.56 (the catalog API GET https://dashscope-intl.aliyuncs.com/api/v1/models, input_token_cache, accessed 2026-11-24).
# Prime lane: GLM-5.3 with 1.5-2x output speed from inference acceleration, same capabilities (the catalog API GET https://dashscope-intl.aliyuncs.com/api/v1/models: "GLM-5.3-Prime is the high-speed variant of GLM-5.3, inheriting its full capabilities"). Controls follow glm-5.3 on this host.
# Thinking only: enable_thinking accepts only true; Effort: reasoning_effort = low|high|max (default max) for the glm-5.3 series (Chat API reference https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions, accessed 2026-11-24).
# system_updates on Chat Completions follows glm-5.3 on this host (same API, live-checked there 2026-10-19).
# Tools: tool_choice auto|none on every API; no strict tool mode (sources in provider.toml).
schema = 2
base_model = "zhipuai/glm-5.3"
name = "GLM-5.3 Prime"

[capabilities]
tools = { supported = true, choice = ["auto", "none"] }
reasoning = { supported = true, default = { type = "effort", value = "max" }, effort = ["low", "high", "max"] }
stream_usage = true
cache = { implicit = { min_tokens = 1_024 } }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
capabilities = { system_updates = true }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/alibaba/responses" }

[api.messages]
base_url = "https://dashscope-intl.aliyuncs.com/apps/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/alibaba/messages" }

[cost.text.input]
price = 2.8
cache = { read = 0.56 }

[cost.text.output]
price = 8.8
