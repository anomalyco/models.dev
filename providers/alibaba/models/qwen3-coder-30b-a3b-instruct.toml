# International (Singapore) deployment is tiered on input tokens per request;
# every token in a request bills at its tier's unit price.
# https://www.alibabacloud.com/help/en/model-studio/model-pricing (accessed 2026-08-26)
# Status: retired on Model Studio international. Live 2026-10-19 the API answers 404 and the model is absent from https://www.alibabacloud.com/help/en/model-studio/model-pricing; retirement policy: https://www.alibabacloud.com/help/en/model-studio/model-depreciation
# max_tokens_field: Model Studio's Chat API lists this model outside max_completion_tokens support (https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions, accessed 2026-10-24)
# Tools: tool_choice auto|none on every API; no strict tool mode (sources in provider.toml).
schema = 2
name = "Qwen3-Coder 30B-A3B Instruct"
description = "Smaller Qwen coder for efficient local agents and repo-level fixes"
family = "qwen"
open_weights = true
knowledge = "2025-04"
release_date = "2025-04"
status = "deprecated"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none"] }
reasoning = { supported = false }
temperature = true

[limit]
context = 262_144
output = 65_536

[api.chat-completions]
compatibility = { max_tokens_field = "max_tokens" }

[cost.text.input]
price = 0.45

[[cost.text.input.overrides]]
when = { context = { gt = 32_000 } }
price = 0.75

[[cost.text.input.overrides]]
when = { context = { gt = 128_000 } }
price = 1.2

[cost.text.output]
price = 2.25

[[cost.text.output.overrides]]
when = { context = { gt = 32_000 } }
price = 3.75

[[cost.text.output.overrides]]
when = { context = { gt = 128_000 } }
price = 6
