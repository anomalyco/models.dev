schema = 2
name = "Qwen3.6 Plus"
description = "Earlier Qwen multimodal workhorse for million-token agent and document tasks"
family = "qwen"
open_weights = false
knowledge = "2025-04"
release_date = "2026-04-02"

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true, budget = {  } }
temperature = true

[limit]
context = 1_000_000
output = 65_536

[cost.text.input]
price = 0.5
cache = { read = 0.05, write = 0.625 }

[[cost.text.input.overrides]]
when = { context = { gt = 256_000 } }
price = 2
cache = { read = 0.2, write = 2.5 }

[cost.text.output]
price = 3

[[cost.text.output.overrides]]
when = { context = { gt = 256_000 } }
price = 6
