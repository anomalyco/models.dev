# v2 capabilities (accessed 2026-10-19): Chat API https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions (sampling, enable_thinking, thinking_budget, reasoning_effort, stream_options.include_usage);
# structured output https://www.alibabacloud.com/help/en/model-studio/json-mode; context cache https://www.alibabacloud.com/help/en/model-studio/context-cache (model lists per region, 1,024-token minimum, explicit: cache_control ephemeral, 5-minute TTL, up to 4 markers on system/user/assistant/tool messages; tool definitions count as part of the system message, so changing tools changes the prefix).
# Live on dashscope-intl.aliyuncs.com 2026-10-19: late system message accepted and obeyed but missed the explicit cache (moved, not in place); enable_thinking and thinking_budget changes kept the cache; adding tools missed the cache.
# effort_updates: left out. Changing enable_thinking or thinking_budget on the next request keeps the cache, but there's no in-history effort message, so it doesn't count.
# Prices (Singapore, USD): https://www.alibabacloud.com/help/en/model-studio/model-pricing (accessed 2026-10-19)
# Tiers: 0-256K $0.05/$0.4, 256K-1M $0.25/$2.
# Cache prices (all input bands, same ratios per https://www.alibabacloud.com/help/en/model-studio/context-cache): implicit read 20%, explicit creation 125%, explicit read 10% of input (https://www.qwencloud.com/models/qwen-flash, accessed 2026-10-23).
schema = 2
name = "Qwen Flash"
description = "Efficient Qwen model for fast chat, extraction, and high-volume workloads"
family = "qwen"
open_weights = false
knowledge = "2024-04"
release_date = "2025-07-28"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, default = { type = "toggle", value = false }, toggle = true, budget = {} }
structured_output = true
temperature = true
top_p = true
top_k = true
system_updates = false
stream_usage = true
cache = { implicit = { min_tokens = 1_024 }, explicit = { ttl = ["5m"], max_breakpoints = 4, targets = ["system", "messages"], min_tokens = 1_024 } }

[limit]
context = 1_000_000
output = 32_768

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/alibaba/responses" }

[api.messages]
base_url = "https://dashscope-intl.aliyuncs.com/apps/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/alibaba/messages" }

[cost.text.input]
price = 0.05
cache = { read = 0.01, explicit = { read = 0.005, write = 0.0625 } }

[[cost.text.input.overrides]]
when = { context = { gt = 256_000 } }
price = 0.25
cache = { read = 0.05, explicit = { read = 0.025, write = 0.3125 } }

[cost.text.output]
price = 0.4

[[cost.text.output.overrides]]
when = { context = { gt = 256_000 } }
price = 2
