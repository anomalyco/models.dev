# Added as v2-only (served and listed on https://www.alibabacloud.com/help/en/model-studio/model-pricing, Singapore, accessed 2026-10-19).
# Capabilities: Chat API https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions; structured output https://www.alibabacloud.com/help/en/model-studio/json-mode; context cache https://www.alibabacloud.com/help/en/model-studio/context-cache (tool definitions count as part of the system message, so changing tools changes the prefix).
# Toggle: enable_thinking true|false (default on); Effort: reasoning_effort = high|max (default high) per the Chat API reference. top_k: the DeepSeek series does not support it.
# Cache: implicit (context-cache model lists); the hit price is not published ("see the console").
# Live on dashscope-intl.aliyuncs.com 2026-10-19: late system message accepted, obeyed and kept the implicit cache; enable_thinking change kept it, reasoning_effort change missed it.
# effort_updates: left out. Live 2026-10-23 (~8k-token first user message): flipping enable_thinking for one turn keeps the cache (7168 cached both directions, implicit and explicit, same as the control; reasoning 0 vs 50-95 tokens), but that's a top-level change, not an in-history effort message, so it doesn't count. Changing reasoning_effort (high <-> max) drops it to 0.
# Web search: $10 per 1,000 calls in Singapore (agent policy, also the Responses and Anthropic web_search tool rate): https://www.alibabacloud.com/help/en/model-studio/web-search (accessed 2026-10-23).
# Per-API flags: system_updates sits on [api.chat-completions] only. The late system message was only checked on Chat Completions (2026-10-23 audit); the Responses and Anthropic-compatible Messages endpoints have no documented or tested in-place system message.
schema = 2
v2_only = true
base_model = "deepseek/deepseek-v4-pro"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, default = { type = "effort", value = "high" }, toggle = true, effort = ["high", "max"] }
structured_output = true
top_k = false
stream_usage = true
cache = { implicit = { min_tokens = 1_024 } }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
capabilities = { system_updates = true }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/alibaba/responses" }

[api.messages]
base_url = "https://dashscope-intl.aliyuncs.com/apps/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/alibaba/messages" }

[cost.text.input]
price = 2.4

[cost.text.output]
price = 4.8

[cost.web_search]
price = 10
