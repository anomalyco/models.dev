# Added as v2-only (served and listed on https://www.alibabacloud.com/help/en/model-studio/model-pricing, Singapore, accessed 2026-10-19). Billed per output image.
# Image generation and editing: https://www.alibabacloud.com/help/en/model-studio/image-model
# MIME types: input images JPEG, JPG, PNG, BMP, WEBP; output PNG, per https://www.alibabacloud.com/help/en/model-studio/wan-image-generation-and-editing-api-reference.
# API: POST /api/v1/services/aigc/multimodal-generation/generation (https://www.alibabacloud.com/help/en/model-studio/wan-image-generation-and-editing-api-reference)
schema = 2
v2_only = true
type = "image"
name = "Wan2.7 Image"
description = "Wan image model for prompt-driven generation and editing"
open_weights = false
release_date = "2026-05-29"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/bmp", "image/webp"]
output = ["image/png"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 8_192
output = 0

[api.images]
base_url = "https://dashscope-intl.aliyuncs.com/api/v1"
sdk = { aisdk = "none", opencodeai = "@opencode/ai/providers/alibaba/images" }

[cost.image.output]
unit = "image"
price = 0.03
