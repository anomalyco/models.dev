# Source (accessed 2026-10-07): https://www.alibabacloud.com/help/en/model-studio/model-pricing
# International (Singapore) list: qwen-vl-ocr input $0.07, output $0.16 per 1M tokens.
# v2 capabilities (accessed 2026-10-19): Chat API https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions (sampling, enable_thinking, thinking_budget, reasoning_effort, stream_options.include_usage);
# structured output https://www.alibabacloud.com/help/en/model-studio/json-mode; context cache https://www.alibabacloud.com/help/en/model-studio/context-cache (model lists per region, 1,024-token minimum, explicit: cache_control ephemeral, 5-minute TTL, up to 4 markers on system/user/assistant/tool messages; tool definitions count as part of the system message, so changing tools changes the prefix).
# Live on dashscope-intl.aliyuncs.com 2026-10-19: late system message accepted.
# Re-checked live 2026-10-23 (~8k-token first user message): a late system message is accepted (200) but this model didn't follow it in the probe; the control gets no cache hits (implicit or explicit), so system_updates stays.
# Input MIME types: https://www.alibabacloud.com/help/en/model-studio/vision (images, video) and https://www.alibabacloud.com/help/en/model-studio/qwen-omni (audio).
# Image input formats (BMP, JPEG, PNG, TIFF, WEBP, HEIC with their MIME types): https://www.alibabacloud.com/help/en/model-studio/qwen-vl-ocr (Image limits, Supported image formats).
schema = 2
name = "Qwen-VL OCR"
description = "OCR model for extracting structured text from documents and screenshots"
family = "qwen"
open_weights = false
knowledge = "2024-04"
release_date = "2024-10-28"
last_updated = "2025-04-13"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true
system_updates = true
stream_usage = true
cache = false

[limit]
context = 34_096
output = 4_096

[cost.text.input]
price = 0.07

[cost.text.output]
price = 0.16
