# v2 capabilities (accessed 2026-10-19): Chat API https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions (sampling, enable_thinking, thinking_budget, reasoning_effort, stream_options.include_usage);
# structured output https://www.alibabacloud.com/help/en/model-studio/json-mode; context cache https://www.alibabacloud.com/help/en/model-studio/context-cache (model lists per region, 1,024-token minimum, explicit: cache_control ephemeral, 5-minute TTL, up to 4 markers on system/user/assistant/tool messages; tool definitions count as part of the system message, so changing tools changes the prefix).
# Live on dashscope-intl.aliyuncs.com 2026-10-19: late system message accepted and obeyed but missed the explicit cache (moved, not in place); enable_thinking and thinking_budget changes kept the cache; adding tools missed the cache.
# Prices (Singapore, USD): https://www.alibabacloud.com/help/en/model-studio/model-pricing (accessed 2026-10-19)
# Tiers: 0-256K $0.4 in, $1.2 out ($4 thinking); 256K-1M $1.2 in, $3.6 out ($12 thinking).
schema = 2
name = "Qwen Plus"
description = "Qwen instruction model for multilingual chat, reasoning, and tool use"
family = "qwen"
open_weights = false
knowledge = "2024-04"
release_date = "2024-01-25"
last_updated = "2025-09-11"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, default = { type = "toggle", value = false }, toggle = true, budget = {} }
structured_output = true
temperature = true
top_p = true
top_k = true
system_updates = false
effort_updates = true
stream_usage = true
cache = { supported = true, implicit = { min_tokens = 1_024 }, explicit = { ttl = ["5m"], max_breakpoints = 4, targets = ["system", "messages"], min_tokens = 1_024 } }

[limit]
context = 1_000_000
output = 32_768

[cost.text.input]
price = 0.4

[[cost.text.input.overrides]]
when = { context = { gt = 256_000 } }
price = 1.2

[cost.text.output]
price = 1.2
reasoning = 4

[[cost.text.output.overrides]]
when = { context = { gt = 256_000 } }
price = 3.6
reasoning = 12
