# Sources (pricing and API pages accessed 2026-10-20; GET /v1/models read 2026-10-17):
# https://superbot.gg/pricing  list prices, API and MCP lane, USD per 1M tokens; reasoning tokens bill as output; fast mode bills 2x every rate
# https://superbot.gg/api  the house models and their context windows
# GET https://api.superbot.gg/v1/models (needs a caller key)  context_length 1000000, reasoning_efforts, default_reasoning_effort, service_tiers
# Effort: reasoning_effort = none|low|high|xhigh|max (default high). On /v1/responses the field is reasoning.effort.
# `xhigh` is served as `high`; `medium` and `minimal` are served as `low`.
# Fast mode: service_tier = "priority" (or "fast"), 2x every rate.
# A model served only at this host, not a lab release, so this is a full definition and not a base_model file.
name = "superbot"
description = "The default superbot model. Reasoning effort from none to max, a 1M-token window, tool calls, one base URL and one caller key."
release_date = "2026-09"
last_updated = "2026-10"
attachment = false
reasoning = true
tool_call = true
open_weights = false

[[reasoning_options]]
type = "effort"
values = ["none", "low", "high", "xhigh", "max"]

[cost]
input = 1.00
output = 5.00
reasoning = 5.00
cache_read = 0.05
cache_write = 1.25

[limit]
context = 1_000_000
output = 131_072

[modalities]
input = ["text"]
output = ["text"]

[experimental.modes.fast]
cost = { input = 2.00, output = 10.00, reasoning = 10.00, cache_read = 0.10, cache_write = 2.50 }
provider = { body = { service_tier = "priority" } }
