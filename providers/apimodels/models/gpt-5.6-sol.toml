# Sources (accessed 2026-10-08):
# - Pricing: https://apimodels.app/models/gpt-5-6-sol ($1.324 input / $6.618 output / $0.132 cache read per 1M tokens)
#   Input above 272K tokens bills the whole request at 2x input and cache read, 1.5x output.
# - Model ID: https://api.apimodels.app/v1/models ("gpt-5.6-sol")
base_model = "openai/gpt-5.6-sol"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 1.324
output = 6.618
cache_read = 0.132

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 2.648
output = 9.927
cache_read = 0.264
