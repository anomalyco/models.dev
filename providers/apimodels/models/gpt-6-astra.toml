# Sources (accessed 2026-10-08):
# - Pricing: https://apimodels.app/models/gpt-6-astra ($2.40 input / $12.00 output / $0.24 cache read per 1M tokens)
#   Input above 272K tokens bills the whole request at 2x input and cache read, 1.5x output.
# - Model ID: https://api.apimodels.app/v1/models ("gpt-6-astra")
base_model = "openai/gpt-6-astra"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 2.4
output = 12.0
cache_read = 0.24

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 4.8
output = 18.0
cache_read = 0.48
