# Sources (accessed 2026-11-05):
# - Pricing: https://apimodels.app/models/gpt-6-astra and https://apimodels.app/pricing
#   ($3.40 input / $17.00 output / $0.34 cache read per 1M tokens)
#   Input above 272K tokens bills the whole request at 2x input and cache read, 1.5x output.
# - Model ID: https://api.apimodels.app/v1/models ("gpt-6-astra")
# Served on Chat Completions; reasoning_effort is forwarded unchanged.
# Custom (freeform) tools have not been probed on this host, so `freeform` is left out.
schema = 2
base_model = "openai/gpt-6-astra"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 3.4
cache = { read = 0.34 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 6.8
cache = { read = 0.68 }

[cost.text.output]
price = 17

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 25.5
