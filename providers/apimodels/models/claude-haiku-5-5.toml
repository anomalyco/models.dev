# Sources (accessed 2026-11-05):
# - Pricing: https://apimodels.app/models/claude-haiku-5-5 and https://apimodels.app/pricing
#   ($0.09 input / $0.45 output / $0.009 cache read / $0.1125 cache write per 1M tokens)
#   Prompts above 100K tokens bill the whole request at 5x every price (input, cache read and write, output).
# - Model ID: https://api.apimodels.app/v1/models ("claude-haiku-5-5")
# Served on the Anthropic Messages API (https://api.apimodels.app/v1/messages); thinking and output_config.effort are passed through unchanged.
# Toggle: thinking.type = adaptive|disabled (disabled is accepted at effort high or below)
schema = 2
base_model = "anthropic/claude-haiku-5-5"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.09
cache = { read = 0.009, write = 0.1125 }

[[cost.text.input.overrides]]
when = { context = { gt = 100_000 } }
price = 0.45
cache = { read = 0.045, write = 0.5625 }

[cost.text.output]
price = 0.45

[[cost.text.output.overrides]]
when = { context = { gt = 100_000 } }
price = 2.25
