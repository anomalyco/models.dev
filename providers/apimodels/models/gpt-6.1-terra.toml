# Sources (accessed 2026-11-05):
# - Pricing: https://apimodels.app/models/gpt-6.1-terra and https://apimodels.app/pricing
#   ($0.50 input / $2.50 output / $0.025 cache read per 1M tokens)
#   Input above 272K tokens bills the whole request at 2x input and cache read, 1.5x output.
# - Model ID: https://api.apimodels.app/v1/models ("gpt-6.1-terra")
# Served on Chat Completions; reasoning_effort is forwarded unchanged.
# Custom (freeform) tools have not been probed on this host, so `freeform` is left out.
schema = 2
base_model = "openai/gpt-6.1-terra"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 0.5
cache = { read = 0.025 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 1
cache = { read = 0.05 }

[cost.text.output]
price = 2.5

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 3.75
