# Sources (accessed 2026-11-05):
# - Pricing: https://apimodels.app/models/glm-5.3 and https://apimodels.app/pricing
#   ($1.33 input / $4.18 output / $0.247 cache read per 1M tokens)
# - Model ID: https://api.apimodels.app/v1/models ("glm-5.3")
# Served on Chat Completions; reasoning_effort is forwarded unchanged. No toggle: live probe on POST https://api.apimodels.app/v1/chat/completions (2026-11-28), same prompt with no thinking field, `thinking.type = disabled`, `thinking.type = enabled` and `enable_thinking = false`: all four returned reasoning_content and a comparable usage.completion_tokens_details.reasoning_tokens count (176 / 181 / 210 / 119), so the field does not turn thinking off on this host.
schema = 2
base_model = "zhipuai/glm-5.3"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.33
cache = { read = 0.247 }

[cost.text.output]
price = 4.18
