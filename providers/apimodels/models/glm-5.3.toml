# Sources (accessed 2026-11-05):
# - Pricing: https://apimodels.app/models/glm-5.3 and https://apimodels.app/pricing
#   ($1.33 input / $4.18 output / $0.247 cache read per 1M tokens)
# - Model ID: https://api.apimodels.app/v1/models ("glm-5.3")
# Served on Chat Completions; reasoning_effort is forwarded unchanged. No toggle: the Chat Completions request body is forwarded through an allowlist that has no `thinking` or `enable_thinking` field for GLM models, so `thinking.type = disabled` never reaches the model.
schema = 2
base_model = "zhipuai/glm-5.3"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.33
cache = { read = 0.247 }

[cost.text.output]
price = 4.18
