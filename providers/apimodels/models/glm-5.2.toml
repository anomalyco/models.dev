# Sources (accessed 2026-11-05):
# - Pricing: https://apimodels.app/models/glm-5.2 and https://apimodels.app/pricing
#   ($1.26 input / $3.96 output / $0.26 cache read per 1M tokens)
# - Model ID: https://api.apimodels.app/v1/models ("glm-5.2")
# Served on Chat Completions; reasoning_effort is forwarded unchanged. No toggle: live probe on POST https://api.apimodels.app/v1/chat/completions (2026-11-28), same prompt with no thinking field, `thinking.type = disabled`, `thinking.type = enabled` and `enable_thinking = false`: all four returned reasoning_content and a comparable usage.completion_tokens_details.reasoning_tokens count (494 / 444 / 392 / 466), so the field does not turn thinking off on this host.
schema = 2
base_model = "zhipuai/glm-5.2"

[capabilities]
reasoning = { supported = true, effort = ["high", "max"] }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.26
cache = { read = 0.26 }

[cost.text.output]
price = 3.96
