# Sources (accessed 2026-11-05):
# - Pricing: https://apimodels.app/models/gpt-6-luna and https://apimodels.app/pricing
#   ($0.09 input / $0.45 output / $0.009 cache read per 1M tokens)
#   Input above 272K tokens bills the whole request at 2x input and cache read, 1.5x output.
# - Model ID: https://api.apimodels.app/v1/models ("gpt-6-luna")
# Served on Chat Completions; reasoning_effort is forwarded unchanged.
# Custom (freeform) tools have not been probed on this host, so `freeform` is left out.
schema = 2
base_model = "openai/gpt-6-luna"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 0.09
cache = { read = 0.009 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 0.18
cache = { read = 0.018 }

[cost.text.output]
price = 0.45

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 0.675
