# Sources (accessed 2026-11-05):
# - Pricing: https://apimodels.app/models/gpt-5-4 and https://apimodels.app/pricing
#   ($1.80 input / $10.80 output / $0.25 cache read per 1M tokens)
# - Model ID: https://api.apimodels.app/v1/models ("gpt-5-4")
# Served on Chat Completions; reasoning_effort is forwarded unchanged.
# tools.freeform: live probe on POST https://api.apimodels.app/v1/chat/completions (2026-11-28, 3 runs): one custom tool with tool_choice = "required", formats text, regex `ZZ[0-9]{3}` and the equivalent lark grammar. All three were accepted and the grammars enforced (regex and lark both returned ZZ plus three digits; text returned the free sentence).
schema = 2
base_model = "openai/gpt-5.4"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
tools = { supported = true, freeform = ["text", "lark", "regex"] }

[cost.text.input]
price = 1.8
cache = { read = 0.25 }

[cost.text.output]
price = 10.8
