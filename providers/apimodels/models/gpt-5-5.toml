# Sources (accessed 2026-11-05):
# - Pricing: https://apimodels.app/models/gpt-5-5 and https://apimodels.app/pricing
#   ($3.00 input / $18.00 output / $0.50 cache read per 1M tokens)
# - Model ID: https://api.apimodels.app/v1/models ("gpt-5-5")
# Served on Chat Completions; reasoning_effort is forwarded unchanged.
# Custom (freeform) tools have not been probed on this host, so `freeform` is left out.
schema = 2
base_model = "openai/gpt-5.5"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }

[cost.text.input]
price = 3
cache = { read = 0.5 }

[cost.text.output]
price = 18
