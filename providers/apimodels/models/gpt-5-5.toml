# Sources (accessed 2026-11-05):
# - Pricing: https://apimodels.app/models/gpt-5-5 and https://apimodels.app/pricing
#   ($3.00 input / $18.00 output / $0.50 cache read per 1M tokens)
# - Model ID: https://api.apimodels.app/v1/models ("gpt-5-5")
# Served on Chat Completions; reasoning_effort is forwarded unchanged.
# tools.freeform left out: custom tools do not work for this model on this host. Live probe on POST https://api.apimodels.app/v1/chat/completions (2026-11-28): one custom tool with tool_choice = "required", formats text, regex `ZZ[0-9]{3}` and the equivalent lark grammar; all three returned HTTP 400 "Missing required parameter: 'tools[0].custom'".
schema = 2
base_model = "openai/gpt-5.5"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }

[cost.text.input]
price = 3
cache = { read = 0.5 }

[cost.text.output]
price = 18
