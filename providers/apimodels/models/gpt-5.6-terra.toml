# Sources (accessed 2026-11-05):
# - Pricing: https://apimodels.app/models/gpt-5-6-terra and https://apimodels.app/pricing
#   ($0.551 input / $3.309 output / $0.055 cache read per 1M tokens)
#   Input above 272K tokens bills the whole request at 2x input and cache read, 1.5x output.
# - Model ID: https://api.apimodels.app/v1/models ("gpt-5.6-terra")
# Served on Chat Completions; reasoning_effort is forwarded unchanged.
# Custom (freeform) tools have not been probed on this host, so `freeform` is left out.
schema = 2
base_model = "openai/gpt-5.6-terra"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 0.551
cache = { read = 0.055 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 1.102
cache = { read = 0.11 }

[cost.text.output]
price = 3.309

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 4.9635
