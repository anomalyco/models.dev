# Sources (accessed 2026-10-08):
# - Pricing: https://apimodels.app/models/gpt-5-6-terra ($0.551 input / $3.309 output / $0.055 cache read per 1M tokens)
#   Input above 272K tokens bills the whole request at 2x input and cache read, 1.5x output.
# - Model ID: https://api.apimodels.app/v1/models ("gpt-5.6-terra")
base_model = "openai/gpt-5.6-terra"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 0.551
output = 3.309
cache_read = 0.055

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 1.102
output = 4.9635
cache_read = 0.11
