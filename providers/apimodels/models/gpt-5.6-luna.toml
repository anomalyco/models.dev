# Sources (accessed 2026-10-19):
# - Pricing: https://apimodels.app/models/gpt-5-6-luna ($0.18 input / $0.96 output / $0.018 cache read per 1M tokens)
#   Input above 272K tokens bills the whole request at 2x input and cache read, 1.5x output.
# - Model ID: https://api.apimodels.app/v1/models ("gpt-5.6-luna")
base_model = "openai/gpt-5.6-luna"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 0.18
output = 0.96
cache_read = 0.018

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 0.36
output = 1.44
cache_read = 0.036
