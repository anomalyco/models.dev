# Pricing: https://api.teamorouter.com/v1/models/pricing (list price, before TeamoRouter discounts, accessed 2026-11-03); generated by gen_teamorouter_models.py
# Effort: output_config.effort (Messages) / reasoning_effort (Chat Completions) = low|medium|high|xhigh|max,
# passed through to Anthropic as on the lab's own API (providers/anthropic) and relay peers (vivgrid, openrouter).
# APIs: Anthropic Messages at https://api.teamorouter.com/v1/messages and OpenAI-compatible Chat Completions.
# Cache: Anthropic cache_control passed through, 5m and 1h TTL (1h write priced separately).
schema = 2
base_model = "anthropic/claude-opus-5-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { explicit = { ttl = ["5m", "1h"] } }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[api.chat-completions]

[cost.text.input]
price = 4
cache = { read = 0.2, write = { "5m" = 5, "1h" = 8 } }

[cost.text.output]
price = 20
