# Pricing: https://api.teamorouter.com/v1/models/pricing (list price (lab's official price), accessed 2026-11-03); generated by gen_teamorouter_models.py
# Effort: reasoning.effort (Responses) / reasoning_effort (Chat Completions) = low|medium|high|xhigh|max,
# as on OpenAI's API (providers/openai) and relay peers (openrouter).
# APIs: OpenAI Responses at https://api.teamorouter.com/v1/responses and Chat Completions.
# Context pricing: above 272K input tokens, input and cache read x2, output x1.5 (same tiers as OpenAI).
schema = 2
base_model = "openai/gpt-6.1-sol"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.chat-completions]

[cost.text.input]
price = 2
cache = { read = 0.1 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 4
cache = { read = 0.2 }

[cost.text.output]
price = 10

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 15
