# Pricing: https://api.teamorouter.com/v1/models/pricing (list price, before TeamoRouter discounts, accessed 2026-11-03); generated by gen_teamorouter_models.py
# `deepseek-flash-1017` serves DeepSeek V4.1 Flash 1017.
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|high|max (DeepSeek's own controls, passed through; providers/deepseek)
# Peak/off-peak: off-peak is half of peak. Peak is 01:00-04:00 and 06:00-10:00 UTC, Mon-Fri
# (09:00-12:00 and 14:00-18:00 Beijing). Base prices below are off-peak; the multiplier doubles them at peak.
# Unlike DeepSeek's own API, TeamoRouter's peak window has no Chinese-holiday exception (weekdays only),
# so the multiplier has no `not = { holiday }` clause.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.15
cache = { read = 0.003 }

[cost.text.output]
price = 0.6
reasoning = 0.6

[[cost.multipliers]]
when = { utc_days = { in = ["mon", "tue", "wed", "thu", "fri"] }, any = [{ all = [{ utc_hours = { gte = "01:00" } }, { utc_hours = { lt = "04:00" } }] }, { all = [{ utc_hours = { gte = "06:00" } }, { utc_hours = { lt = "10:00" } }] }] }
factor = 2
