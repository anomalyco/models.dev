# Pricing: https://api.teamorouter.com/v1/models/pricing (list price, before TeamoRouter discounts, accessed 2026-11-03); generated by gen_teamorouter_models.py
# Toggle: enable_thinking true|false
# Effort: reasoning_effort = low|medium|xhigh (Alibaba's own controls; providers/alibaba)
# Budget: thinking_budget (integer reasoning tokens). The upstream is Alibaba Cloud Model Studio and
# TeamoRouter forwards these request fields unchanged (only Gemini fields are rewritten), as on 302ai.
# Currency: Alibaba lists CNY; the pricing endpoint publishes USD converted at a fixed 7 CNY/USD
# (CNY 12 / 1.5 / 15 / 36 per MTok for input / cache read / cache write / output; rate as of 2026-11-03).
schema = 2
base_model = "alibaba/qwen3.8-max"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "xhigh"], budget = {} }
structured_output = true
cache = { implicit = true, explicit = { ttl = ["5m"] } }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.7143
cache = { read = 0.2143, write = 2.1429 }

[cost.text.output]
price = 5.1429
