# Sources (accessed 2026-10-20):
# - Upstream model: gitlab-ai-provider maps duo-chat-gpt-5-codex to OpenAI `gpt-5-codex` (https://gitlab.com/vglafirov/gitlab-ai-provider/-/blob/main/src/model-mappings.ts).
# - AI Gateway proxy allowlist: https://gitlab.com/gitlab-org/modelops/applied-ml/code-suggestions/ai-assist/-/blob/main/ai_gateway/model_selection/models.yml no longer has `gpt_5_codex` (see Status).
# - Supported models: https://docs.gitlab.com/user/duo_agent_platform/model_selection/
# Responses: POST /ai/v1/proxy/openai/v1/responses, forwarded unchanged to api.openai.com
#   (gitlab-ai-provider routes this model to Responses). Effort: reasoning.effort.
#   https://gitlab.com/gitlab-org/modelops/applied-ml/code-suggestions/ai-assist/-/blob/main/ai_gateway/proxy/clients/openai.py
# Effort values: GPT-5-Codex's native low|medium|high (as on the OpenAI entry before its shutdown).
# Cost: billed per model call in GitLab Credits ($1 each on demand; gpt-5-codex: 3.3 calls per credit (row still listed), https://docs.gitlab.com/subscriptions/gitlab_credits/).
#   v2 has no per-request unit, so token prices stay 0 (calls draw on the subscription's credits).
# Status: deprecated. gpt_5_codex (deprecation_date 2026-04-23, removal_version 19.2) was removed from
#   models.yml on 2026-07-13 (https://gitlab.com/gitlab-org/modelops/applied-ml/code-suggestions/ai-assist/-/commit/4fd9060e), so the proxy answers 400 "Unsupported model"; OpenAI
#   shut gpt-5-codex down on 2026-07-23 (https://developers.openai.com/api/docs/deprecations). The Duo model page still lists it.
# Mid-conversation flags unset: GitLab documents none, and no live test (no GitLab token).
# APIs: gitlab-ai-provider sends Claude to the AI gateway's /ai/v1/proxy/anthropic/v1/messages and OpenAI models to /ai/v1/proxy/openai/v1/chat/completions or /responses (sources in provider.toml).
schema = 2
base_model = "openai/gpt-5-codex"
name = "Agentic Chat (GPT-5 Codex)"
status = "deprecated"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[api.chat-completions]

[api.responses]

[cost.text.input]
price = 0

[cost.text.output]
price = 0
