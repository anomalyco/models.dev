# Sources (accessed 2026-10-20):
# - Upstream model: gitlab-ai-provider maps duo-chat-gpt-5-2 to OpenAI `gpt-5.2-2025-12-11` (https://gitlab.com/vglafirov/gitlab-ai-provider/-/blob/main/src/model-mappings.ts).
# - AI Gateway proxy allowlist: https://gitlab.com/gitlab-org/modelops/applied-ml/code-suggestions/ai-assist/-/blob/main/ai_gateway/model_selection/models.yml (`gpt_5_2`, proxy_provider openai,
#   max_context_tokens 400000, max_tokens 128_000).
# - Supported models: https://docs.gitlab.com/user/duo_agent_platform/model_selection/
# Chat Completions: POST /ai/v1/proxy/openai/v1/chat/completions, forwarded unchanged to api.openai.com
#   (gitlab-ai-provider routes this model to Chat Completions). Effort: top-level reasoning_effort.
#   https://gitlab.com/gitlab-org/modelops/applied-ml/code-suggestions/ai-assist/-/blob/main/ai_gateway/proxy/clients/openai.py
# Effort values: GPT-5.2's native none|low|medium|high|xhigh (as on the OpenAI provider entry).
# Cost: billed per model call in GitLab Credits ($1 each on demand; gpt-5.2: 2.5 calls per credit, https://docs.gitlab.com/subscriptions/gitlab_credits/).
#   v2 has no per-request unit, so token prices stay 0 (calls draw on the subscription's credits).
# Mid-conversation flags unset: GitLab documents none, and no live test (no GitLab token).
schema = 2
base_model = "openai/gpt-5.2"
name = "Agentic Chat (GPT-5.2)"
description = "Chat-tuned GPT model for conversational assistance, writing, and tool workflows"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true

[cost.text.input]
price = 0

[cost.text.output]
price = 0
