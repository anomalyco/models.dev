# Sources (accessed 2026-10-20):
# - Upstream model: gitlab-ai-provider maps duo-chat-gpt-5-3-codex to OpenAI `gpt-5.3-codex` (https://gitlab.com/vglafirov/gitlab-ai-provider/-/blob/main/src/model-mappings.ts).
# - AI Gateway proxy allowlist: https://gitlab.com/gitlab-org/modelops/applied-ml/code-suggestions/ai-assist/-/blob/main/ai_gateway/model_selection/models.yml (`gpt_5_3_codex`, proxy_provider openai,
#   max_context_tokens 400000, max_tokens 128_000).
# - Supported models: https://docs.gitlab.com/user/duo_agent_platform/model_selection/
# Responses: POST /ai/v1/proxy/openai/v1/responses, forwarded unchanged to api.openai.com
#   (gitlab-ai-provider routes this model to Responses). Effort: reasoning.effort.
#   https://gitlab.com/gitlab-org/modelops/applied-ml/code-suggestions/ai-assist/-/blob/main/ai_gateway/proxy/clients/openai.py
# Effort values: GPT-5.3-Codex's none|low|medium|high|xhigh (as on the OpenAI provider entry).
# Cost: billed per model call in GitLab Credits ($1 each on demand; gpt-5.3-codex: 2.5 calls per credit, https://docs.gitlab.com/subscriptions/gitlab_credits/).
#   v2 has no per-request unit, so token prices stay 0 (calls draw on the subscription's credits).
# Status: deprecated. models.yml sets deprecation_date 2026-10-02 / removal_version 19.10 for gpt_5_3_codex
#   (https://gitlab.com/gitlab-org/modelops/applied-ml/code-suggestions/ai-assist/-/commit/292002bf); OpenAI shuts gpt-5.3-codex down on 2027-04-01 (https://developers.openai.com/api/docs/deprecations).
# Mid-conversation flags unset: GitLab documents none, and no live test (no GitLab token).
schema = 2
base_model = "openai/gpt-5.3-codex"
name = "Agentic Chat (GPT-5.3 Codex)"
status = "deprecated"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true

[cost.text.input]
price = 0

[cost.text.output]
price = 0
