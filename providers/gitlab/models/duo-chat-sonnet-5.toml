# Sources (accessed 2026-10-20):
# - Upstream model: gitlab-ai-provider maps duo-chat-sonnet-5 to Anthropic `claude-sonnet-5` (https://gitlab.com/vglafirov/gitlab-ai-provider/-/blob/main/src/model-mappings.ts).
# - AI Gateway proxy allowlist: https://gitlab.com/gitlab-org/modelops/applied-ml/code-suggestions/ai-assist/-/blob/main/ai_gateway/model_selection/models.yml (`claude_sonnet_5`, proxy_provider anthropic,
#   max_context_tokens 1_000_000, max_tokens 64_000).
# - Supported models: https://docs.gitlab.com/user/duo_agent_platform/model_selection/
# Messages: POST /ai/v1/proxy/anthropic/v1/messages, forwarded unchanged to api.anthropic.com (body passed
#   through; anthropic-version and anthropic-beta headers forwarded).
#   https://gitlab.com/gitlab-org/modelops/applied-ml/code-suggestions/ai-assist/-/blob/main/ai_gateway/proxy/clients/anthropic.py
# Toggle: thinking.type = adaptive|disabled. Effort: output_config.effort = low|medium|high|xhigh|max.
# Cost: billed per model call in GitLab Credits ($1 each on demand; claude-sonnet-5: 3.2 calls per credit, https://docs.gitlab.com/subscriptions/gitlab_credits/).
#   v2 has no per-request unit, so token prices stay 0 (calls draw on the subscription's credits).
# limit.output = 64_000: models.yml max_tokens for `claude_sonnet_5` (below the lab's 128,000).
# Mid-conversation flags unset: GitLab documents none, and no live test (no GitLab token).
schema = 2
base_model = "anthropic/claude-sonnet-5"
name = "Agentic Chat (Claude Sonnet 5)"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[limit]
output = 64_000

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
