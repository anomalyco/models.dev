# Serverless supports only POST `/v1/responses`; use
# `reasoning.effort = none|low|medium|high|xhigh`.
# https://docs.digitalocean.com/products/inference/details/models/index.html.md (accessed 2026-06-25)
# https://developers.openai.com/api/docs/models/gpt-5.4 (accessed 2026-06-25)
name = "OpenAI GPT-5.4"
description = "Frontier GPT model for professional reasoning, coding, and multimodal work"
family = "gpt"
release_date = "2026-03-05"
last_updated = "2026-03-05"
attachment = true
reasoning = true
temperature = false
tool_call = true
structured_output = true
knowledge = "2025-08-31"
open_weights = false

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "xhigh"]

[cost]
input = 2.5
output = 15
cache_read = 0.25

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 5
output = 22.5
cache_read = 0.5

[limit]
context = 400_000
output = 128_000

[modalities]
input = ["text", "image"]
output = ["text"]
