# Serverless supports only POST `/v1/responses`; use
# `reasoning.effort = none|low|medium|high|xhigh`.
# https://docs.digitalocean.com/products/inference/details/models/index.html.md (accessed 2026-06-25)
# https://developers.openai.com/api/docs/models/gpt-5.4 (accessed 2026-06-25)
# Mid-conversation: served on POST https://inference.do-ai.run/v1/chat/completions, where reasoning_effort
# and tools are per-request fields (effort_updates = false, tools.updates = false).
# system_updates: live 2026-10-20, a system message after an assistant turn was delivered.
# Cache: automatic for prompts of 1024+ tokens. https://docs.digitalocean.com/products/inference/how-to/use-prompt-caching/
# tools.freeform on [api.responses] only: /v1/responses accepted text, lark and regex custom tools and enforced the grammars (regex ZZ[0-9]{3} and the equivalent lark grammar both returned ZZ plus three digits, live 2026-10-28 on this model). /v1/chat/completions rejects the nested custom tool (400 "tool with type custom must have a name") and turns the flat form into a plain function tool with no grammar (openai-gpt-5.4, live 2026-10-28). /v1/messages has no custom tools.
schema = 2
base_model = "openai/gpt-5.4"
base_model_omit = ["limit.input"]
name = "OpenAI GPT-5.4"
description = "Frontier GPT model for professional reasoning, coding, and multimodal work"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
cache = { implicit = { min_tokens = 1_024 } }
structured_output = true
temperature = false
system_updates = true
service_tier = ["flex", "priority"]

[limit]
context = 400_000

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }
capabilities = { tools = { freeform = ["text", "lark", "regex"] } }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 2.5
cache = { read = 0.25 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 5
cache = { read = 0.5 }

[[cost.text.input.overrides]]
when = { service_tier = { equals = "priority" } }
price = 5
cache = { read = 0.5 }

[[cost.text.input.overrides]]
when = { service_tier = { equals = "flex" } }
price = 1.25
cache = { read = 0.13 }

[[cost.text.input.overrides]]
when = { service_tier = { equals = "flex" }, context = { gt = 272_000 } }
price = 2.5
cache = { read = 0.25 }

[cost.text.output]
price = 15

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 22.5

[[cost.text.output.overrides]]
when = { service_tier = { equals = "priority" } }
price = 30

[[cost.text.output.overrides]]
when = { service_tier = { equals = "flex" } }
price = 7.5

[[cost.text.output.overrides]]
when = { service_tier = { equals = "flex" }, context = { gt = 272_000 } }
price = 11.25

[cost.web_search]
price = 10
