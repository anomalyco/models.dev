# Mid-conversation: served on POST https://inference.do-ai.run/v1/chat/completions, where reasoning_effort
# and tools are per-request fields (effort_updates = false, tools.updates = false).
# system_updates: live 2026-10-20, a system message after an assistant turn was delivered.
# Cache: DigitalOcean-hosted, automatic prefix caching; prompt_cache_key scopes it. https://docs.digitalocean.com/products/inference/how-to/use-prompt-caching/
schema = 2
base_model = "nvidia/nemotron-3-ultra-550b-a55b"
name = "Nemotron 3 Ultra"
description = "Flagship Nemotron model for high-throughput reasoning and complex agents"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = false }
cache = { implicit = true }
system_updates = true
effort_updates = false
prompt_cache_key = true

[limit]
context = 131_072
output = 131_072

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.9
cache = { read = 0.18 }

[cost.text.output]
price = 1.7

[cost.web_search]
price = 10
