# Input MIME types: Anthropic's Claude 3 image types (models/anthropic/claude-3-haiku-20240307.toml).
# Mid-conversation: served on POST https://inference.do-ai.run/v1/chat/completions, where reasoning_effort
# and tools are per-request fields (effort_updates = false, tools.updates = false).
schema = 2
name = "Claude 3 Opus"
description = "Legacy model retained for compatibility with older integrations"
family = "claude-opus"
open_weights = false
knowledge = "2023-08"
release_date = "2024-02-29"
status = "deprecated"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = false }
temperature = true
effort_updates = false

[limit]
context = 200_000
output = 4_096

[cost.text.input]
price = 15
cache = { read = 1.5, write = 18.75 }

[cost.text.output]
price = 75
