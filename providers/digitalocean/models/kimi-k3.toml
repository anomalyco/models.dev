# DigitalOcean exposes Kimi K3 as serverless with text/image input and $3/$15/$0.30 pricing,
# but currently omits context and output limits; those inherit from canonical metadata.
# https://api.digitalocean.com/v2/gen-ai/models/catalog (accessed 2026-08-02)
# Mid-conversation: served on POST https://inference.do-ai.run/v1/chat/completions, where reasoning_effort
# and tools are per-request fields (effort_updates = false, tools.updates = false).
# system_updates: live 2026-10-20, a system message after an assistant turn was delivered.
# Cache: DigitalOcean-hosted, automatic prefix caching; prompt_cache_key scopes it. https://docs.digitalocean.com/products/inference/how-to/use-prompt-caching/
schema = 2
base_model = "moonshotai/kimi-k3"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "high", "max"] }
cache = { implicit = true }
structured_output = true
system_updates = true
prompt_cache_key = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 3
cache = { read = 0.3 }

[cost.text.output]
price = 15

[cost.web_search]
price = 10
