# Mid-conversation: served on POST https://inference.do-ai.run/v1/chat/completions, where reasoning_effort
# and tools are per-request fields (effort_updates = false, tools.updates = false).
# system_updates: live 2026-10-20, a system message after an assistant turn was delivered.
# Cache: DigitalOcean-hosted, automatic prefix caching; prompt_cache_key scopes it. https://docs.digitalocean.com/products/inference/how-to/use-prompt-caching/
# Image MIME types: DigitalOcean's VLM docs, "Supported image formats are PNG, JPG, JPEG, and WEBP"
#   (https://docs.digitalocean.com/products/inference/how-to/use-multimodal-inference/).
#   Video stays generic: neither DigitalOcean nor the Gemma lab lists video formats.
schema = 2
base_model = "google/gemma-4-31b-it"
name = "Gemma 4"
description = "Open Gemma instruction model for efficient chat and self-hosted deployments"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "video"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = false }
cache = { implicit = true }
structured_output = true
system_updates = true
effort_updates = false
prompt_cache_key = true

[limit]
context = 256_000
output = 8_192

[cost.text.input]
price = 0.18
cache = { read = 0.036 }

[cost.text.output]
price = 0.5
