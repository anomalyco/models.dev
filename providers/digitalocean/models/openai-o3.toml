schema = 2
base_model = "openai/o3"
name = "OpenAI o3"
description = "O-series reasoning model for hard analysis, math, coding, and planning"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 2
cache = { read = 0.5 }

[cost.text.output]
price = 8
