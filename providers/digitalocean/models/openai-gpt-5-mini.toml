# Mid-conversation: served on POST https://inference.do-ai.run/v1/chat/completions, where reasoning_effort
# and tools are per-request fields (effort_updates = false, tools.updates = false).
# system_updates: live 2026-10-20, a system message after an assistant turn was delivered.
# Cache: automatic for prompts of 1024+ tokens. https://docs.digitalocean.com/products/inference/how-to/use-prompt-caching/
schema = 2
base_model = "openai/gpt-5-mini"
name = "OpenAI GPT-5 Mini"
description = "Compact GPT model for low-latency assistance and high-volume workloads"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
cache = { implicit = { min_tokens = 1_024 } }
structured_output = true
system_updates = true
service_tier = ["flex", "priority"]

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.25
cache = { read = 0.025 }

[[cost.text.input.overrides]]
when = { service_tier = { equals = "priority" } }
price = 0.45
cache = { read = 0.045 }

[[cost.text.input.overrides]]
when = { service_tier = { equals = "flex" } }
price = 0.125
cache = { read = 0.0125 }

[cost.text.output]
price = 2

[[cost.text.output.overrides]]
when = { service_tier = { equals = "priority" } }
price = 3.6

[[cost.text.output.overrides]]
when = { service_tier = { equals = "flex" } }
price = 1

[cost.web_search]
price = 10
