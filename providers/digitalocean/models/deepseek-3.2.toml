schema = 2
base_model = "deepseek/deepseek-v3.2"
name = "Deepseek 3.2"
description = "DeepSeek chat model for instruction following, coding, and analysis"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }

[limit]
context = 163_840
output = 163_840

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.5
cache = { read = 0.15 }

[cost.text.output]
price = 1.6
