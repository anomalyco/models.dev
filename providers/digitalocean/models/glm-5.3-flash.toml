# Text-only on DigitalOcean for now. The DigitalOcean catalog and docs list image
# and video input, but the standard serverless endpoint rejects them with 400
# "unsupported multimodal content: image_url" / "video_url" (verified 2026-10-16
# on Chat Completions and Messages). DigitalOcean confirmed the standard endpoint
# lacks multimodal support and is working on a fix. Restore the original line
# below and remove the UNSUPPORTED_INPUT_MODALITIES entry in
# packages/core/src/sync/providers/digitalocean.ts once it is served.
# input = ["text", "image", "video"]
schema = 2
base_model = "zhipuai/glm-5.3-flash"
name = "GLM5.3 Flash"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[limit]
context = 1_048_576

[cost.text.input]
price = 0.15
cache = { read = 0.03 }

[cost.text.output]
price = 0.5
