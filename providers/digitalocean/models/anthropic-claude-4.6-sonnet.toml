# Mid-conversation: served on POST https://inference.do-ai.run/v1/chat/completions, where reasoning_effort
# and tools are per-request fields (effort_updates = false, tools.updates = false).
# system_updates: live 2026-10-20, a system message after an assistant turn was delivered.
# Cache: explicit cache_control (ttl 5m|1h); automatic only through the Inference Router. https://docs.digitalocean.com/products/inference/how-to/use-prompt-caching/
schema = 2
base_model = "anthropic/claude-sonnet-4-6"
name = "Anthropic Claude Sonnet 4.6"
description = "Balanced Claude model for coding, analysis, agent workflows, and cost control"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high", "max"] }
cache = { explicit = { ttl = ["5m", "1h"] } }
system_updates = true
effort_updates = false

[limit]
context = 200_000
output = 8_192

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 3
cache = { read = 0.3, write = { "5m" = 3.75, "1h" = 6 } }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 6
cache = { read = 0.6, write = { "5m" = 7.5, "1h" = 12 } }

[cost.text.output]
price = 15

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 22.5

[cost.web_search]
price = 0
