# Serverless supports only POST `/v1/responses`; use
# `reasoning.effort = none|low|medium|high|xhigh`.
# https://docs.digitalocean.com/products/inference/details/models/index.html.md (accessed 2026-06-25)
# https://developers.openai.com/api/docs/models/gpt-5.4-nano (accessed 2026-06-25)
schema = 2
name = "OpenAI GPT-5.4 Nano"
description = "Compact GPT model for low-latency assistance and high-volume workloads"
family = "gpt-nano"
open_weights = false
knowledge = "2025-08-31"
release_date = "2026-03-17"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true
temperature = false

[limit]
context = 400_000
output = 128_000

[cost.text.input]
price = 0.2
cache = { read = 0.02 }

[cost.text.output]
price = 1.25
