# Mid-conversation: served on POST https://inference.do-ai.run/v1/chat/completions, where reasoning_effort
# and tools are per-request fields (effort_updates = false, tools.updates = false).
# system_updates: live 2026-10-20, a system message after an assistant turn was delivered.
# Cache: DigitalOcean-hosted, automatic prefix caching; prompt_cache_key scopes it. https://docs.digitalocean.com/products/inference/how-to/use-prompt-caching/
schema = 2
base_model = "arcee-ai/trinity-large-thinking"
name = "Arcee Trinity Large Thinking (Public Preview)"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
cache = { implicit = true }
system_updates = true
prompt_cache_key = true

[limit]
context = 128_000
output = 32_000

[cost.text.input]
price = 0.25
cache = { read = 0.06 }

[cost.text.output]
price = 0.9

[cost.web_search]
price = 10
