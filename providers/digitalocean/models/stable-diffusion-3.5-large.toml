# Endpoints: https://docs.digitalocean.com/products/inference/how-to/si-endpoints/ (POST /v1/images/generations)
# Prices: https://docs.digitalocean.com/products/inference/details/pricing/ ($0.08 per image)
# Output: /v1/images/generations output_format "Supported values: png, webp, jpeg"
#   (https://docs.digitalocean.com/reference/api/reference/serverless-inference/).
schema = 2
type = "image"
name = "Stable Diffusion 3.5 Large"
description = "Image model for prompt-driven generation, editing, and visual design workflows"
family = "stable-diffusion"
open_weights = true
release_date = "2024-10-22"
last_updated = "2026-04-30"

[modalities]
input = ["text"]
output = ["image/png", "image/webp", "image/jpeg"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false

[limit]
context = 256
output = 1

[api.images]

[cost.image.output]
unit = "image"
price = 0.08
