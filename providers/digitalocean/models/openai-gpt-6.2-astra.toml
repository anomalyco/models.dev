schema = 2
base_model = "openai/gpt-6.2-astra"
name = "OpenAI GPT-6.2 Astra"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
service_tier = ["priority"]

[cost.text.input]
price = 8
cache = { read = 0.4 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 16
cache = { read = 0.8 }

[[cost.text.input.overrides]]
when = { service_tier = { equals = "priority" } }
price = 16
cache = { read = 0.8 }

[[cost.text.input.overrides]]
when = { service_tier = { equals = "priority" }, context = { gt = 272_000 } }
price = 32
cache = { read = 1.6 }

[cost.text.output]
price = 40

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 60

[[cost.text.output.overrides]]
when = { service_tier = { equals = "priority" } }
price = 80

[[cost.text.output.overrides]]
when = { service_tier = { equals = "priority" }, context = { gt = 272_000 } }
price = 120
