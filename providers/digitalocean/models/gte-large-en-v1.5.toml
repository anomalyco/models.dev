# Endpoints: https://docs.digitalocean.com/products/inference/how-to/si-endpoints/ (POST /v1/embeddings)
# Prices: https://docs.digitalocean.com/products/inference/details/pricing/
schema = 2
type = "embedding"
name = "GTE Large (v1.5)"
description = "Embedding model for semantic search, retrieval, clustering, and ranking pipelines"
family = "text-embedding"
open_weights = true
release_date = "2024-03-27"
last_updated = "2026-04-16"

[modalities]
input = ["text"]
output = ["embedding"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false

[limit]
context = 8_192
output = 1_024

[api.embeddings]
sdk = { opencodeai = "none" }

[cost.text.input]
price = 0.09

[cost.text.output]
price = 0
