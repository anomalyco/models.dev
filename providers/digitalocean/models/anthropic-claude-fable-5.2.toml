schema = 2
base_model = "anthropic/claude-fable-5-2"
name = "Anthropic Claude Fable 5.2"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
service_tier = ["fast"]

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 8
cache = { read = 0.2, write = { "5m" = 10, "1h" = 16 } }

[[cost.text.input.overrides]]
when = { service_tier = { equals = "fast" } }
price = 16
cache = { read = 0.4, write = { "5m" = 20, "1h" = 32 } }

[cost.text.output]
price = 40

[[cost.text.output.overrides]]
when = { service_tier = { equals = "fast" } }
price = 80

[cost.web_search]
price = 0
