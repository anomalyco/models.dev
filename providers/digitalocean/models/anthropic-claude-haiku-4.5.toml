# Mid-conversation: served on POST https://inference.do-ai.run/v1/chat/completions, where reasoning_effort
# and tools are per-request fields (effort_updates = false, tools.updates = false).
# system_updates: live 2026-10-20, a system message after an assistant turn was delivered.
# Cache: explicit cache_control (ttl 5m|1h); automatic only through the Inference Router. https://docs.digitalocean.com/products/inference/how-to/use-prompt-caching/
schema = 2
base_model = "anthropic/claude-haiku-4-5"
name = "Anthropic Claude Haiku 4.5"
description = "Fast Claude model for responsive assistance, classification, and lightweight agents"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
cache = { explicit = { ttl = ["5m", "1h"] } }
system_updates = true
effort_updates = false

[limit]
output = 8_192

[cost.text.input]
price = 1
cache = { read = 0.1, write = 1.25 }

[cost.text.output]
price = 5
