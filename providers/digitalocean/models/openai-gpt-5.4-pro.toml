# Serverless supports only POST `/v1/responses`; this model restricts
# `reasoning.effort` to medium|high|xhigh.
# https://docs.digitalocean.com/products/inference/details/models/index.html.md (accessed 2026-06-25)
# https://developers.openai.com/api/docs/models/gpt-5.4-pro (accessed 2026-06-25)
name = "OpenAI GPT-5.4 Pro"
description = "Frontier GPT model for professional reasoning, coding, and multimodal work"
family = "gpt-pro"
release_date = "2026-03-05"
last_updated = "2026-03-05"
attachment = true
reasoning = true
temperature = false
tool_call = true
knowledge = "2025-08-31"
open_weights = false

[[reasoning_options]]
type = "effort"
values = ["medium", "high", "xhigh"]

[cost]
input = 30
output = 180

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 60
output = 270

[limit]
context = 1_050_000
output = 128_000

[modalities]
input = ["text", "image"]
output = ["text"]
