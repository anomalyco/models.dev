# Serverless supports only POST `/v1/responses`; this model restricts
# `reasoning.effort` to medium|high|xhigh.
# https://docs.digitalocean.com/products/inference/details/models/index.html.md (accessed 2026-06-25)
# https://developers.openai.com/api/docs/models/gpt-5.4-pro (accessed 2026-06-25)
# Mid-conversation: served on POST https://inference.do-ai.run/v1/chat/completions, where reasoning_effort
# and tools are per-request fields (effort_updates = false, tools.updates = false).
# system_updates: live 2026-10-20, a system message after an assistant turn was delivered.
# Cache: automatic for prompts of 1024+ tokens. https://docs.digitalocean.com/products/inference/how-to/use-prompt-caching/
schema = 2
base_model = "openai/gpt-5.4-pro"
name = "OpenAI GPT-5.4 Pro"
description = "Frontier GPT model for professional reasoning, coding, and multimodal work"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["medium", "high", "xhigh"] }
cache = { supported = true, implicit = { min_tokens = 1_024 } }
system_updates = true
effort_updates = false

[cost.text.input]
price = 30

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 60

[cost.text.output]
price = 180

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 270
