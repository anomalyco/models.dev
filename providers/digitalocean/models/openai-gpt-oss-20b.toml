# Mid-conversation: served on POST https://inference.do-ai.run/v1/chat/completions, where reasoning_effort
# and tools are per-request fields (effort_updates = false, tools.updates = false).
# system_updates: live 2026-10-20, a system message after an assistant turn was delivered.
# Cache: DigitalOcean-hosted, automatic prefix caching; prompt_cache_key scopes it. https://docs.digitalocean.com/products/inference/how-to/use-prompt-caching/
schema = 2
name = "OpenAI GPT-oss-20b"
description = "Open-weight GPT model for self-hosted reasoning and instruction-following workloads"
family = "gpt-oss"
open_weights = true
knowledge = "2024-06"
release_date = "2025-08-05"
last_updated = "2026-04-16"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
cache = { supported = true, implicit = true }
structured_output = true
temperature = true
system_updates = true
effort_updates = false
prompt_cache_key = true

[limit]
context = 128_000
output = 4_096

[cost.text.input]
price = 0.05
cache = { read = 0.01 }

[cost.text.output]
price = 0.45
