# Endpoints: https://docs.digitalocean.com/products/inference/how-to/si-endpoints/ (async POST /v1/video/generations)
# Prices: https://docs.digitalocean.com/products/inference/details/pricing/ ($0.60 per video; no per-video cost unit, so no price)
# Output: "The output video is in MP4 format" (https://docs.digitalocean.com/products/inference/how-to/use-multimodal-inference/).
schema = 2
type = "video"
name = "Wan2.2-T2V-A14B"
description = "Video model for prompt-guided generation, editing, and motion workflows"
open_weights = true
release_date = "2025-07-28"
last_updated = "2026-04-30"

[modalities]
input = ["text"]
output = ["video/mp4"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false

[limit]
context = 100
output = 1
