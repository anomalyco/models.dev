schema = 2
base_model = "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"
name = "Nemotron 3 Nano Omni"

[modalities]
input = ["text", "image/jpeg", "image/png", "video/mp4"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"] }
structured_output = true

[limit]
context = 65_536

[cost.text.input]
price = 0.5
cache = { read = 0.1 }

[cost.text.output]
price = 0.9
