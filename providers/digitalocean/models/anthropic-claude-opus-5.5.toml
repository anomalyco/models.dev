# Mid-conversation: served on POST https://inference.do-ai.run/v1/chat/completions, where reasoning_effort
# and tools are per-request fields (effort_updates = false, tools.updates = false).
# system_updates: live 2026-10-20, a system message after an assistant turn was delivered.
# Cache: explicit cache_control (ttl 5m|1h); automatic only through the Inference Router. https://docs.digitalocean.com/products/inference/how-to/use-prompt-caching/
schema = 2
base_model = "anthropic/claude-opus-5-5"
name = "Anthropic Claude Opus 5.5"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
cache = { explicit = { ttl = ["5m", "1h"] } }
system_updates = true
service_tier = ["fast"]

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 4
cache = { read = 0.2, write = { "5m" = 5, "1h" = 8 } }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 8
cache = { read = 0.4, write = { "5m" = 10, "1h" = 16 } }

[[cost.text.input.overrides]]
when = { service_tier = { equals = "fast" } }
price = 8
cache = { read = 0.4, write = { "5m" = 10, "1h" = 16 } }

[cost.text.output]
price = 20

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 30

[[cost.text.output.overrides]]
when = { service_tier = { equals = "fast" } }
price = 40

[cost.web_search]
price = 0
