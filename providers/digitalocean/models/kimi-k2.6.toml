schema = 2
base_model = "moonshotai/kimi-k2.6"
description = "Kimi multimodal agent model for visual understanding, coding, and planning"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
temperature = false

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.95
cache = { read = 0.19 }

[cost.text.output]
price = 4
