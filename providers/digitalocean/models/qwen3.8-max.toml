# Mid-conversation: served on POST https://inference.do-ai.run/v1/chat/completions, where reasoning_effort
# and tools are per-request fields (effort_updates = false, tools.updates = false).
# system_updates = false: live 2026-10-20, a system message after an assistant turn returns 400 ("System message must be at the beginning.").
# Cache: DigitalOcean-hosted, automatic prefix caching; prompt_cache_key scopes it. https://docs.digitalocean.com/products/inference/how-to/use-prompt-caching/
schema = 2
base_model = "alibaba/qwen3.8-max"
name = "Qwen3.8-Max"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic", "video/mp4", "video/x-msvideo", "video/x-matroska", "video/quicktime", "video/x-flv", "video/x-ms-wmv"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"] }
cache = { implicit = true }
system_updates = false
effort_updates = false
prompt_cache_key = true

[limit]
output = 262_144

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 2
cache = { read = 0.2 }

[cost.text.output]
price = 6

[cost.web_search]
price = 10
