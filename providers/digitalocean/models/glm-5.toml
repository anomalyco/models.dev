schema = 2
name = "GLM 5"
description = "Flagship GLM model for hybrid reasoning, coding, and agentic engineering"
family = "glm"
open_weights = true
release_date = "2026-02-11"
last_updated = "2026-04-16"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"] }
temperature = true

[limit]
context = 64_000
output = 64_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1
cache = { read = 0.2 }

[cost.text.output]
price = 3.2
