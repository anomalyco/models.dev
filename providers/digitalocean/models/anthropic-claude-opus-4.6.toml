# Mid-conversation: served on POST https://inference.do-ai.run/v1/chat/completions, where reasoning_effort
# and tools are per-request fields (effort_updates = false, tools.updates = false).
# system_updates: live 2026-10-20, a system message after an assistant turn was delivered.
# Cache: explicit cache_control (ttl 5m|1h); automatic only through the Inference Router. https://docs.digitalocean.com/products/inference/how-to/use-prompt-caching/
schema = 2
base_model = "anthropic/claude-opus-4-6"
name = "Anthropic Claude Opus 4.6"
description = "Flagship Claude model for deep reasoning, coding, and long-horizon agents"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high", "max"] }
cache = { supported = true, implicit = false, explicit = { ttl = ["5m", "1h"] } }
system_updates = true
effort_updates = false

[limit]
context = 200_000
output = 8_192

[cost.text.input]
price = 5
cache = { read = 0.5, write = 6.25 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 10
cache = { read = 1, write = 12.5 }

[cost.text.output]
price = 25

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 37.5
