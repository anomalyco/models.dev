# Lifecycle: lifecycle_status = end_of_life in https://api.digitalocean.com/v2/gen-ai/models (2026-10-20).
# Mid-conversation: served on POST https://inference.do-ai.run/v1/chat/completions, where reasoning_effort
# and tools are per-request fields (effort_updates = false, tools.updates = false).
schema = 2
base_model = "anthropic/claude-sonnet-4-0"
name = "Claude Sonnet 4"
status = "deprecated"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
effort_updates = false

[limit]
context = 1_000_000

[cost.text.input]
price = 3
cache = { read = 0.3, write = 3.75 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 6
cache = { read = 0.3, write = 3.75 }

[cost.text.output]
price = 15

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 22.5
