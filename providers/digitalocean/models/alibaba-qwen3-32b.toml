schema = 2
base_model = "alibaba/qwen3-32b"
description = "Qwen instruction model for multilingual chat, reasoning, and tool use"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"] }
structured_output = true

[limit]
context = 32_768
output = 32_768

[cost.text.input]
price = 0.25

[cost.text.output]
price = 0.55
