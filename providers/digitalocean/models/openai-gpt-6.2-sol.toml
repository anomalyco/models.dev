schema = 2
base_model = "openai/gpt-6.2-sol"
name = "OpenAI GPT-6.2 Sol"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
service_tier = ["priority"]

[cost.text.input]
price = 2
cache = { read = 0.1 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 4
cache = { read = 0.2 }

[[cost.text.input.overrides]]
when = { service_tier = { equals = "priority" } }
price = 4
cache = { read = 0.2 }

[[cost.text.input.overrides]]
when = { service_tier = { equals = "priority" }, context = { gt = 272_000 } }
price = 8
cache = { read = 0.4 }

[cost.text.output]
price = 10

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 15

[[cost.text.output.overrides]]
when = { service_tier = { equals = "priority" } }
price = 20

[[cost.text.output.overrides]]
when = { service_tier = { equals = "priority" }, context = { gt = 272_000 } }
price = 30
