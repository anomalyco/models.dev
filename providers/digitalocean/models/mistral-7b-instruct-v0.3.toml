# Mid-conversation: served on POST https://inference.do-ai.run/v1/chat/completions, where reasoning_effort
# and tools are per-request fields (effort_updates = false, tools.updates = false).
schema = 2
name = "Mistral 7B Instruct v0.3"
description = "Mistral model for multilingual chat, reasoning, and tool-assisted workflows"
family = "mistral"
open_weights = true
release_date = "2024-05-22"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = false }
temperature = true
effort_updates = false

[limit]
context = 32_768
output = 32_768
