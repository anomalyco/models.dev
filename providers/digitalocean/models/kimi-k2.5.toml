schema = 2
base_model = "moonshotai/kimi-k2.5"
description = "Kimi model for long-context chat, coding, and agentic reasoning"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.5
cache = { read = 0.203 }

[cost.text.output]
price = 2.7
