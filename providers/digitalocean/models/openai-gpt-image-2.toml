# Endpoints: https://docs.digitalocean.com/products/inference/how-to/si-endpoints/ (POST /v1/images/generations)
# Prices: https://docs.digitalocean.com/products/inference/details/pricing/ (text input $5, text output $0, text cache read $1.25;
# image input $8, image output $30, image cache read $2 per 1M tokens; catalog image_input/image_output/image_cache_read_input_price_per_million).
schema = 2
base_model = "openai/gpt-image-2"
name = "OpenAI GPT Image 2"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp"]
output = ["image/png", "image/jpeg", "image/webp", "text"]

[limit]
output = 16_384

[api.images]
sdk = { opencodeai = "@opencode/ai/providers/digitalocean/images" }

[cost.text.input]
price = 5
cache = { read = 1.25 }

[cost.text.output]
price = 0

[cost.image.input]
price = 8
cache = { read = 2 }

[cost.image.output]
price = 30
