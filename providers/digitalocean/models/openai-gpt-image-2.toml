# Endpoints: https://docs.digitalocean.com/products/inference/how-to/si-endpoints/ (POST /v1/images/generations)
# Prices: https://docs.digitalocean.com/products/inference/details/pricing/
schema = 2
base_model = "openai/gpt-image-2"
name = "OpenAI GPT Image 2"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp"]
output = ["image/png", "image/jpeg", "image/webp", "text"]

[limit]
output = 16_384

[api.images]

[cost.text.input]
price = 8

[cost.text.output]
price = 30
