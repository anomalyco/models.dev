# Mid-conversation: served on POST https://inference.do-ai.run/v1/chat/completions, where reasoning_effort
# and tools are per-request fields (effort_updates = false, tools.updates = false).
# system_updates = false: live 2026-10-20, a system message after an assistant turn returns 400 ("System message must be at the beginning.").
# Cache: DigitalOcean-hosted, automatic prefix caching; prompt_cache_key scopes it. https://docs.digitalocean.com/products/inference/how-to/use-prompt-caching/
schema = 2
base_model = "alibaba/qwen3.5-397b-a17b"
name = "Qwen 3.5 397B A17B"
description = "Qwen instruction model for multilingual chat, reasoning, and tool use"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
cache = { supported = true, implicit = true }
structured_output = true
system_updates = false
effort_updates = false
prompt_cache_key = true

[limit]
context = 131_072
output = 131_072

[cost.text.input]
price = 0.55
cache = { read = 0.111 }

[cost.text.output]
price = 3.5
