name = "OpenCode"
env = ["OPENCODE_API_KEY"]
npm = "@ai-sdk/openai-compatible"
# Shared inference base (accessed 2026-10-12): POST `/inference/v1/chat/completions`,
# `/inference/v1/responses`, `/inference/v1/messages`, and
# `/inference/v1/models/{model}:generateContent` route to the same handlers as the
# protocol-specific paths in https://opencode.ai/v2/docs/console/api/inference/.
# Model endpoints: https://opencode.ai/v2/docs/console/models/#endpoints
api = "https://opencode.ai/inference/v1"
doc = "https://opencode.ai/v2/docs/console/models/"
