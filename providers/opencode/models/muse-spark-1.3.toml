# Pricing and endpoint (Responses): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# Effort: reasoning.effort = minimal|low|medium|high|xhigh
# Mid-conversation (live on Zen 2026-10-21; warm prefix, then the change before the next turn vs an unchanged control; cached prompt tokens control -> changed):
#   system_updates = true: a developer message before the next user turn was kept in place (cached 8675 -> 8689)
#   effort_updates = false: reasoning.effort high -> low dropped the cache (cached 8675 -> 0)
#   tools.updates = false: adding a tool dropped the cache (cached 9201 -> 113); additional_tools returned 400
# Cache (live): implicit (cached tokens reported without cache markers).
schema = 2
base_model = "meta/muse-spark-1.3"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh"] }
structured_output = true
cache = { supported = true, implicit = true }
system_updates = true
effort_updates = false

[api.responses]
base_url = "https://opencode.ai/inference/openai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }

[cost.text.input]
price = 1.25
cache = { read = 0.15 }

[cost.text.output]
price = 4.25
