schema = 2
base_model = "google/gemini-3-pro-preview"
name = "Gemini 3 Pro"
description = "Legacy model retained for compatibility with older integrations"
status = "deprecated"

[capabilities]
reasoning = { supported = true, effort = ["low", "high"] }
structured_output = true

[api.generate-content]
base_url = "https://opencode.ai/inference/google/v1beta"
sdk = { aisdk = "@ai-sdk/google" }

[cost.text.input]
price = 2
cache = { read = 0.2 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 4
cache = { read = 0.4 }

[cost.text.output]
price = 12

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 18
