# Pricing and endpoint (Gemini generateContent): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# Effort: generationConfig.thinkingConfig.thinkingLevel = minimal|low|medium|high (not re-verified on Zen: model access is disabled for the probe key)
# Mid-conversation flags (system_updates, effort_updates, tools.updates) follow providers/google/models/gemini-3.5-flash.toml (Zen passes requests through).
# Tools follow Google's Gemini API: https://ai.google.dev/gemini-api/docs/function-calling#function-calling-modes (auto/any/none, allowed function names); Zen passes requests through.
# recommended_api: Zen serves Gemini on Google's Interactions API at /inference/google/v1beta/interactions (verified 2026-11-20 on 3.5 Flash Lite, 3.8 Flash and 4 Argon/Carbon/Hydrogen/Neon); not re-verified here because model access is disabled for the probe key. providers/google lists this model with recommended_api = "interactions".
schema = 2
base_model = "google/gemini-3.5-flash"
recommended_api = "interactions"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true

[api.generate-content]
base_url = "https://opencode.ai/inference/google/v1beta"
sdk = { aisdk = "@ai-sdk/google", opencodeai = "@opencode/ai/providers/google" }

[api.interactions]
base_url = "https://opencode.ai/inference/google/v1beta"
sdk = { aisdk = "@ai-sdk/google", opencodeai = "@opencode/ai/providers/google/interactions" }

[cost.text.input]
price = 1.5
cache = { read = 0.15 }

[cost.text.output]
price = 9

[cost.audio.input]
price = 1.5
