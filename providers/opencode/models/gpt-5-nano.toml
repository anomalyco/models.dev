# Pricing and endpoint (Responses): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# Effort: reasoning.effort = minimal|low|medium|high
# Cache (live): implicit (cached tokens reported without cache markers).
# Mid-conversation flags (system_updates, effort_updates, tools.updates) follow providers/openai/models/gpt-5-nano.toml (Zen passes requests through).
#   tools.updates is add only: an in-history additional_tools item (OpenAI Responses).
schema = 2
base_model = "openai/gpt-5-nano"
description = "Compact GPT model for low-latency assistance and high-volume workloads"

[capabilities]
tools = { supported = true, updates = true }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true
cache = { implicit = true }
system_updates = true

[api.responses]
base_url = "https://opencode.ai/inference/openai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }

[cost.text.input]
price = 0.05
cache = { read = 0.005 }

[cost.text.output]
price = 0.4
