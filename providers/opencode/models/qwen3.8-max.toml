# Pricing and endpoint (Chat Completions): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# Modalities: Zen Chat Completions takes images (live: PNG read correctly) but rejects file parts (live 400), so no PDF or video; image types from the lab.
# Reasoning on Zen Chat Completions (live): enable_thinking and thinking_budget are rejected (400 "Extra inputs are not permitted"); thinking.type = disabled and reasoning_effort = none turn reasoning off.
# reasoning_effort accepts Alibaba's low|medium|xhigh (high and max are accepted too, but over 3 trials their reasoning tokens didn't separate from xhigh, and Alibaba documents high as an alias of xhigh); thinking.budget_tokens is accepted from 1024 (1023 returns 400 "must be >= 1024"; 300000 is accepted).
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|medium|xhigh
# Budget: thinking.budget_tokens (min 1024) with thinking.type = enabled
# Cache (live): implicit (cached tokens reported without cache markers).
# Mid-conversation flags (system_updates, effort_updates, tools.updates) follow providers/alibaba/models/qwen3.8-max.toml (Zen passes requests through).
#   system_updates left out although the lab claims it: Zen Chat Completions rejects a later system message (live 2026-10-21 and 2026-10-23: 400 "System message must be at the beginning").
schema = 2
base_model = "alibaba/qwen3.8-max"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "xhigh"], budget = { min = 1_024 } }
cache = { implicit = true }

[limit]
context = 262_144

[api.chat-completions]
base_url = "https://opencode.ai/inference/openai/v1"

[cost.text.input]
price = 2
cache = { read = 0.25, write = 2.5 }

[cost.text.output]
price = 6
