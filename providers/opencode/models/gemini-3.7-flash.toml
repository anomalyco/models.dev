# Pricing and endpoint (Gemini generateContent): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# Intro pricing ($0.75/$3.75/$0.075) through December 31, 2026, the same promotion as Gemini 3.6 and 3.8 Flash; the multiplier applies the $1.50/$7.50/$0.15 list price from 2027-01-01. Google's pricing page (https://ai.google.dev/gemini-api/docs/pricing) does not list Gemini 3.7 Flash yet.
# Effort: generationConfig.thinkingConfig.thinkingLevel = low|medium|high (not re-verified on Zen: model access is disabled for the probe key)
# Mid-conversation flags (system_updates, effort_updates, tools.updates) follow providers/google/models/gemini-3.7-flash.toml (Zen passes requests through).
# Tools follow Google's Gemini API: https://ai.google.dev/gemini-api/docs/function-calling#function-calling-modes (auto/any/none, allowed function names); Zen passes requests through.
schema = 2
base_model = "google/gemini-3.7-flash"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[api.generate-content]
base_url = "https://opencode.ai/inference/google/v1beta"
sdk = { aisdk = "@ai-sdk/google", opencodeai = "@opencode/ai/providers/google" }

[cost.text.input]
price = 0.75
cache = { read = 0.075 }

[cost.text.output]
price = 3.75

[cost.audio.input]
price = 0.75

[[cost.multipliers]]
when = { date = { gte = "2027-01-01" } }
factor = 2
