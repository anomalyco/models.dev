# Pricing and endpoint (Chat Completions): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# thinking.type = disabled turns reasoning off (live: 60 -> 0 reasoning tokens); adaptive is accepted.
# Toggle: thinking.type = adaptive|disabled
# Cache (live): implicit (cached tokens reported without cache markers).
# Mid-conversation flags (system_updates, effort_updates, tools.updates) follow providers/minimax/models/MiniMax-M3.toml (Zen passes requests through).
#   system_updates left out although the lab claims it: Zen drops a later system message (live 2026-10-21 and 2026-10-23: 200, cache kept, but prompt tokens unchanged and the instruction ignored, 4/4).
# Tools follow MiniMax's API: https://platform.minimax.io/docs/api-reference/text-chat-anthropic (ToolChoice: only auto); Zen passes requests through.
schema = 2
base_model = "minimax/MiniMax-M3"

[capabilities]
tools = { supported = true, choice = ["auto"] }
reasoning = { supported = true, toggle = true }
cache = { implicit = true }

[limit]
context = 512_000
output = 128_000

[api.chat-completions]
base_url = "https://opencode.ai/inference/openai/v1"
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.3
cache = { read = 0.06 }

[cost.text.output]
price = 1.2
