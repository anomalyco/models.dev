# Effort: reasoning.effort = minimal|low|medium|high|xhigh (deprecated; not re-verified on Zen)
# Mid-conversation flags (system_updates, effort_updates, tools.updates) follow providers/meta/models/muse-spark-1.2.toml (Zen passes requests through).
schema = 2
base_model = "meta/muse-spark-1.2"
name = "Muse Spark 1.2 Free"
status = "deprecated"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh"] }
structured_output = true
system_updates = true

[api.responses]
base_url = "https://opencode.ai/inference/openai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }

[cost.text.input]
price = 0
cache = { read = 0 }

[cost.text.output]
price = 0
