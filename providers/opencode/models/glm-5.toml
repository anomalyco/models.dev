# Docs: listed under Deprecated models (May 14, 2026); plain requests still succeed (live 200, 2026-10-21), but the ID is now served by GLM-5.3 (disabling thinking returns 400 naming GLM-5.3) (https://opencode.ai/v2/docs/console/models/#deprecated-models, accessed 2026-10-21).
# status left unset: GET https://opencode.ai/inference/v1/models still lists this ID (2026-10-21), and OpenCode hides deprecated models, so marking it would drop a model Zen still serves.
# Toggle: thinking.type = enabled|disabled (deprecated; not re-verified on Zen)
# The deprecated glm-5 ID now answers as GLM-5.3, which rejects thinking.type = disabled (live 400 "GLM-5.3 is a thinking-only model").
# Mid-conversation (live on Zen 2026-10-21; warm prefix, then the change before the next turn vs an unchanged control; cached prompt tokens control -> changed):
#   system_updates = true: a system message before the next user turn was kept in place (cached 10376 -> 10380)
#   effort_updates = false: disabling thinking is rejected (400: [400] GLM-5.3 is a thinking-only model; disab; the ID is served by GLM-5.3)
#   tools.updates = false: adding a tool dropped the cache (cached 10522 -> 51)
# Cache (live): implicit (cached tokens reported without cache markers).
# knowledge: the host's value, unsourced (no official cutoff found). Kept so v1 doesn't lose it.
schema = 2
base_model = "zhipuai/glm-5"
knowledge = "2025-04"
description = "Flagship GLM model for hybrid reasoning, coding, and agentic engineering"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true }
cache = { supported = true, implicit = true }
system_updates = true
effort_updates = false

[api.chat-completions]
base_url = "https://opencode.ai/inference/openai/v1"
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1
cache = { read = 0.2 }

[cost.text.output]
price = 3.2
