# Pricing and endpoint (Anthropic Messages): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# thinking.budget_tokens has no 81,920 cap on Zen: 81921 and 100000 are accepted (live; 200000 returns 400). Alibaba's first-party entry records no bound either.
# Toggle: thinking.type = enabled|disabled
# Budget: thinking.budget_tokens with thinking.type = enabled
# Cache (live): explicit cache_control (block or top-level); no read without it; a 1h ttl is written as 5m.
# Mid-conversation flags (system_updates, effort_updates, tools.updates) follow providers/alibaba/models/qwen3.6-plus.toml (Zen passes requests through).
# effort_updates: left out. Changing thinking.type or thinking.budget_tokens on the next request keeps the cache, but there's no in-history effort message, so it doesn't count.
schema = 2
base_model = "alibaba/qwen3.6-plus"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true, budget = {} }
cache = { explicit = { ttl = ["5m"] } }
system_updates = true

[limit]
context = 262_144

[api.messages]
base_url = "https://opencode.ai/inference/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic" }

[cost.text.input]
price = 0.5
cache = { read = 0.05, write = 0.625 }

[cost.text.output]
price = 3
