# Pricing and endpoint (Anthropic Messages): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# Toggle: thinking.type = enabled|disabled
# Budget: thinking.budget_tokens (max 81920) with thinking.type = enabled
# Mid-conversation (live on Zen 2026-10-21; warm prefix, then the change before the next turn vs an unchanged control; cached prompt tokens control -> changed):
#   system_updates = true: a role:system message after the last user turn was kept in place (cached 14504 -> 14523)
#   effort_updates = false: thinking.type enabled -> disabled dropped the cache (cached 14507 -> 0)
#   tools.updates = false: adding a tool dropped the cache (cached 14763 -> 0)
# Cache (live): explicit cache_control (block or top-level); no read without it; a 1h ttl is written as 5m.
schema = 2
base_model = "alibaba/qwen3.6-plus"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true, budget = { max = 81_920 } }
cache = { supported = true, explicit = { ttl = ["5m"] } }
system_updates = true
effort_updates = false

[limit]
context = 262_144

[api.messages]
base_url = "https://opencode.ai/inference/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic" }

[cost.text.input]
price = 0.5
cache = { read = 0.05, write = 0.625 }

[cost.text.output]
price = 3
