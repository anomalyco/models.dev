# Pricing and endpoint (Gemini generateContent): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# The docs list Gemini 4 Argon at 50% off ($2/$10/$0.10, struck-through $4/$20/$0.20) through November 30, 2026; the multiplier restores list prices from 2026-12-01.
# Effort: generationConfig.thinkingConfig.thinkingLevel = low|medium|high
# Cache (live): implicit (cached tokens reported without cache markers).
# Mid-conversation flags (system_updates, effort_updates, tools.updates) follow providers/google/models/gemini-4-argon.toml (Zen passes requests through).
#   system_updates left out: undocumented. Google's generateContent spec lists only "user" and "model" for Content.role (https://ai.google.dev/api/caching#Content). A contents entry with role system kept the cache and was followed on Zen (live 2026-10-23), but server behavior alone is not a documented mechanism.
# Tools follow Google's Gemini API: https://ai.google.dev/gemini-api/docs/function-calling#function-calling-modes (auto/any/none, allowed function names); Zen passes requests through.
schema = 2
base_model = "google/gemini-4-argon"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[api.generate-content]
base_url = "https://opencode.ai/inference/google/v1beta"
sdk = { aisdk = "@ai-sdk/google", opencodeai = "@opencode/ai/providers/google" }

[cost.text.input]
price = 2
cache = { read = 0.1 }

[cost.text.output]
price = 10

[cost.audio.input]
price = 2

[[cost.multipliers]]
when = { date = { gte = "2026-12-01" } }
factor = 2
