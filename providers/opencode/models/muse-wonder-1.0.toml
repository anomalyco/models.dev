# GET https://opencode.ai/inference/v1/models lists muse-wonder-1.0 (verified 2026-10-20).
# Zen does not list Muse Wonder pricing yet; Zen sells at cost and matches Meta's Muse Spark
# pricing, so cost follows Meta's Model API (https://dev.meta.ai/docs/pricing-rate-limits).
# Effort values match Meta's API: minimal|low|medium|high|xhigh|max.
# Pricing and endpoint (Responses): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# Cache (live): implicit (cached tokens reported without cache markers).
# Mid-conversation flags (system_updates, effort_updates, tools.updates) follow providers/meta/models/muse-wonder-1.0.toml (Zen passes requests through).
schema = 2
base_model = "meta/muse-wonder-1.0"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true }
system_updates = true

[api.responses]
base_url = "https://opencode.ai/inference/openai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }

[cost.text.input]
price = 4
cache = { read = 0.2 }

[cost.text.output]
price = 20
