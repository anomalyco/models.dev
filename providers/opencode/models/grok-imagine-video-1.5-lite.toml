# Model: https://docs.x.ai/developers/models/grok-imagine-video-1.5-lite
# API: native xAI Videos API through OpenCode's public inference endpoint
#   (https://docs.x.ai/developers/rest-api-reference/inference/videos): POST /videos/generations
#   on https://opencode.ai/inference/xai/v1.
# Pricing: https://docs.x.ai/developers/models/grok-imagine-video-1.5-lite (accessed 2026-11-23):
#   USD per second of generated video: 480p $0.02, 720p $0.03, 1080p $0.14; input image $0.01 each.
#   The pricing index, https://docs.x.ai/developers/pricing, lists only the 480p rate.
#   The base price is the 480p rate, the API's default resolution; 720p and 1080p are overrides.
schema = 2
v2_only = true
base_model = "xai/grok-imagine-video-1.5-lite"

[api.videos]
base_url = "https://opencode.ai/inference/xai/v1"
sdk = { aisdk = "none", opencodeai = "@opencode/ai/providers/xai/videos" }

[cost.video.output]
unit = "second"
price = 0.02

[[cost.video.output.overrides]]
when = { resolution = { equals = "720p" } }
price = 0.03

[[cost.video.output.overrides]]
when = { resolution = { equals = "1080p" } }
price = 0.14

[cost.image.input]
unit = "image"
price = 0.01
