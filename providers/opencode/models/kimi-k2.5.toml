# Pricing: https://opencode.ai/v2/docs/console/models/#pricing lists Kimi K2.5 at $0.60 input, $3.00 output, $0.10 cached read (accessed 2026-10-21).
# Docs: listed under Deprecated models (August 5, 2026) (https://opencode.ai/v2/docs/console/models/#deprecated-models, accessed 2026-10-21).
# status left unset: GET https://opencode.ai/inference/v1/models still lists this ID (2026-10-21) and requests return 403 "Model access is disabled" (a workspace toggle), not the 410 Zen returns for retired IDs, and OpenCode hides deprecated models, so marking it would drop a model Zen still serves.
# Toggle: thinking.type = enabled|disabled (deprecated; not re-verified on Zen)
# Mid-conversation flags left out: moonshotai has no provider file for moonshotai/kimi-k2.5 to follow (Zen passes requests through).
schema = 2
base_model = "moonshotai/kimi-k2.5"
description = "Kimi multimodal agent model for visual understanding, coding, and planning"

[capabilities]
reasoning = { supported = true, toggle = true }

[limit]
output = 65_536

[api.chat-completions]
base_url = "https://opencode.ai/inference/openai/v1"
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.6
cache = { read = 0.1 }

[cost.text.output]
price = 3
