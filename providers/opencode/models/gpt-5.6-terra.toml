# Pricing and endpoint (Responses): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# Effort: reasoning.effort = none|low|medium|high|xhigh|max
# Cache (live): implicit (cached tokens reported without cache markers).
# Mid-conversation flags (system_updates, effort_updates, tools.updates) follow providers/openai/models/gpt-5.6-terra.toml (Zen passes requests through).
#   Surface: Responses carries the in-history messages (configuration_update for effort_updates; additional_tools for tools.updates, add only).
# Tools follow OpenAI's Responses API: https://developers.openai.com/api/docs/guides/function-calling (strict, tool_choice, custom tools with text, lark or regex format), tool_search per model page https://developers.openai.com/api/docs/models; Zen passes requests through.
schema = 2
base_model = "openai/gpt-5.6-terra"

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none", "required", "tool"], search = true, freeform = ["text", "lark", "regex"], updates = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true }
system_updates = true
effort_updates = true

[api.responses]
base_url = "https://opencode.ai/inference/openai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }

[cost.text.input]
price = 2
cache = { read = 0.2, write = 2.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 4
cache = { read = 0.4, write = 5 }

[cost.text.output]
price = 12

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 18
