# Endpoint (OpenAI Embeddings): POST https://opencode.ai/inference/openai/v1/embeddings, served through Zen's
#   openrouter-embeddings endpoint by OpenRouter's google/gemini-embedding-001.
# Pricing: what Zen bills for this model, the upstream's price (https://openrouter.ai/google/gemini-embedding-001).
schema = 2
v2_only = true
base_model = "google/gemini-embedding-001"

[api.embeddings]
base_url = "https://opencode.ai/inference/openai/v1"
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible/embeddings" }

[cost.text.input]
price = 0.15

[cost.text.output]
price = 0
