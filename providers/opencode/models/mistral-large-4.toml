# Pricing and endpoint (Chat Completions): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# The docs list Mistral Large 4 at 50% off ($0.68/$2.09/$0.07, struck-through $1.36/$4.18/$0.14) with no end date; the discounted price is used.
# Effort: reasoning_effort = none|high
# Mid-conversation (live on Zen 2026-10-21; warm prefix, then the change before the next turn vs an unchanged control; cached prompt tokens control -> changed):
#   system_updates = true: a system message before the next user turn was kept in place (cached 8684 -> 8684)
#   effort_updates = false: reasoning_effort high -> none dropped the cache (cached 8684 -> 0)
#   tools.updates = false: adding a tool dropped the cache (cached 8684 -> 0)
# Cache (live): implicit (cached tokens reported without cache markers).
schema = 2
base_model = "mistral/mistral-large-4"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = true
cache = { supported = true, implicit = true }
system_updates = true
effort_updates = false

[limit]
context = 524_288

[api.chat-completions]
base_url = "https://opencode.ai/inference/openai/v1"
sdk = { aisdk = "@ai-sdk/mistral", opencodeai = "@opencode/ai/providers/mistral" }

[cost.text.input]
price = 0.68
cache = { read = 0.07 }

[cost.text.output]
price = 2.09
