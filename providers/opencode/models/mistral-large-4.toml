# Pricing and endpoint (Chat Completions): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# The docs list Mistral Large 4 at 50% off ($0.68/$2.09/$0.07, struck-through $1.36/$4.18/$0.14) with no end date; the discounted price is used.
# Effort: reasoning_effort = none|high
# Cache (live): implicit (cached tokens reported without cache markers).
# Mid-conversation flags (system_updates, effort_updates, tools.updates) follow providers/mistral/models/mistral-large-4.toml (Zen passes requests through).
#   effort_updates left out: there's no in-history effort message, and changing reasoning_effort on the next request wouldn't count anyway (it also dropped the cache on Zen, live 2026-10-23: 0/0 each way, control 7148/7660).
schema = 2
base_model = "mistral/mistral-large-4"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = true
cache = { implicit = true }
system_updates = true

[limit]
context = 524_288

[api.chat-completions]
base_url = "https://opencode.ai/inference/openai/v1"
sdk = { aisdk = "@ai-sdk/mistral", opencodeai = "@opencode/ai/providers/mistral" }

[cost.text.input]
price = 0.68
cache = { read = 0.07 }

[cost.text.output]
price = 2.09
