# Endpoint (OpenAI Embeddings): POST https://opencode.ai/inference/openai/v1/embeddings, served through Zen's
#   deepinfra-embeddings endpoint by DeepInfra's BAAI/bge-m3.
# Pricing: what Zen bills for this model, the upstream's price (https://deepinfra.com/BAAI/bge-m3).
schema = 2
v2_only = true
base_model = "baai/bge-m3"

[api.embeddings]
base_url = "https://opencode.ai/inference/openai/v1"
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible/embeddings" }

[cost.text.input]
price = 0.01

[cost.text.output]
price = 0
