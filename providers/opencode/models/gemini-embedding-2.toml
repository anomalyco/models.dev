# Endpoint (OpenAI Embeddings): POST https://opencode.ai/inference/openai/v1/embeddings, served through Zen's
#   google-embeddings endpoint by Google AI Studio's gemini-embedding-2.
# Pricing: what Zen bills for this model, the upstream's price (https://ai.google.dev/gemini-api/docs/pricing).
# Text only: Zen serves it on the OpenAI Embeddings API, which takes no images.
schema = 2
v2_only = true
base_model = "google/gemini-embedding-2"

[modalities]
input = ["text"]
output = ["embedding"]

[api.embeddings]
base_url = "https://opencode.ai/inference/openai/v1"
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible/embeddings" }

[cost.text.input]
price = 0.2

[cost.text.output]
price = 0
