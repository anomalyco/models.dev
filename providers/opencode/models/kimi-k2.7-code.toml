# Pricing and endpoint (Chat Completions): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# Mid-conversation flags (system_updates, effort_updates, tools.updates) follow providers/moonshotai/models/kimi-k2.7-code.toml (Zen passes requests through).
# Tools follow Moonshot's API: https://platform.kimi.ai/docs/api/models-overview (tool_choice per model), https://platform.kimi.ai/docs/api/chat (strict); Zen passes requests through.
schema = 2
base_model = "moonshotai/kimi-k2.7-code"

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none"] }
reasoning = { supported = true }
structured_output = true
system_updates = true

[api.chat-completions]
base_url = "https://opencode.ai/inference/openai/v1"
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.95
cache = { read = 0.19 }

[cost.text.output]
price = 4
