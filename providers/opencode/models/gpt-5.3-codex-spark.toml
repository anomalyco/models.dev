# Pricing and endpoint (Responses): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# Effort: reasoning.effort = low|medium|high|xhigh (not re-verified on Zen: model access is disabled for the probe key)
# Mid-conversation flags (system_updates, effort_updates, tools.updates) follow OpenAI's own entry for this model, removed 2026-11-23 because it has no public OpenAI API page (Zen passes requests through).
#   Surface: Responses carries the in-history messages (additional_tools, but tools.updates is left out: see below).
# tools.updates is left out: on GPT-5.5 and earlier, calls to tools added through additional_tools come back namespaced and replaying them without the namespace fails ("Missing namespace for function_call", live 2026-11-16), so callers fold tool changes into the top-level tools list.
schema = 2
base_model = "openai/gpt-5.3-codex-spark"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
system_updates = true

[limit]
input = 128_000
output = 128_000

[api.responses]
base_url = "https://opencode.ai/inference/openai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }

[cost.text.input]
price = 1.75
cache = { read = 0.175 }

[cost.text.output]
price = 14
