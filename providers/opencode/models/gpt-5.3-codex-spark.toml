# Pricing and endpoint (Responses): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# Effort: reasoning.effort = low|medium|high|xhigh (not re-verified on Zen: model access is disabled for the probe key)
# Mid-conversation flags unset: Zen documents none and this model wasn't testable (model access is disabled for the probe key).
schema = 2
base_model = "openai/gpt-5.3-codex-spark"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true

[limit]
input = 128_000
output = 128_000

[api.responses]
base_url = "https://opencode.ai/inference/openai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }

[cost.text.input]
price = 1.75
cache = { read = 0.175 }

[cost.text.output]
price = 14
