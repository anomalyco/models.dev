# Mid-conversation flags (system_updates, effort_updates, tools.updates) follow Xiaomi's own API for mimo-v2.5 (none set; retired there 2026-10-21: https://mimo.mi.com/static/docs/updates/deprecate.md) (Zen passes requests through).
schema = 2
base_model = "xiaomi/mimo-v2.5"
family = "mimo-free"
name = "MiMo V2.5 Free"
description = "MiMo omni model for text, image, video, audio, and agents"
status = "deprecated"

[capabilities]
reasoning = { supported = true }

[limit]
context = 200_000
output = 32_000

[api.chat-completions]
base_url = "https://opencode.ai/inference/openai/v1"
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0
cache = { read = 0 }

[cost.text.output]
price = 0
