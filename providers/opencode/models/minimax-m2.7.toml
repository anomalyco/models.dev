# Pricing and endpoint (Chat Completions): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# Mid-conversation flags unset: Zen documents none and this model wasn't testable (model access is disabled for the probe key).
# knowledge: the host's value, unsourced (no official cutoff found). Kept so v1 doesn't lose it.
schema = 2
base_model = "minimax/MiniMax-M2.7"
knowledge = "2025-01"
description = "MiniMax model for chat, coding, office work, and agentic tasks"

[capabilities]
reasoning = { supported = true }

[api.chat-completions]
base_url = "https://opencode.ai/inference/openai/v1"
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.3
cache = { read = 0.06 }

[cost.text.output]
price = 1.2
