# Availability and pricing: https://opencode.ai/docs/zen
# Model and pricing: https://developers.openai.com/api/docs/models/gpt-6.2-sol (accessed 2026-11-17)
# Reasoning: https://developers.openai.com/api/docs/guides/latest-model?model=gpt-6.2-astra
# Endpoint (Responses): https://opencode.ai/v2/docs/console/models/ (accessed 2026-11-17).
# Pricing: $2 input, $0.10 cached input, $2.50 30m cache write, $5 12h cache write, $10 output; input and cache rates double and output is 1.5x above 272K: https://developers.openai.com/api/docs/pricing
# Effort: reasoning.effort = low|medium|high|xhigh|max (live 2026-11-17); none and minimal return 400.
# Cache (live 2026-11-17): implicit; a cold prompt of about 7.2K tokens reported 7,231 cache_write_tokens, and the same prompt sent again reported them as cached_tokens.
# Image input (live 2026-11-17): a PNG data URL was accepted and read correctly.
# Tools (live 2026-11-17): a function call round trip on the Responses API finished with the tool output.
# Mid-conversation flags (system_updates, effort_updates, tools.updates) follow providers/openai/models/gpt-6.2-sol.toml (Zen passes requests through).
#   Surface: Responses carries the in-history messages (configuration_update for effort_updates; additional_tools for tools.updates).
# Tools follow OpenAI's Responses API: https://developers.openai.com/api/docs/guides/function-calling (strict, tool_choice, custom tools with text, lark or regex format), tool_search per model page https://developers.openai.com/api/docs/models; Zen passes requests through.
# Responses cache writes: 30m at 1.25x input, 12h at 2.5x. https://developers.openai.com/api/docs/guides/prompt-caching
schema = 2
base_model = "openai/gpt-6.2-sol"

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none", "required", "tool"], search = true, freeform = ["text", "lark", "regex"], updates = ["add", "remove", "replace"] }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true }
system_updates = true
effort_updates = true

[api.responses]
base_url = "https://opencode.ai/inference/openai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }

[cost.text.input]
price = 2
cache = { read = 0.1, write = { "30m" = 2.5, "12h" = 5 } }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 4
cache = { read = 0.2, write = { "30m" = 5, "12h" = 10 } }

[cost.text.output]
price = 10

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 15
