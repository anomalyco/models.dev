# Pricing and endpoint (Responses): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# Effort: reasoning.effort = none|low|medium|high|xhigh (not re-verified on Zen: model access is disabled for the probe key)
# Mid-conversation flags (system_updates, effort_updates, tools.updates) follow providers/openai/models/gpt-5.2.toml (Zen passes requests through).
#   Surface: Responses carries the in-history messages (additional_tools, but tools.updates is left out: see below).
# Tools follow OpenAI's Responses API: https://developers.openai.com/api/docs/guides/function-calling (strict, tool_choice, custom tools with text, lark or regex format), tool_search per model page https://developers.openai.com/api/docs/models; Zen passes requests through.
# tools.updates is left out: on GPT-5.5 and earlier, calls to tools added through additional_tools come back namespaced and replaying them without the namespace fails ("Missing namespace for function_call", live 2026-11-16), so callers fold tool changes into the top-level tools list.
# Fast (priority) and flex service tiers: pricing and modes follow providers/openai/models/gpt-5.2.toml (Zen passes requests through).
schema = 2
base_model = "openai/gpt-5.2"
description = "GPT model for general reasoning, writing, coding, and tool-assisted tasks"

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none", "required", "tool"], freeform = ["text", "lark", "regex"] }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true
system_updates = true
service_tier = ["priority", "flex"]

[api.responses]
base_url = "https://opencode.ai/inference/openai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }

[cost.text.input]
price = 1.75
cache = { read = 0.175 }

[cost.text.output]
price = 14

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = { text = 2 }

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = { text = 0.5 }

[experimental.modes.fast]
service_tier = "priority"
body = { service_tier = "priority" }

[experimental.modes.flex]
body = { service_tier = "flex" }
