# Mid-conversation flags left out: xiaomi has no provider file for xiaomi/mimo-v2-omni to follow (Zen passes requests through).
schema = 2
base_model = "xiaomi/mimo-v2-omni"
name = "MiMo V2 Omni Free"
description = "Legacy model retained for compatibility with older integrations"
status = "deprecated"

[modalities]
input = ["text", "image", "audio", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true }

[limit]
output = 64_000

[api.chat-completions]
base_url = "https://opencode.ai/inference/openai/v1"
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0
cache = { read = 0 }

[cost.text.output]
price = 0
