# Pricing and specifications: https://platform.claude.com/docs/en/models/sonnet-5-5/overview
# Pricing and endpoint (Anthropic Messages): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# Effort: output_config.effort = low|medium|high|xhigh|max
# Mid-conversation (live on Zen 2026-10-21; warm prefix, then the change before the next turn vs an unchanged control; cached prompt tokens control -> changed):
#   system_updates = true: a role:system message after the last user turn was kept in place (cached 11941 -> 11955)
#   effort_updates = true: per-message output_config.effort with beta mid-conversation-output-config-2026-07-01 kept the cache (cached 11943 -> 11957) and took effect (effect.jsonl)
#   tools.updates = true: tool_addition with beta inline-tools-2026-09-15 kept the cache (cached 12308 -> 12322)
# Cache: explicit cache_control only, as on Anthropic (https://platform.claude.com/docs/en/build-with-claude/prompt-caching). Zen forwards it: block and top-level cache_control and ttl 1h were honored, and no read happened without it (live on claude-haiku-5-5, claude-opus-5-5, claude-sonnet-5 and claude-sonnet-5-5). Zen lists only the 5m write price.
schema = 2
base_model = "anthropic/claude-sonnet-5-5"

[capabilities]
tools = { supported = true, updates = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
cache = { supported = true, implicit = false, explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 512 } }
system_updates = true
effort_updates = true

[api.messages]
base_url = "https://opencode.ai/inference/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic" }

[cost.text.input]
price = 2
cache = { read = 0.2, write = 2.5 }

[cost.text.output]
price = 10
