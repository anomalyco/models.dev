# Endpoint (OpenAI Embeddings): POST https://opencode.ai/inference/openai/v1/embeddings, served through Zen's
#   openrouter-embeddings endpoint by OpenRouter's mongodb/voyage-code-4.
# Pricing: what Zen bills for this model, the upstream's price (https://openrouter.ai/mongodb/voyage-code-4).
schema = 2
v2_only = true
base_model = "voyageai/voyage-code-4"

[api.embeddings]
base_url = "https://opencode.ai/inference/openai/v1"
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible/embeddings" }

[cost.text.input]
price = 0.12

[cost.text.output]
price = 0
