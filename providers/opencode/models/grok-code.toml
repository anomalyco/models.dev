# Mid-conversation flags left out: xai has no provider file for xai/grok-code-fast-1 to follow (Zen passes requests through).
# Tools follow xAI's API: https://docs.x.ai/developers/tools/function-calling#tool-choice; Zen passes requests through.
schema = 2
base_model = "xai/grok-code-fast-1"
name = "Grok Code Fast 1"
description = "Legacy model retained for compatibility with older integrations"
status = "deprecated"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true }

[limit]
output = 256_000

[api.chat-completions]
base_url = "https://opencode.ai/inference/openai/v1"

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
