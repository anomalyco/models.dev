# Model: https://docs.x.ai/developers/models/grok-imagine-image-2.0
# API: https://docs.x.ai/developers/model-capabilities/images/generation
# Pricing: https://docs.x.ai/developers/pricing and the model page's quality/resolution price matrix.
# OpenCode exposes the native xAI Images API with synchronous base64 generation and JSON editing.
schema = 2
v2_only = true
base_model = "xai/grok-imagine-image-2.0"

[api.images]
base_url = "https://opencode.ai/inference/xai/v1"
sdk = { aisdk = "@ai-sdk/xai", opencodeai = "@opencode/ai/providers/xai/images" }

[cost.image.output]
unit = "image"
price = 0.04

[[cost.image.output.overrides]]
when = { all = [{ quality = { equals = "low" } }, { resolution = { equals = "1.5k" } }] }
price = 0.05

[[cost.image.output.overrides]]
when = { all = [{ quality = { equals = "low" } }, { resolution = { equals = "2k" } }] }
price = 0.06

[[cost.image.output.overrides]]
when = { all = [{ quality = { equals = "medium" } }, { resolution = { equals = "1k" } }] }
price = 0.06

[[cost.image.output.overrides]]
when = { all = [{ quality = { equals = "medium" } }, { resolution = { equals = "1.5k" } }] }
price = 0.07

[[cost.image.output.overrides]]
when = { all = [{ quality = { equals = "medium" } }, { resolution = { equals = "2k" } }] }
price = 0.08

[cost.image.input]
unit = "image"
price = 0.01
