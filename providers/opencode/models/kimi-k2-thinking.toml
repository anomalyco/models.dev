# Mid-conversation flags left out: moonshotai has no provider file for moonshotai/kimi-k2-thinking to follow (Zen passes requests through).
schema = 2
base_model = "moonshotai/kimi-k2-thinking"
description = "Legacy model retained for compatibility with older integrations"
status = "deprecated"

[capabilities]
reasoning = { supported = true }

[api.chat-completions]
base_url = "https://opencode.ai/inference/openai/v1"
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.4
cache = { read = 0.4 }

[cost.text.output]
price = 2.5
