# Pricing and endpoint (Responses): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# Effort: reasoning.effort = none|low|medium|high|xhigh|max
# Cache (live): implicit (cached tokens reported without cache markers).
# Mid-conversation flags (system_updates, effort_updates, tools.updates) follow providers/openai/models/gpt-5.6-luna.toml (Zen passes requests through).
#   Surface: Responses carries the in-history messages (configuration_update for effort_updates; additional_tools for tools.updates).
# Tools follow OpenAI's Responses API: https://developers.openai.com/api/docs/guides/function-calling (strict, tool_choice, custom tools with text, lark or regex format), tool_search per model page https://developers.openai.com/api/docs/models; Zen passes requests through.
# Responses cache writes: 30m at 1.25x input, 12h at 2.5x. https://developers.openai.com/api/docs/guides/prompt-caching
# tools.updates (live 2026-11-17 through Zen, the request shapes @opencode/ai sends: gpt-6-astra, gpt-5.6-sol, claude-opus-5-5, claude-haiku-5-5): add, a redefinition (the call uses the new schema) and a removal all work, 3/3 each.
# Fast (priority) and flex service tiers: pricing and modes follow providers/openai/models/gpt-5.6-luna.toml (Zen passes requests through).
schema = 2
base_model = "openai/gpt-5.6-luna"

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none", "required", "tool"], search = true, freeform = ["text", "lark", "regex"], updates = ["add", "remove", "replace"] }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true }
system_updates = true
effort_updates = true
service_tier = ["priority", "flex"]

[api.responses]
base_url = "https://opencode.ai/inference/openai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }

[cost.text.input]
price = 0.2
cache = { read = 0.02, write = { "30m" = 0.25, "12h" = 0.5 } }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 0.4
cache = { read = 0.04, write = { "30m" = 0.5, "12h" = 1 } }

[cost.text.output]
price = 1.2

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 1.8

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = { text = 2 }

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = { text = 0.5 }

[experimental.modes.fast]
service_tier = "priority"
body = { service_tier = "priority" }

[experimental.modes.flex]
body = { service_tier = "flex" }
