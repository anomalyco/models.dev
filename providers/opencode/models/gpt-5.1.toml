# Pricing and endpoint (Responses): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# Effort: reasoning.effort = none|low|medium|high (not re-verified on Zen: model access is disabled for the probe key)
# Mid-conversation flags unset: Zen documents none and this model wasn't testable (model access is disabled for the probe key).
schema = 2
base_model = "openai/gpt-5.1"
description = "GPT model for general reasoning, writing, coding, and tool-assisted tasks"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true

[api.responses]
base_url = "https://opencode.ai/inference/openai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }

[cost.text.input]
price = 1.07
cache = { read = 0.107 }

[cost.text.output]
price = 8.5
