# Pricing and endpoint (Anthropic Messages): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# Budget: thinking.budget_tokens (min 1024) with thinking.type = enabled (not re-verified on Zen: model access is disabled for the probe key)
# Cache: explicit cache_control only, as on Anthropic (https://platform.claude.com/docs/en/build-with-claude/prompt-caching). Zen forwards it: block and top-level cache_control and ttl 1h were honored, and no read happened without it (live on claude-haiku-5-5, claude-opus-5-5, claude-sonnet-5 and claude-sonnet-5-5). Zen lists only the 5m write price.
# Mid-conversation flags (system_updates, effort_updates, tools.updates) follow providers/anthropic/models/claude-haiku-4-5.toml (Zen passes requests through).
schema = 2
base_model = "anthropic/claude-haiku-4-5"
name = "Claude Haiku 4.5"
description = "Fast Claude model for responsive assistance, classification, and lightweight agents"

[capabilities]
reasoning = { supported = true, budget = { min = 1_024 } }
cache = { explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 4_096 } }

[api.messages]
base_url = "https://opencode.ai/inference/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic" }

[cost.text.input]
price = 1
cache = { read = 0.1, write = 1.25 }

[cost.text.output]
price = 5
