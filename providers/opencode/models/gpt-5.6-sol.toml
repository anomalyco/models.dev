# Source: https://vercel.com/changelog/gpt-5-6-sol-is-50-off-on-ai-gateway-for-the-next-month
# List pricing: https://developers.openai.com/api/docs/pricing
# The promotion applies to all token types and long-context tiers through September 18, 2026.
base_model = "openai/gpt-5.6-sol"
name = "GPT-5.6 Sol (50% Off)"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 2
output = 10
cache_read = 0.2
cache_write = 2.5

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 4
output = 15
cache_read = 0.4
cache_write = 5

[provider]
npm = "@ai-sdk/openai"
