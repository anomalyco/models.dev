# Toggle: thinking.type = enabled|disabled (deprecated; not re-verified on Zen)
# Mid-conversation flags (system_updates, effort_updates, tools.updates) follow providers/zhipuai/models/glm-4.7.toml (Zen passes requests through).
schema = 2
base_model = "zhipuai/glm-4.7"
description = "Legacy model retained for compatibility with older integrations"
status = "deprecated"

[capabilities]
reasoning = { supported = true, toggle = true }
system_updates = true

[api.chat-completions]
base_url = "https://opencode.ai/inference/openai/v1"
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.6
cache = { read = 0.1 }

[cost.text.output]
price = 2.2
