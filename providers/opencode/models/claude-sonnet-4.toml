schema = 2
name = "Claude Sonnet 4"
description = "Balanced Claude model for coding, analysis, agent workflows, and cost control"
family = "claude-sonnet"
open_weights = false
knowledge = "2025-03-31"
release_date = "2025-05-22"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, budget = { min = 1_024 } }
temperature = true

[limit]
context = 1_000_000
output = 64_000

[api.messages]
base_url = "https://opencode.ai/inference/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic" }

[cost.text.input]
price = 3
cache = { read = 0.3, write = 3.75 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 6
cache = { read = 0.6, write = 7.5 }

[cost.text.output]
price = 15

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 22.5
