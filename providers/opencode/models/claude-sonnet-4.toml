# Deprecated: listed under Deprecated models (June 15, 2026); requests return 400 "Model is unavailable" (live 2026-10-21) (https://opencode.ai/v2/docs/console/models/#deprecated-models, accessed 2026-10-21).
# Budget: thinking.budget_tokens (min 1024) with thinking.type = enabled (deprecated; not re-verified on Zen)
# Mid-conversation flags left out: anthropic has no provider file for anthropic/claude-sonnet-4-0 to follow (Zen passes requests through).
schema = 2
base_model = "anthropic/claude-sonnet-4-0"
name = "Claude Sonnet 4"
status = "deprecated"

[capabilities]
reasoning = { supported = true, budget = { min = 1_024 } }

[limit]
context = 1_000_000

[api.messages]
base_url = "https://opencode.ai/inference/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic" }

[cost.text.input]
price = 3
cache = { read = 0.3, write = 3.75 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 6
cache = { read = 0.6, write = 7.5 }

[cost.text.output]
price = 15

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 22.5
