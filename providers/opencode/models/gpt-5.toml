# Pricing and endpoint (Responses): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# Effort: reasoning.effort = minimal|low|medium|high (not re-verified on Zen: model access is disabled for the probe key)
# Mid-conversation flags (system_updates, effort_updates, tools.updates) follow providers/openai/models/gpt-5.toml (Zen passes requests through).
#   Surface: Responses carries the in-history messages (additional_tools for tools.updates, add only).
# Tools follow OpenAI's Responses API: https://developers.openai.com/api/docs/guides/function-calling (strict, tool_choice, custom tools with text, lark or regex format), tool_search per model page https://developers.openai.com/api/docs/models; Zen passes requests through.
schema = 2
base_model = "openai/gpt-5"
description = "GPT model for general reasoning, writing, coding, and tool-assisted tasks"

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none", "required", "tool"], freeform = ["text", "lark", "regex"], updates = true }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true
system_updates = true

[api.responses]
base_url = "https://opencode.ai/inference/openai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }

[cost.text.input]
price = 1.07
cache = { read = 0.107 }

[cost.text.output]
price = 8.5
