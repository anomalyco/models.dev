# Availability and pricing: https://opencode.ai/docs/zen
# Reasoning: https://developers.openai.com/api/docs/guides/latest-model?model=gpt-6.1-sol
# Endpoint (Responses): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# Pricing: matches OpenAI's gpt-6.1-sol rates ($0.10 cached input, 2x above 272K): https://developers.openai.com/api/docs/models/gpt-6.1-sol
# Effort: reasoning.effort = low|medium|high|xhigh|max
# Cache (live): implicit (cached tokens reported without cache markers).
# Mid-conversation flags (system_updates, effort_updates, tools.updates) follow providers/openai/models/gpt-6.1-sol.toml (Zen passes requests through).
#   Surface: Responses carries the in-history messages (configuration_update for effort_updates; additional_tools for tools.updates).
# Tools follow OpenAI's Responses API: https://developers.openai.com/api/docs/guides/function-calling (strict, tool_choice, custom tools with text, lark or regex format), tool_search per model page https://developers.openai.com/api/docs/models; Zen passes requests through.
# Responses cache writes: 30m at 1.25x input, 12h at 2.5x. https://developers.openai.com/api/docs/guides/prompt-caching
# tools.updates (live 2026-11-17 through Zen, the request shapes @opencode/ai sends: gpt-6-astra, gpt-5.6-sol, claude-opus-5-5, claude-haiku-5-5): add, a redefinition (the call uses the new schema) and a removal all work, 3/3 each.
# Fast (priority), flex and ultrafast service tiers: pricing follows providers/openai/models/gpt-6.1-sol.toml (Zen passes requests through).
# No experimental modes for now: the tiers work through the API, but clients don't list them as separate models.
schema = 2
base_model = "openai/gpt-6.1-sol"

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none", "required", "tool"], search = true, freeform = ["text", "lark", "regex"], updates = ["add", "remove", "replace"] }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true }
system_updates = true
effort_updates = true
service_tier = ["priority", "flex", "ultrafast"]

[api.responses]
base_url = "https://opencode.ai/inference/openai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }

[cost.text.input]
price = 2
cache = { read = 0.1, write = { "30m" = 2.5, "12h" = 5 } }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 4
cache = { read = 0.2, write = { "30m" = 5, "12h" = 10 } }

[cost.text.output]
price = 10

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 15

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = { text = 2 }

[[cost.multipliers]]
when = { service_tier = { equals = "ultrafast" } }
factor = { text = 6 }

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = { text = 0.5 }
