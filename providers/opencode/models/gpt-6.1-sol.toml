# Availability and pricing: https://opencode.ai/docs/zen
# Reasoning: https://developers.openai.com/api/docs/guides/latest-model?model=gpt-6.1-sol
# Endpoint (Responses): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# Pricing: matches OpenAI's gpt-6.1-sol rates ($0.10 cached input, 2x above 272K): https://developers.openai.com/api/docs/models/gpt-6.1-sol
# Effort: reasoning.effort = low|medium|high|xhigh|max
# Cache (live): implicit (cached tokens reported without cache markers).
# Mid-conversation flags (system_updates, effort_updates, tools.updates) follow providers/openai/models/gpt-6.1-sol.toml (Zen passes requests through).
#   Surface: Responses carries the in-history messages (configuration_update for effort_updates; additional_tools for tools.updates, add only).
# Tools follow OpenAI's Responses API: https://developers.openai.com/api/docs/guides/function-calling (strict, tool_choice, custom tools with lark/regex grammars), tool_search per model page https://developers.openai.com/api/docs/models; Zen passes requests through.
schema = 2
base_model = "openai/gpt-6.1-sol"

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none", "required", "tool"], search = true, grammar = ["lark", "regex"], updates = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true }
system_updates = true
effort_updates = true

[api.responses]
base_url = "https://opencode.ai/inference/openai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }

[cost.text.input]
price = 2
cache = { read = 0.1, write = 2.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 4
cache = { read = 0.2, write = 5 }

[cost.text.output]
price = 10

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 15
