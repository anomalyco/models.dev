schema = 2
base_model = "anthropic/claude-sonnet-4-5"
name = "Claude Sonnet 4.5"

[capabilities]
reasoning = { supported = true, budget = { min = 1_024 } }

[limit]
context = 1_000_000

[api.messages]
base_url = "https://opencode.ai/inference/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic" }
compatibility = { replay_reasoning = true }

[cost.text.input]
price = 3
cache = { read = 0.3, write = 3.75 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 6
cache = { read = 0.6, write = 7.5 }

[cost.text.output]
price = 15

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 22.5
