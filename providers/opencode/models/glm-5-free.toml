# Toggle: thinking.type = enabled|disabled (deprecated; not re-verified on Zen)
# knowledge: the host's value, unsourced (no official cutoff found). Kept so v1 doesn't lose it.
# Mid-conversation flags (system_updates, effort_updates, tools.updates) follow providers/zhipuai/models/glm-5.toml (Zen passes requests through).
# Tools follow Z.ai's API: https://docs.z.ai/api-reference/llm/chat-completion (tool_choice: only auto); Zen passes requests through.
schema = 2
base_model = "zhipuai/glm-5"
knowledge = "2025-04"
name = "GLM-5 Free"
description = "Legacy model retained for compatibility with older integrations"
status = "deprecated"

[capabilities]
tools = { supported = true, choice = ["auto"] }
reasoning = { supported = true, toggle = true }
system_updates = true

[api.chat-completions]
base_url = "https://opencode.ai/inference/openai/v1"
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0
cache = { read = 0 }

[cost.text.output]
price = 0
