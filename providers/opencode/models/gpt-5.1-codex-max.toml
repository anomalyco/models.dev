# Docs: listed under Deprecated models (July 23, 2026) (https://opencode.ai/v2/docs/console/models/#deprecated-models, accessed 2026-10-21).
# status left unset: GET https://opencode.ai/inference/v1/models still lists this ID (2026-10-21) and requests return 403 "Model access is disabled" (a workspace toggle), not the 410 Zen returns for retired IDs, and OpenCode hides deprecated models, so marking it would drop a model Zen still serves.
# Effort: reasoning.effort = low|medium|high|xhigh (deprecated; not re-verified on Zen)
# Mid-conversation flags left out: openai has no provider file for openai/gpt-5.1-codex-max to follow (Zen passes requests through).
# Tools follow OpenAI's Responses API: https://developers.openai.com/api/docs/guides/function-calling (strict, tool_choice, custom tools with text, lark or regex format), tool_search per model page https://developers.openai.com/api/docs/models; Zen passes requests through.
schema = 2
base_model = "openai/gpt-5.1-codex-max"

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none", "required", "tool"], freeform = ["text", "lark", "regex"] }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true

[api.responses]
base_url = "https://opencode.ai/inference/openai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }

[cost.text.input]
price = 1.25
cache = { read = 0.125 }

[cost.text.output]
price = 10
