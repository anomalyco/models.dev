# Endpoints (OpenAI Images): POST https://opencode.ai/inference/openai/v1/images/generations and /images/edits, streaming or not.
# Pricing: what Zen bills for this model (2026-10-28), not yet in Zen's docs (https://opencode.ai/v2/docs/console/models/):
#   $8 per 1M input tokens (text and image alike), $30 per 1M output tokens, plus $1 for each generated image
#   (partial previews are free).
# No cached price: OpenAI applies cached input pricing for GPT Image 2.5 only to the Responses API's image generation
#   tool, not to Images API requests, edits included (https://developers.openai.com/api/docs/guides/image-generation#cached-input-pricing).
schema = 2
v2_only = true
base_model = "openai/gpt-image-2.5-sunburst"

[api.images]
base_url = "https://opencode.ai/inference/openai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/images" }

[cost.text.input]
price = 8

[cost.text.output]
price = 30

[cost.image.input]
price = 8

[cost.image.output]
unit = "image"
price = 1
