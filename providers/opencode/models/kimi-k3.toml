# Pricing and endpoint (Chat Completions): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# thinking.type = disabled turns reasoning off (live: 192 -> 0 reasoning tokens).
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = max
# Mid-conversation (live on Zen 2026-10-21; warm prefix, then the change before the next turn vs an unchanged control; cached prompt tokens control -> changed):
#   system_updates = true: a system message before the next user turn was kept in place (cached 9216 -> 9216)
#   effort_updates = false: thinking.type enabled -> disabled dropped the cache (cached 9216 -> 0)
#   tools.updates = false: adding a tool dropped the cache (cached 9216 -> 0)
# Cache (live): implicit (cached tokens reported without cache markers).
schema = 2
base_model = "moonshotai/kimi-k3"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["max"], toggle = true }
structured_output = true
cache = { supported = true, implicit = true }
system_updates = true
effort_updates = false

[api.chat-completions]
base_url = "https://opencode.ai/inference/openai/v1"
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 3
cache = { read = 0.3 }

[cost.text.output]
price = 15
