# Pricing and endpoint (Chat Completions): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# Mid-conversation flags unset: Zen documents none and this model wasn't testable (the free tier only serves OpenCode clients).
schema = 2
name = "Big Pickle"
description = "Reasoning model for deliberate analysis, multi-step problem solving, and tool use"
family = "big-pickle"
open_weights = false
knowledge = "2025-01"
release_date = "2025-10-17"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
structured_output = true
temperature = true

[limit]
context = 200_000
input = 160_000
output = 32_000

[api.chat-completions]
base_url = "https://opencode.ai/inference/openai/v1"
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
