# Pricing and endpoint (Chat Completions): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# Effort: reasoning_effort = low|medium|high|xhigh|max (not re-verified on Zen: the free tier only serves OpenCode clients)
# Mid-conversation flags unset: Zen documents none and this model wasn't testable (the free tier only serves OpenCode clients).
schema = 2
base_model = "minimax/MiniMax-M3.1-Flash"
name = "MiniMax M3.1 Flash Free"
status = "deprecated"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[api.chat-completions]
base_url = "https://opencode.ai/inference/openai/v1"
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0
cache = { read = 0 }

[cost.text.output]
price = 0
