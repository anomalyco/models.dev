# Pricing and endpoint (Chat Completions): https://opencode.ai/v2/docs/console/models/.
# Modalities, capabilities, effort levels and limits supplied by the operator on 2026-11-25.
schema = 2
name = "Seaglass Alpha Free"
description = "Stealth reasoning model, free for a limited time"
open_weights = false
release_date = "2026-11-26"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh", "max"] }
temperature = true

[limit]
context = 1_048_576
output = 131_072

[api.chat-completions]
base_url = "https://opencode.ai/inference/openai/v1"
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0
cache = { read = 0 }

[cost.text.output]
price = 0
