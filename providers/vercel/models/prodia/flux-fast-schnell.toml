# Modalities: Prodia returns the image type requested in Accept: image/jpeg, image/png, image/webp, https://docs.prodia.com/
schema = 2
type = "image"
name = "Flux Schnell"
description = "Image model for prompt-driven generation, editing, and visual design workflows"
family = "flux"
open_weights = false
release_date = "2024-08-02"
last_updated = "2026-06-08"

[modalities]
input = ["text"]
output = ["image/jpeg", "image/png", "image/webp"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 512
output = 0

[api.images]
base_url = "https://ai-gateway.vercel.sh/v4/ai"
