# Modalities: BFL output_format jpeg | png | webp (OutputFormat in https://api.bfl.ai/openapi.json)
schema = 2
type = "image"
name = "FLUX.2 [pro]"
description = "Image model for prompt-driven generation, editing, and visual design workflows"
family = "flux"
open_weights = false
release_date = "2025-11-25"
last_updated = "2026-06-08"

[modalities]
input = ["text"]
output = ["image/jpeg", "image/png", "image/webp"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 67_300
output = 67_300

[api.images]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/protocols/openai-images" }
