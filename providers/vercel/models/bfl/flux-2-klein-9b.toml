# Modalities: BFL output_format jpeg | png | webp (OutputFormat in https://api.bfl.ai/openapi.json)
schema = 2
type = "image"
name = "FLUX.2 [klein] 9B"
description = "Image model for prompt-driven generation, editing, and visual design workflows"
family = "flux"
open_weights = false
release_date = "2026-01-15"
