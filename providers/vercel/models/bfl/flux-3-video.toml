# Modalities: FLUX 3 video result.sample is an MP4, https://docs.bfl.ml/flux_3/flux3_video
# Inputs: AI Gateway's catalog video_capabilities.input_limits (kinds and supported_formats), https://ai-gateway.vercel.sh/v1/models
schema = 2
type = "video"
name = "Flux 3"
description = "Video model for prompt-guided generation, editing, and motion workflows"
family = "flux"
open_weights = false
release_date = "2026-08-04"

[modalities]
input = ["text", "image", "video/mp4"]
output = ["video/mp4"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0

[api.videos]
base_url = "https://ai-gateway.vercel.sh/v4/ai"
sdk = { opencodeai = "none" }
