# Modalities: FLUX 3 Image has no output_format; BFL's quickstart saves result.sample as PNG, https://docs.bfl.ml/flux_3/flux3_image_generate
schema = 2
name = "FLUX 3 Image"
description = "Image model for prompt-driven generation, editing, and visual design workflows"
family = "flux"
open_weights = false
release_date = "2026-10-05"

[modalities]
input = ["text"]
output = ["image/png"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }

[limit]
context = 0
output = 0
