# Synced from https://ai-gateway.vercel.sh/v1/models (type realtime)
# https://vercel.com/docs/ai-gateway/modalities/realtime
# Price: session duration billed as audio input per second
schema = 2
v2_only = true
type = "realtime"
name = "Eleven Realtime v1 Mini"
description = "Realtime voice model for low-latency spoken conversations"
family = "elevenlabs"
open_weights = false
release_date = "2026-10-27"

[modalities]
input = ["text", "audio/pcm"]
output = ["text", "audio/pcm"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
cache = { implicit = true }

[limit]
context = 0
output = 0

[api.realtime]
base_url = "https://ai-gateway.vercel.sh/v4/ai"
sdk = { opencodeai = "none" }

[cost.text.input]
price = 0.1
cache = { read = 0.01 }

[cost.text.output]
price = 3

[cost.audio.input]
unit = "second"
price = 0.0006667
