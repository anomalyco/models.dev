# Previously a symlink to providers/mistral/models/ministral-3b-latest.toml. Copied from origin/dev 67bc657a5 so Vercel's data
# stays as it was when the Mistral file moved to schema 2 with Mistral-API-specific values.
# Modalities: Mistral vision formats PNG, JPEG, WEBP, non-animated GIF, https://docs.mistral.ai/studio/conversations/vision
schema = 2
name = "Ministral 3B (latest)"
description = "Compact Mistral model for edge, latency-sensitive, and cost-efficient workloads"
family = "ministral"
open_weights = true
knowledge = "2024-10"
release_date = "2024-10-16"
last_updated = "2024-10-04"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true

[limit]
context = 131_072
output = 4_000

[cost.text.input]
price = 0.1
cache = { read = 0.01 }

[cost.text.output]
price = 0.1
