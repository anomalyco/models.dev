# Previously a symlink to providers/mistral/models/codestral-latest.toml. Copied from origin/dev 67bc657a5 so Vercel's data
# stays as it was when the Mistral file moved to schema 2 with Mistral-API-specific values.
# Cached-input pricing: https://docs.mistral.ai/inference/pricing (2026-09-29)
# Mid-conversation (@ai-sdk/gateway, live 2026-10-19, default route): a mid-conversation system message is hoisted (the next request misses the cache). No per-turn effort or tool-change mechanism reaches this model on this API.
schema = 2
base_model = "mistral/codestral-latest"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
cache = { implicit = true }

[limit]
context = 128_000
output = 4_000

[api.chat-completions]

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 0.3
cache = { read = 0.03 }

[cost.text.output]
price = 0.9
