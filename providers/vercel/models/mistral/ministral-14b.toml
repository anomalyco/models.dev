# Mid-conversation (@ai-sdk/gateway): per-turn effort and tool changes exist only for Anthropic models on this API. system_updates left unset: live cache results on the default route were inconclusive.
schema = 2
base_model = "mistral/ministral-14b"
description = "Compact Mistral model for edge, latency-sensitive, and cost-efficient workloads"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = false }
effort_updates = false
cache = { supported = true, implicit = true, explicit = false }

[limit]
output = 256_000

[cost.text.input]
price = 0.2
cache = { read = 0.02 }

[cost.text.output]
price = 0.2
