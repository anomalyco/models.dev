# Mid-conversation (@ai-sdk/gateway, live 2026-10-19, default route): a mid-conversation system message stays in place (cache prefix kept). Per-turn effort and tool changes exist only for Anthropic models on this API.
schema = 2
base_model = "mistral/mistral-large-4"
description = "Flagship Mistral model for advanced reasoning, coding, and multilingual work"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "high"] }
system_updates = true
effort_updates = false

[limit]
context = 524_288

[cost.text.input]
price = 0.68
cache = { read = 0.07 }

[cost.text.output]
price = 2.09
