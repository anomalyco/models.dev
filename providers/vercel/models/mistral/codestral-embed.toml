# Synced from https://ai-gateway.vercel.sh/v1/models (type embedding)
# https://vercel.com/docs/ai-gateway/modalities/embeddings
schema = 2
base_model = "mistral/codestral-embed-2505"

[capabilities]
cache = { supported = true, implicit = true, explicit = false }

[api.embeddings]
base_url = "https://ai-gateway.vercel.sh/v4/ai"
sdk = { opencodeai = "none" }

[cost.text.input]
price = 0.15
cache = { read = 0.015 }
