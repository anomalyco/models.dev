schema = 2
name = "Particle-1"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"
open_weights = false
release_date = "2026-10-28"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
cache = { implicit = true }

[limit]
context = 1_048_576
output = 131_072

[api.chat-completions]

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 0.125
cache = { read = 0.015 }

[cost.text.output]
price = 0.5
