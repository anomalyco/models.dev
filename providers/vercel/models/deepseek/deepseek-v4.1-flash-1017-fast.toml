# Mid-conversation: system_updates unset. Vercel doesn't document mid-conversation system messages for this model, and it routes to third-party hosts that don't document it either. The earlier true came from one live run on the default route (cache prefix kept, @ai-sdk/gateway, 2026-10-19), which isn't enough on its own. No per-turn effort or tool-change mechanism reaches this model on this API.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"
name = "DeepSeek V4.1 Flash 1017 Fast"
description = "Fast DeepSeek model for efficient chat, coding help, and agent loops"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 1_048_576
output = 262_144

[api.chat-completions]

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 0.6
cache = { read = 0.014 }

[cost.text.output]
price = 2.4
