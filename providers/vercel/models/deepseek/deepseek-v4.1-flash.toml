# Toggle: reasoning.enabled = true|false
# Effort: reasoning.effort = high|xhigh (Vercel gateway aliases)
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true

[limit]
context = 1_048_576
output = 32_768

[cost.text.input]
price = 0.075
cache = { read = 0.0015 }

[cost.text.output]
price = 0.3
