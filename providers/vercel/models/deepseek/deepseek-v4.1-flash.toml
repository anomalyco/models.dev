# Toggle: reasoning.enabled = true|false
# Effort: reasoning.effort = high|xhigh (Vercel gateway aliases)
base_model = "deepseek/deepseek-v4.1-flash"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "high", "max"]

[cost]
input = 0.075
output = 0.3
cache_read = 0.0015

[limit]
context = 1_048_576
output = 1_048_576

[modalities]
input = ["text", "image", "pdf"]
