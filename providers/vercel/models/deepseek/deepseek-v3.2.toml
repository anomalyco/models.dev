# Mid-conversation (@ai-sdk/gateway, live 2026-10-19): routed to Amazon Bedrock Converse, which rejects system-role messages for this model (https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Message.html), so the gateway cannot keep them in place. Per-turn effort and tool changes exist only for Anthropic models on this API.
schema = 2
base_model = "deepseek/deepseek-v3.2"
description = "DeepSeek chat model for instruction following, coding, and analysis"

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = true
system_updates = false
effort_updates = false

[limit]
output = 8_000

[cost.text.input]
price = 0.62

[cost.text.output]
price = 1.85
