# Mid-conversation (@ai-sdk/gateway, live 2026-10-19, default route): a mid-conversation system message stays in place (cache prefix kept). Per-turn effort and tool changes exist only for Anthropic models on this API.
schema = 2
base_model = "deepseek/deepseek-v4-pro-0813"
description = "Flagship DeepSeek model for coding, reasoning, and agentic work"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true
system_updates = true
effort_updates = false

[cost.text.input]
price = 0.66
cache = { read = 0.066 }

[cost.text.output]
price = 1.98
