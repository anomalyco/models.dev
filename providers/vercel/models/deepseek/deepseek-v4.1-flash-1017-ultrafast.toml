schema = 2
name = "DeepSeek V4.1 Flash 1017 Ultrafast"
description = "Fast DeepSeek model for efficient chat, coding help, and agent loops"
family = "deepseek"
open_weights = false
release_date = "2026-11-06"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
cache = { implicit = true }

[limit]
context = 1_048_576
output = 1_048_576

[api.chat-completions]

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 2.4
cache = { read = 0.048 }

[cost.text.output]
price = 9.6
