# Effort: reasoning.effort = none|minimal|low|medium|high|xhigh|max
# https://mimo.mi.com/docs/en-US/api/chat/responses
# Modalities: MiMo image formats JPEG, PNG, GIF, WebP, BMP, https://mimo.mi.com/static/docs/quick-start/usage-guide/multimodal-understanding/image-understanding.md
# Mid-conversation (@ai-sdk/gateway, live 2026-10-19, default route): a mid-conversation system message stays in place (cache prefix kept). Per-turn effort and tool changes exist only for Anthropic models on this API.
schema = 2
base_model = "xiaomi/mimo-v2.6-pro"
name = "MiMo V2.6 Pro"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high"] }
system_updates = true
effort_updates = false

[cost.text.input]
price = 0.435
cache = { read = 0.0036 }

[cost.text.output]
price = 0.87
