# Modalities: MiMo image formats JPEG, PNG, GIF, WebP, BMP, https://mimo.mi.com/static/docs/quick-start/usage-guide/multimodal-understanding/image-understanding.md
# Mid-conversation (@ai-sdk/gateway, live 2026-10-23): Xiaomi's API doesn't list cache-kept mid-conversation system messages for this model, so system_updates is left out. No per-turn effort or tool-change mechanism reaches this model on this API.
schema = 2
base_model = "xiaomi/mimo-v2.5"
name = "MiMo M2.5"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, toggle = true }
cache = { implicit = true }

[limit]
context = 1_050_000
output = 131_100

[api.chat-completions]

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 0.119
cache = { read = 0.0025 }

[cost.text.output]
price = 0.238
