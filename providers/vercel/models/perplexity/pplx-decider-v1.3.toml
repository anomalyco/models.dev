schema = 2
type = "decision"
name = "Decider V1.3"
description = "Perplexity Decider V1.3 is a multimodal decision model for classification, routing, and scoring. It evaluates text, structured JSON, and images against yes/no questions, custom choices, and ordered rubrics, returning typed answers with probabilities. It supports multiple questions over shared content and a 256K context window."
open_weights = false
release_date = "2026-11-12"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }

[limit]
context = 262_144
output = 0

[api.decisions]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/decisions" }

[cost.text.input]
price = 0.02

[cost.text.output]
price = 0
