# Synced from https://ai-gateway.vercel.sh/v1/models (type embedding)
# https://vercel.com/docs/ai-gateway/modalities/embeddings
schema = 2
type = "embedding"
name = "Embed v1 4b"
description = "Embedding model for semantic search, retrieval, clustering, and ranking pipelines"
open_weights = false
release_date = "2026-02-26"

[modalities]
input = ["text"]
output = ["embedding"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 32_000
output = 0

[api.embeddings]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "none" }

[cost.text.input]
price = 0.03
