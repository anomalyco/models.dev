# Synced from https://ai-gateway.vercel.sh/v1/models (type transcription)
# https://vercel.com/docs/ai-gateway/modalities/speech-to-text
# release_date: AssemblyAI released Universal-2 on 2024-10-30 (https://www.assemblyai.com/research/universal-2), not on Vercel's launch date.
schema = 2
v2_only = true
type = "transcription"
name = "Universal-2"
description = "Speech transcription model for accurate audio-to-text and captioning workflows"
open_weights = false
release_date = "2024-10-30"

[modalities]
input = ["audio"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0

[api.transcriptions]
base_url = "https://ai-gateway.vercel.sh/v4/ai"
sdk = { opencodeai = "none" }

[cost.audio.input]
unit = "second"
price = 0.00004167
