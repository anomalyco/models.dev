# Modalities: Nova image formats PNG, JPEG, GIF, WEBP, as on Amazon Bedrock (https://docs.aws.amazon.com/nova/latest/userguide/modalities-image.html)
# Mid-conversation (@ai-sdk/gateway, live 2026-10-19): routed to Amazon Bedrock Converse, which rejects system-role messages for this model (https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Message.html), so the gateway cannot keep them in place. Per-turn effort and tool changes exist only for Anthropic models on this API.
schema = 2
base_model = "amazon/nova-2-lite"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
system_updates = false
effort_updates = false
cache = { supported = true, implicit = true, explicit = false }

[limit]
output = 65_535

[cost.text.input]
price = 0.33
cache = { read = 0.0825 }

[cost.text.output]
price = 2.75
