schema = 2
base_model = "amazon/nova-2-lite"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }

[limit]
output = 65_535

[cost.text.input]
price = 0.3
cache = { read = 0.075 }

[cost.text.output]
price = 2.5
