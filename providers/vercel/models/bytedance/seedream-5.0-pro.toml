# Modalities: Seedream 5.0 output_format png | jpeg, https://ai.byteplus.com/ark/region:ap-southeast-1/docs/image-generation-api
schema = 2
type = "image"
name = "Seedream 5.0 Pro"
description = "Image model for prompt-driven generation, editing, and visual design workflows"
family = "seed"
open_weights = false
release_date = "2026-07-11"

[modalities]
input = ["text"]
output = ["image/png", "image/jpeg"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0

[api.images]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/images" }

[cost.text.input]
price = 0.003

[cost.image.output]
unit = "image"
price = 0.035
