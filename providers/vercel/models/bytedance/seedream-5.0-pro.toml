# Image input: POST https://ai-gateway.vercel.sh/v1/images/edits uses the input image (verified live 2026-10-28)
# Modalities: Seedream 5.0 output_format png | jpeg, https://ai.byteplus.com/ark/region:ap-southeast-1/docs/image-generation-api
# Price: AI Gateway catalog pricing.image 0.09 per image, image_dimension_quality_pricing max_pixels 2,610,000 at 0.045 (https://ai-gateway.vercel.sh/v1/models, 2026-11-19).
schema = 2
type = "image"
name = "Seedream 5.0 Pro"
description = "Image model for prompt-driven generation, editing, and visual design workflows"
family = "seedream-pro"
open_weights = false
release_date = "2026-07-11"

[modalities]
input = ["text", "image"]
output = ["image/png", "image/jpeg"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0

[api.images]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/images" }

[cost.image.output]
unit = "image"
price = 0.09

[[cost.image.output.overrides]]
when = { megapixels = { lte = 2.61 } }
price = 0.045
