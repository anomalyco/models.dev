schema = 2
base_model = "bytedance-seed/seed-1-8"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["minimal", "low", "medium", "high"] }

[limit]
output = 32_768

[cost.text.input]
price = 0.25
cache = { read = 0.05 }

[[cost.text.input.overrides]]
when = { context = { gt = 128_001 } }
price = 0.5
cache = { read = 0.05 }

[cost.text.output]
price = 2

[[cost.text.output.overrides]]
when = { context = { gt = 128_001 } }
price = 4
