# Synced from https://ai-gateway.vercel.sh/v1/models (type video)
# https://vercel.com/docs/ai-gateway/modalities/video-generation
# Modalities: Seedance inputs as in the lab file; AI Gateway: all Seedance models output MP4
#   (https://vercel.com/docs/ai-gateway/modalities/video-generation/text-to-video), so no mov output here.
schema = 2
v2_only = true
base_model = "bytedance-seed/seedance-2.5-flash"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp", "image/bmp", "image/tiff", "image/gif", "image/heic", "image/heif", "video/mp4", "video/quicktime", "audio/wav", "audio/mpeg"]
output = ["video/mp4"]

[api.videos]
base_url = "https://ai-gateway.vercel.sh/v4/ai"
sdk = { opencodeai = "none" }

[cost.video.output]
price = 7

[[cost.video.output.overrides]]
when = { resolution = { equals = "480p" }, input_video = { equals = true } }
price = 4.3

[[cost.video.output.overrides]]
when = { resolution = { equals = "720p" }, input_video = { equals = true } }
price = 4.3
