# Modalities: BytePlus ModelArk supported image formats (JPEG, PNG, GIF, WEBP, BMP, TIFF, JPEG2000, HEIC/HEIF; ICO, ICNS and SGI have no registered MIME type), https://ai.byteplus.com/ark/region:ap-southeast-1/docs/image-understanding
# Mid-conversation (@ai-sdk/gateway): no per-turn effort or tool-change mechanism reaches this model on this API. system_updates left unset: live cache results on the default route were inconclusive.
schema = 2
base_model = "bytedance-seed/seed-1-6"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/tiff", "image/jp2", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true }
structured_output = true
cache = { implicit = true }

[limit]
output = 32_000

[api.chat-completions]

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 0.25
cache = { read = 0.05 }

[[cost.text.input.overrides]]
when = { context = { gt = 128_001 } }
price = 0.5
cache = { read = 0.05 }

[cost.text.output]
price = 2

[[cost.text.output.overrides]]
when = { context = { gt = 128_001 } }
price = 4
