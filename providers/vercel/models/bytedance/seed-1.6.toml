# Modalities: BytePlus ModelArk supported image formats (JPEG, PNG, GIF, WEBP, BMP, TIFF, JPEG2000, HEIC/HEIF; ICO, ICNS and SGI have no registered MIME type), https://ai.byteplus.com/ark/region:ap-southeast-1/docs/image-understanding
schema = 2
base_model = "bytedance-seed/seed-1-6"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/tiff", "image/jp2", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }

[limit]
output = 32_000

[cost.text.input]
price = 0.25
cache = { read = 0.05 }

[[cost.text.input.overrides]]
when = { context = { gt = 128_001 } }
price = 0.5
cache = { read = 0.05 }

[cost.text.output]
price = 2

[[cost.text.output.overrides]]
when = { context = { gt = 128_001 } }
price = 4
