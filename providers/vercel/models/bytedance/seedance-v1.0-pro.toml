# Modalities: Seedance input images jpeg, png, webp, bmp, tiff, gif, heic, heif (https://ai.byteplus.com/ark/region:ap-southeast-1/docs/create-video-generation-task-api); AI Gateway: all Seedance models output MP4 (https://vercel.com/docs/ai-gateway/modalities/video-generation/text-to-video)
# Inputs: AI Gateway's catalog video_capabilities.input_limits (kinds and supported_formats), https://ai-gateway.vercel.sh/v1/models
schema = 2
type = "video"
name = "Seedance v1.0 Pro"
description = "Video model for prompt-guided generation, editing, and motion workflows"
family = "seed"
open_weights = false
release_date = "2025-06-11"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp", "image/bmp", "image/tiff", "image/gif"]
output = ["video/mp4"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0

[api.videos]
base_url = "https://ai-gateway.vercel.sh/v4/ai"

[cost.video.output]
unit = "second"
price = 0.0243

[[cost.video.output.overrides]]
when = { resolution = { equals = "720p" } }
price = 0.0515

[[cost.video.output.overrides]]
when = { resolution = { equals = "1080p" } }
price = 0.1224
