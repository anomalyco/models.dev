# Effort: reasoning.effort = none|minimal|low|medium|high|xhigh|max
# https://vercel.com/docs/ai-gateway/sdks-and-apis/openai-chat-completions/reasoning
schema = 2
name = "Seed 2.1 Turbo"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"
family = "seed"
open_weights = false
release_date = "2026-06-23"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }

[limit]
context = 262_144
output = 262_144

[cost.text.input]
price = 0.5
cache = { read = 0.1 }

[cost.text.output]
price = 2.5
