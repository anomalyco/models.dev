# Effort: reasoning.effort = none|minimal|low|medium|high|xhigh|max
# https://vercel.com/docs/ai-gateway/sdks-and-apis/openai-chat-completions/reasoning
# Modalities: BytePlus ModelArk supported image formats (JPEG, PNG, GIF, WEBP, BMP, TIFF, JPEG2000, HEIC/HEIF; ICO, ICNS and SGI have no registered MIME type), https://ai.byteplus.com/ark/region:ap-southeast-1/docs/image-understanding
# Mid-conversation (@ai-sdk/gateway, live 2026-10-19, default route): a mid-conversation system message stays in place (cache prefix kept). Per-turn effort and tool changes exist only for Anthropic models on this API.
schema = 2
base_model = "bytedance-seed/seed-2.1-turbo"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/tiff", "image/jp2", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
system_updates = true
effort_updates = false
cache = { implicit = true }

[limit]
context = 262_144
output = 262_144

[api.chat-completions]

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 0.5
cache = { read = 0.1 }

[cost.text.output]
price = 2.5
