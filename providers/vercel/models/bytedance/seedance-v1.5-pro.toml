# Modalities: Seedance input images jpeg, png, webp, bmp, tiff, gif, heic, heif (https://ai.byteplus.com/ark/region:ap-southeast-1/docs/create-video-generation-task-api); AI Gateway: all Seedance models output MP4 (https://vercel.com/docs/ai-gateway/modalities/video-generation/text-to-video)
# Inputs: AI Gateway's catalog video_capabilities.input_limits (kinds and supported_formats), https://ai-gateway.vercel.sh/v1/models
schema = 2
type = "video"
name = "Seedance v1.5 Pro"
description = "Video model for prompt-guided generation, editing, and motion workflows"
family = "seed"
open_weights = false
release_date = "2025-12-16"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp", "image/bmp", "image/tiff", "image/gif", "image/heic", "image/heif"]
output = ["video/mp4"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0

[api.videos]
base_url = "https://ai-gateway.vercel.sh/v4/ai"
sdk = { opencodeai = "none" }

[cost.video.output]
unit = "second"
price = 0.0121

[[cost.video.output.overrides]]
when = { resolution = { equals = "480p" }, generate_audio = { equals = true } }
price = 0.0241

[[cost.video.output.overrides]]
when = { resolution = { equals = "720p" }, generate_audio = { equals = false } }
price = 0.0259

[[cost.video.output.overrides]]
when = { resolution = { equals = "720p" }, generate_audio = { equals = true } }
price = 0.0518

[[cost.video.output.overrides]]
when = { resolution = { equals = "1080p" }, generate_audio = { equals = false } }
price = 0.0583

[[cost.video.output.overrides]]
when = { resolution = { equals = "1080p" }, generate_audio = { equals = true } }
price = 0.1166
