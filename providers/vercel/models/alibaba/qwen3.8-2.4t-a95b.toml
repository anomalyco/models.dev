# Sources (accessed 2026-08-16):
# https://huggingface.co/Qwen/Qwen3.8-2.4T-A95B
# https://openrouter.ai/qwen/qwen3.8-2.4t-a95b
# Lab: text-only open weights; reasoning_effort low|medium|xhigh.
# Cost aligned with common public list pricing for this slug ($2/$6, cache_read $0.25).
# Modalities: Alibaba Model Studio supported image formats (BMP, JPEG, PNG, TIFF, WEBP, HEIC), https://www.alibabacloud.com/help/en/model-studio/vision
# Mid-conversation (@ai-sdk/gateway, live 2026-10-19, default route): a mid-conversation system message is hoisted (the next request misses the cache). No per-turn effort or tool-change mechanism reaches this model on this API.
schema = 2
base_model = "alibaba/qwen3.8-2.4t-a95b"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["low", "medium", "xhigh"] }
structured_output = true
cache = { implicit = true }

[limit]
output = 128_000

[api.chat-completions]

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 2
cache = { read = 0.25 }

[cost.text.output]
price = 6
