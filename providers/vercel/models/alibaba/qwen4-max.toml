# Toggle: reasoning.enabled = true|false
# https://vercel.com/docs/ai-gateway/sdks-and-apis/openai-chat-completions/reasoning
schema = 2
base_model = "alibaba/qwen4-max"
name = "Qwen 4 Max"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "xhigh"], budget = { min = 0, max = 262_144 } }
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
cache = { implicit = true }

[limit]
output = 384_000

[api.chat-completions]

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 1.5
cache = { read = 0.075, write = 1.875 }

[cost.text.output]
price = 4.5
