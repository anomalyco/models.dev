schema = 2
base_model = "alibaba/qwen3.5-plus"
name = "Qwen 3.5 Plus"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"], budget = { min = 1, max = 81_920 } }

[limit]
output = 64_000

[cost.text.input]
price = 0.4
cache = { read = 0.04, write = 0.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 256_001 } }
price = 0.5
cache = { read = 0.05, write = 0.625 }

[cost.text.output]
price = 2.4

[[cost.text.output.overrides]]
when = { context = { gt = 256_001 } }
price = 3
