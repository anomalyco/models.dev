# Mid-conversation (@ai-sdk/gateway, live 2026-10-23): a mid-conversation system message stays in place (cache kept, followed: e.g. qwen3.7-flash 12142/12140 vs 12131/12129). effort_updates: left out. Changing reasoning effort on the next request keeps the cache on the alibaba route (qwen3.7-flash low->high 6880 and high->low 6878 vs warm 6804/6802; reasoning 1024->4807 and 5512->1024), but there's no in-history effort message, so it doesn't count. No tool-change mechanism is forwarded.
# Per API: system_updates on [api.chat-completions] (@ai-sdk/gateway) only, where it was tested. /v1/responses and /v1/messages are untested for this model or move the message (live 2026-10-23: /v1/responses lost the cache after a mid-conversation system message on Grok 4.3, GLM 5.1 and DeepSeek V4 Pro).
schema = 2
base_model = "alibaba/qwen3.5-plus"
name = "Qwen 3.5 Plus"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"], budget = { min = 1, max = 81_920 } }
cache = { explicit = true }

[limit]
output = 64_000

[api.chat-completions]
capabilities = { system_updates = true }

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 0.4
cache = { read = 0.04, write = 0.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 256_001 } }
price = 0.5
cache = { read = 0.05, write = 0.625 }

[cost.text.output]
price = 2.4

[[cost.text.output.overrides]]
when = { context = { gt = 256_001 } }
price = 3
