# Toggle: reasoning.enabled = true|false
# Effort and budget match Qwen3.8 Max; reasoning.effort and reasoning.max_tokens are mutually exclusive.
# https://vercel.com/docs/ai-gateway/sdks-and-apis/openai-chat-completions/reasoning
# https://docs.qwencloud.com/developer-guides/text-generation/thinking
# Mid-conversation (@ai-sdk/gateway, live 2026-10-19, default route): a mid-conversation system message stays in place (cache prefix kept). Per-turn effort and tool changes exist only for Anthropic models on this API.
schema = 2
base_model = "alibaba/qwen3.8-max-0902"
description = "Qwen vision-language model for visual reasoning, documents, and agent tasks"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "xhigh"], budget = { min = 0, max = 262_144 } }
system_updates = true
effort_updates = false

[limit]
context = 991_000
output = 128_000

[cost.text.input]
price = 2
cache = { read = 0.25, write = 2.5 }

[cost.text.output]
price = 6
