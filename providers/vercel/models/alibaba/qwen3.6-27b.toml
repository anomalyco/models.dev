# Mid-conversation (@ai-sdk/gateway): per-turn effort and tool changes exist only for Anthropic models on this API. system_updates left unset: live cache results on the default route were inconclusive.
schema = 2
base_model = "alibaba/qwen3.6-27b"
name = "Qwen 3.6 27B"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true, budget = { min = 1, max = 131_072 } }
structured_output = true
effort_updates = false

[limit]
context = 256_000

[cost.text.input]
price = 0.6

[cost.text.output]
price = 3.6
