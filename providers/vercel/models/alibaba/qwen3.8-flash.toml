# Sources: https://www.qwencloud.com/models/qwen3.8-flash
# https://docs.qwencloud.com/developer-guides/text-generation/thinking
# https://ai-sdk.dev/providers/ai-sdk-providers/alibaba
# https://vercel.com/docs/ai-gateway/models-and-providers/provider-options
# Toggle: providerOptions.alibaba.enableThinking true|false -> enable_thinking
# Budget: providerOptions.alibaba.thinkingBudget -> thinking_budget (reasoning tokens)
# Mid-conversation (@ai-sdk/gateway, live 2026-10-19, default route): a mid-conversation system message stays in place (cache prefix kept). No per-turn effort or tool-change mechanism reaches this model on this API.
# Per API: system_updates on [api.chat-completions] (@ai-sdk/gateway) only, where it was tested. /v1/responses and /v1/messages are untested for this model or move the message (live 2026-10-23: /v1/responses lost the cache after a mid-conversation system message on Grok 4.3, GLM 5.1 and DeepSeek V4 Pro).
schema = 2
base_model = "alibaba/qwen3.8-flash"
name = "Qwen 3.8 Flash"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "xhigh"], budget = {} }
structured_output = true
cache = { implicit = true, explicit = true }

[limit]
context = 991_000
output = 128_000

[api.chat-completions]
capabilities = { system_updates = true }

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 0.15
cache = { read = 0.016, write = 0.2 }

[cost.text.output]
price = 0.47
