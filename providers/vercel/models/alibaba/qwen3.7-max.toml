# Mid-conversation (@ai-sdk/gateway, live 2026-10-23): a mid-conversation system message stays in place (cache kept, followed: e.g. qwen3.7-flash 12142/12140 vs 12131/12129). effort_updates: left out. Changing reasoning effort on the next request keeps the cache on the alibaba route (qwen3.7-flash low->high 6880 and high->low 6878 vs warm 6804/6802; reasoning 1024->4807 and 5512->1024), but there's no in-history effort message, so it doesn't count. No tool-change mechanism is forwarded.
schema = 2
base_model = "alibaba/qwen3.7-max"
name = "Qwen 3.7 Max"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"], budget = { min = 1, max = 262_144 } }
system_updates = true
cache = { implicit = true, explicit = true }

[limit]
context = 991_000
output = 64_000

[api.chat-completions]

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 2.5
cache = { read = 0.5, write = 3.125 }

[cost.text.output]
price = 7.5
