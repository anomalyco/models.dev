# Effort: reasoning_effort = none|minimal|low|medium|high|xhigh|max
# Alibaba maps minimal to low and high|max to xhigh; none disables thinking.
# https://www.alibabacloud.com/help/en/model-studio/qwen-omni
# Mid-conversation (@ai-sdk/gateway): per-turn effort and tool changes exist only for Anthropic models on this API. system_updates left unset: live cache results on the default route were inconclusive.
schema = 2
base_model = "alibaba/qwen3.8-omni-flash"
name = "Qwen 3.8 Omni Flash"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "medium", "xhigh"] }
structured_output = true
effort_updates = false

[cost.text.input]
price = 0.15
cache = { read = 0.016 }

[cost.text.output]
price = 0.47
