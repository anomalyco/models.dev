# Mid-conversation (@ai-sdk/gateway): per-turn effort and tool changes exist only for Anthropic models on this API. system_updates left unset: live cache results on the default route were inconclusive.
schema = 2
name = "Qwen 3 Max Thinking"
description = "Qwen reasoning model for deliberate problem solving, math, and coding"
family = "qwen"
open_weights = true
knowledge = "2025-01"
release_date = "2026-01-23"
last_updated = "2025-01"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, budget = { min = 1, max = 81_920 } }
temperature = true
effort_updates = false
cache = { supported = true, implicit = true, explicit = false }

[limit]
context = 256_000
output = 65_536

[cost.text.input]
price = 1.2
cache = { read = 0.24 }

[[cost.text.input.overrides]]
when = { context = { gt = 32_001 } }
price = 2.4
cache = { read = 0.48 }

[[cost.text.input.overrides]]
when = { context = { gt = 128_001 } }
price = 3
cache = { read = 0.6 }

[cost.text.output]
price = 6

[[cost.text.output.overrides]]
when = { context = { gt = 32_001 } }
price = 12

[[cost.text.output.overrides]]
when = { context = { gt = 128_001 } }
price = 15
