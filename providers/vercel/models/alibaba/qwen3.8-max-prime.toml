# https://ai-gateway.vercel.sh/v1/models (alibaba/qwen3.8-max-prime, 2026-09-24)
# https://vercel.com/docs/ai-gateway/sdks-and-apis/openai-chat-completions/reasoning
# Effort: reasoning.effort = none|low|medium|high; none turns thinking off,
# so the catalog's separate toggle is redundant. No budget is advertised.
base_model = "alibaba/qwen3.8-max-prime"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "xhigh"]

[[reasoning_options]]
type = "budget_tokens"
min = 0
max = 262_144

[cost]
input = 4
output = 12
cache_read = 0.5
cache_write = 5

[modalities]
input = ["text", "image"]
