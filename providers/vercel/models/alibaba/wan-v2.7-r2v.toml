# Modalities: Wan input images JPEG, PNG, BMP, WEBP; output MP4 (H.264), https://www.alibabacloud.com/help/en/model-studio/image-to-video-api-reference
# Inputs: AI Gateway's catalog video_capabilities.input_limits (kinds and supported_formats), https://ai-gateway.vercel.sh/v1/models
schema = 2
type = "video"
name = "Wan v2.7 Reference-to-Video"
description = "Video model for prompt-guided generation, editing, and motion workflows"
open_weights = false
release_date = "2026-04-07"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/bmp", "image/webp", "video/mp4", "video/quicktime", "audio/wav", "audio/mpeg"]
output = ["video/mp4"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0

[api.videos]
base_url = "https://ai-gateway.vercel.sh/v4/ai"

[cost.video.output]
unit = "second"
price = 0.1

[[cost.video.output.overrides]]
when = { resolution = { equals = "1080p" } }
price = 0.15
