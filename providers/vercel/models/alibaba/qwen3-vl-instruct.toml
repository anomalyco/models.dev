# Modalities: Alibaba Model Studio supported image formats (BMP, JPEG, PNG, TIFF, WEBP, HEIC), https://www.alibabacloud.com/help/en/model-studio/vision
# Mid-conversation (@ai-sdk/gateway): per-turn effort and tool changes exist only for Anthropic models on this API. system_updates left unset: live cache results on the default route were inconclusive.
schema = 2
name = "Qwen3 VL Instruct"
description = "Qwen vision-language model for visual reasoning, documents, and agent tasks"
family = "qwen"
open_weights = true
knowledge = "2025-04"
release_date = "2025-09-23"
last_updated = "2025-09-24"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = false }
temperature = true
effort_updates = false
cache = { supported = true, implicit = true, explicit = false }

[limit]
context = 262_144
output = 262_144

[cost.text.input]
price = 0.2
cache = { read = 0.11 }

[cost.text.output]
price = 0.88
