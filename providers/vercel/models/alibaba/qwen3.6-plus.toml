schema = 2
base_model = "alibaba/qwen3.6-plus"
name = "Qwen 3.6 Plus"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"], budget = { min = 1, max = 131_072 } }

[limit]
output = 64_000

[cost.text.input]
price = 0.5
cache = { read = 0.05, write = 0.625 }

[[cost.text.input.overrides]]
when = { context = { gt = 256_000 } }
price = 2
cache = { read = 0.2, write = 2.5 }

[cost.text.output]
price = 3

[[cost.text.output.overrides]]
when = { context = { gt = 256_000 } }
price = 6
