# Mid-conversation (@ai-sdk/gateway, live 2026-10-19, default route): a mid-conversation system message stays in place (cache prefix kept). Per-turn effort and tool changes exist only for Anthropic models on this API.
schema = 2
base_model = "alibaba/qwen3.7-flash"
base_model_omit = ["limit.input"]
name = "Qwen 3.7 Flash"
description = "Qwen vision-language model for visual reasoning, documents, and agent tasks"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"], budget = {} }
structured_output = true
system_updates = true
effort_updates = false
cache = { implicit = true, explicit = true }

[limit]
context = 991_000
output = 64_000

[api.chat-completions]

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 0.03
cache = { read = 0.006, write = 0.038 }

[[cost.text.input.overrides]]
when = { context = { gt = 32_000 } }
price = 0.1
cache = { read = 0.02, write = 0.125 }

[[cost.text.input.overrides]]
when = { context = { gt = 256_000 } }
price = 0.2
cache = { read = 0.04, write = 0.25 }

[cost.text.output]
price = 0.13

[[cost.text.output.overrides]]
when = { context = { gt = 32_000 } }
price = 0.4

[[cost.text.output.overrides]]
when = { context = { gt = 256_000 } }
price = 0.8
