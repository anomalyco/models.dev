# Toggle: reasoning.enabled = true|false
# https://vercel.com/docs/ai-gateway/sdks-and-apis/openai-chat-completions/reasoning
schema = 2
base_model = "alibaba/qwen3-32b"
name = "Qwen 3.32B"
description = "Qwen instruction model for multilingual chat, reasoning, and tool use"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }

[limit]
context = 128_000
output = 8_192

[cost.text.input]
price = 0.15

[cost.text.output]
price = 0.6
