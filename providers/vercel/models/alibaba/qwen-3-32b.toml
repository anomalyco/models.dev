schema = 2
name = "Qwen 3.32B"
description = "Qwen instruction model for multilingual chat, reasoning, and tool use"
family = "qwen"
open_weights = false
knowledge = "2025-04"
release_date = "2025-04-28"
last_updated = "2025-04"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
