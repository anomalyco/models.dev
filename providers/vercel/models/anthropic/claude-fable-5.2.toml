# Mid-conversation, tool and cache flags backfilled 2026-11-18 from claude-fable-5.1.toml on this host (same API layout; the sync doesn't carry them).
schema = 2
base_model = "anthropic/claude-fable-5-2"
description = "Claude model for creative writing, analysis, and controlled agent workflows"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
cache = { explicit = true }

[api.chat-completions]
capabilities = { system_updates = true, effort_updates = true }

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }
capabilities = { tools = { search = true } }

[cost.text.input]
price = 8
cache = { read = 0.2, write = 10 }

[cost.text.output]
price = 40
