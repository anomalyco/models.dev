# Toggle: reasoning.enabled = true|false
# https://vercel.com/docs/ai-gateway/sdks-and-apis/openai-chat-completions/reasoning
name = "Claude Haiku 4.5 (Batch)"
description = "Fast Claude model for responsive assistance, classification, and lightweight agents"
family = "claude-haiku"
release_date = "2025-10-15"
last_updated = "2025-10-15"
attachment = true
reasoning = true
tool_call = true
open_weights = false

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "budget_tokens"
min = 1_024

[cost]
input = 0.5
output = 2.5
cache_read = 0.05
cache_write = 0.625

[limit]
context = 200_000
output = 64_000

[modalities]
input = ["text", "image", "pdf"]
output = ["text"]
