# Modalities: AI Gateway KlingAI video results are MP4 (https://vercel.com/docs/ai-gateway/modalities/video-generation/text-to-video)
schema = 2
type = "video"
name = "Kling v3.0 Text-to-Video"
description = "Video model for prompt-guided generation, editing, and motion workflows"
family = "ling"
open_weights = false
release_date = "2026-02-05"

[modalities]
input = ["text"]
output = ["video/mp4"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0

[api.videos]
base_url = "https://ai-gateway.vercel.sh/v4/ai"

[cost.video.output]
unit = "second"
price = 0.168

[[cost.video.output.overrides]]
when = { mode = { equals = "std" }, generate_audio = { equals = true } }
price = 0.252

[[cost.video.output.overrides]]
when = { mode = { equals = "pro" }, generate_audio = { equals = false } }
price = 0.224

[[cost.video.output.overrides]]
when = { mode = { equals = "pro" }, generate_audio = { equals = true } }
price = 0.336

[[cost.video.output.overrides]]
when = { mode = { equals = "std" }, generate_audio = { equals = true }, voice_control = { equals = true } }
price = 0.308

[[cost.video.output.overrides]]
when = { mode = { equals = "pro" }, generate_audio = { equals = true }, voice_control = { equals = true } }
price = 0.392
