# Modalities: AI Gateway KlingAI video results are MP4 (https://vercel.com/docs/ai-gateway/modalities/video-generation/text-to-video)
# Inputs: AI Gateway's catalog video_capabilities.input_limits (kinds and supported_formats), https://ai-gateway.vercel.sh/v1/models
schema = 2
type = "video"
name = "Kling v2.5 Turbo Image-to-Video"
description = "Image model for prompt-driven generation, editing, and visual design workflows"
family = "ling"
open_weights = false
release_date = "2025-09-23"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["video/mp4"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0

[api.videos]
base_url = "https://ai-gateway.vercel.sh/v4/ai"

[cost.video.output]
unit = "second"
price = 0.042

[[cost.video.output.overrides]]
when = { mode = { equals = "pro" } }
price = 0.07
