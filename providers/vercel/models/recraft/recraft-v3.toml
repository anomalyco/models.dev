# Modalities: Recraft raster image_format webp (default) | png, https://www.recraft.ai/docs/api-reference/endpoints
schema = 2
type = "image"
name = "Recraft V3"
description = "Image model for prompt-driven generation, editing, and visual design workflows"
family = "recraft"
open_weights = false
release_date = "2024-10-30"
last_updated = "2024-10"

[modalities]
input = ["text"]
output = ["image/webp", "image/png"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 512
output = 0

[api.images]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/images" }

[cost.image.output]
unit = "image"
price = 0.04

[[cost.image.output.overrides]]
when = { style = { equals = "vector_illustration" } }
price = 0.08
