# Modalities: Recraft raster image_format webp (default) | png, https://www.recraft.ai/docs/api-reference/endpoints
schema = 2
type = "image"
name = "Recraft V4.1 Utility"
description = "Image model for prompt-driven generation, editing, and visual design workflows"
family = "recraft"
open_weights = false
release_date = "2026-05-14"

[modalities]
input = ["text"]
output = ["image/webp", "image/png"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0

[api.images]
base_url = "https://ai-gateway.vercel.sh/v4/ai"
sdk = { opencodeai = "none" }

[cost.image.output]
unit = "image"
price = 0.035

[[cost.image.output.overrides]]
when = { style = { equals = "vector_illustration" } }
price = 0.08
