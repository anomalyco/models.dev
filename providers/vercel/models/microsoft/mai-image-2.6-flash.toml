# Modalities: MAI image generation output is always PNG, https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/use-foundry-models-mai
schema = 2
type = "image"
name = "MAI-Image-2.6-Flash"
description = "Image model for prompt-driven generation, editing, and visual design workflows"
family = "mai"
open_weights = false
release_date = "2026-10-13"

[modalities]
input = ["text"]
output = ["image/png"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0

[api.images]
base_url = "https://ai-gateway.vercel.sh/v4/ai"

[cost.text.input]
price = 1.75

[cost.text.output]
price = 19

[cost.image.output]
price = 19
