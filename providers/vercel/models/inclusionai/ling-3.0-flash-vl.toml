# Toggle: reasoning.enabled = true|false
# https://vercel.com/docs/ai-gateway/sdks-and-apis/openai-chat-completions/reasoning
schema = 2
base_model = "inclusionai/ling-3.0-flash-vl"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }

[limit]
context = 256_000
output = 32_000

[cost.text.input]
price = 0.075
cache = { read = 0.015 }

[cost.text.output]
price = 0.22
