# Toggle: reasoning.enabled = true|false
# https://vercel.com/docs/ai-gateway/sdks-and-apis/openai-chat-completions/reasoning
# Modalities: Ling-3.0-flash-VL image formats JPEG, PNG, https://developer.ant-ling.com/en/docs/tutorials/multimodal-understanding
# Mid-conversation (@ai-sdk/gateway, live 2026-10-19, default route): a mid-conversation system message stays in place (cache prefix kept). Per-turn effort and tool changes exist only for Anthropic models on this API.
schema = 2
base_model = "inclusionai/ling-3.0-flash-vl"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true }
system_updates = true
effort_updates = false

[limit]
context = 256_000
output = 32_000

[cost.text.input]
price = 0.075
cache = { read = 0.015 }

[cost.text.output]
price = 0.22
