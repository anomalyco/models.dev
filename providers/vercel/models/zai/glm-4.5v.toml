# Mid-conversation (@ai-sdk/gateway): per-turn effort and tool changes exist only for Anthropic models on this API. system_updates left unset: live cache results on the default route were inconclusive.
schema = 2
base_model = "zhipuai/glm-4.5v"
name = "GLM 4.5V"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true }
effort_updates = false
cache = { supported = true, implicit = true, explicit = false }

[limit]
context = 66_000
output = 16_000

[cost.text.input]
price = 0.6
cache = { read = 0.11 }

[cost.text.output]
price = 1.8
