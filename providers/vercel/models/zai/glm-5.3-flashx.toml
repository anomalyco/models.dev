# GLM-5.3-FlashX uses the same model and forced-thinking effort levels as Flash.
# https://docs.z.ai/guides/vlm/glm-5.3-flash
schema = 2
base_model = "zhipuai/glm-5.3-flash"
name = "GLM 5.3 FlashX"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[cost.text.input]
price = 0.37
cache = { read = 0.075 }

[cost.text.output]
price = 1.25
