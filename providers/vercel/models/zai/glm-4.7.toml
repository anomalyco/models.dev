# Toggle: reasoning.enabled = true|false
# https://vercel.com/docs/ai-gateway/sdks-and-apis/openai-chat-completions/reasoning
base_model = "zhipuai/glm-4.7"
name = "GLM 4.7"

interleaved = true

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high"]

[cost]
input = 0.6
output = 2.2

[limit]
context = 200_000
output = 120_000
