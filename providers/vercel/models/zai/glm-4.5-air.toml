# Mid-conversation (@ai-sdk/gateway): per-turn effort and tool changes exist only for Anthropic models on this API. system_updates left unset: live cache results on the default route were inconclusive.
schema = 2
base_model = "zhipuai/glm-4.5-air"
name = "GLM 4.5 Air"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true }
effort_updates = false
cache = { supported = true, implicit = true, explicit = false }

[limit]
context = 128_000
output = 96_000

[cost.text.input]
price = 0.2
cache = { read = 0.03 }

[cost.text.output]
price = 1.1
