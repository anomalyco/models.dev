# Mid-conversation (@ai-sdk/gateway): per-turn effort and tool changes exist only for Anthropic models on this API. system_updates left unset: live cache results on the default route were inconclusive.
schema = 2
base_model = "zhipuai/glm-4.7-flashx"
name = "GLM 4.7 FlashX"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
effort_updates = false

[limit]
output = 128_000

[api.chat-completions]
compatibility = { replay_reasoning = true }

[cost.text.input]
price = 0.06
cache = { read = 0.01 }

[cost.text.output]
price = 0.4
