# GLM-5.3 always reasons; effort levels match the native model and Vercel's standard GLM-5.3 route.
# https://docs.z.ai/guides/llm/glm-5.3
schema = 2
base_model = "zhipuai/glm-5.3"
name = "GLM 5.3 Fast"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true

[limit]
context = 1_048_576
output = 262_144

[cost.text.input]
price = 2.1
cache = { read = 0.21 }

[cost.text.output]
price = 6.6
