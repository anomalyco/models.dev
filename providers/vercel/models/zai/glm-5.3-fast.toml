# GLM-5.3 always reasons; effort levels match the native model and Vercel's standard GLM-5.3 route.
# https://docs.z.ai/guides/llm/glm-5.3
# Mid-conversation (@ai-sdk/gateway, live 2026-10-23): a mid-conversation system message is followed (French 2 of 2); the default route (baseten) never cached the prefix (control 0), so there is nothing to lose and system_updates stays true, matching Z.ai's API. No per-turn effort or tool-change mechanism reaches this model on this API.
# Per API: system_updates on [api.chat-completions] (@ai-sdk/gateway) only, where it was tested. /v1/responses and /v1/messages are untested for this model or move the message (live 2026-10-23: /v1/responses lost the cache after a mid-conversation system message on Grok 4.3, GLM 5.1 and DeepSeek V4 Pro).
schema = 2
base_model = "zhipuai/glm-5.3"
name = "GLM 5.3 Fast"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 1_048_576
output = 262_144

[api.chat-completions]
capabilities = { system_updates = true }

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 2.1
cache = { read = 0.21 }

[cost.text.output]
price = 6.6
