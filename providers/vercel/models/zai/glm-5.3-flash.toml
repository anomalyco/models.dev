# Source: https://docs.z.ai/guides/llm/glm-5.3-flash
# Effort: reasoning_effort = low|high|max, matching GLM-5.3 and relay peers.
# Thinking is always enabled; no toggle or reasoning-token budget.
schema = 2
base_model = "zhipuai/glm-5.3-flash"
name = "GLM 5.3 Flash"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
output = 131_000

[cost.text.input]
price = 0.15
cache = { read = 0.03 }

[cost.text.output]
price = 0.5
