# Synced from https://ai-gateway.vercel.sh/v1/models (type embedding)
# https://vercel.com/docs/ai-gateway/modalities/embeddings
# Context length: 32,000 tokens, https://docs.voyageai.com/docs/embeddings
schema = 2
type = "embedding"
name = "voyage-finance-2"
description = "Embedding model for semantic search, retrieval, clustering, and ranking pipelines"
family = "voyage"
open_weights = false
release_date = "2024-06-03"
last_updated = "2024-03"

[modalities]
input = ["text"]
output = ["embedding"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 32_000
output = 0

[api.embeddings]
base_url = "https://ai-gateway.vercel.sh/v4/ai"
sdk = { opencodeai = "none" }

[cost.text.input]
price = 0.12
