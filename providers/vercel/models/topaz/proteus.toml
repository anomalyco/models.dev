# Modalities: Topaz Video API output.container mp4 (default), mov, mkv, avi, webm (AVI has no registered MIME type), https://developer.topazlabs.com/video-models/proteus/proteus
schema = 2
name = "Proteus"
description = "Video model for prompt-guided generation, editing, and motion workflows"
open_weights = false
release_date = "2026-10-06"

[modalities]
input = ["text"]
output = ["video/mp4", "video/quicktime", "video/matroska", "video/webm"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }

[limit]
context = 0
output = 0
