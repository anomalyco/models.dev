# Modalities: Nemotron 3.5 Super VL image formats jpeg, png, https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-BF16
schema = 2
base_model = "nvidia/nemotron-3.5-super-vl-120b-a12b"
name = "NVIDIA Nemotron 3.5 Super VL"
description = "Nemotron multimodal model for visual reasoning and agentic AI workflows"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }

[limit]
output = 1_048_576

[cost.text.input]
price = 0.2
cache = { read = 0.04 }

[cost.text.output]
price = 0.5
