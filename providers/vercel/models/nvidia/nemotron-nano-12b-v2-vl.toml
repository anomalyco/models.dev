# Modalities: Nemotron Nano 12B v2 VL image formats png, jpg, jpeg, webp, https://build.nvidia.com/nvidia/nemotron-nano-12b-v2-vl/modelcard
# Mid-conversation (@ai-sdk/gateway, live 2026-10-19): routed to Amazon Bedrock Converse, which rejects system-role messages for this model (https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Message.html), so the gateway cannot keep them in place. No per-turn effort or tool-change mechanism reaches this model on this API.
schema = 2
base_model = "nvidia/nemotron-nano-12b-v2-vl"
name = "Nvidia Nemotron Nano 12B V2 VL"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }

[limit]
context = 131_072
output = 131_072

[api.chat-completions]

