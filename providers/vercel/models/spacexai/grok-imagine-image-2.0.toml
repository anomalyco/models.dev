# Synced from https://ai-gateway.vercel.sh/v1/models (type image)
# https://vercel.com/docs/ai-gateway/modalities/image-generation
schema = 2
base_model = "xai/grok-imagine-image-2.0"
description = "Image model for prompt-driven generation, editing, and visual design workflows"

[modalities]
input = ["text"]
output = ["image/jpeg", "image/png"]

[limit]
context = 0

[api.images]
base_url = "https://ai-gateway.vercel.sh/v4/ai"

[cost.image.output]
unit = "image"
price = 0.06

[[cost.image.output.overrides]]
when = { quality = { equals = "low" } }
price = 0.04

[[cost.image.output.overrides]]
when = { resolution = { equals = "2048x2048" } }
price = 0.08

[[cost.image.output.overrides]]
when = { resolution = { equals = "2048x2048" }, quality = { equals = "low" } }
price = 0.06
