# Modalities: Grok Imagine video output is MP4, https://docs.x.ai/docs/guides/video-generation
# Inputs: AI Gateway's catalog video_capabilities.input_limits (kinds and supported_formats), https://ai-gateway.vercel.sh/v1/models
# Video input: "Source video .mp4 with a supported codec such as H.264, H.265, or AV1", https://docs.x.ai/developers/model-capabilities/video/editing
schema = 2
base_model = "xai/grok-imagine-video"
name = "Grok Imagine"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp", "image/gif", "image/avif", "video/mp4"]
output = ["video/mp4"]

[api.videos]
base_url = "https://ai-gateway.vercel.sh/v4/ai"
sdk = { opencodeai = "none" }

[cost.video.output]
unit = "second"
price = 0.05

[[cost.video.output.overrides]]
when = { resolution = { equals = "720p" } }
price = 0.07
