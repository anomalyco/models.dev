schema = 2
base_model = "xai/grok-4.5"
description = "Grok model for agentic tool use, reasoning, coding, and live assistance"

[modalities]
input = ["text", "image/jpeg", "image/png", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 2
cache = { read = 0.3 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_001 } }
price = 4
cache = { read = 0.6 }

[cost.text.output]
price = 6

[[cost.text.output.overrides]]
when = { context = { gt = 200_001 } }
price = 12
