schema = 2
base_model = "xai/grok-build-0.1"
description = "Grok coding model for agentic engineering, edits, and codebase workflows"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 1
cache = { read = 0.2 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_001 } }
price = 2
cache = { read = 0.4 }

[cost.text.output]
price = 2

[[cost.text.output.overrides]]
when = { context = { gt = 200_001 } }
price = 4
