# Mid-conversation (@ai-sdk/gateway, live 2026-10-19): system messages stay in place (cache prefix kept). No per-turn effort or tool-change mechanism is forwarded.
schema = 2
base_model = "xai/grok-build-0.1"
description = "Grok coding model for agentic engineering, edits, and codebase workflows"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
system_updates = true
effort_updates = false
cache = { supported = true, implicit = true, explicit = false }

[cost.text.input]
price = 1
cache = { read = 0.2 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_001 } }
price = 2
cache = { read = 0.4 }

[cost.text.output]
price = 2

[[cost.text.output.overrides]]
when = { context = { gt = 200_001 } }
price = 4
