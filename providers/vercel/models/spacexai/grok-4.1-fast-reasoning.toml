# Mid-conversation (@ai-sdk/gateway, live 2026-10-19): system messages stay in place (cache prefix kept). No per-turn effort or tool-change mechanism is forwarded.
schema = 2
base_model = "xai/grok-4.1-fast-reasoning"
name = "Grok 4.1 Fast Reasoning"
description = "Fast Grok model for responsive chat, reasoning, and tool-assisted work"

[modalities]
input = ["text", "image/jpeg", "image/png", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
system_updates = true
effort_updates = false

[limit]
context = 1_000_000
output = 1_000_000

[cost.text.input]
price = 0.2
cache = { read = 0.05 }

[cost.text.output]
price = 0.5
