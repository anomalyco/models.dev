schema = 2
base_model = "xai/grok-4.1-fast"
name = "Grok 4.1 Fast Non-Reasoning"
description = "Fast Grok model for responsive chat, reasoning, and tool-assisted work"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[limit]
context = 1_000_000
output = 1_000_000

[cost.text.input]
price = 0.2
cache = { read = 0.05 }

[cost.text.output]
price = 0.5
