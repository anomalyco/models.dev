# Mid-conversation (@ai-sdk/gateway, live 2026-10-19, default route): a mid-conversation system message stays in place (cache prefix kept). Per-turn effort and tool changes exist only for Anthropic models on this API.
schema = 2
base_model = "sakana/sakana-namazu"
description = "Multi-agent model for routing expert agents across complex analytical tasks"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
system_updates = true
effort_updates = false
cache = { supported = true, implicit = true, explicit = false }

[limit]
context = 256_000
output = 256_000

[cost.text.input]
price = 0.95
cache = { read = 0.15 }

[cost.text.output]
price = 4
