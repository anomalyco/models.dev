# Effort: reasoning.effort = high|xhigh|max
# https://console.sakana.ai/models
# Modalities: generic image kept, Sakana's API docs say image input is supported but list no formats
# Mid-conversation (@ai-sdk/gateway, live 2026-10-19, default route): a mid-conversation system message is hoisted (the next request misses the cache). No per-turn effort or tool-change mechanism reaches this model on this API.
schema = 2
base_model = "sakana/fugu-max"
description = "Multi-agent model for routing expert agents across complex analytical tasks"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true }

[limit]
output = 1_000_000

[api.chat-completions]

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 2
cache = { read = 0.25 }

[cost.text.output]
price = 6
