# Effort: reasoning.effort = high|xhigh|max
# https://console.sakana.ai/models
# Modalities: generic image kept, Sakana's API docs say image input is supported but list no formats
schema = 2
base_model = "sakana/fugu-max"
description = "Multi-agent model for routing expert agents across complex analytical tasks"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["high", "xhigh", "max"] }

[limit]
output = 1_000_000

[cost.text.input]
price = 2
cache = { read = 0.25 }

[cost.text.output]
price = 6
