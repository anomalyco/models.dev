# Effort: reasoning.effort = high|xhigh|max
# https://console.sakana.ai/models
# Modalities: generic image kept, Sakana's API docs say image input is supported but list no formats
# Mid-conversation (@ai-sdk/gateway): per-turn effort and tool changes exist only for Anthropic models on this API. system_updates left unset: live cache results on the default route were inconclusive.
schema = 2
base_model = "sakana/fugu-ultra-v2"
description = "Quality-first multi-agent model for hard research, analysis, and competitions"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["high", "xhigh", "max"] }
structured_output = true
effort_updates = false
cache = { supported = true, implicit = true, explicit = false }

[limit]
output = 1_000_000

[cost.text.input]
price = 5
cache = { read = 0.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_001 } }
price = 10
cache = { read = 1 }

[cost.text.output]
price = 30

[[cost.text.output.overrides]]
when = { context = { gt = 272_001 } }
price = 45
