# Effort: reasoning.effort = high|xhigh|max
# https://console.sakana.ai/models
base_model = "sakana/fugu-ultra-v2"
description = "Quality-first multi-agent model for hard research, analysis, and competitions"

[[reasoning_options]]
type = "effort"
values = ["high", "xhigh"]

[cost]
input = 5
output = 30
cache_read = 0.5

[[cost.tiers]]
tier = { type = "context", size = 272_001 }
input = 10
output = 45
cache_read = 1

[limit]
output = 1_000_000

[modalities]
input = ["text", "image"]
