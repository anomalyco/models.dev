# Was a symlink into providers/llama/models; replaced with a regular file when the Llama API
# entries were deprecated, so Vercel's entry no longer follows them.
schema = 2
base_model = "meta/llama-4-scout-17b-instruct"
name = "Llama-4-Scout-17B-16E-Instruct-FP8"
description = "Open multimodal Llama model for long-context analysis and efficient agents"

[limit]
context = 128_000
output = 8_192

[api.chat-completions]

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 0.17

[cost.text.output]
price = 0.66
