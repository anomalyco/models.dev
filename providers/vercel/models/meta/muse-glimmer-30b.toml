# Sources:
# https://ai-gateway.vercel.sh/v1/models (meta/muse-glimmer-30b)
# Effort: reasoning_effort = low|medium|high|xhigh
# Same controls as OpenRouter/Together and the model card.
# https://huggingface.co/meta-models/Muse-Glimmer-30B
# https://openrouter.ai/meta/muse-glimmer-30b
# Mid-conversation (@ai-sdk/gateway, live 2026-10-19, default route): a mid-conversation system message stays in place (cache prefix kept). Per-turn effort and tool changes exist only for Anthropic models on this API.
schema = 2
base_model = "meta/muse-glimmer-30b"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
system_updates = true
effort_updates = false

[cost.text.input]
price = 0.35
cache = { read = 0.04 }

[cost.text.output]
price = 1.5
