# Modalities: Meta Model API image inputs png, jpeg, gif, webp (https://dev.meta.ai/docs/file-handling); Muse Image output_format webp (default) | png | jpeg (https://dev.meta.ai/docs/image-generation)
schema = 2
base_model = "meta/muse-image-1.0"
name = "Muse Image 1.0"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/gif", "image/webp"]
output = ["image/webp", "image/png", "image/jpeg"]

[api.images]
base_url = "https://ai-gateway.vercel.sh/v4/ai"

[cost.image.output]
unit = "image"
price = 0.01
