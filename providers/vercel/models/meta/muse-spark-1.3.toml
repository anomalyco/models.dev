# Effort: providerOptions.openai.reasoningEffort = minimal|low|medium|high|xhigh|max
# Verified via Chat Completions with providerOptions.gateway.only = ["meta"] on 2026-09-04.
# Native max succeeds on standard 1.3 and is rejected on Contributor/1.2; generic reasoning.effort also accepts those unsupported combinations.
# https://research.meta.ai/blog/introducing-muse-spark-1-3
# https://vercel.com/docs/ai-gateway/sdks-and-apis/openai-chat-completions/advanced
# https://dev.meta.ai/docs/reasoning.md
# Mid-conversation (@ai-sdk/gateway, live 2026-10-19, default route): a mid-conversation system message stays in place (cache prefix kept). Per-turn effort and tool changes exist only for Anthropic models on this API.
schema = 2
base_model = "meta/muse-spark-1.3"
description = "Open Llama multimodal model for image understanding and text reasoning"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
system_updates = true
effort_updates = false
cache = { supported = true, implicit = true, explicit = false }

[limit]
output = 1_048_576

[api.chat-completions]

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 1.25
cache = { read = 0.15 }

[cost.text.output]
price = 4.25
