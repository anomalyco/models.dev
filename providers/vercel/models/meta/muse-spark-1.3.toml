# Effort: providerOptions.openai.reasoningEffort = minimal|low|medium|high|xhigh|max
# Verified via Chat Completions with providerOptions.gateway.only = ["meta"] on 2026-09-04.
# Native max succeeds on standard 1.3 and is rejected on Contributor/1.2; generic reasoning.effort also accepts those unsupported combinations.
# https://research.meta.ai/blog/introducing-muse-spark-1-3
# https://vercel.com/docs/ai-gateway/sdks-and-apis/openai-chat-completions/advanced
# https://dev.meta.ai/docs/reasoning.md
schema = 2
base_model = "meta/muse-spark-1.3"
description = "Open Llama multimodal model for image understanding and text reasoning"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[limit]
output = 1_048_576

[cost.text.input]
price = 1.25
cache = { read = 0.15 }

[cost.text.output]
price = 4.25
