# Effort: reasoning_effort / reasoning.effort = minimal|low|medium|high|xhigh
# Empty [] was incorrect: Muse Spark exposes graded effort; OpenCode treats [] as no variants.
# max is not available on Contributor / 1.2 tiers per Meta reasoning docs.
# https://ai.developer.meta.com/docs/reasoning
# https://dev.meta.ai/docs/reasoning
# https://vercel.com/docs/ai-gateway/sdks-and-apis/openai-chat-completions/reasoning
# Modalities: Meta Model API image types png, jpeg, gif, webp (x-icon has no registered MIME type), https://dev.meta.ai/docs/file-handling
# Mid-conversation (@ai-sdk/gateway, live 2026-10-19, default route): a mid-conversation system message stays in place (cache prefix kept). No per-turn effort or tool-change mechanism reaches this model on this API.
# Per API: system_updates on [api.chat-completions] (@ai-sdk/gateway) only, where it was tested. /v1/responses and /v1/messages are untested for this model or move the message (live 2026-10-23: /v1/responses lost the cache after a mid-conversation system message on Grok 4.3, GLM 5.1 and DeepSeek V4 Pro).
schema = 2
name = "Muse Spark 1.2 Contributor"
description = "Open Llama multimodal model for image understanding and text reasoning"
family = "muse"
open_weights = false
release_date = "2026-08-05"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh"] }
effort_updates = false
cache = { implicit = true }

[limit]
context = 1_048_576
output = 1_048_576

[api.chat-completions]
capabilities = { system_updates = true }

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 0.1
cache = { read = 0.002 }

[cost.text.output]
price = 0.2
