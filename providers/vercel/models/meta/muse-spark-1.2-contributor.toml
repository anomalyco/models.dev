# Effort: reasoning_effort / reasoning.effort = minimal|low|medium|high|xhigh
# Empty [] was incorrect: Muse Spark exposes graded effort; OpenCode treats [] as no variants.
# max is not available on Contributor / 1.2 tiers per Meta reasoning docs.
# https://ai.developer.meta.com/docs/reasoning
# https://dev.meta.ai/docs/reasoning
# https://vercel.com/docs/ai-gateway/sdks-and-apis/openai-chat-completions/reasoning
name = "Muse Spark 1.2 Contributor"
description = "Open Llama multimodal model for image understanding and text reasoning"
family = "muse"
release_date = "2026-08-05"
last_updated = "2026-08-05"
attachment = true
reasoning = true
tool_call = true
open_weights = false
reasoning_options = [{ type = "effort", values = ["minimal", "low", "medium", "high", "xhigh"] }]

[cost]
input = 0.1
output = 0.2
cache_read = 0.002

[limit]
context = 1_048_576
output = 1_048_576

[modalities]
input = ["text", "image", "pdf"]
output = ["text"]
