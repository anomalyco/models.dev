# Was a symlink to providers/llama/models/llama-3.3-70b-instruct.toml; replaced with a regular file
# when the Llama API entries were deprecated. Text-only, so attachment is false (Vercel's catalog
# lists input ["text"]: https://ai-gateway.vercel.sh/v1/models, checked 2026-10-21).
schema = 2
base_model = "meta/llama-3.3-70b-instruct"
description = "Open Llama instruction model for multilingual chat, reasoning, and coding"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }

[limit]
output = 8_192

[api.chat-completions]

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 0.72

[cost.text.output]
price = 0.72
