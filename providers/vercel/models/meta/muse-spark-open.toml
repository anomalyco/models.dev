schema = 2
base_model = "meta/muse-spark-open"
description = "Open Llama multimodal model for image understanding and text reasoning"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true

[limit]
output = 1_048_576

[cost.text.input]
price = 1.25
cache = { read = 0.15 }

[cost.text.output]
price = 4.25
