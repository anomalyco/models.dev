# Effort: reasoning_effort / reasoning.effort = minimal|low|medium|high|xhigh
# Empty [] was incorrect: Muse Spark exposes graded effort; OpenCode treats [] as no variants.
# max is Standard-tier muse-spark-1.3 only (not Contributor) per Meta reasoning docs.
# https://ai.developer.meta.com/docs/reasoning
# https://dev.meta.ai/docs/reasoning
# https://vercel.com/docs/ai-gateway/sdks-and-apis/openai-chat-completions/reasoning
# Modalities: Meta Model API image types png, jpeg, gif, webp (x-icon has no registered MIME type), https://dev.meta.ai/docs/file-handling
# Mid-conversation (@ai-sdk/gateway, live 2026-10-19, default route): a mid-conversation system message stays in place (cache prefix kept). Per-turn effort and tool changes exist only for Anthropic models on this API.
schema = 2
name = "Muse Spark 1.3 Contributor"
description = "Open Llama multimodal model for image understanding and text reasoning"
family = "muse"
open_weights = false
release_date = "2026-09-02"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh", "max"] }
system_updates = true
effort_updates = false

[limit]
context = 1_048_576
output = 1_048_576

[cost.text.input]
price = 0.1
cache = { read = 0.002 }

[cost.text.output]
price = 0.2
