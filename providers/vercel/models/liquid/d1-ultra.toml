# Modalities: d1 image formats JPEG, PNG, WebP, GIF, https://docs.liquid.ai/lfm/models/d1
schema = 2
type = "decision"
name = "Liquid d1 Ultra"
description = "Liquid d1-ultra is a multimodal decision model for classification, routing, and scoring across text and images, with a 32,768-token context window. It returns calibrated probabilities for yes/no, multiple-choice, and scale-based questions in a single forward pass without generating output tokens. It is designed for demanding real-world tasks such as visual defect inspection and evaluating damage claims against customer photos."
family = "liquid"
open_weights = false
release_date = "2026-10-15"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }

[limit]
context = 32_768
output = 0

[cost.text.input]
price = 0.042

[cost.text.output]
price = 0
