# Modalities: HeyGen assets png, jpeg, mp4, webm, mp3, wav (https://developers.heygen.com/reference/upload-asset); heygen-video-1 returns an MP4 (https://developers.heygen.com/docs/quick-start)
# Inputs: AI Gateway's catalog video_capabilities.input_limits (kinds and supported_formats), https://ai-gateway.vercel.sh/v1/models
schema = 2
type = "video"
name = "HeyGen Video"
description = "Video model for prompt-guided generation, editing, and motion workflows"
open_weights = false
release_date = "2026-10-09"

[modalities]
input = ["text", "image/png", "image/jpeg", "video/mp4", "video/webm", "audio/mpeg", "audio/wav"]
output = ["video/mp4"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0

[api.videos]
base_url = "https://ai-gateway.vercel.sh/v4/ai"
sdk = { opencodeai = "none" }
