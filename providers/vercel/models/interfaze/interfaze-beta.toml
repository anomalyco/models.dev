# Modalities: generic image kept, Interfaze lists no accepted image formats (its SDK only rejects image/gif and image/avif)
schema = 2
name = "Interfaze Beta"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"
open_weights = false
release_date = "2025-10-07"
last_updated = "2026-04-29"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
temperature = true

[limit]
context = 1_000_000
output = 32_000

[cost.text.input]
price = 1.5

[cost.text.output]
price = 3.5
