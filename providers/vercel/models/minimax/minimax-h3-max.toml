# Modalities: MiniMax H3 image inputs JPG, JPEG, PNG, WEBP, HEIC, HEIF (https://platform.minimax.io/docs/api-reference/video-generation-v2-create); output MP4 per AI Gateway video docs (https://vercel.com/docs/ai-gateway/modalities/video-generation)
schema = 2
base_model = "minimax/MiniMax-H3-Max"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp", "image/heic", "image/heif"]
output = ["video/mp4"]

[api.videos]
base_url = "https://ai-gateway.vercel.sh/v4/ai"

[cost.video.output]
unit = "second"
price = 0.08

[[cost.video.output.overrides]]
when = { resolution = { equals = "480p" } }
price = 0.05
