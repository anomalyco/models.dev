# Synced from https://ai-gateway.vercel.sh/v1/models (type image)
# https://vercel.com/docs/ai-gateway/modalities/image-generation
schema = 2
v2_only = true
type = "image"
name = "MiniMax H3 Image Highspeed"
description = "Image model for prompt-driven generation, editing, and visual design workflows"
family = "minimax"
open_weights = true
release_date = "2026-11-10"

[modalities]
input = ["text", "image"]
output = ["image"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0

[api.images]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/images" }

[cost.text.input]
price = 2.3

[cost.text.output]
price = 7.6

[cost.image.output]
price = 7.6
