# Synced from https://ai-gateway.vercel.sh/v1/models (type video)
# https://vercel.com/docs/ai-gateway/modalities/video-generation
schema = 2
base_model = "minimax/MiniMax-H3"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp", "image/heic", "image/heif"]
output = ["video/mp4"]

[api.videos]
base_url = "https://ai-gateway.vercel.sh/v4/ai"

[cost.video.output]
unit = "second"
price = 0.13

[[cost.video.output.overrides]]
when = { resolution = { equals = "768p" } }
price = 0.08
