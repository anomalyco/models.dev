# Modalities: generic image kept, Callstack publishes no image format list for Apex
# Mid-conversation (@ai-sdk/gateway, live 2026-10-19, default route): a mid-conversation system message stays in place (cache prefix kept). Per-turn effort and tool changes exist only for Anthropic models on this API.
schema = 2
name = "Apex"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"
open_weights = false
release_date = "2026-10-08"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "medium", "xhigh"] }
system_updates = true
effort_updates = false
cache = { supported = true, implicit = true, explicit = false }

[limit]
context = 262_144
output = 131_072

[cost.text.input]
price = 0.5
cache = { read = 0.2 }

[cost.text.output]
price = 3
