# Mid-conversation (@ai-sdk/gateway): per-turn effort and tool changes exist only for Anthropic models on this API. system_updates left unset: live cache results on the default route were inconclusive.
schema = 2
name = "Mercury Coder Small Beta"
description = "Coding model for repository understanding, refactors, and agentic engineering tasks"
family = "mercury"
open_weights = false
release_date = "2025-02-26"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = false }
temperature = true
effort_updates = false

[limit]
context = 32_000
output = 16_384

[cost.text.input]
price = 0.25

[cost.text.output]
price = 1
