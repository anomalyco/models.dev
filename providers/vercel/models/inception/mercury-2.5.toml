# Effort: reasoning.effort = none|low|medium|high
# Native levels: https://docs.inceptionlabs.ai/capabilities/instant
# Mid-conversation (@ai-sdk/gateway, live 2026-10-23): a mid-conversation system message stays in place and is followed (cached with it vs control: mercury-2.5 10321/10257 vs 10370/10231, mercury-3 7058/6968 vs 6913/7011, mercury-2 7477 vs 6; French 2 of 2 each). No per-turn effort or tool-change mechanism reaches this model on this API.
# Per API: system_updates on [api.chat-completions] (@ai-sdk/gateway) only, where it was tested. /v1/responses and /v1/messages are untested for this model or move the message (live 2026-10-23: /v1/responses lost the cache after a mid-conversation system message on Grok 4.3, GLM 5.1 and DeepSeek V4 Pro).
schema = 2
base_model = "inception/mercury-2.5"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[api.chat-completions]
capabilities = { system_updates = true }

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 0.04
cache = { read = 0.004 }

[cost.text.output]
price = 0.15
