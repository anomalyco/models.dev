# Modalities: StepFun vision formats JPG/JPEG, PNG, static GIF, WebP, https://platform.stepfun.ai/docs/en/guides/developer/image-chat
# Mid-conversation (@ai-sdk/gateway, live 2026-10-23): a mid-conversation system message stays in place and is followed (7040/7040 cached vs control 7040/7040, French 2 of 2). No per-turn effort or tool-change mechanism reaches this model on this API.
# Per API: system_updates on [api.chat-completions] (@ai-sdk/gateway) only, where it was tested. /v1/responses and /v1/messages are untested for this model or move the message (live 2026-10-23: /v1/responses lost the cache after a mid-conversation system message on Grok 4.3, GLM 5.1 and DeepSeek V4 Pro).
schema = 2
base_model = "stepfun/step-3.7-flash"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
cache = { implicit = true }

[api.chat-completions]
capabilities = { system_updates = true }

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 0.2
cache = { read = 0.04 }

[cost.text.output]
price = 1.15
