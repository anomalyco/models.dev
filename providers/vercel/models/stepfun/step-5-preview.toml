# Modalities: StepFun vision formats JPG/JPEG, PNG, static GIF, WebP, https://platform.stepfun.ai/docs/en/guides/developer/image-chat
# Mid-conversation (@ai-sdk/gateway, live 2026-10-19, default route): a mid-conversation system message is hoisted (the next request misses the cache). Per-turn effort and tool changes exist only for Anthropic models on this API.
schema = 2
base_model = "stepfun/step-5-preview"
base_model_omit = ["limit.input"]
description = "StepFun flash model for efficient multimodal reasoning, coding, and tool use"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
system_updates = false
effort_updates = false

[limit]
context = 1_048_576
output = 1_048_576

[cost.text.input]
price = 1
cache = { read = 0.1 }

[cost.text.output]
price = 2.7
