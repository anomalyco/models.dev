schema = 2
base_model = "openai/gpt-5.1-codex"
name = "GPT-5.1-Codex"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
temperature = true

[cost.text.input]
price = 1.25
cache = { read = 0.13 }

[cost.text.output]
price = 10
