# Mid-conversation (@ai-sdk/gateway, live 2026-10-19): system/developer messages stay in place (cache prefix kept). The AI SDK's reasoningEffortUpdate is GPT-6 and later only, and a top-level effort change misses the cache, so effort_updates stays false.
# Tool changes (@ai-sdk/gateway, live 2026-10-23): providerOptions.openai.additionalTools on a tool result reaches OpenAI as a Responses additional_tools item, the model sees the tool and the cached prefix is kept, so additional_tools adds tools (https://ai-sdk.dev/providers/ai-sdk-providers/openai). The azure and bedrock routes drop it; the default route is openai.
# Per API: /v1/messages has no tool-add item. system_updates stays top level: a mid-conversation developer/system message stays in place on all three APIs (gpt-5.4-mini cache read 8832 with and without it on /v1/responses and /v1/messages, live 2026-10-23).
# tools.freeform on [api.chat-completions] and [api.responses]: /v1/chat/completions and /v1/responses accepted text, lark and regex custom tools and enforced the grammars (regex ZZ[0-9]{3} and the equivalent lark grammar both returned ZZ plus three digits, live 2026-10-28 on this model). /v1/messages has no custom tools.
# tools.updates is left out: on GPT-5.5 and earlier, calls to tools added through additional_tools come back namespaced and replaying them without the namespace fails ("Missing namespace for function_call", live 2026-11-16), so callers fold tool changes into the top-level tools list.
schema = 2
base_model = "openai/gpt-5.4"
name = "GPT 5.4"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true
system_updates = true
cache = { implicit = true }
service_tier = ["flex", "priority"]

[api.chat-completions]
capabilities = { tools = { freeform = ["text", "lark", "regex"] } }

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }
capabilities = { tools = { freeform = ["text", "lark", "regex"] } }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 2.5
cache = { read = 0.25 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 5
cache = { read = 0.5 }

[cost.text.output]
price = 15

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 22.5

[cost.web_search]
price = 10

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = { text = 2 }

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = { text = { input = { price = 0.5, cache = { read = 0.52 } }, output = { price = 0.5 } } }
