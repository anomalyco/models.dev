# Modalities: OpenAI image inputs PNG, JPEG, WEBP, non-animated GIF, https://platform.openai.com/docs/guides/images-vision
# Mid-conversation (@ai-sdk/gateway, live 2026-10-19): system/developer messages stay in place (cache prefix kept). The gateway's AI SDK request has no OpenAI configuration_update or additional_tools, so effort and tool changes are false.
schema = 2
name = "GPT 5.1 Thinking"
description = "Image model for prompt-driven generation, editing, and visual design workflows"
family = "gpt"
open_weights = false
knowledge = "2024-10"
release_date = "2025-11-12"
last_updated = "2025-08-07"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh"] }
temperature = true
system_updates = true
effort_updates = false

[limit]
context = 400_000
input = 272_000
output = 128_000

[cost.text.input]
price = 1.25
cache = { read = 0.125 }

[cost.text.output]
price = 10
