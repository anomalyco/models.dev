# Synced from https://ai-gateway.vercel.sh/v1/models (type image)
# https://vercel.com/docs/ai-gateway/modalities/image-generation
schema = 2
base_model = "openai/gpt-image-1.5"
name = "GPT Image 1.5"

[modalities]
input = ["text"]
output = ["image/png", "image/jpeg", "image/webp"]

[capabilities]
cache = { implicit = true }

[api.images]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/protocols/openai-images" }

[cost.text.input]
price = 5
cache = { read = 1.25 }

[cost.text.output]
price = 32

[cost.image.output]
price = 32
