schema = 2
base_model = "openai/gpt-6.1-terra"
description = "GPT model for general reasoning, writing, coding, and tool-assisted tasks"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
cache = { implicit = true, explicit = true }

[api.chat-completions]

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 1
cache = { read = 0.05, write = 1.25 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_001 } }
price = 2
cache = { read = 0.1, write = 2.5 }

[cost.text.output]
price = 5

[[cost.text.output.overrides]]
when = { context = { gt = 272_001 } }
price = 7.5
