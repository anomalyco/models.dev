# Synced from https://ai-gateway.vercel.sh/v1/models (type realtime)
# https://vercel.com/docs/ai-gateway/modalities/realtime
schema = 2
base_model = "openai/gpt-realtime-2"
name = "gpt-realtime-2"

[modalities]
input = ["text", "audio/pcm", "audio/pcmu", "audio/pcma"]
output = ["text", "audio/pcm", "audio/pcmu", "audio/pcma"]

[capabilities]
reasoning = { supported = false }
temperature = true
cache = { implicit = true }

[api.realtime]
base_url = "https://ai-gateway.vercel.sh/v4/ai"
sdk = { opencodeai = "none" }

[cost.text.input]
price = 4
cache = { read = 0.4 }

[cost.text.output]
price = 24

[cost.audio.input]
price = 32

[cost.audio.output]
price = 64
