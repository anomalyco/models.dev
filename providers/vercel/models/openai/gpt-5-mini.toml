# Web search: $10 per 1,000 web_search tool calls (all models): https://developers.openai.com/api/docs/pricing#built-in-tools
# Token-only multipliers (object factor, so cost.web_search is unscaled): Fast mode (https://developers.openai.com/api/docs/guides/priority-processing); Flex (https://developers.openai.com/api/docs/guides/flex-processing).
schema = 2
base_model = "openai/gpt-5-mini"

[capabilities]
tools = { supported = true, updates = true }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true
system_updates = true
effort_updates = false
store = true
cache = { implicit = { min_tokens = 1_024 } }
prompt_cache_key = true
service_tier = ["flex", "priority"]

[cost.text.input]
price = 0.25
cache = { read = 0.025 }

[cost.text.output]
price = 2

[cost.web_search]
price = 10

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = { text = 1.8 }

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = { text = 0.5 }

[experimental.modes.fast]
service_tier = "priority"
body = { service_tier = "priority" }

[experimental.modes.flex]
body = { service_tier = "flex" }
