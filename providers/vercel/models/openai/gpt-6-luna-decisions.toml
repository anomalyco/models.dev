# Modalities: Vercel's Decisions docs say images work with openai/gpt-6-luna-decisions (https://vercel.com/docs/ai-gateway/sdks-and-apis/openai-decisions#input),
#   though the catalog has no vision tag. Formats are OpenAI's image inputs; Decisions takes no files (https://developers.openai.com/api/docs/guides/decisions).
schema = 2
type = "decision"
name = "GPT-6 Luna Decisions"
description = "GPT-6 Luna Decisions evaluates classification and scoring questions against shared text and image input using OpenAI's Decisions API. It supports predicate, choice, and score questions with probabilities and confidence values."
family = "gpt"
open_weights = false
release_date = "2026-10-06"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
cache = { implicit = true }

[limit]
context = 1_050_000
input = 1_050_000
output = 0

[api.decisions]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/decisions" }

[cost.text.input]
price = 0.1
cache = { read = 0.01, write = 0.125 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_001 } }
price = 0.2
cache = { read = 0.02, write = 0.25 }

[cost.text.output]
price = 0

[[cost.text.output.overrides]]
when = { context = { gt = 272_001 } }
price = 0
