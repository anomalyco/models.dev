schema = 2
base_model = "openai/gpt-5.6-sol"
name = "GPT 5.6 Sol"
description = "GPT model for general reasoning, writing, coding, and tool-assisted tasks"

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
temperature = true

[cost.text.input]
price = 4
cache = { read = 0.4, write = 5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 8
cache = { read = 0.8, write = 10 }

[cost.text.output]
price = 20

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 30
