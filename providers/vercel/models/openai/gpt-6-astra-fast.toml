# Pricing: https://ai-gateway.vercel.sh/v1/models (2026-09-04), upper band starts at 272,001 prompt tokens
base_model = "openai/gpt-6-astra-fast"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "xhigh", "max"]

[cost]
input = 20
output = 100
cache_read = 2
cache_write = 25

[[cost.tiers]]
tier = { type = "context", size = 272_001 }
input = 40
output = 150
cache_read = 4
cache_write = 25
