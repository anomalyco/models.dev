schema = 2
base_model = "openai/o4-mini"
name = "o4-mini (Fast)"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
