# Image input: POST https://ai-gateway.vercel.sh/v1/images/edits uses the input image (verified live 2026-10-28)
# Modalities: GPT Image output_format png | jpeg | webp, https://platform.openai.com/docs/guides/image-generation
schema = 2
base_model = "openai/gpt-image-1-mini"
name = "GPT Image 1 Mini"

[capabilities]
cache = { implicit = true }

[api.images]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/images" }

[cost.text.input]
price = 2
cache = { read = 0.2 }

[cost.text.output]
price = 8

[cost.image.output]
price = 8
