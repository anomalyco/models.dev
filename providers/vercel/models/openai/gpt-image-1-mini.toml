# Modalities: GPT Image output_format png | jpeg | webp, https://platform.openai.com/docs/guides/image-generation
schema = 2
base_model = "openai/gpt-image-1-mini"
name = "GPT Image 1 Mini"

[modalities]
input = ["text"]
output = ["image/png", "image/jpeg", "image/webp"]

[api.images]
base_url = "https://ai-gateway.vercel.sh/v4/ai"
sdk = { opencodeai = "none" }

[cost.text.input]
price = 2
cache = { read = 0.2 }

[cost.text.output]
price = 8

[cost.image.output]
price = 8
