# Mid-conversation (@ai-sdk/gateway, live 2026-10-19): system/developer messages stay in place (cache prefix kept). The gateway's AI SDK request has no OpenAI configuration_update or additional_tools, so effort and tool changes are false.
schema = 2
base_model = "openai/gpt-5.1-codex-max"
name = "GPT 5.1 Codex Max"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
temperature = true
system_updates = true
effort_updates = false

[cost.text.input]
price = 1.25
cache = { read = 0.125 }

[cost.text.output]
price = 10
