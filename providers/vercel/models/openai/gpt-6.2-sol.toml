# Mid-conversation, tool and cache flags backfilled 2026-11-18 from gpt-6.1-sol.toml on this host (same API layout; the sync doesn't carry them).
schema = 2
base_model = "openai/gpt-6.2-sol"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
cache = { implicit = true, explicit = true }
structured_output = true
system_updates = true
service_tier = ["priority", "ultrafast"]

[api.chat-completions]
capabilities = { effort_updates = true, tools = { freeform = ["text", "lark", "regex"], updates = ["add"] } }

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }
capabilities = { tools = { freeform = ["text", "lark", "regex"], updates = ["add", "remove"] } }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 2
cache = { read = 0.1, write = 2.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_001 } }
price = 4
cache = { read = 0.2, write = 5 }

[cost.text.output]
price = 10

[[cost.text.output.overrides]]
when = { context = { gt = 272_001 } }
price = 15

[cost.web_search]
price = 10

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = { text = { input = { price = 2, cache = { read = 2 } }, output = { price = 2 } } }

[[cost.multipliers]]
when = { service_tier = { equals = "ultrafast" } }
factor = { text = { input = { price = 3, cache = { read = 3 } }, output = { price = 3 } } }
