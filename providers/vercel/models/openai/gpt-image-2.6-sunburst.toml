# Synced from https://ai-gateway.vercel.sh/v1/models (type image)
# https://vercel.com/docs/ai-gateway/modalities/image-generation
schema = 2
v2_only = true
type = "image"
name = "GPT Image 2.6 Sunburst"
description = "Image model for prompt-driven generation, editing, and visual design workflows"
family = "gpt-image"
open_weights = false
release_date = "2026-11-04"

[modalities]
input = ["text"]
output = ["image"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false
cache = { implicit = true }

[limit]
context = 0
output = 0

[api.images]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/images" }

[cost.text.input]
price = 5
cache = { read = 1.25 }

[cost.text.output]
price = 30

[cost.image.output]
price = 30
