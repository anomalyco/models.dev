# Mid-conversation (@ai-sdk/gateway, live 2026-10-19): system/developer messages stay in place (cache prefix kept). The AI SDK's reasoningEffortUpdate is GPT-6 and later only, and a top-level effort change misses the cache, so effort_updates stays false.
# Tool changes (@ai-sdk/gateway, live 2026-10-23): providerOptions.openai.additionalTools on a tool result reaches OpenAI as a Responses additional_tools item, the model sees the tool and the cached prefix is kept, so tools.updates = true (add only; https://ai-sdk.dev/providers/ai-sdk-providers/openai). The azure and bedrock routes drop it; the default route is openai.
# Per API: tools.updates on [api.chat-completions] (@ai-sdk/gateway additionalTools) and [api.responses] (/v1/responses passes an additional_tools item through and the model calls the added tool, live 2026-10-23); /v1/messages has no tool-add item. system_updates stays top level: a mid-conversation developer/system message stays in place on all three APIs (gpt-5.4-mini cache read 8832 with and without it on /v1/responses and /v1/messages, live 2026-10-23).
schema = 2
base_model = "openai/gpt-5.4-mini"
name = "GPT 5.4 Mini (Fast)"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh"] }
structured_output = true
system_updates = true
cache = { implicit = true }

[api.chat-completions]
capabilities = { tools = { updates = true } }

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }
capabilities = { tools = { updates = true } }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 1.5
cache = { read = 0.15 }

[cost.text.output]
price = 9
