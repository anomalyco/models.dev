# tools.freeform on [api.chat-completions] and [api.responses]: /v1/chat/completions and /v1/responses accepted text, lark and regex custom tools and enforced the grammars (regex ZZ[0-9]{3} and the equivalent lark grammar both returned ZZ plus three digits, live 2026-10-28 on this model). /v1/messages has no custom tools.
schema = 2
base_model = "openai/gpt-6.1-terra"
name = "GPT-6.1 Terra (Fast)"
description = "Compact GPT model for low-latency assistance and high-volume workloads"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
cache = { implicit = true, explicit = true }

[api.chat-completions]
capabilities = { tools = { freeform = ["text", "lark", "regex"] } }

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }
capabilities = { tools = { freeform = ["text", "lark", "regex"] } }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 2
cache = { read = 0.1, write = 2.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_001 } }
price = 4
cache = { read = 0.2, write = 5 }

[cost.text.output]
price = 10

[[cost.text.output.overrides]]
when = { context = { gt = 272_001 } }
price = 15
