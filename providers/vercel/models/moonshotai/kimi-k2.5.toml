schema = 2
base_model = "moonshotai/kimi-k2.5"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
temperature = true

[limit]
context = 256_000
output = 256_000

[api.chat-completions]
compatibility = { replay_reasoning = true }

[cost.text.input]
price = 0.6

[cost.text.output]
price = 3
