# Vercel AI Gateway chat (POST https://ai-gateway.vercel.sh/v1/chat/completions)
# model = "moonshotai/kimi-k3-fast" (Fireworks-backed fast tier of Kimi K3).
# Always-on reasoning; effort via reasoning.effort / reasoning_effort = "low"|"high"|"max".
# No thinking toggle — K3 always returns reasoning content.
# https://vercel.com/ai-gateway/models/kimi-k3-fast
# https://platform.kimi.ai/docs/guide/use-reasoning-effort
# Mid-conversation (@ai-sdk/gateway, live 2026-10-19, default route): a mid-conversation system message stays in place (cache prefix kept). Per-turn effort and tool changes exist only for Anthropic models on this API.
schema = 2
base_model = "moonshotai/kimi-k3"
name = "Kimi K3 Fast"
description = "Kimi multimodal agent model for visual understanding, coding, and planning"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"] }
structured_output = true
system_updates = true
effort_updates = false

[limit]
context = 1_000_000

[cost.text.input]
price = 4.5
cache = { read = 0.45 }

[cost.text.output]
price = 22.5
