# Vercel AI Gateway chat (POST https://ai-gateway.vercel.sh/v1/chat/completions)
# model = "moonshotai/kimi-k3-fast" (Fireworks-backed fast tier of Kimi K3).
# Always-on reasoning; effort via reasoning.effort / reasoning_effort = "low"|"high"|"max".
# No thinking toggle — K3 always returns reasoning content.
# https://vercel.com/ai-gateway/models/kimi-k3-fast
# https://platform.kimi.ai/docs/guide/use-reasoning-effort
# Mid-conversation (@ai-sdk/gateway, live 2026-10-19, default route): a mid-conversation system message stays in place (cache prefix kept). No per-turn effort or tool-change mechanism reaches this model on this API.
# Per API: system_updates on [api.chat-completions] (@ai-sdk/gateway) only, where it was tested. /v1/responses and /v1/messages are untested for this model or move the message (live 2026-10-23: /v1/responses lost the cache after a mid-conversation system message on Grok 4.3, GLM 5.1 and DeepSeek V4 Pro).
schema = 2
base_model = "moonshotai/kimi-k3"
name = "Kimi K3 Fast"
description = "Kimi multimodal agent model for visual understanding, coding, and planning"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 1_000_000

[api.chat-completions]
capabilities = { system_updates = true }

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 4.5
cache = { read = 0.45 }

[cost.text.output]
price = 22.5
