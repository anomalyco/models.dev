# Toggle: reasoning.enabled = true|false
# https://vercel.com/docs/ai-gateway/sdks-and-apis/openai-chat-completions/reasoning
schema = 2
base_model = "moonshotai/kimi-k2.7-code"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
temperature = true

[limit]
context = 256_000
output = 32_768

[cost.text.input]
price = 0.95
cache = { read = 0.19 }

[cost.text.output]
price = 4
