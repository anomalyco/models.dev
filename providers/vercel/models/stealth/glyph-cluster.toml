# Mid-conversation (@ai-sdk/gateway): per-turn effort and tool changes exist only for Anthropic models on this API. system_updates left unset: live cache results on the default route were inconclusive.
schema = 2
name = "Glyph Cluster"
description = "Reasoning model for deliberate analysis, multi-step problem solving, and tool use"
open_weights = false
release_date = "2026-10-07"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
effort_updates = false

[limit]
context = 256_000
output = 256_000

[cost.text.input]
price = 0

[cost.text.output]
price = 0
