name = "Gemini 3 Flash (Batch)"
description = "Fast Gemini model balancing multimodal reasoning, tool use, and cost"
family = "gemini"
release_date = "2025-12-17"
last_updated = "2025-12-17"
attachment = true
reasoning = true
tool_call = true
open_weights = false

[[reasoning_options]]
type = "effort"
values = ["low", "high"]

[cost]
input = 0.25
output = 1.5
cache_read = 0.05

[limit]
context = 1_000_000
output = 64_000

[modalities]
input = ["text", "image", "pdf"]
output = ["text"]
