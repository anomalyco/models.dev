schema = 2
base_model = "google/gemini-omni-1.2-flash"
description = "Omni-modal model for text, vision, audio, and multimodal agent tasks"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["video"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }

[limit]
output = 260_640

[api.chat-completions]

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 1.5

[cost.text.output]
price = 9
