# Modalities: Gemini image formats PNG, JPEG, WEBP, HEIC, HEIF, https://ai.google.dev/gemini-api/docs/image-understanding
# Mid-conversation (@ai-sdk/gateway, live 2026-10-19): Gemini takes system text only as systemInstruction, and a mid-conversation system message is hoisted there (cache miss). No per-turn effort or tool-change mechanism is forwarded.
schema = 2
name = "Gemini 3 Flash"
description = "Fast Gemini model balancing multimodal reasoning, tool use, and cost"
family = "gemini-flash"
open_weights = false
knowledge = "2025-03"
release_date = "2025-12-17"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "high"] }
temperature = true
system_updates = false
effort_updates = false
cache = { supported = true, implicit = true, explicit = false }

[limit]
context = 1_000_000
output = 65_000

[cost.text.input]
price = 0.5
cache = { read = 0.05 }

[cost.text.output]
price = 3
