schema = 2
name = "Gemini 3 Flash"
description = "Fast Gemini model balancing multimodal reasoning, tool use, and cost"
family = "gemini-flash"
open_weights = false
knowledge = "2025-03"
release_date = "2025-12-17"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "high"] }
temperature = true

[limit]
context = 1_000_000
output = 65_000

[cost.text.input]
price = 0.5
cache = { read = 0.05 }

[cost.text.output]
price = 3
