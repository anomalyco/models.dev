name = "Gemini 2.5 Flash (Batch)"
description = "Fast Gemini model balancing multimodal reasoning, tool use, and cost"
family = "gemini"
release_date = "2025-03-20"
last_updated = "2025-03-20"
attachment = true
reasoning = true
tool_call = true
open_weights = false

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high"]

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 0.15
output = 1.25
cache_read = 0.03

[limit]
context = 1_000_000
output = 64_000

[modalities]
input = ["text", "image", "pdf"]
output = ["text"]
