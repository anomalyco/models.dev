schema = 2
base_model = "google/gemini-3.6-flash"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high"] }
structured_output = true

[limit]
context = 1_000_000
output = 64_000

[cost.text.input]
price = 0.75
cache = { read = 0.075 }

[cost.text.output]
price = 3.75
