# Synced from https://ai-gateway.vercel.sh/v1/models (type speech)
# https://vercel.com/docs/ai-gateway/modalities/text-to-speech
schema = 2
base_model = "google/gemini-3.8-flash-tts"

[capabilities]
temperature = false
top_p = false
top_k = false

[api.speech]
base_url = "https://ai-gateway.vercel.sh/v4/ai"
sdk = { opencodeai = "none" }

[cost.text.input]
price = 0.5

[cost.text.output]
price = 9

[cost.audio.output]
price = 9
