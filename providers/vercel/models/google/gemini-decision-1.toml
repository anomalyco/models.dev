schema = 2
type = "decision"
name = "Gemini Decision 1"
description = "Gemini Decisions is Google's evaluation model for classification, routing, and scoring. It answers structured questions with Boolean probabilities, choices, and scores, returning confidence values and probability distributions to help applications interpret the results. Developers can use it to triage support requests, categorize content, and evaluate inputs against defined criteria."
family = "gemini"
open_weights = false
release_date = "2026-11-11"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }

[limit]
context = 262_144
output = 0

[api.decisions]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/decisions" }

[cost.text.input]
price = 0.1

[cost.text.output]
price = 0
