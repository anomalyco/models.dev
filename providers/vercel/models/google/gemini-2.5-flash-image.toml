schema = 2
base_model = "google/gemini-2.5-flash-image"
name = "Nano Banana (Gemini 2.5 Flash Image)"

[capabilities]
cache = { implicit = true }
service_tier = ["flex"]

[limit]
context = 32_768

[cost.text.input]
price = 0.3
cache = { read = 0.03 }

[cost.text.output]
price = 2.5

[cost.image.output]
unit = "image"
price = 0.039

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = { text = { input = { price = 0.5 }, output = { price = 0.5 } } }
