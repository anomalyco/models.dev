# Mid-conversation: system_updates unset. Vercel and the novita route don't document mid-conversation system messages for this model, and Google's own API moves them to the top. The earlier true came from a live run only (@ai-sdk/gateway, 2026-10-23: the message was rendered and followed, with no cache to check where it landed). No per-turn effort or tool-change mechanism reaches this model on this API.
schema = 2
base_model = "google/gemma-4-31b-it"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = false }
structured_output = true

[limit]
output = 131_072

[api.chat-completions]

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 0.14

[cost.text.output]
price = 0.4
