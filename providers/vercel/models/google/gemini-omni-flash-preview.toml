# Output: video only. https://ai-gateway.vercel.sh/v1/models tags it "video-generation" (type "language"),
# and the lab returns video/mp4 (https://ai.google.dev/gemini-api/docs/omni).
schema = 2
base_model = "google/gemini-omni-flash-preview"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "application/pdf"]
output = ["video/mp4"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
temperature = true

[limit]
context = 1_000_000

[cost.text.input]
price = 1.5

[cost.text.output]
price = 9
