schema = 2
base_model = "google/gemini-omni-flash-preview"
description = "Omni-modal model for text, vision, audio, and multimodal agent tasks"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
temperature = true

[limit]
context = 1_000_000

[cost.text.input]
price = 1.5

[cost.text.output]
price = 9
