# Capabilities the catalog doesn't state (capabilities.structured_output) come from google/gemini-4-hydrogen, this host's previous model in the family.
schema = 2
base_model = "google/gemini-4-neon"
name = "Gemini 4 Neon (Fast)"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
cache = { implicit = true }
structured_output = true

[limit]
context = 1_000_000
output = 1_000_000

[api.chat-completions]

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 5.4
cache = { read = 0.27 }

[cost.text.output]
price = 27

[cost.web_search]
price = 14
