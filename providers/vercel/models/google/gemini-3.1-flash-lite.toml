schema = 2
base_model = "google/gemini-3.1-flash-lite"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high"] }
structured_output = true

[limit]
context = 1_000_000
output = 65_000

[cost.text.input]
price = 0.25
cache = { read = 0.03 }

[cost.text.output]
price = 1.5
