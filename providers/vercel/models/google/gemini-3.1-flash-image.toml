schema = 2
base_model = "google/gemini-3.1-flash-image"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif"]
output = ["text", "image/png", "image/jpeg"]

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["minimal", "high"] }
cache = { implicit = true }

[cost.text.input]
price = 0.5
cache = { read = 0.05 }

[cost.text.output]
price = 3

[cost.image.output]
unit = "image"
price = 0.067

[[cost.image.output.overrides]]
when = { resolution = { equals = "512" } }
price = 0.045

[[cost.image.output.overrides]]
when = { resolution = { equals = "2K" } }
price = 0.101

[[cost.image.output.overrides]]
when = { resolution = { equals = "4K" } }
price = 0.151
