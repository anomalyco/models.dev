schema = 2
base_model = "google/gemini-3.5-flash-lite"
description = "Low-latency Gemini model for high-volume multimodal and agent workloads"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high"] }
structured_output = true

[limit]
context = 1_000_000
output = 65_000

[cost.text.input]
price = 0.3
cache = { read = 0.03 }

[cost.text.output]
price = 2.5
