base_model = "google/gemini-3.7-flash"
description = "Fast Gemini model balancing multimodal reasoning, tool use, and cost"
family = "gemini"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high"] }]

[cost]
input = 0.75
output = 3.75
cache_read = 0.075

[limit]
context = 1_000_000

[modalities]
input = ["text", "image", "pdf"]
