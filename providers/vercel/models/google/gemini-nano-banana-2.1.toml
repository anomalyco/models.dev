# Toggle: reasoning.enabled = true|false
# https://vercel.com/docs/ai-gateway/sdks-and-apis/openai-chat-completions/reasoning
schema = 2
base_model = "google/gemini-nano-banana-2.1"
name = "Gemini Nano Banana 2.1"
description = "Image model for prompt-driven generation, editing, and visual design workflows"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif"]
output = ["text", "image/png", "image/jpeg"]

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["minimal", "medium", "high"] }
structured_output = false
cache = { implicit = true }

[cost.text.input]
price = 1.5
cache = { read = 0.15 }

[cost.text.output]
price = 7.5
