base_model = "google/gemini-4-argon"
description = "Gemini multimodal model for text, image, audio, video, and document tasks"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
input = 2
output = 10
cache_read = 0.1

[limit]
context = 1_000_000
output = 1_000_000

[modalities]
input = ["text", "image", "pdf"]
