# Sources (accessed 2026-07-22):
# - https://ai-gateway.vercel.sh/v1/models (tencent/hy3) — tags reasoning; supported_parameters include reasoning
# - https://ai-gateway.vercel.sh/v1/models/tencent/hy3/endpoints — routes to novita/deepinfra
# - https://huggingface.co/tencent/Hy3 — reasoning_effort no_think|low|high
# - openrouter tencent/hy3 effort none|low|high
# API: {"chat_template_kwargs": {"reasoning_effort": "no_think"|"low"|"high"}}
# mapped: no_think → none
# Mid-conversation (@ai-sdk/gateway): per-turn effort and tool changes exist only for Anthropic models on this API. system_updates left unset: live cache results on the default route were inconclusive.
schema = 2
base_model = "tencent/hy3"
base_model_omit = ["limit.input"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "high"] }
effort_updates = false
cache = { implicit = true }

[limit]
context = 262_144
output = 262_144

[api.chat-completions]

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 0.14
cache = { read = 0.035 }

[cost.text.output]
price = 0.58
