schema = 2
name = "Tencent Hy4"
description = "Tencent Hy reasoning model for coding, instruction following, and agent tasks"
open_weights = false
release_date = "2026-11-03"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
cache = { implicit = true }

[limit]
context = 1_024_000
output = 64_000

[api.chat-completions]

[api.responses]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/open-responses", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/responses" }

[api.messages]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/messages" }

[cost.text.input]
price = 0.417
cache = { read = 0.021 }

[cost.text.output]
price = 1.2505
