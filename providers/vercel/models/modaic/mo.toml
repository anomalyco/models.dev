schema = 2
type = "decision"
name = "Mo"
description = "Mo is Modaic's System One decision model for zero-shot judgments over text, JSON, and images. It answers boolean, choice, and score questions with typed answers, per-option probabilities, and calibrated confidence, supporting classification, routing, rubric scoring, and review workflows. It reads a 262,144-token context and up to four images per request."
open_weights = false
release_date = "2026-11-19"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }

[limit]
context = 262_144
output = 0

[api.decisions]
base_url = "https://ai-gateway.vercel.sh/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/vercel-ai-gateway/decisions" }

[cost.text.input]
price = 0.04

[cost.text.output]
price = 0
