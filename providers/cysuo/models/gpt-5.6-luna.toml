# Price: USD per 1M tokens, https://cysuo.ai/model-market/gpt-5.6-luna?region=singapore (accessed 2026-11-23).
# Reasoning: reasoning_effort, the host's documented levels (low|medium|high) that the lab's own API also takes; see provider.toml.
# Structured output: the model page's structured-output capability tag, and response_format in https://cysuo.ai/en/docs/api-reference/chat/openai/chatcompletions
schema = 2
base_model = "openai/gpt-5.6-luna"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.2

[cost.text.output]
price = 1.2
