# Source: https://www.tokener.ca/models/ornith-1.5-35b (verified 2026-10-11)
# Price list: https://www.tokener.ca/pricing (USD per 1M tokens, regular price)
# The model page states: context 262,144; max output 262,144; input text and image;
# output text; reasoning Off, On (default Off); tool calling; FP8 weights.
# Toggle: chat_template_kwargs.enable_thinking = true|false (reasoning_effort "none" also
# turns it off). Reasoning streams on the "reasoning_content" delta field.
# https://www.tokener.ca/docs#reasoning-controls
base_model = "deepreinforce/ornith-1.5-35b-a3b"
reasoning_options = [{ type = "toggle" }]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.14
output = 0.65
cache_read = 0.025

[limit]
output = 262_144
