# Toggle: chat_template_kwargs.thinking = true|false (default off)
# reasoning_effort is accepted here but not honored: low/high/max and an
# invalid value all produce the same reasoning-token distribution, so this
# host is toggle-only despite the lab exposing effort high|max.
base_model = "deepseek/deepseek-v4-flash-0731"

[[reasoning_options]]
type = "toggle"

[interleaved]
field = "reasoning_content"

[cost]
input = 0.25
output = 0.3
cache_read = 0.0625

[limit]
context = 1_048_576
output = 64_000
