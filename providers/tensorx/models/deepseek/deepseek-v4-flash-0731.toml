# DeepSeek V4 reasons off by default. Effort: reasoning_effort = none|high|max (none disables);
# "low"/"medium" map to "high". Also: chat_template_kwargs.thinking = true|false (off default).
# https://docs.tensorx.ai/api-reference/reasoning (accessed 2026-11-04), DeepSeek V4 section.
schema = 2
base_model = "deepseek/deepseek-v4-flash-0731"

[capabilities]
reasoning = { supported = true, effort = ["none", "high", "max"] }
structured_output = true

[limit]
context = 1_048_576
output = 64_000

[cost.text.input]
price = 0.25
cache = { read = 0.0625 }

[cost.text.output]
price = 0.3
