# Toggle: chat_template_kwargs.thinking = true|false (default off). Effort: reasoning_effort = low|high|max (minimal maps to low, medium/xhigh map to high). Both IDs are served by the 1017 checkpoint.
# https://docs.tensorx.ai/api-reference/reasoning (accessed 2026-11-04), DeepSeek V4.1 Flash section.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
context = 1_048_576
output = 64_000

[cost.text.input]
price = 0.5
cache = { read = 0.125 }

[cost.text.output]
price = 1.5
