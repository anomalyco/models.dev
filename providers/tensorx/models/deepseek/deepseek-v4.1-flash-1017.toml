# Effort: reasoning_effort = none|low|high|max (none disables; off by default).
# Also: chat_template_kwargs.thinking = true|false (default off).
# Both IDs are served by the 1017 checkpoint.
# https://docs.tensorx.ai/api-reference/reasoning (accessed 2026-11-04)
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true

[limit]
context = 1_048_576
output = 64_000

[cost.text.input]
price = 0.5
cache = { read = 0.125 }

[cost.text.output]
price = 1.5
