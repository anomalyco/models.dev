# Retired 2026-10-04 (rerouted to its replacement): https://docs.tensorx.ai/api-reference/model-deprecation (accessed 2026-10-21).
# knowledge: TensorX's value, unsourced and different from the lab's. Kept so v1 doesn't change.
# Effort: reasoning_effort = <value>; "none" disables reasoning (from the v1 file's inline comment; the model is retired, so the current docs no longer cover it).
schema = 2
base_model = "deepseek/deepseek-v3.2"
description = "DeepSeek chat model for instruction following, coding, and analysis"
knowledge = "2025-05"
status = "deprecated"

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }

[limit]
context = 163_840
output = 163_840

[cost.text.input]
price = 0.3
cache = { read = 0.075, write = 0.375 }

[cost.text.output]
price = 0.5
