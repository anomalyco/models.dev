# DeepSeek V4 reasons off by default; toggle chat_template_kwargs.thinking, effort high|max when on.
# https://docs.tensorx.ai/api-reference/reasoning
schema = 2
base_model = "deepseek/deepseek-v4-pro-0813"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["high", "max"] }
structured_output = true

[limit]
context = 1_048_576
output = 64_000

[cost.text.input]
price = 2
cache = { read = 0.5 }

[cost.text.output]
price = 4
