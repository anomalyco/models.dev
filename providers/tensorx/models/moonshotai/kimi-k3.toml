# AI SDK auto-discovers native IDs via /v1/models — field values map those IDs
# Effort: reasoning_effort = none|low|high|max, measured by reasoning_content
# length. none empties it in 9/9 runs and depth grows low < high < max;
# invalid values return 400. chat_template_kwargs.thinking = false is
# unreliable here (reasoning still streamed in 3/9 runs), so none is the
# published off switch and no toggle is declared.
base_model = "moonshotai/kimi-k3"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "high", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 3
output = 15
cache_read = 0.75

[limit]
output = 64_000
