# AI SDK auto-discovers native IDs via /v1/models — field values map those IDs
# Toggle: chat_template_kwargs.thinking = true|false (default on)
# Effort: reasoning_effort = low|high|max; invalid values return 400 and low
# measurably lowers the reasoning-token count. Matches first-party Moonshot.
base_model = "moonshotai/kimi-k3"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 3
output = 15
cache_read = 0.75

[limit]
output = 64_000
