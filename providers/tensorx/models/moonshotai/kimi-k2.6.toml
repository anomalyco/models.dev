# Toggle: chat_template_kwargs.thinking = true|false (default on)
# reasoning_effort is accepted but not honored here — an invalid value and
# none both leave the reasoning-token count unchanged — so this is toggle-only.
base_model = "moonshotai/kimi-k2.6"

[[reasoning_options]]
type = "toggle"

[interleaved]
field = "reasoning_content"

[cost]
input = 1
output = 4
cache_read = 0.25
cache_write = 1.25

[limit]
output = 64_000
