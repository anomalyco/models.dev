# Reasoning is always on: Kimi models cannot be toggled off on TensorX and take no reasoning_effort.
# Probed live 2026-11-04: a request with chat_template_kwargs.enable_thinking=false and one with
# reasoning_effort=low both still return reasoning_content.
# https://docs.tensorx.ai/api-reference/reasoning (accessed 2026-11-04)
schema = 2
base_model = "moonshotai/kimi-k3.1-pro"

[capabilities]
reasoning = { supported = true }
structured_output = true

[limit]
output = 64_000

[cost.text.input]
price = 3
cache = { read = 0.75 }

[cost.text.output]
price = 15
