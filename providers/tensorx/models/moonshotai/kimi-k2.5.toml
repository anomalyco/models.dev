# No caller control. Measured by reasoning_content length over 6 runs each,
# chat_template_kwargs.thinking = false and reasoning_effort = none both leave
# reasoning_content filled (0/6 empty). usage.reasoning_tokens is not the
# signal here because this host under-reports it. Reasoning is always on.
base_model = "moonshotai/kimi-k2.5"
reasoning_options = []

[interleaved]
field = "reasoning_content"

[cost]
input = 0.5
output = 2.8
cache_read = 0.125
cache_write = 0.625
