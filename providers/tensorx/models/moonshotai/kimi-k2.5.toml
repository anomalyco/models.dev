# Neither control is honored here: chat_template_kwargs.thinking and
# reasoning_effort (including none, and an invalid value) all leave the
# reasoning-token count unchanged over 8 runs. Reasoning is always on.
base_model = "moonshotai/kimi-k2.5"
reasoning_options = []

[interleaved]
field = "reasoning_content"

[cost]
input = 0.5
output = 2.8
cache_read = 0.125
cache_write = 0.625
