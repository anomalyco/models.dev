# Reasoning is always on: Kimi models "cannot be toggled off" on TensorX and take no reasoning_effort.
# https://docs.tensorx.ai/api-reference/reasoning (accessed 2026-10-21)
schema = 2
base_model = "moonshotai/kimi-k2.7-code"

[capabilities]
reasoning = { supported = true }
structured_output = true

[cost.text.input]
price = 1.25
cache = { read = 0.3125 }

[cost.text.output]
price = 4.5
