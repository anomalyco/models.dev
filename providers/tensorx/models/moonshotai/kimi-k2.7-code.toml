# Toggle: chat_template_kwargs.thinking = false disables reasoning (verified live 2026-11-04); enable_thinking is ignored.
# https://docs.tensorx.ai/api-reference/reasoning (accessed 2026-11-04)
schema = 2
base_model = "moonshotai/kimi-k2.7-code"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
output = 64_000

[cost.text.input]
price = 1.25
cache = { read = 0.3125 }

[cost.text.output]
price = 4.5
