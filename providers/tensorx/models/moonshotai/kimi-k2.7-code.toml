# Toggle: chat_template_kwargs.thinking = true|false (default on); verified by
# reasoning_content going empty when false.
# reasoning_effort is accepted but not honored: none, low, high, max and an
# invalid value all leave reasoning_content in the same range.
base_model = "moonshotai/kimi-k2.7-code"

[[reasoning_options]]
type = "toggle"

[interleaved]
field = "reasoning_content"

[cost]
input = 1.25
output = 4.5
cache_read = 0.3125

[limit]
output = 64_000
