# Effort: reasoning_effort = <value>; reasoning is mandatory, "none" is rejected
base_model = "openai/gpt-oss-120b"
knowledge = "2024-10"

[[reasoning_options]]
type = "effort"
values = ["minimal", "low", "medium", "high", "xhigh", "max"]

[cost]
input = 0.04
output = 0.2
cache_read = 0.01
cache_write = 0.05
