# Toggle: chat_template_kwargs.thinking_mode = enabled|adaptive|disabled (default adaptive); reasoning_effort "none" also disables.
# Effort: reasoning_effort = low|medium|high|xhigh|max.
# https://docs.tensorx.ai/api-reference/reasoning (accessed 2026-11-04), MiniMax M3.1 Flash section.
schema = 2
base_model = "minimax/MiniMax-M3.1-Flash"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[limit]
context = 1_048_576
output = 64_000

[cost.text.input]
price = 0.3
cache = { read = 0.075 }

[cost.text.output]
price = 1.2
