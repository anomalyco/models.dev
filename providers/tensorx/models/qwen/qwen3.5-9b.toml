# Effort: reasoning_effort = none|high. Off is the effort value none, not a
# boolean field: chat_template_kwargs.enable_thinking and thinking are no-ops
# here. Measured by reasoning_content length; none empties it, invalid values
# return 400, and over 4 runs each low/medium/high/max overlap entirely
# (means within 60 chars), so one on level is published.
base_model = "alibaba/qwen3.5-9b"

[[reasoning_options]]
type = "effort"
values = ["none", "high"]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.15
output = 0.2
cache_read = 0.0375
cache_write = 0.1875

[limit]
output = 262_144
