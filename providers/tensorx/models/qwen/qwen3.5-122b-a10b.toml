# Effort: reasoning_effort = none|high. Off is the effort value none, not a
# boolean field: chat_template_kwargs.enable_thinking and thinking are both
# accepted but are no-ops here. Measured by reasoning_content length (this
# host under-reports usage.reasoning_tokens); none empties it, invalid values
# return 400, and no graded level was separable, so one on level is published.
base_model = "alibaba/qwen3.5-122b-a10b"

[[reasoning_options]]
type = "effort"
values = ["none", "high"]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.5
output = 3.5
cache_read = 0.125
cache_write = 0.625

[limit]
output = 262144
