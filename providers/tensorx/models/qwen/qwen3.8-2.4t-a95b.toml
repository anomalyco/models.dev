# Qwen3.8 always reasons; effort xhigh (default) | medium | low.
# https://docs.tensorx.ai/api-reference/reasoning
schema = 2
base_model = "alibaba/qwen3.8-2.4t-a95b"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "xhigh"] }
structured_output = true

[limit]
output = 64_000

[cost.text.input]
price = 2.5
cache = { read = 0.63 }

[cost.text.output]
price = 6
