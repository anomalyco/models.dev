# Toggle: chat_template_kwargs.enable_thinking = true|false (default on).
# Verified: false empties reasoning_content, true and the default fill it.
# This host streams reasoning into reasoning_content but does not count it in
# usage.reasoning_tokens, which reads 0 even while reasoning runs — measure
# the field, not the token count. reasoning_effort = none also suppresses it,
# but no graded level was separable, so only on/off is published.
base_model = "zhipuai/glm-5v-turbo"

[[reasoning_options]]
type = "toggle"

[interleaved]
field = "reasoning_content"

[cost]
input = 1.2
output = 4
cache_read = 0.3
cache_write = 1.5

[limit]
context = 202752
