# Toggle: chat_template_kwargs.enable_thinking = true|false (default on)
# Effort: reasoning_effort = <value>; "none" disables reasoning
base_model = "zhipuai/glm-5v-turbo"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["none", "minimal", "low", "medium", "high", "xhigh", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 1.2
output = 4
cache_read = 0.3
cache_write = 1.5

[limit]
context = 202752
