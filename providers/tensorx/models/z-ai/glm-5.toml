# Effort: reasoning_effort = none|high. Off is the effort value none, not a
# boolean field: chat_template_kwargs.enable_thinking is accepted but is a no-op
# on this host, so no toggle is declared. Verified by reasoning_content going
# empty for none, not by usage.reasoning_tokens, which this host under-reports.
# No graded level was separable from another, so one on level is published.
base_model = "zhipuai/glm-5"

[[reasoning_options]]
type = "effort"
values = ["none", "high"]

[interleaved]
field = "reasoning_content"

[cost]
input = 1
output = 3.2
cache_read = 0.25
cache_write = 1.25

[limit]
context = 202752
output = 202752
