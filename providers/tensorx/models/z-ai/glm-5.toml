# Effort: reasoning_effort = none|high|max; none verified to disable reasoning.
# chat_template_kwargs.enable_thinking is accepted but not honored here, and
# the graded levels were not separable, so only z.ai's effective levels list.
base_model = "zhipuai/glm-5"

[[reasoning_options]]
type = "effort"
values = ["none", "high", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 1
output = 3.2
cache_read = 0.25
cache_write = 1.25

[limit]
context = 202752
output = 202752
