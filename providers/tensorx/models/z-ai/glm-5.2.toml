# Toggle: chat_template_kwargs.enable_thinking = true|false (default on)
# Effort: reasoning_effort = high|max — z.ai maps none|minimal to off,
# low|medium to high and xhigh to max, so high|max are the effective levels.
base_model = "zhipuai/glm-5.2"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["high", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 1.5
output = 4.5
cache_read = 0.375

[limit]
context = 1_048_576
output = 64_000
