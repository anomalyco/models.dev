# Toggle: chat_template_kwargs.enable_thinking = true|false (default on)
# Effort: reasoning_effort = <value>; "none" disables reasoning
base_model = "zhipuai/glm-5.2"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["none", "minimal", "low", "medium", "high", "xhigh", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 1.5
output = 4.5
cache_read = 0.375

[limit]
context = 1_048_576
output = 64_000
