# Off is effort=none; chat_template_kwargs.enable_thinking also toggles, but
# `none` already expresses it, so effort is the single declared control.
# Effort: reasoning_effort = none|minimal|low|medium|high|xhigh|max (verified; others rejected 400)
base_model = "zhipuai/glm-5.2"

[[reasoning_options]]
type = "effort"
values = ["none", "minimal", "low", "medium", "high", "xhigh", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 1.5
output = 4.5
cache_read = 0.375

[limit]
context = 1_048_576
output = 64_000
