# Off is effort=none; chat_template_kwargs.enable_thinking also toggles, but
# `none` already expresses it, so effort is the single declared control.
# Effort: reasoning_effort = none|low|medium|high (verified; others rejected 400)
base_model = "zhipuai/glm-5-turbo"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high"]

[interleaved]
field = "reasoning_content"

[cost]
input = 1.2
output = 4
cache_read = 0.3
cache_write = 1.5

[limit]
context = 202752
