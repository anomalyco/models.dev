# Toggle: chat_template_kwargs.enable_thinking = true|false (default on)
# reasoning_effort is accepted but its graded levels were not separable here;
# first-party z.ai exposes only the toggle, so that is the declared control.
base_model = "zhipuai/glm-5.1"

[[reasoning_options]]
type = "toggle"

[interleaved]
field = "reasoning_content"

[cost]
input = 1.4
output = 4.4
cache_read = 0.35
cache_write = 1.75

[limit]
context = 202_752
output = 64_000
