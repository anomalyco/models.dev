# Off is effort=none; chat_template_kwargs.enable_thinking also toggles, but
# `none` already expresses it, so effort is the single declared control.
# Effort: reasoning_effort = none|low|medium|high|max (verified; others rejected 400)
base_model = "zhipuai/glm-5.1"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 1.4
output = 4.4
cache_read = 0.35
cache_write = 1.75

[limit]
context = 202_752
output = 64_000
