# Not reachable with the sync key (403, models=['public']), so nothing below
# could be measured against this host. Controls are carried from the lab/peer
# baseline; [interleaved] is deliberately omitted rather than assumed, even
# though all 18 reachable models here stream reasoning_content.
# First-party z.ai GLM-4.7 is toggle-only.
# Toggle: chat_template_kwargs.enable_thinking = true|false
base_model = "zhipuai/glm-4.7"

[[reasoning_options]]
type = "toggle"

[cost]
input = 0.6
output = 2.2
cache_read = 0.15
cache_write = 0.75

[limit]
context = 200000
output = 200000

[modalities]
input = ["text", "image"]
output = ["text"]
