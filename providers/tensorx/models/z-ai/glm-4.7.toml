base_model = "zhipuai/glm-4.7"

[[reasoning_options]]
type = "effort" # API: {"reasoning_effort": <value>}; "none" disables reasoning
values = ["none", "minimal", "low", "medium", "high", "xhigh", "max"]

[cost]
input = 0.6
output = 2.2
cache_read = 0.15
cache_write = 0.75

[limit]
context = 200000
output = 200000

[modalities]
input = ["text", "image"]
output = ["text"]
