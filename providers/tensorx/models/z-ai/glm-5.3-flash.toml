# GLM-5.3-Flash reasons by default. Effort: low|high|max (default max); also reasoning_effort = none disables.
# Toggle: chat_template_kwargs.enable_thinking = true|false (off switch; on default).
# https://docs.tensorx.ai/api-reference/reasoning
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[modalities]
input = ["text", "image/jpeg", "image/png", "video/mp4", "video/x-matroska", "video/quicktime"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true

[limit]
context = 1_048_576
output = 64_000

[cost.text.input]
price = 0.2
cache = { read = 0.05 }

[cost.text.output]
price = 0.5
