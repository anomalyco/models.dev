# GLM-5.3-Flash reasons by default; toggle enable_thinking, effort low|high|max (default max).
# Unlike first-party Z.AI, TensorX allows thinking to be disabled (enable_thinking).
# https://docs.tensorx.ai/api-reference/reasoning
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
context = 1_048_576
output = 64_000

[cost.text.input]
price = 0.2
cache = { read = 0.05 }

[cost.text.output]
price = 0.5
