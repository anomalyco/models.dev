base_model = "zhipuai/glm-5.3-flash"
# GLM-5.3-Flash reasons by default; toggle enable_thinking, effort low|high (default max).
# https://docs.tensorx.ai/api-reference/reasoning

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "high"]

[cost]
input = 0.2
output = 0.5
cache_read = 0.05

[limit]
context = 1048576
output = 64000