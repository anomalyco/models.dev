base_model = "zhipuai/glm-5.3-flash"
# GLM-5.3-Flash reasons by default; effort levels low|high|max, and thinking
# can be suppressed with {"thinking": {"type": "disabled"}}.
# https://z.ai/blog/glm-5.3-flash

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 0.2
output = 0.5
cache_read = 0.05

[limit]
context = 1048576
output = 64000