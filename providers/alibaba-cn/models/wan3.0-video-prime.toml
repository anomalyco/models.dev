# Sources (accessed 2026-11-12):
# - Pricing (China (Beijing), CNY): https://help.aliyun.com/zh/model-studio/model-pricing
#   per second of output video: 1080P ¥1.8, 720P ¥0.9, 480P ¥0.45
#   base price is 1080P, the default resolution in the API reference below
#   input video is billed per second at the same rate as output
# CNY→USD rate: 6.685797, 2026-11-12, source: https://open.er-api.com/v6/latest/USD
# - API: POST https://dashscope.aliyuncs.com/api/v1/services/aigc/video-generation/video-synthesis with `X-DashScope-Async: enable`,
#   then poll GET /api/v1/tasks/{task_id} (https://www.alibabacloud.com/help/en/model-studio/wan3-video-generation-api-reference)
# base_url is passed as @ai-sdk/alibaba's videoBaseURL. No @opencode/ai package covers this API.
schema = 2
v2_only = true
base_model = "alibaba/wan3.0-video-prime"

[api.videos]
base_url = "https://dashscope.aliyuncs.com"
sdk = { aisdk = "@ai-sdk/alibaba", opencodeai = "none" }

[cost.video.output]
unit = "second"
price = 0.2692

[[cost.video.output.overrides]]
when = { resolution = { equals = "720P" } }
price = 0.1346

[[cost.video.output.overrides]]
when = { resolution = { equals = "480P" } }
price = 0.0673

[cost.video.input]
unit = "second"
price = 0.2692

[[cost.video.input.overrides]]
when = { resolution = { equals = "720P" } }
price = 0.1346

[[cost.video.input.overrides]]
when = { resolution = { equals = "480P" } }
price = 0.0673
