# v2 capabilities (docs for China (Beijing), accessed 2026-10-19): Chat API https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions (sampling incl. top_k, which the DeepSeek, Kimi and MiniMax series do not support; enable_thinking defaults; stream_options.include_usage);
# structured output https://www.alibabacloud.com/help/en/model-studio/json-mode; context cache https://www.alibabacloud.com/help/en/model-studio/context-cache (Beijing model lists, 1,024-token minimum, explicit: cache_control ephemeral, 5-minute TTL, up to 4 markers; tool definitions count as part of the system message, so changing tools changes the prefix).
# Not probed live (the available key is international-only), so system_updates and effort_updates are left unset where the docs are silent.
# Input MIME types: https://www.alibabacloud.com/help/en/model-studio/vision (images, video) and https://www.alibabacloud.com/help/en/model-studio/qwen-omni (audio).
# Prices: China (Beijing) USD list https://www.alibabacloud.com/help/en/model-studio/model-pricing (accessed 2026-10-19).
# China (Beijing) tiers: 0-32K $0.143/$1.434, 32K-128K $0.215/$2.15, 128K-256K $0.43/$4.301; one output price for thinking and non-thinking modes.
# Cache prices (all input bands, same ratios per https://www.alibabacloud.com/help/en/model-studio/context-cache): implicit read 20%, explicit creation 125%, explicit read 10% of input (https://www.qianwenai.com/models/qwen3-vl-plus, accessed 2026-10-23).
schema = 2
name = "Qwen3-VL Plus"
description = "Qwen vision-language model for visual reasoning, documents, and agent tasks"
family = "qwen"
open_weights = false
knowledge = "2025-04"
release_date = "2025-09-23"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true, budget = { max = 81_920 } }
structured_output = true
temperature = true
top_p = true
top_k = true
stream_usage = true
cache = { implicit = { min_tokens = 1_024 }, explicit = { ttl = ["5m"], max_breakpoints = 4, targets = ["system", "messages"], min_tokens = 1_024 } }

[limit]
context = 262_144
output = 32_768

[api.chat-completions]

[api.messages]
base_url = "https://dashscope.aliyuncs.com/apps/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/alibaba/messages" }

[cost.text.input]
price = 0.143353
cache = { read = 0.028671, explicit = { read = 0.014335, write = 0.179191 } }

[[cost.text.input.overrides]]
when = { context = { gt = 32_000 } }
price = 0.215
cache = { read = 0.043, explicit = { read = 0.0215, write = 0.26875 } }

[[cost.text.input.overrides]]
when = { context = { gt = 128_000 } }
price = 0.43
cache = { read = 0.086, explicit = { read = 0.043, write = 0.5375 } }

[cost.text.output]
price = 1.433525

[[cost.text.output.overrides]]
when = { context = { gt = 32_000 } }
price = 2.15

[[cost.text.output.overrides]]
when = { context = { gt = 128_000 } }
price = 4.301
