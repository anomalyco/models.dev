# Sources (accessed 2026-09-22):
# https://help.aliyun.com/en/model-studio/model-pricing (China (Beijing) USD list prices)
# https://help.aliyun.com/en/model-studio/qwen3-5-plus (capabilities and limits)
# https://help.aliyun.com/en/model-studio/deep-thinking
# Toggle: enable_thinking true|false
# Budget: thinking_budget (integer reasoning tokens, max 81,920)
schema = 2
name = "Qwen3.5 Plus"
description = "Qwen vision-language model for visual reasoning, documents, and agent tasks"
family = "qwen"
open_weights = false
knowledge = "2025-04"
release_date = "2026-02-16"
last_updated = "2026-09-22"

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true, budget = { max = 81_920 } }
structured_output = true
temperature = true

[limit]
context = 1_000_000
output = 65_536

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.115

[[cost.text.input.overrides]]
when = { context = { gt = 128_000 } }
price = 0.287

[[cost.text.input.overrides]]
when = { context = { gt = 256_000 } }
price = 0.573

[cost.text.output]
price = 0.688
reasoning = 0.688

[[cost.text.output.overrides]]
when = { context = { gt = 128_000 } }
price = 1.72
reasoning = 1.72

[[cost.text.output.overrides]]
when = { context = { gt = 256_000 } }
price = 3.44
reasoning = 3.44
