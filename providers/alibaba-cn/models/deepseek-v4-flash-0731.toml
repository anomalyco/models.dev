# Prices (China (Beijing), CNY per 1M): busy ¥3 input / ¥9 output, idle ¥1.5 / ¥4.5 (https://help.aliyun.com/zh/model-studio/model-pricing, accessed 2026-11-24).
# CNY→USD rate: 6.679299, 2026-11-24, source: https://open.er-api.com/v6/latest/USD
# Capabilities: Chat API https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions; DeepSeek on Model Studio https://help.aliyun.com/zh/model-studio/deepseek-api (Chat Completions, Responses and Anthropic Messages).
# Toggle: enable_thinking true|false (default on); Effort: reasoning_effort = low|high|max (default high; medium and xhigh map to high) per the Chat API reference. top_k: the DeepSeek series does not support it.
# Peak/off-peak pricing: busy hours 08:00-22:00 UTC+8, idle 22:00-08:00 UTC+8 (14:00-24:00 UTC) at half price. Base = busy price, idle multiplier 0.5.
# Cache: implicit; the CNY hit price isn't listed, so none is set (as on deepseek-v4-pro-0813 here).
# Not probed live (the available key is international-only), so system_updates and effort_updates are left unset.
# Web search: $0.573411 per 1,000 calls in China (Beijing) (agent policy, also the Responses and Anthropic web_search tool rate): https://www.alibabacloud.com/help/en/model-studio/web-search (accessed 2026-10-23).
# Tools: tool_choice auto|none|required|named on every API except Responses (no required with more than one tool); no strict tool mode (sources in provider.toml).
schema = 2
base_model = "deepseek/deepseek-v4-flash-0731"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, default = { type = "effort", value = "high" }, toggle = true, effort = ["low", "high", "max"] }
top_k = false
stream_usage = true
cache = { implicit = { min_tokens = 1_024 } }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/alibaba/responses" }
capabilities = { tools = { choice = ["auto", "none", "tool"] } }

[api.messages]
base_url = "https://dashscope.aliyuncs.com/apps/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/alibaba/messages" }

[cost.text.input]
price = 0.449149

[cost.text.output]
price = 1.347447

[[cost.multipliers]]
when = { utc_hours = { gte = "14:00" } }
factor = { text = 0.5 }

[cost.web_search]
price = 0.573411
