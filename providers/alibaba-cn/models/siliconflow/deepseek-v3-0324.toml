# max_tokens_field: Model Studio's Chat API lists this model outside max_completion_tokens support (https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions, accessed 2026-10-24)
# Tools: tool_choice auto|none on every API; no strict tool mode (sources in provider.toml).
schema = 2
name = "siliconflow/deepseek-v3-0324"
description = "DeepSeek chat model for instruction following, coding, and analysis"
family = "deepseek"
open_weights = false
release_date = "2024-12-26"
last_updated = "2025-11-25"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none"] }
reasoning = { supported = false }
structured_output = true
temperature = true

[limit]
context = 163_840
output = 163_840

[api.chat-completions]
compatibility = { max_tokens_field = "max_tokens" }

[cost.text.input]
price = 0.25

[cost.text.output]
price = 1
