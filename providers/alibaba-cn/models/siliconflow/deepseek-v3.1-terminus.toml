# max_tokens_field: Model Studio's Chat API lists this model outside max_completion_tokens support (https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions, accessed 2026-10-24)
schema = 2
name = "siliconflow/deepseek-v3.1-terminus"
description = "DeepSeek chat model for instruction following, coding, and analysis"
family = "deepseek"
open_weights = false
release_date = "2025-09-29"
last_updated = "2025-11-25"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true }
structured_output = true
temperature = true

[limit]
context = 163_840
output = 65_536

[api.chat-completions]
compatibility = { max_tokens_field = "max_tokens" }

[cost.text.input]
price = 0.27

[cost.text.output]
price = 1
