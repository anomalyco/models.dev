# Sources (accessed 2026-11-12):
# - Pricing (China (Beijing), CNY): https://help.aliyun.com/zh/model-studio/model-pricing
#   per second of output video: 1080P ¥1, 720P ¥0.6
#   base price is 1080P, the default resolution in the API reference below
#   input video is billed per second at the same rate as output
# CNY→USD rate: 6.685797, 2026-11-12, source: https://open.er-api.com/v6/latest/USD
# - API: POST https://dashscope.aliyuncs.com/api/v1/services/aigc/video-generation/video-synthesis with `X-DashScope-Async: enable`,
#   then poll GET /api/v1/tasks/{task_id} (https://www.alibabacloud.com/help/en/model-studio/wan-video-editing-api-reference)
# - Inputs: input video MP4 or MOV; reference images JPEG, JPG, PNG, BMP or WEBP; output MP4 (H.264)
# @ai-sdk/alibaba does not map an input video to edit, so no SDK is listed.
schema = 2
v2_only = true
base_model = "alibaba/wan2.7"
name = "Wan2.7 Video Edit"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/bmp", "image/webp", "video/mp4", "video/quicktime"]
output = ["video/mp4"]

[api.videos]
base_url = "https://dashscope.aliyuncs.com"
sdk = { aisdk = "none", opencodeai = "none" }

[cost.video.output]
unit = "second"
price = 0.1496

[[cost.video.output.overrides]]
when = { resolution = { equals = "720P" } }
price = 0.0897

[cost.video.input]
unit = "second"
price = 0.1496

[[cost.video.input.overrides]]
when = { resolution = { equals = "720P" } }
price = 0.0897
