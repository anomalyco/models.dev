# v2 capabilities (docs for China (Beijing), accessed 2026-10-19): Chat API https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions (sampling incl. top_k, which the DeepSeek, Kimi and MiniMax series do not support; enable_thinking defaults; stream_options.include_usage);
# structured output https://www.alibabacloud.com/help/en/model-studio/json-mode; context cache https://www.alibabacloud.com/help/en/model-studio/context-cache (Beijing model lists, 1,024-token minimum, explicit: cache_control ephemeral, 5-minute TTL, up to 4 markers; tool definitions count as part of the system message, so changing tools changes the prefix).
# Not probed live (the available key is international-only), so system_updates and effort_updates are left unset where the docs are silent.
# Reasoning: enable_thinking only; thinking_budget is not listed for Qwen3-Omni-Flash in the Chat API reference.
# Prices: China (Beijing) USD list https://www.alibabacloud.com/help/en/model-studio/model-pricing (accessed 2026-10-19).
# China (Beijing) list: text input $0.258, audio input $2.265, image/video input $0.473; text output $0.989 (text-only input) / $1.821 (multimodal input), text+audio output $8.974 (audio billed). Previously Qwen-Omni-Turbo prices.
# MIME types: image/video per https://www.alibabacloud.com/help/en/model-studio/vision, audio input AMR/WAV/3GP/3GPP/AAC/MP3 per https://www.alibabacloud.com/help/en/model-studio/qwen-omni; output audio "Only wav is supported" per https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions.
schema = 2
name = "Qwen3-Omni Flash"
description = "Qwen omni model for text, vision, audio, and multimodal agent tasks"
family = "qwen"
open_weights = false
knowledge = "2024-04"
release_date = "2025-09-15"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic", "audio/amr", "audio/wav", "audio/3gpp", "audio/aac", "audio/mpeg", "video/mp4", "video/x-msvideo", "video/x-matroska", "video/quicktime", "video/x-flv", "video/x-ms-wmv"]
output = ["text", "audio/wav"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true }
temperature = true
top_p = true
top_k = true
effort_updates = false
stream_usage = true
cache = { supported = false }

[limit]
context = 65_536
output = 16_384

[cost.text.input]
price = 0.258

[cost.text.output]
price = 0.989

[cost.audio.input]
price = 2.265

[cost.audio.output]
price = 8.974
