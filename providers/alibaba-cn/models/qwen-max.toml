# v2 capabilities (docs for China (Beijing), accessed 2026-10-19): Chat API https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions (sampling incl. top_k, which the DeepSeek, Kimi and MiniMax series do not support; enable_thinking defaults; stream_options.include_usage);
# structured output https://www.alibabacloud.com/help/en/model-studio/json-mode; context cache https://www.alibabacloud.com/help/en/model-studio/context-cache (Beijing model lists, 1,024-token minimum, explicit: cache_control ephemeral, 5-minute TTL, up to 4 markers; tool definitions count as part of the system message, so changing tools changes the prefix).
# Not probed live (the available key is international-only), so system_updates and effort_updates are left unset where the docs are silent.
# Web search: $0.573411 per 1,000 calls in China (Beijing) (agent policy, also the Responses and Anthropic web_search tool rate): https://www.alibabacloud.com/help/en/model-studio/web-search (accessed 2026-10-23).
schema = 2
name = "Qwen Max"
description = "Flagship Qwen model for complex reasoning, coding, and agentic workflows"
family = "qwen"
open_weights = false
knowledge = "2024-04"
release_date = "2024-04-03"
last_updated = "2025-01-25"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
structured_output = true
temperature = true
top_p = true
top_k = true
stream_usage = true
cache = { implicit = { min_tokens = 1_024 } }

[limit]
context = 131_072
output = 8_192

[api.chat-completions]

[api.messages]
base_url = "https://dashscope.aliyuncs.com/apps/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/alibaba/messages" }

[cost.text.input]
price = 0.345

[cost.text.output]
price = 1.377

[cost.web_search]
price = 0.573411
