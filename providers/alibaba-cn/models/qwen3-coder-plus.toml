# China-site (Bailuan) pricing differs from the international console,
# so this provider entry can no longer share the alibaba symlink ($1/$5).
# https://help.aliyun.com/zh/model-studio/model-pricing (accessed 2026-09-11)
# Status: no longer listed for China (Beijing) on https://www.alibabacloud.com/help/en/model-studio/model-pricing or https://help.aliyun.com/zh/model-studio/model-pricing (accessed 2026-10-19); retired models are removed from the docs (https://www.alibabacloud.com/help/en/model-studio/model-depreciation).
# max_tokens_field: Model Studio's Chat API lists this model outside max_completion_tokens support (https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions, accessed 2026-10-24)
# Tools: tool_choice auto|none on every API; no strict tool mode (sources in provider.toml).
schema = 2
name = "Qwen3 Coder Plus"
description = "Hosted Qwen coder for software agents, repo edits, and long-context code"
family = "qwen"
open_weights = true
knowledge = "2025-04"
release_date = "2025-07-23"
last_updated = "2026-09-11"
status = "deprecated"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none"] }
reasoning = { supported = false }
temperature = true

[limit]
context = 1_048_576
output = 65_536

[api.chat-completions]
compatibility = { max_tokens_field = "max_tokens" }

[cost.text.input]
price = 0.574

[[cost.text.input.overrides]]
when = { context = { gt = 32_000 } }
price = 0.861

[[cost.text.input.overrides]]
when = { context = { gt = 128_000 } }
price = 1.435

[[cost.text.input.overrides]]
when = { context = { gt = 256_000 } }
price = 2.87

[cost.text.output]
price = 2.296

[[cost.text.output.overrides]]
when = { context = { gt = 32_000 } }
price = 3.444

[[cost.text.output.overrides]]
when = { context = { gt = 128_000 } }
price = 5.74

[[cost.text.output.overrides]]
when = { context = { gt = 256_000 } }
price = 28.7
