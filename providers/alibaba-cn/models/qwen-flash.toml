# v2 capabilities (docs for China (Beijing), accessed 2026-10-19): Chat API https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions (sampling incl. top_k, which the DeepSeek, Kimi and MiniMax series do not support; enable_thinking defaults; stream_options.include_usage);
# structured output https://www.alibabacloud.com/help/en/model-studio/json-mode; context cache https://www.alibabacloud.com/help/en/model-studio/context-cache (Beijing model lists, 1,024-token minimum, explicit: cache_control ephemeral, 5-minute TTL, up to 4 markers; tool definitions count as part of the system message, so changing tools changes the prefix).
# Not probed live (the available key is international-only), so system_updates and effort_updates are left unset where the docs are silent.
# Prices: China (Beijing) USD list https://www.alibabacloud.com/help/en/model-studio/model-pricing (accessed 2026-10-19).
# China (Beijing) tiers: 0-128K $0.022/$0.216, 128K-256K $0.087/$0.861, 256K-1M $0.173/$1.721.
# Web search: $0.573411 per 1,000 calls in China (Beijing) (agent policy, also the Responses and Anthropic web_search tool rate): https://www.alibabacloud.com/help/en/model-studio/web-search (accessed 2026-10-23).
# Cache prices (all input bands, same ratios per https://www.alibabacloud.com/help/en/model-studio/context-cache): implicit read 20%, explicit creation 125%, explicit read 10% of input (https://www.qianwenai.com/models/qwen-flash, accessed 2026-10-23).
schema = 2
name = "Qwen Flash"
description = "Efficient Qwen model for fast chat, extraction, and high-volume workloads"
family = "qwen"
open_weights = false
knowledge = "2024-04"
release_date = "2025-07-28"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, default = { type = "toggle", value = false }, toggle = true, budget = { max = 81_920 } }
structured_output = true
temperature = true
top_p = true
top_k = true
stream_usage = true
cache = { implicit = { min_tokens = 1_024 }, explicit = { ttl = ["5m"], max_breakpoints = 4, targets = ["system", "messages"], min_tokens = 1_024 } }

[limit]
context = 1_000_000
output = 32_768

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/alibaba/responses" }

[api.messages]
base_url = "https://dashscope.aliyuncs.com/apps/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/alibaba/messages" }

[cost.text.input]
price = 0.022
cache = { read = 0.0044, explicit = { read = 0.0022, write = 0.0275 } }

[[cost.text.input.overrides]]
when = { context = { gt = 128_000 } }
price = 0.087
cache = { read = 0.0174, explicit = { read = 0.0087, write = 0.10875 } }

[[cost.text.input.overrides]]
when = { context = { gt = 256_000 } }
price = 0.173
cache = { read = 0.0346, explicit = { read = 0.0173, write = 0.21625 } }

[cost.text.output]
price = 0.216

[[cost.text.output.overrides]]
when = { context = { gt = 128_000 } }
price = 0.861

[[cost.text.output.overrides]]
when = { context = { gt = 256_000 } }
price = 1.721

[cost.web_search]
price = 0.573411
