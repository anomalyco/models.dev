# Chinese mainland deployment is tiered on input tokens per request; every
# token in a request bills at its tier's unit price. The 0.87/3.48 previously
# published here matches neither band; both bands below are taken from the
# vendor page. No cache-read price is published for either band, so the
# existing curated cache_read is retained on the base and not restated.
# https://www.alibabacloud.com/help/en/model-studio/model-pricing (accessed 2026-08-26)
# v2 capabilities (docs for China (Beijing), accessed 2026-10-19): Chat API https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions (sampling incl. top_k, which the DeepSeek, Kimi and MiniMax series do not support; enable_thinking defaults; stream_options.include_usage);
# structured output https://www.alibabacloud.com/help/en/model-studio/json-mode; context cache https://www.alibabacloud.com/help/en/model-studio/context-cache (Beijing model lists, 1,024-token minimum, explicit: cache_control ephemeral, 5-minute TTL, up to 4 markers; tool definitions count as part of the system message, so changing tools changes the prefix).
# Not probed live (the available key is international-only), so system_updates and effort_updates are left unset where the docs are silent.
schema = 2
name = "GLM-5.1"
description = "Flagship GLM model for hybrid reasoning, coding, and agentic engineering"
family = "glm"
open_weights = true
release_date = "2026-04-14"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, default = { type = "toggle", value = true }, toggle = true, budget = { max = 131_072 } }
structured_output = true
temperature = true
stream_usage = true
cache = { implicit = { min_tokens = 1_024 }, explicit = { ttl = ["5m"], max_breakpoints = 4, targets = ["system", "messages"], min_tokens = 1_024 } }

[limit]
context = 202_752
output = 128_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.825
cache = { read = 0.17 }

[[cost.text.input.overrides]]
when = { context = { gt = 32_000 } }
price = 1.1

[cost.text.output]
price = 3.301

[[cost.text.output.overrides]]
when = { context = { gt = 32_000 } }
price = 3.851
