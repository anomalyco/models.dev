# First party price citation here
# https://bailian.console.alibabacloud.com/cn-beijing?tab=model#/model-market/detail/glm-5.2?serviceSite=asia-pacific-china
schema = 2
base_model = "zhipuai/glm-5.2"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true

[limit]
context = 1_000_000
output = 128_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.1
cache = { read = 0.275, write = 0 }

[cost.text.output]
price = 3.851
