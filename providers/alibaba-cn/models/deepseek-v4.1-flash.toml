# Mainland billing basis (CNY per 1M tokens, busy hours): input 2, output 8.
# Approximate USD equivalents at 2026-11-16 USD/CNY 6.67175: $0.30 / $1.20.
# https://help.aliyun.com/zh/model-studio/billing-for-model-studio
# The international USD Beijing list independently quotes $0.283 / $1.131:
# https://www.alibabacloud.com/help/en/model-studio/model-pricing
# Additional supporting references:
# https://bailian.console.aliyun.com/cn-beijing?tab=model#/model-market/detail/deepseek-v4.1-flash?serviceSite=asia-pacific-china
# https://help.aliyun.com/zh/model-studio/deepseek-api — capability table,
# reasoning_effort ladder, max_tokens default (393_216, shared with thinking)
# https://help.aliyun.com/zh/model-studio/billing-for-model-studio — Beijing
# peak/off-peak pricing: CNY 2/1 input, 8/4 output per 1M tokens with context
# cache discount; CNY rates are converted to approximate USD (off-peak is half).
# Hybrid reasoning: enable_thinking = true|false toggles thinking;
# reasoning_effort = low|high|max (default high) — low is only supported on
# v4.1-flash / v4-flash-0731 / v4-pro-0813, and v4.1-flash is the current
# low-tier bearer. reasoning_content streams in deltas. Responses API
# supported (Beijing and Singapore only). Limits and modalities are identical
# to the deepseek lab entry (1M context, 384_000 output, text+image input),
# so they are inherited and not restated.
# v2 capabilities (docs for China (Beijing), accessed 2026-10-19): Chat API https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions (sampling incl. top_k, which the DeepSeek, Kimi and MiniMax series do not support; enable_thinking defaults; stream_options.include_usage);
# structured output https://www.alibabacloud.com/help/en/model-studio/json-mode; context cache https://www.alibabacloud.com/help/en/model-studio/context-cache (Beijing model lists, 1,024-token minimum, explicit: cache_control ephemeral, 5-minute TTL, up to 4 markers; tool definitions count as part of the system message, so changing tools changes the prefix).
# Not probed live (the available key is international-only), so system_updates and effort_updates are left unset where the docs are silent.
# Price basis: mainland CNY rate card (above), rather than international USD billing.
# Cache evidence (implicit cache, 2026-11-16): Both V4.1 Flash IDs are explicitly exempt from the previous 10% assumption.
# Chinese billing rule: cached_token is 2% of input_token in Beijing and five other regions, peak and off-peak:
# https://help.aliyun.com/zh/model-studio/context-cache
# Beijing CNY 2 / 1 per 1M input => CNY 0.04 / 0.02 cached; at CNY 6.67175/USD, ~USD 0.006 / 0.003.
# English billing rule independently specifies fixed USD 0.006 peak / 0.003 off-peak per 1M for both IDs in all regions:
# https://www.alibabacloud.com/help/en/model-studio/context-cache
# Peak/off-peak pricing: busy hours 08:00-22:00 UTC+8, idle 22:00-08:00 UTC+8 (14:00-24:00 UTC) at half price. Base = mainland CNY price expressed in USD, idle multiplier 0.5.
# Tools: tool_choice auto|none|required|named on every API except Responses (no required with more than one tool); no strict tool mode (sources in provider.toml).
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, default = { type = "effort", value = "high" }, toggle = true, effort = ["low", "high", "max"] }
structured_output = true
top_k = false
stream_usage = true
cache = { implicit = { min_tokens = 1_024 } }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/alibaba/responses" }
capabilities = { tools = { choice = ["auto", "none", "tool"] } }

[api.messages]
base_url = "https://dashscope.aliyuncs.com/apps/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/alibaba/messages" }

[cost.text.input]
price = 0.3
cache = { read = 0.006 }

[cost.text.output]
price = 1.2

[[cost.multipliers]]
when = { utc_hours = { gte = "14:00" } }
factor = 0.5
