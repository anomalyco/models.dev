# GLM-5.3 on Alibaba Bailian (Model Studio, Beijing): always-on thinking with
# reasoning_effort low|high|max (default max). Thinking cannot be turned off
# (enable_thinking only accepts true; passing false errors) and there is no
# thinking_budget — so a single effort option, no toggle, no budget.
# reasoning_content is streamed in deltas.
# Pricing: Beijing CNY 8 / 28 / 2 (cache hit) per 1M tokens, same list price
# as glm-5.2 on the same host (see providers/alibaba-cn/models/glm-5.2.toml).
# Limits and modalities are identical to the zhipuai lab entry
# (1M context, 131_072 output, text-only), so they are inherited and not restated.
# https://bailian.console.aliyun.com/cn-beijing?tab=model#/model-market/detail/glm-5.3?serviceSite=asia-pacific-china
# https://docs.bigmodel.cn/cn/guide/models/text/glm-5.3
# v2 capabilities (docs for China (Beijing), accessed 2026-10-19): Chat API https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions (sampling incl. top_k, which the DeepSeek, Kimi and MiniMax series do not support; enable_thinking defaults; stream_options.include_usage);
# structured output https://www.alibabacloud.com/help/en/model-studio/json-mode; context cache https://www.alibabacloud.com/help/en/model-studio/context-cache (Beijing model lists, 1,024-token minimum, explicit: cache_control ephemeral, 5-minute TTL, up to 4 markers; tool definitions count as part of the system message, so changing tools changes the prefix).
# Not probed live (the available key is international-only), so system_updates and effort_updates are left unset where the docs are silent.
# Thinking only (enable_thinking accepts only true); Effort: reasoning_effort = low|high|max (default max) per the Chat API reference.
# Tools: tool_choice auto|none on every API; no strict tool mode (sources in provider.toml).
schema = 2
base_model = "zhipuai/glm-5.3"

[capabilities]
tools = { supported = true, choice = ["auto", "none"] }
reasoning = { supported = true, default = { type = "effort", value = "max" }, effort = ["low", "high", "max"] }
structured_output = true
stream_usage = true
cache = { implicit = { min_tokens = 1_024 } }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/alibaba/responses" }

[api.messages]
base_url = "https://dashscope.aliyuncs.com/apps/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/alibaba/messages" }

[cost.text.input]
price = 1.1
cache = { read = 0.275, write = 0 }

[cost.text.output]
price = 3.851
