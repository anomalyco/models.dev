# Sources (accessed 2026-09-22):
# https://help.aliyun.com/en/model-studio/model-pricing (China (Beijing) USD list prices)
# https://help.aliyun.com/en/model-studio/qwen3-5-flash (capabilities and limits)
# https://help.aliyun.com/en/model-studio/deep-thinking
# Toggle: enable_thinking true|false
# Budget: thinking_budget (integer reasoning tokens, max 81,920)
# v2 capabilities (docs for China (Beijing), accessed 2026-10-19): Chat API https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions (sampling incl. top_k, which the DeepSeek, Kimi and MiniMax series do not support; enable_thinking defaults; stream_options.include_usage);
# structured output https://www.alibabacloud.com/help/en/model-studio/json-mode; context cache https://www.alibabacloud.com/help/en/model-studio/context-cache (Beijing model lists, 1,024-token minimum, explicit: cache_control ephemeral, 5-minute TTL, up to 4 markers; tool definitions count as part of the system message, so changing tools changes the prefix).
# Not probed live (the available key is international-only), so system_updates and effort_updates are left unset where the docs are silent.
# Input MIME types: https://www.alibabacloud.com/help/en/model-studio/vision (images, video) and https://www.alibabacloud.com/help/en/model-studio/qwen-omni (audio).
# Web search: $0.573411 per 1,000 calls in China (Beijing) (agent policy, also the Responses and Anthropic web_search tool rate): https://www.alibabacloud.com/help/en/model-studio/web-search (accessed 2026-10-23).
# Tools: tool_choice auto|none on every API; no strict tool mode (sources in provider.toml).
schema = 2
name = "Qwen3.5 Flash"
description = "Qwen vision-language model for visual reasoning, documents, and agent tasks"
family = "qwen"
open_weights = false
knowledge = "2025-04"
release_date = "2026-02-23"
last_updated = "2026-09-22"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic", "video/mp4", "video/x-msvideo", "video/x-matroska", "video/quicktime", "video/x-flv", "video/x-ms-wmv"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none"] }
reasoning = { supported = true, default = { type = "toggle", value = true }, toggle = true, budget = { max = 81_920 } }
structured_output = true
temperature = true
top_p = true
top_k = true
stream_usage = true
cache = { explicit = { ttl = ["5m"], max_breakpoints = 4, targets = ["system", "messages"], min_tokens = 1_024 } }

[limit]
context = 1_000_000
output = 65_536

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/alibaba/responses" }

[api.messages]
base_url = "https://dashscope.aliyuncs.com/apps/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/alibaba/messages" }

[cost.text.input]
price = 0.029

[[cost.text.input.overrides]]
when = { context = { gt = 128_000 } }
price = 0.115

[[cost.text.input.overrides]]
when = { context = { gt = 256_000 } }
price = 0.172

[cost.text.output]
price = 0.287
reasoning = 0.287

[[cost.text.output.overrides]]
when = { context = { gt = 128_000 } }
price = 1.147
reasoning = 1.147

[[cost.text.output.overrides]]
when = { context = { gt = 256_000 } }
price = 1.72
reasoning = 1.72

[cost.web_search]
price = 0.573411
