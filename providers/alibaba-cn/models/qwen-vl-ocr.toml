# v2 capabilities (docs for China (Beijing), accessed 2026-10-19): Chat API https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions (sampling incl. top_k, which the DeepSeek, Kimi and MiniMax series do not support; enable_thinking defaults; stream_options.include_usage);
# structured output https://www.alibabacloud.com/help/en/model-studio/json-mode; context cache https://www.alibabacloud.com/help/en/model-studio/context-cache (Beijing model lists, 1,024-token minimum, explicit: cache_control ephemeral, 5-minute TTL, up to 4 markers; tool definitions count as part of the system message, so changing tools changes the prefix).
# Not probed live (the available key is international-only), so system_updates and effort_updates are left unset where the docs are silent.
# Input MIME types: https://www.alibabacloud.com/help/en/model-studio/vision (images, video) and https://www.alibabacloud.com/help/en/model-studio/qwen-omni (audio).
# Image input formats (BMP, JPEG, PNG, TIFF, WEBP, HEIC with their MIME types): https://www.alibabacloud.com/help/en/model-studio/qwen-vl-ocr (Image limits, Supported image formats).
schema = 2
name = "Qwen-VL OCR"
description = "OCR model for extracting structured text from documents and screenshots"
family = "qwen"
open_weights = false
knowledge = "2024-04"
release_date = "2024-10-28"
last_updated = "2026-09-11"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true
stream_usage = true
cache = false

[limit]
context = 34_096
output = 4_096

[cost.text.input]
price = 0.043

[cost.text.output]
price = 0.072
