# Chinese mainland deployment is tiered on input tokens per request:
# 0<Token<=128K bills at 0.172/1.032 and 128K<Token<=256K at 0.43/2.58, with
# every token in a request billed at its tier's unit price. Thinking-mode and
# non-thinking-mode output are priced the same in both bands.
# https://www.alibabacloud.com/help/en/model-studio/model-pricing (accessed 2026-08-26)
schema = 2
name = "Qwen3.5 397B-A17B"
description = "Qwen vision-language model for visual reasoning, documents, and agent tasks"
family = "qwen"
open_weights = true
knowledge = "2025-04"
release_date = "2026-02-16"

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true, budget = { max = 81_920 } }
temperature = true

[limit]
context = 262_144
output = 65_536

[cost.text.input]
price = 0.172

[[cost.text.input.overrides]]
when = { context = { gt = 128_000 } }
price = 0.43

[cost.text.output]
price = 1.032
reasoning = 1.032

[[cost.text.output.overrides]]
when = { context = { gt = 128_000 } }
price = 2.58
reasoning = 2.58
