# Sources (accessed 2026-08-04):
# https://www.qianwenai.com/models/qwen3.8-max
# https://help.aliyun.com/zh/model-studio/model-pricing (Beijing: qwen3.8-max ¥12/¥36)
# https://platform.qianwenai.com/docs/developer-guides/text-generation/thinking
# CNY→USD rate: 6.7513, 2026-08-02, source: https://www.nimbuscalc.com/calculators/financial-calculators/currency-converter/USD-CNY-2026-08-02/
# CNY list: input ¥12, output ¥36, implicit cache hit ¥1.5, explicit cache create ¥15,
# explicit cache read ¥1 (per 1M tokens).
# Toggle: enable_thinking true|false (hybrid)
# Effort: reasoning_effort = low|medium|xhigh (default xhigh); high accepted as alias → xhigh
# Budget: thinking_budget (0..262144) cannot be combined with reasoning_effort
# Pay-as-you-go on DashScope CN / 千问AI (not Token Plan only).
# v2 capabilities (docs for China (Beijing), accessed 2026-10-19): Chat API https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions (sampling incl. top_k, which the DeepSeek, Kimi and MiniMax series do not support; enable_thinking defaults; stream_options.include_usage);
# structured output https://www.alibabacloud.com/help/en/model-studio/json-mode; context cache https://www.alibabacloud.com/help/en/model-studio/context-cache (Beijing model lists, 1,024-token minimum, explicit: cache_control ephemeral, 5-minute TTL, up to 4 markers; tool definitions count as part of the system message, so changing tools changes the prefix).
# Not probed live (the available key is international-only), so system_updates and effort_updates are left unset where the docs are silent.
# Explicit cache read: CNY 1 per 1M at the rate above (https://www.qianwenai.com/models/qwen3.8-max, accessed 2026-10-23).
# Web search: $0.573411 per 1,000 calls in China (Beijing) (agent policy, also the Responses and Anthropic web_search tool rate): https://www.alibabacloud.com/help/en/model-studio/web-search (accessed 2026-10-23).
schema = 2
base_model = "alibaba/qwen3.8-max"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, default = { type = "effort", value = "xhigh" }, toggle = true, effort = ["low", "medium", "xhigh"], budget = { min = 0, max = 262_144 } }
structured_output = true
stream_usage = true
cache = { implicit = { min_tokens = 1_024 }, explicit = { ttl = ["5m"], max_breakpoints = 4, targets = ["system", "messages"], min_tokens = 1_024 } }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/alibaba/responses" }

[api.messages]
base_url = "https://dashscope.aliyuncs.com/apps/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/alibaba/messages" }

[cost.text.input]
price = 1.77744
cache = { read = 0.22218, explicit = { read = 0.14812, write = 2.22179 } }

[cost.text.output]
price = 5.33231

[cost.web_search]
price = 0.573411
