# Added as v2-only (served and listed on https://www.alibabacloud.com/help/en/model-studio/model-pricing, China (Beijing), accessed 2026-10-19).
# Capabilities: Chat API https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions; structured output https://www.alibabacloud.com/help/en/model-studio/json-mode; context cache https://www.alibabacloud.com/help/en/model-studio/context-cache (tool definitions count as part of the system message, so changing tools changes the prefix).
# Toggle: enable_thinking true|false (default on); Effort: reasoning_effort = low|medium|xhigh (default xhigh); Budget: thinking_budget 0-262144, not combinable with reasoning_effort.
# Cache: explicit and implicit (context-cache model lists); prices below.
# Web search: $0.573411 per 1,000 calls in China (Beijing) (agent policy, also the Responses and Anthropic web_search tool rate): https://www.alibabacloud.com/help/en/model-studio/web-search (accessed 2026-10-23).
# Cache prices (all input bands, same ratios per https://www.alibabacloud.com/help/en/model-studio/context-cache): implicit read 12.5%, explicit creation 125%, explicit read 8.333333% of input (https://www.qianwenai.com/models/qwen3.8-max-0902, accessed 2026-10-23).
# Tools: tool_choice auto|none|named on every API, plus required (`any`) on Anthropic Messages; no strict tool mode (sources in provider.toml).
schema = 2
v2_only = true
base_model = "alibaba/qwen3.8-max-0902"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "tool"] }
reasoning = { supported = true, default = { type = "effort", value = "xhigh" }, toggle = true, effort = ["low", "medium", "xhigh"], budget = { min = 0, max = 262_144 } }
structured_output = true
stream_usage = true
cache = { implicit = { min_tokens = 1_024 }, explicit = { ttl = ["5m"], max_breakpoints = 4, targets = ["system", "messages"], min_tokens = 1_024 } }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/alibaba/responses" }

[api.messages]
base_url = "https://dashscope.aliyuncs.com/apps/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/alibaba/messages" }
capabilities = { tools = { choice = ["auto", "none", "required", "tool"] } }

[cost.text.input]
price = 1.65
cache = { read = 0.20625, explicit = { read = 0.1375, write = 2.0625 } }

[cost.text.output]
price = 4.951

[cost.web_search]
price = 0.573411
