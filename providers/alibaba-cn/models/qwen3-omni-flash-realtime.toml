# Status: no longer listed for China (Beijing) on https://www.alibabacloud.com/help/en/model-studio/model-pricing or https://help.aliyun.com/zh/model-studio/model-pricing (accessed 2026-10-19); retired models are removed from the docs (https://www.alibabacloud.com/help/en/model-studio/model-depreciation).
# Type: realtime (WebSocket) model, not served on chat completions.
# MIME types: https://www.alibabacloud.com/help/en/model-studio/realtime — images (and video, sent as image frames) "must be JPG or JPEG"; audio in/out is raw 16-bit PCM ("pcm"), registered as audio/L16.
# API: wss://<host>/api-ws/v1/realtime?model=<id> (https://www.alibabacloud.com/help/en/model-studio/realtime)
schema = 2
type = "realtime"
name = "Qwen3-Omni Flash Realtime"
description = "Qwen omni model for text, vision, audio, and multimodal agent tasks"
family = "qwen"
open_weights = false
knowledge = "2024-04"
release_date = "2025-09-15"
status = "deprecated"

[modalities]
input = ["text", "image/jpeg", "audio/L16"]
output = ["text", "audio/L16"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true

[limit]
context = 65_536
output = 16_384

[api.realtime]
base_url = "wss://dashscope.aliyuncs.com/api-ws/v1/realtime"
sdk = { aisdk = "none", opencodeai = "none" }

[cost.text.input]
price = 0.23

[cost.text.output]
price = 0.918

[cost.audio.input]
price = 3.584

[cost.audio.output]
price = 7.168
