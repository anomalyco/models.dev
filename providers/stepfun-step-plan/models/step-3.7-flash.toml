# Sources (accessed 2026-10-21):
# - Model card (256K context, image and video input): https://platform.stepfun.com/docs/zh/guides/models/step-3.7-flash
# - Step Plan (credit subscription, no per-token price, so no [cost]): https://platform.stepfun.com/docs/zh/step-plan/overview, https://platform.stepfun.com/docs/zh/step-plan/pricing
# - Plan endpoints: POST /step_plan/v1/chat/completions and /step_plan/v1/messages (no Responses):
#   https://platform.stepfun.com/docs/zh/step-plan/integrations/reasoning-api
# - Structured output (JSON Schema): https://platform.stepfun.com/docs/zh/guides/developer/json-mode
# - Caching: automatic prefix cache from 256 tokens, no cache_control (https://platform.stepfun.com/docs/zh/guides/developer/prompt-cache); the
#   plan has its own cache-hit rate (https://platform.stepfun.com/docs/zh/announcements/step-5-preview-price-adjustment).
# Effort: reasoning_effort (Chat) and output_config.effort (Messages) = low|medium|high.
# Chat Completions returns reasoning in both `reasoning` and `reasoning_content`.
# Mid-conversation flags (system_updates, effort_updates, tools.updates) unset: undocumented, and no StepFun key to test.
schema = 2
base_model = "stepfun/step-3.7-flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
cache = { implicit = { min_tokens = 256 } }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }
