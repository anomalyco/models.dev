# Sources (accessed 2026-11-24):
# - Step Plan audio models (POST /step_plan/v1/chat/completions, text-only modalities):
#   https://platform.stepfun.com/docs/zh/step-plan/integrations/audio-api
# - Step Plan (credit subscription, no per-token price, so no [cost]): https://platform.stepfun.com/docs/zh/step-plan/pricing
# - Caching: StepFun's prefix cache starts at 256 tokens (https://platform.stepfun.com/docs/zh/guides/developer/prompt-cache).
# max_tokens_field: StepFun's Chat Completions API documents max_tokens and not max_completion_tokens (https://platform.stepfun.com/docs/zh/api-reference/chat/chat-completion-create, accessed 2026-10-24)
schema = 2
base_model = "stepfun/stepaudio-2.5-chat"

[capabilities]
cache = { implicit = { min_tokens = 256 } }

[api.chat-completions]
compatibility = { max_tokens_field = "max_tokens" }
