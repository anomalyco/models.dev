# POST .../endpoints/openapi/chat/completions with model, messages, max_tokens,
# stream, and extra_body.google.model_safety_settings; no reasoning control documented.
# https://cloud.google.com/vertex-ai/generative-ai/docs/partner-models/llama/use-llama (accessed 2026-06-25)
# Mid-conversation updates: false. The Vertex OpenAI-compatible endpoint (endpoints/openapi) documents no in-place
# system message, per-turn effort, or tool-change mechanism: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/maas/call-open-model-apis
schema = 2
name = "Llama 3.3 70B Instruct"
description = "Open Llama instruction model for multilingual chat, reasoning, and coding"
family = "llama"
open_weights = true
knowledge = "2023-12"
release_date = "2025-04-29"
status = "deprecated"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = false }
structured_output = true
temperature = true
system_updates = false
effort_updates = false

[limit]
context = 128_000
output = 8_192

[api.chat-completions]
base_url = "https://${GOOGLE_VERTEX_ENDPOINT}/v1/projects/${GOOGLE_VERTEX_PROJECT}/locations/${GOOGLE_VERTEX_LOCATION}/endpoints/openapi"
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/google-vertex/chat" }

[cost.text.input]
price = 0.72

[cost.text.output]
price = 0.72
