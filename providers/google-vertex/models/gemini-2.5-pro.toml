# Structured output: "Supported" (model page), and responseSchema verified live 2026-10-08.
# Retires 2026-10-20: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/model-versions
# https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/2-5-pro
# v2 capabilities and prices:
# - https://cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing
# - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/context-cache/context-cache-overview
# - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/priority-paygo
# Explicit cache storage is per 1M tokens per hour and isn't scaled by tier, region, or date.
# Mid-conversation updates: false. Vertex takes system instructions, thinking config and tools only as request-level
# fields (systemInstruction, generationConfig.thinkingConfig, tools; Content.role is user or model): https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/prompts/system-instruction-introduction
# Input MIME types ("Supported MIME types" per modality): https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/2-5-pro
# The documented text/plain document type is covered by `text`.
# Grounding with Google Search: $35 per 1,000 grounded prompts (one charge per prompt, however many queries it runs). Price: https://cloud.google.com/vertex-ai/generative-ai/pricing; support (supported models list): https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/grounding/grounding-with-google-search
schema = 2
base_model = "google/gemini-2.5-pro"
status = "deprecated"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "audio/x-aac", "audio/flac", "audio/mp3", "audio/m4a", "audio/mpeg", "audio/mpga", "audio/mp4", "audio/ogg", "audio/pcm", "audio/wav", "audio/webm", "video/x-flv", "video/quicktime", "video/mpeg", "video/mpegs", "video/mpg", "video/mp4", "video/webm", "video/wmv", "video/3gpp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, budget = { min = 128, max = 32_768 } }
structured_output = true
system_updates = false
effort_updates = false
cache = { supported = true, implicit = { min_tokens = 2_048 }, explicit = { min_tokens = 2_048 } }
service_tier = ["priority"]

[cost.text.input]
price = 1.25
cache = { read = 0.125, storage = 4.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 2.5
cache = { read = 0.25 }

[cost.text.output]
price = 10

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 15

[cost.web_search]
price = 35

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = { text = { input = { price = 1.8, cache = { read = 1.8 } }, output = 1.8 } }
