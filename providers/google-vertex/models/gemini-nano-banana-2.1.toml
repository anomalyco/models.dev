# Sources:
# - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/nano-banana-2-1
# - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/thinking (thinking_level MINIMAL, MEDIUM, HIGH)
# - https://cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing (text output $7.50; image output $30)
# v2 capabilities and prices:
# - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/context-cache/context-cache-overview
# - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/priority-paygo
# text.output keeps the image output price that v1 `output` carries; cost.image.output is the real image price.
# Mid-conversation updates: false. Vertex takes system instructions, thinking config and tools only as request-level
# fields (systemInstruction, generationConfig.thinkingConfig, tools; Content.role is user or model): https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/prompts/system-instruction-introduction
# Input MIME types ("Supported MIME types" per modality): https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/nano-banana-2-1
# The documented text/plain document type is covered by `text`.
# PDF input is documented on the model page (the lab entry lists text, image and video).
# Grounding with Google Search: $14 per 1,000 grounding queries (each query the model runs is billed). Price: https://cloud.google.com/vertex-ai/generative-ai/pricing; support (supported models list): https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/grounding/grounding-with-google-search
# Token-only multipliers (object factor, so cost.web_search is unscaled): Priority PayGo (https://cloud.google.com/vertex-ai/generative-ai/docs/priority-paygo).
schema = 2
base_model = "google/gemini-nano-banana-2.1"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "video/x-flv", "video/quicktime", "video/mpeg", "video/mpegs", "video/mpg", "video/mp4", "video/webm", "video/wmv", "video/3gpp", "application/pdf"]
output = ["text", "image/png", "image/jpeg"]

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "medium" }, effort = ["minimal", "medium", "high"] }
structured_output = false
cache = { implicit = true }
service_tier = ["priority"]

[api.images]
sdk = { opencodeai = "@opencode/ai/providers/google-vertex/images" }

[api.generate-content]

[cost.text.input]
price = 1.5
cache = { read = 0.15 }

[cost.text.output]
price = 30

[cost.image.output]
price = 30

[cost.web_search]
price = 14

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = { text = 1.8, image = 1.8 }
