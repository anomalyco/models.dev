# Sources:
# - https://cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing
# - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/4-hydrogen
# - https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-hydrogen/
# Live check 2026-11-12: not possible (no Vertex credentials with predict access here); values below come from Google's docs. Thinking levels LOW, MEDIUM, HIGH (default), XHIGH; thinking_budget and MINIMAL return HTTP 400 (model page, "Hydrogen differs from earlier Gemini models").
# Global-endpoint Standard pricing $1.50 input, $7.50 output, $0.075 cache read, flat (no promotion). Non-global (us, eu) endpoints cost 10% more ($1.65 / $8.25 / $0.0825). Priority is $2.70 / $13.50 / $0.135 global (1.8x).
# Cache writes ($1.875 global per 1M input tokens, 1.25x) are billed only from 2027-01-12 and are not modelled.
# v2 capabilities and prices:
# - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/context-cache/context-cache-overview
# - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/thinking
# - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/priority-paygo
# Non-global (regional and us/eu multi-region) endpoints cost 10% more than global.
# Mid-conversation updates: false. Vertex takes system instructions, thinking config and tools only as request-level
# fields (systemInstruction, generationConfig.thinkingConfig, tools; Content.role is user or model): https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/prompts/system-instruction-introduction
# Input MIME types ("Supported MIME types" per modality): https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/4-hydrogen
# The documented text/plain document type is covered by `text`.
# Grounding with Google Search: $14 per 1,000 grounding queries (each query the model runs is billed). Price: https://cloud.google.com/vertex-ai/generative-ai/pricing; support (supported models list): https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/grounding/grounding-with-google-search
# Token-only multipliers (object factor, so cost.web_search is unscaled): Priority PayGo (https://cloud.google.com/vertex-ai/generative-ai/docs/priority-paygo); the scheduled increase is to token rates (https://cloud.google.com/vertex-ai/generative-ai/pricing); non-global region: Vertex bills Grounding with Google Search as a separate per-query SKU ($14 per 1,000 grounding queries) that these tiers don't scale (https://cloud.google.com/vertex-ai/generative-ai/pricing).
# APIs: generateContent, and Interactions (https://docs.cloud.google.com/gemini-enterprise-agent-platform/reference/models/interactions-api lists this model; global location only).
# tools.strict/choice: function_calling_config modes AUTO, ANY, NONE and VALIDATED ("ensures function schema adherence", which strict tools map to); ANY with allowed_function_names forces a tool: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/tools/function-calling#function-calling-modes
schema = 2
base_model = "google/gemini-4-hydrogen"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "video/x-flv", "video/quicktime", "video/mpeg", "video/mpegs", "video/mpg", "video/mp4", "video/webm", "video/wmv", "video/3gpp", "audio/x-aac", "audio/flac", "audio/mp3", "audio/m4a", "audio/mpeg", "audio/mpga", "audio/mp4", "audio/ogg", "audio/pcm", "audio/wav", "audio/webm", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, default = { type = "effort", value = "high" }, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
cache = { implicit = { min_tokens = 4_096 } }
service_tier = ["priority"]

[api.generate-content]

[api.interactions]
base_url = "https://aiplatform.googleapis.com/v1beta1/projects/${GOOGLE_VERTEX_PROJECT}/locations/global"
sdk = { opencodeai = "@opencode/ai/providers/google-vertex/interactions" }

[cost.text.input]
price = 1.5
cache = { read = 0.075 }

[cost.text.output]
price = 7.5

[cost.audio.input]
price = 1.5
cache = { read = 0.075 }

[cost.web_search]
price = 14

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = { text = 1.8, audio = 1.8 }

[[cost.multipliers]]
when = { not = { region = { equals = "global" } } }
factor = { text = 1.1, audio = 1.1 }
