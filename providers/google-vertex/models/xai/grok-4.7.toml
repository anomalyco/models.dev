# Sources:
# - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/partner-models/grok/grok-4-7
# - https://cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing
# Effort: reasoning_effort = low|medium|high, matching grok-4.6 on this endpoint (which rejects xhigh).
base_model = "xai/grok-4.7"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high"] }]
status = "beta"

[cost]
input = 2
output = 6
cache_read = 0.5

[[cost.tiers]]
tier = { type = "context", size = 200_000 }
input = 4
output = 12
cache_read = 1

[limit]
context = 524_288

[modalities]
input = ["text", "image"]

[provider]
npm = "@ai-sdk/openai-compatible"
api = "https://${GOOGLE_VERTEX_ENDPOINT}/v1/projects/${GOOGLE_VERTEX_PROJECT}/locations/${GOOGLE_VERTEX_LOCATION}/endpoints/openapi"
