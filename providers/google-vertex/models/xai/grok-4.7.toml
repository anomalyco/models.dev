# Sources:
# - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/partner-models/grok/grok-4-7
# - https://cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing
# Effort: reasoning_effort = low|medium|high, matching grok-4.6 on this endpoint (which rejects xhigh).
# Automatic caching: billed at a cache-hit price with no cache API (https://cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing).
# Inputs: Text, Image (no PDF): https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/partner-models/grok/grok-4-7
# Image formats (jpg/jpeg, png): https://docs.x.ai/developers/models
# Mid-conversation updates: false. The Vertex OpenAI-compatible endpoint (endpoints/openapi) documents no in-place
# system message, per-turn effort, or tool-change mechanism: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/maas/call-open-model-apis
# APIs: Chat Completions and Responses on the endpoints/openapi path (https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/partner-models/grok/responses).
schema = 2
base_model = "xai/grok-4.7"
status = "beta"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 524_288

[api.chat-completions]
base_url = "https://${GOOGLE_VERTEX_ENDPOINT}/v1/projects/${GOOGLE_VERTEX_PROJECT}/locations/${GOOGLE_VERTEX_LOCATION}/endpoints/openapi"
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/google-vertex/chat" }

[api.responses]
base_url = "https://${GOOGLE_VERTEX_ENDPOINT}/v1/projects/${GOOGLE_VERTEX_PROJECT}/locations/${GOOGLE_VERTEX_LOCATION}/endpoints/openapi"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/google-vertex/responses" }

[cost.text.input]
price = 2
cache = { read = 0.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 4
cache = { read = 1 }

[cost.text.output]
price = 6

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 12
