# Sources:
# - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/partner-models/grok/grok-4-6
# - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/partner-models/grok/capabilities/reasoning
# - https://cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing
# Effort: reasoning_effort = low|medium|high. Live test 2026-10-08 on the global endpoint: reasoning tokens
# unset 3409, low 495, high 6180. The endpoint rejects xhigh and none. The reasoning page claim that Grok
# reasoning models ignore reasoning_effort holds for grok-4.20 and grok-4.1-fast, not grok-4.6.
# Automatic caching: billed at a cache-hit price with no cache API (https://cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing).
# Mid-conversation updates: false. The Vertex OpenAI-compatible endpoint (endpoints/openapi) documents no in-place
# system message, per-turn effort, or tool-change mechanism: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/maas/call-open-model-apis
schema = 2
base_model = "xai/grok-4.6"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
system_updates = false
effort_updates = false
cache = { supported = true, implicit = true }

[limit]
context = 524_288

[api.chat-completions]
base_url = "https://${GOOGLE_VERTEX_ENDPOINT}/v1/projects/${GOOGLE_VERTEX_PROJECT}/locations/${GOOGLE_VERTEX_LOCATION}/endpoints/openapi"
sdk = { aisdk = "@ai-sdk/openai-compatible" }

[cost.text.input]
price = 2
cache = { read = 0.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 4
cache = { read = 1 }

[cost.text.output]
price = 6

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 12
