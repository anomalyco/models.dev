# Source: https://cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing
# Toggle: chat_template_kwargs.thinking = true|false (reasoning is off by default).
# https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/maas/capabilities/thinking (accessed 2026-10-08)
# Thinking text is returned inline in content, ending with </think>.
name = "DeepSeek V3.1"
description = "DeepSeek chat model for instruction following, coding, and analysis"
family = "deepseek"
release_date = "2025-08-28"
last_updated = "2025-08-28"
attachment = false
reasoning = true
reasoning_options = [{ type = "toggle" }]
temperature = true
tool_call = true
structured_output = true
open_weights = true
status = "deprecated"

[cost]
input = 0.60
output = 1.70
cache_read = 0.06

[limit]
context = 163_840
output = 32_768

[modalities]
input = ["text"]
output = ["text"]

[provider]
npm = "@ai-sdk/openai-compatible"
api = "https://${GOOGLE_VERTEX_ENDPOINT}/v1/projects/${GOOGLE_VERTEX_PROJECT}/locations/${GOOGLE_VERTEX_LOCATION}/endpoints/openapi"
