# Source: https://cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing
# Toggle: chat_template_kwargs.thinking = true|false (reasoning is off by default).
# https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/maas/capabilities/thinking (accessed 2026-10-08)
# Thinking text is returned inline in content, ending with </think>.
# Implicit caching (4,096-token minimum): https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/maas/use-open-models#context-caching
# Mid-conversation updates: false. The Vertex OpenAI-compatible endpoint (endpoints/openapi) documents no in-place
# system message, per-turn effort, or tool-change mechanism: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/maas/call-open-model-apis
schema = 2
name = "DeepSeek V3.1"
description = "DeepSeek chat model for instruction following, coding, and analysis"
family = "deepseek"
open_weights = true
release_date = "2025-08-28"
status = "deprecated"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true }
structured_output = true
temperature = true
cache = { implicit = { min_tokens = 4_096 } }

[limit]
context = 163_840
output = 32_768

[api.chat-completions]
base_url = "https://${GOOGLE_VERTEX_ENDPOINT}/v1/projects/${GOOGLE_VERTEX_PROJECT}/locations/${GOOGLE_VERTEX_LOCATION}/endpoints/openapi"
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/google-vertex/chat" }

[cost.text.input]
price = 0.6
cache = { read = 0.06 }

[cost.text.output]
price = 1.7
