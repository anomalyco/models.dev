# The Instruct-2507 variant does not think (model card: "Thinking: Not supported").
# https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/maas/qwen/qwen3-235b (accessed 2026-10-08)
# Not in the open-model implicit caching list: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/maas/use-open-models#context-caching
# Mid-conversation updates: false. The Vertex OpenAI-compatible endpoint (endpoints/openapi) documents no in-place
# system message, per-turn effort, or tool-change mechanism: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/maas/call-open-model-apis
# tools.choice: auto and none (Vertex recommends setting one of them explicitly for Qwen): https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/maas/capabilities/function-calling#model-specific-guidance
schema = 2
name = "Qwen3 235B A22B Instruct"
description = "Qwen instruction model for multilingual chat, reasoning, and tool use"
family = "qwen"
open_weights = true
release_date = "2025-08-13"
status = "deprecated"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none"] }
reasoning = { supported = false }
structured_output = true
temperature = true
cache = false

[limit]
context = 262_144
output = 16_384

[api.chat-completions]
base_url = "https://${GOOGLE_VERTEX_ENDPOINT}/v1/projects/${GOOGLE_VERTEX_PROJECT}/locations/${GOOGLE_VERTEX_LOCATION}/endpoints/openapi"
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/google-vertex/chat" }

[cost.text.input]
price = 0.22

[cost.text.output]
price = 0.88
