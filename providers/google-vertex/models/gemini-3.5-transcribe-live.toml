# Sources (accessed 2026-11-25):
# - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/3-5-transcribe (model IDs, Live API streaming; global, us and eu; Standard PayGo only)
# - https://cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing (Gemini 3.5 Transcribe Live: $3.50 audio input, $21.00 text output per 1M tokens; only final committed tokens are billed)
# The model page gives no token limits, so limits come from the base model. Input is audio only; the v1 converter
# needs a text input price, so text input repeats the audio rate, as in the google provider's file.
# Live API WebSocket: wss://{HOST}/ws/google.cloud.aiplatform.v1.LlmBidiService/BidiGenerateContent (https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/live-api/start-manage-session).
# The host comes from GOOGLE_VERTEX_ENDPOINT, as for the Interactions files, because this model runs on the global
# endpoint and the us and eu multi-regions (model page), not on single regions. No @opencode/ai entry point
# speaks the Live API, so opencodeai = "none".
schema = 2
v2_only = true
base_model = "google/gemini-3.5-transcribe-live"

[capabilities]
structured_output = false
cache = false

[api.bidi-generate-content]
base_url = "wss://${GOOGLE_VERTEX_ENDPOINT}/ws/google.cloud.aiplatform.v1.LlmBidiService"
path = "/BidiGenerateContent"
sdk = { opencodeai = "none" }

[cost.text.input]
price = 3.5

[cost.text.output]
price = 21

[cost.audio.input]
price = 3.5
