# Sources (accessed 2026-11-10):
# - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/omni-flash-preview.md.txt (model ID, limits, MIME types, APIs, global-only location)
# - https://cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing (Gemini Omni, global: $1.50 input, $9.00 text output, $17.50 video output)
# Interactions API only (GenerateContent is documented as not supported). Global location only.
# opencodeai = "none": Omni outputs video, and @opencode/ai's Interactions client handles text output only.
# Output: v1 output carries the video rate, like the google Omni files.
# Documented as deprecated (Nov 6, 2026) and Preview (Pre-GA). Its page lists Pay-as-you-go as not supported but Standard PayGo global under regions; added as documented.
schema = 2
v2_only = true
base_model = "google/gemini-omni-flash-preview"
status = "deprecated"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "video/x-flv", "video/quicktime", "video/mpeg", "video/mpegs", "video/mpg", "video/mp4", "video/webm", "video/wmv", "video/3gpp"]
output = ["video/mp4"]

[capabilities]
reasoning = { supported = true }
temperature = true

[limit]
context = 131_072
output = 57_920

[api.interactions]
base_url = "https://aiplatform.googleapis.com/v1beta1/projects/${GOOGLE_VERTEX_PROJECT}/locations/global"
sdk = { opencodeai = "none" }

[cost.text.input]
price = 1.5

[cost.text.output]
price = 17.5

[cost.video.output]
price = 17.5
