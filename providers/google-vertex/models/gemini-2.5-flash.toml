# Source: https://cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing
# Structured output: "Supported" (model page), and responseSchema verified live 2026-10-08. Retires 2026-10-20.
# https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/2-5-flash
# v2 capabilities and prices:
# - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/context-cache/context-cache-overview
# - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/thinking
# - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/priority-paygo
# Explicit cache storage is per 1M tokens per hour and isn't scaled by tier, region, or date.
# Mid-conversation updates: false. Vertex takes system instructions, thinking config and tools only as request-level
# fields (systemInstruction, generationConfig.thinkingConfig, tools; Content.role is user or model): https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/prompts/system-instruction-introduction
# Input MIME types ("Supported MIME types" per modality): https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/2-5-flash
# The documented text/plain document type is covered by `text`.
schema = 2
name = "Gemini 2.5 Flash"
description = "Fast Gemini model balancing multimodal reasoning, tool use, and cost"
family = "gemini-flash"
open_weights = false
knowledge = "2025-01"
release_date = "2025-06-17"
status = "deprecated"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "audio/x-aac", "audio/flac", "audio/mp3", "audio/m4a", "audio/mpeg", "audio/mpga", "audio/mp4", "audio/ogg", "audio/pcm", "audio/wav", "audio/webm", "video/x-flv", "video/quicktime", "video/mpeg", "video/mpegs", "video/mpg", "video/mp4", "video/webm", "video/wmv", "video/3gpp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, default = { type = "toggle", value = true }, toggle = true, budget = { min = 0, max = 24_576 } }
structured_output = true
temperature = true
system_updates = false
effort_updates = false
cache = { supported = true, implicit = { min_tokens = 2_048 }, explicit = { min_tokens = 2_048 } }
service_tier = ["priority"]

[limit]
context = 1_048_576
output = 65_536

[cost.text.input]
price = 0.3
cache = { read = 0.03, storage = 1 }

[cost.text.output]
price = 2.5

[cost.audio.input]
price = 1
cache = { read = 0.1, storage = 1 }

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = { text = { input = { price = 1.8, cache = { read = 1.8 } }, output = 1.8 }, audio = { input = { price = 1.8, cache = { read = 1.8 } } } }
