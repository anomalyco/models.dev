# Kimchi-hosted DeepSeek V4 Flash (0731 snapshot).
#
# Pricing per 1M tokens (USD), source:
#   https://docs.kimchi.dev/docs/model-apis-pricing (accessed 2026-10-20).
#
# Verified 2026-10-20 against https://llm.kimchi.dev/openai/v1 with a live
# API key. Each capability flag below maps to a curl test documented in this
# header; the public Kimchi docs do not document reasoning-control, prompt
# cache, or mid-conversation semantics, so the doc citations are limited to
# model availability and endpoint shape.
#
# Model availability (documented):
#   https://docs.kimchi.dev/docs/model-apis-overview lists `deepseek-v4-flash-0731`
#   under "Available models" with a 1M-token context window. GET /v1/models
#   on the live relay returns the same model ID with owned_by="castai".
#
# Endpoint shape (documented):
#   https://docs.kimchi.dev/docs/model-apis-overview states the relay is
#   OpenAI-compatible and routes POST /v1/chat/completions to the requested
#   model. https://docs.kimchi.dev/docs/inference-quickstart shows the base
#   curl pattern (POST to /openai/v1/chat/completions with bearer auth).
#
# Alias check:
#   The alias `deepseek-v4-flash` is rejected with:
#     Model "deepseek-v4-flash" is no longer available.
#     Use "deepseek-v4-flash-0731" instead.
#
# Reasoning wire (live-verified; not documented):
#   The relay accepts exactly one request field, `reasoning_effort`, with the
#   enum `none | minimal | low | medium | high | xhigh | max` (obtained from
#   a Pydantic validation error returned for `reasoning_effort = ""`).
#   `reasoning_effort = "none"` returns no reasoning_content; any other value
#   returns reasoning_content. Omitting the field behaves the same as "none".
#   So the effort enum is the on/off axis: there is no separate toggle field.
#   The catalog effort set is ["none", "low", "high", "max"]. The other
#   values ("minimal", "medium", "xhigh") are accepted by the relay but their
#   per-level effect is not independently verified (per-effort
#   reasoning_content length on a fixed prompt was non-monotonic: 181, 110,
#   210, 93, 103, 210 across minimal->xhigh, suggesting the relay buckets
#   into upstream DeepSeek levels rather than giving each value its own
#   effect). Consumers should treat the catalog set as the canonical levels;
#   the wider enum is accepted-but-unmapped.
#
# Default behavior (live-verified): with no `reasoning_effort` sent, the
# response contains no reasoning_content (finish_reason="stop",
# content-only). Hence `default = { type = "effort", value = "none" }`.
#
# Streaming (live-verified): `stream: true` emits `chat.completion.chunk`
# events with both `delta.reasoning_content` and `delta.content` populated
# as separate fields.
#
# Tools (live-verified):
#   - tools supported: `tools = [...]` request param returns `tool_calls`
#     with name + JSON arguments on `choices[0].message.tool_calls`.
#   - tools.updates = true: tool addition mid-conversation accepted, and
#     the prompt-prefix cache survives. Verified by sending the same big
#     system+user prefix (cached_tokens=768), then adding a second tool
#     definition on the next turn (cached_tokens became 1024, confirming
#     the original 768-token prefix was still cached).
#
# Structured output (live-verified): `response_format = {"type": "json_object"}`
# returns a parseable JSON object.
#
# Mid-conversation updates (live-verified, with cache-preservation probe):
#   - system_updates = true: inserting a new `system` message between turns
#     is accepted, and the original 768-token prompt-prefix cache is
#     preserved (cached_tokens stayed at 768).
#   - effort_updates = false: switching `reasoning_effort` between turns is
#     accepted, but cached_tokens drops from 768 to 0 (upstream DeepSeek
#     invalidates the cache on effort change). Matches DeepSeek first-party's
#     effort_updates = false.
#
# Cache (live-verified; not documented): the relay reports
# `usage.prompt_tokens_details.cached_tokens` on repeated prompts above an
# observed ~900-token threshold. Two identical back-to-back calls both
# returned cached_tokens=768; a third call immediately after returned 0
# (short eviction window). No explicit `cache_control` block is sent by the
# client, so this is implicit only (`implicit = true`, `explicit = false`).
# Cache read pricing per the Kimchi pricing page is $0.07 / 1M tokens (no
# write price published).
#
# top_k (inherited): the relay accepts the `top_k` request parameter (no
# error), but acceptance alone does not prove the upstream honors it.
# Inheriting `top_k = true` from the lab file is the conservative call per
# the override-only convention.
schema = 2
base_model = "deepseek/deepseek-v4-flash-0731"

[capabilities]
tools = { supported = true, updates = true }
reasoning = { supported = true, default = { type = "effort", value = "none" }, effort = ["none", "low", "high", "max"] }
structured_output = true
system_updates = true
effort_updates = false
cache = { supported = true, implicit = true, explicit = false }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.14
cache = { read = 0.07 }

[cost.text.output]
price = 0.28
