# Pricing per 1M tokens (USD), source:
# https://docs.kimchi.dev/docs/model-apis-pricing (accessed 2026-10-20).
# Implicit prompt cache, no write price.
# Same minimal verified relay shape as deepseek-v4-flash (see that file's
# header). 0731 is a snapshot of the same Kimchi relay deployment, so the
# reasoning surface is identical. Cite a Kimchi reasoning-control doc
# before extending.
schema = 2
base_model = "deepseek/deepseek-v4-flash-0731"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true, effort = ["high", "max"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.14
cache = { read = 0.07 }

[cost.text.output]
price = 0.28
