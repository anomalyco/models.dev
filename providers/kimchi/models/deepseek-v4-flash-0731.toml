# Kimchi-hosted DeepSeek V4 Flash (0731 snapshot).
#
# Pricing per 1M tokens (USD), source:
#   https://docs.kimchi.dev/docs/model-apis-pricing (accessed 2026-10-20).
#
# Verified 2026-10-20 against https://llm.kimchi.dev/openai/v1 with a live
# API key. Each capability flag below maps to a curl test in this header.
#
# Models endpoint:
#   GET /v1/models returns `deepseek-v4-flash-0731` (owned_by=castai). The
#   alias `deepseek-v4-flash` is rejected with:
#     Model "deepseek-v4-flash" is no longer available.
#     Use "deepseek-v4-flash-0731" instead.
#   so it is not added as a separate provider entry.
#
# Reasoning wire (single control field, no separate toggle):
#   The relay accepts exactly one request field, `reasoning_effort`, with the
#   enum `none | minimal | low | medium | high | xhigh | max` (obtained from a
#   Pydantic validation error returned for `reasoning_effort = ""`). Setting
#   `reasoning_effort = "none"` returns no reasoning_content; any other value
#   returns reasoning_content. Omitting the field behaves the same as "none".
#   So: effort values are the on/off axis; there is no separate toggle field.
#   Per-effort reasoning_content length on a fixed test prompt
#   ("What is 12 squared? Show your reasoning briefly then give the number.",
#   max_tokens=500):
#     none     -> 0    chars
#     minimal  -> 181  chars
#     low      -> 110  chars
#     medium   -> 210  chars
#     high     -> 93   chars
#     xhigh    -> 103  chars
#     max      -> 210  chars
#   The length varies by prompt; the enum values themselves are the verified
#   surface, not the per-effort length (length is reported for evidence only).
#
# Default behavior (verified): with no `reasoning_effort` sent, the response
# contains no reasoning_content (finish_reason="stop", content-only). So
# the default in this file is `effort = "none"`.
#
# Streaming (verified): `stream: true` emits `chat.completion.chunk` events
# with both `delta.reasoning_content` and `delta.content` populated as
# separate fields.
#
# Tools (verified): `tools = [...]` request param returns `tool_calls` with
# `name` + JSON `arguments` on `choices[0].message.tool_calls`. Mid-conversation
# tool addition works (call 2 with an added tool still produced the expected
# tool call, no 4xx), so `updates = true`.
#
# Structured output (verified): `response_format = {"type": "json_object"}`
# returns a parseable JSON object. No schema constraints verified beyond the
# `type` field.
#
# Mid-conversation updates (verified): switching `reasoning_effort` between
# turns is accepted (`effort_updates = true`). Inserting a new `system`
# message mid-conversation is accepted (`system_updates = true`).
#
# Cache (verified): the relay reports `usage.prompt_tokens_details.cached_tokens`
# on repeated prompts, but only when the prompt crosses an internal threshold
# (~1024 tokens observed; a 312-token prompt returned null). No explicit
# `cache_control` block is sent by the client, so this is implicit only
# (`cache = { implicit = true, explicit = false }`). Cache read pricing per
# the Kimchi pricing page is $0.07 / 1M tokens (no write price published).
schema = 2
base_model = "deepseek/deepseek-v4-flash-0731"

[capabilities]
tools = { supported = true, updates = true }
reasoning = { supported = true, default = { type = "effort", value = "none" }, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
top_k = true
system_updates = true
effort_updates = true
cache = { supported = true, implicit = true, explicit = false }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.14
cache = { read = 0.07 }

[cost.text.output]
price = 0.28
