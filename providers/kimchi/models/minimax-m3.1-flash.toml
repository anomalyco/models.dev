# Sync: https://api.cast.ai/ai-optimizer/v1beta/model-prices; prices are USD per million tokens.
# Feed owns roster, cap bounds, tool/reasoning support and image input kinds.
# Effort: top-level reasoning_effort=low|medium|high|xhigh|max; side channel: reasoning_content.
# Model-specific controls verified 2026-11-25.
schema = 2
base_model = "minimax/MiniMax-M3.1-Flash"
name = "MiniMax M3.1 Flash"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.15
cache = { read = 0.015 }

[cost.text.output]
price = 0.6
