# Sync: https://api.cast.ai/ai-optimizer/v1beta/model-prices; prices are USD per million tokens.
# Feed owns roster, cap bounds, tool/reasoning support and image input kinds.
# Effort: top-level reasoning_effort=low|medium|high|xhigh; side channel: reasoning_content.
# Model-specific controls verified 2026-11-25.
schema = 2
base_model = "meta/muse-spark-open"
name = "Muse-Spark-Open-816B-A42B-NVFP4"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.25
cache = { read = 0.15 }

[cost.text.output]
price = 4.25
