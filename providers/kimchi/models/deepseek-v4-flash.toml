# Pricing per 1M tokens (USD), source:
# https://docs.kimchi.dev/docs/model-apis-pricing (accessed 2026-10-20).
# Implicit prompt cache, no write price.
# Reasoning wire field: reasoning_content (OpenAI-compatible Chat Completions
# extended delta, same shape DeepSeek first-party returns).
# Toggle: `reasoning_content` is present in the response stream when the model
# is in thinking mode; the Kimchi relay forwards DeepSeek's wire unchanged
# so the toggle maps to the upstream `thinking.type` knob via a host-side
# adaptation (Kimchi does not expose its own reasoning_effort selector at
# this surface; effort is upstream-controlled).
# Effort levels exposed by the relay: low/high/max (matches DeepSeek first-party).
schema = 2
base_model = "deepseek/deepseek-v4-flash"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, default = { type = "effort", value = "high" }, toggle = true, effort = ["low", "high", "max"] }
structured_output = true
top_k = false
system_updates = true
effort_updates = false
cache = { supported = true, implicit = true, explicit = false }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.14
cache = { read = 0.07 }

[cost.text.output]
price = 0.28
