# Pricing per 1M tokens (USD), source:
# https://docs.kimchi.dev/docs/model-apis-pricing (accessed 2026-10-20).
# Implicit prompt cache, no write price.
# Reasoning shape mirrors providers/alibaba-cn/models/deepseek-v4-flash.toml
# (the minimal verified relay shape for the same base model). Kimchi's
# OpenAI-compatible relay forwards DeepSeek's wire (per the Kimchi Inference
# overview at https://docs.kimchi.dev/docs/model-apis-overview), so the
# toggle + effort levels below match DeepSeek first-party's published
# reasoning surface; cite a Kimchi reasoning-control doc before extending.
schema = 2
base_model = "deepseek/deepseek-v4-flash"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true, effort = ["high", "max"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.14
cache = { read = 0.07 }

[cost.text.output]
price = 0.28
