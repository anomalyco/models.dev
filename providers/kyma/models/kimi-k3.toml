# Toggle: reasoning_effort = "none" disables thinking.
# Effort: reasoning_effort = low|high|max selects depth when enabled.
base_model = "moonshotai/kimi-k3"

reasoning_options = [{ type = "toggle" }, { type = "effort", values = ["low", "high", "max"] }]

