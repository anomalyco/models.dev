# Toggle: enable_thinking true|false (default on)
# Effort: reasoning_effort = low|medium|xhigh (default xhigh)
# Budget: thinking_budget (integer reasoning tokens)
# Price: https://www.stepping-stone.ch/en/products/artificial-intelligence/ai-on-demand-powered-by-qwen
# 0.2500 / 0.0510 / 1.5000 CHF/MTok (input / cache / output), converted at 1.19 USD per 1.00 CHF (market exchange rate, 2026-10-14).
# Context: gateway max_model_len 262144 matches the lab's 262,144 — no override
# (https://wiki.stoney-cloud.com/wiki/AI_on_demand:_Qwen/Qwen3.8-27B).
schema = 2
base_model = "alibaba/qwen3.8-27b"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "xhigh" }, toggle = true, effort = ["low", "medium", "xhigh"], budget = {} }

[cost.text.input]
price = 0.2975
cache = { read = 0.0607 }

[cost.text.output]
price = 1.785
