# Hetzner Inference API (https://inference.hetzner.com/v1, OpenAI Chat Completions).
# Verified against GET /v1/models with an API key (2026-11-11): id "zai-org/GLM-5.3-Flash"
#   (alias "z-ai/glm-5.3-flash" points to the same deployment), max_model_len 1048576.
# Probed with an API key (2026-11-12): image input (image_url), tool calling, json_object and
#   strict json_schema response formats, reasoning_content and reasoning_effort all accepted.
#   Video and PDF input were not tested, so only text and common image types are listed.
# Pricing is not published yet and is left out on purpose; it will be added in a follow-up PR.
schema = 2
base_model = "zhipuai/glm-5.3-flash"
name = "GLM-5.3-Flash"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp"]
output = ["text"]

[capabilities]
structured_output = true

[limit]
context = 1_048_576


[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]
