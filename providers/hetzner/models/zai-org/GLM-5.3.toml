# Hetzner Inference API (https://inference.hetzner.com/v1, OpenAI Chat Completions).
# Verified against GET /v1/models with an API key (2026-11-11): id "zai-org/GLM-5.3"
#   (alias "z-ai/glm-5.3" points to the same deployment), max_model_len 1048576.
# Probed with an API key (2026-11-12): tool calling, json_object and strict json_schema response
#   formats, reasoning output and reasoning_effort all accepted.
# Pricing is not published yet and is left out on purpose; it will be added in a follow-up PR.
# Reasoning (2026-11-13): responses carry it in `reasoning`; prior turns' `reasoning_content` (and `reasoning`) are read back
#   from the message history (prompt_tokens 30 -> 611 with a ~580-token reasoning text).
schema = 2
base_model = "zhipuai/glm-5.3"

[capabilities]
structured_output = true
reasoning = { supported = true, effort = ["low", "high", "max"] }

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

