# Verified live on POST https://api.axforge.ai/v1/chat/completions 2026-11-16: no reasoning_content by default,
# present with enable_thinking = true or a reasoning_effort level.
# No cost: our prices are in EUR and follow a live price sheet, https://axforge.ai/pricing/
schema = 2
base_model = "alibaba/qwen3.8-flash-next"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, default = { type = "toggle", value = false }, toggle = true, effort = ["low", "medium", "high"] }

[limit]
