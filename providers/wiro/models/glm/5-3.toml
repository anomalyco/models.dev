# Source: https://llm.wiro.ai/v1/models (fetched 2026-11-08), https://wiro.ai/models/glm/5-3
# and https://wiro.ai/docs/completions-api
# Upstream: x_wiro.pricing_source.source_model = "bytedance/glm-5-3-flash-260828".
# The upstream model is GLM-5.3-Flash (the model page prices "GLM-5.3 Flash"), so base_model is
# zhipuai/glm-5.3-flash.
# Prices: catalog pricing (USD per token) x 1,000,000.
# Effort: reasoning_effort = low|high|max (Chat Completions). reasoning.effort (Responses)
# and output_config.effort (Messages) take the same levels.
# The model page offers minimal, low, medium, high and max. Live 2026-11-08 on a two-part reasoning prompt
# (2 runs each), minimal and low returned 38-40 reasoning tokens, medium and high 49, and max 552-577. So
# minimal behaves like low and medium like high, and the distinct levels are low, high and max, the same
# set as GLM-5.3-Flash's own API.
# No toggle: GLM-5.3-Flash always reasons (its own API takes thinking.type = enabled only), and this
# host answers reasoning.enabled = false with HTTP 400 "cannot turn reasoning off" (checked 2026-11-08).
# Structured output: json_object and json_schema with strict (catalog structured_output_modes, strict_json_schema).
# Cache: the catalog prices cached input (input_cache_read) and no request field controls caching,
# so cache = { implicit = true }. Cached tokens are billed at these catalog rates (checked live
# 2026-11-08 with a repeated long prefix: the charged amount matched tokens x catalog prices).
# Modalities: text and image input (catalog capabilities.input_modalities), with the lab's JPEG and PNG.
# Limits: max_tokens 128,000 (catalog).
# Sampling: top_k is not in the catalog's supported_parameters.
# APIs: the catalog lists chat, responses and anthropic for every model; all three use the same base URL.
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
top_k = false
cache = { implicit = true }

[limit]
output = 128_000

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.15
cache = { read = 0.03 }

[cost.text.output]
price = 0.5
