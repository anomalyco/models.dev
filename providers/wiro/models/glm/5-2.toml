# Source: https://llm.wiro.ai/v1/models (fetched 2026-11-08), https://wiro.ai/models/glm/5-2
# and https://wiro.ai/docs/completions-api
# Upstream: x_wiro.pricing_source.source_model = "bytedance/glm-5-2-260617".
# Prices: catalog pricing (USD per token) x 1,000,000.
# Toggle: reasoning.enabled = true|false (Chat Completions) or thinking.type = enabled|disabled (Messages);
# the model page offers enabled, disabled and auto. Live 2026-11-08 on bytedance/seed-v2-mini, which takes
# the same switch: reasoning.enabled = false gave an answer with 0 reasoning tokens.
# On Responses, reasoning.effort is the reasoning control.
# Effort: reasoning_effort = minimal|high (Chat Completions). reasoning.effort (Responses)
# and output_config.effort (Messages) take the same levels.
# These are the model page's options.
# Structured output: not listed for this model (catalog structured_outputs = false).
# Limits: context_length 1,048,576 and max_tokens 128,000 (catalog).
# Sampling: top_k is not in the catalog's supported_parameters.
# APIs: the catalog lists chat, responses and anthropic for every model; all three use the same base URL.
schema = 2
base_model = "zhipuai/glm-5.2"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["minimal", "high"] }
top_k = false

[limit]
context = 1_048_576
output = 128_000

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 1.4

[cost.text.output]
price = 4.4
