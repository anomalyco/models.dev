# Source: https://llm.wiro.ai/v1/models (fetched 2026-11-08), https://wiro.ai/models/openai/gpt-6-luna
# and https://wiro.ai/docs/completions-api
# Upstream: x_wiro.pricing_source.source_model = "openai/gpt-6-luna".
# Prices: catalog pricing (USD per token) x 1,000,000.
# Effort: reasoning_effort = none|low|medium|high|xhigh|max (Chat Completions). reasoning.effort (Responses)
# and output_config.effort (Messages) take the same levels.
# These are the options of this model's reasoning control on its model page, as on OpenAI's own API.
# Custom tools (catalog custom_tools = true), live 2026-11-08 on openai/gpt-5-nano with a prompt asking for
# "hello": /v1/responses enforced regex ZZ[0-9]{3} and the same lark grammar (ZZ000, ZZ001), and
# /v1/chat/completions enforced the lark grammar (ZZ001) and took a text tool (hello). Each API lists the
# formats verified on it. Messages takes function tools only (Anthropic's custom type is a function tool).
# On this model /v1/chat/completions also enforced regex ZZ[0-9]{3} (ZZ000, live 2026-11-08).
# Structured output: json_schema with strict (catalog structured_output_modes, strict_json_schema).
# APIs: the catalog lists chat, responses and anthropic for every model; all three use the same base URL.
schema = 2
base_model = "openai/gpt-6-luna"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[api.chat-completions]
capabilities = { tools = { freeform = ["text", "lark", "regex"] } }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }
capabilities = { tools = { freeform = ["text", "lark", "regex"] } }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.1

[cost.text.output]
price = 0.5
