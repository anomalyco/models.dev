# Source: https://llm.wiro.ai/v1/models (fetched 2026-11-08), https://wiro.ai/models/openai/gpt-5-nano
# and https://wiro.ai/docs/completions-api
# Upstream: x_wiro.pricing_source.source_model = "openai/gpt-5-nano".
# Prices: catalog pricing (USD per token) x 1,000,000.
# Effort: reasoning_effort = minimal|low|medium|high (Chat Completions). reasoning.effort (Responses)
# and output_config.effort (Messages) take the same levels.
# These are the options of this model's reasoning control on its model page, as on OpenAI's own API.
# Custom tools (catalog custom_tools = true): text only, on Chat Completions and Responses alike (they reach
# the same upstream call). Live 2026-11-08, grammars did not hold on this model: at reasoning effort low 2 of
# 12 regex and Lark values broke the grammar, and at the default effort several calls spent the whole
# 1,024-token budget on reasoning before calling the tool. So no grammar format is listed.
# Messages takes function tools only (Anthropic's custom type is a function tool).
# Structured output: json_object and json_schema with strict (catalog structured_output_modes, strict_json_schema).
# Modalities: text, image and document input (catalog capabilities.input_modalities), so PDF joins the
# lab's image formats.
# Limits: max_tokens 65,536 (catalog).
# APIs: the catalog lists chat, responses and anthropic for every model; all three use the same base URL.
schema = 2
base_model = "openai/gpt-5-nano"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true

[limit]
output = 65_536

[api.chat-completions]
capabilities = { tools = { freeform = ["text"] } }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }
capabilities = { tools = { freeform = ["text"] } }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.05

[cost.text.output]
price = 0.4
