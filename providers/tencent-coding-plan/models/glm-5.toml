# Top-level `thinking.type` accepts enabled/disabled and defaults enabled
# (accessed 2026-06-25).
# https://cloud.tencent.com/document/product/1823/132061
schema = 2
name = "GLM-5"
description = "Flagship GLM model for hybrid reasoning, coding, and agentic engineering"
family = "glm"
open_weights = false
release_date = "2026-02-11"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true }
temperature = true

[limit]
context = 202_752
output = 16_384

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
