# Top-level `thinking.type` accepts enabled/disabled and defaults enabled
# (accessed 2026-06-25).
# https://cloud.tencent.com/document/product/1823/132232
schema = 2
name = "Kimi-K2.5"
description = "Kimi multimodal agent model for visual understanding, coding, and planning"
family = "kimi-k2"
open_weights = true
knowledge = "2025-01"
release_date = "2026-01-27"

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true }
temperature = true

[limit]
context = 262_144
output = 32_768

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
