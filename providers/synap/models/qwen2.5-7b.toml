# Sources (accessed 2026-10-12):
# - Model id, USD pricing and limits: https://pool.linkrra.com/v1/models?format=openrouter
#   (cost_usd is per token: 0.000000101 prompt / 0.000000101 completion).
# - limit: live probe - a ~26k-token prompt is accepted and a larger one is rejected;
#   max_tokens above the 32,768 window is rejected.
# - tool_call = false: live probe - requests carrying `tools` with tool_choice
#   auto, required or a named function return HTTP 400 on this endpoint.
# - structured_output = true: live probe - response_format json_schema returns
#   schema-conforming JSON.
base_model = "alibaba/qwen2.5-7b-instruct"
tool_call = false
structured_output = true

[cost]
input = 0.101
output = 0.101

[limit]
context = 32_768
output = 32_768
