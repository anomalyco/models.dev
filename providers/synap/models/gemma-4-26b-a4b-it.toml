# Sources (accessed 2026-10-15):
# - Model id, USD pricing and limits: https://pool.linkrra.com/v1/models?format=openrouter
#   (cost_usd is per token: 0.00000004 prompt / 0.00000021 completion).
# - limit: the live feed declares a 131,072-token window (the deployment's
#   --max-model-len, below the lab model's 262k).
# - attachment = false: this deployment is text-only - the live feed's
#   input_modalities carry a single `text` entry, no image input.
# - reasoning = false: this deployment serves the model as a plain instruct
#   chat endpoint. The feed's supported_parameters are temperature / top_p /
#   max_tokens / stop only - no reasoning_effort or thinking surface is
#   exposed to callers, so advertising caller-controllable reasoning here
#   would describe an API this host does not offer.
# - tool_call = true: live probe - a request carrying `tools` with tool_choice
#   auto returns finish_reason "tool_calls" with a well-formed function call.
# - structured_output = true: live probe - response_format json_schema returns
#   schema-conforming JSON.
base_model = "google/gemma-4-26b-a4b-it"
attachment = false
reasoning = false

[cost]
input = 0.04
output = 0.21

[limit]
context = 131_072
output = 131_072
