name = "Volcengine Ark Agent Plan"
# The env var is deliberately NOT the pay-as-you-go ARK_API_KEY (which
# providers/volcengine uses): the two surfaces have separate key spaces and
# each rejects the other's key with 401, so sharing one variable would light
# up both providers at once and let a user pick an entry their key cannot
# serve — same double-listing hazard volcengine-coding-plan documents.
env = ["ARK_AGENT_PLAN_API_KEY"]
npm = "@ai-sdk/openai-compatible"
# Agent Plan is a subscription tier (Small/Medium/Large/Max) with its own base
# URL and API-key space. Volcengine warns that calling the pay-as-you-go
# https://ark.cn-beijing.volces.com/api/v3 with a plan key does NOT draw down
# the subscription (and vice versa a pay-as-you-go key is rejected here with
# 401), so this provider must stay distinct from `volcengine` — same reasoning
# as providers/volcengine-coding-plan.
#
# Model names are the short console labels (doubao-seed-2.1-turbo, glm-5.3).
# POST /api/plan/v3/chat/completions accepts the short form; the pay-as-you-go
# /api/v3 requires dated IDs and 404s on short labels.
#
# There is NO /models route on this endpoint (/api/plan/v3/models returns 404),
# so the catalog cannot be live-discovered by API-key holders; the model list
# below was probed against POST /api/plan/v3/chat/completions and cross-checked
# against the official plan docs (accessed 2026-09-21):
#   https://www.volcengine.com/docs/82379/2366394          (plan overview + roster)
#   https://www.volcengine.com/docs/82379/2546385          (management-API model list, AK/SK)
# Every model returned HTTP 200 on a minimal chat call on 2026-09-21.
#
# Limit values are live-measured on this endpoint (2026-09-21), NOT copied from
# the docs, because the docs disagree with the wire in several places:
#   - max_tokens rejection messages give the exact output cap per model
#     ("expected a value <= N"): doubao mini/lite 131072, 2.1-turbo/evolving
#     262144, minimax-m3 131072, glm-5.3(-flash) 131072, kimi-k2.7-code 32768,
#     kimi-k3 / kimi-k2.8-preview 131072, deepseek-v4-pro 393216.
#     deepseek-v4-flash / v4.1-flash accept max_tokens far above 8M without
#     error (output not separately enforced; completion length is bounded by
#     the context window), so the documented 384000 is kept as a conservative
#     value and limit.output is left at the lab value.
#   - context caps were bisected with oversized prompts ("word " repeats are
#     ~1 token each on all probed models) until the request failed with
#     "Total tokens of image and text exceed max message tokens":
#       doubao-seed-2.1-turbo  ∈ [228000, 232250]  -> docs 256K is too high
#       doubao-seed-evolving   ∈ [916875, 928750]  -> docs 1M is too high
#       minimax-m3             ∈ [1039437, 1043718] (matches 1M + overhead)
#       kimi-k3                ∈ [1043718, 1048000] (matches 1M + overhead)
#       deepseek-v4-flash      ∈ [1035156, 1039437] (matches 1M + overhead)
#     The [limit] entries below carry the measured conservative floor rounded
#     down; models without a bisect run inherit the lab context.
#
# Reasoning controls were NOT wire-probed on this endpoint (unlike
# volcengine-coding-plan); the reasoning_options mirror the lab entries per the
# relay convention. Probe before declaring graded levels here.
doc = "https://www.volcengine.com/docs/82379/2366394"
api = "https://ark.cn-beijing.volces.com/api/plan/v3"
