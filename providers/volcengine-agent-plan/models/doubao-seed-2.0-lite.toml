# Agent Plan model name from https://www.volcengine.com/docs/82379/2366394
# (accessed 2026-09-21). Subscription tier: no per-token price.
# Effort on this endpoint was not probed; mirrors the coding-plan peer
# (providers/volcengine-coding-plan): reasoning_effort = none|low|high.
# Output cap measured via max_tokens rejection: 131072 (docs say 128K).
base_model = "bytedance-seed/seed-2.0-lite"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "high"]

[interleaved]
field = "reasoning_content"

[limit]
context = 256_000
output = 131_072

[cost]
input = 0
output = 0
cache_read = 0
