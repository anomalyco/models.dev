# Auto-updating alias recommended by Ark so tools need no config change across model
# upgrades (maps to the current best coding model). Subscription plan → cost zeroed.
name = "Ark Code (latest)"
description = "Auto-updating alias for the latest Ark coding model"
release_date = "2026-02-14"
last_updated = "2026-02-14"
attachment = true
reasoning = true
reasoning_options = [{ type = "toggle" }] # API: {"thinking": {"type": "enabled"|"disabled"}}
tool_call = true
temperature = true
structured_output = false
open_weights = false

[cost]
input = 0
output = 0
cache_read = 0
cache_write = 0

[limit]
context = 256_000
output = 128_000

[modalities]
input = ["text", "image", "video"]
output = ["text"]
