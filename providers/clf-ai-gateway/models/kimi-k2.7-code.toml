# Prices: currently billed rate, GET https://api.clfaigateway.dev/v1/public/models (accessed 2026-10-30), nano-USD per token / 1000.
# Wire: only reasoning_effort is forwarded. chat_template_kwargs, thinking and top_k get 400 unknown_parameter, so there is no toggle or top_k.
# No caller control: thinking is mandatory; reasoning_effort low|medium|high is accepted with no separable effect (2026-09-25).
schema = 2
base_model = "moonshotai/kimi-k2.7-code"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
cache = { implicit = true }
structured_output = true

[limit]
output = 131_072

[cost.text.input]
price = 0.38
cache = { read = 0.076 }

[cost.text.output]
price = 1.6

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
