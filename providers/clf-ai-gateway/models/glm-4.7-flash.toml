# Prices: currently billed rate, GET https://api.clfaigateway.dev/v1/public/models (accessed 2026-10-30), nano-USD per token / 1000.
# Wire: only reasoning_effort is forwarded. chat_template_kwargs, thinking and top_k get 400 unknown_parameter, so there is no toggle or top_k.
# No caller control: the peer's only control is the chat_template_kwargs toggle, which this host does not forward.
# reasoning_effort low|medium|high is accepted, but its effect was inconsistent (2026-09-25).
# Cache: no cached-input tier on this host.
schema = 2
base_model = "zhipuai/glm-4.7-flash"

[capabilities]
reasoning = { supported = true }
cache = false
structured_output = true
top_k = false

[limit]
context = 131_072

[cost.text.input]
price = 0.024

[cost.text.output]
price = 0.16

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
