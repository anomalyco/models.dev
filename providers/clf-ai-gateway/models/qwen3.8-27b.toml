# Prices: currently billed rate, GET https://api.clfaigateway.dev/v1/public/models (accessed 2026-10-30), nano-USD per token / 1000.
# Wire: only reasoning_effort is forwarded. chat_template_kwargs, thinking and top_k get 400 unknown_parameter, so there is no toggle or top_k.
# Effort: reasoning_effort = low|medium|xhigh; high gets 400. Effect rises with the level (2026-09-25).
# Cache: a cached-input price is published, but repeats read 0 cached tokens (2026-09-25), so cache is unset.
schema = 2
base_model = "alibaba/qwen3.8-27b"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "xhigh"] }
structured_output = true
top_k = false

[limit]
output = 131_072

[cost.text.input]
price = 0.18
cache = { read = 0.02 }

[cost.text.output]
price = 1.28

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
