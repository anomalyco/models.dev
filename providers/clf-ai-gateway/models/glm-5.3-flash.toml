# Prices: currently billed rate, GET https://api.clfaigateway.dev/v1/public/models (accessed 2026-10-30), nano-USD per token / 1000.
# Wire: only reasoning_effort is forwarded. chat_template_kwargs, thinking and top_k get 400 unknown_parameter, so there is no toggle or top_k.
# Effort: same-surface peer set (Workers AI low|high|max). Thinking is mandatory.
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
cache = { implicit = true }
structured_output = true
top_k = false

[limit]
context = 1_048_576

[cost.text.input]
price = 0.06
cache = { read = 0.012 }

[cost.text.output]
price = 0.2

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
