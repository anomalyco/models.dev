schema = 2
name = "GPT-5.2 Chat"
description = "Chat-tuned GPT model for conversational assistance, writing, and tool workflows"
family = "gpt-codex"
open_weights = false
knowledge = "2025-08-31"
release_date = "2025-12-11"
status = "deprecated"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = true }
reasoning = { supported = true, effort = ["medium"] }
structured_output = true
temperature = false
system_updates = true
effort_updates = false
store = true
cache = { supported = true, implicit = { min_tokens = 1_024 }, explicit = false }
prompt_cache_key = true

[limit]
context = 128_000
output = 16_384

[cost.text.input]
price = 1.75
cache = { read = 0.175 }

[cost.text.output]
price = 14
