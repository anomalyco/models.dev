# tools: function calling (strict mode, tool_choice auto/none/required/named) and custom tools (grammar lark/regex, GPT-5 and later): https://developers.openai.com/api/docs/guides/function-calling
# Web search: $10 per 1,000 web_search tool calls (all models): https://developers.openai.com/api/docs/pricing#built-in-tools
# Token-only multipliers (object factor, so cost.web_search is unscaled): Fast mode (https://developers.openai.com/api/docs/guides/priority-processing).
# APIs: the Endpoints table on https://developers.openai.com/api/docs/models/gpt-4.1
# Per-API flags: additional_tools (and configuration_update, where set) exist only on the Responses API, so tools.updates / effort_updates sit on [api.responses]. Developer messages mid-conversation are documented on both Chat Completions and Responses, so system_updates stays top-level.
schema = 2
name = "GPT-4.1"
description = "Long-lived GPT workhorse for coding, instruction following, and production apps"
family = "gpt"
open_weights = false
knowledge = "2024-04"
release_date = "2025-04-14"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = false }
structured_output = true
temperature = true
system_updates = true
store = true
cache = { implicit = { ttl = ["24h"], min_tokens = 1_024 } }
prompt_cache_key = true
service_tier = ["priority"]

[limit]
context = 1_047_576
output = 32_768

[api.responses]
capabilities = { tools = { updates = true } }

[api.chat-completions]
sdk = { opencodeai = "@opencode/ai/providers/openai/chat" }

[cost.text.input]
price = 2
cache = { read = 0.5 }

[cost.text.output]
price = 8

[cost.web_search]
price = 10

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = { text = 1.75 }

[experimental.modes.fast]
service_tier = "priority"
body = { service_tier = "priority" }
