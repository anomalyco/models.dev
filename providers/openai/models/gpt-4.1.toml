schema = 2
name = "GPT-4.1"
description = "Long-lived GPT workhorse for coding, instruction following, and production apps"
family = "gpt"
open_weights = false
knowledge = "2024-04"
release_date = "2025-04-14"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
structured_output = true
temperature = true
system_updates = true
effort_updates = false
tool_updates = true
store = true
cache = { supported = true, implicit = { ttl = ["24h"], min_tokens = 1_024 }, explicit = false }
prompt_cache_key = true
service_tier = ["priority"]

[limit]
context = 1_047_576
output = 32_768

[cost.text.input]
price = 2
cache = { read = 0.5 }

[cost.text.output]
price = 8

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.75

[experimental.modes.fast]
service_tier = "priority"
body = { service_tier = "priority" }
