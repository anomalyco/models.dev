# Pricing (accessed 2026-11-12): https://developers.openai.com/api/docs/pricing (Images, standard tier)
# Image tokens: input $8 (cached $2), output $30 per 1M; the text.output entry predates the image entries and is kept so v1 output is unchanged.
schema = 2
base_model = "openai/gpt-image-2"
name = "gpt-image-2"

[limit]
input = 0

[api.images]
sdk = { opencodeai = "@opencode/ai/providers/openai/images" }

[cost.text.input]
price = 5
cache = { read = 1.25 }

[cost.text.output]
price = 30

[cost.image.input]
price = 8
cache = { read = 2 }

[cost.image.output]
price = 30
