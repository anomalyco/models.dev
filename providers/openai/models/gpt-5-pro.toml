# tools: function calling (strict mode, tool_choice auto/none/required/named) and custom tools (free-form text, or lark/regex grammars; GPT-5 and later): https://developers.openai.com/api/docs/guides/function-calling
# Web search: $10 per 1,000 web_search tool calls (all models): https://developers.openai.com/api/docs/pricing#built-in-tools
# tools.updates: left out. This model has no prompt caching (no cached-input price), so there is no cache for a tool change to keep.
schema = 2
name = "GPT-5 Pro"
description = "Higher-accuracy GPT-5 tier for tough analysis, coding reviews, and planning"
family = "gpt-pro"
open_weights = false
knowledge = "2024-09-30"
release_date = "2025-10-06"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none", "required", "tool"], freeform = ["text", "lark", "regex"] }
reasoning = { supported = true, effort = ["high"] }
structured_output = true
temperature = false
system_updates = true
store = true
cache = false

[limit]
context = 400_000
input = 272_000
output = 272_000

[cost.text.input]
price = 15

[cost.text.output]
price = 120

[cost.web_search]
price = 10
