# Sources: https://developers.openai.com/api/docs/changelog (Nov 24, 2026, Responses API) and
# https://developers.openai.com/api/docs/pricing#healthcare-model-configurations (accessed 2026-11-25).
# Prices (Standard, per 1M): $2 input, $0.1 cached input, $10 output, $2.5 30m and $5 12h cache writes; >272K input tokens: $4 input,
# $0.2 cached, $15 output, $5 / $10 cache writes. Promotional pricing "available at least through December 31, 2026" (pricing footnote).
# Fast mode is 2x Standard ($4 / $20 / $0.2, Fast table on the pricing page). Regional processing endpoints: +10% (pricing footnote for
# this table). Token-only factors, so cost.web_search is unscaled. Web search: $10 per 1,000 calls (all models):
# https://developers.openai.com/api/docs/pricing#built-in-tools
# APIs: Responses only, per the changelog entry (Chat Completions also answers live, but isn't documented for these configurations).
# Live 2026-11-25 on /v1/responses (every capability below):
# - reasoning.effort low/medium/high/xhigh/max complete; 'none' and 'minimal' return 400 "Supported values are: 'low', 'medium', 'high', 'xhigh', and 'max'".
# - service_tier "priority" completes; "flex" returns 400 and "ultrafast" returns 400 "Invalid service_tier argument".
# - strict function tools with tool_choice required and named; custom tools with free-form text and grammar-enforced output
#   (regex `ZZ[0-9]{3}` returned "ZZ000", lark `start: "QQ" INT` returned "QQ" + digits when asked for "hello world"); hosted
#   tool_search loaded a deferred namespace function; strict json_schema output; web_search.
# - Mid-conversation: a developer message took effect; a configuration_update item is accepted (effort_updates, as on gpt-6.2-sol);
#   additional_tools (every tool declared in additional_tools, as @opencode/ai sends them): an added tool is called, a later
#   redefinition is used 3/3 (the call uses the new schema), and a removal announced in a developer message is followed.
# - Caching: prompt_cache_key with prompt_cache_options.ttl "12h" wrote 4,806 tokens (ttl_12h_tokens), then read them back.
#   Explicit breakpoints are not re-tested here; the cache shape follows gpt-6.2-sol. https://developers.openai.com/api/docs/guides/prompt-caching
# Pro mode (reasoning.mode "pro") is left out: the request is accepted, but it isn't documented for these configurations.
schema = 2
base_model = "openai/gpt-6.2-sol-healthcare"

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none", "required", "tool"], search = true, freeform = ["text", "lark", "regex"], updates = ["add", "remove", "replace"] }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
system_updates = true
effort_updates = true
store = true
cache = { implicit = { min_tokens = 1_024 }, explicit = { ttl = ["30m", "12h"], max_breakpoints = 4, min_tokens = 1_024 } }
prompt_cache_key = true
service_tier = ["priority"]

[cost.text.input]
price = 2
cache = { read = 0.1, write = { "30m" = 2.5, "12h" = 5 } }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 4
cache = { read = 0.2, write = { "30m" = 5, "12h" = 10 } }

[cost.text.output]
price = 10

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 15

[cost.web_search]
price = 10

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = { text = 2 }

[[cost.multipliers]]
when = { not = { region = { equals = "global" } } }
factor = { text = 1.1 }

[experimental.modes.fast]
service_tier = "priority"
body = { service_tier = "priority" }
