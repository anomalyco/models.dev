# tools: function calling (strict mode, tool_choice auto/none/required/named) and custom tools (free-form text, or lark/regex grammars; GPT-5 and later): https://developers.openai.com/api/docs/guides/function-calling
# tools.search: tool_search on the Responses API only (gpt-5.4 and later, per the model page's Supported tools): https://developers.openai.com/api/docs/guides/tools-tool-search
# Web search: $10 per 1,000 web_search tool calls (all models): https://developers.openai.com/api/docs/pricing#built-in-tools
# Token-only multipliers (object factor, so cost.web_search is unscaled): Flex (https://developers.openai.com/api/docs/guides/flex-processing).
# tools.updates: left out. This model has no prompt caching (no cached-input price), so there is no cache for a tool change to keep.
schema = 2
name = "GPT-5.5 Pro"
description = "Highest-accuracy GPT-5.5 tier for slower, precision-heavy reasoning and coding"
family = "gpt-pro"
open_weights = false
knowledge = "2025-12-01"
release_date = "2026-04-23"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none", "required", "tool"], search = true, freeform = ["text", "lark", "regex"] }
reasoning = { supported = true, effort = ["medium", "high", "xhigh"] }
structured_output = true
temperature = false
system_updates = true
store = true
cache = false
service_tier = ["flex"]

[limit]
context = 1_050_000
input = 922_000
output = 128_000

[cost.text.input]
price = 30

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 60

[cost.text.output]
price = 180

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 270

[cost.web_search]
price = 10

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = { text = 0.5 }
