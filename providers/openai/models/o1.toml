# APIs: the Endpoints table on https://developers.openai.com/api/docs/models/o1
schema = 2
name = "o1"
description = "O-series reasoning model for hard analysis, math, coding, and planning"
family = "o"
open_weights = false
knowledge = "2023-09"
release_date = "2024-12-05"
status = "deprecated"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
temperature = false
system_updates = true
effort_updates = false
store = true
cache = { implicit = { min_tokens = 1_024 } }
prompt_cache_key = true

[limit]
context = 200_000
output = 100_000

[api.responses]

[api.chat-completions]
sdk = { opencodeai = "@opencode/ai/providers/openai/chat" }

[cost.text.input]
price = 15
cache = { read = 7.5 }

[cost.text.output]
price = 60
