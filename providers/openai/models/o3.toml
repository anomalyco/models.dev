name = "o3"
description = "Deliberate o-series reasoner for hard math, coding, and multi-step analysis"
family = "o"
release_date = "2025-04-16"
last_updated = "2025-04-16"
attachment = true
reasoning = true
reasoning_options = [{ type = "effort", values = ["low", "medium", "high"] }]
temperature = false
knowledge = "2024-05"
tool_call = true
structured_output = true
open_weights = false

[cost]
input = 2.00
output = 8.00
cache_read = 0.50

[limit]
context = 200_000
output = 100_000

[modalities]
input = ["text", "image", "pdf"]
output = ["text"]

[experimental.modes.fast]
cost = { input = 3.50, output = 14.00, cache_read = 0.875 }
provider = { body = { service_tier = "priority" } }

[experimental.modes.flex]
cost = { input = 1.00, output = 4.00, cache_read = 0.25 }
provider = { body = { service_tier = "flex" } }
