schema = 2
name = "o3"
description = "Deliberate o-series reasoner for hard math, coding, and multi-step analysis"
family = "o"
open_weights = false
knowledge = "2024-05"
release_date = "2025-04-16"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
temperature = false
system_updates = true
effort_updates = false
tool_updates = true
store = true
cache = { supported = true, implicit = { min_tokens = 1_024 }, explicit = false }
prompt_cache_key = true
service_tier = ["flex", "priority"]

[limit]
context = 200_000
output = 100_000

[cost.text.input]
price = 2
cache = { read = 0.5 }

[cost.text.output]
price = 8

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.75

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.5

[experimental.modes.fast]
service_tier = "priority"
body = { service_tier = "priority" }

[experimental.modes.flex]
body = { service_tier = "flex" }
