# Sources:
# https://developers.openai.com/api/docs/models/chat-latest (knowledge cutoff Apr 20, 2026;
# the alias tracks the current ChatGPT Instant snapshot, newer than the gpt-5.5-instant lab's 2025-12-01)
# https://developers.openai.com/api/docs/pricing
# Reasoning: no caller control. Live /v1/responses (2026-10-19) accepts only reasoning.effort
# "medium"; none/minimal/low/high/xhigh/max return "Supported values are: 'medium'".
# Web search: $10 per 1,000 web_search tool calls (all models): https://developers.openai.com/api/docs/pricing#built-in-tools
# APIs: the Endpoints table on https://developers.openai.com/api/docs/models/chat-latest
# Per-API flags: additional_tools (and configuration_update, where set) exist only on the Responses API, so tools.updates / effort_updates sit on [api.responses]. Developer messages mid-conversation are documented on both Chat Completions and Responses, so system_updates stays top-level.
schema = 2
v2_only = true
base_model = "openai/gpt-5.5-instant"
name = "Chat Latest"
knowledge = "2026-04-20"

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
structured_output = true
temperature = false
top_p = false
system_updates = true
effort_updates = false
store = true
cache = { implicit = { min_tokens = 1_024 } }
prompt_cache_key = true

[api.responses]
capabilities = { tools = { updates = true } }

[api.chat-completions]
sdk = { opencodeai = "@opencode/ai/providers/openai/chat" }

[cost.text.input]
price = 5
cache = { read = 0.5 }

[cost.text.output]
price = 30

[cost.web_search]
price = 10
