schema = 2
name = "GPT-4o"
description = "Omni-era GPT for multimodal chat, practical coding, and general assistants"
family = "gpt"
open_weights = false
knowledge = "2023-09"
release_date = "2024-05-13"
last_updated = "2024-08-06"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
structured_output = true
temperature = true
system_updates = true
effort_updates = false
tool_updates = true
store = true
cache = { supported = true, implicit = { min_tokens = 1_024 }, explicit = false }
prompt_cache_key = true
service_tier = ["priority"]

[limit]
context = 128_000
output = 16_384

[cost.text.input]
price = 2.5
cache = { read = 1.25 }

[cost.text.output]
price = 10

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.7

[experimental.modes.fast]
service_tier = "priority"
body = { service_tier = "priority" }
