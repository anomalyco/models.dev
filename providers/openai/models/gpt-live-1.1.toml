# Sources:
# https://developers.openai.com/api/docs/models/gpt-live-1.1
# https://developers.openai.com/api/docs/pricing (GPT-Live: $0.05 / minute active, $0.02 / minute standby, billed per second)
# Standby (WebRTC sessions pause inference while idle) bills $0.02 / minute; there's no field for a session state, so only the active rate is published.
schema = 2
v2_only = true
base_model = "openai/gpt-live-1.1"

[api.live]
sdk = { opencodeai = "none" }

[cost.audio.input]
unit = "minute"
price = 0.05
