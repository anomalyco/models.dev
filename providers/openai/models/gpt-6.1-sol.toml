# Model and pricing: https://developers.openai.com/api/docs/models/gpt-6.1-sol
# Reasoning: https://developers.openai.com/api/docs/guides/latest-model?model=gpt-6.1-sol
# Ultrafast: https://developers.openai.com/api/docs/guides/ultrafast-mode
# Ultrafast pricing: https://developers.openai.com/api/docs/pricing?latest-pricing=ultrafast
base_model = "openai/gpt-6.1-sol"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 2.00
output = 10.00
cache_read = 0.10
cache_write = 2.50

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 4.00
output = 15.00
cache_read = 0.20
cache_write = 5.00

[experimental.modes.fast]
cost = { input = 4.00, output = 20.00, cache_read = 0.20, cache_write = 5.00 }
provider = { body = { service_tier = "priority" } }

[experimental.modes.pro]
provider = { body = { reasoning = { mode = "pro" } } }

[experimental.modes.ultrafast]
cost = { input = 12.00, output = 60.00, cache_read = 0.60, cache_write = 15.00 }
provider = { body = { service_tier = "ultrafast" } }
