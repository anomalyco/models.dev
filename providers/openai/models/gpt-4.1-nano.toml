schema = 2
name = "GPT-4.1 nano"
description = "Tiny GPT-4.1 option for classification, routing, and very high-volume tasks"
family = "gpt-nano"
open_weights = false
knowledge = "2024-04"
release_date = "2025-04-14"
status = "deprecated"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = true }
reasoning = { supported = false }
structured_output = true
temperature = true
system_updates = true
effort_updates = false
store = true
cache = { implicit = { min_tokens = 1_024 } }
prompt_cache_key = true
service_tier = ["priority"]

[limit]
context = 1_047_576
output = 32_768

[cost.text.input]
price = 0.1
cache = { read = 0.025 }

[cost.text.output]
price = 0.4

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 2

[experimental.modes.fast]
service_tier = "priority"
body = { service_tier = "priority" }
