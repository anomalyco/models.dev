# APIs: the Endpoints table on https://developers.openai.com/api/docs/models/gpt-4.1-nano
# Per-API flags: additional_tools (and configuration_update, where set) exist only on the Responses API, so tools.updates / effort_updates sit on [api.responses]. Developer messages mid-conversation are documented on both Chat Completions and Responses, so system_updates stays top-level.
schema = 2
name = "GPT-4.1 nano"
description = "Tiny GPT-4.1 option for classification, routing, and very high-volume tasks"
family = "gpt-nano"
open_weights = false
knowledge = "2024-04"
release_date = "2025-04-14"
status = "deprecated"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
structured_output = true
temperature = true
system_updates = true
effort_updates = false
store = true
cache = { implicit = { min_tokens = 1_024 } }
prompt_cache_key = true
service_tier = ["priority"]

[limit]
context = 1_047_576
output = 32_768

[api.responses]
capabilities = { tools = { updates = true } }

[api.chat-completions]
sdk = { opencodeai = "@opencode/ai/providers/openai/chat" }

[cost.text.input]
price = 0.1
cache = { read = 0.025 }

[cost.text.output]
price = 0.4

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 2

[experimental.modes.fast]
service_tier = "priority"
body = { service_tier = "priority" }
