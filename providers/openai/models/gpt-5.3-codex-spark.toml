schema = 2
name = "GPT-5.3 Codex Spark"
description = "Coding-optimized GPT model for repository edits, reviews, and agentic software work"
family = "gpt-codex-spark"
open_weights = false
knowledge = "2025-08-31"
release_date = "2026-02-05"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true
temperature = false
system_updates = true
effort_updates = false
tool_updates = true
store = true

[limit]
context = 128_000
input = 100_000
output = 32_000

[cost.text.input]
price = 1.75
cache = { read = 0.175 }

[cost.text.output]
price = 14
