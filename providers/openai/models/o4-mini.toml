# Web search: $10 per 1,000 web_search tool calls (all models): https://developers.openai.com/api/docs/pricing#built-in-tools
# Token-only multipliers (object factor, so cost.web_search is unscaled): Flex (https://developers.openai.com/api/docs/guides/flex-processing).
# APIs: the Endpoints table on https://developers.openai.com/api/docs/models/o4-mini
schema = 2
name = "o4-mini"
description = "Fast o-series model for compact reasoning, coding, and tool use"
family = "o-mini"
open_weights = false
knowledge = "2024-05"
release_date = "2025-04-16"
status = "deprecated"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
temperature = false
system_updates = true
effort_updates = false
store = true
cache = { implicit = { min_tokens = 1_024 } }
prompt_cache_key = true
service_tier = ["flex", "priority"]

[limit]
context = 200_000
output = 100_000

[api.responses]

[api.chat-completions]
sdk = { opencodeai = "@opencode/ai/providers/openai/chat" }

[cost.text.input]
price = 1.1
cache = { read = 0.275 }

[cost.text.output]
price = 4.4

[cost.web_search]
price = 10

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = { text = 0.5 }

[experimental.modes.fast]
service_tier = "priority"
body = { service_tier = "priority" }

[experimental.modes.fast.cost.text.input]
price = 2
cache = { read = 0.5 }

[experimental.modes.fast.cost.text.output]
price = 8

[experimental.modes.flex]
body = { service_tier = "flex" }
