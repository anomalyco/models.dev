schema = 2
name = "GPT-4.1 mini"
description = "Affordable GPT-4.1 lane for fast coding help and structured extraction"
family = "gpt-mini"
open_weights = false
knowledge = "2024-04"
release_date = "2025-04-14"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = true }
reasoning = { supported = false }
structured_output = true
temperature = true
system_updates = true
effort_updates = false
store = true
cache = { supported = true, implicit = { min_tokens = 1_024 }, explicit = false }
prompt_cache_key = true
service_tier = ["priority"]

[limit]
context = 1_047_576
output = 32_768

[cost.text.input]
price = 0.4
cache = { read = 0.1 }

[cost.text.output]
price = 1.6

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.75

[experimental.modes.fast]
service_tier = "priority"
body = { service_tier = "priority" }
