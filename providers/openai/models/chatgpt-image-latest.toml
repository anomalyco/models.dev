# Image output MIME types: https://developers.openai.com/api/docs/guides/image-generation#output-format (output_format: png, jpeg, webp)
schema = 2
type = "image"
name = "chatgpt-image-latest"
description = "Image model for prompt-driven generation, editing, and visual design workflows"
family = "gpt-image"
open_weights = false
release_date = "2025-12-16"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp"]
output = ["text", "image/png", "image/jpeg", "image/webp"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false

[limit]
context = 0
input = 0
output = 0

[api.images]
sdk = { opencodeai = "@opencode/ai/providers/openai/images" }
