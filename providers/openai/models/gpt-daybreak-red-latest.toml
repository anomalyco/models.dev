# Sources: https://developers.openai.com/api/docs/models/gpt-daybreak-red-latest
# https://developers.openai.com/api/docs/pricing
# Web search: $10 per 1,000 web_search tool calls (all models): https://developers.openai.com/api/docs/pricing#built-in-tools
schema = 2
base_model = "openai/gpt-5.6-cyber"
name = "Daybreak Red"
description = "Alias for advanced cybersecurity models for authorized vulnerability research and security testing"

[capabilities]
tools = { supported = true, updates = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
system_updates = true
effort_updates = false
store = true
cache = { supported = true, implicit = { min_tokens = 1_024 }, explicit = { ttl = ["30m"], max_breakpoints = 4, min_tokens = 1_024 } }
prompt_cache_key = true

[cost.text.input]
price = 12.5
cache = { read = 1.25, write = 15.625 }

[cost.text.output]
price = 75

[cost.web_search]
price = 10
