schema = 2
name = "GPT-5.4 mini"
description = "Strong small GPT for coding subagents, quick tool use, and high-volume work"
family = "gpt-mini"
open_weights = false
knowledge = "2025-08-31"
release_date = "2026-03-17"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true
temperature = true
system_updates = true
effort_updates = false
tool_updates = true
store = true
cache = { supported = true, implicit = { min_tokens = 1_024 }, explicit = false }
prompt_cache_key = true
service_tier = ["flex", "priority"]

[limit]
context = 400_000
input = 272_000
output = 128_000

[cost.text.input]
price = 0.75
cache = { read = 0.075 }

[cost.text.output]
price = 4.5

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 2

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.5

[experimental.modes.fast]
service_tier = "priority"
body = { service_tier = "priority" }

[experimental.modes.flex]
body = { service_tier = "flex" }
