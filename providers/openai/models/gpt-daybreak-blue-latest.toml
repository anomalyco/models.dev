# tools: function calling (strict mode, tool_choice auto/none/required/named) and custom tools (free-form text, or lark/regex grammars; GPT-5 and later): https://developers.openai.com/api/docs/guides/function-calling
# tools.search: tool_search on the Responses API only (gpt-5.4 and later, per the model page's Supported tools): https://developers.openai.com/api/docs/guides/tools-tool-search
# Sources: https://developers.openai.com/api/docs/models/gpt-daybreak-blue-latest
# https://developers.openai.com/api/docs/pricing
# Web search: $10 per 1,000 web_search tool calls (all models): https://developers.openai.com/api/docs/pricing#built-in-tools
# Token-only multipliers (object factor, so cost.web_search is unscaled): Fast mode (https://developers.openai.com/api/docs/guides/priority-processing); Flex (https://developers.openai.com/api/docs/guides/flex-processing).
# Cache writes: 30m (default) is 1.25x input; 12h (Responses API) is 2.5x. https://developers.openai.com/api/docs/guides/prompt-caching
# Regional processing (data residency) endpoints: +10% on token prices for models released on or after 2026-03-05 (FedRAMP endpoints also +10%, not modeled). Token-only factor so cost.web_search is unscaled. Source: https://developers.openai.com/api/docs/pricing (accessed 2026-11-12)
schema = 2
base_model = "openai/gpt-5.6-sol"
name = "Daybreak Blue"
description = "Alias for flagship general-purpose models with safeguards for defensive cybersecurity work"
release_date = "2026-08-07"

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none", "required", "tool"], search = true, freeform = ["text", "lark", "regex"], updates = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
system_updates = true
store = true
cache = { implicit = { min_tokens = 1_024 }, explicit = { ttl = ["30m", "12h"], max_breakpoints = 4, min_tokens = 1_024 } }
prompt_cache_key = true
service_tier = ["flex", "priority"]

[cost.text.input]
price = 4
cache = { read = 0.4, write = { "30m" = 5, "12h" = 10 } }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 8
cache = { read = 0.8, write = { "30m" = 10, "12h" = 20 } }

[cost.text.output]
price = 20

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 30

[cost.web_search]
price = 10

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = { text = 2 }

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = { text = 0.5 }

[[cost.multipliers]]
when = { not = { region = { equals = "global" } } }
factor = { text = 1.1 }
