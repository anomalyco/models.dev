schema = 2
name = "GPT-5 Mini"
description = "Small GPT-5 for responsive agents, coding help, and everyday automation"
family = "gpt-mini"
open_weights = false
knowledge = "2024-05-30"
release_date = "2025-08-07"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = true }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true
temperature = false
system_updates = true
effort_updates = false
store = true
cache = { supported = true, implicit = { min_tokens = 1_024 }, explicit = false }
prompt_cache_key = true
service_tier = ["flex", "priority"]

[limit]
context = 400_000
input = 272_000
output = 128_000

[cost.text.input]
price = 0.25
cache = { read = 0.025 }

[cost.text.output]
price = 2

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.8

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.5

[experimental.modes.fast]
service_tier = "priority"
body = { service_tier = "priority" }

[experimental.modes.flex]
body = { service_tier = "flex" }
