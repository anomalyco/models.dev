schema = 2
name = "GPT-5 Nano"
description = "Tiny GPT-5 lane for routing, extraction, classification, and bulk jobs"
family = "gpt-nano"
open_weights = false
knowledge = "2024-05-30"
release_date = "2025-08-07"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true
temperature = false
system_updates = true
effort_updates = false
tool_updates = true
store = true
cache = { supported = true, implicit = { min_tokens = 1_024 }, explicit = false }
prompt_cache_key = true
service_tier = ["flex"]

[limit]
context = 400_000
input = 272_000
output = 128_000

[cost.text.input]
price = 0.05
cache = { read = 0.005 }

[cost.text.output]
price = 0.4

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.5

[experimental.modes.flex]
body = { service_tier = "flex" }
