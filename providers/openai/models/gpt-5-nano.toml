# Web search: $10 per 1,000 web_search tool calls (all models): https://developers.openai.com/api/docs/pricing#built-in-tools
# Token-only multipliers (object factor, so cost.web_search is unscaled): Flex (https://developers.openai.com/api/docs/guides/flex-processing).
# APIs: the Endpoints table on https://developers.openai.com/api/docs/models/gpt-5-nano
# Per-API flags: additional_tools (and configuration_update, where set) exist only on the Responses API, so tools.updates / effort_updates sit on [api.responses]. Developer messages mid-conversation are documented on both Chat Completions and Responses, so system_updates stays top-level.
schema = 2
name = "GPT-5 Nano"
description = "Tiny GPT-5 lane for routing, extraction, classification, and bulk jobs"
family = "gpt-nano"
open_weights = false
knowledge = "2024-05-30"
release_date = "2025-08-07"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true
temperature = false
system_updates = true
store = true
cache = { implicit = { min_tokens = 1_024 } }
prompt_cache_key = true
service_tier = ["flex"]

[limit]
context = 400_000
input = 272_000
output = 128_000

[api.responses]
capabilities = { tools = { updates = true } }

[api.chat-completions]
sdk = { opencodeai = "@opencode/ai/providers/openai/chat" }

[cost.text.input]
price = 0.05
cache = { read = 0.005 }

[cost.text.output]
price = 0.4

[cost.web_search]
price = 10

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = { text = 0.5 }

[experimental.modes.flex]
body = { service_tier = "flex" }
