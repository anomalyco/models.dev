# Pricing: https://developers.openai.com/api/docs/models/gpt-6-sol
# Reasoning and modes: https://developers.openai.com/api/docs/guides/latest-model?model=gpt-6-sol
base_model = "openai/gpt-6-sol"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 2.00
output = 10.00
cache_read = 0.20
cache_write = 2.50

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 4.00
output = 15.00
cache_read = 0.40
cache_write = 5.00

[experimental.modes.fast]
cost = { input = 4.00, output = 20.00, cache_read = 0.40, cache_write = 5.00 }
provider = { body = { service_tier = "priority" } }

[experimental.modes.pro]
provider = { body = { reasoning = { mode = "pro" } } }
