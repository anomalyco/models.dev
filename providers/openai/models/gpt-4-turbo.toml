# tools.updates: left out. This model has no prompt caching (no cached-input price), so there is no cache for a tool change to keep.
# APIs: the Endpoints table on https://developers.openai.com/api/docs/models/gpt-4-turbo
schema = 2
name = "GPT-4 Turbo"
description = "Compact GPT model for low-latency assistance and high-volume workloads"
family = "gpt"
open_weights = false
knowledge = "2023-12"
release_date = "2023-11-06"
last_updated = "2024-04-09"
status = "deprecated"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
structured_output = false
temperature = true
system_updates = true
effort_updates = false
store = true
cache = false

[limit]
context = 128_000
output = 4_096

[api.responses]

[api.chat-completions]
sdk = { opencodeai = "@opencode/ai/providers/openai/chat" }

[cost.text.input]
price = 10

[cost.text.output]
price = 30
