schema = 2
name = "GPT-5.2"
description = "Reliable GPT generation for broad coding, writing, and tool-assisted product work"
family = "gpt"
open_weights = false
knowledge = "2025-08-31"
release_date = "2025-12-11"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true
temperature = true
system_updates = true
effort_updates = false
store = true
cache = { supported = true, implicit = { ttl = ["24h"], min_tokens = 1_024 }, explicit = false }
prompt_cache_key = true
service_tier = ["flex", "priority"]

[limit]
context = 400_000
input = 272_000
output = 128_000

[cost.text.input]
price = 1.75
cache = { read = 0.175 }

[cost.text.output]
price = 14

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 2

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.5

[experimental.modes.fast]
service_tier = "priority"
body = { service_tier = "priority" }

[experimental.modes.flex]
body = { service_tier = "flex" }
