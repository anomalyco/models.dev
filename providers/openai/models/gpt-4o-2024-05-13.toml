schema = 2
name = "GPT-4o (2024-05-13)"
description = "GPT model for general reasoning, writing, coding, and tool-assisted tasks"
family = "gpt"
open_weights = false
knowledge = "2023-09"
release_date = "2024-05-13"
status = "deprecated"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = true }
reasoning = { supported = false }
structured_output = true
temperature = true
system_updates = true
effort_updates = false
store = true
cache = false
service_tier = ["priority"]

[limit]
context = 128_000
output = 4_096

[cost.text.input]
price = 5

[cost.text.output]
price = 15

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.75

[experimental.modes.fast]
service_tier = "priority"
body = { service_tier = "priority" }
