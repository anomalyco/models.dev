schema = 2
name = "o3-pro"
description = "High-effort o3 tier for difficult technical reasoning and careful answers"
family = "o-pro"
open_weights = false
knowledge = "2024-05"
release_date = "2025-06-10"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
temperature = false
system_updates = true
effort_updates = false
tool_updates = true
store = true
cache = { supported = false }

[limit]
context = 200_000
output = 100_000

[cost.text.input]
price = 20

[cost.text.output]
price = 80
