schema = 2
name = "GPT-4o (2024-08-06)"
description = "GPT model for general reasoning, writing, coding, and tool-assisted tasks"
family = "gpt"
open_weights = false
knowledge = "2023-09"
release_date = "2024-08-06"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
structured_output = true
temperature = true
system_updates = true
effort_updates = false
tool_updates = true
store = true
cache = { supported = true, implicit = { min_tokens = 1_024 }, explicit = false }
prompt_cache_key = true

[limit]
context = 128_000
output = 16_384

[cost.text.input]
price = 2.5
cache = { read = 1.25 }

[cost.text.output]
price = 10
