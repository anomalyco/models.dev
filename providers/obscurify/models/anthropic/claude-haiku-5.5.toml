# Prices: GET https://obscurify.ai/v1/models (pricing.* per token x 1M), synced by packages/core/src/sync/providers/obscurify.ts. One flat price per model.
# Toggle: thinking.type = disabled, or reasoning.enabled = true|false
# Effort: reasoning_effort = low|medium|high|xhigh|max
# Controls follow providers/anthropic/models/claude-haiku-5-5.toml.
# Checked live on POST https://obscurify.ai/v1/chat/completions, 2026-10-23: low and max accepted (no reasoning at low, reasoning returned at max); with reasoning_effort = high, thinking.type = disabled and reasoning.enabled = false each removed the reasoning.
# Reasoning is returned in message.reasoning (checked live on POST /v1/chat/completions, 2026-11-11). reasoning_field = "reasoning" is valid in v2, but v1's interleaved.field only allows reasoning_content|reasoning_details, so no reasoning_field is set rather than a wrong one.
# Cache: automatic, no cache_control markers. Checked live on POST https://obscurify.ai/v1/chat/completions, 2026-11-11: the same 7k+ token prompt sent twice; the second reply reported usage.prompt_tokens_details.cached_tokens, billed (usage.cost) at the cache read rate; the first was billed at the cache write rate.
schema = 2
base_model = "anthropic/claude-haiku-5-5"

[capabilities]
cache = { implicit = true }
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 0.1105
cache = { read = 0.01105, write = 0.138125 }

[cost.text.output]
price = 0.5525
