# Prices: GET https://obscurify.ai/v1/models (pricing.* per token x 1M), synced by packages/core/src/sync/providers/obscurify.ts. One flat price per model.
# Toggle: reasoning.enabled = true|false
# Effort: reasoning_effort = low|high|max
# Controls follow the DeepSeek entries (providers/deepseek/models/deepseek-v4-pro.toml): toggle plus low|high|max.
# Checked live on POST https://obscurify.ai/v1/chat/completions, 2026-10-23: reasoning.enabled = false removed the reasoning (6/6) and true returned it (2/2); low and max accepted, max reasoned longer (3 runs each). thinking.type was not applied reliably here, so the toggle is reasoning.enabled. Re-checked 2026-10-28: reasoning.enabled = false gave no reasoning (2/2), true reasoned; low, high and max accepted.
# Limits: GET https://obscurify.ai/v1/models reports context_length 1048576 (lab file: 1000000) and no max output. A prompt longer than the lab's window could not be verified here, so context and output are inherited from the lab.
# Reasoning is returned in message.reasoning (checked live on POST /v1/chat/completions, 2026-11-11). reasoning_field = "reasoning" is valid in v2, but v1's interleaved.field only allows reasoning_content|reasoning_details, so no reasoning_field is set rather than a wrong one.
# Cache: automatic, no cache_control markers. Checked live on POST https://obscurify.ai/v1/chat/completions, 2026-11-11: the same 7k+ token prompt sent twice; the second reply reported usage.prompt_tokens_details.cached_tokens, billed (usage.cost) at the cache read rate; a hit is not guaranteed (cached on one of two runs).
schema = 2
base_model = "deepseek/deepseek-v4-flash"

[capabilities]
cache = { implicit = true }
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }

[cost.text.input]
price = 0.117
cache = { read = 0.0234 }

[cost.text.output]
price = 0.234
