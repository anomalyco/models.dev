# Prices: GET https://obscurify.ai/v1/models (pricing per token x 1M), accessed 2026-10-23. Obscurify.ai bills one flat price per model.
# Reasoning: Obscurify.ai forwards `reasoning_effort` / `reasoning.effort` unchanged to its relay upstream (OpenRouter or NanoGPT), so the levels match providers/openrouter/models/deepseek/deepseek-v4-pro-0813.toml
schema = 2
base_model = "deepseek/deepseek-v4-pro-0813"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }

[limit]
context = 1_048_576

[cost.text.input]
price = 0.1459

[cost.text.output]
price = 0.4376
