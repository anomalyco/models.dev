# Prices: GET https://obscurify.ai/v1/models (pricing per token x 1M), accessed 2026-10-23. Obscurify.ai bills one flat price per model.
# Reasoning: Obscurify.ai forwards `reasoning_effort` / `reasoning.effort` unchanged to its relay upstream (OpenRouter or NanoGPT), so the levels match providers/openrouter/models/openai/gpt-6-luna.toml
schema = 2
base_model = "openai/gpt-6-luna"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 0.1105

[cost.text.output]
price = 0.5525
