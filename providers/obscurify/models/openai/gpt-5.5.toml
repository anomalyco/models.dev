# Prices: GET https://obscurify.ai/v1/models (pricing.* per token x 1M), synced by packages/core/src/sync/providers/obscurify.ts. One flat price per model.
# Effort: reasoning_effort = none|low|medium|high|xhigh (none turns reasoning off)
# Controls follow providers/openai/models/gpt-5.5.toml.
# Checked live on POST https://obscurify.ai/v1/chat/completions, 2026-10-23: none and xhigh accepted (on a multi-step arithmetic prompt, none returned no reasoning and xhigh did); an unknown level is rejected.
# tools.freeform left out: POST https://obscurify.ai/v1/chat/completions rejects custom tools. A custom tool with format text, regex (ZZ[0-9]{3}) or lark (start: "ZZ" DIGIT DIGIT DIGIT) returns 400 "The model rejected this request. Check the parameters and try again." with or without tool_choice, while the same request with a function tool returns a tool call (live 2026-11-07 on this model).
# Reasoning is returned in message.reasoning (checked live on POST /v1/chat/completions, 2026-11-11). reasoning_field = "reasoning" is valid in v2, but v1's interleaved.field only allows reasoning_content|reasoning_details, so no reasoning_field is set rather than a wrong one.
# Cache: automatic, no cache_control markers. Checked live on POST https://obscurify.ai/v1/chat/completions, 2026-11-11: the same 7k+ token prompt sent twice; the second reply reported usage.prompt_tokens_details.cached_tokens, billed (usage.cost) at the cache read rate.
schema = 2
base_model = "openai/gpt-5.5"

[capabilities]
cache = { implicit = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }

[cost.text.input]
price = 5.525
cache = { read = 0.5525 }

[cost.text.output]
price = 33.15
