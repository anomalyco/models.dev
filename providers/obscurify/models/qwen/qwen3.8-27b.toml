# Prices: GET https://obscurify.ai/v1/models (pricing.* per token x 1M), synced by packages/core/src/sync/providers/obscurify.ts. One flat price per model.
# Effort: reasoning_effort = none|low|medium|xhigh (none turns thinking off)
# Levels follow providers/alibaba/models/qwen3.8-27b.toml plus none; no budget.
# Checked live on POST https://obscurify.ai/v1/chat/completions, 2026-10-23: none returned no reasoning (3/3) while low reasoned; low, medium and xhigh accepted, an unknown level is rejected. thinking_budget is not enforced here (a 64-token budget still produced hundreds of reasoning tokens), so budget is left out. Re-checked 2026-10-28: none returned no reasoning (4/4); low, medium and xhigh reasoned.
# Limits: GET https://obscurify.ai/v1/models reports context_length 1048576 (lab file: 262144) and no max output. A prompt longer than the lab's window could not be verified here, so context and output are inherited from the lab.
# Reasoning is returned in message.reasoning (checked live on POST /v1/chat/completions, 2026-11-11). reasoning_field = "reasoning" is valid in v2, but v1's interleaved.field only allows reasoning_content|reasoning_details, so no reasoning_field is set rather than a wrong one.
# Cache: automatic, no cache_control markers. Checked live on POST https://obscurify.ai/v1/chat/completions, 2026-11-11: the same 7k+ token prompt sent twice; the second reply reported usage.prompt_tokens_details.cached_tokens, billed (usage.cost) at the cache read rate.
schema = 2
base_model = "alibaba/qwen3.8-27b"

[capabilities]
cache = { implicit = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "xhigh"] }

[cost.text.input]
price = 0.16575
cache = { read = 0.0442 }

[cost.text.output]
price = 0.7735
