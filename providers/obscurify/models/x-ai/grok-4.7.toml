# Prices: GET https://obscurify.ai/v1/models (pricing.* per token x 1M), synced by packages/core/src/sync/providers/obscurify.ts. One flat price per model.
# Effort: reasoning_effort = low|medium|high|xhigh
# Controls follow providers/xai/models/grok-4.7.toml.
# Checked live on POST https://obscurify.ai/v1/chat/completions, 2026-10-23: low and xhigh accepted, xhigh used about 2x the completion tokens.
# Reasoning is returned in message.reasoning (checked live on POST /v1/chat/completions, 2026-11-11). reasoning_field = "reasoning" is valid in v2, but v1's interleaved.field only allows reasoning_content|reasoning_details, so no reasoning_field is set rather than a wrong one.
# Cache: automatic, no cache_control markers. Checked live on POST https://obscurify.ai/v1/chat/completions, 2026-11-11: the same 7k+ token prompt sent twice; the second reply reported usage.prompt_tokens_details.cached_tokens, billed (usage.cost) at the cache read rate.
schema = 2
base_model = "xai/grok-4.7"

[capabilities]
cache = { implicit = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }

[cost.text.input]
price = 2.21
cache = { read = 0.5525 }

[cost.text.output]
price = 6.63
