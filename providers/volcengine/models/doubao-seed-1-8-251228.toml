# Volcengine also splits the base band by OUTPUT length: CNY 2.00/M for outputs
# under 200 tokens and CNY 8.00/M above it. The higher (general-case) rate is used
# here since the catalog has no output-length dimension.
# Output tiering note applies to the base [cost] block only.
