# Model ID, limits and capabilities: https://ark.volcengine.com/region:cn-beijing/docs/model-list.md (accessed 2026-11-24); not called live (no Ark key).
# CNY list prices (在线推理（常规）): https://ark.volcengine.com/region:cn-beijing/docs/model-pricing.md (accessed 2026-11-24)
# CNY→USD rate: 6.679299, 2026-11-24, source: https://open.er-api.com/v6/latest/USD
# CNY 0.8 input / 0.16 cache hit / 2.7 output per M tokens, one band [0, 1024K];
# audio input CNY 12 (cache hit 2.4).
# Effort: reasoning_effort = none|low|medium|high (default high). Ark accepts all 7 values but maps
# none -> minimal (thinking off) and xhigh/max -> high (兼容映射 table, https://ark.volcengine.com/region:cn-beijing/docs/deep-thinking.md).
# No separate toggle: none is the off switch.
# Cache: implicit prefix caching is on by default on the Chat API, per https://ark.volcengine.com/region:cn-beijing/docs/context-cache.md and the
# model list's 上下文缓存能力 table.
# Not modelled: the flex tier (service_tier=flex, half input/output price) and the low-latency tier.
schema = 2
base_model = "bytedance-seed/seed-2.1-lite"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "high" }, effort = ["none", "low", "medium", "high"] }
cache = { implicit = true }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.11977
cache = { read = 0.02395 }

[cost.audio.input]
price = 1.7966
cache = { read = 0.35932 }

[cost.text.output]
price = 0.40423
