name = "Volcengine Ark"
env = ["ARK_API_KEY"]
npm = "@ai-sdk/openai-compatible"
opencodeai = "@opencode/ai/providers/openai-compatible"
# Reasoning HTTP format (accessed 2026-08-26):
# OpenAI Chat: POST /api/v3/chat/completions; `thinking.type` = enabled|disabled
# (`auto` is documented but rejected with "Unsupported thinking type for the
# current model" on every model here except doubao-seed-1-6-flash),
# `reasoning_effort` accepts none|minimal|low|medium|high|xhigh|max on every model,
# but each model family maps some values onto others, so each file declares only the
# distinct levels (兼容映射 table, https://ark.volcengine.com/region:cn-beijing/docs/deep-thinking.md,
# accessed 2026-11-24):
#   doubao-seed 2.x / evolving / character -> none|low|medium|high (none = minimal = off; xhigh/max -> high)
#   glm-5-2                                -> none|high|max (low/medium -> high; xhigh -> max)
#   glm-5-3-flash                          -> low|high|max (always thinks)
#   deepseek-v4-*-ga                       -> none|low|high|max (medium -> low; xhigh -> high)
# Plaintext reasoning is in
# `choices[].message.reasoning_content`, encrypted block is in
# `choices[].message.encrypted_content` (returned by default).
# Responses: POST /api/v3/responses; `reasoning.effort`; encrypted block requires
# explicit `include = ["reasoning.encrypted_content"]`.
# Anthropic: POST /api/v3/compatible/v1/messages; `thinking.type`,
# `output_config.effort` = low|high|max; plaintext thinking is in
# `content[thinking].thinking`, signature in `content[thinking].signature` (returned by default).
# Sources:
# https://www.volcengine.com/docs/82379/1298459
# https://www.volcengine.com/docs/82379/1330310
# https://www.volcengine.com/docs/82379/2636748
doc = "https://www.volcengine.com/docs/82379/1330310"
api = "https://ark.cn-beijing.volces.com/api/v3"
