# Sources (accessed 2026-10-02):
# Alias routes to the latest available GLM Flash model (currently GLM-5.3-Flash, 1M context):
# https://docs.privatemode.ai/models/overview/#glm-53-flash
# Pricing (EUR): https://docs.privatemode.ai/pricing/
# Context 1M in v1.57.0, still current in v1.58.0: https://docs.privatemode.ai/release/#v1570
# Effort: reasoning_effort = low|high|max (default max; always on).
# Any other value including none is silently mapped to max; reasoning cannot be off.
# Cost: EUR list prices converted at 1 EUR = 1.1555 USD (Frankfurter 2026-08-10),
# matching other Privatemode catalog entries.
# EUR/MTok: input 0.20 / output 0.65 / cached input 0.05
# Host exposes text+image only (docs); lab base also lists video/pdf.
schema = 2
base_model = "zhipuai/glm-5.3-flash"
name = "GLM Flash (latest)"
status = "beta"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[cost.text.input]
price = 0.2311
cache = { read = 0.0578 }

[cost.text.output]
price = 0.7511
