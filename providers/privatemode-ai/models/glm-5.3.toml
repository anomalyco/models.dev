# Sources (accessed 2026-10-02):
# Model overview (1M context): https://docs.privatemode.ai/models/overview/#glm-53
# Pricing (EUR): https://docs.privatemode.ai/pricing/
# Context 1M in v1.57.0, still current in v1.58.0: https://docs.privatemode.ai/release/#v1570
# Added in v1.55.0 (upgraded from GLM-5.2): https://docs.privatemode.ai/release/#v1550
# Upstream: https://huggingface.co/zai-org/GLM-5.3
# Effort: reasoning_effort = low|high|max (default max; always on).
# Any other value including none is silently mapped to max; reasoning cannot be off.
# Cost: EUR list prices converted at 1 EUR = 1.1555 USD (Frankfurter 2026-08-10),
# matching other Privatemode catalog entries.
# EUR/MTok: input 1.55 / output 5.74 / cached input 0.15
# Status: GA; the models overview no longer marks GLM-5.3 or GLM-5.3-Flash as preview
# (only DeepSeek-OCR-2), accessed 2026-10-21.
schema = 2
base_model = "zhipuai/glm-5.3"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[cost.text.input]
price = 1.791
cache = { read = 0.1733 }

[cost.text.output]
price = 6.6326
