# Off is reasoning_effort=none; graded levels low|medium|high. No toggle.
# Munito validates reasoning_effort against the levels this model declares.
base_model = "aleph-alpha/kolibri-1"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high"] }]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.13
cache_read = 0.078
output = 1.0
