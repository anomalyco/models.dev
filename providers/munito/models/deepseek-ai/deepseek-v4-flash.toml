# Source: https://api.munito.ai/inference/v1/models/openrouter (public), standard tier on the global host.
# Limits: the feed gives max_context_length 1048576 and max_length 943718 (max_tokens.max 943718) for this ID.
# Toggle: chat_template_kwargs.thinking = true|false (the only switch that the feed lists for this ID)
# Effort: reasoning_effort = low|high|max
base_model = "deepseek/deepseek-v4-flash"
structured_output = true

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 0.1
output = 0.25
cache_read = 0.02

[limit]
context = 1_048_576
output = 943_718
