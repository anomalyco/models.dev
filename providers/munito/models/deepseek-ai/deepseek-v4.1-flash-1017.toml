# Sources (accessed 2026-10-24):
# Prices, context and maximum output: https://docs.munito.ai/models/deepseek-ai-deepseek-v4-1-flash-1017
# Input formats: https://docs.munito.ai/vision
# Reasoning: https://docs.munito.ai/reasoning. The reasoning is in message.reasoning and delta.reasoning,
# and the API reads reasoning_content (or reasoning) in the history.
# Cache: automatic prefix cache, no cache_control markers, no cache-write fee (https://docs.munito.ai/prompt-caching).
# Off is reasoning_effort = none (or chat_template_kwargs.enable_thinking = false). Graded levels, no toggle.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"
status = "beta"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp", "image/gif", "image/bmp", "image/tiff", "image/avif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 1_048_576
output = 943_718

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.27
cache = { read = 0.0054 }

[cost.text.output]
price = 1.0
