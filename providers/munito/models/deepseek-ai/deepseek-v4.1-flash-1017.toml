# Source: https://api.munito.ai/inference/v1/models/openrouter (public), standard tier on the global host.
# Limits: Munito serves this checkpoint with a 262,144-token window, so the feed gives
# max_context_length 262144 and max_length 235929 (max_tokens.max 235929) for this ID.
# Toggle: chat_template_kwargs.enable_thinking = true|false (the only switch that the feed lists for this ID)
# Effort: reasoning_effort = low|high|max
base_model = "deepseek/deepseek-v4.1-flash-1017"
attachment = false
structured_output = true

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 0.29
output = 1.2
cache_read = 0.006

[limit]
context = 262_144
output = 235_929

[modalities]
input = ["text"]
