# Native Gemini uses $.generationConfig.thinkingConfig.thinkingBudget: -1 is dynamic and manual budgets are 128..32768; 0/off is unsupported. https://cloud.google.com/vertex-ai/generative-ai/docs/thinking (accessed 2026-06-25)
schema = 2
name = "Gemini 2.5 Pro"
description = "Advanced Gemini model for complex reasoning, coding, and multimodal analysis"
family = "gemini-pro"
open_weights = false
knowledge = "2025-01"
release_date = "2025-03-20"
last_updated = "2025-06-05"

[modalities]
input = ["text", "image", "audio", "video", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
temperature = true

[limit]
context = 1_048_576
output = 65_536

[cost.text.input]
price = 1.25
cache = { read = 0.125 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 2.5
cache = { read = 0.25 }

[cost.text.output]
price = 10

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 15
