schema = 2
base_model = "google/gemini-3.5-flash"

[modalities]
input = ["text", "image", "audio", "video"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true

[limit]
context = 1_000_000
output = 64_000

[cost.text.input]
price = 1.5
cache = { read = 1.5 }

[cost.text.output]
price = 9
