# Toggle: enable_thinking = true|false
# Budget: thinking_budget = integer reasoning tokens
schema = 2
base_model = "alibaba/qwen3.7-flash"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, budget = { max = 262_144 } }
structured_output = true

[limit]
context = 991_000
output = 64_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.0282
cache = { read = 0.00564, write = 0.03525 }

[cost.text.output]
price = 0.1128
