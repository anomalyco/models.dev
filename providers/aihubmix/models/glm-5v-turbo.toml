schema = 2
base_model = "zhipuai/glm-5v-turbo"
name = "GLM 5 Vision Turbo"
description = "GLM vision model for visual reasoning, documents, and multimodal agents"

[modalities]
input = ["text", "image/jpeg", "image/png", "video/mp4", "video/quicktime", "video/x-matroska"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
output = 128_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.7042
cache = { read = 0.169008 }

[cost.text.output]
price = 3.09848
