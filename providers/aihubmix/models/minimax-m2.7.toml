schema = 2
name = "MiniMax M2.7"
description = "MiniMax model for chat, coding, office work, and agentic tasks"
family = "minimax"
open_weights = true
release_date = "2026-03-18"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
structured_output = true
temperature = true

[limit]
