# AIHubMix model page documents Kimi K3 pricing, supported input modalities
# (text, vision, video), and a 1M-token context window.
# Source accessed 2026-07-27:
# https://aihubmix.com/model/kimi-k3
schema = 2
base_model = "moonshotai/kimi-k3"
last_updated = "2026-07-27"

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 3
cache = { read = 0.3 }

[cost.text.output]
price = 15
