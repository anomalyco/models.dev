base_model = "anthropic/claude-sonnet-5"
structured_output = true
reasoning_options = [{ type = "toggle" }, { type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]
interleaved = true
temperature = false

[cost]
input = 2
output = 10
cache_read = 0.2
cache_write = 2.5

[limit]
context = 1_000_000
output = 128_000

[modalities]
input = ["text", "image"]
output = ["text"]
