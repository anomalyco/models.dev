base_model = "google/gemini-3.7-flash"
# AIHubMix unified Chat: $.reasoning_effort = minimal|low|medium|high
# (mirrors aiHubMix gemini-3.5-flash; "none"/"xhigh" omitted per that peer set).
# https://docs.aihubmix.com/cn/api/unified-inference
reasoning_options = [{ type = "effort", values = ["minimal", "low", "medium", "high"] }]

[cost]
input = 0.75
output = 3.75
cache_read = 0.075

[limit]
context = 1_050_000
output = 65_500
