# Prices, limits and input modalities: AIHubMix catalog GET https://aihubmix.com/api/v1/models (2026-10-21).
# Cache: https://docs.aihubmix.com/cn/practices/prompt-caching.md
schema = 2
base_model = "google/gemini-3-flash-preview"
description = "Fast Gemini model balancing multimodal reasoning, tool use, and cost"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true
cache = { supported = true, implicit = true, explicit = true }

[cost.text.input]
price = 0.5
cache = { read = 0.05, storage = 1 }

[cost.text.output]
price = 3

[cost.audio.input]
price = 1
cache = { read = 0.1 }
