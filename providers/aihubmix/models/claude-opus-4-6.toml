# Native Messages prefers $.thinking.type = "adaptive" with $.output_config.effort = "low"|"medium"|"high"|"max"; enabled budget_tokens >= 1024 is deprecated and must be < $.max_tokens. https://docs.aihubmix.com/cn/api/Claude-Native (accessed 2026-06-25)
schema = 2
base_model = "anthropic/claude-opus-4-6"
description = "Flagship Claude model for deep reasoning, coding, and long-horizon agents"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "max"], budget = { min = 1_024 } }
structured_output = true

[api.chat-completions]
compatibility = { replay_reasoning = true }

[cost.text.input]
price = 5
cache = { read = 0.5, write = 6.25 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 10
cache = { read = 1, write = 12.5 }

[cost.text.output]
price = 25

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 37.5
