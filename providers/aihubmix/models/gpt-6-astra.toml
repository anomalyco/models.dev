# Effort: low|medium|high|xhigh|max
# $.reasoning_effort on /v1/chat/completions (alias $.reasoning.effort, which is also the Responses field);
# $.output_config.effort on /v1/messages, subject to model support.
# https://docs.aihubmix.com/cn/api/unified-inference
schema = 2
base_model = "openai/gpt-6-astra"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 10
cache = { read = 1, write = 12.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 20
cache = { read = 2, write = 25 }

[cost.text.output]
price = 50

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 75
