schema = 2
base_model = "moonshotai/kimi-k2.7-code-highspeed"

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
context = 262_144
output = 32_768

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.9
cache = { read = 0.32167 }

[cost.text.output]
price = 7.999
