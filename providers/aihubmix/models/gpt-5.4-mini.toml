# Prices, limits and input modalities: AIHubMix catalog GET https://aihubmix.com/api/v1/models (2026-10-21).
# Cache: https://docs.aihubmix.com/cn/practices/prompt-caching.md
schema = 2
base_model = "openai/gpt-5.4-mini"
description = "Compact GPT model for low-latency assistance and high-volume workloads"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true
cache = { implicit = { min_tokens = 1_024 } }
temperature = false

[cost.text.input]
price = 0.75
cache = { read = 0.075 }

[cost.text.output]
price = 4.5

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 2

[experimental.modes.fast]
service_tier = "priority"
body = { service_tier = "priority" }
