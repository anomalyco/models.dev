schema = 2
name = "GPT-5.5"
description = "Frontier GPT model for professional reasoning, coding, and multimodal work"
family = "gpt"
open_weights = false
knowledge = "2025-12-01"
release_date = "2026-04-23"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true
temperature = false

[limit]
context = 1_050_000
input = 922_000
output = 128_000

[cost.text.input]
price = 5
cache = { read = 0.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 10
cache = { read = 1 }

[cost.text.output]
price = 30

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 45

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 2.5

[experimental.modes.fast]
service_tier = "priority"
body = { service_tier = "priority" }
