# Prices, limits and input modalities: AIHubMix catalog GET https://aihubmix.com/api/v1/models (2026-10-21).
# Cache: https://docs.aihubmix.com/cn/practices/prompt-caching.md
schema = 2
base_model = "openai/gpt-5.5"
description = "Frontier GPT model for professional reasoning, coding, and multimodal work"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true
cache = { supported = true, implicit = { min_tokens = 1_024 } }

[cost.text.input]
price = 5
cache = { read = 0.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 10
cache = { read = 1 }

[cost.text.output]
price = 30

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 45

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 2.5

[experimental.modes.fast]
service_tier = "priority"
body = { service_tier = "priority" }
