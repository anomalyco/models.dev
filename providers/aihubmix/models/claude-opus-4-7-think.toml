schema = 2
name = "Claude Opus 4.7 Thinking"
description = "Flagship Claude model for deep reasoning, coding, and long-horizon agents"
family = "claude-opus"
open_weights = false
knowledge = "2026-01-31"
release_date = "2026-04-16"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
temperature = false

[limit]
context = 1_000_000
output = 128_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 5
cache = { read = 0.5, write = 6.25 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 10
cache = { read = 1, write = 12.5 }

[cost.text.output]
price = 25

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 37.5
