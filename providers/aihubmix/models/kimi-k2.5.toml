schema = 2
name = "Kimi K2.5"
description = "Kimi multimodal agent model for visual understanding, coding, and planning"
family = "kimi-k2"
open_weights = true
knowledge = "2025-01"
release_date = "2026-01"

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true }
structured_output = true
temperature = false

[limit]
context = 262_144
output = 32_768

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.6
cache = { read = 0.1 }

[cost.text.output]
price = 3
