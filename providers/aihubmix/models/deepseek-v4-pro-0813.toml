# Toggle: enable_thinking = true|false
# Effort: reasoning_effort = high|max
# AIHubMix effort levels returned HTTP 200 (validated 2026-08-31T04:17:24Z).
# Prices, limits and input modalities: AIHubMix catalog GET https://aihubmix.com/api/v1/models (2026-10-21).
# Cache: https://docs.aihubmix.com/cn/practices/prompt-caching.md
# peak hours 01:00-04:00, 06:00-10:00 UTC bill 2.02x (catalog time_condition lines).
schema = 2
base_model = "deepseek/deepseek-v4-pro-0813"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["high", "max"] }
structured_output = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.6918
cache = { read = 0.023057694 }

[cost.text.output]
price = 2.0754

[[cost.multipliers]]
when = { any = [{ all = [{ utc_hours = { gte = "01:00" } }, { utc_hours = { lt = "04:00" } }] }, { all = [{ utc_hours = { gte = "06:00" } }, { utc_hours = { lt = "10:00" } }] }] }
factor = 2.02
