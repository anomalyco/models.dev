# Toggle:
# $.enable_thinking = true|false on the OpenAI-compatible /v1/chat/completions path (verified live 2026-09-11);
# $.thinking.type = "enabled"|"disabled"|"adaptive" on /v1/messages; $.generationConfig.thinkingConfig on the Gemini path.
# Effort: low|high|max
# $.reasoning_effort on /v1/chat/completions (alias $.reasoning.effort, which is also the Responses field);
# $.output_config.effort on /v1/messages, subject to model support.
# https://docs.aihubmix.com/cn/api/unified-inference
# These three are the lab's own published levels, passed through unchanged: DeepSeek
# documents `reasoning_effort` as `Possible values: [none, low, high, max]`, with `medium`
# and `xhigh` folded into `high` (api-docs.deepseek.com, checked 2026-09-18), and all
# seven DeepSeek routes here carry the same set. Probing on 2026-09-15 could not
# separate them on a single prompt (low/high/max → 522/564/510 reasoning tokens,
# non-monotonic), which says something about that prompt, not about the enum.
# `none` is listed alongside them but is the off switch spelled as a level -- the docs
# read "none disables thinking mode; low/high/max enable thinking mode" -- so it is
# carried by `type = "toggle"` above and deliberately left out of the effort values.
base_model = "deepseek/deepseek-v4-pro-0813"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 0.6918
output = 2.0754
cache_read = 0.023058
