# Prices, limits and input modalities: AIHubMix catalog GET https://aihubmix.com/api/v1/models (2026-10-21).
# Cache: https://docs.aihubmix.com/cn/practices/prompt-caching.md
# Toggle: see provider.toml (Chat `reasoning_effort = none`, Messages `thinking.type = disabled`).
schema = 2
base_model = "bytedance-seed/seed-2.0-code"
name = "Doubao Seed 2.0 Code Preview"
description = "Coding model for repository understanding, refactors, and agentic engineering tasks"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/tiff", "image/x-icon", "image/x-icns", "image/sgi", "image/jp2", "image/heic", "video/mp4", "video/x-msvideo", "video/quicktime", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 256_000
output = 128_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.4822
cache = { read = 0.09644 }

[[cost.text.input.overrides]]
when = { context = { gt = 32_000 } }
price = 0.72328
cache = { read = 0.144656 }

[[cost.text.input.overrides]]
when = { context = { gt = 128_000 } }
price = 1.4466
cache = { read = 0.28932 }

[cost.text.output]
price = 2.411

[[cost.text.output.overrides]]
when = { context = { gt = 32_000 } }
price = 3.6164

[[cost.text.output.overrides]]
when = { context = { gt = 128_000 } }
price = 7.233
