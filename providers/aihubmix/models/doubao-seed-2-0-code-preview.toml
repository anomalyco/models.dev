schema = 2
name = "Doubao Seed 2.0 Code Preview"
description = "Coding model for repository understanding, refactors, and agentic engineering tasks"
family = "seed"
open_weights = false
release_date = "2026-02-14"

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true
temperature = true

[limit]
context = 256_000
output = 128_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.48
cache = { read = 0.09644 }

[[cost.text.input.overrides]]
when = { context = { gt = 32_000 } }
price = 0.72
cache = { read = 0.144656 }

[[cost.text.input.overrides]]
when = { context = { gt = 128_000 } }
price = 1.45
cache = { read = 0.28932 }

[cost.text.output]
price = 2.41

[[cost.text.output.overrides]]
when = { context = { gt = 32_000 } }
price = 3.62

[[cost.text.output.overrides]]
when = { context = { gt = 128_000 } }
price = 7.23
