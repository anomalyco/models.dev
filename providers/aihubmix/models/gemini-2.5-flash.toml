# Native Gemini uses $.generationConfig.thinkingConfig.thinkingBudget: 0 disables, -1 is dynamic, and manual budgets are 1..24576. https://cloud.google.com/vertex-ai/generative-ai/docs/thinking (accessed 2026-06-25)
schema = 2
name = "Gemini 2.5 Flash"
description = "Fast Gemini model balancing multimodal reasoning, tool use, and cost"
family = "gemini-flash"
open_weights = false
knowledge = "2025-01"
release_date = "2025-03-20"
last_updated = "2025-06-05"

[modalities]
input = ["text", "image", "audio", "video", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high"], budget = { min = 0, max = 24_576 } }
structured_output = true
temperature = true

[limit]
context = 1_048_576
output = 65_536

[cost.text.input]
price = 0.3
cache = { read = 0.03 }

[cost.text.output]
price = 2.5

[cost.audio.input]
price = 1
