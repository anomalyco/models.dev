# Native Gemini uses $.generationConfig.thinkingConfig.thinkingBudget: 0 disables, -1 is dynamic, and manual budgets are 1..24576. https://cloud.google.com/vertex-ai/generative-ai/docs/thinking (accessed 2026-06-25)
name = "Gemini 2.5 Flash"
description = "Fast Gemini model balancing multimodal reasoning, tool use, and cost"
family = "gemini-flash"
release_date = "2025-03-20"
last_updated = "2025-06-05"
attachment = true
reasoning = true
temperature = true
tool_call = true
structured_output = true
knowledge = "2025-01"
open_weights = false

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[[reasoning_options]]
type = "budget_tokens"
min = 0
max = 24_576

[cost]
input = 0.3
output = 2.499
cache_read = 0.03
input_audio = 1

[limit]
context = 1_048_576
output = 65_536

[modalities]
input = ["text", "image", "audio", "video", "pdf"]
output = ["text"]
