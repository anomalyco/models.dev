# Native Gemini uses $.generationConfig.thinkingConfig.thinkingBudget: 0 disables, -1 is dynamic, and manual budgets are 1..24576. https://cloud.google.com/vertex-ai/generative-ai/docs/thinking (accessed 2026-06-25)
# Prices, limits and input modalities: AIHubMix catalog GET https://aihubmix.com/api/v1/models (2026-10-21).
# Cache: https://docs.aihubmix.com/cn/practices/prompt-caching.md
schema = 2
base_model = "google/gemini-2.5-flash"
description = "Fast Gemini model balancing multimodal reasoning, tool use, and cost"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high"], budget = { min = 0, max = 24_576 } }
structured_output = true
cache = { implicit = true, explicit = true }

[cost.text.input]
price = 0.3
cache = { read = 0.03, storage = 1 }

[cost.text.output]
price = 2.499

[cost.audio.input]
price = 0.9999
cache = { read = 0.0999 }
