# Sources (accessed 2026-09-20):
# https://aihubmix.com/api/v1/models?type=llm (USD per million tokens)
# https://ai.google.dev/gemini-api/docs/models/gemini-3.1-flash-image
# Effort: reasoning_effort = minimal|high on /v1/chat/completions.
# Gemini native: generationConfig.thinkingConfig.thinkingLevel uses the corresponding uppercase levels.
# https://docs.aihubmix.com/cn/api/unified-inference
# Prices, limits and input modalities: AIHubMix catalog GET https://aihubmix.com/api/v1/models (2026-10-21).
# Images: POST /v1/images/generations (https://aihubmix.com/call/schema/models/gemini-3.1-flash-image/endpoints)
schema = 2
base_model = "google/gemini-3.1-flash-image"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "high"] }

[api.chat-completions]
legacy_interleaved = true

[api.images]
sdk = { opencodeai = "@opencode/ai/providers/openai-compatible/images" }

[cost.text.input]
price = 0.5

[cost.text.output]
price = 3
