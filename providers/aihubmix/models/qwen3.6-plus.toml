schema = 2
base_model = "alibaba/qwen3.6-plus"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
context = 991_000
output = 64_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.28
cache = { read = 0.0282, write = 0.3525 }

[[cost.text.input.overrides]]
when = { context = { gt = 256_000 } }
price = 1.13
cache = { read = 0.1128, write = 1.41 }

[cost.text.output]
price = 1.69

[[cost.text.output.overrides]]
when = { context = { gt = 256_000 } }
price = 6.77
