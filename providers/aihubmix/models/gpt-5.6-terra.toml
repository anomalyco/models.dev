schema = 2
base_model = "openai/gpt-5.6-terra"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
temperature = false

[limit]
context = 1_050_000
output = 128_000

[cost.text.input]
price = 2.5
cache = { read = 0.25, write = 3.125 }

[cost.text.output]
price = 15
