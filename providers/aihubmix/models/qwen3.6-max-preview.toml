# Retired: listed as Retired on https://aihubmix.com/models/retirements ("Requests return 404 model_retired") (2026-10-21).
# Cache: https://docs.aihubmix.com/cn/practices/prompt-caching.md
# Toggle: see provider.toml (Chat `reasoning_effort = none`, Messages `thinking.type = disabled`).
schema = 2
base_model = "alibaba/qwen3.6-max-preview"
description = "Flagship model for demanding analysis, coding, and production agent workflows"
status = "deprecated"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
cache = { supported = true }

[limit]
context = 240_000
output = 64_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.27
cache = { read = 0.1268, write = 1.585 }

[[cost.text.input.overrides]]
when = { context = { gt = 128_000 } }
price = 2.11
cache = { read = 0.2112, write = 2.64 }

[cost.text.output]
price = 7.61

[[cost.text.output.overrides]]
when = { context = { gt = 128_000 } }
price = 12.67
