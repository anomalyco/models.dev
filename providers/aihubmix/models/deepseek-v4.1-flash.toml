# AIHubMix pricing per https://aihubmix.com/model/deepseek-v4.1-flash (accessed 2026-09-11).
# Base/off-peak rate: input $0.155, output $0.62, cache $0.0031 per 1M tokens.
# Peak rate (01:00-04:00, 06:00-10:00 UTC) is 2x: input $0.3098, output $1.2392, cache $0.0062.
# Toggle: enable_thinking = true|false
# Effort: reasoning_effort = low|high|max
# AIHubMix effort levels returned HTTP 200 (validated 2026-08-31T04:17:24Z).
# Prices, limits and input modalities: AIHubMix catalog GET https://aihubmix.com/api/v1/models (2026-10-21).
# Cache: https://docs.aihubmix.com/cn/practices/prompt-caching.md
# peak hours 01:00-04:00, 06:00-10:00 UTC bill 2x (catalog time_condition lines).
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { supported = true, implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.155
cache = { read = 0.0031 }

[cost.text.output]
price = 0.62

[[cost.multipliers]]
when = { any = [{ all = [{ utc_hours = { gte = "01:00" } }, { utc_hours = { lt = "04:00" } }] }, { all = [{ utc_hours = { gte = "06:00" } }, { utc_hours = { lt = "10:00" } }] }] }
factor = 2
