schema = 2
name = "Claude Opus 4.6 Thinking"
description = "Flagship Claude model for deep reasoning, coding, and long-horizon agents"
family = "claude-opus"
open_weights = false
knowledge = "2025-05-31"
release_date = "2026-02-05"
last_updated = "2026-03-13"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "max"], budget = { min = 1_024 } }
structured_output = true
temperature = true

[limit]
context = 1_000_000
output = 128_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 5
cache = { read = 0.5, write = 6.25 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 10
cache = { read = 1, write = 12.5 }

[cost.text.output]
price = 25

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 37.5
