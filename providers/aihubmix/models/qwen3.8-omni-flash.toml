# Sources (accessed 2026-09-20):
# https://aihubmix.com/api/v1/models?type=llm (USD per million tokens)
# https://www.alibabacloud.com/help/en/model-studio/qwen-omni
# Toggle: enable_thinking = true|false on /v1/chat/completions.
# Effort: reasoning_effort = low|medium|xhigh on /v1/chat/completions.
# https://docs.aihubmix.com/cn/api/unified-inference
# Prices, limits and input modalities: AIHubMix catalog GET https://aihubmix.com/api/v1/models (2026-10-21).
# Cache: https://docs.aihubmix.com/cn/practices/prompt-caching.md
schema = 2
base_model = "alibaba/qwen3.8-omni-flash"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "xhigh"] }
structured_output = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.1126
cache = { read = 0.014075, write = 0.1759375 }

[cost.text.output]
price = 0.380025
