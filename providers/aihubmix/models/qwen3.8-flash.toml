# Toggle:
# $.enable_thinking = true|false on the OpenAI-compatible /v1/chat/completions path (verified live 2026-09-11);
# $.thinking.type = "enabled"|"disabled"|"adaptive" on /v1/messages; $.generationConfig.thinkingConfig on the Gemini path.
# Effort: low|medium|xhigh
# $.reasoning_effort on /v1/chat/completions (alias $.reasoning.effort, which is also the Responses field);
# $.output_config.effort on /v1/messages, subject to model support.
# Budget:
# integer $.reasoning.max_tokens on /v1/chat/completions; $.thinking.budget_tokens >= 1024 on /v1/messages;
# integer $.generationConfig.thinkingConfig.thinkingBudget on the Gemini path (-1 dynamic, 0 off where supported);
# the Responses path carries effort but has no reasoning-token budget field.
# https://docs.aihubmix.com/cn/api/unified-inference
schema = 2
base_model = "alibaba/qwen3.8-flash"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "xhigh"], budget = {} }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.1126
cache = { read = 0.014075, write = 0.175937 }

[cost.text.output]
price = 0.380025
