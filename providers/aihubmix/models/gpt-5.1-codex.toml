# Prices, limits and input modalities: AIHubMix catalog GET https://aihubmix.com/api/v1/models (2026-10-21).
# Cache: https://docs.aihubmix.com/cn/practices/prompt-caching.md
schema = 2
base_model = "openai/gpt-5.1-codex"
description = "Coding-optimized GPT model for repository edits, reviews, and agentic software work"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
cache = { supported = true, implicit = { min_tokens = 1_024 } }

[cost.text.input]
price = 1.25
cache = { read = 0.125 }

[cost.text.output]
price = 10
