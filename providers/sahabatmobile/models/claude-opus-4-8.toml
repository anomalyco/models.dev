# Price (USD/MTok) = official Anthropic price; source: https://platform.claude.com/docs/en/about-claude/pricing
# Served via SahabatMobile's OpenAI-compatible API over Anthropic direct.
schema = 2
base_model = "anthropic/claude-opus-4-8"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 5

[cost.text.output]
price = 25
