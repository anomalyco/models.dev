# Price (USD/MTok) = official Anthropic price, tiered by prompt length: prompts over 100,000 tokens bill at the higher tier (overrides below).
# source: https://platform.claude.com/docs/en/about-claude/pricing
# Toggle: thinking.type = adaptive|disabled (default adaptive; disabled accepted at effort <= high, rejected at xhigh/max)
# https://platform.claude.com/docs/en/about-claude/effort
# Served via SahabatMobile's OpenAI-compatible API over Anthropic direct.
schema = 2
base_model = "anthropic/claude-haiku-5-5"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.1

[[cost.text.input.overrides]]
when = { context = { gt = 100_000 } }
price = 0.5

[cost.text.output]
price = 0.5

[[cost.text.output.overrides]]
when = { context = { gt = 100_000 } }
price = 2.5
