# ARC Swift: Rayline's router tier; picks the model and reasoning effort per request.
# Prices: https://docs.rayline.ai/arc/pricing (card 26, 2026-10-27), USD per 1M tokens.
# Limits: https://docs.rayline.ai/tools/opencode and GET https://api.rayline.ai/v1/models
#   (output 128000, "the maximum ARC accepts"); context 1,000,000 verified live, see PR draft.
# Reasoning: chosen by the router; no caller control, so supported with no controls.
# Verified 2026-11-04 through OpenCode 2.0.32 and the live API: tool calls, thinking
#   blocks returned, PNG image input. Sampling parameters are accepted (HTTP 200) but not
#   guaranteed to be honored, so they are declared unsupported.
schema = 2
name = "ARC Swift"
description = "Rayline router tier for fast, efficient coding and agent work"
family = "ray"
open_weights = false
release_date = "2026-10-21"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = false
top_p = false
top_k = false

[limit]
context = 1_000_000
output = 128_000

[cost.text.input]
price = 0.05
cache = { read = 0.005, write = 0.0625 }

[cost.text.output]
price = 0.25
