# Pricing: https://router.worldclaw.ai/models/gpt-6.1-sol
# https://router.worldclaw.ai/models — reviewed 2026-11-19.
# Prices converted from credits: 100 credits = USD 1; all costs USD / 1M tokens.
# OpenCode Desktop 2.3.0: WorldRouter Chat Completions rejected function tools
# combined with an enabled reasoning_effort on this model (2026-11-19).
# Use the Responses route suggested by the gateway error.
# Reasoning baseline: native openai and OpenRouter provider entries at
# models.dev fcb75c2d2c177ab3c8ba2af750b138b6610e4ef8, per relay policy.
# Cache prices are public; the host does not document cache-control details.
# OpenCode 2.3.0 smoke test: function-tool call and text reply with medium selected.
# Responses custom tools returned raw text and enforced both Lark and regex
# grammars in authenticated probes (2026-11-19).
schema = 2
base_model = "openai/gpt-6.1-sol"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
cache = { implicit = true }

[api.responses]
capabilities = { tools = { freeform = ["text", "lark", "regex"] } }
base_url = "https://inference-api.worldrouter.ai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 1.4
cache = { read = 0.07, write = 1.75 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 2.8
cache = { read = 0.14, write = 3.5 }

[cost.text.output]
price = 7

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 10.5
