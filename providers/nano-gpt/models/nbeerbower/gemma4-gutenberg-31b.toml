schema = 2
name = "Gemma 4 Gutenberg 31B"
description = "nbeerbower's Gemma 4 31B finetune for literary fiction, character interiority, and controlled narrative pacing. Its text decoder was trained with ORPO on 14,816 Athanorlite-DPO preference pairs. This text-only deployment supports a 65,536-token context window and up to 8,192 output tokens."
family = "gemma"
open_weights = true
release_date = "2026-10-13"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = false

[limit]
context = 65_536
input = 65_536
output = 8_192

[cost.text.input]
price = 0.1
cache = { read = 0.05 }

[cost.text.output]
price = 0.45
