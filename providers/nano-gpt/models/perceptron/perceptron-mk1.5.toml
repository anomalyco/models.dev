# effort_updates = false: NanoGPT documents per-turn effort updates (configuration_update) only for GPT-6 Astra and Claude Fable 5.1 (https://docs.nano-gpt.com/api-reference/miscellaneous/inline-reasoning-effort)
# tools.updates = false: NanoGPT's Chat Completions API has no mid-conversation tool-change message (https://docs.nano-gpt.com/api-reference/endpoint/chat-completion)
# Modalities (image: NanoGPT Chat Completions accepts png, jpeg, webp): https://docs.nano-gpt.com/api-reference/endpoint/chat-completion#image-input
# Modalities (video, audio: Perceptron's Mk1.5 formats; NanoGPT lists none): https://docs.perceptron.inc/perceptron-mk1.5/api-reference/files/upload-a-file, https://docs.perceptron.inc/perceptron-mk1.5/capabilities/audio
schema = 2
name = "Perceptron Mk1.5"
description = "Perceptron Mk1.5 is a multimodal reasoning model for visual analysis and physical agents. It accepts text, images, video, and audio, supports tool calling and structured output, and can return spatial annotations such as points, boxes, polygons, and tracks."
open_weights = false
release_date = "2026-09-25"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "video/mp4", "video/quicktime", "video/webm", "audio/wav", "audio/mpeg", "audio/flac"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high"] }
structured_output = true

[limit]
context = 36_864
input = 36_864
output = 8_192

[cost.text.input]
price = 0.15

[cost.text.output]
price = 1.5
