schema = 2
name = "Apex Flash 1"
description = "Apex Flash 1 is Cantina Security and Yeta's cybersecurity-focused post-train of GLM 5.3 Flash for code investigation and tool use."
family = "glm"
open_weights = true
release_date = "2026-10-05"

[modalities]
input = ["text", "image"]
