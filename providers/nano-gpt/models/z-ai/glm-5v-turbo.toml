# Not included in subscription
# effort_updates = false: NanoGPT documents per-turn effort updates (configuration_update) only for GPT-6 Astra and Claude Fable 5.1 (https://docs.nano-gpt.com/api-reference/miscellaneous/inline-reasoning-effort)
# tools.updates = false: NanoGPT's Chat Completions API has no mid-conversation tool-change message (https://docs.nano-gpt.com/api-reference/endpoint/chat-completion)
# Modalities (image: the lab's formats that NanoGPT Chat Completions accepts; video: the lab's formats): https://docs.nano-gpt.com/api-reference/endpoint/chat-completion#image-input
schema = 2
base_model = "zhipuai/glm-5v-turbo"
name = "GLM 5V Turbo"

[modalities]
input = ["text", "image/jpeg", "image/png", "video/mp4", "video/quicktime", "video/x-matroska"]
output = ["text"]

[capabilities]
reasoning = { supported = false }
structured_output = true
tools = { supported = true }

[limit]
context = 202_800
input = 202_800

[cost.text.input]
price = 1.2
cache = { read = 0.24 }

[cost.text.output]
price = 4
