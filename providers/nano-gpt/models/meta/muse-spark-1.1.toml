# effort_updates = false: NanoGPT documents per-turn effort updates (configuration_update) only for GPT-6 Astra and Claude Fable 5.1 (https://docs.nano-gpt.com/api-reference/miscellaneous/inline-reasoning-effort)
# Modalities (image: the lab's formats that NanoGPT Chat Completions accepts; video: the lab's formats): https://docs.nano-gpt.com/api-reference/endpoint/chat-completion#image-input
schema = 2
base_model = "meta/muse-spark-1.1"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp", "video/mp4", "audio"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh"] }
structured_output = false
effort_updates = false

[limit]
context = 1_000_000
input = 1_000_000
output = 65_536

[cost.text.input]
price = 1.25
cache = { read = 0.15 }

[cost.text.output]
price = 4.25
