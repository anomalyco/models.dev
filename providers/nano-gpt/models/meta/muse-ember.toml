schema = 2
name = "Muse Ember"
description = "Meta's Muse Ember is the smallest and most efficient Muse model, built for the work agents repeat all day: tool calls, coding-agent subtasks, routing, and extraction. It accepts text, images, audio, video, and PDF documents across a one-million-token context window, supports tool calling and structured output, and always reasons before answering."
family = "muse"
open_weights = false
release_date = "2026-11-11"

[modalities]
input = ["text", "image", "video", "audio", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[limit]
context = 1_048_576
input = 1_048_576
output = 1_048_576

[cost.text.input]
price = 0.1
cache = { read = 0.004 }

[cost.text.output]
price = 0.5
