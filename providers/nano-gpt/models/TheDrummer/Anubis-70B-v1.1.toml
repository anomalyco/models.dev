# Included in subscription
# effort_updates = false: NanoGPT documents per-turn effort updates (configuration_update) only for GPT-6 Astra and Claude Fable 5.1 (https://docs.nano-gpt.com/api-reference/miscellaneous/inline-reasoning-effort)
schema = 2
name = "Anubis 70B v1.1"
description = "General-purpose chat model for instruction following, writing, and analysis"
open_weights = true
release_date = "2024-01-01"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = false

[limit]
context = 32_000
input = 32_000
output = 16_384

[cost.text.input]
price = 0.31
cache = { read = 0.155 }

[cost.text.output]
price = 0.31
