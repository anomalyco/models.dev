# effort_updates = false: NanoGPT documents per-turn effort updates (configuration_update) only for GPT-6 Astra and Claude Fable 5.1 (https://docs.nano-gpt.com/api-reference/miscellaneous/inline-reasoning-effort)
schema = 2
name = "Orion 26B A4B v1.1"
description = "TheDrummer's Gemma 4 26B A4B fine-tune for creative writing, roleplay, and expressive dialogue. Supports optional thinking with a 65,536-token context window and up to 8,192 output tokens. Text input only."
open_weights = true
release_date = "2026-10-16"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = false

[limit]
context = 65_536
input = 65_536
output = 8_192

[cost.text.input]
price = 0.1
cache = { read = 0.05 }

[cost.text.output]
price = 0.45
