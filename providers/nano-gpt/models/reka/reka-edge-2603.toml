# effort_updates = false: NanoGPT documents per-turn effort updates (configuration_update) only for GPT-6 Astra and Claude Fable 5.1 (https://docs.nano-gpt.com/api-reference/miscellaneous/inline-reasoning-effort)
# tools.updates = false: NanoGPT's Chat Completions API has no mid-conversation tool-change message (https://docs.nano-gpt.com/api-reference/endpoint/chat-completion)
# Modalities (image: NanoGPT Chat Completions accepts png, jpeg, webp): https://docs.nano-gpt.com/api-reference/endpoint/chat-completion#image-input
schema = 2
base_model = "rekaai/reka-edge"
name = "Reka Edge 2603"
description = "Reka's compact multimodal model for visual understanding and tool use, served directly by Reka."

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp"]
output = ["text"]

[capabilities]
structured_output = true
tools = { supported = true }

[limit]
input = 16_384
output = 16_384

[cost.text.input]
price = 0.105

[cost.text.output]
price = 0.105
