# effort_updates = false: NanoGPT documents per-turn effort updates (configuration_update) only for GPT-6 Astra and Claude Fable 5.1 (https://docs.nano-gpt.com/api-reference/miscellaneous/inline-reasoning-effort)
# status = deprecated: NanoGPT's catalog says "Deprecated. This model now routes to Kimi K2 0711." (https://nano-gpt.com/api/v1/models?detailed=true)
schema = 2
base_model = "moonshotai/kimi-k2-instruct"
name = "Kimi K2 0711 Fast"
description = "Compact GPT model for low-latency assistance and high-volume workloads"
status = "deprecated"

[modalities]
input = ["text", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = false }
structured_output = false

[limit]
input = 131_072
output = 16_384

[cost.text.input]
price = 0.4
cache = { read = 0.2 }

[cost.text.output]
price = 1.8
