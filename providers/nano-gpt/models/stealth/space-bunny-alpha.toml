name = "Space Bunny Alpha"
description = "Space Bunny Alpha is an anonymous stealth preview model for coding and multimodal tasks. It accepts text, images, and video, supports tool calling and structured output, and always reasons with adjustable effort across a 1M-token context window."
family = "alpha"
release_date = "2026-09-23"
last_updated = "2026-09-23"
attachment = true
reasoning = true
tool_call = true
structured_output = true
open_weights = false

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh", "max"]

[cost]
input = 0.05
output = 0.15

[limit]
context = 1_000_000
input = 1_000_000
output = 524_288

[modalities]
input = ["text", "image", "video"]
output = ["text"]
