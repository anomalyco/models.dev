schema = 2
name = "OrcaCyber GLM 5.3"
description = "An OrcaCyber model for authorized security research, vulnerability analysis, code auditing, and tool use. Accepts text input, with reasoning kept enabled. Supports a 1,000,000-token context window and up to 128,000 output tokens. Offensive work is permitted only within an authorized security engagement."
family = "glm"
open_weights = false
release_date = "2026-11-18"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
context = 999_488
input = 999_488
output = 128_000

[cost.text.input]
price = 3
cache = { read = 0.3 }

[cost.text.output]
price = 5
