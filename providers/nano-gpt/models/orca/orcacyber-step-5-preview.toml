schema = 2
name = "OrcaCyber Step 5 Preview"
description = "An OrcaCyber model for authorized security research, vulnerability analysis, code auditing, and tool use. Accepts text and images, with reasoning kept enabled. Supports a 1,000,000-token context window and up to 64,000 output tokens. Offensive work is permitted only within an authorized security engagement."
family = "step"
open_weights = false
release_date = "2026-11-23"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
context = 999_488
input = 999_488
output = 64_000

[cost.text.input]
price = 2
cache = { read = 0.2 }

[cost.text.output]
price = 5.4
