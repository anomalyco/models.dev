schema = 2
name = "OrcaCyber GLM 5.3 Flash"
description = "An OrcaCyber model built on GLM 5.3 Flash for authorized security research, coding, and tool use. Accepts text and images. Reasoning is always enabled, with selectable effort. Supports a 1M-token context window, up to 131K output tokens, tool calling, and structured output. Offensive work is permitted only within an authorized security engagement."
family = "glm"
open_weights = false
release_date = "2026-11-09"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "max"] }
structured_output = true

[limit]
context = 1_048_064
input = 1_048_064
output = 131_072

[cost.text.input]
price = 0.8
cache = { read = 0.15 }

[cost.text.output]
price = 1.6
