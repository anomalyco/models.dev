schema = 2
name = "OrcaCyber Inkling 2 Mini"
description = "An OrcaCyber model for authorized security research, vulnerability analysis, code auditing, and tool use. Accepts text and images, with optional reasoning. Supports a 1,048,576-token context window and up to 65,536 output tokens. Offensive work is permitted only within an authorized security engagement."
family = "inkling"
open_weights = false
release_date = "2026-11-23"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true

[limit]
context = 1_048_064
input = 1_048_064
output = 65_536

[cost.text.input]
price = 0.2
cache = { read = 0.05 }

[cost.text.output]
price = 0.5
