schema = 2
name = "DeepSeek V4.1 Flash Heretic"
description = "pqhaz's Heretic checkpoint of DeepSeek V4.1 Flash 1017, served by Sable at original mixed precision (FP8 dense/Engram and MXFP4 experts). Supports text and image input, tools, structured output, and optional reasoning. Separate from the DeAlign uncensored checkpoint."
family = "deepseek"
open_weights = true
release_date = "2026-10-31"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = false

[limit]
context = 512_000
input = 512_000
output = 128_000

[cost.text.input]
price = 0.18
cache = { read = 0.012, write = 0.18 }

[cost.text.output]
price = 0.72
