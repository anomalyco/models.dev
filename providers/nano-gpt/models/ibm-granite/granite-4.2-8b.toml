# effort_updates = false: NanoGPT documents per-turn effort updates (configuration_update) only for GPT-6 Astra and Claude Fable 5.1 (https://docs.nano-gpt.com/api-reference/miscellaneous/inline-reasoning-effort)
# tools.updates = false: NanoGPT's Chat Completions API has no mid-conversation tool-change message (https://docs.nano-gpt.com/api-reference/endpoint/chat-completion)
schema = 2
base_model = "ibm/granite-4.2-8b"
description = "IBM Granite 4.2 8B is an Apache 2.0-licensed dense model with native step-by-step reasoning and specialized training for agentic work. It can plan before acting, sequence tools, navigate codebases, work in terminals, and verify results across coding, search, mathematics, science, and complex instruction-following tasks."

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high"] }
structured_output = true
tools = { supported = true }

[limit]
input = 131_072

[cost.text.input]
price = 0.06
cache = { read = 0.015 }

[cost.text.output]
price = 0.15
