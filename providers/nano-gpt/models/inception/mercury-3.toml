# effort_updates = false: NanoGPT documents per-turn effort updates (configuration_update) only for GPT-6 Astra and Claude Fable 5.1 (https://docs.nano-gpt.com/api-reference/miscellaneous/inline-reasoning-effort)
# tools.updates = false: NanoGPT's Chat Completions API has no mid-conversation tool-change message (https://docs.nano-gpt.com/api-reference/endpoint/chat-completion)
schema = 2
name = "Mercury 3"
description = "Mercury 3 is Inception's diffusion language model for fast chat, coding, and multi-step agents. It accepts and generates text, with adjustable reasoning, parallel tool calls, structured JSON output, and a shared 1,000,000-token context window. Responses can use up to 131,072 tokens, including reasoning, within the remaining context."
family = "mercury"
open_weights = false
release_date = "2026-10-19"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
effort_updates = false

[limit]
context = 1_000_000
input = 1_000_000
output = 131_072

[cost.text.input]
price = 0.1
cache = { read = 0.01 }

[cost.text.output]
price = 0.35
