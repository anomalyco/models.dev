name = "Mercury 3"
description = "Mercury 3 is Inception's diffusion language model for fast chat, coding, and multi-step agents. It accepts and generates text, with adjustable reasoning, parallel tool calls, structured JSON output, and a shared 1,000,000-token context window. Responses can use up to 131,072 tokens, including reasoning, within the remaining context."
family = "mercury"
release_date = "2026-10-19"
last_updated = "2026-10-19"
attachment = false
reasoning = true
tool_call = true
structured_output = true
open_weights = false

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high"]

[cost]
input = 0.1
output = 0.35
cache_read = 0.01

[limit]
context = 1_000_000
input = 1_000_000
output = 131_072

[modalities]
input = ["text"]
output = ["text"]
