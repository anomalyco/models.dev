schema = 2
name = "GPT Terra Latest"
description = "Compatibility alias that routes to GPT 5.6 Terra, the latest supported GPT Terra model."
family = "gpt-terra"
open_weights = false
release_date = "2026-09-11"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[limit]
context = 1_050_000
input = 1_050_000
output = 128_000

[cost.text.input]
price = 2
cache = { read = 0.2, write = 2.5 }

[cost.text.output]
price = 12
