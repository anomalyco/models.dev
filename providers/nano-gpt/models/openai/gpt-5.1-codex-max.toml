schema = 2
base_model = "openai/gpt-5.1-codex-max"
name = "GPT 5.1 Codex Max"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh"] }
structured_output = true

[limit]
input = 400_000

[cost.text.input]
price = 2.5
cache = { read = 0.25 }

[cost.text.output]
price = 20
