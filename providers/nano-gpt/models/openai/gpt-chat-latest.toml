# Not included in subscription
schema = 2
name = "GPT Chat Latest"
description = "Chat-tuned GPT model for conversational assistance, writing, and tool workflows"
family = "gpt"
open_weights = false
release_date = "2026-05-03"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[limit]
context = 1_050_000
input = 1_050_000
output = 128_000

[cost.text.input]
price = 2
cache = { read = 0.2, write = 2.5 }

[cost.text.output]
price = 10
