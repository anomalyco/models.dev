# effort_updates = false: NanoGPT documents per-turn effort updates (configuration_update) only for GPT-6 Astra and Claude Fable 5.1 (https://docs.nano-gpt.com/api-reference/miscellaneous/inline-reasoning-effort)
# Cache: implicit (automatic) for OpenAI models (https://docs.nano-gpt.com/api-reference/miscellaneous/prompt-caching)
schema = 2
base_model = "openai/gpt-5-pro"
name = "GPT 5 Pro"

[capabilities]
tools = { supported = false }
reasoning = { supported = true, effort = ["high"] }
structured_output = false
cache = { implicit = true }

[limit]
input = 400_000
output = 128_000

[cost.text.input]
price = 15
cache = { read = 1.5 }

[cost.text.output]
price = 120
