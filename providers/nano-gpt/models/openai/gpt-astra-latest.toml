schema = 2
name = "GPT Astra Latest"
description = "Compatibility alias that routes to GPT 6 Astra, the latest supported GPT Astra model."
family = "gpt-astra"
open_weights = false
release_date = "2026-09-11"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[limit]
context = 1_050_000
input = 1_050_000
output = 128_000

[cost.text.input]
price = 10
cache = { read = 1, write = 12.5 }

[cost.text.output]
price = 50
