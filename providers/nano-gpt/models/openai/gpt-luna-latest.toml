schema = 2
name = "GPT Luna Latest"
description = "Compatibility alias that routes to GPT 5.6 Luna, the latest supported GPT Luna model."
family = "gpt-luna"
open_weights = false
release_date = "2026-09-11"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[limit]
context = 1_050_000
input = 1_050_000
output = 128_000

[cost.text.input]
price = 0.1
cache = { read = 0.01, write = 0.125 }

[cost.text.output]
price = 0.5
