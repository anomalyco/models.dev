schema = 2
name = "GPT 6 Luna Pro"
description = "GPT-6 Luna Pro uses the same underlying model as GPT-6 Luna with Pro reasoning mode enabled for higher-quality responses on complex tasks."
family = "gpt"
open_weights = false
release_date = "2026-09-22"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[limit]
context = 1_050_000
input = 1_050_000
output = 128_000

[cost.text.input]
price = 0.1
cache = { read = 0.01, write = 0.125 }

[cost.text.output]
price = 0.5
