schema = 2
base_model = "openai/o4-mini"
name = "OpenAI o4-mini high"
description = "O-series reasoning model for hard analysis, math, coding, and planning"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
input = 200_000

[cost.text.input]
price = 1.1
cache = { read = 0.55 }

[cost.text.output]
price = 4.4
