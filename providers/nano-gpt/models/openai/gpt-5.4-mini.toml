# Not included in subscription
schema = 2
base_model = "openai/gpt-5.4-mini"
name = "GPT 5.4 Mini"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true

[limit]
input = 400_000

[cost.text.input]
price = 0.75
cache = { read = 0.075 }

[cost.text.output]
price = 4.5
