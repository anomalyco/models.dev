schema = 2
base_model = "openai/gpt-5.1"
name = "GPT-5.1 (2025-11-13)"
description = "GPT model for general reasoning, writing, coding, and tool-assisted tasks"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true

[limit]
input = 400_000

[cost.text.input]
price = 1.25
cache = { read = 0.125 }

[cost.text.output]
price = 10
