schema = 2
name = "GPT Sol Latest"
description = "Compatibility alias that routes to GPT 5.6 Sol, the latest supported GPT Sol model."
family = "gpt-sol"
open_weights = false
release_date = "2026-09-11"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[limit]
context = 1_050_000
input = 1_050_000
output = 128_000

[cost.text.input]
price = 2
cache = { read = 0.1, write = 2.5 }

[cost.text.output]
price = 10
