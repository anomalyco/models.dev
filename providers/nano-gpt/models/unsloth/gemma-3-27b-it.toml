# effort_updates = false: NanoGPT documents per-turn effort updates (configuration_update) only for GPT-6 Astra and Claude Fable 5.1 (https://docs.nano-gpt.com/api-reference/miscellaneous/inline-reasoning-effort)
schema = 2
base_model = "google/gemma-3-27b-it"
description = "Open Gemma instruction model for efficient chat and self-hosted deployments"

[modalities]
input = ["text", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = false }
structured_output = false
effort_updates = false

[limit]
context = 128_000
input = 128_000
output = 96_000

[cost.text.input]
price = 0.2992
cache = { read = 0.1496 }

[cost.text.output]
price = 0.2992
