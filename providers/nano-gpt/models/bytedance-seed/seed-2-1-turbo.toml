# effort_updates = false: NanoGPT documents per-turn effort updates (configuration_update) only for GPT-6 Astra and Claude Fable 5.1 (https://docs.nano-gpt.com/api-reference/miscellaneous/inline-reasoning-effort)
# tools.updates = false: NanoGPT's Chat Completions API has no mid-conversation tool-change message (https://docs.nano-gpt.com/api-reference/endpoint/chat-completion)
schema = 2
base_model = "bytedance-seed/seed-2.1-turbo"
name = "ByteDance Seed 2.1 Turbo"
description = "ByteDance Seed 2.1 Turbo is a multimodal model for coding and long-horizon agent workflows, including end-to-end software delivery and multi-step task execution. It supports text, image, and video input with a 262k context window."

[capabilities]
reasoning = { supported = true }
structured_output = true
tools = { supported = true, updates = false }
effort_updates = false

[limit]
context = 262_144
input = 262_144
output = 235_929

[cost.text.input]
price = 0.5
cache = { read = 0.25 }

[cost.text.output]
price = 2.5
