name = "Abliterated Model Large"
description = "Abliteration.ai's large text reasoning model is derived from GLM-5.2 and supports structured output, automatic prompt caching, and a one-million-token context window."
release_date = "2026-08-27"
last_updated = "2026-08-27"
attachment = false
reasoning = true
tool_call = false
structured_output = true
open_weights = false

[[reasoning_options]]
type = "effort"
values = ["none", "minimal", "low", "medium", "high", "xhigh", "max"]

[cost]
input = 5
output = 5
cache_read = 0.5

[limit]
context = 1_000_000
input = 1_000_000
output = 999_990

[modalities]
input = ["text"]
output = ["text"]
