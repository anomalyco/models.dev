# effort_updates = false: NanoGPT documents per-turn effort updates (configuration_update) only for GPT-6 Astra and Claude Fable 5.1 (https://docs.nano-gpt.com/api-reference/miscellaneous/inline-reasoning-effort)
# tools.updates = false: NanoGPT's Chat Completions API has no mid-conversation tool-change message (https://docs.nano-gpt.com/api-reference/endpoint/chat-completion)
schema = 2
name = "Qwen 3 8B"
description = "Qwen 3 8B is a 8B model. Supports switching between thinking and non thinking: trigger thinking with /think and /no_think anywhere in a prompt or system message to toggle chain-of-thought reasoning."
family = "qwen"
open_weights = true
release_date = "2024-01-01"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = false }
structured_output = false
effort_updates = false

[limit]
context = 41_000
input = 41_000
output = 32_768

[cost.text.input]
price = 0.47
cache = { read = 0.235 }

[cost.text.output]
price = 0.47
