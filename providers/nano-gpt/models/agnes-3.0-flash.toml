schema = 2
name = "Agnes 3.0 Flash"
description = "Agnes 3.0 Flash is a low-cost model for coding, tool use, and multi-turn agent tasks. It supports text and image input, optional thinking, and a 512K-token context window."
open_weights = false
release_date = "2026-09-09"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
structured_output = false

[limit]
context = 524_288
input = 524_288
output = 65_536

[cost.text.input]
price = 0.05
cache = { read = 0.005 }

[cost.text.output]
price = 0.15
