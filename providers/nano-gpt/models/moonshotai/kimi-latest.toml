# Included in subscription
# effort_updates = false: NanoGPT documents per-turn effort updates (configuration_update) only for GPT-6 Astra and Claude Fable 5.1 (https://docs.nano-gpt.com/api-reference/miscellaneous/inline-reasoning-effort)
# tools.updates = false: NanoGPT's Chat Completions API has no mid-conversation tool-change message (https://docs.nano-gpt.com/api-reference/endpoint/chat-completion)
# Modalities (image: NanoGPT Chat Completions accepts png, jpeg, webp): https://docs.nano-gpt.com/api-reference/endpoint/chat-completion#image-input
# Modalities (video: the Kimi API's formats; NanoGPT lists none): https://platform.kimi.ai/docs/guide/use-kimi-vision-model#supported-image-and-video-formats
schema = 2
name = "Kimi Latest"
description = "Kimi multimodal agent model for visual understanding, coding, and planning"
family = "kimi"
open_weights = false
release_date = "2026-05-03"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "video/mp4", "video/mpeg", "video/mov", "video/avi", "video/x-flv", "video/mpg", "video/webm", "video/wmv", "video/3gpp"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
context = 1_048_576
input = 1_048_576
output = 943_718

[cost.text.input]
price = 2
cache = { read = 0.2, write = 2 }

[cost.text.output]
price = 10
