# Not included in subscription
# Tracks Gemini 3.5 Flash (current flash-latest target).
base_model = "google/gemini-flash-latest"

[[reasoning_options]]
type = "effort"
values = ["minimal", "low", "medium", "high"]

[cost]
input = 0.75
output = 3.75
cache_read = 0.075
cache_write = 0.075

[limit]
input = 1_048_576
