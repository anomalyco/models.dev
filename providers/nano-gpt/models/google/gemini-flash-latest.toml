# Not included in subscription
# Tracks Gemini 3.5 Flash (current flash-latest target).
schema = 2
base_model = "google/gemini-flash-latest"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true

[limit]
input = 1_048_576

[cost.text.input]
price = 0.75
cache = { read = 0.075, write = 0.041667 }

[cost.text.output]
price = 3.75
