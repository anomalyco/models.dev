# Included in subscription
# effort_updates = false: NanoGPT documents per-turn effort updates (configuration_update) only for GPT-6 Astra and Claude Fable 5.1 (https://docs.nano-gpt.com/api-reference/miscellaneous/inline-reasoning-effort)
# tools.updates = false: NanoGPT's Chat Completions API has no mid-conversation tool-change message (https://docs.nano-gpt.com/api-reference/endpoint/chat-completion)
# Toggle: reasoning_effort = "none" turns reasoning off and any other accepted value turns it on; NanoGPT's catalog lists no effort levels for this model (https://docs.nano-gpt.com/api-reference/miscellaneous/extended-thinking)
# Modalities (image: the lab's formats that NanoGPT Chat Completions accepts): https://docs.nano-gpt.com/api-reference/endpoint/chat-completion#image-input
schema = 2
base_model = "google/gemma-4-26b-a4b-it"
name = "Gemma 4 26B A4B"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "video"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
tools = { supported = true }

[limit]
input = 262_144
output = 131_072

[cost.text.input]
price = 0.0765
cache = { read = 0.0425 }

[cost.text.output]
price = 0.255
