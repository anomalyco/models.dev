# Not included in subscription
schema = 2
base_model = "google/gemini-3.5-flash"

[modalities]
input = ["text", "image", "video", "audio"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true

[limit]
input = 1_048_576

[cost.text.input]
price = 1.5
cache = { read = 0.15, write = 0.083333 }

[cost.text.output]
price = 9
