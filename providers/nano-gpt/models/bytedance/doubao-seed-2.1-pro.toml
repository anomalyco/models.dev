schema = 2
base_model = "bytedance-seed/seed-2.1-pro"
name = "Doubao Seed 2.1 Pro"
description = "Higher-capability model in the Doubao Seed 2.1 family for agentic coding, long-context analysis, complex instruction following, and productivity workflows. Supports a 256k context window and up to 128k output tokens. Note: privacy and logging guarantees may be limited."

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = false

[limit]
input = 256_000
output = 128_000

[cost.text.input]
price = 1
cache = { read = 0.5 }

[cost.text.output]
price = 5
