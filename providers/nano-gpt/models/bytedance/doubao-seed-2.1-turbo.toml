schema = 2
base_model = "bytedance-seed/seed-2.1-turbo"
name = "Doubao Seed 2.1 Turbo"
description = "Fast, lower-cost model in the Doubao Seed 2.1 family for everyday chat, coding assistance, document work, and high-throughput productivity tasks. Supports a 256k context window and up to 128k output tokens. Note: privacy and logging guarantees may be limited."

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = false

[limit]
input = 256_000
output = 128_000

[cost.text.input]
price = 0.5
cache = { read = 0.25 }

[cost.text.output]
price = 2.5
