# effort_updates = false: NanoGPT documents per-turn effort updates (configuration_update) only for GPT-6 Astra and Claude Fable 5.1 (https://docs.nano-gpt.com/api-reference/miscellaneous/inline-reasoning-effort)
# Modalities (image: the lab's formats that NanoGPT Chat Completions accepts): https://docs.nano-gpt.com/api-reference/endpoint/chat-completion#image-input
schema = 2
base_model = "bytedance-seed/seed-character"
name = "Doubao Seed Character"
description = "ByteDance's character-focused Doubao Seed model for roleplay, persona consistency, dialogue, and creative character interactions. It supports text and image input with a 128k context window. Requests route through ZenMux to ByteDance; ZenMux does not publish a model-API zero-retention or training guarantee, so avoid sensitive data."

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = false

[limit]
context = 128_000
input = 128_000
output = 32_768

[cost.text.input]
price = 0.15
cache = { read = 0.03, write = 0.003 }

[cost.text.output]
price = 0.37
