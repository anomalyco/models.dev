# effort_updates = false: NanoGPT documents per-turn effort updates (configuration_update) only for GPT-6 Astra and Claude Fable 5.1 (https://docs.nano-gpt.com/api-reference/miscellaneous/inline-reasoning-effort)
# tools.updates = false: NanoGPT's Chat Completions API has no mid-conversation tool-change message (https://docs.nano-gpt.com/api-reference/endpoint/chat-completion)
# system_updates = false: Gemini places every system message, even one after the history, in its system instruction (https://docs.nano-gpt.com/api-reference/miscellaneous/prompt-caching#gemini-implicit-caching)
# Cache: implicit (automatic) for Gemini models (https://docs.nano-gpt.com/api-reference/miscellaneous/prompt-caching)
# status = deprecated: NanoGPT's catalog says "Deprecated compatibility alias. Requests route to the stable Gemini 2.5 Flash Lite model." (https://nano-gpt.com/api/v1/models?detailed=true)
# Modalities (image: NanoGPT Chat Completions accepts png, jpeg, webp): https://docs.nano-gpt.com/api-reference/endpoint/chat-completion#image-input
# Modalities (audio: the Gemini API's formats; NanoGPT lists none): https://ai.google.dev/gemini-api/docs/audio#supported-formats
schema = 2
base_model = "google/gemini-2.5-flash-lite-preview-09-2025"
name = "Gemini 2.5 Flash Lite Preview (09/2025)"
status = "deprecated"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "audio/wav", "audio/mp3", "audio/aiff", "audio/aac", "audio/ogg", "audio/flac", "audio/mpeg", "audio/m4a", "audio/l16", "audio/opus", "audio/alaw", "audio/mulaw", "audio/webm", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
effort_updates = false
system_updates = false
cache = { supported = true, implicit = true }

[limit]
input = 1_048_576

[cost.text.input]
price = 0.1
cache = { read = 0.01 }

[cost.text.output]
price = 0.4
