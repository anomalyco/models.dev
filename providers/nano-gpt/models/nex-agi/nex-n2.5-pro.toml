schema = 2
name = "Nex N2.5 Pro"
description = "Nex N2.5 Pro is an open-source multimodal agentic model for coding, tool use, and long-horizon workflows. It supports image input, structured output, configurable reasoning, a 262K-token context window, and up to 235K output tokens."
family = "agi"
open_weights = true
release_date = "2026-09-22"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "medium", "high"] }
structured_output = true

[limit]
context = 262_144
input = 262_144
output = 262_144

[cost.text.input]
price = 0.075
cache = { read = 0.015 }

[cost.text.output]
price = 0.25
