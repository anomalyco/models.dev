name = "Nex N2 Mini"
description = "Nex AGI's open-source agentic mixture-of-experts model in the Nex N2 family. It accepts text and image input and is built for coding, tool use, structured outputs, and optional reasoning with a 256K context window."
family = "agi"
release_date = "2026-06-24"
last_updated = "2026-06-24"
attachment = true
reasoning = true
tool_call = true
structured_output = true
open_weights = true

[[reasoning_options]]
type = "effort"
values = ["none", "minimal", "low", "medium", "high", "xhigh"]

[cost]
input = 0.025
output = 0.1
cache_read = 0.0025

[limit]
context = 262_144
input = 262_144
output = 262_144

[modalities]
input = ["text", "image"]
output = ["text"]
