schema = 2
base_model = "deepseek/deepseek-v3.1"
name = "DeepSeek V3.1"
description = "DeepSeek chat model for instruction following, coding, and analysis"

[modalities]
input = ["text", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = false }
structured_output = false

[limit]
context = 128_000
input = 128_000
output = 65_536

[cost.text.input]
price = 0.2
cache = { read = 0.1 }

[cost.text.output]
price = 0.7
