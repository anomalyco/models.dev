# effort_updates = false: NanoGPT documents per-turn effort updates (configuration_update) only for GPT-6 Astra and Claude Fable 5.1 (https://docs.nano-gpt.com/api-reference/miscellaneous/inline-reasoning-effort)
# tools.updates = false: NanoGPT's Chat Completions API has no mid-conversation tool-change message (https://docs.nano-gpt.com/api-reference/endpoint/chat-completion)
schema = 2
name = "CyberHeabsy"
description = "A low-refusal text model for authorized security research, roleplay, and creative writing. It preserves tool calling after refusal removal, supports optional reasoning, and has a 1M-token context window."
open_weights = false
release_date = "2026-09-27"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = false
effort_updates = false

[limit]
context = 1_048_576
input = 1_048_576
output = 65_536

[cost.text.input]
price = 1.5
cache = { read = 0.275 }

[cost.text.output]
price = 4.5
