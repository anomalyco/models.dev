# Not included in subscription
schema = 2
name = "Grok Latest"
description = "Grok model for agentic tool use, reasoning, coding, and live assistance"
family = "grok"
open_weights = false
release_date = "2026-05-03"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true

[limit]
context = 500_000
input = 500_000
output = 450_000

[cost.text.input]
price = 2
cache = { read = 0.5 }

[cost.text.output]
price = 6
