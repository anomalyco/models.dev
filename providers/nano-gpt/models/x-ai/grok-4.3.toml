# Not included in subscription
schema = 2
base_model = "xai/grok-4.3"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
input = 1_000_000
output = 900_000

[cost.text.input]
price = 1.25
cache = { read = 0.2 }

[cost.text.output]
price = 2.5
