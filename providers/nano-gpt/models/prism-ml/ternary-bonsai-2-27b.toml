schema = 2
name = "Ternary Bonsai 2 27B"
description = "Ternary Bonsai 2 27B is a 27B-parameter reasoning model from PrismML derived from Qwen3.8-27B. It supports coding, mathematics, tool calling, and image understanding with a 262K-token context window."
open_weights = true
release_date = "2026-09-18"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["medium", "xhigh"] }
structured_output = true

[limit]
context = 262_144
input = 262_144
output = 32_768

[cost.text.input]
price = 0.075
cache = { read = 0.0375 }

[cost.text.output]
price = 0.5
