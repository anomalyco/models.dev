schema = 2
name = "DeepSeek V3/Chat Cheaper"
description = "Chat-tuned GPT model for conversational assistance, writing, and tool workflows"
family = "deepseek"
open_weights = true
release_date = "2025-04-15"

[modalities]
input = ["text", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
structured_output = true

[limit]
context = 128_000
input = 128_000
output = 8_192

[cost.text.input]
price = 0.1
cache = { read = 0.05 }

[cost.text.output]
price = 0.425
