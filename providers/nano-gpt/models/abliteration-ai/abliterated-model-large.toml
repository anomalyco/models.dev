schema = 2
name = "Abliterated Model Large"
description = "Abliteration.ai's large text reasoning model is derived from GLM-5.2 and supports native tool calling, structured output, automatic prompt caching, and a one-million-token context window."
open_weights = false
release_date = "2026-08-27"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[limit]
context = 1_000_000
input = 1_000_000
output = 999_990

[cost.text.input]
price = 3
cache = { read = 0.3 }

[cost.text.output]
price = 5
