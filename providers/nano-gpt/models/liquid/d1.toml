# Modalities: text only on NanoGPT; its live catalog (https://nano-gpt.com/api/v1/models?detailed=true) lists liquid/d1 with
# input_modalities ["text"] and vision false.
schema = 2
base_model = "liquid/d1"
name = "Liquid D1"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
structured_output = false

[limit]
input = 65_536

[cost.text.input]
price = 0.04
cache = { read = 0.04 }

[cost.text.output]
price = 0
