# Modalities: text only on NanoGPT; its live catalog (https://nano-gpt.com/api/v1/models?detailed=true) lists liquid/d1 with
# input_modalities ["text"] and vision false.
# effort_updates = false: NanoGPT documents per-turn effort updates (configuration_update) only for GPT-6 Astra and Claude Fable 5.1 (https://docs.nano-gpt.com/api-reference/miscellaneous/inline-reasoning-effort)
# Decisions: POST /api/v1/systemone and /api/v1/decisions (https://docs.nano-gpt.com/api-reference/endpoint/decisions)
schema = 2
base_model = "liquid/d1"
name = "Liquid D1"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
structured_output = false
effort_updates = false

[limit]
input = 65_536

[api.systemone]
sdk = { aisdk = "none" }

[api.decisions]
sdk = { aisdk = "none", opencodeai = "none" }

[cost.text.input]
price = 0.04
cache = { read = 0.04 }

[cost.text.output]
price = 0
