# Output limit: capped at the 32,768 context; no host cap is documented and the 65,536 from the base model or host listing is larger.
# effort_updates = false: NanoGPT documents per-turn effort updates (configuration_update) only for GPT-6 Astra and Claude Fable 5.1 (https://docs.nano-gpt.com/api-reference/miscellaneous/inline-reasoning-effort)
schema = 2
name = "OpenReasoning Nemotron 32B"
description = "Nemotron model for efficient reasoning, coding, and specialized AI agents"
family = "nemotron"
open_weights = true
release_date = "2025-08-21"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true }
structured_output = false

[limit]
context = 32_768
input = 32_768
output = 32_768

[cost.text.input]
price = 0.1
cache = { read = 0.05 }

[cost.text.output]
price = 0.4
