schema = 2
name = "DeepSeek V4.1 Flash 1017 Abliterated CSF (jcartu)"
description = "This model is based on DeepSeek-V4.1-Flash-1017-lossless-CSF by Local Inference Lab, Inc., a non-profit organization, available at https://huggingface.co/local-inference-lab/DeepSeek-V4.1-Flash-1017-lossless-CSF. DeepSeek-V4.1-Flash-1017-lossless-CSF is licensed under the Local Inference Lab License, Version 1.0.\n\njcartu’s CSF derivative of DeepSeek V4.1 Flash 1017 applies norm-preserving abliteration to 132 dense tensors. It accepts text, supports tool calling and structured JSON output, and offers none, low, high and max reasoning effort. Input and output share a 1,048,576-token context window, with up to 943,718 output tokens. This offering uses jcartu/DeepSeek-V4.1-Flash-1017-abliterated-lossless-CSF."
family = "deepseek"
open_weights = false
release_date = "2026-11-18"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true

[limit]
context = 1_048_576
input = 1_048_576
output = 943_718

