schema = 2
name = "Mistral Medium 3.5 Thinking"
description = "Mistral Medium 3.5 with reasoning enabled by default (reasoning_effort=high), for complex coding, agentic, and multi-step reasoning prompts."
family = "mistral-medium"
open_weights = true
release_date = "2026-04-30"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = true

[limit]
context = 256_000
input = 256_000
output = 32_768

[cost.text.input]
price = 1.5
cache = { read = 0.75 }

[cost.text.output]
price = 7.5
