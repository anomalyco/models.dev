schema = 2
base_model = "google/gemini-2.5-pro"

[modalities]
input = ["text", "image", "video", "audio"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = false

[limit]
input = 1_048_576

[cost.text.input]
price = 1.25
cache = { read = 0.125, write = 0.375 }

[cost.text.output]
price = 10
