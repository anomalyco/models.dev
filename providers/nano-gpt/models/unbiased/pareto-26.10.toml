# effort_updates = false: NanoGPT documents per-turn effort updates (configuration_update) only for GPT-6 Astra and Claude Fable 5.1 (https://docs.nano-gpt.com/api-reference/miscellaneous/inline-reasoning-effort)
# tools.updates = false: NanoGPT's Chat Completions API has no mid-conversation tool-change message (https://docs.nano-gpt.com/api-reference/endpoint/chat-completion)
# Modalities (image: NanoGPT Chat Completions accepts png, jpeg, webp): https://docs.nano-gpt.com/api-reference/endpoint/chat-completion#image-input
schema = 2
name = "Pareto 26.10"
description = "Pareto 26.10 is Unbiased AI's multimodal composite model for research, coding, and agentic workflows. It accepts text and images, supports tool calling, and provides a 1M-token context window with up to 131K output tokens. This is the stable release of Pareto 26.10. Tool selection is automatic; forced tool selection, structured output, and adjustable reasoning controls are not supported."
open_weights = false
release_date = "2026-10-01"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = false }
structured_output = false
effort_updates = false

[limit]
context = 1_048_576
input = 1_048_576
output = 131_072

[cost.text.input]
price = 0.8
cache = { read = 0.03 }

[cost.text.output]
price = 3.2
