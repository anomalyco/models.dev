name = "K2-Horizon-7B"
description = "IFM's open-weight 7B model for coding, reasoning, and chat. Heabsy serves an FP8 deployment on a dedicated RTX 5090 with speculative decoding in the United States, with a 131K context window and an 8K output limit. Zero data retention is not verified for this deployment."
release_date = "2026-09-09"
last_updated = "2026-09-09"
attachment = false
reasoning = true
tool_call = true
structured_output = false
open_weights = true

