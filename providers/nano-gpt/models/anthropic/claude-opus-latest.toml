# Not included in subscription
schema = 2
name = "Claude Opus Latest"
description = "Flagship Claude model for deep reasoning, coding, and long-horizon agents"
family = "claude-opus"
open_weights = false
release_date = "2026-03-29"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[limit]
context = 1_000_000
input = 1_000_000
output = 128_000

[cost.text.input]
price = 4
cache = { read = 0.2, write = 5 }

[cost.text.output]
price = 20
