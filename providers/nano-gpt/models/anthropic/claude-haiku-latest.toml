# Not included in subscription
schema = 2
name = "Claude Haiku Latest"
description = "Fast Claude model for responsive assistance, classification, and lightweight agents"
family = "claude-haiku"
open_weights = false
release_date = "2026-03-29"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[limit]
context = 1_000_000
input = 1_000_000
output = 128_000

[cost.text.input]
price = 0.1
cache = { read = 0.01, write = 0.125 }

[cost.text.output]
price = 0.5
