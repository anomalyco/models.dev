# Included in subscription
schema = 2
name = "MiniMax Latest"
description = "MiniMax multimodal coding model for long-context reasoning and agent tasks"
family = "minimax"
open_weights = true
release_date = "2026-05-03"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
context = 512_000
input = 512_000
output = 80_000

[cost.text.input]
price = 0.23
cache = { read = 0.05 }

[cost.text.output]
price = 0.96
