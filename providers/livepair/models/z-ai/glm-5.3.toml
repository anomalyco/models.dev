# Reasoning wire on this host: reasoning_effort = low|medium|high on
# /v1/agent/chat (OpenAI-compatible). Uniform across reasoning-capable models;
# lab-native params (enable_thinking, thinking_budget, none/xhigh) are not exposed.
base_model = "zhipuai/glm-5.3"
[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
input = 2.15
output = 6.77
