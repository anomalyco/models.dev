# Effort: reasoning_effort = none|low|high|max (default high); none turns thinking off and thinking.type disabled is ignored (minimal maps to low, medium to high, xhigh to max).
# Input: text only; an image_url is rejected with a 400 ("does not take image, audio, video or file input").
# Cache: automatic; a repeated prompt returns usage.prompt_tokens_details.cached_tokens.
# top_k: not in the catalog's supported_sampling_parameters; the API ignores it (even top_k: "x" returns 200).
# Pricing: https://www.runwally.com/pricing
# Limits and modalities: GET https://inference.runanywhere.ai/v1/models
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "high" }, effort = ["none", "low", "high", "max"] }
top_k = false
cache = { implicit = true }

[limit]
context = 1_048_576
output = 65_536

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.195
cache = { read = 0.006 }

[cost.text.output]
price = 1
