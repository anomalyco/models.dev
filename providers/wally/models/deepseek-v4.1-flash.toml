# Effort: reasoning_effort = none|low|high|max (default high); none turns thinking off (minimal maps to low, medium to high).
# Images: PNG, JPEG and WebP (GIF is rejected with a 400).
# Cache: automatic; a repeated prompt returns usage.prompt_tokens_details.cached_tokens.
# Pricing: https://www.runwally.com/pricing
# Limits and modalities: GET https://inference.runanywhere.ai/v1/models
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "high" }, effort = ["none", "low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 1_048_576
output = 65_536

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.3
cache = { read = 0.006 }

[cost.text.output]
price = 1.2
