# Toggle: chat_template_kwargs.enable_thinking = true|false
# Effort: reasoning_effort = low|high|max
# Pricing: https://www.runwally.com/pricing
base_model = "deepseek/deepseek-v4.1-flash"
reasoning_options = [
  { type = "toggle" },
  { type = "effort", values = ["low", "high", "max"] },
]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.20
output = 0.60
cache_read = 0.006

[limit]
context = 1_048_576
output = 262_144
