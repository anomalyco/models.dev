# Effort: reasoning_effort = none|low|high|max; thinking is off unless reasoning_effort asks for it (minimal maps to low, medium to high, xhigh to max).
# Cache: automatic; a repeated prompt returns usage.prompt_tokens_details.cached_tokens.
# Pricing: https://www.runwally.com/pricing
# Limits and modalities: GET https://inference.runanywhere.ai/v1/models
schema = 2
base_model = "deepseek/deepseek-v4-flash-0731"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "none" }, effort = ["none", "low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 1_048_576
output = 65_536

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.44
cache = { read = 0.014 }

[cost.text.output]
price = 1.32
