# Effort: reasoning_effort = "none" | "low" | "medium" | "xhigh"
# Budget: thinking_token_budget (integer reasoning tokens)
# https://portal.neuralwatt.com/docs/api/chat-completions
base_model = "alibaba/qwen3.8-27b"
name = "Qwen 3.8 27B"

interleaved = true

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "xhigh"]

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 0.45
output = 3.2
cache_read = 0.25

[limit]
context = 262_128
output = 131_072

[modalities]
input = ["text", "image"]
