# Effort: reasoning_effort = "none" | "low" | "medium" | "xhigh"
# Budget: thinking_token_budget (integer reasoning tokens)
# https://portal.neuralwatt.com/docs/api/chat-completions
schema = 2
base_model = "alibaba/qwen3.8-27b"
name = "Qwen 3.8 27B"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "xhigh"], budget = {} }
structured_output = true

[limit]
context = 262_128
output = 131_072

[api.chat-completions]
compatibility = { replay_reasoning = true }

[cost.text.input]
price = 0.45
cache = { read = 0.25 }

[cost.text.output]
price = 3.2
