# Flex-tier variant of deepseek-v4.1-flash: same model, context (1,048,560),
# vision, and effort ladder as the standard tier; requested via the `-flex`
# model ID or service_tier="flex" and requires stream=true (non-streaming
# requests fall through to the standard tier). Cost is the flex rate: 0.65x
# of standard pricing (35% off) per the flex-tier guide, applied to the
# standard rates advertised by GET /v1/models ($0.15/$0.6/$0.015, checked
# 2026-09-18). thinking_token_budget is rejected with a 400 on the V4-Flash
# generation and is not documented for V4.1-Flash, so it is not declared.
# https://portal.neuralwatt.com/docs/guides/flex-tier
# https://portal.neuralwatt.com/docs/api/chat-completions
base_model = "deepseek/deepseek-v4.1-flash"
name = "DeepSeek V4.1 Flash Flex"
interleaved = true

[[reasoning_options]]
type = "effort"
values = ["none", "low", "high", "xhigh", "max"]

[cost]
input = 0.0975
output = 0.39
cache_read = 0.00975

[limit]
context = 1_048_560
output = 393_216
