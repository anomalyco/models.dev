# Live authenticated check 2026-11-12 on this model ID:
# POST /v1/chat/completions accepted thinking_token_budget=1,
# stream=true and max_tokens=16 (HTTP 200, reasoning then content).
# https://docs.neuralwatt.com/api/chat-completions#reasoning-token-budget
# Flex-tier variant of deepseek-v4.1-flash: same model, context (1,048,560),
# vision, and effort ladder as the standard tier; requested via the `-flex`
# model ID or service_tier="flex" and requires stream=true (non-streaming
# requests fall through to the standard tier). Public GET /v1/models on
# 2026-11-12 reports input/output/cache-read prices in metadata.pricing:
# $0.0975/$0.39/$0.00975 per million tokens, with the flex discount included.
# Do not apply flex_discount_multiplier again.
# Source: https://api.neuralwatt.com/v1/models
# https://portal.neuralwatt.com/docs/guides/flex-tier
# https://portal.neuralwatt.com/docs/api/chat-completions
