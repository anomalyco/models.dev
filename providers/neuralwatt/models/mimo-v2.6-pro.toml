# Effort: reasoning_effort = "none" | "high"
# Budget: thinking_token_budget (integer reasoning tokens)
# https://portal.neuralwatt.com/docs/api/chat-completions
schema = 2
base_model = "xiaomi/mimo-v2.6-pro"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "audio/mpeg", "audio/wav", "audio/flac", "audio/mp4", "audio/ogg"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "high"], budget = {} }
structured_output = true

[limit]
context = 1_048_560
output = 393_216

[api.chat-completions]
compatibility = { replay_reasoning = true }

[cost.text.input]
price = 0.87
cache = { read = 0.036 }

[cost.text.output]
price = 1.74
