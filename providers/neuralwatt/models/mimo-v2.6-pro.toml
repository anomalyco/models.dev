# MiMo-V2.6-Pro on Neuralwatt (Xiaomi MOPD build, in public GET /v1/models).
# Pricing, limits, and reasoning ladder from live GET /v1/models metadata
# (checked 2026-10-08): $0.87/$1.74/$0.036, 1,048,560 context, 393,216 output.
# Effort: reasoning_effort = none|high (default high, reasoning on by default;
# aliases max/xhigh/medium/low -> high, minimal -> none) per metadata.reasoning
# and the model page mapping. Off is effort=none, so no separate toggle.
# Budget: thinking_token_budget (integer reasoning tokens) accepted on this host.
# Neuralwatt serves text+image+audio input (capabilities vision + audio_input
# true; video_url is rejected per chat-completions content-parts docs, so the
# lab video modality is omitted).
# https://docs.neuralwatt.com/api/models#list-models
# https://portal.neuralwatt.com/models/mimo-v2.6-pro
# https://docs.neuralwatt.com/api/chat-completions#reasoning-effort
schema = 2
base_model = "xiaomi/mimo-v2.6-pro"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "audio/mpeg", "audio/wav", "audio/flac", "audio/mp4", "audio/ogg"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "high"], budget = {} }

[limit]
context = 1_048_560
output = 393_216

[api.chat-completions]
compatibility = { replay_reasoning = true }

[cost.text.input]
price = 0.87
cache = { read = 0.036 }

[cost.text.output]
price = 1.74
