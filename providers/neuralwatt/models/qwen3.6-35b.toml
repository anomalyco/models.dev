# Effort: reasoning_effort = "none" | "high"
# Budget: thinking_token_budget (integer reasoning tokens)
# https://portal.neuralwatt.com/docs/api/chat-completions
schema = 2
base_model = "alibaba/qwen3.6-35b-a3b"
name = "Qwen3.6 35B"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "high"], budget = {} }
structured_output = true

[limit]
context = 262_128
output = 131_056

[api.chat-completions]
compatibility = { replay_reasoning = true }

[cost.text.input]
price = 0.29
cache = { read = 0.029 }

[cost.text.output]
price = 1.15
