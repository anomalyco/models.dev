# Effort: reasoning_effort = none|low|high|max (none disables thinking)
# Budget: thinking_token_budget (integer reasoning tokens)
schema = 2
base_model = "moonshotai/kimi-k3"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"], budget = {} }
structured_output = true

[limit]
context = 1_048_560
output = 1_048_560

[api.chat-completions]
compatibility = { replay_reasoning = true }

[cost.text.input]
price = 3
cache = { read = 0.3 }

[cost.text.output]
price = 15
