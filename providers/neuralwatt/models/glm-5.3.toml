# Exited preview 2026-09-10; the preview-parity list price ($1.45/$4.5/$0.145)
# was confirmed as the launch price per GET /v1/models (checked 2026-09-18).
# Reasoning cannot be disabled (reasoning.mandatory = true), so there is no
# none level and no toggle. The API supports low, high and max as distinct
# efforts; minimal, medium and xhigh are accepted as aliases onto them.
# Budget: thinking_token_budget (integer reasoning tokens)
# https://portal.neuralwatt.com/docs/api/chat-completions
schema = 2
base_model = "zhipuai/glm-5.3"
name = "GLM 5.3"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"], budget = {} }
structured_output = false

[limit]
context = 1_048_560
output = 1_048_560

[api.chat-completions]
legacy_interleaved = true

[cost.text.input]
price = 1.45
cache = { read = 0.145 }

[cost.text.output]
price = 4.5
