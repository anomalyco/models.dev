# Preview rollout: qwen-3.8-27b-flex is the flex tier of the qwen-3.8-27b
# preview on Neuralwatt, so it carries the same beta status as the standard
# tier. Requested via the `-flex` model ID or service_tier="flex" and requires
# stream=true (non-streaming requests fall through to the standard tier).
# Cost is the flex rate: 0.65x of standard pricing (35% off) per the flex-tier
# guide, applied to the standard rates advertised by GET /v1/models
# ($0.45/$3.2/$0.25, checked 2026-09-15).
# Reasoning matches the standard tier: off is effort=none, no separate toggle;
# efforts none/low/medium/xhigh (default xhigh; aliases max/high -> xhigh,
# minimal -> low). Budget: thinking_token_budget (integer reasoning tokens).
# https://portal.neuralwatt.com/docs/guides/flex-tier
# https://portal.neuralwatt.com/docs/api/chat-completions
base_model = "alibaba/qwen3.8-27b"
status = "beta"
name = "Qwen 3.8 27B Flex"
interleaved = true

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "xhigh"]

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 0.2925
output = 2.08
cache_read = 0.1625

[limit]
context = 262_128
output = 65_536

[modalities]
input = ["text", "image"]
output = ["text"]
