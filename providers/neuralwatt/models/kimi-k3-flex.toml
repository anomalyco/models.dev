# Budget: thinking_token_budget (integer reasoning tokens)
schema = 2
base_model = "moonshotai/kimi-k3"
name = "Kimi K3 Flex"
description = "Kimi K3 on the flex tier: discounted, best-effort latency, requests may be held under load"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"], budget = {} }
structured_output = true

[limit]
context = 1_048_560
output = 1_048_560

[api.chat-completions]
legacy_interleaved = true

[cost.text.input]
price = 1.95
cache = { read = 0.195 }

[cost.text.output]
price = 9.75
