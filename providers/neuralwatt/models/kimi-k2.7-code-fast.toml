# Budget: thinking_token_budget (integer reasoning tokens)
schema = 2
base_model = "moonshotai/kimi-k2.7-code"
name = "Kimi K2.7 Code Fast"
description = "Kimi K2.7 Code with reasoning capped to a short budget for lower latency; reasoning cannot be disabled on this model"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, budget = {} }
structured_output = true

[limit]
context = 262_128
output = 262_128

[api.chat-completions]
compatibility = { replay_reasoning = true }

[cost.text.input]
price = 0.95
cache = { read = 0.095 }

[cost.text.output]
price = 4
