# Authenticated GET /v1/models, checked 2026-11-12:
# metadata.reasoning.supported_efforts = max|high|medium|low|none.
# medium is a supported level; xhigh maps to max, minimal to low.
# Source: https://api.neuralwatt.com/v1/models
# metadata.limits.max_output_tokens = null; no host cap is reported.
# Inherited lab output (131,072) is a fallback, not a verified host cap.
# Budget: thinking_token_budget (integer reasoning tokens)
# Lab: public GET /v1/models lists metadata.huggingface_id
# moonshotai/Kimi-K3.1-Pro for this id (checked 2026-11-14).
# Reasoning comes back in choices[].message.reasoning_content (delta.reasoning_content
# when streaming) and not in `reasoning`. The chat-completions docs name
# kimi-k3.1-pro as the exception (https://docs.neuralwatt.com/api/chat-completions,
# checked 2026-11-20).
# nw-large tracks Kimi K3.1 Pro today. The sync drops this reasoning_field if
# the alias moves to another lab.
schema = 2
base_model = "moonshotai/kimi-k3.1-pro"
name = "Neuralwatt Large (flex)"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"], budget = {} }
structured_output = true

[limit]
context = 1_048_560
output = 1_048_560

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.3
cache = { read = 0.13 }

[cost.text.output]
price = 6.5
