# Flex-tier variant of glm-5.3-flash: same model, context (1,048,560),
# vision, and effort ladder as the standard tier; requested via the `-flex`
# model ID or service_tier="flex" and requires stream=true (non-streaming
# requests fall through to the standard tier). Cost is the flex rate: 0.65x
# of standard pricing (35% off) per the flex-tier guide, applied to the
# standard rates advertised by GET /v1/models ($0.15/$0.5/$0.03, checked
# 2026-09-18). JSON mode is off on this host, unlike the lab default.
# https://portal.neuralwatt.com/docs/guides/flex-tier
# https://portal.neuralwatt.com/docs/api/chat-completions
base_model = "zhipuai/glm-5.3-flash"
name = "GLM-5.3 Flash Flex"
structured_output = false

interleaved = true

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 0.0975
output = 0.325
cache_read = 0.0195

[limit]
context = 1_048_560
output = 1_048_560

[modalities]
input = ["text", "image"]
output = ["text"]
