# Effort: reasoning_effort = "low" | "high" | "max"
# Budget: thinking_token_budget (integer reasoning tokens)
# Flex tier: request with the -flex id or service_tier = "flex"; requires stream = true.
# Flex pricing is 0.65x the standard tier.
# Reasoning cannot be disabled: low, high and max are distinct;
# minimal, medium and xhigh alias onto them.
# https://portal.neuralwatt.com/docs/api/chat-completions
schema = 2
base_model = "zhipuai/glm-5.3-flash"
name = "GLM-5.3 Flash Flex"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"], budget = {} }
structured_output = true

[limit]
context = 1_048_560
output = 1_048_560

[api.chat-completions]
legacy_interleaved = true

[cost.text.input]
price = 0.0975
cache = { read = 0.0195 }

[cost.text.output]
price = 0.325
