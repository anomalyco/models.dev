# Effort: reasoning_effort = "low" | "high" | "max"
# Budget: thinking_token_budget (integer reasoning tokens)
# https://portal.neuralwatt.com/docs/api/chat-completions
base_model = "zhipuai/glm-5.3-flash"
name = "GLM-5.3 Flash Flex"

interleaved = true

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 0.0975
output = 0.325
cache_read = 0.0195

[limit]
context = 1_048_560
output = 1_048_560

[modalities]
input = ["text", "image"]
