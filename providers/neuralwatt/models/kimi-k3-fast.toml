schema = 2
base_model = "moonshotai/kimi-k3"
name = "Kimi K3 Fast"
description = "Kimi K3 with thinking disabled for low-latency tool calling, vision, and JSON work"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = false }
structured_output = true

[limit]
context = 1_048_560
output = 1_048_560

[cost.text.input]
price = 3
cache = { read = 0.3 }

[cost.text.output]
price = 15
