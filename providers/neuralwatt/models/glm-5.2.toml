# Reasoning is controlled by reasoning_effort alone; "none" disables thinking.
# The API accepts the full seven-level scale but aliases it down to three real
# levels: xhigh->max, medium->high, low->high, minimal->none.
name = "GLM 5.2"
description = "Flagship GLM model for hybrid reasoning, coding, and agentic engineering"
family = "glm"
release_date = "2026-06-17"
last_updated = "2026-06-17"
attachment = false
reasoning = true
temperature = true
tool_call = true
open_weights = true

[[reasoning_options]]
type = "effort"
values = ["none", "high", "max"]

[cost]
input = 1.45
output = 4.5
cache_read = 0.145

[limit]
context = 1_048_560
output = 1_048_560

[modalities]
input = ["text"]
output = ["text"]
