# Pricing from the authenticated GET /v1/models metadata.pricing
# (checked 2026-09-15).
# Reasoning is not mandatory (reasoning.mandatory = false, on by default), so
# off is effort=none and there is no separate toggle. V4.1-Flash publishes five
# distinct levels (none, low, high, xhigh, max; default high). xhigh is a level
# of its own ranked between high and max, not an alias: the per-model
# reasoning-effort docs call it the only model ID on the host where xhigh is a
# level of its own, and metadata.reasoning supported_efforts in GET /v1/models
# lists max/xhigh/high/low/none with only medium -> high and minimal -> low
# collapsing (checked 2026-09-28). Do not carry deepseek-v4-flash effort
# semantics across: the docs state the two are separate models on separate
# serving stacks.
# Output cap from GET /v1/models metadata.limits.max_output_tokens
# (re-checked 2026-09-28).
# https://docs.neuralwatt.com/api/chat-completions#deepseek-v41-flash
# https://portal.neuralwatt.com/docs/api/models
base_model = "deepseek/deepseek-v4.1-flash"
interleaved = true

[[reasoning_options]]
type = "effort"
values = ["none", "low", "high", "xhigh", "max"]

[cost]
input = 0.15
output = 0.6
cache_read = 0.015

[limit]
context = 1_048_560
output = 393_216
