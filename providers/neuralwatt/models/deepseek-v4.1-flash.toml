# Pricing, limits, vision, and effort ladder from the public GET /v1/models
# metadata (checked 2026-09-18): $0.15/$0.6/$0.015, 1,048,560-token context,
# 393,216-token output cap, 20-image cap. Effort: reasoning_effort =
# none|low|high|xhigh|max (default high, reasoning on by default; aliases
# medium -> high, minimal -> low). Off is effort=none, so no separate toggle.
# thinking_token_budget is rejected with a 400 on the V4-Flash generation
# (checked 2026-08-26) and is not documented for V4.1-Flash, so it is not
# declared.
# https://portal.neuralwatt.com/docs/api/chat-completions
# https://portal.neuralwatt.com/docs/api/models
# Lab: GET /v1/models lists huggingface_id deepseek-ai/DeepSeek-V4.1-Flash-1017 for this id (checked 2026-10-21).
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"
name = "DeepSeek V4.1 Flash"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "xhigh", "max"] }
structured_output = true

[limit]
context = 1_048_560
output = 393_216

[api.chat-completions]
compatibility = { replay_reasoning = true }

[cost.text.input]
price = 0.15
cache = { read = 0.015 }

[cost.text.output]
price = 0.6
