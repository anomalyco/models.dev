# Live authenticated check 2026-11-12 on this model ID:
# POST /v1/chat/completions accepted thinking_token_budget=1,
# stream=true and max_tokens=16 (HTTP 200, reasoning then content).
# https://docs.neuralwatt.com/api/chat-completions#reasoning-token-budget
# Pricing, limits, vision, and effort ladder from the public GET /v1/models
# metadata (checked 2026-09-18): $0.15/$0.6/$0.015, 1,048,560-token context,
# 393,216-token output cap, 20-image cap. Effort: reasoning_effort =
# none|low|high|xhigh|max (default high, reasoning on by default; aliases
# medium -> high, minimal -> low). Off is effort=none, so no separate toggle.
# https://portal.neuralwatt.com/docs/api/chat-completions
# https://portal.neuralwatt.com/docs/api/models
# Lab: GET /v1/models lists huggingface_id deepseek-ai/DeepSeek-V4.1-Flash-1017 for this id (checked 2026-10-21).
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"
name = "DeepSeek V4.1 Flash"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "xhigh", "max"], budget = {} }
structured_output = true

[limit]
context = 1_048_560
output = 393_216

[api.chat-completions]
legacy_interleaved = true

[cost.text.input]
price = 0.15
cache = { read = 0.015 }

[cost.text.output]
price = 0.6
