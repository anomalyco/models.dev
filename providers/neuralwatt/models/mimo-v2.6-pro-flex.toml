# Flex-tier variant of mimo-v2.6-pro: same model, context (1,048,560),
# output cap (393,216), vision+audio input, and none|high effort ladder as the
# standard tier; requested via the `-flex` model ID or service_tier="flex" and
# requires stream=true (non-streaming requests fall through to the standard
# tier). Authenticated GET /v1/models, checked 2026-11-12, reports
# flex input/output/cache-read prices of $0.28275/$0.5655/$0.00234
# per million tokens. These prices already include the flex discount.
# metadata.pricing.cached_input_per_million = 0.00234 USD.
# Checked public and authenticated GET /v1/models on 2026-11-12.
# Budget: thinking_token_budget (integer reasoning tokens)
# https://docs.neuralwatt.com/api/models#list-models
# https://portal.neuralwatt.com/models/mimo-v2.6-pro
# https://docs.neuralwatt.com/api/chat-completions#reasoning-effort
schema = 2
base_model = "xiaomi/mimo-v2.6-pro"
name = "MiMo-V2.6-Pro Flex"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "audio/mpeg", "audio/wav", "audio/flac", "audio/mp4", "audio/ogg"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "high"], budget = {} }
structured_output = true

[limit]
context = 1_048_560
output = 393_216

[api.chat-completions]
legacy_interleaved = true

[cost.text.input]
price = 0.28275
cache = { read = 0.00234 }

[cost.text.output]
price = 0.5655
