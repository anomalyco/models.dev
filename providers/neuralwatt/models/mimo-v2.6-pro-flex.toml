# Effort: reasoning_effort = "none" | "high"
# Budget: thinking_token_budget (integer reasoning tokens)
# Flex tier: request with the -flex id or service_tier = "flex"; requires stream = true.
# Flex pricing is 0.65x the standard tier.
# https://portal.neuralwatt.com/docs/api/chat-completions
schema = 2
base_model = "xiaomi/mimo-v2.6-pro"
name = "MiMo-V2.6-Pro Flex"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "audio/mpeg", "audio/wav", "audio/flac", "audio/mp4", "audio/ogg"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "high"], budget = {} }
structured_output = true

[limit]
context = 1_048_560
output = 393_216

[api.chat-completions]
legacy_interleaved = true

[cost.text.input]
price = 0.5655
cache = { read = 0.0234 }

[cost.text.output]
price = 1.131
