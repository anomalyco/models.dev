# Authenticated GET /v1/models, checked 2026-11-12:
# metadata.reasoning.supported_efforts = max|high|medium|low|none.
# medium is a supported level; xhigh maps to max, minimal to low.
# Source: https://api.neuralwatt.com/v1/models
# metadata.limits.max_output_tokens = null; no host cap is reported.
# Inherited lab output (131,072) is a fallback, not a verified host cap.
# Budget: thinking_token_budget (integer reasoning tokens)
schema = 2
base_model = "moonshotai/kimi-k3.1-pro"
name = "Kimi K3.1 Pro (flex)"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"], budget = {} }
structured_output = true

[limit]
context = 1_048_560
output = 1_048_560

[api.chat-completions]
legacy_interleaved = true

[cost.text.input]
price = 1.3
cache = { read = 0.13 }

[cost.text.output]
price = 6.5
