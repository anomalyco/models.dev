# Status: https://poe.com/Runway-Gen-4-Turbo is titled "Runway-Gen-4-Turbo_DEPRECATED" (2026-10-21).
# Modalities (image: Runway takes JPEG, PNG or WebP; output: MP4; Poe lists none): https://docs.dev.runwayml.com/assets/inputs/, https://docs.dev.runwayml.com/assets/outputs/
schema = 2
type = "video"
name = "Runway-Gen-4-Turbo"
description = "Video model for prompt-guided generation, editing, and motion workflows"
family = "runway"
open_weights = false
release_date = "2025-05-09"
status = "deprecated"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp"]
output = ["video/mp4"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = false

[limit]
context = 256
output = 0
