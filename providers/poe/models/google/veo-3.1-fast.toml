# Modalities (image: Veo takes image/jpeg or image/png; video: Veo returns video/mp4; Poe lists none): https://docs.cloud.google.com/vertex-ai/generative-ai/docs/model-reference/veo-video-generation, https://ai.google.dev/gemini-api/docs/veo
schema = 2
type = "video"
name = "Veo-3.1-Fast"
description = "Video model for prompt-guided generation, editing, and motion workflows"
family = "veo"
open_weights = false
release_date = "2025-10-15"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["video/mp4"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = false

[limit]
context = 480
output = 0
