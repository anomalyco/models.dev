# Sources: Poe API model entry + live chat-completions probes, accessed 2026-10-12
#   (verified live with packages/core/script/poe-reasoning-audit.py)
#   — https://poe.com/gemini-3.6-flash
# - effort: parameters[].thinking_level = minimal|low|medium|high (Poe's per-bot enum;
#   the same extraction reproduces the values already filed for Poe's gemini-3-flash,
#   gemini-3.1-flash-lite, gemini-3.1-pro and gemini-3.5-flash). Bot parameters travel
#   via extra_body (see provider.toml); live probes 2026-10-12: thinking_level="medium"
#   -> 200 with reasoning_tokens>0, "banana" -> 400, and reasoning_tokens scale with
#   level (minimal=0, high=1062 on the same prompt). Top-level reasoning_effort is
#   documented as ignored but is actually forwarded; the filed set follows the
#   declared thinking_level enum.
# - cost: pricing.prompt x1e6 -> 0.7576, completion -> 3.7879, input_cache_read -> 0.0758
#   USD/MTok (source is USD per token, no FX conversion)
# - modalities: architecture.input_modalities lists no pdf -> pdf dropped from input
schema = 2
base_model = "google/gemini-3.6-flash"
name = "Gemini-3.6-Flash"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "video/mp4", "video/mpeg", "video/mov", "video/avi", "video/x-flv", "video/mpg", "video/webm", "video/wmv", "video/3gpp", "audio/wav", "audio/mp3", "audio/aiff", "audio/aac", "audio/ogg", "audio/flac", "audio/mpeg", "audio/m4a", "audio/l16", "audio/opus", "audio/alaw", "audio/mulaw", "audio/webm"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 0.7576
cache = { read = 0.0758 }

[cost.text.output]
price = 3.7879
