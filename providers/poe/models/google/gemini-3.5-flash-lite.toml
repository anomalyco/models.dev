# Sources: Poe API model entry + live chat-completions probes, accessed 2026-10-12
#   (verified live with packages/core/script/poe-reasoning-audit.py)
#   — https://poe.com/gemini-3.5-flash-lite
# - effort: parameters[].thinking_level = minimal|low|medium|high (Poe's per-bot enum;
#   the same extraction reproduces the values already filed for Poe's gemini-3-flash,
#   gemini-3.1-flash-lite, gemini-3.1-pro and gemini-3.5-flash). Bot parameters travel
#   via extra_body (see provider.toml); live probes 2026-10-12: extra_body
#   reasoning_effort -> 400 "does not support these request fields", while
#   thinking_level="medium" -> 200 with reasoning_tokens>0 and out-of-enum values
#   -> 400. Top-level reasoning_effort is documented as ignored but is actually
#   forwarded; the filed set follows the declared thinking_level enum.
# - cost: pricing.prompt / input_cache_read are USD per token (no FX conversion) x1e6
#   -> 0.303 / 0.0303, completion -> 2.5253 USD/MTok
# - modalities: architecture.input_modalities lists no pdf -> pdf dropped from input
base_model = "google/gemini-3.5-flash-lite"
structured_output = true
name = "Gemini-3.5-Flash-Lite"
reasoning_options = [{ type = "effort", values = ["minimal", "low", "medium", "high"] }]

[cost]
input = 0.303
output = 2.5253
cache_read = 0.0303

[modalities]
input = ["text", "image", "video", "audio"]
