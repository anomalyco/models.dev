# Effort: reasoning_effort = low|medium|high (top level, as on Poe's other OpenAI/xAI bots in https://api.poe.com/v1/models)
# Cost: https://api.poe.com/v1/models pricing (USD per token x 1e6), retrieved 2026-10-21.
schema = 2
base_model = "openai/gpt-oss-120b"
name = "GPT-OSS-120B-CS"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
temperature = false

[limit]
context = 128_000
output = 0

[cost.text.input]
price = 0.3535

[cost.text.output]
price = 0.7576
