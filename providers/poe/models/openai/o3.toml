# Effort: reasoning_effort = low|medium|high (default medium)
# Reasoning fields: https://api.poe.com/v1/models parameters (2026-10-21).
# Cost: https://api.poe.com/v1/models pricing (USD per token x 1e6), retrieved 2026-10-21.
schema = 2
base_model = "openai/o3"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[cost.text.input]
price = 1.8182
cache = { read = 0.4545 }

[cost.text.output]
price = 7.2727
