# Effort: reasoning_effort = low|medium|high (top level, as on Poe's other OpenAI/xAI bots in https://api.poe.com/v1/models)
# Status: https://poe.com/o4-mini is titled "o4-mini_DEPRECATED" (2026-10-21).
schema = 2
base_model = "openai/o4-mini"
status = "deprecated"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[cost.text.input]
price = 0.99
cache = { read = 0.25 }

[cost.text.output]
price = 4
