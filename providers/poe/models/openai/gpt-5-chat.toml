# Input limit: dropped, the base model's 272,000 is larger than this host's 128,000 context and the host documents none.
# Status: https://poe.com/GPT-5-Chat is titled "GPT-5-Chat_DEPRECATED" (2026-10-21).
schema = 2
base_model = "openai/gpt-5-chat-latest"
base_model_omit = ["limit.input"]
name = "GPT-5-Chat"
status = "deprecated"

[capabilities]
tools = { supported = true }
reasoning = { supported = false }

[limit]
context = 128_000
output = 16_384

[cost.text.input]
price = 1.1
cache = { read = 0.11 }

[cost.text.output]
price = 9
