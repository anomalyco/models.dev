# Effort: reasoning_effort = low|medium|high (top level, as on Poe's other OpenAI/xAI bots in https://api.poe.com/v1/models)
# Status: https://poe.com/GPT-5.1-Codex-Mini is titled "GPT-5.1-Codex-Mini_DEPRECATED" (2026-10-21).
schema = 2
base_model = "openai/gpt-5.1-codex-mini"
name = "GPT-5.1-Codex-Mini"
status = "deprecated"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[cost.text.input]
price = 0.22
cache = { read = 0.022 }

[cost.text.output]
price = 1.8
