# Modalities: /v1/models architecture.output_modalities = text, image (2026-10-21).
schema = 2
base_model = "openai/gpt-5.4-pro"
name = "GPT-5.4-Pro"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
