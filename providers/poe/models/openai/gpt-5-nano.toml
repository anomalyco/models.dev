schema = 2
name = "GPT-5-nano"
description = "Compact GPT model for low-latency assistance and high-volume workloads"
family = "gpt-nano"
open_weights = false
release_date = "2025-08-05"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
temperature = false

[limit]
context = 400_000
output = 128_000

[cost.text.input]
price = 0.045
cache = { read = 0.0045 }

[cost.text.output]
price = 0.36
