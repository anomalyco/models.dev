# Effort: reasoning_effort = low|medium|high (top level, as on Poe's other OpenAI/xAI bots in https://api.poe.com/v1/models)
# Status: https://poe.com/o1 is titled "o1_DEPRECATED" (2026-10-21).
schema = 2
base_model = "openai/o1"
status = "deprecated"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[cost.text.input]
price = 14

[cost.text.output]
price = 54
