# Effort: reasoning_effort = none|low|medium|high|xhigh (top level, as on Poe's other OpenAI/xAI bots in https://api.poe.com/v1/models)
schema = 2
base_model = "openai/gpt-5.5"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text", "image"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true

[limit]
context = 400_000

[cost.text.input]
price = 4.5455
cache = { read = 0.4545 }

[cost.text.output]
price = 27.2727
