schema = 2
name = "GPT-5.2"
description = "GPT model for general reasoning, writing, coding, and tool-assisted tasks"
open_weights = false
release_date = "2025-12-08"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
temperature = false

[limit]
context = 400_000
output = 128_000

[cost.text.input]
price = 1.6
cache = { read = 0.16 }

[cost.text.output]
price = 13
