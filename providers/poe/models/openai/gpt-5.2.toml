# Effort: reasoning_effort = none|low|medium|high|xhigh (default none)
# Reasoning fields: https://api.poe.com/v1/models parameters (2026-10-21).
# Cost: https://api.poe.com/v1/models pricing (USD per token x 1e6), retrieved 2026-10-21.
schema = 2
base_model = "openai/gpt-5.2"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
temperature = false

[cost.text.input]
price = 1.5909
cache = { read = 0.1591 }

[cost.text.output]
price = 12.7273
