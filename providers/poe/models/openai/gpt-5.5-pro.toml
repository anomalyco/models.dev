# Input limit: dropped, the base model's 922,000 is larger than this host's 400,000 context and the host documents none.
# Effort: reasoning_effort = medium|high|xhigh (top level, as on Poe's other OpenAI/xAI bots in https://api.poe.com/v1/models)
schema = 2
base_model = "openai/gpt-5.5-pro"
base_model_omit = ["limit.input"]
name = "GPT-5.5-Pro"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text", "image"]

[capabilities]
reasoning = { supported = true, effort = ["medium", "high", "xhigh"] }
structured_output = false

[limit]
context = 400_000

[cost.text.input]
price = 27.2727

[cost.text.output]
price = 163.6364
