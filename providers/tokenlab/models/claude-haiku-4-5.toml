# Prices, limits and vision/tool/structured-output support come from the
# TokenLab public model data (accessed 2026-10-06):
# https://tokenlab.sh/api/public/model-data/models/claude-haiku-4-5/pricing
# Prices are for the default delivery option (Auto):
# https://tokenlab.sh/docs/en/guides/billing
# Effort: reasoning_effort = none|low|medium|high|max
# TokenLab maps each level to a thinking budget on this model. Its Chat
# Completions reference says of reasoning_effort: "For Claude models, the value
# sets the model's thinking: an effort level on models with adaptive thinking,
# or a thinking budget on models that use one. none turns thinking off on models
# that allow it." https://tokenlab.sh/docs/en/api-reference/chat/create-completion
# TokenLab documents no separate thinking or budget field on Chat Completions,
# so this file has no budget_tokens option.
# Measured reasoning_tokens, two runs per level (2026-10-06): none 0 and 0,
# low 665 and 863, medium 1,989 and 1,507, high 3,724 and 4,820, max 9,258 and 9,197.
base_model = "anthropic/claude-haiku-4-5"
structured_output = true
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "max"] }]

[cost]
input = 0.3
output = 1.5
cache_read = 0.03
cache_write = 0.375
