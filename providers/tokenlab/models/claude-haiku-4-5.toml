# Prices, limits and vision/tool/structured-output support come from the
# TokenLab public model data (accessed 2026-10-05):
# https://tokenlab.sh/api/public/model-data/models/claude-haiku-4-5/pricing
# Prices are for the default delivery option (Auto):
# https://tokenlab.sh/docs/en/guides/billing
# Effort: reasoning_effort = none|low|medium|high|max
# Levels set the thinking budget in tokens: low 1024, medium 4096, high 16384, max 32000; none turns thinking off
base_model = "anthropic/claude-haiku-4-5"
structured_output = true
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "max"] }]

[cost]
input = 0.3
output = 1.5
cache_read = 0.03
cache_write = 0.375
