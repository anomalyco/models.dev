# Prices, limits and vision/tool/structured-output support come from the
# TokenLab public model data (accessed 2026-10-05):
# https://tokenlab.sh/api/public/model-data/models/claude-opus-4-8/pricing
# Prices are for the default delivery option (Auto):
# https://tokenlab.sh/docs/en/guides/billing
# Toggle: reasoning_effort = none turns thinking off
# Effort: reasoning_effort = low|medium|high|xhigh|max
base_model = "anthropic/claude-opus-4-8"
structured_output = true
reasoning_options = [{ type = "toggle" }, { type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 1.5
output = 7.5
cache_read = 0.15
cache_write = 1.875
