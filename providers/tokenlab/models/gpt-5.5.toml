# Prices, limits and vision/tool/structured-output support come from the
# TokenLab public model data (accessed 2026-10-06):
# https://tokenlab.sh/api/public/model-data/models/gpt-5.5/pricing
# Prices are for the default delivery option (Auto):
# https://tokenlab.sh/docs/en/guides/billing
# Effort: reasoning_effort = none|low|medium|high|xhigh
base_model = "openai/gpt-5.5"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh"] }]

[cost]
input = 1.5
output = 9
cache_read = 0.15

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 3
output = 13.5
cache_read = 0.3

[limit]
context = 1_000_000
