# Prices, limits and vision/tool/structured-output support come from the
# TokenLab public model data (accessed 2026-10-06):
# https://tokenlab.sh/api/public/model-data/models/glm-5.3-flash/pricing
# Prices are for the default delivery option (Auto):
# https://tokenlab.sh/docs/en/guides/billing
# Always reasons; thinking.type = disabled has no effect on this API (tested 2026-10-05).
# Effort: reasoning_effort = low|high|max
base_model = "zhipuai/glm-5.3-flash"
reasoning_options = [{ type = "effort", values = ["low", "high", "max"] }]

[cost]
input = 0.15
output = 0.5
cache_read = 0.03
