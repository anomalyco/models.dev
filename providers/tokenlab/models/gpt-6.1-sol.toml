# Prices, limits and vision/tool/structured-output support come from the
# TokenLab public model data (accessed 2026-10-06):
# https://tokenlab.sh/api/public/model-data/models/gpt-6.1-sol/pricing
# Prices are for the default delivery option (Auto):
# https://tokenlab.sh/docs/en/guides/billing
# Effort: reasoning_effort = low|medium|high|xhigh|max
# TokenLab's model list (https://tokenlab.sh/api/public/model-data/models) marks this
# model supportsVision false and supportsResponseSchema false on this host.
base_model = "openai/gpt-6.1-sol"
attachment = false
structured_output = false
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 0.6
output = 3
cache_read = 0.03
cache_write = 0.75

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 1.2
output = 4.5
cache_read = 0.06
cache_write = 1.5

[modalities]
input = ["text"]
