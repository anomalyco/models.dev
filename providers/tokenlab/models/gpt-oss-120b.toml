# Prices, limits and vision/tool/structured-output support come from the
# TokenLab public model data (accessed 2026-10-06):
# https://tokenlab.sh/api/public/model-data/models/gpt-oss-120b/pricing
# Prices are for the default delivery option (Auto):
# https://tokenlab.sh/docs/en/guides/billing
# Effort: reasoning_effort = low|medium|high
base_model = "openai/gpt-oss-120b"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high"] }]

[cost]
input = 0.15
output = 0.6
cache_read = 0.075

[limit]
output = 65_536
