# Prices, limits and vision/tool/structured-output support come from the
# TokenLab public model data (accessed 2026-10-05):
# https://tokenlab.sh/api/public/model-data/models/grok-4.6/pricing
# Prices are for the default delivery option (Auto):
# https://tokenlab.sh/docs/en/guides/billing
# Effort: reasoning_effort = low|medium|high|xhigh
base_model = "xai/grok-4.6"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh"] }]

[cost]
input = 1
output = 3
cache_read = 0.25

[[cost.tiers]]
tier = { type = "context", size = 200_000 }
input = 2
output = 6
cache_read = 0.5

[limit]
output = 131_072
