# Prices, limits and vision/tool/structured-output support come from the
# TokenLab public model data (accessed 2026-10-06):
# https://tokenlab.sh/api/public/model-data/models/gpt-6-astra/pricing
# Prices are for the default delivery option (Auto):
# https://tokenlab.sh/docs/en/guides/billing
# Effort: reasoning_effort = low|medium|high|xhigh|max
base_model = "openai/gpt-6-astra"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 3
output = 15
cache_read = 0.3
cache_write = 3.75

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 6
output = 22.5
cache_read = 0.6
cache_write = 7.5
