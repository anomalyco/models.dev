# Prices, limits and vision/tool/structured-output support come from the
# TokenLab public model data (accessed 2026-10-05):
# https://tokenlab.sh/api/public/model-data/models/gpt-6-luna/pricing
# Prices are for the default delivery option (Auto):
# https://tokenlab.sh/docs/en/guides/billing
# Effort: reasoning_effort = none|low|medium|high|xhigh|max
base_model = "openai/gpt-6-luna"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 0.03
output = 0.15
cache_read = 0.003
cache_write = 0.0375

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 0.06
output = 0.225
cache_read = 0.006
cache_write = 0.075
