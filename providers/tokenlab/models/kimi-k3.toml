# Prices, limits and vision/tool/structured-output support come from the
# TokenLab public model data (accessed 2026-10-06):
# https://tokenlab.sh/api/public/model-data/models/kimi-k3/pricing
# Prices are for the default delivery option (Auto):
# https://tokenlab.sh/docs/en/guides/billing
# Effort: reasoning_effort = low|high|max
# Matches the lab entry and relay peers: effort only (thinking.type is not a documented TokenLab control).
base_model = "moonshotai/kimi-k3"
reasoning_options = [{ type = "effort", values = ["low", "high", "max"] }]

[cost]
input = 3
output = 15
cache_read = 0.3
cache_write = 3
