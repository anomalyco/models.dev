# Sources (accessed 2026-09-11):
# - https://inference.tinfoil.sh/v1/models (id deepseek-v4-1-flash; experimental; pricing; context 1048576; multimodal; reasoning)
# - https://docs.tinfoil.sh/guides/reasoning.md (host effort surface; sibling deepseek-v4-flash: none|minimal|low|medium|high|xhigh|max)
# - Lab metadata: models/deepseek/deepseek-v4.1-flash.toml
# Effort: reasoning_effort on Tinfoil; off via none (API also exposes thinking disable). Same surface as deepseek-v4-flash.
# status beta: remote catalog marks experimental=true.
# Mid-conversation: Tinfoil serves this model on POST /v1/chat/completions; reasoning and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://docs.tinfoil.sh/models/chat
# Cache: the inference router reuses matching prompt prefixes automatically, scoped by API identity and user_cache_secret (https://docs.tinfoil.sh/sdk/prompt-caching).
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"
status = "beta"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }
cache = { supported = true, implicit = true }
structured_output = true
effort_updates = false

[limit]
context = 1_048_576

[cost.text.input]
price = 0.65
cache = { read = 0.13 }

[cost.text.output]
price = 1.45
