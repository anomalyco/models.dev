# Sources (accessed 2026-09-11):
# - https://inference.tinfoil.sh/v1/models (id deepseek-v4-1-flash; experimental; pricing; context 1048576; multimodal; reasoning)
# - https://docs.tinfoil.sh/guides/reasoning.md (host effort surface; sibling deepseek-v4-flash: none|minimal|low|medium|high|xhigh|max)
# - Lab metadata: models/deepseek/deepseek-v4.1-flash.toml
# Effort: reasoning_effort on Tinfoil; off via none (API also exposes thinking disable). Same surface as deepseek-v4-flash.
# status beta: remote catalog marks experimental=true.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"
status = "beta"

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[limit]
context = 1_048_576

[cost.text.input]
price = 0.65
cache = { read = 0.13 }

[cost.text.output]
price = 1.45
