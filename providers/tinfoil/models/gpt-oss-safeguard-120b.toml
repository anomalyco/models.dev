# Sources (accessed 2026-11-07): https://inference.tinfoil.sh/v1/models,
# https://docs.tinfoil.sh/models/safety, https://docs.tinfoil.sh/guides/reasoning.
# Effort: top-level reasoning_effort = low|medium|high; there is no off value.
# Mid-conversation: Tinfoil serves this model on POST /v1/chat/completions; reasoning and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://docs.tinfoil.sh/models/chat
schema = 2
base_model = "openai/gpt-oss-safeguard-120b"
name = "gpt-oss-safeguard-120b"
knowledge = "2024-06"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 0.15

[cost.text.output]
price = 0.6
