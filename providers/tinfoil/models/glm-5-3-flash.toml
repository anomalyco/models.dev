# Sources (accessed 2026-09-03):
# - https://inference.tinfoil.sh/v1/models
# - https://docs.tinfoil.sh/models/chat.md (weights RedHatAI/GLM-5.3-Flash-NVFP4)
# - https://docs.tinfoil.sh/guides/reasoning.md
# Effort: reasoning_effort = low|high|max on Tinfoil; reasoning is always on (no none/toggle).
base_model = "zhipuai/glm-5.3-flash"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 0.4
output = 1.25
cache_read = 0.1

[limit]
context = 1_048_576
