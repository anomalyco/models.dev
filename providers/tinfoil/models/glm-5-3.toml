# Sources (accessed 2026-09-03):
# - https://inference.tinfoil.sh/v1/models (id glm-5-3; context 1048576; pricing input 1.8 / output 5.75 / cache_read 0.45 per 1M)
# - https://docs.tinfoil.sh/models/chat.md (GLM-5.3; 1M context; weights Inferact/GLM-5.3-NVFP4)
# - https://docs.tinfoil.sh/guides/reasoning.md (glm-5-3 effort low|high|max; reasoning always on)
# Effort: reasoning_effort = low|high|max on Tinfoil; reasoning is always on (no none; enable_thinking not honoured).
# Mid-conversation: Tinfoil serves this model on POST /v1/chat/completions; reasoning and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://docs.tinfoil.sh/models/chat
# Cache: the inference router reuses matching prompt prefixes automatically, scoped by API identity and user_cache_secret (https://docs.tinfoil.sh/sdk/prompt-caching).
schema = 2
base_model = "zhipuai/glm-5.3"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "high", "max"] }
cache = { implicit = true }
structured_output = true

[limit]
context = 1_048_576

[cost.text.input]
price = 1.8
cache = { read = 0.45 }

[cost.text.output]
price = 5.75
