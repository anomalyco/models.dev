# Sources:
# - https://poyo.ai/models (pricing: PoYo bills credits at $0.005 each; per-1M-token prices converted to USD, accessed 2026-11-24)
# - PoYo GET https://api.poyo.ai/v1/models lists "claude-opus-5-5" (accessed 2026-11-24)
# - Reasoning: PoYo forwards reasoning_effort on /v1/chat/completions to the upstream API (converted for Anthropic models); effort levels follow the first-party API
schema = 2
base_model = "anthropic/claude-opus-5-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 3.2
cache = { read = 0.16, write = { "5m" = 4, "1h" = 6.4 } }

[cost.text.output]
price = 16
