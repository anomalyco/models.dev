# Sources:
# - https://poyo.ai/models (pricing: PoYo bills credits at $0.005 each; per-1M-token prices converted to USD, accessed 2026-11-24)
# - PoYo GET https://api.poyo.ai/v1/models lists "claude-haiku-5-5"; live /v1/chat/completions call succeeded on 2026-11-24
# - Reasoning: PoYo forwards reasoning_effort on /v1/chat/completions to the upstream API (converted for Anthropic models); effort levels follow the first-party API
schema = 2
base_model = "anthropic/claude-haiku-5-5"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 0.08
cache = { read = 0.008, write = { "5m" = 0.1, "1h" = 0.16 } }

[cost.text.output]
price = 0.4
