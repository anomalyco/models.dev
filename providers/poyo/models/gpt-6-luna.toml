# Sources:
# - https://poyo.ai/models (pricing: PoYo bills credits at $0.005 each; per-1M-token prices converted to USD, accessed 2026-11-24)
# - PoYo GET https://api.poyo.ai/v1/models lists "gpt-6-luna"; live /v1/chat/completions call succeeded on 2026-11-24
# - Reasoning: PoYo forwards reasoning_effort on /v1/chat/completions to the upstream API (converted for Anthropic models); effort levels follow the first-party API
schema = 2
base_model = "openai/gpt-6-luna"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 0.08
cache = { read = 0.008, write = 0.1 }

[cost.text.output]
price = 0.4
