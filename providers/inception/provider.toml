name = "Inception"
env = ["INCEPTION_API_KEY"]
npm = "@ai-sdk/openai-compatible"
# Reasoning HTTP format (accessed 2026-09-10): POST /v1/chat/completions accepts
# top-level `reasoning_effort` = instant, low, medium, or high; default medium.
# It documents no off value or numeric reasoning-token budget. `instant` is the
# near-realtime mode for low-latency turns. Effort applies to mercury-2.5 and
# mercury-2 on chat completions only.
# https://docs.inceptionlabs.ai/api-reference/chat/create-a-chat-completion
# https://docs.inceptionlabs.ai/capabilities/reasoning-efforts
api = "https://api.inceptionlabs.ai/v1/"
doc = "https://docs.inceptionlabs.ai/get-started/models"
