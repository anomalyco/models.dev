# Sources (accessed 2026-09-10): Mercury Edit 2 is served only on
# /v1/edit/completions and /v1/fim/completions, which cap context at 32K and
# output at 8,192 tokens; it is not offered on chat completions. Neither the
# edit nor the FIM request/response schema exposes a reasoning field, and
# `reasoning_effort` is documented as applying to mercury-2.5 and mercury-2 on
# chat completions only. The docs model table lists no tool-calling or
# structured-output support for this model.
# https://docs.inceptionlabs.ai/get-started/models
# https://docs.inceptionlabs.ai/capabilities/reasoning-efforts
# https://api.inceptionlabs.ai/openapi.json
schema = 2
base_model = "inception/mercury-edit-2"

[capabilities]
structured_output = false

[cost.text.input]
price = 0.25
cache = { read = 0.025 }

[cost.text.output]
price = 0.75
