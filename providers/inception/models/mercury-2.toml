# Model exception (accessed 2026-06-25): `reasoning_effort = "instant"` is also
# accepted for near-realtime responses, but it is not a models.dev effort enum.
# https://docs.inceptionlabs.ai/capabilities/instant
# Knowledge cutoff 2025-01-01 is kept from the original entry; no Inception source states it.
schema = 2
base_model = "inception/mercury-2"
knowledge = "2025-01-01"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 0.25
cache = { read = 0.025 }

[cost.text.output]
price = 0.75
