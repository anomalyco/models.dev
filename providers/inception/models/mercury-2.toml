# Model exception (accessed 2026-06-25): `reasoning_effort = "instant"` is also
# accepted for near-realtime responses, but it is not a models.dev effort enum.
# https://docs.inceptionlabs.ai/capabilities/instant
schema = 2
name = "Mercury 2"
description = "Reasoning model for deliberate analysis, multi-step problem solving, and tool use"
family = "mercury"
open_weights = false
knowledge = "2025-01-01"
release_date = "2026-02-24"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
temperature = true

[limit]
context = 128_000
output = 50_000

[cost.text.input]
price = 0.25
cache = { read = 0.025 }

[cost.text.output]
price = 0.75
