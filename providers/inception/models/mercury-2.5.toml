# Sources (accessed 2026-10-21):
# - Pricing: https://docs.inceptionlabs.ai/get-started/models and GET https://api.inceptionlabs.ai/v1/models:
#   $0.20 input, $0.02 cached input, $0.75 output per MTok (the earlier $0.04 / $0.004 / $0.15 no longer applies).
# - Effort: https://docs.inceptionlabs.ai/capabilities/reasoning-efforts. reasoning_effort = instant|low|medium|high,
#   default medium. The native `instant` value is not in the models.dev effort enum; do not map it to `none`.
# - Tools and usage: https://api.inceptionlabs.ai/openapi.json (tool_choice auto|required|none or a named function;
#   stream_options.include_usage) and https://docs.inceptionlabs.ai/resources/faq (usage chunk when streaming).
# - Cache: https://docs.inceptionlabs.ai/resources/faq ("Prefix caching is automatic and requires no request parameter";
#   no documented TTL, cached tokens billed at the input_cache_reads rate).
# Knowledge cutoff 2025-11-01 is kept from the original entry; no Inception source states it.
# APIs on this host: /v1/chat/completions (chat models), /v1/fim/completions and /v1/edit/completions (Mercury Edit 2),
#   /v1/decisions (Mercury Decide), /v1/models.
# Mid-conversation behavior is undocumented and could not be probed (no key), so those flags stay unset.
schema = 2
base_model = "inception/mercury-2.5"
description = "Mercury 2.5 is the fastest reasoning LLM, and the latest diffusion LLM (dLLM) from Inception"
knowledge = "2025-11-01"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, default = { type = "effort", value = "medium" }, effort = ["low", "medium", "high"] }
structured_output = true
stream_usage = true
cache = { supported = true, implicit = true }

[cost.text.input]
price = 0.2
cache = { read = 0.02 }

[cost.text.output]
price = 0.75
