schema = 2
name = "Coding (Combo)"
description = "Quality-focused coding route for implementation, debugging, and tool use"
family = "model-router"
open_weights = false
release_date = "2026-11-24"
[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_000_000
input = 1_000_000
output = 128_000

[cost.text.input]
price = 4
cache = { read = 0.2, write = 5 }

[cost.text.output]
price = 20
reasoning = 20
