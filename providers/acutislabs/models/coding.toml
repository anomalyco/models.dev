# Acutis Labs-owned semantic route. The gateway selects its coding backend while preserving the Anthropic Messages
# contract.
schema = 2
name = "Coding (Opus 5.5)"
description = "Quality-focused coding route for implementation, debugging, and tool use"
family = "model-router"
open_weights = false
release_date = "2026-11-24"
v2_only = true

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = false

[limit]
context = 400_000
input = 400_000
output = 128_000
