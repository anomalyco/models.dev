# Source: https://acutislabs.org/api/ (accessed 2026-11-24). Acutis Labs owns this combo route and selects its backend.
# Authenticated production GET /v1/models verified 2026-11-24: id="everyday", owned_by="combo".
# Reasoning is router-selected with no caller control. Sampling fields are accepted but not guaranteed to be honored.
schema = 2
name = "Everyday"
description = "Fast and economical semantic route for everyday writing, analysis, and tool use"
family = "model-router"
open_weights = false
release_date = "2026-11-24"
[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = false
top_p = false
top_k = false

[limit]
context = 1_048_576
input = 1_048_576
output = 65_536

[cost.text.input]
price = 0.75
cache = { read = 0.075, write = 0.75 }

[cost.text.output]
price = 3.75
reasoning = 3.75
