# Pricing: https://gptzzz.ai/pricing/ (machine-readable: https://gptzzz.ai/api/v1/model-plaza).
# Prices there are per-group account-balance amounts, and balance is bought at CNY 1 per unit,
# so each model file converts them to USD and states the group, rate and date in its header.
name = "GPTZZZ"
env = ["GPTZZZ_API_KEY"]
npm = "@ai-sdk/openai-compatible"
api = "https://gptzzz.ai/v1"
doc = "https://gptzzz.ai/docs/"
