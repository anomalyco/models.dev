# GPTZZZ is an OpenAI-compatible relay. Effort values verified per model against the
# live /v1/chat/completions endpoint, re-verified 2026-09-28. gpt-6-astra rejected none
# on 2026-09-16 but accepts it as of 2026-09-28; the host now reports the supported set
# as "'none', 'low', 'medium', 'high', 'xhigh'" in its rejection of an unsupported value.
# minimal remains rejected on every model.
# Prices are the list prices published on https://gptzzz.ai/model-plaza multiplied by the
# public 0.05x group rate (read from https://gptzzz.ai/api/v1/model-plaza on 2026-09-29).
base_model = "openai/gpt-6-astra"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 0.5
output = 2.5
cache_read = 0.05
cache_write = 0.625

[[cost.tiers]]
tier = { size = 272_000 }
input = 1.0
output = 3.75
cache_read = 0.1
cache_write = 1.25
