# GPTZZZ is an OpenAI-compatible relay. Effort values follow the host's own report for
# gpt-6-astra, re-verified 2026-09-28: probing an unsupported value returns
# "Supported values are: 'none', 'low', 'medium', 'high', 'xhigh'" (no 'max').
# 'none' was rejected on 2026-09-16 and is accepted as of 2026-09-28; 'minimal' is rejected.
# Prices are the list prices published on https://gptzzz.ai/model-plaza multiplied by the
# public 0.05x group rate (read from https://gptzzz.ai/api/v1/model-plaza on 2026-09-29).
base_model = "openai/gpt-6-astra"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh"] }]

[cost]
input = 0.5
output = 2.5
cache_read = 0.05
cache_write = 0.625

[[cost.tiers]]
tier = { size = 272_000 }
input = 1.0
output = 3.75
cache_read = 0.1
cache_write = 1.25
