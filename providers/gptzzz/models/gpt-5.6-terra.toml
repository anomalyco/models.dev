# GPTZZZ is an OpenAI-compatible relay. Effort values verified against the live
# /v1/chat/completions endpoint on 2026-09-16: none, low, medium, high, xhigh, max
# are accepted; minimal is rejected upstream.
# Prices are the published 0.2x group rate applied to OpenAI list pricing, cross-checked
# against the cost/actual_cost fields returned by https://gptzzz.ai/v1/usage (2026-09-16).
base_model = "openai/gpt-5.6-terra"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 0.4
output = 2.4
cache_read = 0.04
cache_write = 0.5

[[cost.tiers]]
tier = { size = 272_000 }
input = 0.8
output = 3.6
cache_read = 0.08
cache_write = 1.00
