# GPTZZZ is an OpenAI-compatible relay. Effort values verified per model against the
# live /v1/chat/completions endpoint on 2026-09-16 and re-probed on 2026-09-29: none, low,
# medium, high, xhigh and max all return HTTP 200; minimal returns HTTP 400.
# Pricing: https://gptzzz.ai/pricing/ and https://gptzzz.ai/api/v1/model-plaza, read 2026-10-22.
# Lowest-priced group serving this model: group 3 "混合号池pro兜底", rate 0.1x.
# Host list price per MTok (input / output / cache read / cache write): 2.00 / 12.00 / 0.20 / 2.50,
# >272K context: 4.00 / 18.00 / 0.40 / 5.00.
# x 0.1 = 0.20 / 1.20 / 0.02 / 0.25 (>272K: 0.40 / 1.80 / 0.04 / 0.50) in account balance,
# which the host sells at CNY 1 per balance unit (Alipay top-up, "¥1 = $1 余额"), so these are CNY.
# CNY→USD rate: 6.691314, 2026-10-21, source: https://open.er-api.com/v6/latest/USD
# USD = CNY / 6.691314, rounded to 8 decimals.
# Also served in group 33 "不降智分组" at 0.25x (2.5x the prices below).
