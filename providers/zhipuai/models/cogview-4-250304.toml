# Sources (accessed 2026-11-25):
# - Pricing (CNY): https://docs.bigmodel.cn/cn/guide/start/pricing (CNY 0.06 per image)
# - Model: https://docs.bigmodel.cn/cn/guide/models/image-generation/cogview-4
# - API: POST /api/paas/v4/images/generations, model code cogview-4-250304 (https://docs.bigmodel.cn/api-reference/模型-api/图像生成)
# CNY→USD rate: 6.678179, 2026-11-25, source: https://open.er-api.com/v6/latest/USD
# Live 2026-11-25 on open.bigmodel.cn: cogview-4-250304 returns an image URL; plain cogview-4 returns 1211 "模型不存在".
schema = 2
v2_only = true
base_model = "zhipuai/cogview-4"

[api.images]
sdk = { opencodeai = "@opencode/ai/providers/zai/images" }

[cost.image.output]
unit = "image"
price = 0.00898
