# GLM-5.3-FlashX is the high-speed serving option for GLM-5.3-Flash.
# https://docs.bigmodel.cn/cn/guide/models/vlm/glm-5.3-flash
# Pricing: https://docs.z.ai/guides/overview/pricing (accessed 2026-09-19)
schema = 2
base_model = "zhipuai/glm-5.3-flash"
name = "GLM-5.3-FlashX"
description = "High-speed GLM-5.3-Flash serving option for coding and agent workflows"
release_date = "2026-09-18"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.37
cache = { read = 0.075, write = 0 }

[cost.text.output]
price = 1.25
