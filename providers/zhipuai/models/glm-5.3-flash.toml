# GLM-5.3-Flash always reasons (thinking cannot be disabled); text params
# match GLM-5.3 — effort low|high|max with default max.
# https://docs.bigmodel.cn/cn/guide/models/vlm/glm-5.3-flash
# Pricing: https://docs.z.ai/guides/overview/pricing (accessed 2026-09-19)
base_model = "zhipuai/glm-5.3-flash"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.15
output = 0.50
cache_read = 0.03
cache_write = 0
