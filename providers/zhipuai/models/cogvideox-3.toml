# Sources (accessed 2026-10-19):
# - Pricing (CNY): https://docs.bigmodel.cn/cn/guide/start/pricing (CNY 1 per video)
# - Model: https://docs.bigmodel.cn/cn/guide/models/video-generation/cogvideox-3
# Billed per generated video, which the cost schema has no unit for; no [cost] authored.
# API: POST /api/paas/v4/videos/generations, async (https://docs.bigmodel.cn/api-reference/模型-api/视频生成异步)
schema = 2
v2_only = true
base_model = "zhipuai/cogvideox-3"

[api.videos]
sdk = { aisdk = "none", opencodeai = "none" }
