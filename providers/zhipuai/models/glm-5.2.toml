# Sources (accessed 2026-10-19):
# - Pricing (CNY): https://docs.bigmodel.cn/cn/guide/start/pricing
# - Model: https://docs.bigmodel.cn/cn/guide/models/text/glm-5.2
# - Thinking: https://docs.bigmodel.cn/cn/guide/capabilities/thinking, https://docs.bigmodel.cn/cn/guide/capabilities/thinking-mode
# - Caching (automatic, no write price): https://docs.bigmodel.cn/cn/guide/capabilities/cache
# - Chat API (temperature and top_p, no top_k; images jpg/png; video mp4/mkv/mov): https://docs.z.ai/api-reference/llm/chat-completion
# CNY→USD rate: 6.693661, 2026-10-19, source: https://open.er-api.com/v6/latest/USD
# List price: CNY 8/2/28 (input/cache read/output per MTok)
# Toggle: thinking.type = enabled|disabled (default enabled)
# Effort: reasoning_effort = high|max (default max); none|minimal skip thinking, low|medium map to
# high, xhigh maps to max
# Mid-conversation (checked live 2026-10-19 on api.z.ai and open.bigmodel.cn): a late system message
# is accepted and keeps the cache; adding or removing tools between turns drops it.
# Changing reasoning_effort between turns also drops the cache.
schema = 2
base_model = "zhipuai/glm-5.2"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, default = { type = "effort", value = "max" }, toggle = true, effort = ["high", "max"] }
structured_output = true
top_k = false
system_updates = true
effort_updates = false
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.19516
cache = { read = 0.29879, write = 0 }

[cost.text.output]
price = 4.18306
