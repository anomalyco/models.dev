# `reasoning_effort`: none|minimal skip thinking, low|medium map to high,
# and xhigh maps to max; effective levels are high|max (default: max).
# https://docs.bigmodel.cn/cn/guide/capabilities/thinking (accessed 2026-06-25)
schema = 2
name = "GLM-5.2"
description = "Open flagship GLM for long-horizon coding agents and million-token context work"
family = "glm"
open_weights = false
release_date = "2026-06-13"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["high", "max"] }
structured_output = true
temperature = true

[limit]
context = 1_000_000
output = 131_072

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.4
cache = { read = 0.26, write = 0 }

[cost.text.output]
price = 4.4
