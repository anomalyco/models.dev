# Sources (accessed 2026-10-19):
# - Pricing (CNY): https://docs.bigmodel.cn/cn/guide/start/pricing
# - Model: https://docs.bigmodel.cn/cn/guide/models/text/glm-4.5
# - Thinking: https://docs.bigmodel.cn/cn/guide/capabilities/thinking, https://docs.bigmodel.cn/cn/guide/capabilities/thinking-mode
# - Caching (automatic, no write price): https://docs.bigmodel.cn/cn/guide/capabilities/cache
# - Chat API (temperature and top_p, no top_k; images jpg/png; video mp4/mkv/mov): https://docs.z.ai/api-reference/llm/chat-completion
# CNY→USD rate: 6.693661, 2026-10-19, source: https://open.er-api.com/v6/latest/USD
# List price: CNY 0.8/0.16/6 (input/cache read/output per MTok); input >= 32K: CNY 1.2/0.24/8
# Inputs under 32K are also split by output length (< 0.2K output is cheaper); the
# general-case (>= 0.2K output) rate is used since the catalog has no output-length dimension.
# Toggle: thinking.type = enabled|disabled (default enabled)
# Mid-conversation (live 2026-10-23 on api.z.ai and open.bigmodel.cn, ~7k-token first user message):
# a late system message is followed but not kept in place (cached tokens drop to ~0 vs ~7.5k on the
# unchanged control), so system_updates is left out.
# effort_updates: left out. Flipping thinking.type on the next request keeps the cache (reasoning tokens
# ~100 vs 0), but there's no in-history effort message, so it doesn't count.
# Adding or removing tools between turns drops the cache (2026-10-19).
# Tools: tool_choice supports only auto on Chat Completions and none|auto on Responses; no strict tool mode
#   (https://docs.bigmodel.cn/cn/guide/capabilities/function-calling, https://docs.bigmodel.cn/cn/guide/develop/responses/introduction).
schema = 2
base_model = "zhipuai/glm-4.5-air"

[capabilities]
tools = { supported = true, choice = ["auto"] }
reasoning = { supported = true, default = { type = "toggle", value = true }, toggle = true }
top_k = false
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content", max_tokens_field = "max_tokens" }

[api.messages]
base_url = "https://open.bigmodel.cn/api/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/zai-coding-plan/messages" }

[api.responses]
base_url = "https://open.bigmodel.cn/api/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/zai-coding-plan/responses" }

[cost.text.input]
price = 0.11952
cache = { read = 0.0239, write = 0 }

[[cost.text.input.overrides]]
when = { context = { gte = 32_000 } }
price = 0.17927
cache = { read = 0.03585, write = 0 }

[cost.text.output]
price = 0.89637

[[cost.text.output.overrides]]
when = { context = { gte = 32_000 } }
price = 1.19516
