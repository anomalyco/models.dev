schema = 2
name = "GLM-5.1"
description = "Strong GLM coding model for agentic engineering, terminals, and repository generation"
family = "glm"
open_weights = false
release_date = "2026-03-27"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true }
structured_output = true
temperature = true

[limit]
context = 200_000
output = 131_072

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.4
cache = { read = 0.26, write = 0 }

[cost.text.output]
price = 4.4
