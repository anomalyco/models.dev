# Source: https://tokenharbor.ai/models (retrieved 2026-10-08); USD per 1M tokens.
# Toggle: thinking.type = enabled|disabled (matches Anthropic native; OpenRouter
# relay peer uses reasoning.enabled = true|false)
base_model = "anthropic/claude-haiku-5-5"
reasoning_options = [
  { type = "toggle" },
  { type = "effort", values = ["low", "medium", "high", "xhigh", "max"] },
]

[cost]
input = 0.1
output = 0.5
