# Source: https://blazeinfer.ai/models and https://blazeinfer.ai/docs (accessed 2026-11-21).
# Pricing and limits: host catalog, USD per 1M tokens; context 32,000 and output 32,000.
# APIs: Chat Completions, Responses and Messages returned valid responses (live probes 2026-11-21).
# Reasoning: no caller control is documented; the lab's always-on reasoning is inherited.
# Chat returns the trace in `reasoning`. reasoning_field = "reasoning" is valid in v2,
# but v1's interleaved.field only allows reasoning_content|reasoning_details, so no
# reasoning_field is set rather than a wrong one.
# Input: PNG, JPEG, GIF and WebP data URIs were accepted (live probes 2026-11-21);
# HEIC and HEIF are not advertised by the host and are excluded.
schema = 2
base_model = "google/gemma-4-26b-a4b-it"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true
cache = { implicit = true }

[limit]
context = 32_000
output = 32_000

[api.chat-completions]

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.07
cache = { read = 0.014 }

[cost.text.output]
price = 0.34
