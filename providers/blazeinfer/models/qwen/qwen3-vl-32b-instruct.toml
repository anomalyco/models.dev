# Source: BlazeInfer console model card (2026-11-21) and https://blazeinfer.ai/docs.
# Pricing and limits: 0.16/0.032/0.60 credits per 1M tokens (1 credit = 1 USD, matching the
# public catalog); context 65,536 and output 16,384.
# APIs: Chat Completions, Responses and Messages returned valid responses (live probes 2026-11-21).
# Reasoning: the console card has no Reasoning tag and the lab declares reasoning false.
# Input: PNG, JPEG, GIF and WebP data URIs were accepted (live probes 2026-11-21);
# video and the lab's extra formats are not advertised by the host and are excluded.
schema = 2
base_model = "alibaba/qwen3-vl-32b-instruct"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
structured_output = true
cache = { implicit = true }

[limit]
context = 65_536
output = 16_384

[api.chat-completions]

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.16
cache = { read = 0.032 }

[cost.text.output]
price = 0.6
