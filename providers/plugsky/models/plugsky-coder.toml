# Description and capability flags come from https://api.plugsky.com/v1/models.
# release_date is preserved for existing entries; a new entry uses its first catalog date.
# No documented pool-wide reasoning-effort control: `reasoning` mirrors the host response.
schema = 2
name = "Plugsky Coder"
description = "Plugsky Coder: 550B (activated: ~55B), 262144 token serving context. Equivalent class and context required on failover."
open_weights = false
release_date = "2026-11-26"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true
temperature = true
tools = { supported = true }

[limit]
context = 262_144
output = 16_384
