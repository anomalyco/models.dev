# Description and capability flags come from https://api.plugsky.com/v1/models.
# No documented pool-wide reasoning-effort control: `reasoning` mirrors the host response.
schema = 2
name = "Plugsky GPU 27B"
description = "Plugsky GPU 27B — 32K context, tools and JSON on verified consumer GPUs. Non-streaming; falls back to Plugsky Pro when no worker is available."
open_weights = false
release_date = "2026-11-26"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = false }
structured_output = true
tools = { supported = true }

[limit]
context = 32_768
output = 16_384
