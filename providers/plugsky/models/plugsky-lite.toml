# Description and capability flags come from https://api.plugsky.com/v1/models (checked 2026-11-25).
# No documented pool-wide reasoning-effort control: `supported` mirrors the host response.
schema = 2
name = "Plugsky Lite"
description = "Plugsky Lite: 30B (activated: ~3B), 262144 token serving context. Vision-capable Nano Omni engine; no automatic engine fallback."
open_weights = false
release_date = "2026-11-25"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true
tools = { supported = true }
temperature = true

[limit]
context = 262144
output = 8192
