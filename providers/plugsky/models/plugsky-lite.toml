# Description and capability flags come from https://api.plugsky.com/v1/models.
# No documented pool-wide reasoning-effort control: `reasoning` mirrors the host response.
schema = 2
name = "Plugsky Lite"
description = "Plugsky Lite: 30B (activated: ~3B), 262144 token serving context. Vision-capable Nano Omni engine; no automatic engine fallback."
open_weights = false
release_date = "2026-11-26"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true
tools = { supported = true }

[limit]
context = 262_144
output = 8_192
