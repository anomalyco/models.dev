# Prices: https://api.relayswitch.io/v1/catalog (accessed 2026-11-26), USD per million tokens.
# Effort: reasoning_effort = low|high|max on Chat Completions, passed through by the gateway. Levels copied from providers/moonshotai for this model.
schema = 2
base_model = "moonshotai/kimi-k3.1-pro-highspeed"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }

[cost.text.input]
price = 10

[cost.text.output]
price = 50
