# Prices: https://api.relayswitch.io/v1/catalog (accessed 2026-11-26), USD per million tokens.
# Effort: reasoning_effort = none|low|medium|high|xhigh on Chat Completions, passed through by the gateway. Levels copied from providers/openai for this model.
schema = 2
base_model = "openai/gpt-5.4-mini"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }

[cost.text.input]
price = 0.75
cache = { read = 0.075 }

[cost.text.output]
price = 4.5
