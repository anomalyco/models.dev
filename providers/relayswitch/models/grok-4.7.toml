# Prices: https://api.relayswitch.io/v1/catalog (accessed 2026-11-26), USD per million tokens.
# Effort: reasoning_effort = low|medium|high|xhigh on Chat Completions, passed through by the gateway. Levels copied from providers/xai for this model.
schema = 2
base_model = "xai/grok-4.7"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }

[cost.text.input]
price = 0.6
cache = { read = 0.15 }

[cost.text.output]
price = 1.8
