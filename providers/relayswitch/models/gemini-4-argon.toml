# Prices: https://api.relayswitch.io/v1/catalog (accessed 2026-11-26), USD per million tokens.
# The catalog price includes this month's 3% co-op volume discount (coop_discount_pct), so it can change when a month starts.
# Effort: reasoning_effort = low|medium|high on Chat Completions, passed through by the gateway. Levels copied from providers/google for this model.
schema = 2
base_model = "google/gemini-4-argon"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[cost.text.input]
price = 1.164
cache = { read = 0.0625 }

[cost.text.output]
price = 2.91
