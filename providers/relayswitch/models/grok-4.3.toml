# Prices: https://api.relayswitch.io/v1/catalog (accessed 2026-11-26), USD per million tokens.
# Effort: reasoning_effort = none|low|medium|high|xhigh on Chat Completions, passed through by the gateway. Levels copied from providers/xai for this model.
schema = 2
base_model = "xai/grok-4.3"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }

[cost.text.input]
price = 1.875
cache = { read = 0.3 }

[cost.text.output]
price = 3.75
