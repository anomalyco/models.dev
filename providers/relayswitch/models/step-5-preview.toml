# Prices: https://api.relayswitch.io/v1/catalog (accessed 2026-11-26), USD per million tokens.
# Effort: reasoning_effort = low|medium|high on Chat Completions, passed through by the gateway. Levels copied from providers/stepfun for this model.
schema = 2
base_model = "stepfun/step-5-preview"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[cost.text.input]
price = 3.5
cache = { read = 0.175 }

[cost.text.output]
price = 9.45
