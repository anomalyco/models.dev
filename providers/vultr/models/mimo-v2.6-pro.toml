# Toggle: reasoning.enabled = true|false
# Reasoning levels: providers/xiaomi/models/mimo-v2.6-pro.toml (Vultr maps reasoning_effort onto the model's native levels)
# Prices, context, tools and structured output: GET https://api.vultrinference.com/v1/models
schema = 2
base_model = "xiaomi/mimo-v2.6-pro"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[cost.text.input]
price = 0.4

[cost.text.output]
price = 0.8
