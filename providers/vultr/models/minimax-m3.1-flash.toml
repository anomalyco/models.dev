# Effort: reasoning_effort = low|medium|high|xhigh|max
# Reasoning levels: providers/minimax/models/MiniMax-M3.1-Flash.toml (Vultr maps reasoning_effort onto the model's native levels)
# Prices, context, tools and structured output: GET https://api.vultrinference.com/v1/models
schema = 2
base_model = "minimax/MiniMax-M3.1-Flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[limit]
context = 1_048_576

[cost.text.input]
price = 0.2

[cost.text.output]
price = 0.9
