# Toggle: reasoning.enabled = true|false
# Effort: reasoning_effort = low|high|max
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
context = 1_048_576

[cost.text.input]
price = 0.15

[cost.text.output]
price = 0.6
