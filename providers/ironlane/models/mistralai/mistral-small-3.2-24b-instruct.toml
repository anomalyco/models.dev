# Prices: Ironlane public model catalog (https://app-api.ironlane.ai/api/models), read 2026-11-18; the default provider's list price, USD per 1M tokens (or per stated unit).
# Served by Scaleway through Ironlane's OpenAI-compatible route: messages and content parts are passed on as sent.
# Cache: none listed; Scaleway has no cached-input price in Ironlane's catalog.
# Limits: Ironlane's catalog lists these, lower than the lab's.
schema = 2
base_model = "mistral/mistral-small-3.2-24b-instruct"

[limit]
context = 128_000

[cost.text.input]
price = 0.167685

[cost.text.output]
price = 0.391265
