# Ironlane routes pass-through to the lowest-priced healthy provider and bills the
# provider list price (https://ironlane.ai/pricing). GLM 5.2 figures mirror the
# Z.ai first-party entry (Ironlane forwards to Z.ai): list 1.4 / 4.4, cache 0.26;
# reasoning effort high|max, returned in `reasoning_content`.
# Source: https://docs.z.ai/api-reference
base_model = "zhipuai/glm-5.2"

[[reasoning_options]]
type = "effort"
values = ["high", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 1.4
output = 4.4
cache_read = 0.26