# Prices: Ironlane public model catalog (https://app-api.ironlane.ai/api/models), read 2026-11-04;
# list prices of the default provider, USD per 1M tokens (or per stated unit).
schema = 2
base_model = "openai/gpt-image-2.5-sunburst"

[modalities]
input = ["text"]
output = ["image/png", "image/jpeg", "image/webp"]

[api.images]
sdk = { opencodeai = "@opencode/ai/providers/openai-compatible/images" }

[cost.text.input]
price = 5

[cost.image.output]
price = 30
