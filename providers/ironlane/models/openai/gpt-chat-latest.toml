# Prices: Ironlane public model catalog (https://app-api.ironlane.ai/api/models), read 2026-11-18; the default provider's list price, USD per 1M tokens (or per stated unit).
# chat-latest tracks the current ChatGPT Instant snapshot; base_model, name and knowledge follow providers/openai/models/chat-latest.toml.
# Served by OpenAI through Ironlane's OpenAI-compatible route: messages and content parts are passed on as sent.
# Reasoning: no caller control; no effort levels listed for this model by its lab or hosts.
# Custom tools: none. Ironlane takes function tools only ("function tools, in OpenAI's format", https://ironlane.ai/docs/api/chat-completions); a "custom" tool is a 400 invalid_tools, so no freeform.
# Cache: implicit; cached input bills at OpenAI's cached price (https://ironlane.ai/docs/api/chat-completions).
schema = 2
base_model = "openai/gpt-5.5-instant"
name = "Chat Latest"
knowledge = "2026-04-20"

[capabilities]
reasoning = { supported = true }
cache = { implicit = true }

[cost.text.input]
price = 5
cache = { read = 0.5 }

[cost.text.output]
price = 30
