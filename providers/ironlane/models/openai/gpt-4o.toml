# Prices: Ironlane public model catalog (https://app-api.ironlane.ai/api/models), read 2026-11-04;
# list prices of the default provider, USD per 1M tokens (or per stated unit).
# Capabilities: Ironlane's POST /v1/chat/completions takes text messages with no tools, response_format or image/pdf parts.
schema = 2
base_model = "openai/gpt-4o"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
cache = { implicit = true }
structured_output = false

[cost.text.input]
price = 2.5
cache = { read = 1.25 }

[cost.text.output]
price = 10
