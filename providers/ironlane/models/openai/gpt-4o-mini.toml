# Prices: Ironlane public model catalog (https://app-api.ironlane.ai/api/models), read 2026-11-18; the default provider's list price, USD per 1M tokens (or per stated unit).
# Served by OpenAI through Ironlane's OpenAI-compatible route: messages and content parts are passed on as sent.
# Cache: implicit; cached input bills at OpenAI's cached price (https://ironlane.ai/docs/api/chat-completions).
schema = 2
base_model = "openai/gpt-4o-mini"

[capabilities]
cache = { implicit = true }

[cost.text.input]
price = 0.15
cache = { read = 0.075 }

[cost.text.output]
price = 0.6
