# Prices: Ironlane public model catalog (https://app-api.ironlane.ai/api/models), read 2026-11-18; the default provider's list price, USD per 1M tokens (or per stated unit).
# Effort: reasoning_effort = minimal|low|medium|high (https://ironlane.ai/docs/api/chat-completions, request fields); levels from providers/openai/models/gpt-5-mini.toml.
# Custom tools: none. Ironlane takes function tools only ("function tools, in OpenAI's format", https://ironlane.ai/docs/api/chat-completions); a "custom" tool is a 400 invalid_tools, so no freeform.
schema = 2
base_model = "openai/gpt-5-mini"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
cache = { implicit = true }

[cost.text.input]
price = 0.25
cache = { read = 0.025 }

[cost.text.output]
price = 2
