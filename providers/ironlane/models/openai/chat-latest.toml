# chat-latest is OpenAI's moving alias for the current ChatGPT Instant snapshot;
# base_model, name and knowledge follow providers/openai/models/chat-latest.toml
# (https://developers.openai.com/api/docs/models/chat-latest).
# Prices: Ironlane public model catalog (https://app-api.ironlane.ai/api/models), read 2026-11-04;
# list prices of the default provider, USD per 1M tokens (or per stated unit).
# Capabilities: Ironlane's POST /v1/chat/completions takes text messages with no tools, response_format or image/pdf parts.
schema = 2
base_model = "openai/gpt-5.5-instant"
name = "Chat Latest"
knowledge = "2026-04-20"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true }
cache = { implicit = true }
structured_output = false

[cost.text.input]
price = 5
cache = { read = 0.5 }

[cost.text.output]
price = 30
