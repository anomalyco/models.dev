# Prices: Ironlane public model catalog (https://app-api.ironlane.ai/api/models), read 2026-11-18; the default provider's list price, USD per 1M tokens (or per stated unit).
# Served by Featherless through Ironlane's OpenAI-compatible route: messages and content parts are passed on as sent.
# Effort: reasoning_effort = low|medium|high (https://ironlane.ai/docs/api/chat-completions, request fields); levels from providers/openrouter/models/openai/gpt-oss-safeguard-20b.toml.
# Cache: none listed; Featherless has no cached-input price in Ironlane's catalog.
schema = 2
base_model = "openai/gpt-oss-safeguard-20b"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[limit]
context = 32_768
output = 32_768

[cost.text.input]
price = 0.075

[cost.text.output]
price = 0.3
