# Prices: Ironlane public model catalog (https://app-api.ironlane.ai/api/models), read 2026-11-18; the default provider's list price, USD per 1M tokens (or per stated unit).
# Served by Nebius Token Factory through Ironlane's OpenAI-compatible route: messages and content parts are passed on as sent.
# Reasoning: no caller control. Ironlane documents reasoning_effort for OpenAI models only ("other models ignore it") and passes no other field to the provider (https://ironlane.ai/docs/api/chat-completions).
# Cache: implicit; cached input bills at Nebius Token Factory's cached price (https://ironlane.ai/docs/api/chat-completions).
# Limits: Ironlane's catalog lists these, lower than the lab's.
schema = 2
base_model = "nvidia/nemotron-3.5-super-vl-120b-a12b"

[capabilities]
reasoning = { supported = true }
cache = { implicit = true }

[limit]
context = 262_144

[cost.text.input]
price = 0.3
cache = { read = 0.06 }

[cost.text.output]
price = 0.9
