# Prices: Ironlane public model catalog (https://app-api.ironlane.ai/api/models), read 2026-11-18; the default provider's list price, USD per 1M tokens (or per stated unit).
# Served by DigitalOcean through Ironlane's OpenAI-compatible route: messages and content parts are passed on as sent.
# Input: as DigitalOcean takes this model (providers/digitalocean/models/nemotron-3-nano-omni.toml).
# Reasoning: no caller control. Ironlane documents reasoning_effort for OpenAI models only ("other models ignore it") and passes no other field to the provider (https://ironlane.ai/docs/api/chat-completions).
# Cache: implicit; cached input bills at DigitalOcean's cached price (https://ironlane.ai/docs/api/chat-completions).
# Limits: the lower of Ironlane's catalog and DigitalOcean's own entry (providers/digitalocean/models/nemotron-3-nano-omni.toml); a request past the host's cap fails there.
schema = 2
base_model = "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"

[modalities]
input = ["text", "image/jpeg", "image/png", "video/mp4"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
cache = { implicit = true }

[limit]
context = 65_536

[cost.text.input]
price = 0.5
cache = { read = 0.1 }

[cost.text.output]
price = 0.9
