# Prices: Ironlane public model catalog (https://app-api.ironlane.ai/api/models), read 2026-11-04;
# list prices of the default provider, USD per 1M tokens (or per stated unit).
# Capabilities: Ironlane's POST /v1/chat/completions takes text messages with no tools, response_format or image/pdf parts.
schema = 2
base_model = "google/gemini-3.5-flash"

[modalities]
input = ["text", "audio/wav", "audio/mp3", "audio/aiff", "audio/aac", "audio/ogg", "audio/flac", "audio/mpeg", "audio/m4a", "audio/l16", "audio/opus", "audio/alaw", "audio/mulaw", "audio/webm"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true }
cache = { implicit = true }
structured_output = false

[cost.text.input]
price = 1.5
cache = { read = 0.15 }

[cost.text.output]
price = 9
