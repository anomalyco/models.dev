# Prices: Ironlane public model catalog (https://app-api.ironlane.ai/api/models), read 2026-11-18; the default provider's list price, USD per 1M tokens (or per stated unit).
# Input: text only. Ironlane's request to this model's provider carries message text, not image or file parts.
# Reasoning: off. Thinking is off by default on Gemini's API and Ironlane sends no thinkingConfig.
schema = 2
base_model = "google/gemini-2.5-flash-lite"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = false }
cache = { implicit = true }

[cost.text.input]
price = 0.1
cache = { read = 0.01 }

[cost.text.output]
price = 0.4
