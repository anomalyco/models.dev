# Prices: Ironlane public model catalog (https://app-api.ironlane.ai/api/models), read 2026-11-18; the default provider's list price, USD per 1M tokens (or per stated unit).
# Input: text only. Ironlane serves POST /v1/images/generations (a text prompt), not image edits.
# Reasoning: no caller control; Ironlane's image endpoint takes no reasoning field.
schema = 2
base_model = "google/gemini-3.1-flash-lite-image"

[modalities]
input = ["text"]
output = ["text", "image/png", "image/jpeg"]

[capabilities]
reasoning = { supported = true }

[api.images]
sdk = { opencodeai = "@opencode/ai/providers/openai-compatible/images" }

[cost.image.output]
unit = "image"
price = 0.069
