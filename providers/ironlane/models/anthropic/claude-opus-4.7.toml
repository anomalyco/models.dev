# Prices: Ironlane public model catalog (https://app-api.ironlane.ai/api/models), read 2026-11-18; the default provider's list price, USD per 1M tokens (or per stated unit).
# Input: text only. Ironlane's request to this model's provider carries message text, not image or file parts.
# Reasoning: no caller control. Ironlane sends no `thinking` or effort; the model reasons at Anthropic's default.
# Cache: none. Anthropic caches only on cache_control markers, which Ironlane doesn't send.
schema = 2
base_model = "anthropic/claude-opus-4-7"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
cache = false

[cost.text.input]
price = 5

[cost.text.output]
price = 25
