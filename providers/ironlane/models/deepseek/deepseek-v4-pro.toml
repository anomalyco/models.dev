# Prices: Ironlane public model catalog (https://app-api.ironlane.ai/api/models), read 2026-11-18; the default provider's list price, USD per 1M tokens (or per stated unit).
# Served by DigitalOcean through Ironlane's OpenAI-compatible route: messages and content parts are passed on as sent.
# Reasoning: off. Thinking is off by default for this model (providers/digitalocean/models/deepseek-v4-pro.toml, live 2026-10-20: an omitted reasoning_effort returns no reasoning_content), and Ironlane documents reasoning_effort for OpenAI models only ("other models ignore it") and passes no other field to the provider (https://ironlane.ai/docs/api/chat-completions): no documented field turns it on.
# Cache: implicit; cached input bills at DigitalOcean's cached price (https://ironlane.ai/docs/api/chat-completions).
schema = 2
base_model = "deepseek/deepseek-v4-pro"

[capabilities]
reasoning = { supported = false }
cache = { implicit = true }

[cost.text.input]
price = 1.74
cache = { read = 0.348 }

[cost.text.output]
price = 3.48
