# Prices: Ironlane public model catalog (https://app-api.ironlane.ai/api/models), read 2026-11-18; the default provider's list price, USD per 1M tokens (or per stated unit).
# Served by io.net (IO Intelligence) through Ironlane's OpenAI-compatible route: messages and content parts are passed on as sent.
# Cache: implicit; cached input bills at io.net (IO Intelligence)'s cached price (https://ironlane.ai/docs/api/chat-completions).
# Limits: the lower of Ironlane's catalog and io.net (IO Intelligence)'s own entry (providers/io-net/models/Qwen/Qwen3-Next-80B-A3B-Instruct.toml); a request past the host's cap fails there.
schema = 2
base_model = "alibaba/qwen3-next-80b-a3b-instruct"

[capabilities]
cache = { implicit = true }

[limit]
output = 4096

[cost.text.input]
price = 0.09925
cache = { read = 0.049625 }

[cost.text.output]
price = 1.1825
