# Prices: Ironlane public model catalog (https://app-api.ironlane.ai/api/models), read 2026-11-18; the default provider's list price, USD per 1M tokens (or per stated unit).
# Served by Alibaba Cloud (Qwen) through Ironlane's OpenAI-compatible route: messages and content parts are passed on as sent.
# Reasoning: off. Thinking is off by default for this model (providers/alibaba/models/qwen-flash.toml), and Ironlane documents reasoning_effort for OpenAI models only ("other models ignore it") and passes no other field to the provider (https://ironlane.ai/docs/api/chat-completions): no documented field turns it on.
# Cache: none listed; Alibaba Cloud (Qwen) has no cached-input price in Ironlane's catalog.
schema = 2
base_model = "alibaba/qwen-flash"

[capabilities]
reasoning = { supported = false }

[limit]
context = 256_000

[cost.text.input]
price = 0.05

[cost.text.output]
price = 0.4
