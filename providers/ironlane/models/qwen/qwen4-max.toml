# Prices: Ironlane public model catalog (https://app-api.ironlane.ai/api/models), read 2026-11-18; the default provider's list price, USD per 1M tokens (or per stated unit).
# Served by Alibaba Cloud (Qwen) through Ironlane's OpenAI-compatible route: messages and content parts are passed on as sent.
# Reasoning: no caller control. Ironlane documents reasoning_effort for OpenAI models only ("other models ignore it") and passes no other field to the provider (https://ironlane.ai/docs/api/chat-completions).
# Cache: implicit; cached input bills at Alibaba Cloud (Qwen)'s cached price (https://ironlane.ai/docs/api/chat-completions).
schema = 2
base_model = "alibaba/qwen4-max"

[capabilities]
reasoning = { supported = true }
cache = { implicit = true }

[limit]
output = 131_072

[cost.text.input]
price = 1.5
cache = { read = 0.075 }

[cost.text.output]
price = 4.5
