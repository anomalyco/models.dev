# Prices: Ironlane public model catalog (https://app-api.ironlane.ai/api/models), read 2026-11-18; the default provider's list price, USD per 1M tokens (or per stated unit).
# Served by Together AI through Ironlane's OpenAI-compatible route: messages and content parts are passed on as sent.
# Input: as Together AI takes this model (providers/togetherai/models/Qwen/Qwen3.6-Plus.toml).
# Reasoning: no caller control. Ironlane documents reasoning_effort for OpenAI models only ("other models ignore it") and passes no other field to the provider (https://ironlane.ai/docs/api/chat-completions).
# Cache: none listed; Together AI has no cached-input price in Ironlane's catalog.
schema = 2
base_model = "alibaba/qwen3.6-plus"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true }

[cost.text.input]
price = 0.5

[cost.text.output]
price = 3
