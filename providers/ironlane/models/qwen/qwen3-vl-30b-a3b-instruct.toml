# Prices: Ironlane public model catalog (https://app-api.ironlane.ai/api/models), read 2026-11-18; the default provider's list price, USD per 1M tokens (or per stated unit).
# Served by NEAR AI Cloud through Ironlane's OpenAI-compatible route: messages and content parts are passed on as sent.
# Input: text, image/bmp, image/jpeg, image/png, image/tiff, image/webp, image/heic, as NEAR AI Cloud takes this model (providers/nearai/models/Qwen/Qwen3-VL-30B-A3B-Instruct.toml).
# Cache: implicit; cached input bills at NEAR AI Cloud's cached price (https://ironlane.ai/docs/api/chat-completions).
schema = 2
base_model = "alibaba/qwen3-vl-30b-a3b-instruct"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
cache = { implicit = true }

[limit]
context = 16_384
output = 8192

[cost.text.input]
price = 0.15
cache = { read = 0.03 }

[cost.text.output]
price = 0.55
