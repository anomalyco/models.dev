# Sources (accessed 2026-10-25): https://api.decisionmodels.io/v1/models (live registry), https://decisionmodels.io/pricing , https://decisionmodels.io/docs/quickstart
# Prices are USD per 1M input tokens on the Peer-to-Peer (S1-Region: global) tier; output tokens are free. The EU tier (S1-Region: eu)
#   costs $0.032 per 1M input tokens; it is not modelled because the EU/global ratio differs per model.
# Model: s1-vision is a host-unique rotating alias of Decision Models, not a fixed lab model. It always answers with the current Vision version;
#   the alias moves to a new open-weights version with 7 days' notice on https://decisionmodels.io/changelog (pinned version ids are not listed here).
#   A fixed base_model would therefore go stale at each move, so this file is a full definition (AGENTS.md exception: host alias).
#   One image per request, 4 MiB and 2,000,000 pixels at most.
# Text-only requests cost $0.031; requests that contain an image bill ALL input tokens at $0.217 (EU $0.228) per 1M (override below).
# release_date: no launch date is published; 2026-09-30 is the snapshot date of the first OpenAPI contract that lists s1-vision, so the real release may be earlier.
schema = 2
type = "decision"
name = "s1-vision"
description = "Open decision model for text and one image per request: one typed noul, choice or score question, answered with probabilities"
open_weights = true
release_date = "2026-09-30"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp"]
output = ["decision"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 8_000
output = 0

[api.systemone]
base_url = "https://api.decisionmodels.io/v1"
sdk = { aisdk = "@ai-sdk/typesafe-ai", opencodeai = "@opencode/ai/providers/typesafe-ai" }
compatibility = { image_input = "images" }

[cost.text.input]
price = 0.031

[[cost.text.input.overrides]]
when = { input_images = { gt = 0 } }
price = 0.217

[cost.text.output]
price = 0
