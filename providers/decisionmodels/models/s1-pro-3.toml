# vLLM-SR d3 served in FP8, text only. Up to 3 questions per request. The previous s1-pro, kept to at
# least 2027-01-27; still the global-tier target of s1-pro and its EU-tier fallback.
# Prices, limit: https://api.decisionmodels.io/v1/models (2026-11-05), global tier; EU as override.
# Launch pricing; output tokens are free.
schema = 2
v2_only = true
base_model = "vllm-sr/d3"
name = "S1 Pro 3"

[modalities]
input = ["text"]
output = ["decision"]

[limit]
context = 16_384

[api.systemone]
base_url = "https://api.decisionmodels.io/v1"
sdk = { aisdk = "@ai-sdk/typesafe-ai", opencodeai = "@opencode/ai/providers/typesafe-ai/decisions" }

[cost.text.input]
price = 0.08

[[cost.text.input.overrides]]
when = { region = { equals = "eu" } }
price = 0.084

[cost.text.output]
price = 0
