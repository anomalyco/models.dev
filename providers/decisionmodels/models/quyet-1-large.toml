# Sources (accessed 2026-10-25): https://api.decisionmodels.io/v1/models (live registry), https://decisionmodels.io/pricing , https://decisionmodels.io/docs/quickstart
# Prices are USD per 1M input tokens on the Peer-to-Peer (S1-Region: global) tier; output tokens are free. The EU tier (S1-Region: eu)
#   costs $0.038 per 1M input tokens; it is not modelled because the EU/global ratio differs per model.
# Model: Quyet-1.0-Large by Chinh Nguyen (Apache-2.0), FP8, text only, one question with at most 10 options.
# release_date: no release date is published; 2026-10-12 is the first date we can show it listed in the live /v1/models registry, so the real release may be earlier.
schema = 2
type = "decision"
name = "Quyet-1.0-Large"
description = "Open Quyet-1.0-Large decision model for text decisions: one typed noul, choice or score question per request, answered with probabilities"
open_weights = true
release_date = "2026-10-12"

[modalities]
input = ["text"]
output = ["decision"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 8_000
output = 0

[api.systemone]
base_url = "https://api.decisionmodels.io/v1"
sdk = { aisdk = "@ai-sdk/typesafe-ai", opencodeai = "@opencode/ai/providers/typesafe-ai" }

[cost.text.input]
price = 0.035

[cost.text.output]
price = 0
