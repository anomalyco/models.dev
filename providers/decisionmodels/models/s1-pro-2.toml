# Perplexity Decider v1.1 27B in NVFP4, text only. An earlier s1-pro, deprecated; it returns HTTP 410
# model_retired from 2026-12-01.
# Prices, limit: https://api.decisionmodels.io/v1/models (2026-11-05), global tier; EU as override.
# Launch pricing; output tokens are free.
schema = 2
v2_only = true
base_model = "perplexity/pplx-decider-v1.1-27b"
name = "S1 Pro 2"
status = "deprecated"

[modalities]
input = ["text"]
output = ["decision"]

[api.systemone]
base_url = "https://api.decisionmodels.io/v1"
sdk = { aisdk = "@ai-sdk/typesafe-ai", opencodeai = "@opencode/ai/providers/typesafe-ai/decisions" }

[cost.text.input]
price = 0.08

[[cost.text.input.overrides]]
when = { region = { equals = "eu" } }
price = 0.084

[cost.text.output]
price = 0
