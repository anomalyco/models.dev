# Blink v0.3 26B-A4B served in NVFP4.
# One PNG/JPEG/WebP image per request; with an image, all input bills at the image rate.
# Prices: https://api.decisionmodels.io/v1/models (2026-10-21), global tier; EU as override.
# Limit: 8,000 input tokens, per /v1/models and a live bisect (2026-10-23).
# Launch pricing; output tokens are free.
schema = 2
v2_only = true
base_model = "pixilabai/blink-v0.3-26b-a4b"
name = "S1 Vision 2"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp"]
output = ["decision"]

[limit]
context = 8_000

[api.systemone]
base_url = "https://api.decisionmodels.io/v1"
sdk = { aisdk = "@ai-sdk/typesafe-ai", opencodeai = "@opencode/ai/providers/typesafe-ai" }

[cost.text.input]
price = 0.031

[[cost.text.input.overrides]]
when = { region = { equals = "eu" } }
price = 0.032

[[cost.text.input.overrides]]
when = { input_images = { gt = 0 } }
price = 0.217

[[cost.text.input.overrides]]
when = { all = [{ region = { equals = "eu" } }, { input_images = { gt = 0 } }] }
price = 0.228

[cost.text.output]
price = 0
