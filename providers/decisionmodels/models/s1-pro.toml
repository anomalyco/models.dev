# Sources (accessed 2026-10-25): https://api.decisionmodels.io/v1/models (live registry), https://decisionmodels.io/pricing , https://decisionmodels.io/docs/quickstart
# Prices are USD per 1M input tokens on the Peer-to-Peer (S1-Region: global) tier; output tokens are free. The EU tier (S1-Region: eu)
#   costs $0.084 per 1M input tokens; it is not modelled because the EU/global ratio differs per model.
# Model: s1-pro is a host-unique rotating alias of Decision Models, not a fixed lab model. It always answers with the current Pro version;
#   the alias moves to a new open-weights version with 7 days' notice on https://decisionmodels.io/changelog (pinned version ids are not listed here).
#   A fixed base_model would therefore go stale at each move, so this file is a full definition (AGENTS.md exception: host alias).
#   Up to 3 questions per request, 8,192 input tokens per question.
# release_date: 2026-10-12 is the date of the current s1-pro request contract (up to 3 questions) on https://decisionmodels.io/models.
schema = 2
type = "decision"
name = "s1-pro"
description = "Larger open decision model for text decisions: up to three typed noul, choice or score questions per request, answered with probabilities"
open_weights = true
release_date = "2026-10-12"

[modalities]
input = ["text"]
output = ["decision"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 8_192
output = 0

[api.systemone]
base_url = "https://api.decisionmodels.io/v1"
sdk = { aisdk = "@ai-sdk/typesafe-ai", opencodeai = "@opencode/ai/providers/typesafe-ai" }

[cost.text.input]
price = 0.08

[cost.text.output]
price = 0
