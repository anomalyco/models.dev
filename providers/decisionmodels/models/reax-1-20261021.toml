# Pinned REAX 1 release of 2026-10-21 (revision ca2a0cc5), kept 30 days after it is replaced.
# Text only, up to 3 questions per request; the state is billed once, not per question.
# Prices, limit: https://api.decisionmodels.io/v1/models (2026-10-23), global tier; EU as override.
# Launch pricing; output tokens are free.
schema = 2
v2_only = true
base_model = "decisionmodels/reax-1"
name = "REAX 1 (2026-10-21)"

[modalities]
input = ["text"]
output = ["decision"]

[limit]
context = 8_192

[api.systemone]
base_url = "https://api.decisionmodels.io/v1"
sdk = { aisdk = "@ai-sdk/typesafe-ai", opencodeai = "@opencode/ai/providers/typesafe-ai" }

[cost.text.input]
price = 0.08

[[cost.text.input.overrides]]
when = { region = { equals = "eu" } }
price = 0.084

[cost.text.output]
price = 0
