# Prices and limits: https://llm.wavespeed.ai/v1/models (USD per million tokens, accessed 2026-10-21)
# Toggle: reasoning.enabled = true|false
# Effort: reasoning_effort = low|medium|high|xhigh|max
base_model = "anthropic/claude-haiku-5-5"
reasoning_options = [{ type = "toggle" }, { type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 0.1
output = 0.5
cache_read = 0.01
