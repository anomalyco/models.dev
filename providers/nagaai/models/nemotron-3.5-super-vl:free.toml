# Reasoning: no controls. The catalog lists no reasoning_effort for this ID, so NagaAI drops the field and the model reasons by its default.
schema = 2
base_model = "nvidia/nemotron-3.5-super-vl-120b-a12b"
name = "Nemotron 3.5 Super VL 120B A12B (free)"

[capabilities]
reasoning = { supported = true }
structured_output = true

[limit]
context = 1_000_000

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[api.responses]

[api.chat-completions]
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0

[cost.text.output]
price = 0
