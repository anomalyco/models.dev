# Reasoning controls: from providers/vercel for the same base model, on NagaAI's effort scale.
schema = 2
base_model = "alibaba/qwen3.8-max-preview"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "xhigh"] }

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[api.responses]

[api.chat-completions]
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 1
cache = { read = 0.125 }

[cost.text.output]
price = 3
