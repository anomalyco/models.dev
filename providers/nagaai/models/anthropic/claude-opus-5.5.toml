# Catalog: GET https://api.naga.ac/v1/models (2026-11-22), id anthropic/claude-opus-5.5: prices, context_window, input_modalities.
# Reasoning controls: from providers/anthropic; NagaAI sends the nearest level the model has (https://docs.naga.ac/guides/reasoning).
# Cache: cache_control, 5m or 1h ttl, at most four breakpoints (https://docs.naga.ac/guides/prompt-caching).
schema = 2
base_model = "anthropic/claude-opus-5-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { explicit = { ttl = ["5m", "1h"], max_breakpoints = 4 } }

[api.responses]

[api.chat-completions]
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 2
cache = { read = 0.1, write = { "5m" = 2.5, "1h" = 4 } }

[cost.text.output]
price = 10
