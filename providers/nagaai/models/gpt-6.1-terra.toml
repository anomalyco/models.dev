# Reasoning controls: from providers/openrouter for the same base model, on NagaAI's effort scale.
# tools.freeform on [api.responses] only, "text" only: NagaAI's Responses API takes custom tools and returns custom_tool_call items, but passes a lark or regex grammar to the model in the tool description instead of enforcing it. Chat Completions drops custom tools.
schema = 2
base_model = "openai/gpt-6.1-terra"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[api.responses]
capabilities = { tools = { freeform = ["text"] } }

[api.chat-completions]
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.25
cache = { read = 0.0125 }

[cost.text.output]
price = 1.25
