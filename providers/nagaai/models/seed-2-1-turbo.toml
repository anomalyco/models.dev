# Toggle: reasoning.effort (Responses) or reasoning_effort (Chat Completions) = "none" turns reasoning off; any other level turns it on.
# Reasoning controls: from providers/openrouter for the same base model, on NagaAI's effort scale.
schema = 2
base_model = "bytedance-seed/seed-2.1-turbo"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
context = 262_144

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/tiff", "image/x-icon", "image/x-icns", "image/sgi", "image/jp2", "image/heic"]
output = ["text"]

[api.responses]

[api.chat-completions]
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.25

[cost.text.output]
price = 1.25
