# Catalog: GET https://api.naga.ac/v1/models (2026-11-23), id z-ai/glm-5.3-flash: prices, context_window, input_modalities.
# Reasoning controls: from providers/zhipuai; NagaAI sends the nearest level the model has (https://docs.naga.ac/guides/reasoning).
# Prices are the catalog's `price` (the route NagaAI picks by default); `max_price` caps a request served by another route:
#   input_token 0.075, output_token 0.25 USD per 1M.
# Catalog `precision`: fp4.
# Cache: billed at cached_input_token when the serving provider caches the prefix by itself (https://docs.naga.ac/guides/prompt-caching).
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 1_048_576

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[api.responses]

[api.chat-completions]
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible" }
compatibility = { reasoning_field = "reasoning_details" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.01995
cache = { read = 0.015 }

[cost.text.output]
price = 0.0392
