# Catalog: GET https://api.naga.ac/v1/models (2026-11-22), id openai/gpt-6-astra: prices, context_window, input_modalities.
# Reasoning controls: from providers/openai; NagaAI sends the nearest level the model has (https://docs.naga.ac/guides/reasoning).
# Prices are the catalog's `price` (the route NagaAI picks by default); `max_price` caps a request served by another route:
#   input_token 5, cached_input_token 0.5, output_token 25 USD per 1M.
# tools.freeform left out: NagaAI does not document custom (freeform) tools.
# Cache: automatic, and cache_control becomes OpenAI's own breakpoint on GPT-5.6 and later (https://docs.naga.ac/guides/prompt-caching).
schema = 2
base_model = "openai/gpt-6-astra"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true, explicit = true }

[api.responses]

[api.chat-completions]
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 2.5
cache = { read = 0.25, write = 3.125 }

[cost.text.output]
price = 12.5
