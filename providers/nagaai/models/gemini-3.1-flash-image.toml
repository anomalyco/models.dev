# Reasoning controls: from providers/openrouter for the same base model, on NagaAI's effort scale.
schema = 2
base_model = "google/gemini-3.1-flash-image"

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "high"] }
structured_output = true

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "application/pdf"]
output = ["text", "image/png", "image/jpeg"]

[api.responses]

[api.chat-completions]
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.25

[cost.text.output]
price = 1.5
