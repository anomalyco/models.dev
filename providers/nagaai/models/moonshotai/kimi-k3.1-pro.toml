# Catalog: GET https://api.naga.ac/v1/models (2026-11-23), id moonshotai/kimi-k3.1-pro: prices, context_window, input_modalities.
# Reasoning controls: from providers/moonshotai (always thinks, no off level); NagaAI sends the nearest level the model has (https://docs.naga.ac/guides/reasoning).
# Prices are the catalog's `price` (the route NagaAI picks by default); `max_price` caps a request served by another route:
#   input_token 1, cached_input_token 0.1, output_token 5 USD per 1M.
# Catalog `precision`: nvfp4.
# Cache: billed at cached_input_token when the serving provider caches the prefix by itself (https://docs.naga.ac/guides/prompt-caching).
schema = 2
base_model = "moonshotai/kimi-k3.1-pro"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[api.responses]

[api.chat-completions]
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible" }
compatibility = { reasoning_field = "reasoning_details" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.1265
cache = { read = 0.09 }

[cost.text.output]
price = 4.4
