# Reasoning controls: from providers/openrouter for the same base model, on NagaAI's effort scale.
# Deprecated: the catalog sets deprecates_at = 2027-07-13; after it the API answers 410.
schema = 2
base_model = "openai/gpt-5.2-codex"
status = "deprecated"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[api.responses]

[api.chat-completions]
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.875
cache = { read = 0.0875 }

[cost.text.output]
price = 7
