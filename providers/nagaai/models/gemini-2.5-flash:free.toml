# Toggle: reasoning.effort (Responses) or reasoning_effort (Chat Completions) = "none" turns reasoning off; any other level turns it on.
# Reasoning controls: from providers/openrouter for the same base model, on NagaAI's effort scale.
# Deprecated: the catalog sets deprecates_at = 2026-12-01; after it the API answers 410.
schema = 2
base_model = "google/gemini-2.5-flash"
name = "Gemini 2.5 Flash (free)"
status = "deprecated"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "audio/wav", "audio/mp3", "audio/aiff", "audio/aac", "audio/ogg", "audio/flac", "audio/mpeg", "audio/m4a", "audio/l16", "audio/opus", "audio/alaw", "audio/mulaw", "audio/webm", "application/pdf"]
output = ["text"]

[api.responses]

[api.chat-completions]
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0

[cost.text.output]
price = 0
