# Toggle: reasoning.effort (Responses) or reasoning_effort (Chat Completions) = "none" turns reasoning off; any other level turns it on.
# Reasoning controls: from providers/openrouter for the same base model, on NagaAI's effort scale.
schema = 2
base_model = "inclusionai/ling-3.1-flash"

[capabilities]
reasoning = { supported = true, toggle = true }

[api.responses]

[api.chat-completions]
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.0375
cache = { read = 0.0075 }

[cost.text.output]
price = 0.1125
