# Also aliased as deepseek-chat and deepseek-reasoner; aliases are not modes.
# Effort controls a derived budget and "off" requests non-thinking output.
# https://docs.auriko.ai/guides/extensions-and-thinking
schema = 2
base_model = "deepseek/deepseek-v4-flash"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.14
cache = { read = 0.0028 }

[cost.text.output]
price = 0.28
