# Auriko's schema accepts these levels and "off", but the provider support table
# does not yet document an Opus 4.7-specific translation.
# https://docs.auriko.ai/guides/extensions-and-thinking
schema = 2
base_model = "anthropic/claude-opus-4-7"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 5
cache = { read = 0.5, write = 6.25 }

[cost.text.output]
price = 25

[[cost.multipliers]]
when = { service_tier = { equals = "fast" } }
factor = 6

[experimental.modes.fast]
body = { speed = "fast" }
headers = { anthropic-beta = "fast-mode-2026-02-01" }
