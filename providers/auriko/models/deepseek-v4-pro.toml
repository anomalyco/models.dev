# Auriko derives a provider thinking budget from effort; "off" disables it.
# https://docs.auriko.ai/guides/extensions-and-thinking
schema = 2
base_model = "deepseek/deepseek-v4-pro"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.435
cache = { read = 0.003625 }

[cost.text.output]
price = 0.87
