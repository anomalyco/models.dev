# Toggle: chat_template_kwargs.enable_thinking = true|false
# Source: https://huggingface.co/Qwen/Qwen3.5-27B (chat template exposes enable_thinking)
# Verified live 2026-11-09 on Chutes' backend via OpenRouter pinned to Chutes (provider.only = ["chutes"]): reasoning on returned reasoning (477 reasoning tokens), off returned none (0 reasoning tokens)
# Mid-conversation: Chutes serves this model on POST https://llm.chutes.ai/v1/chat/completions; reasoning and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://llm.chutes.ai/v1/models
# Input MIME types: the lab's image list; Chutes' catalog reports image input without formats and no video (https://llm.chutes.ai/v1/models).
# Output limit: Chutes' catalog reports max_output_length 262144 (https://llm.chutes.ai/v1/models).
schema = 2
base_model = "alibaba/qwen3.5-27b"
name = "Qwen3.5 27B TEE"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
output = 262_144

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.2
cache = { read = 0.02 }

[cost.text.output]
price = 1.75
