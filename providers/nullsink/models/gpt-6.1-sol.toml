# Pricing (USD/MTok): https://nullsink.is/v1/models
# Native OpenAI Responses route, Standard service tier: https://nullsink.is/api/
# Effort: reasoning.effort = low|medium|high|xhigh|max; reasoning cannot be disabled.
# Controls: https://developers.openai.com/api/docs/guides/latest-model?model=gpt-6.1-sol
# Long-context rates apply above 272,000 total input tokens.
base_model = "openai/gpt-6.1-sol"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 2
output = 10
cache_read = 0.1
cache_write = 2.5

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 4
output = 15
cache_read = 0.2
cache_write = 5

[provider]
npm = "@ai-sdk/openai"
shape = "responses"
