# Pricing (USD/MTok): https://nullsink.is/v1/models
# Native Anthropic Messages route: https://nullsink.is/api/
# Effort: output_config.effort = low|medium|high|xhigh|max.
# thinking.type accepts adaptive or between_tools; disabled is rejected.
# between_tools still returns thinking between tools and requires low, medium, or high effort.
# Controls: https://platform.claude.com/docs/en/models/sonnet-5-5/migration-guide
# cache_write is the standard 5-minute rate; optional 1-hour cache writes cost $4/MTok.
base_model = "anthropic/claude-sonnet-5-5"
structured_output = true
interleaved = true
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 2
output = 10
cache_read = 0.2
cache_write = 2.5

[provider]
npm = "@ai-sdk/anthropic"
