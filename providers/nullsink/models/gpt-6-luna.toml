# Pricing (USD/MTok): https://nullsink.is/v1/models
# Native OpenAI Responses route, Standard service tier: https://nullsink.is/api/
# Effort: reasoning.effort = none|low|medium|high|xhigh|max; none disables reasoning.
# Controls: https://developers.openai.com/api/docs/guides/latest-model?model=gpt-6-luna
# Long-context rates apply above 272,000 total input tokens.
base_model = "openai/gpt-6-luna"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 0.1
output = 0.5
cache_read = 0.01
cache_write = 0.125

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 0.2
output = 0.75
cache_read = 0.02
cache_write = 0.25

[provider]
npm = "@ai-sdk/openai"
shape = "responses"
