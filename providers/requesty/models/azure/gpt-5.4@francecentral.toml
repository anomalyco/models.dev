name = "GPT 5.4"
description = "GPT 5.4 is OpenAI's frontier model designed for complex professional workloads, with strong reasoning, high reliability, and improved token efficiency on hard tasks. It features a 1M+ token context window (922K input, 128K output) with support for text and image inputs, enabling large scale reasoning, coding, and multimodal workflows within a single system."
family = "gpt"
release_date = "2026-03-05"
last_updated = "2026-03-05"
attachment = true
reasoning = true
temperature = true
tool_call = true
structured_output = true
open_weights = false

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "max"]

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 2.5
output = 15
cache_read = 0.25

[limit]
context = 1_050_000
output = 128_000

[modalities]
input = ["text", "image"]
output = ["text"]
