# Identity (https://router.requesty.ai/v1/models/managed (accessed 2026-10-20)): hugging_face_id nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-FP8 (model_lab nvidia, open_weights true);
#   context_window 262,144 = lab; created 2026-03-11 = lab release_date. max_output_tokens 0 (unknown), so the lab's limit applies.
# system_updates = true: supports_system_mid_conversation on https://router.requesty.ai/v1/models/managed
# effort_updates = false, tools.updates = false: Chat Completions takes reasoning_effort per request and has no tool-change message (https://docs.requesty.ai/features/reasoning)
schema = 2
base_model = "nvidia/nemotron-3-super-120b-a12b"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"] }
structured_output = true
system_updates = true
effort_updates = false

[cost.text.input]
price = 0.1

[cost.text.output]
price = 0.5
