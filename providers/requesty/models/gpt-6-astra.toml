# system_updates = true: supports_system_mid_conversation on https://router.requesty.ai/v1/models/managed
# effort_updates = false, tools.updates = false: Chat Completions takes reasoning_effort per request and has no tool-change message (https://docs.requesty.ai/features/reasoning)
schema = 2
base_model = "openai/gpt-6-astra"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"] }
structured_output = true
system_updates = true
effort_updates = false

[cost.text.input]
price = 10
cache = { read = 1, write = 12.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 20
cache = { read = 2, write = 25 }

[cost.text.output]
price = 50

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 75
