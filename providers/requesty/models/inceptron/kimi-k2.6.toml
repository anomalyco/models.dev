name = "Kimi K2.6"
description = "Kimi K2.6 is Moonshot AI's latest open weight reasoning model, built for long horizon coding, agentic execution, and multimodal reasoning. It retains the trillion parameter MoE architecture with roughly 32B active parameters and a 256k token context window, while improving agentic benchmark performance and knowledge reliability over K2.5. Native text, image, and video input plus tool driven workflows make it well suited for coding, research, and complex multi step tasks."
family = "kimi-k2"
release_date = "2026-04-29"
last_updated = "2026-04-29"
attachment = true
reasoning = true
temperature = true
tool_call = true
structured_output = true
open_weights = false

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "max"]

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 0.8
output = 3.5
cache_read = 0.2

[limit]
context = 262_144
output = 262_144

[modalities]
input = ["text", "image"]
output = ["text"]
