name = "Kimi K2.7 Code"
description = "Kimi K2.7 Code is a coding-focused agentic model built on Kimi K2.6, tuned for long-horizon software engineering workflows, multi-step tool use, and end-to-end task completion. It keeps the trillion-parameter MoE architecture with roughly 32B active parameters, a 256K-token context window, native INT4 quantization, and multimodal image and video input support while reducing thinking-token usage compared with K2.6."
family = "kimi-k2"
release_date = "2026-06-23"
last_updated = "2026-06-23"
attachment = true
reasoning = true
temperature = true
tool_call = true
structured_output = false
open_weights = false

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "max"]

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 0.75
output = 3.5
cache_read = 0.2

[limit]
context = 256_000
output = 256_000

[modalities]
input = ["text", "image"]
output = ["text"]
