base_model = "nvidia/nemotron-3-ultra-550b-a55b"
description = "NVIDIA Nemotron 3 Ultra is an open frontier reasoning and orchestration model with 55B active parameters out of 550B total (hybrid Transformer-Mamba MoE). Text input/output with up to 1M context, built for long-running agentic workflows: agent orchestration, coding agents, deep research, and complex enterprise tasks. Strong at multi-step reasoning and planning with high-throughput inference. Part of the NVIDIA Nemotron family."
structured_output = false

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "max"]

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 0
output = 0

[limit]
context = 1_048_576
output = 65_536
