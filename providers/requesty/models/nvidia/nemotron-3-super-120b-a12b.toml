base_model = "nvidia/nemotron-3-super-120b-a12b"
description = "NVIDIA Nemotron 3 Super is a 120B-parameter open hybrid Mamba-Transformer MoE model activating just 12B parameters, with multi-token prediction for high throughput. 1M token context for long-horizon agent coherence, cross-document reasoning, and multi-step planning. Strong on AIME 2025, TerminalBench, and SWE-Bench Verified. Part of the NVIDIA Nemotron family."
structured_output = false

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "max"]

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 0
output = 0

[limit]
context = 1_048_576
output = 65_536
