schema = 2
base_model = "openai/gpt-5.5"
name = "GPT-5.5 (US)"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"] }
structured_output = true
system_updates = true

[cost.text.input]
price = 5
cache = { read = 0.5, write = 5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 10
cache = { read = 1, write = 10 }

[cost.text.output]
price = 30

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 45
