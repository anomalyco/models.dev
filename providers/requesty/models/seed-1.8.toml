# Identity (https://router.requesty.ai/v1/models/managed (accessed 2026-10-20)): description "Optimized specifically for multimodal agent scenarios" matches ByteDance's Seed 1.8 (Doubao-Seed-1.8,
#   https://www.volcengine.com/docs/82379/1330310); context_window 256,000 = lab; supports_vision true = lab image input.
#   Requesty's created date (2026-05-27) is its listing date; Seed 1.8 shipped 2025-12-28 (lab).
# Output: Requesty reports max_output_tokens = 0 (unknown), so the lab's 64,000 applies (ByteDance: 64K max output,
#   https://www.volcengine.com/docs/82379/1330310). The earlier 256,000 was the sync's context-window fallback, not a Requesty value.
# system_updates = true: supports_system_mid_conversation on https://router.requesty.ai/v1/models/managed
# effort_updates = false, tools.updates = false: Chat Completions takes reasoning_effort per request and has no tool-change message (https://docs.requesty.ai/features/reasoning)
schema = 2
base_model = "bytedance-seed/seed-1-8"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"] }
structured_output = false
system_updates = true
effort_updates = false

[cost.text.input]
price = 0.25
cache = { read = 0.05 }

[cost.text.output]
price = 2
