# Identity: hugging_face_id thinkingmachines/Inkling on https://router.requesty.ai/v1/models/managed (accessed 2026-10-20), the same
#   weights as Requesty's inkling route. This route serves a 262,144-token context (lab 1,048,576) with max_output_tokens 32,768.
#   Modalities come from the lab (text, PNG, JPEG, WAV). Requesty doesn't document an input-format restriction for this route.
# system_updates = true: supports_system_mid_conversation on https://router.requesty.ai/v1/models/managed
# effort_updates = false, tools.updates = false: Chat Completions takes reasoning_effort per request and has no tool-change message (https://docs.requesty.ai/features/reasoning)
schema = 2
base_model = "thinkingmachines/inkling"
name = "Inkling 256K"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"] }
structured_output = false
system_updates = true
effort_updates = false

[limit]
context = 262_144
output = 32_768

[cost.text.input]
price = 1.87
cache = { read = 0.374 }

[cost.text.output]
price = 4.68
