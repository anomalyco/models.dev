base_model = "google/gemini-2.5-flash-lite"
description = "Google's smallest and most cost effective model, built for at scale usage."

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "max"]

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 0.1
output = 0.4
cache_read = 0.01
cache_write = 0.18333

[limit]
output = 65_535

[modalities]
input = ["text", "image"]
