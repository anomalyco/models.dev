base_model = "google/gemini-2.5-flash-image"
description = "Google's first hybrid reasoning model which supports a 1M token context window and has thinking budgets. Most balanced Gemini model, optimized for low latency use cases."
tool_call = true
structured_output = false

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "max"]

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 0.3
output = 2.5
cache_read = 0.3
cache_write = 2.5

[limit]
context = 1_048_576
output = 65_535
