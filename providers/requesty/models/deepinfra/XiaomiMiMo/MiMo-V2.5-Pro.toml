name = "MiMo V2.5 Pro"
description = "MiMo-V2.5-Pro is an open-source Mixture-of-Experts (MoE) language model with 1.02T total parameters and 42B active parameters. It utilizes the hybrid attention architecture and 3-layers Multi-Token Prediction (MTP) introduced in [MiMo-V2-Flash](https://github.com/XiaomiMiMo/MiMo-V2-Flash)."
family = "mimo-v2.5-pro"
release_date = "2026-05-27"
last_updated = "2026-05-27"
attachment = false
reasoning = true
temperature = true
tool_call = true
structured_output = true
open_weights = false

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "max"]

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 1
output = 3
cache_read = 0.2

[limit]
context = 1_048_576
output = 1_048_576

[modalities]
input = ["text"]
output = ["text"]
