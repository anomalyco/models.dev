# Identity: Requesty describes this route as "Grok 4.20 Beta" (https://router.requesty.ai/v1/models/managed, accessed 2026-10-20, supports_reasoning true),
#   and xAI's GET https://api.x.ai/v1/language-models lists grok-4.20-beta as an alias of grok-4.20-0309-reasoning.
# Host delta: context_window 2,000,000 (lab 1,000,000). max_output_tokens is 0 (unknown), so the lab's output applies.
# Input formats come from the lab: xAI image understanding accepts jpg/jpeg or png (https://docs.x.ai/developers/model-capabilities/images/understanding).
# system_updates = true: supports_system_mid_conversation on https://router.requesty.ai/v1/models/managed
# effort_updates = false, tools.updates = false: Chat Completions takes reasoning_effort per request and has no tool-change message (https://docs.requesty.ai/features/reasoning)
schema = 2
base_model = "xai/grok-4.20-0309-reasoning"

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
structured_output = true
system_updates = true

[limit]
context = 2_000_000

[cost.text.input]
price = 2
cache = { read = 0.2, write = 2 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 4
cache = { read = 0.4, write = 4 }

[cost.text.output]
price = 6

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 12
