base_model = "thinkingmachines/inkling"
description = "Inkling is a large MoE hybrid reasoning model from Thinking Machines with audio and vision input support and a 64K context window."
structured_output = false

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "max"]

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 1.87
output = 4.68
cache_read = 0.374

[limit]
context = 65_536
output = 32_768

[modalities]
input = ["text", "image"]
