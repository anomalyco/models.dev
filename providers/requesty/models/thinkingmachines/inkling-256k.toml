name = "Inkling 256k"
description = "Inkling 256K is the extended context variant of Inkling, a large MoE hybrid reasoning model from Thinking Machines with audio and vision input support and a 256K context window."
release_date = "2026-07-16"
last_updated = "2026-07-16"
attachment = true
reasoning = true
temperature = true
tool_call = true
structured_output = false
open_weights = false

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "max"]

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 1.87
output = 4.68
cache_read = 0.374

[limit]
context = 262_144
output = 32_768

[modalities]
input = ["text", "image"]
output = ["text"]
