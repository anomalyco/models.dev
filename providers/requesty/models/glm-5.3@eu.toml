# Effort: reasoning_effort = low|high|max, matching GLM-5.3's native controls.
# Thinking is always enabled. Requesty's generic budget conversions document
# other model families, not a GLM-5.3 reasoning-token budget.
# https://docs.z.ai/guides/llm/glm-5.3
# https://docs.requesty.ai/features/reasoning
base_model = "zhipuai/glm-5.3"
name = "GLM-5.3 (EU)"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 1.75
output = 4.5
cache_read = 0.44

[limit]
context = 1_048_576
output = 1_048_576
