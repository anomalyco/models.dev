name = "GLM 5"
description = "GLM vision model for visual reasoning, documents, and multimodal agents"
family = "glm"
release_date = "2026-02-11"
last_updated = "2026-02-11"
attachment = true
reasoning = true
temperature = true
tool_call = true
structured_output = false
open_weights = false

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "max"]

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 1
output = 3.2
cache_read = 0.2

[limit]
context = 200_000
output = 128_000

[modalities]
input = ["text", "image"]
output = ["text"]
