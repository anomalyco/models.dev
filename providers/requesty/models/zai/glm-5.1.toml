base_model = "zhipuai/glm-5.1"
description = "Compared with GLM-5, GLM-5.1 delivers significant improvements in coding, agentic tool usage, reasoning, role-play, and general chat quality. Besides, GLM-5.1 has outstanding capabilities in long-horizon agentic tasks like CUDA kernel optimization."
attachment = true
structured_output = false

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "max"]

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 1.4
output = 4.4
cache_read = 0.26

[limit]
output = 128_000

[modalities]
input = ["text", "image"]
