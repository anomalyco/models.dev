base_model = "zhipuai/glm-5.2"
description = "GLM-5.2 is the latest model in Z.ai's GLM series, continuing the line's focus on coding and long-horizon agentic tasks. Like GLM-5.1, it is designed to plan, execute, and iterate autonomously on extended, engineering-grade tasks."
attachment = true
structured_output = false

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "max"]

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 1.4
output = 4.4
cache_read = 0.26

[limit]
output = 128_000

[modalities]
input = ["text", "image"]
