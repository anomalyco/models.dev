name = "Deepseek V4 Pro"
description = "DeepSeek V4 Pro is a large scale Mixture of Experts model from DeepSeek with 1.6T total parameters and 49B activated parameters, supporting a 1M token context window. It is built for advanced reasoning, coding, and long horizon agent workflows, with strong performance across knowledge, math, and software engineering benchmarks. Built on the same architecture as DeepSeek V4 Flash, it adds a hybrid attention system for efficient long context processing. Reasoning efforts high and xhigh are supported, with xhigh mapping to max reasoning. It is well suited for complex workloads such as full codebase analysis, multi step automation, and large scale information synthesis, where both capability and efficiency are critical."
family = "deepseek"
release_date = "2026-07-15"
last_updated = "2026-07-15"
attachment = false
reasoning = true
temperature = true
tool_call = true
structured_output = true
open_weights = false

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "max"]

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 1.75
output = 3.5
cache_read = 0.44

[limit]
context = 1_048_576
output = 1_048_576

[modalities]
input = ["text"]
output = ["text"]
