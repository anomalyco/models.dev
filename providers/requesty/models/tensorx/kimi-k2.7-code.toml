name = "Kimi K2.7 Code"
description = "Kimi K2.7 Code is a coding focused model in Moonshot AI Kimi K2 family, built to complete end to end programming tasks reliably over long contexts. It uses a native multimodal mixture of experts architecture that accepts text and image input, and it always operates in a thinking mode, preserving full reasoning content across multi turn conversations. With a 256K token context window, it targets long horizon coding, agentic task decomposition, and multi turn dialogue. The model activates 32B parameters out of roughly 1T total."
family = "kimi-k2"
release_date = "2026-07-15"
last_updated = "2026-07-15"
attachment = true
reasoning = true
temperature = true
tool_call = true
structured_output = true
open_weights = false

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "max"]

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 1.25
output = 4.5
cache_read = 0.31

[limit]
context = 262_144
output = 262_144

[modalities]
input = ["text", "image"]
output = ["text"]
