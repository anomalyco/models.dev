name = "Minimax M3"
description = "MiniMax multimodal coding model for long-context reasoning and agent tasks"
family = "minimax-m3"
release_date = "2026-07-15"
last_updated = "2026-07-15"
attachment = true
reasoning = true
temperature = true
tool_call = true
structured_output = true
open_weights = false

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "max"]

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 0.4
output = 2
cache_read = 0.1

[limit]
context = 1_048_576
output = 1_048_576

[modalities]
input = ["text", "image"]
output = ["text"]
