name = "GPT 5.1"
description = "GPT-5.1 is our flagship model for coding and agentic tasks with configurable reasoning and non-reasoning effort."
family = "gpt"
release_date = "2026-02-20"
last_updated = "2026-02-20"
attachment = true
reasoning = true
temperature = true
tool_call = true
structured_output = true
open_weights = false

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "max"]

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 1.25
output = 10
cache_read = 0.125

[limit]
context = 400_000
output = 128_000

[modalities]
input = ["text", "image"]
output = ["text"]
