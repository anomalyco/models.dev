# system_updates = false: supports_system_mid_conversation on https://router.requesty.ai/v1/models/managed
# effort_updates = false, tools.updates = false: Chat Completions takes reasoning_effort per request and has no tool-change message (https://docs.requesty.ai/features/reasoning)
schema = 2
base_model = "anthropic/claude-sonnet-4-5"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = false }
structured_output = true
system_updates = false
effort_updates = false

[limit]
context = 1_000_000

[cost.text.input]
price = 3
cache = { read = 0.3, write = 3.75 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 6
cache = { read = 0.6, write = 7.5 }

[cost.text.output]
price = 15

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 22.5
