name = "Deepseek V4 Pro"
description = "DeepSeek V4 Pro is a flagship open source Mixture of Experts model designed for frontier reasoning, advanced coding, and long context intelligence at scale (up to 1M tokens). It introduces a hybrid attention architecture that dramatically improves long context efficiency while reducing KV and compute overhead, along with stability and training enhancements for deep multi step reasoning. It represents a top tier open source system for complex agentic workflows, high precision reasoning, and demanding production workloads."
