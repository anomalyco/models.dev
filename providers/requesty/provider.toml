name = "Requesty"
env = ["REQUESTY_API_KEY"]
npm = "@ai-sdk/openai-compatible"
api = "https://router.requesty.ai/v1"
# Reasoning HTTP format (https://docs.requesty.ai/features/reasoning, 2026-07-27):
# POST /v1/chat/completions accepts top-level reasoning_effort as an effort string
# (none|min|low|medium|high|max|xhigh) or a decimal budget string.
# OpenAI: low|medium|high|xhigh pass through; max -> high; none|min -> low;
#   budgets 0..1024 / 1025..8192 / >=8193 map low/medium/high.
# Anthropic: none|min|low -> 1024, medium -> 8192, high -> 16384, max -> max_out-1;
#   budget strings pass through (capped to max output). none does not fully disable.
# Gemini/Vertex: none|min -> 0 (Flash) or 128 (Pro), low -> 1024, medium -> 8192,
#   high -> 24576, max -> max output; budget strings pass through.
# DeepSeek: reasoning is automatic; no request field required.
# Other labs: no verified Requesty-side control documented -> reasoning_options = [].
doc = "https://requesty.ai/solution/llm-routing/models"
