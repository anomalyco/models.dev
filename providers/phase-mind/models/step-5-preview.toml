# Step 5 Preview. Price and limits: https://ai.phase.xyz/v1/models (accessed 2026-11-02).
# Effort: reasoning_effort = low|medium|high (forwarded to DeepInfra).
schema = 2
base_model = "stepfun/step-5-preview"
status = "beta"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[cost.text.input]
price = 1.04

[cost.text.output]
price = 2.808

[limit]
context = 1_048_576
output = 65_536
