# Effort: reasoning_effort = none|low|high|max (verified live 2026-11-07: "none" disables
# reasoning; the API accepts unknown values without error and ignores them, so this list
# follows the lab baseline rather than probing)
# Output limit: is capped to aki.io supported limit for this model
# Modalities: Currently aki.io supports maximum of 2 input images for this model, we advise 
# to keep the input limited to text (2026-11-19)
# Prices: GET /api/models (checked 2026-11-17) list EUR per 1M tokens (net); converted
# to USD at the ECB reference rate of 1.0989 USD/EUR (2026-11-17).
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 1_048_576
output = 81_920

[cost.text.input]
price = 0.274725
cache = { read = 0.10989 }

[cost.text.output]
price = 1.0989
