# attachment are not supported on AKI.IO for security reasons and therefore are disabled
# Prices: https://aki.io/#pricing lists EUR per 1M tokens (net); converted to USD at the ECB
# reference rate of 1.1215 USD/EUR (2026-10-20). They were stored as unconverted EUR values.
# Output limit: aki.io documents no output cap, so output is capped at the context served here (the lab's raised cap would exceed it).
schema = 2
base_model = "openai/gpt-oss-120b"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
context = 128_000
output = 128_000

[cost.text.input]
price = 0.168225

[cost.text.output]
price = 0.616825
