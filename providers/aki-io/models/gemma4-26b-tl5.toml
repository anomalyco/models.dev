# attachment are not supported on AKI.IO for security reasons and therefore are disabled
# modalities image/jpeg and image/png input are now supported. Vision capability is listed 
# at aki.io model catalog at https://aki.io/models (2026-11-17).
# AKI.IO uses reasoning_effort = none to disable reasoning
# Output limit: is capped to aki.io supported limit for this model
# Prices: GET /openai/v1/models (checked 2026-11-17) list EUR per 1M tokens (net); converted
# to USD at the ECB reference rate of 1.0989 USD/EUR (2026-11-17).
schema = 2
base_model = "google/gemma-4-26b-a4b-it"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = true

[limit]
output = 32_768

[cost.text.input]
price = 0.10989

[cost.text.output]
price = 0.54945
