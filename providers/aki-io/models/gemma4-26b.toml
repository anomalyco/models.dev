# attachment are not supported on AKI.IO for security reasons and therefore are disabled
# AKI.IO uses the reasoning_option 'none' to disable reasoning
# Prices: https://aki.io/#pricing lists EUR per 1M tokens (net); converted to USD at the ECB
# reference rate of 1.1215 USD/EUR (2026-10-20). They were stored as unconverted EUR values.
schema = 2
base_model = "google/gemma-4-26b-a4b-it"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = true

[limit]
context = 256_000
output = 32_768

[cost.text.input]
price = 0.11215

[cost.text.output]
price = 0.56075
