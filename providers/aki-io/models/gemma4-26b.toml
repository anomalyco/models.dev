name = "gemma4-26b" # AKI.IO uses a different model name as identifier for openai chat_completions api
base_model = "google/gemma-4-26b-a4b-it"
attachment = false # not supported on AKI.IO
reasoning = true
reasoning_options = [{ type = "effort", values = ["none", "high"] }]

[cost]
input = 0.10
output = 0.50

[limit]
context = 256_000
output = 32_768
