# AKI.IO uses a different model name as identifier for openai chat_completions api
# attachment are not supported on AKI.IO for security reasons and therefore are disabled
name = "mistral4-119b"
base_model = "mistral/mistral-small-2603"
attachment = false
reasoning = true
reasoning_options = [{ type = "effort", values = ["none", "high"] }]

[cost]
input = 0.20
output = 0.60

[limit]
context = 262_144
output = 81_920

[modalities]
input = ["text", "image"]
