# attachment are not supported on AKI.IO for security reasons and therefore are disabled
# AKI.IO uses reasoning_effort = none to disable reasoning
# Prices: GET /openai/v1/models (checked 2026-11-17) list EUR per 1M tokens (net); converted
# to USD at the ECB reference rate of 1.0989 USD/EUR (2026-11-17).
schema = 2
base_model = "mistral/mistral-small-2603"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "high"] }

[limit]
context = 262_144
output = 81_920

[cost.text.input]
price = 0.21978

[cost.text.output]
price = 0.65934
