# Prices: GET /openai/v1/models (checked 2026-11-17) list EUR per 1M tokens (net); converted
# to USD at the ECB reference rate of 1.0989 USD/EUR (2026-11-17).
# Output limit: aki.io documents no output cap, so output is capped at the context served here (the lab's raised cap would exceed it).
schema = 2
base_model = "openai/gpt-oss-120b"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
context = 128_000
output = 128_000

[cost.text.input]
price = 0.164835

[cost.text.output]
price = 0.604395
