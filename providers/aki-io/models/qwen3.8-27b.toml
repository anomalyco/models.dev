# attachment are not supported on AKI.IO for security reasons and therefore are disabled
# AKI.IO uses reasoning_effort = none to disable reasoning
# Prices: https://aki.io/#pricing and GET /openai/v1/models (checked 2026-11-07) list EUR per
# 1M tokens (net): 0.15 input, 0.075 cache read, 0.65 output. Converted to USD at the ECB
# reference rate of 1.1165 USD/EUR (2026-11-06). Replaces the 2026-10-20 conversion of the
# then-listed 2.20 EUR output price and 0.10 EUR cache read.
schema = 2
base_model = "alibaba/qwen3.8-27b"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "xhigh"] }
structured_output = true

[cost.text.input]
price = 0.167475
cache = { read = 0.0837375 }

[cost.text.output]
price = 0.725725
