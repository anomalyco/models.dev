# Source: https://www.rightnowai.co/models and GET https://api.rightnowai.co/v1/models (id glm-5-3).
# Pricing: USD per million tokens, standing rates; cache read is the cached input price.
# Probed on https://api.rightnowai.co/v1 on 2026-11-26 with this id: a chat completion, a tool call (tool_choice
# auto), a strict json_schema response and a repeated ~5.6k-token prompt that reported cached tokens.
# Reasoning cannot be disabled on GLM 5.3. The served vocabulary is low, high and max, max by default, as GET
# /v1/models publishes it (reasoning_efforts) and Z.ai documents (https://docs.z.ai/guides/llm/glm-5.3). Reasoning
# is returned in reasoning_content.
# context is this deployment's window; output is the max_tokens the provider feed advertises for this model.
schema = 2
base_model = "zhipuai/glm-5.3"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 1_048_576
output = 65_536

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.3
cache = { read = 0.13 }

[cost.text.output]
price = 4.2
