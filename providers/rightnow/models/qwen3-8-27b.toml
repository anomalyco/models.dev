# Source: https://www.rightnowai.co/models and GET https://api.rightnowai.co/v1/models (id qwen3-8-27b).
# Pricing: USD per million tokens, standing rates; cache read is the cached input price.
# Probed on https://api.rightnowai.co/v1 on 2026-11-26 with this id: a chat completion, a tool call (tool_choice
# auto), a strict json_schema response and a repeated ~5.6k-token prompt that reported cached tokens.
# Reasoning effort none, low, medium and xhigh, xhigh by default (GET /v1/models, reasoning_efforts). none turns
# reasoning off: three requests with none returned no reasoning, three without it did (2026-11-26). Reasoning is
# returned in reasoning_content.
# Image input: an inline data URL in png, jpeg, webp or gif, each answered on 2026-11-26; bmp and tiff are refused
# with HTTP 400 naming those four.
schema = 2
base_model = "alibaba/qwen3.8-27b"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "xhigh"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.1
cache = { read = 0.01 }

[cost.text.output]
price = 0.4
