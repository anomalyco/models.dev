# Route: REST POST /ai/run with { model, input }; input per GET /ai/catalog/models/{id}/schema. https://developers.cloudflare.com/ai-gateway/usage/rest-api/
# Modalities: the schema's prompt/image fields (the lab's MIME types) and output_format enum, else the lab's outputs. Prices: catalog provider_details, USD, passed through with no markup (https://developers.cloudflare.com/ai-gateway/features/unified-billing/).
# output_tokens is the image output price: Gemini 2.5 Flash Image bills output images as tokens at $30 per 1M (https://ai.google.dev/gemini-api/docs/pricing).
schema = 2
v2_only = true
base_model = "google/gemini-2.5-flash-image"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif"]
output = ["image/jpeg", "image/png", "image/webp"]

[api.workers-ai-run]
base_url = "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai"
sdk = { opencodeai = "none" }

[cost.text.input]
price = 0.3
cache = { read = 0.03, write = 0.083333 }

[cost.image.output]
price = 30
