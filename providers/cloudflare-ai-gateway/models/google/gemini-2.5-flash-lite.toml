# Budget: generationConfig.thinkingConfig.thinkingBudget; 0 disables (toggle-off), -1 is dynamic, manual range 512..24576.

base_model = "google/gemini-2.5-flash-lite"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "budget_tokens"
min = 512
max = 24_576

[cost]
input = 0.1
output = 0.4
cache_read = 0.01

[limit]
context = 1_000_000
