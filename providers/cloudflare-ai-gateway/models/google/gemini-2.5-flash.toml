# Route: REST API POST /ai/v1/chat/completions (https://developers.cloudflare.com/ai-gateway/usage/rest-api/), served by Vertex AI.
# Live 2026-10-20: response_format json_schema is enforced; reasoning_effort none and xhigh are rejected (code 7003). Effort tokens below: two trials, mean, on the same math prompt. Mid-conversation flags not checked.
# Effort: reasoning_effort = minimal|low|medium|high (maps to a thinking budget; 408 / 830 / 6485 / 6009 reasoning tokens).
schema = 2
base_model = "google/gemini-2.5-flash"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true

[limit]
context = 1_000_000

[cost.text.input]
price = 0.3
cache = { read = 0.03 }

[cost.text.output]
price = 2.5
