# Route: REST API POST /ai/v1/chat/completions (https://developers.cloudflare.com/ai-gateway/usage/rest-api/), served by Vertex AI: no per-turn effort or tool-change mechanism.
# Live 2026-10-19 on Gemini 4 Argon: a mid-conversation system message misses the warm cache (hoisted into the system instruction), so system_updates = false; response_format json_schema is enforced.
# Effort: reasoning_effort = low|medium|high|xhigh (maps to Gemini's thinking level; default high; Google's list, not probed on the gateway).
# Sources: https://ai.google.dev/gemini-api/docs/thinking ; https://ai.google.dev/gemini-api/docs/whats-new-gemini-4-neon
# Capabilities the catalog doesn't state (capabilities.cache) come from google/gemini-4-hydrogen, this host's previous model in the family.
schema = 2
base_model = "google/gemini-4-neon"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 1_048_576

[cost.text.input]
price = 3
cache = { read = 0.15 }

[cost.text.output]
price = 15
