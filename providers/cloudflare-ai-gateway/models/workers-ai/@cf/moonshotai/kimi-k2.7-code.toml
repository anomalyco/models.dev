# Raw Workers AI input uses `reasoning_effort = low|medium|high` and
# `chat_template_kwargs.thinking = true|false`.
# https://developers.cloudflare.com/workers-ai/models/kimi-k2.7-code/sync-input.json (accessed 2026-08-03)
base_model = "moonshotai/kimi-k2.7-code"
reasoning_options = [{ type = "toggle" }, { type = "effort", values = ["low", "medium", "high"] }]
temperature = true

[cost]
input = 0.6
output = 3

[modalities]
input = ["text", "image"]
