# Native `/ai/run` accepts `reasoning_effort = low|medium|high` and
# `enable_thinking = true|false`; no budget is documented.
# https://developers.cloudflare.com/workers-ai/models/glm-4.7-flash/sync-input.json

base_model = "zhipuai/glm-4.7-flash"
tool_call = true
structured_output = true

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
input = 0.06
output = 0.4

[limit]
context = 131_072
output = 131_072
