# Context and output limits verified against Cloudflare Workers AI's OpenAI-compatible endpoint.

base_model = "zhipuai/glm-5.2"
tool_call = true

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["high", "max"]

[cost]
input = 1.4
output = 4.4
cache_read = 0.26

[limit]
context = 262_144
output = 256_000
