base_model = "anthropic/claude-sonnet-4-6"
structured_output = true

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "max"]

[[reasoning_options]]
type = "budget_tokens"
min = 1024

[cost]
input = 3
output = 15
cache_read = 0.3
cache_write = 3.75

[limit]
context = 1000000
output = 128000

[provider]
npm = "ai-gateway-provider"
