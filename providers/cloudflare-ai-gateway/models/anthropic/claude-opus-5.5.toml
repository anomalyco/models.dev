# Effort: output_config.effort = low|medium|high|xhigh|max; adaptive thinking cannot be disabled.
# Source: https://platform.claude.com/docs/en/models/opus-5-5/whats-new-opus-5-5#thinking-cant-be-disabled
base_model = "anthropic/claude-opus-5-5"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh", "max"]

[cost]
input = 4
output = 20
cache_read = 0.2
cache_write = 5

[limit]
context = 1_000_000

[provider]
npm = "@ai-sdk/anthropic"
