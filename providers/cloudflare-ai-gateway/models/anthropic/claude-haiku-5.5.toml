# Toggle: thinking.type = adaptive|disabled (disabled accepted at high effort or below; xhigh|max reject it).
# Effort: output_config.effort = low|medium|high|xhigh|max (Anthropic Messages API; adaptive thinking on by default).
# Sources: https://platform.claude.com/docs/en/build-with-claude/effort ; https://platform.claude.com/docs/en/models/haiku-5-5/overview ; https://platform.claude.com/docs/en/models/haiku-5-5/migration-guide
schema = 2
base_model = "anthropic/claude-haiku-5-5"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[limit]
context = 1_000_000

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic" }

[cost.text.input]
price = 0.1
cache = { read = 0.01, write = 0.125 }

[[cost.text.input.overrides]]
when = { context = { gt = 100_000 } }
price = 0.5
cache = { read = 0.05, write = 0.625 }

[cost.text.output]
price = 0.5

[[cost.text.output.overrides]]
when = { context = { gt = 100_000 } }
price = 2.5
