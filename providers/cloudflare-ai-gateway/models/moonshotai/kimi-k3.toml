# API: thinking.type = enabled|disabled|adaptive; in adaptive mode the
# reasoning depth is set by output_config.effort = low|high|max.

base_model = "moonshotai/kimi-k3"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 3
output = 15
cache_read = 0.3

[limit]
context = 1_048_576
