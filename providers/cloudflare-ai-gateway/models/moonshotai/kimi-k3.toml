# Kimi K3 always thinks; thinking.type is not supported. Effort: reasoning_effort = low|high|max.
# Sources: https://platform.kimi.ai/docs/api/models-overview ; https://developers.cloudflare.com/ai/models/moonshotai/kimi-k3/

base_model = "moonshotai/kimi-k3"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 3
output = 15
cache_read = 0.3

[limit]
context = 1_048_576
