# API: reasoning_effort = "max" (only value documented at launch).
# Always-on reasoning; replaces K2.x thinking toggle.
# https://developers.cloudflare.com/ai/models/moonshotai/kimi-k3/ (accessed 2026-07-17)
# Pricing: Cloudflare dashboard only; using official Moonshot rates.
# https://platform.kimi.ai/docs/pricing/chat-k3 (accessed 2026-07-17)
base_model = "moonshotai/kimi-k3"

[[reasoning_options]]
type = "effort"
values = ["max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 3.0
output = 15.0
cache_read = 0.3
