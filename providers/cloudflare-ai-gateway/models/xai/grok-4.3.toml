# Route: REST API POST /ai/v1/chat/completions (https://developers.cloudflare.com/ai-gateway/usage/rest-api/): no per-turn effort or tool-change mechanism.
# Live 2026-10-19: a mid-conversation system message keeps the cached prefix (grok-4.3, in place); response_format json_schema is enforced (grok-4.3, grok-4.20-0309-non-reasoning).
# Effort: reasoning_effort = none|low|medium|high (POST /ai/v1/chat/completions; live 2026-10-19: none -> 0 reasoning tokens, low 4562 vs medium 6602 median).
schema = 2
base_model = "xai/grok-4.3"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
cache = { implicit = true }
structured_output = true
system_updates = true
effort_updates = false

[limit]
context = 1_000_000

[cost.text.input]
price = 1.25
cache = { read = 0.2 }

[cost.text.output]
price = 2.5
