# Route: REST API POST /ai/v1/chat/completions (https://developers.cloudflare.com/ai-gateway/usage/rest-api/): no per-turn effort or tool-change mechanism.
# Live 2026-10-19 (qwen3.7-plus): a mid-conversation system message keeps the cached prefix (in place).
# Per-API flags: for models that also list the REST /ai/v1/responses route, system_updates sits on [api.chat-completions] only; it was checked on Chat Completions and the Responses route has no documented or tested in-place system message.
# Toggle: enable_thinking = true|false (top-level field on POST /ai/v1/chat/completions; live 2026-10-19: false -> no reasoning).
# Effort: reasoning_effort = low|medium|xhigh (default xhigh; high is an alias for xhigh; live 2026-10-19: medium reasons about 2x low).
# Budget: thinking_budget = 0..262144 (cannot be combined with reasoning_effort; live 2026-10-19: 100 -> 100 reasoning tokens).
schema = 2
base_model = "alibaba/qwen3.8-max"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "xhigh"], budget = { min = 0, max = 262_144 } }
cache = { implicit = true }
effort_updates = false

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
capabilities = { system_updates = true }

[api.responses]
base_url = "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/cloudflare-ai-gateway" }

[cost.text.input]
price = 2
cache = { read = 0.25 }

[cost.text.output]
price = 6
