# Route: REST POST /ai/run with { model, input }; input per GET /ai/catalog/models/{id}/schema. https://developers.cloudflare.com/ai-gateway/usage/rest-api/
# Input: the formats the schema's file field documents, else the lab's. Prices: catalog provider_details, USD, passed through with no markup (https://developers.cloudflare.com/ai-gateway/features/unified-billing/).
schema = 2
v2_only = true
base_model = "assemblyai/universal-3-5-pro"

[api.workers-ai-run]
base_url = "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai"

[cost.audio.input]
unit = "minute"
price = 0.0035

[[cost.audio.input.overrides]]
when = { speaker_labels = { equals = true } }
price = 0.0038

[[cost.audio.input.overrides]]
when = { keyterms_prompt = { min_items = 1 } }
price = 0.00433

[[cost.audio.input.overrides]]
when = { domain = { equals = "medical-v1" } }
price = 0.006

[[cost.audio.input.overrides]]
when = { all = [{ speaker_labels = { equals = true } }, { keyterms_prompt = { min_items = 1 } }] }
price = 0.00463

[[cost.audio.input.overrides]]
when = { all = [{ speaker_labels = { equals = true } }, { domain = { equals = "medical-v1" } }] }
price = 0.0063

[[cost.audio.input.overrides]]
when = { all = [{ keyterms_prompt = { min_items = 1 } }, { domain = { equals = "medical-v1" } }] }
price = 0.00683

[[cost.audio.input.overrides]]
when = { all = [{ speaker_labels = { equals = true } }, { keyterms_prompt = { min_items = 1 } }, { domain = { equals = "medical-v1" } }] }
price = 0.00713
