# Effort: reasoning.effort = low|medium|high; Cloudflare rejects xhigh|max, and OpenAI rejects none after forwarding (live verified 2026-09-17).
base_model = "openai/gpt-6-astra"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
input = 10
output = 50
cache_read = 1
cache_write = 12

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 20
output = 75
cache_read = 2
cache_write = 25

[limit]
context = 1_050_000

[provider]
npm = "@ai-sdk/openai"
