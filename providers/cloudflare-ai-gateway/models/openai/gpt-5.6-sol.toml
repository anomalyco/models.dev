# Route: provider-native passthrough /openai (Responses body forwarded unchanged): https://developers.cloudflare.com/ai-gateway/usage/providers/openai/
# v2 capabilities and cache follow OpenAI's own API (providers/openai). Live via the gateway 2026-10-19: mid-conversation developer messages and additional_tools keep the cached prefix (gpt-4.1-nano, gpt-5-nano, gpt-5.4-nano), configuration_update is accepted on gpt-6-luna and gpt-5.6-luna, json_schema output is enforced.
# Per-API flags: additional_tools and configuration_update exist only on the Responses API (the /openai passthrough), so tools.updates and effort_updates sit on [api.responses] for models that also list the REST chat-completions route. Developer messages are documented on both OpenAI APIs, so system_updates stays top-level.
# Tools: each API takes providers/openai's tool fields for the same protocol, so tools.search sits on [api.responses]. The REST chat-completions route forwards custom tools (text, lark and regex) and strict function tools and rejects tool_search, like OpenAI's own Chat Completions (openai/gpt-5.4-nano, live 2026-10-26).
# effort_updates: a Responses `configuration_update` item between turns changes effort and keeps the cache (live via the gateway 2026-10-23, BYOK, same as providers/openai; OpenAI's docs list only GPT-6).
schema = 2
base_model = "openai/gpt-5.6-sol"

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none", "required", "tool"], search = true, freeform = ["text", "lark", "regex"], updates = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
cache = { implicit = { min_tokens = 1_024 }, explicit = { ttl = ["30m"], max_breakpoints = 4, min_tokens = 1_024 } }
structured_output = true
system_updates = true
effort_updates = true

[limit]
context = 1_050_000

[api.responses]
base_url = "https://gateway.ai.cloudflare.com/v1/${CLOUDFLARE_ACCOUNT_ID}/${CLOUDFLARE_GATEWAY_ID}/openai"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/cloudflare-ai-gateway" }

[cost.text.input]
price = 2
cache = { read = 0.25, write = 3.125 }

[cost.text.output]
price = 10
