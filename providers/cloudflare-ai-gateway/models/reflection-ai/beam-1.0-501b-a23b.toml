# Always reasons; effort: reasoning_effort = low|medium|high|xhigh|max (none/minimal rejected).
# Interleaved: reasoning_content must be sent back on every prior assistant message.
# Source: https://developers.reflection.ai/reasoning
base_model = "reflection/beam-1.0-501b-a23b"
structured_output = true

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh", "max"]

[cost]
input = 0
output = 0
cache_read = 0

[limit]
context = 262_144
