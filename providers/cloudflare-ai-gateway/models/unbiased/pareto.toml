# Route: REST API POST /ai/v1/chat/completions (https://developers.cloudflare.com/ai-gateway/usage/rest-api/): no per-turn effort or tool-change mechanism.
# Live 2026-10-19: a mid-conversation system message keeps the cached prefix (in place).
schema = 2
base_model = "unbiased/pareto"

[capabilities]
tools = { supported = true, updates = false }
cache = { supported = true, implicit = true }
system_updates = true
effort_updates = false
structured_output = false

[limit]
context = 262_144

[cost.text.input]
price = 2.5
cache = { read = 0.25 }

[cost.text.output]
price = 7.5
