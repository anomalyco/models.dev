# Route: REST API POST /ai/v1/chat/completions (https://developers.cloudflare.com/ai-gateway/usage/rest-api/), translated to Meta's Responses API: no per-turn effort or tool-change mechanism.
# Live 2026-10-19 (muse-spark-1.1, gateway logs): distinct mid-conversation system messages miss the warm cache every time while plain turns hit it (hoisted), so system_updates = false.
# Live 2026-10-19 (muse-spark-1.1, 1.3, wonder-1.0): response_format json_schema is dropped and the answer is prose, so structured_output = false.
# Effort: reasoning_effort = minimal|low|medium|high|xhigh (POST /ai/v1/chat/completions, translated to reasoning.effort; values from Cloudflare's validation error; none and max rejected; live 2026-10-19: low 561 / high 960 reasoning tokens).
schema = 2
base_model = "meta/muse-spark-1.2"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh"] }
cache = { implicit = true }
structured_output = false
system_updates = false
effort_updates = false

[api.chat-completions]

[api.responses]
base_url = "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/cloudflare-ai-gateway" }

[cost.text.input]
price = 1.25
cache = { read = 0.16 }

[cost.text.output]
price = 4.25
