# Cloudflare AI Gateway model overrides (human-curated).
#
# Consumed by: bun run cloudflare-ai-gateway:generate
#
# Each [models."<canonical id>"] entry carries the base_model target and any fields the
# Cloudflare catalog API cannot supply. cost_source = "catalog" pulls pricing from
# ai/catalog/models each run; "manual" keeps the cost inlined here (hosted @cf/* pricing,
# tiered pricing, and lab/deprecated rates the proxied catalog does not express).

# Catalog Text-Generation models intentionally not published yet.
# To publish one: add a [models."<id>"] entry below and remove it from this list.
skip = [
  "alibaba/qwen3-max",
  "alibaba/qwen3.5-397b-a17b",
  "alibaba/qwen3.7-max",
  "alibaba/qwen3.7-plus",
  "alibaba/qwen3.8-max",
  "deepseek/deepseek-v4-pro",
  "google/gemini-2.5-flash",
  "google/gemini-2.5-flash-lite",
  "google/gemini-2.5-pro",
  "google/gemini-3-flash",
  "google/gemini-3.1-flash-lite",
  "google/gemini-3.1-pro",
  "google/gemini-3.5-flash",
  "google/gemini-3.5-flash-lite",
  "google/gemini-3.6-flash",
  "google/gemini-3.7-flash",
  "minimax/m2.7",
  "minimax/m3",
  "moonshotai/kimi-k3",
  "thinkingmachines/inkling",
  "thinkingmachines/inkling-256k",
  "workers-ai/@cf/deepseek-ai/deepseek-v4-flash-0731",
  "workers-ai/@cf/deepseek-ai/deepseek-v4-pro-0813",
  "workers-ai/@cf/google/gemma-2b-it-lora",
  "workers-ai/@cf/google/gemma-7b-it-lora",
  "workers-ai/@cf/meta-llama/llama-2-7b-chat-hf-lora",
  "workers-ai/@cf/mistral/mistral-7b-instruct-v0.2-lora",
  "xai/grok-4.20-0309-non-reasoning",
  "xai/grok-4.20-0309-reasoning",
  "xai/grok-4.20-multi-agent-0309",
  "xai/grok-4.3",
