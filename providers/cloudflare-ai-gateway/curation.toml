# Proxied reasoning models whose reasoning shape the Cloudflare catalog schema does not
# expose (native-format providers). Values mirror models.dev's merge-gateway provider, which
# proxies the same upstreams. Google uses thinkingConfig.thinkingBudget / thinking_level.
#
# Cloudflare serves this DeepSeek V4 Pro route via Fireworks. Fireworks' V4 renderer
# accepts reasoning_effort=none to disable thinking and low|high|max for graded effort;
# off is an effort value, not a separate thinking.type toggle.
# https://docs.fireworks.ai/api-reference/post-chatcompletions
[models."deepseek/deepseek-v4-pro"]
note = [
  "Off: reasoning_effort = none; effort: low|high|max (Fireworks route).",
  "Source: https://docs.fireworks.ai/api-reference/post-chatcompletions",
]
reasoning_options = [{ type = "effort", values = ["none", "low", "high", "max"] }]

# Alibaba is a first-party lab; the catalog's OpenAI-compat schema exposes a generic
# `reasoning_effort` enum, but Alibaba's real API (see providers/alibaba/models/qwen3.7-plus.toml)
# is toggle + budget_tokens, not graded effort. Match the lab shape per AGENTS.md.
[models."alibaba/qwen3.7-plus"]
note = ["Toggle: enable_thinking true|false.", "Budget: thinking_budget (integer reasoning tokens)."]
reasoning_options = [{ type = "toggle" }, { type = "budget_tokens" }]

[models."alibaba/qwen3.5-397b-a17b"]
note = ["Toggle: enable_thinking true|false.", "Budget: thinking_budget (integer reasoning tokens)."]
reasoning_options = [{ type = "toggle" }, { type = "budget_tokens" }]

[models."alibaba/qwen3.7-max"]
note = ["Toggle: enable_thinking true|false.", "Budget: thinking_budget (integer reasoning tokens)."]
reasoning_options = [{ type = "toggle" }, { type = "budget_tokens" }]

# providers/alibaba/models/qwen3.8-max.toml: hybrid toggle, low|medium|xhigh effort (high
# aliases to xhigh), and a 0..262144 budget that cannot combine with effort.
[models."alibaba/qwen3.8-max"]
note = [
  "Toggle: enable_thinking true|false (hybrid).",
  "Effort: reasoning_effort = low|medium|xhigh (default xhigh); high accepted as alias -> xhigh.",
  "Budget: thinking_budget (0..262144) cannot be combined with reasoning_effort.",
]
interleaved = { field = "reasoning_content" }
reasoning_options = [
  { type = "toggle" },
  { type = "effort", values = ["low", "medium", "xhigh"] },
  { type = "budget_tokens", min = 0, max = 262_144 },
]

# xAI Grok 4.6: the first-party API (providers/xai/models/grok-4.6.toml) includes xhigh, but
# Cloudflare's gateway route rejects it (verified live: reasoning_effort accepts only
# low|medium|high, code 7003) — a host delta, so match what the CF route actually accepts.
[models."xai/grok-4.6"]
reasoning_options = [{ type = "effort", values = ["low", "medium", "high"] }]

# First-party xAI Grok 4.20 (Reasoning) is always-on with no caller control
# (providers/xai/models/grok-4.20-0309-reasoning.toml: reasoning_options = []).
[models."xai/grok-4.20-0309-reasoning"]
reasoning_options = []

[models."moonshotai/kimi-k3"]
note = [
  "Kimi K3 always thinks; thinking.type is not supported. Effort: reasoning_effort = low|high|max.",
  "Sources: https://platform.kimi.ai/docs/api/models-overview ; https://developers.cloudflare.com/ai/models/moonshotai/kimi-k3/",
]
reasoning_options = [{ type = "effort", values = ["low", "high", "max"] }]

# Ember-1 is Fireworks' Kimi K3 derivative, served on the Fireworks route. The catalog
# schema advertises a generic none|low|medium|high|xhigh|max enum, but Fireworks' K3 tiers
# promote medium -> high and xhigh -> max, so the distinct levels are none|low|high|max
# (same as providers/kilo/models/fireworks/ember-1.toml and the deepseek-v4-pro route above).
# Live CF chat-completions accepts all six and returns reasoning_content (2026-10-16).
[models."fireworks/ember-1"]
note = [
  "Off: reasoning_effort = none; effort: low|high|max (Fireworks route; medium -> high, xhigh -> max).",
  "Sources: https://docs.fireworks.ai/api-reference/post-chatcompletions ; https://docs.fireworks.ai/guides/reasoning",
]
interleaved = { field = "reasoning_content" }
reasoning_options = [{ type = "effort", values = ["none", "low", "high", "max"] }]

# Reflection's catalog id (reflection-ai/...) differs from the lab dir (reflection/...).
# Live CF chat-completions (2026-10-16, unified billing): reasoning_effort accepts
# low|medium|high|xhigh|max and rejects none|minimal (code 7003); reasoning is always on and
# returned in reasoning_content, and omitting it from a prior assistant turn is rejected.
# The catalog row has provider_details = null, so cost is curated: free, matching the
# catalog's display pricing (input/cached input/output $0 per 1M) on 2026-10-16.
[models."reflection-ai/beam-1.0-501b-a23b"]
base_model = "reflection/beam-1.0-501b-a23b"
note = [
  "Always reasons; effort: reasoning_effort = low|medium|high|xhigh|max (none/minimal rejected).",
  "Interleaved: reasoning_content must be sent back on every prior assistant message.",
  "Source: https://developers.reflection.ai/reasoning",
]
interleaved = { field = "reasoning_content" }
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]
cost = { input = 0, output = 0, cache_read = 0 }

[models."thinkingmachines/inkling"]
note = [
  "Tinker's Anthropic-compatible route: thinking.type = adaptive|disabled toggles reasoning;",
  "output_config.effort = low|medium|high|xhigh|max sets effort.",
]
reasoning_options = [{ type = "toggle" }, { type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]
limit = { output = 65_536 }

# Gemini 4 Argon: Google native thinkingLevel only (low|medium|high, default medium).
# Thinking cannot be disabled and thinking_budget is deprecated (400 on Gemini 4).
# Wire is preserved via the Google AI Studio native route through AI Gateway.
# https://ai.google.dev/gemini-api/docs/thinking
# https://ai.google.dev/gemini-api/docs/generate-content/thinking
# https://ai.google.dev/gemini-api/docs/models/gemini-4-argon
# https://developers.cloudflare.com/ai-gateway/usage/providers/google-ai-studio/
[models."google/gemini-4-argon"]
note = [
  "Effort: generationConfig.thinkingConfig.thinkingLevel = low|medium|high (Google AI Studio native route preserved via AI Gateway; default medium, thinking cannot be disabled).",
  "Sources: https://ai.google.dev/gemini-api/docs/thinking ; https://ai.google.dev/gemini-api/docs/models/gemini-4-argon ; https://developers.cloudflare.com/ai-gateway/usage/providers/google-ai-studio/",
]
reasoning_options = [{ type = "effort", values = ["low", "medium", "high"] }]
