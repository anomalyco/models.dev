# Proxied reasoning models whose reasoning shape the Cloudflare catalog schema does not
# expose (native-format providers). Values mirror models.dev's merge-gateway provider, which
# proxies the same upstreams. Google uses thinkingConfig.thinkingBudget / thinking_level.
#
# DeepSeek: toggle-only would only be correct if AI Gateway drops the effort field on this
# route (merge-gateway's own toggle-only shape is backed by a live-tested selected-route
# comment specific to *their* relay, not evidence about Cloudflare's). Absent host-specific
# proof that Cloudflare strips it, match the lab + Workers AI baseline: toggle + high/max.
[models."deepseek/deepseek-v4-pro"]
note = ["Toggle: thinking.type = enabled|disabled.", "Effort: reasoning_effort = high|max."]
reasoning_options = [{ type = "toggle" }, { type = "effort", values = ["high", "max"] }]

# Alibaba is a first-party lab; the catalog's OpenAI-compat schema exposes a generic
# `reasoning_effort` enum, but Alibaba's real API (see providers/alibaba/models/qwen3.7-plus.toml)
# is toggle + budget_tokens, not graded effort. Match the lab shape per AGENTS.md.
[models."alibaba/qwen3.7-plus"]
note = ["Toggle: enable_thinking true|false.", "Budget: thinking_budget (integer reasoning tokens)."]
reasoning_options = [{ type = "toggle" }, { type = "budget_tokens" }]

[models."alibaba/qwen3.5-397b-a17b"]
note = ["Toggle: enable_thinking true|false.", "Budget: thinking_budget (integer reasoning tokens)."]
reasoning_options = [{ type = "toggle" }, { type = "budget_tokens" }]

[models."alibaba/qwen3.7-max"]
note = ["Toggle: enable_thinking true|false.", "Budget: thinking_budget (integer reasoning tokens)."]
reasoning_options = [{ type = "toggle" }, { type = "budget_tokens" }]

# providers/alibaba/models/qwen3.8-max.toml: hybrid toggle, low|medium|xhigh effort (high
# aliases to xhigh), and a 0..262144 budget that cannot combine with effort.
[models."alibaba/qwen3.8-max"]
note = [
  "Toggle: enable_thinking true|false (hybrid).",
  "Effort: reasoning_effort = low|medium|xhigh (default xhigh); high accepted as alias -> xhigh.",
  "Budget: thinking_budget (0..262144) cannot be combined with reasoning_effort.",
]
interleaved = { field = "reasoning_content" }
reasoning_options = [
  { type = "toggle" },
  { type = "effort", values = ["low", "medium", "xhigh"] },
  { type = "budget_tokens", min = 0, max = 262_144 },
]

# First-party xAI Grok 4.6 (providers/xai/models/grok-4.6.toml) includes xhigh; the catalog
# schema enum is missing it.
[models."xai/grok-4.6"]
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh"] }]

# First-party xAI Grok 4.20 (Reasoning) is always-on with no caller control
