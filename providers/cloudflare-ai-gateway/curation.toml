# GPT-6 Astra has conflicting validation layers on Cloudflare's Responses route. The catalog
# schema advertises none|low|medium|high, but `none` reaches OpenAI and is rejected upstream;
# xhigh|max are rejected by Cloudflare before forwarding. POST /ai/v1/responses verified
# low end-to-end and those three rejection paths on 2026-09-17.
[models."openai/gpt-6-astra"]
note = ["Effort: reasoning.effort = low|medium|high; Cloudflare rejects xhigh|max, and OpenAI rejects none after forwarding (live verified 2026-09-17)."]
reasoning_options = [{ type = "effort", values = ["low", "medium", "high"] }]

