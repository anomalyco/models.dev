# Cloudflare AI Gateway - human curation layer (proxied third-party models only).
#
# The generator derives id, name, description, cost, and limit.context from the Cloudflare
# catalog. This file holds only what the catalog cannot express:
#   - base_model: any proxied id whose canonical file name differs from its catalog id.
#   - structured_output: a quality judgement. Cloudflare advertises response_format for
#     nearly every model, but several do not honour it, so this stays hand-set.
#   - reasoning_options: the catalog has no reasoning schema, so reasoning shapes are curated.
#   - interleaved: whether a wire returns reasoning content as a separate field. Never
#     inheritable from base_model (this deployment's wire format can differ from the lab's).
#   - limit.output: the catalog's max_output_tokens is not a reliable ceiling (verified wrong
#     against lab/first-party for several models), so output is hand-curated; only
#     limit.context is auto-derived.
#   - note: leading `#` comment lines (wire-path docs, source citations) that would otherwise
#     be lost on every regeneration.
#   - skip: catalog ids with no lab file, or not reachable via unified billing (BYOK-only).
# Consumed by: bun run cloudflare-ai-gateway:generate

# Proxied Text-Generation catalog ids with no lab file under models/ (cannot publish yet).
skip = [
  "google/gemini-3-flash",
  "google/gemini-3.1-pro",
  "xai/grok-4.20-multi-agent-0309",
  "thinkingmachines/inkling-256k",
  "minimax/m2.7",
  "minimax/m3",
  "thinkingmachines/inkling",
  "google/gemini-2.5-flash-lite",
  "google/gemini-2.5-flash",
  "google/gemini-2.5-pro",
  "google/gemini-3.1-flash-lite",
  "google/gemini-3.5-flash-lite",
  "google/gemini-3.5-flash",
  "google/gemini-3.6-flash",
  "google/gemini-3.7-flash",
  "google/gemini-3.8-flash",
]

[models."anthropic/claude-fable-5"]
