# Proxied reasoning models whose reasoning shape the Cloudflare catalog schema does not
# expose (native-format providers). Values mirror models.dev's merge-gateway provider, which
# proxies the same upstreams. Google uses thinkingConfig.thinkingBudget / thinking_level.
#
# Cloudflare serves this DeepSeek V4 Pro route via Fireworks. Fireworks' V4 renderer
# accepts reasoning_effort=none to disable thinking and low|high|max for graded effort;
# off is an effort value, not a separate thinking.type toggle.
# https://docs.fireworks.ai/api-reference/post-chatcompletions
[models."deepseek/deepseek-v4-pro"]
note = [
  "Off: reasoning_effort = none; effort: low|high|max (Fireworks route).",
  "Source: https://docs.fireworks.ai/api-reference/post-chatcompletions",
]
reasoning_options = [{ type = "effort", values = ["none", "low", "high", "max"] }]

# Muse Spark Open always reasons; native ladder is low|medium|high|xhigh (default xhigh).
# Reasoning cannot be disabled: none|max rejected. Cloudflare serves this route via
# Fireworks and preserves reasoning_effort on POST /ai/v1/chat/completions.
# https://dev.meta.ai/docs/muse-spark-open/prompting
# https://huggingface.co/meta-models/Muse-Spark-Open-816B-A42B
# https://developers.cloudflare.com/ai/models/meta/muse-spark-open/
[models."meta/muse-spark-open"]
structured_output = true
note = [
  "Effort: reasoning_effort = low|medium|high|xhigh (default xhigh; reasoning cannot be disabled, none|max rejected; POST /ai/v1/chat/completions).",
  "Sources: https://dev.meta.ai/docs/muse-spark-open/prompting ; https://huggingface.co/meta-models/Muse-Spark-Open-816B-A42B ; https://developers.cloudflare.com/ai/models/meta/muse-spark-open/",
]
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh"] }]

