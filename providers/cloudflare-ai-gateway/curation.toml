# Cloudflare's typesafe/jev answers as jev-1.13.0 (the response examples on
# https://developers.cloudflare.com/ai/models/typesafe/jev/), so it is Jev 1.13, not the moving alias.
[models."typesafe/jev"]
base_model = "typesafe/jev-1.13.0"

# Muse Spark 1.x / Muse Wonder: the catalog schema's reasoning.effort enum (none..max) is the generic
# Responses schema, not what the model accepts. Cloudflare's own validation error lists the values:
# 1.1/1.2 "Supported values: [minimal, low, medium, high, xhigh]", 1.3/Wonder "[minimal, low, medium,
# high, xhigh, max]"; none is rejected on all four (live 2026-10-19). Curated to override the schema.
# structured_output, live json_schema checks through the gateway (2026-10-19, see the notes in
# each family's prefix_notes): REST chat-completions response_format is enforced for xAI (grok-4.3,
# grok-4.20-0309-non-reasoning), Gemini 4 Argon and Muse Spark Open, but dropped for Muse Spark
# 1.x / Muse Wonder (Cloudflare translates them to Meta's Responses API and answers in prose).
# Anthropic passthrough output_config.format is enforced on Sonnet 5.5 and Opus 5.5.
[models."xai/grok-4.3"]
structured_output = true
note = ["Effort: reasoning_effort = none|low|medium|high (POST /ai/v1/chat/completions; live 2026-10-19: none -> 0 reasoning tokens, low 4562 vs medium 6602 median)."]

