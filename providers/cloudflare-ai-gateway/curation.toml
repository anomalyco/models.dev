# Cloudflare AI Gateway - human curation layer.
#
# The generator derives id, name, description, cost, limits, tool_call, attachment,
# and hosted @cf reasoning_options from the Cloudflare catalog + Workers-AI docs.
# This file holds only what those sources cannot express:
#   - base_model: hosted @cf vendor->lab mapping (not algorithmic), and any proxied
#     id whose canonical file name differs from its catalog id.
#   - structured_output: a quality judgement. Cloudflare advertises response_format for
#     nearly every model, but several do not honour it (verified live: qwq-32b, qwen2.5-
#     coder, gemma-sea-lion return non-conforming output), so this stays hand-set.
#   - reasoning_options: proxied (catalog has no reasoning schema) and any hosted @cf model
#     whose docs schema doesn't describe its real reasoning knob (native, non-graded, etc.).
#   - interleaved: whether a wire returns reasoning content as a separate field. Never
#     inheritable from base_model (this deployment's wire format can differ from the lab's).
#   - limit.output: neither the catalog's max_output_tokens nor the docs schema is a reliable
#     ceiling (both verified wrong against lab/first-party for several models), so output is
#     always hand-curated; only limit.context is auto-derived.
#   - note: leading `#` comment lines (wire-path docs, source citations) that would otherwise
#     be lost on every regeneration.
# Consumed by: bun run cloudflare-ai-gateway:generate

# Proxied Text-Generation catalog ids with no lab file under models/ (cannot publish yet).
