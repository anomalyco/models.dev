# Host modalities: page, OpenAI, and Anthropic lists all explicitly include audio input.
# Effort: reasoning_effort = minimal|low|medium|high|xhigh
# https://zenmux.ai/docs/api/openai/openai-list-models.html
# https://zenmux.ai/docs/guide/advanced/reasoning.html
base_model = "meta/muse-spark-1.1"

[[reasoning_options]]
type = "effort"
values = ["minimal", "low", "medium", "high", "xhigh"]

[cost]
input = 1.25
output = 4.25
cache_read = 0.15

[limit]
output = 128_000

[modalities]
input = ["text", "image", "pdf", "audio", "video"]
