# Effort: reasoning_effort = minimal|low|medium|high|xhigh|max
# https://zenmux.ai/docs/api/openai/openai-list-models.html
# https://zenmux.ai/docs/guide/advanced/reasoning.html
base_model = "meta/muse-spark-1.3"

[[reasoning_options]]
type = "effort"
values = ["minimal", "low", "medium", "high", "xhigh", "max"]

[cost]
input = 1.25
output = 4.25
cache_read = 0.15

[limit]
output = 128_000
