# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|medium|high|xhigh|max
# https://zenmux.ai/docs/guide/advanced/reasoning.html
base_model = "anthropic/claude-sonnet-5"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh", "max"]

[cost]
input = 2
output = 10
cache_read = 0.2
cache_write = 2.5

[limit]
output = 64_000

[provider]
npm = "@ai-sdk/anthropic"
api = "https://zenmux.ai/api/anthropic/v1"
