schema = 2
name = "Claude Opus 4"
description = "Flagship Claude model for deep reasoning, coding, and long-horizon agents"
open_weights = false
knowledge = "2025-01-01"
release_date = "2025-05-22"

[modalities]
input = ["image", "text", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
temperature = true

[limit]
context = 200_000
output = 32_000

[api.messages]
base_url = "https://zenmux.ai/api/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic" }

[cost.text.input]
price = 15
cache = { read = 1.5, write = 18.75 }

[cost.text.output]
price = 75
