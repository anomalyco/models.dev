base_url = "https://zenmux.ai/api/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic" }

[cost.text.input]
price = 3
cache = { read = 0.3, write = 3.75 }

[cost.text.output]
price = 15
