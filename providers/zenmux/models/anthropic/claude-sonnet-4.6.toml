# Effort: reasoning_effort = low|medium|high|max
# Budget: thinking.budget_tokens (integer)
# https://zenmux.ai/docs/guide/advanced/reasoning.html
base_model = "anthropic/claude-sonnet-4-6"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "max"]

[[reasoning_options]]
type = "budget_tokens"
min = 1_024

[cost]
input = 3
output = 15
cache_read = 0.3
cache_write = 3.75

[provider]
npm = "@ai-sdk/anthropic"
api = "https://zenmux.ai/api/anthropic/v1"
