# Prices, limits and input modalities: ZenMux catalog GET https://zenmux.ai/api/v1/models (2026-10-21).
# Cache: https://docs.zenmux.ai/guide/advanced/prompt-cache.html (implicit: OpenAI, DeepSeek, Grok, Gemini, Qwen, Kimi, GLM, Ling/Ring; cache_control: Claude, Gemini, Qwen).
schema = 2
base_model = "anthropic/claude-sonnet-4-5"
name = "Claude Sonnet 4.5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
cache = { supported = true, implicit = false, explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 1_024 } }

[limit]
context = 1_000_000

[api.messages]
base_url = "https://zenmux.ai/api/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 3
cache = { read = 0.3, write = { "5m" = 3.75, "1h" = 6 } }

[[cost.text.input.overrides]]
when = { context = { gte = 200_000 } }
price = 6
cache = { read = 0.6, write = { "5m" = 7.5, "1h" = 12 } }

[cost.text.output]
price = 15

[[cost.text.output.overrides]]
when = { context = { gte = 200_000 } }
price = 22.5
