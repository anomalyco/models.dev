# Effort: reasoning_effort = low|medium|high
# Budget: thinking.budget_tokens (integer)
# https://zenmux.ai/docs/guide/advanced/reasoning.html
base_model = "anthropic/claude-opus-4-5"
name = "Claude Opus 4.5"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[[reasoning_options]]
type = "budget_tokens"
min = 1_024

[cost]
input = 5
output = 25
cache_read = 0.5
cache_write = 6.25

[limit]
output = 32_000

[provider]
npm = "@ai-sdk/anthropic"
api = "https://zenmux.ai/api/anthropic/v1"
