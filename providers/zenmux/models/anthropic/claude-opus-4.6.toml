schema = 2
base_model = "anthropic/claude-opus-4-6"
description = "Flagship Claude model for deep reasoning, coding, and long-horizon agents"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[api.messages]
base_url = "https://zenmux.ai/api/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic" }

[cost.text.input]
price = 5
cache = { read = 0.5, write = 6.25 }

[cost.text.output]
price = 25
