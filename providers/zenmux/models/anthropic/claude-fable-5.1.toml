# Effort: reasoning_effort = low|medium|high|xhigh|max
# https://zenmux.ai/docs/guide/advanced/reasoning.html
base_model = "anthropic/claude-fable-5-1"
tool_call = false

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh", "max"]

[cost]
input = 10
output = 50
cache_read = 0.25
cache_write = 12.5

[provider]
npm = "@ai-sdk/anthropic"
api = "https://zenmux.ai/api/anthropic/v1"
