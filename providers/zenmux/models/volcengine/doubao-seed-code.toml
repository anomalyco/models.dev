# Retired: absent from GET https://zenmux.ai/api/v1/models and its model page redirects to /bytedance/doubao-seed-code (2026-10-21).
# Modalities: image formats from the Volcengine Ark image understanding, 图片格式说明 table (https://www.volcengine.com/docs/82379/1362931).
schema = 2
name = "Doubao-Seed-Code"
description = "Coding model for repository understanding, refactors, and agentic engineering tasks"
open_weights = false
knowledge = "2025-01-01"
