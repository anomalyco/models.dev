# Effort: reasoning_effort = low|high
# https://zenmux.ai/docs/api/openai/openai-list-models.html
# https://zenmux.ai/docs/guide/advanced/reasoning.html
base_model = "stepfun/step-3.5-flash"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["low", "high"]

[cost]
input = 0.1
output = 0.3
