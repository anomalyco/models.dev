# Prices, limits and input modalities: ZenMux catalog GET https://zenmux.ai/api/v1/models (2026-10-21).
# Reasoning: catalog capabilities.reasoning = true. Effort: reasoning_effort = low|high, as first-party StepFun.
schema = 2
base_model = "stepfun/step-3.5-flash"
base_model_omit = ["limit.input"]
description = "StepFun flash model for efficient multimodal reasoning, coding, and tool use"

[capabilities]
reasoning = { supported = true, effort = ["low", "high"] }

[cost.text.input]
price = 0.1

[cost.text.output]
price = 0.3
