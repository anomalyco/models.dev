# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|high|max
# ZenMux's undated deepseek-v4-flash slug is explicitly displayed as the 0731
# snapshot in its 2026-09-19 catalog, so the dated base name is intentional.
# https://zenmux.ai/docs/guide/advanced/reasoning.html
# https://zenmux.ai/docs/api/openai/openai-list-models.html
base_model = "deepseek/deepseek-v4-flash-0731"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 0.14
output = 0.28
cache_read = 0.0028
