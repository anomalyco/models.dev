# ZenMux's 2026-09-19 model lists expose this as the non-thinking chat route,
# so reasoning=false is an intentional host override.
# https://zenmux.ai/docs/api/openai/openai-list-models.html
base_model = "deepseek/deepseek-v3.1"
name = "DeepSeek V3.1"
reasoning = false
structured_output = true

[cost]
input = 0.28
output = 1.11
cache_read = 0.056

[limit]
context = 128_000
output = 65_536
