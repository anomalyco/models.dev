# Reasoning is always enabled on this route; no caller toggle is exposed.
# Source: https://zenmux.ai/api/frontend/model/listByFilter (accessed 2026-09-25)
# Prices, limits and input modalities: ZenMux catalog GET https://zenmux.ai/api/v1/models (2026-10-21).
# Cache: https://docs.zenmux.ai/guide/advanced/prompt-cache.html (implicit: OpenAI, DeepSeek, Grok, Gemini, Qwen, Kimi, GLM, Ling/Ring; cache_control: Claude, Gemini, Qwen).
schema = 2
base_model = "moonshotai/kimi-k2.7-code"
name = "Kimi K2.7 Code HighSpeed"

[capabilities]
reasoning = { supported = true }
structured_output = true
cache = { supported = true, implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.9
cache = { read = 0.38 }

[cost.text.output]
price = 8
