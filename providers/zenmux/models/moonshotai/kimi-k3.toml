# Toggle: thinking.type = enabled|disabled|adaptive
# Effort: output_config.effort = low|high|max
# https://zenmux.ai/docs/guide/advanced/reasoning.html
base_model = "moonshotai/kimi-k3"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 3
output = 15
cache_read = 0.3

[limit]
output = 262_144
