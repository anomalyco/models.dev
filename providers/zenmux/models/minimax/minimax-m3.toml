base_model = "minimax/MiniMax-M3"
name = "MiniMax-M3"
description = "MiniMax multimodal model for long-context coding, perception, and agent planning"
family = "minimax"
release_date = "2026-06-01"
last_updated = "2026-06-01"
attachment = true
reasoning = true
temperature = true
tool_call = true
open_weights = true

[[reasoning_options]]
type = "toggle"

[cost]
input = 0.3
output = 1.2
cache_read = 0.06

[[cost.tiers]]
tier = { type = "context", size = 512_000 }
input = 0.6
output = 2.4
cache_read = 0.12

[limit]
context = 1_048_576
output = 512_000

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[provider]
npm = "@ai-sdk/anthropic"
api = "https://zenmux.ai/api/anthropic/v1"
