# Toggle: thinking.type = enabled|disabled
# https://zenmux.ai/docs/guide/advanced/reasoning.html
base_model = "minimax/MiniMax-M3"
name = "MiniMax M3"
temperature = false
tool_call = false

[[reasoning_options]]
type = "toggle"

[cost]
input = 0.3
output = 1.2
cache_read = 0.06

[[cost.tiers]]
tier = { type = "context", size = 512_000 }
input = 0.6
output = 2.4
cache_read = 0.12

[limit]
context = 1_000_000

[provider]
npm = "@ai-sdk/anthropic"
api = "https://zenmux.ai/api/anthropic/v1"
