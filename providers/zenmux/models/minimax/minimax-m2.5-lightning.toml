# MiniMax M2.x reasoning is always on; ZenMux exposes no caller control.
# https://zenmux.ai/docs/guide/advanced/reasoning.html
base_model = "minimax/MiniMax-M2.5-highspeed"
reasoning_options = []

[cost]
input = 0.6
output = 2.4
cache_read = 0.03
cache_write = 0.375

[provider]
npm = "@ai-sdk/anthropic"
api = "https://zenmux.ai/api/anthropic/v1"
