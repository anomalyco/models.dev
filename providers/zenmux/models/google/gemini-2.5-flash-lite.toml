# Vertex `thinkingBudget`: -1 (dynamic) or 512..24576; no disable sentinel is listed.
# https://docs.zenmux.ai/api/vertexai/generate-content.html (accessed 2026-06-25)
schema = 2
name = "Gemini 2.5 Flash Lite"
description = "Low-latency Gemini model for high-volume multimodal and agent workloads"
open_weights = false
knowledge = "2025-01-01"
release_date = "2025-07-22"

[modalities]
input = ["application/pdf", "image", "text", "audio"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true

[limit]
context = 1_048_000
output = 64_000

[cost.text.input]
price = 0.1
cache = { read = 0.03, write = 1 }

[cost.text.output]
price = 0.4
