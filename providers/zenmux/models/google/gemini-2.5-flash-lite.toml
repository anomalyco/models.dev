# Vertex `thinkingBudget`: -1 (dynamic) or 512..24576; no disable sentinel is listed.
# https://docs.zenmux.ai/api/vertexai/generate-content.html (accessed 2026-06-25)
schema = 2
base_model = "google/gemini-2.5-flash-lite"
name = "Gemini 2.5 Flash Lite"
description = "Low-latency Gemini model for high-volume multimodal and agent workloads"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "audio/wav", "audio/mp3", "audio/aiff", "audio/aac", "audio/ogg", "audio/flac", "audio/mpeg", "audio/m4a", "audio/l16", "audio/opus", "audio/alaw", "audio/mulaw", "audio/webm", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = false }

[limit]
context = 1_048_000
output = 64_000

[cost.text.input]
price = 0.1
cache = { read = 0.03, write = 1 }

[cost.text.output]
price = 0.4
