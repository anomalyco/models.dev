# Toggle: reasoning.enabled = true|false
# Budget: reasoning.max_tokens (integer)
# https://zenmux.ai/docs/guide/advanced/reasoning.html
base_model = "google/gemini-2.5-flash-lite"
name = "Gemini 2.5 Flash Lite"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "budget_tokens"
min = 512
max = 24_576

[cost]
input = 0.1
output = 0.4
cache_read = 0.01
cache_write = 1

[limit]
output = 65_535
