# Vertex `thinkingBudget`: -1 (dynamic) or 512..24576; no disable sentinel is listed.
# https://docs.zenmux.ai/api/vertexai/generate-content.html (accessed 2026-06-25)
# Prices, limits and input modalities: ZenMux catalog GET https://zenmux.ai/api/v1/models (2026-10-21).
# Reasoning: catalog capabilities.reasoning = true; controls as on ZenMux google/gemini-2.5-flash.
# Cache: https://docs.zenmux.ai/guide/advanced/prompt-cache.html (implicit: OpenAI, DeepSeek, Grok, Gemini, Qwen, Kimi, GLM, Ling/Ring; cache_control: Claude, Gemini, Qwen).
schema = 2
base_model = "google/gemini-2.5-flash-lite"
name = "Gemini 2.5 Flash Lite"
description = "Low-latency Gemini model for high-volume multimodal and agent workloads"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
cache = { supported = true, implicit = true, explicit = true }

[limit]
context = 1_048_000
output = 65_535

[cost.text.input]
price = 0.1
cache = { read = 0.01, storage = 1 }

[cost.text.output]
price = 0.4

[cost.audio.input]
price = 0.3
cache = { read = 0.03 }
