# Prices, limits and input modalities: ZenMux catalog GET https://zenmux.ai/api/v1/models (2026-10-21).
# Cache: https://docs.zenmux.ai/guide/advanced/prompt-cache.html (implicit: OpenAI, DeepSeek, Grok, Gemini, Qwen, Kimi, GLM, Ling/Ring; cache_control: Claude, Gemini, Qwen).
# cache write kept from the file; the catalog lists none.
schema = 2
base_model = "google/gemini-3-flash-preview"
description = "Fast Gemini model balancing multimodal reasoning, tool use, and cost"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "audio/wav", "audio/mp3", "audio/aiff", "audio/aac", "audio/ogg", "audio/flac", "audio/mpeg", "audio/m4a", "audio/l16", "audio/opus", "audio/alaw", "audio/mulaw", "audio/webm", "video/mp4", "video/mpeg", "video/mov", "video/avi", "video/x-flv", "video/mpg", "video/webm", "video/wmv", "video/3gpp", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
cache = { implicit = true, explicit = true }

[limit]
context = 1_048_000
output = 65_535

[cost.text.input]
price = 0.5
cache = { read = 0.05, write = 1 }

[cost.text.output]
price = 3

[cost.audio.input]
price = 1
cache = { read = 0.1 }
