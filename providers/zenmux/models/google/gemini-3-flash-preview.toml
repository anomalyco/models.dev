schema = 2
name = "Gemini 3 Flash Preview"
description = "Fast Gemini model balancing multimodal reasoning, tool use, and cost"
open_weights = false
knowledge = "2025-01-01"
release_date = "2025-12-17"

[modalities]
input = ["text", "image", "application/pdf", "audio"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
temperature = true

[limit]
context = 1_048_000
output = 64_000

[cost.text.input]
price = 0.5
cache = { read = 0.05, write = 1 }

[cost.text.output]
price = 3
