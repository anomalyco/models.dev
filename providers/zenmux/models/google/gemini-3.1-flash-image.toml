# Effort: reasoning_effort = minimal|high
# https://zenmux.ai/docs/guide/advanced/reasoning.html
base_model = "google/gemini-3.1-flash-image"
name = "Nano Banana 2 (Gemini 3.1 Flash Image)"

[[reasoning_options]]
type = "effort"
values = ["minimal", "high"]

[cost]
input = 0.5
output = 60

[limit]
context = 65_536

[modalities]
input = ["image", "text", "video"]
