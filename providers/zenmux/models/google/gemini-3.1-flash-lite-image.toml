# Effort: reasoning_effort = minimal|high
# ZenMux's 2026-09-19 catalog explicitly reports max_completion_tokens=32768.
# https://zenmux.ai/docs/guide/advanced/reasoning.html
# https://zenmux.ai/docs/api/vertexai/google-list-models.html
base_model = "google/gemini-3.1-flash-lite-image"
name = "Nano Banana 2 Lite (Gemini 3.1 Flash-Lite Image)"

[[reasoning_options]]
type = "effort"
values = ["minimal", "high"]

[cost]
input = 0.25
output = 30

[limit]
output = 32_768
