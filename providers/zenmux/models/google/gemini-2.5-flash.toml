# Toggle: reasoning.enabled = true|false
# Budget: reasoning.max_tokens (integer)
# https://zenmux.ai/docs/guide/advanced/reasoning.html
base_model = "google/gemini-2.5-flash"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "budget_tokens"
min = 0
max = 24_576

[cost]
input = 0.3
output = 2.5
cache_read = 0.03
cache_write = 1

[limit]
output = 65_535
