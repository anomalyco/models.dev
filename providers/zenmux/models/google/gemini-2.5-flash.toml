# Vertex `thinkingBudget`: -1 (dynamic) or 0..24576; 0 disables thinking.
# https://docs.zenmux.ai/api/vertexai/generate-content.html (accessed 2026-06-25)
schema = 2
base_model = "google/gemini-2.5-flash"
description = "Fast Gemini model balancing multimodal reasoning, tool use, and cost"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "audio/wav", "audio/mp3", "audio/aiff", "audio/aac", "audio/ogg", "audio/flac", "audio/mpeg", "audio/m4a", "audio/l16", "audio/opus", "audio/alaw", "audio/mulaw", "audio/webm", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[limit]
context = 1_048_000
output = 64_000

[cost.text.input]
price = 0.3
cache = { read = 0.07, write = 1 }

[cost.text.output]
price = 2.5
