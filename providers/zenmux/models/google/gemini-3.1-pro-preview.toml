# Effort: thinking_level = low|medium|high
# https://zenmux.ai/docs/guide/advanced/reasoning.html
base_model = "google/gemini-3.1-pro-preview"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
input = 2
output = 12
cache_read = 0.2
cache_write = 4.5

[[cost.tiers]]
tier = { type = "context", size = 200_000 }
input = 4
output = 18
cache_read = 0.4

[limit]
output = 65_535
