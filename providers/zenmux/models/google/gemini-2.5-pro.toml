# Budget: thinking_budget (integer)
# https://zenmux.ai/docs/guide/advanced/reasoning.html
base_model = "google/gemini-2.5-pro"

[[reasoning_options]]
type = "budget_tokens"
min = 128
max = 32_768

[cost]
input = 1.25
output = 10
cache_read = 0.13
cache_write = 4.5

[[cost.tiers]]
tier = { type = "context", size = 200_000 }
input = 2.5
output = 15
cache_read = 0.25

[limit]
output = 65_535
