schema = 2
base_model = "openai/gpt-5-codex"
base_model_omit = ["limit.input"]
name = "GPT-5 Codex"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[limit]
output = 64_000

[api.responses]
base_url = "https://zenmux.ai/api/v1"
sdk = { aisdk = "@ai-sdk/openai" }

[cost.text.input]
price = 1.25
cache = { read = 0.12 }

[cost.text.output]
price = 10
