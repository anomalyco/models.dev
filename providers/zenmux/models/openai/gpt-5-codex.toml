# Effort: reasoning_effort = low|medium|high
# ZenMux's 2026-09-19 model lists advertise text and image input for this route,
# so attachment=true is an intentional host capability override.
# https://zenmux.ai/docs/guide/advanced/reasoning.html
# https://zenmux.ai/docs/api/openai/openai-list-models.html
base_model = "openai/gpt-5-codex"
name = "GPT-5 Codex"
attachment = true

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
input = 1.25
output = 10
cache_read = 0.125

[provider]
npm = "@ai-sdk/openai"
api = "https://zenmux.ai/api/v1"
