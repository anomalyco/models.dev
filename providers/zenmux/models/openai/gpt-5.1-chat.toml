# Retired: absent from GET https://zenmux.ai/api/v1/models and its model page shows Sunset (2026-10-21).
# Cache: https://docs.zenmux.ai/guide/advanced/prompt-cache.html (implicit: OpenAI, DeepSeek, Grok, Gemini, Qwen, Kimi, GLM, Ling/Ring; cache_control: Claude, Gemini, Qwen).
schema = 2
base_model = "openai/gpt-5.1-chat-latest"
description = "Chat-tuned GPT model for conversational assistance, writing, and tool workflows"
status = "deprecated"

[modalities]
input = ["application/pdf", "image/jpeg", "image/png", "image/gif", "image/webp", "text"]
output = ["text"]

[capabilities]
reasoning = { supported = false }
cache = { supported = true, implicit = true }
temperature = true

[limit]
output = 64_000

[api.responses]
base_url = "https://zenmux.ai/api/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }

[cost.text.input]
price = 1.25
cache = { read = 0.12 }

[cost.text.output]
price = 10
