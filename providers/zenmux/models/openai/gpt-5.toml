schema = 2
name = "GPT-5"
description = "GPT model for general reasoning, writing, coding, and tool-assisted tasks"
open_weights = false
knowledge = "2025-01-01"
release_date = "2025-08-07"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
temperature = true

[limit]
context = 400_000
output = 64_000

[api.responses]
base_url = "https://zenmux.ai/api/v1"
sdk = { aisdk = "@ai-sdk/openai" }

[cost.text.input]
price = 1.25
cache = { read = 0.12 }

[cost.text.output]
price = 10
