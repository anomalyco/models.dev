# Prices, limits and input modalities: ZenMux catalog GET https://zenmux.ai/api/v1/models (2026-10-21).
# Cache: https://docs.zenmux.ai/guide/advanced/prompt-cache.html (implicit: OpenAI, DeepSeek, Grok, Gemini, Qwen, Kimi, GLM, Ling/Ring; cache_control: Claude, Gemini, Qwen).
schema = 2
base_model = "openai/gpt-5"
base_model_omit = ["limit.input"]
description = "GPT model for general reasoning, writing, coding, and tool-assisted tasks"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
cache = { supported = true, implicit = true }

[api.responses]
base_url = "https://zenmux.ai/api/v1"
sdk = { aisdk = "@ai-sdk/openai" }

[cost.text.input]
price = 1.25
cache = { read = 0.125 }

[cost.text.output]
price = 10
