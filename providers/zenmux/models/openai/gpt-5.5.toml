# Prices, limits and input modalities: ZenMux catalog GET https://zenmux.ai/api/v1/models (2026-10-21).
# Cache: https://docs.zenmux.ai/guide/advanced/prompt-cache.html (implicit: OpenAI, DeepSeek, Grok, Gemini, Qwen, Kimi, GLM, Ling/Ring; cache_control: Claude, Gemini, Qwen).
schema = 2
base_model = "openai/gpt-5.5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 5
cache = { read = 0.5 }

[[cost.text.input.overrides]]
when = { context = { gte = 272_000 } }
price = 10
cache = { read = 1 }

[cost.text.output]
price = 30

[[cost.text.output.overrides]]
when = { context = { gte = 272_000 } }
price = 45

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 2.5

[experimental.modes.fast]
service_tier = "priority"
body = { service_tier = "priority" }
