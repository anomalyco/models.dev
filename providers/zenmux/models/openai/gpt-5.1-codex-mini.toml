# Effort: reasoning_effort = low|medium|high
# https://zenmux.ai/docs/guide/advanced/reasoning.html
base_model = "openai/gpt-5.1-codex-mini"
name = "GPT-5.1-Codex-Mini"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
input = 0.25
output = 2
cache_read = 0.025

[limit]
output = 100_000

[provider]
npm = "@ai-sdk/openai"
api = "https://zenmux.ai/api/v1"
