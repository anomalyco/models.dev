schema = 2
base_model = "openai/gpt-5.4"
base_model_omit = ["limit.input"]
description = "Frontier GPT model for professional reasoning, coding, and multimodal work"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[api.responses]
base_url = "https://zenmux.ai/api/v1"
sdk = { aisdk = "@ai-sdk/openai" }

[cost.text.input]
price = 3.75

[cost.text.output]
price = 18.75
