# Effort: reasoning_effort = none|low|medium|high|xhigh
# https://zenmux.ai/docs/guide/advanced/reasoning.html
base_model = "openai/gpt-5.2"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "xhigh"]

[cost]
input = 1.75
output = 14
cache_read = 0.175

[modalities]
input = ["image", "text", "pdf"]

[provider]
npm = "@ai-sdk/openai"
api = "https://zenmux.ai/api/v1"
