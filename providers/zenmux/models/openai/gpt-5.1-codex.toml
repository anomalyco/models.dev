# Effort: reasoning_effort = low|medium|high
# https://zenmux.ai/docs/guide/advanced/reasoning.html
base_model = "openai/gpt-5.1-codex"
name = "GPT-5.1-Codex"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
input = 1.25
output = 10
cache_read = 0.125

[provider]
npm = "@ai-sdk/openai"
api = "https://zenmux.ai/api/v1"
