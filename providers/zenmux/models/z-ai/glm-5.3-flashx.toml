# Effort: reasoning_effort = low|high|max
# https://zenmux.ai/docs/api/openai/openai-list-models.html
# https://zenmux.ai/docs/guide/advanced/reasoning.html
base_model = "zhipuai/glm-5.3-flash"
name = "GLM 5.3 FlashX"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 0.375
output = 1.25
cache_read = 0.075

[limit]
output = 128_000
