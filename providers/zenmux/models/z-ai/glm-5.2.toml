# Toggle: reasoning.enabled = true|false
# Effort: reasoning_effort = high|xhigh
# https://zenmux.ai/docs/guide/advanced/reasoning.html
base_model = "zhipuai/glm-5.2"
name = "GLM 5.2"
temperature = false
tool_call = false

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["high", "xhigh"]

[cost]
input = 1.4
output = 4.4
cache_read = 0.26

[limit]
output = 128_000
