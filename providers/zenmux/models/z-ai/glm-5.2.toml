# Effort: reasoning_effort = high|max
# https://zenmux.ai/docs/guide/advanced/reasoning.html
base_model = "zhipuai/glm-5.2"
name = "GLM 5.2"

[[reasoning_options]]
type = "effort"
values = ["high", "max"]

[cost]
input = 1.4
output = 4.4
cache_read = 0.26

[limit]
output = 128_000

[interleaved]
field = "reasoning_content"
