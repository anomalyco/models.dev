# Toggle: reasoning.enabled = true|false
# https://zenmux.ai/docs/api/openai/openai-list-models.html
# https://zenmux.ai/docs/guide/advanced/reasoning.html
schema = 2
base_model = "zhipuai/glm-5"
name = "GLM 5"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
context = 200_000
output = 128_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.58
cache = { read = 0.14 }

[[cost.text.input.overrides]]
when = { context = { gt = 32_000 } }
price = 0.87
cache = { read = 0.22 }

[cost.text.output]
price = 2.6

[[cost.text.output.overrides]]
when = { context = { gt = 32_000 } }
price = 3.18
