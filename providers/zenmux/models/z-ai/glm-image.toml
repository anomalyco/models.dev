# ZenMux's 2026-09-19 page and live Google-compatible list expose text input only;
# image editing exists in the lab model but is unavailable on this hosted route.
# ZenMux pricing is non-token-denominated for this route and is intentionally omitted.
# https://zenmux.ai/docs/api/openai/openai-list-models.html
# Images: Vertex AI :predict at https://zenmux.ai/api/vertex-ai only (https://zenmux.ai/docs/api/vertexai/generate-images.html)
schema = 2
base_model = "zhipuai/glm-image"

[modalities]
input = ["text"]
output = ["image"]

[api.images]
base_url = "https://zenmux.ai/api/vertex-ai"
sdk = { aisdk = "none", opencodeai = "none" }
