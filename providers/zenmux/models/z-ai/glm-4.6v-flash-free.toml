# Toggle: reasoning.enabled = true|false
# Host modalities: the live free route includes file/PDF input; the paid route omits it.
# https://zenmux.ai/docs/api/openai/openai-list-models.html
# https://zenmux.ai/docs/guide/advanced/reasoning.html
# Prices, limits and input modalities: ZenMux catalog GET https://zenmux.ai/api/v1/models (2026-10-21).
# Cache: https://docs.zenmux.ai/guide/advanced/prompt-cache.html (implicit: OpenAI, DeepSeek, Grok, Gemini, Qwen, Kimi, GLM, Ling/Ring; cache_control: Claude, Gemini, Qwen).
schema = 2
base_model = "zhipuai/glm-4.6v-flash"
name = "GLM 4.6V Flash (Free)"

[modalities]
input = ["text", "image/jpeg", "image/png", "video/mp4", "video/x-matroska", "video/quicktime", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
cache = { supported = true, implicit = true }

[limit]
context = 200_000
output = 128_000

[cost.text.input]
price = 0
cache = { read = 0 }

[[cost.text.input.overrides]]
when = { context = { gte = 32_000 } }
price = 0
cache = { read = 0 }

[cost.text.output]
price = 0

[[cost.text.output.overrides]]
when = { context = { gte = 32_000 } }
price = 0
