# Effort: reasoning_effort = low|high|max
# https://zenmux.ai/docs/api/openai/openai-list-models.html
# https://zenmux.ai/docs/guide/advanced/reasoning.html
base_model = "zhipuai/glm-5.3"
name = "GLM 5.3"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 1.4
output = 4.4
cache_read = 0.26

[limit]
output = 128_000
