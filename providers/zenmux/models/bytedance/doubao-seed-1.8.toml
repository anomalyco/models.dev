# Effort: reasoning_effort = none|minimal|low|medium|high|xhigh|max
# ZenMux's 2026-09-19 page and both live OpenAI-/Anthropic-compatible lists
# explicitly advertise text, image, and video input for this route.
# https://zenmux.ai/docs/api/openai/openai-list-models.html
# https://zenmux.ai/docs/guide/advanced/reasoning.html
base_model = "bytedance-seed/seed-1-8"
name = "Doubao-Seed-1.8"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["none", "minimal", "low", "medium", "high", "xhigh", "max"]

[cost]
input = 0.11
output = 0.28
cache_read = 0.023
cache_write = 0.0024

[[cost.tiers]]
tier = { type = "context", size = 32_000 }
input = 0.17
output = 2.27
cache_read = 0.023
cache_write = 0.0024

[[cost.tiers]]
tier = { type = "context", size = 128_000 }
input = 0.34
output = 3.41
cache_read = 0.023
cache_write = 0.0024

[limit]
output = 32_000

[modalities]
input = ["text", "image", "video"]
