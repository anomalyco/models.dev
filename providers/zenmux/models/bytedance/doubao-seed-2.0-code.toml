# Effort: reasoning_effort = none|minimal|low|medium|high|xhigh|max
# https://zenmux.ai/docs/api/openai/openai-list-models.html
# https://zenmux.ai/docs/guide/advanced/reasoning.html
base_model = "bytedance-seed/seed-2.0-code"
name = "Doubao-Seed-2.0-Code"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["none", "minimal", "low", "medium", "high", "xhigh", "max"]

[cost]
input = 0.45
output = 2.24
cache_read = 0.09
cache_write = 0.0024

[[cost.tiers]]
tier = { type = "context", size = 32_000 }
input = 0.67
output = 3.36
cache_read = 0.14
cache_write = 0.0024

[[cost.tiers]]
tier = { type = "context", size = 128_000 }
input = 1.34
output = 6.71
cache_read = 0.27
cache_write = 0.0024

[limit]
context = 256_000
output = 32_000
