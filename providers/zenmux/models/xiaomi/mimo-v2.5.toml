schema = 2
base_model = "xiaomi/mimo-v2.5"

[capabilities]
reasoning = { supported = true, toggle = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.4
cache = { read = 0.08 }

[[cost.text.input.overrides]]
when = { context = { gt = 256_000 } }
price = 0.8
cache = { read = 0.16 }

[cost.text.output]
price = 2

[[cost.text.output.overrides]]
when = { context = { gt = 256_000 } }
price = 4
