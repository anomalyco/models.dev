# Toggle: reasoning.enabled = true|false
# Budget: reasoning.max_tokens (integer reasoning tokens)
# Host limits: the 2026-09-19 ZenMux page reports context_length=1024000 and max_completion_tokens=1024000.
# https://zenmux.ai/docs/api/openai/openai-list-models.html
# https://zenmux.ai/docs/guide/advanced/reasoning.html
base_model = "alibaba/qwen3.5-flash"
name = "Qwen3.5-Flash"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 0.1
output = 0.4
cache_read = 0.01
cache_write = 0.125

[limit]
context = 1_024_000
output = 1_024_000
