# Toggle: enable_thinking = true|false
# Effort: reasoning_effort = low|medium|xhigh
# Budget: thinking_budget (max 262144)
# https://zenmux.ai/docs/guide/advanced/reasoning.html
base_model = "alibaba/qwen3.8-flash"
name = "Qwen3.8-Flash"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "xhigh"]

[[reasoning_options]]
type = "budget_tokens"
max = 262_144

[cost]
input = 0.16
output = 0.47
cache_read = 0.016
cache_write = 0.2

[limit]
output = 1_000_000
