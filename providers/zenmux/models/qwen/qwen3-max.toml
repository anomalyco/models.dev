# Toggle: reasoning.enabled = true|false
# Budget: reasoning.max_tokens (integer reasoning tokens)
# Host limits: the 2026-09-19 ZenMux page reports context_length=256000 and max_completion_tokens=32000.
# https://zenmux.ai/docs/api/openai/openai-list-models.html
# https://zenmux.ai/docs/guide/advanced/reasoning.html
base_model = "alibaba/qwen3-max-2026-01-23"
name = "Qwen3-Max-Thinking"
structured_output = true

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 1.2
output = 6
cache_read = 0.12
cache_write = 1.5

[[cost.tiers]]
tier = { type = "context", size = 32_000 }
input = 2.4
output = 12
cache_read = 0.24
cache_write = 3

[[cost.tiers]]
tier = { type = "context", size = 128_000 }
input = 3
output = 15
cache_read = 0.3
cache_write = 3.75

[limit]
context = 256_000
output = 32_000
