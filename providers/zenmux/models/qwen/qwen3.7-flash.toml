# Toggle: enable_thinking = true|false
# Budget: thinking_budget (integer)
# https://zenmux.ai/docs/guide/advanced/reasoning.html
base_model = "alibaba/qwen3.7-flash"
name = "Qwen3.7-Flash"
temperature = false
tool_call = false

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 0.03
output = 0.13
cache_read = 0.006
cache_write = 0.038

[[cost.tiers]]
tier = { type = "context", size = 32_000 }
input = 0.1
output = 0.4
cache_read = 0.01
cache_write = 0.125

[[cost.tiers]]
tier = { type = "context", size = 256_000 }
input = 0.2
output = 0.8
cache_read = 0.04
cache_write = 0.25

[limit]
output = 64_000
