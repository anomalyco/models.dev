schema = 2
base_model = "alibaba/qwen3.6-plus"
name = "Qwen3.6-Plus"
description = "Qwen instruction model for multilingual chat, reasoning, and tool use"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }

[limit]
output = 64_000

[cost.text.input]
price = 0.5
cache = { read = 0.05, write = 0.625 }

[[cost.text.input.overrides]]
when = { context = { gt = 256_000 } }
price = 2
cache = { read = 0.2, write = 2.5 }

[cost.text.output]
price = 3

[[cost.text.output.overrides]]
when = { context = { gt = 256_000 } }
price = 6
