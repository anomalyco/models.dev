# Toggle: reasoning.enabled = true|false
# Budget: reasoning.max_tokens (integer reasoning tokens)
# ZenMux's 2026-09-19 page and both live OpenAI-/Anthropic-compatible lists
# explicitly include file input; the catalog represents that host modality as PDF.
# https://zenmux.ai/docs/api/openai/openai-list-models.html
# https://zenmux.ai/docs/guide/advanced/reasoning.html
base_model = "alibaba/qwen3.6-plus"
name = "Qwen3.6-Plus"
structured_output = true

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 0.5
output = 3
cache_read = 0.05
cache_write = 0.625

[[cost.tiers]]
tier = { type = "context", size = 256_000 }
input = 2
output = 6
cache_read = 0.2
cache_write = 2.5

[limit]
output = 64_000

[modalities]
input = ["text", "image", "pdf", "video"]
