# Toggle: enable_thinking = true|false
# Effort: reasoning_effort = low|medium|xhigh
# Budget: thinking_budget (integer)
# https://zenmux.ai/docs/guide/advanced/reasoning.html
base_model = "alibaba/qwen3.8-max"
name = "Qwen3.8-Max"
temperature = false
tool_call = false

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "xhigh"]

[[reasoning_options]]
type = "budget_tokens"
min = 0
max = 262_144

[cost]
input = 2
output = 6
cache_read = 0.17
cache_write = 2.5

[limit]
output = 64_000

[modalities]
input = ["text", "image", "video"]
