# Effort: reasoning_effort = none|low|medium|high
# https://zenmux.ai/docs/api/openai/openai-list-models.html
# https://zenmux.ai/docs/guide/advanced/reasoning.html
base_model = "xai/grok-4.3"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high"]

[cost]
input = 1.25
output = 2.5
cache_read = 0.2

[[cost.tiers]]
tier = { type = "context", size = 200_000 }
input = 2.5
output = 5
cache_read = 0.4

[limit]
output = 1_000_000
