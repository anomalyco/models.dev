# https://zenmux.ai/docs/api/openai/openai-list-models.html
base_model = "xai/grok-4.20-0309-non-reasoning"
name = "Grok 4.2 Fast Non Reasoning"

[cost]
input = 2
output = 6
cache_read = 0.2

[[cost.tiers]]
tier = { type = "context", size = 128_000 }
input = 4
output = 12
cache_read = 0.2

[limit]
context = 2_000_000

[modalities]
input = ["text", "image"]
