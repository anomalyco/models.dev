# https://zenmux.ai/docs/api/openai/openai-list-models.html
schema = 2
base_model = "xai/grok-4.20-0309-non-reasoning"
name = "Grok 4.2 Fast Non Reasoning"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
structured_output = true

[limit]
context = 2_000_000

[cost.text.input]
price = 2
cache = { read = 0.2 }

[[cost.text.input.overrides]]
when = { context = { gt = 128_000 } }
price = 4
cache = { read = 0.2 }

[cost.text.output]
price = 6

[[cost.text.output.overrides]]
when = { context = { gt = 128_000 } }
price = 12
