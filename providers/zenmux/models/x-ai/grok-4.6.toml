# Effort: reasoning_effort = low|medium|high|xhigh
# https://zenmux.ai/docs/api/openai/openai-list-models.html
# https://zenmux.ai/docs/guide/advanced/reasoning.html
base_model = "xai/grok-4.6"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh"]

[cost]
input = 2
output = 6
cache_read = 0.5

[[cost.tiers]]
tier = { type = "context", size = 200_000 }
input = 4
output = 12
cache_read = 1
