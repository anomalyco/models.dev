# ZenMux's 2026-09-19 page has supports_reasoning=0 and both live OpenAI- and
# Anthropic-compatible entries have capabilities.reasoning=false for this id.
# This route therefore uses the reasoning checkpoint identity but disables the
# reasoning surface as an explicit host delta.
# https://zenmux.ai/docs/api/openai/openai-list-models.html
base_model = "xai/grok-4.20-0309-reasoning"
name = "Grok 4.2 Fast"
reasoning = false

[cost]
input = 2
output = 6
cache_read = 0.2

[[cost.tiers]]
tier = { type = "context", size = 128_000 }
input = 4
output = 12
cache_read = 0.2

[limit]
context = 2_000_000

[modalities]
input = ["text", "image"]
