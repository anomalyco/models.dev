# ZenMux's 2026-09-19 page has supports_reasoning=0 and both live OpenAI- and
# Anthropic-compatible entries have capabilities.reasoning=false for this id.
# https://zenmux.ai/docs/api/openai/openai-list-models.html
# Prices, limits and input modalities: ZenMux catalog GET https://zenmux.ai/api/v1/models (2026-10-21).
# Cache: https://docs.zenmux.ai/guide/advanced/prompt-cache.html (implicit: OpenAI, DeepSeek, Grok, Gemini, Qwen, Kimi, GLM, Ling/Ring; cache_control: Claude, Gemini, Qwen).
schema = 2
base_model = "xai/grok-build-0.1"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
reasoning = { supported = false }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 1
cache = { read = 0.2 }

[cost.text.output]
price = 2
