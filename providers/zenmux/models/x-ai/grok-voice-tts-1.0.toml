# Price: catalog prompt $15 (labelled perMTokens); xAI bills grok-tts at $15 per 1M characters
# (https://docs.x.ai/developers/pricing), so the unit is character. v2 only.
# https://zenmux.ai/docs/api/openai/openai-list-models.html
# ZenMux's "Grok Voice TTS 1.0" route is xAI's grok-tts.
# Prices, limits and input modalities: ZenMux catalog GET https://zenmux.ai/api/v1/models (2026-10-21).
# Speech: POST /api/v1/audio/speech, JSON response with base64 audio (https://zenmux.ai/docs/api/openai/create-audio-speech.html)
schema = 2
base_model = "xai/grok-tts"
name = "Grok Voice TTS 1.0"

[api.speech]
sdk = { aisdk = "none", opencodeai = "none" }

[cost.text.input]
unit = "character"
price = 15
