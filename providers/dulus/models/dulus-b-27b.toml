# Reasoning on Dulus's Chat Completions API (https://control.dulus.ai/v1): top-level
# `reasoning_effort` is relayed to the OVHcloud AI Endpoints upstream that serves this
# tier; `none` disables reasoning, and `enable_thinking = false` is mapped to `none`.
# Levels as published for the same upstream in providers/ovhcloud; tools (incl.
# required/named tool_choice) and JSON mode measured upstream 2026-11-28.
schema = 2
v2_only = true
base_model = "alibaba/qwen3.6-27b"
name = "Dulus B 27B (Qwen3.6-27B)"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high"] }
structured_output = true

[limit]
context = 262_144
