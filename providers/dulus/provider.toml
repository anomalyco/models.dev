# Dulus (https://dulus.ai) is a provider-independent agent platform that also
# serves hosted models behind an OpenAI-compatible Chat Completions endpoint.
# Billing is metered in Fuel on the tokens each call actually uses. Public
# pricing reference: https://dulus.ai/pricing/ (accessed 2026-11-24), which
# lists hosted models from dulus-a-9b at 1x to dulus-x-397b at 4x per token,
# paid with Fuel; the balance is read at GET /v1/fuel
# (https://control.dulus.ai/openapi.json). No public per-model USD list price
# exists, so the model files below intentionally carry no cost fields rather
# than invented ones. Model list: GET https://control.dulus.ai/v1/models
# (accessed 2026-11-24).
name = "Dulus"
env = ["DULUS_API_KEY"]
npm = "@ai-sdk/openai-compatible"
opencodeai = "@opencode/ai/providers/openai-compatible"
api = "https://control.dulus.ai/v1"
doc = "https://dulus.ai"
