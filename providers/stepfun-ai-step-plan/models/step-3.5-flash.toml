# Chat `reasoning_effort` and Messages `output_config.effort` accept low/high
# (accessed 2026-06-25).
# https://platform.stepfun.ai/docs/en/guides/models/step-3.5-flash
base_model = "stepfun/step-3.5-flash"

[[reasoning_options]]
type = "effort"
values = ["low", "high"]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.1
output = 0.3
cache_read = 0.02
