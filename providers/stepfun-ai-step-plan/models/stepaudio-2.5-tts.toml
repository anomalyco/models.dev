# Copied from providers/stepfun-ai/models/stepaudio-2.5-tts.toml (sources there), without [cost].
# - Step Plan models include stepaudio-2.5-tts: https://platform.stepfun.ai/docs/en/step-plan/overview (accessed 2026-11-24)
# - Plan endpoint POST /step_plan/v1/audio/speech: https://platform.stepfun.ai/docs/en/api-reference/audio/create-audio
# - Step Plan is a credit subscription with no per-token price, so no [cost].
schema = 2
v2_only = true
type = "speech"
name = "StepAudio 2.5 TTS"
description = "Speech generation model for controllable voice, narration, and audio delivery"
family = "step-tts"
open_weights = false
release_date = "2026-04-16"
last_updated = "2026-07-02"

[modalities]
input = ["text"]
output = ["audio/wav", "audio/mpeg", "audio/flac", "audio/opus", "audio/pcm"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false

[limit]
context = 0
output = 0

[api.speech]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/protocols/openai-speech" }
