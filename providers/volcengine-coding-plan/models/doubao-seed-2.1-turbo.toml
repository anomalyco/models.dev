# Coding Plan model name from https://www.volcengine.com/docs/82379/1928261
# (accessed 2026-08-26). Subscription tier: no per-token price.
# Effort: reasoning_effort = none|low|high, POST /api/coding/v3/chat/completions.
# The wire also accepts minimal|medium|xhigh|max, but they are not separable.
# Over n=5 runs per level on a prompt hard enough to consume the budget:
#   none  0 0 0 0 0            minimal 0 0 0 0 0     -> same off switch
#   low   578-1148             medium  946-1248      -> medium overlaps low
#   high  1405-1780            xhigh   1008-2085     -> xhigh spans high
# 'max' was re-measured at n=6 against high on the same prompt:
#   high 1406-2402 (median 1928)   max 1321-2537 (median 1785)
# max's median lands *below* high's and the ranges overlap fully, so it is not a
# deeper tier -- declaring it would advertise a level that thinks no more than
# high. Only none|low|high hold up.
# 'none' is kept rather than a toggle because thinking.type=disabled sent together
# with a graded effort is rejected as an invalid combination here.
# Deprecated: no longer in the Coding Plan's supported Model Name list at https://www.volcengine.com/docs/82379/1928261
# (checked 2026-10-21: doubao-seed-evolving, -2.1-pro, -2.1-lite, -2.0-mini, glm-5.3, glm-5.3-flash, deepseek-v4.1-flash(-economy),
# deepseek-v4-flash, deepseek-v4-pro, kimi-k2.8-preview, kimi-k3).
schema = 2
base_model = "bytedance-seed/seed-2.1-turbo"
status = "deprecated"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0
cache = { read = 0 }

[cost.text.output]
price = 0
