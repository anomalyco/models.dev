# Coding Plan model name from https://www.volcengine.com/docs/82379/1928261
# (accessed 2026-08-26). Subscription tier: no per-token price.
# Effort: reasoning_effort = minimal|low|medium|high|xhigh|max, POST /api/coding/v3/chat/completions.
# No toggle: reasoning_effort=none and thinking.type=disabled are both rejected;
# 'minimal' is the lowest accepted setting.
base_model = "moonshotai/kimi-k2.7-code"

[[reasoning_options]]
type = "effort"
values = ["minimal", "low", "medium", "high", "xhigh", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 0
output = 0
cache_read = 0
