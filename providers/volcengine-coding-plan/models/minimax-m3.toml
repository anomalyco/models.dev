# Coding Plan model name from https://www.volcengine.com/docs/82379/1928261
# (accessed 2026-08-26). Subscription tier: no per-token price.
# Toggle: thinking.type = enabled|disabled, POST /api/coding/v3/chat/completions
# Effort: reasoning_effort = minimal|low|medium|high|xhigh|max (same body).
# 'none' is accepted but does not disable thinking here (reasoning_tokens stays
# 24-96 across runs), so thinking.type is the real switch and 'none' is omitted.
base_model = "minimax/MiniMax-M3"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["minimal", "low", "medium", "high", "xhigh", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 0
output = 0
cache_read = 0
