# Coding Plan model name from https://www.volcengine.com/docs/82379/1928261
# (accessed 2026-08-26). Subscription tier: no per-token price.
# Effort: reasoning_effort = none|minimal|low|medium|high|xhigh|max,
# POST /api/coding/v3/chat/completions. 'none' and 'minimal' are the same
# off switch here: both return reasoning_tokens = 0 and an empty
# reasoning_content, so thinking.type would be a redundant second control
# and no toggle is declared. Sending thinking.type=disabled together with a
# graded effort is rejected as an invalid combination on most of these.
base_model = "deepseek/deepseek-v4-flash"

[[reasoning_options]]
type = "effort"
values = ["none", "minimal", "low", "medium", "high", "xhigh", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 0
output = 0
cache_read = 0
