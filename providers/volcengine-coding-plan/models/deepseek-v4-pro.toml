# Coding Plan model name from https://www.volcengine.com/docs/82379/1928261
# (accessed 2026-08-26). Subscription tier: no per-token price.
# Toggle: thinking.type = enabled|disabled, POST /api/coding/v3/chat/completions
# (verified: enabled -> reasoning_tokens 79, disabled -> 0).
# No graded effort: the same body accepts reasoning_effort, but acceptance is not
# effect. Over n=5 runs per level on a prompt hard enough to consume the budget,
# none and minimal were hard zeros (the off switch) while the graded values fully
# overlapped -- low 200/517/616/638/313, high 466/673/604/1075/415,
# max 389/204/240/1535/688. The levels are not separable, so only the toggle is
# declared, matching the toggle the lab (providers/deepseek) exposes.
base_model = "deepseek/deepseek-v4-pro"

[[reasoning_options]]
type = "toggle"

[interleaved]
field = "reasoning_content"

[cost]
input = 0
output = 0
cache_read = 0
