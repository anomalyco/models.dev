# Sources (accessed 2026-09-10):
# https://docs.qwencloud.com/token-plan/personal/token-plan-personal-overview
# https://www.alibabacloud.com/help/en/model-studio/token-plan-overview
# Model update: qwen3.8-max-preview ended preview and is officially retired from
# the Token Plan supported-models allowlist. Docs say legacy calls may still
# route to production qwen3.8-max (Credits billed as qwen3.8-max); clients should
# use model ID qwen3.8-max. Marked deprecated so it is not offered as a current
# Token Plan selection. Prefer providers/.../qwen3.8-max.toml.
# Prior sources (accessed 2026-07-20): thinking always-on; OpenAI-compatible Chat
# effort low/medium/xhigh (high aliases to xhigh); thinking_budget 0..262144
# mutually exclusive with reasoning_effort; preserve_thinking defaults true.
schema = 2
base_model = "alibaba/qwen3.8-max-preview"
status = "deprecated"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "xhigh"], budget = { min = 0, max = 262_144 } }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
