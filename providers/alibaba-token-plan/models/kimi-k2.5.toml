base_model = "moonshotai/kimi-k2.5"
# Reasoning HTTP format (accessed 2026-06-25):
# Hybrid model: top-level `enable_thinking` true enables thinking; false is the
# default. `thinking_budget` is an integer token cap; no bounds are documented.
# structured_output: gateway accepts response_format json_schema (probed
# 2026-07-24), so the earlier base_model_omit was wrong and is dropped.
# Output cap 98,304: the enforced max_tokens ceiling (gateway rejects above it);
# a max_tokens=17,000 request truncated at exactly 17,000 (finish_reason=length),
# disproving the console/price-sheet "16K". This differs from k2.6/k2.7-code's
# 262,144 ceiling.
# Sources:
# https://www.alibabacloud.com/help/en/model-studio/kimi-api
# https://www.alibabacloud.com/help/en/model-studio/deep-thinking
family = "kimi-k2"
attachment = true
temperature = true
reasoning_options = [{ type = "toggle" }, { type = "budget_tokens" }]

[interleaved]
field = "reasoning_content"

[cost]
input = 0
output = 0
cache_read = 0
cache_write = 0

[limit]
output = 98_304
