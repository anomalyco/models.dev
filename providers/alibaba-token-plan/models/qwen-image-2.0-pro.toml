# Type: image generation model (https://www.alibabacloud.com/help/en/model-studio/token-plan-team-overview).
# MIME types: input images JPG, JPEG, PNG, BMP, TIFF, WEBP or GIF; output PNG, per https://www.alibabacloud.com/help/en/model-studio/qwen-image-edit-api.
# API: POST https://token-plan.ap-southeast-1.maas.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation (https://www.alibabacloud.com/help/en/model-studio/token-plan-multimodal-gen)
schema = 2
type = "image"
name = "Qwen Image 2.0 Pro"
description = "Image model for prompt-driven generation, editing, and visual design workflows"
family = "qwen"
open_weights = false
release_date = "2026-03-03"

[modalities]
input = ["text"]
output = ["image/png"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = true

[limit]
context = 8_192
output = 0

[api.images]
base_url = "https://token-plan.ap-southeast-1.maas.aliyuncs.com/api/v1"
sdk = { aisdk = "none", opencodeai = "none" }

[cost.text.input]
price = 0

[cost.text.output]
price = 0
