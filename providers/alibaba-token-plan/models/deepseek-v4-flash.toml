# Deprecated on Alibaba Token Plan (Global): absent from the exact-string
# supported-models allowlist on 2026-10-20; use deepseek-v4.1-flash-1017 or
# deepseek-v4-flash-0731.
# Sources:
# https://docs.qwencloud.com/token-plan/team/token-plan-team-overview
# https://docs.qwencloud.com/api-reference/chat/openai-chat
# Reasoning HTTP format (accessed 2026-06-25):
# This model toggles with `enable_thinking`: true or false. Chat Completions
# `reasoning_effort` accepts high (default) or max; low/medium map to high and
# xhigh maps to max. Anthropic Messages defaults `reasoning_effort` to max.
# Sources:
# https://www.alibabacloud.com/help/en/model-studio/deepseek-api
# https://www.alibabacloud.com/help/en/model-studio/anthropic-api-messages
# Status: no longer on the plan's supported model list (https://www.alibabacloud.com/help/en/model-studio/token-plan-team-overview, accessed 2026-10-19).
# Tools: tool_choice auto|none on every API; no strict tool mode (sources in provider.toml).
schema = 2
base_model = "deepseek/deepseek-v4-flash"
status = "deprecated"

[capabilities]
tools = { supported = true, choice = ["auto", "none"] }
reasoning = { supported = true, toggle = true, effort = ["high", "max"] }
structured_output = true
top_k = false

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
