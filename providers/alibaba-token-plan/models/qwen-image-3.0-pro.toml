# Current canonical Token Plan host and native route (accessed 2026-10-23):
# https://docs.qwencloud.com/token-plan/best-practices/integrate-multimodal-gen
# Token Plan lists qwen-image-3.0-pro as image generation:
# https://www.alibabacloud.com/help/en/model-studio/token-plan-personal-overview
# https://www.alibabacloud.com/help/en/model-studio/token-plan-team-overview
# Marketplace details (up to 4.5k-token input; Image+Text in, Image out) and DashScope curl
# to POST /api/v1/services/aigc/multimodal-generation/generation:
# https://www.qwencloud.com/models/qwen-image-3.0-pro
# API on Token Plan: POST https://token-plan.maas.qwencloudapi.com/api/v1/services/aigc/multimodal-generation/generation
# (https://www.alibabacloud.com/help/en/model-studio/token-plan-multimodal-gen)
# Cost is prepaid Credits subscription, so the applicable media-unit cost is 0; marketplace per-image prices
# are pay-as-you-go and separate from credit debit. Lab metadata is inherited via base_model.
schema = 2
v2_only = true
base_model = "alibaba/qwen-image-3.0-pro"

[api.images]
base_url = "https://token-plan.maas.qwencloudapi.com/api/v1"
sdk = { aisdk = "none", opencodeai = "none" }

[cost.image.output]
price = 0
unit = "image"
