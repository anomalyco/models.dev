# Type: image generation model (https://www.alibabacloud.com/help/en/model-studio/token-plan-team-overview).
# MIME types: input images JPEG, JPG, PNG, BMP, WEBP; output PNG, per https://www.alibabacloud.com/help/en/model-studio/wan-image-generation-and-editing-api-reference.
schema = 2
type = "image"
name = "Wan2.7 Image"
description = "Image model for prompt-driven generation, editing, and visual design workflows"
