# HappyHorse 1.1 reference-to-video. Served on the ASYNC video-synthesis endpoint,
# not the OpenAI-compatible /models list: POST
# https://token-plan.ap-southeast-1.maas.aliyuncs.com/api/v1/services/aigc/video-generation/video-synthesis
# with header `X-DashScope-Async: enable`, then poll GET /api/v1/tasks/{task_id}.
# Family entitlement confirmed live 2026-07-24 on both Token Plan tiers (Personal
# and Team). Credit-billed (prepaid), so per-token cost is 0.
# Sources:
# https://www.alibabacloud.com/help/en/model-studio/happyhorse-text-to-video-api-reference
# https://www.alibabacloud.com/help/en/model-studio/token-plan-overview
# Type: video generation model (https://www.alibabacloud.com/help/en/model-studio/token-plan-team-overview).
# MIME types: input images JPEG, JPG, PNG, WEBP (the doc's image/jpeg, image/png, image/webp); output MP4 (H.264), per https://www.alibabacloud.com/help/en/model-studio/happyhorse-reference-to-video-api-reference.
schema = 2
type = "video"
name = "HappyHorse 1.1 Reference-to-Video"
description = "Video model for reference-guided video generation"
open_weights = false
release_date = "2026-07-17"

[modalities]
input = ["image/jpeg", "image/png", "image/webp", "text"]
output = ["video/mp4"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = true

[limit]
context = 0
output = 0

[cost.text.input]
price = 0

[cost.text.output]
price = 0
