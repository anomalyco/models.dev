# Reasoning HTTP format (accessed 2026-06-25):
# Hybrid, thinking on by default. Chat/DashScope `enable_thinking`: true|false;
# integer `thinking_budget` maximum 262144; no minimum or disable sentinel is
# documented. Responses instead uses `reasoning.effort` and no numeric budget.
# structured_output: the Token Plan gateway accepts response_format json_schema
# (probed 2026-07-24) even though the base model / console report none. Reasoning
# streams in `reasoning_content` (hence [interleaved]).
# Output ceiling 65,536 (probed 2026-07-24: accepts max_tokens 65,536, rejects
# 65,537). The inherited model-metadata value is 64,000; overridden below to
# the gateway-enforced 65,536.
# Sources:
# https://www.alibabacloud.com/help/en/model-studio/deep-thinking
# https://www.alibabacloud.com/help/en/model-studio/compatibility-with-openai-responses-api
# Mid-conversation: tools are a request-level parameter with no add/remove mechanism (tools.updates = false); not probed live (no plan key), so system_updates and effort_updates are left unset. Chat API: https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions.
# Tools: tool_choice auto|none|named on every API, plus required (`any`) on Anthropic Messages; no strict tool mode (sources in provider.toml).
schema = 2
base_model = "alibaba/qwen3.7-plus"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "tool"] }
reasoning = { supported = true, toggle = true, budget = { max = 262_144 } }
structured_output = true

[limit]
output = 65_536

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/alibaba/responses" }

[api.messages]
base_url = "https://token-plan.ap-southeast-1.maas.aliyuncs.com/apps/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/alibaba/messages" }
capabilities = { tools = { choice = ["auto", "none", "required", "tool"] } }

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
