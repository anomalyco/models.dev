# Reasoning HTTP format (accessed 2026-09-15):
# Toggle: enable_thinking = true|false. Thinking content streams on
# `reasoning_content`. Chat Completions `reasoning_effort` accepts the string
# ladder low/high (default)/max on the Token Plan gateway (probed 2026-09-15);
# medium and xhigh are accepted as aliases per family precedent. The vendor
# OpenAI-chat reference publishes integer effort (1-100); the plan gateway
# rejects integers with a 400 for this id (probed 2026-09-15).
# Sources:
# https://docs.qwencloud.com/api-reference/chat/openai-chat
# https://www.alibabacloud.com/help/en/model-studio/deepseek-api
# https://www.alibabacloud.com/help/en/model-studio/token-plan-personal-overview
# https://www.alibabacloud.com/help/en/model-studio/token-plan-team-overview
# Structured output: PARTIAL on this gateway despite the lab row's
# structured_output = true. response_format json_object works, but strict
# json_schema is rejected with 400 "This response_format type is unavailable
# now" in both thinking modes (probed 2026-09-15 on the international Token
# Plan gateway, Personal and Team editions). Omitting this field would
# inherit the lab value and advertise an unsupported capability, so the
# override is explicit.
# Mid-conversation: tools are a request-level parameter with no add/remove mechanism (tools.updates = false); not probed live (no plan key), so system_updates and effort_updates are left unset. Chat API: https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions (the DeepSeek, Kimi and MiniMax series do not support top_k).
# Tools: tool_choice auto|none|required|named on every API except Responses (no required with more than one tool); no strict tool mode (sources in provider.toml).
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = false
top_k = false

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/alibaba/responses" }
capabilities = { tools = { choice = ["auto", "none", "tool"] } }

[api.messages]
base_url = "https://token-plan.ap-southeast-1.maas.aliyuncs.com/apps/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/alibaba/messages" }

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
