# HappyHorse 1.1 text-to-video. Served on the ASYNC video-synthesis endpoint,
# not the OpenAI-compatible /models list, so it does not appear in a /models
# listing: POST https://token-plan.ap-southeast-1.maas.aliyuncs.com/api/v1/services/aigc/video-generation/video-synthesis
# with header `X-DashScope-Async: enable`, then poll GET /api/v1/tasks/{task_id}.
# Entitlement confirmed live 2026-07-24 on both Token Plan tiers (Personal and
# Team keys each accepted a t2v job: task_id + PENDING->RUNNING, no error).
# Credit-billed (prepaid), so per-token cost is 0. Params: resolution 720P/1080P,
# ratio, duration 3-15s.
# Sources:
# https://www.alibabacloud.com/help/en/model-studio/happyhorse-text-to-video-api-reference
# https://www.alibabacloud.com/help/en/model-studio/token-plan-overview
name = "HappyHorse 1.1 Text-to-Video"
description = "Video model for prompt-driven text-to-video generation"
release_date = "2026-07-17"
last_updated = "2026-07-17"
attachment = false
reasoning = false
temperature = true
tool_call = false
open_weights = false

