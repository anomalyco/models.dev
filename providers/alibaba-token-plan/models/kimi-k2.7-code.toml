# Reasoning HTTP format (accessed 2026-06-25):
# Thinking-only model: `enable_thinking` defaults to true and cannot disable
# thinking. `thinking_budget` is an integer token cap; no bounds are documented.
# structured_output: gateway accepts response_format json_schema (probed
# 2026-07-24: a strict schema request returned {"name":"Alice","age":30} with
# finish_reason=stop and no "json" keyword needed), so the earlier
# base_model_omit was wrong and is dropped.
# Sources:
# https://www.alibabacloud.com/help/en/model-studio/kimi-api
# https://www.alibabacloud.com/help/en/model-studio/deep-thinking
# Mid-conversation: tools are a request-level parameter with no add/remove mechanism (tools.updates = false); not probed live (no plan key), so system_updates and effort_updates are left unset. Chat API: https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions (the DeepSeek, Kimi and MiniMax series do not support top_k).
schema = 2
base_model = "moonshotai/kimi-k2.7-code"
family = "kimi-k2"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true, budget = {} }
structured_output = true
top_k = false

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.messages]
base_url = "https://token-plan.ap-southeast-1.maas.aliyuncs.com/apps/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/alibaba/messages" }

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
