# Sampling: Chat Completions forwards temperature and top_p; top_k is not in the request contract.
# Catalog: https://api.anonrouter.ai/v1/models (2026-11-17).
# Route-dependent prices and limits are the default plaintext route snapshot.
# Routing requirements may select another route: https://docs.anonrouter.ai/provider-routing.
# Host-specific fine-tune/serving alias. Checkpoint identity is not shared across its routes.
# Metadata: https://github.com/anomalyco/models.dev/blob/dev/providers/venice/models/glm-5-3-flash-uncensored.toml.
# Effort: top-level reasoning_effort = low|medium|high|max.
# Controls are accepted across eligible routes: https://docs.anonrouter.ai/reasoning.
# Chat Completions accepts text/image_url input and function tools: https://docs.anonrouter.ai/compatibility.
schema = 2
name = "GLM 5.3 Flash Uncensored"
description = "GLM vision model for visual reasoning, documents, and multimodal agents"
family = "glm"
open_weights = true
release_date = "2026-11-13"
last_updated = "2026-11-16"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "max"] }
temperature = true
top_p = true
top_k = false

[limit]
context = 1_048_576
output = 131_072

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.14

[cost.text.output]
price = 0.58
