# Live 2026-11-17: reasoning_effort = "medium" returned HTTP 200 and reasoning_content via deepinfra/deepseek-v4-pro.
# Catalog: https://api.anonrouter.ai/v1/models (2026-11-17).
# Route-dependent prices and limits are the default plaintext route snapshot.
# Routing requirements may select another route: https://docs.anonrouter.ai/provider-routing.
# Effort: top-level reasoning_effort = none|low|medium|high.
# Controls are accepted across eligible routes: https://docs.anonrouter.ai/reasoning.
# Chat Completions accepts text/image_url input and function tools: https://docs.anonrouter.ai/compatibility.
schema = 2
base_model = "deepseek/deepseek-v4-pro"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }

[limit]
context = 1_048_576
output = 131_072

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.58

[cost.text.output]
price = 2.3
