# Sampling: Chat Completions forwards temperature and top_p; top_k is not in the request contract.
# Effort: top-level reasoning_effort = none|low|high|max.
# Uses the checkpoint's distinct levels; accepted medium/xhigh aliases are omitted.
# Live 2026-11-17: reasoning_effort = "medium" returned HTTP 200 and reasoning_content via abliteration/abliterated-model-large-flash.
# Catalog: https://api.anonrouter.ai/v1/models (2026-11-17).
# Route-dependent prices and limits are the default plaintext route snapshot.
# Routing requirements may select another route: https://docs.anonrouter.ai/provider-routing.
# Host-specific fine-tune/serving alias. Checkpoint identity is not shared across its routes.
# Metadata: https://github.com/anomalyco/models.dev/blob/dev/providers/venice/models/deepseek-v4-1-flash-uncensored.toml.
# Controls are accepted across eligible routes: https://docs.anonrouter.ai/reasoning.
# Chat Completions accepts text/image_url input and function tools: https://docs.anonrouter.ai/compatibility.
schema = 2
name = "DeepSeek V4.1 Flash Uncensored"
description = "Fast DeepSeek model for efficient chat, coding help, and agent loops"
family = "deepseek"
open_weights = true
release_date = "2026-10-23"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
temperature = true
top_p = true
top_k = false

[limit]
context = 1_048_576
output = 131_072

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.14

[cost.text.output]
price = 0.52
