# Effort: top-level reasoning_effort = none|low|high.
# Uses the checkpoint's distinct levels; accepted medium/xhigh aliases are omitted.
# Limits retain the documented checkpoint caps; larger catalog claims are not qualified here.
# Live 2026-11-17: reasoning_effort = "medium" returned HTTP 200 and reasoning_content via deepinfra/deepseek-v4-flash.
# Catalog: https://api.anonrouter.ai/v1/models (2026-11-17).
# Route-dependent prices and limits are the default plaintext route snapshot.
# Routing requirements may select another route: https://docs.anonrouter.ai/provider-routing.
# Controls are accepted across eligible routes: https://docs.anonrouter.ai/reasoning.
# Chat Completions accepts text/image_url input and function tools: https://docs.anonrouter.ai/compatibility.
schema = 2
base_model = "deepseek/deepseek-v4-flash"
name = "DeepSeek V4 Flash (Preview)"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high"] }

[limit]
output = 65_536

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.104

[cost.text.output]
price = 0.21
