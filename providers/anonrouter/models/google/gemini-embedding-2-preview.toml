# The file schema requires both modality arrays when either differs from the lab.
# Catalog: https://api.anonrouter.ai/v1/models (2026-11-17).
# Route-dependent prices and limits are the default plaintext route snapshot.
# Routing requirements may select another route: https://docs.anonrouter.ai/provider-routing.
# The embeddings API accepts text strings only: https://docs.anonrouter.ai/compatibility.
schema = 2
v2_only = true
base_model = "google/gemini-embedding-2-preview"

[modalities]
input = ["text"]
output = ["embedding"]

[limit]
context = 2_048

[api.embeddings]
sdk = { opencodeai = "@opencode/ai/providers/openai-compatible/embeddings" }

[cost.text.input]
price = 0.26
