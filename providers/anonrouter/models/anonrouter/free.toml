# Catalog: https://api.anonrouter.ai/v1/models (2026-11-17).
# Route-dependent prices and limits are the default plaintext route snapshot.
# Routing requirements may select another route: https://docs.anonrouter.ai/provider-routing.
# Named router: https://docs.anonrouter.ai/routers. Limits depend on eligible members.
# Free access requires account opt-in: https://docs.anonrouter.ai/free-models.
# Chat Completions accepts text/image_url input and function tools: https://docs.anonrouter.ai/compatibility.
schema = 2
name = "Free Models Router"
description = "Selects an available free model for each request and never selects a paid route."
family = "auto"
open_weights = false
release_date = "2026-10-21"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true

[limit]
context = 65_536
output = 8_192

[api.chat-completions]

[cost.text.input]
price = 0

[cost.text.output]
price = 0
