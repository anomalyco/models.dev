# Source: https://api.anonrouter.ai/v1/models (2026-10-11).
# Capabilities use callable provider_routes; prices and limits use the default route.
# Controls: https://docs.anonrouter.ai/reasoning
# Effort: reasoning_effort.
base_model = "openai/gpt-6.1-sol"
base_model_omit = ["limit.input"]
reasoning_options = [{ type = "effort", values = ["low","medium","high","xhigh","max"] }]

[cost]
input = 2
output = 10

[limit]
context = 272000

[modalities]
input = ["text","image"]
