# Source: https://api.anonrouter.ai/v1/models (2026-10-11).
# Capabilities use callable provider_routes; prices and limits use the default route.
# Controls: https://docs.anonrouter.ai/reasoning
# Effort: reasoning_effort; none disables reasoning.
base_model = "openai/gpt-5.5"
base_model_omit = ["limit.input"]
reasoning_options = [{ type = "effort", values = ["none","low","medium","high","xhigh"] }]

[cost]
input = 5
output = 30

[limit]
context = 272000
output = 16384

[modalities]
input = ["text","image"]
