# Reasoning-capable routes expose no configurable effort or off control.
# Live tickets (2026-11-17) rejected reasoning_effort=low with HTTP 400 (reasoning_effort_not_configurable).
# Live tickets (2026-11-17) rejected reasoning_effort=none with HTTP 400 (reasoning_not_disableable).
# Host catalog capabilities.tools (2026-11-17): cheaperinference/step-5-preview=false.
# Catalog: https://api.anonrouter.ai/v1/models (2026-11-17).
# Route-dependent prices and limits are the default plaintext route snapshot.
# Routing requirements may select another route: https://docs.anonrouter.ai/provider-routing.
# Chat Completions accepts text/image_url input and function tools: https://docs.anonrouter.ai/compatibility.
schema = 2
base_model = "stepfun/step-5-preview"
base_model_omit = ["limit.input"]

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true }

[limit]
output = 64_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.55

[cost.text.output]
price = 4.15
