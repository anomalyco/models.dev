# TopUpSaja relays request bodies verbatim to OpenRouter /chat/completions

# Toggle: reasoning.enabled = true|false
# https://openrouter.ai/docs/guides/best-practices/reasoning-tokens

base_model = "deepseek/deepseek-v4-flash-vision-exp"

[cost]
input = 1.509
output = 4.528
cache_read = 0.048

[limit]
context = 1048576
output = 262144

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]
