# TopUpSaja relays request bodies verbatim to OpenRouter /chat/completions

# Toggle: reasoning.enabled = true|false
# https://openrouter.ai/docs/guides/best-practices/reasoning-tokens

base_model = "moonshotai/kimi-k2.5"

temperature = true

[cost]
input = 2.7
output = 13.5
cache_read = 0.42

[limit]
output = 235929

[[reasoning_options]]
type = "toggle"

[modalities]
input = ["text", "image"]

[interleaved]
field = "reasoning_details"
