# TopUpSaja relays request bodies verbatim to OpenRouter /chat/completions

# Toggle: reasoning.enabled = true|false
# https://openrouter.ai/docs/guides/best-practices/reasoning-tokens

base_model = "moonshotai/kimi-k2.6"

[cost]
input = 5.7
output = 24
cache_read = 0.96

[limit]
output = 235929

[[reasoning_options]]
type = "toggle"

[modalities]
input = ["text", "image"]

[interleaved]
field = "reasoning_details"
