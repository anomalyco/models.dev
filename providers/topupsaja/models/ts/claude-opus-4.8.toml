# Toggle: reasoning.enabled = true|false
# https://openrouter.ai/docs/guides/best-practices/reasoning-tokens

base_model = "anthropic/claude-opus-4-8"

[cost]
input = 25
output = 125
cache_read = 2.5

[limit]
context = 1000000
output = 128000

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh", "max"]
