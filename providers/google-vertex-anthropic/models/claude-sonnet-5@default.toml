# v2 capabilities and prices:
# - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/partner-models/claude/prompt-caching (5m and 1h TTLs; 1h writes cost 2x input)
# - https://platform.claude.com/docs/en/build-with-claude/prompt-caching (4 breakpoints; minimum cacheable length on Google Cloud)
# - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/partner-models/claude/structured-outputs (Claude 4.5 and later)
# - https://cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing
# Regional and multi-region (us, eu) endpoints cost 10% more than the global endpoint.
# Mid-conversation updates follow the per-model lists in Anthropic's docs, which cover Google Cloud:
# - https://platform.claude.com/docs/en/build-with-claude/mid-conversation-system-messages (system messages; tool changes by reference)
# - https://platform.claude.com/docs/en/build-with-claude/effort#change-effort-mid-conversation-beta (per-message effort)
# system_updates = false: Anthropic's mid-conversation system message docs, which cover Google Cloud, say the feature
# isn't available on Sonnet 5, and Google Cloud's Claude docs don't mention it. The first-party API accepting it live
# isn't documented for Vertex, and Vertex Claude can't be tested with an API key (rawPredict needs OAuth).
schema = 2
base_model = "anthropic/claude-sonnet-5"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
system_updates = false
effort_updates = false
cache = { supported = true, implicit = false, explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 1_024 } }

[limit]
output = 128_000

[cost.text.input]
price = 2
cache = { read = 0.2, write = { "5m" = 2.5, "1h" = 4 } }

[cost.text.output]
price = 10

[[cost.multipliers]]
when = { not = { region = { equals = "global" } } }
factor = 1.1
