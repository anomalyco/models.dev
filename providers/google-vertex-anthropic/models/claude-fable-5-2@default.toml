# Availability: claude-fable-5-2, GA, us and eu multi-region and global endpoints, 1M input / 128K output, text, image and PDF input: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/partner-models/claude/fable-5-2
# Cost left out: Google sets Claude prices on Google Cloud (https://platform.claude.com/docs/en/about-claude/pricing#cloud-platform-pricing) and its partner-model price list (https://cloud.google.com/model-garden/partner-models/pricing) doesn't list Fable 5.2 yet (checked 2026-11-09).
#   When it does: Google's model page says fast mode costs 2x the standard rates for every token type, with web search at the standard rate, and multi-region endpoints cost 10% more than global (https://platform.claude.com/docs/en/about-claude/pricing#cloud-platform-pricing).
# Cache: 5m and 1h TTLs, 4 breakpoints, 512-token minimum on Google Cloud (Google managed): https://platform.claude.com/docs/en/build-with-claude/prompt-caching#cache-limitations, https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/partner-models/claude/prompt-caching
# Mid-conversation updates follow the per-model, per-platform lists in Anthropic's docs, which cover Claude Models on Google Cloud (Google managed):
# - https://platform.claude.com/docs/en/build-with-claude/mid-conversation-system-messages (system messages; tool changes by reference with mid-conversation-tool-changes-2026-07-01)
# - https://platform.claude.com/docs/en/build-with-claude/effort#change-effort-mid-conversation-beta (per-message effort lists Fable 5.2 on Google managed)
# Effort: output_config.effort = low|medium|high|xhigh|max: https://platform.claude.com/docs/en/build-with-claude/effort
# Fast mode: "speed": "fast" in online prediction requests to claude-fable-5-2 (Google's model page above; https://platform.claude.com/docs/en/build-with-claude/fast-mode#feature-availability).
schema = 2
base_model = "anthropic/claude-fable-5-2"

[capabilities]
tools = { supported = true, updates = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
system_updates = true
effort_updates = true
cache = { explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 512 } }
service_tier = ["fast"]

[experimental.modes.fast]
body = { speed = "fast" }
