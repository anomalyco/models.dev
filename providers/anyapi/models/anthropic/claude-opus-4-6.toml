# AnyAPI accepts thinking.type="enabled" with budget_tokens, but documents no
# model-specific 1,024..127,999 bounds or off mapping; these remain upstream facts.
# https://docs.anyapi.ai/guides/parameters
# https://docs.anthropic.com/en/docs/build-with-claude/extended-thinking
schema = 2
base_model = "anthropic/claude-opus-4-6"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high"], budget = { min = 1_024, max = 127_999 } }

[experimental.modes.fast]
body = { speed = "fast" }
headers = { anthropic-beta = "fast-mode-2026-02-01" }

[experimental.modes.fast.cost.text.input]
price = 30
cache = { read = 3, write = 37.5 }

[experimental.modes.fast.cost.text.output]
price = 150
