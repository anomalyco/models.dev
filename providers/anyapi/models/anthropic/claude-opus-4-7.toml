# AnyAPI documents generic effort and thinking fields, but no Opus 4.7-specific
# mapping or budget bounds; accepted schema does not prove effective control.
# https://docs.anyapi.ai/guides/parameters
schema = 2
base_model = "anthropic/claude-opus-4-7"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high"] }

[experimental.modes.fast]
body = { speed = "fast" }
headers = { anthropic-beta = "fast-mode-2026-02-01" }

[experimental.modes.fast.cost.text.input]
price = 30
cache = { read = 3, write = 37.5 }

[experimental.modes.fast.cost.text.output]
price = 150
