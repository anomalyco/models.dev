# AnyAPI accepts low/medium/high generically but documents no model-specific
# effectiveness; unsupported parameters may be silently ignored.
# https://docs.anyapi.ai/guides/parameters
schema = 2
base_model = "openai/gpt-5.4"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[experimental.modes.fast]
service_tier = "priority"
body = { service_tier = "priority" }

[experimental.modes.fast.cost.text.input]
price = 5
cache = { read = 0.5 }

[experimental.modes.fast.cost.text.output]
price = 30
