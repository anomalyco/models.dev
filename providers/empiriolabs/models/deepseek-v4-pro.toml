# Synced from https://api.empiriolabs.ai/v1/models (accessed 2026-10-21); model page https://docs.empiriolabs.ai/models/deepseek-v4-pro.md
# Effort: reasoning_effort = none|low|medium|high|max
# Budget: thinking_budget (integer reasoning tokens)
# Mid-conversation flags unset: EmpirioLabs forwards multiple system messages to the upstream as-is
# (https://docs.empiriolabs.ai/compatibility.md) but documents no cache or effort/tool update behavior; not tested live.
# APIs: /v1/chat/completions, /v1/responses, /v1/messages, /v1beta/models/deepseek-v4-pro:generateContent
schema = 2
base_model = "deepseek/deepseek-v4-pro"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"], budget = { min = 1, max = 393_216 } }
structured_output = true

[limit]
output = 393_216

[cost.text.input]
price = 1.65
cache = { read = 1.65 }

[cost.text.output]
price = 3.3
