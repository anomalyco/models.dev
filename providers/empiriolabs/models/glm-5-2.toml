# Synced from https://api.empiriolabs.ai/v1/models (accessed 2026-10-21); model page https://docs.empiriolabs.ai/models/glm-5-2.md
# Effort: reasoning_effort = none|minimal|low|medium|high|xhigh|max
# Mid-conversation flags unset: EmpirioLabs forwards multiple system messages to the upstream as-is
# (https://docs.empiriolabs.ai/compatibility.md) but documents no cache or effort/tool update behavior; not tested live.
# APIs: /v1/chat/completions, /v1/responses, /v1/messages, /v1beta/models/glm-5-2:generateContent
schema = 2
base_model = "zhipuai/glm-5.2"
name = "GLM 5.2"

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 1.4
cache = { read = 1.4 }

[cost.text.output]
price = 4.4
