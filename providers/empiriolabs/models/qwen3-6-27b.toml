# Synced from https://api.empiriolabs.ai/v1/models (accessed 2026-10-21); model page https://docs.empiriolabs.ai/models/qwen3-6-27b.md
# Effort: reasoning_effort = none|low|medium|high|max
# Budget: thinking_budget (integer reasoning tokens)
# Mid-conversation flags unset: EmpirioLabs forwards multiple system messages to the upstream as-is
# (https://docs.empiriolabs.ai/compatibility.md) but documents no cache or effort/tool update behavior; not tested live.
# APIs: /v1/chat/completions, /v1/responses, /v1/messages, /v1beta/models/qwen3-6-27b:generateContent
schema = 2
base_model = "alibaba/qwen3.6-27b"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"], budget = { min = 1, max = 80_000 } }
structured_output = true

[limit]
context = 256_000
output = 64_000

[cost.text.input]
price = 0.412564
cache = { read = 0.412564 }

[cost.text.output]
price = 2.475384
