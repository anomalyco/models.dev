# Synced from https://api.empiriolabs.ai/v1/models (accessed 2026-10-21); model page https://docs.empiriolabs.ai/models/qwen3-8-max.md
# Effort: reasoning_effort = none|low|medium|high|max
#   (model page: "low, medium, high, and max set bounded thinking budgets sized to the selected model")
# Budget: thinking_budget (integer reasoning tokens)
# MIME: the lab's types for the media kinds EmpirioLabs lists; EmpirioLabs documents no format list.
# Mid-conversation flags unset: EmpirioLabs forwards multiple system messages to the upstream as-is
# (https://docs.empiriolabs.ai/compatibility.md) but documents no cache or effort/tool update behavior; not tested live.
# APIs: /v1/chat/completions, /v1/responses, /v1/messages, /v1beta/models/qwen3-8-max:generateContent
# Modalities: catalog input_modalities = text, image, video (no `file`, so no PDF); this narrows the lab where it lists more.
schema = 2
base_model = "alibaba/qwen3.8-max"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic", "video/mp4", "video/x-msvideo", "video/x-matroska", "video/quicktime", "video/x-flv", "video/x-ms-wmv"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"], budget = { min = 1, max = 262_144 } }
structured_output = true

[cost.text.input]
price = 2
cache = { read = 2 }

[cost.text.output]
price = 6
