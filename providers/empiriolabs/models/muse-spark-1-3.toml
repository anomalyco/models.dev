# Synced from https://api.empiriolabs.ai/v1/models (accessed 2026-10-21); model page https://docs.empiriolabs.ai/models/muse-spark-1-3.md
# Effort: reasoning_effort = minimal|low|medium|high|xhigh
# Cache: model page prices an "Implicit cache read" row.
# MIME: the lab's types for the media kinds EmpirioLabs lists; EmpirioLabs documents no format list.
# Mid-conversation flags unset: EmpirioLabs forwards multiple system messages to the upstream as-is
# (https://docs.empiriolabs.ai/compatibility.md) but documents no cache or effort/tool update behavior; not tested live.
# APIs: /v1/chat/completions, /v1/responses, /v1/messages, /v1beta/models/muse-spark-1-3:generateContent
schema = 2
base_model = "meta/muse-spark-1.3"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "video/mp4"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh"] }
structured_output = true
cache = { supported = true, implicit = true }

[cost.text.input]
price = 1.25
cache = { read = 1 }

[cost.text.output]
price = 4.25
