# Toggle: enable_thinking = true|false
# Effort: reasoning_effort = low|medium|high
# https://empiriolabs.ai/models/seed-2-0-code
# Synced from https://api.empiriolabs.ai/v1/models (accessed 2026-10-21); model page https://docs.empiriolabs.ai/models/seed-2-0-code.md
# Mid-conversation flags unset: EmpirioLabs forwards multiple system messages to the upstream as-is
# (https://docs.empiriolabs.ai/compatibility.md) but documents no cache or effort/tool update behavior; not tested live.
# APIs: /v1/chat/completions, /v1/responses, /v1/messages, /v1beta/models/seed-2-0-code:generateContent
schema = 2
base_model = "bytedance-seed/seed-2.0-code"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high"] }
structured_output = false

[limit]
context = 256_000
output = 128_000

[cost.text.input]
price = 0.4
cache = { read = 0.4 }

[[cost.text.input.overrides]]
when = { context = { gt = 128_000 } }
price = 0.8
cache = { read = 0.8 }

[cost.text.output]
price = 2.4

[[cost.text.output.overrides]]
when = { context = { gt = 128_000 } }
price = 4.8
