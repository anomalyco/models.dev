schema = 2
name = "Qwen3.5 4B"
description = "Qwen3.5 4B is a low-cost multimodal reasoning model with 256K context, image and video input, function tools, and structured output."
open_weights = true
release_date = "2026-03-02"

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"], budget = { min = 1_024, max = 32_768 } }
structured_output = true
temperature = true

[limit]
context = 262_144
output = 32_768

[cost.text.input]
price = 0.04
cache = { read = 0.02 }

[cost.text.output]
price = 0.07
