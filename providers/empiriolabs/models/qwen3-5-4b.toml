schema = 2
base_model = "alibaba/qwen3.5-4b"
description = "Qwen3.5 4B is a low-cost multimodal reasoning model with 256K context, image and video input, function tools, and structured output."

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"], budget = { min = 1_024, max = 32_768 } }
structured_output = true
cache = { supported = true }

[limit]
output = 32_768

[cost.text.input]
price = 0.04
cache = { read = 0.02 }

[cost.text.output]
price = 0.07
