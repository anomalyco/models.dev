# Synced from https://api.empiriolabs.ai/v1/models (accessed 2026-10-21); model page https://docs.empiriolabs.ai/models/kimi-k3.md
# Effort: reasoning_effort = low|high|max
# Mid-conversation flags unset: EmpirioLabs forwards multiple system messages to the upstream as-is
# (https://docs.empiriolabs.ai/compatibility.md) but documents no cache or effort/tool update behavior; not tested live.
# APIs: /v1/chat/completions, /v1/responses, /v1/messages, /v1beta/models/kimi-k3:generateContent
schema = 2
base_model = "moonshotai/kimi-k3"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
context = 1_000_000

[cost.text.input]
price = 3
cache = { read = 3 }

[cost.text.output]
price = 15
