# Synced from https://api.empiriolabs.ai/v1/models (accessed 2026-10-21); model page https://docs.empiriolabs.ai/models/fugu-max.md
# Effort: reasoning_effort = high|xhigh|max
# Cache: model page prices an "Implicit cache read" row.
# Mid-conversation flags unset: EmpirioLabs forwards multiple system messages to the upstream as-is
# (https://docs.empiriolabs.ai/compatibility.md) but documents no cache or effort/tool update behavior; not tested live.
# APIs: /v1/chat/completions, /v1/responses, /v1/messages, /v1beta/models/fugu-max:generateContent
schema = 2
base_model = "sakana/fugu-max"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["high", "xhigh", "max"] }
structured_output = true
cache = { supported = true, implicit = true }

[limit]
output = 131_072

[cost.text.input]
price = 2
cache = { read = 0.25 }

[cost.text.output]
price = 6
