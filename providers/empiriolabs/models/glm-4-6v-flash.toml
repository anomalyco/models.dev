# Synced from https://api.empiriolabs.ai/v1/models (accessed 2026-10-21); model page https://docs.empiriolabs.ai/models/glm-4-6v-flash.md
# Toggle: enable_thinking = true|false
# Cache: model page prices an "Implicit cache read" row.
# MIME: the lab's types for the media kinds EmpirioLabs lists; EmpirioLabs documents no format list.
# Mid-conversation flags unset: EmpirioLabs forwards multiple system messages to the upstream as-is
# (https://docs.empiriolabs.ai/compatibility.md) but documents no cache or effort/tool update behavior; not tested live.
# APIs: /v1/chat/completions, /v1/responses, /v1/messages, /v1beta/models/glm-4-6v-flash:generateContent
# Modalities: catalog input_modalities = text, image, video, file (`file` = PDF in the sync); the model page lists "image, video, file, and text understanding" and the document_understanding feature. PDF is a host addition over the lab.
schema = 2
base_model = "zhipuai/glm-4.6v-flash"
name = "GLM 4.6V Flash"

[modalities]
input = ["text", "image/jpeg", "image/png", "video/mp4", "video/x-matroska", "video/quicktime", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
cache = { supported = true, implicit = true }

[cost.text.input]
price = 0

[cost.text.output]
price = 0
