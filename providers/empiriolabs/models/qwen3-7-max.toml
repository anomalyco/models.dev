# Synced from https://api.empiriolabs.ai/v1/models (accessed 2026-10-21); model page https://docs.empiriolabs.ai/models/qwen3-7-max.md
# Effort: reasoning_effort = none|low|medium|high|max
# Budget: thinking_budget (integer reasoning tokens)
# Mid-conversation flags unset: EmpirioLabs forwards multiple system messages to the upstream as-is
# (https://docs.empiriolabs.ai/compatibility.md) but documents no cache or effort/tool update behavior; not tested live.
# APIs: /v1/chat/completions, /v1/responses, /v1/messages, /v1beta/models/qwen3-7-max:generateContent
schema = 2
base_model = "alibaba/qwen3.7-max"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"], budget = { min = 1, max = 64_000 } }
structured_output = true

[limit]
output = 65_536

[cost.text.input]
price = 2.5
cache = { read = 2.5 }

[cost.text.output]
price = 7.5
