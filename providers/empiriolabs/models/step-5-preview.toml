# Synced from https://api.empiriolabs.ai/v1/models (accessed 2026-10-21); model page https://docs.empiriolabs.ai/models/step-5-preview.md
# Effort: reasoning_effort = low|medium|high
# Cache: model page prices an "Implicit cache read" row.
# Mid-conversation flags unset: EmpirioLabs forwards multiple system messages to the upstream as-is
# (https://docs.empiriolabs.ai/compatibility.md) but documents no cache or effort/tool update behavior; not tested live.
# APIs: /v1/chat/completions, /v1/responses, /v1/messages, /v1beta/models/step-5-preview:generateContent
schema = 2
base_model = "stepfun/step-5-preview"
base_model_omit = ["limit.input"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 1_024_000
output = 131_072

[cost.text.input]
price = 1
cache = { read = 0.05 }

[cost.text.output]
price = 2.7
