# Synced from https://api.empiriolabs.ai/v1/models (accessed 2026-10-21); model page https://docs.empiriolabs.ai/models/muse-spark-1-1.md
# Effort: reasoning_effort = minimal|low|medium|high|xhigh
# Cache: model page prices an "Implicit cache read" row.
# MIME: image and video from the lab; audio per the model page ("MP3/WAV audio").
# Mid-conversation flags unset: EmpirioLabs forwards multiple system messages to the upstream as-is
# (https://docs.empiriolabs.ai/compatibility.md) but documents no cache or effort/tool update behavior; not tested live.
# APIs: /v1/chat/completions, /v1/responses, /v1/messages, /v1beta/models/muse-spark-1-1:generateContent
# Modalities: catalog input_modalities = text, image, video, audio, document. The sync maps only `file` to PDF, so the model page's PDF support is not listed (open item).
schema = 2
base_model = "meta/muse-spark-1.1"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "video/mp4", "audio/mpeg", "audio/wav"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh"] }
structured_output = true
cache = { supported = true, implicit = true }

[cost.text.input]
price = 1.25
cache = { read = 1 }

[cost.text.output]
price = 4.25
