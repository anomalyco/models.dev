schema = 2
base_model = "meta/muse-spark-1.1"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "video/mp4", "audio/mpeg", "audio/wav"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh"] }
structured_output = true
cache = { supported = true }

[cost.text.input]
price = 1.25
cache = { read = 1 }

[cost.text.output]
price = 4.25
