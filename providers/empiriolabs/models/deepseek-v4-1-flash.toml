# Synced from https://api.empiriolabs.ai/v1/models (accessed 2026-10-21); model page https://docs.empiriolabs.ai/models/deepseek-v4-1-flash.md
# Effort: reasoning_effort = none|low|medium|high|max
#   (model page: each level sets a bounded thinking budget, "translated into enable_thinking and thinking_budget for the model service")
# Budget: thinking_budget (integer reasoning tokens)
# Mid-conversation flags unset: EmpirioLabs forwards multiple system messages to the upstream as-is
# (https://docs.empiriolabs.ai/compatibility.md) but documents no cache or effort/tool update behavior; not tested live.
# APIs: /v1/chat/completions, /v1/responses, /v1/messages, /v1beta/models/deepseek-v4-1-flash:generateContent
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"], budget = { min = 1, max = 393_216 } }
structured_output = true

[limit]
output = 393_216

[cost.text.input]
price = 0.3
cache = { read = 0.3 }

[cost.text.output]
price = 1.2
