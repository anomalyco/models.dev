# Synced from https://api.empiriolabs.ai/v1/models (accessed 2026-10-21); model page https://docs.empiriolabs.ai/models/qwen3-6-flash.md
# Effort: reasoning_effort = none|low|medium|high|max
#   (model page: "low, medium, high, and max set bounded thinking budgets sized to the selected model")
# Budget: thinking_budget (integer reasoning tokens)
# Mid-conversation flags unset: EmpirioLabs forwards multiple system messages to the upstream as-is
# (https://docs.empiriolabs.ai/compatibility.md) but documents no cache or effort/tool update behavior; not tested live.
# APIs: /v1/chat/completions, /v1/responses, /v1/messages, /v1beta/models/qwen3-6-flash:generateContent
schema = 2
base_model = "alibaba/qwen3.6-flash"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"], budget = { min = 1, max = 64_000 } }
structured_output = true

[cost.text.input]
price = 0.25
cache = { read = 0.25 }

[[cost.text.input.overrides]]
when = { context = { gt = 256_000 } }
price = 1
cache = { read = 1 }

[cost.text.output]
price = 1.5

[[cost.text.output.overrides]]
when = { context = { gt = 256_000 } }
price = 4
