# Pricing: https://bettertoken.ai/api/pricing (public, accessed 2026-10-15).
# BetterToken bills official list price x group ratio 0.68 (Claude group); values below are effective USD per 1M tokens.
# Endpoint: POST https://bettertoken.ai/v1/chat/completions (also anthropic, openai).
# Reasoning wire (BetterToken new-api fork, relay/channel/claude/relay-claude.go + dto/openai_request.go): Chat accepts reasoning_effort and
# OpenRouter-style reasoning={enabled,effort,max_tokens} and renders them to the upstream's native controls; option set mirrors providers/openrouter/models/anthropic/claude-haiku-5.5.toml.
base_model = "anthropic/claude-haiku-5-5"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh", "max"]

[cost]
input = 0.068
output = 0.34
cache_read = 0.0068
cache_write = 0.085

[[cost.tiers]]
tier = { type = "context", size = 100_000 }
input = 0.34
output = 1.7
cache_read = 0.034
cache_write = 0.425
