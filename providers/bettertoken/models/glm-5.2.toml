# Pricing: https://bettertoken.ai/api/pricing (public, accessed 2026-10-15).
# BetterToken bills official list price x group ratio 0.75 (GLM group); values below are effective USD per 1M tokens.
# Endpoint: POST https://bettertoken.ai/v1/chat/completions (also openai, anthropic).
# Reasoning wire (BetterToken new-api fork, relay/channel/claude/relay-claude.go + dto/openai_request.go): Chat accepts reasoning_effort and
# OpenRouter-style reasoning={enabled,effort,max_tokens} and renders them to the upstream's native controls; option set mirrors providers/openrouter/models/z-ai/glm-5.2.toml.
base_model = "zhipuai/glm-5.2"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["high", "xhigh"]

[cost]
input = 1.05
output = 3.3
cache_read = 0.195
