# Pricing: https://bettertoken.ai/api/pricing (public, accessed 2026-10-15).
# BetterToken bills official list price x group ratio 0.68 (KIMI group); values below are effective USD per 1M tokens.
# Endpoint: POST https://bettertoken.ai/v1/chat/completions (also openai, anthropic).
# Reasoning wire (BetterToken new-api fork, relay/channel/claude/relay-claude.go + dto/openai_request.go): Chat accepts reasoning_effort and
# OpenRouter-style reasoning={enabled,effort,max_tokens} and renders them to the upstream's native controls; option set mirrors providers/openrouter/models/moonshotai/kimi-k3.toml.
base_model = "moonshotai/kimi-k3"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 2.04
output = 10.2
cache_read = 0.204
cache_write = 2.04
