# Prices from https://bettertoken.ai/api/pricing, checked 2026-11-28. USD per 1M tokens.
# OpenAI-compatible Chat Completions: POST https://bettertoken.ai/v1/chat/completions
# Reasoning and structured output follow providers/openai/models/gpt-6.2-astra.toml.
# Custom tool formats are unverified on BetterToken Chat Completions.
schema = 2
base_model = "openai/gpt-6.2-astra"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 5.44
cache = { read = 0.272 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 10.88
cache = { read = 0.544 }

[cost.text.output]
price = 27.2

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 40.8
