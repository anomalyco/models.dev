# Prices from https://bettertoken.ai/api/pricing, checked 2026-11-28. USD per 1M tokens.
# Anthropic Messages: POST https://bettertoken.ai/v1/messages
# Reasoning and structured output follow providers/anthropic/models/claude-haiku-4-5-20251001.toml.
# Toggle: thinking.type = enabled|disabled
schema = 2
base_model = "anthropic/claude-haiku-4-5-20251001"

[capabilities]
reasoning = { supported = true, toggle = true, budget = { min = 1_024 } }
structured_output = true
cache = { explicit = { ttl = ["5m"] } }

[api.messages]
base_url = "https://bettertoken.ai/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.68
cache = { read = 0.068, write = { "5m" = 0.85 } }

[cost.text.output]
price = 3.4
