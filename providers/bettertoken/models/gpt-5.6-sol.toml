# Pricing: https://bettertoken.ai/api/pricing (fetched 2026-11-15).
# Effective USD per 1M tokens: official list price × GPT group ratio 0.68.
# Chat Completions: POST https://bettertoken.ai/v1/chat/completions.
# Relay accepts reasoning_effort and reasoning={enabled,effort,max_tokens} and maps them to the upstream controls.
# Off is effort=none; graded levels, no toggle
schema = 2
base_model = "openai/gpt-5.6-sol"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 2.72
cache = { read = 0.272, write = 3.4 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 5.44
cache = { read = 0.544, write = 6.8 }

[cost.text.output]
price = 13.6

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 20.4
