# Prices from https://bettertoken.ai/api/pricing, checked 2026-11-28. USD per 1M tokens.
# OpenAI-compatible Chat Completions: POST https://bettertoken.ai/v1/chat/completions
# Reasoning and structured output follow providers/minimax/models/MiniMax-M3.toml.
# Toggle: thinking.type = adaptive|disabled
schema = 2
base_model = "minimax/MiniMax-M3"

[capabilities]
reasoning = { supported = true, default = { type = "toggle", value = false }, toggle = true }
structured_output = false
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.174
cache = { read = 0.0348 }

[[cost.text.input.overrides]]
when = { context = { gt = 512_000 } }
price = 0.348
cache = { read = 0.0696 }

[cost.text.output]
price = 0.696

[[cost.text.output.overrides]]
when = { context = { gt = 512_000 } }
price = 1.392
