# Pricing: https://bettertoken.ai/api/pricing (fetched 2026-11-15).
# Effective USD per 1M tokens: official list price × GLM group ratio 0.75.
# Chat Completions: POST https://bettertoken.ai/v1/chat/completions.
# Relay accepts reasoning_effort and reasoning={enabled,effort,max_tokens} and maps them to the upstream controls.
# Effort: reasoning_effort = low|high|max (always enabled; no toggle)
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "max" }, effort = ["low", "high", "max"] }

[cost.text.input]
price = 0.1125
cache = { read = 0.0225 }

[cost.text.output]
price = 0.375
