# Prices from https://bettertoken.ai/api/pricing, checked 2026-11-28. USD per 1M tokens.
# OpenAI-compatible Chat Completions: POST https://bettertoken.ai/v1/chat/completions
# Reasoning and structured output follow providers/zhipuai/models/glm-5.3-flash.toml.
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "max" }, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.1125
cache = { read = 0.0225 }

[cost.text.output]
price = 0.375
