# Prices from https://bettertoken.ai/api/pricing, checked 2026-11-28. USD per 1M tokens.
# OpenAI-compatible Chat Completions: POST https://bettertoken.ai/v1/chat/completions
# Reasoning and structured output follow providers/openai/models/gpt-6.1-terra.toml.
# Custom tool formats are unverified on BetterToken Chat Completions.
schema = 2
base_model = "openai/gpt-6.1-terra"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.68
cache = { read = 0.034 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 1.36
cache = { read = 0.068 }

[cost.text.output]
price = 3.4

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 5.1
