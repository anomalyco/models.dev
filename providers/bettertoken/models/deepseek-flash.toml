# Pricing: https://bettertoken.ai/api/pricing (public, accessed 2026-10-15).
# BetterToken describes deepseek-flash as an alias of deepseek/deepseek-v4.1-flash (pricing description field).
# BetterToken bills official list price x group ratio 0.78 (DeepSeek group); values below are effective USD per 1M tokens.
# Endpoint: POST https://bettertoken.ai/v1/chat/completions (also openai, anthropic).
# Reasoning wire (BetterToken new-api fork, relay/channel/claude/relay-claude.go + dto/openai_request.go): Chat accepts reasoning_effort and
# OpenRouter-style reasoning={enabled,effort,max_tokens} and renders them to the upstream's native controls; option set mirrors providers/openrouter/models/deepseek/deepseek-v4.1-flash.toml.
base_model = "deepseek/deepseek-v4.1-flash"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 0.234
output = 0.936
cache_read = 0.00468
