# Prices from https://bettertoken.ai/api/pricing, checked 2026-11-28. USD per 1M tokens.
# OpenAI-compatible Chat Completions: POST https://bettertoken.ai/v1/chat/completions
# Reasoning and structured output follow providers/deepseek/models/deepseek-flash.toml.
# Toggle: thinking.type = enabled|disabled
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"
name = "DeepSeek Flash"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "high" }, toggle = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.234
cache = { read = 0.00468 }

[cost.text.output]
price = 0.936
