# Prices from https://bettertoken.ai/api/pricing, checked 2026-11-28. USD per 1M tokens.
# Anthropic Messages: POST https://bettertoken.ai/v1/messages
# Reasoning and structured output follow providers/anthropic/models/claude-opus-5-5.toml.
schema = 2
base_model = "anthropic/claude-opus-5-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"], default = { type = "effort", value = "medium" } }
structured_output = true
cache = { explicit = { ttl = ["5m", "1h"] } }

[api.messages]
base_url = "https://bettertoken.ai/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 2.72
cache = { read = 0.136, write = { "5m" = 3.4, "1h" = 5.44 } }

[cost.text.output]
price = 13.6
