# Source: ngrok.ai catalog, provider `tokenhub` (default route for this ID), accessed 2026-11-12.
# Prices = provider list price + $0.05/M processing fee on all request and response tokens:
# https://ngrok.com/docs/ai-gateway/concepts/credits#processing-fee
# Reasoning and cache controls copied from providers/tencent-tokenhub (multi-model relay policy, AGENTS.md).
schema = 2
base_model = "tencent/hy3"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["none", "high"] }

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.182
cache = { read = 0.083 }

[cost.text.output]
price = 0.578
