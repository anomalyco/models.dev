# Toggle: thinking.type = enabled|disabled (default enabled)
# Source: ngrok.ai catalog, provider `z-ai` (default route for this ID), accessed 2026-11-12.
# Prices = provider list price + $0.05/M processing fee on all request and response tokens:
# https://ngrok.com/docs/ai-gateway/concepts/credits#processing-fee
# Reasoning and cache controls copied from providers/zai (multi-model relay policy, AGENTS.md).
schema = 2
base_model = "zhipuai/glm-4.5-air"

[capabilities]
reasoning = { supported = true, default = { type = "toggle", value = true }, toggle = true }
cache = { implicit = true }

[limit]
context = 128_000

[cost.text.input]
price = 0.25
cache = { read = 0.08 }

[cost.text.output]
price = 1.15
