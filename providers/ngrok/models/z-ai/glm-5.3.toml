# Effort: reasoning_effort = low|high|max (default max); thinking.type only accepts enabled
# Source: ngrok.ai catalog, provider `z-ai` (default route for this ID), accessed 2026-11-12.
# Prices = catalog list price + $0.05/M processing fee on all request and response tokens:
# https://ngrok.com/docs/ai-gateway/concepts/credits#processing-fee
# APIs: the surfaces the ngrok catalog lists for this route (chat-completions):
# https://ngrok.com/docs/ai-gateway/reference/model-catalog#zai
# Reasoning, cache and compatibility markers from providers/zai (the lab's own provider entry). The gateway
# forwards requests minus unsupported params and returns responses unchanged:
# https://ngrok.com/docs/ai-gateway/how-it-works
schema = 2
base_model = "zhipuai/glm-5.3"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "max" }, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content", max_tokens_field = "max_tokens" }

[cost.text.input]
price = 1.45
cache = { read = 0.31 }

[cost.text.output]
price = 4.45
