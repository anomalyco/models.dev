# Effort: reasoning_effort (Chat), output_config.effort (Messages), reasoning.effort (Responses) = low|medium|high (https://platform.stepfun.com/docs/zh/api-reference/chat/chat-completion-create, https://platform.stepfun.com/docs/zh/api-reference/chat/messages-create, https://platform.stepfun.com/docs/zh/api-reference/responses/responses-create).
# Source: ngrok.ai catalog, provider `tokenhub` (default route for this ID), accessed 2026-11-12.
# Prices = provider list price + $0.05/M processing fee on all request and response tokens:
# https://ngrok.com/docs/ai-gateway/concepts/credits#processing-fee
# Reasoning and cache controls copied from providers/stepfun (multi-model relay policy, AGENTS.md).
schema = 2
base_model = "stepfun/step-5-preview"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
cache = { implicit = { min_tokens = 256 } }

[limit]
output = 64_000

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 1.05
cache = { read = 0.15 }

[cost.text.output]
price = 2.75
