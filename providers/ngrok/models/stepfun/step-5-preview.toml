# Effort: reasoning_effort (Chat), output_config.effort (Messages), reasoning.effort (Responses) = low|medium|high
# Source: ngrok.ai catalog, provider `tokenhub` (default route for this ID), accessed 2026-11-12.
# Prices = catalog list price + $0.05/M processing fee on all request and response tokens:
# https://ngrok.com/docs/ai-gateway/concepts/credits#processing-fee
# APIs: the surfaces the ngrok catalog lists for this route (chat-completions, responses, messages):
# https://ngrok.com/docs/ai-gateway/reference/model-catalog#tencent-tokenhub
# List price is the ngrok catalog row for this route ($1/$2.7 per M); providers/stepfun lists $1.04613/$2.98895.
# Reasoning, cache and compatibility markers from providers/stepfun (the lab's own provider entry). The gateway
# forwards requests minus unsupported params and returns responses unchanged:
# https://ngrok.com/docs/ai-gateway/how-it-works
schema = 2
base_model = "stepfun/step-5-preview"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
cache = { implicit = { min_tokens = 256 } }

[limit]
output = 64_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content", max_tokens_field = "max_tokens" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 1.05
cache = { read = 0.15 }

[cost.text.output]
price = 2.75
