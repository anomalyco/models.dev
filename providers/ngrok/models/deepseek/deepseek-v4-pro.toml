# Toggle: thinking.type = enabled|disabled (default enabled)
# Effort: reasoning_effort = low|high|max
# Source: ngrok.ai catalog, provider `deepseek` (default route for this ID), accessed 2026-11-12.
# Prices = provider list price + $0.05/M processing fee on all request and response tokens:
# https://ngrok.com/docs/ai-gateway/concepts/credits#processing-fee
# Reasoning and cache controls copied from providers/deepseek (multi-model relay policy, AGENTS.md).
schema = 2
base_model = "deepseek/deepseek-v4-pro-0813"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "high" }, toggle = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.71
cache = { read = 0.072 }

[cost.text.output]
price = 2.03
