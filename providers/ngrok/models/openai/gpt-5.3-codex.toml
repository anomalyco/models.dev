# Source: ngrok.ai catalog, provider `openai` (default route for this ID), accessed 2026-11-12.
# Prices = provider list price + $0.05/M processing fee on all request and response tokens:
# https://ngrok.com/docs/ai-gateway/concepts/credits#processing-fee
# Reasoning and cache controls copied from providers/openai (multi-model relay policy, AGENTS.md).
schema = 2
base_model = "openai/gpt-5.3-codex"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true
cache = { implicit = { min_tokens = 1024 } }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 1.8
cache = { read = 0.225 }

[cost.text.output]
price = 14.05
