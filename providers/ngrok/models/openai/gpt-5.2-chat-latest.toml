# Source: ngrok.ai catalog, provider `openai` (default route for this ID), accessed 2026-11-12.
# Prices = catalog list price + $0.05/M processing fee on all request and response tokens:
# https://ngrok.com/docs/ai-gateway/concepts/credits#processing-fee
# Cache: the ngrok catalog marks implicit caching for this model; OpenAI caches prompts of 1,024+ tokens.
# tools.freeform not authored: custom-tool grammars have not been live-probed through the gateway yet.
schema = 2
base_model = "openai/gpt-5.2-chat-latest"

[capabilities]
reasoning = { supported = true }
cache = { implicit = { min_tokens = 1_024 } }

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 1.8
cache = { read = 0.225 }

[cost.text.output]
price = 14.05
