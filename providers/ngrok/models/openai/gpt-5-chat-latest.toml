# Source: ngrok.ai catalog, provider `openai` (default route for this ID), accessed 2026-11-12.
# Prices = provider list price + $0.05/M processing fee on all request and response tokens:
# https://ngrok.com/docs/ai-gateway/concepts/credits#processing-fee
schema = 2
base_model = "openai/gpt-5-chat-latest"

[capabilities]
reasoning = { supported = true }

[limit]
context = 128_000
output = 16_384

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 1.3
cache = { read = 0.175 }

[cost.text.output]
price = 10.05
