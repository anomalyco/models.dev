# Toggle: thinking.type = enabled|disabled (default enabled; Responses reasoning.effort only maps none -> off, every other level -> on, so no graded effort is authored)
# Source: ngrok.ai catalog, provider `tokenhub` (default route for this ID), accessed 2026-11-12.
# Prices = provider list price + $0.05/M processing fee on all request and response tokens:
# https://ngrok.com/docs/ai-gateway/concepts/credits#processing-fee
# Reasoning and cache controls copied from providers/xiaomi (multi-model relay policy, AGENTS.md).
schema = 2
base_model = "xiaomi/mimo-v2.6-pro"

[modalities]
input = ["text"]

[capabilities]
reasoning = { supported = true, default = { type = "toggle", value = true }, toggle = true }
structured_output = true
cache = { implicit = true }

[limit]
context = 1_000_000

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.485
cache = { read = 0.0536 }

[cost.text.output]
price = 0.92
