# Toggle: enable_thinking true|false (hybrid)
# Effort: reasoning_effort = low|medium|xhigh
# Budget: thinking_budget (Max Reasoning 262K)
# Source: ngrok.ai catalog, provider `qwencloud` (default route for this ID), accessed 2026-11-12.
# Prices = provider list price + $0.05/M processing fee on all request and response tokens:
# https://ngrok.com/docs/ai-gateway/concepts/credits#processing-fee
# Reasoning and cache controls copied from providers/alibaba (multi-model relay policy, AGENTS.md).
schema = 2
base_model = "alibaba/qwen3.8-flash"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "xhigh" }, toggle = true, effort = ["low", "medium", "xhigh"], budget = { max = 262_144 } }
structured_output = true
cache = { implicit = { min_tokens = 1024 }, explicit = { ttl = ["5m"], max_breakpoints = 4, targets = ["system", "messages"], min_tokens = 1024 } }

[limit]
context = 1_048_576

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.2
cache = { read = 0.066, write = 0.25 }

[cost.text.output]
price = 0.52
