# Toggle: enable_thinking true|false (hybrid)
# Effort: reasoning_effort = low|medium|xhigh (default xhigh); high accepted as alias → xhigh
# Budget: thinking_budget (0..262144) cannot be combined with reasoning_effort
# Source: ngrok.ai catalog, provider `qwencloud` (default route for this ID), accessed 2026-11-12.
# Prices = catalog list price + $0.05/M processing fee on all request and response tokens:
# https://ngrok.com/docs/ai-gateway/concepts/credits#processing-fee
# Reasoning, cache and compatibility markers from providers/alibaba (the lab's own provider entry). The gateway
# forwards requests minus unsupported params and returns responses unchanged:
# https://ngrok.com/docs/ai-gateway/how-it-works
schema = 2
base_model = "alibaba/qwen3.8-max"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic", "video/mp4", "video/x-msvideo", "video/x-matroska", "video/quicktime", "video/x-flv", "video/x-ms-wmv"]
output = ["text"]

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "xhigh" }, toggle = true, effort = ["low", "medium", "xhigh"], budget = { min = 0, max = 262_144 } }
structured_output = true
cache = { implicit = { min_tokens = 1_024 }, explicit = { ttl = ["5m"], max_breakpoints = 4, targets = ["system", "messages"], min_tokens = 1_024 } }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 2.05
cache = { read = 0.3, explicit = { read = 0.22, write = 2.55 } }

[cost.text.output]
price = 6.05
