# Toggle: enable_thinking true|false
# Budget: thinking_budget (integer reasoning tokens, maximum 81920)
# Source: ngrok.ai catalog, provider `qwencloud` (default route for this ID), accessed 2026-11-12.
# Prices = provider list price + $0.05/M processing fee on all request and response tokens:
# https://ngrok.com/docs/ai-gateway/concepts/credits#processing-fee
# Reasoning and cache controls copied from providers/alibaba (multi-model relay policy, AGENTS.md).
schema = 2
base_model = "alibaba/qwen3.5-flash"

[capabilities]
reasoning = { supported = true, default = { type = "toggle", value = true }, toggle = true, budget = { max = 81_920 } }
structured_output = true
cache = { explicit = { ttl = ["5m"], max_breakpoints = 4, targets = ["system", "messages"], min_tokens = 1024 } }

[limit]
context = 1_048_576

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.15
cache = { write = 0.175 }

[cost.text.output]
price = 0.45
