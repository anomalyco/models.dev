# Effort: output_config.effort = low|medium|high|xhigh|max, default max. Thinking cannot be disabled: thinking.type = disabled or effort none returns 400.
# Source: ngrok.ai catalog, provider `minimax` (default route for this ID), accessed 2026-11-12.
# Prices = provider list price + $0.05/M processing fee on all request and response tokens:
# https://ngrok.com/docs/ai-gateway/concepts/credits#processing-fee
# Reasoning and cache controls copied from providers/minimax (multi-model relay policy, AGENTS.md).
schema = 2
base_model = "minimax/MiniMax-M3.1-Flash"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "max" }, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = false
cache = { implicit = { min_tokens = 512 } }

[limit]
output = 524_288

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.2
cache = { read = 0.065 }

[cost.text.output]
price = 0.65
