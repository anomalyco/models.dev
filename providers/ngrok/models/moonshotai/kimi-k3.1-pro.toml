# Source: ngrok.ai catalog, provider `moonshotai` (default route for this ID), accessed 2026-11-12.
# Prices = catalog list price + $0.05/M processing fee on all request and response tokens:
# https://ngrok.com/docs/ai-gateway/concepts/credits#processing-fee
# Cache writes: credits pay the catalog's single write rate ($2/M + fee) at every TTL; the catalog has no
# TTL-conditioned write rate for this model (it does for Claude). The lab lists { "5m" = 2, "1h" = 4 }.
# APIs: the surfaces the ngrok catalog lists for this route (chat-completions):
# https://ngrok.com/docs/ai-gateway/reference/model-catalog#moonshot-ai
# Reasoning, cache and compatibility markers from providers/moonshotai (the lab's own provider entry). The gateway
# forwards requests minus unsupported params and returns responses unchanged:
# https://ngrok.com/docs/ai-gateway/how-it-works
schema = 2
base_model = "moonshotai/kimi-k3.1-pro"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "max" }, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = { ttl = ["5m", "1h"] } }

[limit]
output = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 2.05
cache = { read = 0.25, write = 2.05 }

[cost.text.output]
price = 10.05
