# Toggle: thinking.type = "enabled" (default) | "disabled"; reasoning returned in reasoning_content.
# Source: ngrok.ai catalog, provider `moonshotai` (default route for this ID), accessed 2026-11-12.
# Prices = provider list price + $0.05/M processing fee on all request and response tokens:
# https://ngrok.com/docs/ai-gateway/concepts/credits#processing-fee
# Reasoning and cache controls copied from providers/moonshotai (multi-model relay policy, AGENTS.md).
schema = 2
base_model = "moonshotai/kimi-k2.6"

[capabilities]
reasoning = { supported = true, default = { type = "toggle", value = true }, toggle = true }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 1
cache = { read = 0.21 }

[cost.text.output]
price = 4.05
