# Effort: output_config.effort = low|medium|high|xhigh|max (https://platform.claude.com/docs/en/models/fable-5-2/whats-new-fable-5-2#feature-support). Adaptive thinking is always on; thinking.type enabled/disabled returns a 400. Live 2026-11-09: all five levels returned 200; minimal and none returned 400.
# Source: ngrok.ai catalog, provider `anthropic` (default route for this ID), accessed 2026-11-12.
# Prices = catalog list price + $0.05/M processing fee on all request and response tokens:
# https://ngrok.com/docs/ai-gateway/concepts/credits#processing-fee
# APIs: the surfaces the ngrok catalog lists for this route (messages, chat-completions):
# https://ngrok.com/docs/ai-gateway/reference/model-catalog#anthropic
# Reasoning, cache and compatibility markers from providers/anthropic (the lab's own provider entry). The gateway
# forwards requests minus unsupported params and returns responses unchanged:
# https://ngrok.com/docs/ai-gateway/how-it-works
# Messages is listed first: the gateway forwards output_config on /v1/messages and strips
# reasoning_effort on Chat Completions: https://ngrok.com/docs/ai-gateway/providers/anthropic#parameters-the-gateway-removes
schema = 2
base_model = "anthropic/claude-fable-5-2"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 512 } }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[api.chat-completions]

[cost.text.input]
price = 8.05
cache = { read = 0.25, write = { "5m" = 10.05, "1h" = 16.05 } }

[cost.text.output]
price = 40.05
