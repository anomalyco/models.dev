# Source: ngrok.ai catalog, provider `google` (default route for this ID), accessed 2026-11-12.
# Prices = provider list price + $0.05/M processing fee on all request and response tokens:
# https://ngrok.com/docs/ai-gateway/concepts/credits#processing-fee
# Reasoning and cache controls copied from providers/google (multi-model relay policy, AGENTS.md).
schema = 2
base_model = "google/gemini-3.5-flash-lite"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "minimal" }, effort = ["minimal", "low", "medium", "high"] }
structured_output = true
cache = { implicit = true, explicit = true }

[cost.text.input]
price = 0.35
cache = { read = 0.08 }

[cost.text.output]
price = 2.55

[cost.audio.input]
price = 0.35
