# Prices: GET https://www.runcrate.ai/api/models/catalog (accessed 2026-10-29), USD per 1M tokens as billed
# (Qwen/Qwen3.8-Flash): input 0.11865, cached input 0.014805, output 0.4011. context_length
# 1,000,000, the same as the lab entry.
# Toggle: chat_template_kwargs.enable_thinking = true|false (on by default), on POST
# https://api.runcrate.ai/v1/chat/completions. Live 2026-10-24, median
# completion_tokens_details.reasoning_tokens: chat_template_kwargs.enable_thinking false returned no
# reasoning on 6 of 6 prompts; omitted 1,027.5 (18 runs over 6 prompts). The host does not act on the
# lab's other controls: top-level enable_thinking false still reasoned (1,074, 6 prompts);
# reasoning_effort low 719, medium 1,213.5, xhigh 866 (18 runs over 6 prompts each, xhigh below medium,
# none still reasoned); thinking_budget 128 did not cap reasoning, top-level (median 1,181.5, up to
# 2,896, 12 runs) or in chat_template_kwargs (median 736, up to 1,640, 10 runs). So toggle only, no
# effort and no budget. Reasoning text is returned in reasoning_content.
# Inputs: the catalog lists text only (input_modalities); an image request returned no choices, so
# the lab entry's image and video inputs are not claimed for this host.
# Live 2026-10-24: a tool call round-tripped; a strict json_schema response validated; a repeated
# 8,346-token prompt reported 8,192 cached_tokens. Live 2026-10-29: a repeated 14,641-token prompt
# reported 14,336 cached_tokens and was billed at 0.014805 per 1M for them (usage.cost).
schema = 2
base_model = "alibaba/qwen3.8-flash"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.11865
cache = { read = 0.014805 }

[cost.text.output]
price = 0.4011
