# No [cost]: billed as the sum of the panel legs actually run, at
# upstream cost with zero markup, so there is no per-token price.
schema = 2
name = "OrcaRouter Fusion Flash"
description = "Budget Fusion panel that runs Gemini 3.5 Flash, MiniMax M2.7 and GLM 5.1 in parallel on hard requests, then has a Claude Opus 4.8 judge return the strongest single answer verbatim. Cost-sensitive fan-out over a 200K window."
family = "model-router"
open_weights = false
release_date = "2026-06-15"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
temperature = true

[limit]
context = 200_000
output = 128_000
