# No [cost]: billed as the sum of the panel legs actually run, at
# upstream cost with zero markup, so there is no per-token price.
schema = 2
name = "OrcaRouter Fusion Mini"
description = "Leaner two-model Fusion panel that runs Claude Opus 4.8 and GPT-5.5 in parallel on hard requests, then has a Claude Opus 4.8 judge return the strongest single answer verbatim. Easy requests fall through to a cheaper default and bill as one call."
family = "model-router"
open_weights = false
release_date = "2026-06-15"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
temperature = false

[limit]
context = 1_000_000
output = 128_000
