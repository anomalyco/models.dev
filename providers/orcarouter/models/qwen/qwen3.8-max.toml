# Toggle: enable_thinking; budget: thinking_budget
base_model = "alibaba/qwen3.8-max"
reasoning_options = [
  { type = "toggle" },
  { type = "effort", values = ["low", "medium", "xhigh"] },
  { type = "budget_tokens", min = 0, max = 262_144 },
]

[interleaved]
field = "reasoning_content"

[cost]
input = 2
output = 6
cache_read = 0.25
cache_write = 2.5
