# Host bills cache write at 2x input, not the usual 1.25x.
# Model page states: Cache read / 1M $0.500, Cache write / 1M $10.00.
schema = 2
base_model = "anthropic/claude-opus-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[cost.text.input]
price = 5
cache = { read = 0.5, write = 10 }

[cost.text.output]
price = 25
