# Prices (accessed 2026-10-21): OrcaRouter lists one flat rate with no context tiers
# (https://api.orcarouter.ai/v1/models and https://api.orcarouter.ai/api/pricing,
# tiered_pricing off), equal to Google's above-200K rate.
schema = 2
base_model = "google/gemini-2.5-pro"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 2.5
cache = { read = 0.25 }

[cost.text.output]
price = 15
