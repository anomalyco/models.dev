# Host bills this at 2x Google's own rate (0.75/3.75); confirmed by
# /api/pricing and prompt_per_million in /v1/models.
schema = 2
base_model = "google/gemini-3.6-flash"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 1.5
cache = { read = 0.15 }

[cost.text.output]
price = 7.5
