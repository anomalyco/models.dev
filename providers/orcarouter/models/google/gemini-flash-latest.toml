# Host prices this alias below Google's own flash-latest rate.
# /api/pricing publishes no audio_ratio for it, so no input_audio.
schema = 2
base_model = "google/gemini-flash-latest"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 0.5
cache = { read = 0.1 }

[cost.text.output]
price = 3
