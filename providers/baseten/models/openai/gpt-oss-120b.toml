# Baseten now documents top-level reasoning_effort = none | minimal | low |
# medium (default) | high | xhigh | max for GPT OSS 120B; reasoning is
# otherwise enabled by default. No toggle or budget exists.
# https://docs.baseten.co/inference/model-apis/reasoning

name = "OpenAI GPT 120B"
description = "Open-weight GPT model for self-hosted reasoning and instruction-following workloads"
family = "gpt-oss"
release_date = "2025-08-05"
last_updated = "2025-08-05"
attachment = false
reasoning = true
temperature = true
tool_call = true
structured_output = true
knowledge = "2025-08"
open_weights = true

[[reasoning_options]]
type = "effort"
values = ["none", "minimal", "low", "medium", "high", "xhigh", "max"]

[cost]
input = 0.1
output = 0.5

[limit]
context = 128_072
output = 128_072

[modalities]
input = ["text"]
output = ["text"]
