# Baseten now documents top-level reasoning_effort = none | minimal | low |
# medium (default) | high | xhigh | max for GPT OSS 120B; reasoning is
# otherwise enabled by default. No toggle or budget exists. Reasoning output is
# returned in reasoning_content.
# https://docs.baseten.co/inference/model-apis/reasoning
schema = 2
name = "OpenAI GPT 120B"
description = "Open-weight GPT model for self-hosted reasoning and instruction-following workloads"
family = "gpt-oss"
open_weights = true
knowledge = "2025-08"
release_date = "2025-08-05"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
temperature = true

[limit]
context = 128_072
output = 128_072

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.1

[cost.text.output]
price = 0.5
