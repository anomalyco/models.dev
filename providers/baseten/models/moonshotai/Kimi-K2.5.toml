# Toggle: chat_template_args.enable_thinking = true turns reasoning on; it is off
# when the field is absent (opt-in, per the reasoning guide when this model was
# listed). Baseten documented no effort values or reasoning-token budget.
# https://docs.baseten.co/inference/model-apis/reasoning
# Lab identity: model slug = Hugging Face repo moonshotai/Kimi-K2.5
# Retired: absent from GET /v1/models; chat completions return 410 "the model version you are trying to access has been deprecated" (live, 2026-10-21).
schema = 2
base_model = "moonshotai/kimi-k2.5"
description = "Kimi multimodal agent model for visual understanding, coding, and planning"
status = "deprecated"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
temperature = true
cache = { supported = true, implicit = true }

[limit]
context = 262_000
output = 262_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.6
cache = { read = 0.12 }

[cost.text.output]
price = 3
