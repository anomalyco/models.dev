# Baseten documents opt-in via chat_template_args.enable_thinking=true, but no
# explicit false behavior, effort values, or reasoning-token budget. Reasoning
# output is returned in reasoning_content.
# https://docs.baseten.co/inference/model-apis/reasoning
# Image MIME types are the lab's; Baseten documents no formats for this model.
# Retired: absent from GET /v1/models; chat completions return 410 "the model version you are trying to access has been deprecated" (live, 2026-10-21).
schema = 2
base_model = "moonshotai/kimi-k2.7-code"
status = "deprecated"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
temperature = true

[limit]
context = 262_000
output = 262_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.95
cache = { read = 0.16 }

[cost.text.output]
price = 4
