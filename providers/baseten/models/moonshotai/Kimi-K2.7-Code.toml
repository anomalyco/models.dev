# Baseten documents opt-in via chat_template_args.enable_thinking=true, but no
# explicit false behavior, effort values, or reasoning-token budget. Reasoning
# output is returned in reasoning_content.
# https://docs.baseten.co/inference/model-apis/reasoning
schema = 2
base_model = "moonshotai/kimi-k2.7-code"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
temperature = true

[limit]
context = 262_000
output = 262_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.95
cache = { read = 0.16 }

[cost.text.output]
price = 4
