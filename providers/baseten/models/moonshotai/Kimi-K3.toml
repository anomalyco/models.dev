# Baseten documents Kimi K3 reasoning as enabled by default, with top-level
# reasoning_effort = none | low | high | max (default). It also accepts
# chat_template_args.enable_thinking=false. No reasoning-token budget is
# documented. Reasoning output is returned in reasoning_content.
# https://docs.baseten.co/inference/model-apis/reasoning
# Image MIME types are the lab's; Baseten's vision guide lists the model but no formats (https://docs.baseten.co/inference/model-apis/vision).
schema = 2
base_model = "moonshotai/kimi-k3"
description = "Kimi multimodal agent model for visual understanding, coding, and planning"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true
temperature = true
cache = { supported = true, implicit = true }

[limit]
output = 262_144

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 3
cache = { read = 0.3 }

[cost.text.output]
price = 15
