schema = 2
base_model = "moonshotai/kimi-k3.1-pro"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true
temperature = true
cache = { implicit = true }

[limit]
context = 1_000_000
output = 262_144

[api.chat-completions]

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 2
cache = { read = 0.2 }

[cost.text.output]
price = 10
