# Baseten documents Kimi K3.1 Pro reasoning as on by default, with top-level
# reasoning_effort = none | low | medium | high | max (default). minimal runs at
# low and xhigh at max; the rest run as sent. No reasoning-token budget is
# documented. Reasoning output is returned in reasoning_content (as on Kimi K3).
# https://docs.baseten.co/inference/model-apis/reasoning
# Limits: 1,048,576 context and max output (GET https://inference.baseten.co/v1/models
# context_length and max_completion_tokens; the overview table lists 1000k / 1048k).
# https://docs.baseten.co/inference/model-apis/overview
# Sampling: temperature, stop. Price: $2 input, $0.20 cached input, $10 output per 1M tokens
# (https://www.baseten.co/pricing/, accessed 2026-11-24).
schema = 2
base_model = "moonshotai/kimi-k3.1-pro"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"] }
structured_output = true
temperature = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 2
cache = { read = 0.2 }

[cost.text.output]
price = 10
