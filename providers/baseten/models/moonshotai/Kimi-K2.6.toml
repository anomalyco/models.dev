# Opt in with chat_template_args.enable_thinking=true. Baseten documents no
# explicit false behavior, effort values, or reasoning-token budget.
# https://docs.baseten.co/inference/model-apis/reasoning
schema = 2
name = "Kimi K2.6"
description = "Kimi multimodal agent model for visual understanding, coding, and planning"
family = "kimi-k2"
open_weights = true
knowledge = "2025-01"
release_date = "2026-04-21"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true }
structured_output = true
temperature = true

[limit]
context = 262_000
output = 262_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.95
cache = { read = 0.16 }

[cost.text.output]
price = 4
