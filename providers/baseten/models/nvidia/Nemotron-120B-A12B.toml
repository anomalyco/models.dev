# Opt in with chat_template_args.enable_thinking=true. Baseten documents no
# explicit false behavior, effort values, or reasoning-token budget.
# https://docs.baseten.co/inference/model-apis/reasoning
schema = 2
base_model = "nvidia/nemotron-3-super-120b-a12b"
name = "Nemotron Super"
knowledge = "2026-02"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
context = 202_800
output = 202_800

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.3
cache = { read = 0.06 }

[cost.text.output]
price = 0.75
