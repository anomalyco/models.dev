# Toggle: reasoning_effort = none (default, off) | high (on). Baseten accepts minimal through max too, but every
# value other than none runs at the same depth, so there are no graded levels. Reasoning is returned in
# reasoning_content (live, 2026-11-24). https://docs.baseten.co/inference/model-apis/reasoning
# Limits: 1,048,576 context and max output (GET https://inference.baseten.co/v1/models, overview table).
# Sampling: temperature, top_p, stop (https://docs.baseten.co/inference/model-apis/overview).
# Price: $0.20 input, $0.04 cached input, $0.50 output per 1M tokens (https://www.baseten.co/pricing/, accessed 2026-11-24).
schema = 2
base_model = "nvidia/nemotron-3.5-super-vl-120b-a12b"
name = "Nemotron 3.5 Super VL"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
cache = { implicit = true }

[limit]
output = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.2
cache = { read = 0.04 }

[cost.text.output]
price = 0.5
