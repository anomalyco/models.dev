# Opt in with chat_template_args.enable_thinking=true. Baseten documents no
# explicit false behavior, effort values, or reasoning-token budget.
# https://docs.baseten.co/inference/model-apis/reasoning
# Lab identity: model slug = Hugging Face repo zai-org/GLM-4.7
# Retired: absent from GET /v1/models; chat completions return 410 "the model version you are trying to access has been deprecated" (live, 2026-10-21).
schema = 2
base_model = "zhipuai/glm-4.7"
name = "GLM 4.7"
description = "Flagship GLM model for hybrid reasoning, coding, and agentic engineering"
status = "deprecated"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
cache = { supported = true, implicit = true }

[limit]
context = 200_000
output = 200_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.6
cache = { read = 0.12 }

[cost.text.output]
price = 2.2
