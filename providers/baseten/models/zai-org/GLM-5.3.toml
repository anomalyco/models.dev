# Effort: reasoning_effort = none|low|high|max (default high); none runs at low,
# so reasoning cannot be disabled.
# https://docs.baseten.co/inference/model-apis/reasoning
# Pricing: https://www.baseten.co/pricing
# Mid-conversation (live probe, Chat Completions, 2026-10-21; notes/deepinfra-baseten-v2-2026-10-21/probe.ts): a system message after turn 1 is kept in place (cached prefix survives, instruction followed); changing reasoning_effort between turns drops the cached prefix; adding a tool between turns drops the cached prefix.
schema = 2
base_model = "zhipuai/glm-5.3"
name = "GLM 5.3"
description = "Flagship GLM model for hybrid reasoning, coding, and agentic engineering"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true
cache = { supported = true, implicit = true }
system_updates = true
effort_updates = false

[limit]
context = 1_048_576
output = 262_144

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.4
cache = { read = 0.14 }

[cost.text.output]
price = 4.4
