# Effort: reasoning_effort = low|high|max; reasoning cannot be disabled.
# https://docs.baseten.co/inference/model-apis/reasoning
# Pricing: https://www.baseten.co/pricing
schema = 2
base_model = "zhipuai/glm-5.3"
name = "GLM 5.3"
description = "Flagship GLM model for hybrid reasoning, coding, and agentic engineering"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
context = 1_048_576
output = 262_144

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.4
cache = { read = 0.14 }

[cost.text.output]
price = 4.4
