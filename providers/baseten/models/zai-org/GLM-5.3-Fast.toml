# Effort: top-level reasoning_effort = none|low|high|max (default high).
# none requests a direct answer but may still return short reasoning_content;
# chat_template_args.enable_thinking=false is rejected, so no separate toggle.
# https://docs.baseten.co/inference/model-apis/reasoning
# Mid-conversation (live probe, Chat Completions, 2026-10-21; notes/deepinfra-baseten-v2-2026-10-21/probe.ts): a system message after turn 1 is kept in place (cached prefix survives, instruction followed); changing reasoning_effort between turns drops the cached prefix; adding a tool between turns drops the cached prefix.
schema = 2
base_model = "zhipuai/glm-5.3"
name = "GLM 5.3 Fast"
description = "GLM vision model for visual reasoning, documents, and multimodal agents"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true
cache = { supported = true, implicit = true }
system_updates = true
effort_updates = false

[limit]
context = 1_048_576
output = 262_144

[cost.text.input]
price = 2.1
cache = { read = 0.21 }

[cost.text.output]
price = 6.6
