# Effort: top-level reasoning_effort = none|low|high|max (default high).
# none requests a direct answer but may still return short reasoning_content;
# chat_template_args.enable_thinking=false is rejected, so no separate toggle.
# https://docs.baseten.co/inference/model-apis/reasoning
# Mid-conversation (live probe, Chat Completions, 2026-10-21; notes/deepinfra-baseten-v2-2026-10-21/probe.ts):
#   a system message after turn 1 is kept in place (cached prefix survives, instruction followed) [cached/prompt tokens, control -> test: 12928/12945 -> 12928/12959; 13248/13265 -> 13248/13279]
#   changing reasoning_effort between turns drops the cached prefix [cached/prompt tokens, control -> test: 13184/13250 -> 0/13250 (reasoning tokens 7 -> 17); 12864/12930 -> 0/12930 (reasoning tokens 7 -> 32)]
#   adding a tool between turns drops the cached prefix [cached/prompt tokens, control -> test: 13376/13395 -> 0/13445; 13056/13075 -> 64/13125]
schema = 2
base_model = "zhipuai/glm-5.3"
name = "GLM 5.3 Fast"
description = "GLM vision model for visual reasoning, documents, and multimodal agents"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true
cache = { supported = true, implicit = true }
system_updates = true
effort_updates = false

[limit]
context = 1_048_576
output = 262_144

[cost.text.input]
price = 2.1
cache = { read = 0.21 }

[cost.text.output]
price = 6.6
