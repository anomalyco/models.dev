# Opt in with chat_template_args.enable_thinking=true. Baseten documents no
# explicit false behavior, effort values, or reasoning-token budget.
# https://docs.baseten.co/inference/model-apis/reasoning
schema = 2
base_model = "zhipuai/glm-5.1"
name = "GLM 5.1"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
context = 202_800
output = 202_800

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.3
cache = { read = 0.26 }

[cost.text.output]
price = 4.3
