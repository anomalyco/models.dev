# Effort: reasoning_effort = none|low|high|max (default high); none runs at low,
# so reasoning cannot be disabled.
# https://docs.baseten.co/inference/model-apis/reasoning
# Image MIME types are the lab's; Baseten's vision guide lists the model but no formats (https://docs.baseten.co/inference/model-apis/vision).
# Mid-conversation (live probe, Chat Completions, 2026-10-21; notes/deepinfra-baseten-v2-2026-10-21/probe.ts): a system message after turn 1 is moved to the front or rejected (cached prefix lost).
schema = 2
base_model = "zhipuai/glm-5.3-flash"
name = "GLM 5.3 Flash"
description = "GLM vision model for visual reasoning, documents, and multimodal agents"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true
cache = { supported = true, implicit = true }
system_updates = false

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.15
cache = { read = 0.03 }

[cost.text.output]
price = 0.5
