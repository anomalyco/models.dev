# Effort: reasoning_effort = low|high|max; reasoning cannot be disabled.
# https://docs.baseten.co/inference/model-apis/reasoning
schema = 2
base_model = "zhipuai/glm-5.3-flash"
name = "GLM 5.3 Flash"
description = "GLM vision model for visual reasoning, documents, and multimodal agents"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { supported = true, implicit = true }

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.15
cache = { read = 0.03 }

[cost.text.output]
price = 0.5
