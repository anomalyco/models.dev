# Reasoning is off by default; opt in with chat_template_args.enable_thinking=true.
# Baseten documents reasoning_effort = none | low | high | max for GLM 5.2, each
# run as sent, honored top-level and inside chat_template_args. No
# reasoning-token budget is documented.
# https://docs.baseten.co/inference/model-apis/reasoning
schema = 2
base_model = "zhipuai/glm-5.2"
name = "GLM 5.2"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true
cache = { supported = true, implicit = true }

[limit]
context = 1_048_576
output = 262_144

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.4
cache = { read = 0.14 }

[cost.text.output]
price = 4.4
