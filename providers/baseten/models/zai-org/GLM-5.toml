# Toggle: chat_template_args.enable_thinking = true turns reasoning on; it is off
# when the field is absent (opt-in, per the reasoning guide when this model was
# listed). Baseten documented no effort values or reasoning-token budget.
# https://docs.baseten.co/inference/model-apis/reasoning
# Lab identity: model slug = Hugging Face repo zai-org/GLM-5
# Retired: absent from GET /v1/models; chat completions return 410 "the model version you are trying to access has been deprecated" (live, 2026-10-21).
# knowledge: the host's value, unsourced; the lab's model card and docs state no cutoff. Kept so v1 doesn't lose it.
schema = 2
base_model = "zhipuai/glm-5"
name = "GLM 5"
description = "Flagship GLM model for hybrid reasoning, coding, and agentic engineering"
knowledge = "2026-01"
status = "deprecated"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
cache = { supported = true, implicit = true }

[limit]
context = 202_800
output = 202_800

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.95
cache = { read = 0.2 }

[cost.text.output]
price = 3.15
