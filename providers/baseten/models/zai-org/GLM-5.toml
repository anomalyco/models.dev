# Opt in with chat_template_args.enable_thinking=true. Baseten documents no
# explicit false behavior, effort values, or reasoning-token budget.
# https://docs.baseten.co/inference/model-apis/reasoning
schema = 2
name = "GLM 5"
description = "Flagship GLM model for hybrid reasoning, coding, and agentic engineering"
family = "glm"
open_weights = true
knowledge = "2026-01"
release_date = "2026-02-12"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true }
structured_output = true
temperature = true

[limit]
context = 202_800
output = 202_800

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.95
cache = { read = 0.2 }

[cost.text.output]
price = 3.15
