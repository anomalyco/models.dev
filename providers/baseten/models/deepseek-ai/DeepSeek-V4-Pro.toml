# Baseten now documents top-level reasoning_effort = none | minimal | low |
# medium (default) | high | xhigh | max for DeepSeek V4 Pro; no toggle or
# reasoning-token budget field is documented.
# https://docs.baseten.co/inference/model-apis/reasoning
# Retired: absent from GET /v1/models; chat completions return 410 "the model version you are trying to access has been deprecated" (live, 2026-10-21).
schema = 2
base_model = "deepseek/deepseek-v4-pro"
status = "deprecated"

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[limit]
context = 1_048_576
output = 262_144

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.74
cache = { read = 0.145 }

[cost.text.output]
price = 3.48
