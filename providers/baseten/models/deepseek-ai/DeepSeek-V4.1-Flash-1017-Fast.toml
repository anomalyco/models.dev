# Baseten's Fast variants use the same weights as their base models. Controls
# match Baseten's documented DeepSeek V4.1 Flash Fast API: top-level
# reasoning_effort = none | high (default) | max. "low" is not supported (it
# runs at the default depth). Reasoning output is returned in reasoning_content.
# https://docs.baseten.co/inference/model-apis/reasoning
# https://www.baseten.co/library/deepseek-v41-flash-1017/
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"
name = "DeepSeek V4.1 Flash 1017 Fast"
description = "Fast DeepSeek model for efficient chat, coding help, and agent loops"

[capabilities]
reasoning = { supported = true, effort = ["none", "high", "max"] }
structured_output = true
cache = { supported = true, implicit = true }

[limit]
context = 1_048_576
output = 262_144

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.6
cache = { read = 0.014 }

[cost.text.output]
price = 2.4
