# Baseten's Fast variants use the same weights as their base models. Baseten
# documents top-level reasoning_effort = none | low | medium | high (default) |
# max for DeepSeek V4.1 Flash 1017 Fast, each run as sent. Reasoning output is
# returned in reasoning_content.
# https://docs.baseten.co/inference/model-apis/reasoning
# https://www.baseten.co/library/deepseek-v41-flash-1017/
# Mid-conversation (live probe, Chat Completions, 2026-10-21; notes/deepinfra-baseten-v2-2026-10-21/probe.ts):
#   a system message after turn 1 is kept in place (cached prefix survives, instruction followed) [cached/prompt tokens, control -> test: 16384/16404 -> 16384/16419; 16640/16724 -> 16640/16739]
#   changing reasoning_effort between turns drops the cached prefix [cached/prompt tokens, control -> test: 16128/16363 -> 0/16388 (reasoning tokens 0 -> 35); 16128/16363 -> 0/16388 (reasoning tokens 0 -> 29)]
#   adding a tool between turns drops the cached prefix [cached/prompt tokens, control -> test: 16384/16650 -> 0/16701; 16384/16650 -> 0/16701]
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"
name = "DeepSeek V4.1 Flash 1017 Fast"
description = "Fast DeepSeek model for efficient chat, coding help, and agent loops"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"] }
structured_output = true
cache = { implicit = true }
system_updates = true
effort_updates = false

[limit]
context = 1_048_576
output = 262_144

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.6
cache = { read = 0.014 }

[cost.text.output]
price = 2.4
