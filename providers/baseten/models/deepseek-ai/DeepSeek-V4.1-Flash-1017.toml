# Baseten's reasoning docs do not list the 1017 slug yet; its library page
# advertises configurable reasoning effort. Controls match Baseten's documented
# DeepSeek V4.1 Flash API: top-level reasoning_effort = none | high (default) |
# max. "low" is not supported (it runs at the default depth). Reasoning output
# is returned in reasoning_content.
# https://docs.baseten.co/inference/model-apis/reasoning
# https://www.baseten.co/library/deepseek-v41-flash-1017/
base_model = "deepseek/deepseek-v4.1-flash-1017"
structured_output = true
description = "Fast DeepSeek model for efficient chat, coding help, and agent loops"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["none", "high", "max"]

[cost]
input = 0.3
output = 1.2

[limit]
context = 1_048_576
output = 262_144
