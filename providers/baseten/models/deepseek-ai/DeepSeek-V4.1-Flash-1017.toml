# Baseten documents top-level reasoning_effort = none | low | medium | high
# (default) | max for DeepSeek V4.1 Flash 1017, each run as sent. Reasoning
# output is returned in reasoning_content.
# https://docs.baseten.co/inference/model-apis/reasoning
# https://www.baseten.co/library/deepseek-v41-flash-1017/
# Mid-conversation (live probe, Chat Completions, 2026-10-21; notes/deepinfra-baseten-v2-2026-10-21/probe.ts): a system message after turn 1 is kept in place (cached prefix survives, instruction followed); changing reasoning_effort between turns drops the cached prefix; adding a tool between turns drops the cached prefix.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"
description = "Fast DeepSeek model for efficient chat, coding help, and agent loops"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"] }
structured_output = true
cache = { supported = true, implicit = true }
system_updates = true
effort_updates = false

[limit]
context = 1_048_576
output = 262_144

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.3
cache = { read = 0.007 }

[cost.text.output]
price = 1.2
