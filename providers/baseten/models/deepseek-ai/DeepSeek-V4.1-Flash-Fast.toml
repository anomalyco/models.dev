# Baseten's Fast variants use the same weights as their base models; the
# DeepSeek V4.1 Flash API exposes reasoning_effort = none | low | high | max
# and returns reasoning in reasoning_content.
# https://docs.baseten.co/inference/model-apis/overview
# https://www.baseten.co/library/deepseek-v41-flash/
# https://docs.baseten.co/inference/model-apis/reasoning
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"
name = "DeepSeek V4.1 Flash Fast"
description = "Fast DeepSeek model for efficient chat, coding help, and agent loops"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true
temperature = false
cache = { supported = true, implicit = true }

[limit]
context = 1_048_576
output = 32_768

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.6
cache = { read = 0.014 }

[cost.text.output]
price = 2.4
