# Baseten documents top-level reasoning_effort = none | minimal | low | medium |
# high (default) | xhigh | max for DeepSeek V4 Flash 0731. Reasoning output is
# returned in reasoning_content.
# https://docs.baseten.co/inference/model-apis/overview
# https://docs.baseten.co/inference/model-apis/reasoning
# Mid-conversation (live probe, Chat Completions, 2026-10-21; notes/deepinfra-baseten-v2-2026-10-21/probe.ts): a system message after turn 1 is kept in place (cached prefix survives, instruction followed); changing reasoning_effort between turns drops the cached prefix; adding a tool between turns drops the cached prefix.
schema = 2
base_model = "deepseek/deepseek-v4-flash-0731"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { supported = true, implicit = true }
system_updates = true
effort_updates = false

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.13
cache = { read = 0.028 }

[cost.text.output]
price = 0.26
