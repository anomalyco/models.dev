# This deprecated model is absent from Baseten's current reasoning support table;
# no toggle, effort, or budget request field is documented for it.
# https://docs.baseten.co/inference/model-apis/reasoning
# Lab identity: model slug = Hugging Face repo MiniMaxAI/MiniMax-M2.5
# Retired: absent from GET /v1/models; chat completions return 410 "the model version you are trying to access has been deprecated" (live, 2026-10-21).
# knowledge: the host's value, unsourced; the lab's model card and docs state no cutoff. Kept so v1 doesn't lose it.
schema = 2
base_model = "minimax/MiniMax-M2.5"
description = "Legacy model retained for compatibility with older integrations"
knowledge = "2026-01"
status = "deprecated"

[capabilities]
reasoning = { supported = true }

[limit]
context = 204_000
output = 204_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.3

[cost.text.output]
price = 1.2
