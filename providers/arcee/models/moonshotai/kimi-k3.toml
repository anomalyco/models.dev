# Beta catalog and pricing: https://www.arcee.ai/blog/open-models-api-beta
# Cached input pricing: https://docs.arcee.ai/get-started/pricing.md
# Effort: reasoning_effort = low|high|max
schema = 2
base_model = "moonshotai/kimi-k3"
status = "beta"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
temperature = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 3
cache = { read = 0.3 }

[cost.text.output]
price = 15
