# Beta catalog and pricing: https://www.arcee.ai/blog/open-models-api-beta
# Cached input pricing: https://docs.arcee.ai/get-started/pricing.md
# A live reasoning_effort request is rejected; reasoning is always on.
# Arcee pricing page (accessed 2026-10-21; "pricing information for all models on Arcee Platform", USD per MTok,
#   input / output / cached input): https://docs.arcee.ai/get-started/pricing.md
# APIs on this host: OpenAI Chat Completions (https://api.arcee.ai/api/v1/chat/completions) and /api/v1/models. Reasoning
#   is returned in reasoning_content, which the API also accepts back on assistant messages
#   (https://docs.arcee.ai/capabilities/reasoning-traces.md).
# Mid-conversation behavior is undocumented and could not be probed (no key), so those flags stay unset.
# Deprecated: listed in the beta launch post but no longer on the pricing page that lists every Arcee Platform model.
# max_tokens_field: Arcee's Chat Completions API reference lists max_tokens and not max_completion_tokens (https://docs.arcee.ai/api-reference/chat-completion, accessed 2026-10-24)
schema = 2
base_model = "thinkingmachines/inkling-small"
status = "deprecated"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true }

[limit]
context = 262_144
output = 262_144

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content", max_tokens_field = "max_tokens" }

[cost.text.input]
price = 0.5
cache = { read = 0.1 }

[cost.text.output]
price = 1.2
