# Beta catalog and pricing: https://www.arcee.ai/blog/open-models-api-beta
# Cached input pricing: https://docs.arcee.ai/get-started/pricing.md
# A live reasoning_effort request is rejected; reasoning is always on.
schema = 2
base_model = "thinkingmachines/inkling-small"
status = "beta"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true }

[limit]
context = 262_144
output = 262_144

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.5
cache = { read = 0.1 }

[cost.text.output]
price = 1.2
