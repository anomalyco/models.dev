# Live inventory and pricing: https://api.arcee.ai/api/v1/models (verified 2026-08-17).
# This dated route is not yet listed on Arcee's public pricing page.
# No toggle: thinking.type=enabled|disabled is rejected by the live API.
# Effort: reasoning_effort = high|max; low is rejected.
schema = 2
base_model = "deepseek/deepseek-v4-pro-0813"
status = "beta"

[capabilities]
reasoning = { supported = true, effort = ["high", "max"] }
structured_output = true

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.32
cache = { read = 0.044 }

[cost.text.output]
price = 3.96
