# Beta catalog and pricing: https://www.arcee.ai/blog/open-models-api-beta
# Cached input pricing: https://docs.arcee.ai/get-started/pricing.md
# No toggle: thinking.type=enabled|disabled is rejected by the live API.
# Effort: reasoning_effort = high|max
schema = 2
base_model = "deepseek/deepseek-v4-pro"
status = "beta"

[capabilities]
reasoning = { supported = true, effort = ["high", "max"] }
structured_output = true

[limit]
context = 512_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.74
cache = { read = 0.2 }

[cost.text.output]
price = 3.48
