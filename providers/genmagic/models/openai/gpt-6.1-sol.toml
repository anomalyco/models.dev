# Effort: reasoning_effort, or reasoning.effort
# Pricing, limits and reasoning controls: https://genmagic.co/api/v1/models/openai/gpt-6.1-sol (accessed 2026-10-04)
# Request body is forwarded unchanged: https://genmagic.co/developers#reasoning
base_model = "openai/gpt-6.1-sol"

[[reasoning_options]]
type = "effort"
