# Effort: reasoning_effort, or reasoning.effort
# Pricing, limits and reasoning controls: https://genmagic.co/api/v1/models/x-ai/grok-4.6 (accessed 2026-10-04)
# Request body is forwarded unchanged: https://genmagic.co/developers#reasoning
base_model = "xai/grok-4.6"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh"]

[cost]
