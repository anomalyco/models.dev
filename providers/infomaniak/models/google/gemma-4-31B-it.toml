# Pricing note: Infomaniak bills in CHF; USD prices below are converted at
# 1 CHF ≈ 1.24 USD (mid-market rate, checked 2026-08-01). Infomaniak-listed
# price: CHF 0.20 input / CHF 0.40 output per 1M tokens.
base_model = "google/gemma-4-31b-it"
last_updated = "2026-08-01"
# Reasoning checked live against the Infomaniak API on 2026-06-28: gemma-4-31B-it ignores
# `reasoning_effort` (none/low/high produce identical output) and never populates
# `message.reasoning` — any step-by-step text stays inline in `content`. The model still reasons
# internally: Infomaniak's API docs say thinking is enabled by default on most models, and
# gemma-4 is not among the listed exceptions (apertus-ai/Apertus-v1.5-70B, mistral3). The
# provider just exposes no control and no separate reasoning field, so reasoning stays true
# (inherited from base_model) with no reasoning_options.
# Source: https://developer.infomaniak.com/docs/api/post/2/ai/{product_id}/openai/v1/chat/completions
reasoning_options = []

[cost]
input = 0.25
output = 0.50

[limit]
context = 100_000
input = 100_000
output = 8_192
