# Google Standard API prices in USD per million tokens; checked 2026-10-19.
# https://ai.google.dev/gemini-api/docs/pricing#gemini-4-argon
# https://ai.google.dev/gemini-api/docs/models/gemini-4-argon
# https://ai.google.dev/gemini-api/docs/openai
# https://ai.google.dev/gemini-api/docs/generate-content/latest-model
# Introductory prices through 2026-11-30; from 2026-12-01 input/output/cache
# read are $4/$20/$0.20. Cache reads are implicit only; no explicit writes.
# Aixy's gemini route uses OpenAI Chat Completions; effort: reasoning_effort.
# Keep the non-streaming output cap; native long decode is not advertised.
# Input modalities are limited to the documented OpenAI-compatible surface.
base_model = "google/gemini-4-argon"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high"] }]

[cost]
input = 2.00
output = 10.00
cache_read = 0.10
input_audio = 2.00

[limit]
output = 32_768

[modalities]
input = ["text", "image", "audio"]
