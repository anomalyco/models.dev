# Google Standard API prices in USD per million tokens; checked 2026-10-19.
# https://ai.google.dev/gemini-api/docs/pricing#gemini-3.8-flash
# https://ai.google.dev/gemini-api/docs/models/gemini-3.8-flash
# https://ai.google.dev/gemini-api/docs/openai
# Introductory prices through 2026-12-31; from 2027-01-01 input/output/cache
# read are $1.50/$7.50/$0.15. Cache storage is billed separately by Google.
# Aixy's gemini route uses OpenAI Chat Completions; effort: reasoning_effort.
# Input modalities are limited to the documented OpenAI-compatible surface.
schema = 2
base_model = "google/gemini-3.8-flash"

[modalities]
input = ["text", "image", "audio"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[cost.text.input]
price = 0.75
cache = { read = 0.075 }

[cost.text.output]
price = 3.75

[cost.audio.input]
price = 0.75
