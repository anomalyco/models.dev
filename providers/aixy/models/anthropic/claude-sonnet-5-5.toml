# Anthropic standard API prices in USD per million tokens; checked 2026-10-13.
# https://platform.claude.com/docs/en/about-claude/pricing
# https://platform.claude.com/docs/en/models/sonnet-5-5/overview
# Cache writes use the 5-minute rate.
# Effort: output_config.effort; https://platform.claude.com/docs/en/build-with-claude/effort
# thinking.type=disabled is rejected; between_tools still allows thinking between tool calls.
schema = 2
base_model = "anthropic/claude-sonnet-5-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[api.messages]
base_url = "https://api.aixy-gateway.com/v1"
sdk = { aisdk = "@ai-sdk/anthropic" }

[cost.text.input]
price = 2
cache = { read = 0.1, write = 2.5 }

[cost.text.output]
price = 10
