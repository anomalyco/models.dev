# OpenAI Standard API prices in USD per million tokens; checked 2026-10-13.
# https://developers.openai.com/api/docs/pricing
# https://developers.openai.com/api/docs/models/gpt-6-astra
# Long-context rates apply to the full request above 272K input tokens.
base_model = "openai/gpt-6-astra"
structured_output = true
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 10.00
cache_read = 1.00
cache_write = 12.50
output = 50.00

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 20.00
cache_read = 2.00
cache_write = 25.00
output = 75.00

[provider]
npm = "@ai-sdk/openai"
api = "https://api.aixy-gateway.com/v1"
shape = "responses"
