# OpenAI Standard API prices in USD per million tokens; checked 2026-10-13.
# https://developers.openai.com/api/docs/pricing
# https://developers.openai.com/api/docs/models/gpt-6-luna
# Long-context rates apply to the full request above 272K input tokens.
base_model = "openai/gpt-6-luna"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 0.10
cache_read = 0.01
cache_write = 0.125
output = 0.50

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 0.20
cache_read = 0.02
cache_write = 0.25
output = 0.75

[provider]
npm = "@ai-sdk/openai"
api = "https://api.aixy-gateway.com/v1"
shape = "responses"
