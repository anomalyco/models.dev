# OpenAI Standard API prices in USD per million tokens; checked 2026-10-13.
# https://developers.openai.com/api/docs/pricing
# https://developers.openai.com/api/docs/models/gpt-5.6-luna
# Long-context rates apply to the full request above 272K input tokens.
schema = 2
base_model = "openai/gpt-5.6-luna"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[api.responses]
base_url = "https://api.aixy-gateway.com/v1"
sdk = { aisdk = "@ai-sdk/openai" }
legacy_shape = "responses"

[cost.text.input]
price = 0.2
cache = { read = 0.02, write = 0.25 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 0.4
cache = { read = 0.04, write = 0.5 }

[cost.text.output]
price = 1.2

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 1.8
