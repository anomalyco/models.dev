# Source: https://developers.openai.com/api/docs/models
# Serving metadata: providers/openai/models/gpt-5.6-luna.toml (2026-09-24).
# Pricing: https://developers.openai.com/api/docs/pricing (Terra/Luna cut 2026-07-30)
# Native Responses through Aixy preserves reasoning and tool-call controls.
base_model = "openai/gpt-5.6-luna"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "xhigh", "max"]

[cost]
input = 0.2
output = 1.2
cache_read = 0.02
cache_write = 0.25

[[cost.tiers]]
tier = { size = 272_000, type = "context" }
input = 0.4
output = 1.8
cache_read = 0.04
cache_write = 0.5

[experimental.modes.fast]
cost = { input = 0.4, output = 2.4, cache_read = 0.04, cache_write = 0.5 }
provider = { body = { service_tier = "priority" } }

[experimental.modes.pro]
provider = { body = { reasoning = { mode = "pro" } } }

[provider]
npm = "@ai-sdk/openai"
api = "https://api.aixy-gateway.com/v1"
shape = "responses"
