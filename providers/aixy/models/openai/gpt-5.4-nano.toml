# Source: https://developers.openai.com/api/docs/models
# Serving metadata: providers/openai/models/gpt-5.4-nano.toml (2026-09-24).
# Native Responses through Aixy preserves reasoning and tool-call controls.
base_model = "openai/gpt-5.4-nano"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "xhigh"]

[cost]
input = 0.2
output = 1.25
cache_read = 0.02

[provider]
npm = "@ai-sdk/openai"
api = "https://api.aixy-gateway.com/v1"
shape = "responses"
