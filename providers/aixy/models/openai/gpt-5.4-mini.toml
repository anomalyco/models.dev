# Source: https://developers.openai.com/api/docs/models
# Serving metadata: providers/openai/models/gpt-5.4-mini.toml (2026-09-24).
# Native Responses through Aixy preserves reasoning and tool-call controls.
base_model = "openai/gpt-5.4-mini"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "xhigh"]

[cost]
input = 0.75
output = 4.5
cache_read = 0.075

[experimental.modes.fast]
cost = { input = 1.5, output = 9.0, cache_read = 0.15 }
provider = { body = { service_tier = "priority" } }

[provider]
npm = "@ai-sdk/openai"
api = "https://api.aixy-gateway.com/v1"
shape = "responses"
