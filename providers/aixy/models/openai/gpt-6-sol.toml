# Source: https://developers.openai.com/api/docs/models
# Serving metadata: providers/openai/models/gpt-6-sol.toml (2026-09-24).
# Pricing: https://developers.openai.com/api/docs/models/gpt-6-sol
# Reasoning and modes: https://developers.openai.com/api/docs/guides/latest-model?model=gpt-6-sol
# Native Responses through Aixy preserves reasoning and tool-call controls.
base_model = "openai/gpt-6-sol"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "xhigh", "max"]

[cost]
input = 2.0
output = 10.0
cache_read = 0.2
cache_write = 2.5

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 4.0
output = 15.0
cache_read = 0.4
cache_write = 5.0

[experimental.modes.fast]
cost = { input = 4.0, output = 20.0, cache_read = 0.4, cache_write = 5.0 }
provider = { body = { service_tier = "priority" } }

[experimental.modes.pro]
provider = { body = { reasoning = { mode = "pro" } } }

[provider]
npm = "@ai-sdk/openai"
api = "https://api.aixy-gateway.com/v1"
shape = "responses"
