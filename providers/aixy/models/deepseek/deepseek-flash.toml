# Source: https://api-docs.deepseek.com/quick_start/pricing/
# Serving metadata: providers/deepseek/models/deepseek-flash.toml (2026-09-24).
# Toggle: thinking.type = enabled|disabled; reasoning_effort = low|high|max.
# https://api-docs.deepseek.com/guides/thinking_mode/
# Prices checked 2026-09-24: off-peak USD/MTok; peak rates are 2x.
# Reasoning tokens are included in output tokens and billed at the output rate.
base_model = "deepseek/deepseek-v4.1-flash"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.15
output = 0.6
reasoning = 0.6
cache_read = 0.003

[limit]
output = 393_216
