# Toggle: reasoning.enabled = true|false
# https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
base_model = "nvidia/nemotron-3-ultra-550b-a55b"
structured_output = true

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["medium", "high"]

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 0.625
output = 3.125
cache_read = 0.1875

[limit]
context = 262_144
output = 32_768
