base_model = "openai/gpt-5.4"
base_model_omit = ["cost.tiers", "cost.context_over_200k", "experimental.modes.fast", "limit.input"]

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "xhigh"]

[cost]
input = 2.75
output = 16.5
cache_read = 0.275

[limit]
context = 272_000
