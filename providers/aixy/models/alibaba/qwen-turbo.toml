# Aixy forwards this route to alibaba without translating the model payload.
# Reasoning controls mirror providers/alibaba/models/qwen-turbo.toml.
base_model = "alibaba/qwen-turbo"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 0.05
output = 0.2
reasoning = 0.5
