# Bhajanlal Pro Max 2.5 Free
# Base model: Qwen/Qwen2.5-0.5B-Instruct (32,768 context, non-reasoning base)
# Fine-tune: LoRA merges (v1-v4) over Qwen2.5-0.5B-Instruct
# Source docs: https://github.com/anonymousashlee/bhajanlal-docs
# API reference: https://bhajanlal-api-production.up.railway.app/v1/models
# Health: https://bhajanlal-api-production.up.railway.app/health
#
# Reasoning: The backend wraps opencode --thinking which produces reasoning_content
# in responses. There is no caller control (no effort levels, no toggle) — reasoning
# is always-on when the backend produces it. Wire field: reasoning_content (output only).
#
# Sampling: temperature/top_p/top_k are hardcoded server-side (0.0-0.2) and are
# NOT accepted from client requests. Verified against serve/endpoint.py.
#
# Limits: 32,768 context / 8,192 output — matches Qwen2.5-0.5B-Instruct base.
# LoRA fine-tune does not extend context window.
#
# Tools: The backend supports OpenAI function-calling (tools param) via agent mode.
# Verified against serve/backend.py handle_chat with tools.
schema = 2
name = "Bhajanlal Pro Max 2.5 free"
description = "Free coding assistant fine-tuned from Qwen2.5-0.5B-Instruct with tool calling and reasoning."
family = "bhajanlal"
open_weights = false
release_date = "2026-11-22"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = false
top_p = false
top_k = false

[limit]
context = 32_768
output = 8_192

[cost.text.input]
price = 0

[cost.text.output]
price = 0
