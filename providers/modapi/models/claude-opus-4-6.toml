# Price: https://modapi.ai/api/pricing (model claude-opus-4-6), USD per 1M tokens, lowest-priced LLM channel group, accessed by generate.py.
# Reasoning controls copied from the orcarouter entry for anthropic/claude-opus-4-6 (OpenAI-compatible Chat Completions relay) and checked live on ModAPI /v1/chat/completions for this model family.
schema = 2
v2_only = true
base_model = "anthropic/claude-opus-4-6"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[cost.text.input]
price = 5
cache = { read = 0.5 }

[cost.text.output]
price = 25
