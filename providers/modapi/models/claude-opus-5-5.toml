# Price: https://modapi.ai/api/pricing (model claude-opus-5-5), USD per 1M tokens, lowest-priced LLM channel group, accessed by generate.py.
# Effort: reasoning_effort. Verified on ModAPI POST /v1/chat/completions 2026-11-23 with claude-sonnet-5-5:
# low returned 3 output tokens, medium 128, high/xhigh/max hit the 384-token cap. A thinking budget (budget_tokens=1024) had no effect, so no budget is listed.
schema = 2
v2_only = true
base_model = "anthropic/claude-opus-5-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 4
cache = { read = 0.2 }

[cost.text.output]
price = 20
