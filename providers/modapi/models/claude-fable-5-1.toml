# Price: https://modapi.ai/api/pricing (model claude-fable-5-1), USD per 1M tokens, lowest-priced LLM channel group, accessed by generate.py.
# Effort: reasoning_effort = low|medium|high|xhigh|max
# Values from providers/anthropic/models/claude-fable-5-1.toml; each value accepted (HTTP 200) by ModAPI POST /v1/chat/completions on or before 2026-11-26;
# effect per value not verified.
schema = 2
v2_only = true
base_model = "anthropic/claude-fable-5-1"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 10
cache = { read = 0.25 }

[cost.text.output]
price = 50
