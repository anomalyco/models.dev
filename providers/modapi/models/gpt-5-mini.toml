# Price: https://modapi.ai/api/pricing (model gpt-5-mini), USD per 1M tokens, lowest-priced LLM channel group, accessed by generate.py.
# Reasoning controls copied from the 302ai entry for openai/gpt-5-mini (OpenAI-compatible Chat Completions relay) and checked live on ModAPI /v1/chat/completions for this model family.
schema = 2
v2_only = true
base_model = "openai/gpt-5-mini"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }

[cost.text.input]
price = 0.25
cache = { read = 0.025 }

[cost.text.output]
price = 2
