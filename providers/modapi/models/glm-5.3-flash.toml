# Price: https://modapi.ai/api/pricing (model glm-5.3-flash), USD per 1M tokens, lowest-priced LLM channel group, accessed by generate.py.
# Effort: reasoning_effort = low|max. Measured on ModAPI POST /v1/chat/completions 2026-11-26 (one request each), reasoning tokens:
# effort=low 14, effort=high 14, effort=max 280.
# high matched low, so it is not listed.
schema = 2
v2_only = true
base_model = "zhipuai/glm-5.3-flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "max"] }

[cost.text.input]
price = 0.15
cache = { read = 0.03 }

[cost.text.output]
price = 0.5
