# Price: https://modapi.ai/api/pricing (model claude-haiku-4-5-20251001), USD per 1M tokens, lowest-priced LLM channel group, accessed by generate.py.
# Toggle: thinking.type = enabled|disabled. Measured on ModAPI POST /v1/chat/completions 2026-11-26 (one request each):
# disabled -> 24 completion tokens, enabled (budget_tokens=1024) -> 1144. budget_tokens 4096 gave 997,
# no more than 1024, so no budget is listed.
schema = 2
v2_only = true
base_model = "anthropic/claude-haiku-4-5-20251001"

[capabilities]
reasoning = { supported = true, toggle = true }

[cost.text.input]
price = 1
cache = { read = 0.1 }

[cost.text.output]
price = 5
