# Price: https://modapi.ai/api/pricing (model gemini-4-carbon), USD per 1M tokens, lowest-priced LLM channel group, accessed by generate.py.
# Effort: reasoning_effort = low|medium|high. Measured on ModAPI POST /v1/chat/completions 2026-11-26 (one request each), reasoning tokens:
# effort=none HTTP 503, effort=low 121, effort=medium 719, effort=high 1022, effort=max 1235.
# max was within 25% of high and none failed upstream, so neither is listed.
schema = 2
v2_only = true
base_model = "google/gemini-4-carbon"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[cost.text.input]
price = 2
cache = { read = 0.1 }

[cost.text.output]
price = 10
