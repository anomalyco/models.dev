# Price: https://modapi.ai/api/pricing (model gpt-5.4-mini), USD per 1M tokens, lowest-priced LLM channel group, accessed by generate.py.
# Effort: reasoning_effort = none|low|medium|high|xhigh
# Values from providers/openai/models/gpt-5.4-mini.toml; each value accepted (HTTP 200) by ModAPI POST /v1/chat/completions on or before 2026-11-26;
# effect per value not verified.
# Custom tools (freeform): not supported on ModAPI POST /v1/chat/completions, tested 2026-11-26 (HTTP 400 "Missing required parameter: 'tools[0].custom'").
schema = 2
v2_only = true
base_model = "openai/gpt-5.4-mini"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }

[cost.text.input]
price = 0.75
cache = { read = 0.075 }

[cost.text.output]
price = 4.5
