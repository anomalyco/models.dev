# Price: https://modapi.ai/api/pricing (model gpt-5.5-pro), USD per 1M tokens, lowest-priced LLM channel group, accessed by generate.py.
# Effort: reasoning_effort. Levels tested on ModAPI POST /v1/chat/completions
# 2026-11-23 with gpt-5.4-mini (none, low, medium, high, xhigh): none returned 0 reasoning tokens, low/medium/high/xhigh returned 65-342.
schema = 2
v2_only = true
base_model = "openai/gpt-5.5-pro"

[capabilities]
reasoning = { supported = true, effort = ["medium", "high", "xhigh"] }

[cost.text.input]
price = 63

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 126

[cost.text.output]
price = 378

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 567
