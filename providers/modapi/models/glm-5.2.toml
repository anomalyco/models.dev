# Price: https://modapi.ai/api/pricing (model glm-5.2), USD per 1M tokens, lowest-priced LLM channel group, accessed by generate.py.
# Effort: reasoning_effort = high|max. Measured on ModAPI POST /v1/chat/completions 2026-11-26 (one request each), reasoning tokens:
# effort=high 61, effort=max 690.
# high and max clearly differ.
schema = 2
v2_only = true
base_model = "zhipuai/glm-5.2"

[capabilities]
reasoning = { supported = true, effort = ["high", "max"] }

[cost.text.input]
price = 1.4
cache = { read = 0.26 }

[cost.text.output]
price = 4.4
