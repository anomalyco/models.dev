# Price: https://modapi.ai/api/pricing (model claude-opus-4-8), USD per 1M tokens, lowest-priced LLM channel group, accessed by generate.py.
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|medium|high|xhigh|max
# Values from providers/anthropic/models/claude-opus-4-8.toml; each value accepted (HTTP 200) by ModAPI POST /v1/chat/completions on or before 2026-11-26;
# effect per value not verified.
schema = 2
v2_only = true
base_model = "anthropic/claude-opus-4-8"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"], toggle = true }

[cost.text.input]
price = 5
cache = { read = 0.5 }

[cost.text.output]
price = 25
