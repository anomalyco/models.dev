# Price: https://modapi.ai/api/pricing (model gpt-6.1-terra), USD per 1M tokens, lowest-priced LLM channel group, accessed by generate.py.
# Effort: reasoning_effort = none|low|medium|high|xhigh|max
# Values from providers/openai/models/gpt-6.1-terra.toml; each value accepted (HTTP 200) by ModAPI POST /v1/chat/completions on or before 2026-11-26;
# effect per value not verified.
# Custom tools (freeform): not supported on ModAPI POST /v1/chat/completions, tested 2026-11-26 (HTTP 200 but the custom tool was not offered to the model).
schema = 2
v2_only = true
base_model = "openai/gpt-6.1-terra"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 1
cache = { read = 0.05 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 2
cache = { read = 0.1 }

[cost.text.output]
price = 5

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 7.5
