# Price: https://modapi.ai/api/pricing (model mimo-v2.6-pro), USD per 1M tokens, lowest-priced LLM channel group, accessed by generate.py.
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = none|low
# Levels none|low are not in the baseline; they were tested on this model (see 工程协作/补测记录.md).
# Values from providers/xiaomi/models/mimo-v2.6-pro.toml; each value accepted (HTTP 200) by ModAPI POST /v1/chat/completions on or before 2026-11-26;
# effect per value not verified.
schema = 2
v2_only = true
base_model = "xiaomi/mimo-v2.6-pro"

[capabilities]
reasoning = { supported = true, effort = ["none", "low"], toggle = true }

[cost.text.input]
price = 0.435
cache = { read = 0.0036 }

[cost.text.output]
price = 0.87
