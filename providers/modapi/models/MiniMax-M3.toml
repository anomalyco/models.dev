# Price: https://modapi.ai/api/pricing (model MiniMax-M3), USD per 1M tokens, lowest-priced LLM channel group, accessed by generate.py.
# No caller control. Measured on ModAPI POST /v1/chat/completions 2026-11-26 (one request each), reasoning tokens:
# thinking=off 33, thinking=on 41.
# thinking disabled still reasoned (33 vs 41 enabled).
schema = 2
v2_only = true
base_model = "minimax/MiniMax-M3"

[capabilities]
reasoning = { supported = true }

[cost.text.input]
price = 0.63
cache = { read = 0.126 }

[[cost.text.input.overrides]]
when = { context = { gt = 512_000 } }
price = 1.26
cache = { read = 0.252 }

[cost.text.output]
price = 2.52

[[cost.text.output.overrides]]
when = { context = { gt = 512_000 } }
price = 5.04
