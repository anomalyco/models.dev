# Price: https://modapi.ai/api/pricing (model grok-4.5), USD per 1M tokens, lowest-priced LLM channel group, accessed by generate.py.
# Effort: reasoning_effort. Verified on ModAPI POST /v1/chat/completions 2026-11-23 with grok-4.3:
# reasoning_effort=none returned 1 output token and 0 reasoning tokens; low/medium/high returned 1670-2979 output tokens.
schema = 2
v2_only = true
base_model = "xai/grok-4.5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[cost.text.input]
price = 2
cache = { read = 0.3 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 4
cache = { read = 0.6 }

[cost.text.output]
price = 6

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 12
