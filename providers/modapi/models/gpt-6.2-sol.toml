# Price: https://modapi.ai/api/pricing (model gpt-6.2-sol), USD per 1M tokens, lowest-priced LLM channel group, accessed by generate.py.
# Effort: reasoning_effort = low|medium|high|xhigh|max
# Values from providers/openai/models/gpt-6.2-sol.toml; each value accepted (HTTP 200) by ModAPI POST /v1/chat/completions on or before 2026-11-26;
# effect per value not verified.
# Custom tools (freeform): supported on ModAPI POST /v1/responses (tested 2026-11-26: a regex-grammar custom tool was called and its input matched); not supported on POST /v1/chat/completions (HTTP 200 but the custom tool was not offered to the model).
schema = 2
v2_only = true
base_model = "openai/gpt-6.2-sol"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 2
cache = { read = 0.1 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 4
cache = { read = 0.2 }

[cost.text.output]
price = 10

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 15
