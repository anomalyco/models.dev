# Price: https://modapi.ai/api/pricing (model gpt-6.2-sol), USD per 1M tokens, lowest-priced LLM channel group, accessed by generate.py.
# Effort: reasoning_effort. Levels tested on ModAPI POST /v1/chat/completions
# 2026-11-23 with gpt-5.4-mini (none, low, medium, high, xhigh): none returned 0 reasoning tokens, low/medium/high/xhigh returned 65-342.
schema = 2
v2_only = true
base_model = "openai/gpt-6.2-sol"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"] }

[cost.text.input]
price = 2
cache = { read = 0.1 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 4
cache = { read = 0.2 }

[cost.text.output]
price = 10

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 15
