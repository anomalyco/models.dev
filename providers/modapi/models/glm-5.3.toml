# Price: https://modapi.ai/api/pricing (model glm-5.3), USD per 1M tokens, lowest-priced LLM channel group, accessed by generate.py.
# Effort: reasoning_effort = low|high|max
# Values from providers/zhipuai/models/glm-5.3.toml; each value accepted (HTTP 200) by ModAPI POST /v1/chat/completions on or before 2026-11-26;
# effect per value not verified.
schema = 2
v2_only = true
base_model = "zhipuai/glm-5.3"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }

[cost.text.input]
price = 1.4
cache = { read = 0.26 }

[cost.text.output]
price = 4.4
