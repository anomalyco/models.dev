# Price: https://modapi.ai/api/pricing (model o4-mini), USD per 1M tokens, lowest-priced LLM channel group, accessed by generate.py.
# Effort: reasoning_effort. Levels tested on ModAPI POST /v1/chat/completions
# 2026-11-23 with gpt-5.4-mini (none, low, medium, high, xhigh): none returned 0 reasoning tokens, low/medium/high/xhigh returned 65-342.
schema = 2
v2_only = true
base_model = "openai/o4-mini"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"] }

[cost.text.input]
price = 1.1
cache = { read = 0.275 }

[cost.text.output]
price = 4.4
