# Price: https://modapi.ai/api/pricing (model o4-mini), USD per 1M tokens, lowest-priced LLM channel group, accessed by generate.py.
# Reasoning controls copied from the requesty entry for openai/o4-mini (OpenAI-compatible Chat Completions relay) and checked live on ModAPI /v1/chat/completions for this model family.
schema = 2
v2_only = true
base_model = "openai/o4-mini"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"] }

[cost.text.input]
price = 1.1
cache = { read = 0.275 }

[cost.text.output]
price = 4.4
