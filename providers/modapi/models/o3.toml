# Price: https://modapi.ai/api/pricing (model o3), USD per 1M tokens, lowest-priced LLM channel group, accessed by generate.py.
# Effort: reasoning_effort. Levels tested on ModAPI POST /v1/chat/completions
# 2026-11-23 with gpt-5.4-mini (none, low, medium, high, xhigh): none returned 0 reasoning tokens, low/medium/high/xhigh returned 65-342.
schema = 2
v2_only = true
base_model = "openai/o3"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[cost.text.input]
price = 2
cache = { read = 0.5 }

[cost.text.output]
price = 8
