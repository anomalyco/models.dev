# Price: https://modapi.ai/api/pricing (model gpt-5), USD per 1M tokens, lowest-priced LLM channel group, accessed by generate.py.
# Effort: reasoning_effort = low|high. Measured on ModAPI POST /v1/chat/completions 2026-11-26 (one request each), reasoning tokens:
# no params 896, effort=low 192, effort=high 1024.
# low and high clearly differ (high hit the 1024 cap); other levels not tested.
schema = 2
v2_only = true
base_model = "openai/gpt-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "high"] }

[cost.text.input]
price = 1.25
cache = { read = 0.125 }

[cost.text.output]
price = 10
