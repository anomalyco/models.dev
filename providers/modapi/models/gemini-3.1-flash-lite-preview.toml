# Price: https://modapi.ai/api/pricing (model gemini-3.1-flash-lite-preview), USD per 1M tokens, lowest-priced LLM channel group, accessed by generate.py.
# Effort: reasoning_effort = minimal|low|medium|high. Measured on ModAPI POST /v1/chat/completions 2026-11-26 (one request each), reasoning tokens:
# effort=minimal 0, effort=low 323, effort=medium 608, effort=high 979.
# each level clearly increases.
schema = 2
v2_only = true
base_model = "google/gemini-3.1-flash-lite-preview"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }

[cost.text.input]
price = 0.25
cache = { read = 0.025 }

[cost.text.output]
price = 1.5
