# Price: https://modapi.ai/api/pricing (model gemini-4-neon), USD per 1M tokens, lowest-priced LLM channel group, accessed by generate.py.
# Effort: reasoning_effort = low|medium|high|xhigh
# Values from providers/google/models/gemini-4-neon.toml; each value accepted (HTTP 200) by ModAPI POST /v1/chat/completions on or before 2026-11-26;
# effect per value not verified.
schema = 2
v2_only = true
base_model = "google/gemini-4-neon"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }

[cost.text.input]
price = 3
cache = { read = 0.15 }

[cost.text.output]
price = 15
