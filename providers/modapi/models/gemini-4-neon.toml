# Price: https://modapi.ai/api/pricing (model gemini-4-neon), USD per 1M tokens, lowest-priced LLM channel group, accessed by generate.py.
# Effort: reasoning_effort = low|medium|max. Measured on ModAPI POST /v1/chat/completions 2026-11-26 (one request each), reasoning tokens:
# effort=none 174, effort=low 169, effort=medium 722, effort=high 741, effort=max 1174.
# none matched low and high matched medium, so they are not listed.
schema = 2
v2_only = true
base_model = "google/gemini-4-neon"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "max"] }

[cost.text.input]
price = 3
cache = { read = 0.15 }

[cost.text.output]
price = 15
