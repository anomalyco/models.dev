# Price: https://modapi.ai/api/pricing (model qwen3.8-max), USD per 1M tokens, lowest-priced LLM channel group, accessed by generate.py.
# Toggle: enable_thinking true|false
# Effort: reasoning_effort = low|medium|xhigh
# Budget: thinking_budget
# Values from providers/alibaba/models/qwen3.8-max.toml; each value accepted (HTTP 200) by ModAPI POST /v1/chat/completions on or before 2026-11-26;
# effect per value not verified.
schema = 2
v2_only = true
base_model = "alibaba/qwen3.8-max"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "xhigh"], toggle = true, budget = { min = 0, max = 262_144 } }

[cost.text.input]
price = 2
cache = { read = 0.25 }

[cost.text.output]
price = 6
