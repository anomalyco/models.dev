# Price: https://modapi.ai/api/pricing (model gemini-2.5-flash-lite), USD per 1M tokens, lowest-priced LLM channel group, accessed by generate.py.
# Effort: reasoning_effort = low|high. Measured on ModAPI POST /v1/chat/completions 2026-11-26 (one request each), reasoning tokens:
# effort=low 537, effort=medium 632, effort=high 1066.
# medium was close to low, so it is not listed.
schema = 2
v2_only = true
base_model = "google/gemini-2.5-flash-lite"

[capabilities]
reasoning = { supported = true, effort = ["low", "high"] }

[cost.text.input]
price = 0.1
cache = { read = 0.01 }

[cost.text.output]
price = 0.4
