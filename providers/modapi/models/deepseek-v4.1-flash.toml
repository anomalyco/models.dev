# Price: https://modapi.ai/api/pricing (model deepseek-v4.1-flash), USD per 1M tokens, lowest-priced LLM channel group, accessed by generate.py.
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|high|max
# Values from providers/302ai/models/deepseek-flash.toml; each value accepted (HTTP 200) by ModAPI POST /v1/chat/completions on or before 2026-11-26;
# effect per value not verified.
schema = 2
v2_only = true
base_model = "deepseek/deepseek-v4.1-flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"], toggle = true }

[cost.text.input]
price = 0.3
cache = { read = 0.006 }

[cost.text.output]
price = 1.2
