# Price: https://modapi.ai/api/pricing (model kimi-k2.7-code), USD per 1M tokens, lowest-priced LLM channel group, accessed by generate.py.
# Effort: reasoning_effort = low|high
# Baseline providers/moonshotai/models/kimi-k2.7-code-highspeed.toml has no caller control (always thinking); the levels low|high come only from a
# live test on ModAPI POST /v1/chat/completions: 2026-11-26, reasoning_effort on POST /v1/chat/completions, one request each, reasoning tokens unset 46, low 41, high 137.
# Each level was accepted (HTTP 200); this is an exception to taking values from the native entry.
schema = 2
v2_only = true
base_model = "moonshotai/kimi-k2.7-code"

[capabilities]
reasoning = { supported = true, effort = ["low", "high"] }

[cost.text.input]
price = 0.95
cache = { read = 0.19 }

[cost.text.output]
price = 4
