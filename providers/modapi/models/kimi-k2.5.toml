# Price: https://modapi.ai/api/pricing (model kimi-k2.5), USD per 1M tokens, lowest-priced LLM channel group, accessed by generate.py.
# No caller control. Measured on ModAPI POST /v1/chat/completions 2026-11-26 (one request each): thinking.type disabled/enabled and
# enable_thinking false/true all returned 2 completion tokens and no reasoning text, so no toggle is listed.
schema = 2
v2_only = true
base_model = "moonshotai/kimi-k2.5"

[capabilities]
reasoning = { supported = true }

[cost.text.input]
price = 1.427
cache = { read = 0.2379 }

[cost.text.output]
price = 7.494
