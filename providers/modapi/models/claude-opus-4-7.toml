# Price: https://modapi.ai/api/pricing (model claude-opus-4-7), USD per 1M tokens, lowest-priced LLM channel group, accessed by generate.py.
# Effort: reasoning_effort = low|high. Measured on ModAPI POST /v1/chat/completions 2026-11-26 (one request each):
# completion tokens low 31, high 189 (no reasoning_effort: 6). Other levels were not tested.
schema = 2
v2_only = true
base_model = "anthropic/claude-opus-4-7"

[capabilities]
reasoning = { supported = true, effort = ["low", "high"] }

[cost.text.input]
price = 5
cache = { read = 0.5 }

[cost.text.output]
price = 25
