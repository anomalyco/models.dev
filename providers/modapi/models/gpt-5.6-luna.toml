# Price: https://modapi.ai/api/pricing (model gpt-5.6-luna), USD per 1M tokens, lowest-priced LLM channel group, accessed by generate.py.
# Reasoning controls copied from the 302ai entry for openai/gpt-5.6-luna (OpenAI-compatible Chat Completions relay) and checked live on ModAPI /v1/chat/completions for this model family.
schema = 2
v2_only = true
base_model = "openai/gpt-5.6-luna"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 0.2
cache = { read = 0.02 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 0.4
cache = { read = 0.04 }

[cost.text.output]
price = 1.2

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 1.8
