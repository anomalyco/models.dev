# Price: https://modapi.ai/api/pricing (model gpt-5.6-luna), USD per 1M tokens, lowest-priced LLM channel group, accessed by generate.py.
# Effort: reasoning_effort = none|low|medium|high|xhigh
# Values from providers/openai/models/gpt-5.6-luna.toml; each value accepted (HTTP 200) by ModAPI POST /v1/chat/completions on or before 2026-11-26;
# effect per value not verified. max rejected (HTTP 400).
# Custom tools (freeform): supported on ModAPI POST /v1/responses (tested 2026-11-26: a regex-grammar custom tool was called and its input matched); not supported on POST /v1/chat/completions (HTTP 400 "Missing required parameter: 'tools[0].custom'").
schema = 2
v2_only = true
base_model = "openai/gpt-5.6-luna"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }

[cost.text.input]
price = 0.2
cache = { read = 0.02 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 0.4
cache = { read = 0.04 }

[cost.text.output]
price = 1.2

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 1.8
