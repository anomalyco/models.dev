# Price: https://modapi.ai/api/pricing (model gpt-5.1), USD per 1M tokens, lowest-priced LLM channel group, accessed by generate.py.
# Reasoning controls copied from the 302ai entry for openai/gpt-5.1 (OpenAI-compatible Chat Completions relay) and checked live on ModAPI /v1/chat/completions for this model family.
schema = 2
v2_only = true
base_model = "openai/gpt-5.1"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }

[cost.text.input]
price = 1.25
cache = { read = 0.125 }

[cost.text.output]
price = 10
