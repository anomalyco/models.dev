# Price: https://modapi.ai/api/pricing (model gpt-6-sol), USD per 1M tokens, lowest-priced LLM channel group, accessed by generate.py.
# Effort: reasoning_effort = none|low|medium|high|xhigh
# Values from providers/openai/models/gpt-6-sol.toml; each value accepted (HTTP 200) by ModAPI POST /v1/chat/completions on or before 2026-11-26;
# effect per value not verified. max rejected (HTTP 400).
# Custom tools (freeform): not supported on ModAPI POST /v1/chat/completions, tested 2026-11-26 (HTTP 200 but the custom tool was not offered to the model).
schema = 2
v2_only = true
base_model = "openai/gpt-6-sol"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }

[cost.text.input]
price = 2
cache = { read = 0.2 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 4
cache = { read = 0.4 }

[cost.text.output]
price = 10

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 15
