# Price: https://modapi.ai/api/pricing (model gemini-3.1-flash-lite), USD per 1M tokens, lowest-priced LLM channel group, accessed by generate.py.
# Effort: reasoning_effort = minimal|low|high. Measured on ModAPI POST /v1/chat/completions 2026-11-26 (one request each), reasoning tokens:
# effort=minimal 0, effort=low 327, effort=medium 334, effort=high 1274.
# medium matched low, so it is not listed.
schema = 2
v2_only = true
base_model = "google/gemini-3.1-flash-lite"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "high"] }

[cost.text.input]
price = 0.25
cache = { read = 0.025 }

[cost.text.output]
price = 1.5
