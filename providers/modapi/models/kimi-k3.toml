# Price: https://modapi.ai/api/pricing (model kimi-k3), USD per 1M tokens, lowest-priced LLM channel group, accessed by generate.py.
# Effort: reasoning_effort = low|high|max
# Values from providers/moonshotai/models/kimi-k3.toml; each value accepted (HTTP 200) by ModAPI POST /v1/chat/completions on or before 2026-11-26;
# effect per value not verified.
schema = 2
v2_only = true
base_model = "moonshotai/kimi-k3"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }

[cost.text.input]
price = 3
cache = { read = 0.3 }

[cost.text.output]
price = 15
