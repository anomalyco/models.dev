# Live probe through https://api.steadyrouter.com/v1/chat/completions, 2026-11-22.
# tools.freeform left out: Chat Completions refused a custom tool forced by tool_choice (regex ZZ[0-9]{3}) with 400 "Missing required parameter: tools[0].custom" in 2 of 2 tries, 2026-11-22. It had been declared from the 2026-11-06 probe; the source that accepted it then no longer serves this model.
schema = 2
base_model = "openai/gpt-5.4-mini"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
