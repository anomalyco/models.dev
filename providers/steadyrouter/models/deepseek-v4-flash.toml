# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|high|max
# Live probe through https://api.steadyrouter.com/v1/chat/completions, 2026-11-06.
# Live 2026-11-06: thinking.type = disabled returned no reasoning (0 reasoning tokens); enabled returned reasoning_content.
schema = 2
base_model = "deepseek/deepseek-v4-flash"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
