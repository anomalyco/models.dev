# Pricing and limits: https://api.gradiated.com/api/v1/models
# Reasoning controls: https://gradiated.com/docs/models-pricing/#reasoning-controls
# Effort: reasoning_effort = none|low|high|xhigh|max; none disables thinking.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "xhigh", "max"] }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.3
cache = { read = 0.006 }

[cost.text.output]
price = 1.2
reasoning = 1.2

[limit]
context = 1_048_576
input = 1_048_576
output = 131_072
