# Pricing and limits: https://api.gradiated.com/api/v1/models
# Reasoning controls: https://gradiated.com/docs/models-pricing/#reasoning-controls
# Effort: reasoning_effort = none|low|high|xhigh|max; none disables thinking.
base_model = "deepseek/deepseek-v4.1-flash"
attachment = false
structured_output = false
reasoning_options = [{ type = "effort", values = ["none", "low", "high", "xhigh", "max"] }]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.3
output = 1.2
cache_read = 0.006
reasoning = 1.2

[limit]
context = 1_048_576
input = 1_048_576
output = 131_072

[modalities]
input = ["text"]
