# Pricing and limits: https://api.gradiated.com/api/v1/models
# Effort: reasoning_effort = low|high|max (reasoning is always on).
base_model = "zhipuai/glm-5.3-flash"
attachment = false
reasoning_options = [{ type = "effort", values = ["low", "high", "max"] }]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.075
output = 0.25
cache_read = 0.015
reasoning = 0.25

[limit]
context = 1_048_576
input = 1_048_576

[modalities]
input = ["text"]
