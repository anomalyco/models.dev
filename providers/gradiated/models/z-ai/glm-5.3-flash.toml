# Pricing and limits: https://api.gradiated.com/api/v1/models
# Reasoning controls: https://gradiated.com/docs/models-pricing/#reasoning-controls
# Reasoning is always on; reasoning_effort = low|high|max.
base_model = "zhipuai/glm-5.3-flash"
attachment = false

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 0.075
output = 0.25
reasoning = 0.25
cache_read = 0.015

[limit]
context = 1_048_576
input = 1_048_576

[modalities]
input = ["text"]
