# Pricing: https://bothub.chat/models ECO mode, ELITE plan API rate
# (checked 2026-11-12): 0.45 / 2.25 USD per 1M input / output tokens.
# Price taken from ECO mode; PRO may differ.
schema = 2
base_model = "openai/gpt-6.1-terra"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[api.chat-completions]
legacy_interleaved = true

[cost.text.input]
price = 0.45

[[cost.text.input.overrides]]
when = { context = { gt = 272000 } }
price = 0.9

[cost.text.output]
price = 2.25

[[cost.text.output.overrides]]
when = { context = { gt = 272000 } }
price = 3.38
