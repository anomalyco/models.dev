# Pricing: https://bothub.chat/models ECO mode, ELITE plan API rate
# (checked 2026-11-12): 0.82 / 3.47 USD per 1M input / output tokens.
# Price taken from ECO mode; PRO may differ.
# Limits: https://bothub.chat/models (checked 2026-11-12): output 235929.
# Effort: reasoning_effort = low|medium|high
# Wire: POST /v1/chat/completions only (providers/bothub/provider.toml).
# No published thinking.type / thinking_budget / enable_thinking controls on this host.
# Levels: https://bothub.chat/kimi-k2.6 (checked 2026-11-12).
schema = 2
base_model = "moonshotai/kimi-k2.6"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
output = 235929

[api.chat-completions]
legacy_interleaved = true

[cost.text.input]
price = 0.82

[cost.text.output]
price = 3.47
