# Pricing: https://bothub.chat/models ECO mode, ELITE plan API rate
# (checked 2026-11-03): 0.12 / 0.41 USD per 1M input / output tokens.
# Price taken from ECO mode; PRO may differ.
# Controls mirrored from the lab entry: GLM-5.3-Flash always reasons;
# effort low|high|max with default max, no toggle.
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[api.chat-completions]
legacy_interleaved = true

[cost.text.input]
price = 0.12

[cost.text.output]
price = 0.41
