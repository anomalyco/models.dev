# Pricing: https://bothub.ru/models lists 22,19 / 133,15 RUB per 1M input / output tokens
# (checked 2026-10-21; the earlier -80% promo has ended).
# RUB converted to USD at the CBR rate 82.8879 RUB/USD (2026-10-21), rounded to 4 decimals.
# The per-model page (https://bothub.ru/<id>) shows prices about 6% higher.
# Controls mirrored from the lab entry: off is effort=none; graded
# levels — no toggle.
schema = 2
base_model = "openai/gpt-5.6-luna"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[api.chat-completions]
legacy_interleaved = true

[cost.text.input]
price = 0.2677

[cost.text.output]
price = 1.6064
