# Pricing: https://bothub.chat/models ECO mode, ELITE plan API rate
# (checked 2026-11-03): 0.22 / 1.33 USD per 1M input / output tokens.
# Price taken from ECO mode; PRO may differ.

# Controls mirrored from the lab entry: off is effort=none; graded
# levels — no toggle.
schema = 2
base_model = "openai/gpt-5.6-luna"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[api.chat-completions]
legacy_interleaved = true

[cost.text.input]
price = 0.22

[[cost.text.input.overrides]]
when = { context = { gt = 272000 } }
price = 0.44

[cost.text.output]
price = 1.33

[[cost.text.output.overrides]]
when = { context = { gt = 272000 } }
price = 1.99
