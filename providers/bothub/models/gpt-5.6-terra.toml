# Pricing: https://bothub.chat/models ECO mode, ELITE plan API rate
# (checked 2026-11-12): 0.9 / 5.41 USD per 1M input / output tokens.
# Price taken from ECO mode; PRO may differ.
# Live probe 2026-11-12: tools.freeform text|lark|regex → HTTP 200.
schema = 2
base_model = "openai/gpt-5.6-terra"

[capabilities]
tools = { freeform = ["text", "lark", "regex"] }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[api.chat-completions]
legacy_interleaved = true

[cost.text.input]
price = 0.9

[[cost.text.input.overrides]]
when = { context = { gt = 272000 } }
price = 1.8

[cost.text.output]
price = 5.41

[[cost.text.output.overrides]]
when = { context = { gt = 272000 } }
price = 8.12
