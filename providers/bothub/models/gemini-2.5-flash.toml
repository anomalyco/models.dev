# Pricing: https://bothub.chat/models ECO mode, ELITE plan API rate
# (checked 2026-11-12): 0.14 / 1.13 USD per 1M input / output tokens.
# Price taken from ECO mode; PRO may differ.
schema = 2
base_model = "google/gemini-2.5-flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
output = 65535

[api.chat-completions]
legacy_interleaved = true

[cost.text.input]
price = 0.14

[cost.text.output]
price = 1.13
