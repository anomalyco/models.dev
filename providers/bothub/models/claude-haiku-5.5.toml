# Pricing: https://bothub.chat/models ECO mode, ELITE plan API rate
# (checked 2026-11-12): 0.11 / 0.56 USD per 1M input / output tokens.
# Price taken from ECO mode; PRO may differ.
schema = 2
base_model = "anthropic/claude-haiku-5-5"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 0.11

[[cost.text.input.overrides]]
when = { context = { gt = 100000 } }
price = 0.56

[cost.text.output]
price = 0.56

[[cost.text.output.overrides]]
when = { context = { gt = 100000 } }
price = 2.82
