# Pricing: https://bothub.chat/models ECO mode, ELITE plan API rate
# (checked 2026-11-03): 1.17 / 3.69 USD per 1M input / output tokens.
# Price taken from ECO mode; PRO may differ.
# Controls mirrored from the lab entry: GLM-5.3 always reasons; effort
# low|high|max with default max, no toggle.
schema = 2
base_model = "zhipuai/glm-5.3"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[api.chat-completions]
legacy_interleaved = true

[cost.text.input]
price = 1.17

[cost.text.output]
price = 3.69
