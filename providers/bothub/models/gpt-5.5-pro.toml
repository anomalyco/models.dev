# Pricing: https://bothub.chat/models ECO mode, ELITE plan API rate
# (checked 2026-11-12): 33.82 / 202.9 USD per 1M input / output tokens.
# Price taken from ECO mode; PRO may differ.
# Live probe 2026-11-12: tools.freeform text|lark|regex → HTTP 200.
schema = 2
base_model = "openai/gpt-5.5-pro"

[capabilities]
tools = { freeform = ["text", "lark", "regex"] }
reasoning = { supported = true, effort = ["medium", "high", "xhigh"] }
structured_output = true

[api.chat-completions]
legacy_interleaved = true

[cost.text.input]
price = 33.82

[[cost.text.input.overrides]]
when = { context = { gt = 272000 } }
price = 67.63

[cost.text.output]
price = 202.9

[[cost.text.output.overrides]]
when = { context = { gt = 272000 } }
price = 304.35
