# Pricing: https://bothub.chat/models ECO mode, ELITE plan API rate
# (checked 2026-11-03): 0.2 / 1.19 USD per 1M input / output tokens.
# Price taken from ECO mode; PRO may differ.
schema = 2
base_model = "google/gemini-3.1-flash-lite-preview"

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high"] }
structured_output = true

[api.chat-completions]
legacy_interleaved = true

[cost.text.input]
price = 0.2

[cost.text.output]
price = 1.19
