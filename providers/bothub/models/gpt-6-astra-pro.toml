# Pricing: https://bothub.chat/models ECO mode, ELITE plan API rate
# (checked 2026-11-12): 11.27 / 56.36 USD per 1M input / output tokens.
# Price taken from ECO mode; PRO may differ.
# Live probe 2026-11-12: tools.freeform text|lark|regex → HTTP 200.
schema = 2
base_model = "openai/gpt-6-astra"

[capabilities]
tools = { supported = true, freeform = ["text", "lark", "regex"] }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[api.chat-completions]
legacy_interleaved = true

[cost.text.input]
price = 11.27

[[cost.text.input.overrides]]
when = { context = { gt = 272000 } }
price = 22.54

[cost.text.output]
price = 56.36

[[cost.text.output.overrides]]
when = { context = { gt = 272000 } }
price = 84.54
