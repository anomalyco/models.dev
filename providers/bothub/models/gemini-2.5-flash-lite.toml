# Pricing: https://bothub.chat/models ECO mode, ELITE plan API rate
# (checked 2026-11-12): 0.05 / 0.18 USD per 1M input / output tokens.
# Price taken from ECO mode; PRO may differ.
# Limits: https://bothub.chat/models (checked 2026-11-12): output 65535.
# Effort: reasoning_effort = low|medium|high
# Wire: POST /v1/chat/completions only (providers/bothub/provider.toml).
# No published thinking.type / thinking_budget / enable_thinking controls on this host.
# Live probe 2026-11-12: reasoning_effort=low|high → HTTP 200 on gemini-2.5-flash (family).
schema = 2
base_model = "google/gemini-2.5-flash-lite"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
output = 65535

[api.chat-completions]
legacy_interleaved = true

[cost.text.input]
price = 0.05

[cost.text.output]
price = 0.18
