# Pricing: https://bothub.chat/models ECO mode, ELITE plan API rate
# (checked 2026-11-12): 0.9 / 2.71 USD per 1M input / output tokens.
# Price taken from ECO mode; PRO may differ.
# Limits: https://bothub.chat/models (checked 2026-11-12): output 450k.
# Effort: reasoning_effort = low|medium|high
# Wire: POST /v1/chat/completions only (providers/bothub/provider.toml).
# No published thinking.type / thinking_budget / enable_thinking controls on this host.
# Levels: https://bothub.chat/grok-4.5 (checked 2026-11-12).
schema = 2
base_model = "xai/grok-4.5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
output = 450_000

[api.chat-completions]
legacy_interleaved = true

[cost.text.input]
price = 0.9

[[cost.text.input.overrides]]
when = { context = { gt = 200000 } }
price = 1.8

[cost.text.output]
price = 2.71

[[cost.text.output.overrides]]
when = { context = { gt = 200000 } }
price = 5.41
