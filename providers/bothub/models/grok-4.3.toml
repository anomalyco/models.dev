# Pricing: https://bothub.chat/models ECO mode, ELITE plan API rate
# (checked 2026-11-12): 0.56 / 1.13 USD per 1M input / output tokens.
# Price taken from ECO mode; PRO may differ.
# Effort: reasoning_effort = none|low|medium|high
# Wire: POST /v1/chat/completions only (providers/bothub/provider.toml).
# No published thinking.type / thinking_budget / enable_thinking controls on this host.
# Live probe 2026-11-12: reasoning_effort=low|high → HTTP 200 on grok-4.20 (family).
schema = 2
base_model = "xai/grok-4.3"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true

[api.chat-completions]
legacy_interleaved = true

[cost.text.input]
price = 0.56

[[cost.text.input.overrides]]
when = { context = { gt = 200000 } }
price = 1.13

[cost.text.output]
price = 1.13

[[cost.text.output.overrides]]
when = { context = { gt = 200000 } }
price = 2.25
