# Pricing: https://bothub.chat/models ECO mode, ELITE plan API rate
# (checked 2026-11-03): 0.55 / 1.1 USD per 1M input / output tokens.
# Price taken from ECO mode; PRO may differ.
schema = 2
base_model = "xai/grok-4.3"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true

[api.chat-completions]
legacy_interleaved = true

[cost.text.input]
price = 0.55

[[cost.text.input.overrides]]
when = { context = { gt = 200000 } }
price = 1.1

[cost.text.output]
price = 1.1

[[cost.text.output.overrides]]
when = { context = { gt = 200000 } }
price = 2.21
