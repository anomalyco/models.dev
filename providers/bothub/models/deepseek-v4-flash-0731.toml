# Pricing: https://bothub.ru/models lists 48,82 / 146,47 RUB per 1M input / output tokens
# (checked 2026-10-21).
# RUB converted to USD at the CBR rate 82.8879 RUB/USD (2026-10-21), rounded to 4 decimals.
# The per-model page (https://bothub.ru/<id>) shows prices about 6% higher.
# Controls: bothub exposes a single reasoning_effort parameter on
# POST /v1/chat/completions (see providers/bothub/provider.toml); no
# thinking.type toggle is documented for this host. Levels verified
# against the bothub model page; "none" disables reasoning.
schema = 2
base_model = "deepseek/deepseek-v4-flash-0731"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true

[api.chat-completions]
legacy_interleaved = true

[cost.text.input]
price = 0.589

[cost.text.output]
price = 1.7671
