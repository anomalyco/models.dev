# Pricing: https://bothub.chat/models ECO mode, ELITE plan API rate
# (checked 2026-11-03): 0.73 / 2.19 USD per 1M input / output tokens.
# Price taken from ECO mode; PRO may differ.
# Controls: bothub exposes a single reasoning_effort parameter on
# POST /v1/chat/completions (see providers/bothub/provider.toml); no
# thinking.type toggle is documented for this host. Levels verified
# against the bothub model page; "none" disables reasoning.
schema = 2
base_model = "deepseek/deepseek-v4-pro-0813"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true

[api.chat-completions]
legacy_interleaved = true

[cost.text.input]
price = 0.73

[cost.text.output]
price = 2.19
