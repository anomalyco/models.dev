# Pricing: https://bothub.chat/models ECO mode, ELITE plan API rate
# (checked 2026-11-12): 0.03 / 0.15 USD per 1M input / output tokens.
# Price taken from ECO mode; PRO may differ.
# Limits: https://bothub.chat/models (checked 2026-11-12): output 65536.
# Effort: reasoning_effort = low|medium|high
# Wire: POST /v1/chat/completions only (providers/bothub/provider.toml).
# No published thinking.type / thinking_budget / enable_thinking controls on this host.
# Levels: https://bothub.chat/qwen3.7-flash (checked 2026-11-12).
schema = 2
base_model = "alibaba/qwen3.7-flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
output = 65536

[api.chat-completions]
legacy_interleaved = true

[cost.text.input]
price = 0.03

[[cost.text.input.overrides]]
when = { context = { gt = 32000 } }
price = 0.11

[[cost.text.input.overrides]]
when = { context = { gt = 256000 } }
price = 0.23

[cost.text.output]
price = 0.15

[[cost.text.output.overrides]]
when = { context = { gt = 32000 } }
price = 0.45

[[cost.text.output.overrides]]
when = { context = { gt = 256000 } }
price = 0.9
