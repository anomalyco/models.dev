# Pricing: https://bothub.chat/models ECO mode, ELITE plan API rate
# (checked 2026-11-03): 1.63 / 9.81 USD per 1M input / output tokens.
# Price taken from ECO mode; PRO may differ.
schema = 2
base_model = "google/gemini-3.1-pro-preview"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[api.chat-completions]
legacy_interleaved = true

[cost.text.input]
price = 1.63

[[cost.text.input.overrides]]
when = { context = { gt = 200000 } }
price = 3.27

[cost.text.output]
price = 9.81

[[cost.text.output.overrides]]
when = { context = { gt = 200000 } }
price = 14.71
