# Pricing: https://bothub.chat/models ECO mode, ELITE plan API rate
# (checked 2026-11-12): 2.25 / 11.27 USD per 1M input / output tokens.
# Price taken from ECO mode; PRO may differ.
schema = 2
base_model = "openai/gpt-6-sol"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[api.chat-completions]
legacy_interleaved = true

[cost.text.input]
price = 2.25

[[cost.text.input.overrides]]
when = { context = { gt = 272000 } }
price = 4.51

[cost.text.output]
price = 11.27

[[cost.text.output.overrides]]
when = { context = { gt = 272000 } }
price = 16.91
