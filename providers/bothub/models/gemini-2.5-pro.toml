# Pricing: https://bothub.chat/models ECO mode, ELITE plan API rate
# (checked 2026-11-12): 1.07 / 8.57 USD per 1M input / output tokens.
# Price taken from ECO mode; PRO may differ.
# Wire: POST /v1/chat/completions only (providers/bothub/provider.toml).
# No published thinking.type / thinking_budget / enable_thinking controls on this host.
# Live probe 2026-11-13, temperature 0, "Is 391 prime?":
# reasoning_effort=low|medium|high → HTTP 200 on this id.
# usage.reasoning_tokens is 0 on low, medium and high, so it shows no graded effect.
# Effort omitted.
schema = 2
base_model = "google/gemini-2.5-pro"

[capabilities]
structured_output = true

[api.chat-completions]
legacy_interleaved = true

[cost.text.input]
price = 1.07

[[cost.text.input.overrides]]
when = { context = { gt = 200000 } }
price = 2.14

[cost.text.output]
price = 8.57

[[cost.text.output.overrides]]
when = { context = { gt = 200000 } }
price = 12.85
