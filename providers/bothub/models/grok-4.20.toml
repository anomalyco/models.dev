# Pricing: https://bothub.chat/models ECO mode, ELITE plan API rate
# (checked 2026-11-12): 1.41 / 2.82 USD per 1M input / output tokens.
# Price taken from ECO mode; PRO may differ.
# Limits: https://bothub.chat/models (checked 2026-11-12): 2M context / 1.8M output.
# Effort: reasoning_effort = low|medium|high
# Wire: POST /v1/chat/completions only (providers/bothub/provider.toml).
# No published thinking.type / thinking_budget / enable_thinking controls on this host.
# Levels: https://bothub.chat/grok-4.20 (checked 2026-11-12).
schema = 2
base_model = "xai/grok-4.20-0309-reasoning"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
context = 2_000_000
output = 1_800_000

[api.chat-completions]
legacy_interleaved = true

[cost.text.input]
price = 1.41

[[cost.text.input.overrides]]
when = { context = { gt = 200000 } }
price = 2.82

[cost.text.output]
price = 2.82

[[cost.text.output.overrides]]
when = { context = { gt = 200000 } }
price = 5.64
