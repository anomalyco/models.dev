# Pricing: https://bothub.chat/models ECO mode, ELITE plan API rate
# (checked 2026-11-03): 1.38 / 2.76 USD per 1M input / output tokens.
# Price taken from ECO mode; PRO may differ.
schema = 2
base_model = "xai/grok-4.20-0309-reasoning"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
context = 2_000_000
output = 1_800_000

[api.chat-completions]
legacy_interleaved = true

[cost.text.input]
price = 1.38

[[cost.text.input.overrides]]
when = { context = { gt = 200000 } }
price = 2.76

[cost.text.output]
price = 2.76

[[cost.text.output.overrides]]
when = { context = { gt = 200000 } }
price = 5.52
