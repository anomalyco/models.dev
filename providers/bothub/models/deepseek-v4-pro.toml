# Pricing: https://bothub.chat/models ECO mode, ELITE plan API rate
# (checked 2026-11-12): 0.74 / 2.23 USD per 1M input / output tokens.
# Price taken from ECO mode; PRO may differ.
# Effort: reasoning_effort = none|high|xhigh
# Wire: POST /v1/chat/completions only (providers/bothub/provider.toml).
# No published thinking.type / thinking_budget / enable_thinking controls on this host.
# Levels: https://bothub.chat/deepseek-v4-pro (checked 2026-11-12).
schema = 2
base_model = "deepseek/deepseek-v4-pro"

[capabilities]
reasoning = { supported = true, effort = ["none", "high", "xhigh"] }
structured_output = true

[api.chat-completions]
legacy_interleaved = true

[cost.text.input]
price = 0.74

[cost.text.output]
price = 2.23
