# Pricing: https://bothub.chat/models ECO mode, ELITE plan API rate
# (checked 2026-11-12): 1.8 / 9.02 USD per 1M input / output tokens.
# Price taken from ECO mode; PRO may differ.
# Live probe 2026-11-13: /v1/chat/completions accepted text, lark and regex custom tools and enforced the grammars (regex ZZ[0-9]{3} returned ZZ plus three digits; the lark grammar returned a matching sentence).
schema = 2
base_model = "openai/gpt-5.6-sol"

[capabilities]
tools = { supported = true, freeform = ["text", "lark", "regex"] }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 1.8

[[cost.text.input.overrides]]
when = { context = { gt = 272000 } }
price = 3.61

[cost.text.output]
price = 9.02

[[cost.text.output.overrides]]
when = { context = { gt = 272000 } }
price = 13.53
