# Pricing: https://bothub.chat/models ECO mode, ELITE plan API rate
# (checked 2026-11-03): 1.77 / 8.83 USD per 1M input / output tokens.
# Price taken from ECO mode; PRO may differ.
schema = 2
base_model = "openai/gpt-5.6-sol"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[api.chat-completions]
legacy_interleaved = true

[cost.text.input]
price = 1.77

[[cost.text.input.overrides]]
when = { context = { gt = 272000 } }
price = 3.53

[cost.text.output]
price = 8.83

[[cost.text.output.overrides]]
when = { context = { gt = 272000 } }
price = 13.25
