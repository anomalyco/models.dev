# Pricing: https://bothub.chat/models ECO mode, ELITE plan API rate
# (checked 2026-11-03): 2.21 / 6.63 USD per 1M input / output tokens.
# Price taken from ECO mode; PRO may differ.
schema = 2
base_model = "xai/grok-4.7"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true

[limit]
output = 450000

[api.chat-completions]
legacy_interleaved = true

[cost.text.input]
price = 2.21

[[cost.text.input.overrides]]
when = { context = { gt = 200000 } }
price = 4.42

[cost.text.output]
price = 6.63

[[cost.text.output.overrides]]
when = { context = { gt = 200000 } }
price = 13.25
