# GLM-5.3 753B (40B active MoE) quantized NVFP4, served on 8x NVIDIA B200
# in Madrid. Reasoning is always on; effort defaults to low.
# https://api.gpuflow.ai/v1/models (accessed 2026-09-23)
base_model = "zhipuai/glm-5.3"
name = "GLM-5.3 NVFP4"

[[reasoning_options]]
type = "effort"
values = ["low", "high"]

[interleaved]
field = "reasoning_content"

[cost]
input = 1.206
output = 3.789
cache_read = 0.224

[limit]
output = 16_384
