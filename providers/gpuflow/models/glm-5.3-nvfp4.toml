# GLM-5.3 753B (40B active MoE) quantized NVFP4, served on 8x NVIDIA B200
# in Madrid. Reasoning is always on: the chat template only reads
# reasoning_effort (low/high, anything else falls to max); it cannot be
# disabled. Default effort is low. The engine emits interleaved reasoning
# in the `reasoning` field (not reasoning_content).
# https://api.gpuflow.ai/v1/models (accessed 2026-09-23)
base_model = "zhipuai/glm-5.3"
name = "GLM-5.3 NVFP4"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 1.206
output = 3.789
cache_read = 0.224

[limit]
output = 16_384
