# ALIA 40B Instruct (BSC, Spain's public LLM) in bf16 on 1x NVIDIA B200
# in Madrid. Dense 40B, 160K context. No thinking mode and no tool calling
# on this host (ChatML template does not format tools); json_mode via
# engine guided decoding. BSC recommends temperature 0-0.2 without
# repetition penalty.
# https://api.gpuflow.ai/v1/models (accessed 2026-09-23)
base_model = "bsc-lt/alia-40b-instruct"
status = "alpha"

[cost]
input = 0.2
output = 2.0
cache_read = 0.02
