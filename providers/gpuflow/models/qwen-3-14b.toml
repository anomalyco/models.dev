# Qwen3 14B FP8 served on a MIG-sliced NVIDIA B200 in Madrid. 32K context
# as served (native 131K); tool calling is not exposed on this host
# (reasoning + json_mode only) — verified empirically: a live tools request
# returns finish_reason=stop with no tool_calls. The engine emits
# interleaved reasoning in the `reasoning` field (not reasoning_content).
# https://api.gpuflow.ai/v1/models (accessed 2026-09-23)
# https://gpuflow.ai/es/docs
base_model = "alibaba/qwen3-14b"
name = "Qwen3 14B FP8"
tool_call = false
structured_output = true
# Public API contract (https://gpuflow.ai/es/docs): reasoning.effort accepts
# "low", "medium", "high" or "none" (off), and reasoning.max_tokens /
# thinking.budget_tokens set the thinking budget directly.
reasoning_options = [
  { type = "effort", values = ["none", "low", "medium", "high"] },
  { type = "budget_tokens" },
]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.2
output = 1.0
cache_read = 0.02

[limit]
context = 32_768
