# Qwen3.5 9B (FP8) served on a MIG-sliced NVIDIA B200 in Madrid,
# text-only, 64K context.
# https://api.gpuflow.ai/v1/models (accessed 2026-09-23)
base_model = "alibaba/qwen3.5-9b"

[[reasoning_options]]
type = "toggle"

[interleaved]
field = "reasoning_content"

[cost]
input = 0.1
output = 0.15
cache_read = 0.01

[limit]
context = 65_536
output = 8_192

[modalities]
input = ["text"]
output = ["text"]
