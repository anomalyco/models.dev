# Qwen3.5 9B (FP8) served on a MIG-sliced NVIDIA B200 in Madrid,
# text-only (the lab entry includes image/video), 64K context. The engine
# The host emits interleaved reasoning in both `reasoning` (vLLM v0.20's
# native field) and `reasoning_content` (OpenAI-compatible/DeepSeek
# convention; the gateway duplicates it) — verified on the live API on
# 2026-09-23.
# https://api.gpuflow.ai/v1/models (accessed 2026-09-23)
# https://gpuflow.ai/es/docs
base_model = "alibaba/qwen3.5-9b"
attachment = false

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high"]

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 0.1
output = 0.15
cache_read = 0.01

[limit]
context = 65_536
output = 8_192

[modalities]
input = ["text"]
