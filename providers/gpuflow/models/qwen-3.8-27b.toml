# Qwen3.8 27B (NVFP4) served on a MIG-sliced NVIDIA B200 in Madrid,
# text-only, 96K context.
# https://api.gpuflow.ai/v1/models (accessed 2026-09-23)
base_model = "alibaba/qwen3.8-27b"
attachment = false

# Effort surface verified against the GPU Flow proxy (translation.py,
# accessed 2026-09-23): reasoning.effort -> vLLM thinking budget
# { none: 0 (off), minimal: 1024, low: 4000, medium: 4000, high: 8000,
# xhigh: 16000 }. reasoning.max_tokens / thinking.budget_tokens set the
# budget directly (MIN_THINKING_BUDGET = 1024; no declared max â€” the
# proxy trims the budget to fit the output limit). "none" in effort
# covers off, so no separate toggle.
reasoning_options = [
  { type = "effort", values = ["none", "minimal", "low", "medium", "high", "xhigh"] },
  { type = "budget_tokens", min = 1024 },
]

# The serving stack emits interleaved reasoning in the `reasoning` field
# (not `reasoning_content`), which the current interleaved.field enum cannot
# express, so no interleaved side channel is declared here.

[cost]
input = 0.1
output = 0.3
cache_read = 0.01

[limit]
context = 98_304
output = 8_192

[modalities]
input = ["text"]
output = ["text"]
