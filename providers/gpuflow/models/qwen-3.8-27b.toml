# Qwen3.8 27B (NVFP4) served on a MIG-sliced NVIDIA B200 in Madrid,
# text-only, 96K context.
# https://api.gpuflow.ai/v1/models (accessed 2026-09-23)
base_model = "alibaba/qwen3.8-27b"
attachment = false

# Effort maps to a thinking budget: none=0 (off), minimal=1024,
# low=medium=4000, high=8000, xhigh=16000. reasoning.max_tokens /
# thinking.budget_tokens set the budget directly (min 1024).
reasoning_options = [
  { type = "effort", values = ["none", "minimal", "low", "medium", "high", "xhigh"] },
  { type = "budget_tokens", min = 1024 },
]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.1
output = 0.3
cache_read = 0.01

[limit]
context = 98_304
output = 8_192

[modalities]
input = ["text"]
output = ["text"]
