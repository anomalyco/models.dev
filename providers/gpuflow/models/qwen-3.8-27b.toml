# Qwen3.8 27B (NVFP4) served on a MIG-sliced NVIDIA B200 in Madrid,
# text-only (the lab entry includes image/video), 96K context. The engine
# The host emits interleaved reasoning in both `reasoning` (vLLM v0.20's
# native field) and `reasoning_content` (OpenAI-compatible/DeepSeek
# convention; the gateway duplicates it) — verified on the live API on
# 2026-09-23.
# https://api.gpuflow.ai/v1/models (accessed 2026-09-23)
# https://gpuflow.ai/es/docs
base_model = "alibaba/qwen3.8-27b"
attachment = false
# Public API contract (https://gpuflow.ai/es/docs): reasoning.effort accepts
# "low", "medium", "high" or "none" (off), and reasoning.max_tokens /
# thinking.budget_tokens set the thinking budget directly.
reasoning_options = [
  { type = "effort", values = ["none", "low", "medium", "high"] },
  { type = "budget_tokens" },
]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.1
output = 0.3
cache_read = 0.01

[limit]
context = 98_304
output = 8_192

[modalities]
input = ["text"]
output = ["text"]
