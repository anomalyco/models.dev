# Qwen3.8 27B (NVFP4) served on a MIG-sliced NVIDIA B200 in Madrid,
# text-only (the lab entry includes image/video), 96K context.
# The host emits interleaved reasoning in both `reasoning` (vLLM v0.20's
# native field) and `reasoning_content` (OpenAI-compatible/DeepSeek
# convention; the gateway duplicates it) — verified on the live API on
# 2026-09-23.
# Wire controls (public API, https://gpuflow.ai/es/docs; gateway-declared
# modelsdev block: https://api.gpuflow.ai/v1/models?audience=modelsdev):
# reasoning.effort accepts "none" (off), "low" and "high" — each maps to a
# distinct vLLM thinking budget (0 / 4,000 / 8,000 tokens; verified live
# with a demanding prompt: low 16,307 reasoning chars vs high 30,332).
# "medium" is accepted as an alias of low (same 4,000 budget, identical
# output). reasoning.max_tokens sets the thinking budget directly (verified
# live: with the output cap fixed, the reasoning block scales with it) and
# maps to thinking.budget_tokens in the Anthropic dialect.
# https://api.gpuflow.ai/v1/models (accessed 2026-09-23)
base_model = "alibaba/qwen3.8-27b"
attachment = false

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "high"]

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 0.1
output = 0.3
cache_read = 0.01

[limit]
context = 98_304
output = 8_192

[modalities]
input = ["text"]
