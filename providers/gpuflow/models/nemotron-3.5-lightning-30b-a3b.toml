# Toggle: enable_thinking = true|false (chat_template_kwargs passthrough).
# NVIDIA Nemotron 3.5 Lightning 30B-A3B MoE (~3B active, Mamba-2 hybrid)
# in NVFP4 on a MIG-sliced B200 in Madrid, 128K context as served. Tool
# calling verified empirically against the engine (qwen3_coder parser,
# 2026-09-23); json_mode is not published on this host. The host emits interleaved reasoning in both `reasoning` (vLLM v0.20's
# native field) and `reasoning_content` (OpenAI-compatible/DeepSeek
# convention; the gateway duplicates it) — verified on the live API on
# 2026-09-23.
# https://api.gpuflow.ai/v1/models (accessed 2026-09-23)
base_model = "nvidia/nemotron-3.5-lightning"
reasoning_options = [{ type = "toggle" }]
structured_output = false

[interleaved]
field = "reasoning_content"

[cost]
input = 0.12
output = 0.3

[limit]
context = 131_072
output = 16_384
