# Toggle: enable_thinking = true|false (chat_template_kwargs passthrough).
# Gemma 4 26B-A4B IT (NVFP4) served on a MIG-sliced NVIDIA B200 in Madrid.
# Text+image input, 32K context. json_mode is not exposed on this host.
# The host emits interleaved reasoning in both `reasoning` (vLLM v0.20's
# native field) and `reasoning_content` (OpenAI-compatible/DeepSeek
# convention; the gateway duplicates it) — verified on the live API on
# 2026-09-23.
# https://api.gpuflow.ai/v1/models (accessed 2026-09-23)
base_model = "google/gemma-4-26b-a4b-it"
structured_output = false
reasoning_options = [{ type = "toggle" }]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.12
output = 0.3
cache_read = 0.012

[limit]
context = 32_768
output = 8_192
