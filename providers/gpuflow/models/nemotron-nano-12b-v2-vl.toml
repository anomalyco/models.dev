# NVIDIA Nemotron Nano 12B v2 VL (NVFP4) on a MIG-sliced NVIDIA B200 in
# Madrid. Vision-only serving on this host: the engine deployment has no
# --reasoning-parser and no --tool-call-parser configured, and the catalog
# publishes only the vision feature, so reasoning and tool calling are
# false here while the lab entry keeps them true. Text+image input (no
# video served), 128K context, up to 4 images per prompt.
# https://api.gpuflow.ai/v1/models (accessed 2026-09-23)
base_model = "nvidia/nemotron-nano-12b-v2-vl"
reasoning = false
tool_call = false

[cost]
input = 0.06
output = 0.24

[limit]
context = 131_072
output = 16_384

[modalities]
input = ["text", "image"]
output = ["text"]
