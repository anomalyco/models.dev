# DeepSeek V4 Flash (checkpoint 0731) served in FP8 on 2x NVIDIA B200 in
# Madrid with 512K context.
# https://api.gpuflow.ai/v1/models (accessed 2026-09-23)
base_model = "deepseek/deepseek-v4-flash-0731"

# Toggle: reasoning enabled|disabled. Effort: high|max.
[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["high", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.14
output = 0.28
cache_read = 0.014

[limit]
context = 524_288
output = 16_384
