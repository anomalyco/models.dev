# DeepSeek V4 Flash (checkpoint 0731) served in FP8 on 2x NVIDIA B200 in
# Madrid with 512K context. Display name drops the checkpoint suffix used
# by the lab entry. The host emits interleaved reasoning in both
# `reasoning` (vLLM v0.20's native field) and `reasoning_content`
# (OpenAI-compatible/DeepSeek convention; the gateway duplicates it) —
# verified on the live API on 2026-09-23.
# Effort: reasoning.effort = none|high|max. "none" disables thinking —
# verified on the live API (2026-09-23): effort "none" returns a direct
# answer with no reasoning block. "high" (default) and "max" grade the
# thinking; low/medium map to high at the chat template.
# https://api.gpuflow.ai/v1/models (accessed 2026-09-23)
base_model = "deepseek/deepseek-v4-flash-0731"
name = "DeepSeek V4 Flash"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["none", "high", "max"]

[cost]
input = 0.14
output = 0.28
cache_read = 0.014

[limit]
context = 524_288
output = 16_384
