# DeepSeek V4 Pro (checkpoint 0813) served in FP8 on 8x NVIDIA B200 in
# Madrid with 1M context.
# https://api.gpuflow.ai/v1/models (accessed 2026-09-23)
base_model = "deepseek/deepseek-v4-pro-0813"

# Toggle: reasoning enabled|disabled. Effort: high|max.
[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["high", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.8
output = 2.6
cache_read = 0.08

[limit]
output = 16_384
