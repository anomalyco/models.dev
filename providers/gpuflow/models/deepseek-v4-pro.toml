# DeepSeek V4 Pro (checkpoint 0813) served in FP8 on 8x NVIDIA B200 in
# Madrid with 1M context. Display name drops the checkpoint suffix used
# by the lab entry. The engine emits interleaved reasoning in the
# `reasoning` field (not reasoning_content).
# Toggle: reasoning.enabled = false | thinking.type = disabled |
# enable_thinking = false (-> chat_template_kwargs.enable_thinking = false).
# Effort: reasoning_effort = high|max (default high; the chat template maps
# low/medium to high).
# https://api.gpuflow.ai/v1/models (accessed 2026-09-23)
base_model = "deepseek/deepseek-v4-pro-0813"
name = "DeepSeek V4 Pro"

reasoning_options = [
  { type = "toggle" },
  { type = "effort", values = ["high", "max"] },
]

[cost]
input = 0.8
output = 2.6
cache_read = 0.08

[limit]
output = 16_384
