# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|high|max
# https://api.openference.com/v1/models (accessed 2026-08-13)
base_model = "deepseek/deepseek-v4-flash"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 0.14
output = 0.28
cache_read = 0.0028

[limit]
context = 920_576
