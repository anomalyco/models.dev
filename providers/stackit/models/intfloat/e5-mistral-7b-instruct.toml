# Prices: STACKIT lists EUR per 1M tokens (net): https://stackit.com/en/products/data-ai/stackit-ai-model-serving
# Embedding model (POST /embeddings); only input tokens are billed, so output is 0.
# EUR 0.02 converted at the ECB reference rate of 1.1215 USD/EUR (2026-10-20); it was stored unconverted.
schema = 2
type = "embedding"
name = "E5 Mistral 7B"
description = "Embedding model for semantic search, retrieval, clustering, and ranking pipelines"
family = "mistral"
open_weights = true
release_date = "2023-12-11"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = false
temperature = false

[limit]
context = 4_096
output = 4_096

[api.embeddings]
sdk = { opencodeai = "none" }

[cost.text.input]
price = 0.02243

[cost.text.output]
price = 0
