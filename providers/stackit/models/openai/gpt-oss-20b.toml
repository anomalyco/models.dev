# Prices: STACKIT lists EUR per 1M tokens (net): https://stackit.com/en/products/data-ai/stackit-ai-model-serving
# Existing USD values were converted at about 1.17 USD/EUR (original rate and date not recorded).
schema = 2
base_model = "openai/gpt-oss-20b"

[capabilities]
reasoning = { supported = true }
structured_output = false

[limit]
output = 8_192

[cost.text.input]
price = 0.18

[cost.text.output]
price = 0.29
