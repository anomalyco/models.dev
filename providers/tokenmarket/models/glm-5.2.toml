# Alibaba Cloud (DashScope) channel. Same-channel peers expose effective
# `reasoning_effort = high | max`; there is no verified gateway-specific
# `none` switch for this hosted GLM.
base_model = "zhipuai/glm-5.2"
reasoning_options = [{ type = "effort", values = ["high", "max"] }]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.944
output = 3.296
cache_read = 0.232
