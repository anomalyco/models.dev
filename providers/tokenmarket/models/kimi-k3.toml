# Alibaba Cloud (DashScope) channel.
# Toggle: `enable_thinking = false` (effort "none") | `enable_thinking = true`.
# Effort: `reasoning_effort = low | high | max`, matching the tunnel payload and
# the same-model DashScope/native surface. No gateway-specific collapse evidence.
base_model = "moonshotai/kimi-k3"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 3.0
output = 15.0
cache_read = 0.3
