# Alibaba Cloud (DashScope) channel.
# Toggle: `enable_thinking = false` (effort "none") | `enable_thinking = true`.
# Effort: `reasoning_effort = low | high | max`; preserve DashScope Flash's
# distinct low level, consistent with same-channel peers and the native model.
# `thinking_budget` is projected for the Qwen family only, so no budget_tokens here.
base_model = "deepseek/deepseek-v4-flash"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.22
output = 0.665
cache_read = 0.022
