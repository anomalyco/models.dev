# Servable on GET /v1/models but not yet listed in the public pricing catalog,
# so [cost] is omitted rather than guessed.
# Generic OpenAI-compatible channel. The reasoning toggle is sent through
# `reasoning_effort`: `"none"` disables reasoning, while a non-`"none"` value
# enables it. No documented graded effort ladder is exposed for MiMo V2.5 Pro.
base_model = "xiaomi/mimo-v2.5-pro"
reasoning_options = [{ type = "toggle" }]

[interleaved]
field = "reasoning_content"