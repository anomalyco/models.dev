# Servable on GET /v1/models but not yet listed in the public pricing catalog,
# so [cost] is omitted rather than guessed.
# Generic OpenAI-compatible channel. The verified `reasoning_effort: none`
# control disables reasoning; no other graded values are documented on this channel.
base_model = "xiaomi/mimo-v2.5-pro"
reasoning_options = [{ type = "effort", values = ["none"] }]

[interleaved]
field = "reasoning_content"