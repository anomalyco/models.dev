# Prices from https://www.ruapi.ai/pricing (standard rate), checked 2026-10-23. USD per 1M tokens.
# OpenAI-compatible POST https://www.ruapi.ai/v1/chat/completions; prompt caching is automatic.
# Effort: reasoning_effort = none|low|medium|high|xhigh (forwarded unchanged)
schema = 2
base_model = "openai/gpt-5.4-mini"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
cache = { implicit = true }
structured_output = true

[cost.text.input]
price = 0.9
cache = { read = 0.09 }

[cost.text.output]
price = 5.4
