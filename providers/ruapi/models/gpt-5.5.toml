# Prices from https://www.ruapi.ai/pricing (standard rate), checked 2026-10-23. USD per 1M tokens.
# A prompt over 272,000 tokens (cached tokens included) is billed entirely at the higher tier, as at OpenAI.
# OpenAI-compatible POST https://www.ruapi.ai/v1/chat/completions; prompt caching is automatic.
# Effort: reasoning_effort = none|low|medium|high|xhigh (forwarded unchanged)
schema = 2
base_model = "openai/gpt-5.5"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
cache = { implicit = true }
structured_output = true

[cost.text.input]
price = 6
cache = { read = 0.6 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 12
cache = { read = 1.2 }

[cost.text.output]
price = 36

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 54
