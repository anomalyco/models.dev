# Pricing: https://www.ruapi.ai/pricing (standard tier, USD per 1M tokens, accessed 2026-10-16)
# Served over the native Anthropic Messages API (POST https://www.ruapi.ai/v1/messages); cache_control is forwarded unchanged.
# A prompt over 100,000 tokens (cached tokens included) is billed entirely at the higher tier, as at Anthropic.
# Toggle: thinking.type = adaptive|disabled (disabled only at high effort or below)
# Effort: output_config.effort = low|medium|high|xhigh|max
base_model = "anthropic/claude-haiku-5-5"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh", "max"]

[cost]
input = 0.12
output = 0.60
cache_read = 0.012
cache_write = 0.15

[[cost.tiers]]
tier = { type = "context", size = 100_000 }
input = 0.60
output = 3.00
cache_read = 0.06
cache_write = 0.75

[provider]
npm = "@ai-sdk/anthropic"
api = "https://www.ruapi.ai/v1"
