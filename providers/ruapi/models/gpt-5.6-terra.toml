# Prices from https://www.ruapi.ai/pricing (standard rate), checked 2026-10-23. USD per 1M tokens.
# A prompt over 272,000 tokens (cached tokens included) is billed entirely at the higher tier, as at OpenAI.
# OpenAI-compatible POST https://www.ruapi.ai/v1/chat/completions; prompt caching is automatic.
# Cache writes are billed at the listed write price only when the upstream response reports cache-write
# tokens (GPT-5.6 models report them for automatic caching too); otherwise only reads are discounted.
# Effort: reasoning_effort = none|low|medium|high|xhigh|max (forwarded unchanged)
schema = 2
base_model = "openai/gpt-5.6-terra"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
cache = { implicit = true }
structured_output = true

[cost.text.input]
price = 2.4
cache = { read = 0.24, write = 3 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 4.8
cache = { read = 0.48, write = 6 }

[cost.text.output]
price = 14.4

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 21.6
