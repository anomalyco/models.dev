# Source: https://api.saygm.com/v1/models (accessed 2026-10-14); price = cheapest eligible offer, market-set.
# Thinking: adaptive (default). thinking.type=disabled is accepted at high effort or below; xhigh/max reject it.
base_model = "anthropic/claude-haiku-5-5"
reasoning_options = [{ type = "toggle" }, { type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 0.09
output = 0.45
cache_read = 0.009
cache_write = 0.1125

[provider]
npm = "@ai-sdk/anthropic"
api = "https://api.saygm.com/v1"
