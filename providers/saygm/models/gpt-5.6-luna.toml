# Prices: SayGM route_ceiling, the highest eligible offer and so the most a request can
# settle at (https://api.saygm.com/v1/models, nano-dollars / 1e9, read 2026-11-17).
# Routed over the Responses API: OpenAI rejects function tools combined with
# reasoning_effort on /v1/chat/completions for this model.
# tools.freeform: live probe 2026-11-17 on api.saygm.com (custom tool, tool_choice=required, asked
# for HELLO): regex ZZ[0-9]{3} and the equivalent lark grammar both returned ZZ plus three digits
# (grammar enforced), and format text returned HELLO, on /v1/responses. /v1/chat/completions rejects
# custom tools (400 "only function tools can be translated"), so freeform is set on Responses only.
schema = 2
base_model = "openai/gpt-5.6-luna"

[capabilities]
structured_output = true
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
cache = { implicit = { min_tokens = 1_024 }, explicit = { ttl = ["30m"], max_breakpoints = 4, min_tokens = 1_024 } }

[api.responses]
base_url = "https://api.saygm.com/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }
capabilities = { tools = { freeform = ["text", "lark", "regex"] } }

[api.chat-completions]

[cost.text.input]
price = 0.1751
cache = { read = 0.01751, write = 0.218875 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 0.3502
cache = { read = 0.03502, write = 0.43775 }

[cost.text.output]
price = 1.0506

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 1.5759
