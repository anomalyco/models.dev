# Prices: SayGM route_ceiling, the highest eligible offer and so the most a request can
# settle at (https://api.saygm.com/v1/models, nano-dollars / 1e9, read 2026-10-23).
# Toggle: thinking.type = enabled|disabled
# SayGM serves this id text-only (its /v1/models capabilities report vision: false).
# Reasoning output: reasoning_content
schema = 2
base_model = "xiaomi/mimo-v2.6-pro-ultraspeed"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 3.915
cache = { read = 0.0324 }

[cost.text.output]
price = 7.83
