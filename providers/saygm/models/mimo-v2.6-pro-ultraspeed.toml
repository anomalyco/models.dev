# Toggle: thinking.type = enabled|disabled
# SayGM serves this id text-only (its /v1/models capabilities report vision: false).
# Reasoning output: reasoning_content
schema = 2
base_model = "xiaomi/mimo-v2.6-pro-ultraspeed"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 3.915
cache = { read = 0.0324 }

[cost.text.output]
price = 7.83
