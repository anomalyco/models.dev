# Prices: SayGM route_ceiling, the highest eligible offer and so the most a request can
# settle at (https://api.saygm.com/v1/models, nano-dollars / 1e9, read 2026-10-23).
# Served only on the Responses API (SayGM /v1/models api_shapes = ["responses"]).
schema = 2
base_model = "openai/gpt-5.5-pro"

[capabilities]
structured_output = true
reasoning = { supported = true, effort = ["medium", "high", "xhigh"] }
cache = false

[api.responses]
base_url = "https://api.saygm.com/v1"
sdk = { aisdk = "@ai-sdk/openai" }

[cost.text.input]
price = 24

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 48

[cost.text.output]
price = 144

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 216
