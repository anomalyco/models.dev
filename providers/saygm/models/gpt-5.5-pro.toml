# Served only on the Responses API (SayGM /v1/models api_shapes = ["responses"]).
base_model = "openai/gpt-5.5-pro"
base_model_omit = ["cost"]

[[reasoning_options]]
type = "effort"
values = ["medium", "high", "xhigh"]

[provider]
npm = "@ai-sdk/openai"
api = "https://api.saygm.com/v1"
shape = "responses"
