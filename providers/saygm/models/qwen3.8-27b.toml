# Prices: SayGM route_ceiling, the highest eligible offer and so the most a request can
# settle at (https://api.saygm.com/v1/models, nano-dollars / 1e9, read 2026-10-23).
# Effort: reasoning_effort = low|medium|xhigh
# Source: https://huggingface.co/Qwen/Qwen3.8-27B
# Toggle: chat_template_kwargs.enable_thinking = true|false
# Budget: thinking_budget 0-262144 (SayGM forwards it unchanged; not combinable with reasoning_effort)
# Reasoning output: reasoning_content
schema = 2
base_model = "alibaba/qwen3.8-27b"

[capabilities]
structured_output = true
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "xhigh"], budget = { min = 0, max = 262_144 } }
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.5
cache = { read = 0.1 }

[cost.text.output]
price = 3
