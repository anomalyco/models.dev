# Toggle: chat_template_kwargs.enable_thinking = true|false
# Source: https://huggingface.co/ornith-ai/Ornith-1.5-397B (chat template exposes enable_thinking;
# the model card documents a 262,144-token context and evaluates with max_new_tokens=131072)
schema = 2
base_model = "deepreinforce/ornith-1.5-397b"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
output = 131_072

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.7
cache = { read = 0.13 }

[cost.text.output]
price = 2.2
