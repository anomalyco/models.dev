# Prices: SayGM route_ceiling, the highest eligible offer and so the most a request can
# settle at (https://api.saygm.com/v1/models, nano-dollars / 1e9, read 2026-10-23).
schema = 2
base_model = "openai/gpt-5.4"

[capabilities]
structured_output = true
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
cache = { implicit = { ttl = ["24h"], min_tokens = 1_024 } }

[api.chat-completions]

[api.responses]
base_url = "https://api.saygm.com/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 2.25
cache = { read = 0.225 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 4.5
cache = { read = 0.45 }

[cost.text.output]
price = 13.5

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 20.25
