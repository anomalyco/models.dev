# Prices: SayGM route_ceiling, the highest eligible offer and so the most a request can
# settle at (https://api.saygm.com/v1/models, nano-dollars / 1e9, read 2026-11-17).
# tools.freeform: live probe 2026-11-17 on api.saygm.com (custom tool, tool_choice=required, asked
# for HELLO): regex ZZ[0-9]{3} and the equivalent lark grammar both returned ZZ plus three digits
# (grammar enforced), and format text returned HELLO, on /v1/chat/completions and /v1/responses.
schema = 2
base_model = "openai/gpt-5.4"

[capabilities]
tools = { supported = true, freeform = ["text", "lark", "regex"] }
structured_output = true
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
cache = { implicit = { ttl = ["24h"], min_tokens = 1_024 } }

[api.chat-completions]

[api.responses]
base_url = "https://api.saygm.com/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 2.18875
cache = { read = 0.218875 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 4.3775
cache = { read = 0.43775 }

[cost.text.output]
price = 13.1325

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 19.69875
