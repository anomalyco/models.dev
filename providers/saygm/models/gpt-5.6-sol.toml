# Routed over the Responses API: OpenAI rejects function tools combined with
# reasoning_effort on /v1/chat/completions for this model.
base_model = "openai/gpt-5.6-sol"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "xhigh", "max"]

[cost]
input = 2.952
output = 14.76
cache_read = 0.2952
cache_write = 3.69

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 5.904
output = 22.14
cache_read = 0.5904
cache_write = 7.38

[provider]
npm = "@ai-sdk/openai"
api = "https://api.saygm.com/v1"
shape = "responses"
