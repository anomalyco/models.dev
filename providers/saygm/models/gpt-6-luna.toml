# Routed over the Responses API: OpenAI rejects function tools combined with
# reasoning_effort on /v1/chat/completions for this model.
base_model = "openai/gpt-6-luna"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "xhigh", "max"]

[cost]
input = 0.0738
output = 0.369
cache_read = 0.00738
cache_write = 0.09225

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 0.1476
output = 0.5535
cache_read = 0.01476
cache_write = 0.1845

[provider]
npm = "@ai-sdk/openai"
api = "https://api.saygm.com/v1"
shape = "responses"
