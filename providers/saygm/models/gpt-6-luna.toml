cache = { read = 0.00738, write = 0.09225 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 0.1476
cache = { read = 0.01476, write = 0.1845 }

[cost.text.output]
price = 0.369

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
