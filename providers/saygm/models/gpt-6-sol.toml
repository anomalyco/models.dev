# Prices: SayGM route_ceiling, the highest eligible offer and so the most a request can
# settle at (https://api.saygm.com/v1/models, nano-dollars / 1e9, read 2026-10-23).
# Routed over the Responses API: OpenAI rejects function tools combined with
# reasoning_effort on /v1/chat/completions for this model.
schema = 2
base_model = "openai/gpt-6-sol"

[capabilities]
structured_output = true
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
cache = { implicit = { min_tokens = 1_024 }, explicit = { ttl = ["30m"], max_breakpoints = 4, min_tokens = 1_024 } }

[api.responses]
base_url = "https://api.saygm.com/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.chat-completions]

[cost.text.input]
price = 1.8
cache = { read = 0.18, write = 2.25 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 3.6
cache = { read = 0.36, write = 4.5 }

[cost.text.output]
price = 9

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 13.5
