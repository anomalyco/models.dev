# Routed over the Responses API: OpenAI rejects function tools combined with
# reasoning_effort on /v1/chat/completions for this model.
base_model = "openai/gpt-6-sol"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "xhigh", "max"]

[cost]
input = 1.476
output = 7.38
cache_read = 0.1476
cache_write = 1.845

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 2.952
output = 11.07
cache_read = 0.2952
cache_write = 3.69

[provider]
npm = "@ai-sdk/openai"
api = "https://api.saygm.com/v1"
shape = "responses"
