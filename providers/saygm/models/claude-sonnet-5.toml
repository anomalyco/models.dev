# Toggle: thinking.type = enabled|disabled (Anthropic Messages wire; SayGM mirrors upstream)
# Effort: output_config.effort = low|medium|high|xhigh|max
base_model = "anthropic/claude-sonnet-5"
base_model_omit = ["cost"]

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh", "max"]

[provider]
npm = "@ai-sdk/anthropic"
api = "https://api.saygm.com/v1"
