# Sources (accessed 2026-11-28):
# - https://usemodellane.com/v1/public/models for this ID: contextWindowTokens 1048576, maxOutputTokens 1000000,
#   inputModalities text, features streaming, tools, json_mode, reasoning;
#   USD per 1M tokens input 2 / cached input 0.3 / output 4 (same table on https://usemodellane.com/docs/models-pricing).
# - https://usemodellane.com/docs/api/chat-completions: reasoning arrives in reasoning_content; response_format takes text|json_object only;
#   stream_options.include_usage adds a final usage chunk; unlisted fields (top_k included) are accepted and ignored.
# - https://usemodellane.com/docs/guides/context-caching: caching is automatic, no parameter.
# - Same key and models on https://usemodellane.com/docs/guides/responses-api and https://usemodellane.com/docs/guides/anthropic-api.
# Effort: reasoning_effort (Chat Completions), reasoning.effort (Responses), output_config.effort (Messages) = low|high|max;
#   per-model set is reasoningEfforts in https://usemodellane.com/v1/public/models, other values fail with HTTP 400
#   unsupported_reasoning_effort (https://usemodellane.com/docs/api/chat-completions,
#   https://usemodellane.com/docs/guides/responses-api#reasoning, https://usemodellane.com/docs/guides/anthropic-api#thinking);
#   reasoning cannot be turned off (none is rejected); no budget (Messages thinking only chooses whether reasoning is returned).
schema = 2
base_model = "zhipuai/glm-5.3"
name = "GLM-5.3 Abliterated"
description = "Abliterated variant of GLM-5.3"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
top_k = false
stream_usage = true
cache = { implicit = true }

[limit]
context = 1_048_576
output = 1_000_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 2
cache = { read = 0.3 }

[cost.text.output]
price = 4
