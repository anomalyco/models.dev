# Sources (accessed 2026-11-28):
# - https://usemodellane.com/v1/public/models for this ID: contextWindowTokens 1048576, maxOutputTokens 131072,
#   inputModalities text|image, features streaming, tools, json_mode, vision, reasoning;
#   USD per 1M tokens input 0.24 / cached input 0.038 / output 0.9 (same table on https://usemodellane.com/docs/models-pricing).
# - https://usemodellane.com/docs/api/chat-completions: reasoning arrives in reasoning_content; response_format takes text|json_object only;
#   stream_options.include_usage adds a final usage chunk; unlisted fields (top_k included) are accepted and ignored.
# - https://usemodellane.com/docs/guides/context-caching: caching is automatic, no parameter.
# - https://usemodellane.com/docs/guides/vision: PNG, JPEG, WebP and GIF as base64 data URLs; no video or file parts.
# - Same key and models on https://usemodellane.com/docs/guides/responses-api and https://usemodellane.com/docs/guides/anthropic-api.
# Effort: reasoning_effort (Chat Completions), reasoning.effort (Responses), output_config.effort (Messages) = none|low|high|max;
#   per-model set is reasoningEfforts in https://usemodellane.com/v1/public/models, other values fail with HTTP 400
#   unsupported_reasoning_effort (https://usemodellane.com/docs/api/chat-completions,
#   https://usemodellane.com/docs/guides/responses-api#reasoning, https://usemodellane.com/docs/guides/anthropic-api#thinking);
#   none turns reasoning off; no separate toggle and no budget (Messages thinking only chooses whether reasoning is returned).
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"
name = "DeepSeek V4.1 Flash Abliterated"
description = "Abliterated variant of DeepSeek V4.1 Flash"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
top_k = false
stream_usage = true
cache = { implicit = true }

[limit]
context = 1_048_576
output = 131_072

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.24
cache = { read = 0.038 }

[cost.text.output]
price = 0.9
