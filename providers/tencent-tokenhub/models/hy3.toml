# Pricing (USD per million tokens, intl list price, accessed 2026-11-24):
#   https://intl.cloud.tencent.com/document/product/1300/78937 (input 0.132, output 0.528, cache hit 0.033;
#   no cache-write price is published). China list: CNY 1 / 4 / 0.25, https://cloud.tencent.com/document/product/1823/130055
# hy3-preview was retired on TokenHub (notice 2026-07-28, https://cloud.tencent.com/announce/detail/2391) and is
#   gone from the model list; only the Hy Token Plan still accepts it, routed to Hy3.
# Capabilities (structured output, function calling, caching): https://cloud.tencent.com/document/product/1823/130051
# Effort: reasoning_effort = low|high|no_think (default high). no_think turns thinking off, so it is
#   "none" here with no separate toggle (thinking.type also exists, default enabled).
#   https://cloud.tencent.com/document/product/1823/131208 (updated 2026-11-16)
schema = 2
base_model = "tencent/hy3"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.132
cache = { read = 0.033 }

[cost.text.output]
price = 0.528
