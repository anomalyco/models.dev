# Model list and API: https://cloud.tencent.com/document/product/1823/133515 (POST /v1/embeddings, OpenAI-compatible;
#   the host caps each input text at 2,000 characters). Pricing: https://cloud.tencent.com/document/product/1823/130055
#   (向量模型: CNY 0.6 per 1M text input tokens), accessed 2026-11-08. Not probed live (no TokenHub key available).
# CNY→USD rate: 6.690826, 2026-11-08, source: https://open.er-api.com/v6/latest/USD
schema = 2
v2_only = true
base_model = "tencent/kinfra-text-embedding-4b"

[api.embeddings]
sdk = { opencodeai = "@opencode/ai/providers/openai-compatible/embeddings" }

[cost.text.input]
price = 0.089675

[cost.text.output]
price = 0
