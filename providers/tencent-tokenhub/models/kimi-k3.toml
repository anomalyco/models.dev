# Pricing (USD per million tokens, intl list price, accessed 2026-11-24):
#   https://intl.cloud.tencent.com/document/product/1300/78937 (input 3, output 15, cache hit 0.3, cache write 5m 3, 1h 6).
#   China list: https://cloud.tencent.com/document/product/1823/130055
# Availability and limits: https://cloud.tencent.com/document/product/1823/130051 (updated 2026-11-17)
# Implicit cache: https://cloud.tencent.com/document/product/1823/131410
# API: https://cloud.tencent.com/document/product/1823/132232
# Effort: reasoning_effort = low|high|max (default max); thinking cannot be disabled.
# Reasoning guide: https://cloud.tencent.com/document/product/1823/131208 (updated 2026-11-16)
schema = 2
base_model = "moonshotai/kimi-k3"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }


[cost.text.input]
price = 3
cache = { read = 0.3, write = { "5m" = 3, "1h" = 6 } }

[cost.text.output]
price = 15
