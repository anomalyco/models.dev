# Pricing (USD per million tokens, intl list price, accessed 2026-11-24):
#   https://intl.cloud.tencent.com/document/product/1300/78937 (input 1, output 4, cache hit 0.25).
#   China list: https://cloud.tencent.com/document/product/1823/130055
# Availability and limits: https://cloud.tencent.com/document/product/1823/130051 (updated 2026-11-17)
# Implicit cache: https://cloud.tencent.com/document/product/1823/131410
# API: https://cloud.tencent.com/document/product/1823/132232
# Effort: reasoning_effort = none|low|high|max (default max); none turns thinking off, so no separate
#   toggle. Tencent's reasoning guide (https://cloud.tencent.com/document/product/1823/131208) doesn't
#   list K2.8 Preview yet; controls follow the Kimi Code docs for this model
#   (https://www.kimi.com/code/docs/en/kimi-code/models.html).
schema = 2
base_model = "moonshotai/kimi-k2.8-preview"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[limit]
output = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }


[cost.text.input]
price = 1
cache = { read = 0.25 }

[cost.text.output]
price = 4
