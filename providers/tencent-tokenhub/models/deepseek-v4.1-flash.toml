# Pricing (USD per million tokens, intl list price, accessed 2026-11-24):
#   https://intl.cloud.tencent.com/document/product/1300/78937 (input 0.15, output 0.6, cache hit 0.003; doubled at peak).
#   China list: https://cloud.tencent.com/document/product/1823/130055
# Peak: Mon-Fri 09:00-12:00 and 14:00-18:00 Beijing time (UTC 01:00-04:00, 06:00-10:00), by request receipt time.
# Availability and limits: https://cloud.tencent.com/document/product/1823/130051 (updated 2026-11-17)
# Tencent id deepseek-v4.1-flash; documented upstream version: DeepSeek-V4.1-Flash.
# Implicit cache: https://cloud.tencent.com/document/product/1823/131410; no cache-write price is published.
# Controls (same as the Tencent Token Plan and DeepSeek entries for this model):
#   Toggle: thinking.type = enabled|disabled (default enabled)
#   Effort: reasoning_effort = low|high|max
# Reasoning guide: https://cloud.tencent.com/document/product/1823/131208 (updated 2026-11-16)
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true
top_k = false
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.15
cache = { read = 0.003 }

[cost.text.output]
price = 0.6

[[cost.multipliers]]
when = { utc_days = { in = ["mon", "tue", "wed", "thu", "fri"] }, any = [{ all = [{ utc_hours = { gte = "01:00" } }, { utc_hours = { lt = "04:00" } }] }, { all = [{ utc_hours = { gte = "06:00" } }, { utc_hours = { lt = "10:00" } }] }] }
factor = 2
