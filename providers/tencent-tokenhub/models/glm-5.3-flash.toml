# Pricing (USD per million tokens, intl list price, accessed 2026-11-24):
#   https://intl.cloud.tencent.com/document/product/1300/78937 (input 0.15, output 0.5, cache hit 0.03).
#   China list: https://cloud.tencent.com/document/product/1823/130055
# Availability and limits: https://cloud.tencent.com/document/product/1823/130051 (updated 2026-11-17)
# Implicit cache: https://cloud.tencent.com/document/product/1823/131410; no cache-write price is published.
# API: https://cloud.tencent.com/document/product/1823/132061
# Effort: reasoning_effort = low|high|max (default max); thinking cannot be disabled.
# Reasoning guide: https://cloud.tencent.com/document/product/1823/131208 (updated 2026-11-16)
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
top_k = false
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.15
cache = { read = 0.03 }

[cost.text.output]
price = 0.5
