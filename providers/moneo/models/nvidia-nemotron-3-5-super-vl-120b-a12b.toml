# Availability, exact wire ID, host modalities, limit and prices: https://api.moneo.one/v1/models (accessed 2026-11-11)
# Reasoning is supported, but Moneo's Chat Completions gateway does not expose a documented toggle, effort enum or budget control.
schema = 2
base_model = "nvidia/nemotron-3.5-super-vl-120b-a12b"
name = "Nemotron 3.5 Super VL 120B"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
structured_output = true

[limit]
context = 262_144

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.20

[cost.text.output]
price = 0.50
