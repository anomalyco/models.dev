# Availability, exact wire ID, capabilities, limits and prices: https://api.moneo.one/v1/models (accessed 2026-11-11)
# Reasoning is supported, but Moneo's Chat Completions gateway does not expose a documented toggle, effort enum or budget control.
# The `:web` suffix is part of the exact Moneo wire ID; web search is bundled into token pricing and has no separate fee.
schema = 2
base_model = "deepseek/deepseek-v4-flash"
name = "DeepSeek V4 Flash (Web)"

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.15

[cost.text.output]
price = 0.30
