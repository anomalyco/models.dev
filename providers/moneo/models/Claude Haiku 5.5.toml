# Availability, capabilities, limits and prices: https://api.moneo.one/v1/models (accessed 2026-11-11)
schema = 2
base_model = "anthropic/claude-haiku-5-5"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
