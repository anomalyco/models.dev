# Moneo catalog row (retrieved 2026-11-11): both raw `id` and raw `model` are exactly `Claude Haiku 5.5`
# (including the two spaces), context_tokens=200000, has_vision=false, has_tools=true, has_reasoning=true,
# input_per_1m_usd=0.10, output_per_1m_usd=0.50: https://api.moneo.one/v1/models
# The filename must retain spaces to address this host wire ID; `claude-haiku-5-5` is the lab ID and fails on Moneo.
# Host modality/context overrides map directly to has_vision=false and context_tokens=200000.
# The Chat Completions sanitizer drops Anthropic thinking/output_config controls and the response filter removes all reasoning fields.
# Gateway evidence: request allowlist https://github.com/kutsaev/MoneoApp/blob/2d6aa67/moneo/supabase/functions/cig-inference/index.ts#L96-L147 ; response stripping https://github.com/kutsaev/MoneoApp/blob/2d6aa67/moneo/supabase/functions/cig-inference/index.ts#L430-L439
schema = 2
base_model = "anthropic/claude-haiku-5-5"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = false }

[limit]
context = 200_000

[cost.text.input]
price = 0.10

[cost.text.output]
price = 0.50
