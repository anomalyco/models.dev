# Availability, exact wire ID, capabilities, limit and prices: https://api.moneo.one/v1/models (accessed 2026-11-11)
# Reasoning is supported, but Moneo's Chat Completions gateway does not expose a documented toggle, effort enum or budget control.
# The `:web` suffix is part of the exact Moneo wire ID; web search is bundled into token pricing and has no separate fee.
schema = 2
base_model = "alibaba/qwen3-235b-a22b"
name = "Qwen3 235B (Web)"

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
structured_output = true

[limit]
context = 128_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.40

[cost.text.output]
price = 3.00
