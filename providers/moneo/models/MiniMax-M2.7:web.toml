# Availability, exact wire ID, host capability overrides, limit and prices: https://api.moneo.one/v1/models (accessed 2026-11-11)
# Moneo's public catalog explicitly reports has_reasoning=false for this route.
# Live probe (2026-11-11): base and reasoning_effort=high both return HTTP 200 with no reasoning output, confirming has_reasoning=false.
# tool_choice: live probe confirms auto / none / required / named (specific) function are all accepted (HTTP 200).
# The `:web` suffix is part of the exact Moneo wire ID; web search is bundled into token pricing and has no separate fee.
schema = 2
base_model = "minimax/MiniMax-M2.7"
name = "MiniMax M2.7 (Web)"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = false }
structured_output = true

[limit]
context = 198_000

[api.chat-completions]

[cost.text.input]
price = 0.35

[cost.text.output]
price = 1.50
