# Availability, capabilities, limits and prices: https://api.moneo.one/v1/models (accessed 2026-11-11)
schema = 2
base_model = "moonshotai/kimi-k2.7-code"
name = "Kimi K2.7 Code (Web)"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true }
structured_output = true

[limit]
context = 256_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.75

[cost.text.output]
price = 4.00
