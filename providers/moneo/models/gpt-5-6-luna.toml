# Moneo catalog row verified against GET https://api.moneo.one/v1/models and
# live Chat Completions probes using the Moneo wire model `gpt-5-6-luna`.
# Moneo forwards reasoning.effort values: none, low, medium, high, xhigh, max.
# The same field is accepted by Moneo for this model; no separate toggle is published.
# Live catalog: context_tokens=128000, input=$0.20/M, output=$1.20/M,
# has_vision=true, has_tools=true, has_reasoning=true.
schema = 2
base_model = "openai/gpt-5.6-luna"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }

[limit]
context = 128_000
input = 128_000

[cost.text.input]
price = 0.20

[cost.text.output]
price = 1.20