# Toggle: reasoning_effort = none turns thinking off (sent upstream as enable_thinking=false); any
#   other value turns it on. The effort level itself is not sent.
# Pricing: https://docs.paretoinference.com/pricing (checked 2026-11-06). USD per 1M tokens:
#   $0.126 input / $0.00252 cache read / $0.252 output, with no peak pricing.
# Catalog: GET https://api.paretoinference.com/v1/models lists xiaomi/mimo-v2.6-flash.
# Input: text and images on this host. The serving engine loads only the vision encoder (ViT) and
#   builds no video input, so audio and video are left out. A required tool_choice runs as auto.
#   1M context; output is capped at 131,072 tokens. The API serves streamed requests only.
#   (Pareto serving code and https://docs.paretoinference.com/api-reference, checked 2026-11-06.)
schema = 2
base_model = "xiaomi/mimo-v2.6-flash"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.126
cache = { read = 0.00252 }

[cost.text.output]
price = 0.252
