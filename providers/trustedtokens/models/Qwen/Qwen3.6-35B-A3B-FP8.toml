# Catalog: https://api.trustedtokens.eu/v1/models (accessed 2026-10-30).
# Pricing: the host publishes EUR per 1M tokens; omitted here rather than converted to USD.
# Effort: reasoning_effort = none|medium (/v1/models: supported_efforts = ["medium","none"],
# default_effort = "medium"). Live 2026-10-30: none 0, medium 6256/6625, control 6009
# reasoning_content chars; `high` is accepted but indistinguishable from medium (5955/5970),
# so only the advertised pair is published.
# Toggle/budget probe 2026-10-30: enable_thinking=false (5210 chars vs control 6009),
# thinking_budget=100 (6067) and chat_template_kwargs.enable_thinking=false (4901) are
# accepted but leave reasoning on, so no toggle or budget is published; `none` is the off state.
# Image input accepted; video_url returns 422, so the lab's video formats are omitted.
# Cache: implicit prefix caching measured (repeat prompt reports cached_tokens); first request is cold.
# Reasoning side channel: message.reasoning_content.
schema = 2
base_model = "alibaba/qwen3.6-35b-a3b"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "medium"] }
structured_output = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
