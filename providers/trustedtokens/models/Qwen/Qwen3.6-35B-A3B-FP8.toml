# Costs and catalog: https://api.trustedtokens.eu/v1/models (accessed 2026-10-28).
# Cost: EUR 0.25 in / 1.50 out / 0.05 cache read per 1M tokens, converted at 1.1150 USD/EUR (ECB reference rate, 2026-10-27).
# Effort: reasoning_effort = none|high
# Measured 2026-10-28: none 0, medium 710, high 722 reasoning_content chars.
# `none` is an off state; medium/high do not grade, so the Kilo peer's single
# on-level (high) is published. No toggle: reasoning.enabled, thinking.type and
# chat_template_kwargs.enable_thinking all leave reasoning on.
# Image input accepted; video_url returns 422, so the lab's video formats are omitted.
# Cache: implicit prefix caching measured (repeat prompt reports cached_tokens); first request is cold.
# Reasoning side channel: message.reasoning_content.
schema = 2
base_model = "alibaba/qwen3.6-35b-a3b"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.27875
cache = { read = 0.05575 }

[cost.text.output]
price = 1.6725
