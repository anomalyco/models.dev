# Costs and catalog: https://api.trustedtokens.eu/v1/models (accessed 2026-10-30).
# Cost: 0.25 in / 1.50 out / 0.05 cache read per 1M tokens, published as USD (catalog EUR values at 1:1; no FX conversion).
# Effort: reasoning_effort = none|medium (/v1/models). `none` is off.
# No toggle: reasoning.enabled, thinking.type and chat_template_kwargs.enable_thinking
# all leave reasoning on.
# Image input accepted; video_url returns 422, so the lab's video formats are omitted.
# Cache: implicit prefix caching measured (repeat prompt reports cached_tokens); first request is cold.
# Reasoning side channel: message.reasoning_content.
schema = 2
base_model = "alibaba/qwen3.6-35b-a3b"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "medium"] }
structured_output = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.25
cache = { read = 0.05 }

[cost.text.output]
price = 1.5
