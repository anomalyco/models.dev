# Costs and catalog: https://api.trustedtokens.eu/v1/models (accessed 2026-10-30).
# Cost: 0.15 in / 0.60 out / 0.05 cache read per 1M tokens, published as USD (catalog EUR values at 1:1; no FX conversion).
# Effort: reasoning_effort = low|medium|high (/v1/models). `none` is not an off state,
# so no off level is published.
# No toggle: reasoning.enabled, thinking.type and chat_template_kwargs.enable_thinking
# all leave reasoning on.
# Text-only: image parts are ignored (prompt tokens unchanged), matching the lab.
# Cache: implicit prefix caching measured (repeat prompt reports cached_tokens); first request is cold.
# Reasoning side channel: message.reasoning_content.
schema = 2
base_model = "openai/gpt-oss-120b"

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.15
cache = { read = 0.05 }

[cost.text.output]
price = 0.6
