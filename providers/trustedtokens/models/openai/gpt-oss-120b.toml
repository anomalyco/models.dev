# Costs and catalog: https://api.trustedtokens.eu/v1/models (accessed 2026-10-28).
# Cost: EUR 0.15 in / 0.60 out / 0.05 cache read per 1M tokens, converted at 1.1150 USD/EUR (ECB reference rate, 2026-10-27).
# Effort: reasoning_effort = low|medium|high
# Measured 2026-10-28: none 196 (not off), low 59, medium 196, high 673 reasoning_content
# chars. low < medium < high grade; there is no caller off control.
# No toggle: reasoning.enabled, thinking.type and chat_template_kwargs.enable_thinking
# all leave reasoning on.
# Text-only: image parts are ignored (prompt tokens unchanged), matching the lab.
# Cache: implicit prefix caching measured (repeat prompt reports cached_tokens); first request is cold.
# Reasoning side channel: message.reasoning_content.
schema = 2
base_model = "openai/gpt-oss-120b"

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.16725
cache = { read = 0.05575 }

[cost.text.output]
price = 0.669
