# Catalog: https://api.trustedtokens.eu/v1/models (accessed 2026-10-30).
# Pricing: the host publishes EUR per 1M tokens; omitted here rather than converted to USD.
# Effort: reasoning_effort = none|medium (/v1/models: supported_efforts = ["medium","none"],
# default_effort = "medium"). Live 2026-10-30: none 0, medium 4024/5230, control 2899
# reasoning_content chars; `high` is accepted but indistinguishable (4547/4745), so only the
# advertised pair is published.
# Toggle probe 2026-10-30: the lab's chat_template_kwargs.enable_thinking=false is accepted
# but leaves reasoning on (4721 chars vs control 2899), so no toggle is published on this host.
# Context: 262,144 is the served max_total_tokens from GET /v1/models (2026-10-30);
# the lab documents 1,048,576.
# Image input accepted; video_url returns 422, so the lab's video format is omitted.
# Cache: implicit prefix caching measured (repeat prompt reports cached_tokens); first request is cold.
# Reasoning side channel: message.reasoning_content.
schema = 2
base_model = "nvidia/nemotron-3.5-super-vl-120b-a12b"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "medium"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 262_144

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
