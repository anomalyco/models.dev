# Costs and catalog: https://api.trustedtokens.eu/v1/models (accessed 2026-10-28).
# Cost: EUR 0.15 in / 0.50 out / 0.02 cache read per 1M tokens, converted at 1.1150 USD/EUR (ECB reference rate, 2026-10-27).
# Effort: reasoning_effort = none|high
# Measured 2026-10-28: none 0, medium 482, high 478 reasoning_content chars.
# `none` is an off state; medium/high do not grade, so the Kilo peer's single
# on-level (high) is published. No toggle: reasoning.enabled, thinking.type and
# chat_template_kwargs.enable_thinking all leave reasoning on.
# Context: 262,144 is the served max_total_tokens from GET /v1/models (2026-10-28);
# the lab documents 1,048,576.
# Image input accepted; video_url returns 422, so the lab's video format is omitted.
# Cache: implicit prefix caching measured (repeat prompt reports cached_tokens); first request is cold.
# Reasoning side channel: message.reasoning_content.
schema = 2
base_model = "nvidia/nemotron-3.5-super-vl-120b-a12b"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 262_144

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.16725
cache = { read = 0.0223 }

[cost.text.output]
price = 0.5575
