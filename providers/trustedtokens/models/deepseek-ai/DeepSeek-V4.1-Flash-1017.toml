# Costs and catalog: https://api.trustedtokens.eu/v1/models (accessed 2026-10-30).
# Cost: 0.30 in / 0.60 out / 0.06 cache read per 1M tokens, published as USD (catalog EUR values at 1:1; no FX conversion).
# Effort: reasoning_effort = none|low|high|max. `none` is the off state and is added to
# /v1/models' low|high|max ladder.
# No toggle: reasoning.enabled, thinking.type and chat_template_kwargs.enable_thinking
# all leave reasoning on.
# Image input accepted; the lab's image formats are inherited.
# Cache: implicit prefix caching measured (repeat prompt reports cached_tokens); first request is cold.
# Reasoning side channel: message.reasoning_content.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.3
cache = { read = 0.06 }

[cost.text.output]
price = 0.6
