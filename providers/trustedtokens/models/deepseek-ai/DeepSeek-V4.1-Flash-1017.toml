# Costs and catalog: https://api.trustedtokens.eu/v1/models (accessed 2026-10-30).
# Cost: EUR 0.30 in / 0.60 out / 0.06 cache read per 1M tokens, converted at 1.1150 USD/EUR (ECB reference rate, 2026-10-27).
# Effort: reasoning_effort = none|low|high|max. /v1/models lists low|high|max; `none` is the
# measured off state (live 2026-10-30: none 0, low 176, high 178, max 435 reasoning_content chars).
# Toggle probe 2026-10-30: thinking.type=disabled (1112 chars vs control 906),
# thinking.type=enabled (1551), reasoning.enabled=false (2533) and
# chat_template_kwargs.enable_thinking=false (1596) are accepted but leave reasoning on,
# so no toggle is published; `none` is the only off control.
# Image input accepted; the lab's image formats are inherited.
# Cache: implicit prefix caching measured (repeat prompt reports cached_tokens); first request is cold.
# Reasoning side channel: message.reasoning_content.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.3345
cache = { read = 0.0669 }

[cost.text.output]
price = 0.669
