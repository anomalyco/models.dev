# Costs and catalog: https://api.trustedtokens.eu/v1/models (accessed 2026-10-30).
# Cost: EUR 1.50 in / 4.50 out / 0.30 cache read per 1M tokens, converted at 1.1150 USD/EUR (ECB reference rate, 2026-10-27).
# Effort: reasoning_effort = low|high|max (/v1/models). `none` is not an off state.
# Measured 2026-10-30 (hard prompt): none 6769-7217, low 0, medium 6528-7334, high 358-1406,
# max 6472-7240 reasoning_content chars.
# Tool calls need effort=low; `none` consumes the token budget.
# No toggle: reasoning.enabled, thinking.type and chat_template_kwargs.enable_thinking
# all leave reasoning on.
# Context: 230,000 is the served max_total_tokens from GET /v1/models (2026-10-30);
# the lab documents 1,000,000.
# Text-only: image input returns 422 "Model only supports text".
# Cache: implicit prefix caching measured (repeat prompt reports cached_tokens); first request is cold.
# Reasoning side channel: message.reasoning_content.
schema = 2
base_model = "zhipuai/glm-5.3"

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 230_000

[cost.text.input]
price = 1.6725
cache = { read = 0.3345 }

[cost.text.output]
price = 5.0175
