# Costs and catalog: https://api.trustedtokens.eu/v1/models (accessed 2026-10-30).
# Cost: 1.50 in / 4.50 out / 0.30 cache read per 1M tokens, published as USD (catalog EUR values at 1:1; no FX conversion).
# Effort: reasoning_effort = none|high|max (/v1/models). `none` is off.
# No toggle: reasoning.enabled, thinking.type and chat_template_kwargs.enable_thinking
# all leave reasoning on.
# Text-only: image input returns 422 "Model only supports text".
# Cache: implicit prefix caching measured (repeat prompt reports cached_tokens); first request is cold.
# Reasoning side channel: message.reasoning_content.
schema = 2
base_model = "zhipuai/glm-5.2"

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[capabilities]
reasoning = { supported = true, effort = ["none", "high", "max"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 1.5
cache = { read = 0.3 }

[cost.text.output]
price = 4.5
