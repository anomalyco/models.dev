# Catalog: https://api.trustedtokens.eu/v1/models (accessed 2026-10-30).
# Pricing: the host publishes EUR per 1M tokens; omitted here rather than converted to USD.
# Effort: reasoning_effort = low|high|max (/v1/models). `none` is not an off state.
# Measured 2026-10-30 (hard prompt): none 6729-7406, low 0-31, high 156-224, max 6970-7050
# reasoning_content chars.
# No toggle: reasoning.enabled, thinking.type and chat_template_kwargs.enable_thinking
# all leave reasoning on.
# Image input accepted; video_url and file (PDF) return 422, so video and PDF are omitted.
# Cache: implicit prefix caching measured (repeat prompt reports cached_tokens); first request is cold.
# Reasoning side channel: message.reasoning_content.
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }
