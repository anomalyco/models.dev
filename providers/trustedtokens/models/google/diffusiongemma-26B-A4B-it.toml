# Costs and catalog: https://api.trustedtokens.eu/v1/models (accessed 2026-10-30).
# Cost: EUR 0.30 in / 0.80 out / 0.05 cache read per 1M tokens, converted at 1.1150 USD/EUR (ECB reference rate, 2026-10-27).
# Effort: reasoning_effort = none|medium (/v1/models: supported_efforts = ["medium","none"],
# default_effort = "medium"). Live 2026-10-30: none 0, medium 819-1045 reasoning_content chars;
# minimal/low/high/xhigh/max are accepted but overlap medium (773-846), so only the advertised
# pair is published.
# temperature is rejected with 422 and is disabled.
# response_format is rejected with 422: "Structured outputs are not yet supported for diffusion language models".
# Image input accepted; video and PDF are not published.
# Cache: implicit prefix caching measured (repeat prompt reports cached_tokens); first request is cold.
# Reasoning side channel: message.reasoning_content.
schema = 2
base_model = "google/diffusiongemma-26b-a4b-it"

[capabilities]
reasoning = { supported = true, effort = ["none", "medium"] }
structured_output = false
cache = { implicit = true }
temperature = false

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.3345
cache = { read = 0.05575 }

[cost.text.output]
price = 0.892
