# Costs and catalog: https://api.trustedtokens.eu/v1/models (accessed 2026-10-30).
# Cost: 0.30 in / 0.80 out / 0.05 cache read per 1M tokens, published as USD (catalog EUR values at 1:1; no FX conversion).
# Effort: reasoning_effort = none|medium (/v1/models). `none` is off.
# temperature is rejected with 422 and is disabled.
# response_format is rejected with 422: "Structured outputs are not yet supported for diffusion language models".
# Image input accepted; video and PDF are not published.
# Cache: implicit prefix caching measured (repeat prompt reports cached_tokens); first request is cold.
# Reasoning side channel: message.reasoning_content.
schema = 2
base_model = "google/diffusiongemma-26b-a4b-it"

[capabilities]
reasoning = { supported = true, effort = ["none", "medium"] }
structured_output = false
cache = { implicit = true }
temperature = false

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.3
cache = { read = 0.05 }

[cost.text.output]
price = 0.8
