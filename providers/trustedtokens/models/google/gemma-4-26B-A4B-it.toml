# Costs and catalog: https://api.trustedtokens.eu/v1/models (accessed 2026-10-30).
# Cost: 0.30 in / 0.80 out / 0.05 cache read per 1M tokens, published as USD (catalog EUR values at 1:1; no FX conversion).
# Effort: reasoning_effort = none|medium (/v1/models). `none` is off.
# No toggle: reasoning.enabled, thinking.type and chat_template_kwargs.enable_thinking
# were probed and ignored on this host.
# Image input accepted; the lab's image formats are inherited.
# Cache: implicit prefix caching measured (repeat prompt reports cached_tokens); first request is cold.
# Reasoning side channel: message.reasoning_content.
schema = 2
base_model = "google/gemma-4-26b-a4b-it"

[capabilities]
reasoning = { supported = true, effort = ["none", "medium"] }
structured_output = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.3
cache = { read = 0.05 }

[cost.text.output]
price = 0.8
