# Catalog: https://api.trustedtokens.eu/v1/models (accessed 2026-10-30).
# Pricing: the host publishes EUR per 1M tokens; omitted here rather than converted to USD.
# Effort: reasoning_effort = none|medium (/v1/models: supported_efforts = ["medium","none"],
# default_effort = "medium"). Live 2026-10-30: none 0, medium 2185/2515, control 2135
# reasoning_content chars; `high` is accepted but indistinguishable (2335/2399), so only the
# advertised pair is published.
# Toggle probe 2026-10-30: chat_template_kwargs.enable_thinking=false is accepted but leaves
# reasoning on (2724 chars vs control 2135), so no toggle is published on this host.
# Image input accepted; the lab's image formats are inherited.
# Cache: implicit prefix caching measured (repeat prompt reports cached_tokens); first request is cold.
# Reasoning side channel: message.reasoning_content.
schema = 2
base_model = "google/gemma-4-26b-a4b-it"

[capabilities]
reasoning = { supported = true, effort = ["none", "medium"] }
structured_output = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
