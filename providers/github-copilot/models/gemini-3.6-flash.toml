# Limits source (live CAPI, verified 2026-09-23): https://api.githubcopilot.com/models
# Pricing: https://docs.github.com/en/copilot/reference/copilot-billing/models-and-pricing
base_model = "google/gemini-3.6-flash"

[[reasoning_options]]
type = "effort"
values = ["minimal", "low", "medium", "high"]

[[reasoning_options]]
type = "budget_tokens"
min = 256
max = 32_000

[cost]
input = 0.75
output = 3.75
cache_read = 0.075

[limit]
context = 264_000
input = 200_000
output = 64_000

[modalities]
input = ["text", "image", "pdf"]
output = ["text"]
