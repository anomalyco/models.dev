# Pricing: https://docs.github.com/en/copilot/reference/copilot-billing/models-and-pricing
# Availability: https://docs.github.com/en/copilot/reference/ai-models/supported-models
# tools.freeform (Responses, the only API this model lists): inferred, not probed. This account gets 400 "model_not_supported" for this model with a plain function tool too, so it's plan or availability gating. The same Copilot Responses proxy accepted text, lark and regex custom tools with the grammars enforced on gpt-5.3-codex, gpt-5.6-luna, gpt-5.6-terra, gpt-6-luna, gpt-6.1-terra (live 2026-10-28, api.individual.githubcopilot.com/responses).
# Mid-conversation flags, live 2026-11-26 on api.individual.githubcopilot.com/responses (Copilot's GET /models has no
#   field for any of them):
#   effort_updates: a `configuration_update` item between turns returned 200. gpt-5.3-codex and MAI Code reject it
#     ("The 'configuration_update' item type is not supported with this model."); Grok returns
#     "upstream_request_rejected".
#   tools.updates: an `additional_tools` item after the first turn added a tool the model then called, and a second
#     one redefining a tool by name made the call use the new schema. The call has no namespace, and replaying it with
#     its output continued normally (gpt-5.6-sol, gpt-6.2-sol). Removal is announced in a developer message, as on
#     `openai`. Grok rejects `additional_tools` ("upstream_request_rejected"); gpt-5.3-codex and gpt-5.4-nano return
#     namespaced calls whose replay fails.
#   system_updates: a developer message after the first turn ("reply with exactly BANANA") was followed.
schema = 2
base_model = "openai/gpt-6.1-sol"

[capabilities]
tools = { supported = true, freeform = ["text", "lark", "regex"] }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
system_updates = true

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }
capabilities = { effort_updates = true, tools = { updates = ["add", "remove", "replace"] } }

[cost.text.input]
price = 2
cache = { read = 0.1, write = 2.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 4
cache = { read = 0.2, write = 5 }

[cost.text.output]
price = 10

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 15
