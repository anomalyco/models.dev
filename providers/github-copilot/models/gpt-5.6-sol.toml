# Pricing: https://docs.github.com/en/copilot/reference/copilot-billing/models-and-pricing
# GPT-5.6 Sol standard rates (promo ended): ≤272K $4/$0.40/$5/$20; >272K $8/$0.80/$10/$30 per 1M
# tools.freeform (Responses, the only API this model lists): inferred, not probed. This account gets 400 "model_not_supported" for this model with a plain function tool too, so it's plan or availability gating. The same Copilot Responses proxy accepted text, lark and regex custom tools with the grammars enforced on gpt-5.3-codex, gpt-5.6-luna, gpt-5.6-terra, gpt-6-luna, gpt-6.1-terra (live 2026-10-28, api.individual.githubcopilot.com/responses).
schema = 2
base_model = "openai/gpt-5.6-sol"

[capabilities]
tools = { supported = true, freeform = ["text", "lark", "regex"] }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }

[cost.text.input]
price = 4
cache = { read = 0.4, write = 5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 8
cache = { read = 0.8, write = 10 }

[cost.text.output]
price = 20

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 30
