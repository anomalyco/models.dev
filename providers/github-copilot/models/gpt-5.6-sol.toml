# Pricing: https://docs.github.com/en/copilot/reference/copilot-billing/models-and-pricing
# GPT-5.6 Sol standard rates (promo ended): ≤272K $4/$0.40/$5/$20; >272K $8/$0.80/$10/$30 per 1M
base_model = "openai/gpt-5.6-sol"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "xhigh", "max"]

[cost]
input = 4
output = 20
cache_read = 0.4
cache_write = 5

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 8
output = 30
cache_read = 0.8
cache_write = 10
