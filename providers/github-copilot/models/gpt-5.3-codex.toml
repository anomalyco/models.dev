# tools.freeform (Responses, the only API this model lists): custom tools accepted with text, lark and regex formats and the grammars enforced (tool_choice required; regex ZZ[0-9]{3} and the equivalent lark grammar returned ZZ plus three digits) on this model, live 2026-10-28 via api.individual.githubcopilot.com/responses. Also probed: gpt-5.6-luna, gpt-5.6-terra, gpt-6-luna, gpt-6.1-terra.
schema = 2
base_model = "openai/gpt-5.3-codex"

[capabilities]
tools = { supported = true, freeform = ["text", "lark", "regex"] }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }

[cost.text.input]
price = 1.75
cache = { read = 0.175 }

[cost.text.output]
price = 14
