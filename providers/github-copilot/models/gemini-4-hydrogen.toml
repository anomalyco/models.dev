# Sources:
# - https://docs.github.com/en/copilot/reference/copilot-billing/models-and-pricing (Gemini 4 Hydrogen, GA: $1.50 input / $0.075 cached input / $7.50 output per 1M tokens, accessed 2026-11-14)
# - https://docs.github.com/en/copilot/reference/ai-models/supported-models
# - https://ai.google.dev/gemini-api/docs/models/gemini-4-hydrogen
# Reasoning: effort low|medium|high|xhigh from the lab entry providers/google/models/gemini-4-hydrogen.toml. Copilot's other Gemini 4 entries list low|medium|high, but this relay passes the lab's levels through.
# Input MIME types: copied from the gemini-4-argon/carbon Copilot entries (same Copilot vision list); not read for Hydrogen itself (no Copilot token). Limits inherit the lab.
schema = 2
base_model = "google/gemini-4-hydrogen"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp", "image/heic", "image/heif", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true

[cost.text.input]
price = 1.5
cache = { read = 0.075 }

[cost.text.output]
price = 7.5
