# structured_output: capabilities.supports.structured_outputs = true (authenticated GET https://api.githubcopilot.com/models (2026-10-21)).
# Mid-conversation flags follow Anthropic's own API for this model: Copilot serves it on /v1/messages (Anthropic Messages). See providers/anthropic/models/claude-fable-5.toml.
# APIs: GET /models supported_endpoints lists /v1/messages and /chat/completions for Claude models (authenticated, 2026-10-21; see provider.toml).
# Per-API flags: the mid-conversation flags come from Anthropic's Messages API (mid-conversation system messages, per-message output_config, tool_addition/tool_removal), so they sit on [api.messages]. Copilot's /chat/completions has no documented way to keep a late system message in place or change effort or tools per message.
schema = 2
base_model = "anthropic/claude-fable-5"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
effort_updates = false

[limit]
context = 1_000_000
output = 128_000

[api.messages]
base_url = "https://api.githubcopilot.com/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic" }
capabilities = { system_updates = true, tools = { updates = true } }

[api.chat-completions]

[cost.text.input]
price = 10
cache = { read = 1, write = 12.5 }

[cost.text.output]
price = 50
