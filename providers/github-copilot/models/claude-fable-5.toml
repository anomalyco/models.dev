# structured_output: capabilities.supports.structured_outputs = true (authenticated GET https://api.githubcopilot.com/models (2026-10-21)).
schema = 2
base_model = "anthropic/claude-fable-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[limit]
context = 1_000_000
output = 128_000

[api.messages]
base_url = "https://api.githubcopilot.com/v1"
sdk = { aisdk = "@ai-sdk/anthropic" }

[cost.text.input]
price = 10
cache = { read = 1, write = 12.5 }

[cost.text.output]
price = 50
