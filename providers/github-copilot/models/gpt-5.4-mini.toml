# Deprecated: retired from Copilot on 2026-10-19 (https://docs.github.com/en/copilot/reference/ai-models/supported-models#model-retirement-history).
# tools.freeform (Responses, the only API this model lists): inferred, not probed. This account gets 400 "not available for integrator" for this model with a plain function tool too, so it's plan or availability gating. The same Copilot Responses proxy accepted text, lark and regex custom tools with the grammars enforced on gpt-5.3-codex, gpt-5.6-luna, gpt-5.6-terra, gpt-6-luna, gpt-6.1-terra (live 2026-10-28, api.individual.githubcopilot.com/responses).
schema = 2
base_model = "openai/gpt-5.4-mini"
status = "deprecated"

[capabilities]
tools = { supported = true, freeform = ["text", "lark", "regex"] }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }

[cost.text.input]
price = 0.75
cache = { read = 0.075 }

[cost.text.output]
price = 4.5
