# Sources:
# - https://docs.github.com/en/copilot/reference/copilot-billing/models-and-pricing (Gemini 4 Neon, GA: $3.00 input / $0.15 cached input / $15.00 output per 1M, accessed 2026-11-18)
# - https://ai.google.dev/gemini-api/docs/whats-new-gemini-4-neon (thinking levels low, medium, high default, xhigh)
# Reasoning: effort low|medium|high|xhigh, Google's set for Neon.
# Input MIME types and limits: same as the gemini-4-carbon Copilot entry (same Copilot vision list). Limits inherit the lab.
schema = 2
base_model = "google/gemini-4-neon"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp", "image/heic", "image/heif", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true

[cost.text.input]
price = 3
cache = { read = 0.15 }

[cost.text.output]
price = 15
