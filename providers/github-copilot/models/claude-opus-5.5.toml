# Sources:
# - https://github.blog/changelog/2026-09-22-claude-opus-5-5-is-now-available-in-github-copilot/
# - https://docs.github.com/en/copilot/reference/copilot-billing/models-and-pricing
# - https://www.anthropic.com/claude-opus-5-5
# - https://platform.claude.com/docs/en/models/opus-5-5/overview
# structured_output: capabilities.supports.structured_outputs = true (authenticated GET https://api.githubcopilot.com/models (2026-10-21)).
# Mid-conversation flags follow Anthropic's own API for this model: Copilot serves it on /v1/messages (Anthropic Messages). See providers/anthropic/models/claude-opus-5-5.toml.
schema = 2
base_model = "anthropic/claude-opus-5-5"

[capabilities]
tools = { supported = true, updates = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
system_updates = true
effort_updates = true

[api.messages]
base_url = "https://api.githubcopilot.com/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic" }

[cost.text.input]
price = 4
cache = { read = 0.2, write = 5 }

[cost.text.output]
price = 20
