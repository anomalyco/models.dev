# Sources:
# - https://github.blog/changelog/2026-09-22-claude-opus-5-5-is-now-available-in-github-copilot/
# - https://docs.github.com/en/copilot/reference/copilot-billing/models-and-pricing
# - https://www.anthropic.com/claude-opus-5-5
# - https://platform.claude.com/docs/en/models/opus-5-5/overview
schema = 2
base_model = "anthropic/claude-opus-5-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[api.messages]
base_url = "https://api.githubcopilot.com/v1"
sdk = { aisdk = "@ai-sdk/anthropic" }

[cost.text.input]
price = 4
cache = { read = 0.2, write = 5 }

[cost.text.output]
price = 20
