# Pricing: https://docs.github.com/en/copilot/reference/copilot-billing/models-and-pricing
# Capabilities and limits verified against the GitHub Copilot /models API on 2026-08-12.
schema = 2
base_model = "microsoft/mai-code-1.1-flash"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
input = 128_000

[api.responses]
sdk = { aisdk = "@ai-sdk/openai" }

[cost.text.input]
price = 0.2
cache = { read = 0.02 }

[cost.text.output]
price = 1.2
