# structured_output: capabilities.supports.structured_outputs = true (authenticated GET https://api.githubcopilot.com/models (2026-10-21)).
# Mid-conversation flags follow Anthropic's own API for this model: Copilot serves it on /v1/messages (Anthropic Messages). See providers/anthropic/models/claude-sonnet-5.toml.
schema = 2
base_model = "anthropic/claude-sonnet-5"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
system_updates = true
effort_updates = false

[limit]
context = 1_000_000
output = 128_000

[api.messages]
base_url = "https://api.githubcopilot.com/v1"
sdk = { aisdk = "@ai-sdk/anthropic" }

[cost.text.input]
price = 2
cache = { read = 0.2, write = 2.5 }

[cost.text.output]
price = 10
