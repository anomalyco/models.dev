# structured_output: capabilities.supports.structured_outputs = true (authenticated GET https://api.githubcopilot.com/models (2026-10-21)).
# Mid-conversation flags are left out: Anthropic doesn't list this model for in-history system messages
#   (https://platform.claude.com/docs/en/build-with-claude/working-with-messages), and tool_addition/tool_removal and
#   per-message output_config need Anthropic betas that GitHub doesn't document for Copilot and VS Code's Copilot client
#   doesn't send (extensions/copilot/src/platform/endpoint/node/chatEndpoint.ts:313-333 and messagesApi.ts:310 at
#   https://github.com/microsoft/vscode/tree/bb29884).
# No toggle: Copilot's /models lists only reasoning_effort for this model (no thinking on/off control), so the first-party
#   thinking.type toggle isn't claimed here.
# APIs: GET /models supported_endpoints lists /v1/messages and /chat/completions for Claude models (authenticated, 2026-10-21; see provider.toml).
schema = 2
base_model = "anthropic/claude-sonnet-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[limit]
context = 1_000_000
output = 128_000

[api.messages]
base_url = "https://api.githubcopilot.com/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic" }

[api.chat-completions]

[cost.text.input]
price = 2
cache = { read = 0.2, write = 2.5 }

[cost.text.output]
price = 10
