# Sources:
# - https://docs.github.com/en/copilot/reference/copilot-billing/models-and-pricing
# Pricing and GA status: Claude Fable 5.2 row, $8 input / $0.20 cached / $10 cache write / $40 output (docs page above, accessed 2026-11-10).
# structured_output: capabilities.supports.structured_outputs = true (same as the Claude Fable 5.1 entry; not re-read for 5.2, no Copilot token available).
# system_updates (Messages API only): Anthropic documents in-history role "system" messages for this model with no
#   beta header (https://platform.claude.com/docs/en/build-with-claude/working-with-messages), and Copilot's /v1/messages
#   relays the request body. Not known for /chat/completions.
# tools.updates and effort_updates are left out: tool_addition/tool_removal and per-message output_config need Anthropic
#   betas that GitHub doesn't document for Copilot, and VS Code's Copilot client sends neither those betas nor the blocks
#   (extensions/copilot/src/platform/endpoint/node/chatEndpoint.ts:313-333 and messagesApi.ts:310 at
#   https://github.com/microsoft/vscode/tree/bb29884).
# APIs: GET /models supported_endpoints lists /v1/messages and /chat/completions for Claude models (authenticated, 2026-10-21; see provider.toml).
schema = 2
base_model = "anthropic/claude-fable-5-2"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[api.messages]
base_url = "https://api.githubcopilot.com/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic" }
capabilities = { system_updates = true }

[api.chat-completions]

[cost.text.input]
price = 8
cache = { read = 0.2, write = 10 }

[cost.text.output]
price = 40
