# Pricing: https://docs.github.com/en/copilot/reference/copilot-billing/models-and-pricing
# GPT-6 Luna rates: ≤272K $0.10/$0.01/$0.125/$0.50; >272K $0.20/$0.02/$0.25/$0.75 per 1M (input/cached/cache write/output)
schema = 2
base_model = "openai/gpt-6-luna"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }

[cost.text.input]
price = 0.1
cache = { read = 0.01, write = 0.125 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 0.2
cache = { read = 0.02, write = 0.25 }

[cost.text.output]
price = 0.5

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 0.75
