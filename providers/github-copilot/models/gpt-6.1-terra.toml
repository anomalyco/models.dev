# Pricing: https://docs.github.com/en/copilot/reference/copilot-billing/models-and-pricing
# Availability: GA in Copilot on 2026-10-26, "billed at provider list pricing under usage-based billing":
#   https://github.blog/changelog/2026-10-26-gpt-6-1-terra-in-github-copilot
#   The docs pricing table doesn't list it yet (accessed 2026-10-26), so token prices are OpenAI's list price:
#   https://developers.openai.com/api/docs/models/gpt-6.1-terra
# Effort: GPT-6.1 Terra's native none|low|medium|high|xhigh|max (as on the OpenAI provider entry).
# tools.freeform (Responses, the only API this model lists): custom tools accepted with text, lark and regex formats and the grammars enforced (tool_choice required; regex ZZ[0-9]{3} and the equivalent lark grammar returned ZZ plus three digits) on this model, live 2026-10-28 via api.individual.githubcopilot.com/responses. Also probed: gpt-5.3-codex, gpt-5.6-luna, gpt-5.6-terra, gpt-6-luna.
# Mid-conversation flags, live 2026-11-26 on api.individual.githubcopilot.com/responses (Copilot's GET /models has no
#   field for any of them):
#   effort_updates: a `configuration_update` item between turns returned 200. gpt-5.3-codex and MAI Code reject it
#     ("The 'configuration_update' item type is not supported with this model."); Grok returns
#     "upstream_request_rejected".
#   tools.updates: an `additional_tools` item after the first turn added a tool the model then called, and a second
#     one redefining a tool by name made the call use the new schema. Removal is announced in a developer message, as
#     on `openai`. Grok rejects `additional_tools` ("upstream_request_rejected").
#   system_updates: a developer message after the first turn ("reply with exactly BANANA") was followed.
schema = 2
base_model = "openai/gpt-6.1-terra"

[capabilities]
tools = { supported = true, freeform = ["text", "lark", "regex"] }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
system_updates = true

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }
capabilities = { effort_updates = true, tools = { updates = ["add", "remove", "replace"] } }

[cost.text.input]
price = 1
cache = { read = 0.05, write = 1.25 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 2
cache = { read = 0.1, write = 2.5 }

[cost.text.output]
price = 5

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 7.5
