# Sources (accessed 2026-11-18):
# - https://github.blog/changelog/2026-11-17-openais-gpt-6-2-astra-and-gpt-6-2-sol-now-available/
# - https://docs.github.com/en/copilot/reference/copilot-billing/models-and-pricing
# GPT-6.2 Astra rates: ≤272K $8/$0.40/$10/$40; >272K $16/$0.80/$20/$60 per 1M (input/cached/cache write/output).
#   Authenticated GET /models billing lists the same default and long_context prices.
# Authenticated GET https://api.enterprise.githubcopilot.com/models (2026-11-18): limits 1,050,000 context /
#   1,050,000 prompt / 128,000 output, reasoning_effort
#   low|medium|high|xhigh|max, structured_outputs, supported_endpoints /responses only.
# Live 2026-11-18: /responses 200; /chat/completions 400 "unsupported_api_for_model". On /responses, custom tools with
#   text, lark and regex formats returned a custom_tool_call matching the grammar.
schema = 2
base_model = "openai/gpt-6.2-astra"

[capabilities]
tools = { supported = true, freeform = ["text", "lark", "regex"] }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }

[cost.text.input]
price = 8
cache = { read = 0.4, write = 10 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 16
cache = { read = 0.8, write = 20 }

[cost.text.output]
price = 40

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 60
