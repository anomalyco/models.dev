# Sources:
# - https://docs.github.com/en/copilot/reference/copilot-billing/models-and-pricing
# - https://docs.github.com/en/copilot/reference/ai-models/supported-models
# - https://api.githubcopilot.com/models
# Pricing: Gemini 3.8 Flash promo $0.75/$0.075/$3.75 per 1M tokens through 2026-12-31
# Reasoning: effort low|medium|high (matches lab + github-copilot gemini-3.7-flash peer)
schema = 2
base_model = "google/gemini-3.8-flash"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
context = 1_000_000
input = 936_000
output = 64_000

[cost.text.input]
price = 0.75
cache = { read = 0.075 }

[cost.text.output]
price = 3.75
