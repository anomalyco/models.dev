# Pricing: https://docs.github.com/en/copilot/reference/copilot-billing/models-and-pricing (accessed 2026-11-18): $0.5 input / $0.025 cached / $2.5 output
#   per 1M until 2027-05-17 (launch promo), then double. No date multiplier: the Copilot sync owns these prices and will pick up the new rates from GitHub's table.
# Effort: low|medium|high|xhigh|max, the model card's set. Copilot's other entries carry their vendor's full effort set, so this follows the card.
#   VS Code's Copilot extension reads effort levels from Copilot's per-model metadata and hardcodes none per model.
#   The API layout and structured_output follow MAI-Code-1.1-Flash on this host.
# system_updates: live 2026-11-26 on api.individual.githubcopilot.com/responses, a developer message after the first
#   turn ("reply with exactly BANANA") was followed. tools.updates and effort_updates stay unset: it didn't call a tool added
#   through `additional_tools`, and it rejects `configuration_update`.
schema = 2
base_model = "microsoft/mai-code-2"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
system_updates = true

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }

[cost.text.input]
price = 0.5
cache = { read = 0.025 }

[cost.text.output]
price = 2.5

