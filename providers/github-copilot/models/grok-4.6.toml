# Sources:
# - https://github.blog/changelog/2026-08-14-grok-4-6-is-now-available-in-github-copilot/
# - https://docs.x.ai/developers/pricing
schema = 2
base_model = "xai/grok-4.6"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true

[limit]
context = 500_000
input = 372_000
output = 128_000

[api.responses]
sdk = { aisdk = "@ai-sdk/openai" }

[cost.text.input]
price = 2
cache = { read = 0.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 4
cache = { read = 1 }

[cost.text.output]
price = 6

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 12
