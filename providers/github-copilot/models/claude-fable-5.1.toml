# Sources:
# - https://github.blog/changelog/2026-09-01-claude-fable-5-1-generally-available-in-github-copilot
# - https://docs.github.com/en/copilot/reference/copilot-billing/models-and-pricing
schema = 2
base_model = "anthropic/claude-fable-5-1"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[api.messages]
base_url = "https://api.githubcopilot.com/v1"
sdk = { aisdk = "@ai-sdk/anthropic" }

[cost.text.input]
price = 10
cache = { read = 0.25, write = 12.5 }

[cost.text.output]
price = 50
