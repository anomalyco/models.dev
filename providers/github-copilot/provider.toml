name = "GitHub Copilot"
# Reasoning HTTP format (accessed 2026-06-25): POST /chat/completions.
# Supported controls and values come from authenticated GET /models metadata
# and can change by account/model; GitHub's public model comparison does not
# document this private request schema or static mappings.
# https://api.githubcopilot.com/models
# https://docs.github.com/en/copilot/reference/ai-models/model-comparison
# APIs (authenticated GET /models `supported_endpoints`, 2026-10-21): POST /chat/completions (Gemini, Kimi),
# /responses and ws:/responses (GPT, Grok, MAI), /v1/messages and /chat/completions (Claude), plus /embeddings.
# Mid-conversation flags: GitHub documents none of them and they were not tested live. Claude models that Anthropic
# lists for in-history system messages (no beta header needed) set system_updates on [api.messages] only.
# tools.updates and effort_updates need Anthropic betas Copilot isn't known to accept, so they're unset everywhere.
# Cost: USD per 1M tokens billed in AI credits ($0.01 each) beyond the plan allowance:
# https://docs.github.com/en/copilot/reference/copilot-billing/models-and-pricing. Legacy annual plans bill
# per-request multipliers instead, which these files don't carry.
env = ["GITHUB_TOKEN"]
npm = "@ai-sdk/openai-compatible"
opencodeai = "@opencode/ai/providers/openai-compatible"
doc = "https://docs.github.com/en/copilot"
api= "https://api.githubcopilot.com"
