# Effort: reasoning_effort = low|medium|high (verified live: reasoning_content length tracks
# the level). Thinking is always on here; chat_template_kwargs.enable_thinking has no effect.
schema = 2
base_model = "openai/gpt-oss-120b"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.15
cache = { read = 0.015 }

[cost.text.output]
price = 0.6
