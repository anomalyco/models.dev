# Effort: reasoning_effort = low|medium|high
# https://graphn.ai/inference/gpt-oss-120b
# Live 2026-10-27: each effort level changes reasoning length; reasoning is returned in
# reasoning_content (and mirrored in reasoning). json_schema honoured. No cached tokens
# reported on a repeated ~10K-token prefix, so no cache price is listed.
schema = 2
base_model = "openai/gpt-oss-120b"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.15

[cost.text.output]
price = 0.6
