# Alias and limits: GET https://model.graphn.ai/v1/models (checked 2026-10-21); 250K context
# and the platform's 32K output cap.
# Rate card: the platform's published billing rate per 1M tokens. This alias does not have
# its own row on https://graphn.ai/pricing yet (checked 2026-10-21), so treat the price as
# pre-release.
# Effort: reasoning_effort = low|high|max (default max; verified live). Thinking is always on
# here: chat_template_kwargs.enable_thinking does not suppress reasoning_content.
schema = 2
base_model = "zhipuai/glm-5.3"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, default = { type = "effort", value = "max" }, effort = ["low", "high", "max"] }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[limit]
context = 250_000
output = 32_768

[cost.text.input]
price = 1.4
cache = { read = 0.14 }

[cost.text.output]
price = 4.4
