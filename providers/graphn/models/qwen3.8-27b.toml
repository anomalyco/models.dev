# Toggle: chat_template_kwargs.enable_thinking true|false
# Effort: reasoning_effort = low|medium|xhigh (high and max are rejected with 400 on this host)
schema = 2
base_model = "alibaba/qwen3.8-27b"

[capabilities]
cache = { implicit = true }
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "xhigh"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.45
cache = { read = 0.045 }

[cost.text.output]
price = 3.2
