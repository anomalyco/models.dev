# Toggle: chat_template_kwargs.enable_thinking true|false (thinking is on by default)
# https://graphn.ai/inference/qwen3.8-27b
# Live 2026-10-27: PNG, JPEG, GIF and WebP images and MP4 video are read; enable_thinking =
# false returns no reasoning; json_schema honoured; a repeated ~15K-token prefix reported
# 13,600 cached tokens on the second request.
schema = 2
base_model = "alibaba/qwen3.8-27b"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "video/mp4"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.45
cache = { read = 0.045 }

[cost.text.output]
price = 3.2
