# Served as Qwen/Qwen3.5-9B under the `qwen3-vl` alias.
# Toggle: chat_template_kwargs.enable_thinking true|false
# reasoning_effort is accepted here but leaves the response unchanged, so it is not offered.
schema = 2
base_model = "alibaba/qwen3.5-9b"
name = "Qwen3 VL"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[limit]
output = 32_768

[cost.text.input]
price = 0.1
cache = { read = 0.01 }

[cost.text.output]
price = 0.15
