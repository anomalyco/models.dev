# Source: OhMyGPT public catalog, GET https://api.ohmygpt.com/v1/models/deepseek/deepseek-v4-flash-0731 (snapshot 2026-11-11): prices, limits and the serving provider (alibaba).
# Prices: the catalog lists them in Coins, OhMyGPT's billing unit, per 1M tokens (fields named `price_credits`); 1 USD = 250,000 Coins (https://www.ohmygpt.com/docs/costs).
# API: Chat Completions is this model's native protocol on OhMyGPT; the request is forwarded to the serving provider (Alibaba Cloud (Model Studio Intl)) without protocol conversion (https://www.ohmygpt.com/docs/api/chat-completions#native-and-other-models).
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|high|max
# Checked live 2026-11-11 with each serving provider pinned as `<provider>:deepseek/deepseek-v4-flash-0731` (https://www.ohmygpt.com/docs/provider-routing): thinking.type = disabled returned no reasoning_content on every serving provider, and reasoning_effort low, high and max were accepted on every one.
# The creator's own entry is providers/deepseek/models/deepseek-v4-flash.toml; only what held on every serving provider is listed.
# Cache: the catalog prices implicit cache reads and an explicit cache (its own read and write prices).
schema = 2
base_model = "deepseek/deepseek-v4-flash-0731"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true, explicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content", max_tokens_field = "max_tokens" }

[cost.text.input]
price = 0.1104
cache = { read = 0.0224, explicit = { read = 0.01104, write = 0.138 } }

[cost.text.output]
price = 0.22
