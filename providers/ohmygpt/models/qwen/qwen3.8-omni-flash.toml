# Source: OhMyGPT public catalog, GET https://api.ohmygpt.com/v1/models/qwen/qwen3.8-omni-flash (snapshot 2026-11-11): prices, limits and the serving provider (alibaba).
# Prices: the catalog lists them in Coins, OhMyGPT's billing unit, per 1M tokens (fields named `price_credits`); 1 USD = 250,000 Coins (https://www.ohmygpt.com/docs/costs).
# API: Chat Completions is this model's native protocol on OhMyGPT and Alibaba Cloud (alibaba) is its only serving provider, so the request body reaches the vendor as sent and vendor fields work as the vendor documents them (https://www.ohmygpt.com/docs/api/chat-completions#native-and-other-models). Reasoning controls follow providers/alibaba/models/qwen3.8-omni-flash.toml.
# Effort: reasoning_effort = low|medium|xhigh; none disables thinking.
# Cache: implicit; the catalog prices cached input and requests need no cache markers.
# Limits: OhMyGPT's own figures (catalog context_length and limits, with the serving provider's override where it has one).
schema = 2
base_model = "alibaba/qwen3.8-omni-flash"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "xhigh" }, effort = ["none", "low", "medium", "xhigh"] }
structured_output = true
cache = { implicit = true }

[limit]
input = 991_808

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.113
cache = { read = 0.014 }

[cost.text.output]
price = 0.382
