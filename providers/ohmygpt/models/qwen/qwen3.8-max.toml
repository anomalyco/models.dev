# Source: OhMyGPT public catalog, GET https://api.ohmygpt.com/v1/models/qwen/qwen3.8-max (snapshot 2026-11-11): prices, limits and the serving provider (alibaba).
# Prices: the catalog lists them in Coins, OhMyGPT's billing unit, per 1M tokens (fields named `price_credits`); 1 USD = 250,000 Coins (https://www.ohmygpt.com/docs/costs).
# API: Chat Completions is this model's native protocol on OhMyGPT and Alibaba Cloud (alibaba) is its only serving provider, so the request body reaches the vendor as sent and vendor fields work as the vendor documents them (https://www.ohmygpt.com/docs/api/chat-completions#native-and-other-models). Reasoning controls follow providers/alibaba/models/qwen3.8-max.toml.
# Toggle: enable_thinking true|false (hybrid)
# Effort: reasoning_effort = low|medium|xhigh (default xhigh); high accepted as alias → xhigh
# Budget: thinking_budget (0..262144) cannot be combined with reasoning_effort
# Cache: the catalog prices implicit cache reads and an explicit cache (its own read and write prices).
# Limits: none overridden. The catalog's figures for this model (context 1,000,000, output 131,072) are the lab file's.
schema = 2
base_model = "alibaba/qwen3.8-max"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "xhigh" }, toggle = true, effort = ["low", "medium", "xhigh"], budget = { min = 0, max = 262_144 } }
structured_output = true
cache = { implicit = true, explicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.485
cache = { read = 0.1854, explicit = { read = 0.1233, write = 1.8567 } }

[cost.text.output]
price = 4.4559
