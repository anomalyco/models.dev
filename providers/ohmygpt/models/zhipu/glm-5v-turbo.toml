# Source: OhMyGPT public catalog, GET https://api.ohmygpt.com/v1/models/zhipu/glm-5v-turbo (snapshot 2026-11-11): prices, limits and the serving provider (chatglm).
# Prices: the catalog lists them in Coins, OhMyGPT's billing unit, per 1M tokens (fields named `price_credits`); 1 USD = 250,000 Coins (https://www.ohmygpt.com/docs/costs).
# API: Chat Completions is this model's native protocol on OhMyGPT and Zhipu AI (chatglm) is its only serving provider, so the request body reaches the vendor as sent and vendor fields work as the vendor documents them (https://www.ohmygpt.com/docs/api/chat-completions#native-and-other-models). Reasoning controls follow providers/zhipuai/models/glm-5v-turbo.toml.
# Toggle: thinking.type = enabled|disabled (default enabled)
# Cache: implicit; the catalog prices cached input and requests need no cache markers.
# Limits: OhMyGPT's own figures (catalog context_length and limits, with the serving provider's override where it has one).
# Prices: the catalog's lower band ends below 32,000 input tokens (tier bound 32,000, exclusive), so the band above it uses gte.
schema = 2
base_model = "zhipuai/glm-5v-turbo"

[capabilities]
reasoning = { supported = true, default = { type = "toggle", value = true }, toggle = true }
cache = { implicit = true }

[limit]
output = 128_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content", max_tokens_field = "max_tokens" }

[cost.text.input]
price = 0.803
cache = { read = 0.19272 }

[[cost.text.input.overrides]]
when = { context = { gte = 32_000 } }
price = 1.1242
cache = { read = 0.28908 }

[cost.text.output]
price = 3.5332

[[cost.text.output.overrides]]
when = { context = { gte = 32_000 } }
price = 4.1756
