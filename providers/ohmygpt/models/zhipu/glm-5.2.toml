# Source: OhMyGPT public catalog, GET https://api.ohmygpt.com/v1/models/zhipu/glm-5.2 (snapshot 2026-11-11): prices, limits and the serving providers (tencent, alibaba).
# Prices: the catalog lists them in Coins, OhMyGPT's billing unit, per 1M tokens (fields named `price_credits`); 1 USD = 250,000 Coins (https://www.ohmygpt.com/docs/costs).
# API: Chat Completions is this model's native protocol on OhMyGPT; the request is forwarded to the serving provider (Tencent Cloud TokenHub, Alibaba Cloud (Model Studio Intl)) without protocol conversion (https://www.ohmygpt.com/docs/api/chat-completions#native-and-other-models).
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = high|max
# Checked live 2026-11-11 with each serving provider pinned as `<provider>:zhipu/glm-5.2` (https://www.ohmygpt.com/docs/provider-routing): thinking.type = disabled returned no reasoning_content on both serving providers; reasoning_effort high and max were accepted on both, max using more reasoning tokens.
# The creator's own entry is providers/zhipuai/models/glm-5.2.toml; only what held on every serving provider is listed.
# Cache: implicit; the catalog prices cached input and requests need no cache markers.
# Limits: OhMyGPT's own figures (catalog context_length and limits, with the serving provider's override where it has one).
# Prices: the catalog's headline price, which is its lowest-priced serving provider (Alibaba Cloud (Model Studio Intl)). The gateway tries the cheaper provider first; a request served by another provider is billed at that provider's rate, up to 1.42x on input (catalog providers[].pricing).
schema = 2
base_model = "zhipuai/glm-5.2"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["high", "max"] }
structured_output = true
cache = { implicit = true }

[limit]
output = 128_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content", max_tokens_field = "max_tokens" }

[cost.text.input]
price = 0.66
cache = { read = 0.165 }

[cost.text.output]
price = 2.3106
