# Source: OhMyGPT public catalog, GET https://api.ohmygpt.com/v1/models/zhipu/glm-4.5v (snapshot 2026-11-11): prices, limits and the serving provider (chatglm).
# Prices: the catalog lists them in Coins, OhMyGPT's billing unit, per 1M tokens (fields named `price_credits`); 1 USD = 250,000 Coins (https://www.ohmygpt.com/docs/costs).
# API: Chat Completions is this model's native protocol on OhMyGPT and Zhipu AI (chatglm) is its only serving provider, so the request body reaches the vendor as sent and vendor fields work as the vendor documents them (https://www.ohmygpt.com/docs/api/chat-completions#native-and-other-models). Reasoning controls follow providers/zhipuai/models/glm-4.5v.toml.
# Toggle: thinking.type = enabled|disabled (default enabled)
# Cache: implicit; the catalog prices cached input and requests need no cache markers.
schema = 2
base_model = "zhipuai/glm-4.5v"

[capabilities]
reasoning = { supported = true, default = { type = "toggle", value = true }, toggle = true }
top_k = false
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content", max_tokens_field = "max_tokens" }

[cost.text.input]
price = 0.3212
cache = { read = 0.06424 }

[[cost.text.input.overrides]]
when = { context = { gte = 32_000 } }
price = 0.6424
cache = { read = 0.12848 }

[cost.text.output]
price = 0.9636

[[cost.text.output.overrides]]
when = { context = { gte = 32_000 } }
price = 1.9272
