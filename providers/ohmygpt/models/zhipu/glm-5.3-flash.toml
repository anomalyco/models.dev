# Source: OhMyGPT public catalog, GET https://api.ohmygpt.com/v1/models/zhipu/glm-5.3-flash (snapshot 2026-11-11): prices, limits and the serving providers (chatglm, tencent).
# Prices: the catalog lists them in Coins, OhMyGPT's billing unit, per 1M tokens (fields named `price_credits`); 1 USD = 250,000 Coins (https://www.ohmygpt.com/docs/costs).
# API: Chat Completions is this model's native protocol on OhMyGPT; the request is forwarded to the serving provider (Zhipu AI (ChatGLM), Tencent Cloud TokenHub) without protocol conversion (https://www.ohmygpt.com/docs/api/chat-completions#native-and-other-models).
# Effort: reasoning_effort = low|high|max
# Checked live 2026-11-11 with each serving provider pinned as `<provider>:zhipu/glm-5.3-flash` (https://www.ohmygpt.com/docs/provider-routing): the three levels were accepted on both serving providers and reasoning tokens rose with the level on both; thinking cannot be turned off (thinking.type = disabled returns 400 or is ignored).
# The creator's own entry is providers/zhipuai/models/glm-5.3-flash.toml; only what held on every serving provider is listed.
# top_k = false: providers/zhipuai excludes top_k for this model, so it does not hold on every serving provider. A request that sends it still returns 200 on each of them (live 2026-11-11), so acceptance alone does not show support.
# Cache: implicit; the catalog prices cached input and requests need no cache markers.
# Limits: the catalog shows context 1,048,576, above the creator's own entry (1,000,000). A relay cannot widen the upstream's window, so the creator's figure stands.
# Prices: the catalog's headline price, which is its lowest-priced serving provider (Tencent Cloud TokenHub). The gateway tries the cheaper provider first; a request served by another provider is billed at that provider's rate, up to 1.1x on input (catalog providers[].pricing).
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
top_k = false
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content", max_tokens_field = "max_tokens" }

[cost.text.input]
price = 0.1168
cache = { read = 0.03358 }

[cost.text.output]
price = 0.4088
