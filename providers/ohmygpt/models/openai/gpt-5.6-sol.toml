# Source: OhMyGPT public catalog, GET https://api.ohmygpt.com/v1/models/openai/gpt-5.6-sol (snapshot 2026-11-11): prices, limits and the serving providers (azure, openai).
# Prices: the catalog lists them in Coins, OhMyGPT's billing unit, per 1M tokens (fields named `price_credits`); 1 USD = 250,000 Coins (https://www.ohmygpt.com/docs/costs).
# API: Chat Completions and Responses are both native protocols for this model on OhMyGPT (native: true in the catalog); the request body reaches OpenAI as sent (https://www.ohmygpt.com/docs/api/protocols#native-protocol).
# Effort: reasoning_effort (Chat Completions) or reasoning.effort (Responses) = none|low|medium|high|xhigh. providers/openai/models/gpt-5.6-sol.toml also lists max: here it is accepted on Responses only (the other returns 400, live 2026-11-11), so it is not listed.
# tools.freeform: checked live 2026-11-11 on /v1/chat/completions and /v1/responses. Both accepted custom tools as text, lark, regex and enforced the grammars: asked to pass `hello`, the regex ZZ[0-9]{3} and the equivalent lark grammar each returned ZZ plus three digits.
# Cache: implicit; the catalog prices cached input and requests need no cache markers.
# Limits: none overridden. The catalog's figures for this model (context 1,050,000, output 128,000) are the lab file's.
# Prices: the catalog's lower band includes a prompt of exactly 272,000 input tokens (tier bound 272,001, exclusive), so the band above it uses gt.
# Prices: the catalog schedules a price change (valid_from); it is written as a dated rule below.
schema = 2
base_model = "openai/gpt-5.6-sol"

[capabilities]
tools = { supported = true, freeform = ["text", "lark", "regex"] }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true
cache = { implicit = true }

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 3.6
cache = { read = 0.36, write = 4.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 7.2
cache = { read = 0.72, write = 9 }

[[cost.text.input.overrides]]
when = { date = { gte = "2026-11-22" } }
price = 4.5
cache = { read = 0.45, write = 5.625 }

[[cost.text.input.overrides]]
when = { date = { gte = "2026-11-22" }, context = { gt = 272_000 } }
price = 9
cache = { read = 0.9, write = 11.25 }

[cost.text.output]
price = 18

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 27

[[cost.text.output.overrides]]
when = { date = { gte = "2026-11-22" } }
price = 27

[[cost.text.output.overrides]]
when = { date = { gte = "2026-11-22" }, context = { gt = 272_000 } }
price = 40.5

[cost.web_search]
price = 12.6
