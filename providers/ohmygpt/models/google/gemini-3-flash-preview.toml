# Source: OhMyGPT public catalog, GET https://api.ohmygpt.com/v1/models/google/gemini-3-flash-preview (snapshot 2026-11-11): prices, limits and the serving provider (vertex).
# Prices: the catalog lists them in Coins, OhMyGPT's billing unit, per 1M tokens (fields named `price_credits`); 1 USD = 250,000 Coins (https://www.ohmygpt.com/docs/costs).
# API: Gemini generateContent (POST /v1/models/{model}:generateContent, x-goog-api-key or Bearer) is this model's native protocol on OhMyGPT; the request body reaches Google as sent (https://www.ohmygpt.com/docs/api/gemini). Chat Completions is also listed: OhMyGPT converts the request and the answer (https://www.ohmygpt.com/docs/api/protocols#other-protocols).
# generate-content base URL ends in /models: @ai-sdk/google appends a model ID that contains a slash as it is. @opencode/ai/providers/google always adds /models/ itself, so it cannot use this table (opencodeai = "none") and takes Chat Completions.
# Effort: generationConfig.thinkingConfig.thinkingLevel = minimal|low|medium|high on generateContent; reasoning_effort with the same values on Chat Completions, which OhMyGPT sends as thinkingLevel (https://www.ohmygpt.com/docs/api/thinking#gemini). Levels follow providers/google/models/gemini-3-flash-preview.toml. Checked live 2026-11-11 on Chat Completions: each listed level is accepted. reasoning_effort = none selects the model's lowest level, not off, so it is not listed.
# Input: video is accepted on generateContent only; Chat Completions returns 400 for video content (live 2026-11-11).
# Cache: implicit; the catalog prices cached input and requests need no cache markers.
# Limits: OhMyGPT's own figures (catalog context_length and limits, with the serving provider's override where it has one).
schema = 2
base_model = "google/gemini-3-flash-preview"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "high" }, effort = ["minimal", "low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 1_000_000
output = 64_000

[api.generate-content]
base_url = "https://api.ohmygpt.com/v1/models"
sdk = { aisdk = "@ai-sdk/google", opencodeai = "none" }

[api.chat-completions]

[cost.text.input]
price = 0.45
cache = { read = 0.045 }

[cost.text.output]
price = 2.7

[cost.audio.input]
price = 0.9
cache = { read = 0.09 }

[cost.image.input]
price = 0.45

[cost.web_search]
price = 12.6
