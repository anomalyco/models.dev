# Source: OhMyGPT public catalog, GET https://api.ohmygpt.com/v1/models/anthropic/claude-sonnet-4-6 (snapshot 2026-11-11): prices, limits and the serving provider (anthropic).
# Prices: the catalog lists them in Coins, OhMyGPT's billing unit, per 1M tokens (fields named `price_credits`); 1 USD = 250,000 Coins (https://www.ohmygpt.com/docs/costs).
# API: Anthropic Messages (POST /v1/messages) is this model's native protocol on OhMyGPT. The request body and anthropic-* headers reach Anthropic as sent (https://www.ohmygpt.com/docs/api/messages#claude), so reasoning controls, prompt caching and structured output are Anthropic's: providers/anthropic/models/claude-sonnet-4-6.toml.
# Effort: output_config.effort = low|medium|high|max
# Budget: thinking.type = enabled with thinking.budget_tokens (integer reasoning tokens, minimum 1024)
# Checked live 2026-11-11 on POST /v1/messages with x-api-key: output_config.effort accepts exactly the listed levels (Anthropic returns 400 for the others), and thinking.budget_tokens is accepted only where a budget is listed.
# Mid-conversation flags (system_updates, effort_updates, tools.updates) are left out: not checked on this host.
# Limits: OhMyGPT's own figures (catalog context_length and limits, with the serving provider's override where it has one).
schema = 2
base_model = "anthropic/claude-sonnet-4-6"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "max"], budget = { min = 1_024 } }
structured_output = true
cache = { explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 1_024 } }

[limit]
output = 128_000

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 3.3
cache = { read = 0.33, write = { "5m" = 4.125, "1h" = 6.6 } }

[cost.text.output]
price = 16.5

[cost.web_search]
price = 11
