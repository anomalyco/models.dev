# Source: OhMyGPT public catalog, GET https://api.ohmygpt.com/v1/models/moonshot/kimi-k3.1-pro (snapshot 2026-11-11): prices, limits and the serving providers (moonshot, tencent).
# Prices: the catalog lists them in Coins, OhMyGPT's billing unit, per 1M tokens (fields named `price_credits`); 1 USD = 250,000 Coins (https://www.ohmygpt.com/docs/costs).
# API: Chat Completions is this model's native protocol on OhMyGPT; the request is forwarded to the serving provider (Moonshot AI (Kimi), Tencent Cloud TokenHub) without protocol conversion (https://www.ohmygpt.com/docs/api/chat-completions#native-and-other-models).
# Effort: reasoning_effort = low|high|max
# Checked live 2026-11-11 with each serving provider pinned as `<provider>:moonshot/kimi-k3.1-pro` (https://www.ohmygpt.com/docs/provider-routing): the three levels were accepted on every serving provider. No toggle is listed: with thinking.type = disabled the answer on Tencent Cloud carries the reasoning text in `content`.
# The creator's own entry is providers/moonshotai/models/kimi-k3.1-pro.toml; only what held on every serving provider is listed.
# Cache: implicit; the catalog prices cached input and requests need no cache markers.
# Limits: OhMyGPT's own figures (catalog context_length and limits, with the serving provider's override where it has one).
schema = 2
base_model = "moonshotai/kimi-k3.1-pro"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[limit]
output = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 2.0878
cache = { read = 0.20878 }

[cost.text.output]
price = 10.9208
