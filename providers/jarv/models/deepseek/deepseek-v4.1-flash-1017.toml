# https://chat.jarv.tech/docs/api/openai#openai-reasoning
# Chat Completions supports reasoning.effort and returns reasoning_content.
# Thinking is unavailable when JARV routes DeepSeek through qwen-gateway.
# Personal API keys cap output at 32,768 tokens.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
top_p = false
top_k = false

[limit]
output = 32_768

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
