# https://chat.jarv.tech/docs/api/openai#openai-reasoning
# Chat Completions supports reasoning.effort and returns reasoning_content.
# Personal API keys cap output at 32,768 tokens.
# JARV API OpenAIChatRequest accepts temperature and ignores top_p/top_k.
# https://gitlab.com/jarv-group/jarv_new/-/blob/69fef674ed34dcff4cff683e90aa914497591b4d/services/public-api/src/jarv_public_api/api/openai_compat.py#L51-74
# JARV Chat Completions forwards image_url message parts (see PR #14394).
# Publish only text and images. ModalitiesV2 requires both input and output.
# JSON Schema enforcement is delegated to the selected endpoint and can vary on fallback.
# https://chat.jarv.tech/docs/api/structured (JARV route evidence in PR #14394).
schema = 2
base_model = "openai/gpt-6-luna"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
top_p = false

[limit]
output = 32_768

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
