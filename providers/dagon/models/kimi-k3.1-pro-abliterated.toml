# Sources (accessed 2026-11-08):
# - Limits, input types, prices (cheapest upstream route plus 10% markup; prices float with the
#   routed upstream): https://inference.dagon.so/v1/models
# - Model page: https://inference.dagon.so/models/kimi-k3.1-pro-abliterated
# - Forwarded Chat Completions fields: https://inference.dagon.so/docs/chat-completions
#   (reasoning_effort is forwarded; thinking toggles and top_k are not forwarded on Chat Completions)
# Upstream: Silk Compute. Effort: reasoning_effort = none|low|high|max. Live probe 2026-11-08
# (POST /v1/chat/completions, Silk route): "none" -> 0 reasoning tokens (reasoning off); low 2851; high 2642;
# max hit Silk's 524 timeout; unset 2993.
schema = 2
base_model = "moonshotai/kimi-k3.1-pro"
name = "Kimi K3.1 Pro Abliterated"
description = "Abliterated variant of Kimi K3.1 Pro (refusal behavior removed), routed by Dagon Inference"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
cache = { implicit = true }

[limit]
output = 65_536

[cost.text.input]
price = 5.5
cache = { read = 0.55 }

[cost.text.output]
price = 16.5
