# Sources (accessed 2026-11-08):
# - Limits, input types, prices (cheapest upstream route plus 10% markup; prices float with the
#   routed upstream): https://inference.dagon.so/v1/models
# - Model page: https://inference.dagon.so/models/deepseek-v4.1-flash-abliterated
# - Forwarded Chat Completions fields: https://inference.dagon.so/docs/chat-completions
#   (reasoning_effort is forwarded; thinking toggles and top_k are not forwarded on Chat Completions)
# Upstreams: Lutheos, Refuseless, Silk Compute, Experiential Labs. Text-only on this host. Effort ladder matches DeepSeek V4.1 Flash relay peers (reasoning_effort).
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"
name = "DeepSeek V4.1 Flash Abliterated"
description = "Abliterated variant of DeepSeek V4.1 Flash (refusal behavior removed), routed by Dagon Inference"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
cache = { implicit = true }
top_k = false

[limit]
context = 1_048_576
output = 65_536

[cost.text.input]
price = 0.088
cache = { read = 0.0176 }

[cost.text.output]
price = 0.352
