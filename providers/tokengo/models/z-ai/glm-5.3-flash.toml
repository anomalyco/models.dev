# Effort: reasoning_effort = low|high|max
# Pricing (USD/MTok): public hub $0.15/$0.50 (https://www.tokengo.com/models,
# accessed 2026-10-21; was $0.075/$0.025 on 2026-08-27). The hub shows no cache
# rate; cache read 0.03 is Z.ai's list rate, which TokenGo's other GLM rates match.
# TokenGo OpenAI-compatible extra_body; same effort set as typical GLM-5.3-Flash openai-compat peers.
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[cost.text.input]
price = 0.15
cache = { read = 0.03 }

[cost.text.output]
price = 0.5
