# Host-unique model: Pareto is Unbiased's own blended model, served first-party at api.unbiased.ai.
# Current release: Pareto 26.10 (https://unbiased.ai/blog/pareto-26-10/, published 2026-10-15).
# Pricing (USD per 1M tokens, accessed 2026-10-30): https://unbiased.ai/pricing/
# Limits: 1,048,576 context / 131,072 max output, per OpenRouter models API for unbiased/pareto-26.10.
# Sampling params (temperature, top_p) per the same OpenRouter listing.
schema = 2
name = "Pareto 26.10"
description = "Blended model from Unbiased: selects frontier and open models for each request and blends their outputs into one answer"
open_weights = false
release_date = "2026-10-15"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
cache = { implicit = true }
temperature = true
top_p = true
top_k = false

[limit]
context = 1_048_576
output = 131_072

[cost.text.input]
price = 0.8
cache = { read = 0.03 }

[cost.text.output]
price = 3.2
