# They can change at any time (https://docs.opencheap.si/models).
# Tool calls checked live on 2026-10-28, streaming and non-streaming.
schema = 2
base_model = "openai/gpt-4.1-nano"

[cost.text.input]
price = 0.1
cache = { read = 0.03 }

[cost.text.output]
price = 0.4
