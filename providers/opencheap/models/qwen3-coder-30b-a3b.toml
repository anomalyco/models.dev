# Prices are USD per million tokens: our price on the public list https://opencheap.si/api/prices (no key), kept current by `bun models:sync opencheap`.
# They can change at any time (https://docs.opencheap.si/models).
# Tool calls checked live on 2026-10-28, streaming and non-streaming.
# Cache: no cache_control needed; some repeats of a ~4k-token prompt came back with usage.prompt_tokens_details.cached_tokens, depending on the route that served the call (live, 2026-11-11).
schema = 2
base_model = "alibaba/qwen3-coder-30b-a3b-instruct"

[capabilities]
cache = { implicit = true }

[cost.text.input]
price = 0.0011
cache = { read = 0.00016 }

[cost.text.output]
price = 0.0042
