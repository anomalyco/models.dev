# Generated by bun models:sync keln from https://api.keln.ai/v1/models.
# Prices are USD per million tokens; lab facts are inherited via base_model.
# Effort: top-level reasoning_effort = low|high|max.
# xhigh: accepted as an alias of max (https://docs.keln.ai/capabilities/reasoning/).
# Input: text and image per Keln's catalog; this model takes no video on Keln.
schema = 2
base_model = "moonshotai/kimi-k3.1-pro"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }

[cost.text.input]
price = 2
cache = { read = 0.24 }

[cost.text.output]
price = 10
