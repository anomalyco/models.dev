# Pricing section, USD per million tokens: https://mixroute.ai/models/claude-sonnet-5-5/
# Explicit caching via cache_control.type=ephemeral: https://mixroute.ai/docs/api-reference/endpoint/messages#prompt-caching
# Sources: https://mixroute.ai/models/claude-sonnet-5-5/ and https://mixroute.ai/docs/api-reference/endpoint/messages
# Effort: output_config.effort on Messages; native Claude levels, matching providers/anthropic.
# Live 2026-10-31: /v1/models lists anthropic and openai endpoints; Messages accepts x-api-key and low effort (HTTP 200).
schema = 2
base_model = "anthropic/claude-sonnet-5-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { explicit = true }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[api.chat-completions]

[cost.text.input]
price = 2
cache = { read = 0.2, write = 2.5 }

[cost.text.output]
price = 10
