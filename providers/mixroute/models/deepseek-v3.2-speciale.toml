# Wire: https://mixroute.ai/docs/api-reference/endpoint/chat-openai documents DeepSeek reasoning_content and max_tokens.
# Speciale baseline: exclusively deep reasoning, unlike the hybrid V3.2 model; no lab toggle is documented.
# https://huggingface.co/deepseek-ai/DeepSeek-V3.2-Speciale#how-to-run-locally
# MixRoute documents no Speciale toggle; do not copy controls from the different deepseek-v3.2 model.
# Catalog: https://api.mixroute.ai/v1/models
# Service: https://mixroute.ai/models/deepseek-v3-2-speciale/
schema = 2
base_model = "deepseek/deepseek-v3.2-speciale"

[capabilities]
reasoning = { supported = true }

[limit]
context = 131072
output = 128000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content", max_tokens_field = "max_tokens" }
