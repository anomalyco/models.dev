# Wire: https://mixroute.ai/docs/api-reference/endpoint/chat-openai documents DeepSeek reasoning_content and max_tokens.
# Catalog: https://api.mixroute.ai/v1/models
# Toggle: thinking.type = enabled|disabled
# Live 2026-11-01: both toggle values returned HTTP 200 at low effort; disabled produced 0 reasoning tokens, enabled produced 18.
schema = 2
base_model = "deepseek/deepseek-v4-flash"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content", max_tokens_field = "max_tokens" }
