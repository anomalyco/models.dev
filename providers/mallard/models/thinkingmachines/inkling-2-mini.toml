# Sources (accessed 2026-11-21): https://mallardai.co.uk/models/inkling-2-mini/, https://mallardai.co.uk/pricing/,
#   https://mallardai.co.uk/docs/, https://api.mallardai.co.uk/v1/models
# Billed in GBP: £0.03 input / £0.01 cached input / £0.20 output per 1M tokens (launch price until 2027-01-31,
#   https://mallardai.co.uk/pricing/); converted at the ECB reference rate of 2026-10-23: 1 GBP = 1.3368 USD
#   (exact products: $0.040104, $0.013368, $0.26736), the rate of the prices at https://api.mallardai.co.uk/v1/models.
# Off is reasoning_effort = none; graded levels none|minimal|low|medium|high, default high (no toggle).
# Context is 262,144 tokens here (the lab's model allows 1,048,576). Prefix caching is automatic per API key.
# Images: PNG, JPEG and WebP, 16 per request.
schema = 2
base_model = "thinkingmachines/inkling-2-mini"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high"], default = { type = "effort", value = "high" } }
structured_output = true
cache = { implicit = true }

[limit]
context = 262_144

[cost.text.input]
price = 0.040104
cache = { read = 0.013368 }

[cost.text.output]
price = 0.26736
