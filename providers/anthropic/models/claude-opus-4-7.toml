# Web search: $10 per 1,000 searches; each search counts once, however many results it returns: https://platform.claude.com/docs/en/about-claude/pricing#web-search-tool
# Token-only multipliers (object factor, so cost.web_search is unscaled): US data residency (https://platform.claude.com/docs/en/manage-claude/data-residency#pricing).
schema = 2
name = "Claude Opus 4.7"
description = "Stronger Opus tier for advanced software work and high-stakes reasoning"
family = "claude-opus"
open_weights = false
knowledge = "2026-01-31"
release_date = "2026-04-14"
last_updated = "2026-04-16"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
temperature = false
system_updates = false
effort_updates = false
cache = { explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 2_048 } }

[limit]
context = 1_000_000
output = 128_000

[cost.text.input]
price = 5
cache = { read = 0.5, write = { "5m" = 6.25, "1h" = 10 } }

[cost.text.output]
price = 25

[cost.web_search]
price = 10

[[cost.multipliers]]
when = { region = { equals = "us" } }
factor = { text = 1.1 }
