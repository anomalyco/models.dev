schema = 2
name = "Claude Sonnet 5"
description = "Everyday Claude agent model for coding, planning, browsing, and general work"
family = "claude-sonnet"
open_weights = false
knowledge = "2026-01-31"
release_date = "2026-06-29"
last_updated = "2026-06-30"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
temperature = false
system_updates = false
effort_updates = false
cache = { supported = true, implicit = false, explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 1_024 } }

[limit]
context = 1_000_000
output = 128_000

[cost.text.input]
price = 2
cache = { read = 0.2, write = { "5m" = 2.5, "1h" = 4 } }

[cost.text.output]
price = 10

[[cost.multipliers]]
when = { region = { equals = "us" } }
factor = 1.1
