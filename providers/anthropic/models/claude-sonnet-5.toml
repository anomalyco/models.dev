# Mid-conversation system messages: the docs list Sonnet 5 as unsupported, but the API accepts
# them in place (cache kept) and Anthropic's own client enables them for this model (2026-10-19).
# Web search: $10 per 1,000 searches; each search counts once, however many results it returns: https://platform.claude.com/docs/en/about-claude/pricing#web-search-tool
# Token-only multipliers (object factor, so cost.web_search is unscaled): US data residency (https://platform.claude.com/docs/en/manage-claude/data-residency#pricing).
schema = 2
name = "Claude Sonnet 5"
description = "Everyday Claude agent model for coding, planning, browsing, and general work"
family = "claude-sonnet"
open_weights = false
knowledge = "2026-01-31"
release_date = "2026-06-29"
last_updated = "2026-06-30"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
temperature = false
system_updates = true
effort_updates = false
cache = { supported = true, implicit = false, explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 1_024 } }

[limit]
context = 1_000_000
output = 128_000

[cost.text.input]
price = 2
cache = { read = 0.2, write = { "5m" = 2.5, "1h" = 4 } }

[cost.text.output]
price = 10

[cost.web_search]
price = 10

[[cost.multipliers]]
when = { region = { equals = "us" } }
factor = { text = 1.1 }
