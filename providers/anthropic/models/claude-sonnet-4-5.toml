base_model = "anthropic/claude-sonnet-4-5"
name = "Claude Sonnet 4.5 (latest)"
description = "Balanced Claude model for coding, analysis, agent workflows, and cost control"
attachment = true
reasoning = true
structured_output = true

[[reasoning_options]]
type = "budget_tokens"
min = 1_024

[cost]
input = 3
output = 15
cache_read = 0.3
cache_write = 3.75

[limit]
context = 1_000_000
output = 64_000

[modalities]
input = ["text", "image", "pdf"]
output = ["text"]
