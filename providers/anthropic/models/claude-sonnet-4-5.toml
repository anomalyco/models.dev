# Web search: $10 per 1,000 searches; each search counts once, however many results it returns: https://platform.claude.com/docs/en/about-claude/pricing#web-search-tool
# APIs: Messages, and Chat Completions through the OpenAI SDK compatibility layer (https://platform.claude.com/docs/en/api/openai-sdk)
schema = 2
base_model = "anthropic/claude-sonnet-4-5"
description = "Balanced Claude model for coding, analysis, agent workflows, and cost control"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, budget = { min = 1_024 } }
structured_output = true
system_updates = false
effort_updates = false
cache = { explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 1_024 } }

[api.messages]

[api.chat-completions]
base_url = "https://api.anthropic.com/v1"
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible" }

[cost.text.input]
price = 3
cache = { read = 0.3, write = { "5m" = 3.75, "1h" = 6 } }

[cost.text.output]
price = 15

[cost.web_search]
price = 10
