schema = 2
base_model = "anthropic/claude-haiku-4-5"
description = "Fast Claude lane for lightweight agents, office tasks, and responsive chat"

[capabilities]
reasoning = { supported = true, budget = { min = 1_024 } }
structured_output = true
system_updates = false
effort_updates = false
cache = { supported = true, implicit = false, explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 4_096 } }

[cost.text.input]
price = 1
cache = { read = 0.1, write = { "5m" = 1.25, "1h" = 2 } }

[cost.text.output]
price = 5
