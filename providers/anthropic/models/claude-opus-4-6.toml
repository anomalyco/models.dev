schema = 2
name = "Claude Opus 4.6"
description = "High-end Claude for difficult coding, planning, and slower expert reasoning"
family = "claude-opus"
open_weights = false
knowledge = "2025-05-31"
release_date = "2026-02-04"
last_updated = "2026-03-13"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high", "max"], budget = { min = 1_024 } }
structured_output = true
temperature = true
system_updates = false
effort_updates = false
cache = { supported = true, implicit = false, explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 4_096 } }

[limit]
context = 1_000_000
output = 128_000

[cost.text.input]
price = 5
cache = { read = 0.5, write = { "5m" = 6.25, "1h" = 10 } }

[cost.text.output]
price = 25

[[cost.multipliers]]
when = { region = { equals = "us" } }
factor = 1.1
