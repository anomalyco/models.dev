# Sources:
# https://platform.claude.com/docs/en/models/mythos-5-1/overview
# https://platform.claude.com/docs/en/models/fable-5-1/overview
# Same specifications and pricing as Claude Fable 5.1: $10/$50 per MTok,
# cache read $0.25, 5m write $12.50, 1h write $20. Effort/cache flags mirror
# providers/anthropic/models/claude-fable-5-1.toml (first-party lab, same generation).
# tools.updates: tool_addition/tool_removal blocks (inline-tools-2026-09-15) keep the cache.
schema = 2
base_model = "anthropic/claude-mythos-5-1"

[capabilities]
tools = { supported = true, updates = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
system_updates = true
effort_updates = true
cache = { supported = true, implicit = false, explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 512 } }

[cost.text.input]
price = 10
cache = { read = 0.25, write = { "5m" = 12.5, "1h" = 20 } }

[cost.text.output]
price = 50

[[cost.multipliers]]
when = { region = { equals = "us" } }
factor = 1.1
