# Sources:
# https://platform.claude.com/docs/en/models/mythos-5-1/overview
# https://platform.claude.com/docs/en/models/fable-5-1/overview
# Same specifications and pricing as Claude Fable 5.1 (restricted access): $10/$50 per MTok, cache read $0.25, 5m write $12.50, 1h write $20.
# Capabilities, APIs and per-API flags mirror providers/anthropic/models/claude-fable-5-1.toml (same model).
# Web search: $10 per 1,000 searches: https://platform.claude.com/docs/en/about-claude/pricing#web-search-tool
# Token-only multipliers (object factor, so cost.web_search is unscaled): US data residency (https://platform.claude.com/docs/en/manage-claude/data-residency#pricing).
# APIs: Messages, and Chat Completions through the OpenAI SDK compatibility layer (https://platform.claude.com/docs/en/api/openai-sdk)
# Per-API flags: mid-conversation system messages, per-message output_config and tool_addition/tool_removal are Messages API features, so they sit on [api.messages].
schema = 2
base_model = "anthropic/claude-mythos-5-1"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 512 } }

[api.messages]
capabilities = { system_updates = true, effort_updates = true, tools = { updates = true } }

[api.chat-completions]
base_url = "https://api.anthropic.com/v1"
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible" }

[cost.text.input]
price = 10
cache = { read = 0.25, write = { "5m" = 12.5, "1h" = 20 } }

[cost.text.output]
price = 50

[cost.web_search]
price = 10

[[cost.multipliers]]
when = { region = { equals = "us" } }
factor = { text = 1.1 }
