schema = 2
name = "Claude Sonnet 4.6"
description = "Claude workhorse for coding agents, careful analysis, and production cost control"
family = "claude-sonnet"
open_weights = false
knowledge = "2025-08-31"
release_date = "2026-02-17"
last_updated = "2026-03-13"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high", "max"], budget = { min = 1_024 } }
structured_output = true
temperature = true
system_updates = false
effort_updates = false
cache = { supported = true, implicit = false, explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 1_024 } }

[limit]
context = 1_000_000
output = 128_000

[cost.text.input]
price = 3
cache = { read = 0.3, write = { "5m" = 3.75, "1h" = 6 } }

[cost.text.output]
price = 15

[[cost.multipliers]]
when = { region = { equals = "us" } }
factor = 1.1
