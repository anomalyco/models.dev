# Tool updates: tool_addition/tool_removal blocks (inline-tools-2026-09-15) keep the cache.
schema = 2
base_model = "anthropic/claude-fable-5-1"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
system_updates = true
effort_updates = true
tool_updates = true
cache = { supported = true, implicit = false, explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 512 } }

[cost.text.input]
price = 10
cache = { read = 0.25, write = { "5m" = 12.5, "1h" = 20 } }

[cost.text.output]
price = 50

[[cost.multipliers]]
when = { region = { equals = "us" } }
factor = 1.1
