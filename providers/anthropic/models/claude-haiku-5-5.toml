# Thinking: adaptive (default). thinking.type=disabled is accepted at high effort or below; xhigh/max reject it.
# https://platform.claude.com/docs/en/build-with-claude/effort#recommended-effort-levels-for-claude-haiku-5-5
# Pricing is by prompt length: prompts over 100,000 tokens use the higher tier.
# https://platform.claude.com/docs/en/models/haiku-5-5/overview
# tools.updates: tool_addition/tool_removal blocks (inline-tools-2026-09-15) keep the cache.
# Web search: $10 per 1,000 searches; each search counts once, however many results it returns: https://platform.claude.com/docs/en/about-claude/pricing#web-search-tool
# Token-only multipliers (object factor, so cost.web_search is unscaled): US data residency (https://platform.claude.com/docs/en/manage-claude/data-residency#pricing).
schema = 2
base_model = "anthropic/claude-haiku-5-5"

[capabilities]
tools = { supported = true, updates = true }
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
system_updates = true
effort_updates = true
cache = { supported = true, implicit = false, explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 512 } }

[cost.text.input]
price = 0.1
cache = { read = 0.01, write = { "5m" = 0.125, "1h" = 0.2 } }

[[cost.text.input.overrides]]
when = { context = { gt = 100_000 } }
price = 0.5
cache = { read = 0.05, write = { "5m" = 0.625, "1h" = 1 } }

[cost.text.output]
price = 0.5

[[cost.text.output.overrides]]
when = { context = { gt = 100_000 } }
price = 2.5

[cost.web_search]
price = 10

[[cost.multipliers]]
when = { region = { equals = "us" } }
factor = { text = 1.1 }
