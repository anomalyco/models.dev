# Thinking: adaptive (default). thinking.type=disabled is accepted at high effort or below; xhigh/max reject it.
# https://platform.claude.com/docs/en/build-with-claude/effort#recommended-effort-levels-for-claude-haiku-5-5
# Pricing is by prompt length: prompts over 100,000 tokens use the higher tier.
# https://platform.claude.com/docs/en/models/haiku-5-5/overview
base_model = "anthropic/claude-haiku-5-5"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh", "max"]

[cost]
input = 0.1
output = 0.5
cache_read = 0.01
cache_write = 0.125

[[cost.tiers]]
tier = { type = "context", size = 100_000 }
input = 0.5
output = 2.5
cache_read = 0.05
cache_write = 0.625
