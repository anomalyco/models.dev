# Tool updates: tool_addition/tool_removal blocks (inline-tools-2026-09-15) keep the cache.
schema = 2
name = "Claude Opus 4.8"
description = "Top Claude Opus tier for the hardest reasoning, coding, and long-horizon agents"
family = "claude-opus"
open_weights = false
knowledge = "2026-01"
release_date = "2026-05-28"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
temperature = false
system_updates = true
effort_updates = false
tool_updates = true
cache = { supported = true, implicit = false, explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 1_024 } }
service_tier = ["fast"]

[limit]
context = 1_000_000
output = 128_000

[cost.text.input]
price = 5
cache = { read = 0.5, write = { "5m" = 6.25, "1h" = 10 } }

[cost.text.output]
price = 25

[[cost.multipliers]]
when = { service_tier = { equals = "fast" } }
factor = 2

[[cost.multipliers]]
when = { region = { equals = "us" } }
factor = 1.1

[experimental.modes.fast]
body = { speed = "fast" }
headers = { anthropic-beta = "fast-mode-2026-02-01" }
