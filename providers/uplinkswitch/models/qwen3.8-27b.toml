# Prices: https://api.uplinkswitch.com/v1/catalog (accessed 2026-11-26), USD per million tokens.
# Effort: reasoning_effort = low|medium|xhigh on Chat Completions, passed through by the gateway. Levels copied from providers/alibaba for this model.
schema = 2
base_model = "alibaba/qwen3.8-27b"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "xhigh"] }

[cost.text.input]
price = 0.48
cache = { read = 0.1 }

[cost.text.output]
price = 3.2
