# Prices: https://api.uplinkswitch.com/v1/catalog (accessed 2026-11-14), USD per million tokens.
# Effort: reasoning_effort = low|medium|high|xhigh|max on Chat Completions, passed through by the gateway. Levels copied from providers/openai for this model.
schema = 2
base_model = "openai/gpt-6-astra"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 3
cache = { read = 0.3 }

[cost.text.output]
price = 15
