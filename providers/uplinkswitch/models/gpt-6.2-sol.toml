# Prices: https://api.uplinkswitch.com/v1/catalog (accessed 2026-11-26), USD per million tokens.
# Effort: reasoning_effort = low|medium|high|xhigh|max on Chat Completions, passed through by the gateway. Levels copied from providers/openai for this model.
# Limits: the catalog lists a smaller window for this host than the lab file (context_window 1000000).
schema = 2
base_model = "openai/gpt-6.2-sol"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[limit]
context = 1_000_000

[cost.text.input]
price = 0.176472
cache = { read = 0.011764 }

[cost.text.output]
price = 0.882352
