# Prices: https://api.uplinkswitch.com/v1/catalog (accessed 2026-11-26), USD per million tokens.
# Effort: reasoning_effort = none|low|medium|high|xhigh|max on Chat Completions, passed through by the gateway. Levels copied from providers/openai for this model.
schema = 2
base_model = "openai/gpt-5.6-luna"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 0.12
cache = { read = 0.012 }

[cost.text.output]
price = 0.72
