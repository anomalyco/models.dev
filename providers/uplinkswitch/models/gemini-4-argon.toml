# Prices: https://api.uplinkswitch.com/v1/catalog (accessed 2026-11-14), USD per million tokens.
# Effort: reasoning_effort = low|medium|high on Chat Completions, passed through by the gateway. Levels copied from providers/google for this model.
schema = 2
base_model = "google/gemini-4-argon"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[cost.text.input]
price = 0.6
cache = { read = 0.06 }

[cost.text.output]
price = 3
