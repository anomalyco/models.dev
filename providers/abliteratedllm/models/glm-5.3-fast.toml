# Sources (accessed 2026-11-09):
# - https://api.abliteratedllm.dev/v1/models (fields: https://abliteratedllm.dev/docs/models) for this ID:
#   context_length 1048576, max_output_tokens 1048576 (larger output budgets are lowered to it),
#   input_modalities text, USD per 1M tokens input 1.89 / cached input 0.351 / output 5.94.
#   No priority tier (pricing.priority is null). No charge for cache writes.
# - https://abliteratedllm.dev/docs/chat-completions: reasoning_effort and unlisted fields are passed through unchanged;
#   reasoning arrives in reasoning_content; JPEG, PNG, GIF and WebP images work; audio and file/PDF parts, and image or video
#   parts for a model that doesn't list them, fail with 400 unsupported_content; response_format json_schema works except on
#   Official DeepSeek API models; prompt caching is automatic; every stream ends with a usage chunk.
# - Same base URL also serves https://abliteratedllm.dev/docs/responses and https://abliteratedllm.dev/docs/messages.
# Stock model: GLM-5.3's original weights on the fast serving path, not abliterated,
#   on shared GPUs at our infrastructure provider, Fireworks (accounts/fireworks/routers/glm-5p3-fast).
#   Ids ending -fast/-ultrafast serve the same model as the id without the suffix, faster and at higher prices
#   (https://abliteratedllm.dev/docs/models, Stock models).
# Input: text only, as in the lab file.
# Reasoning controls copied from the same upstream's entry: providers/fireworks-ai/models/accounts/fireworks/routers/glm-5p3-fast.toml
# Thinking-only (reasoning can't be turned off), no toggle
# Effort: reasoning_effort = low|high|max
schema = 2
base_model = "zhipuai/glm-5.3"
name = "GLM-5.3 Fast"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
stream_usage = true
cache = { implicit = true }

[limit]
context = 1_048_576
output = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 1.89
cache = { read = 0.351 }

[cost.text.output]
price = 5.94
