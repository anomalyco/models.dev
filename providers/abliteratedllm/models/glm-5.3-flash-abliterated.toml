# Sources (accessed 2026-11-09):
# - https://api.abliteratedllm.dev/v1/models (fields: https://abliteratedllm.dev/docs/models) for this ID:
#   context_length 1048576, max_output_tokens 131072 (larger output budgets are lowered to it),
#   input_modalities text|image, USD per 1M tokens input 0.0977 / cached input 0.0098 / output 0.3421.
#   No priority tier (pricing.priority is null). No charge for cache writes.
# - https://abliteratedllm.dev/docs/chat-completions: reasoning_effort and unlisted fields are passed through unchanged;
#   reasoning arrives in reasoning_content; JPEG, PNG, GIF and WebP images work; audio and file/PDF parts, and image or video
#   parts for a model that doesn't list them, fail with 400 unsupported_content; response_format json_schema works except on
#   Official DeepSeek API models; prompt caching is automatic; every stream ends with a usage chunk.
# - Same base URL also serves https://abliteratedllm.dev/docs/responses and https://abliteratedllm.dev/docs/messages.
# Abliterated weights: https://huggingface.co/orcarouter/GLM-5.3-Flash-Uncensored-FP8, an open-weight fine-tune of
#   zai-org/GLM-5.3-Flash with the refusal direction removed from the weights. Served in native FP8 (block FP8, e4m3),
#   never further quantized (https://abliteratedllm.dev/docs/models, Precision), on dedicated GPUs operated by our
#   infrastructure provider, Fireworks.
# Input: text and images, the lab's JPEG/PNG types (as on the stock GLM-5.3 Flash entry of the same infrastructure provider).
#   The lab's video and PDF types are left out: the catalog lists no video for this ID, and file parts fail on every model.
# Reasoning: the GLM-5.3 Flash controls of the same infrastructure provider: providers/fireworks-ai/models/accounts/fireworks/models/glm-5p3-flash.toml
# Thinking-only (reasoning can't be turned off), no toggle
# Effort: reasoning_effort = low|high|max
schema = 2
base_model = "zhipuai/glm-5.3-flash"
name = "GLM-5.3 Flash Abliterated"
description = "Abliterated GLM-5.3-Flash (open weights: orcarouter/GLM-5.3-Flash-Uncensored-FP8) with the refusal direction removed from the weights, served in native FP8 by AbliteratedLLM"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
stream_usage = true
cache = { implicit = true }

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.0977
cache = { read = 0.0098 }

[cost.text.output]
price = 0.3421
