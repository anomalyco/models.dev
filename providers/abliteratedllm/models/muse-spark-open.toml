# Sources (accessed 2026-11-09):
# - https://api.abliteratedllm.dev/v1/models (fields: https://abliteratedllm.dev/docs/models) for this ID:
#   context_length 1048576, max_output_tokens 1048576 (larger output budgets are lowered to it),
#   input_modalities text|image, USD per 1M tokens input 1.125 / cached input 0.135 / output 3.825.
#   "service_tier": "priority" bills 1.6875 / 0.2025 / 5.7375 (1.5x) on Chat Completions and Messages;
#   Responses ignores service_tier and bills the standard tier. No charge for cache writes.
# - https://abliteratedllm.dev/docs/chat-completions: reasoning_effort and unlisted fields are passed through unchanged;
#   reasoning arrives in reasoning_content; JPEG, PNG, GIF and WebP images work; audio and file/PDF parts, and image or video
#   parts for a model that doesn't list them, fail with 400 unsupported_content; response_format json_schema works except on
#   Official DeepSeek API models; prompt caching is automatic; every stream ends with a usage chunk.
# - Same base URL also serves https://abliteratedllm.dev/docs/responses and https://abliteratedllm.dev/docs/messages.
# Stock model: Meta's original weights, not abliterated,
#   on shared GPUs at our infrastructure provider, Fireworks (accounts/fireworks/models/muse-spark-open).
# Input: text and images. The lab lists generic image input, so the image types are the same upstream's. The lab's video and
#   audio are left out: the catalog lists no video for this ID, and audio parts fail on every model.
# Image types and reasoning controls follow the same upstream's entry: providers/fireworks-ai/models/accounts/fireworks/models/muse-spark-open.toml
# Reasoning can't be turned off, no toggle
# Effort: reasoning_effort = low|medium|high|xhigh
schema = 2
base_model = "meta/muse-spark-open"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/gif", "image/bmp", "image/tiff", "image/x-portable-pixmap", "image/webp", "image/avif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
stream_usage = true
cache = { implicit = true }

[limit]
output = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 1.125
cache = { read = 0.135 }

[cost.text.output]
price = 3.825

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.5

[experimental.modes.priority]
body = { service_tier = "priority" }
