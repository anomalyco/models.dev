# Sources (accessed 2026-11-09):
# - https://api.abliteratedllm.dev/v1/models (fields: https://abliteratedllm.dev/docs/models) for this ID:
#   context_length 512000, max_output_tokens 512000 (larger output budgets are lowered to it),
#   input_modalities text|image, USD per 1M tokens input 0.27 / cached input 0.054 / output 1.08.
#   "service_tier": "priority" bills 0.405 / 0.081 / 1.62 (1.5x) on Chat Completions and Messages;
#   Responses ignores service_tier and bills the standard tier. No charge for cache writes.
# - https://abliteratedllm.dev/docs/chat-completions: reasoning_effort and unlisted fields are passed through unchanged;
#   reasoning arrives in reasoning_content; JPEG, PNG, GIF and WebP images work; audio and file/PDF parts, and image or video
#   parts for a model that doesn't list them, fail with 400 unsupported_content; response_format json_schema works except on
#   Official DeepSeek API models; prompt caching is automatic; every stream ends with a usage chunk.
# - Same base URL also serves https://abliteratedllm.dev/docs/responses and https://abliteratedllm.dev/docs/messages.
# Stock model: MiniMax's original weights, not abliterated,
#   on shared GPUs at our infrastructure provider, Fireworks (accounts/fireworks/models/minimax-m3).
# Input: text and images (no video) for this ID; the lab lists the same four image types. Fireworks' model list says text
#   only, but image parts get correct answers here (AbliteratedLLM check, 2026-11-04).
# Reasoning controls copied from the same upstream's entry: providers/fireworks-ai/models/accounts/fireworks/models/minimax-m3.toml
# Effort: reasoning_effort = low|medium|high (no toggle)
schema = 2
base_model = "minimax/MiniMax-M3"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
stream_usage = true
cache = { implicit = true }

[limit]
context = 512_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.27
cache = { read = 0.054 }

[cost.text.output]
price = 1.08

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.5

[experimental.modes.priority]
body = { service_tier = "priority" }
