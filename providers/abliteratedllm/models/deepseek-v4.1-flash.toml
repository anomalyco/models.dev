# Sources (accessed 2026-11-09):
# - https://api.abliteratedllm.dev/v1/models (fields: https://abliteratedllm.dev/docs/models) for this ID:
#   context_length 1048576, max_output_tokens 393216 (larger output budgets are lowered to it),
#   input_modalities text, USD per 1M tokens input 0.30 / cached input 0.006 / output 1.20.
#   No priority tier (pricing.priority is null). No charge for cache writes.
# - https://abliteratedllm.dev/docs/chat-completions: reasoning_effort and unlisted fields are passed through unchanged;
#   reasoning arrives in reasoning_content; JPEG, PNG, GIF and WebP images work; audio and file/PDF parts, and image or video
#   parts for a model that doesn't list them, fail with 400 unsupported_content; response_format json_schema works except on
#   Official DeepSeek API models; prompt caching is automatic; every stream ends with a usage chunk.
# - Same base URL also serves https://abliteratedllm.dev/docs/responses and https://abliteratedllm.dev/docs/messages.
# Official DeepSeek API model: answered by DeepSeek's official API through our gateway
#   (https://abliteratedllm.dev/docs/models, Official DeepSeek API models). The upstream is DeepSeek's deepseek-flash alias,
#   which serves DeepSeek-V4.1-Flash-1017 (same base as providers/deepseek/models/deepseek-flash.toml); DeepSeek can move it
#   without notice. Name follows our catalog; the dated 1017 name is the stock deepseek-v4.1-flash-1017 entry.
# Input: text only for this ID, so the lab's image types are left out.
# Reasoning: thinking is on by default; reasoning_effort = "none" (Chat Completions) or thinking.type = disabled (Messages)
#   turns it off (https://abliteratedllm.dev/docs/models, Official DeepSeek API models). reasoning_effort reaches DeepSeek
#   unchanged, so the levels are DeepSeek's own, as in providers/deepseek/models/deepseek-flash.toml (minimal->low, medium/xhigh->high).
# Toggle: thinking.type = enabled|disabled (documented on Messages, passed through on Chat Completions); reasoning_effort = "none" also disables
# Effort: reasoning_effort = low|high|max
# Structured output: response_format json_schema (Chat Completions) and output_format (Messages) fail with 400 on Official
#   DeepSeek API models, so structured_output is not set.
# top_k = false: DeepSeek's API takes no top_k (providers/deepseek/models/deepseek-flash.toml).
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"
name = "DeepSeek V4.1 Flash"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
top_k = false
stream_usage = true
cache = { implicit = true }

[limit]
context = 1_048_576
output = 393_216

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.3
cache = { read = 0.006 }

[cost.text.output]
price = 1.2
