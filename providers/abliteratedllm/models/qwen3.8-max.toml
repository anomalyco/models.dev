# Sources (accessed 2026-11-09):
# - https://api.abliteratedllm.dev/v1/models (fields: https://abliteratedllm.dev/docs/models) for this ID:
#   context_length 262144, max_output_tokens 262144 (larger output budgets are lowered to it),
#   input_modalities text|image, USD per 1M tokens input 1.80 / cached input 0.225 / output 5.40.
#   "service_tier": "priority" bills 2.70 / 0.3375 / 8.10 (1.5x) on Chat Completions and Messages;
#   Responses ignores service_tier and bills the standard tier. No charge for cache writes.
# - https://abliteratedllm.dev/docs/chat-completions: reasoning_effort and unlisted fields are passed through unchanged;
#   reasoning arrives in reasoning_content; JPEG, PNG, GIF and WebP images work; audio and file/PDF parts, and image or video
#   parts for a model that doesn't list them, fail with 400 unsupported_content; response_format json_schema works except on
#   Official DeepSeek API models; prompt caching is automatic; every stream ends with a usage chunk.
# - Same base URL also serves https://abliteratedllm.dev/docs/responses and https://abliteratedllm.dev/docs/messages.
# Stock model: Alibaba's original model, not abliterated,
#   on shared GPUs at our infrastructure provider, Fireworks (accounts/fireworks/models/qwen3p8-max).
# Input: text and images. Image types are the same upstream's: the lab's BMP, JPEG, PNG, TIFF and WebP (HEIC failed in its live
#   test). The lab's video and PDF types are left out: the catalog lists no video for this ID, and file parts fail on every model.
# Image types and reasoning controls follow the same upstream's entry: providers/fireworks-ai/models/accounts/fireworks/models/qwen3p8-max.toml
# Off is effort=none; graded levels, no toggle
# Effort: reasoning_effort = none|low|medium|xhigh
schema = 2
base_model = "alibaba/qwen3.8-max"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "xhigh"] }
structured_output = true
stream_usage = true
cache = { implicit = true }

[limit]
context = 262_144
output = 262_144

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 1.8
cache = { read = 0.225 }

[cost.text.output]
price = 5.4

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.5

[experimental.modes.priority]
body = { service_tier = "priority" }
