# TopxAI serves hosted lab models and private deployments through one
# OpenAI- and Anthropic-compatible endpoint, with fixed USD prices on prepaid credit.
# Prices below are the Auto-route price, the route each model is sold on: one route per
# lab for Claude, GPT and Grok at 80% of the lab's list price, long-context tiers included;
# private deployments at fixed prices for the GLM, Kimi and DeepSeek models, with no
# long-context tier and no cache-write price.
# The public comparison prices are the original providers' list prices, not these tariffs.
# Live table and JSON: https://api.topxai.xyz/pricing and
# https://api.topxai.xyz/api/pricing (accessed 2026-11-18).
# Raw Chat (/v1/chat/completions): reasoning_effort selects the model's effort.
# Responses (/v1/responses): reasoning.effort selects effort on supported models.
# Raw Messages (/v1/messages, Claude): thinking and output_config.effort pass through.
# Other Messages models use the conversion documented at
# https://api.topxai.xyz/docs/api-reference (accessed 2026-11-10).
name = "TopxAI"
env = ["TOPXAI_API_KEY"]
npm = "@ai-sdk/openai-compatible"
opencodeai = "@opencode/ai/providers/openai-compatible"
api = "https://api.topxai.xyz/v1"
doc = "https://api.topxai.xyz/docs"
