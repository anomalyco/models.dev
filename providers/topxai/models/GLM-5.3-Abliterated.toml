# Automatic prompt caching; no explicit cache-control API or TTL is claimed.
# https://api.topxai.xyz/docs/glm-5-3-abliterated (checked 2026-11-09).
# A commercially fine-tuned GLM-5.3 with its refusal alignment removed, served from
# TopxAI's private deployment. This fine-tune accepts text only. https://api.topxai.xyz/docs/glm-5-3-abliterated (accessed 2026-09-19)
# Effort: reasoning_effort = low|high|max on /v1/chat/completions (default low, as
# https://api.topxai.xyz/api/pricing lists it since 2026-11-08); it always reasons. The trace returns in
# message.reasoning (not reasoning_content), checked live 2026-10-23; v1 has no value
# for that field, so no reasoning_field is set.
# Chat Completions is the native API. TopxAI converts /v1/messages to Chat.
# Only the Flash model serves /v1/responses, per the Route and endpoints table:
# https://api.topxai.xyz/docs/glm-5-3-abliterated (checked 2026-11-18).
# Fixed prices, no long-context tier and no cache-write price:
# https://api.topxai.xyz/pricing/glm-5.3-abliterated (accessed 2026-11-10)
# Chat supports auto, none, required and named functions (tool_choice):
# https://api.topxai.xyz/docs/glm-5-3-abliterated (checked 2026-11-18).
schema = 2
base_model = "zhipuai/glm-5.3"
name = "GLM-5.3-Abliterated"
description = "Fine-tuned GLM-5.3 with refusal alignment removed, on TopxAI's private deployment; text only"
open_weights = false
release_date = "2026-09-18"

[capabilities]
cache = { implicit = true }
reasoning = { supported = true, default = { type = "effort", value = "low" }, effort = ["low", "high", "max"] }
structured_output = true
top_k = false

[api.chat-completions]
capabilities = { tools = { choice = ["auto", "none", "required", "tool"] } }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 3
cache = { read = 0.45 }

[cost.text.output]
price = 6
