# Automatic prompt caching; no explicit cache-control API or TTL is claimed.
# https://ai.topxea.com/docs/glm-5-3-abliterated (checked 2026-11-09).
# A commercially fine-tuned GLM-5.3 with its refusal alignment removed, served from
# TopxAI's own private deployment rather than Z.ai's API; text only. Unique to this
# host, so defined inline. https://ai.topxea.com/docs/glm-5-3-abliterated (accessed 2026-09-19)
# Effort: reasoning_effort = low|high|max on /v1/chat/completions (default low, as
# https://ai.topxea.com/api/pricing lists it since 2026-11-08); it always reasons. The trace returns in
# message.reasoning (not reasoning_content), checked live 2026-10-23; v1 has no value
# for that field, so no reasoning_field is set.
# Fixed prices, no long-context tier and no cache-write price:
# https://ai.topxea.com/pricing/GLM-5.3-Abliterated (accessed 2026-11-08)
schema = 2
name = "GLM-5.3-Abliterated"
description = "Fine-tuned GLM-5.3 with refusal alignment removed, on TopxAI's private deployment; text only"
family = "glm"
open_weights = false
release_date = "2026-09-18"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
cache = { implicit = true }
tools = { supported = true }
reasoning = { supported = true, default = { type = "effort", value = "low" }, effort = ["low", "high", "max"] }
structured_output = true
temperature = true
top_p = true
top_k = false

[limit]
context = 1_000_000
output = 131_072

[cost.text.input]
price = 2
cache = { read = 0.3 }

[cost.text.output]
price = 4
