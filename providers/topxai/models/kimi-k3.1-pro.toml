# Kimi K3.1 Pro replaced kimi-k3 on this host; the old ID has no forwarding alias.
# TopxAI exposes text and image input, a 1,048,576-token context and 131,072 output
# tokens. Its supported input set is narrower than the lab's, which also lists video.
# Effort: reasoning_effort = low|high|max on Chat Completions (default max).
# Reasoning is always on; no separate toggle. Host contract and current prices:
# https://ai.topxea.com/pricing/kimi-k3.1-pro and https://ai.topxea.com/api/pricing
# (accessed 2026-10-25). Retained retail prices are 120% of Moonshot's list;
# the default cache-write rate equals input. No 1h cache TTL is claimed here.
# Chat reasoning_content and structured output follow the native Chat contract:
# https://platform.kimi.ai/docs/api/chat and https://ai.topxea.com/docs/api-reference.
# These successor capabilities were not re-tested with paid calls for this update.
schema = 2
base_model = "moonshotai/kimi-k3.1-pro"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "max" }, effort = ["low", "high", "max"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 2.4
cache = { read = 0.24, write = 2.4 }

[cost.text.output]
price = 12
