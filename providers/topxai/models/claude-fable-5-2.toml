# APIs: Chat Completions (listed first, so v1 is unchanged) and native Messages,
# https://api.topxai.xyz/docs/api-reference (checked 2026-11-13).
# Explicit caching holds on both: Messages forwards cache_control as sent, and the
# Chat Completions conversion to Claude Messages keeps cache_control, ttl included,
# on system, message and tool blocks. The host prices 5m and 1h cache writes.
# Effort only, as the lab and peers author this model: $.output_config.effort on
# /v1/messages, $.reasoning_effort on /v1/chat/completions, both forwarded unchanged;
# default high, as https://api.topxai.xyz/api/pricing lists it.
# Claude Fable 5.2 replaced Fable 5.1 on 2026-11-10 with no forwarding alias; the old ID
# returns 403. https://api.topxai.xyz/blog/claude-fable-5-2 (accessed 2026-11-10)
# Shared-pool price, 50% of Anthropic's list on every lane; cache writes for the 5m and
# 1h TTLs from the same table.
# https://api.topxai.xyz/pricing/claude-fable-5-2 (accessed 2026-11-10)
schema = 2
base_model = "anthropic/claude-fable-5-2"

[capabilities]
cache = { explicit = { ttl = ["5m", "1h"] } }
reasoning = { supported = true, default = { type = "effort", value = "high" }, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[api.chat-completions]

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 4
cache = { read = 0.1, write = { "5m" = 5, "1h" = 8 } }

[cost.text.output]
price = 20
