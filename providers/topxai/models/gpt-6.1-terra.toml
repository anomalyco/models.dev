# Lab metadata retained from upstream dev a19e6e92f98138b9421f5e9b2e70b461957f73b3
# (original blob 62354651294b910c3fd962a329d267b76d680378).
# Model limits, knowledge cutoff and modalities:
# https://developers.openai.com/api/docs/models/gpt-6.1-terra
# Release date: https://developers.openai.com/api/docs/changelog (2026-10-26).
# Sources checked 2026-11-09; TopxAI-specific limits and formats stay in its provider file.
# Default prompt caching is implicit. Explicit breakpoints are not claimed:
# forwarding a cache option or listing a write price does not establish support.
# https://ai.topxea.com/changelog#gpt-6-sol (checked 2026-11-09).
# TopxAI's Auto route uses the shared-pool price below. The whole request uses
# the long-context override above 272,000 input tokens, including cached tokens.
# https://ai.topxea.com/pricing/gpt-6.1-terra and
# https://ai.topxea.com/api/pricing (accessed 2026-11-09).
# Effort: $.reasoning.effort on /v1/responses, $.reasoning_effort on
# /v1/chat/completions; none turns reasoning off, medium is the default.
# The host lists text/image input and routes Chat Completions through Responses.
# https://ai.topxea.com/docs/api-reference (accessed 2026-11-09).
schema = 2
base_model = "openai/gpt-6.1-terra"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
cache = { implicit = true }
reasoning = { supported = true, default = { type = "effort", value = "medium" }, effort = ["none", "low", "medium", "high", "xhigh", "max"] }

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.5
cache = { read = 0.025, write = 0.625 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 1
cache = { read = 0.05, write = 1.25 }

[cost.text.output]
price = 2.5

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 3.75
