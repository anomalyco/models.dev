# Z.ai's GLM-5.3-Flash with its refusal alignment removed (abliterated), served from
# TopxAI's private deployment. Text and image input (base64 data URLs only; HTTP image URLs are
# not fetched). Launched 2026-11-08.
# https://api.topxai.xyz/docs/glm-5-3-abliterated (accessed 2026-11-08)
# Effort: reasoning_effort = low|high|max on /v1/chat/completions, reasoning.effort on
# /v1/responses (default low); it always reasons.
# Honours stop, json_object and json_schema response formats, tool_choice and
# parallel_tool_calls: false, per the guide above. Responses is stateless; send the full
# conversation. Messages converts to Chat. Fixed prices, no long-context tier and no
# cache-write price; cached prompt tokens bill at the cache-read price.
# https://api.topxai.xyz/pricing/glm-5.3-flash-abliterated and
# https://api.topxai.xyz/api/pricing (accessed 2026-11-10)
# The host sampling guide confirms temperature and top_p. It lists no top_k
# control for this deployment, so the catalog does not advertise one.
# Chat supports auto, none, required and named functions (tool_choice):
# https://api.topxai.xyz/docs/glm-5-3-abliterated (checked 2026-11-18).
schema = 2
base_model = "zhipuai/glm-5.3-flash"
name = "GLM-5.3-Flash-Abliterated"
description = "GLM-5.3-Flash with refusal alignment removed, on TopxAI's private deployment; text and image input"
open_weights = false
release_date = "2026-11-08"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "low" }, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }
top_k = false

[limit]
context = 1_048_576

[api.chat-completions]
capabilities = { tools = { choice = ["auto", "none", "required", "tool"] } }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.36
cache = { read = 0.075 }

[cost.text.output]
price = 1.5
