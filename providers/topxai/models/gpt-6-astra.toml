# Effort: $.reasoning.effort on /v1/responses, $.reasoning_effort on /v1/chat/completions,
# forwarded unchanged; the lab's and peers' level set for this model.
# Shared-pool price, 50% of OpenAI's list. Requests whose input, cache tokens included,
# reaches 272,001 tokens bill the whole request at the override below.
# https://ai.topxea.com/pricing/gpt-6-astra and https://ai.topxea.com/api/pricing (accessed 2026-10-23)
# Structured output: response_format json_schema (strict) and json_object return valid JSON on
# /v1/chat/completions, checked live 2026-10-16.
schema = 2
base_model = "openai/gpt-6-astra"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 5
cache = { read = 0.5, write = 6.25 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 10
cache = { read = 1, write = 12.5 }

[cost.text.output]
price = 25

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 37.5
