# Default prompt caching is implicit. Explicit breakpoints are not claimed:
# forwarding a cache option or listing a write price does not establish support.
# https://api.topxai.xyz/changelog#gpt-6-sol (checked 2026-11-09).
# Effort: $.reasoning.effort on /v1/responses, $.reasoning_effort on /v1/chat/completions,
# forwarded unchanged; the lab's level set for this model. Reasoning cannot be turned
# off: the host maps a legacy "none" or "minimal" to "low".
# Shared-pool price, 50% of OpenAI's list. Requests whose input, cache tokens included,
# reaches 272,001 tokens bill the whole request at the override below.
# https://api.topxai.xyz/pricing/gpt-6.1-sol and https://api.topxai.xyz/api/pricing (accessed 2026-10-23)
# APIs: Chat Completions and Responses, https://api.topxai.xyz/docs/api-reference
# (checked 2026-11-13; a live /v1/responses request returned 200 the same day).
# Structured output: response_format json_schema (strict) and json_object return valid JSON on
# /v1/chat/completions (checked live 2026-10-16), and a strict text.format json_schema
# returns valid JSON on /v1/responses (checked live 2026-10-16).
schema = 2
base_model = "openai/gpt-6.1-sol"

[capabilities]
cache = { implicit = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 1
cache = { read = 0.05, write = 1.25 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 2
cache = { read = 0.1, write = 2.5 }

[cost.text.output]
price = 5

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 7.5
