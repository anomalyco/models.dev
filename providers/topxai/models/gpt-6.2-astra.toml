# Model and OpenAI route rates, 80% of OpenAI's list on every lane and in the long-context
# tier: https://api.topxai.xyz/pricing/gpt-6.2-astra (accessed 2026-11-18)
# Text and image inputs: https://api.topxai.xyz/blog/gpt-6-2-astra-and-sol
# Reasoning controls and medium default: https://api.topxai.xyz/api/pricing (2026-11-18).
# Whole-request tier applies above 272,000 input tokens, including cached tokens.
# TopxAI OpenAI route (openai-shared), 2026-11-18: on /v1/chat/completions and /v1/responses,
# a forced custom tool returned 42 as text and ZZ042 with either Lark or regex
# (ZZ[0-9]{3}) when asked for 42. Both APIs also enforced a strict JSON schema
# with a singleton enum despite the conflicting prompt.
# TopxAI also converts Anthropic Messages for this model:
# https://api.topxai.xyz/docs/api-reference (checked 2026-11-18).
schema = 2
base_model = "openai/gpt-6.2-astra"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
cache = { implicit = true }
reasoning = { supported = true, default = { type = "effort", value = "medium" }, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[api.chat-completions]
capabilities = { tools = { freeform = ["text", "lark", "regex"] } }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }
capabilities = { tools = { freeform = ["text", "lark", "regex"] } }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 6.4
cache = { read = 0.32, write = 8 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 12.8
cache = { read = 0.64, write = 16 }

[cost.text.output]
price = 32

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 48
