# APIs: Chat Completions (listed first, so v1 is unchanged) and native Messages,
# https://api.topxai.xyz/docs/api-reference (checked 2026-11-13).
# Explicit caching holds on both: Messages forwards cache_control as sent, and the
# Chat Completions conversion to Claude Messages keeps cache_control, ttl included,
# on system, message and tool blocks. The host prices 5m and 1h cache writes.
# Sonnet 5.5 replaced Sonnet 5 on TopxAI on 2026-10-02; claude-sonnet-5 is retired (403).
# Thinking follows Anthropic's Sonnet 5.5 contract: adaptive by default, effort via
# $.output_config.effort on /v1/messages (relayed byte for byte) or $.reasoning_effort on
# /v1/chat/completions; disabled thinking is normalised to between_tools at low effort.
# https://api.topxai.xyz/blog/claude-sonnet-5-5 and https://api.topxai.xyz/docs/api-reference (accessed 2026-10-23)
# Shared-pool price, 50% of Anthropic's list on every lane; cache read is $0.05, half of
# Anthropic's $0.10 (5% of input) since 2026-10-23. Cache writes for the 5m and 1h TTLs
# from the same table.
# https://api.topxai.xyz/pricing/claude-sonnet-5-5 and https://api.topxai.xyz/api/pricing (accessed 2026-10-23)
schema = 2
base_model = "anthropic/claude-sonnet-5-5"

[capabilities]
cache = { explicit = { ttl = ["5m", "1h"] } }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[api.chat-completions]

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 1
cache = { read = 0.05, write = { "5m" = 1.25, "1h" = 2 } }

[cost.text.output]
price = 5
