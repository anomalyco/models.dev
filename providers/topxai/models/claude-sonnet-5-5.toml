# APIs: Chat Completions (listed first, so v1 is unchanged) and native Messages,
# https://api.topxai.xyz/docs/api-reference (checked 2026-11-13).
# On Chat Completions, response_format=json_schema is converted to Anthropic's
# supported schema subset. Native Messages accepts structured output through
# output_config.format (ChatAnthropic method="json_schema"). Numeric bounds and
# list lengths can become hints; see the host's Structured output and ChatAnthropic
# sections: https://api.topxai.xyz/docs/use-topxai-with-langchain (2026-11-18).
# Explicit caching holds on both: Messages forwards cache_control as sent, and the
# Chat Completions conversion to Claude Messages keeps cache_control, ttl included,
# on system, message and tool blocks. The host prices 5m and 1h cache writes.
# Sonnet 5.5 replaced Sonnet 5 on TopxAI on 2026-10-02; claude-sonnet-5 is retired (403).
# Thinking follows Anthropic's Sonnet 5.5 contract: adaptive by default, effort via
# $.output_config.effort on /v1/messages (relayed byte for byte) or $.reasoning_effort on
# /v1/chat/completions; disabled thinking is normalised to between_tools at low effort.
# https://api.topxai.xyz/blog/claude-sonnet-5-5 and https://api.topxai.xyz/docs/api-reference (accessed 2026-10-23)
# Default effort (2026-11-18): https://api.topxai.xyz/api/pricing
# Claude route price, 80% of Anthropic's list on every lane; cache writes for the 5m and
# 1h TTLs from the same table.
# https://api.topxai.xyz/pricing/claude-sonnet-5-5 and https://api.topxai.xyz/api/pricing (accessed 2026-11-18)
schema = 2
base_model = "anthropic/claude-sonnet-5-5"

[capabilities]
cache = { explicit = { ttl = ["5m", "1h"] } }
reasoning = { supported = true, default = { type = "effort", value = "high" }, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[api.chat-completions]

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 1.6
cache = { read = 0.08, write = { "5m" = 2, "1h" = 3.2 } }

[cost.text.output]
price = 8
