# Modalities: Eden AI's catalog (https://api.edenai.run/v3/models) lists a different
# input/output set than the lab; listed media kinds use the lab's MIME types.
schema = 2
base_model = "openai/gpt-5.4-pro"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["medium", "high", "xhigh"] }
structured_output = true

[cost.text.input]
price = 30

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 60

[cost.text.output]
price = 180

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 270
