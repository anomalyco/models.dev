# Cache: OpenAI caches eligible prefixes automatically; Eden AI forwards prompt_cache_key,
# prompt_cache_retention, and (GPT-5.6+) prompt_cache_breakpoint / prompt_cache_options
# (https://www.edenai.co/docs/v3/llms/prompt-caching). Limits follow OpenAI's own API.
schema = 2
base_model = "openai/o3-mini"

[modalities]
input = ["text", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
cache = { implicit = { min_tokens = 1_024 } }
structured_output = true
effort_updates = false
prompt_cache_key = true

[cost.text.input]
price = 1.1
cache = { read = 0.55 }

[cost.text.output]
price = 4.4
