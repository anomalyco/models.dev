# Cache: OpenAI caches eligible prefixes automatically; Eden AI forwards prompt_cache_key,
# prompt_cache_retention, and (GPT-5.6+) prompt_cache_breakpoint / prompt_cache_options
# (https://www.edenai.co/docs/v3/llms/prompt-caching). Limits follow OpenAI's own API.
schema = 2
base_model = "openai/gpt-5.5"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
cache = { implicit = { ttl = ["24h"], min_tokens = 1_024 } }
structured_output = true
prompt_cache_key = true

[cost.text.input]
price = 5
cache = { read = 0.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 10
cache = { read = 1 }

[cost.text.output]
price = 30

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 45
