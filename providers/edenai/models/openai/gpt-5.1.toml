# Modalities: Eden AI's catalog (https://api.edenai.run/v3/models) lists a different
# input/output set than the lab; listed media kinds use the lab's MIME types.
# Cache: OpenAI caches eligible prefixes automatically; Eden AI forwards prompt_cache_key,
# prompt_cache_retention, and (GPT-5.6+) prompt_cache_breakpoint / prompt_cache_options
# (https://www.edenai.co/docs/v3/llms/prompt-caching). Limits follow OpenAI's own API.
schema = 2
base_model = "openai/gpt-5.1"

[modalities]
input = ["image/jpeg", "image/png", "image/gif", "image/webp", "text", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
cache = { supported = true, implicit = { ttl = ["24h"], min_tokens = 1_024 }, explicit = false }
structured_output = true
effort_updates = false
prompt_cache_key = true

[cost.text.input]
price = 1.25
cache = { read = 0.125 }

[cost.text.output]
price = 10
