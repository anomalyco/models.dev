# Cache: OpenAI caches eligible prefixes automatically; Eden AI forwards prompt_cache_key,
# prompt_cache_retention, and (GPT-5.6+) prompt_cache_breakpoint / prompt_cache_options
# (https://www.edenai.co/docs/v3/llms/prompt-caching). Limits follow OpenAI's own API.
schema = 2
base_model = "openai/gpt-5.6-luna"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
cache = { implicit = { min_tokens = 1_024 }, explicit = { ttl = ["30m"], max_breakpoints = 4, min_tokens = 1_024 } }
structured_output = true
prompt_cache_key = true

[cost.text.input]
price = 0.2
cache = { read = 0.02, write = 0.25 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 0.4
cache = { read = 0.04, write = 0.5 }

[cost.text.output]
price = 1.2

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 1.8
