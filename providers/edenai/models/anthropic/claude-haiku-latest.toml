# Cache: on Chat Completions Eden AI marks the system prompt and trailing turn with
# 5-minute ephemeral boundaries; your own cache_control markers replace them
# (https://www.edenai.co/docs/v3/llms/prompt-caching).
schema = 2
base_model = "anthropic/claude-haiku-5-5"
name = "Claude Haiku Latest (Claude Haiku 5.5)"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
cache = { implicit = { ttl = ["5m"] }, explicit = true }
structured_output = true

[cost.text.input]
price = 0.1
cache = { read = 0.01, write = 0.125 }

[[cost.text.input.overrides]]
when = { context = { gt = 100_000 } }
price = 0.5
cache = { read = 0.05, write = 0.625 }

[cost.text.output]
price = 0.5

[[cost.text.output.overrides]]
when = { context = { gt = 100_000 } }
price = 2.5
