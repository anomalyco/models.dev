schema = 2
base_model = "openai/gpt-5.1-codex-mini"
base_model_omit = ["limit.input"]
name = "GPT-5.1 Codex mini (Azure)"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
