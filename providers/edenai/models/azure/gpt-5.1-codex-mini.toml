# Modalities: Eden AI's catalog (https://api.edenai.run/v3/models) lists a different
# input/output set than the lab; listed media kinds use the lab's MIME types.
schema = 2
base_model = "openai/gpt-5.1-codex-mini"
base_model_omit = ["limit.input"]
name = "GPT-5.1 Codex mini (Azure)"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
context = 272_000

[cost.text.input]
price = 0.25
cache = { read = 0.025 }

[cost.text.output]
price = 2
