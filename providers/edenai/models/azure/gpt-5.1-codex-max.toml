# Modalities: Eden AI's catalog (https://api.edenai.run/v3/models) lists a different
# input/output set than the lab; listed media kinds use the lab's MIME types.
schema = 2
base_model = "openai/gpt-5.1-codex-max"
base_model_omit = ["limit.input"]
name = "GPT-5.1 Codex Max (Azure)"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
effort_updates = false

[limit]
context = 272_000

[cost.text.input]
price = 1.25
cache = { read = 0.125 }

[cost.text.output]
price = 10
