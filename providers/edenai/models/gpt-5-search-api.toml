# Modalities: Eden AI's catalog (https://api.edenai.run/v3/models) lists a different
# input/output set than the lab; listed media kinds use the lab's MIME types.
# Image formats: OpenAI image inputs: PNG, JPEG, WEBP, non-animated GIF (https://platform.openai.com/docs/guides/images-vision).
# Capabilities the catalog doesn't state (capabilities.cache, capabilities.prompt_cache_key) come from openai/gpt-5, this host's previous model in the family.
schema = 2
base_model = "openai/gpt-5-search-api"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
structured_output = true
cache = { implicit = { ttl = ["24h"], min_tokens = 1_024 } }
prompt_cache_key = true

[limit]
context = 272_000

[cost.text.input]
price = 1.25
cache = { read = 0.125 }

[cost.text.output]
price = 10
