# Capabilities the catalog doesn't state (capabilities.cache) come from anthropic/claude-fable-5-1, this host's previous model in the family.
schema = 2
base_model = "anthropic/claude-fable-5-2"
name = "Claude Fable Latest (Claude Fable 5.2)"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = { ttl = ["5m"] }, explicit = true }

[cost.text.input]
price = 8
cache = { read = 0.2, write = 10 }

[cost.text.output]
price = 40
