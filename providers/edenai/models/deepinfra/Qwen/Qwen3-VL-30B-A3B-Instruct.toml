# Modalities: Eden AI's catalog (https://api.edenai.run/v3/models) lists a different
# input/output set than the lab; listed media kinds use the lab's MIME types.
schema = 2
base_model = "alibaba/qwen3-vl-30b-a3b-instruct"
name = "Qwen3 VL 30B A3B Instruct (Deep Infra)"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
structured_output = true
effort_updates = false

[cost.text.input]
price = 0.15

[cost.text.output]
price = 0.6
