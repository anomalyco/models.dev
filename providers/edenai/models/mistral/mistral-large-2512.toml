# Modalities: Eden AI's catalog (https://api.edenai.run/v3/models) lists a different
# input/output set than the lab; listed media kinds use the lab's MIME types.
schema = 2
base_model = "mistral/mistral-large-2512"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
structured_output = true
effort_updates = false

[cost.text.input]
price = 0.5
cache = { read = 0.05 }

[cost.text.output]
price = 1.5
