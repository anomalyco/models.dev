# Modalities: Eden AI's catalog (https://api.edenai.run/v3/models, read 2026-11-24) lists mistral/mistral-medium-latest with
#   input_modalities ["text", "image"], no "file", so PDF input isn't offered on this ID here. The same model under
#   mistral/mistral-medium-3-5 and mistral/mistral-medium-3.5 lists ["text", "image", "file"] and keeps the lab's PDF input.
#   Image types are the lab's (https://docs.mistral.ai/studio/conversations/vision); the Eden AI sync keeps them.
schema = 2
base_model = "mistral/mistral-medium-latest"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = true

[cost.text.input]
price = 1.5
cache = { read = 0.15 }

[cost.text.output]
price = 7.5
