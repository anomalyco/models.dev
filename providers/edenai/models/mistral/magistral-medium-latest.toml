# Modalities: Eden AI's catalog (https://api.edenai.run/v3/models) lists a different
# input/output set than the lab; listed media kinds use the lab's MIME types.
# Image formats: Mistral vision: PNG, JPEG, WEBP, non-animated GIF (https://docs.mistral.ai/capabilities/vision/).
schema = 2
base_model = "mistral/magistral-medium-latest"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = true
effort_updates = false

[limit]
context = 262_144

[cost.text.input]
price = 1.5
cache = { read = 0.15 }

[cost.text.output]
price = 7.5
