# Modalities: Eden AI's catalog (https://api.edenai.run/v3/models) lists a different
# input/output set than the lab; listed media kinds use the lab's MIME types. Image and video, generic on the lab,
# use Meta's API formats (https://dev.meta.ai/docs/image-understanding, https://dev.meta.ai/docs/video-understanding#supported-formats).
schema = 2
base_model = "meta/muse-spark-open"
name = "Muse Spark Open (Fireworks AI)"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "video/mp4", "application/pdf", "audio/wav", "audio/mpeg"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
effort_updates = false

[cost.text.input]
price = 1.25
cache = { read = 0.15 }

[cost.text.output]
price = 4.25
