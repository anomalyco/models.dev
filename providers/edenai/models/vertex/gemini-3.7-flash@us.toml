# Cache: Gemini accepts cache_control on a Chat Completions content block
# (https://www.edenai.co/docs/v3/llms/prompt-caching).
schema = 2
base_model = "google/gemini-3.7-flash"
name = "Gemini 3.7 Flash (Vertex AI, US)"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
cache = { explicit = true }
structured_output = true

[cost.text.input]
price = 1.65
cache = { read = 0.165, write = 0.091667 }

[cost.text.output]
price = 8.25
reasoning = 8.25

[cost.audio.input]
price = 1.65
