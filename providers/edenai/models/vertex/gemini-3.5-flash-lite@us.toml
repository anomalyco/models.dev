# Cache: Gemini accepts cache_control on a Chat Completions content block
# (https://www.edenai.co/docs/v3/llms/prompt-caching).
schema = 2
base_model = "google/gemini-3.5-flash-lite"
name = "Gemini 3.5 Flash Lite (Vertex AI, US)"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
cache = { explicit = true }
structured_output = true

[cost.text.input]
price = 0.33
cache = { read = 0.033, write = 0.091667 }

[cost.text.output]
price = 2.75
reasoning = 2.75

[cost.audio.input]
price = 0.33
