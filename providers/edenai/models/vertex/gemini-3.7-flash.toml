# Cache: Gemini accepts cache_control on a Chat Completions content block
# (https://www.edenai.co/docs/v3/llms/prompt-caching).
schema = 2
base_model = "google/gemini-3.7-flash"
name = "Gemini 3.7 Flash (Vertex AI)"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
cache = { explicit = true }
structured_output = true

[cost.text.input]
price = 1.5
cache = { read = 0.15, write = 0.083333 }

[cost.text.output]
price = 7.5
reasoning = 7.5

[cost.audio.input]
price = 1.5
