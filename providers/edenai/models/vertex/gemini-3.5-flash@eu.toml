# Cache: Gemini accepts cache_control on a Chat Completions content block
# (https://www.edenai.co/docs/v3/llms/prompt-caching).
schema = 2
base_model = "google/gemini-3.5-flash"
name = "Gemini 3.5 Flash (Vertex AI, EU)"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
cache = { explicit = true }
structured_output = true
effort_updates = false

[cost.text.input]
price = 1.5
cache = { read = 0.15, write = 0.083333 }

[cost.text.output]
price = 9
reasoning = 9

[cost.audio.input]
price = 3
