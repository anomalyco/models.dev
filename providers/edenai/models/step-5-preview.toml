schema = 2
base_model = "stepfun/step-5-preview"
base_model_omit = ["limit.input"]

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "video/mp4", "video/quicktime", "video/x-matroska", "audio"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
context = 1_048_576

[cost.text.input]
price = 1
cache = { read = 0.05 }

[cost.text.output]
price = 2.7
