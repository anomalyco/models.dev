# Output limit: 8,192 tokens, the cap its upstream documents (providers/nebius/models/openai/gpt-oss-120b.toml); the lab's raised cap would exceed it.
schema = 2
base_model = "openai/gpt-oss-120b"
name = "GPT OSS 120B (Nebius)"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
output = 8_192

[cost.text.input]
price = 0.15
cache = { read = 0.15 }

[cost.text.output]
price = 0.6
