# Output limit: no host-specific cap is documented, so output is capped at the context served here (the lab's raised cap would exceed it).
schema = 2
base_model = "openai/gpt-oss-20b"
name = "GPT OSS 20B (Cloudflare)"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = false

[limit]
context = 128_000
output = 128_000

[cost.text.input]
price = 0.2

[cost.text.output]
price = 0.3
