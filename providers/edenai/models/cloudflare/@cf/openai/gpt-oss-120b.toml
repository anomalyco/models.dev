# Output limit: this route is Cloudflare Workers AI @cf/openai/gpt-oss-120b, which documents 16,384 max output (see providers/cloudflare-workers-ai/models/@cf/openai/gpt-oss-120b.toml).
schema = 2
base_model = "openai/gpt-oss-120b"
name = "GPT OSS 120B (Cloudflare)"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = false

[limit]
context = 128_000
output = 16_384

[cost.text.input]
price = 0.35

[cost.text.output]
price = 0.75
