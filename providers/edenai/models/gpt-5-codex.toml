schema = 2
base_model = "openai/gpt-5-codex"
base_model_omit = ["limit.input"]

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
context = 272_000

[cost.text.input]
price = 1.25
cache = { read = 0.125 }

[cost.text.output]
price = 10
