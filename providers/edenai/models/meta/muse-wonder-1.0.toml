# Modalities: image formats from the lab.
schema = 2
base_model = "meta/muse-wonder-1.0"
name = "Muse Wonder (Meta)"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 4
cache = { read = 0.2 }

[cost.text.output]
price = 20
