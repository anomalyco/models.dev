# Modalities: Eden AI's catalog (https://api.edenai.run/v3/models) lists a different
# input/output set than the lab; listed media kinds use the lab's MIME types.
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[modalities]
input = ["text", "image/jpeg", "image/png", "video/mp4", "video/x-matroska", "video/quicktime"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
effort_updates = false

[limit]
context = 1_048_576

[cost.text.input]
price = 0.15
cache = { read = 0.03 }

[cost.text.output]
price = 0.5
