# Modalities: Eden AI's catalog (https://api.edenai.run/v3/models) lists a different
# input/output set than the lab; listed media kinds use the lab's MIME types.
schema = 2
base_model = "zhipuai/glm-5v-turbo"

[modalities]
input = ["image/jpeg", "image/png", "text", "video/mp4", "video/quicktime", "video/x-matroska"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
structured_output = true

[limit]
context = 202_752

[cost.text.input]
price = 1.2
cache = { read = 0.24 }

[cost.text.output]
price = 4
