# Output limit: 25,000 tokens, the cap its upstream documents (providers/databricks/models/databricks-gpt-oss-120b.toml); the lab's raised cap would exceed it.
schema = 2
base_model = "openai/gpt-oss-120b"
name = "GPT OSS 120B (Databricks, EU)"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = false

[limit]
output = 25_000

[cost.text.input]
price = 0.15
cache = { read = 0.015, write = 0.15 }

[cost.text.output]
price = 0.6
