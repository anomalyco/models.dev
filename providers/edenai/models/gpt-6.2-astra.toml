# Capabilities the catalog doesn't state (capabilities.cache, capabilities.prompt_cache_key) come from gpt-6-astra, this host's previous model in the family.
schema = 2
base_model = "openai/gpt-6.2-astra"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = { min_tokens = 1_024 }, explicit = { ttl = ["30m"], max_breakpoints = 4, min_tokens = 1_024 } }
prompt_cache_key = true

[cost.text.input]
price = 8
cache = { read = 0.4, write = 10 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 16
cache = { read = 0.8, write = 20 }

[cost.text.output]
price = 40

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 60
