# Cache: Gemini accepts cache_control on a Chat Completions content block
# (https://www.edenai.co/docs/v3/llms/prompt-caching).
schema = 2
base_model = "google/gemini-3.8-flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
cache = { explicit = true }

[cost.text.input]
price = 0.75
cache = { read = 0.075, write = 0.041667 }

[cost.text.output]
price = 3.75
reasoning = 3.75

[cost.audio.input]
price = 0.75
