# Modalities: Eden AI's catalog (https://api.edenai.run/v3/models) lists a different
# input/output set than the lab; listed media kinds use the lab's MIME types.
# Cache: Gemini accepts cache_control on a Chat Completions content block
# (https://www.edenai.co/docs/v3/llms/prompt-caching).
schema = 2
base_model = "google/gemini-robotics-er-2-preview"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "application/pdf", "audio/wav", "audio/mp3", "audio/aiff", "audio/aac", "audio/ogg", "audio/flac", "audio/mpeg", "audio/m4a", "audio/l16", "audio/opus", "audio/alaw", "audio/mulaw", "audio/webm", "video/mp4", "video/mpeg", "video/mov", "video/avi", "video/x-flv", "video/mpg", "video/webm", "video/wmv", "video/3gpp"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
cache = { supported = true, explicit = true }
structured_output = true
effort_updates = false

[cost.text.input]
price = 1
cache = { read = 0.1 }

[cost.text.output]
price = 5
reasoning = 5

[cost.audio.input]
price = 1
