# Images: POST /v3/images/generations only (https://www.edenai.co/docs/v3/llms/image-generation)
schema = 2
base_model = "google/gemini-3-pro-image"

[capabilities]
reasoning = { supported = true, effort = ["low", "high"] }
structured_output = true

[api.images]
sdk = { opencodeai = "@opencode/ai/protocols/openai-images" }

[cost.text.input]
price = 2
cache = { read = 0.2, write = 0.375 }

[cost.text.output]
price = 12
reasoning = 12

[cost.audio.input]
price = 2
