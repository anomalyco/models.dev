# Cache: Gemini accepts cache_control on a Chat Completions content block
# (https://www.edenai.co/docs/v3/llms/prompt-caching).
schema = 2
base_model = "google/gemini-4-argon"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
cache = { supported = true, explicit = true }
structured_output = true
effort_updates = false

[cost.text.input]
price = 4
cache = { read = 0.2, write = 0.375 }

[cost.text.output]
price = 20
reasoning = 20

[cost.audio.input]
price = 4
