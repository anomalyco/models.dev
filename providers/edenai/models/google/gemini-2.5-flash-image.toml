# Modalities: Eden AI's catalog (https://api.edenai.run/v3/models) lists a different
# input/output set than the lab; listed media kinds use the lab's MIME types.
schema = 2
base_model = "google/gemini-2.5-flash-image"

[modalities]
input = ["audio", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "text", "video"]
output = ["text", "image/png", "image/jpeg"]

[capabilities]
reasoning = { supported = true }
structured_output = true

[cost.text.input]
price = 0.3
cache = { read = 0.03, write = 0.083333 }

[cost.text.output]
price = 2.5
reasoning = 2.5

[cost.audio.input]
price = 1
