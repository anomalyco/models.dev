# Cache: Gemini accepts cache_control on a Chat Completions content block
# (https://www.edenai.co/docs/v3/llms/prompt-caching).
schema = 2
base_model = "google/gemini-3.1-flash-lite-preview"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
cache = { supported = true, explicit = true }
structured_output = true
effort_updates = false

[cost.text.input]
price = 0.25
cache = { read = 0.025, write = 0.083333 }

[cost.text.output]
price = 1.5
reasoning = 1.5

[cost.audio.input]
price = 0.5
