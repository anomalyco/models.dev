# Cache: Gemini accepts cache_control on a Chat Completions content block
# (https://www.edenai.co/docs/v3/llms/prompt-caching).
schema = 2
base_model = "google/gemini-3.8-flash"
name = "Gemini Flash Latest (Gemini 3.8 Flash)"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
cache = { supported = true, explicit = true }
structured_output = true
effort_updates = false

[cost.text.input]
price = 1.5
cache = { read = 0.15, write = 0.083333 }

[cost.text.output]
price = 7.5
reasoning = 7.5

[cost.audio.input]
price = 1.5
