# Cache: Gemini accepts cache_control on a Chat Completions content block
# (https://www.edenai.co/docs/v3/llms/prompt-caching).
schema = 2
base_model = "google/gemini-3.1-pro-preview"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
cache = { explicit = true }
structured_output = true
effort_updates = false

[cost.text.input]
price = 2
cache = { read = 0.2, write = 0.375 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 4
cache = { read = 0.4 }

[cost.text.output]
price = 12
reasoning = 12

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 18

[cost.audio.input]
price = 2
