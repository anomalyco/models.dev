# Images: POST /v3/images/generations only (https://www.edenai.co/docs/v3/llms/image-generation)
schema = 2
base_model = "google/gemini-3.1-flash-lite-image"

[capabilities]
tools = { supported = false }
reasoning = { supported = true, effort = ["minimal", "high"] }
structured_output = true

[api.images]
sdk = { opencodeai = "@opencode/ai/providers/openai-compatible/images" }

[cost.text.input]
price = 0.25

[cost.text.output]
price = 1.5
