# Modalities: Eden AI's catalog (https://api.edenai.run/v3/models) lists a different
# input/output set than the lab; listed media kinds use the lab's MIME types.
# Images: POST /v3/images/generations only (https://www.edenai.co/docs/v3/llms/image-generation)
schema = 2
base_model = "google/gemini-3.1-flash-image-preview"

[modalities]
input = ["image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "text"]
output = ["text", "image/png", "image/jpeg"]

[capabilities]
reasoning = { supported = true, effort = ["minimal", "high"] }
structured_output = true

[api.images]
sdk = { opencodeai = "@opencode/ai/protocols/openai-images" }

[cost.text.input]
price = 0.5

[cost.text.output]
price = 3
