# Catalog: https://api.edenai.run/v3/models?view=models, one entry per model name
# Routing: a bare model name lets Eden AI pick the provider per request
# Reasoning: reasoning_effort = none|minimal|low|medium|high|xhigh|max
# Pricing: the cheapest provider's `pricing` (after model discounts), USD per token
name = "Eden AI"
env = ["EDENAI_API_KEY"]
npm = "@ai-sdk/openai-compatible"
api = "https://api.edenai.run/v3"
doc = "https://docs.edenai.co"
