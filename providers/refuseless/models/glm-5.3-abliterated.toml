# Prices/limits: https://refuseless.com/models/glm-5.3-abliterated (2026-11-04).
# Current promotional rates: https://refuseless.com/pricing
# Inputs: https://docs.refuseless.com/models; efforts/default: https://docs.refuseless.com/api/models
# Chat effort, none/off alias, caching and usage: https://docs.refuseless.com/api/chat-completions
# Responses effort: https://docs.refuseless.com/api/responses
# Wire: reasoning_effort (Chat) / reasoning.effort (Responses) = low|high|max; default low. Off/Medium are rejected.
# Effort validation: https://docs.refuseless.com/guides/reasoning explicitly rejects minimal, medium and xhigh with HTTP 400.
schema = 2
base_model = "zhipuai/glm-5.3"
name = "GLM 5.3 Abliterated"
description = "Abliterated variant of GLM 5.3 hosted by Refuseless."

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"], default = { type = "effort", value = "low" } }
cache = { implicit = true }
stream_usage = true

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content", max_tokens_field = "max_tokens" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 1.0
cache = { read = 0.15 }

[cost.text.output]
price = 2.0
