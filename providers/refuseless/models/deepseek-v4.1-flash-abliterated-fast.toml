# Prices/limits/inputs/efforts: https://docs.refuseless.com/api/models (GET /v1/models entry, 2026-11-27).
# Lineup and input surface: https://docs.refuseless.com/models ("Fast variant of DeepSeek V4.1 Flash Abliterated", accepts text and images).
# Efforts/default and off alias: https://docs.refuseless.com/guides/reasoning
# Chat effort, caching and usage: https://docs.refuseless.com/api/chat-completions
# Responses effort: https://docs.refuseless.com/api/responses
# Wire: reasoning_effort (Chat) / reasoning.effort (Responses) = none|low|high|max; default low. Medium and xhigh are rejected.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"
name = "DeepSeek V4.1 Flash 1017 Abliterated Fast"
description = "Fast serving variant of DeepSeek V4.1 Flash 1017 Abliterated hosted by Refuseless."

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"], default = { type = "effort", value = "low" } }
cache = { implicit = true }
stream_usage = true

[limit]
context = 1_048_576
output = 131_072

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content", max_tokens_field = "max_tokens" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.12
cache = { read = 0.025 }

[cost.text.output]
price = 0.45
