# Effort: reasoning_effort = low|medium|high|xhigh|max (minimal rejected). Measured reasoning tokens on a fixed task: low 299, medium/high/xhigh 516 each, max 3106, so the host exposes the OpenAI level set but only low, the mid band and max are distinct. none is accepted by this host (0 reasoning tokens) but is not in the lab/relay baseline, so it is not published.
# Cost: 302.AI price list https://dash-api.302.ai/products/price?page_size=2000 (2026-11-20): <=272K $2/$10, >272K $4/$15, cache read $0.1/$0.2, cache write $2.5/$5 (the 30m and 12h write TTLs OpenAI bills collapse to one price here).
schema = 2
base_model = "openai/gpt-6.2-sol"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 2
cache = { read = 0.1, write = 2.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 4
cache = { read = 0.2, write = 5 }

[cost.text.output]
price = 10

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 15
