# Toggle: thinking.type = enabled|disabled (lab-mapped, not probed on 302.AI)
# Cost: 302.AI price list https://dash-api.302.ai/products/price?page_size=2000 (retrieved 2026-10-21).
schema = 2
base_model = "zhipuai/glm-5v-turbo"

[modalities]
input = ["text", "image/jpeg", "image/png", "video/mp4", "video/quicktime", "video/x-matroska", "audio", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.72

[[cost.text.input.overrides]]
when = { context = { gt = 32_000 } }
price = 1.1

[cost.text.output]
price = 3.2

[[cost.text.output.overrides]]
when = { context = { gt = 32_000 } }
price = 3.8
