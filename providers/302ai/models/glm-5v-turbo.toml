schema = 2
name = "GLM-5V-Turbo"
description = "GLM vision model for visual reasoning, documents, and multimodal agents"
family = "glm"
open_weights = false
release_date = "2026-04-02"

[modalities]
input = ["text", "image", "video", "audio", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true }
temperature = true

[limit]
context = 200_000
output = 131_072

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.72

[cost.text.output]
price = 3.2
