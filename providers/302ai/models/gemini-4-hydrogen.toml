# Effort: generationConfig.thinkingConfig.thinkingLevel = low|medium|high|xhigh on the native Gemini API, the lab and peer set. Measured thoughtsTokenCount there: low 19-20, medium 31, high 21, xhigh 76. Chat Completions reports no reasoning tokens at any level, so the control is only published off the native API.
# structured_output is not published: response_format json_schema returns 200 but the body ignores the schema.
# Cost: 302.AI price list https://dash-api.302.ai/products/price?page_size=2000 (2026-11-20): input $1.5, output $7.5, cache read $0.075, cache write $0.08333 — same as the product page.
schema = 2
base_model = "google/gemini-4-hydrogen"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }

[api.chat-completions]

[api.generate-content]
base_url = "https://api.302.ai/v1beta"
sdk = { aisdk = "@ai-sdk/google", opencodeai = "@opencode/ai/providers/google" }

[cost.text.input]
price = 1.5
cache = { read = 0.075, write = 0.08333 }

[cost.text.output]
price = 7.5
