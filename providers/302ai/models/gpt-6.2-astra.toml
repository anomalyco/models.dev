# Effort: reasoning_effort = low|medium|high|xhigh|max (minimal rejected). Measured reasoning tokens: low 319, medium/high/xhigh 516 each, max accepted on retry (0 reasoning tokens for a trivial prompt); the OpenAI level set is what the lab and every peer publish.
# Cost: 302.AI price list https://dash-api.302.ai/products/price?page_size=2000 (2026-11-20): $8/$40, cache read $0.4, cache write $10.
schema = 2
base_model = "openai/gpt-6.2-astra"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 8
cache = { read = 0.4, write = 10 }

[cost.text.output]
price = 40
