# Effort: reasoning_effort = none|low|medium|high|xhigh|max
# Cost: 302.AI bills Sol Pro at GPT-5.5 rates ($5.000/$30.000 per MTok), per live catalog https://api.302.ai/v1/models (retrieved 2026-09-08)
# 302.AI model SKU routing to GPT-5.6 Pro reasoning tier (published at same token pricing in 302.AI API catalog)
# Cost: 302.AI price list https://dash-api.302.ai/products/price?page_size=2000 (retrieved 2026-10-21).
schema = 2
base_model = "openai/gpt-5.6-sol"
name = "gpt-5.6-sol-pro"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 5
cache = { read = 0.5 }

[cost.text.output]
price = 30
