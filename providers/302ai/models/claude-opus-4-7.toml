# Toggle: thinking.type = enabled|disabled
# Effort: output_config.effort = low|medium|high|xhigh|max (lab-mapped, not probed on 302.AI)
schema = 2
base_model = "anthropic/claude-opus-4-7"
name = "claude-opus-4-7"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 5
cache = { read = 0.5, write = 6.25 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 10
cache = { read = 1, write = 12.5 }

[cost.text.output]
price = 25

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 37.5
