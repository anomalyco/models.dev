# Effort: reasoning_effort = minimal|low|medium|high (lab-mapped, not probed on 302.AI)
# Cost: 302.AI price list https://dash-api.302.ai/products/price?page_size=2000 (retrieved 2026-10-21).
schema = 2
base_model = "google/gemini-3.1-flash-lite"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
