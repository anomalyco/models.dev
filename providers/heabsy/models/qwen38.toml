# Toggle: chat_template_kwargs.enable_thinking = true|false (vLLM Qwen chat template).
# The gateway also maps OpenAI-style fields onto that switch: reasoning_effort "none"|"off"|"disabled" -> off,
# any other reasoning_effort value -> on; reasoning.enabled; thinking.type = enabled|disabled.
# No graded effort: reasoning_effort levels (low/medium/xhigh) all map to "on"; there is no reasoning budget field.
# Qwen3.8 27B served by Heabsy on dedicated GPUs in the EEA (EEA tier, zero data retention).
# Pricing (USD per 1M tokens: input 1.00, cached input 0.0761, output 3.00) and limits:
# https://heabsy.com/models (accessed 2026-10-21). API: https://api.heabsy.com/docs

base_model = "alibaba/qwen3.8-27b"

[[reasoning_options]]
type = "toggle"

[cost]
input = 1.00
output = 3.00
cache_read = 0.0761

[modalities]
input = ["text", "image"]
