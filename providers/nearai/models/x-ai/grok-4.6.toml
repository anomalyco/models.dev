# Effort: reasoning_effort = low|medium|high|xhigh.
# Reasoning cannot be turned off: none is rejected (HTTP 400: "Reasoning is mandatory for this endpoint and cannot be disabled").
# Input: text and image; a "file" content part is rejected (HTTP 400).
# Measured on https://cloud-api.near.ai/v1/chat/completions, 2026-10-07.
base_model = "xai/grok-4.6"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh"]

[cost]
input = 2
output = 6
cache_read = 0.5

[[cost.tiers]]
tier = { type = "context", size = 200_000 }
input = 4
output = 12
cache_read = 1
