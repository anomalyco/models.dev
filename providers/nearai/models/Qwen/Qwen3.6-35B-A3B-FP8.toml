# Text only: https://cloud-api.near.ai/v1/models input_modalities = ["text"] for this FP8 deployment (the lab adds image and video).
# Toggle: chat_template_kwargs.enable_thinking = true|false (https://docs.near.ai/cloud/reasoning-models)
# Cache: automatic prefix caching on NEAR-hosted (TEE) models, no request changes (https://docs.near.ai/cloud/guides/prompt-caching).
schema = 2
base_model = "alibaba/qwen3.6-35b-a3b"
name = "Qwen 3.6 35B A3B FP8"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
cache = { supported = true, implicit = true }

[limit]
output = 8_192

[cost.text.input]
price = 0.17
cache = { read = 0.056 }

[cost.text.output]
price = 1.1
