# NEAR AI Cloud TEE deployment. release_date/last_updated track the TEE catalog
# refresh, not the lab release (see models/zhipuai/glm-5.2.toml).
# Toggle: chat_template_kwargs.enable_thinking = true|false (on by default)
# Verified live on POST https://cloud-api.near.ai/v1/chat/completions 2026-09-08:
# reasoning_content present when on, absent when off
base_model = "zhipuai/glm-5.2"
name = "GLM 5.2 TEE"
release_date = "2026-09-08"
last_updated = "2026-09-08"
reasoning_options = [{ type = "toggle" }]

[interleaved]
field = "reasoning_content"

[cost]
input = 1.4
output = 4.4
cache_read = 0.3
