# Toggle: chat_template_kwargs.thinking = true|false (on by default)
# Effort is not a control here, unlike the sibling kimi-k3 route.
# Verified live on POST https://cloud-api.near.ai/v1/chat/completions, toggle 2026-09-08
# and effort 2026-09-11 with six samples per level at temperature 0.
# reasoning_tokens: no parameter 535/934/740/1027/815, low 870/686/720/672/928 and
# high 627/707/832/714/873 all overlap heavily, so neither level changes anything.
# reasoning_effort = max is refused outright: six long attempts and three short control
# attempts all failed while no parameter, low and high each succeeded three times.
# The gateway reports that refusal as "The model is currently unavailable", which is a
# misleading message for a rejected parameter value.
# Text only, although /v1/models advertises image input: on 2026-09-10 a two-colour
# test image was misread, while the same prompt without it said it could not see images.
base_model = "moonshotai/kimi-k2.6"
attachment = false
reasoning_options = [{ type = "toggle" }]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.81
output = 3.85
cache_read = 0.41

[modalities]
input = ["text"]
