# No caller-side reasoning control on this route: reasoning_content is never returned.
# Verified live on POST https://cloud-api.near.ai/v1/chat/completions 2026-09-08 with
# chat_template_kwargs.enable_thinking, chat_template_kwargs.thinking, reasoning_effort,
# reasoning.enabled and reasoning.effort; reasoning_content was empty in every case.
# structured_output: https://cloud-api.near.ai/v1/models supported_features lists structured_outputs.
schema = 2
base_model = "alibaba/qwen3.7-max"

[capabilities]
reasoning = { supported = true }
structured_output = true

[cost.text.input]
price = 2.8

[cost.text.output]
price = 7.5
