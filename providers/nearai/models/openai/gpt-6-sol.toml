# Effort: reasoning_effort = none|low|medium|high|xhigh.
# max is rejected (HTTP 400: "Supported values are: 'none', 'low', 'medium', 'high', and 'xhigh'.").
# Input: text and image; a "file" content part is rejected (HTTP 400).
# Measured on https://cloud-api.near.ai/v1/chat/completions, 2026-10-07.
base_model = "openai/gpt-6-sol"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "xhigh"]

[cost]
input = 2
output = 10
cache_read = 0.2
cache_write = 2.5

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 4
output = 15
cache_read = 0.4
cache_write = 5

[modalities]
input = ["text", "image"]
