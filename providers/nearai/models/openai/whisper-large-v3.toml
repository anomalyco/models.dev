# Lab identity: https://cloud-api.near.ai/v1/models hugging_face_id = openai/whisper-large-v3
# Served on POST /v1/audio/transcriptions (https://docs.near.ai/cloud/guides/specialized-endpoints). Temperature inherits the lab's true:
#   the catalog's supported_sampling_parameters lists temperature.
# Price: the catalog's per-token input/output (0.01/0.01 per 1M). NEAR doesn't say how audio input is tokenized,
#   so the input price stays on the text side, as before.
schema = 2
base_model = "openai/whisper-large-v3"
name = "Whisper Large v3"
description = "Speech transcription model for accurate audio-to-text and captioning workflows"

[limit]
output = 448

[api.transcriptions]
sdk = { aisdk = "none", opencodeai = "@opencode/ai/protocols/openai-transcription" }

[cost.text.input]
price = 0.01

[cost.text.output]
price = 0.01
