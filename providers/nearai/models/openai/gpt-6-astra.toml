# Relayed to OpenAI; reasoning_effort passes through (https://docs.near.ai/cloud/reasoning-models).
# Levels as OpenAI's own entry, providers/openai/models/gpt-6-astra.toml, which is how
# every NEAR AI GPT-5 route is authored since anomalyco/models.dev#2313.
# Flat pricing is deliberate: https://cloud-api.near.ai/v1/models publishes a single rate
# per model and exposes no tier structure for any of them, so a context tier cannot be
# derived from the host. The tiers on gpt-5.4 and gpt-5.5 were hand-authored, not synced.
# Text and image only: the lab entry adds pdf, and a type: "file" content part fails
# schema deserialisation on every route.
schema = 2
base_model = "openai/gpt-6-astra"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 10
cache = { read = 1 }

[cost.text.output]
price = 50
