# Input modalities are this host's, from the input_modalities field of
# https://cloud-api.near.ai/v1/models, which is narrower than the lab entry.
# PDF is excluded on every route: a type: "file" content part fails schema
# deserialisation gateway-wide (verified 2026-09-08).
# No caller-side reasoning control on this route: every control is rejected or inert.
# Verified live on POST https://cloud-api.near.ai/v1/chat/completions 2026-09-11.
# thinking.type = "enabled" and reasoning_effort are both rejected outright.
# reasoning.effort is accepted but is a proven no-op: three samples gave completion_tokens
# of 887/681/861 with no parameter against 929/598/758 at low and 846/878/744 at max,
# every range overlapping. No reply carries reasoning_content.
# Text and image only: the lab entry adds pdf, and a type: "file" content part fails
# schema deserialisation on every route.
base_model = "anthropic/claude-sonnet-5"
reasoning_options = []

[cost]
input = 2.0
output = 10.0
cache_read = 0.2

[modalities]
input = ["text", "image"]
