# NEAR catalog entry: https://cloud-api.near.ai/v1/models (anthropic/claude-haiku-5-5: pricing, 1000000 context, 128000 max output, text+image only, reasoning flag)
# Model page: https://near.ai/models/anthropic/claude-haiku-5-5 (Incognito, 1000K context, $0.1/$0.5/$0.01, prompts over 100K billed higher)
# Lab overview/pricing: https://platform.claude.com/docs/en/models/haiku-5-5/overview (adaptive thinking, 100K tier pricing)
# Lab effort levels: https://platform.claude.com/docs/en/build-with-claude/effort#recommended-effort-levels-for-claude-haiku-5-5 (low|medium|high|xhigh|max, default medium; disabled only at high or below)
# Third-party passthrough: https://docs.near.ai/cloud/reasoning-models (third-party models use provider-native reasoning controls)
# Toggle: thinking.type = adaptive|disabled (disabled only at low, medium, or high effort)
# Effort: output_config.effort = low|medium|high|xhigh|max
base_model = "anthropic/claude-haiku-5-5"
reasoning_options = [{ type = "toggle" }, { type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 0.1
output = 0.5
cache_read = 0.01
cache_write = 0.125

[[cost.tiers]]
tier = { type = "context", size = 100_000 }
input = 0.5
output = 2.5
cache_read = 0.05
cache_write = 0.625

[modalities]
input = ["text", "image"]
