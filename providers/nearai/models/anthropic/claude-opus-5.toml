# No caller-side reasoning control on this route: every control is rejected or inert.
# Verified live on POST https://cloud-api.near.ai/v1/chat/completions 2026-09-11.
# thinking.type = "enabled" is rejected with "thinking.type.enabled" is not supported
# for this model, and reasoning_effort with reasoning_effort: Extra inputs are not permitted.
# reasoning.effort is accepted but is a proven no-op: three samples per level gave
# completion_tokens of 708/700/686 with no parameter against 547/772/683 at low,
# 663/565/718 at medium, 757/650/651 at high and 641/597/700 at max, every range
# overlapping the no-parameter range. No reply carries reasoning_content.
# Text and image only: the lab entry adds pdf, and a type: "file" content part fails
# schema deserialisation on every route.
schema = 2
base_model = "anthropic/claude-opus-5"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true }

[cost.text.input]
price = 5
cache = { read = 0.5 }

[cost.text.output]
price = 25
