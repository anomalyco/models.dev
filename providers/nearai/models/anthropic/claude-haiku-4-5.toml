# No caller-side reasoning control on this route. Every Anthropic route on this
# gateway that was probed live on 2026-09-08 rejected thinking.type and
# reasoning_effort and returned no reasoning_content for reasoning.*, and this
# route shares that relay surface. supported_features does not track the
# behaviour: it lists reasoning here and omits it on claude-opus-4-8, which
# probing showed behaves the same.
base_model = "anthropic/claude-haiku-4-5"
reasoning_options = []

[cost]
input = 1
output = 5
cache_read = 0.1
cache_write = 1.25

[modalities]
input = ["text", "image"]
