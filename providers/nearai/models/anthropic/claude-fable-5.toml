# No caller-side reasoning control on this route: every control is rejected or inert.
# Verified live on POST https://cloud-api.near.ai/v1/chat/completions 2026-09-11.
# thinking.type = "enabled" and reasoning_effort are both rejected outright.
# reasoning.effort is accepted but is a proven no-op: six samples gave completion_tokens
# of 473/438/389/434/398/356 with no parameter against 470/352/350/319/360/441 at low,
# fully overlapping. At three samples the two looked separated; the gap dissolved at six.
# No reply carries reasoning_content.
# Text and image only: the lab entry adds pdf, and a type: "file" content part fails
# schema deserialisation on every route.
schema = 2
base_model = "anthropic/claude-fable-5"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true }

[cost.text.input]
price = 10
cache = { read = 1 }

[cost.text.output]
price = 50
