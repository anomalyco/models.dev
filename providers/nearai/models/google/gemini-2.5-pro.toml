# Budget: reasoning.max_tokens, the OpenAI-compatible reasoning field this gateway accepted in
# the 2026-09-08 probes. The 128..32768 range follows the openrouter peer for this model, and
# thinking cannot be turned off on Gemini 2.5 Pro, so there is no toggle.
base_model = "google/gemini-2.5-pro"
reasoning_options = [{ type = "budget_tokens", min = 128, max = 32_768 }]

[cost]
input = 1.25
output = 10
cache_read = 0.125

[[cost.tiers]]
tier = { type = "context", size = 200_000 }
input = 2.5
output = 15
cache_read = 0.25

[modalities]
input = ["text", "image"]
