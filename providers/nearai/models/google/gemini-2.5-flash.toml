# Toggle: generationConfig.thinkingConfig.thinkingBudget = 0 disables thinking
# Budget: generationConfig.thinkingConfig.thinkingBudget, up to 24576 reasoning tokens
# Copied from providers/google/models/gemini-2.5-flash.toml and the helicone peer.
# https://ai.google.dev/gemini-api/docs/thinking
base_model = "google/gemini-2.5-flash"
reasoning_options = [
  { type = "toggle" },
  { type = "budget_tokens", min = 0, max = 24_576 },
]

[cost]
input = 0.3
output = 2.5
cache_read = 0.03

[modalities]
input = ["text", "image"]
