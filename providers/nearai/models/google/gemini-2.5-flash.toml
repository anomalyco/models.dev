# Toggle: reasoning.enabled = true|false. The 2026-09-08 probes on this gateway accepted the
# OpenAI-compatible reasoning object while rejecting thinking.type and reasoning_effort, so that
# is the field a caller can send here. Toggle-only follows the openrouter peer for this model.
base_model = "google/gemini-2.5-flash"
reasoning_options = [{ type = "toggle" }]

[cost]
input = 0.3
output = 2.5
cache_read = 0.03

[modalities]
input = ["text", "image"]
