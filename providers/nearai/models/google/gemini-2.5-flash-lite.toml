# Toggle: generationConfig.thinkingConfig.thinkingBudget = 0 disables thinking
# Budget: generationConfig.thinkingConfig.thinkingBudget, 512..24576 reasoning tokens
# Copied from providers/google/models/gemini-2.5-flash-lite.toml and the google-vertex,
# vercel and helicone peers. https://ai.google.dev/gemini-api/docs/thinking
base_model = "google/gemini-2.5-flash-lite"
reasoning_options = [
  { type = "toggle" },
  { type = "budget_tokens", min = 512, max = 24_576 },
]

[cost]
input = 0.1
output = 0.4
cache_read = 0.01

[modalities]
input = ["text", "image"]
