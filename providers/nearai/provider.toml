name = "NEAR AI Cloud"
npm = "@ai-sdk/openai-compatible"
# Gateway and direct TEE hosts use the same POST `/v1/chat/completions` API.
# Routes NEAR AI hosts itself take `chat_template_kwargs.thinking|enable_thinking = true|false`;
# GPT-OSS uses `reasoning_effort = low|medium|high` and cannot be disabled.
# Relayed routes take the OpenAI-compatible `reasoning` object (`reasoning.enabled`,
# `reasoning.effort`, `reasoning.max_tokens`). The Anthropic relays accept it but return no
# reasoning content, so those entries publish no caller-side control.
# https://docs.near.ai/cloud/guides/openai-compatibility
# https://docs.near.ai/cloud/reasoning-models (accessed 2026-06-25)
api = "https://cloud-api.near.ai/v1"
env = ["NEARAI_API_KEY"]
doc = "https://docs.near.ai/"
