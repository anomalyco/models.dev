# Source: GET https://api.modelrelay.ai/v1/models (accessed 2026-10-09)
# Served through ModelRelay's text-only Meta adapter: image/video/audio/PDF input is not accepted here.
# Output limit: Meta publishes no output-only ceiling; ModelRelay reports the full window.
# Effort: reasoning_effort (Chat Completions) = low|medium|high
# https://docs.modelrelay.ai/core/reasoning-effort
base_model = "meta/muse-spark-1.3"
attachment = false
temperature = false

reasoning_options = [{ type = "effort", values = ["low", "medium", "high"] }]

[cost]
input = 1.25
output = 4.25
cache_read = 0.15

[limit]
output = 1_048_576

[modalities]
input = ["text"]
