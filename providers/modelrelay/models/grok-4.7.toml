# Source: GET https://api.modelrelay.ai/v1/models (accessed 2026-10-09)
# Reasoning cannot be disabled: ModelRelay accepts reasoning_effort=none only as an alias for low, so it is not listed.
# Long-context band starts above 200,000 input tokens.
# Effort: reasoning_effort (Chat Completions) = low|medium|high|xhigh
# ModelRelay effort matrix: github.com/tensor-systems/modelrelay providers/effort/matrix.go
# https://docs.modelrelay.ai/core/reasoning-effort
base_model = "xai/grok-4.7"
temperature = false

reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh"] }]

[cost]
input = 2
output = 6
cache_read = 0.5

[[cost.tiers]]
tier = { type = "context", size = 200_000 }
input = 4
output = 12
cache_read = 1

[modalities]
input = ["text", "image"]
