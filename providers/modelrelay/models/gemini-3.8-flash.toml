# Source: GET https://api.modelrelay.ai/v1/models (accessed 2026-10-09)
# Upstream route: Google AI Studio. Image input verified live 2026-10-09.
# Input: Chat Completions takes only text and image_url parts; a PDF file part is rejected with 400 (verified 2026-10-09).
# Introductory list price, valid through 2026-12-31.
# Effort: reasoning_effort (Chat Completions) = low|medium|high
# https://docs.modelrelay.ai/core/reasoning-effort
base_model = "google/gemini-3.8-flash"
temperature = false

reasoning_options = [{ type = "effort", values = ["low", "medium", "high"] }]

[cost]
input = 0.75
output = 3.75
cache_read = 0.075

[modalities]
input = ["text", "image"]
