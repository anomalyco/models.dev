# Sources (accessed 2026-07-28):
# - Model card and capabilities: https://docs.abliteration.ai/models
# - Reasoning effort ladder and per-endpoint request fields (reasoning on by
#   default; "none" disables; top-level thinking:false disables on
#   /v1/messages and as a legacy alias on /v1/chat/completions):
#   https://docs.abliteration.ai/capabilities/thinking
# effort: API: {"reasoning_effort": "<value>"} on /v1/chat/completions
# toggle: API: {"thinking": false} on /v1/messages (legacy alias on /v1/chat/completions)
# v1 reasoning_options are now listed as [toggle, effort] (v2 order); the options themselves are unchanged.
schema = 2
name = "Abliterated Model"
description = "Multimodal model for analyzing text, images, documents, and rich media"
open_weights = true
release_date = "2026-01-06"
last_updated = "2026-07-28"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = false
temperature = true

[limit]
context = 150_000
input = 150_000
output = 8_192

[cost.text.input]
price = 3
cache = { read = 0.3 }

[cost.text.output]
price = 3
