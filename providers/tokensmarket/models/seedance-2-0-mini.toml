# BytePlus channel. Video generation billed per million output tokens on a
# resolution tier ($2.10 for the variable-length 480p/720p tiers, $3.50 for the
# fixed-length ones). The [cost] schema has no resolution dimension, so the
# variable-length rate is recorded as the representative output price.
name = "Seedance 2.0 Mini"
description = "Latency-optimized video model for high-concurrency, cost-sensitive generation"
family = "seed"
release_date = "2026-04-14"
last_updated = "2026-04-14"
attachment = true
reasoning = false
temperature = true
tool_call = false
open_weights = false

[cost]
input = 0
output = 2.10

[limit]
context = 0
output = 0

[modalities]
input = ["text", "image", "video"]
output = ["video"]
