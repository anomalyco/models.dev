description = "Fast video model for prompt or reference-image driven generation"
family = "seed"
release_date = "2026-04-14"
last_updated = "2026-04-14"
attachment = true
reasoning = false
temperature = true
tool_call = false
open_weights = false

[cost]
input = 0
output = 3.30

[limit]
context = 0
output = 0

[modalities]
input = ["text", "image", "video"]
