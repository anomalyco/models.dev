# Servable on GET /v1/models but not yet listed in the public pricing catalog,
# so [cost] is omitted rather than guessed.
# The channel is OpenAI-compatible, which forwards `reasoning_effort` and maps
# effort "none" onto disabling thinking.
base_model = "xiaomi/mimo-v2.5-pro"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high"] }]

[interleaved]
field = "reasoning_content"
