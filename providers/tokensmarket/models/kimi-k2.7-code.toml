# Alibaba Cloud (DashScope) channel. Kimi K2.7 Code is a thinking-only model
# and does not support `thinking_budget`, so this surface exposes no
# caller-selectable reasoning controls.
# https://www.alibabacloud.com/help/en/model-studio/kimi-api
base_model = "moonshotai/kimi-k2.7-code"
reasoning_options = []

[interleaved]
field = "reasoning_content"

[cost]
input = 0.768
output = 3.176
cache_read = 0.152
