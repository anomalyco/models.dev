# Alibaba Cloud (DashScope) channel. The adapter turns effort "none" into
# `enable_thinking = false` and otherwise forwards `reasoning_effort`, so the
# upstream DeepSeek toggle plus effort ladder is reachable. `thinking_budget` is
# projected for the Qwen family only, so no budget_tokens option here.
base_model = "deepseek/deepseek-v4-flash"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.22
output = 0.665
cache_read = 0.022
