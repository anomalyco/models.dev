# Alibaba Cloud (DashScope) channel. The effective `reasoning_effort`
# values are `none | high | max`: `none` disables reasoning, low/medium
# collapse to high, and xhigh collapses to max.
base_model = "zhipuai/glm-5.2"
reasoning_options = [{ type = "effort", values = ["none", "high", "max"] }]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.944
output = 3.296
cache_read = 0.232
