# This alias routes to GLM-5.3-Flash since 2026-09-09 (it rode Kimi K2.7 Code
# before): reasoning is always on (`can_disable=false`) WITH effort levels
# low|high|max, default max (accessed 2026-09-08):
# https://api.code.umans.ai/v1/models/info
schema = 2
base_model = "zhipuai/glm-5.3-flash"
name = "Umans Coder"

[modalities]
input = ["text", "image/jpeg", "image/png", "video/mp4", "video/x-matroska", "video/quicktime"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
temperature = false

[limit]
context = 1_048_576
output = 131_071

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
