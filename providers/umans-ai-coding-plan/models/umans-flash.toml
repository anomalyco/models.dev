# Live metadata: levels none/low/medium/high, default medium, and
# `can_disable=true` (accessed 2026-06-25).
# https://api.code.umans.ai/v1/models/info
schema = 2
base_model = "alibaba/qwen3.6-35b-a3b"
name = "Umans Flash"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high"] }
structured_output = true
temperature = false

[limit]
output = 262_144

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
