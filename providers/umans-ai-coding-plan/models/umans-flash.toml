# This alias routes to DeepSeek V4.1 Flash since 2026-10-28 and follows its
# updates (it rode Qwen3.6-35B-A3B before; that model keeps its own id until it
# retires on 2026-11-01). It serves the same weights and price as
# umans-deepseek-v4.1-flash (the 1017 checkpoint).
# Toggle: thinking.type = enabled|disabled (reasoning_effort = "none" also disables)
# Effort: reasoning_effort = low|high|max (default high). A number from 1 to 100
# maps to the nearest mode: 1-62 low, 63-87 high, 88-100 max.
# Live card, checked 2026-10-28: https://api.code.umans.ai/v1/models/info
# (levels none/low/high/max, default high, can_disable true, supports_vision
# true). The fast tier keeps the limits it advertised before the move:
# context_window 262144, max_completion_tokens 262144, recommended 32768
# (limit.output below), while umans-coder carries the full 1M context.
# The coding-plan twin of the umans-ai entry: same model, cost 0 (the plan
# convention: plan subscribers are not metered per token).
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"
name = "Umans Flash"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
context = 262_144
output = 32_768

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
