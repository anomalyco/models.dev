# Dated pin of umans-deepseek-v4.1-flash, the coding-plan twin of the umans-ai
# entry: same id, cost 0 (the plan convention: plan subscribers are not metered
# per token). Since 2026-10-20 both ids serve DeepSeek-V4.1-Flash-1017 with the
# same limits. A dated id is never repointed: when the floating id moves to a
# later update, this id keeps the 1017 weights or is deprecated with notice.
# Toggle: thinking.type = enabled|disabled (reasoning_effort = "none" also disables)
# Effort: reasoning_effort = low|high|max (default high). A number from 1 to 100
# maps to the nearest mode: 1-62 low, 63-87 high, 88-100 max.
# Live card, checked 2026-10-21: https://api.code.umans.ai/v1/models/info
# (levels none/low/high/max, default high, can_disable true, supports_vision
# true, context_window 1048576, max_completion_tokens 393216).
# limit.output is cap-1 on purpose: the gateway 400s max_tokens >=
# max_completion_tokens (393216), so 393215 is the largest value that serves
# (its advertised recommended_max_tokens).
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
context = 1_048_576
output = 393_215

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
