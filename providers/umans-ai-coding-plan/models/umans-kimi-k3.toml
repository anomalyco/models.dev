# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|high|max
# Live metadata: levels none/low/high/max, default max, and `can_disable=true`
# (accessed 2026-07-28): https://api.code.umans.ai/v1/models/info
schema = 2
base_model = "moonshotai/kimi-k3"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
