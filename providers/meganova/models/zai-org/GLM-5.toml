# MegaNova identifies GLM-5 as a reasoning model, but its raw Chat request
# schema documents no field or values that enable and disable reasoning.
# https://docs.meganova.ai/inference-models/text-generation.md (accessed 2026-06-25)
schema = 2
name = "GLM-5"
description = "Flagship GLM model for hybrid reasoning, coding, and agentic engineering"
family = "glm"
open_weights = true
release_date = "2026-02-11"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true }
temperature = true

[limit]
context = 202_752
output = 131_072

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.8

[cost.text.output]
price = 2.56
