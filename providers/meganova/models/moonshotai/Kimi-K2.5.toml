# knowledge: Meganova's value, unsourced and different from the lab's. Kept so v1 doesn't change.
# Price: GET https://api.meganova.ai/api/v1/serverless/models (public catalog behind console.meganova.ai/serverless, accessed 2026-10-21)
schema = 2
base_model = "moonshotai/kimi-k2.5"
description = "Kimi multimodal agent model for visual understanding, coding, and planning"
knowledge = "2026-01"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
temperature = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.45
cache = { read = 0.07 }

[cost.text.output]
price = 2.25
