# Cerebras Qwen3.8 27B paid-tier limits: 128K context (131,072), 40K max output (40,960).
# Free Trial is 64K/32K; catalog uses paid-tier maxima per Cerebras precedent (cf. gpt-oss-120b).
# Source: https://inference-docs.cerebras.ai/models/qwen-3.8-27b (accessed 2026-09-24)
# Cached input tokens are billed at the standard input rate (no caching discount or fee).
# Source: https://inference-docs.cerebras.ai/capabilities/prompt-caching#how-are-cached-tokens-priced (accessed 2026-09-29)
# Model-specific reasoning HTTP values from the Cerebras launch contract:
# reasoning_effort = "none" | "low" | "medium" | "high"; default is "high".
schema = 2
base_model = "alibaba/qwen3.8-27b"
last_updated = "2026-09-03"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true

[limit]
context = 131_072
output = 40_960

[cost.text.input]
price = 0.99
cache = { read = 0.99 }

[cost.text.output]
price = 1.49
