# Model-specific reasoning HTTP values (accessed 2026-06-25):
# reasoning_effort = "low"|"medium"|"high"; default is "medium".
# Sources:
# https://inference-docs.cerebras.ai/capabilities/reasoning#gpt-oss-reasoning-effort
# https://inference-docs.cerebras.ai/models/openai-oss
schema = 2
base_model = "openai/gpt-oss-120b"
last_updated = "2026-06-10"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
output = 40_960

[cost.text.input]
price = 0.35

[cost.text.output]
price = 0.75
