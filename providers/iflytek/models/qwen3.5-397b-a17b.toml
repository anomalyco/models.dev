# Sources (accessed 2026-09-14):
# https://www.xfyun.cn/doc/spark/TokenPlan.html
# https://www.xfyun.cn/doc/spark/推理服务-http.html
# Qwen3.5-397B-A17B: 256K context on this host (Token Plan; lab 262_144).
# Toggle: enable_thinking = true|false per host docs. No budget_tokens
# (host does not expose thinking_budget; DashScope-specific). No graded
# effort (host "仅针对OpenAI开源的OSS模型" phrase targets OpenAI OSS
# gpt-oss family, not Qwen; matching toggle-only peer baseline from
# TokenGo and similar relays).
# Tool calling NOT supported on this host (only DeepSeek V3.2 and GLM-4.7).
# Text-only on this API; base lab is multimodal, attachment/modalities
# overridden.
# Pricing: Token Plan points 120/24/720 per 1M at 0.01 CNY/point
# (Token Plan doc defines points as the unified meter; 1 point ≈ 0.01 CNY
# is the published conversion for standard members at 200 CNY / 20000 points),
# converted at 7.25 CNY/USD.

base_model = "alibaba/qwen3.5-397b-a17b"
tool_call = false
attachment = false
reasoning_options = [{ type = "toggle" }]

[interleaved]
field = "reasoning_content"

[modalities]
input = ["text"]
output = ["text"]

[cost]
input = 0.17
output = 0.99
cache_read = 0.03

[limit]
context = 256_000
