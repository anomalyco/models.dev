# Sources (accessed 2026-09-14):
# https://www.xfyun.cn/doc/spark/TokenPlan.html
# https://www.xfyun.cn/doc/spark/推理服务-http.html
# Qwen3.6-35B-A3B: 128K context on this host (Token Plan; lab 262_144).
# Toggle: enable_thinking = true|false per host docs. No budget_tokens
# (host does not expose thinking_budget). No graded effort (host "OSS"
# phrase targets OpenAI OSS gpt-oss family, not Qwen; matching
# toggle-only peer baseline).
# Tool calling NOT supported on this host. Text-only on this API; base
# lab is multimodal, attachment/modalities overridden.
# Pricing: Token Plan points 100/20/360 per 1M at 0.01 CNY/point,
# converted at 7.25 CNY/USD.

base_model = "alibaba/qwen3.6-35b-a3b"
tool_call = false
attachment = false
reasoning_options = [{ type = "toggle" }]

[interleaved]
field = "reasoning_content"

[modalities]
input = ["text"]
output = ["text"]

[cost]
input = 0.14
output = 0.50
cache_read = 0.03

[limit]
context = 128_000
