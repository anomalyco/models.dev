# Qianliu lists this dated model in the deepseek-1 group with Chat Completions and Messages:
# https://www.plusapi.cn/pricing?keyword=deepseek-v4-pro-0813
# https://www.plusapi.cn/api/pricing_new (2026-11-25)
# Per million tokens in USD: input = 2 * 0.66 * 1.43, output = input * 3,
# and cached reads = input * 0.03333. These are Qianliu's published group rates.
# The upstream model version and its reasoning controls are documented at
# https://api-docs.deepseek.com/quick_start/pricing/ and https://api-docs.deepseek.com/guides/thinking_mode .
# Qianliu's v1 reference documents stream_options.include_usage, tool_choice and response_format:
# https://docs.plusapi.cn/api/docs/public/specs/platform/v1?locale=zh-CN
schema = 2
base_model = "deepseek/deepseek-v4-pro-0813"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, default = { type = "effort", value = "high" }, toggle = true, effort = ["low", "high", "max"] }
structured_output = true
stream_usage = true
top_k = false
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content", max_tokens_field = "max_tokens" }

[api.messages]
base_url = "https://www.plusapi.cn/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 1.8876
cache = { read = 0.062913708 }

[cost.text.output]
price = 5.6628
