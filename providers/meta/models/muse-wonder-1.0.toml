# Sources:
# https://research.meta.ai/blog/muse-wonder
# GET https://api.meta.ai/v1/models lists muse-wonder-1.0 (verified 2026-10-12)
# Effort values from the API's own validation error for reasoning_effort = "none":
# "Supported values: [minimal, low, medium, high, xhigh, max]" (verified 2026-10-12)
# https://dev.meta.ai/docs/pricing-rate-limits (Standard mode token pricing; Contributor mode not on Model API)
# v2 capabilities: https://dev.meta.ai/docs/structured-output, https://dev.meta.ai/docs/prompt-caching,
# https://dev.meta.ai/docs/protocols/chat-completions, https://dev.meta.ai/docs/api-reference/chat-completions/schemas
# APIs: Responses, Chat Completions and Messages (https://dev.meta.ai/docs/models, "Models at a glance"), all confirmed live 2026-10-22.
# Per-API flags: system_updates sits on [api.responses] only. The mid-conversation developer message was checked in place on the Responses API (live 2026-10-23); Chat Completions and Messages have no documented or tested in-place system message.
# Tools: tool_choice accepts only "auto" (https://dev.meta.ai/docs/tool-calling#guidelines; "required" returns 400 live 2026-10-24).
# strict only validates the schema and doesn't constrain arguments (https://dev.meta.ai/docs/tool-calling#strict), so it is left out.
# Tool search (tool_search + defer_loading) on Responses and Messages, not Chat Completions (https://dev.meta.ai/docs/tool-search); worked live on muse-spark-1.1 and muse-wonder-1.0 (2026-10-24).
schema = 2
base_model = "meta/muse-wonder-1.0"

[capabilities]
tools = { supported = true, choice = ["auto"], search = true }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
store = true
stream_usage = true
prompt_cache_key = true
cache = { implicit = true }

[api.responses]
capabilities = { system_updates = true }

[api.chat-completions]
sdk = { opencodeai = "@opencode/ai/providers/meta/chat" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/meta/messages" }

[cost.text.input]
price = 4
cache = { read = 0.2 }

[cost.text.output]
price = 20
