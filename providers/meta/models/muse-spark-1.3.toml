# Sources:
# https://research.meta.ai/blog/introducing-muse-spark-1-3
# https://dev.meta.ai/docs/pricing-rate-limits/
# https://openrouter.ai/api/v1/models/meta/muse-spark-1.3/endpoints (Meta endpoint pricing; accessed 2026-09-02)
# Standard-tier rates match Muse Spark 1.2; Axios reports 1.3 priced the same as predecessor.
# https://dev.meta.ai/docs/reasoning.md (max is Standard-tier 1.3 only; verified 2026-09-04)
# Effort: reasoning_effort (Chat Completions) or reasoning.effort (Responses) = minimal|low|medium|high|xhigh|max

base_model = "meta/muse-spark-1.3"

reasoning_options = [{ type = "effort", values = ["minimal", "low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 1.25
output = 4.25
cache_read = 0.15
