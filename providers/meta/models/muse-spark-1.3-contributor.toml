# Sources:
# https://research.meta.ai/blog/introducing-muse-spark-1-3
# https://dev.meta.ai/docs/models
# https://dev.meta.ai/docs/pricing-rate-limits
# https://openrouter.ai/meta/muse-spark-1.3-contributor (OpenRouter Meta-hosted catalog snapshot, 2026-09-02)
# Contributor tier prompts and completions may be used to improve Meta's products.
# v2 capabilities: https://dev.meta.ai/docs/structured-output, https://dev.meta.ai/docs/prompt-caching,
# https://dev.meta.ai/docs/protocols/chat-completions, https://dev.meta.ai/docs/api-reference/chat-completions/schemas
schema = 2
base_model = "meta/muse-spark-1.3"
name = "Muse Spark 1.3 Contributor"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh"] }
structured_output = true
system_updates = true
effort_updates = false
store = true
stream_usage = true
prompt_cache_key = true
cache = { implicit = true }

[cost.text.input]
price = 0.1
cache = { read = 0.002 }

[cost.text.output]
price = 0.2
