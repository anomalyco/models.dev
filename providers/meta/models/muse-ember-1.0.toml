# Sources:
# https://research.meta.ai/blog/muse-ember
# https://dev.meta.ai/docs/muse-ember (Standard mode only on Model API; no Contributor-mode variant)
# GET https://api.meta.ai/v1/models lists muse-ember-1.0 and no muse-ember-1.0-contributor (verified 2026-11-09)
# Effort values from the API's own validation error for reasoning_effort = "none":
# "Supported values: [minimal, low, medium, high, xhigh, max]" (verified 2026-11-09); https://dev.meta.ai/docs/reasoning (default max)
# https://dev.meta.ai/docs/pricing-rate-limits#muse-ember-pricing: a request with more than 200K input tokens, cached tokens
# included, is billed at the long-context rates in full.
# v2 capabilities: https://dev.meta.ai/docs/structured-output, https://dev.meta.ai/docs/prompt-caching,
# https://dev.meta.ai/docs/protocols/chat-completions, https://dev.meta.ai/docs/api-reference/chat-completions/schemas
# APIs: Responses, Chat Completions and Messages (https://dev.meta.ai/docs/muse-ember, "Endpoints"), all confirmed live 2026-11-09.
# Per-API flags: system_updates sits on [api.responses] only. The mid-conversation developer message was checked in place on the Responses API (live 2026-11-09); Chat Completions and Messages have no documented or tested in-place system message.
# Tools: tool_choice accepts only "auto" (https://dev.meta.ai/docs/tool-calling#guidelines; "required" returns 400 live 2026-11-09).
# strict only validates the schema and doesn't constrain arguments (https://dev.meta.ai/docs/tool-calling#strict), so it is left out.
# Tool search (tool_search + defer_loading) on Responses and Messages, not Chat Completions (https://dev.meta.ai/docs/tool-calling#tool-search); worked live on both (2026-11-09), so search sits on [api.responses] and [api.messages] only.
schema = 2
base_model = "meta/muse-ember-1.0"

[capabilities]
tools = { supported = true, choice = ["auto"] }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
store = true
stream_usage = true
prompt_cache_key = true
cache = { implicit = true }

[api.responses]
capabilities = { system_updates = true, tools = { search = true } }

[api.chat-completions]
sdk = { opencodeai = "@opencode/ai/providers/meta/chat" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/meta/messages" }
capabilities = { tools = { search = true } }

[cost.text.input]
price = 0.1
cache = { read = 0.004 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 0.3
cache = { read = 0.012 }

[cost.text.output]
price = 0.5

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 1.5
