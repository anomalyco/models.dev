# Sources:
# https://dev.meta.ai/docs/models/
# https://ai.developer.meta.com/docs/getting-started/pricing-rate-limits/
# https://developer.meta.com/ai/resources/blog/build-with-muse-spark/
# v2 capabilities: https://dev.meta.ai/docs/structured-output, https://dev.meta.ai/docs/prompt-caching,
# https://dev.meta.ai/docs/protocols/chat-completions, https://dev.meta.ai/docs/api-reference/chat-completions/schemas
# APIs: Responses, Chat Completions and Messages (https://dev.meta.ai/docs/models, "Models at a glance"), all confirmed live 2026-10-22.
schema = 2
base_model = "meta/muse-spark-1.1"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh"] }
structured_output = true
system_updates = true
effort_updates = false
store = true
stream_usage = true
prompt_cache_key = true
cache = { implicit = true }

[api.responses]

[api.chat-completions]
sdk = { opencodeai = "@opencode/ai/providers/meta/chat" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/meta/messages" }

[cost.text.input]
price = 1.25
cache = { read = 0.15 }

[cost.text.output]
price = 4.25
