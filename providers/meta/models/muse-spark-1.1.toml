# Sources:
# https://dev.meta.ai/docs/models/
# https://ai.developer.meta.com/docs/getting-started/pricing-rate-limits/
# https://developer.meta.com/ai/resources/blog/build-with-muse-spark/
# v2 capabilities: https://dev.meta.ai/docs/structured-output, https://dev.meta.ai/docs/prompt-caching,
# https://dev.meta.ai/docs/protocols/chat-completions, https://dev.meta.ai/docs/api-reference/chat-completions/schemas
# APIs: Responses, Chat Completions and Messages (https://dev.meta.ai/docs/models, "Models at a glance"), all confirmed live 2026-10-22.
# Per-API flags: system_updates sits on [api.responses] only. The mid-conversation developer message was checked in place on the Responses API (live 2026-10-23); Chat Completions and Messages have no documented or tested in-place system message.
# Tools: tool_choice accepts only "auto" (https://dev.meta.ai/docs/tool-calling#guidelines; "required" returns 400 live 2026-10-24).
# strict only validates the schema and doesn't constrain arguments (https://dev.meta.ai/docs/tool-calling#strict), so it is left out.
# Tool search (tool_search + defer_loading) on Responses and Messages, not Chat Completions (https://dev.meta.ai/docs/tool-search); worked live on muse-spark-1.1 and muse-wonder-1.0 (2026-10-24), so search sits on [api.responses] and [api.messages] only.
# Cache: automatic prefix caching on every API (https://dev.meta.ai/docs/prompt-caching). prompt_cache_retention "24h"
# keeps the cached prefix up to 24 hours (default "in_memory": evicted under memory pressure or inactivity): documented
# for Responses (https://dev.meta.ai/docs/prompt-caching#cache-retention) and Chat Completions
# (https://dev.meta.ai/docs/api-reference/chat-completions/schemas); accepted live on Responses for every Muse text model,
# and "bogus" is rejected with "expected `in_memory` or `24h`" (2026-11-10). Messages takes cache_control markers with
# ttl "5m" only (https://dev.meta.ai/docs/api-reference/messages/create-message).
schema = 2
base_model = "meta/muse-spark-1.1"

[capabilities]
tools = { supported = true, choice = ["auto"] }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh"] }
structured_output = true
store = true
stream_usage = true
prompt_cache_key = true
cache = { implicit = { ttl = ["24h"] } }

[api.responses]
capabilities = { system_updates = true, tools = { search = true } }

[api.chat-completions]
sdk = { opencodeai = "@opencode/ai/providers/meta/chat" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/meta/messages" }
capabilities = { tools = { search = true } }

[cost.text.input]
price = 1.25
cache = { read = 0.15 }

[cost.text.output]
price = 4.25
