# Toggle: chat_template_kwargs.enable_thinking = true | false
# https://friendli.ai/docs/guides/reasoning
# Effort: reasoning_effort = "high" | "max"
# https://friendli.ai/docs/openapi/model-apis/chat-completions#body-reasoning-effort-one-of-0
# Budget: reasoning_budget = positive integer reasoning-token cap (-1 = unlimited)
# https://friendli.ai/docs/openapi/model-apis/chat-completions#body-reasoning-budget-one-of-0
# Mid-conversation: Friendli serves this model on POST /serverless/v1/chat/completions; reasoning and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://friendli.ai/docs/openapi/model-apis/chat-completions
schema = 2
base_model = "zhipuai/glm-5.2"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true, effort = ["high", "max"], budget = {} }
structured_output = true
effort_updates = false

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.4
cache = { read = 0.26 }

[cost.text.output]
price = 4.4
