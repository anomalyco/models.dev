# Effort: reasoning_effort = "low" | "high" | "max"
# https://friendli.ai/docs/openapi/model-apis/chat-completions#body-reasoning-effort-one-of-0
# Budget: reasoning_budget = positive integer reasoning-token cap (-1 = unlimited)
# https://friendli.ai/docs/openapi/model-apis/chat-completions#body-reasoning-budget-one-of-0
# Mid-conversation: Friendli serves this model on POST /serverless/v1/chat/completions; reasoning and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://friendli.ai/docs/openapi/model-apis/chat-completions
# Input MIME types: images JPEG, PNG and AVIF (https://friendli.ai/docs/guides/multi-modality); video per the lab.
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/avif", "video/mp4", "video/x-matroska", "video/quicktime"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "high", "max"], budget = {} }
structured_output = true

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.15
cache = { read = 0.03 }

[cost.text.output]
price = 0.5
