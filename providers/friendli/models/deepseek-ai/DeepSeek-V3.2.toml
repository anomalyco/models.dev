# Toggle: chat_template_kwargs.enable_thinking = true | false
# https://friendli.ai/docs/guides/reasoning
# Budget: reasoning_budget = positive integer reasoning-token cap (-1 = unlimited)
# https://friendli.ai/docs/openapi/model-apis/chat-completions#body-reasoning-budget-one-of-0
schema = 2
base_model = "deepseek/deepseek-v3.2"

[capabilities]
reasoning = { supported = true, toggle = true, budget = {} }
structured_output = true

[limit]
context = 163_840

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.5
cache = { read = 0.25 }

[cost.text.output]
price = 1.5
