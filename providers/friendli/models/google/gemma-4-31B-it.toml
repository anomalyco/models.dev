# Toggle: chat_template_kwargs.enable_thinking = true | false
# https://friendli.ai/docs/guides/reasoning
#
# Image input verified live (accessed 2026-08-29): live GET /serverless/v1/models
# reports input_modalities=[text,image] for this model, and a real image
# POST /chat/completions request (base64 data URL) succeeded with HTTP 200,
# consuming 280 prompt_tokens vs 22 for the equivalent text-only request —
# proof the image was actually processed, not silently ignored. No
# modalities override is authored here on purpose: the inherited lab
# modalities (google/gemma-4-31b-it: text+image input) are correct for this
# host, so overriding would only duplicate identical data.
# Budget: reasoning_budget = positive integer reasoning-token cap (-1 = unlimited)
# https://friendli.ai/docs/openapi/model-apis/chat-completions#body-reasoning-budget-one-of-0
base_model = "google/gemma-4-31b-it"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 0.14
output = 0.4
