# Prices: Prentis rate card, USD per 1M tokens (as of 2026-11-13).
# Effort: reasoning_effort = none|low|high|max; none disables reasoning.
# Reasoning controls copied from providers/deepinfra/models/deepseek-ai/DeepSeek-V4.1-Flash-1017.toml.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
cache = { implicit = true }

[limit]
context = 1_048_576

[cost.text.input]
price = 0.45
cache = { read = 0.009 }

[cost.text.output]
price = 1.8
