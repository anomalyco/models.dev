# Prices: Prentis rate card, USD per 1M tokens (as of 2026-11-13).
# Effort: reasoning_effort = low|medium|high|xhigh
# Reasoning controls copied from providers/openrouter/models/meta/muse-glimmer-30b.toml.
schema = 2
base_model = "meta/muse-glimmer-30b"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
cache = { implicit = true }

[cost.text.input]
price = 0.3
cache = { read = 0.04 }

[cost.text.output]
price = 1.2
