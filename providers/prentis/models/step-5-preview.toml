# Prices: Prentis rate card, USD per 1M tokens (as of 2026-11-13).
# Effort: reasoning_effort = low|medium|high
# Reasoning controls copied from providers/deepinfra/models/stepfun-ai/Step-5-Preview.toml.
schema = 2
base_model = "stepfun/step-5-preview"
base_model_omit = ["limit.input"]

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
cache = { implicit = true }

[limit]
context = 262_144
output = 64_000

[cost.text.input]
price = 1
cache = { read = 0.1 }

[cost.text.output]
price = 2.7
