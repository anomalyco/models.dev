# Docs: https://isoquant.ai/docs (accessed 2026-11-13)
# Model catalog and API metadata: https://api.isoquant.ai/v1/models (accessed 2026-11-13)
# Serves OpenAI-compatible Chat Completions and Responses plus Anthropic-compatible Messages from the same base URL.
# Messages requires `anthropic-version: 2023-06-01`.
# `Isoquant-ZDR: required` opts a request into zero data retention; the DeepSeek
# route is ZDR-required at the model level, and an account requirement applies
# when the header is omitted.
name = "Isoquant"
npm = "@ai-sdk/openai-compatible"
opencodeai = "@opencode/ai/providers/openai-compatible"
env = ["ISOQUANT_API_KEY"]
api = "https://api.isoquant.ai/v1"
doc = "https://isoquant.ai/docs"
