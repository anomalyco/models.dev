# API metadata (accessed 2026-11-13): https://api.isoquant.ai/v1/models
# Chat Completions: POST /v1/chat/completions; Responses: POST /v1/responses.
# Messages: POST /v1/messages (Anthropic-compatible, `anthropic-version: 2023-06-01`); effort via `output_config.effort`.
# Reasoning: Chat `reasoning_effort`, Responses `reasoning.effort`; none|low|high, default high.
# max is rejected on all three APIs: "Supported reasoning efforts are low, high
# and none" (live probes 2026-11-13).
# Tool choice: Chat/Responses auto|none|required|function; Messages auto|none|any|tool.
# `function`/`tool` are recorded as "tool" and `any` as "required".
# Strict tools are supported on all three APIs; a forced strict tool call succeeded on
# Messages (live probe 2026-11-13).
# Output: API default 16384, maximum 943718; context 1048576.
# temperature and top_p are accepted on all three APIs (live probes 2026-11-13;
# Messages and Responses advertise neither but accept both). top_k is rejected on
# Chat Completions, Messages and Responses (live probes 2026-11-13).
# store=true is rejected: "Only stateless foreground Responses are supported"
# (live probe 2026-11-13).
# Cached input price is published and prefix caching is automatic; no cache-write
# price is published.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"
name = "DeepSeek V4.1 Flash 1017 Fast"
description = "High-throughput DeepSeek V4.1 Flash 1017 serving for reasoning, coding, vision, and agent workflows"

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, default = { type = "effort", value = "high" }, effort = ["none", "low", "high"] }
structured_output = true
store = false
cache = { implicit = true }
top_k = false

[limit]
context = 1_048_576
output = 943_718

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.035
cache = { read = 0.005 }

[cost.text.output]
price = 0.37
