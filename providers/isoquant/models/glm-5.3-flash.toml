# API metadata (accessed 2026-11-13): https://api.isoquant.ai/v1/models
# Chat Completions: POST /v1/chat/completions; Responses: POST /v1/responses.
# Messages: POST /v1/messages (Anthropic-compatible, `anthropic-version: 2023-06-01`); effort via `output_config.effort`.
# Reasoning: Chat `reasoning_effort`, Responses `reasoning.effort`; low|high|max, default max;
# `none` is rejected (live probe 2026-11-13).
# Tool choice: Chat auto|required|named|none; Messages auto|any|tool|none; Responses auto|required|named|function.
# `named`/`function`/`tool` are recorded as "tool" and `any` as "required".
# Strict tools: the catalog reports `strict_tools: true` on all three APIs, and a forced strict
# tool call succeeded on Messages for both models (live probe 2026-11-13).
# top_k is accepted on Chat Completions, Messages and Responses (live probes 2026-11-13).
# Input: the catalog reports text+image and the docs say "Accepts text and image
# input" without listing formats. Live probes accepted data URIs for image/jpeg,
# image/png, image/gif and image/webp; video and PDF are not advertised.
# Host output policy is remaining_context; no fixed host cap is published, so the
# model-level 131072 output limit is inherited.
# store=true is rejected: "This backend requires store=false and full input
# history; stored Responses are not available" (live probe 2026-11-13).
# Cached input price is published and prefix caching is automatic; no cache-write
# price is published.
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, default = { type = "effort", value = "max" }, effort = ["low", "high", "max"] }
structured_output = true
store = false
cache = { implicit = true }

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.07
cache = { read = 0.025 }

[cost.text.output]
price = 0.15
