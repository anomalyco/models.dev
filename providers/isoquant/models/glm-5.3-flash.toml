# Source: GET https://api.isoquant.ai/v1/models (accessed 2026-11-10).
# API docs: https://isoquant.ai/docs (accessed 2026-11-17).
# Pricing (nano-USD per token -> USD per million): 70/25/150 = $0.07/$0.025/$0.15
# input/cached input/output. Prompt caching is automatic with no write price.
# Reasoning: the host publishes exactly `low|high|max` (default max) on all three APIs:
# chat `reasoning_effort`, messages `output_config.effort`, responses `reasoning.effort`.
# It exposes no off switch.
# Chat Completions returns the trace in `reasoning_content`.
# Tools: the host reports `strict_tools: true`; tool_choice is auto/none/required/named on
# Chat Completions and Responses and auto/none/any/tool on Messages (`named`/`tool` recorded
# as `tool`, `any` as `required`); its docs state "Strict function tools are supported."
# Output: the host reports `output_limit.policy = remaining_context` with no numeric cap, so
# the lab's 131,072 output limit stands rather than inventing a number.
# Modalities: the host advertises text+image. PNG, GIF, WebP and JPEG data URIs were
# accepted on Chat Completions, Messages and Responses, and each returned "Blue" for a
# solid-blue image (live probes 2026-11-17). Video and PDF are not advertised.
# `store: true` is rejected: "This backend requires store=false and full input history;
# stored Responses are not available" (live probe 2026-11-17). `top_k` is accepted on all
# three APIs (live probes 2026-11-17), and the lab metadata already has `top_k = true`.
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, default = { type = "effort", value = "max" }, effort = ["low", "high", "max"] }
structured_output = true
store = false
cache = { implicit = true }

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.07
cache = { read = 0.025 }

[cost.text.output]
price = 0.15
