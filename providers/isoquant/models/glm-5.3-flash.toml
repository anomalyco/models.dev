# Source: https://api.isoquant.ai/v1/models and https://isoquant.ai/ (2026-10-18).
# Effort: reasoning_effort = low|high|max; reasoning is always on.
# Input and output share the context window; output is a capacity bound.
base_model = "zhipuai/glm-5.3-flash"
reasoning_options = [{ type = "effort", values = ["low", "high", "max"] }]

[cost]
input = 0.09
output = 0.35
cache_read = 0.03

[limit]
context = 1_048_576
output = 1_048_576

[modalities]
input = ["text", "image"]

[interleaved]
field = "reasoning_content"
