# Listed as retired; the plans now include only MiniMax-M3.1-Flash
#   (https://platform.minimax.io/docs/faq/models, https://platform.minimax.io/docs/m-plan/intro).
# Thinking is always on; thinking.type = disabled is accepted and ignored.
# Tools: tool_choice supports only auto (ToolChoice schema); no strict tool mode documented
#   (https://platform.minimax.io/docs/api-reference/text-chat-anthropic).
schema = 2
name = "MiniMax-M2"
description = "MiniMax model for chat, coding, office work, and agentic tasks"
family = "minimax"
open_weights = true
release_date = "2025-10-27"
status = "deprecated"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto"] }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = false

[limit]
context = 204_800
output = 131_072

[api.messages]

[api.chat-completions]
base_url = "https://api.minimax.io/v1"
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/minimax/chat" }
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
base_url = "https://api.minimax.io/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/minimax/responses" }

[cost.text.input]
price = 0

[cost.text.output]
price = 0
