# Thinking is always on (disabled returns 400); depth via output_config.effort /
# reasoning_effort = low|medium|high|xhigh|max, default max.
# https://platform.minimax.io/docs/api-reference/text-anthropic-api
# https://platform.minimax.io/docs/api-reference/text-openai-api
schema = 2
base_model = "minimax/MiniMax-M3.1-Flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
