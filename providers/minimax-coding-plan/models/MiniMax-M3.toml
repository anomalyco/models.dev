# Sources (accessed 2026-10-19):
# - API: https://platform.minimax.io/docs/api-reference/text-anthropic-api, https://platform.minimax.io/docs/api-reference/text-chat-anthropic
# - Caching: https://platform.minimax.io/docs/api-reference/text-prompt-caching
# - Plan: https://platform.minimax.io/docs/m-plan/intro (subscription quota, no per-token price)
# - Context: https://platform.minimax.io/docs/guides/text-generation lists 1,000,000 tokens; max_tokens up to 524,288.
# Toggle: thinking.type = adaptive|disabled. On the Anthropic-compatible API thinking is off when
#   `thinking` is omitted; output_config.effort is ignored.
# Caching: automatic prefix cache from 512 input tokens; cache_control is not supported.
# tool_choice: only auto (ToolChoice schema); any/tool/none are accepted and ignored.
# Structured output: not documented; output_format/output_config.format are accepted but the
#   schema is not enforced.
# Mid-conversation: role "system" messages after the first turn are accepted in place and keep
#   the cache (the documented mid_conv_system block is accepted too). Changing the tool list drops
#   the cache (prefix order is tools → system → messages).
# Live checks on api.minimax.io, 2026-10-19.
# Per-API flags: system_updates sits on [api.messages] only. The late system message was checked in place on the Anthropic-compatible Messages endpoint (live 2026-10-23); Chat Completions dropped it in a passthrough test, and Responses has no documented or tested in-place system message.
schema = 2
name = "MiniMax-M3"
description = "MiniMax multimodal coding model for long-context reasoning and agent tasks"
family = "minimax"
open_weights = true
release_date = "2026-06-01"
last_updated = "2026-06-25"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "video/mp4", "video/x-msvideo", "video/quicktime", "video/x-matroska"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto"], updates = false }
reasoning = { supported = true, default = { type = "toggle", value = false }, toggle = true }
structured_output = false
temperature = true
top_p = true
top_k = false
cache = { implicit = { min_tokens = 512 } }

[limit]
context = 1_000_000
output = 524_288

[api.messages]
capabilities = { system_updates = true }

[api.chat-completions]
base_url = "https://api.minimax.io/v1"
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/minimax/chat" }
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
base_url = "https://api.minimax.io/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/minimax/responses" }

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
