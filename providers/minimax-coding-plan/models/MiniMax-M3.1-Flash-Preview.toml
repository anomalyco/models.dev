# MiniMax-M3.1-Flash-Preview is Token Plan / MiniMax Code only with 1M context.
# Sources (accessed 2026-09-27):
# - https://platform.minimax.io/docs/api-reference/api-overview
# - https://platform.minimax.io/docs/api-reference/text-anthropic-api
# - https://platform.minimax.io/docs/api-reference/text-openai-api
# - https://platform.minimax.io/docs/guides/text-generation
# - https://platform.minimax.io/docs/guides/models-intro
# Thinking is always on (disabled returns 400); depth via output_config.effort /
# reasoning_effort = low|medium|high|xhigh|max, default max.
name = "MiniMax-M3.1-Flash-Preview"
description = "Frontier multimodal coding model with 1M context window and tunable thinking depth"
family = "minimax"
release_date = "2026-09-27"
last_updated = "2026-09-27"
attachment = true
reasoning = true
temperature = true
tool_call = true
open_weights = false

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh", "max"]

[cost]
input = 0
output = 0
cache_read = 0
cache_write = 0

[limit]
context = 1_000_000
output = 512_000

[modalities]
input = ["text", "image", "video"]
output = ["text"]
