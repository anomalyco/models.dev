# Latest alias. Effort: reasoning_effort = none|low|medium|xhigh (OpenAI-compatible request
# field; Callstack's CLI defaults it to "medium" and exposes exactly these four levels).
# Anthropic-compatible shape is served on the same host at POST /v1/messages.
#
# Model ID — evidence that "callstack/Apex" is the `model` string this API receives
# (public sources, accessed 2026-10-14):
# - https://github.com/callstack/apex-cli (MIT) pins it in src/assistants.js#L22-L29: the
#   `callstack` provider sets model: 'callstack/Apex' with baseUrl 'https://api.callstack.ai/v1',
#   and writes it into the OpenCode / Codex / Copilot / Pi configs it generates and to `--model`.
#   Pinned blob: https://raw.githubusercontent.com/callstack/apex-cli/beb91307a6a0dcfc627ca758ade41d3cc951546b/src/assistants.js
# - Same constants ship in the published package every user runs:
#   https://registry.npmjs.org/@callstack/apex/-/apex-0.4.2.tgz (npm shasum
#   270a55deb1667ea6e26bb4d0c9ab60f2f440112a), and the README's provider table lists
#   "Callstack portal | `callstack` | `callstack/Apex`".
# - Callstack's own RN benchmark posts it the same way: the live payload at
#   https://rn-evals.vercel.app reports solverModel "apex/callstack/Apex", where the `apex/`
#   prefix selects api.callstack.ai and the remainder is the upstream model id.
# Callstack's model page (https://apex.callstack.com/models) documents the same alias as the
# bare `apex`; the pinned snapshot next to this file is `apex-20261001`.
base_model = "callstack/apex"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "xhigh"]

[cost]
input = 0.50
output = 3.00
cache_read = 0.20
