# Pinned snapshot of Apex. The "callstack/Apex" alias always points at the newest one.
# Served `model` string documented on the model page, alongside the alias:
# https://apex.callstack.com/models ("apex-20261001 | Pinned snapshot | Generally available |
# 1 October 2026"). A pinned snapshot never changes while it is available, and Callstack gives
# at least six months' notice before retiring one.
base_model = "callstack/apex"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "xhigh"]

[cost]
input = 0.50
output = 3.00
cache_read = 0.20
