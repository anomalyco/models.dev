# FX: Hubris bills in RUB. USD/MTok below = public RUB price (https://hubris.pw/models, read 2026-10-31) / Bank of Russia official rate 80.5573 RUB/USD (2026-10-31), rounded to 4 decimals.
# RUB/MTok: input 631.18, output 3155.91, cache read 63.12, cache write 788.98 (5m) / 1262.36 (1h).
# Reasoning controls: as providers/openrouter/models/anthropic/claude-opus-4.7.toml; Hubris takes the OpenRouter-style reasoning object (https://hubris.pw/docs/features/reasoning).
# Effort: reasoning.effort (or top-level reasoning_effort) = none|low|medium|high|xhigh|max; off is effort none, so no toggle
# Cache: explicit cache_control markers, ttl "5m" (default) or "1h" (https://hubris.pw/docs/features/prompt-caching).
schema = 2
base_model = "anthropic/claude-opus-4-7"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { explicit = { ttl = ["5m", "1h"] } }

[cost.text.input]
price = 7.8352
cache = { read = 0.7835, write = { "5m" = 9.794, "1h" = 15.6703 } }

[cost.text.output]
price = 39.176
