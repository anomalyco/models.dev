# FX: Hubris bills in RUB. USD/MTok below = public RUB price (https://hubris.pw/models, read 2026-11-21) / Bank of Russia official rate 82.1911 RUB/USD (2026-11-21), rounded to 4 decimals.
# RUB/MTok: input 5.59, output 37.87, cache read 4.42.
# Reasoning controls: as providers/openrouter/models/deepseek/deepseek-v4-flash-0731.toml where it exists; Hubris takes the OpenRouter-style reasoning object and normalises reasoning_effort (https://hubris.pw/docs/features/reasoning).
# Reasoning side channel: message.reasoning / delta.reasoning. reasoning_field is left out on purpose: v2 allows "reasoning" but v1 interleaved.field does not.
# Cache: automatic, no cache_control markers (https://hubris.pw/docs/features/prompt-caching).
schema = 2
base_model = "deepseek/deepseek-v4-flash-0731"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.0680
cache = { read = 0.0538 }

[cost.text.output]
price = 0.4608
