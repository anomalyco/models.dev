# FX: Hubris bills in RUB. USD/MTok below = public RUB price (https://hubris.pw/models, read 2026-11-21) / Bank of Russia official rate 82.1911 RUB/USD (2026-11-21), rounded to 4 decimals.
# RUB/MTok: input 113.61, output 189.35, cache read 25.25.
# Reasoning controls: as providers/openrouter/models/deepseek/deepseek-v4-pro.toml where it exists; Hubris takes the OpenRouter-style reasoning object and normalises reasoning_effort (https://hubris.pw/docs/features/reasoning).
# Reasoning side channel: message.reasoning / delta.reasoning. reasoning_field is left out on purpose: v2 allows "reasoning" but v1 interleaved.field does not.
# Cache: automatic, no cache_control markers (https://hubris.pw/docs/features/prompt-caching).
schema = 2
base_model = "deepseek/deepseek-v4-pro"

[capabilities]
reasoning = { supported = true, effort = ["none", "high", "xhigh"] }
structured_output = true
cache = { implicit = true }

