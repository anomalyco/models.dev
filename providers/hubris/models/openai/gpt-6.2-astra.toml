# FX: Hubris bills in RUB. USD/MTok below = public RUB price (https://hubris.pw/models, read 2026-11-21) / Bank of Russia official rate 82.1911 RUB/USD (2026-11-21), rounded to 4 decimals.
# RUB/MTok: input 1009.89, output 5049.46, cache read 50.49, cache write 1262.36.
# Reasoning controls: as providers/openrouter/models/openai/gpt-6.2-astra.toml where it exists; Hubris takes the OpenRouter-style reasoning object and normalises reasoning_effort (https://hubris.pw/docs/features/reasoning).
# Reasoning side channel: message.reasoning / delta.reasoning. reasoning_field is left out on purpose: v2 allows "reasoning" but v1 interleaved.field does not.
# Cache: automatic; Hubris also bills cache writes (https://hubris.pw/docs/features/prompt-caching).
schema = 2
base_model = "openai/gpt-6.2-astra"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 12.2871
cache = { read = 0.6143, write = 15.3588 }

[cost.text.output]
price = 61.4356

[cost.web_search]
price = 15.33
