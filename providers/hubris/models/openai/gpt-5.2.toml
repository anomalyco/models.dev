# FX: Hubris bills in RUB. USD/MTok below = public RUB price (https://hubris.pw/models, read 2026-11-21) / Bank of Russia official rate 82.1911 RUB/USD (2026-11-21), rounded to 4 decimals.
# RUB/MTok: input 220.91, output 1767.31, cache read 22.09.
# Reasoning controls: as providers/openrouter/models/openai/gpt-5.2.toml where it exists; Hubris takes the OpenRouter-style reasoning object and normalises reasoning_effort (https://hubris.pw/docs/features/reasoning).
# Reasoning side channel: message.reasoning / delta.reasoning. reasoning_field is left out on purpose: v2 allows "reasoning" but v1 interleaved.field does not.
# Cache: automatic, no cache_control markers (https://hubris.pw/docs/features/prompt-caching).
schema = 2
base_model = "openai/gpt-5.2"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true
cache = { implicit = true }
# Provider delta: the gateway does not expose temperature, top_p (catalogue supported_parameters).
temperature = false
top_p = false

[cost.text.input]
price = 2.6878
cache = { read = 0.2688 }

[cost.text.output]
price = 21.5024

[cost.web_search]
price = 15.33
