schema = 2
name = "GPT-5.4 Mini"
description = "Compact GPT model for low-latency assistance and high-volume workloads"
family = "gpt-mini"
open_weights = false
knowledge = "2025-08-31"
release_date = "2026-03-17"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
temperature = false

[limit]
context = 400_000
output = 128_000

[cost.text.input]
price = 0.75
cache = { read = 0.075 }

[cost.text.output]
price = 4.5
