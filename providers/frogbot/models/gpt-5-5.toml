# Price: https://docs.frogbot.ai/api-reference/models (accessed 2026-10-21)
# knowledge: FrogBot's value, unsourced and different from the lab's. Kept so v1 doesn't change.
schema = 2
base_model = "openai/gpt-5.5"
base_model_omit = ["limit.input"]
description = "Frontier GPT model for professional reasoning, coding, and multimodal work"
knowledge = "2025-08-31"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[limit]
context = 272_000

[cost.text.input]
price = 5
cache = { read = 0.5 }

[cost.text.output]
price = 30
