schema = 2
name = "Gemini 2.5 Flash"
description = "Fast Gemini model balancing multimodal reasoning, tool use, and cost"
family = "gemini-flash"
open_weights = false
knowledge = "2025-01"
release_date = "2025-07-17"

[modalities]
input = ["text", "image", "audio", "video", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, budget = { min = 0, max = 24_576 } }
temperature = true

[limit]
context = 1_048_576
output = 65_536

[cost.text.input]
price = 0.3
cache = { read = 0.075 }

[cost.text.output]
price = 2.5
