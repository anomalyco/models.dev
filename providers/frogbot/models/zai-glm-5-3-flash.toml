# Relayed to Fireworks (accounts/fireworks/models/glm-5p3-flash).
# FrogBot's LiteLLM proxy forwards reasoning_effort and thinking to Fireworks
# unchanged (fireworks_ai chat config; litellm 1.94.0).
# Thinking-only: cannot be disabled. Effort: reasoning_effort = low|high|max,
# three distinct tiers per providers/fireworks-ai/.../glm-5p3-flash.toml.
# https://docs.fireworks.ai/api-reference/post-chatcompletions
# https://docs.frogbot.ai/api-reference/chat-completions
schema = 2
base_model = "zhipuai/glm-5.3-flash"
name = "GLM 5.3 Flash"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }

[limit]
context = 1_040_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.15
cache = { read = 0.029 }

[cost.text.output]
price = 0.5
