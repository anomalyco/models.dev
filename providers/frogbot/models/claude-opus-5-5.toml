# Routed by FrogBot's LiteLLM proxy (litellm 1.104.0) to Bedrock /converse
# (bedrock/global.anthropic.claude-opus-5-5).
# Effort: reasoning_effort = low|medium|high|xhigh|max, forwarded unchanged as
# additionalModelRequestFields.output_config.effort (thinking.type = adaptive).
# Thinking is always on: LiteLLM drops thinking.type = disabled for this model.
# https://docs.frogbot.ai/api-reference/chat-completions
schema = 2
base_model = "anthropic/claude-opus-5-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 4
cache = { read = 0.2, write = 5 }

[cost.text.output]
price = 20
