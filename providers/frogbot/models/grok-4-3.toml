# knowledge: FrogBot's value, unsourced (the lab states none). Kept so v1 doesn't change.
schema = 2
base_model = "xai/grok-4.3"
description = "Grok model for agentic tool use, reasoning, coding, and live assistance"
knowledge = "2024-11"

[modalities]
input = ["text", "image/jpeg", "image/png", "video"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
output = 128_000

[cost.text.input]
price = 1.25
cache = { read = 0.2 }

[cost.text.output]
price = 2.5
