# Routed by FrogBot's LiteLLM proxy (litellm 1.104.0) to Bedrock /converse
# (bedrock/global.anthropic.claude-haiku-5-5).
# Effort: reasoning_effort = low|medium|high|xhigh|max, forwarded unchanged as
# additionalModelRequestFields.output_config.effort (thinking.type = adaptive).
# Toggle: thinking = { type = "disabled" } is forwarded unchanged, as on the
# amazon-bedrock global.anthropic.claude-haiku-5-5 peer.
# Structured output: response_format json_schema becomes a forced Converse tool, the same
# request as the other Claude models here (litellm 1.104.0 dry run, 2026-10-25), as on the
# amazon-bedrock global.anthropic.claude-haiku-5-5 peer.
# https://docs.frogbot.ai/api-reference/chat-completions
schema = 2
base_model = "anthropic/claude-haiku-5-5"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 0.1
cache = { read = 0.01, write = 0.125 }

[cost.text.output]
price = 0.5
