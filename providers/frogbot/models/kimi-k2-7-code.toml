# Relayed to Fireworks (kimi-k2p7-code). Thinking is always on; no caller control.
# https://docs.fireworks.ai/guides/reasoning
schema = 2
base_model = "moonshotai/kimi-k2.7-code"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true }

[limit]
output = 32_768

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.95
cache = { read = 0.19 }

[cost.text.output]
price = 4
