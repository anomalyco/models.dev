# Routed by FrogBot's LiteLLM proxy (litellm 1.104.0) to Bedrock /converse
# (bedrock/global.anthropic.claude-opus-5).
# Effort: reasoning_effort = low|medium|high|xhigh|max, forwarded unchanged as
# additionalModelRequestFields.output_config.effort (thinking.type = adaptive).
# Toggle: thinking = { type = "disabled" } is forwarded unchanged, as on the
# amazon-bedrock global.anthropic.claude-opus-5 peer.
# https://docs.frogbot.ai/api-reference/chat-completions
schema = 2
base_model = "anthropic/claude-opus-5"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 5
cache = { read = 0.5, write = 6.25 }

[cost.text.output]
price = 25
