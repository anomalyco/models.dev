# Relayed to Fireworks (minimax-m3); reasoning params pass through.
# Effort: reasoning_effort = low|medium|high
# https://docs.fireworks.ai/guides/reasoning
# https://docs.frogbot.ai/api-reference/chat-completions
schema = 2
base_model = "minimax/MiniMax-M3"
name = "MiniMax M3"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[limit]
context = 524_288
output = 131_072

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.3
cache = { read = 0.06 }

[cost.text.output]
price = 1.2
