# Relayed to Fireworks (minimax-m3); reasoning params pass through.
# Effort: reasoning_effort = low|medium|high
# Serving: Fireworks lists text input only and context_length 512000 for minimax-m3
# (GET https://api.fireworks.ai/v1/serverless/models, per providers/fireworks-ai/.../minimax-m3.toml),
# so input and context sit at the upstream limit, below the lab's 1M with image and video.
# https://docs.fireworks.ai/guides/reasoning
# https://docs.frogbot.ai/api-reference/chat-completions
schema = 2
base_model = "minimax/MiniMax-M3"
name = "MiniMax M3"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[limit]
context = 512_000
output = 131_072

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.3
cache = { read = 0.06 }

[cost.text.output]
price = 1.2
