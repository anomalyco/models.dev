# Retired: absent from https://docs.frogbot.ai/api-reference/models (accessed 2026-10-21).
schema = 2
base_model = "alibaba/qwen3.6-plus"
name = "Qwen 3.6 Plus"
description = "Qwen vision-language model for visual reasoning, documents, and agent tasks"
status = "deprecated"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true }

[limit]
output = 64_000

[cost.text.input]
price = 0.5
cache = { read = 0.1 }

[cost.text.output]
price = 3
