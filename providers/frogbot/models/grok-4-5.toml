# Routed by FrogBot's LiteLLM proxy (litellm 1.104.0) to xAI /v1/chat/completions (xai/grok-4.5).
# Effort: reasoning_effort = low|medium|high|xhigh, forwarded unchanged (mocked-network
# dry run, 2026-10-25); levels match providers/xai/models/grok-4.5.toml.
# https://docs.frogbot.ai/api-reference/chat-completions
schema = 2
base_model = "xai/grok-4.5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }

[limit]
output = 128_000

[cost.text.input]
price = 2
cache = { read = 0.3 }

[cost.text.output]
price = 6
