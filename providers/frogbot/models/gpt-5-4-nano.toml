schema = 2
name = "GPT-5.4 Nano"
description = "Compact GPT model for low-latency assistance and high-volume workloads"
family = "gpt-nano"
open_weights = false
knowledge = "2024-05-30"
release_date = "2025-08-07"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
temperature = false

[limit]
context = 400_000
output = 128_000

[cost.text.input]
price = 0.2
cache = { read = 0.02 }

[cost.text.output]
price = 1.25
