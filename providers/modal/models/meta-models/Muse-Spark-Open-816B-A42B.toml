# Library page https://modal.com/library/meta/muse-spark-open (accessed 2026-10-21): Shared Endpoint model ID meta-models/Muse-Spark-Open-816B-A42B;
#   prompt $1.25, cached prompt $0.15, completion $4.25 per MTok; modalities "Text, Image, Video, Audio" (the lab's);
#   Modal documents no reasoning control; the lab documents
#   reasoning_effort low|medium|high|xhigh (default xhigh) and reasoning that cannot be disabled, so that is assumed here.
# Modal Shared Endpoints (https://modal.com/docs/guide/endpoints): Chat Completions, Responses and Anthropic Messages APIs,
#   automatic prefix KV cache with Modal-Routing-Affinity-Key routing.
schema = 2
base_model = "meta/muse-spark-open"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "xhigh" }, effort = ["low", "medium", "high", "xhigh"] }
cache = { supported = true, implicit = true }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.25
cache = { read = 0.15 }

[cost.text.output]
price = 4.25
