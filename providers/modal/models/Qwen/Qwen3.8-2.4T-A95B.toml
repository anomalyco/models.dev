# Modal Shared Endpoint model ID: Qwen/Qwen3.8-2.4T-A95B.
# Pricing is USD per 1M tokens: prompt $2.00, cached prompt $0.25,
# and completion $6.00.
# Modal documents text-only input, context up to 1,010,000 tokens, and
# adjustable reasoning effort with low, medium, and xhigh levels.
# https://modal.com/library/qwen/qwen3-8-max
# https://modal.com/blog/qwen3-8-2-4t-a95b-now-available-on-modal
# https://huggingface.co/Qwen/Qwen3.8-2.4T-A95B
# Modal Shared Endpoints (https://modal.com/docs/guide/endpoints, accessed 2026-10-21): text models are served on the
#   OpenAI Chat Completions and Responses APIs and the Anthropic Messages API, billed per token. Serving engines cache
#   the KV state of a prompt prefix automatically; the Modal-Routing-Affinity-Key header keeps a conversation on one
#   container so the cached prefix is reused, and cached prompt tokens have their own price.
# Mid-conversation behavior is undocumented and could not be probed (no key), so those flags stay unset.
# Library page (accessed 2026-10-21): prompt $2.00, cached prompt $0.25, completion $6.00 per MTok; modalities "Text";
#   "262K native, up to 1.01M" context.
schema = 2
base_model = "alibaba/qwen3.8-2.4t-a95b"
name = "Qwen3.8-Max"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "xhigh"] }
cache = { supported = true, implicit = true }
structured_output = true

[limit]
context = 1_010_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 2
cache = { read = 0.25 }

[cost.text.output]
price = 6
