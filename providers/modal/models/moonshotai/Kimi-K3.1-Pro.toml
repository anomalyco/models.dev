# https://modal.com/library/moonshot/kimi-k3-1-pro documents pricing, the 1,048,576-token context, and text and image input.
# The image types come from the lab model. Structured output follows Kimi K3 on the same Modal API.
# Modal's Shared Endpoint is assumed to use Moonshot's native reasoning_effort levels (low, high, max; default max).
# https://platform.kimi.ai/docs/guide/kimi-k3-1-pro-quickstart documents these levels and always-on reasoning.
# https://modal.com/docs/guide/endpoints documents the supported APIs and automatic prefix caching.
schema = 2
base_model = "moonshotai/kimi-k3.1-pro"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"], default = { type = "effort", value = "max" } }
cache = { implicit = true }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 2
cache = { read = 0.2 }

[cost.text.output]
price = 10
