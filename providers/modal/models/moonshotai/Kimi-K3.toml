# Modal Shared API model ID: moonshotai/Kimi-K3.
# Pricing is USD per 1M tokens: prompt $3.00, cached prompt $0.30,
# completion $15.00, and reasoning $15.00.
# Modal documents text and native vision through its OpenAI-compatible Shared API.
# No Modal-documented reasoning control surface has been verified.
# https://modal.com/library/moonshot/kimi-k3
# https://modal.com/blog/kimi-k3-by-moonshot-now-available-on-modal
# https://modal.com/docs/guide/endpoints
# Modal Shared Endpoints (https://modal.com/docs/guide/endpoints, accessed 2026-10-21): text models are served on the
#   OpenAI Chat Completions and Responses APIs and the Anthropic Messages API, billed per token. Serving engines cache
#   the KV state of a prompt prefix automatically; the Modal-Routing-Affinity-Key header keeps a conversation on one
#   container so the cached prefix is reused, and cached prompt tokens have their own price.
# Mid-conversation behavior is undocumented and could not be probed (no key), so those flags stay unset.
# Library page (accessed 2026-10-21): prompt $3.00, cached prompt $0.30, completion $15.00 per MTok; modalities
#   "Text & image", so input is text plus the lab's image types (no video). The page no longer lists a separate
#   reasoning price; the earlier $15.00 (equal to completion) is kept.
schema = 2
base_model = "moonshotai/kimi-k3"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
cache = { implicit = true }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 3
cache = { read = 0.3 }

[cost.text.output]
price = 15
reasoning = 15
