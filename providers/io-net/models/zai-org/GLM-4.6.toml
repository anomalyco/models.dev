# Prices: GET https://api.intelligence.io.solutions/api/v1/models input/output/cache_read_token_price (USD per token, 2026-10-21); io.net documents this endpoint as the pricing source and lists no cache-write price.
# Effort: reasoning.effort = none|low|medium|high (none disables); GET /api/v1/models lists supports_reasoning = true (2026-10-21). https://io.net/docs/guides/intelligence/reasoning-for-chat-completions
# knowledge: unsourced host value kept from the v1 file so v1 doesn't change.
schema = 2
base_model = "zhipuai/glm-4.6"
name = "GLM 4.6"
description = "Flagship GLM model for hybrid reasoning, coding, and agentic engineering"
knowledge = "2024-10"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }

[limit]
context = 200_000
output = 4_096

[cost.text.input]
price = 0.52
cache = { read = 0.26 }

[cost.text.output]
price = 2.0375
