# Prices: GET https://api.intelligence.io.solutions/api/v1/models input/output/cache_read_token_price (USD per token, 2026-10-21); io.net documents this endpoint as the pricing source and lists no cache-write price.
schema = 2
base_model = "moonshotai/kimi-k2-thinking"
description = "Kimi reasoning model for long-horizon research, planning, and tool use"

[capabilities]
reasoning = { supported = true }

[limit]
context = 32_768
output = 4_096

[cost.text.input]
price = 0.6
cache = { read = 0.3 }

[cost.text.output]
price = 2.5
