# io.net IO Intelligence listing of openai/gpt-oss-120b.
# Effort: reasoning.effort = low|medium|high
# Live check 2026-10-13: reasoning.effort = "none" and reasoning.enabled = false are rejected with HTTP 400; reasoning_tokens low 142-182, medium 219-240, high 355-877.
# Prices, limits, modalities and capability flags come from GET https://api.intelligence.io.solutions/api/v1/models (public, USD per token, read 2026-10-26); reasoning controls were verified live against POST /chat/completions on 2026-10-13 (see provider.toml).
# Cache: /api/v1/models reports supports_prompt_cache = true and a cache_read_token_price; prefixes are cached automatically with no cache_control markers, so the cache is implicit.
# knowledge: unsourced host value kept from the v1 file so v1 doesn't change.
schema = 2
base_model = "openai/gpt-oss-120b"
name = "GPT-OSS 120B"
description = "Open-weight GPT model for self-hosted reasoning and instruction-following workloads"
knowledge = "2024-10"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.168
cache = { read = 0.084 }

[cost.text.output]
price = 0.63
