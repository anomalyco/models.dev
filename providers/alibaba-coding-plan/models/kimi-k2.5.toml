# Reasoning HTTP format (accessed 2026-06-25):
# Coding Plan exact-string allowlist model. Hybrid thinking uses top-level
# `enable_thinking`: true enables; false (default) disables. No effort or numeric
# budget bound is documented specifically for the plan endpoint.
# Sources:
# https://www.alibabacloud.com/help/en/model-studio/coding-plan
# https://www.alibabacloud.com/help/en/model-studio/kimi-api
# Mid-conversation: tools are a request-level parameter with no add/remove mechanism (tools.updates = false); not probed live (no plan key), so system_updates is left unset. Chat API: https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions (the DeepSeek, Kimi and MiniMax series do not support top_k).
# Input MIME types: Model Studio's Kimi doc (https://www.alibabacloud.com/help/en/model-studio/kimi-api) lists no formats, so the moonshotai/kimi-k2.5 lab's list is used.
schema = 2
name = "Kimi K2.5"
description = "Kimi multimodal agent model for visual understanding, coding, and planning"
family = "kimi-k2"
open_weights = true
knowledge = "2025-01"
release_date = "2026-01-27"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif", "video/mp4", "video/mpeg", "video/mov", "video/avi", "video/x-flv", "video/mpg", "video/webm", "video/wmv", "video/3gpp"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true }
temperature = true
top_k = false
effort_updates = false

[limit]
context = 262_144
output = 32_768

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
