# Mid-conversation: tools are a request-level parameter with no add/remove mechanism (tools.updates = false); not probed live (no plan key), so system_updates is left unset. Chat API: https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions.
# Input MIME types: images and video per https://www.alibabacloud.com/help/en/model-studio/vision (Image limits covers the Qwen-VL, QVQ and Qwen2.5-VL/Qwen3-VL series; video lists extensions, registered MIME types used).
# Tools: tool_choice auto|none|named on every API, plus required (`any`) on Anthropic Messages; no strict tool mode (sources in provider.toml).
schema = 2
name = "Qwen3.6 Plus"
description = "Qwen vision-language model for visual reasoning, documents, and agent tasks"
family = "qwen"
open_weights = false
knowledge = "2025-04"
release_date = "2026-04-02"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic", "video/mp4", "video/x-msvideo", "video/x-matroska", "video/quicktime", "video/x-flv", "video/x-ms-wmv"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none", "tool"] }
reasoning = { supported = true, toggle = true }
temperature = true

[limit]
context = 1_000_000
output = 65_536

[api.chat-completions]

[api.messages]
base_url = "https://coding-intl.dashscope.aliyuncs.com/apps/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/alibaba/messages" }
capabilities = { tools = { choice = ["auto", "none", "required", "tool"] } }

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
