# Reasoning HTTP format (accessed 2026-06-25):
# Coding Plan exact-string allowlist model. Hybrid thinking is on by default and
# top-level `enable_thinking`: true|false toggles it. No effort/budget documented.
# Sources:
# https://www.alibabacloud.com/help/en/model-studio/coding-plan
# https://www.alibabacloud.com/help/en/model-studio/deep-thinking
# Mid-conversation: tools are a request-level parameter with no add/remove mechanism (tools.updates = false); not probed live (no plan key), so system_updates is left unset. Chat API: https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions.
schema = 2
name = "GLM-5"
description = "Flagship GLM model for hybrid reasoning, coding, and agentic engineering"
family = "glm"
open_weights = false
release_date = "2026-02-11"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true }
temperature = true
effort_updates = false

[limit]
context = 202_752
output = 16_384

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.messages]
base_url = "https://coding-intl.dashscope.aliyuncs.com/apps/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/alibaba/messages" }

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
