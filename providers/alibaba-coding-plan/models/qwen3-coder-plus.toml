# Reasoning HTTP format (accessed 2026-06-25):
# Coding Plan exact-string allowlist model. The plan docs document no reasoning
# toggle, effort, or numeric budget field for this model.
# Sources:
# https://www.alibabacloud.com/help/en/model-studio/coding-plan
# Status: no longer on the plan's supported model list (https://www.alibabacloud.com/help/en/model-studio/coding-plan, accessed 2026-10-19).
# max_tokens_field: Model Studio's Chat API lists this model outside max_completion_tokens support (https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions, accessed 2026-10-24)
# Tools: tool_choice auto|none on every API; no strict tool mode (sources in provider.toml).
schema = 2
name = "Qwen3 Coder Plus"
description = "Qwen coding model for software agents, repository edits, and code reasoning"
family = "qwen"
open_weights = true
knowledge = "2025-04"
release_date = "2025-07-23"
status = "deprecated"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none"] }
reasoning = { supported = false }
temperature = true

[limit]
context = 1_000_000
output = 65_536

[api.chat-completions]
compatibility = { max_tokens_field = "max_tokens" }

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
