# Sintaks.dev gateway pricing from https://api.sintaks.dev/v1/models (accessed 2026-11-12).
# Toggle: reasoning_effort = none disables thinking; graded levels otherwise
# Effort: reasoning_effort = low|medium|high (none disables thinking, expressed via the toggle)
schema = 2
base_model = "amazon/nova-2-lite"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high"] }

[cost.text.input]
price = 0.4455

[cost.text.output]
price = 3.7125
