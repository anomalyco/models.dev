# Sintaks.dev gateway pricing from https://api.sintaks.dev/v1/models (accessed 2026-11-12).
# Effort: reasoning_effort = none|low|medium|high|xhigh
schema = 2
base_model = "openai/gpt-5.3-codex"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }

[limit]
context = 400_000

[cost.text.input]
price = 3.85

[cost.text.output]
price = 30.8
