# Sintaks.dev gateway pricing from https://api.sintaks.dev/v1/models (accessed 2026-11-12).
# Freeform: unverified on the deployed chat-completions API; authenticated access needed.
# Gateway source (sintaks-dev-core 0be077c, internal/adapters/httpapi/openai.go) rejects non-function tools.
# Effort: reasoning_effort = low|medium|high|xhigh; xhigh follows relay peers.
schema = 2
base_model = "openai/gpt-5.1-codex-max"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }

[cost.text.input]
price = 1.6875

[cost.text.output]
price = 13.5
