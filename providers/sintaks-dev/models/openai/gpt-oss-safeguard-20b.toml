# Sintaks.dev gateway pricing from https://api.sintaks.dev/v1/models (accessed 2026-11-12).
# Effort: reasoning_effort = low|medium|high
schema = 2
base_model = "openai/gpt-oss-safeguard-20b"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[limit]
context = 128_000
output = 128_000

[cost.text.input]
price = 0.0945

[cost.text.output]
price = 0.27
