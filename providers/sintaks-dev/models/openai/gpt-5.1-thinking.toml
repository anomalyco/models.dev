# Sintaks.dev gateway pricing from https://api.sintaks.dev/v1/models (accessed 2026-11-12).
# Effort: reasoning_effort = none|low|medium|high
schema = 2
base_model = "openai/gpt-5.1"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }

[limit]
context = 400_000

[cost.text.input]
price = 1.6875

[cost.text.output]
price = 13.5
