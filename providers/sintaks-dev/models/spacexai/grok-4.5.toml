# Sintaks.dev gateway pricing from https://api.sintaks.dev/v1/models (accessed 2026-11-12).
# Effort: reasoning_effort = low|medium|high|xhigh
schema = 2
base_model = "xai/grok-4.5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }

[limit]
context = 500_000

[cost.text.input]
price = 5.4

[cost.text.output]
price = 16.2
