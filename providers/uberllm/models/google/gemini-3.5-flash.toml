# Source: https://api.uberllm.dev/api/v1/public/models (read 2026-10-30): listed price (price_now), context_length,
#   max_output_tokens, input_modalities. The listed price is what a request typically costs;
#   it follows the marketplace and the billed amount is in usage.cost_usd on every response.
# Lab model: google/gemini-3.5-flash (same id as providers/openrouter/models/google/gemini-3.5-flash.toml).
# Live probe 2026-10-30 on POST /v1/chat/completions:
# Tools: tool_choice auto returned a get_weather call (finish_reason stop).
# Reasoning: a plain request (harder prompt) returns no reasoning.
#   Second pass on a harder prompt (reasoning tokens): plain 0, reasoning_effort none 0 / high 0 +text, thinking 0 +text.
#   reasoning_effort accepted (reasoning tokens, +text = reasoning text returned): none 0, minimal 0 +text, low 0, medium 0, high 0, xhigh 0, max 0 +text.
#   Effort: reasoning_effort = minimal|low|medium|high (levels from the OpenRouter entry that this host accepted; none turned reasoning off and high turned it on).
# structured_output: response_format json_schema (strict) returned schema-valid JSON.
# Image input: a solid red PNG (data URL) was read correctly.
schema = 2
base_model = "google/gemini-3.5-flash"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 0.285

[cost.text.output]
price = 1.71
