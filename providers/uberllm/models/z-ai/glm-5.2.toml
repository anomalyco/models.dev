# Source: https://api.uberllm.dev/api/v1/public/models (read 2026-10-30): listed price (price_now), context_length,
#   max_output_tokens, input_modalities. The listed price is what a request typically costs;
#   it follows the marketplace and the billed amount is in usage.cost_usd on every response.
# Lab model: zhipuai/glm-5.2 (same id as providers/openrouter/models/z-ai/glm-5.2.toml).
# Live probe 2026-10-30 on POST /v1/chat/completions:
# Tools: tool_choice auto returned a get_weather call (finish_reason tool_calls).
# Reasoning: a plain request reasons (203 reasoning tokens, text in message.reasoning_content).
#   reasoning_effort accepted (reasoning tokens, +text = reasoning text returned): none 0, minimal 0, low 145 +text, medium 13 +text, high 96 +text, xhigh 0 +text, max 185 +text.
#   Effort: reasoning_effort = none|high|xhigh (levels from the OpenRouter entry that this host accepted; none turned reasoning off and high turned it on).
# structured_output: response_format json_schema (strict) returned schema-valid JSON.
# Cache: automatic prefix cache; 9 requests with cached prompt tokens in the last 14 days.
schema = 2
base_model = "zhipuai/glm-5.2"

[capabilities]
reasoning = { supported = true, effort = ["none", "high", "xhigh"] }
structured_output = true
cache = { implicit = true }

[limit]
output = 32_768

[cost.text.input]
price = 0.000558
cache = { read = 0.000465 }

[cost.text.output]
price = 0.4092
