# Model id, prices and limits: UberLLM's catalog, GET https://api.uberllm.dev/v1/models (2026-10-30).
# Prices are the listed price: it follows the market and is refreshed every 5 minutes; a call is billed what the serving provider charged.
# limit: the host's cap from the same catalog, where it is below the lab's.
# Toggle: thinking.type = enabled|disabled (disabled: 0 reasoning tokens; on by default here, 176). adaptive is rejected:
#   400 "thinking.type must be one of disabled, enabled, auto".
# modalities: text only. Asked to read a number from a PNG, 3 of 4 probes answered that they could not see the image (the same
#   image was read correctly by every other model in this PR).
#   Probed 2026-10-30 on /v1/chat/completions.
# cache: implicit; requests to this model report cached prompt tokens in UberLLM's request log (7 days to 2026-10-30).
schema = 2
base_model = "minimax/MiniMax-M3"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
cache = { implicit = true }

[limit]
context = 200_000
output = 32_768

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.186
cache = { read = 0.0372 }

[cost.text.output]
price = 0.744
