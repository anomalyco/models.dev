# Source: https://api.uberllm.dev/api/v1/public/models (read 2026-10-30): listed price (price_now), context_length,
#   max_output_tokens, input_modalities. The listed price is what a request typically costs;
#   it follows the marketplace and the billed amount is in usage.cost_usd on every response.
# Lab model: moonshotai/kimi-k3 (same id as providers/openrouter/models/moonshotai/kimi-k3.toml).
# Live probe 2026-10-30 on POST /v1/chat/completions:
# Tools: tool_choice auto returned a get_weather call (finish_reason tool_calls).
# Reasoning: a plain request reasons (89 reasoning tokens, text in message.reasoning_content).
#   reasoning_effort accepted (reasoning tokens, +text = reasoning text returned): none 0, minimal 47 +text, low 21 +text, medium 118 +text, high 86 +text, xhigh 97 +text, max 90 +text.
#   Effort: reasoning_effort = none|low|high|max (levels from the OpenRouter entry that this host accepted; none turned reasoning off and high turned it on).
# structured_output: response_format json_schema (strict) returned schema-valid JSON.
# Cache: automatic prefix cache; 648 requests with cached prompt tokens in the last 14 days.
# Image input: a solid red PNG (data URL) was read correctly.
schema = 2
base_model = "moonshotai/kimi-k3"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[limit]
output = 32_768

[cost.text.input]
price = 0.00576
cache = { read = 0.00546 }

[cost.text.output]
price = 0.45
