# Source: https://api.uberllm.dev/api/v1/public/models (read 2026-10-30): listed price (price_now), context_length,
#   max_output_tokens, input_modalities. The listed price is what a request typically costs;
#   it follows the marketplace and the billed amount is in usage.cost_usd on every response.
# Lab model: openai/gpt-oss-120b (same id as providers/openrouter/models/openai/gpt-oss-120b.toml).
# Live probe 2026-10-30 on POST /v1/chat/completions:
# Tools: tool_choice auto returned a get_weather call (finish_reason tool_calls).
# Reasoning: a plain request reasons (142 reasoning tokens, text in message.reasoning).
#   reasoning_effort accepted (reasoning tokens, +text = reasoning text returned): low 92 +text, medium 118 +text, high 93 +text.
#   reasoning_effort rejected with 4xx: none, minimal, xhigh, max.
#   Effort: reasoning_effort = low|medium|high (levels from the OpenRouter entry that this host accepted; the host rejects unknown levels).
# structured_output: response_format json_schema (strict) returned schema-valid JSON.
schema = 2
base_model = "openai/gpt-oss-120b"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 0.0056

[cost.text.output]
price = 0.024
