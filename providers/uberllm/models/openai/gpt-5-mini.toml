# Model id, prices and limits: UberLLM's catalog, GET https://api.uberllm.dev/v1/models (2026-11-04).
# Prices are the listed price: it follows the market and is refreshed every 5 minutes; a call is billed what the serving provider charged.
# Effort: reasoning_effort = minimal|low|medium|high (OpenAI's list; reasoning tokens 256 / 256 / 384 / 320 on a counting prompt).
# tools.freeform: left out. Custom tools (text, regex ZZ[0-9]{3}, lark) were accepted on /v1/chat/completions but the model
#   returned no custom tool call with tool_choice=required (live 2026-10-30).
#   Probed 2026-10-30 on /v1/chat/completions.
# cache: implicit. A ~7k-token prompt sent 3 times in a row, twice (live 2026-11-04): the repeats reported
#   prompt_tokens_details.cached_tokens = 6,528 of 6,634.
schema = 2
base_model = "openai/gpt-5-mini"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
cache = { implicit = true }

[cost.text.input]
price = 0.0675
cache = { read = 0.00675 }

[cost.text.output]
price = 0.54
