# Source: https://api.uberllm.dev/api/v1/public/models (read 2026-10-30): listed price (price_now), context_length,
#   max_output_tokens, input_modalities. The listed price is what a request typically costs;
#   it follows the marketplace and the billed amount is in usage.cost_usd on every response.
# Lab model: openai/gpt-6.1-sol (same id as providers/openrouter/models/openai/gpt-6.1-sol.toml).
# Live probe 2026-10-30 on POST /v1/chat/completions:
# Tools: tool_choice auto returned a get_weather call (finish_reason tool_calls).
# Reasoning: a plain request (harder prompt) reasons (0 reasoning tokens, text in message.reasoning_content).
#   Second pass on a harder prompt (reasoning tokens): plain 0 +text, reasoning_effort none 0 +text / high 0, thinking 103.
#   reasoning_effort accepted (reasoning tokens, +text = reasoning text returned): none 21, minimal 0, low 0, medium 0, high 0, xhigh 0, max 21.
#   reasoning_effort was accepted at every level with no on/off difference, so no effort control is claimed.
# structured_output: response_format json_schema (strict) returned schema-valid JSON.
# Cache: automatic prefix cache; 24 requests with cached prompt tokens in the last 14 days.
# Image input: a solid red PNG (data URL) was read correctly.
schema = 2
base_model = "openai/gpt-6.1-sol"

[capabilities]
reasoning = { supported = true }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.98
cache = { read = 0.049 }

[cost.text.output]
price = 4.9
