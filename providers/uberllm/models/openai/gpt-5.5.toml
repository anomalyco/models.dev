# Model id, prices and limits: UberLLM's catalog, GET https://api.uberllm.dev/v1/models (2026-10-30).
# Prices are the listed price: it follows the market and is refreshed every 5 minutes; a call is billed what the serving provider charged.
# limit: the host's cap from the same catalog, where it is below the lab's.
# Effort: reasoning_effort = none|low|medium|high|xhigh, passed through (OpenAI's own list). Every value was accepted; on a
#   counting prompt reasoning tokens were 89 / 105 / 123 / 94 / 116, so how strongly effort applies depends on the serving provider.
# tools.freeform: left out. Custom tools (text, regex ZZ[0-9]{3}, lark) were accepted on /v1/chat/completions but the model
#   returned no custom tool call with tool_choice=required (live 2026-10-30).
#   Probed 2026-10-30 on /v1/chat/completions.
schema = 2
base_model = "openai/gpt-5.5"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }

[limit]
context = 1_000_000

[cost.text.input]
price = 1.15

[cost.text.output]
price = 6.9
