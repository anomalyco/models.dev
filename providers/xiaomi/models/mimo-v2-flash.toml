# Toggle: thinking.type = enabled|disabled (default disabled, per the provider docs accessed 2026-06-25)
# Retired 2026-06-30 (requests routed to mimo-v2.5 from June 2026): https://mimo.mi.com/static/docs/updates/deprecate.md
# Prices are the last ones catalogued before retirement.
# Live 2026-10-21: api.xiaomimimo.com answers "Unsupported model mimo-v2-flash" (400) on Chat Completions.
schema = 2
base_model = "xiaomi/mimo-v2-flash"
description = "Legacy model retained for compatibility with older integrations"
status = "deprecated"

[capabilities]
reasoning = { supported = true, default = { type = "toggle", value = false }, toggle = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.14
cache = { read = 0.0028 }

[cost.text.output]
price = 0.28
