# Toggle: thinking.type = enabled|disabled (default enabled; Responses reasoning.effort only maps none -> off,
#   every other level -> on, so no graded effort is authored)
# Sources (Xiaomi MiMo docs, accessed 2026-10-21):
# - Overseas prices, USD per 1M tokens (https://mimo.mi.com/static/docs/price/pay-as-you-go.md). Cache writes are free for a limited
#   time (no write surcharge). The Batch API (half price, separate base URL) is not modeled.
# - Models (1M context, 128K max output): https://mimo.mi.com/static/docs/quick-start/summary/model.md
# - Chat Completions (https://mimo.mi.com/static/docs/api/chat/openai-api.md): thinking.type = enabled|disabled, default enabled;
#   max_completion_tokens <= 131072; tool_choice only "auto" (other values are dropped); function `strict` is a
#   documented field; no top_k parameter; response_format json_object
#   (https://mimo.mi.com/static/docs/quick-start/usage-guide/text-generation/structured-output.md); stream chunks carry `usage`.
# - Prompt cache: automatic prefix cache billed at the cache-hit price; no cache_control field on any protocol.
# Live (api.xiaomimimo.com, pay-as-you-go key, 2026-10-21): thinking on when omitted and off with "disabled";
#   tool_choice "required"/named/"none" behave as "auto"; usage arrives in the last stream chunk even without
#   stream_options; a repeated 18.7k-token prompt read 18,688 cached tokens, and Messages cache_control wrote nothing.
# Mid-conversation (live 2026-10-21, Chat Completions, ~18k-token conversation, same result on mimo-v2.6-flash,
#   mimo-v2.6-pro and mimo-v2.6-pro-ultraspeed): a system message before the last user turn stays in place
#   (+23 input tokens), is followed, and keeps the cache -> system_updates; switching thinking.type between turns
#   (either direction) keeps the cache; adding a tool drops the cache to 0-64 tokens while the
#   same request with the old tool list keeps it -> tools.updates = false.
# effort_updates: left out. Changing thinking.type on the next request keeps the cache, but there's no
#   in-history effort message, so it doesn't count.
# Web search plugin: $5 per 1,000 calls (Overseas Internet Connectivity Service; the domestic service, CNY 16 per 1,000,
#   is not modeled): https://mimo.mi.com/static/docs/price/pay-as-you-go.md (accessed 2026-10-23)
# Per-API flags: system_updates sits on [api.chat-completions] only. The late system message was checked in place on Chat Completions (live 2026-10-23); the Responses and Anthropic-compatible Messages endpoints have no documented or tested in-place system message.
schema = 2
base_model = "xiaomi/mimo-v2.6-pro-ultraspeed"

[capabilities]
tools = { supported = true, strict = true, choice = ["auto"] }
reasoning = { supported = true, default = { type = "toggle", value = true }, toggle = true }
structured_output = true
top_k = false
stream_usage = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
capabilities = { system_updates = true }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
base_url = "https://api.xiaomimimo.com/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 4.35
cache = { read = 0.036 }

[cost.text.output]
price = 8.7

[cost.web_search]
price = 5
