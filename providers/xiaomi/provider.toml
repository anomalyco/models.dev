name = "Xiaomi"
# Endpoints: POST https://api.xiaomimimo.com/v1/chat/completions, /v1/responses and
# /anthropic/v1/messages. Chat Completions and Messages use thinking.type="enabled"|"disabled"
# (default enabled on the MiMo-V2.6 series); Responses uses reasoning.effort (none = off).
# TTS models use Chat Completions with an `audio` object.
# https://mimo.mi.com/static/docs/api/chat/openai-api.md (accessed 2026-10-21)
# https://mimo.mi.com/static/docs/api/chat/responses.md (accessed 2026-10-21)
# https://mimo.mi.com/static/docs/api/chat/anthropic-api.md (accessed 2026-10-21)
env = ["XIAOMI_API_KEY"]
npm = "@ai-sdk/openai-compatible"
opencodeai = "@opencode/ai/providers/openai-compatible"
api = "https://api.xiaomimimo.com/v1"
doc = "https://platform.xiaomimimo.com/#/docs"
