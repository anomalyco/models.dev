# Reasoning: the lab's own effort list for this id. reasoning_effort is forwarded on this host: live
#   2026-11-26 on chat/completions, a long reasoning prompt returned completion_tokens that rose with the
#   level (low < high < max, two runs each). The router reports reasoning_tokens = 0 for Claude, which is
#   why an earlier reading of that field looked like the level was ignored.
# Toggle: thinking.type = enabled|disabled, as the lab's entry has it. This toggle was not shown to change
#   output on this host; it is published because the lab authors it, not from a live result here.
schema = 2
base_model = "anthropic/claude-sonnet-5"

[limit]
output = 131_072

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }

cache = { explicit = { ttl = ["5m", "1h"] } }

[cost.text.input]
price = 2
cache = { write = { "5m" = 2.5, "1h" = 4 } }

[cost.text.output]
price = 10
