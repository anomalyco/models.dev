# Modalities: video input is dropped here. The lab file lists video formats, but this router rejects
#   them for this id (live 2026-11-26, chat/completions: "does not accept video input"), and the
#   0G catalog `architecture.input_modalities` for it is image, text.
# Toggle: thinking_budget / thinking_config
schema = 2
base_model = "google/gemini-2.5-flash-lite"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "audio/wav", "audio/mp3", "audio/aiff", "audio/aac", "audio/ogg", "audio/flac", "audio/mpeg", "audio/m4a", "audio/l16", "audio/opus", "audio/alaw", "audio/mulaw", "audio/webm", "application/pdf"]
output = ["text"]


[limit]
output = 65_535

[capabilities]
reasoning = { supported = true, default = { type = "toggle", value = false }, toggle = true, budget = { min = 512, max = 24_576 } }

[cost.text.input]
price = 0.1

[cost.text.output]
price = 0.4
