# Reasoning: no caller control on this host. Live 2026-11-26 on chat/completions for `claude-sonnet-5.5` (usage.completion_tokens_details.reasoning_tokens): reasoning_effort low, high and max each returned 0 reasoning tokens, so the level does not steer reasoning here (reasoning_effort = none answers 400, which shows the router validates the parameter, not that it forwards it). The bare `reasoning = { supported = true }` stays because AGENTS.md requires a relay to author its reasoning controls, and the v1 schema refuses a file whose reasoning resolves true without a `capabilities.reasoning` key (`packages/core/src/schema.ts`, "Must set reasoning_options when reasoning is true").
schema = 2
base_model = "anthropic/claude-sonnet-5-5"

[capabilities]
reasoning = { supported = true }

cache = { explicit = { ttl = ["5m", "1h"] } }

[cost.text.input]
price = 2
cache = { write = { "5m" = 2.5, "1h" = 4 } }

[cost.text.output]
price = 10
