# Reasoning: a `thinking` toggle with the lab's own effort levels. The 0G catalog lists `thinking` in supported_parameters for
#   this id and lists no `reasoning_effort` and no budget field, so the toggle is the control this host
#   offers; the levels are the lab's set for the id. An earlier version published no caller control because `thinking` enabled/disabled and
#   `reasoning_effort` low/high/max all returned reasoning_tokens = 0; that field is simply not reported for
#   Claude on this host, so it could not show whether a field is forwarded. The lab's `budget` is not
#   carried: the catalog offers no budget field on any Claude id.
schema = 2
base_model = "anthropic/claude-opus-4-6"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "max"] }

cache = { explicit = { ttl = ["5m", "1h"] } }

[cost.text.input]
price = 5
cache = { write = { "5m" = 6.25, "1h" = 10 } }

[cost.text.output]
price = 25
