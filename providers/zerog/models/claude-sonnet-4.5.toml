# Reasoning: no caller control on this host. Live 2026-11-26 on chat/completions for `claude-sonnet-4-5` (usage.completion_tokens_details.reasoning_tokens): thinking.type enabled and disabled both returned 0, and reasoning_effort low/high/max also returned 0 reasoning tokens at every level, so neither field steers reasoning here. The lab's `reasoning = { supported = true }` is kept because `bun validate` requires a `capabilities.reasoning` key whenever reasoning resolves true.
