# Modalities: video input is dropped here. The lab file lists video formats, but this router rejects
#   them for this id (live 2026-11-26, chat/completions: "does not accept video input"), and the
#   0G catalog `architecture.input_modalities` for it is image, text.
# Toggle: thinking.type = enabled|disabled
# Live on this host 2026-11-26 (chat/completions): thinking.type disabled returned 0 reasoning characters and enabled returned reasoning, so `thinking` is a working toggle here.
schema = 2
base_model = "xiaomi/mimo-v2.6-flash"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "audio/mpeg", "audio/wav", "audio/flac", "audio/mp4", "audio/ogg"]
output = ["text"]


[capabilities]
reasoning = { supported = true, default = { type = "toggle", value = true }, toggle = true }

[cost.text.input]
price = 0.2085

[cost.text.output]
price = 0.417
