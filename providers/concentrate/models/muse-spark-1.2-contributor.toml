schema = 2
base_model = "meta/muse-spark-1.2"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif", "application/pdf"]
output = ["text"]

[capabilities]
structured_output = true
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh"] }
cache = { implicit = true }

[cost.text.input]
price = 0.1
cache = { read = 0.002 }

[cost.text.output]
price = 0.2

[cost.web_search]
price = 2.5
