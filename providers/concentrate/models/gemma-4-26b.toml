# Concentrate Chat uses `reasoning_effort`; live probes on 2026-08-19 confirmed
# none/minimal/low/medium/high/xhigh are advertised and accepted; every route
# reports `max` unsupported, so Chat would normalize it to another level.
# https://concentrate.ai/docs/api-reference/endpoint/chat-completions
# https://api.concentrate.ai/v1/models/gemma-4-26b
base_model = "google/gemma-4-26b-a4b-it"

[[reasoning_options]]
type = "effort"
values = ["none", "minimal", "low", "medium", "high", "xhigh"]

[cost]
input = 0.1
output = 0.3

[limit]
output = 256_000

[modalities]
input = ["text", "image", "pdf"]
