# Concentrate Chat uses `reasoning_effort`; live probes on 2026-08-19 confirmed
# `none` disables thinking and `high` enables extended generation on this route.
# https://concentrate.ai/docs/api-reference/endpoint/chat-completions
# https://api.concentrate.ai/v1/models/gemma-4-26b
base_model = "google/gemma-4-26b-a4b-it"

[[reasoning_options]]
type = "effort"
values = ["none", "high"]

[cost]
input = 0.1
output = 0.3

[limit]
context = 256_000
output = 256_000

[modalities]
input = ["text", "image", "pdf"]
