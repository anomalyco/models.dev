# Effort: Concentrate maps reasoning.effort to the model's thinking budget, per supports.reasoning.effort at https://api.concentrate.ai/v1/models
schema = 2
base_model = "google/gemini-2.5-flash"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
structured_output = true
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
cache = { implicit = { min_tokens = 2_048 }, explicit = true }

[cost.text.input]
price = 0.3
cache = { read = 0.03 }

[cost.text.output]
price = 2.5

[cost.web_search]
price = 35
