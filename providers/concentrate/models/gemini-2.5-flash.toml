# Concentrate Chat uses `reasoning_effort`; live probes on 2026-08-19 confirmed
# `none` disables thinking and low/medium/high return reasoning; every route
# reports `minimal` unsupported, so Chat would normalize it to another level.
# https://concentrate.ai/docs/api-reference/endpoint/chat-completions
# https://api.concentrate.ai/v1/models/gemini-2.5-flash
base_model = "google/gemini-2.5-flash"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high"]

[cost]
input = 0.3
output = 2.5
cache_read = 0.03

[limit]
context = 1_000_000

[modalities]
input = ["text", "image", "pdf"]
