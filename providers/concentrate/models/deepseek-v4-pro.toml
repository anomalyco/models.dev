# Concentrate Chat uses `reasoning_effort`; `none` is the off value on this route.
# It does not expose a separate thinking toggle or reasoning-token budget field.
# Output is capped to DeepSeek's canonical 384k ceiling; the catalog's 1,048,576
# aggregate comes from one route and is not treated as a verified model delta.
# https://concentrate.ai/docs/api-reference/endpoint/chat-completions
# https://api.concentrate.ai/v1/models/deepseek-v4-pro (accessed 2026-08-19)
base_model = "deepseek/deepseek-v4-pro"
attachment = true

[[reasoning_options]]
type = "effort"
values = ["none", "high", "max"]

[cost]
input = 1.3
output = 2.6
cache_read = 0.1

[limit]
context = 1_048_576

[modalities]
input = ["text", "pdf"]
