# Limit: max_input_tokens 262144, max_tokens 65536 at https://api.concentrate.ai/v1/models, capped at the lab's
schema = 2
base_model = "moonshotai/kimi-k2.7-code"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif", "application/pdf"]
output = ["text"]

[capabilities]
structured_output = true
reasoning = { supported = true }
cache = { implicit = true }

[limit]
output = 65_536

[cost.text.input]
price = 0.95
cache = { read = 0.19 }

[cost.text.output]
price = 4
