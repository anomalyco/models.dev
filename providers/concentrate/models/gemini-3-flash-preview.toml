schema = 2
base_model = "google/gemini-3-flash-preview"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
structured_output = true
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
cache = { implicit = true, explicit = true }

[cost.text.input]
price = 0.5
cache = { read = 0.05 }

[cost.text.output]
price = 3

[cost.web_search]
price = 14
