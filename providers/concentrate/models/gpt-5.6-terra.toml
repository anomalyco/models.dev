# Custom tools: text, lark and regex grammars on Responses (enforced live 2026-11-12)
schema = 2
base_model = "openai/gpt-5.6-terra"

[capabilities]
structured_output = true
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
cache = { implicit = { min_tokens = 1_024 }, explicit = { ttl = ["30m", "12h"], max_breakpoints = 4, min_tokens = 1_024 } }
tools = { supported = true, freeform = ["text", "lark", "regex"] }

[cost.text.input]
price = 2
cache = { read = 0.2, write = { "30m" = 2.5 } }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 4
cache = { read = 0.4, write = { "30m" = 5 } }

[cost.text.output]
price = 12

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 18

[cost.web_search]
price = 14
