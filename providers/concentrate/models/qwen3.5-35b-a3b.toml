# Effort: Concentrate maps reasoning.effort to the model's thinking budget, per supports.reasoning.effort at https://api.concentrate.ai/v1/models
schema = 2
base_model = "alibaba/qwen3.5-35b-a3b"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif", "application/pdf"]
output = ["text"]

[capabilities]
structured_output = true
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }

[cost.text.input]
price = 0.25

[cost.text.output]
price = 2
