# Limit: max_input_tokens 262144, max_tokens 98304 at https://api.concentrate.ai/v1/models, capped at the lab's
schema = 2
base_model = "moonshotai/kimi-k2-thinking"

[modalities]
input = ["text", "application/pdf"]
output = ["text"]

[capabilities]
structured_output = true
