# Limit: max_input_tokens 256000, max_tokens 16384 at https://api.concentrate.ai/v1/models, capped at the lab's
schema = 2
base_model = "alibaba/qwen3-coder-30b-a3b-instruct"

[modalities]
input = ["text", "application/pdf"]
output = ["text"]

[capabilities]
structured_output = true
reasoning = { supported = false }

[limit]
context = 256_000
output = 16_384

[cost.text.input]
price = 0.15

[cost.text.output]
price = 0.6
