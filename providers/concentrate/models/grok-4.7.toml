# Limit: max_input_tokens 524288, max_tokens 125000 at https://api.concentrate.ai/v1/models, capped at the lab's
schema = 2
base_model = "xai/grok-4.7"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif", "application/pdf"]
output = ["text"]

[capabilities]
structured_output = true
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
cache = { implicit = true }

[limit]
output = 125_000

[cost.text.input]
price = 2
cache = { read = 0.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 4
cache = { read = 1 }

[cost.text.output]
price = 6

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 12

[cost.web_search]
price = 14
