# Pricing, limits and reasoning surface as published for this ID.
# https://concentrate.ai/models/gemini-3.5-flash
base_model = "google/gemini-3.5-flash"

[[reasoning_options]]
type = "effort"
values = ["minimal", "low", "medium", "high"]

[cost]
input = 1.5
output = 9
cache_read = 0.15

[modalities]
input = ["text", "image", "pdf"]

[interleaved]
field = "reasoning_content"
