# Concentrate reports `xhigh` as unsupported for this model even though lab
# OpenAI and OpenRouter expose it: the list capability block sets
# effort.xhigh.supported = false, and both the openai and azure routes report
# reasoning.effort.xhigh = false. The tier is omitted rather than relayed,
# because Concentrate normalizes unsupported effort values instead of rejecting
# them, so acceptance alone would not prove support.
# https://concentrate.ai/docs/api-reference/endpoint/chat-completions
# https://api.concentrate.ai/v1/models/gpt-5.2 (accessed 2026-08-19)
base_model = "openai/gpt-5.2"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high"]

[cost]
input = 1.75
output = 14
cache_read = 0.175

[modalities]
input = ["text", "image", "pdf"]
