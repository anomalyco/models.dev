schema = 2
base_model = "alibaba/qwen3-coder-flash"

[modalities]
input = ["text", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = false }
cache = { implicit = { min_tokens = 1_024 }, explicit = { ttl = ["5m"], max_breakpoints = 4, targets = ["system", "messages"], min_tokens = 1_024 } }

[cost.text.input]
price = 0.144
cache = { read = 0.029 }

[[cost.text.input.overrides]]
when = { context = { gt = 32_000 } }
price = 0.216
cache = { read = 0.044 }

[[cost.text.input.overrides]]
when = { context = { gt = 128_000 } }
price = 0.359
cache = { read = 0.072 }

[[cost.text.input.overrides]]
when = { context = { gt = 256_000 } }
price = 0.717
cache = { read = 0.144 }

[cost.text.output]
price = 0.574

[[cost.text.output.overrides]]
when = { context = { gt = 32_000 } }
price = 0.861

[[cost.text.output.overrides]]
when = { context = { gt = 128_000 } }
price = 1.434

[[cost.text.output.overrides]]
when = { context = { gt = 256_000 } }
price = 3.584
