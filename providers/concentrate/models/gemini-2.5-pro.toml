schema = 2
base_model = "google/gemini-2.5-pro"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
structured_output = true
reasoning = { supported = true }
cache = { implicit = { min_tokens = 2_048 }, explicit = true }

[cost.text.input]
price = 1.25
cache = { read = 0.125 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 2.5
cache = { read = 0.25 }

[cost.text.output]
price = 10

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 15

[cost.web_search]
price = 35
