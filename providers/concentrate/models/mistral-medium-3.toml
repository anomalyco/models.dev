# Limit: max_input_tokens 128000, max_tokens 32000 at https://api.concentrate.ai/v1/models, capped at the lab's
schema = 2
base_model = "mistral/mistral-medium-3"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
structured_output = true

[limit]
context = 128_000
output = 32_000

[cost.text.input]
price = 0.4

[cost.text.output]
price = 2

[cost.web_search]
price = 30
