# Concentrate Chat uses `reasoning_effort`; live probes on 2026-08-19 confirmed
# none/minimal/low/medium/high/xhigh/max are accepted on routed requests.
# https://concentrate.ai/docs/api-reference/endpoint/chat-completions
# https://api.concentrate.ai/v1/models/deepseek-v3-1
base_model = "deepseek/deepseek-v3.1"
attachment = true
structured_output = true

[[reasoning_options]]
type = "effort"
values = ["none", "minimal", "low", "medium", "high", "xhigh", "max"]

[cost]
input = 0.25
output = 0.95
cache_read = 0.13

[limit]
context = 163_840
output = 32_768

[modalities]
input = ["text", "pdf"]
