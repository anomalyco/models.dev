schema = 2
base_model = "google/gemini-3.1-pro-preview"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
structured_output = true
reasoning = { supported = true, effort = ["low", "medium", "high"] }
cache = { implicit = { min_tokens = 4_096 }, explicit = true }

[cost.text.input]
price = 2
cache = { read = 0.2 }

[[cost.text.input.overrides]]
when = { context = { gte = 200_000 } }
price = 4
cache = { read = 0.4 }

[cost.text.output]
price = 12

[[cost.text.output.overrides]]
when = { context = { gte = 200_000 } }
price = 18

[cost.web_search]
price = 14
