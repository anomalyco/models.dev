# Limit: max_input_tokens 128000, max_tokens 5000 at https://api.concentrate.ai/v1/models, capped at the lab's
schema = 2
base_model = "amazon/nova-micro"

[modalities]
input = ["text", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = false }

[limit]
output = 5_000

[cost.text.input]
price = 0.035

[cost.text.output]
price = 0.14
