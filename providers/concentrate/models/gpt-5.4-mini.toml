# Concentrate reports `xhigh` as unsupported for this model even though lab
# OpenAI and OpenRouter expose it: the list capability block sets
# effort.xhigh.supported = false, and both the openai and azure routes report
# reasoning.effort.xhigh = false. The tier is omitted rather than relayed,
# because Concentrate normalizes unsupported effort values instead of rejecting
# them, so acceptance alone would not prove support. The sibling gpt-5.4 and
# gpt-5.4-pro entries do advertise xhigh, so this is per-model, not a blanket cut.
#
# The 128k context override is host-specific and verified, not an understatement
# of the lab model: Concentrate reports max_input_tokens = 128_000 for this ID in
# the model list and context_window = 128_000 on both its openai and azure
# routes, while the sibling gpt-5.4 and gpt-5.4-pro entries report 1_050_000.
# https://concentrate.ai/docs/api-reference/endpoint/chat-completions
# https://api.concentrate.ai/v1/models/gpt-5.4-mini (accessed 2026-08-19)
base_model = "openai/gpt-5.4-mini"
base_model_omit = ["limit.input"]

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high"]

[cost]
input = 0.75
output = 4.5
cache_read = 0.075

[limit]
context = 128_000

[modalities]
input = ["text", "image", "pdf"]
