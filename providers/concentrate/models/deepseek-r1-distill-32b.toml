# Toggle: reasoning.effort = none (off) | omitted (on); reasoning_effort on Chat Completions
# Limit: max_input_tokens 80000, max_tokens 20000 at https://api.concentrate.ai/v1/models, capped at the lab's
schema = 2
base_model = "deepseek/deepseek-r1-distill-qwen-32b"

[modalities]
input = ["text", "application/pdf"]
output = ["text"]

[capabilities]
structured_output = true
reasoning = { supported = true, toggle = true }

[limit]
context = 80_000
output = 20_000

[cost.text.input]
price = 0.497

[cost.text.output]
price = 4.881
