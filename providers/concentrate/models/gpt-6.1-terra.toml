schema = 2
base_model = "openai/gpt-6.1-terra"

[capabilities]
structured_output = true
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
cache = { implicit = { min_tokens = 1_024 }, explicit = { ttl = ["30m", "12h"], max_breakpoints = 4, min_tokens = 1_024 } }

[cost.text.input]
price = 1
cache = { read = 0.05, write = { "5m" = 1.25 } }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 2
cache = { read = 0.1, write = { "5m" = 2.5 } }

[cost.text.output]
price = 5

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 7.5

[cost.web_search]
price = 14
