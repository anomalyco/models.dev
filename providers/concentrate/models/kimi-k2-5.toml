# Toggle: reasoning.effort = none (off) | omitted (on); reasoning_effort on Chat Completions
# Limit: max_input_tokens 262144, max_tokens 65536 at https://api.concentrate.ai/v1/models, capped at the lab's
schema = 2
base_model = "moonshotai/kimi-k2.5"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif", "application/pdf"]
output = ["text"]

[capabilities]
structured_output = true
reasoning = { supported = true, toggle = true }
cache = { implicit = true }

[limit]
output = 65_536

[cost.text.input]
price = 0.6
cache = { read = 0.1 }

[cost.text.output]
price = 3
