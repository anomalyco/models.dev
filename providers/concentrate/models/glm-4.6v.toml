# Toggle: reasoning.effort = none (off) | omitted (on); reasoning_effort on Chat Completions
schema = 2
base_model = "zhipuai/glm-4.6v"

[modalities]
input = ["text", "image/png", "image/jpeg", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
cache = { implicit = true }

[cost.text.input]
price = 0.3
cache = { read = 0.05 }

[cost.text.output]
price = 0.9
