# Toggle: reasoning.effort = none (off) | omitted (on); reasoning_effort on Chat Completions
schema = 2
base_model = "alibaba/qwen3-vl-plus"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif", "application/pdf"]
output = ["text"]

[capabilities]
structured_output = true
reasoning = { supported = true, toggle = true }
cache = { implicit = { min_tokens = 1_024 }, explicit = { ttl = ["5m"], max_breakpoints = 4, targets = ["system", "messages"], min_tokens = 1_024 } }

[cost.text.input]
price = 0.144
cache = { read = 0.029 }

[[cost.text.input.overrides]]
when = { context = { gt = 32_000 } }
price = 0.216
cache = { read = 0.044 }

[[cost.text.input.overrides]]
when = { context = { gt = 128_000 } }
price = 0.431
cache = { read = 0.087 }

[cost.text.output]
price = 1.434

[[cost.text.output.overrides]]
when = { context = { gt = 32_000 } }
price = 2.151

[[cost.text.output.overrides]]
when = { context = { gt = 128_000 } }
price = 4.301
