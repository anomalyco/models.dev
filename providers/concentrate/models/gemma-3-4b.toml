# Limit: max_input_tokens 131072, max_tokens 32768 at https://api.concentrate.ai/v1/models, capped at the lab's
schema = 2
base_model = "google/gemma-3-4b-it"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif", "application/pdf"]
output = ["text"]

[capabilities]
structured_output = true

[limit]
output = 32_768

[cost.text.input]
price = 0.05

[cost.text.output]
price = 0.1
