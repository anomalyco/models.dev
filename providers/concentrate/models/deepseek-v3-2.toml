# Limit: max_input_tokens 163840, max_tokens 32000 at https://api.concentrate.ai/v1/models, capped at the lab's
schema = 2
base_model = "deepseek/deepseek-v3.2"

[modalities]
input = ["text", "application/pdf"]
output = ["text"]

[capabilities]
structured_output = true
reasoning = { supported = true }

[limit]
output = 32_000

[cost.text.input]
price = 0.62

[cost.text.output]
price = 1.85
