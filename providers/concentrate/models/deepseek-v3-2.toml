# Concentrate Chat uses `reasoning_effort`; live probes on 2026-08-19 confirmed
# minimal/low/medium/high are advertised and accepted. Every route reports
# `none` unsupported, so Chat would normalize it instead of disabling thinking.
# https://concentrate.ai/docs/api-reference/endpoint/chat-completions
# https://api.concentrate.ai/v1/models/deepseek-v3-2
base_model = "deepseek/deepseek-v3.2"
attachment = true

[[reasoning_options]]
type = "effort"
values = ["minimal", "low", "medium", "high"]

[cost]
input = 0.26
output = 0.38
cache_read = 0.13

[limit]
context = 163_840
output = 65_536

[modalities]
input = ["text", "pdf"]
