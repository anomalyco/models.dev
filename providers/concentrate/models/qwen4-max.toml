# Limit: max_input_tokens 1000000, max_tokens 131072 at https://api.concentrate.ai/v1/models, capped at the lab's
schema = 2
base_model = "alibaba/qwen4-max"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif", "application/pdf"]
output = ["text"]

[capabilities]
structured_output = true
reasoning = { supported = true, effort = ["none", "low", "high", "xhigh"] }
cache = { implicit = { min_tokens = 1_024 } }

[limit]
output = 131_072

[cost.text.input]
price = 1.413
cache = { read = 0.071 }

[cost.text.output]
price = 4.24

[cost.web_search]
price = 0.573411
