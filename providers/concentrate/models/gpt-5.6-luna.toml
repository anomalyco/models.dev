# Custom tools: text, lark and regex grammars on Responses, per supports.tools.custom_tools at https://api.concentrate.ai/v1/models
schema = 2
base_model = "openai/gpt-5.6-luna"

[capabilities]
structured_output = true
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
cache = { implicit = { min_tokens = 1_024 }, explicit = { ttl = ["30m", "12h"], max_breakpoints = 4, min_tokens = 1_024 } }
tools = { supported = true, freeform = ["text", "lark", "regex"] }

[cost.text.input]
price = 0.2
cache = { read = 0.02, write = { "30m" = 0.25 } }

[[cost.text.input.overrides]]
when = { context = { gte = 272_000 } }
price = 0.4
cache = { read = 0.04, write = { "30m" = 0.5 } }

[cost.text.output]
price = 1.2

[[cost.text.output.overrides]]
when = { context = { gte = 272_000 } }
price = 1.8

[cost.web_search]
price = 14
