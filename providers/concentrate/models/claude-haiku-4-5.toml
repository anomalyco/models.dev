# Concentrate Chat exposes normalized `reasoning_effort` over Anthropic's budget
# API, and the graded tiers have verified distinct effect here -- they are not a
# relabelled on/off toggle. Live probes on 2026-08-19 (identical prompt, 3 runs
# per level, max_tokens 20000 so nothing truncated, finish_reason "stop"
# throughout) produced mean reasoning lengths of 3_100 chars at low, 3_799 at
# medium, and 6_934 at high, with completion tokens rising ~4.8k -> ~6.2k -> ~11k.
# `none` returns an empty reasoning payload, i.e. thinking genuinely off.
# An earlier run at max_tokens 6000 showed no separation purely because every
# level saturated the cap; the tiers only separate when the budget is uncapped.
# https://concentrate.ai/docs/api-reference/endpoint/chat-completions
# https://api.concentrate.ai/v1/models/claude-haiku-4-5
base_model = "anthropic/claude-haiku-4-5"
structured_output = true

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high"]

[cost]
input = 1
output = 5
cache_read = 0.1
