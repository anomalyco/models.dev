# Concentrate advertises a $0 Blue Lobster route for this ID, but live requests
# on 2026-08-19 relayed through Fireworks and returned non-zero billed cost, so
# the Fireworks route is the honest baseline ($0.15/M in, $0.60/M out).
# https://api.concentrate.ai/v1/models/gpt-oss-120b
base_model = "openai/gpt-oss-120b"
attachment = true

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
input = 0.15
output = 0.6
cache_read = 0.015

[modalities]
input = ["text", "pdf"]
