schema = 2
base_model = "xai/grok-4.20-0309-non-reasoning"

[modalities]
input = ["text", "image/png", "image/jpeg"]
output = ["text"]

[capabilities]
structured_output = true
reasoning = { supported = false }
cache = { implicit = true }

[cost.text.input]
price = 1.25
cache = { read = 0.2 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 2.5
cache = { read = 0.4 }

[cost.text.output]
price = 2.5

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 5

[cost.web_search]
price = 5
