# Limit: max_input_tokens 256000, max_tokens 32000 at https://api.concentrate.ai/v1/models, capped at the lab's
schema = 2
base_model = "mistral/ministral-3-14b-instruct-2512"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
structured_output = true

[limit]
context = 256_000
output = 32_000

[cost.text.input]
price = 0.2

[cost.text.output]
price = 0.2
