# Limit: max_input_tokens 262144, max_tokens 32768 at https://api.concentrate.ai/v1/models, capped at the lab's
schema = 2
base_model = "nvidia/nemotron-3-super-120b-a12b"

[modalities]
input = ["text", "application/pdf"]
output = ["text"]

[capabilities]
structured_output = true
reasoning = { supported = true, effort = ["none", "low", "medium"] }

[limit]
output = 32_768

[cost.text.input]
price = 0.075

[cost.text.output]
price = 0.4
