# Concentrate's only route reports every Chat `reasoning_effort` value as
# unsupported. Live probes on 2026-08-19 returned reasoning content for both
# `none` and `high`, so this route reasons without a caller-visible control.
#
# No [[cost.tiers]] entry: Concentrate carries Anthropic's long-context band at
# above = 200_000 while its bedrock route caps the window at 200_000, so the
# band can never be entered and publishing it would advertise a price no caller
# can be charged.
# https://concentrate.ai/docs/api-reference/endpoint/chat-completions
# https://api.concentrate.ai/v1/models/claude-sonnet-4
base_model = "anthropic/claude-sonnet-4-20250514"
structured_output = false
reasoning_options = []

[cost]
input = 3
output = 15
cache_read = 0.3
