# Limit: max_input_tokens 196608, max_tokens 131072 at https://api.concentrate.ai/v1/models, capped at the lab's
schema = 2
base_model = "minimax/MiniMax-M2.7-highspeed"

[modalities]
input = ["text", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
cache = { implicit = { min_tokens = 512 } }

[limit]
context = 196_608

[cost.text.input]
price = 0.38
cache = { read = 0.07 }

[cost.text.output]
price = 1.7
