# Custom tools: regex grammar ZZ[0-9]{3} enforced on Responses (live probe 2026-11-13)
schema = 2
base_model = "openai/gpt-5.5"

[capabilities]
structured_output = true
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
cache = { implicit = { ttl = ["24h"], min_tokens = 1_024 } }
tools = { supported = true, freeform = ["text", "lark", "regex"] }

[cost.text.input]
price = 5
cache = { read = 0.5 }

[[cost.text.input.overrides]]
when = { context = { gte = 272_000 } }
price = 10
cache = { read = 1 }

[cost.text.output]
price = 30

[[cost.text.output.overrides]]
when = { context = { gte = 272_000 } }
price = 45

[cost.web_search]
price = 14
