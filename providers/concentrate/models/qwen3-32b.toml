# Limit: max_input_tokens 40960, max_tokens 32768 at https://api.concentrate.ai/v1/models, capped at the lab's
# Effort: Concentrate maps reasoning.effort to the model's thinking budget (graded, live 2026-11-12)
schema = 2
base_model = "alibaba/qwen3-32b"

[modalities]
input = ["text", "application/pdf"]
output = ["text"]

[capabilities]
structured_output = true
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }

[limit]
context = 40_960

[cost.text.input]
price = 0.15

[cost.text.output]
price = 0.6
