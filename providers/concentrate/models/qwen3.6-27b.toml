# Limit: max_input_tokens 262144, max_tokens 32768 at https://api.concentrate.ai/v1/models, capped at the lab's
# Effort: Concentrate maps reasoning.effort to the model's thinking budget (graded, live 2026-11-12)
schema = 2
base_model = "alibaba/qwen3.6-27b"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif", "application/pdf"]
output = ["text"]

[capabilities]
structured_output = true
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }

[limit]
output = 32_768

[cost.text.input]
price = 0.32

[cost.text.output]
price = 3.2
