# https://concentrate.ai/docs/api-reference/endpoint/chat-completions
# https://api.concentrate.ai/v1/models/deepseek-v4-flash-0731 (accessed 2026-08-19)
base_model = "deepseek/deepseek-v4-flash-0731"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "high", "max"]

[cost]
input = 0.09
output = 0.18
cache_read = 0.018

[limit]
context = 1_048_576
output = 393_216
