# Custom tools: regex grammar ZZ[0-9]{3} enforced on Responses (live probe 2026-11-13)
schema = 2
base_model = "openai/gpt-5.6-sol"

[capabilities]
structured_output = true
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
cache = { implicit = { min_tokens = 1_024 }, explicit = { ttl = ["30m", "12h"], max_breakpoints = 4, min_tokens = 1_024 } }
tools = { supported = true, freeform = ["text", "lark", "regex"] }

[cost.text.input]
price = 4
cache = { read = 0.4, write = { "30m" = 5 } }

[[cost.text.input.overrides]]
when = { context = { gte = 272_000 } }
price = 8
cache = { read = 0.8, write = { "30m" = 10 } }

[cost.text.output]
price = 20

[[cost.text.output.overrides]]
when = { context = { gte = 272_000 } }
price = 30

[cost.web_search]
price = 14
