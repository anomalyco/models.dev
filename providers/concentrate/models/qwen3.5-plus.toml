# Toggle: reasoning.effort = none (off) | omitted (on); reasoning_effort on Chat Completions
schema = 2
base_model = "alibaba/qwen3.5-plus"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }

[cost.text.input]
price = 0.115

[[cost.text.input.overrides]]
when = { context = { gt = 128_000 } }
price = 0.287

[[cost.text.input.overrides]]
when = { context = { gt = 256_000 } }
price = 0.573

[cost.text.output]
price = 0.688

[[cost.text.output.overrides]]
when = { context = { gt = 128_000 } }
price = 1.72

[[cost.text.output.overrides]]
when = { context = { gt = 256_000 } }
price = 3.44

[cost.web_search]
price = 0.573411
