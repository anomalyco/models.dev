# Limit: max_input_tokens 1048576, max_tokens 65536 at https://api.concentrate.ai/v1/models, capped at the lab's
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp"]
output = ["text"]

[capabilities]
structured_output = true
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
cache = { implicit = true }

[limit]
output = 65_536

[cost.text.input]
price = 0.6
cache = { read = 0.014 }

[cost.text.output]
price = 2.4
