# Limit: max_input_tokens 600000 at https://api.concentrate.ai/v1/models, capped at the lab's
# Decision model: Concentrate lists the chat model on OpenAI's Decisions API as a model of its own
#   (https://concentrate.ai/docs/api-reference/endpoint/decisions). Decisions generates no text and bills no output
#   tokens, and caches a shared prefix of 1,024+ tokens implicitly (https://developers.openai.com/api/docs/guides/decisions).
schema = 2
v2_only = true
base_model = "openai/gpt-6-luna"
base_model_omit = ["limit.input"]
type = "decision"
name = "GPT-6 Luna Decisions"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["decision"]

[capabilities]
structured_output = true
temperature = false
top_p = false
tools = { supported = false }
reasoning = { supported = false }
cache = { implicit = { min_tokens = 1_024 } }

[limit]
context = 600_000
output = 0

[api.systemone]
sdk = { aisdk = "@ai-sdk/typesafe-ai", opencodeai = "@opencode/ai/providers/typesafe-ai/decisions" }

[cost.text.input]
price = 0.1
cache = { read = 0.01, write = { "30m" = 0.125 } }

[[cost.text.input.overrides]]
when = { context = { gte = 272_000 } }
price = 0.2
cache = { read = 0.02, write = { "30m" = 0.25 } }

[cost.text.output]
price = 0

[[cost.text.output.overrides]]
when = { context = { gte = 272_000 } }
price = 0
