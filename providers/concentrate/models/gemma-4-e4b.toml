# Concentrate Chat uses `reasoning_effort`; live probes on 2026-08-19 confirmed
# `none` disables thinking and `high` returns a reasoning payload on this route.
# https://concentrate.ai/docs/api-reference/endpoint/chat-completions
# https://api.concentrate.ai/v1/models/gemma-4-e4b
base_model = "google/gemma-4-E4B-it"
structured_output = false

[[reasoning_options]]
type = "effort"
values = ["none", "high"]

[cost]
input = 0.02
output = 0.1

[limit]
output = 32_768

[modalities]
input = ["text", "pdf"]
