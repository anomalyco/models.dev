# Limit: max_input_tokens 204800, max_tokens 8192 at https://api.concentrate.ai/v1/models, capped at the lab's
schema = 2
base_model = "minimax/MiniMax-M2"

[modalities]
input = ["text", "application/pdf"]
output = ["text"]

[capabilities]
structured_output = true
reasoning = { supported = true }

[limit]
output = 8_192

[cost.text.input]
price = 0.3

[cost.text.output]
price = 1.2
