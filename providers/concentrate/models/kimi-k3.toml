# Limit: max_input_tokens 1048576, max_tokens 262144 at https://api.concentrate.ai/v1/models, capped at the lab's
schema = 2
base_model = "moonshotai/kimi-k3"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif", "application/pdf"]
output = ["text"]

[capabilities]
structured_output = true
reasoning = { supported = true, effort = ["low", "high", "max"] }
cache = { implicit = { ttl = ["5m", "1h"] } }

[limit]
output = 262_144

[cost.text.input]
price = 3
cache = { read = 0.3, write = { "5m" = 3 } }

[cost.text.output]
price = 15
