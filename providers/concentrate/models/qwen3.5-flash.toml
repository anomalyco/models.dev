# Toggle: reasoning.effort = none (off) | omitted (on); reasoning_effort on Chat Completions
schema = 2
base_model = "alibaba/qwen3.5-flash"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }

[cost.text.input]
price = 0.029

[[cost.text.input.overrides]]
when = { context = { gte = 128_000 } }
price = 0.115

[[cost.text.input.overrides]]
when = { context = { gte = 256_000 } }
price = 0.172

[cost.text.output]
price = 0.287

[[cost.text.output.overrides]]
when = { context = { gte = 128_000 } }
price = 1.147

[[cost.text.output.overrides]]
when = { context = { gte = 256_000 } }
price = 1.72

[cost.web_search]
price = 0.573411
