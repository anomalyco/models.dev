# Limit: max_input_tokens 196608, max_tokens 8192 at https://api.concentrate.ai/v1/models, capped at the lab's
schema = 2
base_model = "minimax/MiniMax-M2.1"

[modalities]
input = ["text", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true }

