# Capabilities the catalog doesn't state (capabilities.tools.freeform) come from gpt-6.1-sol, this host's previous model in the family.
schema = 2
base_model = "openai/gpt-6.2-sol"

[capabilities]
structured_output = true
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
cache = { implicit = { min_tokens = 1_024 }, explicit = { ttl = ["30m", "12h"], max_breakpoints = 4, min_tokens = 1_024 } }

[cost.text.input]
price = 2
cache = { read = 0.1, write = { "30m" = 2.5 } }

[[cost.text.input.overrides]]
when = { context = { gte = 272_000 } }
price = 4
cache = { read = 0.2, write = { "30m" = 5 } }

[cost.text.output]
price = 10

[[cost.text.output.overrides]]
when = { context = { gte = 272_000 } }
price = 15

[cost.web_search]
price = 10
