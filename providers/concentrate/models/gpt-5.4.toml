# Custom tools: text, lark and regex grammars on Responses, per supports.tools.custom_tools at https://api.concentrate.ai/v1/models
schema = 2
base_model = "openai/gpt-5.4"

[capabilities]
structured_output = true
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
cache = { implicit = { ttl = ["24h"], min_tokens = 1_024 } }
tools = { supported = true, freeform = ["text", "lark", "regex"] }

[cost.text.input]
price = 2.5
cache = { read = 0.25 }

[[cost.text.input.overrides]]
when = { context = { gte = 272_000 } }
price = 5
cache = { read = 0.5 }

[cost.text.output]
price = 15

[[cost.text.output.overrides]]
when = { context = { gte = 272_000 } }
price = 22.5

[cost.web_search]
price = 14
