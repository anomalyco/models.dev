# Capabilities the catalog doesn't state (capabilities.tools.freeform) come from gpt-6-astra, this host's previous model in the family.
schema = 2
base_model = "openai/gpt-6.2-astra"

[capabilities]
structured_output = true
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
cache = { implicit = { min_tokens = 1_024 }, explicit = { ttl = ["30m", "12h"], max_breakpoints = 4, min_tokens = 1_024 } }

[cost.text.input]
price = 8
cache = { read = 0.4, write = { "30m" = 10 } }

[[cost.text.input.overrides]]
when = { context = { gte = 272_000 } }
price = 16
cache = { read = 0.8, write = { "30m" = 20 } }

[cost.text.output]
price = 40

[[cost.text.output.overrides]]
when = { context = { gte = 272_000 } }
price = 60

[cost.web_search]
price = 10
