schema = 2
base_model = "openai/gpt-5-nano"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif", "application/pdf"]
output = ["text"]

[capabilities]
structured_output = true
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
cache = { implicit = { min_tokens = 1_024 } }

[cost.text.input]
price = 0.05
cache = { read = 0.005 }

[cost.text.output]
price = 0.4

[cost.web_search]
price = 14
