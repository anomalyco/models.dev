schema = 2
base_model = "alibaba/qwen3.8-max"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif", "application/pdf"]
output = ["text"]

[capabilities]
structured_output = true
reasoning = { supported = true, effort = ["none", "low", "medium", "xhigh"] }
cache = { implicit = { min_tokens = 1_024 }, explicit = { ttl = ["5m"], max_breakpoints = 4, targets = ["system", "messages"], min_tokens = 1_024 } }

[cost.text.input]
price = 2
cache = { read = 0.25 }

[cost.text.output]
price = 6

[cost.web_search]
price = 0.573411
