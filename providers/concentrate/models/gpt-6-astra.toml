# Custom tools: text, lark and regex grammars on Responses, per supports.tools.custom_tools at https://api.concentrate.ai/v1/models
schema = 2
base_model = "openai/gpt-6-astra"

[capabilities]
structured_output = true
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
cache = { implicit = { min_tokens = 1_024 }, explicit = { ttl = ["30m", "12h"], max_breakpoints = 4, min_tokens = 1_024 } }
tools = { supported = true, freeform = ["text", "lark", "regex"] }

[cost.text.input]
price = 10
cache = { read = 1, write = { "30m" = 12.5 } }

[[cost.text.input.overrides]]
when = { context = { gte = 272_000 } }
price = 20
cache = { read = 2, write = { "30m" = 25 } }

[cost.text.output]
price = 50

[[cost.text.output.overrides]]
when = { context = { gte = 272_000 } }
price = 75

[cost.web_search]
price = 14
