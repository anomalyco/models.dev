schema = 2
base_model = "openai/gpt-5"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif", "application/pdf"]
output = ["text"]

[capabilities]
structured_output = true
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
cache = { implicit = { ttl = ["24h"], min_tokens = 1_024 } }

[cost.text.input]
price = 1.25
cache = { read = 0.125 }

[cost.text.output]
price = 10

[cost.web_search]
price = 10
