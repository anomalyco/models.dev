# Custom tools: regex grammar ZZ[0-9]{3} enforced on Responses (live probe 2026-11-13)
schema = 2
base_model = "openai/gpt-5.1"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif", "application/pdf"]
output = ["text"]

[capabilities]
structured_output = true
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
cache = { implicit = { ttl = ["24h"], min_tokens = 1_024 } }
tools = { supported = true, freeform = ["text", "lark", "regex"] }

[cost.text.input]
price = 1.25
cache = { read = 0.125 }

[cost.text.output]
price = 10

[cost.web_search]
price = 14
