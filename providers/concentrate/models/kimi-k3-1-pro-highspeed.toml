schema = 2
base_model = "moonshotai/kimi-k3.1-pro"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
structured_output = true
reasoning = { supported = true, effort = ["low", "high", "max"] }
cache = { implicit = { ttl = ["5m", "1h"] } }

[cost.text.input]
price = 4
cache = { read = 0.2, write = { "5m" = 4 } }

[cost.text.output]
price = 20
