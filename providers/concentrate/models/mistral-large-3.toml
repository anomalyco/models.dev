# Limit: max_input_tokens 256000, max_tokens 32768 at https://api.concentrate.ai/v1/models, capped at the lab's
schema = 2
base_model = "mistral/mistral-large-2512"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
structured_output = true
reasoning = { supported = false }

[limit]
context = 256_000
output = 32_768

[cost.text.input]
price = 0.5

[cost.text.output]
price = 1.5
