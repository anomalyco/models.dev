# Limit: max_input_tokens 1000000, max_tokens 131072 at https://api.concentrate.ai/v1/models, capped at the lab's
schema = 2
base_model = "meta/muse-ember-1.0"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif", "application/pdf"]
output = ["text"]

[capabilities]
structured_output = true
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh", "max"] }
cache = { implicit = true }

[limit]
context = 1_000_000
output = 131_072

[cost.text.input]
price = 0.1
cache = { read = 0.004 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_001 } }
price = 0.3
cache = { read = 0.012 }

[cost.text.output]
price = 0.5

[[cost.text.output.overrides]]
when = { context = { gt = 200_001 } }
price = 1.5

[cost.web_search]
price = 2.5
