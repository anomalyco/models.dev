# Toggle: reasoning.effort = none (off) | omitted (on); reasoning_effort on Chat Completions
# Limit: max_input_tokens 262144, max_tokens 228000 at https://api.concentrate.ai/v1/models, capped at the lab's
schema = 2
base_model = "nvidia/nemotron-3-nano-30b-a3b"

[modalities]
input = ["text", "application/pdf"]
output = ["text"]

[capabilities]
structured_output = true
reasoning = { supported = true, toggle = true }
cache = { implicit = true }

[limit]
output = 228_000

[cost.text.input]
price = 0.05
cache = { read = 0.03 }

[cost.text.output]
price = 0.2
