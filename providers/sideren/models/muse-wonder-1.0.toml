# Served on Sideren's OpenAI Chat Completions API (https://api.sideren.io/v1). Generated by
# packages/catalog/scripts/models-dev.ts in Sideren's repo from its GET /v1/models projection;
# checked live 2026-10-26: chat, streaming, tool calls, image input.
# Effort: reasoning_effort = minimal|low|medium|high|xhigh|max
# Reasoning text, when the model returns it, streams on reasoning_content and is accepted back.
# Structured output: response_format json_schema is accepted.
# No per-token cost: Sideren bills plans and credits, not per token.
schema = 2
base_model = "meta/muse-wonder-1.0"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
