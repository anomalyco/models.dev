# Host relays lab weights with reasoning content generated on the wire; the OpenAI-compatible whitelist (https://fikraapi.co.ke/docs, verified 2026-10-19) does not accept `thinking` or `reasoning_effort`, so control options are not offered here. Limits and cache pricing inherit the lab entry pending a citable host source.
base_model = "alibaba/qwen3.8-27b"
description = "Fast 27B-class Qwen 3.8 model at a discount to most inference clouds"

