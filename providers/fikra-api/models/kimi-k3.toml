# Host relays lab weights with reasoning content generated on the wire; the OpenAI-compatible whitelist (https://fikraapi.co.ke/docs, verified 2026-10-19) does not accept `thinking` or `reasoning_effort`, so control options are not offered here.
base_model = "moonshotai/kimi-k3"
description = "Moonshot Kimi K3 for long-context agentic and coding workloads"

# Reasoning content is emitted on the wire but no control surface is exposed (see top comment).
reasoning = true
reasoning_options = []

[cost]
input = 2.1
output = 10.5

# Host serving caps below lab limits. Source: https://fikraapi.co.ke/pricing (verified 2026-10-19).
[limit]
output = 65536
