# Relay of the lab entry behind Fikra's OpenAI-compatible /v1 (prices: https://fikraapi.co.ke/pricing, verified 2026-10-19).
# Control surface (live probe 2026-10-20): the documented request whitelist (https://fikraapi.co.ke/docs, verified 2026-10-19)
# covers only tools/tool_choice/n/seed/stop/penalties/response_format. `thinking` and `reasoning_effort` return 200 and are
# accepted silently, and no response carries a `reasoning_content` field (message keys: content/role only), so
# reasoning_options stays empty until a control is shown to change the wire; effort levels are indistinguishable from
# sampling noise (MWU on completion tokens, n=10-16/level, all p >= 0.11, the one near-significant pair reversed).
base_model = "deepseek/deepseek-v4-flash-0731"
description = "DeepSeek V4 Flash 0731 build on a 1M context with a shorter output cap than lab deployments"
reasoning_options = []
attachment = false

[cost]
input = 0.045
output = 0.1

[limit]
output = 65536

[modalities]
input = ["text"]
output = ["text"]
