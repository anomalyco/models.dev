# Source (accessed 2026-09-03):
# - https://docs.neosantara.xyz
# - https://api.neosantara.xyz/v1/catalog  (models.dev / LLM Gateway shape, public, no key)
#
# The sync consumes the single /v1/catalog endpoint. The gateway does the host-specific work
# upstream (USD-per-token pricing incl. IDR conversion and any discount, capability flags, and
# the reasoning surface), so the sync is a thin, override-only translation.
#
# Reasoning: the catalog reports each model's real per-model effort surface in providers[].
# reasoning_efforts, mapped to reasoning_options as:
#   []          -> [] (always-on: reasons, no caller control)
#   ["none"]    -> toggle (reasoning_effort = "none" is off; carries a leading wire comment)
#   graded set  -> effort, using the model's real levels (lab + same-surface peers), never a
#                  full enum. Host ceiling is none|minimal|low|medium|high|xhigh|max.
# When has_toggle is true, toggle is authored alongside graded effort (excluding "none").
# A reasoning model that does not report a surface is skipped and reported (its controls are
# unknown, not always-on). Capability flags come from the catalog, not lab metadata.
#
# Streaming: Neosantara normalizes reasoning output across all upstream providers into the
# OpenAI-compatible delta.reasoning_content field (see https://docs.neosantara.xyz/en/capability/reasoning).
# All reasoning models therefore advertise interleaved.field = "reasoning_content".
name = "Neosantara"
env = ["NEOSANTARA_API_KEY"]
npm = "@ai-sdk/openai-compatible"
api = "https://api.neosantara.xyz/v1"
doc = "https://docs.neosantara.xyz"
