# Effort: reasoning_effort = "none" turns thinking off; graded levels control depth.
# Documented at https://docs.neosantara.xyz/en/capability/reasoning
base_model = "anthropic/claude-sonnet-4-6"
description = "Anthropic Claude Sonnet 4.6 is the most capable Sonnet model, upgraded for coding, computer use, long-context reasoning, agent planning, knowledge work, and design."

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "max"]

[cost]
input = 3
output = 15
cache_read = 0.3
cache_write = 3.75

[limit]
context = 200_000

[modalities]
input = ["text", "image"]
