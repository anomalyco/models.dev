# Effort: reasoning_effort controls thinking depth.
# Documented at https://docs.neosantara.xyz/en/capability/reasoning
base_model = "zhipuai/glm-5.3-flash"
description = "GLM-5.3-Flash is a lightweight, ultra-fast language model by Z.ai supporting a 1M context window, high-throughput text generation, native reasoning mode, JSON mode, and function calling."

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 0.15
output = 0.5
cache_read = 0.03

[modalities]
input = ["text", "image"]
