# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|high|max
# Documented at https://docs.neosantara.xyz/en/capability/reasoning
base_model = "moonshotai/kimi-k3"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 3
output = 15
cache_read = 0.3

[modalities]
input = ["text", "image"]
