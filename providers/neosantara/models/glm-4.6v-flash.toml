# Source (accessed 2026-09-06):
# - https://api.neosantara.xyz/v1/models?currency=USD (pricing USD/MTok, free tier 0/0/0/0; modalities text+image, no video)
# - https://docs.neosantara.xyz/en/capability/reasoning (reasoning_effort none disables thinking on toggleable IDs; reasoning_content side channel)
# Toggle: reasoning_effort = "none" is off; default (field omitted) is on. No graded effort on this ID. Shape matches ZAI peer glm-4.6v toggle-only.
# Cost: USD/MTok free tier per host catalog (ZAI peer glm-4.6v non-flash is paid 0.3/0.9; flash variant is host free tier).
# Modalities: catalog row glm-4.6v-flash lists text+image only; drops lab video.
# Interleaved: reasoning_content per host docs (host delta vs native).
base_model = "zhipuai/glm-4.6v-flash"

[[reasoning_options]]
type = "toggle"

[interleaved]
field = "reasoning_content"

[cost]
input = 0
output = 0
cache_read = 0
cache_write = 0

[modalities]
input = ["text", "image"]