# Effort: reasoning_effort controls thinking depth.
# Documented at https://docs.neosantara.xyz/en/capability/reasoning
base_model = "google/gemini-3.5-flash"
description = "Google Gemini Flash model optimized for fast, cost-efficient general-purpose tasks."

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["minimal", "low", "medium", "high"]

[cost]
input = 1.5
output = 9
cache_read = 0.15

[limit]
context = 1_000_000

[modalities]
input = ["text", "image"]
