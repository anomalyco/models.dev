# Effort: reasoning_effort controls thinking depth.
# Documented at https://docs.neosantara.xyz/en/capability/reasoning
base_model = "google/gemini-3.7-flash"
description = "The next iteration in the Gemini 3 model family, featuring algorithmic improvements to its core reasoning foundation and customizable thinking configurations to control the mix of quality, cost, and latency."

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
input = 0.75
output = 3.75
cache_read = 0.075
cache_write = 0.75

[limit]
context = 1_000_000

[modalities]
input = ["text", "image"]
