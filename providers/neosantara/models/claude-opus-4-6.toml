# Source (accessed 2026-09-06):
# - https://docs.neosantara.xyz/en/capability/reasoning (reasoning_effort none|minimal|low|medium|high|xhigh|max, none disables; reasoning_content side channel)
# - https://api.neosantara.xyz/v1/models?currency=USD (pricing USD/MTok; context 200k; no reliable max_output)
# Effort: reasoning_effort = "none" turns thinking off; graded levels control depth. Catalog row claude-opus-4-6 reports ["none","low","medium","high","max"].
# Cost: USD/MTok, matches first-party providers/anthropic/models/claude-opus-4-6.toml (5/25/0.5/6.25).
# Limit: context 200k per catalog (lab 1M); output inherits lab 128k (catalog has no reliable max_output).
# No budget_tokens: catalogued surface is the OpenAI-path reasoning_effort control; reasoning.max_tokens is an output cap, not a reasoning budget.
base_model = "anthropic/claude-opus-4-6"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "max"]

[cost]
input = 5
output = 25
cache_read = 0.5
cache_write = 6.25

[limit]
context = 200_000