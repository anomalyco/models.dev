# Effort: reasoning_effort controls thinking depth.
# Documented at https://docs.neosantara.xyz/en/capability/reasoning
base_model = "anthropic/claude-opus-5"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh", "max"]

[cost]
input = 5
output = 25

[modalities]
input = ["text", "image"]
