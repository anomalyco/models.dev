# Toggle: reasoning.enabled = true|false
# Effort: reasoning_effort = low|medium|high
# Documented at https://docs.neosantara.xyz/en/capability/reasoning
base_model = "anthropic/claude-opus-4-5"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
input = 5
output = 25
cache_read = 0.5
cache_write = 6.25

[modalities]
input = ["text", "image"]
