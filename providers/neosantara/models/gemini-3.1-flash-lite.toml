# Source (accessed 2026-09-06):
# - https://api.neosantara.xyz/v1/models?currency=USD (pricing USD/MTok; modalities text+image+pdf, no video/audio)
# - https://docs.neosantara.xyz/en/capability/reasoning (reasoning_effort levels; reasoning_content side channel)
# - https://docs.neosantara.xyz/en/capability/image-understanding (image supported)
# Effort: values match first-party providers/google/models/gemini-3.1-flash-lite.toml (minimal/low/medium/high).
# Cost: USD/MTok, matches first-party (0.25/1.50/0.025).
# Modalities: catalog row gemini-3.1-flash-lite lists text+image+pdf only; drops lab video,audio.
# Interleaved: reasoning_content per host docs (host delta vs native).
base_model = "google/gemini-3.1-flash-lite"
reasoning_options = [{ type = "effort", values = ["minimal", "low", "medium", "high"] }]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.25
output = 1.50
cache_read = 0.025

[modalities]
input = ["text", "image", "pdf"]