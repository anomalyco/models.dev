# FX: IDR prices converted to USD at 1 USD = 16000 IDR (ExchangeRate-API, 2026-09-03).
base_model = "openai/gpt-5-nano"
base_model_omit = ["limit.input"]

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["minimal", "low", "medium", "high"]

[cost]
input = 0.050625
output = 0.405313

[limit]
context = 128_000
