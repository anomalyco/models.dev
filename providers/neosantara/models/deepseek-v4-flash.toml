# Toggle: reasoning_effort = "none" turns thinking off; any other accepted
# value turns it on. https://docs.neosantara.xyz/en/capability/reasoning
base_model = "deepseek/deepseek-v4-flash"
attachment = true
structured_output = false

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 0.14
output = 0.28
cache_read = 0.0028

[modalities]
input = ["text", "image"]
