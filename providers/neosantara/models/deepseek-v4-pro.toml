# Toggle: reasoning_effort = "none" turns reasoning off; any other accepted
# value turns it on. Omitting the field defaults to off. This host has no separate on/off
# field: reasoning.enabled alone does not enable reasoning.
# https://docs.neosantara.xyz
base_model = "deepseek/deepseek-v4-pro"
attachment = true
structured_output = false

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "toggle"

[cost]
input = 2.4
output = 4.8
cache_read = 0.024

[modalities]
input = ["text", "image"]
