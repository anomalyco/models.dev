# Toggle: reasoning_effort = "none" turns thinking off; any other accepted
# value turns it on. https://docs.neosantara.xyz/en/capability/reasoning
base_model = "deepseek/deepseek-v4-pro"
attachment = true
structured_output = false

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["high", "max"]

[cost]
input = 2.4
output = 4.8
cache_read = 0.024

[modalities]
input = ["text", "image"]
