# Deployment limitation: text-only deployment on this host (upstream Kiro backend ignores image/multimodal input).
# Modalities explicitly restricted to text input with attachments disabled.
# Effort: reasoning_effort = "none" turns thinking off; graded levels control depth.
# Documented at https://docs.neosantara.xyz/en/capability/reasoning
base_model = "openai/gpt-5.6-sol"
base_model_omit = ["limit.input"]
attachment = false

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "xhigh", "max"]

[cost]
input = 5
output = 30

[limit]
context = 272_000

[modalities]
input = ["text"]
