# Effort: reasoning_effort = low|high|max (default high; always thinking, "off" returns 400)
# https://docs.privatemind.com/chat-completions.html#reasoning-effort
# Modalities: text and image. This deployment refuses `video_url`, and `file` is not a supported part type on this API.
schema = 2
base_model = "moonshotai/kimi-k3"
name = "Kimi K3 2.8T-104B"
description = "Frontier agentic coding, native vision, 500K context"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
temperature = true

[limit]
context = 500_000

[cost.text.input]
price = 3
cache = { read = 0.3 }

[cost.text.output]
price = 15
