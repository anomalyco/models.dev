# Toggle: reasoning_effort = off|low|medium|high ("off" disables thinking; any listed level enables it)
# Effort: reasoning_effort = low|medium|high
# https://docs.privatemind.com/chat-completions.html#reasoning-effort
# Modalities: text, image and video, inherited from the lab entry and confirmed by a `video_url` request billing video tokens. `file` is not a supported part type on this API.
schema = 2
base_model = "alibaba/qwen3.8-27b"
name = "Qwen 3.8 27B"
description = "The everyday default: fast dense 27B with vision, thinking and tools"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "video/mp4", "video/x-msvideo", "video/x-matroska", "video/quicktime", "video/x-flv", "video/x-ms-wmv"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 0.4
cache = { read = 0.04 }

[cost.text.output]
price = 3.8
