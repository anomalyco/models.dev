# Effort: reasoning_effort = low|high|max (default high; always thinking, "off" returns 400)
# https://docs.privatemind.com/chat-completions.html#reasoning-effort
# Modalities: text and image. This deployment refuses `video_url`, and `file` is not a supported part type on this API.
base_model = "zhipuai/glm-5.3-flash"
name = "GLM 5.3 Flash 320B-18B"
description = "The coding model: fast agentic coding with vision, 320B MoE"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 0.25
output = 0.75
cache_read = 0.025

[limit]
context = 524_288

[modalities]
input = ["text", "image"]
