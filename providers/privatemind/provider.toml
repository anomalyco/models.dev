# Reasoning HTTP control (accessed 2026-10-11):
# POST https://api.privatemind.com/v1/chat/completions accepts top-level
# reasoning_effort = "off" | "low" | "medium" | "high" | "max", with "minimal"
# taken as an alias for "low".
# The hybrid models (the entries here whose reasoning carries toggle = true)
# accept "off", which disables thinking: the response comes back with
# no message.reasoning and reasoning_tokens 0, the negative control. The other
# levels reach the chat template as distinct requests, and they are published
# in capabilities.reasoning_effort_levels. Measured 2026-10-11 on
# qwen3-8-27b-nvfp4 at temperature 0, two requests per level on one probability
# question, reading completion_tokens_details.reasoning_tokens: off 0, low 207,
# medium 203, high 169, each pair identical. A different question on
# 2026-09-27 gave low 83, medium 88, high 114, so each level is its own request
# and how long it thinks depends on the question. On
# nemotron-3-5-super-vl-nvfp4 (2026-10-21, same question and settings): off 0
# on both requests, medium 120 and 133, high 173 and 198. On
# deepseek-v4-1-flash (2026-11-02, same question and settings): off 0 on both,
# low 37 and 37, medium 41 and 43, high 37 and 37, max 39 and 37; on a harder
# counting question, one request each, low 2574, high 3024, max 3903.
# "max" is accepted, and on qwen3-8-27b-nvfp4 it returns the same trace as
# "high", so it is not advertised there; deepseek-v4-1-flash lists it. "xhigh",
# which the lab and the relay peers of these weights use as their top level, is
# refused at this API: HTTP 400, "invalid reasoning_effort 'xhigh': expected one
# of off, low, medium, high, max (minimal accepted as alias for low)". Canonical
# "high" is what maps onto the template's xhigh here, so the published list is
# the host's vocabulary rather than the lab's.
# Thinking-only deployments publish capabilities.reasoning_mandatory = true
# and carry effort only, with no toggle, because thinking cannot be
# turned off. Probed 2026-10-11 on Kimi K3 and GLM 5.3: "off" returns HTTP 400,
# "reasoning_effort='off' is not supported by this model (mode: thinking-only;
# reasoning is always on)", where the same value on the hybrid returns 200.
# The accepted depths are listed in capabilities.reasoning_effort_levels
# (both: low | high | max) and the level applied
# to a request that omits the field is published as
# capabilities.reasoning_effort_default. A value outside that list is accepted
# rather than rejected and resolves to a served depth ("medium" on kimi-k3
# returns 200 with a reasoning trace).
# A dial that lists "off" among its values carries both controls.
# mimo-v2-6-pro is a hybrid with no graded levels, so it carries the toggle
# alone: "off" returns reasoning_tokens 0 on both requests, and low, high and
# max return the same 30-token trace (2026-11-02, same question and settings).
# Feature-detect via supported_parameters + capabilities on GET /v1/models.
#
# Pricing (accessed 2026-11-02): GET /v1/models quotes list prices (USD per
# MTok) to API-key callers only; the anonymous listing names models without
# prices. The sync sends PRIVATEMIND_API_KEY when set and otherwise keeps
# the authored [cost]. The listing is scoped to the caller's organisation: on
# 2026-11-02 the keyed listing returned 15 model ids and the anonymous one 14,
# the extra being a model granted to the key's organisation alone. The sync
# therefore publishes only ids the anonymous listing returns and takes their
# prices from the keyed one. A deployment also leaves the listing while being
# migrated, so the adapter does not delete on absence: a model that disappears
# is retained and reported for a human to retire.
#
# Modalities (probed per deployment, POST /v1/chat/completions, 2026-10-11
# unless noted):
#   qwen3-8-27b-nvfp4   video_url -> 200, usage reports
#                       prompt_tokens_details.multimodal_tokens.video = 176
#   kimi-k3             video_url -> 400 "At most 0 video(s) may be
#                       provided in one prompt. (parameter=video)"
#   glm-5-3-nvfp4       image_url and video_url -> 400 "glm-5-3-nvfp4 is not
#                       a multimodal model", matching its text-only lab entry
#   nemotron-3-5-super-vl-nvfp4 (2026-10-21)
#                       image_url -> 200, multimodal_tokens.image = 272;
#                       video_url -> 400, the same error as kimi-k3
#   deepseek-v4-1-flash and mimo-v2-6-pro (2026-11-02)
#                       image_url, input_audio and video_url -> 400 "At most 0
#                       image(s)" / "audio(s)" / "video(s) may be provided in
#                       one prompt"; both are listed as plain chat models
# So video is inherited from the lab entry on Qwen 3.8 27B and dropped on Kimi
# K3 and Nemotron 3.5 Super VL, and the two plain chat models take text only.
# Image formats (2026-11-02, the same picture in each): JPEG, PNG, GIF, WebP and
# BMP load on all three vision models, and TIFF on qwen3-8-27b-nvfp4; HEIC
# returns 400 "Failed to load image: cannot identify image file" on all three,
# so HEIC and HEIF are dropped from the formats inherited from each lab entry.
# Every video container in qwen3.8-27b's lab entry (MP4, AVI, MKV, MOV, FLV,
# WMV) bills video tokens on qwen3-8-27b-nvfp4. `file` is refused on all six
# ("Unsupported chat content part type: 'file'"), so no deployment takes a
# document. /v1/models carries only `image_input`, so the lab entry remains the
# source of truth for the rest.
#
# Prices as quoted by GET /v1/models with an API key on 2026-11-02, USD per
# MTok, from cost.input_per_m_token / output_per_m_token / cache_read_per_m_token:
#   kimi-k3             3.0  / 15.0 / 0.3
#   glm-5-3-nvfp4       2.0  / 7.0  / 0.2
#   qwen3-8-27b-nvfp4   0.4  / 3.8  / 0.04
#   nemotron-3-5-super-vl-nvfp4 0.17 / 0.67 / 0.07
#   deepseek-v4-1-flash 0.33 / 1.33 / 0.033
#   mimo-v2-6-pro       0.66 / 1.33 / 0.066
# Each cost block is that model's row and nothing else; the anonymous
# listing omits the field, so those six rows are the only citation there is.
#
# temperature (accessed 2026-11-02): a live sampling control on these
# deployments, advertised per-model in supported_parameters. The kimi-k3
# entry keeps temperature = true over the lab entry's false; the same
# true-over-false override on this base is carried by aiand, arcee, baseten,
# chutes, engy, iteracompute, kilo, neon, openrouter, prime, synthetic and wally.
# https://docs.privatemind.com/chat-completions.html#reasoning-effort
# https://api.privatemind.com/v1/models
name = "PrivateMind"
npm = "@ai-sdk/openai-compatible"
opencodeai = "@opencode/ai/providers/openai-compatible"
api = "https://api.privatemind.com/v1"
env = ["PRIVATEMIND_API_KEY"]
doc = "https://docs.privatemind.com"
