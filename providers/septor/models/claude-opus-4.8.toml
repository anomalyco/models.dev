# Price = midpoint of Septor's published range (input 1.765274-5, output 8.826372-25 USD per 1M tokens).
# Range-priced models bill between the floor and the ceiling and never above the ceiling.
# Source: https://septorlabs.com/models/claude-opus-4.8
# Effort: reasoning_effort = none|low|medium|high (https://septorlabs.com/docs/introduction)
schema = 2
base_model = "anthropic/claude-opus-4-8"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 3.382637
cache = { read = 0.5 }

[cost.text.output]
price = 16.913186
