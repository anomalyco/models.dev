# Price = midpoint of Septor's published range (input 0.922456-1, output 4.612281-5 USD per 1M tokens).
# Range-priced models bill between the floor and the ceiling and never above the ceiling.
# Source: https://septorlabs.com/models/claude-haiku-4.5
# Effort: reasoning_effort = none|low|medium|high (https://septorlabs.com/docs/introduction)
schema = 2
base_model = "anthropic/claude-haiku-4-5"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.961228
cache = { read = 0.1 }

[cost.text.output]
price = 4.80614
