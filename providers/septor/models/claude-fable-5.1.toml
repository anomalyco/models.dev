# Price = midpoint of Septor's published range (input 3.532892-10, output 17.664461-50 USD per 1M tokens).
# Range-priced models bill between the floor and the ceiling and never above the ceiling.
# Source: https://septorlabs.com/models/claude-fable-5.1
# Effort: reasoning_effort = low|medium|high (https://septorlabs.com/docs/introduction)
# Always-on reasoning: reasoning_effort = none is accepted and falls back to low.
schema = 2
base_model = "anthropic/claude-fable-5-1"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 6.766446
cache = { read = 0.250367 }

[cost.text.output]
price = 33.832231
