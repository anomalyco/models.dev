# Price = midpoint of Septor's published range (input 0.4485-1.0925, output 2.07-4.6 USD per 1M tokens).
# Range-priced models bill between the floor and the ceiling and never above the ceiling.
# Source: https://septorlabs.com/models/kimi-k2.6
# Effort: reasoning_effort = low|medium|high (https://septorlabs.com/docs/introduction)
# Always-on reasoning: reasoning_effort = none is accepted and falls back to low.
schema = 2
base_model = "moonshotai/kimi-k2.6"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.7705
cache = { read = 0.26 }

[cost.text.output]
price = 3.335
