# Price = midpoint of Septor's published range (input 0.681743-4, output 4.689256-20 USD per 1M tokens).
# Range-priced models bill between the floor and the ceiling and never above the ceiling.
# Source: https://septorlabs.com/models/gpt-5.6-sol
# Effort: reasoning_effort = none|low|medium|high (https://septorlabs.com/docs/introduction)
schema = 2
base_model = "openai/gpt-5.6-sol"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 2.340871
cache = { read = 0.486891 }

[cost.text.output]
price = 12.344628
