# Price = midpoint of Septor's published range (input 1.15-2, output 5.75-10 USD per 1M tokens).
# Range-priced models bill between the floor and the ceiling and never above the ceiling.
# Source: https://septorlabs.com/models/gemini-4-argon
# Effort: reasoning_effort = none|low|medium|high (https://septorlabs.com/docs/introduction)
schema = 2
base_model = "google/gemini-4-argon"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[limit]
output = 943718

[cost.text.input]
price = 1.575
cache = { read = 0.1 }

[cost.text.output]
price = 7.875
