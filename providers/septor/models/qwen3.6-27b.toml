# Price = midpoint of Septor's published range (input 0.25875-0.37375, output 2.277-3.7375 USD per 1M tokens).
# Range-priced models bill between the floor and the ceiling and never above the ceiling.
# Source: https://septorlabs.com/models/qwen3.6-27b
# Effort: reasoning_effort = none|low|medium|high (https://septorlabs.com/docs/introduction)
schema = 2
base_model = "alibaba/qwen3.6-27b"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[limit]
output = 262144

[cost.text.input]
price = 0.31625
cache = { read = 0.0325 }

[cost.text.output]
price = 3.00725
