# Source: https://septorlabs.com/models/gpt-5.4-nano
# Effort: reasoning_effort = none|low|medium|high (https://septorlabs.com/docs/introduction)
schema = 2
base_model = "openai/gpt-5.4-nano"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.2
cache = { read = 0.018 }

[cost.text.output]
price = 1.25
