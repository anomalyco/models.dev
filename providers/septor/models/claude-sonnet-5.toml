# Price = midpoint of Septor's published range (input 0.714647-2, output 3.573233-10 USD per 1M tokens).
# Range-priced models bill between the floor and the ceiling and never above the ceiling.
# Source: https://septorlabs.com/models/claude-sonnet-5
# Effort: reasoning_effort = none|low|medium|high (https://septorlabs.com/docs/introduction)
schema = 2
base_model = "anthropic/claude-sonnet-5"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 1.357324
cache = { read = 0.2 }

[cost.text.output]
price = 6.786617
