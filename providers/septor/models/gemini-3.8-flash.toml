# Price = midpoint of Septor's published range (input 0.560625-0.825, output 2.803125-4.125 USD per 1M tokens).
# Range-priced models bill between the floor and the ceiling and never above the ceiling.
# Source: https://septorlabs.com/models/gemini-3.8-flash
# Effort: reasoning_effort = none|low|medium|high (https://septorlabs.com/docs/introduction)
schema = 2
base_model = "google/gemini-3.8-flash"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.692813
cache = { read = 0.0825 }

[cost.text.output]
price = 3.464062
