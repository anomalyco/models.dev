# Price = midpoint of Septor's published range (input 0.049713-0.161, output 0.099428-0.322 USD per 1M tokens).
# Range-priced models bill between the floor and the ceiling and never above the ceiling.
# Source: https://septorlabs.com/models/mimo-v2.6-flash
# Effort: reasoning_effort = none|low|medium|high (https://septorlabs.com/docs/introduction)
schema = 2
base_model = "xiaomi/mimo-v2.6-flash"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 1050000

[cost.text.input]
price = 0.105357
cache = { read = 0.004133 }

[cost.text.output]
price = 0.210714
