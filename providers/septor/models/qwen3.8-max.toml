# Price = midpoint of Septor's published range (input 0.706578-2.875, output 2.119735-8.625 USD per 1M tokens).
# Range-priced models bill between the floor and the ceiling and never above the ceiling.
# Source: https://septorlabs.com/models/qwen3.8-max
# Effort: reasoning_effort = none|low|medium|high (https://septorlabs.com/docs/introduction)
schema = 2
base_model = "alibaba/qwen3.8-max"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 256000

[cost.text.input]
price = 1.790789
cache = { read = 0.40625 }

[cost.text.output]
price = 5.372368
