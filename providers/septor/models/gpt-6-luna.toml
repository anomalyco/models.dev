# Price = midpoint of Septor's published range (input 0.036038-0.1, output 0.18019-0.5 USD per 1M tokens).
# Range-priced models bill between the floor and the ceiling and never above the ceiling.
# Source: https://septorlabs.com/models/gpt-6-luna
# Effort: reasoning_effort = none|low|medium|high (https://septorlabs.com/docs/introduction)
schema = 2
base_model = "openai/gpt-6-luna"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.068019
cache = { read = 0.01364 }

[cost.text.output]
price = 0.340095
