# Price = midpoint of Septor's published range (input 0.155435-0.50025, output 0.310871-1.0005 USD per 1M tokens).
# Range-priced models bill between the floor and the ceiling and never above the ceiling.
# Source: https://septorlabs.com/models/mimo-v2.6-pro
# Effort: reasoning_effort = none|low|medium|high (https://septorlabs.com/docs/introduction)
schema = 2
base_model = "xiaomi/mimo-v2.6-pro"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 1050000

[cost.text.input]
price = 0.327842
cache = { read = 0.005967 }

[cost.text.output]
price = 0.655685
