# Price = midpoint of Septor's published range (input 0.717952-2, output 3.589757-10 USD per 1M tokens).
# Range-priced models bill between the floor and the ceiling and never above the ceiling.
# Source: https://septorlabs.com/models/claude-sonnet-5.5
# Effort: reasoning_effort = low|medium|high (https://septorlabs.com/docs/introduction)
# Always-on reasoning: reasoning_effort = none is accepted and falls back to low.
schema = 2
base_model = "anthropic/claude-sonnet-5-5"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 1.358976
cache = { read = 0.1 }

[cost.text.output]
price = 6.794879
