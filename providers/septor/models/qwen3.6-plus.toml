# Price = midpoint of Septor's published range (input 0.4225-0.8125, output 2.535-4.875 USD per 1M tokens).
# Range-priced models bill between the floor and the ceiling and never above the ceiling.
# Source: https://septorlabs.com/models/qwen3.6-plus
# Effort: reasoning_effort = none|low|medium|high (https://septorlabs.com/docs/introduction)
schema = 2
base_model = "alibaba/qwen3.6-plus"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.6175
cache = { read = 0.169148 }

[cost.text.output]
price = 3.705
