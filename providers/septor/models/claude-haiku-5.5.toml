# Price = midpoint of Septor's published range (input 0.0575-0.1, output 0.2875-0.5 USD per 1M tokens).
# Range-priced models bill between the floor and the ceiling and never above the ceiling.
# Source: https://septorlabs.com/models/claude-haiku-5.5
# Effort: reasoning_effort = none|low|medium|high (https://septorlabs.com/docs/introduction)
schema = 2
base_model = "anthropic/claude-haiku-5-5"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.07875
cache = { read = 0.0425 }

[cost.text.output]
price = 0.39375
