# Synced from GMI Cloud's model listing (GET https://api.gmi-serving.com/v1/models), fetched 2026-10-30.
# Context length and list prices (USD per 1M tokens) are GMI's published values; quantization: fp8.
# Controls: none, by affirmative evidence: GMI's LLM API Reference (docs.gmicloud.ai,
# verified 2026-10-31) documents no reasoning parameters (only max_tokens/temperature/
# top_p/stop/stream), and GMI's /v1/models lists no reasoning_options for this id.
# Same-surface peers disagree (kilo ["high"]; venice low|medium|high / meganova none),
# so no wire path exists to carry an effort claim.
schema = 2
base_model = "moonshotai/kimi-k2-thinking"

[capabilities]
reasoning = { supported = true }

# limit.context omitted: identical to the lab's 262_144 (provider files hold only real overrides).

[cost.text.input]
price = 0.8

[cost.text.output]
price = 1.2
