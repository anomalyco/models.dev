# Synced from GMI Cloud's model listing (GET https://api.gmi-serving.com/v1/models), fetched 2026-10-30.
# Context length and list prices (USD per 1M tokens) are GMI's published values; quantization: fp8.
# Controls: DeepSeek V4 relay baseline (zenmux, llmgateway), same as providers/deepseek/models/deepseek-v4-pro.toml.
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|high|max
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }

[limit]
context = 1_048_575

[cost.text.input]
price = 0.3
cache = { read = 0.006 }

[cost.text.output]
price = 1.2
