# Synced from GMI Cloud's model listing (GET https://api.gmi-serving.com/v1/models), fetched 2026-10-30.
# Context length and list prices (USD per 1M tokens) are GMI's published values; quantization: fp8.
# Controls: copied from providers/google/models/gemini-3.1-pro-preview.toml (first-party entry).
# Effort: thinking_level = low|medium|high
schema = 2
base_model = "google/gemini-3.1-pro-preview"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[limit]
context = 1_048_576

[cost.text.input]
price = 2

[cost.text.output]
price = 12
