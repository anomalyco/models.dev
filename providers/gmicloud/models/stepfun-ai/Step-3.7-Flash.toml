# Synced from GMI Cloud's model listing (GET https://api.gmi-serving.com/v1/models), fetched 2026-10-30.
# Context length and list prices (USD per 1M tokens) are GMI's published values; quantization: bf16.
# Controls: copied from providers/stepfun/models/step-3.7-flash.toml (first-party entry).
# Effort: reasoning_effort = low|medium|high
schema = 2
base_model = "stepfun/step-3.7-flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

# limit.context omitted: identical to the lab's 256_000 (provider files hold only real overrides).

[cost.text.input]
price = 0.2
cache = { read = 0.04 }

[cost.text.output]
price = 1.15
