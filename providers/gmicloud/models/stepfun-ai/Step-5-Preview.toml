# Synced from GMI Cloud's model listing (GET https://api.gmi-serving.com/v1/models), fetched 2026-10-30.
# Context length and list prices (USD per 1M tokens) are GMI's published values; quantization: fp8.
# Controls: copied from providers/stepfun/models/step-5-preview.toml (first-party entry).
# Effort: reasoning_effort = low|medium|high
schema = 2
base_model = "stepfun/step-5-preview"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[limit]
context = 1_048_576

[cost.text.input]
price = 1
cache = { read = 0.1 }

[cost.text.output]
price = 2.7
