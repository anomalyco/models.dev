# GMI's Responses endpoint sends reasoning effort as reasoning = { effort = "low" }.
schema = 2
base_model = "openai/gpt-5.5"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true

[cost.text.input]
price = 5
cache = { read = 0.5 }

[cost.text.output]
price = 30
