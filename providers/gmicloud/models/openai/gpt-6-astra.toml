# Synced from GMI Cloud's model listing (GET https://api.gmi-serving.com/v1/models), fetched 2026-10-30.
# Context length and list prices (USD per 1M tokens) are GMI's published values; quantization: fp8.
# Controls: copied from providers/openai/models/gpt-6-astra.toml (first-party entry).
# Effort: reasoning_effort = low|medium|high|xhigh|max
# GPT-5+ freeform (AGENTS.md): GMI documents no custom-tool grammar formats for its
# chat/responses APIs and a live grammar probe is currently blocked (account 402).
# `freeform` left unset pending evidence; native set for reference: providers/openai.
schema = 2
base_model = "openai/gpt-6-astra"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[limit]
context = 1_050_000

[cost.text.input]
price = 10
cache = { read = 1, write = 12.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 20
cache = { read = 2, write = 25 }

[cost.text.output]
price = 50

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 75
