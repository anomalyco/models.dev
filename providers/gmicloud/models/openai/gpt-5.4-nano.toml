# Synced from GMI Cloud's model listing (GET https://api.gmi-serving.com/v1/models), fetched 2026-10-30.
# Context length and list prices (USD per 1M tokens) are GMI's published values; quantization: fp8.
# Controls: copied from providers/openai/models/gpt-5.4-nano.toml (first-party entry).
# Effort: reasoning_effort = none|low|medium|high|xhigh
# GPT-5+ freeform (AGENTS.md): GMI documents no custom-tool grammar formats for its
# chat/responses APIs and a live grammar probe is currently blocked (account 402).
# `freeform` left unset pending evidence; native set for reference: providers/openai.
schema = 2
base_model = "openai/gpt-5.4-nano"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }

[limit]
context = 409_600

[cost.text.input]
price = 0.2
cache = { read = 0.02 }

[cost.text.output]
price = 1.25
