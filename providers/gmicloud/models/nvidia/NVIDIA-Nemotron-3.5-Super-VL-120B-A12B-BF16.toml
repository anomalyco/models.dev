# Synced from GMI Cloud's model listing (GET https://api.gmi-serving.com/v1/models), fetched 2026-10-30.
# Context length and list prices (USD per 1M tokens) are GMI's published values; quantization: bf16.
# Controls: relay baseline (kilo x2). thinkingmachines exposes toggle instead; not merged (toggle + none in effort is invalid).
schema = 2
base_model = "nvidia/nemotron-3.5-super-vl-120b-a12b"

[capabilities]
reasoning = { supported = true, effort = ["none", "high"] }

[limit]
context = 32_768

[cost.text.input]
price = 0.1
cache = { read = 0.05 }

[cost.text.output]
price = 0.5
