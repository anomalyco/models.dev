# Synced from GMI Cloud's model listing (GET https://api.gmi-serving.com/v1/models), fetched 2026-10-30.
# Context length and list prices (USD per 1M tokens) are GMI's published values; quantization: bf16.
# Controls: tencent-tokenhub (lab-side relay) toggle + effort; kilo exposes ["none","low","high"] as the effort-only form.
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|medium|high (https://cloud.tencent.com/document/product/1823/131208)
schema = 2
base_model = "tencent/hy3-preview"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high"] }

[limit]
context = 262_144

[cost.text.input]
price = 0.18
cache = { read = 0.06 }

[[cost.text.input.overrides]]
when = { context = { gt = 16_384 } }
price = 0.24
cache = { read = 0.09 }

[[cost.text.input.overrides]]
when = { context = { gt = 32_768 } }
price = 0.3
cache = { read = 0.12 }

[cost.text.output]
price = 0.6

[[cost.text.output.overrides]]
when = { context = { gt = 16_384 } }
price = 0.96

[[cost.text.output.overrides]]
when = { context = { gt = 32_768 } }
price = 1.2
