# Synced from GMI Cloud's model listing (GET https://api.gmi-serving.com/v1/models), fetched 2026-10-30.
# Context length and list prices (USD per 1M tokens) are GMI's published values; quantization: fp8.
schema = 2
v2_only = true
base_model = "xai/grok-4.5"

# base_model inherits reasoning = true; GMI's chat-completions API reference documents no
# reasoning control (https://docs.gmicloud.ai/inference-engine/api-reference/llm-api-reference,
# accessed 2026-10-30), so reasoning_options = [] (reasons with no caller control).

[capabilities]
reasoning = { supported = true }

[limit]
context = 2_000_000

[cost.text.input]
price = 2
cache = { read = 0.5 }

[cost.text.output]
price = 6

# Long-context tier (GMI pricing): above 200_000 prompt tokens -> $4/M input, $12/M output, $1/M cache read.
