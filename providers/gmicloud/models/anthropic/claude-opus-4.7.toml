# Image input: GMI's model page shows an image_url Chat Completions example; PDF input isn't documented. https://docs.gmicloud.ai/model-quickstarts/text/anthropic-claude-opus-4-7 (2026-10-21)
schema = 2
base_model = "anthropic/claude-opus-4-7"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[limit]
context = 409_600

[cost.text.input]
price = 4.5
cache = { read = 0.45 }

[cost.text.output]
price = 22.5

[experimental.modes.fast]
body = { speed = "fast" }
headers = { anthropic-beta = "fast-mode-2026-02-01" }

[experimental.modes.fast.cost.text.input]
price = 30
cache = { read = 3, write = 37.5 }

[experimental.modes.fast.cost.text.output]
price = 150
