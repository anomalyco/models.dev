# Image input: GMI's model page shows an image_url Chat Completions example; PDF input isn't documented. https://docs.gmicloud.ai/model-quickstarts/text/anthropic-claude-sonnet-4-6 (2026-10-21)
schema = 2
base_model = "anthropic/claude-sonnet-4-6"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, budget = { min = 1_024, max = 63_999 } }

[limit]
context = 409_600

[cost.text.input]
price = 3
cache = { read = 0.3 }

[cost.text.output]
price = 15
