# Prices: SCX AUD list prices (GET https://api.scx.ai/v1/models, pricing.prompt and pricing.completion), converted at 1 USD = 1.60218972 AUD on 2026-11-04; cached input is billed at 10% of the input rate.
# Thinking is always on and returned as `reasoning_content`: SCX rejects
# thinking.type = disabled and reasoning_effort = none ("This model's reasoning
# mode cannot be changed per request").
# Video input is rejected: an MP4 video_url (data URI or https URL) returns 400 "The request was
# rejected as invalid." on MiniMax-M3; the same data-URI request succeeds on SCX Qwen3.8-Max.
schema = 2
base_model = "minimax/MiniMax-M3"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.6
cache = { read = 0.06 }

[cost.text.output]
price = 2.4
