# SCX accepts max_tokens=1048576 (200 OK on a short prompt), so output is
# overridden from the moonshotai/kimi-k3 base entry (131072). Thinking is returned
# as `reasoning_content` on the message. `none` turns thinking off (no reasoning
# returned, n=3), and so do the thinking-disable params. Effort is none plus the
# lab's low/high/max; minimal, medium and xhigh are accepted but not clearly
# distinct at n=3.
schema = 2
base_model = "moonshotai/kimi-k3"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true

[limit]
output = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 2.8274
cache = { read = 0.2809 }

[cost.text.output]
price = 14.1307