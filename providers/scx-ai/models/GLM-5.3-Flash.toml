# Thinking is returned as `reasoning_content` on the message. SCX rejects none,
# minimal and medium; low, high, xhigh and max are accepted (n=3: low 0 reasoning
# chars, high 22, xhigh 348, max 420).
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "xhigh", "max"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.1248
cache = { read = 0.0250 }

[cost.text.output]
price = 0.3745