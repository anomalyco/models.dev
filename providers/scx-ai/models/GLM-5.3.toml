# Thinking is returned as `reasoning_content` on the message. SCX rejects none,
# minimal, medium and xhigh, and rejects the thinking-disable params; low, high
# and max are accepted (n=3: low 0 reasoning chars, high 41, max 292).
schema = 2
base_model = "zhipuai/glm-5.3"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.9799
cache = { read = 0.1810 }

[cost.text.output]
price = 3.0770