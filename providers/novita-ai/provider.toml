name = "Novita AI"
env = ["NOVITA_API_KEY"]
npm = "@ai-sdk/openai-compatible"
# Raw HTTP reasoning controls (verified 2026-09-17):
# Newer Novita routes accept `thinking.type = enabled|disabled`; the model
# headers identify routes tested with that control. Legacy routes may still
# use `enable_thinking` or `separate_reasoning` as documented by Novita.
# https://novita.ai/docs/api-reference/model-apis-llm-create-chat-completion
doc = "https://novita.ai/docs/guides/introduction"
api = "https://api.novita.ai/openai"
