# https://novita.ai/models/model-detail/tencent-hy3
# Effort: reasoning_effort = none|high; none suppresses reasoning. Native effort baseline retained; accepted aliases are not additional distinct levels.
# system_updates = false: the turn after a mid-conversation system message missed the cache in two trials while control turns hit (live 2026-10-20).
schema = 2
base_model = "tencent/hy3"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "high"] }
cache = { implicit = true }
structured_output = true
system_updates = false
effort_updates = false

[limit]
context = 262_144
output = 262_144

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.14
cache = { read = 0.035 }

[cost.text.output]
price = 0.58
