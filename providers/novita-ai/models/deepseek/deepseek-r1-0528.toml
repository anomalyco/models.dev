# https://novita.ai/models/model-detail/deepseek-deepseek-r1-0528
# Always-on reasoning is emitted as <think> in ordinary content on this route; no separate reasoning side channel was observed.
# system_updates = false: the turn after a mid-conversation system message missed the cache in two trials while control turns hit (live 2026-10-20).
# max_tokens_field: this route ignores max_completion_tokens while max_tokens caps output (live probe 2026-10-24)
schema = 2
base_model = "deepseek/deepseek-r1-0528"

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
cache = { implicit = true }
structured_output = true

[api.chat-completions]
compatibility = { max_tokens_field = "max_tokens" }

[cost.text.input]
price = 0.7
cache = { read = 0.35 }

[cost.text.output]
price = 2.5
