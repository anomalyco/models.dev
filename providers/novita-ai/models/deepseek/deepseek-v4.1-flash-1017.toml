# https://api.novita.ai/openai/v1/models (deepseek/deepseek-v4.1-flash-1017: $0.3/M input, $1.2/M output, $0.006/M cache read, context 1048576)
# Pricing parity with predecessor: https://novita.ai/models/model-detail/deepseek-deepseek-v4.1-flash
# Lab identity, Oct 17 minor update to V4.1 Flash: https://api-docs.deepseek.com/news/news261017/
# https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash-1017
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|high|max; native DeepSeek set: https://api-docs.deepseek.com/guides/thinking_mode/
# Chat API max_tokens 393216: https://api-docs.deepseek.com/api/create-chat-completion/
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
cache = { implicit = true }
structured_output = true
effort_updates = false

[limit]
context = 1_048_576
output = 393_216

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.messages]
base_url = "https://api.novita.ai/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[api.responses]
base_url = "https://api.novita.ai/openai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.3
cache = { read = 0.006 }

[cost.text.output]
price = 1.2
