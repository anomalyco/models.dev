# https://novita.ai/models/model-detail/deepseek-deepseek-v4-pro
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|high|max (current first-party baseline; all three values verified on Novita).
# system_updates = false: the turn after a mid-conversation system message missed the cache in two trials while control turns hit (live 2026-10-20).
schema = 2
base_model = "deepseek/deepseek-v4-pro"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
cache = { implicit = true }
structured_output = true
system_updates = false
effort_updates = false

[limit]
context = 1_048_576
output = 393_216

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.messages]
base_url = "https://api.novita.ai/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[api.responses]
base_url = "https://api.novita.ai/openai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 1.6
cache = { read = 0.135 }

[cost.text.output]
price = 3.2
