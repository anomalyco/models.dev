# https://novita.ai/models/model-detail/deepseek-deepseek-v4.1-flash
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|high|max; invalid values are rejected.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
cache = { implicit = true }
structured_output = true
effort_updates = false

[limit]
context = 1_048_576
output = 393_216

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.3
cache = { read = 0.006 }

[cost.text.output]
price = 1.2
