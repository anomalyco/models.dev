# https://novita.ai/models/model-detail/minimax-minimax-m3
# Toggle: thinking.type = enabled|disabled
# The second public pricing band starts at 524288 context tokens.
base_model = "minimax/MiniMax-M3"
structured_output = true
reasoning_options = [{ type = "toggle" }]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.3
output = 1.2
cache_read = 0.06

[[cost.tiers]]
tier = { type = "context", size = 524_288 }
input = 0.6
output = 2.4
cache_read = 0.12

[limit]
context = 1_000_000
output = 131_072
