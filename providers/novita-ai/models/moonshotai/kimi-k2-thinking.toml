# https://novita.ai/models/model-detail/moonshotai-kimi-k2-thinking
# Always-on reasoning; thinking.type=disabled is rejected.
# system_updates = true: cache hit right after a mid-conversation system message (live 2026-10-20).
schema = 2
base_model = "moonshotai/kimi-k2-thinking"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
cache = { implicit = true }
structured_output = true
system_updates = true
effort_updates = false

[limit]
output = 98_304

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.messages]
base_url = "https://api.novita.ai/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.6
cache = { read = 0.15 }

[cost.text.output]
price = 2.5
