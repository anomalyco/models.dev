# https://novita.ai/models/model-detail/moonshotai-kimi-k2.6
# Toggle: thinking.type = enabled|disabled
# system_updates = true: cache hit right after a mid-conversation system message (live 2026-10-20).
schema = 2
base_model = "moonshotai/kimi-k2.6"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true }
cache = { implicit = true }
structured_output = true
system_updates = true
effort_updates = false

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.8
cache = { read = 0.16 }

[cost.text.output]
price = 3.4
