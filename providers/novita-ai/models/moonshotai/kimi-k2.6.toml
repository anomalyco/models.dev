# https://novita.ai/models/model-detail/moonshotai-kimi-k2.6
# Toggle: thinking.type = enabled|disabled
# system_updates = true: cache hit right after a mid-conversation system message (live 2026-10-20).
# Per API: system_updates sits on [api.chat-completions] only, where it was tested; Messages is untested.
schema = 2
base_model = "moonshotai/kimi-k2.6"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true }
cache = { implicit = true }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
capabilities = { system_updates = true }

[api.messages]
base_url = "https://api.novita.ai/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.8
cache = { read = 0.16 }

[cost.text.output]
price = 3.4
