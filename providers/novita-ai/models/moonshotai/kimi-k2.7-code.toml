# https://novita.ai/models/model-detail/moonshotai-kimi-k2.7-code
# Always-on reasoning (native baseline); thinking.type=disabled and effort=none did not suppress it.
# system_updates = true: cache hit right after a mid-conversation system message (live 2026-10-20).
schema = 2
base_model = "moonshotai/kimi-k2.7-code"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
cache = { supported = true, implicit = true }
structured_output = true
system_updates = true
effort_updates = false

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.95
cache = { read = 0.19 }

[cost.text.output]
price = 4
