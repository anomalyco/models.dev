# https://novita.ai/models/model-detail/apodex-apodex-1.1-mini
# Toggle: thinking.type = enabled|disabled
# The public model page and /models both list zero input/output prices on 2026-10-09.
# system_updates = true: cache hit right after a mid-conversation system message (live 2026-10-20: mid turn 9,984 of 10,130 prompt tokens cached; usage.prompt_tokens_details.cached_tokens, reported here although no cache-read price is listed).
schema = 2
base_model = "apodex/apodex-1.1-mini"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true }
structured_output = true
system_updates = true
effort_updates = false

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0

[cost.text.output]
price = 0
