# https://novita.ai/models/model-detail/stepfun-step-3.7-flash
# Effort: reasoning_effort = low|medium|high (native baseline); thinking.type=disabled does not suppress reasoning.
schema = 2
base_model = "stepfun/step-3.7-flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
context = 262_144

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.2
cache = { read = 0.04 }

[cost.text.output]
price = 1.15
