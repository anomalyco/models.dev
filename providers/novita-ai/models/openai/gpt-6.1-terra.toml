# https://novita.ai/models/model-detail/openai-gpt-6.1-terra
# GET https://api.novita.ai/openai/v1/models (2026-11-18): $1 input / $5 output / $0.05 cache read per MTok (the sync applies the 2x input, 1.5x output band above 272K),
#   context_size 1_050_000, max_output_tokens 128_000 (both the lab's), endpoints as the catalog lists them.
# Effort: reasoning_effort = none|low|medium|high|xhigh (live 2026-11-18 on chat/completions; max is rejected with a 400 listing those five). none turns reasoning off, so no toggle.
# Cache: implicit (the catalog lists a cache read price and no write price).
schema = 2
base_model = "openai/gpt-6.1-terra"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
cache = { implicit = true }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.messages]
base_url = "https://api.novita.ai/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[api.responses]
base_url = "https://api.novita.ai/openai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 1
cache = { read = 0.05 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 2
cache = { read = 0.1 }

[cost.text.output]
price = 5

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 10
