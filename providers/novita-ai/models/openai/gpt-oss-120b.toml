# Novita /models lists image input, but live chat/completions replied it cannot view the supplied image (2026-09-20).
base_model = "openai/gpt-oss-120b"
name = "OpenAI GPT OSS 120B"
description = "Open-weight GPT model for self-hosted reasoning and instruction-following workloads"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
input = 0.05
output = 0.25
