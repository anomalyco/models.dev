# https://novita.ai/models/model-detail/qwen-qwen3.8-flash
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|medium|xhigh
# Budget: thinking_budget (reasoning tokens); cannot be combined with effort.
base_model = "alibaba/qwen3.8-flash"
reasoning_options = [{ type = "toggle" }, { type = "effort", values = ["low", "medium", "xhigh"] }, { type = "budget_tokens" }]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.15
output = 0.47
cache_read = 0.016
