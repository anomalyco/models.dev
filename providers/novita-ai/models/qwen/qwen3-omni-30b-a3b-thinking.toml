# https://novita.ai/models/model-detail/qwen-qwen3-omni-30b-a3b-thinking
# https://huggingface.co/Qwen/Qwen3-Omni-30B-A3B-Thinking
# Native thinking-only checkpoint; no caller toggle/budget is established. Novita rejects the tested enable/effort controls and emits no separate reasoning on the tested prompts, which does not establish that the checkpoint lacks reasoning capability.
# Preserve the curated input-audio rate, which the inventory does not return; output-audio pricing is inapplicable to this text-output checkpoint.
schema = 2
base_model = "alibaba/qwen3-omni-30b-a3b-thinking"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
structured_output = true
effort_updates = false

[cost.text.input]
price = 0.25

[cost.text.output]
price = 0.97

[cost.audio.input]
price = 2.2
