# https://novita.ai/models/model-detail/qwen-qwen3-omni-30b-a3b-thinking
# https://huggingface.co/Qwen/Qwen3-Omni-30B-A3B-Thinking
# Native thinking-only checkpoint; no caller toggle/budget is established. Novita rejects the tested enable/effort controls and emits no separate reasoning on the tested prompts, which does not establish that the checkpoint lacks reasoning capability.
# Input prices per modality (text 0.25, audio 2.2, image and video 0.46 USD/MTok) come from the inventory's `pricing.multimodal_input`; its output-audio price is inapplicable to this text-output checkpoint.
schema = 2
base_model = "alibaba/qwen3-omni-30b-a3b-thinking"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
structured_output = true
effort_updates = false

[cost.text.input]
price = 0.25

[cost.text.output]
price = 0.97

[cost.audio.input]
price = 2.2

[cost.image.input]
price = 0.46

[cost.video.input]
price = 0.46
