# Toggle: thinking.type = enabled|disabled
# Verified with Novita chat/completions on 2026-09-17: disabling removes reasoning_content.
# Budget: thinking_budget (integer reasoning tokens)
# Verified on Novita 2026-09-18: thinking_budget=64 produced 64 reasoning tokens; prices and context tiers come from GET /openai/v1/models.
base_model = "alibaba/qwen3-max"
description = "Flagship Qwen model for complex reasoning, coding, and agentic workflows"
reasoning = true
structured_output = true

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 0.845
output = 3.38

[[cost.tiers]]
tier = { type = "context", size = 32_768 }
input = 1.4
output = 5.64

[[cost.tiers]]
tier = { type = "context", size = 131_072 }
input = 2.11
output = 8.45
