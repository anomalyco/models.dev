# Toggle: thinking.type = enabled|disabled
# Budget: thinking_budget (integer reasoning tokens)
# Verified with Novita chat/completions on 2026-09-17: disabling removes reasoning_content.
base_model = "alibaba/qwen3.6-27b"
description = "The Qwen3.6 27B native vision-language dense model builds upon the 3.5-27B version, with key improvements in agentic coding capabilities and enhanced STEM reasoning and inference skills. In the vision modality, it demonstrates significant advances in spatial intelligence, object localization, and detection, while video understanding, document OCR, and visual agent capabilities continue to improve steadily."

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 0.6
output = 3.6

[modalities]
input = ["text", "image", "video"]
