# https://novita.ai/models/model-detail/qwen-qwen3.8-max
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|medium|xhigh
# thinking_budget requests are rejected on this route; do not inherit the lab API's budget control.
# Modalities: Novita lists ["text","image","video"]; exact types are the lab's (alibaba/qwen3.8-max).
# system_updates = true: cache hit right after a mid-conversation system message (live 2026-10-20).
schema = 2
base_model = "alibaba/qwen3.8-max"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic", "video/mp4", "video/x-msvideo", "video/x-matroska", "video/quicktime", "video/x-flv", "video/x-ms-wmv"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "xhigh"] }
cache = { implicit = true }
structured_output = true
system_updates = true
effort_updates = false

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 2
cache = { read = 0.25 }

[cost.text.output]
price = 6
