# https://novita.ai/models/model-detail/qwen-qwen3.8-max
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|medium|xhigh
# thinking_budget requests are rejected on this route; do not inherit the lab API's budget control.
schema = 2
base_model = "alibaba/qwen3.8-max"

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "xhigh"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 2
cache = { read = 0.25 }

[cost.text.output]
price = 6
