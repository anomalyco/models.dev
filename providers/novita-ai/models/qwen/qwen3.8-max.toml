# https://novita.ai/models/model-detail/qwen-qwen3.8-max
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|medium|xhigh
# thinking_budget requests are rejected on this route; do not inherit the lab API's budget control.
base_model = "alibaba/qwen3.8-max"
structured_output = true
reasoning_options = [{ type = "toggle" }, { type = "effort", values = ["low", "medium", "xhigh"] }]

[interleaved]
field = "reasoning_content"

[cost]
input = 2
output = 6
cache_read = 0.25

[modalities]
input = ["text", "image", "video"]
