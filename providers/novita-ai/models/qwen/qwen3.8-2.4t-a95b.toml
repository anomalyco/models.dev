# https://novita.ai/models/model-detail/qwen-qwen3.8-2.4t-a95b
# Effort: reasoning_effort = low|medium|xhigh; thinking.type=disabled is rejected.
# Budget: thinking_budget (reasoning tokens); cannot be combined with effort.
schema = 2
base_model = "alibaba/qwen3.8-2.4t-a95b"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "xhigh"], budget = {} }
structured_output = true

[limit]
context = 1_000_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 2
cache = { read = 0.25 }

[cost.text.output]
price = 6
