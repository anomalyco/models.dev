# https://novita.ai/models/model-detail/qwen-qwen3-reranker-8b
# https://novita.ai/docs/api-reference/model-apis-llm-create-rerank
# Public description identifies the text Qwen3 Reranker 8B; the site's HF mirror URL points to a different VL checkpoint.
# Reranking returns relevance scores, not generated completion tokens; pricing is represented as an input-token rate.
schema = 2
base_model = "alibaba/qwen3-reranker-8b"

[cost.text.input]
price = 0.05

[cost.text.output]
price = 0
