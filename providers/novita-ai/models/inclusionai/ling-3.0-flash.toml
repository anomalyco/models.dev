# https://novita.ai/models/model-detail/inclusionai-ling-3.0-flash
# Toggle: thinking.type = enabled|disabled
# system_updates = true: cache hit right after a mid-conversation system message (live 2026-10-20).
# max_tokens_field: this route ignores max_completion_tokens while max_tokens caps output (live probe 2026-10-24)
schema = 2
base_model = "inclusionai/ling-3.0-flash"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true }
cache = { implicit = true }
system_updates = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content", max_tokens_field = "max_tokens" }

[cost.text.input]
price = 0.06
cache = { read = 0.012 }

[cost.text.output]
price = 0.18
