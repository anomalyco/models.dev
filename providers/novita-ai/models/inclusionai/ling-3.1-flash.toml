# https://novita.ai/models/model-detail/inclusionai-ling-3.1-flash
# Toggle: thinking.type = enabled|disabled (Ling peer baseline; live checks returned server_overload).
# The public model page and /models both list zero input/output prices on 2026-10-09.
# system_updates = true: cache hit right after a mid-conversation system message (live 2026-10-20).
schema = 2
base_model = "inclusionai/ling-3.1-flash"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true }
cache = { supported = true, implicit = true }
system_updates = true
effort_updates = false

[limit]
output = 262_144

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.3
cache = { read = 0.06 }

[cost.text.output]
price = 0.9
