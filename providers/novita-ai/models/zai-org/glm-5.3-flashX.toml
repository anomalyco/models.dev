# https://novita.ai/models/model-detail/zai-org-glm-5.3-flashX
# Same weights as GLM-5.3-Flash on a faster serving path (Novita: "a speed-optimized version built on the same
#   foundation as GLM-5.3-Flash"; Z.ai lists GLM-5.3-FlashX the same way, see providers/zhipuai/models/glm-5.3-flashx.toml).
# GET https://api.novita.ai/openai/v1/models (2026-11-07): $0.37 / $0.075 cache read / $1.25 per MTok,
#   context_size 1_048_576, max_output_tokens 131_072, endpoints chat/completions, anthropic, responses.
# Effort: reasoning_effort = low|high|max (live 2026-11-07); thinking.type=disabled does not suppress reasoning on this route.
# Modalities: Novita lists ["text","image","video"]; exact types are the lab's (zhipuai/glm-5.3-flash).
# system_updates = true: cache hit right after a mid-conversation system message (live 2026-11-07, 17664 of 17710 prompt tokens cached).
schema = 2
base_model = "zhipuai/glm-5.3-flash"
name = "GLM 5.3 FlashX"

[modalities]
input = ["text", "image/jpeg", "image/png", "video/mp4", "video/x-matroska", "video/quicktime"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "high", "max"] }
cache = { implicit = true }
structured_output = true
system_updates = true

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.messages]
base_url = "https://api.novita.ai/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[api.responses]
base_url = "https://api.novita.ai/openai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.37
cache = { read = 0.075 }

[cost.text.output]
price = 1.25
