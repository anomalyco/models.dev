# https://novita.ai/models/model-detail/zai-org-glm-4.6
# Toggle: thinking.type = enabled|disabled
# system_updates = false: the turn after a mid-conversation system message missed the cache in two trials while control turns hit (live 2026-10-20).
schema = 2
base_model = "zhipuai/glm-4.6"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true }
cache = { implicit = true }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.messages]
base_url = "https://api.novita.ai/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.55
cache = { read = 0.11 }

[cost.text.output]
price = 2.2
