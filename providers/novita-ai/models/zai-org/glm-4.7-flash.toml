# https://novita.ai/models/model-detail/zai-org-glm-4.7-flash
# Toggle: thinking.type = enabled|disabled
# system_updates = false: the turn after a mid-conversation system message missed the cache in two trials while control turns hit (live 2026-10-20).
schema = 2
base_model = "zhipuai/glm-4.7-flash"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true }
cache = { supported = true, implicit = true }
structured_output = true
system_updates = false
effort_updates = false

[limit]
output = 128_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.07
cache = { read = 0.01 }

[cost.text.output]
price = 0.4
