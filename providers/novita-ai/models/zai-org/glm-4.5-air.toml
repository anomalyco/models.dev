# https://novita.ai/models/model-detail/zai-org-glm-4.5-air
# Toggle: thinking.type = enabled|disabled
# system_updates = false: the turn after a mid-conversation system message missed the cache in two trials while control turns hit (live 2026-10-20).
# max_tokens_field: this route ignores max_completion_tokens while max_tokens caps output (live probe 2026-10-24)
schema = 2
base_model = "zhipuai/glm-4.5-air"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true }
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content", max_tokens_field = "max_tokens" }

[cost.text.input]
price = 0.13
cache = { read = 0.025 }

[cost.text.output]
price = 0.85
