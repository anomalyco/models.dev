# https://novita.ai/models/model-detail/zai-org-glm-5.2
# Effort: reasoning_effort = none|high|max; none suppresses reasoning. Native graded baseline retained.
# system_updates = true: cache hit right after a mid-conversation system message (live 2026-10-20).
schema = 2
base_model = "zhipuai/glm-5.2"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "high", "max"] }
cache = { implicit = true }
structured_output = true
system_updates = true
effort_updates = false

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.4
cache = { read = 0.26 }

[cost.text.output]
price = 4.4
