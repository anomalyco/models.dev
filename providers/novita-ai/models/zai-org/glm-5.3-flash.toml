# https://novita.ai/models/model-detail/zai-org-glm-5.3-flash
# Effort: reasoning_effort = low|high|max; thinking.type=disabled does not suppress reasoning on this route.
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.15
cache = { read = 0.03 }

[cost.text.output]
price = 0.5
