# https://novita.ai/models/model-detail/zai-org-glm-5.3-flash
# Effort: reasoning_effort = low|high|max; thinking.type=disabled does not suppress reasoning on this route.
base_model = "zhipuai/glm-5.3-flash"
reasoning_options = [{ type = "effort", values = ["low", "high", "max"] }]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.15
output = 0.5
cache_read = 0.03

[limit]
context = 1_048_576

[modalities]
input = ["text", "image", "video"]
