# https://novita.ai/models/model-detail/baai-bge-reranker-v2-m3
# https://novita.ai/docs/api-reference/model-apis-llm-create-rerank
# Reranking returns relevance scores, not generated completion tokens; pricing is represented as an input-token rate.
schema = 2
base_model = "baai/bge-reranker-v2-m3"

[limit]
context = 8_000

[api.rerank]
sdk = { aisdk = "none", opencodeai = "none" }

[cost.text.input]
price = 0.01

[cost.text.output]
price = 0
