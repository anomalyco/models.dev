# https://novita.ai/models/model-detail/mindai-macaron-v1-venti
# Effort: reasoning_effort = none|high|max; none suppresses reasoning. Graded baseline follows GLM-5.2/Macaron's native high|max modes; accepted aliases are not distinct levels.
# https://recipes.vllm.ai/mindlab-research/Macaron-V1-Coding-Venti
# system_updates = true: cache hit right after a mid-conversation system message (live 2026-10-20).
schema = 2
base_model = "mindlab/macaron-v1-venti"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "high", "max"] }
cache = { implicit = true }
system_updates = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.messages]
base_url = "https://api.novita.ai/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[api.responses]
base_url = "https://api.novita.ai/openai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.825
cache = { read = 0.165 }

[cost.text.output]
price = 2.475
