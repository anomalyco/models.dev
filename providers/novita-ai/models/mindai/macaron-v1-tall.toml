# https://novita.ai/models/model-detail/mindai-macaron-v1-tall
# Modalities: text only on Novita; its catalog (https://api.novita.ai/openai/v1/models) lists mindai/macaron-v1-tall with
# input_modalities ["text"].
# Effort: reasoning_effort = none|high; this field, not thinking.type, suppresses reasoning with none.
# Other accepted effort values were not demonstrated to be distinct depth controls, so only the verified off/on effort values are represented.
# thinking.type=disabled does not suppress reasoning on this route; thinking_budget is not honored.
base_model = "mindlab/macaron-v1-tall"
reasoning_options = [{ type = "effort", values = ["none", "high"] }]
attachment = false

[interleaved]
field = "reasoning_content"

[cost]
input = 0.2475
output = 1.43
cache_read = 0.044

[modalities]
input = ["text"]
