# Sources (2026-11-11). Docs: https://docs.lyceum.technology/docs/inference/serverless
# - Model IDs, prices, cached-input prices, context_length and max_output_tokens: GET https://api.lyceum.technology/openai/v1/models
#   (needs an API key; it lists unit prices in USD and EUR, and the USD ones are used here). The same prices are public on
#   https://lyceum.technology/models/ and https://lyceum.technology/models.md ("Prices in US dollars per million tokens")
# - Only models on the public models page are listed. Routing aliases (lyceum/*), -instant IDs and retired IDs that now
#   resolve to another model are left out
# - limit.output: max_output_tokens from GET /models. The request check in #request-limits (max_tokens up to 131,072) is a
#   separate, higher cap
# - cache.implicit: #prompt-caching (automatic prefix caching, billed at the cached-input rate)
# - Image input: #which-models-accept-images and #image-and-pdf-input. Video input isn't documented, so it isn't listed
# - Reasoning controls: #controlling-reasoning. reasoning_field = reasoning_content per #reasoning-models,
#   except glm-5.3, deepseek-v4-flash-0731, deepseek-v4-pro-0813, kimi-k3 and kimi-k3.1-pro, which can return message.reasoning
# - reasoning_effort and tools are per-request fields, so effort_updates and tools.updates are left out (default false)
# - response_format is undocumented, so structured_output is unset
name = "Lyceum"
npm = "@ai-sdk/openai-compatible"
opencodeai = "@opencode/ai/providers/openai-compatible"
env = ["LYCEUM_API_KEY"]
api = "https://api.lyceum.technology/openai/v1"
doc = "https://docs.lyceum.technology/docs/inference/serverless"
