# Sources (accessed 2026-09-15):
# https://docs.lyceum.technology/docs/inference/serverless
# https://lyceum.technology/products/inference/models
# Toggle: reasoning_effort = none or chat_template_kwargs.thinking = false disables reasoning.
base_model = "moonshotai/kimi-k2.6"
reasoning_options = [{ type = "toggle" }]

[interleaved]
field = "reasoning_content"

[cost]
input = 1.00
output = 4.00
cache_read = 0.25

[limit]
output = 65_536

[modalities]
input = ["text", "image", "pdf"]
