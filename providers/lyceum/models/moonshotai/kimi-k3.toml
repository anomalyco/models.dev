# Sources (accessed 2026-09-15):
# https://docs.lyceum.technology/docs/inference/serverless
# https://lyceum.technology/products/inference/models
# Toggle: chat_template_kwargs.thinking = false disables reasoning; omission enables it.
# Effort: reasoning_effort = low|high|max.
base_model = "moonshotai/kimi-k3"
interleaved = true

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 3.00
output = 15.00
cache_read = 0.75

[limit]
output = 65_536

[modalities]
input = ["text", "image"]
