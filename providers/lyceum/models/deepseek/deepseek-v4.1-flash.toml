# Serves the 1017 build: GET https://api.lyceum.technology/openai/v1/models (2026-11-11) reports this ID as "DeepSeek V4.1 Flash 1017" (deepseek-ai/DeepSeek-V4.1-Flash-1017), so it links to that lab file.
# Limits: the same response gives context_length 1,048,576 and max_output_tokens 131,072.
# Prices: GET https://api.lyceum.technology/openai/v1/models (2026-11-26) gives USD unit prices of 0.00000033 input, 0.000000033 cached input and 0.0000013 output,
#   so 0.33 / 0.033 / 1.30 USD per million tokens. Same prices on https://lyceum.technology/models/ and https://lyceum.technology/models.md.
# Effort: reasoning_effort none|low|high|max (none = off).
# Off: reasoning_effort "none", the only switch the docs list for this model. https://docs.lyceum.technology/docs/inference/serverless#controlling-reasoning
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
cache = { implicit = true }

[limit]
context = 1_048_576
output = 131_072

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.33
cache = { read = 0.033 }

[cost.text.output]
price = 1.3
