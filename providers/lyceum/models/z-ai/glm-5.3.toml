# Sources (accessed 2026-09-15):
# https://docs.lyceum.technology/docs/inference/serverless
# https://lyceum.technology/products/inference/models
# Toggle: chat_template_kwargs.enable_thinking = false disables reasoning; omission enables it.
# Effort: reasoning_effort = low|high|max.
base_model = "zhipuai/glm-5.3"
interleaved = true

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 1.75
output = 4.50
cache_read = 0.44

[limit]
output = 65_536
