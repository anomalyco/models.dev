# Effort: reasoning_effort low|high|max (peer ladder); none only moves the trace into content, so it isn't listed.
# Trace comes back in message.reasoning, which v1 can't express, so no reasoning field is pinned. https://docs.lyceum.technology/docs/inference/serverless#reasoning-models
# Limits: GET https://api.lyceum.technology/openai/v1/models (2026-11-11) reports context_length 1,048,576 and max_output_tokens 65,536.
schema = 2
base_model = "zhipuai/glm-5.3"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
cache = { implicit = true }

[limit]
context = 1_048_576
output = 65_536

[cost.text.input]
price = 1.4
cache = { read = 0.26 }

[cost.text.output]
price = 4.4
