# Effort: reasoning_effort low|high|max (peer ladder); none only moves the trace into content, so it isn't listed.
# Limits: GET https://api.lyceum.technology/openai/v1/models (2026-11-11) reports context_length 1,048,576 and max_output_tokens 65,536.
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
cache = { implicit = true }

[limit]
context = 1_048_576
output = 65_536

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.2
cache = { read = 0.05 }

[cost.text.output]
price = 0.5
