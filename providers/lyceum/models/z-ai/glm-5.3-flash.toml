# Effort: reasoning_effort low|high|max (peer ladder); none only moves the trace into content, so it isn't listed.
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "high", "max"] }
cache = { supported = true, implicit = true }
effort_updates = false

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.2
cache = { read = 0.05 }

[cost.text.output]
price = 0.5
