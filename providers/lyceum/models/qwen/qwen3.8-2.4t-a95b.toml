# Sources (accessed 2026-09-15):
# https://docs.lyceum.technology/docs/inference/serverless
# https://lyceum.technology/products/inference/models
# Effort: reasoning_effort = low|medium|xhigh. The model cannot disable reasoning.
base_model = "alibaba/qwen3.8-2.4t-a95b"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "xhigh"]

[interleaved]
field = "reasoning_content"

[cost]
input = 2.50
output = 6.00
cache_read = 0.63

[limit]
output = 65_536
