# API: POST https://api.lyceum.technology/openai/v1/embeddings, embeddings endpoint only (https://docs.lyceum.technology/docs/inference/serverless#embeddings)
# Price and context: GET https://api.lyceum.technology/openai/v1/models (2026-11-11) lists 0.02 USD per million input tokens and context_length 32,768, the same as the lab file. Also on https://lyceum.technology/models/
schema = 2
v2_only = true
base_model = "alibaba/qwen3-embedding-8b"

[api.embeddings]
sdk = { opencodeai = "@opencode/ai/providers/openai-compatible/embeddings" }

[cost.text.input]
price = 0.02

[cost.text.output]
price = 0
