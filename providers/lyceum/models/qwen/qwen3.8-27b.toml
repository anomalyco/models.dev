# Effort: reasoning_effort none|low|medium|xhigh (none = off); high, max and minimal are rejected with 400. https://docs.lyceum.technology/docs/inference/serverless#controlling-reasoning
schema = 2
base_model = "alibaba/qwen3.8-27b"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "xhigh"] }
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.4
cache = { read = 0.1 }

[cost.text.output]
price = 2.4
