# Costs corrected to Moark's USD price list: https://moark.ai/serverless-api (accessed 2026-10-10); previous values were RMB published as USD.
# The Moark raw Chat schema exposes no user-selectable reasoning control for
# this reasoning-only model.
# https://moark.com/docs/openapi/v1 (accessed 2026-06-25)
schema = 2
name = "GLM-4.7"
description = "Flagship GLM model for hybrid reasoning, coding, and agentic engineering"
family = "glm"
open_weights = true
knowledge = "2025-04"
release_date = "2025-12-22"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true

[limit]
context = 204_800
output = 131_072

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.42

[cost.text.output]
price = 2.2
