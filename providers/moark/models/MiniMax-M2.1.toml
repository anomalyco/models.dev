# Costs corrected to Moark's USD price list: https://moark.ai/serverless-api (accessed 2026-10-10); previous values were RMB published as USD.
# The Moark raw Chat schema exposes no user-selectable reasoning control for
# this reasoning-only model.
# https://moark.com/docs/openapi/v1 (accessed 2026-06-25)
schema = 2
name = "MiniMax-M2.1"
description = "MiniMax model for chat, coding, office work, and agentic tasks"
family = "minimax"
open_weights = true
release_date = "2025-12-23"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true

[limit]
context = 204_800
output = 131_072

[cost.text.input]
price = 0.29

[cost.text.output]
price = 1.2
