# $.chat_template_kwargs.thinking = true|false; default true. The similarly
# named enable_thinking key is ignored by this Moonshot template.
# https://docs.getlilac.com/inference/chat-completions#reasoning (accessed 2026-06-25)
schema = 2
base_model = "moonshotai/kimi-k2.6"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.7
cache = { read = 0.2 }

[cost.text.output]
price = 3.5
