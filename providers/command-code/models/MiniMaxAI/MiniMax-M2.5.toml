# Effort: reasoning_effort = low|medium|high|xhigh|max (gateway-validated enum, 2026-08-14).
# Emits reasoning via reasoning / reasoning_details.
base_model = "minimax/MiniMax-M2.5"
name = "MiniMax M2.5"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]
interleaved = { field = "reasoning_details" }

[cost]
input = 0.3
output = 1.2
cache_read = 0.03

[limit]
context = 200_000
