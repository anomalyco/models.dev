# Toggle: MiniMax M3 exposes an on/off thinking control (first-party API and
# OpenAI-compatible relays such as NVIDIA both author it). Command Code docs do
# not specify the forwarded chat-completions field.
# Permanent 50% off list price reflected below.
# https://commandcode.ai/docs/resources/pricing-limits#minimax-m3-2x-usage
base_model = "minimax/MiniMax-M3"
name = "MiniMax M3"
reasoning_options = [{ type = "toggle" }]

[cost]
input = 0.3
output = 1.2
cache_read = 0.06

[limit]
context = 1_000_000
