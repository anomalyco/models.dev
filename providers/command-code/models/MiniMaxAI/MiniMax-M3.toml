# Effort: reasoning_effort = low|medium|high|xhigh|max (live-probed 2026-08-14:
# effort=max induces reasoning; thinking.type / enable_thinking /
# chat_template_kwargs.enable_thinking all accepted but no-ops).
# Emits reasoning via reasoning / reasoning_details.
# Permanent 50% off list price reflected below.
# https://commandcode.ai/docs/resources/pricing-limits#minimax-m3-2x-usage
base_model = "minimax/MiniMax-M3"
name = "MiniMax M3"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]
interleaved = { field = "reasoning_details" }

[cost]
input = 0.3
output = 1.2
cache_read = 0.06

[limit]
context = 1_000_000

[modalities]
input = ["text", "image"]
