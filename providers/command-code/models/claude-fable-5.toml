# Effort: output_config.effort = low|medium|high|xhigh|max (Anthropic Messages route).
base_model = "anthropic/claude-fable-5"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 10
output = 50
cache_read = 1
cache_write = 12.5

[modalities]
input = ["text", "image"]

[provider]
npm = "@ai-sdk/anthropic"
