# Effort: reasoning_effort = low|medium|high|xhigh|max (gateway-validated enum, 2026-08-14).
# No reasoning emission observed in probes; side channel kept as relay-declared.
base_model = "moonshotai/kimi-k2.5"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]
interleaved = { field = "reasoning_content" }

[cost]
input = 0.6
output = 3
cache_read = 0.1

[limit]
context = 256_000
output = 256_000

[modalities]
input = ["text", "image"]
