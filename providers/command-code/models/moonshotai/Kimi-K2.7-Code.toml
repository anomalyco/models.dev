# Effort: reasoning_effort = low|medium|high|xhigh (live-probed 2026-08-14:
# gateway 400s none|minimal|bogus, upstream 400s max — "always-on" falsified).
base_model = "moonshotai/kimi-k2.7-code"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh"] }]
interleaved = { field = "reasoning_content" }

[cost]
input = 0.95
output = 4
cache_read = 0.19

[limit]
context = 256_000
output = 256_000

[modalities]
input = ["text", "image"]
