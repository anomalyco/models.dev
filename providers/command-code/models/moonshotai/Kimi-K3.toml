# Effort: output_config.effort = low|high|max (max live-verified 2026-08-14: reasoning_content
# emitted). thinking.type toggle unverified on this host — dropped per review.
base_model = "moonshotai/kimi-k3"
reasoning_options = [{ type = "effort", values = ["low", "high", "max"] }]
interleaved = { field = "reasoning_content" }

[cost]
input = 3
output = 15
cache_read = 0.3

[limit]
context = 1_000_000

[modalities]
input = ["text", "image"]
