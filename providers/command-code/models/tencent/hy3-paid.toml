# Prices: https://commandcode.ai/docs/resources/pricing-limits (accessed 2026-09-01).
# Catalog/ids: https://api.commandcode.ai/provider/v1 and https://commandcode.ai/models (accessed 2026-09-01).
# Relay notes: OpenAI Chat Completions on /provider/v1/chat/completions; reasoning controls
# pass through to upstreams (mirrored from the labs' own entries).
# Effort: reasoning_effort = none|high (none disables thinking; the lab's
# thinking.type switch is not modeled here to avoid a double off-state)
# API model id is `tencent/hy3-paid` (paid lane); served as Tencent Hy3.
# Host context 262144 per the Command Code catalog/API context_length (lab entry: 256000).

base_model = "tencent/hy3"
name = "Tencent Hy3"

reasoning_options = [{ type = "effort", values = ["none", "high"] }]

[cost]
input = 0.14
output = 0.58
cache_read = 0.035

[limit]
context = 262144
