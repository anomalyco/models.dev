# Effort: reasoning_effort = low|medium|xhigh (lab baseline; high accepted as alias to xhigh;
# max dropped — high=max=93 in probes, 2026-08-14; enable_thinking/thinking_budget no-ops).
base_model = "alibaba/qwen3.8-max"
name = "Qwen 3.8 Max"
reasoning_options = [{ type = "effort", values = ["low", "medium", "xhigh"] }]
interleaved = { field = "reasoning_content" }

[cost]
input = 2
output = 6
cache_read = 0.25
cache_write = 2.5

[modalities]
input = ["text", "image"]
