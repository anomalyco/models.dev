# Contributor tier prompts and completions may be used to improve Meta's products.
# Effort: reasoning_effort = low|medium|high|xhigh (lab set; minimal 400-rejected; max dropped — high=max saturated in probes, 2026-08-14).
base_model = "meta/muse-spark-1.2"
name = "Muse Spark 1.2 Contributor"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh"] }]

[cost]
input = 0.1
output = 0.2
cache_read = 0.002

[modalities]
input = ["text", "image"]
