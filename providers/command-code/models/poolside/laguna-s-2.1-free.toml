# Effort: reasoning_effort = low|medium|high|xhigh|max (live-probed 2026-08-14;
# chat_template_kwargs.enable_thinking = false did NOT suppress reasoning — falsified).
# Emits reasoning via reasoning / reasoning_details.
# Free while capacity lasts:
# https://commandcode.ai/docs/resources/pricing-limits#laguna-s-2.1-free
base_model = "poolside/laguna-s-2.1"
name = "Laguna S 2.1 Free"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]
interleaved = { field = "reasoning_details" }

[cost]
input = 0
output = 0
cache_read = 0

[limit]
context = 256_000
