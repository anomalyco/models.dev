# Effort: reasoning_effort = low|medium|high|xhigh|max (gateway-validated enum, live-probed 2026-08-14).
# 272K+ context tier mirrors first-party Sakana pricing (no-markup relay).
base_model = "sakana/fugu-ultra"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 5
output = 30
cache_read = 0.5

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 10
output = 45
cache_read = 1

[limit]
output = 1_000_000
