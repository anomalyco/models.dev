# Effort: output_config.effort = low|medium|high|max (Anthropic Messages route).
# Budget: thinking.budget_tokens (min 1024).
base_model = "anthropic/claude-sonnet-4-6"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "max"] }, { type = "budget_tokens", min = 1_024 }]

[cost]
input = 3
output = 15
cache_read = 0.3
cache_write = 3.75

[modalities]
input = ["text", "image"]

[provider]
npm = "@ai-sdk/anthropic"
