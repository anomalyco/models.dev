# Toggle: thinking.type = enabled|disabled (live-verified 2026-08-14: reasoning tokens drop to ~8% when disabled).
# Effort dropped — low=188/high=168/max=230 non-monotonic in probes, 2026-08-14.
# Emits reasoning via reasoning / reasoning_details.
# Permanent price cut reflected below (up to 98% off former list).
# https://commandcode.ai/docs/resources/pricing-limits#mimo-v2.5-98-off
base_model = "xiaomi/mimo-v2.5"
name = "MiMo V2.5"
reasoning_options = [{ type = "toggle" }]
interleaved = { field = "reasoning_details" }

[cost]
input = 0.14
output = 0.28
cache_read = 0.0028

[limit]
context = 1_000_000

[modalities]
input = ["text", "image"]
