# Toggle: thinking.type = enabled|disabled (verified on MiMo V2.5, same surface, 2026-08-14).
# Effort: reasoning_effort = low|medium|high|xhigh|max (gateway-validated enum).
# Emits reasoning via reasoning / reasoning_details.
# Permanent price cut reflected below (up to 99% off former list).
# https://commandcode.ai/docs/resources/pricing-limits#mimo-v2.5-pro-99-off
base_model = "xiaomi/mimo-v2.5-pro"
name = "MiMo V2.5 Pro"
reasoning_options = [{ type = "toggle" }, { type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]
interleaved = { field = "reasoning_details" }

[cost]
input = 0.435
output = 0.87
cache_read = 0.0036

[limit]
context = 1_000_000
