# Effort: reasoning_effort = low|medium|high|xhigh|max (gateway-validated enum, live-probed 2026-08-14; none|minimal 400-rejected).
# Served context from GET /provider/v1/models (accessed 2026-08-13): 400_000.
# No published input cap — dropped rather than inferred. 272K cost tier passes
# through OpenAI's long-context billing.
base_model = "openai/gpt-5.4"
base_model_omit = ["limit.input"]
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 2.5
output = 15
cache_read = 0.25

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 5
output = 22.5
cache_read = 0.5

[limit]
context = 400_000

[modalities]
input = ["text", "image"]
