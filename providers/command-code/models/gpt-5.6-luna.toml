# Effort: reasoning_effort = low|medium|high|xhigh|max (gateway-validated enum, live-probed 2026-08-14; none|minimal 400-rejected).
# Emits reasoning via reasoning / reasoning_details.
# 50% off deal through 2026-08-13 not reflected; list prices shown.
# https://commandcode.ai/docs/resources/pricing-limits#gpt-5.6-terra-luna-50-off
base_model = "openai/gpt-5.6-luna"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]
interleaved = { field = "reasoning_details" }

[cost]
input = 0.2
output = 1.2
cache_read = 0.02
cache_write = 0.25

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 0.4
output = 1.8
cache_read = 0.04
cache_write = 0.5

[modalities]
input = ["text", "image"]
