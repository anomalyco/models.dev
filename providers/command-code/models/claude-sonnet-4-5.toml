# Budget: thinking.budget_tokens (min 1024, Anthropic Messages route).
# Served context per pricing page (accessed 2026-08-14): 1_000_000; lab default is 200K.
base_model = "anthropic/claude-sonnet-4-5"
reasoning_options = [{ type = "budget_tokens", min = 1_024 }]

[cost]
input = 3
output = 15
cache_read = 0.3
cache_write = 3.75

[limit]
context = 1_000_000

[modalities]
input = ["text", "image"]

[provider]
npm = "@ai-sdk/anthropic"
