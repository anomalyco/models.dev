# Prices: https://commandcode.ai/docs/resources/pricing-limits (accessed 2026-09-01).
# Catalog/ids: https://api.commandcode.ai/provider/v1 and https://commandcode.ai/models (accessed 2026-09-01).
# Relay notes: OpenAI Chat Completions on /provider/v1/chat/completions; reasoning controls
# pass through to upstreams (mirrored from the labs' own entries).
# Toggle/budget controls mirrored from the baseline entry; Command Code forwards
# request bodies to upstreams unchanged, so the upstream-native switch applies.

base_model = "nvidia/nemotron-3-ultra-550b-a55b"
name = "Nemotron 3 Ultra"

reasoning_options = [{ type = "toggle" }, { type = "effort", values = ["medium", "high"] }, { type = "budget_tokens" }]

[cost]
input = 0.6
output = 2.4
cache_read = 0.12
