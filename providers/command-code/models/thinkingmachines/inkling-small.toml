# Toggle: thinking.type = disabled
# Effort: output_config.effort = low|medium|high|xhigh|max
base_model = "thinkingmachines/inkling-small"
reasoning_options = [{ type = "toggle" }, { type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 0.5
output = 1.2
cache_read = 0.1

[limit]
context = 1_000_000
