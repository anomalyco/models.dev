# Effort: reasoning_effort = low|medium|high|xhigh|max (lab effort set; the
# Anthropic-Messages thinking.type toggle does not apply to this chat route).
base_model = "thinkingmachines/inkling-small"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 0.5
output = 1.2
cache_read = 0.1

[limit]
context = 1_000_000
output = 1_000_000
