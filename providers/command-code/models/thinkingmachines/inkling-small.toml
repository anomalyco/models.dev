# Effort: reasoning_effort = none|low|medium|high|xhigh|max.
# Graded levels per TM lab set; off = none per established OpenAI-surface peers
# (baseten, vercel, openrouter, kilo) — the Anthropic thinking.type toggle does
# not apply to this host's chat-completions route. minimal not authored.
base_model = "thinkingmachines/inkling-small"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 0.5
output = 1.2
cache_read = 0.1

[limit]
context = 1_000_000
output = 1_000_000
