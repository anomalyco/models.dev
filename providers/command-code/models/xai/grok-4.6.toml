# Effort: reasoning_effort = low|medium|high|xhigh (first-party xAI baseline; max dropped — flat in probes, 2026-08-14).
# Served context from GET /provider/v1/models: 500_000 (probed 2026-08-14);
# xAI's 200K context tier is not assumed to pass through.
base_model = "xai/grok-4.6"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh"] }]

[cost]
input = 2
output = 6
cache_read = 0.5

[modalities]
input = ["text", "image"]
