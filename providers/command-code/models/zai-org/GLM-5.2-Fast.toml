# Fast serving tier of GLM-5.2 (same weights, low-latency serving).
# Effort: reasoning_effort = high|max (low|medium map to high, xhigh to max)
base_model = "zhipuai/glm-5.2"
name = "GLM-5.2 Fast"
reasoning_options = [{ type = "effort", values = ["high", "max"] }]
interleaved = { field = "reasoning_content" }

[cost]
input = 3
output = 10.25
cache_read = 0.5
