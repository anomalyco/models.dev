# Effort: reasoning_effort = low|medium|high|xhigh|max (gateway-validated enum;
# thinking.type toggle falsified on GLM-5, same surface, 2026-08-14).
# Emits reasoning via reasoning / reasoning_details.
base_model = "zhipuai/glm-5.1"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]
interleaved = { field = "reasoning_details" }

[cost]
input = 1.4
output = 4.4
cache_read = 0.26
