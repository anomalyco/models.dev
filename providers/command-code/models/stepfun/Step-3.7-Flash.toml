# Effort: reasoning_effort = low|medium|high (lab baseline; xhigh|max not graded-probed, 2026-08-14).
# Emits reasoning via reasoning / reasoning_details.
base_model = "stepfun/step-3.7-flash"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high"] }]
interleaved = { field = "reasoning_details" }

[cost]
input = 0.2
output = 1.15
cache_read = 0.04

[modalities]
input = ["text", "image"]
