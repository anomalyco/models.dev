name = "Command Code"
env = ["CMD_API_KEY"]
npm = "@ai-sdk/openai-compatible"
# Subscription relay: usage bills at the underlying models' API rates, no markup.
# OpenAI Chat Completions: POST /provider/v1/chat/completions
# Anthropic Messages (Claude models only): POST /provider/v1/messages
# Live model list: GET /provider/v1/models (accessed 2026-08-11)
# Pricing (USD/MTok): https://commandcode.ai/docs/resources/pricing-limits (accessed 2026-08-11)
# https://commandcode.ai/docs/provider
api = "https://api.commandcode.ai/provider/v1"
doc = "https://commandcode.ai/docs/provider"
