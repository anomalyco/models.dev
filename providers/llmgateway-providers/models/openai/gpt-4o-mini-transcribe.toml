# Audio input: input_audio in https://api.llmgateway.io/v1/models?mapped=true (2026-10-21).
# Audio MIME types: the openai/gpt-4o-mini-transcribe lab file.
schema = 2
name = "GPT-4o Mini Transcribe (OpenAI)"
description = "Speech transcription model for accurate audio-to-text and captioning workflows"
family = "gpt"
open_weights = false
release_date = "2025-03-20"

[modalities]
input = ["text", "audio/flac", "audio/mpeg", "audio/mp4", "audio/ogg", "audio/wav", "audio/webm", "audio/pcm", "audio/pcmu", "audio/pcma"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = false
temperature = true

[limit]
context = 16_000
output = 2_000

[cost.text.input]
price = 1.25

[cost.text.output]
price = 5

[cost.audio.input]
price = 3
