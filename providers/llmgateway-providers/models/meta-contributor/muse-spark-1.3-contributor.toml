schema = 2
name = "Muse Spark 1.3 Contributor (Meta Contributor)"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"
family = "muse"
open_weights = false
release_date = "2026-09-02"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh"] }
structured_output = true
temperature = true

[limit]
context = 1_048_576
output = 1_048_576

[cost.text.input]
price = 0.1
cache = { read = 0.002 }

[cost.text.output]
price = 0.2
