# Modalities: xAI documents jpg/jpeg and png image input (https://docs.x.ai/developers/models, "Image input models")
schema = 2
name = "Grok 4 (xAI)"
description = "Grok model for agentic tool use, reasoning, coding, and live assistance"
family = "grok"
open_weights = false
release_date = "2025-07-09"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
structured_output = false
temperature = true

[limit]
context = 256_000
output = 256_000

[cost.text.input]
price = 3
cache = { read = 0.75 }

[cost.text.output]
price = 15
