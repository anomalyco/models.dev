# Modalities: image formats JPEG, PNG, WebP, GIF (https://docs.llmgateway.io/features/vision)
schema = 2
name = "Nemotron 3 Ultra 550B (DeepInfra)"
description = "Nemotron multimodal model for visual reasoning and agentic AI workflows"
family = "nemotron"
open_weights = false
release_date = "2026-06-01"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
structured_output = false
temperature = true

[limit]
context = 262_144
output = 262_144

[cost.text.input]
price = 0.5
cache = { read = 0.1 }

[cost.text.output]
price = 2.2
