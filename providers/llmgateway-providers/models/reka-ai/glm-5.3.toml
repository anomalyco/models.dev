# Capabilities the catalog doesn't state (api.chat-completions.compatibility.reasoning_field) come from zai/glm-5.2, this host's previous model in the family.
schema = 2
base_model = "zhipuai/glm-5.3"
name = "GLM-5.3 (reka-ai)"

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[limit]
context = 1_048_576
output = 262_144

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.45
cache = { read = 0.135 }

[cost.text.output]
price = 1.8
