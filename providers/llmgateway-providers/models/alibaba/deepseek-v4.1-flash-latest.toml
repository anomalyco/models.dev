schema = 2
name = "deepseek-v4.1-flash-latest (Alibaba Cloud)"
description = "Qwen vision-language model for visual reasoning, documents, and agent tasks"
family = "deepseek"
open_weights = false
release_date = "2026-10-17"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = false
temperature = true

[limit]
context = 1_000_000
output = 393_216

[cost.text.input]
price = 0.3
cache = { read = 0.03 }

[cost.text.output]
price = 1.2
