# Toggle: $.reasoning_effort = "none" disables thinking via Together's
# thinking switch. Together accepts any other effort string without validating
# it and no tier changes reasoning length, so on/off is the only real control;
# thinking streams back in reasoning_content.
# Intentionally weaker than Together's first-party row: the gateway's own
# together-ai mapping serves this pin with tool calls and JSON mode off and a
# 32k output cap, from gateway e2e against the deployment (no streaming
# content with tools; theopenco/llmgateway#2094) — this catalog mirrors what
# the gateway actually accepts and bills, and resyncs pick up any later fix.
# https://api.llmgateway.io/v1/models?mapped=true providers[].reasoning_efforts (accessed 2026-08-04)
base_model = "moonshotai/kimi-k2.6"
name = "Kimi K2.6 (Together AI)"
tool_call = false
structured_output = false

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "toggle"

[cost]
input = 1.2
output = 4.5
cache_read = 0.2

[limit]
output = 32_768
