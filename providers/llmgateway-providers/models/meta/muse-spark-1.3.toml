# Effort: reasoning_effort or reasoning.effort is forwarded unchanged to Meta's Responses API.
# https://docs.llmgateway.io/features/reasoning
# https://dev.meta.ai/docs/reasoning.md (max is Standard-tier 1.3 only)
# https://github.com/theopenco/llmgateway/blob/910a6632c47b83c74944bad231f25f17bd5acb7b/packages/actions/src/prepare-request-body.ts#L2231-L2241
schema = 2
base_model = "meta/muse-spark-1.3"
name = "Muse Spark 1.3 (Meta)"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh"] }
structured_output = true

[limit]
output = 1_048_576

[cost.text.input]
price = 1.25
cache = { read = 0.15 }

[cost.text.output]
price = 4.25
