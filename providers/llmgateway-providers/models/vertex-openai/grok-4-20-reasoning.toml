schema = 2
name = "Grok 4.20 Reasoning (Vertex AI (OpenAI-compatible))"
description = "O-series reasoning model for hard analysis, math, coding, and planning"
family = "grok"
open_weights = false
release_date = "2026-03-09"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = false
temperature = true

[limit]
context = 2_000_000
output = 30_000

[cost.text.input]
price = 1.25
cache = { read = 0.2 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 2.5
cache = { read = 0.4 }

[cost.text.output]
price = 2.5

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 5
