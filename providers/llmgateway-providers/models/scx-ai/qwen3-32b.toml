# Toggle: $.reasoning_effort = "none" disables thinking; any other accepted
# value (or omitting the field) leaves it on. The gateway maps it to the
# deployment's thinking switch.
# https://docs.llmgateway.io/features/reasoning
schema = 2
base_model = "alibaba/qwen3-32b"
name = "Qwen3 32B (SCX.ai (Turbo))"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = false

[limit]
context = 32_768
output = 8_192

[cost.text.input]
price = 0.36

[cost.text.output]
price = 0.87
