# Toggle: $.reasoning_effort = "none" disables thinking; any other accepted
# value (or omitting the field) leaves it on. The gateway maps it to the
# deployment's thinking switch.
# https://docs.llmgateway.io/features/reasoning
schema = 2
name = "GLM-4.5 X (Z AI)"
description = "Flagship GLM model for hybrid reasoning, coding, and agentic engineering"
family = "glm"
open_weights = false
release_date = "2025-07-28"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true }
structured_output = false
temperature = true

[limit]
context = 128_000
output = 128_000

[cost.text.input]
price = 2.2
cache = { read = 0.45 }

[cost.text.output]
price = 8.9
