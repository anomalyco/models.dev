# Toggle: $.reasoning_effort = "none" disables thinking; any other accepted
# value (or omitting the field) leaves it on. The gateway maps it to the
# deployment's thinking switch.
# https://docs.llmgateway.io/features/reasoning
schema = 2
name = "GLM-4.6V FlashX (Z AI)"
description = "GLM vision model for visual reasoning, documents, and multimodal agents"
family = "glm-flash"
open_weights = false
release_date = "2025-12-08"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true }
structured_output = false
temperature = true

[limit]
context = 128_000
output = 16_000

[cost.text.input]
price = 0.04
cache = { read = 0.004 }

[cost.text.output]
price = 0.4
