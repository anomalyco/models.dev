# Toggle: $.reasoning_effort = "none" disables thinking; any other accepted
# value (or omitting the field) leaves it on. The gateway maps it to the
# deployment's thinking switch; thinking streams back in reasoning_content.
# https://docs.llmgateway.io/features/reasoning (accessed 2026-08-04)
schema = 2
base_model = "zhipuai/glm-5.1"
name = "GLM-5.1 (EmberCloud)"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = false

[limit]
context = 203_000
output = 131_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.931
cache = { read = 0.173 }

[cost.text.output]
price = 2.93
