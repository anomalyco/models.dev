schema = 2
base_model = "zhipuai/glm-5"
name = "GLM-5 (Tencent Cloud)"

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = false

[limit]
context = 200_000
output = 128_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1
cache = { read = 0.2 }

[cost.text.output]
price = 3.2
