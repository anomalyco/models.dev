# Metadata is inherited from the upstream OpenAI entry.
# Price: the default route. APIMaster routes to the lowest-cost stable channel first
# (https://apimaster.ai/docs/en/faq); this is that channel's price on https://apimaster.ai/zh/models/openai-api?model=gpt-5.6-luna
# (read 2026-09-28). The other 5 channel(s), up to 0.16 / 0.96, serve only when it is unavailable and bill at their own price.
# Effort: reasoning_effort = none|low|medium|high|xhigh|max
schema = 2
base_model = "openai/gpt-5.6-luna"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 0.017562

[cost.text.output]
price = 0.10537
