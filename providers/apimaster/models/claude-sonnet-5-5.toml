# Metadata is inherited from the upstream Anthropic entry.
# Price: the default route. APIMaster routes to the lowest-cost stable channel first
# (https://apimaster.ai/docs/en/faq); this is that channel's price on https://apimaster.ai/ (model selector)
# (data: https://apimaster.ai/api/marketplace-data?model=claude-sonnet-5-5, read 2026-09-29). Channels reserved for
# claude_code clients are excluded; the other 2 open channel(s), up to 2 / 10, serve only on failover and bill at their own price.
# Effort: reasoning_effort = low|medium|high|xhigh|max, sent upstream as output_config.effort.
# Same prompt, 5 requests each: low used median 271 completion tokens, max 496 (2026-09-29).
# No toggle: thinking cannot be disabled on this model; between_tools is its lowest setting (Anthropic docs).
base_model = "anthropic/claude-sonnet-5-5"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 0.669096
output = 3.34548
