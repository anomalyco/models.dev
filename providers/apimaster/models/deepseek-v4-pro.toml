# Metadata is inherited from the upstream DeepSeek entry.
# Price: the default route. APIMaster routes to the lowest-cost stable channel first
# (https://apimaster.ai/docs/en/faq); this is that channel's price on https://apimaster.ai/zh/models/deepseek-api?model=deepseek-v4-pro
# (read 2026-09-29). The other 6 channel(s), up to 1.32 / 3.96, serve only when it is unavailable and bill at their own price.
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|high|max
schema = 2
base_model = "deepseek/deepseek-v4-pro"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }

[cost.text.input]
price = 0.4752

[cost.text.output]
price = 1.4256
