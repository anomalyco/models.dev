# Metadata is inherited from the upstream Anthropic entry.
# Price: the default route. APIMaster routes to the lowest-cost stable channel first
# (https://apimaster.ai/docs/en/faq); this is that channel's price in the model selector on https://apimaster.ai/
# (data: https://apimaster.ai/api/marketplace-data?model=claude-opus-5-5, read 2026-09-29). The other 6 channel(s), up to 2.97376 / 14.8688, serve only when it is unavailable.
# Effort: reasoning_effort = low|medium|high|xhigh|max, sent upstream as output_config.effort.
# Same prompt, 4 requests each: low used ~160 completion tokens, max ~340 (2026-09-29).
# No toggle: thinking cannot be disabled on this model (Anthropic docs).
base_model = "anthropic/claude-opus-5-5"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 1.33587
output = 6.67935
