# Price: the default route. APIMaster routes to the lowest-cost stable channel first
# (https://apimaster.ai/docs/en/faq). The model is not on the marketplace pages yet, so this
# is the channel price billed for live requests on 2026-09-29 (lowest seen in the billing log).
