# Metadata is inherited from the upstream Anthropic entry.
# Price: the default route. APIMaster routes to the lowest-cost stable channel first
# (https://apimaster.ai/docs/en/faq); this is that channel's price on https://apimaster.ai/zh/models/claude-api?model=claude-sonnet-5
# (read 2026-09-28). The other 17 channel(s), up to 2.4 / 12, serve only when it is unavailable.
# Effort: reasoning_effort = low|medium|high|xhigh|max
# No toggle: thinking.type=disabled with reasoning_effort=high still reasoned; thinking.type=enabled alone did not (tested 2026-09-28).
base_model = "anthropic/claude-sonnet-5"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]

