# Metadata is inherited from the upstream OpenAI entry.
# Price: the default route. APIMaster routes to the lowest-cost stable channel first
# (https://apimaster.ai/docs/en/faq); this is that channel's price on https://apimaster.ai/zh/models/openai-api?model=gpt-6-astra
# (data: https://apimaster.ai/api/marketplace-data?model=gpt-6-astra, read 2026-09-29). Channels reserved for
# codex clients are excluded; the other 11 open channel(s), up to 1.04082 / 5.20408, serve only on failover and bill at their own price.
# Effort: reasoning_effort = low|medium|high|xhigh|max
base_model = "openai/gpt-6-astra"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]

