# Metadata is inherited from the upstream Zhipu entry.
# Price: the default route. APIMaster routes to the lowest-cost stable channel first
# (https://apimaster.ai/docs/en/faq); this is that channel's price on https://apimaster.ai/zh/models/glm-api?model=glm-5.3
# (read 2026-09-28). The other 5 channel(s), up to 1.4 / 4.4, serve only when it is unavailable and bill at their own price.
# Effort: reasoning_effort = low|high|max
schema = 2
base_model = "zhipuai/glm-5.3"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }

[cost.text.input]
price = 0.6916

[cost.text.output]
price = 2.1736
