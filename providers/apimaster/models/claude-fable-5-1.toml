# Metadata is inherited from the upstream Anthropic entry.
# Price: the default route. APIMaster routes to the lowest-cost stable channel first
# (https://apimaster.ai/docs/en/faq); this is that channel's price on https://apimaster.ai/zh/models/claude-api?model=claude-fable-5-1
# (read 2026-09-28). The other 6 channel(s), up to 10 / 50, serve only when it is unavailable and bill at their own price.
# Effort: reasoning_effort = low|medium|high|xhigh|max
# No toggle: reasoning is on by default and thinking.type=disabled still reasoned (tested 2026-09-28).
schema = 2
base_model = "anthropic/claude-fable-5-1"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 2.37547

[cost.text.output]
price = 11.8774
