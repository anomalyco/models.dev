# Metadata is inherited from the upstream MiniMax entry.
# Price: the default route. APIMaster routes to the lowest-cost stable channel first
# (https://apimaster.ai/docs/en/faq); this is that channel's price on https://apimaster.ai/zh/models/minimax-api?model=minimax-m3
# (read 2026-09-28). The other 2 channel(s), up to 0.6 / 2.4, serve only when it is unavailable and bill at their own price.
# Toggle: thinking.type = adaptive|disabled (MiniMax docs: "enabled" is not a valid value)
base_model = "minimax/MiniMax-M3"
reasoning_options = [{ type = "toggle" }]

[cost]
input = 0.3
output = 1.2
