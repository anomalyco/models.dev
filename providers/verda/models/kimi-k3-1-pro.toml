# Model: https://docs.verda.com/inference/models/kimi-k3-1-pro/
# Pricing: Verda console, USD per million tokens.

schema = 2
base_model = "moonshotai/kimi-k3.1-pro"

# Verda enables Text and Image and does not currently support video.
[modalities] 
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
# Verda supports reasoning_effort = low, high, max (default: max).
# https://docs.verda.com/inference/models/kimi-k3-1-pro/#reasoning
reasoning = { supported = true, default = { type = "effort", value = "max" }, effort = ["low", "high", "max"] }

# Verda returns reasoning_content; streaming uses delta.reasoning_content.
# https://docs.verda.com/inference/openai-compatibility/#reasoning
[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 2
cache = { read = 0.2 }

[cost.text.output]
price = 10