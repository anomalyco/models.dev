# Toggle: thinking.type = enabled|disabled (Moonshot K2.6 wire; reasoning_effort is not supported for kimi-k2.6)
# Wire source: https://platform.kimi.ai/docs/api/models-overview and https://platform.kimi.ai/docs/guide/use-thinking-models (accessed 2026-10-13).
# Live check on api.aicodewith.ai 2026-10-13 returned 503 "model unavailable" for every variant, so the toggle follows the lab wire; not re-verified on this relay.
# Pricing source: https://aicodewith.ai/zh/models (accessed 2026-10-12); per 1M tokens, CNY.
# Limits/modalities source: https://api.aicodewith.ai/models (accessed 2026-10-12).
# CNY→USD rate: 6.700304, 2026-10-12, source: https://open.er-api.com/v6/latest/USD
# Reasoning controls mirror providers/moonshotai/models/kimi-k2.6.toml (relay forwards the upstream request body).
base_model = "moonshotai/kimi-k2.6"
reasoning_options = [{ type = "toggle" }]

[cost]
input = 0.9701
output = 4.0297
cache_read = 0.1642

[limit]
context = 200_000
output = 65_536

[modalities]
input = ["text"]
output = ["text"]
