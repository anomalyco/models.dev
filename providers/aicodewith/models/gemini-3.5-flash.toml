# Pricing source: https://aicodewith.ai/zh/models (accessed 2026-10-12); per 1M tokens, USD.
# Limits/modalities source: https://api.aicodewith.ai/models (accessed 2026-10-12).
# Reasoning controls mirror providers/google/models/gemini-3.5-flash.toml (relay forwards the upstream request body).
base_model = "google/gemini-3.5-flash"
reasoning_options = [{ type = "effort", values = ["minimal", "low", "medium", "high"] }]

[cost]
input = 0.5
output = 3
cache_read = 0.05
cache_write = 0.05

[limit]
context = 1_000_000
output = 65_536

[modalities]
input = ["text", "image", "video"]
output = ["text"]
