# Pricing source: https://aicodewith.ai/zh/models (accessed 2026-10-12); per 1M tokens, USD.
# Limits/modalities source: https://api.aicodewith.ai/models (accessed 2026-10-12).
# Reasoning controls mirror providers/anthropic/models/claude-sonnet-5-5.toml (relay forwards the upstream request body).
base_model = "anthropic/claude-sonnet-5-5"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]

[provider]
npm = "@ai-sdk/anthropic"
api = "https://api.aicodewith.ai/v1"

[cost]
input = 2
output = 10
cache_read = 0.1
cache_write = 2.5

[limit]
context = 200_000
output = 128_000

[modalities]
input = ["text", "image"]
output = ["text"]
