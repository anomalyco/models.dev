# Pricing source: https://aicodewith.ai/zh/models (accessed 2026-10-12); per 1M tokens, USD.
# Limits/modalities source: https://api.aicodewith.ai/models (accessed 2026-10-12).
# Reasoning controls mirror providers/google/models/gemini-3.8-flash.toml (relay forwards the upstream request body).
base_model = "google/gemini-3.8-flash"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high"] }]

[cost]
input = 0.75
output = 3.75
cache_read = 0.075

[limit]
context = 200_000
output = 65_536

[modalities]
input = ["text"]
output = ["text"]
