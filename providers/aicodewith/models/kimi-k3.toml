# Pricing source: https://aicodewith.ai/zh/models (accessed 2026-10-12); per 1M tokens, CNY.
# Limits source: https://api.aicodewith.ai/models (accessed 2026-10-12); its input_modalities = ["text"] is inaccurate.
# Modalities live-tested on api.aicodewith.ai 2026-10-20: image read correctly; video (video_url or image_url) is stripped, so video is dropped.
# CNY→USD rate: 6.700304, 2026-10-12, source: https://open.er-api.com/v6/latest/USD
# Reasoning controls mirror providers/moonshotai/models/kimi-k3.toml (relay forwards the upstream request body).
base_model = "moonshotai/kimi-k3"
reasoning_options = [{ type = "effort", values = ["low", "high", "max"] }]

[cost]
input = 2.9849
output = 14.9247
cache_read = 0.2985

[limit]
context = 200_000
output = 65_536

[modalities]
input = ["text", "image"]
output = ["text"]
