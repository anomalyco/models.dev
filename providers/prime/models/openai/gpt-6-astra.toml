# Generated by bun models:sync prime from https://api.pinference.ai/api/v1/models.
# Prices are USD per million tokens; lab facts are inherited via base_model.
# Effort: top-level reasoning_effort = max|xhigh|high|medium|low.
# Generic file input is omitted; it does not imply PDF support.
schema = 2
base_model = "openai/gpt-6-astra"
base_model_omit = ["limit.input"]

[modalities]
input = ["image", "text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 10

[cost.text.output]
price = 50
