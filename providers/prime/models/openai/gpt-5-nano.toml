# Source: https://api.pinference.ai/api/v1/models (public, accessed 2026-10-12).
# Prices are USD per million tokens; limits and efforts are provider-specific.
# Effort: top-level reasoning_effort = high|medium|low|minimal.
# Generic file input is not represented: models.dev has no generic file modality.
base_model = "openai/gpt-5-nano"
base_model_omit = ["limit.input"]

[[reasoning_options]]
type = "effort"
values = ["high", "medium", "low", "minimal"]

[cost]
input = 0.05
output = 0.4
