# Generated by bun models:sync prime from https://api.pinference.ai/api/v1/models.
# Prices are USD per million tokens; lab facts are inherited via base_model.
# Effort: top-level reasoning_effort = xhigh|high|medium|low|none.
# Generic file input is omitted; it does not imply PDF support.
schema = 2
base_model = "openai/gpt-5.3-codex"
base_model_omit = ["limit.input"]
name = "GPT-5.3-Codex"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true
temperature = false

[cost.text.input]
price = 1.75

[cost.text.output]
price = 14
