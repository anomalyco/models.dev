# Generated by bun models:sync prime from https://api.pinference.ai/api/v1/models.
# Prices are USD per million tokens; lab facts are inherited via base_model.
# Effort: top-level reasoning_effort = medium|high|xhigh.
# Generic file input is omitted; it does not imply PDF support.
# Mid-conversation: Prime serves this model on POST /api/v1/chat/completions (https://docs.primeintellect.ai/api-reference/inference-chat-completions);
# reasoning_effort and tools are per-request fields with no per-turn change mechanism (effort_updates = false, tools.updates = false).
# system_updates unset: gateway models go to an external provider (https://docs.primeintellect.ai/inference/overview) and Prime doesn't document where a later system message goes.
schema = 2
base_model = "openai/gpt-5.4-pro"
base_model_omit = ["limit.input"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["medium", "high", "xhigh"] }
structured_output = true
effort_updates = false

[cost.text.input]
price = 30

[cost.text.output]
price = 180
