# Source: https://api.pinference.ai/api/v1/models (public, accessed 2026-10-12).
# Prices are USD per million tokens; limits and efforts are provider-specific.
# Effort: top-level reasoning_effort = low|high|max.
base_model = "zhipuai/glm-5.3"
structured_output = false

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 1.4
output = 4.4
cache_read = 0.26
cache_write = 1.4

[limit]
context = 1_048_576
