# Source: https://api.pinference.ai/api/v1/models (public, accessed 2026-10-12).
# Prices are USD per million tokens; limits and efforts are provider-specific.
# Effort: top-level reasoning_effort = max|high|low.
base_model = "zhipuai/glm-5.3-flash"

[[reasoning_options]]
type = "effort"
values = ["max", "high", "low"]

[cost]
input = 0.15
output = 0.5

[limit]
context = 1_048_576
output = 943_718

[modalities]
input = ["text", "image", "video"]
