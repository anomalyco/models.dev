# Generated by bun models:sync prime from https://api.pinference.ai/api/v1/models.
# Prices are USD per million tokens; lab facts are inherited via base_model.
# Effort: top-level reasoning_effort = low|high|max.
# Mid-conversation: system_updates, effort_updates and tools.updates are unset; Prime documents none of them and they weren't tested live.
# Prime serves Chat Completions, Anthropic Messages (translated onto chat completions) and Responses (https://api.pinference.ai/openapi.json).
# Input MIME types: the lab's entries for each kind Prime lists (Prime documents no formats).
schema = 2
base_model = "zhipuai/glm-5.3-flash"
name = "GLM 5.3 Flash"

[modalities]
input = ["text", "image/jpeg", "image/png", "video/mp4", "video/x-matroska", "video/quicktime"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = false

[limit]
context = 1_048_576

[cost.text.input]
price = 0.15
cache = { read = 0.03, write = 0.15 }

[cost.text.output]
price = 0.5
