# Generated by bun models:sync prime from https://api.pinference.ai/api/v1/models.
# Prices are USD per million tokens; lab facts are inherited via base_model.
# Effort: top-level reasoning_effort = none|minimal|low|medium|high.
# Generic file input is omitted; it does not imply PDF support.
schema = 2
base_model = "google/gemini-3-flash-preview"

[modalities]
input = ["text", "image", "audio", "video"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 0.5

[cost.text.output]
price = 3
