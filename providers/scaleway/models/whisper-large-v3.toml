# Scaleway pricing: https://www.scaleway.com/en/pricing/model-as-a-service/ (accessed 2026-10-21)
# Billed at EUR 0.003 per audio minute; converted at the ECB rate 1 EUR = 1.1215 USD (2026-10-20): USD 0.0033645/minute.
# v1 has no per-minute price, so v1 shows no cost. The host lists no audio formats, so modalities stay generic.
schema = 2
type = "transcription"
name = "Whisper Large v3"
description = "Speech transcription model for accurate audio-to-text and captioning workflows"
family = "whisper"
open_weights = true
knowledge = "2023-09"
release_date = "2023-09-01"
last_updated = "2026-03-17"

[modalities]
input = ["audio"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false

[limit]
context = 0
output = 8_192

[cost.audio.input]
unit = "minute"
price = 0.0033645
