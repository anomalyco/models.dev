# Scaleway excludes gpt-oss-120b from reasoning_effort = "none"; documented
# effort values are "low"|"medium"|"high" (accessed 2026-06-25).
# https://www.scaleway.com/en/docs/generative-apis/how-to/query-reasoning-models/
# Scaleway pricing: https://www.scaleway.com/en/pricing/model-as-a-service/ (accessed 2026-10-21)
# Billed in EUR: €0.15 input / €0.60 output per 1M tokens; converted at the ECB rate 1 EUR = 1.1215 USD (2026-10-20).
schema = 2
base_model = "openai/gpt-oss-120b"
name = "GPT-OSS 120B"
description = "Open-weight GPT model for self-hosted reasoning and instruction-following workloads"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[limit]
context = 128_000

[cost.text.input]
price = 0.168225

[cost.text.output]
price = 0.6729
