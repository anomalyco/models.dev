# Synced from Atlara's public catalogue, https://api.atlara.ai/v1/model-catalogue (accessed 2026-11-27):
# hosted prices (price_in_hosted / price_out_hosted, USD per 1M tokens), context window, reasoning efforts.
# Reasoning: Atlara accepts reasoning_effort and forwards only the levels listed for the model
# (supported_reasoning_efforts); with none listed it drops the field, so the caller has no control.
schema = 2
base_model = "deepseek/deepseek-v4-flash"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }

[limit]
context = 1_048_576

[cost.text.input]
price = 0.09256

[cost.text.output]
price = 0.23296
