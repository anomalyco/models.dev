# Sources (accessed 2026-11-15):
# - https://uncensoredchats.com/v1/models for this ID: context_length 1048576, supports_tools true, supports_reasoning true,
#   USD per 1M tokens input 2.00 / cached input 1.00 / output 5.00.
# - https://uncensoredchats.com/models/ (the same prices and context, per model) and https://uncensoredchats.com/docs/ (the API).
# - Live requests to POST /v1/chat/completions on 2026-11-15: tool calls returned as tool_calls; response_format json_schema
#   returned JSON matching the schema; reasoning arrives in message.reasoning; a stream ends with a usage chunk whether or
#   not stream_options.include_usage is sent; max_tokens values up to 1048576 are accepted.
# Weights: an uncensored build of GLM 5.3, trained to answer instead of refusing.
# Input is listed as text only. Image input is not listed until each image type has been checked against this ID.
# Thinking-only: {"thinking": {"type": "disabled"}} is refused with 400 "always reasons, so reasoning cannot be turned off".
# Effort: reasoning_effort = low|high|max. Every other ladder value is accepted and answers 200.
schema = 2
base_model = "zhipuai/glm-5.3"
name = "GLM 5.3 Uncensored"
description = "Uncensored GLM 5.3: an open-weight build trained to answer instead of refusing, served by Uncensored Chats"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
stream_usage = true
cache = { implicit = true }

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning" }

[cost.text.input]
price = 2
cache = { read = 1 }

[cost.text.output]
price = 5
