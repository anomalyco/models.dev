# Sources (accessed 2026-11-15):
# - https://uncensoredchats.com/v1/models for this ID: context_length 1048576, supports_tools true, supports_reasoning true,
#   USD per 1M tokens input 1.00 / cached input 0.50 / output 2.00.
# - https://uncensoredchats.com/models/ (the same prices and context, per model) and https://uncensoredchats.com/docs/ (the API).
# - Live requests to POST /v1/chat/completions on 2026-11-15: tool calls returned as tool_calls; response_format json_schema
#   returned JSON matching the schema; reasoning arrives in message.reasoning; a stream ends with a usage chunk whether or
#   not stream_options.include_usage is sent; max_tokens values up to 1048576 are accepted.
# Weights: an abliterated build of MiMo V2.6 Flash, with the refusal direction removed from the weights.
# Input is listed as text only. Image input is not listed until each image type has been checked against this ID.
# Reasoning is off unless asked for. Toggle: thinking.type = enabled|disabled (reasoning_effort = "none" also disables).
# No effort ladder is listed: every reasoning_effort value from minimal to max turned reasoning on with the same reasoning token count.
schema = 2
base_model = "xiaomi/mimo-v2.6-flash"
name = "MiMo V2.6 Flash Uncensored"
description = "Abliterated MiMo V2.6 Flash: the refusal direction removed from the weights, served by Uncensored Chats"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
stream_usage = true
cache = { implicit = true }

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning" }

[cost.text.input]
price = 1
cache = { read = 0.5 }

[cost.text.output]
price = 2
