# Sources (accessed 2026-11-15):
# - https://uncensoredchats.com/v1/models for this ID: context_length 512000, supports_tools true, supports_reasoning true,
#   USD per 1M tokens input 0.36 / cached input 0.03 / output 1.44.
# - https://uncensoredchats.com/models/ (the same prices and context, per model) and https://uncensoredchats.com/docs/ (the API).
# - Live requests to POST /v1/chat/completions on 2026-11-15: tool calls returned as tool_calls; response_format json_schema
#   returned JSON matching the schema; reasoning arrives in message.reasoning; a stream ends with a usage chunk whether or
#   not stream_options.include_usage is sent; max_tokens values up to 1048576 are accepted.
# Weights: an abliterated build of DeepSeek V4.1 Flash 1017 (the Flash Lite build, made with Heretic), with the refusal direction removed from the weights.
# Input is listed as text only. Image input is not listed until each image type has been checked against this ID.
# Reasoning is off unless asked for. Toggle: thinking.type = enabled|disabled (reasoning_effort = "none" also disables).
# Effort: reasoning_effort = low|high|max. Every other ladder value is accepted and answers 200.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"
name = "DeepSeek Flash Lite Uncensored"
description = "Abliterated DeepSeek V4.1 Flash 1017 (the Flash Lite build, made with Heretic): the refusal direction removed from the weights, served by Uncensored Chats"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true
stream_usage = true
cache = { implicit = true }

[limit]
context = 512_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning" }

[cost.text.input]
price = 0.36
cache = { read = 0.03 }

[cost.text.output]
price = 1.44
