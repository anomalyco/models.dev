# Price: https://cheapaimodel.ai/api/models (fetched 2026-10-27) lists the peak rate
# (input $0.2093511, output $0.8374044, cache read $0.004187022 per 1M tokens).
# Billing follows DeepSeek's peak/off-peak split: weekdays (Asia/Shanghai) 09:00-12:00 and
# 14:00-18:00 Beijing time (01:00-04:00, 06:00-10:00 UTC) bill 2x the off-peak base below.
# Unlike DeepSeek's own API, Chinese public holidays are not exempted.
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|high|max (mapped from providers/deepseek)
# Cache: automatic upstream prefix cache, no write price.
# Live 2026-10-27: reasoning returned in reasoning_content; thinking.type = disabled gives 0 reasoning tokens.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.10467555
cache = { read = 0.002093511 }

[cost.text.output]
price = 0.4187022

[[cost.multipliers]]
when = { utc_days = { in = ["mon", "tue", "wed", "thu", "fri"] }, any = [{ all = [{ utc_hours = { gte = "01:00" } }, { utc_hours = { lt = "04:00" } }] }, { all = [{ utc_hours = { gte = "06:00" } }, { utc_hours = { lt = "10:00" } }] }] }
factor = 2
