# Meta's Llama API model table lists this model as text input, text output, so attachment is false:
# https://web.archive.org/web/20250719121205/https://llama.developer.meta.com/docs/models/
# Deprecated: Meta retired the Llama API Public Preview, including api.llama.com, on 2026-07-06.
# https://www.promptfoo.dev/docs/providers/llamaApi/ and https://haystack.deepset.ai/integrations/meta_llama
# (Meta's own deprecation page now returns 404; llama.developer.meta.com redirects to dev.meta.ai).
schema = 2
name = "Llama-3.3-8B-Instruct"
description = "Open Llama instruction model for multilingual chat, reasoning, and coding"
family = "llama"
open_weights = true
knowledge = "2023-12"
release_date = "2024-12-06"
status = "deprecated"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true

[limit]
context = 128_000
output = 4_096

[cost.text.input]
price = 0

[cost.text.output]
price = 0
