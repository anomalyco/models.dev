# SambaNova serves hjbhxeg-M3 with a 1M context window and 1M max output tokens.
# Pricing from GET https://api.sambanova.ai/v1/models (probed 2026-10-09): USD per million tokens.
# https://docs.sambanova.ai/cloud/docs/get-started/supported-models
# SambaNova does not document a reasoning wire control for hjbhxeg-M3 on the chat-completions endpoint.
# hjbhxeg-M3 runs as text-only on SambaCloud (image/video input not accepted).
# https://docs.sambanova.ai/docs/en/models/sambacloud-models
base_model = "minimax/MiniMax-M3"

reasoning_options = []

attachment = false

[modalities]
input = ["text"]

[cost]
input = 0.60
output = 2.40
cache_read = 0.06

[limit]
output = 1_048_576
