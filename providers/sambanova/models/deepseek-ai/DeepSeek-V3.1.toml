# SambaNova serves DeepSeek-V3.1 with a 131k context window and 7,168 max output tokens.
# Pricing from GET https://api.sambanova.ai/v1/models (probed 2026-10-09): USD per million tokens.
# https://docs.sambanova.ai/cloud/docs/get-started/supported-models
# Toggle: DeepSeek-V3.1 hybrid thinking/non-thinking mode. SambaNova is OpenAI-compatible;
# same-surface peers (openrouter, deepinfra, tokengo) forward reasoning.enabled or thinking.type.
base_model = "deepseek/deepseek-v3.1"

[[reasoning_options]]
type = "toggle"

[cost]
input = 3.00
output = 4.50

[limit]
output = 7_168
