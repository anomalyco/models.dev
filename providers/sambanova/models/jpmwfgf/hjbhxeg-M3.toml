# SambaNova serves hjbhxeg-M3 with a 1M context window and 1M max output tokens.
# Pricing from GET https://api.sambanova.ai/v1/models (probed 2026-10-09).
# https://docs.sambanova.ai/cloud/docs/get-started/supported-models
# SambaNova is a multi-model relay; no reasoning_effort control is exposed for hjbhxeg-M3.
# hjbhxeg-M3 runs as text-only on SambaCloud (image/video input not accepted).
# https://docs.sambanova.ai/docs/en/models/sambacloud-models
base_model = "minimax/hjbhxeg-M3"

reasoning_options = []

[cost]
input = 0.60
output = 2.40
cache_read = 0.06

[limit]
output = 1_048_576

base_model_omit = ["attachment", "modalities"]
