# SambaNova serves DeepSeek-V3.2 with a 32k context window and 7,168 max output tokens.
# Pricing from GET https://api.sambanova.ai/v1/models (probed 2026-10-09): USD per million tokens.
# https://docs.sambanova.ai/cloud/docs/get-started/supported-models
# Toggle: DeepSeek-V3.2 hybrid thinking/non-thinking mode. SambaNova is OpenAI-compatible
# (https://api.sambanova.ai/v1) and likely forwards reasoning.enabled or thinking.type
# matching same-surface peers (openrouter, deepinfra).
base_model = "deepseek/deepseek-v3.2"

[[reasoning_options]]
type = "toggle"

[cost]
input = 3.00
output = 4.50

[limit]
context = 32_768
output = 7_168
