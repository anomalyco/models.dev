# Toggle: chat_template_kwargs.enable_thinking = true|false
# SambaNova DeepSeek-V3.2 thinking mode, disabled by default (text-generation docs curl + OpenAPI EnableThinking).
# https://docs.sambanova.ai/docs/en/features/text-generation
# https://docs.sambanova.ai/docs/api-reference/chat-completions/create-chat-based-completion
# Limits/pricing: GET https://api.sambanova.ai/v1/models (DeepSeek-V3.2 context_length 32768, max_completion_tokens 7168; USD 3.00/4.50 per MTok).
schema = 2
base_model = "deepseek/deepseek-v3.2"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
context = 32_768
output = 7_168

[cost.text.input]
price = 3

[cost.text.output]
price = 4.5
