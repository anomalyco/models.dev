# Toggle: chat_template_kwargs.enable_thinking = true|false
# SambaNova DeepSeek-V3.2 thinking mode on POST /v1/chat/completions, disabled by default.
# https://docs.sambanova.ai/docs/en/features/text-generation (DeepSeek-V3.2 thinking mode curl: model DeepSeek-V3.2 with chat_template_kwargs.enable_thinking true, reasoning field in response)
# https://docs.sambanova.ai/docs/api-reference/chat-completions/create-chat-based-completion (EnableThinking: deepseek models)
# Context 32k per https://docs.sambanova.ai/docs/en/models/sambacloud-models (DeepSeek-V3.2 32k preview); max output 7168 per DeepSeek-family SambaNova serving cap (OpenRouter SambaNova endpoint for DeepSeek-V3.1 max_completion_tokens 7168).
# Pricing USD/MTok per https://cloud.sambanova.ai/plans/pricing: DeepSeek-V3.2 input 3.00 / output 4.50.
base_model = "deepseek/deepseek-v3.2"

[[reasoning_options]]
type = "toggle"

[cost]
input = 3.00
output = 4.50

[limit]
context = 32_768
output = 7_168
