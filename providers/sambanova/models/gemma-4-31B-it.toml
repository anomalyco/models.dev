# Toggle: chat_template_kwargs.enable_thinking = true|false
# SambaNova Gemma thinking toggle (text-generation Gemma curl + staff community example).
# https://docs.sambanova.ai/docs/en/features/text-generation
# https://community.sambanova.ai/t/gemma-4-reasoning/1675
# Limits/pricing: GET https://api.sambanova.ai/v1/models (gemma-4-31B-it context_length 131072, max_completion_tokens 131072; USD 0.38/1.15 per MTok).
# Modalities Text/Image/Video per supported-models table + note: https://docs.sambanova.ai/docs/en/models/sambacloud-models
schema = 2
base_model = "google/gemma-4-31b-it"

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
context = 131_072
output = 131_072

[cost.text.input]
price = 0.38

[cost.text.output]
price = 1.15
