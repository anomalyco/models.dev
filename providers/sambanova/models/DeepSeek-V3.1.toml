# Toggle: chat_template_kwargs.enable_thinking = true|false
# SambaNova DeepSeek hybrid thinking toggle on POST /v1/chat/completions.
# https://docs.sambanova.ai/docs/en/features/text-generation (DeepSeek-V3.2 thinking mode: chat_template_kwargs.enable_thinking true returns reasoning field; same DeepSeek hybrid family)
# https://docs.sambanova.ai/docs/api-reference/chat-completions/create-chat-based-completion (EnableThinking: deepseek models; chat_template_kwargs.enable_thinking example true)
# https://community.sambanova.ai/t/deepseek-v3-1-an-approach-for-thinking-and-tool-use/1330 (V3.1 thinking via extra_body chat_template_kwargs.enable_thinking)
# Context 128k per https://docs.sambanova.ai/docs/en/models/sambacloud-models (DeepSeek-V3.1 128k, inherits lab 131072); max output 7168 per OpenRouter SambaNova endpoint max_completion_tokens.
# Pricing USD/MTok per https://cloud.sambanova.ai/plans/pricing: DeepSeek-V3.1 input 3.00 / output 4.50.
base_model = "deepseek/deepseek-v3.1"

[[reasoning_options]]
type = "toggle"

[cost]
input = 3.00
output = 4.50

[limit]
output = 7_168
