# Effort: reasoning_effort = low|medium|high
# SambaNova chat-completions OpenAPI defines reasoning_effort low/medium/high on POST /v1/chat/completions with gpt-oss-120b example.
# https://docs.sambanova.ai/docs/api-reference/chat-completions/create-chat-based-completion (ChatCompletionRequest.reasoning_effort enum low|medium|high)
# Baseline effort low/medium/high from chat-completions peers providers/openrouter/models/openai/gpt-oss-120b.toml, providers/togetherai/models/openai/gpt-oss-120b.toml, providers/fireworks-ai/models/accounts/fireworks/models/gpt-oss-120b.toml.
# Context 128k per https://docs.sambanova.ai/docs/en/models/sambacloud-models (gpt-oss-120b 128k, inherits lab 131072); output inherits lab 32768 (SambaNova max-output unpublished).
# Pricing USD/MTok per https://cloud.sambanova.ai/plans/pricing: gpt-oss-120b input 0.22 / output 0.59.
base_model = "openai/gpt-oss-120b"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
input = 0.22
output = 0.59
