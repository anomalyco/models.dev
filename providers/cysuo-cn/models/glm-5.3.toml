# (accessed 2026-11-23); the API key's resource configuration picks the supplier. Cheapest: supplier 1039.
# CNY per 1M tokens: input 3.44, output 12.04, cache read 0.86.
# CNY→USD rate: 6.681345, 2026-11-23, source: https://open.er-api.com/v6/latest/USD
# Limit: max output 1,000,000 tokens on the model page (the lab lists 131,072); Cysuo's value is used.
