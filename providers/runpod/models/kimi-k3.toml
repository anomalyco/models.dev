# Runpod documents the model, its 1M context, and pricing at:
# https://docs.runpod.io/public-endpoints/models/moonshot-kimi
# API verified 2026-07-27: `reasoning_effort` accepts "low", "high", and "max".
base_model = "moonshotai/kimi-k3"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 3.0
output = 15.0

[provider]
api = "https://api.runpod.ai/v2/moonshot-kimi/openai/v1"