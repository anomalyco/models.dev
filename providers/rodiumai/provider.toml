# RodiumAi is an OpenAI-compatible gateway for Africa: Mobile Money top-ups,
# one rd_sk_… key, and catalogue ids like openai/gpt-4o or anthropic/claude-….
# https://www.rodiumai.io/docs
# https://www.rodiumai.io/docs/guides/chat-completions
# Pricing on rodiumai.io is published in RODI; cost fields below are USD
# converted at ~639.2 RODI = 1 USD (aligned with their public USD≈ figures, 2026-10-12).
name = "RodiumAi"
npm = "@ai-sdk/openai-compatible"
api = "https://api.rodiumai.io/v1"
env = ["RODIUMAI_API_KEY"]
doc = "https://www.rodiumai.io/docs/models"
