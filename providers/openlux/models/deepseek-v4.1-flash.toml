# Price: OpenLux pay-as-you-go list price in USD per 1M tokens, as shown by default on
# https://www.openlux.ai/console/models?view=table (lowest-priced group, multiplier 0.3), read 2026-11-26.
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort on /v1/chat/completions, mapped by OpenLux to the upstream native control.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[capabilities]
reasoning = { effort = ["low", "high", "max"], supported = true, toggle = true }
cache = { implicit = true }

[cost.text.input]
price = 0.09
cache = { read = 0.0018 }

[cost.text.output]
price = 0.36
