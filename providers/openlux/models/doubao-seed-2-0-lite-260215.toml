# Effort: reasoning_effort on /v1/chat/completions, mapped by OpenLux to the upstream native control.
schema = 2
base_model = "bytedance-seed/seed-2.0-lite"
name = "Seed 2.0 Lite (260215)"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.0675
cache = { read = 0.0135 }

[cost.text.output]
price = 0.4125
