# Price: OpenLux pay-as-you-go list price in USD per 1M tokens, as shown by default on
# https://www.openlux.ai/console/models?view=table (lowest-priced group, multiplier 0.5), read 2026-11-26.
# Budget: thinking_budget is not forwarded by OpenLux, so no budget is listed (live 2026-11-27: thinking_budget 64 still gave 8000 reasoning tokens on qwen3.5-plus and qwen4-max).
# Effort: reasoning_effort on /v1/chat/completions, mapped by OpenLux to the upstream native control.
schema = 2
base_model = "alibaba/qwen4-max"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "high" }, effort = ["none", "low", "high", "xhigh"] }
cache = { implicit = { min_tokens = 1024 }, explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["system", "messages"], min_tokens = 1024 } }

[cost.text.input]
price = 0.75
cache = { read = 0.0375, write = { "5m" = 0.9375, "1h" = 1.5 } }

[cost.text.output]
price = 2.25
