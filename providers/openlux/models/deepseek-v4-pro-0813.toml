# Price: OpenLux pay-as-you-go list price in USD per 1M tokens, as shown by default on
# https://www.openlux.ai/console/models?view=table (lowest-priced group, multiplier 1.1), read 2026-11-26.
# Toggle: thinking.type = enabled|disabled (default enabled)
# Effort: reasoning_effort on /v1/chat/completions, mapped by OpenLux to the upstream native control.
schema = 2
base_model = "deepseek/deepseek-v4-pro-0813"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "high" }, toggle = true, effort = ["low", "high", "max"] }
cache = { implicit = true }

[cost.text.input]
price = 1.452
cache = { read = 0.048395 }

[cost.text.output]
price = 4.356
