# Price: OpenLux pay-as-you-go list price in USD per 1M tokens, as shown by default on
# https://www.openlux.ai/console/models?view=table (lowest-priced group, multiplier 0.07353), read 2026-11-26.
# Effort: reasoning_effort on /v1/chat/completions, mapped by OpenLux to the upstream native control.
schema = 2
base_model = "google/gemini-2.5-flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
cache = { implicit = { min_tokens = 2048 } }

[cost.text.input]
price = 0.022059
cache = { read = 0.002206 }

[cost.text.output]
price = 0.183972
