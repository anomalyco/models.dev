# Price: OpenLux pay-as-you-go list price in USD per 1M tokens, as shown by default on
# https://www.openlux.ai/console/models?view=table (lowest-priced group, multiplier 0.1), read 2026-11-26.
# Cache: no cache-read ratio is set for this model ID on OpenLux, so cached input is billed
# at the full input price. OpenLux bills each model ID separately; gpt-4.1-nano-2025-04-14 is billed at 25%.
schema = 2
base_model = "openai/gpt-4.1-nano"

[capabilities]
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.01
cache = { read = 0.01 }

[cost.text.output]
price = 0.04
