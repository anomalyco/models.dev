# Price: OpenLux pay-as-you-go list price in USD per 1M tokens, as shown by default on
# https://www.openlux.ai/console/models?view=table (lowest-priced group, multiplier 1.1), read 2026-11-26.
# Toggle: thinking.type = enabled|disabled (disabled verified live on OpenLux 2026-11-26; effort turns thinking on)
# Effort: reasoning_effort on /v1/chat/completions, mapped by OpenLux to the upstream native control.
schema = 2
base_model = "deepseek/deepseek-v4-flash-0731"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
cache = { implicit = true }

[cost.text.input]
price = 0.484
cache = { read = 0.0154 }

[cost.text.output]
price = 1.452
