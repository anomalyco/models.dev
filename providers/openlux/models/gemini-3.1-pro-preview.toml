# Price: OpenLux pay-as-you-go list price in USD per 1M tokens, as shown by default on
# https://www.openlux.ai/console/models?view=table (lowest-priced group, multiplier 0.2), read 2026-11-26.
# Effort: reasoning_effort on /v1/chat/completions, mapped by OpenLux to the upstream native control.
schema = 2
base_model = "google/gemini-3.1-pro-preview"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "high" }, effort = ["low", "medium", "high"] }
structured_output = true
cache = { implicit = { min_tokens = 4096 } }

[cost.text.input]
price = 0.4
cache = { read = 0.04 }

[cost.text.output]
price = 2.4
