# Price: OpenLux pay-as-you-go list price in USD per 1M tokens, as shown by default on
# https://www.openlux.ai/console/models?view=table (lowest-priced group, multiplier 0.75), read 2026-11-26.
# Budget: thinking_budget is not forwarded by OpenLux, so no budget is listed (live 2026-11-27: thinking_budget 64 still gave 8000 reasoning tokens on qwen3.5-plus and qwen4-max).
# Toggle: enable_thinking = true|false
# Effort: reasoning_effort on /v1/chat/completions, mapped by OpenLux to the upstream native control.
schema = 2
base_model = "alibaba/qwen3.8-27b"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "xhigh" }, toggle = true, effort = ["low", "medium", "xhigh"] }
cache = { implicit = { min_tokens = 1024 } }

[cost.text.input]
price = 0.375
cache = { read = 0.075 }

[cost.text.output]
price = 2.25
