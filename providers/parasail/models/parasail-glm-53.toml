# Parasail OpenAI Chat (POST https://api.parasail.io/v1/chat/completions)
# model = "parasail-glm-53" (zai-org/GLM-5.3).
# Effort: reasoning_effort = low|high|max, forwarded to the model. Thinking cannot be disabled (reasoning_effort = "none" leaks the thinking into content). Verified against the endpoint on 2026-09-22.
# Catalog: https://platform.parasail.io/api/v1/prices/serverlessEndpoints
base_model = "zhipuai/glm-5.3"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 1.4
output = 4.4
cache_read = 0.26

[limit]
context = 1_048_576
