base_model = "alibaba/qwen3.5-35b-a3b"
reasoning_options = [{ type = "toggle" }]

[cost]
input = 0.15
output = 1
cache_read = 0.05

[limit]
output = 262_144

[modalities]
input = ["text", "image", "video"]
