# Parasail OpenAI Chat (POST https://api.parasail.io/v1/chat/completions)
# model = "parasail-gpt-oss-20b" (openai/gpt-oss-20b).
# Effort: reasoning_effort = "low"|"medium"|"high", forwarded to the model. Verified against the endpoint on 2026-09-22.
# Catalog: https://platform.parasail.io/api/v1/prices/serverlessEndpoints
base_model = "openai/gpt-oss-20b"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
input = 0.03
output = 0.15
cache_read = 0.02
