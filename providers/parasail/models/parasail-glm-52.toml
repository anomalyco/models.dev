# Parasail OpenAI Chat (POST https://api.parasail.io/v1/chat/completions)
# model = "parasail-glm-52" (nvidia/GLM-5.2-NVFP4).
# Off is reasoning_effort = none; graded levels high|max are forwarded to the model, no toggle. Verified against the endpoint on 2026-09-22.
# Catalog: https://platform.parasail.io/api/v1/prices/serverlessEndpoints
base_model = "zhipuai/glm-5.2"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["none", "high", "max"]

[cost]
input = 1.4
output = 4.4
cache_read = 0.26

[limit]
context = 262_144
