# Parasail OpenAI Chat (POST https://api.parasail.io/v1/chat/completions)
# model = "parasail-deepseek-v4-pro-0813" (deepseek-ai/DeepSeek-V4-Pro-0813).
# Off is reasoning_effort = none; graded levels low|high|max are forwarded to the model, no toggle. Verified against the endpoint on 2026-09-22.
# Catalog: https://platform.parasail.io/api/v1/prices/serverlessEndpoints
base_model = "deepseek/deepseek-v4-pro-0813"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "high", "max"]

[cost]
input = 1.32
output = 3.96
cache_read = 0.044

[limit]
context = 1_048_576
