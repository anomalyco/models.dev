# Prompt lengths low/high/max=102/102/101; low and high differ by one token despite equal length.
# Toggle probes observed zero reasoning tokens when off and nonzero at all three efforts when on.
# An invalid effort also returned HTTP 200, so acceptance alone was not used as evidence.
# https://huggingface.co/moonshotai/Kimi-K3/blob/main/tokenization_kimi.py
# https://huggingface.co/moonshotai/Kimi-K3/blob/main/encoding_k3.py
base_model = "moonshotai/kimi-k3"
reasoning_options = [{ type = "toggle" }, { type = "effort", values = ["low", "high", "max"] }]

