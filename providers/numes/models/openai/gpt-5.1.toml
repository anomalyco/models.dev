# Reasoning controls: not declared by Numes; copied from openrouter/openai/gpt-5.1 (Numes forwards the OpenRouter reasoning object).
# Effort: reasoning.effort = none|low|medium|high
schema = 2
base_model = "openai/gpt-5.1"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
temperature = false

[cost.text.input]
price = 1.055

[cost.text.output]
price = 8.44
