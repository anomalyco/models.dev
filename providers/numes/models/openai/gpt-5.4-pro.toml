# Reasoning controls: not declared by Numes; copied from openrouter/openai/gpt-5.4-pro (Numes forwards the OpenRouter reasoning object).
# Effort: reasoning.effort = medium|high|xhigh
schema = 2
base_model = "openai/gpt-5.4-pro"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["medium", "high", "xhigh"] }
structured_output = true

[cost.text.input]
price = 25.32

[cost.text.output]
price = 151.92
