# Reasoning controls: always on (not declared by Numes; matches openrouter/openai/gpt-5-image-mini, which exposes no caller control).
# Tools: custom (freeform) tools are not supported on Numes Chat Completions (tools accepts only function and hosted tools, per https://numes.ai/docs/api-reference/parameters), so freeform is left out.
schema = 2
base_model = "openai/gpt-5-image-mini"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 2.11
cache = { read = 0.211 }

[cost.text.output]
price = 1.688
