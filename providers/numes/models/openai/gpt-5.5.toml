# Reasoning controls: not declared by Numes; copied from openrouter/openai/gpt-5.5 (Numes forwards the OpenRouter reasoning object).
# Effort: reasoning.effort = none|low|medium|high|xhigh
schema = 2
base_model = "openai/gpt-5.5"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true
temperature = false
cache = { implicit = true }

[cost.text.input]
price = 4.22
cache = { read = 0.422 }

[cost.text.output]
price = 25.32
