# Reasoning controls: not declared by Numes; copied from openrouter/openai/o3-pro (Numes forwards the OpenRouter reasoning object).
# Toggle: reasoning.enabled = true|false
schema = 2
base_model = "openai/o3-pro"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[cost.text.input]
price = 16.88

[cost.text.output]
price = 67.52
