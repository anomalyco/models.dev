# Reasoning controls: not declared by Numes; copied from openrouter/openai/gpt-5.6-sol (Numes forwards the OpenRouter reasoning object).
# Effort: reasoning.effort = none|low|medium|high|xhigh|max
schema = 2
base_model = "openai/gpt-5.6-sol"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
temperature = false
cache = { implicit = true }

[cost.text.input]
price = 3.376
cache = { read = 0.3376 }

[cost.text.output]
price = 16.88
