# Reasoning controls: not declared by Numes; copied from openrouter/openai/gpt-5.3-codex (Numes forwards the OpenRouter reasoning object).
# Effort: reasoning.effort = none|low|medium|high|xhigh
schema = 2
base_model = "openai/gpt-5.3-codex"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true
temperature = false

[cost.text.input]
price = 1.477

[cost.text.output]
price = 11.816
