# Reasoning controls: not declared by Numes; copied from openrouter/openai/gpt-5-mini (Numes forwards the OpenRouter reasoning object).
# Effort: reasoning.effort = minimal|low|medium|high
# Tools: custom (freeform) tools are not supported on Numes Chat Completions (tools accepts only function and hosted tools, per https://numes.ai/docs/api-reference/parameters), so freeform is left out.
schema = 2
base_model = "openai/gpt-5-mini"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.211
cache = { read = 0.0211 }

[cost.text.output]
price = 1.688
