# Reasoning controls: Numes /public/v1/models `reasoning` declaration for this model.
# Toggle: reasoning.enabled = true|false
# Effort: reasoning.effort = low|medium|high
schema = 2
base_model = "openai/gpt-oss-120b"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.037
cache = { read = 0.0185 }

[cost.text.output]
price = 0.17
