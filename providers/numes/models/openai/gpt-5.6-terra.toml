# Reasoning controls: not declared by Numes; copied from openrouter/openai/gpt-5.6-terra (Numes forwards the OpenRouter reasoning object).
# Effort: reasoning.effort = none|low|medium|high|xhigh|max
schema = 2
base_model = "openai/gpt-5.6-terra"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
temperature = false

[cost.text.input]
price = 1.688

[cost.text.output]
price = 10.128
