# Reasoning controls: not declared by Numes; copied from openrouter/openai/gpt-6.2-astra (Numes forwards the OpenRouter reasoning object).
# Effort: reasoning.effort = low|medium|high|xhigh|max
schema = 2
base_model = "openai/gpt-6.2-astra"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 6.752
cache = { read = 0.3376 }

[cost.text.output]
price = 33.76
