# Reasoning controls: not declared by Numes; copied from openrouter/openai/gpt-5.4-image-2 (Numes forwards the OpenRouter reasoning object).
# Effort: reasoning.effort = none|low|medium|high|xhigh
schema = 2
base_model = "openai/gpt-5.4-image-2"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true

[cost.text.input]
price = 6.752

[cost.text.output]
price = 12.66
