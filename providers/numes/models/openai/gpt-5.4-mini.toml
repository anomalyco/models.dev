# Reasoning controls: not declared by Numes; copied from openrouter/openai/gpt-5.4-mini (Numes forwards the OpenRouter reasoning object).
# Effort: reasoning.effort = none|low|medium|high|xhigh
# Tools: custom (freeform) tools are not supported on Numes Chat Completions (tools accepts only function and hosted tools, per https://numes.ai/docs/api-reference/parameters), so freeform is left out.
schema = 2
base_model = "openai/gpt-5.4-mini"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true
temperature = false
cache = { implicit = true }

[cost.text.input]
price = 0.633
cache = { read = 0.0633 }

[cost.text.output]
price = 3.798
