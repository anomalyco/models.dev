# Reasoning controls: Numes /public/v1/models `reasoning` declaration for this model.
# Toggle: reasoning.enabled = true|false
# Effort: reasoning.effort = low|medium|high
schema = 2
base_model = "inclusionai/ling-3.0-flash-vl"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 131_072

[cost.text.input]
price = 0.06
cache = { read = 0.012 }

[cost.text.output]
price = 0.18
