# Reasoning controls: not declared by Numes; copied from openrouter/bytedance-seed/seed-2.0-lite (Numes forwards the OpenRouter reasoning object).
# Effort: reasoning.effort = none|minimal|low|medium|high
schema = 2
base_model = "bytedance-seed/seed-2.0-lite"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 0.26375

[cost.text.output]
price = 2.11
