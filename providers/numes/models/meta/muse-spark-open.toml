# Reasoning controls: not declared by Numes; copied from openrouter/meta/muse-spark-open (Numes forwards the OpenRouter reasoning object).
# Effort: reasoning.effort = low|medium|high|xhigh
schema = 2
base_model = "meta/muse-spark-open"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 1.31875
cache = { read = 0.15825 }

[cost.text.output]
price = 4.48375
