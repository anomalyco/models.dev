# Reasoning controls: not declared by Numes; copied from openrouter/qwen/qwen3.8-flash (Numes forwards the OpenRouter reasoning object).
# Toggle: reasoning.enabled = true|false
# Budget: reasoning.max_tokens (integer reasoning tokens)
schema = 2
base_model = "alibaba/qwen3.8-flash"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, budget = {} }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.113
cache = { read = 0.0141 }

[cost.text.output]
price = 0.382
