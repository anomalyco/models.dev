# Reasoning controls: not declared by Numes; copied from alibaba/qwen3.8-max (Numes forwards the OpenRouter reasoning object).
# Toggle: reasoning.enabled = true|false
# Effort: reasoning.effort = low|medium|xhigh
# Budget: reasoning.max_tokens (integer reasoning tokens)
schema = 2
base_model = "alibaba/qwen3.8-max"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "xhigh"], budget = {} }
structured_output = true
cache = { implicit = true }

[limit]
context = 256_000

[cost.text.input]
price = 1.65
cache = { read = 0.206 }

[cost.text.output]
price = 4.951
