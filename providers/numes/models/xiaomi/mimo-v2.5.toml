# Reasoning controls: not declared by Numes; copied from openrouter/xiaomi/mimo-v2.5 (Numes forwards the OpenRouter reasoning object).
# Toggle: reasoning.enabled = true|false
schema = 2
base_model = "xiaomi/mimo-v2.5"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
context = 1_000_000

[cost.text.input]
price = 0.422

[cost.text.output]
price = 2.11
