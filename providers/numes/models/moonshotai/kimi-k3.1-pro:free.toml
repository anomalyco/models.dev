# Reasoning controls: Numes /public/v1/models `reasoning` declaration for this model.
# Effort: reasoning.effort = none|low|medium|high|max
schema = 2
base_model = "moonshotai/kimi-k3.1-pro"
name = "Kimi K3.1 Pro (free)"
family = "kimi-pro-free"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"] }
structured_output = true

[limit]
output = 131_072

[cost.text.input]
price = 0

[cost.text.output]
price = 0
