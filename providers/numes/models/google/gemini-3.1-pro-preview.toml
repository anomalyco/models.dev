# Reasoning controls: not declared by Numes; copied from openrouter/google/gemini-3.1-pro-preview (Numes forwards the OpenRouter reasoning object).
# Effort: reasoning.effort = low|medium|high
schema = 2
base_model = "google/gemini-3.1-pro-preview"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 2.11
cache = { read = 0.211 }

[cost.text.output]
price = 12.66
