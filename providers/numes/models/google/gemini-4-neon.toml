# Reasoning controls: not declared by Numes; copied from openrouter/google/gemini-4-neon (Numes forwards the OpenRouter reasoning object).
# Effort: reasoning.effort = low|medium|high|xhigh
schema = 2
base_model = "google/gemini-4-neon"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 3.165
cache = { read = 0.15825 }

[cost.text.output]
price = 15.825
