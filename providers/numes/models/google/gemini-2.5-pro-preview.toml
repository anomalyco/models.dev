# Reasoning controls: not declared by Numes; copied from openrouter/google/gemini-2.5-pro-preview (Numes forwards the OpenRouter reasoning object).
# Budget: reasoning.max_tokens (integer reasoning tokens)
schema = 2
base_model = "google/gemini-2.5-pro-preview"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, budget = { min = 128, max = 32_768 } }
structured_output = true

[cost.text.input]
price = 1.31875

[cost.text.output]
price = 10.55
