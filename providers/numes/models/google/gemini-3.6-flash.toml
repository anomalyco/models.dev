# Reasoning controls: not declared by Numes; copied from openrouter/google/gemini-3.6-flash (Numes forwards the OpenRouter reasoning object).
# Effort: reasoning.effort = minimal|low|medium|high
schema = 2
base_model = "google/gemini-3.6-flash"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.79125
cache = { read = 0.079125 }

[cost.text.output]
price = 3.95625
