# Reasoning controls: not declared by Numes; copied from openrouter/google/gemini-3.5-flash-lite (Numes forwards the OpenRouter reasoning object).
# Effort: reasoning.effort = minimal|low|medium|high
schema = 2
base_model = "google/gemini-3.5-flash-lite"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.3165
cache = { read = 0.03165 }

[cost.text.output]
price = 2.6375
