# Reasoning controls: not declared by Numes; copied from openrouter/google/gemini-3.8-flash (Numes forwards the OpenRouter reasoning object).
# Effort: reasoning.effort = low|medium|high
schema = 2
base_model = "google/gemini-3.8-flash"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 0.870375

[cost.text.output]
price = 4.351875
