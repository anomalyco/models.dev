# Reasoning controls: Numes /public/v1/models `reasoning` declaration for this model.
# Effort: reasoning.effort = none|low|medium|high|xhigh|max
schema = 2
base_model = "anthropic/claude-haiku-5-5"

[modalities]
input = ["text", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.1055
cache = { read = 0.01 }

[cost.text.output]
price = 0.5275
