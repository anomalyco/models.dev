# Reasoning controls: Numes /public/v1/models `reasoning` declaration for this model.
# Effort: reasoning.effort = none|low|medium|high|max
# Budget: reasoning.max_tokens (integer reasoning tokens)
schema = 2
base_model = "anthropic/claude-opus-4-6"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"], budget = {} }
structured_output = true
temperature = false
cache = { implicit = true }

[cost.text.input]
price = 5
cache = { read = 0.5 }

[cost.text.output]
price = 25
