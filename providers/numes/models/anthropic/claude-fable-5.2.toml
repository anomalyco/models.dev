# Reasoning controls: Numes /public/v1/models `reasoning` declaration for this model.
# Effort: reasoning.effort = low|medium|high|xhigh|max
schema = 2
base_model = "anthropic/claude-fable-5-2"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 8
cache = { read = 0.2 }

[cost.text.output]
price = 40
