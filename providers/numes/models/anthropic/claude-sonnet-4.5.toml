# Reasoning controls: not declared by Numes; copied from openrouter/anthropic/claude-sonnet-4.5 (Numes forwards the OpenRouter reasoning object).
# Toggle: reasoning.enabled = true|false
schema = 2
base_model = "anthropic/claude-sonnet-4-5"

[modalities]
input = ["text", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 3.165
cache = { read = 0.3165 }

[cost.text.output]
price = 15.825
