# Reasoning controls: Numes /public/v1/models `reasoning` declaration for this model.
# Effort: reasoning.effort = low|medium|high|xhigh|max
schema = 2
base_model = "anthropic/claude-fable-5-1"

[modalities]
input = ["text", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 10
cache = { read = 0.25 }

[cost.text.output]
price = 50
