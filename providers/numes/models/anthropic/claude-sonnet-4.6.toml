# Reasoning controls: Numes /public/v1/models `reasoning` declaration for this model.
# Toggle: reasoning.enabled = true|false
# Effort: reasoning.effort = low|medium|high
schema = 2
base_model = "anthropic/claude-sonnet-4-6"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 3
cache = { read = 0.3 }

[cost.text.output]
price = 15
