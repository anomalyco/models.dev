# Reasoning controls: not declared by Numes; copied from openrouter/thinkingmachines/inkling-2-small (Numes forwards the OpenRouter reasoning object).
# Effort: reasoning.effort = minimal|low|medium|high|max
schema = 2
base_model = "thinkingmachines/inkling-2-small"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "max"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.3165
cache = { read = 0.03165 }

[cost.text.output]
price = 1.055
