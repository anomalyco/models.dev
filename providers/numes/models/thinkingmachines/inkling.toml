# Reasoning controls: not declared by Numes; copied from openrouter/thinkingmachines/inkling (Numes forwards the OpenRouter reasoning object).
# Effort: reasoning.effort = none|minimal|low|medium|high|max
schema = 2
base_model = "thinkingmachines/inkling"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "max"] }

[limit]
context = 524_288
output = 131_072

[cost.text.input]
price = 1.055

[cost.text.output]
price = 4.27275
