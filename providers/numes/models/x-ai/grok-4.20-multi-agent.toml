# Reasoning controls: not declared by Numes; copied from openrouter/x-ai/grok-4.20-multi-agent (Numes forwards the OpenRouter reasoning object).
# Effort: reasoning.effort = low|medium|high|xhigh
schema = 2
base_model = "xai/grok-4.20-multi-agent-0309"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 1.31875
cache = { read = 0.211 }

[cost.text.output]
price = 2.6375
