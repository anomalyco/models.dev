# Reasoning controls: not declared by Numes; copied from openrouter/x-ai/grok-4.7 (Numes forwards the OpenRouter reasoning object).
# Effort: reasoning.effort = low|medium|high|xhigh
schema = 2
base_model = "xai/grok-4.7"

[modalities]
input = ["text", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true

[limit]
output = 131_072

[cost.text.input]
price = 2.11

[cost.text.output]
price = 6.33
