# Toggle: enable_thinking boolean (Moonshot OpenAI-compat dialect; the gateway
# also accepts enable_thinking:false which maps to effort=none).
# Effort: reasoning_effort = low|high|max.
base_model = "moonshotai/kimi-k3"

[cost]
input = 3
output = 15

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]
