# Reasoning wire: OpenAI Chat Completions reasoning_effort; "none" disables
# thinking, "high"/"max" grade it. No separate on/off field is forwarded.
base_model = "deepseek/deepseek-v4-pro-0813"

[cost]
input = 1.32
output = 3.96

[[reasoning_options]]
type = "effort"
values = ["none", "high", "max"]
