# AIgateway forwards the OpenAI Chat Completions reasoning_effort value for
# this model; "none" disables thinking, low/medium/high grade it.
# budget_tokens is not forwarded.
base_model = "anthropic/claude-haiku-4-5"

[cost]
input = 1
output = 5

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high"]
