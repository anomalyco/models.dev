# AIgateway is a plain OpenAI Chat Completions passthrough; it forwards
# `reasoning_effort`, which Anthropic's OpenAI-compatible endpoint maps onto
# its thinking control (on/off). No separate budget wire is exposed.
base_model = "anthropic/claude-haiku-4-5"

[cost]
input = 1
output = 5

[[reasoning_options]]
type = "toggle"
