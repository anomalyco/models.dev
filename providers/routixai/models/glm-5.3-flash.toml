# Prices and endpoint capabilities: https://routixai.online/v1/catalog/models (snapshot 2026-11-25 UTC).
# Access requires RoutixAI Go or higher; prices are PAYG USD per million tokens.
# Zhipu Chat Completions effort baseline, cross-checked against Concentrate.
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
cache = { implicit = true }

[cost.text.input]
price = 0.0375
cache = { read = 0.0075 }

[cost.text.output]
price = 0.125
