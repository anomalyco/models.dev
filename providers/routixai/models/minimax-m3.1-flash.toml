# Prices and endpoint capabilities: https://routixai.online/v1/catalog/models (snapshot 2026-11-25 UTC).
# Access requires RoutixAI Free or higher; prices are PAYG USD per million tokens.
# MiniMax Chat Completions effort baseline, cross-checked against OpenRouter and NanoGPT.
schema = 2
base_model = "minimax/MiniMax-M3.1-Flash"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
cache = { implicit = true }

[cost.text.input]
price = 0.0375
cache = { read = 0.004 }

[cost.text.output]
price = 0.15
