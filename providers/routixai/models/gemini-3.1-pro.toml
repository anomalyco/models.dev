# Prices and endpoint capabilities: https://routixai.online/v1/catalog/models (snapshot 2026-11-25 UTC).
# Access requires RoutixAI Plus or higher; prices are PAYG USD per million tokens.
# Gemini Chat Completions effort baseline: Google, OpenRouter and Cloudflare AI Gateway.
# Same lab-model alias as Cloudflare AI Gateway’s gemini-3.1-pro route.
schema = 2
base_model = "google/gemini-3.1-pro-preview"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
cache = { implicit = true }

[cost.text.input]
price = 0.5
cache = { read = 0.05 }

[cost.text.output]
price = 3
