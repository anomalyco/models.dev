# Sources (accessed 2026-11-10):
# https://evren.ssyz.org.tr/llm/models
# https://api.ssyz.org.tr/api/v1/public/llm-stats
# https://evren-llmapi.ssyz.org.tr/openapi.json
# Authenticated GET /v1/models and live stream probes confirmed the controls below.
# Output allowance comes from the public portal's max_output_tokens, not the
# authenticated API's default_max_output_tokens (which is only a request default).
# EVREN bills in CR credits; no verified USD conversion is published, so cost is omitted.
# Toggle: thinking = true|false; the public inventory declares reasoning_effort = false.
schema = 2
base_model = "google/gemma-4-31b-it"
v2_only = true

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
cache = { implicit = true }

[limit]
output = 16_384

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content", max_tokens_field = "max_tokens" }
