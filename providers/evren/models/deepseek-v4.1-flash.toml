# Sources (accessed 2026-11-10):
# https://evren.ssyz.org.tr/llm/models
# https://api.ssyz.org.tr/api/v1/public/llm-stats
# https://evren-llmapi.ssyz.org.tr/openapi.json
# Authenticated GET /v1/models and live stream probes confirmed the controls below.
# Output limit inherits lab metadata; EVREN accepted that max_tokens value in a
# short-response probe. Portal/default output values are not treated as hard caps.
# EVREN bills in CR credits; no verified USD conversion is published, so cost is omitted.
# Toggle: thinking = true|false (EVREN gateway, not the lab's thinking.type).
# Effort: reasoning_effort = low|high|max; baseline from providers/deepseek/models/deepseek-flash.toml.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"
v2_only = true

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content", max_tokens_field = "max_tokens" }
