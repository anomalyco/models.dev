# Pricing: https://jzstoken.com/model-pricing/gpt-image-2 (checked 2026-11-20; row last updated 2026-11-20 00:17 UTC).
# Billed per generated image, not per token: $0.0058. Token rates on this page do not apply.
# API: POST https://jzstoken.com/api/v1/images/generations.
# v2_only: v1 prices are per text token, so a per-image price would be dropped and the v1 row would have no cost.
# Modalities: page says image input is not supported.
schema = 2
v2_only = true
base_model = "openai/gpt-image-2"

[modalities]
input = ["text"]

[api.images]
sdk = { opencodeai = "@opencode/ai/providers/openai-compatible/images" }

[cost.image.output]
unit = "image"
price = 0.0058
