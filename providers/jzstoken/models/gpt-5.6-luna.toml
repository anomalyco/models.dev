# Pricing: https://jzstoken.com/model-pricing/gpt-5.6-luna (checked 2026-11-20; row last updated 2026-11-20 00:17 UTC).
# USD per 1M tokens, standard list price. Cache read/write apply when the upstream provider reports cached tokens.
# base_model: openai/gpt-5.6-luna
# Host publishes context 258_000; lab context is 1_050_000. Lab input 922_000 exceeds that window, so input is capped to the published context. The page publishes no separate input cap.
# Freeform custom tools: live probe on 2026-10-30 America/Tijuana against
# https://jzstoken.com/api/v1/chat/completions using a Standard customer key.
# type=function tools returned HTTP 200 with tool_calls (supported).
# type=custom freeform text / lark / regex returned HTTP 400,
# code=request_feature_unsupported ("native Responses bridge cannot preserve custom").
# This host explicitly does not support freeform; base_model_omit removes it.
# The probe was not repeated for this id; it was a host-level chat-completions result.
# Upstream control shape from providers/openai/models/gpt-5.6-luna.toml (JZSTOKEN does not certify reasoning per model):
# Effort: reasoning_effort = none|low|medium|high|xhigh|max
schema = 2
base_model = "openai/gpt-5.6-luna"
base_model_omit = ["capabilities.tools.freeform"]

[limit]
context = 258_000
input = 258_000

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.1555
cache = { read = 0.0155, write = 0.1555 }

[cost.text.output]
price = 0.7773
