# Pricing: https://jzstoken.com/model-pricing/deepseek-v4-pro (2026-10-30).
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|high|max
# The displayed base prices are off-peak. The cited page says: "During
# 09:00-12:00 x2, 14:00-18:00 x2 (Asia/Shanghai) every rate above is multiplied
# by the peak factor." It states no weekday or holiday restriction.
schema = 2
base_model = "deepseek/deepseek-v4-pro"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.4491
cache = { read = 0.0449, write = 0.4491 }

[cost.text.output]
price = 2.25

[[cost.multipliers]]
when = { any = [{ all = [{ utc_hours = { gte = "01:00" } }, { utc_hours = { lt = "04:00" } }] }, { all = [{ utc_hours = { gte = "06:00" } }, { utc_hours = { lt = "10:00" } }] }] }
factor = 2
