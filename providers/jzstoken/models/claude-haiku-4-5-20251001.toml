# Pricing: https://jzstoken.com/model-pricing/claude-haiku-4-5-20251001 (checked 2026-11-20).
# Toggle: reasoning.enabled = true|false
# Budget: thinking.budget_tokens >= 1024 (matches the lab and relay peers).
# The host exposes an OpenAI-compatible relay baseline; it does not certify optional
# features per model, so only the upstream control shape is recorded here.
schema = 2
base_model = "anthropic/claude-haiku-4-5-20251001"

# Host publishes context 256_000; lab context is 200_000.
[limit]
context = 256_000

[capabilities]
reasoning = { supported = true, toggle = true, budget = { min = 1_024 } }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.1555
cache = { read = 0.0155, write = 0.2332 }

[cost.text.output]
price = 0.7773
