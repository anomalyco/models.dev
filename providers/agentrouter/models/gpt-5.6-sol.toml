# Catalog and endpoint support: https://agentrouter.org/api/pricing
# AgentRouter publishes relative token ratios, not USD prices, so cost is intentionally omitted.
schema = 2
base_model = "openai/gpt-5.6-sol"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[api.responses]
base_url = "https://agentrouter.org/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }
