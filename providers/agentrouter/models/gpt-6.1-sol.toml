# Catalog and endpoint support: https://agentrouter.org/api/pricing
# AgentRouter publishes relative token ratios, not USD prices, so cost is intentionally omitted.
# Effort: reasoning_effort = low|medium|high|xhigh|max, as on openai/gpt-6.1-sol and this host's gpt-5.6-sol.
schema = 2
base_model = "openai/gpt-6.1-sol"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[api.responses]
base_url = "https://agentrouter.org/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }
