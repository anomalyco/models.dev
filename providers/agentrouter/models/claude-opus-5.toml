# Catalog and endpoint support: https://agentrouter.org/api/pricing
# AgentRouter publishes relative token ratios, not USD prices, so cost is intentionally omitted.
schema = 2
base_model = "anthropic/claude-opus-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[api.messages]
base_url = "https://agentrouter.org/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }
