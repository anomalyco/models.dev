# Modalities: the router catalog lists ["text","image"]; exact types are the lab's (thinkingmachines/inkling).
schema = 2
base_model = "thinkingmachines/inkling"
description = "Multimodal model for analyzing text, images, documents, and rich media"

[modalities]
input = ["text", "image/png", "image/jpeg"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
effort_updates = false

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 1

[cost.text.output]
price = 4.05
