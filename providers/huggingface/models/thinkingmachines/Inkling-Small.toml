# Modalities: the router catalog lists ["text","image"]; exact types are the lab's (thinkingmachines/inkling-small).
schema = 2
base_model = "thinkingmachines/inkling-small"
description = "Efficient model for low-latency assistance, extraction, and routine automation"

[modalities]
input = ["text", "image/png", "image/jpeg"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
effort_updates = false

[limit]
context = 524_288

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.5

[cost.text.output]
price = 1.2
