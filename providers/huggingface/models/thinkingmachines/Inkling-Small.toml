# Output limit: capped at the 524,288 context; no host cap is documented and the 1,048,576 from the base model or host listing is larger.
# Modalities: the router catalog lists ["text","image"]; exact types are the lab's (thinkingmachines/inkling-small).
# max_tokens_field: the router's Chat Completion API documents max_tokens and not max_completion_tokens (https://huggingface.co/docs/inference-providers/tasks/chat-completion, accessed 2026-10-24)
# Reasoning field: reasoning_content, the field Inkling's chat template reads back (https://huggingface.co/thinkingmachines/Inkling-Small). The router's only upstream for this model is Deep Infra, which reads it back (live 2026-11-23 through OpenRouter's Deep Infra route).
# Price and context: synced from https://router.huggingface.co/v1/models (cheapest live provider's price, largest live context).
schema = 2
base_model = "thinkingmachines/inkling-small"
description = "Efficient model for low-latency assistance, extraction, and routine automation"

[modalities]
input = ["text", "image/png", "image/jpeg"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }

[limit]
context = 524_288
output = 524_288

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content", max_tokens_field = "max_tokens" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.45

[cost.text.output]
price = 1.2
