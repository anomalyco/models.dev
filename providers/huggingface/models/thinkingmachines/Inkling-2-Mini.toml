# Sources (accessed 2026-11-24):
# - https://router.huggingface.co/v1/models (thinkingmachines/Inkling-2-Mini: tools and structured output supported, input text + image)
# - https://huggingface.co/docs/inference-providers/tasks/chat-completion
# Reasoning: reasoning_effort = none|minimal|low|medium|high|max, copied from this host's Inkling 2 Small entry and the Prime and OpenRouter
#   Inkling 2 Mini peers. None turns reasoning off, so no toggle.
# Modalities: the router catalog lists ["text","image"]; exact types are the lab's (thinkingmachines/inkling-2-mini).
# max_tokens_field: the router's Chat Completion API documents max_tokens and not max_completion_tokens (https://huggingface.co/docs/inference-providers/tasks/chat-completion, accessed 2026-10-24)
# Reasoning field: reasoning_content, the field Inkling's chat template reads back, as on this host's Inkling 2 Small entry.
# Price and context: synced from https://router.huggingface.co/v1/models (cheapest live provider's price, largest live context).
schema = 2
base_model = "thinkingmachines/inkling-2-mini"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "max"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content", max_tokens_field = "max_tokens" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.06

[cost.text.output]
price = 0.24
