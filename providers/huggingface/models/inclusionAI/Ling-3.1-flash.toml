# Price and context: https://router.huggingface.co/v1/models (2026-11-24), highest-throughput live provider (novita).
# Toggle: reasoning.enabled = true|false (the router's OpenAI-compatible reasoning object, live-tested on this host's
#   MiMo-V2.5). inclusionAI's own API has an on/off switch only (providers/bailing/models/Ling-3.1-flash.toml).
schema = 2
base_model = "inclusionai/ling-3.1-flash"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true }

[limit]
context = 1_000_000

[api.chat-completions]
compatibility = { max_tokens_field = "max_tokens" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.3

[cost.text.output]
price = 0.9
