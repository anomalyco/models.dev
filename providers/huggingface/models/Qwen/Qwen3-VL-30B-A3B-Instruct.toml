# Modalities: the router catalog lists ["text","image"]; exact types are the lab's (alibaba/qwen3-vl-30b-a3b-instruct).
schema = 2
base_model = "alibaba/qwen3-vl-30b-a3b-instruct"
description = "Qwen vision-language model for visual reasoning, documents, and agent tasks"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
structured_output = true
effort_updates = false

[limit]
context = 131_072

[cost.text.input]
price = 0.2

[cost.text.output]
price = 0.7
