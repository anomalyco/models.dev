# Price and context: https://router.huggingface.co/v1/models (2026-11-24), highest-throughput live provider (nscale).
# Effort: reasoning_effort = low|medium|xhigh, as on AMD, Vultr and this host's other Qwen3.8 files.
schema = 2
base_model = "alibaba/qwen3.8-flash-next"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "xhigh"] }
structured_output = true

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { max_tokens_field = "max_tokens" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.15

[cost.text.output]
price = 0.47
