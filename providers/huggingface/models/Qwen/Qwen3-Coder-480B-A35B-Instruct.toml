# Lab identity: https://huggingface.co/Qwen/Qwen3-Coder-480B-A35B-Instruct
# max_tokens_field: the router's Chat Completion API documents max_tokens and not max_completion_tokens (https://huggingface.co/docs/inference-providers/tasks/chat-completion, accessed 2026-10-24)
# Price and context: https://router.huggingface.co/v1/models (2026-11-24), highest-throughput live provider (venice): $0.35 input / $1.5 output per MTok, context 256,000.
schema = 2
base_model = "alibaba/qwen3-coder-480b-a35b-instruct"
name = "Qwen3-Coder-480B-A35B-Instruct"
description = "Qwen coding model for software agents, repository edits, and code reasoning"

[capabilities]
tools = { supported = true }

[limit]
context = 256_000

[api.chat-completions]
compatibility = { max_tokens_field = "max_tokens" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.35

[cost.text.output]
price = 1.5
