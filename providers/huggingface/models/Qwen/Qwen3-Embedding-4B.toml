# Embedding model, typed as the lab does (https://huggingface.co/Qwen/Qwen3-Embedding-4B): embedding output, no generative output limit.
schema = 2
type = "embedding"
name = "Qwen 3 Embedding 4B"
description = "Embedding model for semantic search, retrieval, clustering, and ranking pipelines"
family = "qwen"
open_weights = true
knowledge = "2024-12"
release_date = "2025-01-01"

[modalities]
input = ["text"]
output = ["embedding"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false

[limit]
context = 32_000
output = 0

[cost.text.input]
price = 0.01

[cost.text.output]
price = 0
