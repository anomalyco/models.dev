# Effort: reasoning_effort = none|high; high is the default.
# https://huggingface.co/tencent/Hy4-preview#quickstart
schema = 2
base_model = "tencent/hy4-preview"
description = "Tencent Hy reasoning model for coding, instruction following, and agent tasks"

[capabilities]
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = true

[limit]
context = 1_000_000

[cost.text.input]
price = 0.834

[cost.text.output]
price = 2.501
