# Modalities: the router catalog lists ["text","image"]; exact types are the lab's (minimax/MiniMax-M3).
# max_tokens_field: the router's Chat Completion API documents max_tokens and not max_completion_tokens (https://huggingface.co/docs/inference-providers/tasks/chat-completion, accessed 2026-10-24)
# Price and context: https://router.huggingface.co/v1/models (2026-11-24), highest-throughput live provider (coreweave): $0.23 input / $0.96 output per MTok, context 262,144.
# Output: capped at the served context (the lab's output is larger).
schema = 2
base_model = "minimax/MiniMax-M3"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
structured_output = true

[limit]
context = 262_144
output = 262_144

[api.chat-completions]
compatibility = { max_tokens_field = "max_tokens" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.23

[cost.text.output]
price = 0.96
