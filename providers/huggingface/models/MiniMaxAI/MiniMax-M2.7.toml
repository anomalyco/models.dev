# Lab identity: https://huggingface.co/MiniMaxAI/MiniMax-M2.7
schema = 2
base_model = "minimax/MiniMax-M2.7"
description = "MiniMax model for chat, coding, office work, and agentic tasks"

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.3
cache = { read = 0.06 }

[cost.text.output]
price = 1.2
