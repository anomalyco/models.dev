# HF router chat completions (POST https://router.huggingface.co/v1/chat/completions)
# model = "XiaomiMiMo/MiMo-V2.5-Pro" (DeepInfra-backed). Same control surface as MiMo-V2.5.
#
# Toggle (reasoning on/off for the same model id):
#   reasoning = { "enabled": true }   → on
#   reasoning = { "enabled": false }  → off (no reasoning_content)
#
# Effort (optional depth control; separate from toggle):
#   reasoning_effort = "none" | "low" | "medium" | "high" | "xhigh"
#   "none" also disables reasoning (equivalent to enabled=false)
#
# Not supported on this route: Xiaomi-native thinking.type
# Listed as effort with "none" and no separate toggle, since "none" turns reasoning off.
# max_tokens_field: the router's Chat Completion API documents max_tokens and not max_completion_tokens (https://huggingface.co/docs/inference-providers/tasks/chat-completion, accessed 2026-10-24)
schema = 2
base_model = "xiaomi/mimo-v2.5-pro"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true

[api.chat-completions]
compatibility = { max_tokens_field = "max_tokens" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 1

[cost.text.output]
price = 3
