# Created by the Hugging Face sync.
# Price and context: synced from https://router.huggingface.co/v1/models (cheapest live provider's price, largest live context).
# Modalities: the router catalog (https://router.huggingface.co/v1/models, 2026-11-26) lists input_modalities ["text"] and output ["text"], so the lab's image, audio and video input is left out on this host.
# Reasoning controls copied from Xiaomi's own provider file, providers/xiaomi/models/mimo-v2.6-flash.toml: a toggle,
#   on by default (thinking.type = enabled|disabled, https://mimo.mi.com/static/docs/api/chat/openai-api.md).
#   The router serves this checkpoint, the weights of xiaomi/mimo-v2.6-flash (https://huggingface.co/XiaomiMiMo/MiMo-V2.6-Flash-RL),
#   through third-party inference providers; the on/off control was not tested live on the router.
schema = 2
base_model = "xiaomi/mimo-v2.6-flash"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, default = { type = "toggle", value = true }, toggle = true }
structured_output = true

[api.chat-completions]
compatibility = { max_tokens_field = "max_tokens" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.14

[cost.text.output]
price = 0.28
