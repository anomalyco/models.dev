# Price and context: synced from https://router.huggingface.co/v1/models (cheapest live provider's price, largest live context).
# Modalities: the router catalog lists input_modalities ["text"] and output ["text"], so the lab's image, audio and video
#   input is left out on this host.
# Reasoning controls copied from this host's previous MiMo models, providers/huggingface/models/XiaomiMiMo/MiMo-V2.6-Flash-RL.toml
#   (and MiMo-V2.5.toml / MiMo-V2.5-Pro.toml, live-tested on the router, POST https://router.huggingface.co/v1/chat/completions):
#   reasoning_effort = "none" | "low" | "medium" | "high" | "xhigh" ("none" turns reasoning off, as does
#   reasoning = { "enabled": false }), so effort lists "none" and there is no separate toggle. Not re-probed on this ID
#   (no Hugging Face token).
schema = 2
base_model = "xiaomi/mimo-v2.6-flash-mopd"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true

[api.chat-completions]
compatibility = { max_tokens_field = "max_tokens" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.5

[cost.text.output]
price = 1
