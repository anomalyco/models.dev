# Price and context: https://router.huggingface.co/v1/models (2026-11-24), highest-throughput live provider (fireworks-ai).
# Toggle: reasoning.enabled = true|false (the router's OpenAI-compatible reasoning object, live-tested on this host's
#   MiMo-V2.5). NVIDIA's own API has an on/off switch only (providers/nvidia/models/nvidia/nemotron-3.5-lightning-30b-a3b.toml).
schema = 2
base_model = "nvidia/nemotron-3.5-lightning"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true }
structured_output = true

[api.chat-completions]
compatibility = { max_tokens_field = "max_tokens" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.05

[cost.text.output]
price = 0.2
