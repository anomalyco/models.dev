# Price and context: https://router.huggingface.co/v1/models (2026-11-24), highest-throughput live provider (deepinfra).
# Effort: reasoning_effort = none|low|medium, as on OpenRouter, Kilo and Kenari. none turns reasoning off, so no toggle.
schema = 2
base_model = "nvidia/nemotron-3-super-120b-a12b"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium"] }
structured_output = true

[api.chat-completions]
compatibility = { max_tokens_field = "max_tokens" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.075

[cost.text.output]
price = 0.4
