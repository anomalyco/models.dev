# Price and context: synced from https://router.huggingface.co/v1/models (cheapest live provider's price, largest live context).
# Effort: reasoning_effort = none|medium|high, as on NVIDIA's own API
#   (providers/nvidia/models/nvidia/nemotron-3-ultra-550b-a55b.toml). none turns reasoning off, so no toggle.
schema = 2
base_model = "nvidia/nemotron-3-ultra-550b-a55b"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "medium", "high"] }
structured_output = true

[limit]
context = 262_144

[api.chat-completions]
compatibility = { max_tokens_field = "max_tokens" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.5

[cost.text.output]
price = 2.15
