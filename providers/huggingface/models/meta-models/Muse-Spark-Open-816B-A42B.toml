# Price and context: https://router.huggingface.co/v1/models (2026-11-24), highest-throughput live provider (baseten).
# Effort: reasoning_effort = low|medium|high|xhigh, as on Fireworks (one of the router's providers,
#   providers/fireworks-ai/models/accounts/fireworks/models/muse-spark-open.toml) and OpenRouter.
schema = 2
base_model = "meta/muse-spark-open"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true

[api.chat-completions]
compatibility = { max_tokens_field = "max_tokens" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 1.25

[cost.text.output]
price = 4.25
