# Price and context: synced from https://router.huggingface.co/v1/models (cheapest live provider's price, largest live context).
# Effort: reasoning_effort = none|low|high, as on OpenRouter and DeepInfra (via Eden AI), the router's fastest provider here.
#   none turns reasoning off, so no toggle.
schema = 2
base_model = "ibm/granite-4.2-8b"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "high"] }
structured_output = true

[api.chat-completions]
compatibility = { max_tokens_field = "max_tokens" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.06

[cost.text.output]
price = 0.15
