# Lab identity: https://huggingface.co/zai-org/GLM-4.7-Flash
# max_tokens_field: the router's Chat Completion API documents max_tokens and not max_completion_tokens (https://huggingface.co/docs/inference-providers/tasks/chat-completion, accessed 2026-10-24)
# Price and context: https://router.huggingface.co/v1/models (2026-11-24), highest-throughput live provider (deepinfra): $0.06 input / $0.4 output per MTok, context 202,752.
schema = 2
base_model = "zhipuai/glm-4.7-flash"
description = "Efficient GLM model for fast reasoning, coding, and agent workflows"

[capabilities]
tools = { supported = true }
reasoning = { supported = true }

[limit]
context = 202_752
output = 128_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content", max_tokens_field = "max_tokens" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.06

[cost.text.output]
price = 0.4
