# Effort: reasoning_effort = none|low|high|xhigh|max; none disables thinking.
# https://recipes.vllm.ai/deepseek-ai/DeepSeek-V4.1-Flash (accessed 2026-09-10)
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"
description = "Fast DeepSeek model for efficient chat, coding help, and agent loops"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "xhigh", "max"] }
structured_output = true

[limit]
context = 1_048_576

[cost.text.input]
price = 0.3

[cost.text.output]
price = 1.2
