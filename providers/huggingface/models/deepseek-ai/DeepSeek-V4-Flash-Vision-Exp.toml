# HF relay: reasoning_effort = low|high|max, matching the native model and relay peers.
# HF documents no shared thinking toggle or numeric reasoning budget.
# https://huggingface.co/docs/inference-providers/en/tasks/chat-completion (accessed 2026-09-03)
# https://api-docs.deepseek.com/guides/thinking_mode (accessed 2026-09-03)
schema = 2
base_model = "deepseek/deepseek-v4-flash-vision-exp"
description = "Fast DeepSeek model for efficient chat, coding help, and agent loops"
open_weights = true

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
context = 1_048_576

[cost.text.input]
price = 0.44

[cost.text.output]
price = 1.32
