# HF routes this model only to Novita (checked 2026-10-19).
# Effort: reasoning_effort = low|high|max, matching Novita and native DeepSeek Flash.
# HF documents reasoning_effort but no shared thinking toggle or reasoning budget.
# https://router.huggingface.co/v1/models
# https://huggingface.co/docs/inference-providers/en/tasks/chat-completion (accessed 2026-10-19)
# https://api-docs.deepseek.com/guides/thinking_mode/
# max_tokens_field: the router's Chat Completion API documents max_tokens and not max_completion_tokens (https://huggingface.co/docs/inference-providers/tasks/chat-completion, accessed 2026-10-24)
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"
description = "Fast DeepSeek model for efficient chat, coding help, and agent loops"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { max_tokens_field = "max_tokens" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.3

[cost.text.output]
price = 1.2
