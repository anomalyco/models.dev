# Modalities: the router catalog lists ["text","image"]; exact types are the lab's (moonshotai/kimi-k2.7-code).
schema = 2
base_model = "moonshotai/kimi-k2.7-code"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
structured_output = true
effort_updates = false

[cost.text.input]
price = 0.95

[cost.text.output]
price = 4
