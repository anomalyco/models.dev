# HF router chat completions (POST https://router.huggingface.co/v1/chat/completions)
# model = "moonshotai/Kimi-K3" (Together-backed).
# Always-on reasoning; effort via top-level reasoning_effort = "low"|"high"|"max" (default max).
# No thinking toggle — K3 always returns reasoning_content.
# https://huggingface.co/moonshotai/Kimi-K3 (accessed 2026-07-27)
# https://platform.kimi.ai/docs/guide/use-reasoning-effort
# Modalities: the router catalog lists ["text","image"]; exact types are the lab's (moonshotai/kimi-k3).
schema = 2
base_model = "moonshotai/kimi-k3"
description = "Kimi multimodal agent model for visual understanding, coding, and planning"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
effort_updates = false

[limit]
context = 1_000_000

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 3

[cost.text.output]
price = 15
