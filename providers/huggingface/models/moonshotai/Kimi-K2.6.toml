# Lab identity: https://huggingface.co/moonshotai/Kimi-K2.6
# max_tokens_field: the router's Chat Completion API documents max_tokens and not max_completion_tokens (https://huggingface.co/docs/inference-providers/tasks/chat-completion, accessed 2026-10-24)
# Modalities: the router lists ["text","image"] input (https://router.huggingface.co/v1/models, 2026-11-24), so video is left out; image types are the lab's.
schema = 2
base_model = "moonshotai/kimi-k2.6"
name = "Kimi-K2.6"
description = "Kimi multimodal agent model for visual understanding, coding, and planning"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content", max_tokens_field = "max_tokens" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.95
cache = { read = 0.16 }

[cost.text.output]
price = 4
