# Price and context: synced from https://router.huggingface.co/v1/models (cheapest live provider's price, largest live context).
# Effort: reasoning_effort = low|medium|high|xhigh|max, as on OpenRouter, Vercel and Cloudflare AI Gateway.
schema = 2
base_model = "reflection/beam-1.0-501b-a23b"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[api.chat-completions]
compatibility = { max_tokens_field = "max_tokens" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 0.25

[cost.text.output]
price = 1
