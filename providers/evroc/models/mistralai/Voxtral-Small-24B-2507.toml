# Type: listed under Transcription on https://evroc.com/ai-services/think-models (accessed 2026-10-21).
# Price: 0.0023 per audio minute, kept from the previous file; evroc publishes no price page, so it is unsourced.
# The old v1 output price (0.0023) and output_audio (2.3) had no unit meaning for a transcription model and were dropped.
# v1 has no per-minute price, so v1 shows no cost. The host lists no audio formats, so modalities stay generic.
schema = 2
type = "transcription"
name = "Voxtral Small 24B"
description = "Efficient Mistral model for fast chat, extraction, and production assistants"
family = "voxtral"
open_weights = true
release_date = "2025-03-01"

[modalities]
input = ["audio", "text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }

[limit]
context = 32_000
output = 32_000

[cost.audio.input]
unit = "minute"
price = 0.0023
