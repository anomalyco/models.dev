# Reasoning HTTP format (accessed 2026-06-25):
# Coding Plan exact-string allowlist model. Hybrid thinking is on by default;
# top-level `enable_thinking`: true|false toggles it. The plan docs do not state
# a numeric budget bound or a plan-specific effort control.
# Sources:
# https://help.aliyun.com/zh/model-studio/coding-plan
# https://help.aliyun.com/zh/model-studio/deep-thinking
# Mid-conversation: tools are a request-level parameter with no add/remove mechanism (tools.updates = false); not probed live (no plan key), so system_updates is left unset. Chat API: https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions.
schema = 2
base_model = "alibaba/qwen3.7-plus"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true }

[api.chat-completions]

[api.messages]
base_url = "https://coding.dashscope.aliyuncs.com/apps/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/alibaba/messages" }

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
