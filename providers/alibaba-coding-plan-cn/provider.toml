name = "Alibaba Coding Plan (China)"
env = ["ALIBABA_CODING_PLAN_API_KEY"]
npm = "@ai-sdk/openai-compatible"
opencodeai = "@opencode/ai/providers/alibaba/chat"
# Reasoning HTTP format (accessed 2026-06-25):
# OpenAI plan base https://coding.dashscope.aliyuncs.com/v1 uses POST
# /chat/completions with top-level `enable_thinking`: true or false.
# Anthropic plan base https://coding.dashscope.aliyuncs.com/apps/anthropic uses
# POST /v1/messages with `thinking.type`: enabled or disabled and optional
# integer `thinking.budget_tokens`. No plan-specific effort field is documented.
# Sources:
# https://help.aliyun.com/zh/model-studio/coding-plan
# https://help.aliyun.com/zh/model-studio/deep-thinking
# https://www.alibabacloud.com/help/en/model-studio/anthropic-api-messages
# Tools (accessed 2026-10-24): every API accepts tool_choice auto and none (Chat Completions:
# https://www.alibabacloud.com/help/en/model-studio/qwen-function-calling; Anthropic Messages auto|any|none|tool:
# https://www.alibabacloud.com/help/en/model-studio/anthropic-api-messages; Responses auto|none|required:
# https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-responses). Model files set
# choice = ["auto", "none"]: Qwen rejects required on Chat Completions, a named function only works outside
# thinking mode, and Responses has no named choice. none was checked live on glm-5.3, kimi-k2.7-code and
# qwen3.6-plus. No strict flag for function tools is documented. Realtime models don't support tool_choice.
doc = "https://help.aliyun.com/zh/model-studio/coding-plan"
api = "https://coding.dashscope.aliyuncs.com/v1"
