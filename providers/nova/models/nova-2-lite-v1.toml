schema = 2
name = "Nova 2 Lite"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"
family = "nova-lite"
open_weights = false
release_date = "2025-12-01"

[modalities]
input = ["text", "image", "video", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high"] }
temperature = true

[limit]
context = 1_000_000
output = 64_000

[cost.text.input]
price = 0

[cost.text.output]
price = 0
reasoning = 0
