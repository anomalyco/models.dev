# Prices (USD per 1M tokens), limits and effort levels: https://lessstrict.com/v1/models (the host's public catalog API, accessed 2026-11-26).
# API reference: https://lessstrict.com/docs
# Effort: reasoning_effort = low|high|max on Chat Completions. These are the effort_levels the catalog returns for this id, read per id (default_effort = low); the gateway resolves reasoning_effort against this per-model list.
# Reasoning comes back as reasoning_content. The host offers no cached-input rate for this id (the catalog prices cached input the same as input), so no cache is listed.
# [limit] is exactly what the host's catalog returns for this API id (context_length, max_output_tokens): the caps the host has set.
schema = 2
base_model = "alibaba/qwen3.8-27b"
name = "Qwen3.8 27B LessStrict"
description = "LessStrict's less restricted variant of Qwen3.8 27B, served by LessStrict over Chat Completions."

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"], default = { type = "effort", value = "low" } }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[limit]
context = 262_000
output = 66_000

[cost.text.input]
price = 0.5

[cost.text.output]
price = 3.5
