# `cost` is a fixed rate. This SKU never escalates above its own tier, so every
# request bills exactly the rate below.
# Source: NeoSmith's first-party rate card — the per-tier table shown to every
# customer on their billing dashboard. There is no public pricing page yet; the
# `doc` URL in provider.toml is product documentation, not a price list.
schema = 2
name = "NeoSmith Basic"
description = "Cost-capped tier. Intelligent routing with a Claude Sonnet ceiling — Opus is never invoked."
open_weights = false
release_date = "2026-04-26"
last_updated = "2026-08-03"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
structured_output = false
temperature = true

[limit]
context = 1_000_000
output = 128_000

[cost.text.input]
price = 1.17
cache = { read = 0.22, write = 0 }

[cost.text.output]
price = 4.37
