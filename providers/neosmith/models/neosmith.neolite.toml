# `cost` is a fixed rate. This SKU never escalates above its own tier, so every
# request bills exactly the rate below.
# Source: NeoSmith's first-party rate card — the per-tier table shown to every
# customer on their billing dashboard. There is no public pricing page yet; the
# `doc` URL in provider.toml is product documentation, not a price list.
schema = 2
name = "NeoSmith NeoLite"
description = "Sealed single-model budget tier. 512K context, text and images, tool use, and no escalation of any kind."
open_weights = false
release_date = "2026-06-20"
last_updated = "2026-08-03"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
structured_output = false
temperature = true

[limit]
context = 512_000
output = 64_000

[cost.text.input]
price = 0.6
cache = { read = 0.08, write = 0 }

[cost.text.output]
price = 2.4
