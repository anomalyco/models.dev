# Toggle: send `reasoning_effort` (any value) to turn reasoning on, omit it to
# turn it off. Measured on this host, 2026-09-18: with the field absent,
# reasoning_content was empty on every run across all three DeepSeek V4 models;
# with it present, reasoning ran. The value does not grade — low/medium/high
# produced no monotonic difference — so this is an on/off control and not an
# effort scale.
base_model = "deepseek/deepseek-v4-pro"
reasoning_options = [{ type = "toggle" }]

[interleaved]
field = "reasoning_content"

[cost]
input = 1.274
output = 2.548

[limit]
context = 163_840
output = 32_768
