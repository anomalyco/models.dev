# Relay of the Zhipu GLM-5.3-Flash endpoint: reasoning_effort and reasoning_content pass through
# unchanged; reasoning tokens billed at the output rate.
# Effort: reasoning_effort = low|high|max (default max; always thinks upstream, no off toggle)
# Cost (retrieved 2026-11-13): https://proxystacks.com/public/model-rates ,
# https://proxystacks.com/en/pricing (input $0.0975, output $0.33, cache read $0.0195 per MTok).
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[capabilities]
tools = { supported = true, choice = ["auto"] }
reasoning = { supported = true, default = { type = "effort", value = "max" }, effort = ["low", "high", "max"] }
structured_output = true
top_k = false
stream_usage = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content", max_tokens_field = "max_tokens" }

[cost.text.input]
price = 0.0975
cache = { read = 0.0195 }

[cost.text.output]
price = 0.33
reasoning = 0.33
