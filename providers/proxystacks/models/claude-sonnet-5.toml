# ProxyStacks Relay route `claude-sonnet-5` (Claude Sonnet 5 on POST /v1/chat/completions at
# 50% off official USD list pricing; see https://proxystacks.com/en/models/claude-sonnet-5).
# Effort: reasoning_effort = none|low|medium|high|xhigh|max on POST /v1/chat/completions (off is
# effort none, so no separate toggle; matches same-surface Chat Completions peers such as
# providers/llmgateway/models/claude-sonnet-5.toml).
# Cache: explicit cache_control breakpoints (5m and 1h TTLs, up to 4 breakpoints, 1,024-token
# minimum) forwarded unchanged; reasoning tokens are billed at the output rate.
# Cost (retrieved 2026-11-27): https://proxystacks.com/public/model-rates ,
# https://proxystacks.com/api/public/model-rates , https://proxystacks.com/en/pricing
# (input $1.00, output $5.00, cache read $0.10, cache write 5m $1.25 / 1h $2.00 per MTok).
# Tools: choice = auto|none|required|tool (matches providers/anthropic/models/claude-sonnet-5.toml).
schema = 2
base_model = "anthropic/claude-sonnet-5"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, min_tokens = 1_024 } }

[cost.text.input]
price = 1
cache = { read = 0.1, write = { "5m" = 1.25, "1h" = 2 } }

[cost.text.output]
price = 5
reasoning = 5
