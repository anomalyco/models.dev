# Relay of the official DeepSeek API: reasoning controls and reasoning_content pass through
# unchanged; reasoning tokens billed at the output rate. The current Flash build served under
# this id is DeepSeek-V4.1-Flash-1017; limits match the official GET /models values.
# Toggle: thinking.type = enabled|disabled (default enabled)
# Effort: reasoning_effort = low|high|max (default high; `none` also disables thinking upstream)
# max_tokens: the upstream accepts only the legacy `max_tokens` output-cap field.
# Cost (retrieved 2026-11-13): https://proxystacks.com/public/model-rates ,
# https://proxystacks.com/en/pricing . Rate card per MTok (input/cache read/output):
# peak $0.18/$0.0039/$0.74, off-peak $0.0895/$0.002/$0.37 — the card's peak rates are not
# exact doubles, so both tiers are written as explicit prices. Base prices are the peak
# rate; the overrides give the off-peak rate, billed outside Mon-Fri 09:00-11:59 and
# 14:00-17:59 Asia/Shanghai (= 01:00-03:59 and 06:00-09:59 UTC, the same windows as the
# official DeepSeek peak).
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, default = { type = "effort", value = "high" }, toggle = true, effort = ["low", "high", "max"] }
structured_output = true
top_k = false
stream_usage = true
cache = { implicit = true }

[limit]
context = 1_048_576
output = 393_216

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content", max_tokens_field = "max_tokens" }

[cost.text.input]
price = 0.18
cache = { read = 0.0039 }

[[cost.text.input.overrides]]
when = { not = { utc_days = { in = ["mon", "tue", "wed", "thu", "fri"] }, any = [{ all = [{ utc_hours = { gte = "01:00" } }, { utc_hours = { lt = "04:00" } }] }, { all = [{ utc_hours = { gte = "06:00" } }, { utc_hours = { lt = "10:00" } }] }] } }
price = 0.0895
cache = { read = 0.002 }

[cost.text.output]
price = 0.74
reasoning = 0.74

[[cost.text.output.overrides]]
when = { not = { utc_days = { in = ["mon", "tue", "wed", "thu", "fri"] }, any = [{ all = [{ utc_hours = { gte = "01:00" } }, { utc_hours = { lt = "04:00" } }] }, { all = [{ utc_hours = { gte = "06:00" } }, { utc_hours = { lt = "10:00" } }] }] } }
price = 0.37
reasoning = 0.37
