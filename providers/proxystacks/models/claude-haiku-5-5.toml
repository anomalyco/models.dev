# ProxyStacks Relay route `claude-haiku-5-5` (Claude Haiku 5.5 on POST /v1/chat/completions at
# 50% off official USD list pricing; see https://proxystacks.com/en/models/claude-haiku-5-5).
# Effort: reasoning_effort = none|low|medium|high|xhigh|max on POST /v1/chat/completions (default
# medium; off is effort none, so no separate toggle; matches same-surface Chat Completions peers
# such as providers/openrouter/models/anthropic/claude-haiku-5.5.toml).
# Cache: explicit cache_control breakpoints (5m and 1h TTLs, up to 4 breakpoints, 512-token
# minimum) forwarded unchanged; reasoning tokens are billed at the output rate.
# Cost (retrieved 2026-11-27): https://proxystacks.com/public/model-rates ,
# https://proxystacks.com/api/public/model-rates , https://proxystacks.com/en/pricing
# (<=100K context: input $0.05, output $0.25, cache read $0.005, cache write 5m $0.0625 / 1h $0.10
# per MTok; >100K context: input $0.25, output $1.25, cache read $0.025, cache write 5m $0.3125 /
# 1h $0.50 per MTok).
# Tools: choice = auto|none|required|tool (matches providers/anthropic/models/claude-haiku-5-5.toml).
schema = 2
base_model = "anthropic/claude-haiku-5-5"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, default = { type = "effort", value = "medium" }, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
stream_usage = true
cache = { explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, min_tokens = 512 } }

[cost.text.input]
price = 0.05
cache = { read = 0.005, write = { "5m" = 0.0625, "1h" = 0.1 } }

[[cost.text.input.overrides]]
when = { context = { gt = 100_000 } }
price = 0.25
cache = { read = 0.025, write = { "5m" = 0.3125, "1h" = 0.5 } }

[cost.text.output]
price = 0.25
reasoning = 0.25

[[cost.text.output.overrides]]
when = { context = { gt = 100_000 } }
price = 1.25
reasoning = 1.25
