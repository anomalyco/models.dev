# ProxyStacks Relay route `funsion-opus-5-5` (published alias forwarding to Claude Opus 5.5 on the
# upstream OpenAI-compatible Chat Completions endpoint at 50% off official USD list pricing; see
# https://proxystacks.com/en/models/funsion-opus-5-5).
# Effort: reasoning_effort = low|medium|high|xhigh|max (default medium; always-on adaptive
# thinking, no off toggle; matches providers/anthropic/models/claude-opus-5-5.toml and same-surface
# Chat Completions peers).
# Cache: explicit cache_control breakpoints (5m and 1h TTLs, up to 4 breakpoints, 512-token
# minimum) forwarded unchanged; reasoning tokens are billed at the output rate.
# Cost (retrieved 2026-11-25): https://proxystacks.com/public/model-rates ,
# https://proxystacks.com/api/public/model-rates , https://proxystacks.com/en/pricing
# (input $2.00, output $10.00, cache read $0.10, cache write 5m $2.50 / 1h $4.00 per MTok).
# Tools: choice = auto|none inherited from models/anthropic/claude-opus-5-5.toml (forced tool use rejected).
schema = 2
base_model = "anthropic/claude-opus-5-5"
name = "Funsion Opus 5.5"

[capabilities]
# tools = { supported = true, choice = ["auto", "none"] } inherited from models/anthropic/claude-opus-5-5.toml (forced tool use rejected).
reasoning = { supported = true, default = { type = "effort", value = "medium" }, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
stream_usage = true
cache = { explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, min_tokens = 512 } }

[cost.text.input]
price = 2
cache = { read = 0.1, write = { "5m" = 2.5, "1h" = 4 } }

[cost.text.output]
price = 10
reasoning = 10
