# Relay of the Moonshot Kimi K3.1 Pro endpoint: reasoning_effort and reasoning_content pass
# through unchanged; reasoning tokens billed at the output rate.
# Effort: reasoning_effort = low|high|max (default max; always thinks upstream, no off toggle)
# Cost (retrieved 2026-11-13): https://proxystacks.com/public/model-rates ,
# https://proxystacks.com/en/pricing (input $1.60, output $8.00, cache read $0.16,
# cache write $1.60 per MTok; 5m and 1h cache writes priced the same).
schema = 2
base_model = "moonshotai/kimi-k3.1-pro"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required"] }
reasoning = { supported = true, default = { type = "effort", value = "max" }, effort = ["low", "high", "max"] }
structured_output = true
stream_usage = true
cache = { implicit = { ttl = ["5m", "1h"] } }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.6
cache = { read = 0.16, write = { "5m" = 1.6, "1h" = 1.6 } }

[cost.text.output]
price = 8
reasoning = 8
