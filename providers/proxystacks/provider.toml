# Relay provider: OpenAI/Anthropic-compatible multi-model gateway (prepaid USD balance, per-token
# metering). Reasoning controls (reasoning_effort, thinking.type, thinking_budget),
# prompt_cache_options, cache_control, and reasoning_content pass through to upstream endpoints
# unchanged on POST /v1/chat/completions.
# Hand-authored (thin endpoint per AGENTS.md): /public/model-rates and /api/public/model-rates
# publish per-token USD prices, context tiers, and off-peak windows only, with no model
# capabilities, modalities, output limits, reasoning controls, or canonical lab IDs.
# Sources (accessed 2026-11-25):
#   https://proxystacks.com/en/docs/opencode       (documented base URL and env var)
#   https://proxystacks.com/en/pricing             (human-readable USD rate card)
#   https://proxystacks.com/public/model-rates     (live rate card JSON)
#   https://proxystacks.com/api/public/model-rates (live backend rate card API)
name = "ProxyStacks Relay"
env = ["RELAY_API_KEY"]
npm = "@ai-sdk/openai-compatible"
opencodeai = "@opencode/ai/providers/openai-compatible"
doc = "https://proxystacks.com/en/docs/opencode"
api = "https://proxystacks.com/v1"
