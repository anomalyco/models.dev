<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Tileward" fill="currentColor">
  <title>Tileward</title>
  <!-- Monochrome derivative of Tileward's own mark (tileward-webapp/public/logo.svg): same
       3/4/2 tessellation geometry, single currentColor fill instead of the per-tile brand hues. -->
  <g transform="translate(1,14)">
    <rect x="26" y="0"  width="20" height="20" rx="5"/>
    <rect x="52" y="0"  width="20" height="20" rx="5"/>
    <rect x="78" y="0"  width="20" height="20" rx="5"/>
    <rect x="0"  y="26" width="20" height="20" rx="5"/>
    <rect x="26" y="26" width="20" height="20" rx="5"/>
    <rect x="52" y="26" width="20" height="20" rx="5"/>
    <rect x="78" y="26" width="20" height="20" rx="5"/>
    <rect x="26" y="52" width="20" height="20" rx="5"/>
    <rect x="52" y="52" width="20" height="20" rx="5"/>
  </g>
</svg>
