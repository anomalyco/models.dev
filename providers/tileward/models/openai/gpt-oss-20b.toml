# Verified against GET https://api.tileward.com/v1/models, 2026-09-14. cost is a single blended
# USD/Mtoken rate (Tileward does not currently split input/output pricing), used for both fields.
# limit.context is Tileward's configured serving window, well below the model's native 131,072;
# limit.output is bounded by that same window (no larger figure is published or observed).
# Reasoning: Tileward forwards `reasoning_effort` unmodified to the served model (see fwaa's
# OPENAI_CHAT_FIELDS allowlist); values match gpt-oss's own harmony reasoning_effort levels, same
# as peer hosts of this model.
base_model = "openai/gpt-oss-20b"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high"] }]

[cost]
input = 0.20
output = 0.20

[limit]
context = 8_192
output = 8_192
