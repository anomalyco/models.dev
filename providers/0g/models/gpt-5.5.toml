# Verified on https://router-api.0g.ai/v1 (2026-11-18): chat and a tool call (get_weather), image input.
# Price: GET https://router-api.0g.ai/v1/models pricing_usd (accessed 2026-11-18).
# Reasoning probed 2026-11-18 on Chat Completions: reasoning_effort none|low|medium|high|xhigh accepted, reasoning tokens rise with the level
# (none = 0); minimal and max are rejected upstream (400). chat_template_kwargs and thinking are rejected (400).
# Custom tools probed 2026-11-22 on Chat Completions (text, regex `ZZ[0-9]{3}`, lark): the router rejects every
# non-function tool before routing (400 invalid_tools, "type must be function"), so no freeform is listed.
schema = 2
base_model = "openai/gpt-5.5"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }

[cost.text.input]
price = 5

[cost.text.output]
price = 30
