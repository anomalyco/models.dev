# Price: GET https://router-api.0g.ai/v1/models pricing_usd (accessed 2026-11-24).
# Reasoning probed 2026-11-24 through 0G's staging router (0g-router param-probe --reasoning, 3 runs per request)
# on the rows mainnet serves the model from (anonymous1, anonymous2).
# On @anonymous1 none and minimal give 0 reasoning tokens and higher levels think more (low 137-149, high 794-987).
# @anonymous2 does not pass reasoning_effort upstream: the model does not think there at any level (no error).
# Levels follow Google's own entry.
schema = 2
base_model = "google/gemini-3.1-flash-lite"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }

[cost.text.input]
price = 0.25

[cost.text.output]
price = 1.5
