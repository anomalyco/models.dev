# Price: GET https://router-api.0g.ai/v1/models pricing_usd (accessed 2026-11-24).
# Reasoning controls: measured 2026-11-24 by 0g-router's param-probe --reasoning, through 0G's staging router, on every
# row GET /v1/providers lists for the model on staging and on mainnet (mainnet serves the same rows). This is the router's
# `reasoning` block, served on staging's /v1/models and not yet on mainnet's. Toggle, when listed: reasoning_effort = "none"
# turns thinking off on every row; effort levels are the vendor's documented levels that every row accepts and that
# measurably change how much the model thinks. No controls listed: reasoning_effort cannot turn thinking off.
# Budget: extra_body.google.thinking_config.thinking_budget (reasoning tokens). Probed 2026-11-24 through 0G's staging router,
# one request each: on @anonymous1 128 gave 108 reasoning tokens and 4096 gave 3043; @anonymous3 ignores it (and a top-level
# thinking_budget or reasoning.max_tokens): 5787-7899 reasoning tokens whatever the budget. Bounds follow Google's own entry.
# Reasoning block reviewed: 2026-11-24
schema = 2
base_model = "google/gemini-2.5-pro"

[capabilities]
reasoning = { supported = true, budget = { min = 128, max = 32_768 } }

[cost.text.input]
price = 1.25

[cost.text.output]
price = 10
