# Price: GET https://router-api.0g.ai/v1/models pricing_usd (accessed 2026-11-24).
# Reasoning probed 2026-11-24 through 0G's staging router (0g-router param-probe --reasoning, 3 runs per request)
# on the rows mainnet serves the model from (anonymous1, anonymous2).
# On @anonymous1 none and minimal give 0 reasoning tokens and higher levels think more (low 172-364, high 574-575; capped at 600 in this run).
# @anonymous2 does not pass reasoning_effort upstream: it thinks the same at every level, none included (no error).
# Levels follow Google's own entry.
schema = 2
base_model = "google/gemini-3.6-flash"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "medium" }, effort = ["minimal", "low", "medium", "high"] }

[cost.text.input]
price = 1.5

[cost.text.output]
price = 7.5
