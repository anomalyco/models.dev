# Toggle: thinking.type = enabled|disabled
# Price: GET https://router-api.0g.ai/v1/models pricing_usd (accessed 2026-11-24).
# Reasoning probed 2026-11-24 through 0G's staging router (0g-router param-probe --reasoning, 3 runs per request)
# on the rows mainnet serves the model from (aliyun, baidu, tencent).
# thinking.type=disabled gives 0 reasoning tokens on every row; reasoning_effort="none" does not turn thinking off on @baidu
# (50-102 tokens), so effort lists no none. low, high and max are accepted on every row; levels follow DeepSeek's own entry.
schema = 2
base_model = "deepseek/deepseek-v4-flash"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "high" }, toggle = true, effort = ["low", "high", "max"] }

[cost.text.input]
price = 0.528

[cost.text.output]
price = 1.584
