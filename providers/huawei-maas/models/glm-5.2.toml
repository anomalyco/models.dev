# Sources (accessed 2026-11-09):
# - Pricing (CNY per MTok): https://support.huaweicloud.com/price-maas/price-maas-0002.html (updated 2026-11-06)
# - OpenAI-compatible API: https://support.huaweicloud.com/model-call-maas/model-call-021.html
# - Live probe 2026-11-09 on api.modelarts-maas.com: GET /v1/models 200; chat baseline/stream 200;
#   thinking.type=disabled removes reasoning_content (reasoning_tokens 0);
#   reasoning_effort=low accepted with reasoning_content present
# CNY->USD rate: 6.67, 2026-11-09 (market range USD/CNY 6.6648-6.6755 that day)
# List price: CNY 8/-/28 (input/output per MTok, peak 08:00-20:59 Beijing; no cache-hit discount published)
# Off-peak 21:00-07:59 Beijing (13:00-23:59 UTC): CNY 5.6/19.6
# Toggle: thinking.type = enabled|disabled (probed on this host)
# Effort: reasoning_effort = high|max per native GLM-5.2 docs (low|medium map to high); exact-id live
# 2026-11-09: low/high/max all accepted (baseline 200), repeated 3-trial reasoning-token means:
# low ~394, high ~467, max ~704 — noisy overlap, no consistent distinct low; low dropped to match native
# tool_choice "auto" per Huawei docs tool-calling example; other values untested on this host
schema = 2
base_model = "zhipuai/glm-5.2"

[capabilities]
tools = { supported = true, choice = ["auto"] }
reasoning = { supported = true, toggle = true, effort = ["high", "max"] }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.1994

[cost.text.output]
price = 4.1979

# Off-peak 21:00-07:59 Beijing = 13:00-23:59 UTC (CNY 5.6/19.6)
[[cost.multipliers]]
when = { utc_hours = { gte = "13:00" } }
factor = 0.7
