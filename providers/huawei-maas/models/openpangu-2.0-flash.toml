# Sources (accessed 2026-11-09):
# - Pricing (CNY per MTok): https://support.huaweicloud.com/price-maas/price-maas-0002.html (updated 2026-11-06)
# - OpenAI-compatible API: https://support.huaweicloud.com/model-call-maas/model-call-021.html
# - Live probe 2026-11-09 on api.modelarts-maas.com: chat baseline 200, thinking.type=disabled
#   removes reasoning_content (reasoning_tokens 0), reasoning_effort=low accepted with
#   reasoning_content present
# CNY->USD rate: 6.67, 2026-11-09 (market range USD/CNY 6.6648-6.6755 that day)
# List price: CNY 0.8/0.2/1.6 (input/cache-read/output per MTok, flat, no peak/valley, no token tiers)
# Toggle: thinking.type = enabled|disabled (probed on this host)
# Effort: reasoning_effort low|high|max all accepted on this exact id (baseline 200); repeated
# 2026-11-09 3-trial reasoning-token means: low ~265, high ~282, max ~272 — no distinct separation
# between levels on these prompts; levels kept (all accepted) but no distinct-effect claim
# tool_choice "auto" per Huawei docs tool-calling example; other values untested on this host
schema = 2
base_model = "huawei/openpangu-2.0-flash"

[capabilities]
tools = { supported = true, choice = ["auto"] }
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.11994
cache = { read = 0.02999 }

[cost.text.output]
price = 0.23988
