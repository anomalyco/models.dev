# Workhorse default route does not charge per-token pricing (cost = 0).
# API docs: https://aiwork.horse/api-docs/  Pricing: https://aiwork.horse/request/
name = "Default"
description = "Your chosen default model (user controlled)."
release_date = "2026-06-01"
last_updated = "2026-08-01"
attachment = false
reasoning = true
tool_call = true
structured_output = true
temperature = true
open_weights = false

[[reasoning_options]]
type = "toggle" # API: {"chat_template_kwargs": {"enable_thinking": false}}

[interleaved]
field = "reasoning_content"

[limit]
context = 128_000
output = 6_000

[modalities]
input = ["text"]
output = ["text"]

[cost]
input = 0
output = 0
