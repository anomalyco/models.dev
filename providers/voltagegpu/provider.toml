# VoltageGPU serves open models over an OpenAI-compatible Chat Completions API. Every model id ends
# in -TEE: the model runs inside an Intel TDX enclave. Requests pass through the VoltageGPU relay,
# which sees them in clear (TLS ends at the relay).
# Sources (read 2026-11-19): GET https://api.voltagegpu.com/v1/models (no key needed: ids,
# context_length, prices in USD per million tokens, live status) and https://docs.voltagegpu.com/inference.
# POST /v1/chat/completions forwards request fields other than model, messages, stream,
# stream_options and fallback_models to the model unchanged (tools, response_format,
# chat_template_kwargs, ...) and caps max_tokens at the maximum output of the deployment serving
# the id, without an error. GET /v1/models does not publish that maximum today.
# Reasoning controls were tested live on 2026-11-19 on the ten models listed.
# - Toggle (one request per setting): chat_template_kwargs.thinking and
#   chat_template_kwargs.enable_thinking both turned reasoning_content on and off on every model.
#   Each file names one of the two.
# - Effort (two requests per level): chat_template_kwargs.reasoning_effort was accepted at every
#   level tried and turned reasoning on where it is off by default, but no ordering between levels
#   could be measured. Files list the lab's levels where the lab has graded levels, and each header
#   says what was measured. Top-level reasoning_effort was not tested.
# Qwen/Qwen3.5-397B-A17B-TEE is listed by /v1/models but is left out: it was reported saturated at
# each read that day (07:05 to 10:16 UTC) and answered 429 to every test request.
# No cached-input price is published, so none is listed.
# Mid-conversation flags (system_updates, effort_updates, tools.updates) are left out: none is documented.
name = "VoltageGPU"
npm = "@ai-sdk/openai-compatible"
opencodeai = "@opencode/ai/providers/openai-compatible"
env = ["VOLTAGEGPU_API_KEY"]
api = "https://api.voltagegpu.com/v1"
doc = "https://docs.voltagegpu.com/inference"
