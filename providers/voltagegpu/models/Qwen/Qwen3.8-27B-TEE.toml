# Toggle: chat_template_kwargs.enable_thinking = true|false (default on)
# Tested live on POST https://api.voltagegpu.com/v1/chat/completions on 2026-11-19, one request per setting:
#   reasoning_content carries text with true and none with false; with the field omitted it carries text.
# chat_template_kwargs.thinking had the same effect in the same test.
# enable_thinking is the name the chat template reads (https://huggingface.co/Qwen/Qwen3.8-27B).
# The template also reads reasoning_effort (low|medium|xhigh), which was not tested, so no effort level is listed.
# Id, context and prices (USD per million tokens): GET https://api.voltagegpu.com/v1/models, read 2026-11-19.
# Output limit: maximum output of the deployment serving this id; the API caps max_tokens there.
# Input: text and images, no video; image MIME types from the lab file.
schema = 2
base_model = "alibaba/qwen3.8-27b"
name = "Qwen3.8 27B TEE"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
reasoning = { supported = true, default = { type = "toggle", value = true }, toggle = true }
structured_output = true

[limit]
output = 65_536

[cost.text.input]
price = 0.078

[cost.text.output]
price = 2.5
