# Sources (read 2026-10-23): GET https://api.voltagegpu.com/v1/models (id, context_length) and
#   GET https://voltagegpu.com/api/pricing/snapshot (inference prices, USD per million tokens).
# Output limit: the max output length published for the deployment serving this id.
# Toggle: chat_template_kwargs.enable_thinking = true|false
#  chat template: https://huggingface.co/Qwen/Qwen3-32B
schema = 2
base_model = "alibaba/qwen3-32b"
name = "Qwen3 32B TEE"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
context = 40_960
output = 40_960

[cost.text.input]
price = 0.19

[cost.text.output]
price = 0.77
