# Toggle: chat_template_kwargs.thinking = true|false
# Verified live on POST https://api.voltagegpu.com/v1/chat/completions (2026-10-24): reasoning_content present when on, absent when off.
# The host forwards request fields other than model, messages, stream and stream_options unchanged; no effort control authored (reasoning_effort not verified on this route).
# Sources (read 2026-10-23): GET https://api.voltagegpu.com/v1/models (id, context_length) and
#   GET https://voltagegpu.com/api/pricing/snapshot (inference prices, USD per million tokens).
# Output limit: the max output length published for the deployment serving this id.
schema = 2
base_model = "moonshotai/kimi-k3"
name = "Kimi K3 TEE"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
output = 65_535

[cost.text.input]
price = 3.42

[cost.text.output]
price = 17.58
