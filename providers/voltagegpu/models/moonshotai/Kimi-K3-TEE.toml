# Toggle: chat_template_kwargs.thinking = true|false (default on)
# Effort: chat_template_kwargs.reasoning_effort = low|high|max
# Tested live on POST https://api.voltagegpu.com/v1/chat/completions on 2026-11-19.
# Toggle, one request per setting: reasoning_content carries text with true and none with false; with the field
#   omitted it carries text. chat_template_kwargs.enable_thinking had the same effect.
# Effort, two requests per level at max_tokens 1200: every level was accepted (HTTP 200). No ordering between levels
#   could be measured: completion tokens were 366 and 258 for low, 637 and 946 for high, 1164 and 283 for max, 1200
#   and 429 with the field omitted (1200 = cut at the cap). The levels listed are the lab's set; this test does not
#   show a graded effect.
# Top-level reasoning_effort was not tested.
# Sampling: temperature is listed as a request parameter by the deployment serving this id (the lab API fixes it);
#   not tested live.
# Id, context and prices (USD per million tokens): GET https://api.voltagegpu.com/v1/models, read 2026-11-19.
# Output limit: 65,535 is where the VoltageGPU relay caps max_tokens for this id (the maximum output of the deployment
#   serving it). GET /v1/models does not publish that value today. A request with max_tokens 200000 was answered 200
#   on 2026-11-19: the cap is applied without an error.
# Input: text and images, no video; image MIME types from the lab file. A PNG image (data URL) was accepted on
#   2026-11-19; the other image types and video were not tested, so video is not listed.
schema = 2
base_model = "moonshotai/kimi-k3"
name = "Kimi K3 TEE"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, default = { type = "toggle", value = true }, toggle = true, effort = ["low", "high", "max"] }
structured_output = true
temperature = true

[limit]
output = 65_535

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 3.7

[cost.text.output]
price = 19
