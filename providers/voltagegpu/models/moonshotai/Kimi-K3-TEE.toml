# Toggle: chat_template_kwargs.thinking = true|false (default on)
# Tested live on POST https://api.voltagegpu.com/v1/chat/completions on 2026-11-19, one request per setting:
#   reasoning_content carries text with true and none with false; with the field omitted it carries text.
# chat_template_kwargs.enable_thinking had the same effect in the same test.
# Sampling: temperature is a request parameter on this host (the lab API fixes it).
# reasoning_effort was not tested, so no effort level is listed.
# Id, context and prices (USD per million tokens): GET https://api.voltagegpu.com/v1/models, read 2026-11-19.
# Output limit: maximum output of the deployment serving this id; the API caps max_tokens there.
schema = 2
base_model = "moonshotai/kimi-k3"
name = "Kimi K3 TEE"

[capabilities]
reasoning = { supported = true, default = { type = "toggle", value = true }, toggle = true }
structured_output = true
temperature = true

[limit]
output = 65_535

[cost.text.input]
price = 3.7

[cost.text.output]
price = 19
