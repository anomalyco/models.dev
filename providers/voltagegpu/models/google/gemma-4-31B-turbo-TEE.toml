# Toggle: chat_template_kwargs.enable_thinking = true|false (default off)
# Tested live on POST https://api.voltagegpu.com/v1/chat/completions on 2026-11-19.
# Toggle, one request per setting: reasoning_content carries text with true and none with false; with the field
#   omitted it carries none. chat_template_kwargs.thinking had the same effect.
# enable_thinking is the name the chat template reads (https://huggingface.co/nvidia/Gemma-4-31B-IT-NVFP4).
# No effort level is listed. chat_template_kwargs.reasoning_effort (low, medium, high; two requests per level at
#   max_tokens 1200) was accepted (HTTP 200) and turned reasoning on like the toggle; every such reply was cut at the
#   cap, so no ordering between levels was measured. The lab's own API lists a toggle only for this model in this
#   catalog.
# Top-level reasoning_effort was not tested.
# Id, context and prices (USD per million tokens): GET https://api.voltagegpu.com/v1/models, read 2026-11-19.
# Output limit: 65,536 is where the VoltageGPU relay caps max_tokens for this id (the maximum output of the deployment
#   serving it). GET /v1/models does not publish that value today.
# Input: the lab file's image types are inherited. A PNG image (data URL) was accepted on 2026-11-19.
schema = 2
base_model = "google/gemma-4-31b-it"
name = "Gemma 4 31B Turbo TEE"

[capabilities]
reasoning = { supported = true, default = { type = "toggle", value = false }, toggle = true }
structured_output = true

[limit]
context = 131_072
output = 65_536

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.24

[cost.text.output]
price = 0.74
