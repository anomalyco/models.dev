# Toggle: chat_template_kwargs.thinking = true|false (default off)
# Tested live on POST https://api.voltagegpu.com/v1/chat/completions on 2026-11-19.
# Toggle, one request per setting: reasoning_content carries text with true and none with false; with the field
#   omitted it carries none. chat_template_kwargs.enable_thinking had the same effect.
# No effort level is listed. chat_template_kwargs.reasoning_effort (low, high, max; two requests per level at
#   max_tokens 1200) was accepted (HTTP 200) and turned reasoning on like the toggle; every such reply was cut at the
#   cap, so no ordering between levels was measured. No first-party entry for this checkpoint was found in this
#   catalog, and its hosts that take chat_template_kwargs list a toggle only.
# Top-level reasoning_effort was not tested.
# Id, context and prices (USD per million tokens): GET https://api.voltagegpu.com/v1/models, read 2026-11-19.
# Output limit: 65,536 is where the VoltageGPU relay caps max_tokens for this id (the maximum output of the deployment
#   serving it). GET /v1/models does not publish that value today.
schema = 2
base_model = "deepseek/deepseek-v3.2"
name = "DeepSeek V3.2 TEE"

[capabilities]
reasoning = { supported = true, default = { type = "toggle", value = false }, toggle = true }
structured_output = true

[limit]
context = 131_072
output = 65_536

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 2

[cost.text.output]
price = 2
