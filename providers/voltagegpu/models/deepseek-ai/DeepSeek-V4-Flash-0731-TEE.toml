# Sources (read 2026-10-23): GET https://api.voltagegpu.com/v1/models (id, context_length) and
#   GET https://voltagegpu.com/api/pricing/snapshot (inference prices, USD per million tokens).
# Output limit: the max output length published for the deployment serving this id.
# No reasoning control authored: the checkpoint ships a Python encoder rather than a chat
#  template (https://huggingface.co/deepseek-ai/DeepSeek-V4-Flash-0731), and the request field was not tested live.
schema = 2
base_model = "deepseek/deepseek-v4-flash-0731"
name = "DeepSeek V4 Flash 0731 TEE"

[capabilities]
reasoning = { supported = true }
structured_output = true

[limit]
context = 1_048_576
output = 131_072

[cost.text.input]
price = 0.81

[cost.text.output]
price = 2.44
