# Qwen 3.5 supports the provider's binary $.thinking = true|false mapping.
# https://docs.mixlayer.com/reasoning (accessed 2026-06-25)
schema = 2
base_model = "alibaba/qwen3.5-27b"
description = "Qwen instruction model for multilingual chat, reasoning, and tool use"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }

[limit]
output = 262_144

[cost.text.input]
price = 0.3

[cost.text.output]
price = 2.4
