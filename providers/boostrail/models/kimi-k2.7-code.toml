# Pricing: https://www.boostrail.com/models/ (accessed 2026-10-19), also
# published as https://www.boostrail.com/models.json. USD per 1M tokens;
# cache writes are billed at the input price.
# Live requests to https://api.boostrail.com/v1/chat/completions (2026-10-19):
# reasoning_effort none|high gave 95|144 completion tokens for a one-number
# answer (always thinks, no caller control); image input answered; content
# parts are text and image_url only (no video).
base_model = "moonshotai/kimi-k2.7-code"
reasoning_options = []

[modalities]
input = ["text", "image"]

[cost]
input = 0.9025
output = 3.8
cache_read = 0.1805
cache_write = 0.9025
