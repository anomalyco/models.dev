# Pricing: https://www.boostrail.com/models/ (accessed 2026-11-10), also
# published as https://www.boostrail.com/models.json. USD per 1M tokens;
# cache writes are billed at the input price.
# Always thinks, no caller control: live 2026-10-19, reasoning_effort none
# and high gave 95 and 144 completion tokens for a one-number answer.
# Content parts are text and image_url only on this API, so video is left
# out of input; an image_url part was answered.
schema = 2
base_model = "moonshotai/kimi-k2.7-code"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true }

[cost.text.input]
price = 0.9025
cache = { read = 0.1805, write = 0.9025 }

[cost.text.output]
price = 3.8
