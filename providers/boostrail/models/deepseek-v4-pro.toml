# Pricing: https://www.boostrail.com/models/ (accessed 2026-11-10), also
# published as https://www.boostrail.com/models.json. USD per 1M tokens;
# cache writes are billed at the input price.
# BoostRail forwards reasoning_effort and thinking unchanged to the route
# serving the model, so the controls below follow the lab entry.
# Effort: reasoning_effort = none|low|high|max. low|high|max are DeepSeek's
# own levels (providers/deepseek; xhigh is not one of them). none turns
# thinking off: live 2026-10-19, 3 trials, the answer carried the working
# and no separate reasoning, while low|high|max answered with the number.
schema = 2
base_model = "deepseek/deepseek-v4-pro"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }

[cost.text.input]
price = 0.627
cache = { read = 0.154, write = 0.627 }

[cost.text.output]
price = 1.881
