# Pricing: https://www.boostrail.com/models/ (accessed 2026-11-10), also
# published as https://www.boostrail.com/models.json. USD per 1M tokens;
# cache writes are billed at the input price.
# BoostRail forwards reasoning_effort and thinking unchanged to the route
# serving the model, so the controls below follow the lab entry.
# Effort: reasoning_effort = low|medium|high|xhigh|max, as on the lab entry
# and on claude-opus-5 here (same request path).
# A PDF file content part was not seen by the model (27 prompt tokens), so
# PDF is left out of input; an image_url part was answered.
schema = 2
base_model = "anthropic/claude-sonnet-5"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 1.9
cache = { read = 0.19, write = 1.9 }

[cost.text.output]
price = 9.5
