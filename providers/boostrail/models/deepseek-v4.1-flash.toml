# Pricing: https://www.boostrail.com/models/ (accessed 2026-10-19), also
# published as https://www.boostrail.com/models.json. USD per 1M tokens;
# cache writes are billed at the input price.
# Live requests 2026-10-19 (3 trials each unless noted), one-number prompts:
# reasoning_effort none 2 completion tokens (no thinking; wrong answers),
# low 62 (1 trial), high 70-107, xhigh 80-100, max 82-94. xhigh and max are
# accepted and served as high. An image_url part was answered.
base_model = "deepseek/deepseek-v4.1-flash"
reasoning_options = [{ type = "effort", values = ["none", "low", "high"] }]

[cost]
input = 0.15
output = 0.6
cache_read = 0.018
cache_write = 0.15
