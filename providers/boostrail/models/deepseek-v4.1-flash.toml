# Pricing: https://www.boostrail.com/models/ (accessed 2026-10-19), also
# published as https://www.boostrail.com/models.json. USD per 1M tokens;
# cache writes are billed at the input price.
# Live requests to https://api.boostrail.com/v1/chat/completions (2026-10-19):
# reasoning_effort none|low|high gave 2|62|80 completion tokens for a
# one-number answer; image input answered.
base_model = "deepseek/deepseek-v4.1-flash"
reasoning_options = [{ type = "effort", values = ["none", "low", "high"] }]

[cost]
input = 0.15
output = 0.6
cache_read = 0.018
cache_write = 0.15
