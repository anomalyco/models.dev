# Pricing: https://www.boostrail.com/models/ (accessed 2026-11-10), also
# published as https://www.boostrail.com/models.json. USD per 1M tokens;
# cache writes are billed at the input price.
# BoostRail forwards reasoning_effort and thinking unchanged to the route
# serving the model, so the controls below follow the lab entry.
# Budget: thinking.budget_tokens. Live 2026-10-19: thinking {type: enabled,
# budget_tokens: 2048} gave 362-376 completion tokens with a number-only
# answer, against 5-238 without a budget.
# A PDF file content part was not seen by the model (22 prompt tokens), so
# PDF is left out of input; an image_url part was answered.
schema = 2
base_model = "anthropic/claude-haiku-4-5"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, budget = { min = 1_024 } }

[cost.text.input]
price = 0.95
cache = { read = 0.095, write = 0.95 }

[cost.text.output]
price = 4.75
