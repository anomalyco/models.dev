# Pricing: https://www.boostrail.com/models/ (accessed 2026-11-10), also
# published as https://www.boostrail.com/models.json. USD per 1M tokens;
# cache writes are billed at the input price.
# BoostRail forwards reasoning_effort and thinking unchanged to the route
# serving the model, so the controls below follow the lab entry.
# Effort: reasoning_effort = none|low|medium|high|xhigh, OpenAI's levels for
# GPT-5.4 (providers/openai).
# A PDF file content part was read (685 prompt tokens).
# Freeform: not supported. Live 2026-11-10: a custom tool with regex grammar
# ZZ[0-9]{3} came back as a function call with input "any value", so the
# grammar is not enforced on this API.
schema = 2
base_model = "openai/gpt-5.4"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }

[cost.text.input]
price = 2.375
cache = { read = 0.2375, write = 2.375 }

[cost.text.output]
price = 14.25
