# Pricing: https://www.boostrail.com/models/ (accessed 2026-11-10), also
# published as https://www.boostrail.com/models.json. USD per 1M tokens;
# cache writes are billed at the input price.
# BoostRail forwards reasoning_effort and thinking unchanged to the route
# serving the model, so the controls below follow the lab entry.
# Effort: reasoning_effort = low|medium|high|xhigh|max. Live 2026-10-19 on a
# harder one-number prompt: low 155-192, max 305-346 completion tokens.
# A PDF file content part was not seen by the model (48 prompt tokens), so
# PDF is left out of input; an image_url part was answered.
schema = 2
base_model = "anthropic/claude-opus-5"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 4.75
cache = { read = 0.475, write = 4.75 }

[cost.text.output]
price = 23.75
