# Pricing: https://www.boostrail.com/models/ (accessed 2026-10-19), also
# published as https://www.boostrail.com/models.json. USD per 1M tokens;
# cache writes are billed at the input price.
# Live requests to https://api.boostrail.com/v1/chat/completions (2026-10-19):
# reasoning_effort none|low|high gave 42|27|58 completion tokens for a
# one-number answer (no effective caller control); image input answered;
# content parts are text and image_url only (no PDF).
base_model = "anthropic/claude-opus-5"
reasoning_options = []

[modalities]
input = ["text", "image"]

[cost]
input = 4.75
output = 23.75
cache_read = 0.475
cache_write = 4.75
