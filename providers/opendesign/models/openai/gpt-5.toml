# Reasoning controls follow the OpenRouter relay entry for this model
# (providers/openrouter/models/openai/gpt-5.toml): graded levels
# minimal/low/medium/high. Mid-conversation system messages stay in place
# on the lab API and on the OpenRouter relay peer (probed live 2026-10-23),
# so system_updates is set.
# tools.freeform is left out: no host evidence for custom-tool formats yet.
# APIs: OpenDesign Cloud API serves Chat Completions, Responses and Messages
# (https://open-design.ai/help/cloud-api/, accessed 2026-11-20).
# No per-token prices: OpenDesign bills by subscription/workspace credits,
# so no [cost.*] is published. Cache behaviour is undocumented; left out.
schema = 2
base_model = "openai/gpt-5"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true
system_updates = true

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }
