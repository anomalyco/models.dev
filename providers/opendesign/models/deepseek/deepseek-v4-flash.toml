# Reasoning controls follow DeepSeek's own V4 guidance, as on the first-party
# entry (providers/deepseek/models/deepseek-v4-flash.toml): thinking.type =
# enabled|disabled (toggle) + reasoning_effort = low|high|max; default
# effort high (https://api-docs.deepseek.com/guides/thinking_mode).
# reasoning_content is DeepSeek's Chat Completions reasoning field
# (https://api-docs.deepseek.com/api/create-chat-completion).
# APIs: OpenDesign Cloud API serves Chat Completions, Responses and Messages
# (https://open-design.ai/help/cloud-api/, accessed 2026-11-20).
# No per-token prices: OpenDesign bills by subscription/workspace credits,
# so no [cost.*] is published. Cache behaviour is undocumented; left out.
schema = 2
base_model = "deepseek/deepseek-v4-flash"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, default = { type = "effort", value = "high" }, toggle = true, effort = ["low", "high", "max"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }
