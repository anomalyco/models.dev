# Cost: list, the most any lender on Aile may charge. Lenders price at a margin of it,
# so a request often costs less; the per-request quote (x-aile-price) is binding.
base_model = "anthropic/claude-sonnet-4-6"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "max"] }]

[cost]
input = 3
output = 15
cache_read = 0.3
cache_write = 3.75

[limit]
context = 200000
output = 128000
