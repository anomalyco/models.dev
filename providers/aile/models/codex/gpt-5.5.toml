# Cost: list, the most any lender on Aile may charge. Lenders price at a margin of it,
# so a request often costs less; the per-request quote (x-aile-price) is binding.
base_model = "openai/gpt-5.5"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh"] }]

[cost]
input = 5
output = 30
cache_read = 0.5

[limit]
context = 272000
output = 128000
input = 144000
