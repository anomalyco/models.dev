# Cost: list, the most any lender on Aile may charge. Lenders price at a margin of it,
# so a request often costs less; the per-request quote (x-aile-price) is binding.
base_model = "google/gemini-3.1-flash-lite"
reasoning_options = [{ type = "effort", values = ["minimal", "low", "medium", "high"] }]

[cost]
input = 0.25
output = 1.5
cache_read = 0.025
cache_write = 0.333333
