# Source: https://tchavi.com/api/model-tiers (public, no key; accessed 2026-11-19).
# Prices there are credits per 1K tokens; converted at Tchavi's rate of
# 1 credit = 0.3333 XOF and 600 XOF per USD, so USD per 1M = credits per 1K x 0.5555.
# 0.33 / 1.317 credits per 1K in / out (list), cache read 0.04.
# EFFECTIVE price: a 6% promotion runs until 2026-12-31, and the prices below
# are list less 6%. List is $0.1833 / $0.7316 per 1M, cache read $0.0222; the
# file returns to those when the promotion ends.
# Limits: context 1,048,576 and output 393,216 are what Tchavi serves
# (contextWindow / maxOutput on the same endpoint); both differ from the
# publisher's entry, so they are stated rather than inherited.
# Reasoning: Tchavi refuses no effort value on this row, measured on both of its
# routes on 2026-10-20 and 2026-10-21.
# Tools: a forced tool_choice (required or a named tool) is refused with a 400,
# so choice is auto/none. Also refused: a json_schema response_format (so no
# structured_output), n greater than 1, logprobs, parallel_tool_calls and
# verbosity.
# Cache: DeepSeek's automatic context caching; cached tokens bill at the cache
# read price.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[capabilities]
tools = { supported = true, choice = ["auto", "none"] }
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
cache = { implicit = true }

[cost.text.input]
price = 0.1723
cache = { read = 0.0209 }

[cost.text.output]
price = 0.6877

[limit]
context = 1_048_576
output = 393_216
