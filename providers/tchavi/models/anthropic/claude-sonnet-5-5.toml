# Source: GET https://tchavi.com/api/v1/models (accessed 2026-11-09), the same
# endpoint a buyer reads. Converted from Tchavi's credit price: 1 credit =
# 0.3333 XOF, 600 XOF per USD. No promotion runs on this model today.
schema = 2
base_model = "anthropic/claude-sonnet-5-5"

# Reasoning: Tchavi forwards the effort to the publisher's own API and refuses
# no value on this row, so the set is the publisher's: low, medium, high, xhigh,
# max. No `none`, because this model rejects thinking being turned off and
# Tchavi maps OpenAI's `none` and `minimal` to the floor effort rather than
# passing them through.
[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 2.4442
cache = { read = 0.2444, write = 3.0552 }

[cost.text.output]
price = 12.221
