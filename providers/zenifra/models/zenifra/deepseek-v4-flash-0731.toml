# Source: GET https://ai.zenifra.com/v1/models (accessed 2026-09-12).
# Conversion: Zenifra prices are BRL; models.dev costs use BRL / 5.30 = USD (project rate, applied 2026-09-12).
# Off-peak 14:00-00:00 UTC: BRL/1M input 1.10, output 3.30, cache read 0.14;
# the models.dev cost schema does not represent time-of-day pricing.
# Toggle: enable_thinking = true|false.
# Effort: reasoning_effort = low|high|max.
base_model = "deepseek/deepseek-v4-flash-0731"
structured_output = false

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 0.415094
output = 1.245283
cache_read = 0.054717

[limit]
output = 393_216

[provider]
shape = "completions"
