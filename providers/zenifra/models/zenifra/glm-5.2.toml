# Source: GET https://ai.zenifra.com/v1/models (accessed 2026-09-12).
# Conversion: Zenifra prices are BRL; models.dev costs use BRL / 5.30 = USD (project rate, applied 2026-09-12).
# Toggle: enable_thinking = true|false.
# Effort: reasoning_effort = high|max.
base_model = "zhipuai/glm-5.2"
structured_output = false

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["high", "max"]

[cost]
input = 1.075472
output = 3.773585
cache_read = 0.264151

[limit]
context = 1_048_576

[provider]
shape = "completions"
