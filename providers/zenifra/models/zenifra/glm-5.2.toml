# Served as `zenifra/glm-5.2` (the ID clients send). Source: GET https://ai.zenifra.com/v1/models
# (public, no auth, accessed 2026-11-09): name "GLM-5.2", context_length 1048576, max_output_tokens 131072.
# Effort: reasoning_effort = high|max (default high), from capabilities.reasoning.effort_levels.
# No toggle or budget: supported_parameters has no on/off or thinking-budget field (only reasoning_effort).
# structured_output = false: capabilities.response_schema = false, structured_outputs = false.
# Cache: capabilities.prompt_caching = true, billed as cache_read_input; cache_min_input_tokens = 1024.
# Limits differ from the lab (1_000_000/131_072): Zenifra serves context 1_048_576 and output 131_072.
# Prices: Zenifra lists BRL per 1M tokens (pricing): input BRL 5.7, output BRL 20, cache read BRL 1.4.
# USD = BRL / 5.5146, the Banco Central do Brasil PTAX selling rate for 2026-11-09 (closing bulletin):
# https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata/CotacaoDolarDia(dataCotacao=@dataCotacao)?@dataCotacao='11-09-2026'&$format=json
schema = 2
base_model = "zhipuai/glm-5.2"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "high" }, effort = ["high", "max"] }
structured_output = false
stream_usage = true
cache = { implicit = { min_tokens = 1_024 } }

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.0336
cache = { read = 0.2539 }

[cost.text.output]
price = 3.6267
