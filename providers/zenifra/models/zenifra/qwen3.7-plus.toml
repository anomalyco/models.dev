# Served as `zenifra/qwen3.7-plus` (the ID clients send). Source: GET https://ai.zenifra.com/v1/models
# (public, no auth, accessed 2026-11-09): name "Qwen3.7 Plus", context_length 1000000, max_output_tokens 131072.
# Toggle: enable_thinking = true|false on /v1/chat/completions (live 2026-11-09 on POST https://ai.zenifra.com/v1/chat/completions, uncached, unique prompt per call: enable_thinking=false -> 0 reasoning tokens, default -> 192 reasoning tokens).
# Budget: thinking_budget on /v1/chat/completions (live 2026-11-09 on POST https://ai.zenifra.com/v1/chat/completions, uncached, unique prompt per call: thinking_budget=20 -> exactly 20 reasoning tokens).
# No caller reasoning control (always_on = false, but no field turns it off): supported_parameters lists no reasoning_effort, on/off or thinking-budget field, so none is listed.
# structured_output = true: capabilities.response_schema = true, structured_outputs = true.
# Cache: capabilities.prompt_caching = true, billed as cache_read_input; cache_min_input_tokens = 1024.
# Limits differ from the lab (1_000_000/64_000): Zenifra serves context 1_000_000 and output 131_072.
# Prices: Zenifra lists BRL per 1M tokens (pricing): input BRL 1.5, output BRL 5.7, cache read BRL 0.4;
#   above 256_000 input tokens (context_tiers min_input_tokens 256001): input BRL 4.4, output BRL 17.2, cache read BRL 0.9.
# USD = BRL / 5.5146, the Banco Central do Brasil PTAX selling rate for 2026-11-09 (closing bulletin):
# https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata/CotacaoDolarDia(dataCotacao=@dataCotacao)?@dataCotacao='11-09-2026'&$format=json
schema = 2
base_model = "alibaba/qwen3.7-plus"

[capabilities]
reasoning = { supported = true, toggle = true, budget = {} }
structured_output = true
stream_usage = true
cache = { implicit = { min_tokens = 1_024 } }

[limit]
output = 131_072

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.272
cache = { read = 0.0725 }

[[cost.text.input.overrides]]
when = { context = { gt = 256_000 } }
price = 0.7979
cache = { read = 0.1632 }

[cost.text.output]
price = 1.0336

[[cost.text.output.overrides]]
when = { context = { gt = 256_000 } }
price = 3.119
