# Served as `zenifra/qwen3.7-plus` (the ID clients send). Source: GET https://ai.zenifra.com/v1/models
# (public, no auth, accessed 2026-11-09): name "Qwen3.7 Plus", context_length 1000000, max_output_tokens 131072.
# No caller reasoning control (always_on = false, but no field turns it off): supported_parameters lists no reasoning_effort, on/off or thinking-budget field, so none is listed.
# structured_output = true: capabilities.response_schema = true, structured_outputs = true.
# Cache: capabilities.prompt_caching = true, billed as cache_read_input; cache_min_input_tokens = 1024.
# Limits differ from the lab (1_000_000/64_000): Zenifra serves context 1_000_000 and output 131_072.
# No cost: Zenifra bills in BRL; USD prices are left out of this file.
schema = 2
base_model = "alibaba/qwen3.7-plus"

[capabilities]
reasoning = { supported = true }
structured_output = true
stream_usage = true
cache = { implicit = { min_tokens = 1_024 } }

[limit]
output = 131_072

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
