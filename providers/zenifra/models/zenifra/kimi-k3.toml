# Served as `zenifra/kimi-k3` (the ID clients send). Source: GET https://ai.zenifra.com/v1/models
# (public, no auth, accessed 2026-11-09): name "Kimi K3", context_length 1048576, max_output_tokens 131072.
# Effort: reasoning_effort = low|high|max (default max), from capabilities.reasoning.effort_levels.
# No toggle: the catalog marks thinking as always on (capabilities.reasoning.always_on = true).
# structured_output = true: capabilities.response_schema = true.
# Cache: capabilities.prompt_caching = true, billed as cache_read_input; cache_min_input_tokens = 1024.
# Modalities: the catalog reports vision = true but no video input for this route, so the lab's video types are dropped.
# No cost: Zenifra bills in BRL; USD prices are left out of this file.
schema = 2
base_model = "moonshotai/kimi-k3"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "max" }, effort = ["low", "high", "max"] }
structured_output = true
stream_usage = true
cache = { implicit = { min_tokens = 1_024 } }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
