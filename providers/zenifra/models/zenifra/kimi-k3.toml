# Source: GET https://ai.zenifra.com/v1/models (accessed 2026-09-12).
# Conversion: Zenifra prices are BRL; models.dev costs use BRL / 5.30 = USD (project rate, applied 2026-09-12).
# Reasoning is always on; Zenifra advertises effort levels low|high|max.
base_model = "moonshotai/kimi-k3"
temperature = true

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 2.773585
output = 13.866038
cache_read = 0.283019

[limit]
output = 1_048_576

[provider]
shape = "completions"
