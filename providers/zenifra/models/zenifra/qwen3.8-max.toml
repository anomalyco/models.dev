# Source: GET https://ai.zenifra.com/v1/models (accessed 2026-09-12).
# Conversion: Zenifra prices are BRL; models.dev costs use BRL / 5.30 = USD (project rate, applied 2026-09-12).
# This model advertises both /v1/chat/completions and /v1/responses.
# Toggle: enable_thinking = true|false.
# Effort: reasoning_effort = low|medium|xhigh.
base_model = "alibaba/qwen3.8-max"
structured_output = true

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "xhigh"]

[cost]
input = 1.603774
output = 4.830189
cache_read = 0.207547

[modalities]
input = ["text", "image", "video"]

[provider]
shape = "completions"
