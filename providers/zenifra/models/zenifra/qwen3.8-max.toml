# Served as `zenifra/qwen3.8-max` (the ID clients send). Source: GET https://ai.zenifra.com/v1/models
# (public, no auth, accessed 2026-11-09): name "Qwen3.8 Max", context_length 1000000, max_output_tokens 131072.
# Effort: reasoning_effort = low|medium|xhigh (default xhigh), from capabilities.reasoning.effort_levels.
# No toggle or budget: supported_parameters has no on/off or thinking-budget field (only reasoning_effort).
# structured_output = true: capabilities.response_schema = true, structured_outputs = true.
# Cache: capabilities.prompt_caching = true, billed as cache_read_input; cache_min_input_tokens = 1024.
# Modalities: the catalog lists input_modalities text/image/video and pdf_input = false, so the lab's application/pdf input is dropped.
# Prices: Zenifra lists BRL per 1M tokens (pricing): input BRL 8.5, output BRL 25.6, cache read BRL 1.1.
# USD = BRL / 5.5146, the Banco Central do Brasil PTAX selling rate for 2026-11-09 (closing bulletin):
# https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata/CotacaoDolarDia(dataCotacao=@dataCotacao)?@dataCotacao='11-09-2026'&$format=json
schema = 2
base_model = "alibaba/qwen3.8-max"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic", "video/mp4", "video/x-msvideo", "video/x-matroska", "video/quicktime", "video/x-flv", "video/x-ms-wmv"]
output = ["text"]

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "xhigh" }, effort = ["low", "medium", "xhigh"] }
structured_output = true
stream_usage = true
cache = { implicit = { min_tokens = 1_024 } }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.5414
cache = { read = 0.1995 }

[cost.text.output]
price = 4.6422
