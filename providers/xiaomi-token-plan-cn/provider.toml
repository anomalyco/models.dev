name = "Xiaomi Token Plan (China)"
# Raw endpoints are POST https://token-plan-cn.xiaomimimo.com/v1/chat/completions
# and POST https://token-plan-cn.xiaomimimo.com/anthropic/v1/messages.
# The OpenAI-compatible base also serves /responses. Chat Completions and Messages use
# thinking.type="enabled"|"disabled" (default enabled on the MiMo-V2.6 series).
# https://mimo.mi.com/static/docs/tokenplan/Token%20Plan/quick-access.md (accessed 2026-10-21)
# https://mimo.mi.com/static/docs/api/chat/openai-api.md (accessed 2026-10-21)
env = ["XIAOMI_API_KEY"]
npm = "@ai-sdk/openai-compatible"
opencodeai = "@opencode/ai/providers/openai-compatible"
api = "https://token-plan-cn.xiaomimimo.com/v1"
doc = "https://platform.xiaomimimo.com/#/docs"
