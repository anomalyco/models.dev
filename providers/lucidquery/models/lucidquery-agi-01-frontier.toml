# Pricing: https://lucidquery.com/docs (Models, accessed 2026-10-21) lists EUR 4.50 input / EUR 22.00 output per 1M tokens.
# EUR->USD at the ECB reference rate 1.1215 (2026-10-20); the v1 file had the EUR figures as USD.
schema = 2
name = "AGI-01 Frontier"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"
family = "agi"
open_weights = false
knowledge = "2026-06-05"
release_date = "2026-06-16"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true

[limit]
context = 300_000
output = 120_000

[cost.text.input]
price = 5.04675

[cost.text.output]
price = 24.673
