# Sources: https://docs.subq.ai/using-the-api/models/#subq-snap-12
# https://docs.subq.ai/using-the-api/release-notes/
# https://docs.subq.ai/endpoints/decisions-api/
# System One returns typed answers and always reports zero output tokens.
# @ai-sdk/typesafe-ai 3.0.42 sends images as multipart assets. Snap requires
# a top-level images array in JSON, so the AI SDK entry is unset.
schema = 2
type = "decision"
name = "SubQ Snap 1.2"
family = "subq-snap"
description = "System One model for typed decisions over text, structured state, and images"
open_weights = false
release_date = "2026-11-11"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp"]
output = ["decision"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 393_216
output = 0

[cost.text.input]
price = 0.04

[cost.text.output]
price = 0

[api.systemone]
sdk = { aisdk = "none", opencodeai = "@opencode/ai/providers/typesafe-ai/decisions" }
compatibility = { media_input = "root" }
