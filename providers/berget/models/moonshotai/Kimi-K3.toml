# Kimi K3 always thinks and cannot disable it; reasoning_effort only controls
# depth. K3's native levels are low/high/max (default max). The Berget API also
# accepts the other OpenAI effort levels for compatibility and clamps them onto
# these three, but only the three distinct levels are advertised here.
# Reasoning is returned in message.reasoning_content, the answer in
# message.content.
# https://api.berget.ai/openapi.json
# Prices: https://api.berget.ai/v1/models lists EUR per 1M tokens (public, checked 2026-10-21);
# EUR 3 input / 0.90 cached input / 15 output; they were stored as unconverted EUR values.
# converted to USD at the ECB reference rate of 1.1215 USD/EUR (2026-10-20).
schema = 2
base_model = "moonshotai/kimi-k3"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
context = 327_680
output = 32_768

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 3.3645
cache = { read = 1.00935 }

[cost.text.output]
price = 16.8225
