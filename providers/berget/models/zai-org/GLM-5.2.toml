# Berget's schema accepts none/low/medium/high, but documents no GLM-specific
# mapping; schema acceptance alone does not establish meaningful support.
# https://api.berget.ai/openapi.json
schema = 2
base_model = "zhipuai/glm-5.2"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = true

[limit]
context = 524_288
output = 32_768

[cost.text.input]
price = 1.54

[cost.text.output]
price = 4.84
