# Qwen3.8 27B FP8 served on Berget AI's Swedish infrastructure.
# Multimodal (text + image), reasoning on by default with effort levels
# none|low|medium|xhigh (matched against the live API 2026-09-01).
# https://api.berget.ai/openapi.json
#
# Berget bills in EUR: 0.4 EUR/M input, 3 EUR/M output.
# Converted to USD at 1.1596 (ECB rate, 2026-08-31):
#   0.4 EUR/M -> 0.46 USD/M input
#   3 EUR/M   -> 3.48 USD/M output
schema = 2
base_model = "alibaba/qwen3.8-27b"
last_updated = "2026-09-01"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "xhigh"] }
structured_output = true

[limit]
output = 65_536

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.46

[cost.text.output]
price = 3.48
