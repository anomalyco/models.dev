# Price: OpenAI's standard-tier list price, https://openai.com/api/pricing/; Respan bills the upstream
# list price. Only the 30m cache TTL is offered: the 12h TTL is Responses-only and Respan serves
# /chat/completions.
# freeform: custom tools with text, lark and regex grammars work on /chat/completions
# (live 2026-11-23: regex ZZ[0-9]{3} and the same lark grammar both returned ZZ000
# for the input "hello").
# Function tools work at every listed reasoning_effort on this route (live 2026-11-24:
# get_weather was called at reasoning_effort=low); Respan does not need effort=none for them.
schema = 2
base_model = "openai/gpt-6-astra"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = { min_tokens = 1_024 }, explicit = { ttl = ["30m"], max_breakpoints = 4, min_tokens = 1_024 } }
tools = { supported = true, freeform = ["text", "lark", "regex"] }

[cost.text.input]
price = 10
cache = { read = 1, write = 12.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 20
cache = { read = 2, write = 25 }

[cost.text.output]
price = 50

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 75
