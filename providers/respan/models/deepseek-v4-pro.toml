# Price: DeepSeek's off-peak list price, doubled at peak (01:00-04:00 and 06:00-10:00 UTC,
# Mon-Fri), as https://api-docs.deepseek.com/quick_start/pricing; Respan bills the upstream list price.
# Off is reasoning_effort=none; graded levels low|high|max. thinking.type is not
# forwarded on this route (live 2026-11-23).
# Reasoning text comes back in message.reasoning_content (live 2026-11-24).
schema = 2
base_model = "deepseek/deepseek-v4-pro"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.66
cache = { read = 0.022 }

[cost.text.output]
price = 1.98
reasoning = 1.98

[[cost.multipliers]]
when = { utc_days = { in = ["mon", "tue", "wed", "thu", "fri"] }, not = { holiday = { equals = "CN" } }, any = [{ all = [{ utc_hours = { gte = "01:00" } }, { utc_hours = { lt = "04:00" } }] }, { all = [{ utc_hours = { gte = "06:00" } }, { utc_hours = { lt = "10:00" } }] }] }
factor = 2

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
