# Price: Google's Gemini API list price, https://ai.google.dev/gemini-api/docs/pricing; Respan bills the
# upstream list price. Explicit cachedContents is not exposed, so only implicit caching is listed.
schema = 2
base_model = "google/gemini-3.5-flash-lite"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.3
cache = { read = 0.03 }

[cost.text.output]
price = 2.5
