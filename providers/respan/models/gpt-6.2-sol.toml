# freeform: custom tools with text, lark and regex grammars work on /chat/completions
# (live 2026-11-23: regex ZZ[0-9]{3} and the same lark grammar both returned ZZ000
# for the input "hello").
schema = 2
base_model = "openai/gpt-6.2-sol"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
tools = { supported = true, freeform = ["text", "lark", "regex"] }

[cost.text.input]
price = 2
cache = { read = 0.1, write = 2.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 4
cache = { read = 0.2, write = 5 }

[cost.text.output]
price = 10

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 15
