# Price: Moonshot's list price, https://platform.kimi.ai/docs/pricing/chat (cache write $3 for
# the default 5m TTL, $6 for 1h); Respan bills the upstream list price.
# Always thinks. Effort: reasoning_effort = low|high|max
# Reasoning text comes back in message.reasoning_content (live 2026-11-24).
schema = 2
base_model = "moonshotai/kimi-k3"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = { ttl = ["5m", "1h"] } }

[cost.text.input]
price = 3
cache = { read = 0.3, write = { "5m" = 3, "1h" = 6 } }

[cost.text.output]
price = 15

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
