# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|medium|high|xhigh|max
base_model = "anthropic/claude-sonnet-5"
structured_output = true
reasoning_options = [
  { type = "toggle" },
  { type = "effort", values = ["low", "medium", "high", "xhigh", "max"] },
]

[cost]
input = 2.00
output = 10.00
cache_read = 0.2
cache_write = 2.5
