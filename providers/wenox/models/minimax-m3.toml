# WenOX Go billing: 1,000 Credits = $1.00 USD.
# Cost below is the USD-equivalent per 1M tokens.
# MiniMax-M3 reasoning control follows the upstream lab toggle baseline.

base_model = "minimax/MiniMax-M3"

reasoning_options = [{ type = "toggle" }]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.30
output = 1.00

[limit]
context = 1_000_000
output = 128_000

[modalities]
input = ["text", "image"]
output = ["text"]
