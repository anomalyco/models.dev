# WenOX Go billing: 1,000 Credits = $1.00 USD.
# Cost below is the USD-equivalent per 1M tokens.
# Effort: reasoning_effort = none|minimal|low|medium|high|xhigh|max.
# Live probe 2026-10-07: all listed values accepted; none disables reasoning,
# all other values return reasoning_content; invalid values return HTTP 400.

base_model = "minimax/MiniMax-M3"

reasoning_options = [
  { type = "effort", values = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] },
]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.30
output = 1.00

[limit]
context = 1_000_000
output = 128_000

[modalities]
input = ["text", "image"]
output = ["text"]
