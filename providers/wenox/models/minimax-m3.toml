# WenOX service contract: https://docs.wenox.co/models#capabilities
# Retail pricing: https://docs.wenox.co/models#pricing-policy
# Conversion verified 2026-10-08: 1,000 Credits = $1.00 USD; costs per 1M tokens.
# Flat input/output prices throughout the supported context range.
# Control/response probes: https://docs.wenox.co/model-verification/2026-10-08.json
# Toggle: thinking.type = enabled|disabled; https://docs.wenox.co/models#reasoning-controls
# MiniMax-M3: lab/same-surface peers use toggle; this WenOX wire was probed.

base_model = "minimax/MiniMax-M3"
reasoning_options = [{ type = "toggle" }]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.30
output = 1.00

[limit]
context = 1_000_000
output = 128_000

[modalities]
input = ["text", "image"]
output = ["text"]
