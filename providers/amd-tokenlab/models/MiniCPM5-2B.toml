# Verified live against https://api.tokenlab.amd.com/v1:
# - GET /v1/models lists MiniCPM5-2B with context_length 131072, input_modalities text, and
#   supported_parameters temperature, max_tokens, top_p, stream, response_format, tools, tool_choice,
#   reasoning_effort (no top_k).
# - POST /v1/chat/completions validates reasoning_effort as none|minimal|low|medium|high|xhigh|max
#   (other values return 400); a strict json_schema response_format returned schema-valid JSON;
#   a request with tools/tool_choice returned finish_reason "tool_calls".
# - Pricing: no per-token charge. Usage draws on a free weekly allowance per AMD AI Developer Program
#   key (x-ratelimit-limit-user-budget-usd: 10, x-ratelimit-limit-user-rpm: 20), so every price is 0.
# Reasoning controls follow the same models on providers/amd (AMD Token Factory), whose API applies
# the same reasoning_effort validation.
schema = 2
base_model = "openbmb/minicpm5-2b"

[capabilities]
reasoning = { supported = true }
structured_output = true
top_k = false

[cost.text.input]
price = 0
cache = { read = 0 }

[cost.text.output]
price = 0
