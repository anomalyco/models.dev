# https://deeptimetoken.com/en/models/deepseek?model=hon%3Adeepseek-v4.1-flash-1017
# Off-peak USD per million tokens, using the provider's published FX rate of 6.7138 CNY/USD on 2026-10-30.
# Peak rates are 2x during the two weekday windows below. The provider does not specify holiday exceptions.
# Reasoning baseline from the underlying DeepSeek Chat Completions API: https://api-docs.deepseek.com/guides/thinking_mode
# Toggle: thinking.type = enabled|disabled. Effort: reasoning_effort = low|high|max.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.059578778
cache = { read = 0.00119157556 }

[cost.text.output]
price = 0.238315112

[[cost.multipliers]]
when = { utc_days = { in = ["mon", "tue", "wed", "thu", "fri"] }, any = [{ all = [{ utc_hours = { gte = "01:00" } }, { utc_hours = { lt = "04:00" } }] }, { all = [{ utc_hours = { gte = "06:00" } }, { utc_hours = { lt = "10:00" } }] }] }
factor = 2
