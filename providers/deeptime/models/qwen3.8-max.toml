# DeepTime route, rates and capabilities (2026-11-17): https://deeptimetoken.com/en/models/qwen?model=hon%3Aqwen3.8-max
# USD per million tokens, converted by DeepTime at 6.7138 CNY/USD (2026-10-30).
# Model-native control baseline: https://github.com/anomalyco/models.dev/blob/dev/providers/alibaba/models/qwen3.8-max.toml
# Toggle: enable_thinking = true|false. Effort: reasoning_effort = low|medium|xhigh.
# The route lists reasoning; passthrough of these individual controls has not been verified.
# DeepTime lists text, image and video inputs; the lab's PDF input is not listed for this route.
schema = 2
base_model = "alibaba/qwen3.8-max"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic", "video/mp4", "video/x-msvideo", "video/x-matroska", "video/quicktime", "video/x-flv", "video/x-ms-wmv"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "xhigh"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 1.072418005
cache = { read = 0.134052251 }

[cost.text.output]
price = 3.217254014
