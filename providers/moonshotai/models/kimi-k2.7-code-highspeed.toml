# Same model and parameters as kimi-k2.7-code with faster output (~180 tokens/s):
# https://platform.kimi.ai/docs/api/models-overview, https://platform.kimi.ai/docs/guide/kimi-k2-7-code-quickstart
# Pricing: https://platform.kimi.ai/docs/pricing/chat (accessed 2026-10-19)
schema = 2
base_model = "moonshotai/kimi-k2.7-code"
name = "Kimi K2.7 Code HighSpeed"

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none"], updates = false }
reasoning = { supported = true }
structured_output = true
system_updates = true
stream_usage = true
prompt_cache_key = true
cache = { supported = true, implicit = true, explicit = false }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.9
cache = { read = 0.38 }

[cost.text.output]
price = 8
