# Same model and parameters as kimi-k2.7-code with faster output (~180 tokens/s):
# https://platform.kimi.ai/docs/api/models-overview, https://platform.kimi.ai/docs/guide/kimi-k2-7-code-quickstart
# Pricing: https://platform.kimi.ai/docs/pricing/chat (accessed 2026-10-19)
# Per-API flags: system_updates sits on [api.chat-completions] only. The late system message was checked in place on Chat Completions (live 2026-10-23); the Responses and Anthropic-compatible Messages endpoints have no documented or tested in-place system message.
schema = 2
base_model = "moonshotai/kimi-k2.7-code"
name = "Kimi K2.7 Code HighSpeed"

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none"], updates = false }
reasoning = { supported = true }
structured_output = true
stream_usage = true
prompt_cache_key = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
capabilities = { system_updates = true }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/moonshot/responses" }

[api.messages]
base_url = "https://api.moonshot.ai/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/moonshot/messages" }

[cost.text.input]
price = 1.9
cache = { read = 0.38 }

[cost.text.output]
price = 8
