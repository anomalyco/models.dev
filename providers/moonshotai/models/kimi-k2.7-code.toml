# Sources (platform.kimi.ai/docs, accessed 2026-10-19):
# - Pricing: https://platform.kimi.ai/docs/pricing/chat (automatic prefix cache, no cache-write charge for K2.x)
# - Parameters: https://platform.kimi.ai/docs/api/models-overview (thinking always on, tool_choice "required" not
#   supported)
# - Chat API: https://platform.kimi.ai/docs/api/chat (response_format json_schema, tool strict, prompt_cache_key,
#   stream_options.include_usage)
# - Caching: https://platform.kimi.ai/docs/guide/context-caching
# Reasoning is always on (thinking.type only accepts "enabled"); reasoning returned in reasoning_content and must be
# passed back (Preserved Thinking is always on).
# Live 2026-10-19: tool_choice "required" or a named function returns 400 ("incompatible with thinking enabled");
# a system message after the first turn is accepted and keeps the prefix cache; dynamic tool messages fail
# ("tokenization failed").
# Per-API flags: system_updates sits on [api.chat-completions] only. The late system message was checked in place on Chat Completions (live 2026-10-23); the Responses and Anthropic-compatible Messages endpoints have no documented or tested in-place system message.
# Tools (live 2026-10-26; https://platform.kimi.ai/docs/guide/use-tool-choice): Chat Completions and Messages take auto and
#   none. required (Messages `any`) and a named tool return 400 "incompatible with thinking enabled", and thinking can't
#   be turned off (https://platform.kimi.ai/docs/api/models-overview).
#   Responses accepts only auto (none/required return 400; https://platform.kimi.ai/docs/api/responses), so [api.responses]
#   overrides choice. strict: Chat Completions defaults function tools to strict = true, Responses function tools take strict,
#   Messages has no strict field but needs MFJS input schemas and is served by the Chat Completions backend
#   (https://platform.kimi.ai/docs/api/chat, https://platform.kimi.ai/docs/api/messages).
schema = 2
base_model = "moonshotai/kimi-k2.7-code"

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none"] }
reasoning = { supported = true }
structured_output = true
stream_usage = true
prompt_cache_key = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
capabilities = { system_updates = true }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/moonshot/responses" }
capabilities = { tools = { choice = ["auto"] } }

[api.messages]
base_url = "https://api.moonshot.ai/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/moonshot/messages" }

[cost.text.input]
price = 0.95
cache = { read = 0.19 }

[cost.text.output]
price = 4
