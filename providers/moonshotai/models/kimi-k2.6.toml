# Sources (platform.kimi.ai/docs, accessed 2026-10-19):
# - Pricing: https://platform.kimi.ai/docs/pricing/chat (automatic prefix cache, no cache-write charge for K2.x)
# - Parameters: https://platform.kimi.ai/docs/api/models-overview (temperature fixed at 1.0 thinking / 0.6
#   non-thinking, top_p fixed at 0.95, tool_choice "required" not supported)
# - Chat API: https://platform.kimi.ai/docs/api/chat (response_format json_schema, tool strict, prompt_cache_key,
#   stream_options.include_usage)
# - Caching: https://platform.kimi.ai/docs/guide/context-caching
# Toggle: thinking.type = "enabled" (default) | "disabled"; reasoning returned in reasoning_content.
# Live 2026-10-19: tool_choice "required" or a named function returns 400 while thinking is on (both work with
# thinking disabled); json_schema is only enforced with thinking disabled; a system message after the first turn is
# accepted and keeps the prefix cache; dynamic tool messages fail ("tokenization failed", K3 only per
# https://platform.kimi.ai/docs/guide/use-dynamic-tool-loading); temperature/top_p other than the fixed values return
# 400; top_k is ignored.
# Mid-conversation flags (live 2026-10-27):
#   system_updates holds on every API: a late system message (Chat Completions, Messages) or developer message
#   (Responses) is kept in place (cached prefix survives, instruction followed) [cached/prompt tokens,
#   control -> test: Chat Completions 6144/8118 -> 6144/8130; Responses 6144/8118 -> 6144/8130; Messages 6144/8118 -> 6144/8130].
#   Messages documents only user/assistant roles (https://platform.kimi.ai/docs/api/messages) but accepts role "system" inside messages.
#   No tools.updates: the dynamic tool system message (Chat Completions) and the `additional_tools` item (Responses)
#   both return 400 "tokenization failed" (K3 family only per https://platform.kimi.ai/docs/guide/use-dynamic-tool-loading).
# Tools (live 2026-10-26; https://platform.kimi.ai/docs/guide/use-tool-choice): Chat Completions and Messages take auto,
#   none, required (Messages `any`) and a named tool. required and a named tool return 400 "incompatible with thinking
#   enabled" and work with thinking disabled (the models overview still says K2.x rejects required).
#   Responses accepts only auto (none/required return 400; https://platform.kimi.ai/docs/api/responses), so [api.responses]
#   overrides choice. strict: Chat Completions defaults function tools to strict = true, Responses function tools take strict,
#   Messages has no strict field but needs MFJS input schemas and is served by the Chat Completions backend
#   (https://platform.kimi.ai/docs/api/chat, https://platform.kimi.ai/docs/api/messages).
schema = 2
base_model = "moonshotai/kimi-k2.6"

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, default = { type = "toggle", value = true }, toggle = true }
structured_output = true
system_updates = true
temperature = false
top_p = false
top_k = false
stream_usage = true
prompt_cache_key = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/moonshot/responses" }
capabilities = { tools = { choice = ["auto"] } }

[api.messages]
base_url = "https://api.moonshot.ai/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/moonshot/messages" }

[cost.text.input]
price = 0.95
cache = { read = 0.16 }

[cost.text.output]
price = 4
