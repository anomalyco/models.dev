# Sources (platform.kimi.ai/docs, accessed 2026-10-19):
# - Pricing: https://platform.kimi.ai/docs/pricing/chat (cache write $3 for the default 5m TTL, $6 for 1h)
# - Parameters: https://platform.kimi.ai/docs/api/models-overview (switching reasoning_effort invalidates the
#   prefix cache)
# - Chat API: https://platform.kimi.ai/docs/api/chat (max_completion_tokens up to 1048576, prompt_cache_options.ttl
#   = 5m|1h, explicit cache breakpoints rejected, prompt_cache_key, stream_options.include_usage)
# - Caching: https://platform.kimi.ai/docs/guide/context-caching
# - Dynamic tools (system message with `tools`, appended without breaking the prefix cache):
#   https://platform.kimi.ai/docs/guide/use-dynamic-tool-loading
# Effort: reasoning_effort = "low" | "high" | "max" (default "max"); always thinks, reasoning in reasoning_content.
# Live 2026-10-19: switching reasoning_effort max -> low re-wrote the whole prefix (no cache read); a mid-conversation
# system message and a dynamic tool message were accepted, and the tool was called; tool_choice "required" works but a
# named function returns 400 ("incompatible with thinking enabled"); temperature/top_p other than 1/0.95 return 400.
# Mid-conversation flags (live 2026-10-27):
#   system_updates holds on every API: a late system message (Chat Completions, Messages) or developer message
#   (Responses) is kept in place (cached prefix survives, instruction followed) [cached/prompt tokens,
#   control -> test: Chat Completions 8192/8228 -> 8192/8247; Responses 7936/7968 -> 7936/7987; Messages 8192/8228 -> 8192/8247].
#   Messages documents only user/assistant roles (https://platform.kimi.ai/docs/api/messages) but accepts role "system" inside messages.
#   tools.updates (add only) is on Chat Completions and Responses. Chat Completions takes a system message with `tools`
#   and no content (https://platform.kimi.ai/docs/guide/use-dynamic-tool-loading), and the tool was called (live 2026-10-19). Responses takes an
#   `additional_tools` input item (ResponsesAdditionalToolsItem in https://platform.kimi.ai/docs/openapi.json); the added tool was called
#   [cached/prompt tokens, control -> test: 7936/7968 -> 7936/8074]. Messages documents no tool addition, so it is left out there.
# Tools (live 2026-10-26; https://platform.kimi.ai/docs/api/models-overview): Chat Completions and Messages take auto, none
#   and required (Messages `any`). A named tool returns 400 "incompatible with thinking enabled", and K3.x always thinks.
#   Responses accepts only auto (none/required return 400; https://platform.kimi.ai/docs/api/responses), so [api.responses]
#   overrides choice. strict: Chat Completions defaults function tools to strict = true, Responses function tools take strict,
#   Messages has no strict field but needs MFJS input schemas and is served by the Chat Completions backend
#   (https://platform.kimi.ai/docs/api/chat, https://platform.kimi.ai/docs/api/messages).
schema = 2
base_model = "moonshotai/kimi-k3"

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none", "required"] }
reasoning = { supported = true, default = { type = "effort", value = "max" }, effort = ["low", "high", "max"] }
structured_output = true
system_updates = true
stream_usage = true
prompt_cache_key = true
cache = { implicit = { ttl = ["5m", "1h"] } }

[limit]
output = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
capabilities = { tools = { updates = true } }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/moonshot/responses" }
capabilities = { tools = { choice = ["auto"], updates = true } }

[api.messages]
base_url = "https://api.moonshot.ai/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/moonshot/messages" }

[cost.text.input]
price = 3
cache = { read = 0.3, write = { "5m" = 3, "1h" = 6 } }

[cost.text.output]
price = 15
