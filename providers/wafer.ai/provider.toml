# Wafer serverless (https://wafer.ai). OpenAI-compatible Chat Completions at https://pass.wafer.ai/v1.
# Reasoning: reasoning_effort = none|low|medium|high|xhigh|max (or reasoning.effort, or
# thinking.type = enabled|disabled); each model lists the efforts it supports in GET /v1/models and other
# values run at a nearby listed tier. Reasoning text is returned in choices[].message.reasoning_content.
# Prompt caching is automatic; there is no cache-write charge.
# https://docs.wafer.ai/serverless/chat-completions#reasoning, https://docs.wafer.ai/serverless/models (accessed 2026-11-06)
name = "Wafer"
env = ["WAFER_API_KEY"]
npm = "@ai-sdk/openai-compatible"
opencodeai = "@opencode/ai/providers/openai-compatible"
api = "https://pass.wafer.ai/v1"
doc = "https://docs.wafer.ai/serverless/models"
