# Sources (accessed 2026-07-11):
# - Pricing and model details: https://app.wafer.ai/models
# - Reasoning controls: https://docs.wafer.ai/serverless/api-reference#reasoning-controls
schema = 2
base_model = "minimax/MiniMax-M3"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["none", "low", "medium", "high", "max"] }
structured_output = true

[limit]
context = 1_048_576

[cost.text.input]
price = 0.33
cache = { read = 0.07, write = 0 }

[[cost.text.input.overrides]]
when = { context = { gt = 512_000 } }
price = 0.66
cache = { read = 0.13, write = 0 }

[cost.text.output]
price = 1.32

[[cost.text.output.overrides]]
when = { context = { gt = 512_000 } }
price = 2.64
