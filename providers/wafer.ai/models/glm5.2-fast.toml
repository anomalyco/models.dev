# Sources (accessed 2026-07-11):
# - Pricing and model details: https://app.wafer.ai/models
# - Reasoning controls: https://docs.wafer.ai/serverless/api-reference#reasoning-controls
schema = 2
base_model = "zhipuai/glm-5.2"
name = "GLM5.2-Fast"
description = "The same model served for high TPS."

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["none", "low", "medium", "high", "max"] }
structured_output = true

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 3
cache = { read = 0.5, write = 0 }

[cost.text.output]
price = 10.25
