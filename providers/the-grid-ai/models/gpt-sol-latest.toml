# contract spec: https://thegrid.ai/docs/instrument-specifications/current-instruments
# Pricing on The Grid AI is variable.
# Tokens trade on an open market, so cost is not fixed and is intentionally omitted here.
schema = 2
name = "GPT Sol Latest"
description = "Lab latest market for GPT frontier supply. You contract for the latest qualifying route, not a specific model."
open_weights = false
release_date = "2026-07-06"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
temperature = false

[limit]
context = 1_000_000
input = 922_000
output = 128_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
