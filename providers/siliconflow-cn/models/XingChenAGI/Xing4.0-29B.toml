# Prices: China pricing page https://www.siliconflow.cn/pricing (SKU billing rows, CNY per 1M tokens, accessed 2026-10-31):
# free (input 0, output 0).
# Catalog (same page, model row, 2026-10-31): contextLen 262144, functionCallSupport, jsonModeSupport.
# base_model: the catalog description is Xing4.0-29B-A4B's (29B total, 4B active, 256K native context, extensible to 512K).
# Reasoning: no caller control documented for this model on SiliconFlow China (not listed for enable_thinking or
# reasoning_effort; the reasoning guide says only the Qwen3 series enforces thinking_budget), matching the siliconflow-cn
# peers for non-Qwen reasoning models. https://docs.siliconflow.cn/docs/userguide/capabilities/reasoning
schema = 2
base_model = "xingchen-agi/xing4.0-29b-a4b"

[capabilities]
reasoning = { supported = true }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0

[cost.text.output]
price = 0
