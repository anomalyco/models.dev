schema = 2
base_model = "moonshotai/kimi-k2.5"
name = "Pro/moonshotai/Kimi-K2.5"
description = "Kimi multimodal agent model for visual understanding, coding, and planning"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
temperature = true
reasoning = { supported = true }
structured_output = true

[limit]
context = 262_000
output = 262_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.45
cache = { read = 0.07 }

[cost.text.output]
price = 2.25
