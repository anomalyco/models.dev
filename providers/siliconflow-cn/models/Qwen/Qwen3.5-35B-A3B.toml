# Prices: China pricing page https://siliconflow.cn/pricing (CNY per 1M tokens, accessed 2026-10-21),
# converted to USD and rounded to 8 decimals. CNY→USD rate: 6.691314, 2026-10-21,
# source: https://open.er-api.com/v6/latest/USD
# CNY: input 0.4, output 3.2; input ≥128k: input 1.6, output 12.8
# knowledge: unsourced value kept from the v1 file (the lab has none).
# Toggle: enable_thinking = true|false (top-level request field)
# https://docs.siliconflow.cn/cn/api-reference/chat-completions/chat-completions
# Budget: thinking_budget = 128..32768 (top-level request field); the China reasoning guide says the Qwen3
# series natively enforces it (https://docs.siliconflow.cn/docs/userguide/capabilities/reasoning).
schema = 2
base_model = "alibaba/qwen3.5-35b-a3b"
name = "Qwen/Qwen3.5-35B-A3B"
knowledge = "2025-04"

[capabilities]
reasoning = { supported = true, toggle = true, budget = { min = 128, max = 32_768 } }

[cost.text.input]
price = 0.05977899

[[cost.text.input.overrides]]
when = { context = { gte = 128_000 } }
price = 0.23911596

[cost.text.output]
price = 0.47823193

[[cost.text.output.overrides]]
when = { context = { gte = 128_000 } }
price = 1.91292771
