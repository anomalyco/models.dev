# Prices: China pricing page https://siliconflow.cn/pricing (CNY per 1M tokens, accessed 2026-10-21),
# converted to USD and rounded to 8 decimals. CNY→USD rate: 6.691314, 2026-10-21,
# source: https://open.er-api.com/v6/latest/USD
# CNY: input 0, output 0
# Toggle: enable_thinking = true|false (top-level request field)
# Budget: thinking_budget = 128..32768 (top-level request field)
# https://docs.siliconflow.cn/cn/api-reference/chat-completions/chat-completions
schema = 2
base_model = "alibaba/qwen3-8b"
name = "Qwen/Qwen3-8B"
description = "Qwen instruction model for multilingual chat, reasoning, and tool use"

[capabilities]
reasoning = { supported = true, toggle = true, budget = { min = 128, max = 32_768 } }
structured_output = true

[limit]
context = 131_000
output = 131_000

[cost.text.input]
price = 0

[cost.text.output]
price = 0
