# Prices: China pricing page https://siliconflow.cn/pricing (CNY per 1M tokens, accessed 2026-10-21),
# converted to USD and rounded to 8 decimals. CNY→USD rate: 6.691314, 2026-10-21,
# source: https://open.er-api.com/v6/latest/USD
# CNY: input 0.7, output 2.8
# Modalities: the China multimodal guide lists image and video input for the Qwen3-VL series
# (https://docs.siliconflow.cn/docs/userguide/capabilities/multimodal-vision, 2026-10-21).
# Budget: thinking_budget = 128..32768 (top-level request field); the China reasoning guide says the Qwen3
# series natively enforces it (https://docs.siliconflow.cn/docs/userguide/capabilities/reasoning).
# Input MIME types: this file serves Qwen's open-weight Qwen3-VL-30B-A3B-Thinking; formats are the lab's, per
#   https://www.alibabacloud.com/help/en/model-studio/vision (Image limits, Video limits; open-source Qwen3-VL included,
#   registered MIME types used). The host lists no formats, so it is assumed to relay the lab's.
schema = 2
name = "Qwen/Qwen3-VL-30B-A3B-Thinking"
description = "Qwen vision-language model for visual reasoning, documents, and agent tasks"
family = "qwen"
open_weights = true
release_date = "2025-10-11"
last_updated = "2025-11-25"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic", "video/mp4", "video/x-msvideo", "video/x-matroska", "video/quicktime", "video/x-flv", "video/x-ms-wmv"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, budget = { min = 128, max = 32_768 } }
structured_output = true
temperature = true

[limit]
context = 262_000
output = 262_000

[cost.text.input]
price = 0.10461323

[cost.text.output]
price = 0.41845294
