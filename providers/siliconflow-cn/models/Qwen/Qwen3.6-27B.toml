# Prices: China pricing page https://www.siliconflow.cn/pricing (SKU billing rows, CNY per 1M tokens, accessed 2026-10-31),
# converted to USD and rounded to 8 decimals. CNY→USD rate: 6.669566, 2026-10-31,
# source: https://open.er-api.com/v6/latest/USD
# CNY: input 3, output 18 (no cache price listed)
# Catalog (same page, model row, 2026-10-31): contextLen 262144, vlm, functionCallSupport, jsonModeSupport.
# Modalities: image input only, as on the siliconflow Qwen3.6-27B peer (model page "Support image input"); image formats are the lab's.
# Toggle: enable_thinking = true|false (top-level request field)
# Budget: thinking_budget = 128..32768 (top-level request field); the China reasoning guide says the Qwen3 series enforces it.
# Same controls as the siliconflow-cn Qwen3.5-27B peer.
# https://docs.siliconflow.cn/cn/api-reference/chat-completions/chat-completions
# https://docs.siliconflow.cn/docs/userguide/capabilities/reasoning
schema = 2
base_model = "alibaba/qwen3.6-27b"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, budget = { min = 128, max = 32_768 } }
structured_output = true

[cost.text.input]
price = 0.44980438

[cost.text.output]
price = 2.69882628
