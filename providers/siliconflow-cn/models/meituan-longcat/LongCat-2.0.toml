# Prices: China pricing page https://www.siliconflow.cn/pricing (SKU billing rows, CNY per 1M tokens, accessed 2026-10-31),
# converted to USD and rounded to 8 decimals. CNY→USD rate: 6.669566, 2026-10-31,
# source: https://open.er-api.com/v6/latest/USD
# CNY: input 5, output 20, cache read 0.1
# Catalog (same page, model row, 2026-10-31): contextLen 1048576, functionCallSupport, jsonModeSupport.
# Budget: thinking_budget (integer reasoning tokens, 128..32768). SiliconFlow documents thinking_budget for all
#   reasoning models and lists enable_thinking only for specific models (LongCat-2.0 not among them), so no toggle;
#   reasoning_effort is not listed for it. Same controls as the global siliconflow file for this model.
#   https://docs.siliconflow.com/en/api-reference/chat-completions/chat-completions (2026-10-31)
schema = 2
base_model = "meituan/longcat-2.0"

[capabilities]
reasoning = { supported = true, budget = { min = 128, max = 32_768 } }
structured_output = true

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.74967397
cache = { read = 0.01499348 }

[cost.text.output]
price = 2.99869587
