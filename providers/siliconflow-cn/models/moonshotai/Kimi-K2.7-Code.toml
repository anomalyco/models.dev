# Prices: China pricing page https://www.siliconflow.cn/pricing (SKU billing rows, CNY per 1M tokens, accessed 2026-10-31),
# converted to USD and rounded to 8 decimals. CNY→USD rate: 6.669566, 2026-10-31,
# source: https://open.er-api.com/v6/latest/USD
# CNY: input 6.5, output 27, cache read 1.3
# Catalog (same page, model row, 2026-10-31): contextLen 262144, vlm, functionCallSupport, jsonModeSupport.
# Modalities: image input only (no video), as on the siliconflow-cn Pro/moonshotai/Kimi-K2.6 and siliconflow Kimi-K2.7-Code
# peers; image formats are the lab's.
# Reasoning: no caller control, like the first-party Moonshot entry and the siliconflow-cn Kimi-K2.6 peer (not listed for
# enable_thinking or reasoning_effort; the reasoning guide says only the Qwen3 series enforces thinking_budget).
# https://docs.siliconflow.cn/docs/userguide/capabilities/reasoning
schema = 2
base_model = "moonshotai/kimi-k2.7-code"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.97457616
cache = { read = 0.19491523 }

[cost.text.output]
price = 4.04823942
