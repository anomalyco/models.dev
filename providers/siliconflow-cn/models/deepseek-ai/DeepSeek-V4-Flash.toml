# Effort: reasoning_effort = "high"|"max" (default high; low|medium map to high, xhigh to max).
# The China schema lists reasoning_effort for Pro/deepseek-ai/DeepSeek-V4, this model and
# Pro/zai-org/GLM-5.2 (accessed 2026-10-21).
# https://docs.siliconflow.cn/cn/api-reference/chat-completions/chat-completions
# Prices: China pricing page https://siliconflow.cn/pricing (CNY per 1M tokens, accessed 2026-10-21),
# converted to USD and rounded to 8 decimals. CNY→USD rate: 6.691314, 2026-10-21,
# source: https://open.er-api.com/v6/latest/USD
# CNY: input 3, output 9, cache read 0.3; off-peak 02:00-08:00 Beijing (18:00-24:00 UTC) is half price
# thinking_budget is not listed: the China reasoning guide says only the Qwen3 series enforces it and other
# models may keep thinking past it (https://docs.siliconflow.cn/docs/userguide/capabilities/reasoning).
schema = 2
base_model = "deepseek/deepseek-v4-flash"

[capabilities]
reasoning = { supported = true, effort = ["high", "max"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.44834243
cache = { read = 0.04483424 }

[cost.text.output]
price = 1.3450273

[[cost.multipliers]]
when = { utc_hours = { gte = "18:00" } }
factor = 0.5
