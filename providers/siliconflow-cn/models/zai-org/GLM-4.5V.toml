# Prices: China pricing page https://www.siliconflow.cn/pricing (SKU billing rows, CNY per 1M tokens, accessed 2026-10-31),
# converted to USD and rounded to 8 decimals. CNY→USD rate: 6.669566, 2026-10-31,
# source: https://open.er-api.com/v6/latest/USD
# CNY: input 1, output 6 (no cache price listed)
# Catalog (same page, model row, 2026-10-31): contextLen 65536, vlm, functionCallSupport; jsonModeSupport false.
# Modalities: image input only, per the China multimodal guide (GLM: image only); image formats are the lab's.
# Toggle: enable_thinking = true|false (top-level request field); the API schema lists zai-org/GLM-4.5V for it.
# https://docs.siliconflow.cn/cn/api-reference/chat-completions/chat-completions
schema = 2
base_model = "zhipuai/glm-4.5v"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }

[limit]
context = 65_536

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.14993479

[cost.text.output]
price = 0.89960876
