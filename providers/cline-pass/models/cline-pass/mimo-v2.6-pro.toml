# Model ID cline-pass/mimo-v2.6-pro; reference pricing from the Cline model
# catalog https://api.cline.bot/api/v1/ai/cline/models (accessed 2026-09-22):
# $0.435 / $0.87 / $0.0036 per 1M tokens (input/output/cache read).
# Wire evidence (2026-09-22): POST /api/v1/chat/completions accepts
# reasoning_effort = none|low|medium|high|xhigh|minimal|max (HTTP 200) and
# rejects unknown levels (HTTP 500). An effect probe (reasoning_tokens per
# response) shows no measurable difference for minimal/max, so this file
# declares the established same-host peer set used by cline-pass/mimo-v2.5-pro
# (none, low, medium, high, xhigh).
# Retired: absent from the model list on https://docs.cline.bot/getting-started/clinepass (accessed 2026-10-21).
schema = 2
base_model = "xiaomi/mimo-v2.6-pro"
status = "deprecated"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }

[cost.text.input]
price = 0.435
cache = { read = 0.0036 }

[cost.text.output]
price = 0.87
