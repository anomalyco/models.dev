# ClinePass limits and reasoning levels: https://github.com/cline/cline/blob/72b3d7140553a733242126e51a7c2e87efe75c64/sdk/packages/llms/src/catalog/catalog.generated.ts#L29960-L29993
# Reference rates: https://docs.cline.bot/getting-started/clinepass#reference-pricing
# Peak hours and holiday exclusions: https://api-docs.deepseek.com/quick_start/pricing/
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 1_048_576
output = 393_216

[cost.text.input]
price = 0.15
cache = { read = 0.003 }

[cost.text.output]
price = 0.60

[[cost.multipliers]]
when = { utc_days = { in = ["mon", "tue", "wed", "thu", "fri"] }, not = { holiday = { equals = "CN" } }, any = [{ all = [{ utc_hours = { gte = "01:00" } }, { utc_hours = { lt = "04:00" } }] }, { all = [{ utc_hours = { gte = "06:00" } }, { utc_hours = { lt = "10:00" } }] }] }
factor = 2
