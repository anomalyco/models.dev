# Model ID cline-pass/mimo-v2.6-flash; reference pricing from the Cline model
# catalog https://api.cline.bot/api/v1/ai/cline/models (accessed 2026-09-22):
# $0.14 / $0.28 / $0.0028 per 1M tokens (input/output/cache read).
# Wire evidence (2026-09-22): POST /api/v1/chat/completions accepts
# reasoning_effort = none|low|medium|high|xhigh|minimal|max (HTTP 200) and
# rejects unknown levels (HTTP 500). An effect probe (3 trials per level,
# reasoning_tokens per response) shows no measurable difference for
# minimal/max, so this file declares the established same-host peer set
# used by cline-pass/mimo-v2.5* (none, low, medium, high, xhigh).
# Restored (2026-10-23): the serving API still offers this model even though
# the docs page omits it. GET https://api.cline.bot/api/v1/models lists
# xiaomi/mimo-v2.6-flash, and POST /api/v1/chat/completions with
# model = "cline-pass/mimo-v2.6-flash" returns HTTP 200 (non-streaming;
# reasoning-controlled Cline API key). The docs page
# https://docs.cline.bot/getting-started/clinepass does not list it
# (accessed 2026-10-23); the serving API is treated as authoritative.
schema = 2
base_model = "xiaomi/mimo-v2.6-flash"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }

[cost.text.input]
price = 0.14
cache = { read = 0.0028 }

[cost.text.output]
price = 0.28
