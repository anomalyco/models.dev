# Model ID cline-pass/muse-spark-1.3-contributor. Cline publishes no ClinePass
# reference rate for this model (https://docs.cline.bot/getting-started/clinepass,
# accessed 2026-09-22), so cost uses the Meta reference rates from
# https://dev.meta.ai/docs/pricing-rate-limits: $0.10 / $0.20 / $0.002 per 1M tokens.
base_model = "meta/muse-spark-1.3"
name = "Muse Spark 1.3 Contributor"

reasoning_options = [{ type = "effort", values = ["minimal", "low", "medium", "high", "xhigh"] }]

[cost]
input = 0.10
output = 0.20
cache_read = 0.002
