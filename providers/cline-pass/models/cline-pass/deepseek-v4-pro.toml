# https://docs.cline.bot/getting-started/clinepass
# https://api-docs.deepseek.com/guides/thinking_mode/ (OpenAI: thinking.type + reasoning_effort)
# First-party DeepSeek Pro: effort high|max (lab providers/deepseek/models/deepseek-v4-pro.toml)
# Effort: reasoning_effort = none|high|max (none disables thinking)
# Reference price (accessed 2026-10-21): https://docs.cline.bot/getting-started/clinepass links DeepSeek's peak/off-peak pricing (https://api-docs.deepseek.com/quick_start/pricing). Base = off-peak; peak (01:00-04:00 and 06:00-10:00 UTC, Mon-Fri, excluding Chinese public holidays) is double, as in providers/deepseek.
# Peak 1.32 / 0.044 / 3.96, off-peak 0.66 / 0.022 / 1.98 (input / cache read / output).
schema = 2
base_model = "deepseek/deepseek-v4-pro"

[capabilities]
reasoning = { supported = true, effort = ["none", "high", "max"] }
structured_output = true

[cost.text.input]
price = 0.66
cache = { read = 0.022 }

[cost.text.output]
price = 1.98

[[cost.multipliers]]
when = { utc_days = { in = ["mon", "tue", "wed", "thu", "fri"] }, not = { holiday = { equals = "CN" } }, any = [{ all = [{ utc_hours = { gte = "01:00" } }, { utc_hours = { lt = "04:00" } }] }, { all = [{ utc_hours = { gte = "06:00" } }, { utc_hours = { lt = "10:00" } }] }] }
factor = 2
