# Pendra serves open-weight models on GPU workers that customers connect to their
# own account, behind an OpenAI-compatible API. The model list is per account:
# GET /api/v1/models returns the models the account's workers serve right now.
# https://pendra.ai/docs/integrations/opencode
# https://pendra.ai/docs/api/models
name = "Pendra"
env = ["PENDRA_API_KEY"]
npm = "@ai-sdk/openai-compatible"
opencodeai = "@opencode/ai/providers/openai-compatible"
api = "https://api.pendra.ai/api/v1"
doc = "https://pendra.ai/docs/integrations/opencode"
