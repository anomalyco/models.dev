# Input: text and PNG, JPEG, GIF or BMP images, plus WebP from worker v3.146.0 (older workers fail on it). Pendra's workers decode the image for every vision model, so other formats (TIFF, animated WebP) fail, and take no audio or video.
# Tool choice: auto, none, required or a named tool. Pendra forces required and named calls with a grammar.
# Effort: reasoning_effort = none|low|medium|high (none turns thinking off, as does enable_thinking = false). In the prompt Pendra maps the other words: minimal → none, xhigh → high, max → high.
# Default: a request that sends no reasoning_effort gets the high level (catalogue reasoning_controls).
# Budget: none. Pendra cannot move this model on to its answer part-way through thinking (catalogue reasoning_controls).
# Reasoning field: reasoning_content in replies; send it back on assistant turns in that field.
# Cache: implicit. Workers reuse a repeated prompt prefix with no markers (cached_tokens in usage).
# Context: the lab's window is the most Pendra serves; a worker may run a smaller window sized to its memory.
# Generated from Pendra's model catalogue (served at https://api.pendra.ai/api/v1/catalogue)
# Thinking controls: https://pendra.ai/docs/capabilities/thinking
# Self-hosted on your own workers: no per-token or per-request charge at the API.
schema = 2
base_model = "meta/muse-glimmer-30b"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/gif", "image/bmp"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"], default = { type = "effort", value = "high" } }
structured_output = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0

[cost.text.output]
price = 0
