# Toggle: enable_thinking true|false
# Input: text and PNG, JPEG, GIF or BMP images only. Pendra's workers decode the image for every vision model (WebP and TIFF fail) and take no audio or video.
# Budget: Pendra's reasoning.max_tokens is not listed: the worker ends thinking early only on think-block models.
# Output: up to the 262,144-token window: a reply may run until the window is full, and a larger max_tokens is accepted (32,768 is the default when a request sets none).
# Generated from Pendra's public catalogue: https://api.pendra.ai/api/v1/catalogue
# Thinking controls: https://pendra.ai/docs/capabilities/thinking
# Self-hosted on your own workers: no per-token or per-request charge at the API.
schema = 2
base_model = "deepreinforce/ornith-1.5-35b-a3b"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/gif", "image/bmp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, default = { type = "toggle", value = true }, toggle = true }
structured_output = true

[limit]
output = 262_144

[cost.text.input]
price = 0

[cost.text.output]
price = 0
