# Tool choice: auto, none, required or a named tool. Pendra forces required and named calls with a grammar.
# Toggle: enable_thinking = true|false
# Default: thinking on when a request does not say (catalogue reasoning_controls).
# Effort: no levels of its own. reasoning_effort none or minimal turns thinking off; low, medium, high, xhigh or max turns it on and adds nothing to the prompt; the default thinking budget follows the word sent.
# Budget: reasoning.max_tokens. Pendra closes the thinking itself at the budget and the model moves on to its answer: a host control, not the lab's API. With no reasoning.max_tokens current workers apply a default budget sized by reasoning_effort: https://pendra.ai/docs/capabilities/thinking#default-budget
# Reasoning field: reasoning_content in replies; send it back on assistant turns in that field.
# Cache: implicit. Workers reuse a repeated prompt prefix with no markers (cached_tokens in usage).
# Context: 131,072 tokens, the most Pendra serves (catalogue context_length); a worker may run a smaller window sized to its memory.
# Output: 131,072, the context window (an output cannot outgrow it).
# Generated from Pendra's model catalogue (served at https://api.pendra.ai/api/v1/catalogue)
# Thinking controls: https://pendra.ai/docs/capabilities/thinking
# Self-hosted on your own workers: no per-token or per-request charge at the API.
schema = 2
base_model = "nvidia/nemotron-3-nano-30b-a3b"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, toggle = true, default = { type = "toggle", value = true }, budget = {} }
structured_output = true
cache = { implicit = true }

[limit]
context = 131_072
output = 131_072

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0

[cost.text.output]
price = 0
