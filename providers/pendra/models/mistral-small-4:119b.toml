# Input: Pendra takes text and PNG, JPEG, GIF or BMP images only on chat completions.
# Reasoning: Pendra serves this model without thinking (no reasoning output).
# Generated from Pendra's public catalogue: https://api.pendra.ai/api/v1/catalogue
# Thinking controls: https://pendra.ai/docs/capabilities/thinking
# Self-hosted on your own workers: no per-token charge at the API.
schema = 2
base_model = "mistral/mistral-small-2603"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/gif"]
output = ["text"]

[capabilities]
reasoning = { supported = false }
structured_output = true

[cost.text.input]
price = 0

[cost.text.output]
price = 0
