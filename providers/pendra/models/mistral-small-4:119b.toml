# Input: text and PNG, JPEG, GIF or BMP images, plus WebP from worker v3.146.0 (older workers fail on it). Pendra's workers decode the image for every vision model, so other formats (TIFF, animated WebP) fail, and take no audio or video.
# Tool choice: auto, none, required or a named tool. Pendra forces required and named calls with a grammar.
# Effort: reasoning_effort = none|high (none turns thinking off, as does enable_thinking = false). In the prompt Pendra maps the other words: minimal → none, low → high, medium → high, xhigh → high, max → high. The default thinking budget follows the word sent.
# Default: thinking off (reasoning_effort = none) when a request sends no level (catalogue reasoning_controls).
# Budget: reasoning.max_tokens. Pendra closes the thinking itself at the budget and the model moves on to its answer: a host control, not the lab's API. With no reasoning.max_tokens current workers apply a default budget sized by reasoning_effort: https://pendra.ai/docs/capabilities/thinking#default-budget
# Reasoning field: reasoning_content in replies; send it back on assistant turns in that field.
# Cache: implicit. Workers reuse a repeated prompt prefix with no markers (cached_tokens in usage).
# Context: the lab's window is the most Pendra serves; a worker may run a smaller window sized to its memory.
# Generated from Pendra's model catalogue (served at https://api.pendra.ai/api/v1/catalogue)
# Thinking controls: https://pendra.ai/docs/capabilities/thinking
# Self-hosted on your own workers: no per-token or per-request charge at the API.
schema = 2
base_model = "mistral/mistral-small-2603"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/gif", "image/bmp"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["none", "high"], default = { type = "effort", value = "none" }, budget = {} }
structured_output = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0

[cost.text.output]
price = 0
