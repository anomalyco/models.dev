# Input: Pendra takes text and PNG, JPEG, GIF or BMP images only on chat completions.
# Context: 1,048,576 tokens, the window Pendra serves (catalogue context_length).
# Generated from Pendra's public catalogue: https://api.pendra.ai/api/v1/catalogue
# Self-hosted on your own workers: no per-token charge at the API.
schema = 2
base_model = "meta/llama-4-scout-17b-instruct"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif"]
output = ["text"]

[capabilities]
structured_output = true

[limit]
context = 1_048_576

[cost.text.input]
price = 0

[cost.text.output]
price = 0
