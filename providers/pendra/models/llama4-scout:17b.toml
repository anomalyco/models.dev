# Input: text and PNG, JPEG, GIF or BMP images only. Pendra's workers decode the image for every vision model (WebP and TIFF fail) and take no audio or video.
# Context: 1,048,576 tokens, the window Pendra serves (catalogue context_length).
# Generated from Pendra's public catalogue: https://api.pendra.ai/api/v1/catalogue
# Self-hosted on your own workers: no per-token or per-request charge at the API.
schema = 2
base_model = "meta/llama-4-scout-17b-instruct"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/gif", "image/bmp"]
output = ["text"]

[capabilities]
structured_output = true

[limit]
context = 1_048_576

[cost.text.input]
price = 0

[cost.text.output]
price = 0
