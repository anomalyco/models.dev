# Sources (accessed 2026-11-16):
# https://help.aliyun.com/zh/model-studio/token-plan-personal-overview
# https://help.aliyun.com/zh/model-studio/token-plan-team-overview
# https://help.aliyun.com/zh/model-studio/qwen4-max
# https://help.aliyun.com/zh/model-studio/qwen-api-via-openai-chat-completions
# qwen4-max is listed on both Token Plan editions (Personal and Team).
# Toggle: enable_thinking true|false (hybrid, thinking on by default; Chat Completions; Responses accepts it but plans to drop it in favor of effort). Messages: thinking.type = enabled|disabled.
# Effort: reasoning_effort = low|high|xhigh (Chat Completions), reasoning.effort (Responses), output_config.effort (Messages); default high.
# Aliases (Chat/Responses): minimal→low, medium→high, max→xhigh; none disables thinking. Messages maps medium→high and max→xhigh; off is thinking.type = disabled (none not accepted).
# Budget: thinking_budget (Chat Completions), a positive integer (0 rejected) that cannot be combined with reasoning_effort;
# 1-4,096 maps to low, 4,097-131,072 to high, 131,073-262,144 to xhigh; default 131,072. Messages takes thinking.budget_tokens
# (slated for deprecation); Responses takes no budget.
# Cache: cached tokens are billed at a discount on the shared plan surface; the mechanism isn't documented, so implicit only.
# structured_output and stream_usage: JSON Object/Schema per the model page; json_schema/json_object and
# stream_options.include_usage were probed on token-plan.ap-southeast-1.maas.aliyuncs.com 2026-11-13 with the preview id.
# The CN endpoint wasn't probed, so system_updates and effort_updates are left unset.
# Tools: tool_choice auto|none|named on every API, plus required (`any`) on Anthropic Messages; no strict tool mode (sources in provider.toml).
# Cost: Token Plan Credits subscription; no public USD per-token rate.
schema = 2
base_model = "alibaba/qwen4-max"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "tool"] }
reasoning = { supported = true, default = { type = "effort", value = "high" }, toggle = true, effort = ["low", "high", "xhigh"], budget = { min = 1, max = 262_144 } }
structured_output = true
stream_usage = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/alibaba/responses" }

[api.messages]
base_url = "https://token-plan.cn-beijing.maas.aliyuncs.com/apps/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/alibaba/messages" }
capabilities = { tools = { choice = ["auto", "none", "required", "tool"] } }

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
