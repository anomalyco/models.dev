# Alibaba Token Plan (China / Beijing) lists model ID glm-5.3 (Zhipu AI).
# Subscription plan: no per-token USD price (Credits billing).
# Always-on thinking; effort via reasoning_effort = low|high|max (default max).
# Same control surface as Bailian glm-5.3 / lab peers; thinking cannot be
# disabled (no toggle). Interleaved reasoning on reasoning_content.
# https://docs.bailian.console.aliyun.com/zh/model-studio/token-plan-personal-overview
# https://docs.bailian.console.aliyun.com/zh/model-studio/token-plan-team-overview
# https://docs.z.ai/guides/llm/glm-5.3
schema = 2
base_model = "zhipuai/glm-5.3"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
