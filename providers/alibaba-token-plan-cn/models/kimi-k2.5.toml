# Reasoning HTTP format (accessed 2026-06-25):
# Hybrid model: top-level `enable_thinking` true enables thinking; false is the
# default. `thinking_budget` is an integer token cap; no bounds are documented.
# structured_output: gateway accepts response_format json_schema (probed
# 2026-07-24), so the earlier base_model_omit was wrong and is dropped.
# Output cap 98,304: the enforced max_tokens ceiling (gateway rejects above it);
# a max_tokens=17,000 request truncated at exactly 17,000 (finish_reason=length),
# disproving the console/price-sheet "16K". This differs from k2.6/k2.7-code's
# 262,144 ceiling.
# Sources:
# https://www.alibabacloud.com/help/en/model-studio/kimi-api
# https://www.alibabacloud.com/help/en/model-studio/deep-thinking
# Mid-conversation: tools are a request-level parameter with no add/remove mechanism (tools.updates = false); not probed live (no plan key), so system_updates is left unset. Chat API: https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions (the DeepSeek, Kimi and MiniMax series do not support top_k).
schema = 2
base_model = "moonshotai/kimi-k2.5"
family = "kimi-k2"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true }
structured_output = true
temperature = true
top_k = false

[limit]
output = 98_304

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.messages]
base_url = "https://token-plan.cn-beijing.maas.aliyuncs.com/apps/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/alibaba/messages" }

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
