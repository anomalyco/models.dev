base_model = "alibaba/qwen3.6-plus"
# Reasoning HTTP format (accessed 2026-06-25):
# Hybrid, thinking on by default. Chat/DashScope `enable_thinking`: true|false;
# integer `thinking_budget` maximum 81920; no minimum or disable sentinel is
# documented. Responses instead uses `reasoning.effort` and no numeric budget.
# Reasoning streams in `reasoning_content` (hence [interleaved], added 2026-07-24).
# structured_output: the gateway now accepts response_format json_schema (probed
# 2026-07-24); the base model reports none. Matches sibling qwen3.6-flash.
# Sources:
# https://help.aliyun.com/zh/model-studio/deep-thinking
# https://help.aliyun.com/zh/model-studio/compatibility-with-openai-responses-api

structured_output = true

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "budget_tokens"
max = 81_920

[interleaved]
field = "reasoning_content"

[cost]
input = 0
output = 0
cache_read = 0
cache_write = 0
