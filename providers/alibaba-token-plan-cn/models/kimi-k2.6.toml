# Reasoning HTTP format (accessed 2026-06-25):
# Hybrid model: top-level `enable_thinking` true enables thinking; false is the
# default. `thinking_budget` is an integer token cap; no bounds are documented.
# structured_output: gateway accepts response_format json_schema (probed
# 2026-07-24), so the earlier base_model_omit was wrong and is dropped.
# Output: the prior 16,384 override was wrong. A max_tokens=17,000 request
# truncated at exactly 17,000 (finish_reason=length) and a real run emitted
# 33,718 tokens (finish_reason=stop); max_tokens accepts up to 262,144 and
# rejects 262,145, so output is bounded only by the context window. The override
# is removed so it inherits the base model's 262,144.
# Sources:
# https://www.alibabacloud.com/help/en/model-studio/kimi-api
# https://www.alibabacloud.com/help/en/model-studio/deep-thinking
schema = 2
base_model = "moonshotai/kimi-k2.6"
family = "kimi-k2"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
