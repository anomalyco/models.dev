# Reasoning HTTP format (accessed 2026-08-03):
# This model toggles with `enable_thinking`: true or false. Chat Completions
# `reasoning_effort` accepts high (default) or max; low/medium map to high and
# xhigh maps to max. Anthropic Messages defaults `reasoning_effort` to max.
# Model availability: Token Plan Personal Edition model list (Responses API
# not yet supported on this host).
# Sources:
# https://help.aliyun.com/en/model-studio/token-plan-personal-overview
# https://www.alibabacloud.com/help/en/model-studio/deepseek-api
# https://www.alibabacloud.com/help/en/model-studio/anthropic-api-messages
# Mid-conversation: tools are a request-level parameter with no add/remove mechanism (tools.updates = false); not probed live (no plan key), so system_updates and effort_updates are left unset. Chat API: https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions (the DeepSeek, Kimi and MiniMax series do not support top_k).
schema = 2
base_model = "deepseek/deepseek-v4-flash-0731"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true, effort = ["high", "max"] }
structured_output = true
top_k = false

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/alibaba/responses" }

[api.messages]
base_url = "https://token-plan.cn-beijing.maas.aliyuncs.com/apps/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/alibaba/messages" }

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
