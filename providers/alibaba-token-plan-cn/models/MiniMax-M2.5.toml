# Reasoning HTTP format (accessed 2026-06-25):
# Alibaba-deployed MiniMax-M2.5 is thinking-only. No toggle, effort, or numeric
# reasoning-budget request field is documented for this model.
# Output ceiling 32,768 (probed 2026-07-24: accepts max_tokens 32,768, rejects
# 32,769); the prior 24,576 was wrong.
# Sources:
# https://help.aliyun.com/zh/model-studio/deep-thinking
# Mid-conversation: tools are a request-level parameter with no add/remove mechanism (tools.updates = false); not probed live (no plan key), so system_updates is left unset. Chat API: https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions (the DeepSeek, Kimi and MiniMax series do not support top_k).
schema = 2
base_model = "minimax/MiniMax-M2.5"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
top_k = false
effort_updates = false

[limit]
context = 196_608
input = 196_601
output = 32_768

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.messages]
base_url = "https://token-plan.cn-beijing.maas.aliyuncs.com/apps/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/alibaba/messages" }

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
