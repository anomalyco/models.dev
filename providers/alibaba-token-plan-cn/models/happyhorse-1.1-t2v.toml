# HappyHorse 1.1 text-to-video. Served on the ASYNC video-synthesis endpoint,
# not the OpenAI-compatible /models list: POST
# https://token-plan.cn-beijing.maas.aliyuncs.com/api/v1/services/aigc/video-generation/video-synthesis
# with header `X-DashScope-Async: enable`, then poll GET /api/v1/tasks/{task_id}.
# Entitlement confirmed live 2026-07-24 on both Token Plan tiers (Singapore probe;
# China shares the catalogue). Credit-billed (prepaid), so per-token cost is 0.
# Params: resolution 720P/1080P, ratio, duration 3-15s.
# Sources:
# https://help.aliyun.com/zh/model-studio/happyhorse-text-to-video-api-reference
# https://help.aliyun.com/zh/model-studio/token-plan-overview
