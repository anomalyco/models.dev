# HappyHorse 1.1 text-to-video. Served on the ASYNC video-synthesis endpoint,
# not the OpenAI-compatible /models list: POST
# https://token-plan.cn-beijing.maas.aliyuncs.com/api/v1/services/aigc/video-generation/video-synthesis
# with header `X-DashScope-Async: enable`, then poll GET /api/v1/tasks/{task_id}.
# Entitlement confirmed live 2026-07-24 on both Token Plan tiers (Singapore probe;
# China shares the catalogue). Credit-billed (prepaid), so per-token cost is 0.
# Params: resolution 720P/1080P, ratio, duration 3-15s.
# Sources:
# https://help.aliyun.com/zh/model-studio/happyhorse-text-to-video-api-reference
# https://help.aliyun.com/zh/model-studio/token-plan-overview
# Type: video generation model (https://help.aliyun.com/zh/model-studio/token-plan-team-overview).
# MIME types: input images JPEG, JPG, PNG, WEBP (the doc's image/jpeg, image/png, image/webp); output MP4 (H.264), per https://www.alibabacloud.com/help/en/model-studio/happyhorse-text-to-video-api-reference.
# API: async POST /api/v1/services/aigc/video-generation/video-synthesis (https://help.aliyun.com/zh/model-studio/token-plan-multimodal-gen); base_url is @ai-sdk/alibaba's videoBaseURL
schema = 2
type = "video"
name = "HappyHorse 1.1 Text-to-Video"
description = "Video model for prompt-driven text-to-video generation"
open_weights = false
release_date = "2026-07-17"

[modalities]
input = ["text"]
output = ["video/mp4"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = true

[limit]
context = 0
output = 0

[api.videos]
base_url = "https://token-plan.cn-beijing.maas.aliyuncs.com"
sdk = { aisdk = "@ai-sdk/alibaba", opencodeai = "none" }

[cost.text.input]
price = 0

[cost.text.output]
price = 0
