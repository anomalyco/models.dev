# Reasoning HTTP format (accessed 2026-07-20):
# The OpenAI plan base .../compatible-mode/v1 uses POST /chat/completions.
# Hybrid-thinking models use top-level `enable_thinking` and `thinking_budget`.
# qwen3.8-max-preview is always thinking and instead accepts either the canonical
# `reasoning_effort` values low, medium, and xhigh or `thinking_budget` from 0 to
# 262144. The two controls are mutually exclusive; zero maps to low effort and
# does not disable thinking.
# POST /responses uses `reasoning.effort`: none, minimal, low, medium, or high;
# `thinking_budget` is not accepted there. Anthropic plan base .../apps/anthropic
# uses POST /v1/messages with `thinking.type`: enabled or disabled, integer
# `thinking.budget_tokens`, and DeepSeek V4-only `reasoning_effort`: high or max.
# Sources:
# https://platform.qianwenai.com/docs/api-reference/chat/openai-chat
# https://platform.qianwenai.com/docs/developer-guides/text-generation/thinking
# https://help.aliyun.com/zh/model-studio/token-plan-quickstart
# https://help.aliyun.com/zh/model-studio/deep-thinking
# https://help.aliyun.com/zh/model-studio/compatibility-with-openai-responses-api
# https://www.alibabacloud.com/help/en/model-studio/anthropic-api-messages

name = "Alibaba Token Plan (China)"
env = ["ALIBABA_TOKEN_PLAN_API_KEY"]
npm = "@ai-sdk/openai-compatible"
opencodeai = "@opencode/ai/providers/alibaba/chat"
# Tools (docs accessed 2026-10-26): tool_choice by API.
# - Chat Completions: auto, none, required and a named function. Qwen models don't support required
#   (https://www.alibabacloud.com/help/en/model-studio/qwen-function-calling,
#   https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions).
# - Responses: auto, none, and allowed_tools with mode required, which forces one named tool. A plain
#   required needs exactly one tool in the request ("Please set one tool" otherwise), so it isn't listed
#   (https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-responses).
# - Anthropic Messages: auto, any (required), none and tool
#   (https://www.alibabacloud.com/help/en/model-studio/anthropic-api-messages).
# Model files with several APIs set the values most of their APIs share and override the API that differs:
# Qwen gets auto|none|tool with required added on [api.messages]; DeepSeek and Kimi K3 get all four with
# required removed on [api.responses].
# Live on dashscope-intl 2026-10-26 ("Say hi." with two tools, forcing the tool the prompt doesn't need):
# - Hybrid Qwen models reject required and named choices in thinking mode on every API (400 "does not
#   support being set to required or object in thinking mode") or accept and ignore them; with thinking off
#   (enable_thinking = false, reasoning.effort = "none", thinking.type = "disabled") they force the call.
#   Qwen also forced a call with required on Chat Completions, but the docs say it can't guarantee one, so
#   it isn't listed there.
# - qwen-max forces a named tool but ignores required and Messages any, so it lists auto|none|tool.
# - These accept required and named choices but ignore them on every API, so they keep auto|none:
#   glm-5.1, glm-5.2, glm-5.3, kimi-k2.7-code, qwen3-omni-flash, qwen3-vl-30b-a3b, qwen3-vl-plus,
#   qwen3.7-max, and qwen3.8-2.4t-a95b (always thinks).
# - glm-5, kimi-k2.5, kimi-k2.6 and MiniMax-M2.5 aren't served on dashscope-intl, so they keep auto|none.
# Single-API (Chat Completions only) models still list auto|none. No strict flag for function tools is
# documented. Realtime models don't support tool_choice.
doc = "https://www.alibabacloud.com/help/zh/model-studio/token-plan-overview"
api = "https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
