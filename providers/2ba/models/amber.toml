# Model ID "amber" as used in the request field of
# POST https://api.2ba.ai/v1/chat/completions (https://2ba.ai/docs, accessed 2026-09-29).
# 2BA describes amber as its default multimodal coding model with text and
# vision input (https://2ba.ai/static/llms.txt, accessed 2026-09-29).
# Earliest public documentation is the SWE-bench Verified run dated
# 2026-09-02 (https://2ba.ai/quality).
# Context: serving stack runs --max-model-len 262144; no separate output
# cap is published, so served output is bounded by the same window.
# Flat-rate subscription, so no [cost] block.
name = "amber"
description = "2BA's default multimodal coding model for coding agents, with text and vision input."
attachment = true
reasoning = true
tool_call = true
open_weights = false
release_date = "2026-09-02"
last_updated = "2026-09-29"

[limit]
context = 262_144 # provider states 256k context window
output = 262_144 # no separate output cap; served output bounded by the 256k window

[modalities]
input = ["text", "image"]
output = ["text"]

[[reasoning_options]]
type = "effort"
# Wire contract (chat template): canonical effort tiers low, medium, high,
# xhigh (default medium). Aliases on the wire: max resolves to xhigh,
# minimal/none to low. Ultra is an internal tier alias of xhigh and is not
# part of the public API contract.
values = ["low", "medium", "high", "xhigh"]

[interleaved]
field = "reasoning_content"
