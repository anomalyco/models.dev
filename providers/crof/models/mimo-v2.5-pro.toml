base_model = "xiaomi/mimo-v2.5-pro"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high"]

[cost]
input = 0.4
output = 0.8
cache_read = 0.003

[[cost.tiers]]
tier = { type = "context", size = 256_000 }
input = 2
output = 6
cache_read = 0.4

[limit]
context = 1_000_000

[provider]
npm = "@ai-sdk/openai-compatible"
