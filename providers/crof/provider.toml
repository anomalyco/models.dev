# Cache key (chat): automatic prefix reuse with usage cached_tokens and cost reporting
# Use headers: repeat the stable prefix with identical model and params
# Use body: repeat the stable prefix with identical model and params
# Cache policy: stable prefix + same model; keep system prompt and leading messages byte-identical and append-only
# Docs: https://crof.ai/docs.md
name = "CrofAI"
env = ["CROF_API_KEY"]
npm = "@ai-sdk/openai-compatible"
# Raw OpenAI Chat is POST `/v1/chat/completions` (also `/v2/chat/completions`);
# Anthropic compatibility is POST `https://anthropic.nahcrof.com/v1/messages`.
# Chat accepts `reasoning_effort = none|low|medium|high`; `none` disables
# reasoning. No reasoning-token budget field is documented.
# https://crof.ai/docs.md (accessed 2026-06-25)
api = "https://crof.ai/v1"
doc = "https://crof.ai/docs"