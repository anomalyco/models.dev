# Cost from https://klokintegration.se/docs/ai-api (email-token rate):
# €0.20 input / €1.00 output per MTok. EUR/USD 1.1583 (2026-08-28) → 0.23 / 1.16 USD.
# Context 200k and max output 50k from Klok.
# Gateway appends Klok practice to the system prompt and runs lookup tools server-side.
schema = 2
name = "Kloker Integration Developer"
description = "Knows the customer integration environment and Klok best practices. Opinionated about implementation. The gateway runs ecosystem lookup tools server-side and appends a system-prompt injection. Client system prompts and OpenAI tool calls are preserved."
open_weights = false
release_date = "2026-08-29"
status = "beta"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
structured_output = false
temperature = true

[limit]
context = 200_000
output = 50_000

[cost.text.input]
price = 0.23

[cost.text.output]
price = 1.16
