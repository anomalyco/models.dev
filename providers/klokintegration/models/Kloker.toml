# Cost from https://klokintegration.se/docs/ai-api (email-token rate):
# €0.20 input / €1.00 output per MTok. EUR/USD 1.1583 (2026-08-28) → 0.23 / 1.16 USD.
# Context 200k and max output 50k from Klok.
schema = 2
name = "Kloker"
description = "Cheap general model with a clean context. Nothing from the customer environment is packed in. It tracks the current best open source model. The Klok team verifies it and upgrades it periodically."
open_weights = false
release_date = "2026-08-29"
status = "beta"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
structured_output = false
temperature = true

[limit]
context = 200_000
output = 50_000

[cost.text.input]
price = 0.23

[cost.text.output]
price = 1.16
