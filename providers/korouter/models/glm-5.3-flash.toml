# Prices read from https://korouter.ai/models/glm-5.3-flash on 2026-10-30 (the same catalog that bills requests).
# Host surface: OpenAI-compatible chat completions at https://korouter.ai/v1.
# Effort: reasoning_effort = low|high|max
# No toggle: reasoning is always on for this model here — reasoning.enabled=false and reasoning_effort=none both return 400 "Reasoning is mandatory for this endpoint and cannot be disabled."
# Live-tested 2026-10-30: the two off attempts above → 400; reasoning.enabled=true → reasoning returned; thinking.type=disabled|enabled → no consistent effect (reasoning appeared or not regardless of the value), so it is not a control; reasoning_effort=bogus → upstream 400 (forwarded as-is).
# Cache: automatic upstream prefix caching — live 2026-10-30: repeating a 12–15K-token prefix read it back as cached_tokens on the second request (deepseek-v4.1-flash 12288, glm-5.3 15104, kimi-k3 12288).
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
cache = { implicit = true }

[cost.text.input]
price = 0.0735
cache = { read = 0.0147 }

[cost.text.output]
price = 0.245
