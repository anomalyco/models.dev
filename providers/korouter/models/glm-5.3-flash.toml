# Prices read from https://korouter.ai/models/glm-5.3-flash on 2026-11-16 (the same catalog that bills requests).
# Host surface: OpenAI-compatible chat completions at https://korouter.ai/v1.
# Effort: reasoning_effort = low|high|max — live 2026-11-16, three runs each on the same prompt: max produced clearly longer reasoning than low/high (glm-5.3 91–320 vs 26–44 completion tokens; glm-5.3-flash 47–94 vs 26–33).
# No toggle: reasoning.enabled=false, reasoning_effort=none and thinking.type=disabled still returned reasoning text (live 2026-11-16), so reasoning cannot be reliably turned off here.
# Cache: automatic upstream prefix caching — live 2026-11-16: repeating an 18–20K-token prefix read it back as cached_tokens on the second request (deepseek-v4.1-flash 17408, glm-5.3 19840, glm-5.3-flash 19840, kimi-k3 17664).
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
cache = { implicit = true }

[cost.text.input]
price = 0.0735
cache = { read = 0.0147 }

[cost.text.output]
price = 0.245
