# Prices read from https://korouter.ai/models/claude-sonnet-5 on 2026-10-06 (the same catalog that bills requests).
# Host surface: OpenAI-compatible chat completions at https://korouter.ai/v1.
# Toggle: thinking.type = enabled|disabled (Anthropic-native thinking object, accepted on chat completions)
# Effort: reasoning_effort = low|medium|high|xhigh|max → output_config.effort (none is rejected upstream)
base_model = "anthropic/claude-sonnet-5"
reasoning_options = [
  { type = "toggle" },
  { type = "effort", values = [
    "low",
    "medium",
    "high",
    "xhigh",
    "max",
  ] },
]

[cost]
input = 1.30
output = 6.50
cache_read = 0.13
cache_write = 1.63
