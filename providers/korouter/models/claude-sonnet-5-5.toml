# KoRouter serves claude-sonnet-5-5 at 35% below the Anthropic list price.
# Prices read from https://korouter.ai/models on 2026-10-06 (the same catalog that bills requests).
base_model = "anthropic/claude-sonnet-5-5"
reasoning_options = [
  { type = "effort", values = ["low", "medium", "high", "xhigh", "max"] },
]

[cost]
input = 1.30
output = 6.50
cache_read = 0.13
cache_write = 1.63
