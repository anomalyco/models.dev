# Prices read from https://korouter.ai/models/claude-opus-5 on 2026-10-07 (the same catalog that bills requests).
# Host surface: OpenAI-compatible chat completions at https://korouter.ai/v1.
# Effort: reasoning_effort = low|medium|high|xhigh|max → output_config.effort; medium and above also send thinking.type = enabled with a budget; low or no reasoning_effort sends no thinking block (the value none is rejected upstream)
# No toggle: the /v1 chat-completions parser reads only reasoning_effort; the thinking object and reasoning.enabled are dropped before the upstream call.
base_model = "anthropic/claude-opus-5"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 3.25
output = 16.25
cache_read = 0.325
cache_write = 4.06
