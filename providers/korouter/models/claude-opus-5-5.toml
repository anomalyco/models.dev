# Prices read from https://korouter.ai/models/claude-opus-5-5 on 2026-10-30 (the same catalog that bills requests).
# Host surface: OpenAI-compatible chat completions at https://korouter.ai/v1.
# Effort: reasoning_effort = low|medium|high|xhigh|max → output_config.effort (adaptive thinking; none is rejected)
# No toggle: thinking.type other than adaptive / between_tools is rejected on this host.
schema = 2
base_model = "anthropic/claude-opus-5-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 2.60
cache = { read = 0.13, write = 3.25 }

[cost.text.output]
price = 13.00
