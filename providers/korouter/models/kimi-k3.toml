# KoRouter serves kimi-k3 at 30% below the Kimi list price.
# Prices read from https://korouter.ai/models on 2026-10-06 (the same catalog that bills requests).
base_model = "moonshotai/kimi-k3"
reasoning_options = [
  { type = "effort", values = ["low", "high", "max"] },
]

[cost]
input = 2.10
output = 10.50
cache_read = 0.21
cache_write = 2.10
