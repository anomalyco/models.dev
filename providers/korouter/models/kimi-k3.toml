# Prices read from https://korouter.ai/models/kimi-k3 on 2026-11-16 (the same catalog that bills requests).
# Host surface: OpenAI-compatible chat completions at https://korouter.ai/v1.
# Effort: reasoning_effort = low|high|max — live 2026-11-16, three runs each on the same prompt: low 34–42 completion tokens, high 69–296, max 284–369.
# No toggle: reasoning.enabled=false, reasoning_effort=none and thinking.type=disabled all still returned reasoning (live 2026-11-16).
# Unknown effort values are not rejected here (reasoning_effort=bogus → 200).
# Cache: automatic upstream prefix caching — live 2026-11-16: repeating an 18–20K-token prefix read it back as cached_tokens on the second request (deepseek-v4.1-flash 17408, glm-5.3 19840, glm-5.3-flash 19840, kimi-k3 17664).
schema = 2
base_model = "moonshotai/kimi-k3"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
cache = { implicit = true }

[cost.text.input]
price = 1.62
cache = { read = 0.162, write = 1.62 }

[cost.text.output]
price = 8.10
