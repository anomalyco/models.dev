# Prices read from https://korouter.ai/models/claude-haiku-4-5 on 2026-10-30 (the same catalog that bills requests).
# Host surface: OpenAI-compatible chat completions at https://korouter.ai/v1.
# No reasoning on this surface: reasoning_effort becomes output_config.effort, which the upstream rejects ("This model does not support the effort parameter"), and the thinking object is dropped.
# No toggle: the /v1 chat-completions parser reads only reasoning_effort; the thinking object and reasoning.enabled are dropped before the upstream call.
# Live-tested 2026-10-07: reasoning_effort=low → 400 "This model does not support the effort parameter."; thinking.type=enabled + budget_tokens=10 → 200 and reasoning.enabled=true → 200 (both dropped before the upstream call).
# Re-tested 2026-10-30: thinking.type=enabled + budget_tokens=1024 (max_tokens 4096) → 200 with no reasoning in the reply.
# Cache: automatic on /v1, no cache_control markers needed — live 2026-10-30 (claude-sonnet-5): three identical 18.9K-token requests → cache_creation_tokens 18926, then cached_tokens 18926 twice.
schema = 2
base_model = "anthropic/claude-haiku-4-5"

[capabilities]
reasoning = { supported = false }
cache = { implicit = true }

[cost.text.input]
price = 0.65
cache = { read = 0.065, write = 0.8125 }

[cost.text.output]
price = 3.25
