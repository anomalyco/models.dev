# Prices read from https://korouter.ai/models/deepseek-v4.1-flash on 2026-10-30 (the same catalog that bills requests).
# Host surface: OpenAI-compatible chat completions at https://korouter.ai/v1.
# Effort: reasoning_effort (or reasoning.effort) = none|low|high|max; none turns reasoning off.
# No separate toggle: reasoning.enabled = false has the same effect as effort none, so off is authored as effort none (AGENTS.md: effort with none, no toggle).
# Forwarded unchanged to the upstream OpenAI-compatible endpoint; DeepSeek-native thinking.type is not honoured on this surface.
# Live-tested 2026-10-30: reasoning_effort=none → 0 reasoning tokens; reasoning.enabled=false → 0 reasoning tokens; reasoning.enabled=true → reasoning returned; reasoning.effort=bogus → upstream 400 listing the accepted values (forwarded as-is).
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }

[cost.text.input]
price = 0.066
cache = { read = 0.00132 }

[cost.text.output]
price = 0.264
