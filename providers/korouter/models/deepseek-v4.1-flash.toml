# Prices read from https://korouter.ai/models/deepseek-v4.1-flash on 2026-11-16 (the same catalog that bills requests).
# Host surface: OpenAI-compatible chat completions at https://korouter.ai/v1.
# Reasoning: on by default on this route. reasoning_effort = low|high|max is accepted and forwarded, but three live runs each (2026-11-16) showed no distinct effect (86–125 completion tokens at every level on the same prompt), so no effort list is claimed.
# No toggle claimed: reasoning.enabled=false, reasoning_effort=none and thinking.type=disabled cut reasoning to 0 tokens in one live run and were ignored in a later one (2026-11-16, the same at the upstream as through korouter.ai), so turning reasoning off is not guaranteed here.
# Cache: automatic upstream prefix caching — live 2026-11-16: repeating an 18–20K-token prefix read it back as cached_tokens on the second request (deepseek-v4.1-flash 17408, glm-5.3 19840, glm-5.3-flash 19840, kimi-k3 17664).
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[capabilities]
reasoning = { supported = true }
cache = { implicit = true }

[cost.text.input]
price = 0.066
cache = { read = 0.00132 }

[cost.text.output]
price = 0.264
