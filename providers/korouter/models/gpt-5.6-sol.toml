# KoRouter serves gpt-5.6-sol at 80% below the OpenAI list price.
# Prices read from https://korouter.ai/models on 2026-10-06 (the same catalog that bills requests).
base_model = "openai/gpt-5.6-sol"
reasoning_options = [
  { type = "effort", values = ["none", "low", "medium", "high", "xhigh", "max"] },
]

[cost]
input = 0.80
output = 4.00
cache_read = 0.08
cache_write = 1.00
