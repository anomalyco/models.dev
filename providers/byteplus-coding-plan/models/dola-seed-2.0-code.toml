# Coding Plan model name per the official activity page (accessed 2026-10-10)
# and the runtime-verified alias report in anomalyco/models.dev#5857.
# Subscription tier: no per-token price.
# Effort: reasoning_effort = none|low|high. Levels follow the sibling Volcengine
# Ark Coding Plan measurements for the Seed 2.0 family on the same platform
# (providers/volcengine-coding-plan); not independently re-measured on this host.
base_model = "bytedance-seed/seed-2.0-code"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "high"]

[interleaved]
field = "reasoning_content"

[cost]
input = 0
output = 0
cache_read = 0
