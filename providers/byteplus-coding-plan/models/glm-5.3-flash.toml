# Coding Plan model name per the official activity page (accessed 2026-10-10)
# and the runtime-verified alias report in anomalyco/models.dev#5857.
# Subscription tier: no per-token price.
# Effort: reasoning_effort = low|high|max, mirroring the sibling Volcengine Ark
# Coding Plan entry on the same platform (providers/volcengine-coding-plan) and
# providers/zai-coding-plan. No toggle declared there: thinking.type=disabled is
# rejected. Not independently re-measured on this host.
base_model = "zhipuai/glm-5.3-flash"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 0
output = 0
cache_read = 0
