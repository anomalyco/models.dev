# Thinking is always on for this model; the API exposes no on/off or budget
# control for this alias (controls are documented for -thinking-preview only).
# https://cloud.baidu.com/doc/qianfan-docs/s/Wm95lyynv (accessed 2026-10-09)
# Pricing: on-demand CNY per 1k tokens, page updated 2026-10-08;
# converted at CNY 7.14 = USD 1. Input/output over 32k context are higher.
# https://cloud.baidu.com/doc/qianfan/s/wmh4sv6ya (accessed 2026-10-09)
base_model = "baidu/ernie-5.0"
reasoning_options = []

[interleaved]
field = "reasoning_content"

[cost]
input = 0.84
output = 3.36

[[cost.tiers]]
tier = { type = "context", size = 32_768 }
input = 1.40
output = 5.60
