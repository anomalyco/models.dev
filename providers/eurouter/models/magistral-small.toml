# Generated from EUrouter's public catalog, GET https://api.eurouter.ai/v1/models, model "magistral-small".
# Fix a wrong value in the catalog or in the generator (apps/core/scripts/modelsdev-generate.ts in the EUrouter repository), never in this file.
# base_model: the catalog hugging_face_id mistralai/Magistral-Small-2509 is the Hugging Face weights link of mistral/magistral-small-2509.
# Modalities: the catalog architecture lists input text, image, file and output text.
# Limit: context_length = 40000, the catalog's model-level window; output = context, because models.dev rejects an output limit above the context.
# Reasoning: no caller control written: the catalog lists reasoning.supported_efforts [] and mandatory = false, compared with models.dev hosts of mistral/magistral-small-2509 (the most common setting, 1 of 1).
# Cost: catalog pricing per token, times 1,000,000, in USD.
#   The model price is its cheapest provider's; a request routed to another provider is billed at that provider's price
#   (GET https://api.eurouter.ai/api/v1/models/mistral/magistral-small/endpoints lists them).
schema = 2
base_model = "mistral/magistral-small-2509"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true }

[limit]
context = 40_000
output = 40_000

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.55

[cost.text.output]
price = 1.65
