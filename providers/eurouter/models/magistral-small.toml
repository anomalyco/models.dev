# EUrouter serves Magistral Small 1.2, which gained image input in Mistral's 1.2
# update (magistral-small-2509 lineage); the live catalog architecture reports
# text + image, so the multimodal surface is intentional. The text-only Magistral
# metadata elsewhere in this repo predates the 1.2 release.
name = "Magistral Small 1.2"
description = "Magistral Small 1.2 is Mistral AI's small reasoning model for transparent and multilingual reasoning."
family = "magistral-small"
release_date = "2025-03-17"
last_updated = "2025-03-17"
attachment = true
reasoning = true
temperature = true
tool_call = true
structured_output = false
open_weights = false
reasoning_options = []

[cost]
input = 0.5
output = 1.5
reasoning = 0
cache_read = 0
cache_write = 0

[limit]
context = 40_000
output = 40_000

[modalities]
input = ["text", "image"]
output = ["text"]
