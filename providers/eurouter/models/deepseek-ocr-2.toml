# Generated from EUrouter's public catalog, GET https://api.eurouter.ai/v1/models, model "deepseek-ocr-2".
# Fix a wrong value in the catalog or in the generator (apps/core/scripts/modelsdev-generate.ts in the EUrouter repository), never in this file.
# base_model: same author and model id as the catalog (deepseek/deepseek-ocr-2).
# Limit: context_length = 8000, the catalog's model-level window; top_provider.max_completion_tokens = 4000.
# Cost: none written. The catalog bills pricing.request = 0.02 EUR per request, which the models.dev cost schema has no unit for.
schema = 2
base_model = "deepseek/deepseek-ocr-2"

[limit]
context = 8000
output = 4000

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }
