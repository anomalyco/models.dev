# Generated from EUrouter's public catalog, GET https://api.eurouter.ai/v1/models, model "alibaba/qwen3-vl-embedding-8b".
# Fix a wrong value in the catalog or in the generator (apps/core/scripts/modelsdev-generate.ts in the EUrouter repository), never in this file.
# base_model: a new lab entry generated from this catalog row, as models.dev has none for this model.
# Input: left out image and video, which the catalog lists but a request to EUrouter's embedding API cannot carry.
# Modalities: the catalog architecture lists input text, image, video and output embedding.
# Cost: catalog pricing per token, times 1,000,000, in USD.
#   The model price is its cheapest provider's; a request routed to another provider is billed at that provider's price
#   (GET https://api.eurouter.ai/api/v1/models/alibaba/qwen3-vl-embedding-8b/endpoints lists them).
schema = 2
v2_only = true
base_model = "alibaba/qwen3-vl-embedding-8b"

[modalities]
input = ["text"]
output = ["embedding"]

[api.embeddings]
sdk = { opencodeai = "@opencode/ai/providers/openai-compatible/embeddings" }

[cost.text.input]
price = 0.11
