# Generated from EUrouter's public catalog, GET https://api.eurouter.ai/v1/models, model "glm-5".
# Fix a wrong value in the catalog or in the generator (apps/core/scripts/modelsdev-generate.ts in the EUrouter repository), never in this file.
# base_model: the catalog hugging_face_id zai-org/GLM-5 is the Hugging Face weights link of zhipuai/glm-5.
# Limit: context_length = 202752, the catalog's model-level window; top_provider.max_completion_tokens = 202752.
# Reasoning: no caller control written: the catalog lists reasoning.supported_efforts [] and mandatory = false, compared with providers/zhipuai/models/glm-5.toml (the lab's own API).
# Cache: the catalog lists pricing.input_cache_read; implicit, as on providers/zhipuai/models/glm-5.toml (the lab's own API).
# Cost: catalog pricing per token, times 1,000,000, in USD.
#   The model price is its cheapest provider's; a request routed to another provider is billed at that provider's price
#   (GET https://api.eurouter.ai/api/v1/models/zhipu/glm-5/endpoints lists them).
schema = 2
base_model = "zhipuai/glm-5"

[capabilities]
reasoning = { supported = true }
cache = { implicit = true }

[limit]
context = 202_752
output = 202_752

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 1
cache = { read = 0.25 }

[cost.text.output]
price = 3.2
