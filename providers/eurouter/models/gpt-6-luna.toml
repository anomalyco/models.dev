# Generated from EUrouter's public catalog, GET https://api.eurouter.ai/v1/models, model "gpt-6-luna".
# Fix a wrong value in the catalog or in the generator (apps/core/scripts/modelsdev-generate.ts in the EUrouter repository), never in this file.
# base_model: same author and model id as the catalog (openai/gpt-6-luna).
# Effort: reasoning_effort = none|low|medium|high|xhigh: the levels of providers/openai/models/gpt-6-luna.toml (the lab's own API) that the catalog lists in reasoning.supported_efforts.
# structured_output: the catalog supported_parameters lists structured_outputs.
# Cache: the catalog lists pricing.input_cache_read; explicit, as on providers/openai/models/gpt-6-luna.toml (the lab's own API).
# Cost: catalog pricing per token, times 1,000,000, in USD.
#   The model price is its cheapest provider's; a request routed to another provider is billed at that provider's price
#   (GET https://api.eurouter.ai/api/v1/models/openai/gpt-6-luna/endpoints lists them).
schema = 2
base_model = "openai/gpt-6-luna"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true
cache = { explicit = true }

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.12
cache = { read = 0.012, write = 0.15 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 0.24
cache = { read = 0.024, write = 0.3 }

[cost.text.output]
price = 0.6

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 0.9
