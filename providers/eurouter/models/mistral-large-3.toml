# Generated from EUrouter's public catalog, GET https://api.eurouter.ai/v1/models, model "mistral-large-3".
# Fix a wrong value in the catalog or in the generator (apps/core/scripts/modelsdev-generate.ts in the EUrouter repository), never in this file.
# base_model: the catalog hugging_face_id mistralai/Mistral-Large-3-675B-Instruct-2512 is the Hugging Face weights link of mistral/mistral-large-2512.
# Modalities: the catalog architecture lists input text, image, file and output text.
# structured_output: the catalog supported_parameters lists structured_outputs.
# Cache: the catalog lists pricing.input_cache_read; implicit, as on providers/mistral/models/mistral-large-2512.toml (the lab's own API).
# Cost: catalog pricing per token, times 1,000,000, in USD.
#   The model price is its cheapest provider's; a request routed to another provider is billed at that provider's price
#   (GET https://api.eurouter.ai/api/v1/models/mistral/mistral-large-3/endpoints lists them).
schema = 2
base_model = "mistral/mistral-large-2512"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif", "application/pdf"]
output = ["text"]

[capabilities]
structured_output = true
cache = { implicit = true }

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.55
cache = { read = 0.055 }

[cost.text.output]
price = 1.65
