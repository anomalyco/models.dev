# Generated from EUrouter's public catalog, GET https://api.eurouter.ai/v1/models, model "deepseek-r1".
# Fix a wrong value in the catalog or in the generator (apps/core/scripts/modelsdev-generate.ts in the EUrouter repository), never in this file.
# base_model: same author and model id as the catalog (deepseek/deepseek-r1).
# Limit: context_length = 164000, the catalog's model-level window; top_provider.max_completion_tokens = 8192.
# Reasoning: no caller control written: the catalog lists reasoning.supported_efforts [] and mandatory = true, compared with models.dev hosts of deepseek/deepseek-r1 (the most common setting, 12 of 13).
# Cache: the catalog lists pricing.input_cache_read; implicit, as no models.dev host of this model lists a cache kind.
# Cost: catalog pricing per token, times 1,000,000, in USD.
#   The model price is its cheapest provider's; a request routed to another provider is billed at that provider's price
#   (GET https://api.eurouter.ai/api/v1/models/deepseek/deepseek-r1/endpoints lists them).
schema = 2
base_model = "deepseek/deepseek-r1"

[capabilities]
reasoning = { supported = true }
cache = { implicit = true }

[limit]
context = 164_000
output = 8192

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.66
cache = { read = 0.165 }

[cost.text.output]
price = 2.6
