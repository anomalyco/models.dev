# Generated from EUrouter's public catalog, GET https://api.eurouter.ai/v1/models, model "qwen3.5-122b-a10b".
# Fix a wrong value in the catalog or in the generator (apps/core/scripts/modelsdev-generate.ts in the EUrouter repository), never in this file.
# base_model: same author and model id as the catalog (alibaba/qwen3.5-122b-a10b).
# Modalities: the catalog architecture lists input text, image and output text.
# Limit: top_provider.max_completion_tokens = 262144.
# Toggle: reasoning_effort = none turns reasoning off. The catalog lists reasoning.supported_efforts [none], which shares no graded level with providers/alibaba/models/qwen3.5-122b-a10b.toml (the lab's own API).
# Cache: the catalog lists pricing.input_cache_read; implicit, as no models.dev host of this model lists a cache kind.
# Cost: catalog pricing per token, times 1,000,000, in USD.
#   The model price is its cheapest provider's; a request routed to another provider is billed at that provider's price
#   (GET https://api.eurouter.ai/api/v1/models/alibaba/qwen3.5-122b-a10b/endpoints lists them).
schema = 2
base_model = "alibaba/qwen3.5-122b-a10b"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
cache = { implicit = true }

[limit]
output = 262_144

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.5
cache = { read = 0.125 }

[cost.text.output]
price = 3.5
