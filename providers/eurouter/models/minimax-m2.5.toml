# Generated from EUrouter's public catalog, GET https://api.eurouter.ai/v1/models, model "minimax-m2.5".
# Fix a wrong value in the catalog or in the generator (apps/core/scripts/modelsdev-generate.ts in the EUrouter repository), never in this file.
# base_model: same author and model id as the catalog (minimax/minimax-m2.5).
# Limit: context_length = 65536, the catalog's model-level window; top_provider.max_completion_tokens = 65536.
# Toggle: reasoning_effort = none turns reasoning off. The catalog lists reasoning.supported_efforts [none], which shares no graded level with providers/minimax/models/MiniMax-M2.5.toml (the lab's own API).
# Cache: the catalog lists pricing.input_cache_read; explicit, as on providers/minimax/models/MiniMax-M2.5.toml (the lab's own API).
# Cost: catalog pricing per token, times 1,000,000, in USD.
#   The model price is its cheapest provider's; a request routed to another provider is billed at that provider's price
#   (GET https://api.eurouter.ai/api/v1/models/minimax/minimax-m2.5/endpoints lists them).
schema = 2
base_model = "minimax/MiniMax-M2.5"

[capabilities]
reasoning = { supported = true, toggle = true }
cache = { explicit = true }

[limit]
context = 65_536
output = 65_536

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.3
cache = { read = 0.075 }

[cost.text.output]
price = 1.2
