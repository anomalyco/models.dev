# Generated from EUrouter's public catalog, GET https://api.eurouter.ai/v1/models, model "gpt-5-nano".
# Fix a wrong value in the catalog or in the generator (apps/core/scripts/modelsdev-generate.ts in the EUrouter repository), never in this file.
# base_model: same author and model id as the catalog (openai/gpt-5-nano).
# Modalities: the catalog architecture lists input text, image, file and output text.
# Effort: reasoning_effort = none|minimal|low|medium|high: the levels of providers/openai/models/gpt-5-nano.toml (the lab's own API) that the catalog lists in reasoning.supported_efforts.
#   none turns reasoning off: the catalog lists it for EUrouter, and that host lists no off setting.
# structured_output: the catalog supported_parameters lists structured_outputs.
# Cache: the catalog lists pricing.input_cache_read; implicit, as on providers/openai/models/gpt-5-nano.toml (the lab's own API).
# Cost: catalog pricing per token, times 1,000,000, in USD.
#   The model price is its cheapest provider's; a request routed to another provider is billed at that provider's price
#   (GET https://api.eurouter.ai/api/v1/models/openai/gpt-5-nano/endpoints lists them).
schema = 2
base_model = "openai/gpt-5-nano"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.055
cache = { read = 0.0055 }

[cost.text.output]
price = 0.44
