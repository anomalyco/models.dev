# Generated from EUrouter's public catalog, GET https://api.eurouter.ai/v1/models, model "mixtral-8x7b-instruct".
# Fix a wrong value in the catalog or in the generator (apps/core/scripts/modelsdev-generate.ts in the EUrouter repository), never in this file.
# base_model: the catalog hugging_face_id mistralai/Mixtral-8x7B-Instruct-v0.1 is the Hugging Face weights link of mistral/mixtral-8x7b-instruct-v0.1.
# Modalities: the catalog architecture lists input text, file and output text.
# Limit: context_length = 32000, the catalog's model-level window; top_provider.max_completion_tokens = 4096.
# Cost: catalog pricing per token, times 1,000,000, in USD.
#   The model price is its cheapest provider's; a request routed to another provider is billed at that provider's price
#   (GET https://api.eurouter.ai/api/v1/models/mistral/mixtral-8x7b-instruct/endpoints lists them).
schema = 2
base_model = "mistral/mixtral-8x7b-instruct-v0.1"

[modalities]
input = ["text", "application/pdf"]
output = ["text"]

[limit]
context = 32_000
output = 4096

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.49

[cost.text.output]
price = 0.76
