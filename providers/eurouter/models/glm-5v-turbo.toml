# Generated from EUrouter's public catalog, GET https://api.eurouter.ai/v1/models, model "glm-5v-turbo".
# Fix a wrong value in the catalog or in the generator (apps/core/scripts/modelsdev-generate.ts in the EUrouter repository), never in this file.
# base_model: models.dev spells the catalog author zhipu as zhipuai.
# Modalities: the catalog architecture lists input text, image and output text.
# Limit: context_length = 202752, the catalog's model-level window.
# Toggle: reasoning_effort = none turns reasoning off. The catalog lists reasoning.supported_efforts [none], which shares no graded level with providers/zhipuai/models/glm-5v-turbo.toml (the lab's own API).
# Cache: the catalog lists pricing.input_cache_read; implicit, as on providers/zhipuai/models/glm-5v-turbo.toml (the lab's own API).
# Cost: catalog pricing per token, times 1,000,000, in USD.
#   The model price is its cheapest provider's; a request routed to another provider is billed at that provider's price
#   (GET https://api.eurouter.ai/api/v1/models/zhipu/glm-5v-turbo/endpoints lists them).
schema = 2
base_model = "zhipuai/glm-5v-turbo"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
cache = { implicit = true }

[limit]
context = 202_752

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 1.2
cache = { read = 0.3 }

[cost.text.output]
price = 4
