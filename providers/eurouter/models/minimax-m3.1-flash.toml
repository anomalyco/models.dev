# Generated from EUrouter's public catalog, GET https://api.eurouter.ai/v1/models, model "minimax-m3.1-flash".
# Fix a wrong value in the catalog or in the generator (apps/core/scripts/modelsdev-generate.ts in the EUrouter repository), never in this file.
# base_model: same author and model id as the catalog (minimax/minimax-m3.1-flash).
# Input: left out video, which the catalog lists but a request to EUrouter's chat API cannot carry.
# Modalities: the catalog architecture lists input text, image, video and output text.
# Effort: reasoning_effort = none|low|medium|high|xhigh|max: the levels of providers/minimax/models/MiniMax-M3.1-Flash.toml (the lab's own API) that the catalog lists in reasoning.supported_efforts.
#   none turns reasoning off: the catalog lists it for EUrouter, and that host lists no off setting.
# structured_output: the catalog supported_parameters lists structured_outputs.
# Cache: the catalog lists pricing.input_cache_read; implicit, as on providers/minimax/models/MiniMax-M3.1-Flash.toml (the lab's own API).
# Cost: catalog pricing per token, times 1,000,000, in EUR, converted at 1 EUR = 1.0975 USD (ECB euro reference rate of 2026-11-26, https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml).
#   The model price is its cheapest provider's; a request routed to another provider is billed at that provider's price
#   (GET https://api.eurouter.ai/api/v1/models/minimax/minimax-m3.1-flash/endpoints lists them).
schema = 2
base_model = "minimax/MiniMax-M3.1-Flash"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true }

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.296325
cache = { read = 0.076825 }

[cost.text.output]
price = 1.1853
