# Generated from EUrouter's public catalog, GET https://api.eurouter.ai/v1/models, model "claude-sonnet-4-6".
# Fix a wrong value in the catalog or in the generator (apps/core/scripts/modelsdev-generate.ts in the EUrouter repository), never in this file.
# base_model: same author and model id as the catalog (anthropic/claude-sonnet-4-6).
# Limit: top_provider.max_completion_tokens = 64000.
# Effort: reasoning_effort = low|medium|high|max: the levels of providers/anthropic/models/claude-sonnet-4-6.toml (the lab's own API) that the catalog lists in reasoning.supported_efforts.
# structured_output: the catalog supported_parameters lists structured_outputs.
# Cache: the catalog lists pricing.input_cache_read; explicit, as on providers/anthropic/models/claude-sonnet-4-6.toml (the lab's own API).
# Cost: catalog pricing per token, times 1,000,000, in USD.
#   The model price is its cheapest provider's; a request routed to another provider is billed at that provider's price
#   (GET https://api.eurouter.ai/api/v1/models/anthropic/claude-sonnet-4-6/endpoints lists them).
schema = 2
base_model = "anthropic/claude-sonnet-4-6"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "max"] }
structured_output = true
cache = { explicit = true }

[limit]
output = 64_000

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 3.3
cache = { read = 0.33, write = 4.125 }

[cost.text.output]
price = 16.5
