base_model = "anthropic/claude-sonnet-4-6"
description = "Claude Sonnet 4.6 is Anthropic's balanced performance model for coding, reasoning, and agentic workflows with a 1M context window."
structured_output = false

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "max"]

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 3
output = 15
reasoning = 0
cache_read = 0.3
cache_write = 3.75

[modalities]
input = ["text", "image"]
