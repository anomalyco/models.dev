# Generated from EUrouter's public catalog, GET https://api.eurouter.ai/v1/models, model "deepseek-v3.2".
# Fix a wrong value in the catalog or in the generator (apps/core/scripts/modelsdev-generate.ts in the EUrouter repository), never in this file.
# base_model: same author and model id as the catalog (deepseek/deepseek-v3.2).
# Limit: context_length = 163840, the catalog's model-level window; top_provider.max_completion_tokens = 163840.
# Reasoning: no caller control written: the catalog lists reasoning.supported_efforts [] and mandatory = false, compared with models.dev hosts of deepseek/deepseek-v3.2 (the most common setting, 16 of 29).
# Cache: the catalog lists pricing.input_cache_read; implicit, as no models.dev host of this model lists a cache kind.
# Cost: catalog pricing per token, times 1,000,000, in USD.
#   The model price is its cheapest provider's; a request routed to another provider is billed at that provider's price
#   (GET https://api.eurouter.ai/api/v1/models/deepseek/deepseek-v3.2/endpoints lists them).
schema = 2
base_model = "deepseek/deepseek-v3.2"

[capabilities]
reasoning = { supported = true }
cache = { implicit = true }

[limit]
context = 163_840
output = 163_840

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.3
cache = { read = 0.075 }

[cost.text.output]
price = 0.5
