# Generated from EUrouter's public catalog, GET https://api.eurouter.ai/v1/models, model "all-minilm-l6-v2".
# Fix a wrong value in the catalog or in the generator (apps/core/scripts/modelsdev-generate.ts in the EUrouter repository), never in this file.
# base_model: same author and model id as the catalog (sentence-transformers/all-minilm-l6-v2).
# Cost: catalog pricing per token, times 1,000,000, in EUR, converted at 1 EUR = 1.0975 USD (ECB euro reference rate of 2026-11-26, https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml).
#   The model price is its cheapest provider's; a request routed to another provider is billed at that provider's price
#   (GET https://api.eurouter.ai/api/v1/models/sentence-transformers/all-minilm-l6-v2/endpoints lists them).
schema = 2
v2_only = true
base_model = "sentence-transformers/all-minilm-l6-v2"

[api.embeddings]
sdk = { opencodeai = "@opencode/ai/providers/openai-compatible/embeddings" }

[cost.text.input]
price = 0.098775

[cost.text.output]
price = 0.493875
