# Generated from EUrouter's public catalog, GET https://api.eurouter.ai/v1/models, model "titan-embed-text-v2".
# Fix a wrong value in the catalog or in the generator (apps/core/scripts/modelsdev-generate.ts in the EUrouter repository), never in this file.
# base_model: same author and model id as the catalog (amazon/titan-embed-text-v2).
# Limit: context_length = 8000, the catalog's model-level window.
# Cost: catalog pricing per token, times 1,000,000, in USD.
#   The model price is its cheapest provider's; a request routed to another provider is billed at that provider's price
#   (GET https://api.eurouter.ai/api/v1/models/amazon/titan-embed-text-v2/endpoints lists them).
schema = 2
v2_only = true
base_model = "amazon/titan-embed-text-v2"

[limit]
context = 8000

[api.embeddings]
sdk = { opencodeai = "@opencode/ai/providers/openai-compatible/embeddings" }

[cost.text.input]
price = 0.2
