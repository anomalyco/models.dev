# Generated from EUrouter's public catalog, GET https://api.eurouter.ai/v1/models, model "glm-5.2".
# Fix a wrong value in the catalog or in the generator (apps/core/scripts/modelsdev-generate.ts in the EUrouter repository), never in this file.
# base_model: the catalog hugging_face_id zai-org/GLM-5.2 is the Hugging Face weights link of zhipuai/glm-5.2.
# Effort: reasoning_effort = none|high|max: the levels of providers/zhipuai/models/glm-5.2.toml (the lab's own API) that the catalog lists in reasoning.supported_efforts.
#   none turns reasoning off: that host has a separate switch, and on EUrouter the switch is this level.
# structured_output: the catalog supported_parameters lists structured_outputs.
# Cache: the catalog lists pricing.input_cache_read; implicit, as on providers/zhipuai/models/glm-5.2.toml (the lab's own API).
# Cost: catalog pricing per token, times 1,000,000, in USD.
#   The model price is its cheapest provider's; a request routed to another provider is billed at that provider's price
#   (GET https://api.eurouter.ai/api/v1/models/zhipu/glm-5.2/endpoints lists them).
schema = 2
base_model = "zhipuai/glm-5.2"

[capabilities]
reasoning = { supported = true, effort = ["none", "high", "max"] }
structured_output = true
cache = { implicit = true }

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 1.4
cache = { read = 0.26 }

[cost.text.output]
price = 4.4
