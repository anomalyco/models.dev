# Generated from EUrouter's public catalog, GET https://api.eurouter.ai/v1/models, model "qwen3.5-397b-a17b".
# Fix a wrong value in the catalog or in the generator (apps/core/scripts/modelsdev-generate.ts in the EUrouter repository), never in this file.
# base_model: same author and model id as the catalog (alibaba/qwen3.5-397b-a17b).
# Modalities: the catalog architecture lists input text, image and output text.
# Limit: top_provider.max_completion_tokens = 262144.
# Toggle: reasoning_effort = none turns reasoning off. The catalog lists reasoning.supported_efforts [none], which shares no graded level with providers/alibaba/models/qwen3.5-397b-a17b.toml (the lab's own API).
# structured_output: the catalog supported_parameters lists structured_outputs.
# Cost: catalog pricing per token, times 1,000,000, in EUR, converted at 1 EUR = 1.0975 USD (ECB euro reference rate of 2026-11-26, https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml).
#   The model price is its cheapest provider's; a request routed to another provider is billed at that provider's price
#   (GET https://api.eurouter.ai/api/v1/models/alibaba/qwen3.5-397b-a17b/endpoints lists them).
schema = 2
base_model = "alibaba/qwen3.5-397b-a17b"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
output = 262_144

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.6585

[cost.text.output]
price = 3.951
