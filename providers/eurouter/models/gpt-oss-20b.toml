# Generated from EUrouter's public catalog, GET https://api.eurouter.ai/v1/models, model "gpt-oss-20b".
# Fix a wrong value in the catalog or in the generator (apps/core/scripts/modelsdev-generate.ts in the EUrouter repository), never in this file.
# base_model: same author and model id as the catalog (openai/gpt-oss-20b).
# Limit: context_length = 131000, the catalog's model-level window; output = context, because models.dev rejects an output limit above the context.
# Effort: reasoning_effort = low|medium|high: the levels of models.dev hosts of openai/gpt-oss-20b (the most common setting, 39 of 48) that the catalog lists in reasoning.supported_efforts.
# structured_output: the catalog supported_parameters lists structured_outputs.
# Cache: the catalog lists pricing.input_cache_read; implicit, as no models.dev host of this model lists a cache kind.
# Cost: catalog pricing per token, times 1,000,000, in USD.
#   The model price is its cheapest provider's; a request routed to another provider is billed at that provider's price
#   (GET https://api.eurouter.ai/api/v1/models/openai/gpt-oss-20b/endpoints lists them).
schema = 2
base_model = "openai/gpt-oss-20b"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 131_000
output = 131_000

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.018
cache = { read = 0.0027 }

[cost.text.output]
price = 0.09
