# Generated from EUrouter's public catalog, GET https://api.eurouter.ai/v1/models, model "mistral-small-24b".
# Fix a wrong value in the catalog or in the generator (apps/core/scripts/modelsdev-generate.ts in the EUrouter repository), never in this file.
# base_model: the catalog hugging_face_id mistralai/Mistral-Small-3.2-24B-Instruct-2506 is the Hugging Face weights link of mistral/mistral-small-3.2-24b-instruct.
# name, description: the catalog name and description, because several EUrouter models share this lab entry.
# Limit: context_length = 128000, the catalog's model-level window.
# structured_output: the catalog supported_parameters lists structured_outputs.
# Cost: catalog pricing per token, times 1,000,000, in USD.
#   The model price is its cheapest provider's; a request routed to another provider is billed at that provider's price
#   (GET https://api.eurouter.ai/api/v1/models/mistral/mistral-small-24b/endpoints lists them).
schema = 2
base_model = "mistral/mistral-small-3.2-24b-instruct"
name = "Mistral Small 24B Instruct"
description = "Mistral Small 24B Instruct is a 24B parameter model with 128K context and multimodal (text + image) inputs, optimized for instruction following and long-document understanding."

[capabilities]
structured_output = true

[limit]
context = 128_000

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.11

[cost.text.output]
price = 0.33
