# Generated from EUrouter's public catalog, GET https://api.eurouter.ai/v1/models, model "text-embedding-3-small".
# Fix a wrong value in the catalog or in the generator (apps/core/scripts/modelsdev-generate.ts in the EUrouter repository), never in this file.
# base_model: same author and model id as the catalog (openai/text-embedding-3-small).
# Cost: catalog pricing per token, times 1,000,000, in USD.
#   The model price is its cheapest provider's; a request routed to another provider is billed at that provider's price
#   (GET https://api.eurouter.ai/api/v1/models/openai/text-embedding-3-small/endpoints lists them).
schema = 2
v2_only = true
base_model = "openai/text-embedding-3-small"

[api.embeddings]
sdk = { opencodeai = "@opencode/ai/providers/openai-compatible/embeddings" }

[cost.text.input]
price = 0.022
