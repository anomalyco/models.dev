# Generated from EUrouter's public catalog, GET https://api.eurouter.ai/v1/models, model "titan-multimodal-embed".
# Fix a wrong value in the catalog or in the generator (apps/core/scripts/modelsdev-generate.ts in the EUrouter repository), never in this file.
# base_model: from the generator's alias list (models.dev names this closed model differently).
# Input: left out image, which the catalog lists but a request to EUrouter's embedding API cannot carry.
# Modalities: the catalog architecture lists input text, image and output embedding.
# Cost: catalog pricing per token, times 1,000,000, in USD.
#   The model price is its cheapest provider's; a request routed to another provider is billed at that provider's price
#   (GET https://api.eurouter.ai/api/v1/models/amazon/titan-multimodal-embed/endpoints lists them).
schema = 2
v2_only = true
base_model = "amazon/titan-embed-image-v1"

[modalities]
input = ["text"]
output = ["embedding"]

[api.embeddings]
sdk = { opencodeai = "@opencode/ai/providers/openai-compatible/embeddings" }

[cost.text.input]
price = 1
