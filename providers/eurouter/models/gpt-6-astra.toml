# Generated from EUrouter's public catalog, GET https://api.eurouter.ai/v1/models, model "gpt-6-astra".
# Fix a wrong value in the catalog or in the generator (apps/core/scripts/modelsdev-generate.ts in the EUrouter repository), never in this file.
# base_model: same author and model id as the catalog (openai/gpt-6-astra).
# Modalities: the catalog architecture lists input text, image and output text.
# Effort: reasoning_effort = low|medium|high|xhigh: the levels of providers/openai/models/gpt-6-astra.toml (the lab's own API) that the catalog lists in reasoning.supported_efforts.
# structured_output: the catalog supported_parameters lists structured_outputs.
# Cache: the catalog lists pricing.input_cache_read; explicit, as on providers/openai/models/gpt-6-astra.toml (the lab's own API).
# Cost: catalog pricing per token, times 1,000,000, in USD.
#   The model price is its cheapest provider's; a request routed to another provider is billed at that provider's price
#   (GET https://api.eurouter.ai/api/v1/models/openai/gpt-6-astra/endpoints lists them).
schema = 2
base_model = "openai/gpt-6-astra"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
cache = { explicit = true }

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 12
cache = { read = 1.2, write = 15 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 24
cache = { read = 2.4, write = 30 }

[cost.text.output]
price = 60

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 90
