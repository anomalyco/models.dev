# Source: https://infer.flow7.org/api/public/catalog (2026-10-29 UTC)
# Exact selector: infer/claude-sonnet-5-5:low-cost
# Low cost route: text and tool calls. Image and file input need the model's :official route.
# Limits: the lab's, which match Infer's published figures for the model.
# Reasoning controls copied from the lab's own entry, as AGENTS.md asks of relays.
schema = 2
base_model = "anthropic/claude-sonnet-5-5"
name = "Claude Sonnet 5.5 (Low cost)"

[modalities]
input = ["text"]
