# limit.output confirmed working at 100_000 via live test.
# reasoning_effort (low/high) is accepted but has no measurable effect
# on output (~2% token difference, same reasoning depth). The working
# control is chat_template_kwargs.enable_thinking (toggle) — verified
# via live request, 2026-07-22: reasoning drops to null and completion
# tokens drop ~70% when disabled.
name = "deepseek-v4-flash"
base_model = "deepseek/deepseek-v4-flash"
reasoning_options = [{ type = "toggle" }]
[limit]
context = 1_000_000
output = 100_000
[cost]
input = 0
output = 0
