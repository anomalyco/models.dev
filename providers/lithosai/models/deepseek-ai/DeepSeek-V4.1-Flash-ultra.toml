# LithosAI Chat Completions (https://api.lithosai.cloud/v1), model "deepseek-ai/DeepSeek-V4.1-Flash-ultra".
# Base, Fast and Ultra are separate model IDs serving the same weights at different speeds and prices.
# Weights: GET /v1/models reports created 2026-10-17 for this ID (the 2026-09-10 weights are served as
# deepseek-ai/DeepSeek-V4.1-Flash-0910*), so the base model is the 1017 update.
# Pricing (https://www.lithosai.com/pricing, accessed 2026-10-20, standard rates unchanged 2026-11-17):
# rates in USD per 1M tokens; the early-access output discount shown on the page is not used. No cache-write
# or reasoning surcharge.
# API reference: https://docs.lithosai.com/openapi.yaml (reasoning_effort; reasoning returned in reasoning_content)
# Effort: reasoning_effort = none|low|high|max (default high; "none" turns thinking off)
# Aliases: minimal maps to low, medium and xhigh to high, and ultra to max.
# Live 2026-10-20 (Base, Fast and Ultra): chat, tool calls and strict json_schema response_format work. Reasoning
# arrives in reasoning_content and reasoning_tokens is reported.
# Image input (live 2026-10-20): all three tiers read JPEG, PNG, GIF and WebP images.
# Model docs: https://docs.lithosai.com/models/deepseek-v4-1-flash
# Context (live 2026-10-20): with a 43-token prompt, max_completion_tokens=1048533 fit the
# 1,048,576-token window. Requesting one more token returned HTTP 400.
# Output: LithosAI documents a 393,216-token generation cap even when a larger request is accepted.
# Cache: prompt caching is on by default (https://www.lithosai.com/pricing). Live 2026-11-04: the same ~4K-token
# prompt sent twice returned usage.prompt_tokens_details.cached_tokens 3840 of 3995 prompt tokens on the repeat.
# Reasoning field: an assistant turn carrying reasoning_content in the history is accepted (HTTP 200, live 2026-11-04).
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"
name = "DeepSeek V4.1 Flash 1017 Ultra"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "high" }, effort = ["none", "low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 1_048_576
output = 393_216

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.35
cache = { read = 0.007 }

[cost.text.output]
price = 2.8
