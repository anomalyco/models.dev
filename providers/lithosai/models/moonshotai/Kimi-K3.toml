# Pricing: https://www.lithosai.com/pricing (2026-09-23).
# Provider representative confirmed these USD/MTok rates on 2026-09-24:
# standard output price, with the published input and cache-read prices.
# Context follows HF text_config.max_position_embeddings = 1048576:
# https://huggingface.co/moonshotai/Kimi-K3/blob/main/config.json
# Output limit inherits the lab baseline; no enlarged host output limit is advertised.
# Provider confirmed text-only input on 2026-09-24; no image/video attachments.
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|high|max
# API schema: https://docs.lithosai.com/openapi.yaml
# Other capabilities inherit the base model metadata; no live audit is claimed.
# Provider confirmed no separate reasoning/cache-write surcharges or context bands (2026-09-25).
# Authoritative pricing/capabilities: LithosAI website/docs; this is a static snapshot.
base_model = "moonshotai/kimi-k3"
attachment = false
reasoning_options = [{ type = "toggle" }, { type = "effort", values = ["low", "high", "max"] }]

[cost]
input = 2.4
output = 15
cache_read = 0.24

[modalities]
input = ["text"]
