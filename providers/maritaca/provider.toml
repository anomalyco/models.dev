# https://docs.maritaca.ai/pt/api/openai-compatibilidade (accessed 2026-09-28)
api = "https://chat.maritaca.ai/api"
env = ["MARITACA_API_KEY"]
doc = "https://docs.maritaca.ai/pt/visao-geral"
