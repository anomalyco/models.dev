# context: the API's own limit, as named in its error for an over-long request.
# Prices: read from the public catalog, https://console.modular.com/api/v1/docs/models, on 2026-11-25
# Reasoning controls: providers/nvidia/models/nvidia/nemotron-3.5-lightning-30b-a3b.toml, kept where this host honours them (/v1/chat/completions).
# Toggle: reasoning.enabled = true|false (true -> 770 reasoning tokens, false -> 0; on by default here, 869 with no control)
# Off: reasoning.effort = none also turns reasoning off (0 reasoning tokens), the same as the toggle.
# Effort: no levels listed; the other values don't order reasoning here (minimal -> 1403, low -> 658, medium -> 844, high -> 830, xhigh -> 877, max -> 907 reasoning tokens), and unknown values are accepted (bogus -> 751), so this host is binary on/off.
# tools: the catalog says function_calling=false; the API returns well-formed tool calls.
schema = 2
base_model = "nvidia/nemotron-3.5-lightning"

[capabilities]
reasoning = { supported = true, toggle = true, default = { type = "toggle", value = true } }
cache = { implicit = true }

[limit]
context = 1_048_552

[cost.text.input]
price = 0.06
cache = { read = 0.03 }

[cost.text.output]
price = 0.16

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
