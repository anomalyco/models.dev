# context: the API's own limit, as named in its error for an over-long request.
# Prices: Modular's public model catalog, https://console.modular.com/api/v1/docs/models (accessed 2026-10-26)
# Video: inherited; the model named the color of solid-color mp4 test clips correctly (probe).
schema = 2
base_model = "minimax/MiniMax-M3.1-Flash"

[capabilities]
# Reasoning controls: providers/minimax/models/MiniMax-M3.1-Flash.toml, narrowed to what this host honours.
#   Probed on /v1/chat/completions with reasoning.effort and reasoning.enabled (OpenRouter style).
#   no toggle: effort "none" and enabled=false still return 195 and 111 reasoning tokens.
#   effort: the host validates values (400 on an unknown one) and accepts low, medium, high, xhigh, max. Levels were not separable on the test prompt (one run each).
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[limit]
context = 1_048_576

[cost.text.input]
price = 0.15
cache = { read = 0.015 }

[cost.text.output]
price = 0.6

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
