# context: the API's own limit, as named in its error for an over-long request.
# Prices: read from the public catalog, https://console.modular.com/api/v1/docs/models, on 2026-11-25
# Image: inherited; the public catalog lists image input, and image_url (png) input is accepted.
# Video: inherited; video_url (mp4) is accepted and billed as input (+23 prompt tokens for a 2 s clip).
# Reasoning controls: providers/alibaba/models/qwen3.8-27b.toml, kept where this host honours them (/v1/chat/completions).
# Toggle: reasoning.enabled = true|false (true -> 475 reasoning tokens, false -> 0; on by default here, 273 with no control)
# Effort: not listed; reasoning.effort does not order reasoning here (low -> 185, medium -> 485, xhigh -> 335 reasoning tokens), and unknown values are accepted (bogus -> 239).
# tool schemas: rejects JSON Schema keyword(s) `not` (HTTP 400).
# tools: the catalog says function_calling=false; the API returns well-formed tool calls.
schema = 2
base_model = "alibaba/qwen3.8-27b"

[capabilities]
reasoning = { supported = true, toggle = true, default = { type = "toggle", value = true } }
cache = { implicit = true }

[limit]
context = 262_134

[cost.text.input]
price = 0.45
cache = { read = 0.05 }

[cost.text.output]
price = 2.5

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
