# Prices: read from the public catalog, https://console.modular.com/api/v1/docs/models, on 2026-11-25
# Reasoning controls: no first-party host file; measured on this host (probe, /v1/chat/completions).
# No toggle: reasoning.enabled = false still returns 1095 reasoning tokens (effort none: 701).
# Effort: not listed; reasoning.effort does not order reasoning here (none -> 701, minimal -> 830, low -> 879, medium -> 777, high -> 765, xhigh -> 709, max -> 476 reasoning tokens, one run each), and unknown values are accepted (bogus -> 816).
schema = 2
base_model = "meta/muse-glimmer-30b"

[capabilities]
reasoning = { supported = true }
cache = { implicit = true }

[cost.text.input]
price = 0.3
cache = { read = 0.04 }

[cost.text.output]
price = 1.2

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
