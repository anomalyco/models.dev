# Passthrough to Fireworks serverless.
# Toggle: `reasoning_effort = "none"` disables thinking (also accepts
# `chat_template_kwargs = {"thinking": false}`); effort: `reasoning_effort =
# high|max`. Both verified end-to-end on this host 2026-08-29.
base_model = "zhipuai/glm-5.2"
name = "GLM 5.2"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["high", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 1.54
output = 4.84
cache_read = 0.154
