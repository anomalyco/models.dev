# Passthrough to the Fireworks fast router (~2x standard throughput); same
# control surface as providers/fireworks-ai/models/accounts/fireworks/routers/
# glm-5p2-fast.toml: toggle + `reasoning_effort = high|max`.
base_model = "zhipuai/glm-5.2"
name = "GLM 5.2 Fast"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["high", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 2.31
output = 7.26
cache_read = 0.231
