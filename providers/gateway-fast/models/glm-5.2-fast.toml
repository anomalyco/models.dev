# Passthrough to the Fireworks fast router (~2x standard throughput).
# Toggle: `reasoning_effort = "none"` disables thinking (also accepts
# `chat_template_kwargs = {"thinking": false}`); effort: `reasoning_effort =
# high|max`. Verified end-to-end on this host 2026-08-29.
base_model = "zhipuai/glm-5.2"
name = "GLM 5.2 Fast"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["high", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 2.31
output = 7.26
cache_read = 0.231
