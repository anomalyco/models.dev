# Pool metadata: https://api.opper.ai/v3/models (2026-09-08).
# Effort: top-level reasoning_effort; OpenAI native levels on all pool members.
# Cache: OpenAI and Gemini cache automatically with no flag; https://docs.opper.ai/build/gateway/prompt-caching (2026-10-21).
schema = 2
base_model = "openai/gpt-5.4-nano"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
cache = { implicit = true }
structured_output = true
temperature = false

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.2
cache = { read = 0.02 }

[cost.text.output]
price = 1.25
