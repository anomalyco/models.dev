# Pool metadata: https://api.opper.ai/v3/models (2026-09-08).
# No pool-wide effort control: at least one member does not forward reasoning_effort.
# Context tiers are conservative pool price ceilings, including marginal-rate bands.
schema = 2
base_model = "anthropic/claude-sonnet-4-5"

[capabilities]
reasoning = { supported = true }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 3.3
cache = { read = 0.33, write = 4.125 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 6.6
cache = { read = 0.66, write = 8.25 }

[cost.text.output]
price = 16.5

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 24.75
