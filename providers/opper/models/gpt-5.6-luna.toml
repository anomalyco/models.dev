# Pool metadata: https://api.opper.ai/v3/models (2026-09-08).
# Effort: top-level reasoning_effort; levels shared by the pool members.
# Context tiers are conservative pool price ceilings, including marginal-rate bands.
base_model = "openai/gpt-5.6-luna"

reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 0.2
output = 1.2
cache_read = 0.02
cache_write = 0.25

[[cost.tiers]]
tier = { type = "context", size = 272000 }
input = 0.4
output = 1.8
cache_read = 0.04
cache_write = 0.5

[limit]
context = 1000000

[interleaved]
field = "reasoning_content"
