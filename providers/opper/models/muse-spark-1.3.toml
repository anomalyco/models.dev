# Pool metadata: https://api.opper.ai/v3/models (2026-09-08).
# Standard-tier pool forwards native effort unchanged; max verified live on 2026-09-08.
# The catalog reasoning.supported list omits max, but the serving path accepts it.
# Effort: top-level reasoning_effort; levels shared by the pool members.
schema = 2
base_model = "meta/muse-spark-1.3"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.25
cache = { read = 0.15 }

[cost.text.output]
price = 4.25
