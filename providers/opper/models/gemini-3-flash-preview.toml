# Pool metadata: https://api.opper.ai/v3/models (2026-09-08).
# No pool-wide effort control: at least one member does not forward reasoning_effort.
# Cache: OpenAI and Gemini cache automatically with no flag; https://docs.opper.ai/build/gateway/prompt-caching (2026-10-21).
schema = 2
base_model = "google/gemini-3-flash-preview"

[capabilities]
reasoning = { supported = true }
cache = { implicit = true }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.5
cache = { read = 0.05 }

[cost.text.output]
price = 3
