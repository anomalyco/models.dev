# Pool metadata: https://api.opper.ai/v3/models (2026-09-08).
# All five members have params but omit params.temperature; Opper drops sampling controls
# for such cards before dispatch, so temperature is accepted but not respected.
# No pool-wide effort control: at least one member does not forward reasoning_effort.
schema = 2
base_model = "google/gemini-3.8-flash"

[capabilities]
reasoning = { supported = true }
structured_output = true
temperature = false

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.825
cache = { read = 0.0825 }

[cost.text.output]
price = 4.125
