# Pool metadata: https://api.opper.ai/v3/models (2026-09-08).
# No pool-wide effort control: at least one member does not forward reasoning_effort.
# Context tiers are conservative pool price ceilings, including marginal-rate bands.
schema = 2
base_model = "minimax/MiniMax-M3"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true

[limit]
context = 1_000_000
output = 131_072

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.6
cache = { read = 0.12 }

[[cost.text.input.overrides]]
when = { context = { gt = 524_288 } }
price = 1.2
cache = { read = 0.24 }

[cost.text.output]
price = 2.4

[[cost.text.output.overrides]]
when = { context = { gt = 524_288 } }
price = 4.8
