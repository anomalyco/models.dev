# Pool metadata: https://api.opper.ai/v3/models (2026-09-08).
# Effort: top-level reasoning_effort; levels shared by the pool members.
# Context tiers are conservative pool price ceilings, including marginal-rate bands.
# Cache: OpenAI and Gemini cache automatically with no flag; https://docs.opper.ai/build/gateway/prompt-caching (2026-10-21).
schema = 2
base_model = "openai/gpt-5.6-sol"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
cache = { implicit = true }
structured_output = true

[limit]
context = 1_000_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 5
cache = { read = 0.5, write = 6.25 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 10
cache = { read = 1, write = 12.5 }

[cost.text.output]
price = 30

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 45
