# Pool metadata: https://api.opper.ai/v3/models (2026-09-08).
# Native OpenAI effort levels verified through this single-member pool on 2026-09-08.
# All pool members publish flat rates: no pricing.thresholds or input_surcharge_threshold_tokens.
# Opper billing uses this schedule; native context surcharges do not apply to these pools.
# Effort: top-level reasoning_effort; levels shared by the pool members.
schema = 2
base_model = "openai/gpt-5.5-pro"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["medium", "high", "xhigh"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 30

[cost.text.output]
price = 180
