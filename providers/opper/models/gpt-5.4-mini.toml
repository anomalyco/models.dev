# Pool metadata: https://api.opper.ai/v3/models (2026-09-08).
# Native OpenAI effort levels verified through this single-member pool on 2026-09-08.
# Effort: top-level reasoning_effort; levels shared by the pool members.
# Cache: OpenAI and Gemini cache automatically with no flag; https://docs.opper.ai/build/gateway/prompt-caching (2026-10-21).
schema = 2
base_model = "openai/gpt-5.4-mini"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
cache = { implicit = true }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.75
cache = { read = 0.075 }

[cost.text.output]
price = 4.5
