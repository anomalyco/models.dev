# Pool metadata: https://api.opper.ai/v3/models (2026-09-08).
# Effort: top-level reasoning_effort; levels shared by the pool members.
base_model = "meta/muse-spark-1.2"

reasoning_options = [{ type = "effort", values = ["minimal", "low", "medium", "high", "xhigh"] }]

[cost]
input = 1.25
output = 4.25
cache_read = 0.15

[interleaved]
field = "reasoning_content"
