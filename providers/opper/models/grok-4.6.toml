# Pool metadata: https://api.opper.ai/v3/models (2026-09-08).
# No pool-wide effort control: at least one member does not forward reasoning_effort.
# Context tiers are conservative pool price ceilings, including marginal-rate bands.
schema = 2
base_model = "xai/grok-4.6"

[capabilities]
reasoning = { supported = true }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 2
cache = { read = 0.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 4
cache = { read = 1 }

[cost.text.output]
price = 6

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 12
