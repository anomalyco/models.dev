# Pool metadata: https://api.opper.ai/v3/models (2026-09-08).
# No pool-wide effort control: at least one member does not forward reasoning_effort.
# Cache: opt-in cache_control (top-level automatic breakpoint or up to 4 per-block), 5m default or ttl 1h; https://docs.opper.ai/build/gateway/prompt-caching (2026-10-21). 1h write = highest pool member cache_creation_1h.
schema = 2
base_model = "anthropic/claude-sonnet-4-6"

[capabilities]
reasoning = { supported = true }
cache = { explicit = { ttl = ["5m", "1h"], max_breakpoints = 4 } }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 3.3
cache = { read = 0.33, write = { "5m" = 4.125, "1h" = 6.6 } }

[cost.text.output]
price = 16.5
