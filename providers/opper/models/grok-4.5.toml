# Pool metadata: https://api.opper.ai/v3/models (2026-09-08).
# All pool members publish flat rates: no pricing.thresholds or input_surcharge_threshold_tokens.
# Opper billing uses this schedule; native context surcharges do not apply to these pools.
# No pool-wide effort control: at least one member does not forward reasoning_effort.
schema = 2
base_model = "xai/grok-4.5"

[capabilities]
reasoning = { supported = true }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 2
cache = { read = 0.5 }

[cost.text.output]
price = 6
