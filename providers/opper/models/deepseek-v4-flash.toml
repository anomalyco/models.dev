# Pool metadata: https://api.opper.ai/v3/models (2026-11-24).
# Effort: top-level reasoning_effort on POST /v3/compat/chat/completions. The list is what Opper
# accepts for every pooled member (opper.reasoning.supported on the pool in
# https://api.opper.ai/v3/compat/models), not each host's native levels: Opper translates the
# level into the member's own control.
# Probed live through Opper on 2026-11-24, each of the seven pooled members pinned by its id, one
# short prompt per level:
# - none: no reasoning_content on all seven members.
# - minimal, low, medium, high, xhigh, max: reasoning_content came back on all seven members.
# - The levels are accepted, not distinct depths. DeepSeek V4 backends run medium as high (lab
#   mapping in providers/deepseek/models/deepseek-v4-flash.toml), and TensorX also runs low as
#   high (providers/tensorx/models/deepseek/deepseek-v4-flash-0731.toml).
# No default is set here: with no reasoning_effort, five members answered without reasoning and
# two (munito, munito:global) answered with it.
schema = 2
base_model = "deepseek/deepseek-v4-flash"

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.25

[cost.text.output]
price = 0.66
