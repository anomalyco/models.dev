# Pool metadata: opper.ai model catalog, https://api.opper.ai/v3/models (2026-11-14).
# Effort: top-level reasoning_effort; levels shared by the pool members.
# Context tiers mirror the OpenAI price bands (>272k) and match opper's catalog prices.
# Cache: OpenAI and Gemini cache automatically with no flag; https://docs.opper.ai/build/gateway/prompt-caching (2026-10-21).
schema = 2
base_model = "openai/gpt-6-luna"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
cache = { implicit = true }
structured_output = true

[limit]
context = 1_050_000
output = 128_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.1
cache = { read = 0.01, write = 0.125 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 0.2
cache = { read = 0.02, write = 0.25 }

[cost.text.output]
price = 0.5

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 0.75