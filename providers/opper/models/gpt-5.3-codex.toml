# Pool metadata: https://api.opper.ai/v3/models (2026-09-08).
# Effort: top-level reasoning_effort; OpenAI native levels on all pool members.
# Catalog context equals the lab input cap; retain the lab total context window.
schema = 2
base_model = "openai/gpt-5.3-codex"

[modalities]
input = ["text", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true
temperature = false

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.75
cache = { read = 0.175 }

[cost.text.output]
price = 14
