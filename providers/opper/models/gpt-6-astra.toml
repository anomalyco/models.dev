# Pool metadata: https://api.opper.ai/v3/models (2026-09-08).
# Effort: top-level reasoning_effort; levels shared by the pool members.
# Context tiers are conservative pool price ceilings, including marginal-rate bands.
base_model = "openai/gpt-6-astra"

reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 10
output = 50
cache_read = 1
cache_write = 12.5

[[cost.tiers]]
tier = { type = "context", size = 272000 }
input = 20
output = 75
cache_read = 2
cache_write = 25

[modalities]
input = ["text", "image"]

[interleaved]
field = "reasoning_content"
