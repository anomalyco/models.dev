# Pricing (USD/MTok, TokenRouter console pricing API, accessed 2026-11-12):
# sell price 2/10, cache read 0.2, cache write 2.5 (input = model_ratio x 2; output/cache scale off input)

schema = 2
v2_only = true
base_model = "anthropic/claude-sonnet-5-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 2
cache = { read = 0.2, write = 2.5 }

[cost.text.output]
price = 10
