# Pricing (USD/MTok, TokenRouter console pricing API, accessed 2026-11-12):
# sell price 1.25/2.5, cache read 0.2 (input = model_ratio x 2; output/cache scale off input)

schema = 2
v2_only = true
base_model = "xai/grok-4.3"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "low" }, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true

[cost.text.input]
price = 1.25
cache = { read = 0.2 }

[cost.text.output]
price = 2.5
