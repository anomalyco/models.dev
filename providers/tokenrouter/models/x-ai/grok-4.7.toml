# Pricing (USD/MTok, TokenRouter console pricing API, accessed 2026-11-12):
# sell price 2/6, cache read 0.5 (input = model_ratio x 2; output/cache scale off input)

schema = 2
v2_only = true
base_model = "xai/grok-4.7"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "high" }, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true

[cost.text.input]
price = 2
cache = { read = 0.5 }

[cost.text.output]
price = 6
