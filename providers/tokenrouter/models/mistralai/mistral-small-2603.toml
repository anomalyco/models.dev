# Pricing (USD/MTok, TokenRouter console pricing API, accessed 2026-11-12):
# sell price 0.15/0.6, cache read 0.015 (input = model_ratio x 2; output/cache scale off input)

schema = 2
v2_only = true
base_model = "mistral/mistral-small-2603"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "none" }, effort = ["none", "high"] }
structured_output = true

[cost.text.input]
price = 0.15
cache = { read = 0.015 }

[cost.text.output]
price = 0.6
