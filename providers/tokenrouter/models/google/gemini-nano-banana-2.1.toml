# Pricing (USD/MTok, TokenRouter console pricing API, accessed 2026-11-12):
# sell price 1.5/30 (input = model_ratio x 2; output/cache scale off input)

schema = 2
v2_only = true
base_model = "google/gemini-nano-banana-2.1"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "medium" }, effort = ["minimal", "medium", "high"] }
structured_output = false

[cost.text.input]
price = 1.5

[cost.text.output]
price = 30
