# Pricing (USD/MTok, TokenRouter console pricing API, accessed 2026-11-12):
# sell price 2/10, cache read 0.1 (input = model_ratio x 2; output/cache scale off input)

schema = 2
v2_only = true
base_model = "google/gemini-4-argon"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "medium" }, effort = ["low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 2
cache = { read = 0.1 }

[cost.text.output]
price = 10
