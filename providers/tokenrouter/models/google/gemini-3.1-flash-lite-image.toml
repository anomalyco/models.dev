# Pricing (USD/MTok, TokenRouter console pricing API, accessed 2026-11-12):
# sell price 0.25/1.5 (input = model_ratio x 2; output/cache scale off input)

schema = 2
v2_only = true
base_model = "google/gemini-3.1-flash-lite-image"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "minimal" }, effort = ["minimal", "high"] }
structured_output = false

[cost.text.input]
price = 0.25

[cost.text.output]
price = 1.5
