# Pricing (USD/MTok, TokenRouter console pricing API, accessed 2026-11-12):
# sell price 0.5/3, cache read 0.05, cache write 0.08333 (input = model_ratio x 2; output/cache scale off input)

schema = 2
v2_only = true
base_model = "google/gemini-3-flash-preview"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "high" }, effort = ["minimal", "low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 0.5
cache = { read = 0.05, write = 0.08333 }

[cost.text.output]
price = 3
