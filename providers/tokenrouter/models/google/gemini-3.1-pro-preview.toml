# Pricing (USD/MTok, TokenRouter console pricing API, accessed 2026-11-12):
# sell price 2/12, cache read 0.2, cache write 0.375 (input = model_ratio x 2; output/cache scale off input)

schema = 2
v2_only = true
base_model = "google/gemini-3.1-pro-preview"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "high" }, effort = ["low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 2
cache = { read = 0.2, write = 0.375 }

[cost.text.output]
price = 12
