# Pricing (USD/MTok, TokenRouter console pricing API, accessed 2026-11-12):
# sell price 1.5/7.5, cache read 0.15, cache write 0.08333 (input = model_ratio x 2; output/cache scale off input)

schema = 2
v2_only = true
base_model = "google/gemini-3.6-flash"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "medium" }, effort = ["minimal", "low", "medium", "high"] }
