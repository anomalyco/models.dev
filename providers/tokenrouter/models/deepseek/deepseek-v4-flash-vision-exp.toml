# Pricing (USD/MTok, TokenRouter console pricing API, accessed 2026-11-12):
# sell price 0.44/1.32, cache read 0.014 (input = model_ratio x 2; output/cache scale off input)

schema = 2
v2_only = true
base_model = "deepseek/deepseek-v4-flash-vision-exp"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "high" }, toggle = true, effort = ["low", "high", "max"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.44
cache = { read = 0.014 }

[cost.text.output]
price = 1.32
