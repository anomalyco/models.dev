# Pricing (USD/MTok, TokenRouter console pricing API, accessed 2026-11-12):
# sell price 0.13/0.85, cache read 0.025 (input = model_ratio x 2; output/cache scale off input)

schema = 2
v2_only = true
base_model = "zhipuai/glm-4.5-air"

[capabilities]
reasoning = { supported = true, default = { type = "toggle", value = true }, toggle = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.13
cache = { read = 0.025 }

[cost.text.output]
price = 0.85
