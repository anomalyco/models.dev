# Pricing (USD/MTok, TokenRouter console pricing API, accessed 2026-11-12):
# sell price 1.05/3.5, cache read 0.525 (input = model_ratio x 2; output/cache scale off input)

schema = 2
v2_only = true
base_model = "zhipuai/glm-5.1"

[capabilities]
reasoning = { supported = true, default = { type = "toggle", value = true }, toggle = true }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.05
cache = { read = 0.525 }

[cost.text.output]
price = 3.5
