# Pricing (USD/MTok, TokenRouter console pricing API, accessed 2026-11-12):
# sell price 0.56/1.76, cache read 0.104 (input = model_ratio x 2; output/cache scale off input)

schema = 2
v2_only = true
base_model = "zhipuai/glm-5.3"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "max" }, effort = ["low", "high", "max"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.56
cache = { read = 0.104 }

[cost.text.output]
price = 1.76
