# Pricing (USD/MTok, TokenRouter console pricing API, accessed 2026-11-12):
# sell price 5/25, cache read 0.5, cache write 6.25 (input = model_ratio x 2; output/cache scale off input)

schema = 2
v2_only = true
base_model = "anthropic/claude-opus-4-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"], budget = { min = 1024 } }
structured_output = true

[cost.text.input]
price = 5
cache = { read = 0.5, write = 6.25 }

[cost.text.output]
price = 25
