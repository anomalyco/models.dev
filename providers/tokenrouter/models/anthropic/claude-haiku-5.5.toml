# Pricing (USD/MTok, TokenRouter console pricing API, accessed 2026-11-12):
# sell price 0.5/2.5, cache read 0.05, cache write 0.625 (input = model_ratio x 2; output/cache scale off input)

schema = 2
v2_only = true
base_model = "anthropic/claude-haiku-5-5"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 0.5
cache = { read = 0.05, write = 0.625 }

[cost.text.output]
price = 2.5
