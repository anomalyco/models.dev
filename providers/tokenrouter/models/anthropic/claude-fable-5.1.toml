# Pricing (USD/MTok, TokenRouter console pricing API, accessed 2026-11-12):
# sell price 10/50, cache read 0.25, cache write 12.5 (input = model_ratio x 2; output/cache scale off input)

schema = 2
v2_only = true
base_model = "anthropic/claude-fable-5-1"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 10
cache = { read = 0.25, write = 12.5 }

[cost.text.output]
price = 50
