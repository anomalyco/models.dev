# Pricing (USD/MTok, TokenRouter console pricing API, accessed 2026-11-12):
# sell price 1.25/10, cache read 0.125 (input = model_ratio x 2; output/cache scale off input)

schema = 2
v2_only = true
base_model = "openai/gpt-5"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 1.25
cache = { read = 0.125 }

[cost.text.output]
price = 10
