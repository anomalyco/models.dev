# Pricing (USD/MTok, TokenRouter console pricing API, accessed 2026-11-12):
# sell price 0.75/4.5, cache read 0.075 (input = model_ratio x 2; output/cache scale off input)

schema = 2
v2_only = true
base_model = "openai/gpt-5.4-mini"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true

[cost.text.input]
price = 0.75
cache = { read = 0.075 }

[cost.text.output]
price = 4.5
