# Pricing (USD/MTok, TokenRouter console pricing API, accessed 2026-11-12):
# sell price 2.5/15, cache read 0.25 (input = model_ratio x 2; output/cache scale off input)

schema = 2
v2_only = true
base_model = "openai/gpt-5.4"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true

[cost.text.input]
price = 2.5
cache = { read = 0.25 }

[cost.text.output]
price = 15
