# Pricing (USD/MTok, TokenRouter console pricing API, accessed 2026-11-12):
# sell price 0.3/1.2, cache read 0.03 (input = model_ratio x 2; output/cache scale off input)

schema = 2
v2_only = true
base_model = "minimax/MiniMax-M2.1"

[capabilities]
reasoning = { supported = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.3
cache = { read = 0.03 }

[cost.text.output]
price = 1.2
