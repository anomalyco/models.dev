# Pricing (USD/MTok, TokenRouter console pricing API, accessed 2026-11-12):
# sell price 2/6, cache read 0.25, cache write 2.5 (input = model_ratio x 2; output/cache scale off input)

schema = 2
v2_only = true
base_model = "alibaba/qwen3.8-max"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "xhigh" }, toggle = true, effort = ["low", "medium", "xhigh"], budget = { min = 0, max = 262144 } }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 2
cache = { read = 0.25, write = 2.5 }

[cost.text.output]
price = 6
