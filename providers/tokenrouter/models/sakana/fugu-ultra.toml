# Pricing (USD/MTok, TokenRouter console pricing API, accessed 2026-11-12):
# sell price 5/30, cache read 0.5 (input = model_ratio x 2; output/cache scale off input)

schema = 2
v2_only = true
base_model = "sakana/fugu-ultra"

[limit]
output = 128_000

[capabilities]
reasoning = { supported = true, effort = ["high", "xhigh"] }
structured_output = true

[cost.text.input]
price = 5
cache = { read = 0.5 }

[cost.text.output]
price = 30
