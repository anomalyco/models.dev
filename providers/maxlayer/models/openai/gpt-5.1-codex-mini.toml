# Reasoning is controlled with OpenRouter's fields — Maxlayer forwards the
# request body unchanged.
# Toggle: reasoning.enabled = true|false
# Effort: reasoning.effort (top-level reasoning_effort is an alias)
# Budget: reasoning.max_tokens (integer reasoning tokens)
# https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
base_model = "openai/gpt-5.1-codex-mini"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
input = 0.28485
output = 2.2788
cache_read = 0.034182
