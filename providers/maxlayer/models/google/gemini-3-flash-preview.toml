# Toggle: reasoning.enabled = true|false
# Effort: reasoning.effort (top-level reasoning_effort is an alias)
# Budget: reasoning.max_tokens (integer reasoning tokens)
base_model = "google/gemini-3-flash-preview"

[interleaved]
field = "reasoning_details"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["minimal", "low", "medium", "high"]

[cost]
input = 0.5697
output = 3.4182
cache_read = 0.05697
cache_write = 0.094951
