# Effort: output_config.effort = low|medium|high|max
# Budget: thinking.budget_tokens (integer reasoning tokens)
base_model = "anthropic/claude-sonnet-4-6"
structured_output = true

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "max"]

[[reasoning_options]]
type = "budget_tokens"
min = 1_024

[cost]
input = 3.4182
output = 17.091
cache_read = 0.34182
cache_write = 4.27275

[limit]
output = 128_000
