# KovAPI docs for this model: https://docs.kovapi.com/gpt-5.6-luna (read 2026-11-21).
# Prices, USD per 1M tokens: input 0.07, output 0.40, cache hit 0.007 (https://kovapi.com/llms.txt,
#   https://kovapi.com/api/pricing, 2026-11-21). The price list has no long-context tier.
# Effort: reasoning_effort = low|medium|high|xhigh on Chat Completions, medium when unset
#   (docs page, "Thinking"). KovAPI does not offer none or max for this model.
# Sampling: KovAPI ignores temperature and top_p for this model (docs page, "Request parameters").
# Limit: KovAPI documents a ~272K-token context window for this model (docs page, "At a glance").
# Input: text and images on Chat Completions (docs page, "At a glance"); PDF input is not offered.
# Tools: the docs page documents function tools (OpenAI tools format) only. Custom (freeform) tools are
#   not documented on KovAPI, so freeform is left out.
# Cache: automatic prefix caching, no write charge; hits are reported in
#   usage.prompt_tokens_details.cached_tokens (docs page, "Prompt caching").
schema = 2
base_model = "openai/gpt-5.6-luna"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "medium" }, effort = ["low", "medium", "high", "xhigh"] }
cache = { implicit = true }
temperature = false
top_p = false

[limit]
context = 272_000
input = 272_000

[cost.text.input]
price = 0.07
cache = { read = 0.007 }

[cost.text.output]
price = 0.4
