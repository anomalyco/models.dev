# Sources (accessed 2026-09-25):
# - https://api.wokey.ai/v1/models/pricing (public, no key; id "claude-fable-5-1"; pricing_mode dynamic_discount)
# - https://api.wokey.ai/v1/models (context_length, max_completion_tokens, input_modalities)
# - https://wokey.ai/models/claude-fable-5-1
# Reasoning options copied from providers/anthropic/models/claude-fable-5-1.toml (Wokey relays the upstream API).
# Pricing is flat per token at every context length: Wokey has no long-context tier or premium.
# cache_write is the 5-minute cache write price; 1-hour cache write is 5.3 USD/MTok.
# Input modalities narrowed to the list Wokey publishes for this model.
# Request shape: Anthropic Messages API (POST https://api.wokey.ai/v1/messages).
base_model = "anthropic/claude-fable-5-1"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh", "max"]

[cost]
input = 2.65
output = 13.25
cache_read = 0.06625
cache_write = 3.3125

[modalities]
input = ["text", "image"]

[provider]
npm = "@ai-sdk/anthropic"
api = "https://api.wokey.ai/v1"
