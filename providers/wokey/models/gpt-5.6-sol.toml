# Sources (accessed 2026-09-25):
# - https://api.wokey.ai/v1/models/pricing (public, no key; id "gpt-5.6-sol"; pricing_mode dynamic_discount)
# - https://api.wokey.ai/v1/models (context_length, max_completion_tokens, input_modalities)
# - https://wokey.ai/models/gpt-5.6-sol
# Reasoning options copied from providers/openai/models/gpt-5.6-sol.toml (Wokey relays the upstream API).
# Pricing is flat per token at every context length: Wokey has no long-context tier or premium.
# Input modalities narrowed to the list Wokey publishes for this model.
# Request shape: OpenAI Responses API (POST https://api.wokey.ai/v1/responses).
base_model = "openai/gpt-5.6-sol"
attachment = false

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "xhigh", "max"]

[cost]
input = 0.44
output = 2.2
cache_read = 0.044
cache_write = 0.55

[modalities]
input = ["text"]

[provider]
npm = "@ai-sdk/openai"
api = "https://api.wokey.ai/v1"
