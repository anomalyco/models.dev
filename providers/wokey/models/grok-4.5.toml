# Sources (accessed 2026-09-25):
# - https://api.wokey.ai/v1/models/pricing (public, no key; id "grok-4.5"; pricing_mode dynamic_discount)
# - https://api.wokey.ai/v1/models (context_length, max_completion_tokens, input_modalities)
# - https://wokey.ai/models/grok-4.5
# Reasoning options copied from providers/xai/models/grok-4.5.toml (Wokey relays the upstream API).
# Pricing is flat per token at every context length: Wokey has no long-context tier or premium.
# Limits narrowed to what Wokey serves for this model.
# Input modalities narrowed to the list Wokey publishes for this model.
base_model = "xai/grok-4.5"
attachment = false

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
input = 0.28
output = 0.84
cache_read = 0.028

[limit]
output = 64_000

[modalities]
input = ["text"]
