# Sources (accessed 2026-09-25):
# - https://api.wokey.ai/v1/models/pricing (public, no key; id "grok-4.3"; pricing_mode dynamic_discount)
# - https://api.wokey.ai/v1/models (context_length, max_completion_tokens, input_modalities)
# - https://wokey.ai/models/grok-4.3
# Reasoning options copied from providers/xai/models/grok-4.3.toml (Wokey relays the upstream API).
# Pricing is flat per token at every context length: Wokey has no long-context tier or premium.
# Limits narrowed to what Wokey serves for this model.
# Input modalities narrowed to the list Wokey publishes for this model.
base_model = "xai/grok-4.3"
attachment = false

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high"]

[cost]
input = 0.1875
output = 0.375
cache_read = 0.01875

[limit]
context = 256_000

[modalities]
input = ["text"]
