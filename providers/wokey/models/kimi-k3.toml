# Sources (accessed 2026-09-25):
# - https://api.wokey.ai/v1/models/pricing (public, no key; id "kimi-k3"; pricing_mode dynamic_discount)
# - https://api.wokey.ai/v1/models (context_length, max_completion_tokens, input_modalities)
# - https://wokey.ai/models/kimi-k3
# Reasoning options narrowed from providers/moonshotai/models/kimi-k3.toml (Wokey relays the upstream API).
# Pricing is flat per token at every context length: Wokey has no long-context tier or premium.
# Toggle: thinking.type = enabled|disabled
# Graded effort (thinking.type = adaptive + output_config.effort) is not declared: it is
# not verified on Wokey, and the tested OpenAI-compatible peer
# providers/ofox/models/moonshotai/kimi-k3.toml found adaptive rejected.
# Input modalities narrowed to the list Wokey publishes for this model.
base_model = "moonshotai/kimi-k3"

[[reasoning_options]]
type = "toggle"

[cost]
input = 0.9
output = 4.5
cache_read = 0.09

[modalities]
input = ["text", "image"]
