# Sources (accessed 2026-09-25):
# - https://api.wokey.ai/v1/models/pricing (public, no key; id "MiniMax-M3"; pricing_mode dynamic_discount)
# - https://api.wokey.ai/v1/models (context_length, max_completion_tokens, input_modalities)
# - https://wokey.ai/models/MiniMax-M3
# Reasoning options copied from providers/minimax/models/MiniMax-M3.toml (Wokey relays the upstream API).
# Pricing is flat per token at every context length: Wokey has no long-context tier or premium.
# Toggle: thinking.type = enabled|disabled
# Limits narrowed to what Wokey serves for this model.
# Input modalities narrowed to the list Wokey publishes for this model.
base_model = "minimax/MiniMax-M3"
attachment = false

[[reasoning_options]]
type = "toggle"

[cost]
input = 0.09
output = 0.36
cache_read = 0.018

[limit]
context = 1_000_000
output = 80_000

[modalities]
input = ["text"]
