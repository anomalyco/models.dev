# Sources (accessed 2026-09-25):
# - https://api.wokey.ai/v1/models/pricing (public, no key; id "gpt-5.5"; pricing_mode dynamic_discount)
# - https://api.wokey.ai/v1/models (context_length, max_completion_tokens, input_modalities)
# - https://wokey.ai/models/gpt-5.5
# Reasoning options copied from providers/openai/models/gpt-5.5.toml (Wokey relays the upstream API).
# Input modalities narrowed to the list Wokey publishes for this model.
# Request shape: OpenAI Responses API (POST https://api.wokey.ai/v1/responses).
base_model = "openai/gpt-5.5"
attachment = false

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "xhigh"]

[cost]
input = 0.5
output = 3
cache_read = 0.05

[modalities]
input = ["text"]

[provider]
npm = "@ai-sdk/openai"
api = "https://api.wokey.ai/v1"
