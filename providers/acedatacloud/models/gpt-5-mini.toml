# Ace model catalog and supported protocols: https://platform.acedata.cloud/api/v1/models/?type=chat
# Exact upstream lab identity supplies baseline model metadata. The catalog does not establish host-specific limits.
# Host request schema: https://platform.acedata.cloud/api/v1/apis/c9969b66-effb-4753-b504-a82c4d16f83f
# Effort: reasoning_effort. Host-documented values intersected with providers/openai/models/gpt-5-mini.toml.
# Billing: https://platform.acedata.cloud/api/v1/apis/c9969b66-effb-4753-b504-a82c4d16f83f/
# USD per million tokens, 2026-11-24: the entry package is $7 per 40 Credits.
# Chat Completions: tools.items requires type=function and a function definition.
# Responses: the host ResponsesCustomTool schema accepts type=custom with an optional format object.
# Raw text is documented; no lark/regex grammar enforcement is established.
# https://platform.acedata.cloud/api/v1/apis/ed972a38-ecef-4fcb-af33-750de42d25dc/
# chat-completions: the API definition publishes /openai/chat/completions (path) and /v1/chat/completions (path2).
# responses: the API definition publishes /openai/responses (path) and /v1/responses (path2).
# Cached usage is priced by the host. Caller-set cache policy is undocumented.
schema = 2
base_model = "openai/gpt-5-mini"

[capabilities]
cache = { implicit = true }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }

[cost.text.input]
price = 0.09198315
cache = { read = 0.00919835 }

[cost.text.output]
price = 0.735865725

[api.chat-completions]
base_url = "https://api.acedata.cloud/v1"

[api.responses]
capabilities = { tools = { freeform = ["text"] } }
base_url = "https://api.acedata.cloud/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }
