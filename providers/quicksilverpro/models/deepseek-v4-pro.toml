# Pricing and host limits: https://quicksilverpro.io/models/deepseek-v4-pro/
# Canonical catalog: https://quicksilverpro.io/model-catalog.json (version 70, 2026-11-04)
# Pricing: https://quicksilverpro.io/pricing.json
# Reasoning baseline: providers/deepseek/models/deepseek-v4-pro.toml
# Relay controls: https://quicksilverpro.io/docs/quickstart/
# Toggle: reasoning.enabled = true|false
# Effort: reasoning_effort = low|high|max
schema = 2
base_model = "deepseek/deepseek-v4-pro"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 1048576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.7
cache = { read = 0.1 }

[cost.text.output]
price = 2.1
