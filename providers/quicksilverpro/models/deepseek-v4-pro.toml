# QuickSilver Pro is an OpenAI-compatible relay: it forwards `reasoning` and
# `reasoning_effort` through to the upstream model unchanged.
# Toggle: reasoning.enabled = true|false
# Effort: reasoning_effort = high|xhigh
# Docs: https://quicksilverpro.io/docs (accessed 2026-09-26)
base_model = "deepseek/deepseek-v4-pro"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["high", "xhigh"]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.7
output = 2.1
cache_read = 0.1
