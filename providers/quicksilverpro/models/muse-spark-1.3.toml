# QuickSilver Pro is an OpenAI-compatible relay: it forwards `reasoning` and
# `reasoning_effort` through to the upstream model unchanged.
# Effort: reasoning_effort = minimal|low|medium|high|xhigh|max
# Docs: https://quicksilverpro.io/docs (accessed 2026-10-02)
# Pricing: https://quicksilverpro.io/models/muse-spark-1.3/ and https://quicksilverpro.io/pricing.json
base_model = "meta/muse-spark-1.3"

[[reasoning_options]]
type = "effort"
values = ["minimal", "low", "medium", "high", "xhigh", "max"]

[cost]
input = 1
output = 3.4
cache_read = 0.12
