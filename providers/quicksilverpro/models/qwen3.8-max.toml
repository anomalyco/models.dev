# QuickSilver Pro is an OpenAI-compatible relay: it forwards `reasoning` and
# `reasoning_effort` through to the upstream model unchanged.
# Qwen3.8 Max is a hybrid thinking model exposed through the relay:
# Toggle: enable_thinking = true|false
# Effort: reasoning_effort = low|medium|xhigh (high aliases to xhigh)
# Budget: thinking_budget (0..262144 reasoning tokens; not combinable with effort)
# Docs: https://quicksilverpro.io/docs (accessed 2026-09-26)
base_model = "alibaba/qwen3.8-max"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "xhigh"]

[[reasoning_options]]
type = "budget_tokens"
min = 0
max = 262_144

[interleaved]
field = "reasoning_content"

[cost]
input = 2
output = 6
cache_read = 0.25
cache_write = 2.5
