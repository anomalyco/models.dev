# Reasoning toggle wire path: `enable_thinking = true|false` (DashScope-compatible
# passthrough; same control the lab documents). Verified live 2026-08-11 on
# api.quicksilverpro.io: default/false -> no reasoning tokens; true ->
# reasoning_content + usage reasoning_tokens.
base_model = "alibaba/qwen3.8-max"
description = "Flagship Qwen — autonomous coding and long-horizon agents"

[[reasoning_options]]
type = "toggle"

[interleaved]
field = "reasoning_content"

[cost]
input = 2
output = 6
cache_read = 0.25
