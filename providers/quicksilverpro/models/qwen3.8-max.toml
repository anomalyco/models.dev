# Pricing and host limits: https://quicksilverpro.io/models/qwen3.8-max/
# Canonical catalog: https://quicksilverpro.io/model-catalog.json (version 70, 2026-11-04)
# Pricing: https://quicksilverpro.io/pricing.json
# Reasoning baseline: providers/alibaba/models/qwen3.8-max.toml
# Relay controls: https://quicksilverpro.io/docs/quickstart/
# Toggle: enable_thinking = true|false
# Effort: reasoning_effort = low|medium|xhigh
# Budget: thinking_budget (reasoning tokens)
schema = 2
base_model = "alibaba/qwen3.8-max"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "xhigh"], budget = { min = 0, max = 262144 } }
structured_output = true
cache = { implicit = true }

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[limit]
context = 1048576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 2.0
cache = { read = 0.25, write = 2.5 }

[cost.text.output]
price = 6.0
