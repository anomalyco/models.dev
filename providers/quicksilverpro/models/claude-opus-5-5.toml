# Effort: reasoning_effort = low|medium|high|xhigh|max
schema = 2
base_model = "anthropic/claude-opus-5-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
cache = { explicit = { ttl = ["5m", "1h"] } }

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[api.chat-completions]

[cost.text.input]
price = 1
cache = { read = 0.05, write = { 5m = 1.25, 1h = 2 } }

[cost.text.output]
price = 5
