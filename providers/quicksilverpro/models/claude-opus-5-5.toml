# Pricing and host limits: https://quicksilverpro.io/models/claude-opus-5-5/
# Canonical catalog: https://quicksilverpro.io/model-catalog.json (version 70, 2026-11-04)
# Pricing: https://quicksilverpro.io/pricing.json
# Reasoning baseline: providers/anthropic/models/claude-opus-5-5.toml
