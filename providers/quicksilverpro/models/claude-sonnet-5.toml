# Pricing and host limits: https://quicksilverpro.io/models/claude-sonnet-5/
# Canonical catalog: https://quicksilverpro.io/model-catalog.json (version 70, 2026-11-04)
# Pricing: https://quicksilverpro.io/pricing.json
# Reasoning baseline: providers/anthropic/models/claude-sonnet-5.toml
# Relay controls: https://quicksilverpro.io/docs/quickstart/
# Toggle: reasoning.enabled = true|false
# Effort: reasoning_effort = low|medium|high|xhigh|max
schema = 2
base_model = "anthropic/claude-sonnet-5"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }
cache = { explicit = { ttl = ["5m", "1h"] } }

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[api.chat-completions]

[cost.text.input]
price = 0.5
cache = { read = 0.05, write = { 5m = 0.625, 1h = 1 } }

[cost.text.output]
price = 2.5
