# QuickSilver Pro is an OpenAI-compatible relay: it forwards `reasoning` and
# `reasoning_effort` through to the upstream model unchanged.
# Toggle: reasoning.enabled = true|false
# Effort: reasoning_effort = low|high|max
# Docs: https://quicksilverpro.io/docs (accessed 2026-10-02)
# Pricing: https://quicksilverpro.io/models/deepseek-v4.1-flash/ and https://quicksilverpro.io/pricing.json
base_model = "deepseek/deepseek-v4.1-flash"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.125
output = 0.55
cache_read = 0.0125
