# QuickSilver Pro is an OpenAI-compatible relay: it forwards `reasoning` and
# `reasoning_effort` through to the upstream model unchanged.
# Toggle: reasoning.enabled = true|false
# Effort: reasoning_effort = low|high|max
# Docs: https://quicksilverpro.io/docs (accessed 2026-09-26)
base_model = "deepseek/deepseek-v4.1-flash"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.3
output = 1.2
cache_read = 0.006
