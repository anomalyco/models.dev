# Pricing and host limits: https://quicksilverpro.io/models/grok-4.7/
# Canonical catalog: https://quicksilverpro.io/model-catalog.json (version 70, 2026-11-04)
# Pricing: https://quicksilverpro.io/pricing.json
# Reasoning baseline: providers/xai/models/grok-4.7.toml
# Relay controls: https://quicksilverpro.io/docs/quickstart/
# Effort: reasoning_effort = low|medium|high|xhigh
schema = 2
base_model = "xai/grok-4.7"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
cache = { implicit = true }

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[api.chat-completions]

[cost.text.input]
price = 2.0
cache = { read = 0.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 200000 } }
price = 4.0
cache = { read = 1.0 }

[cost.text.output]
price = 6.0

[[cost.text.output.overrides]]
when = { context = { gt = 200000 } }
price = 12.0
