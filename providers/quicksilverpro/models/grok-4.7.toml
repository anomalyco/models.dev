# QuickSilver Pro is an OpenAI-compatible relay: it forwards `reasoning` and
# `reasoning_effort` through to the upstream model unchanged.
# Effort: reasoning_effort = low|medium|high|xhigh
# Docs: https://quicksilverpro.io/docs (accessed 2026-10-02)
# Pricing: https://quicksilverpro.io/models/grok-4.7/ and https://quicksilverpro.io/pricing.json
base_model = "xai/grok-4.7"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh"]

[cost]
input = 2
output = 6
cache_read = 0.5
