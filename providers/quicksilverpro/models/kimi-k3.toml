# Reasoning toggle wire path: OpenAI-compatible `reasoning = { enabled = true|false }`.
# Verified live 2026-08-11 on api.quicksilverpro.io: enabled=false -> no reasoning
# tokens; enabled=true -> reasoning_content + usage reasoning_tokens.
base_model = "moonshotai/kimi-k3"
description = "Moonshot Kimi K3 — agentic coding and tool use, 1M context"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 2.4
output = 12
cache_read = 0.24
