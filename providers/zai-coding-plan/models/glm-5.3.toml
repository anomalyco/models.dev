# Sources (accessed 2026-10-19):
# - Plan and supported models: https://docs.z.ai/devpack/overview, https://docs.z.ai/devpack/latest-model
# - Thinking (Coding Plan effort mapping): https://docs.z.ai/guides/capabilities/thinking
# Subscription plan billed in credits, so no per-token cost.
# Effort: none|minimal|low map to low, medium|high to high, xhigh|max to max; disabling thinking maps to low.
schema = 2
base_model = "zhipuai/glm-5.3"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, default = { type = "effort", value = "max" }, effort = ["low", "high", "max"] }
structured_output = true
top_k = false
cache = { supported = true, implicit = true, explicit = false }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
