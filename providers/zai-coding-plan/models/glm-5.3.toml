# Sources (accessed 2026-10-19):
# - Plan and supported models: https://docs.z.ai/devpack/overview, https://docs.z.ai/devpack/latest-model
# - Thinking (Coding Plan effort mapping): https://docs.z.ai/guides/capabilities/thinking
# Subscription plan billed in credits, so no per-token cost.
# Effort: none|minimal|low map to low, medium|high to high, xhigh|max to max; disabling thinking maps to low.
# Tools: tool_choice supports only auto; no strict tool mode (https://docs.z.ai/api-reference/llm/chat-completion,
#   https://docs.z.ai/guides/capabilities/function-calling).
schema = 2
base_model = "zhipuai/glm-5.3"

[capabilities]
tools = { supported = true, choice = ["auto"] }
reasoning = { supported = true, default = { type = "effort", value = "max" }, effort = ["low", "high", "max"] }
structured_output = true
top_k = false
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content", max_tokens_field = "max_tokens" }

[api.messages]
base_url = "https://api.z.ai/api/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/zai-coding-plan/messages" }

[api.responses]
base_url = "https://api.z.ai/api/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/zai-coding-plan/responses" }

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
