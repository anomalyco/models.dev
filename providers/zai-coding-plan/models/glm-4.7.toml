# Sources (accessed 2026-10-19):
# - Plan and supported models: https://docs.z.ai/devpack/overview, https://docs.z.ai/devpack/latest-model
# - Thinking (Coding Plan effort mapping): https://docs.z.ai/guides/capabilities/thinking
# Subscription plan billed in credits, so no per-token cost.
# Deprecated: the plan now serves only GLM-5.3 and GLM-5.3-Flash; requests for this model are routed to GLM-5.3-Flash.
# Toggle: thinking.type = enabled|disabled (default enabled)
# Tools: tool_choice supports only auto; no strict tool mode (https://docs.z.ai/api-reference/llm/chat-completion,
#   https://docs.z.ai/guides/capabilities/function-calling).
schema = 2
base_model = "zhipuai/glm-4.7"
status = "deprecated"

[capabilities]
tools = { supported = true, choice = ["auto"] }
reasoning = { supported = true, default = { type = "toggle", value = true }, toggle = true }
top_k = false
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content", max_tokens_field = "max_tokens" }

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
