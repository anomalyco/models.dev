# attachment=true: accepts screenshot/image input. structured_output covers
# response_format (json_object / json schema). release_date is the /v1/models
# `created` timestamp.
# Pricing: https://docs.lightcone.ai/guides/pricing/ lists `tzafon.northstar-cua-fast`
# at $0.50/M input, $1.50/M output.
# Limits: an oversized max_completion_tokens request against /v1/chat/completions
# returns max_model_len=max_total_tokens=262144 (a shared input+output budget).

name = "Northstar CUA Fast"
description = "Computer-use agent model for browser and desktop automation via screenshot input"
attachment = true
reasoning = false
tool_call = true
structured_output = true
temperature = true
release_date = "2026-04-22"
last_updated = "2026-07-02"
open_weights = false

[cost]
input = 0.50
output = 1.50

[limit]
context = 262_144
input = 262_144
output = 262_144

[modalities]
input = ["text", "image"]
output = ["text"]
