# Effort: reasoning_effort = low|medium|high|xhigh|max|ultracode (catalog enum represents through max)
# Sources: https://api.bee.heossi.com/openapi.json and https://api.bee.heossi.com/bee/openrouter/models
# Input MIME types from https://api.bee.heossi.com/bee/openrouter/models (checked 2026-10-21).
schema = 2
name = "Bee Brood 1.0"
description = "Production multimodal reasoning for image and video analysis, tool-enabled workflows, and multi-step planning at controlled cost."
open_weights = false
release_date = "2026-07-10"
last_updated = "2026-09-28"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "video/mp4", "video/webm", "audio/wav", "audio/mpeg"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = false
temperature = true

[limit]
context = 262_144
output = 16_384

[cost.text.input]
price = 0.6
cache = { read = 0.06, write = 0.72 }

[cost.text.output]
price = 2.4
