# Effort: reasoning_effort = low|medium|high|xhigh|max|ultracode (catalog enum represents through max)
# Sources: https://api.bee.heossi.com/openapi.json and https://api.bee.heossi.com/bee/models
schema = 2
name = "Bee Swarm 1.0"
description = "Premium reasoning, multi-model cloud execution, large-document analysis, and high-value technical work. Includes the evolution engine and stronger eval gates by default."
open_weights = false
release_date = "2026-07-10"
last_updated = "2026-09-28"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = false

[limit]
context = 1_000_000
output = 64_000

[cost.text.input]
price = 25
cache = { read = 2.5, write = 30 }

[cost.text.output]
price = 150
