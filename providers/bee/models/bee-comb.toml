# Effort: reasoning_effort = low|medium|high|xhigh|max|ultracode (catalog enum represents through max)
# Sources: https://api.bee.heossi.com/openapi.json and https://api.bee.heossi.com/bee/openrouter/models
name = "Bee Comb 2.0"
description = "Stronger local/workstation AI for coding, architecture, security reasoning, larger RAG, and domain-specific workflows. The default workhorse for engineers and dev teams."
attachment = true
reasoning = true
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]
tool_call = true
structured_output = true
temperature = true
open_weights = false
release_date = "2026-07-10"
last_updated = "2026-09-28"

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[limit]
context = 262144
output = 16384

[cost]
input = 1.25
output = 5.00
cache_read = 0.125
cache_write = 1.50
