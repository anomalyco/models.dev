# Sources (accessed 2026-11-17):
# - Models table, limits and routed-model notes: https://lebrel.ai/docs
# - Prices, limits and data note: https://lebrel.ai/api/models and https://attested.lebrel.ai/v1/models
# - How the router maps reasoning switches and efforts: https://github.com/LEBREL-AI/router (README section
#   "Production: Alibaba Model Studio first", routes.production.json and internal/router/server.go)
# Relayed by Lebrel's router to alibaba/model-studio (qwen4-max), this route's only upstream: there is no fallback.
# Toggle: enable_thinking true|false.
# Effort: reasoning_effort = low|high|xhigh (high when none is named), as the model's data note states.
# Budget: thinking_budget (reasoning tokens), forwarded to Model Studio. providers/llmgateway-providers notes
# that Alibaba documents none for Qwen4 Max, but it is honoured here: 32 gave exactly 32 reasoning tokens.
# Bounds were not checked, so none are set.
# Tools: tool_choice auto, none, required and a named function each behaved as asked, reasoning off (probed
# 2026-11-19).
# Structured output: a JSON Schema response_format was enforced against a prompt asking for a haiku (probed
# 2026-11-19).
# Lebrel's rates for this model are flat (no peak schedule).
# Input: input_modalities in /v1/models lists text, image and file. The lab's image formats and PDF are kept (a
# file part is forwarded to Model Studio) and video, which the catalog does not list, is left out.
# Cache: Lebrel publishes a cached-input rate for this model and the upstream caches prefixes implicitly.
# Stream usage: the router sets stream_options.include_usage on every streamed request itself, and a stream sent
# with it ended with a usage chunk (probed 2026-11-19).
# Checked live 2026-11-17: enable_thinking false gave no reasoning, thinking_budget 32 gave exactly 32 reasoning tokens, and a
# PDF file part was read.
# Probed 2026-11-19: a PNG was read.
schema = 2
base_model = "alibaba/qwen4-max"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, default = { type = "effort", value = "high" }, toggle = true, effort = ["low", "high", "xhigh"], budget = {} }
structured_output = true
stream_usage = true
cache = { implicit = true }

[limit]
output = 131_072

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.4
cache = { read = 0.07 }

[cost.text.output]
price = 4.2
