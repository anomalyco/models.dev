# Sources (accessed 2026-11-17):
# - Models table, limits and routed-model notes: https://lebrel.ai/docs
# - Prices, limits and data note: https://lebrel.ai/api/models and https://attested.lebrel.ai/v1/models
# - How the router maps reasoning switches and efforts: https://github.com/LEBREL-AI/router (README)
# Relayed by Lebrel's router. First upstream: zai/api-flash (glm-5.3-flash). The model's data note
# names the fallbacks, and the signed route receipt names which upstream served.
# No off switch: a request that disables thinking is refused with HTTP 400 (the model always thinks).
# Effort: reasoning_effort = low|high|max (default max).
# top_k: off. The router forwards it unchanged and Z.ai's Chat API takes temperature and top_p only (see
# providers/zai). Not probed live.
# Output cap: max_tokens. The router accepts max_completion_tokens too but forwards it as sent, and Z.ai's
# Chat API only takes max_tokens (see providers/zai). Not probed live.
# Lebrel's rates for this model are flat (no peak schedule).
# Input: input_modalities in /v1/models lists text and file. PDF is kept; the router refuses images for this
# route and the catalog does not list video.
# Cache: Lebrel publishes a cached-input rate for this model and the upstream caches prefixes implicitly.
# Checked live 2026-11-17: thinking disabled refused with HTTP 400, a PDF file part read, and an image refused by the router.
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[modalities]
input = ["text", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "max" }, effort = ["low", "high", "max"] }
top_k = false
stream_usage = true
cache = { implicit = true }

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content", max_tokens_field = "max_tokens" }

[cost.text.input]
price = 0.17
cache = { read = 0.034 }

[cost.text.output]
price = 0.56
