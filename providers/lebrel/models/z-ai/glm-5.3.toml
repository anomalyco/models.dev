# Sources (accessed 2026-11-17):
# - Models table, limits and routed-model notes: https://lebrel.ai/docs
# - Prices, limits and data note: https://lebrel.ai/api/models and https://attested.lebrel.ai/v1/models
# - How the router maps reasoning switches and efforts: https://github.com/LEBREL-AI/router (README)
# Relayed by Lebrel's router. First upstream: alibaba/model-studio (glm-5.3). The model's data note
# names the fallbacks, and the signed route receipt names which upstream served.
# No off switch: a request that disables thinking is served at the lowest effort (router README).
# Effort: reasoning_effort = low|high|max (default max).
# Lebrel's rates for this model are flat (no peak schedule).
# Cache: Lebrel publishes a cached-input rate for this model and the upstream caches prefixes implicitly.
# Checked live 2026-11-17: reasoning_effort low accepted, and a request with thinking disabled was answered, not refused.
schema = 2
base_model = "zhipuai/glm-5.3"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "max" }, effort = ["low", "high", "max"] }
stream_usage = true
cache = { implicit = true }

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.26
cache = { read = 0.234 }

[cost.text.output]
price = 3.96
