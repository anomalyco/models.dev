# Sources (accessed 2026-11-17):
# - Models table, limits and routed-model notes: https://lebrel.ai/docs
# - Prices, limits and data note: https://lebrel.ai/api/models and https://attested.lebrel.ai/v1/models
# - How the router maps reasoning switches and efforts: https://github.com/LEBREL-AI/router (README)
# Relayed by Lebrel's router. First upstream: alibaba/model-studio (kimi-k3). The model's data note
# names the fallbacks, and the signed route receipt names which upstream served.
# Toggle: enable_thinking true|false when Model Studio serves (thinking.type is mapped onto it), the same
# controls as providers/alibaba/models/kimi-k3.toml; the Moonshot fallback always reasons.
# Effort: reasoning_effort = low|high|max (default max).
# Lebrel's rates for this model are flat (no peak schedule).
# Input: input_modalities in /v1/models lists text, image and file. The lab's image formats are kept and video,
# which the catalog does not list, is left out.
# Cache: Lebrel publishes a cached-input rate for this model and the upstream caches prefixes implicitly.
# Checked live 2026-11-17: enable_thinking false gave 0 reasoning tokens against 59 at low effort.
schema = 2
base_model = "moonshotai/kimi-k3"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "max" }, toggle = true, effort = ["low", "high", "max"] }
stream_usage = true
cache = { implicit = true }

[limit]
output = 131_072

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 3.3
cache = { read = 0.33 }

[cost.text.output]
price = 16.5
