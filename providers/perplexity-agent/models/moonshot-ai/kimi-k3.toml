# Perplexity Agent API pricing scraped from
# https://docs.perplexity.ai/docs/agent-api/models (accessed 2026-07-30).
# Kimi K3 capability confirmation sourced from
# https://huggingface.co/moonshotai/Kimi-K3 and https://platform.kimi.ai/docs/overview.
# Perplexity docs note that Kimi K3 accepts minimal, low, medium, high, xhigh,
# and max reasoning effort (minimal = low; xhigh and max = max effort) and that
# reasoning tokens are billed at the output-token rate.
# Perplexity docs: minimal/low/medium select low effort; xhigh/max select max effort.
# Reasoning tokens are billed at the output-token rate.
# This ID is rejected as "not supported" (live probe 2026-10-21); the Agent API serves Kimi K3 as perplexity/kimi-k3.
# Agent API tool fees (per call; v2 cost has no per-call field): web_search $0.0025 ($0.001 with search_type fast),
#   image_search $0.0025, fetch_url $0.0005, people_search and finance_search $0.005, sandbox $0.03 per session
#   (https://docs.perplexity.ai/docs/getting-started/pricing.md, accessed 2026-10-21).
schema = 2
base_model = "moonshotai/kimi-k3"
status = "deprecated"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "video/mp4", "video/mpeg", "video/mov", "video/avi", "video/x-flv", "video/mpg", "video/webm", "video/wmv", "video/3gpp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 3
cache = { read = 0.3 }

[cost.text.output]
price = 15
