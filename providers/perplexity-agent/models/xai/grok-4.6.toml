# Pricing per Perplexity Agent API docs:
# https://docs.perplexity.ai/docs/agent-api/models#xai
# Context-based tiers: <=200k / >200k.
schema = 2
base_model = "xai/grok-4.6"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true

[cost.text.input]
price = 2
cache = { read = 0.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 4
cache = { read = 1 }

[cost.text.output]
price = 6

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 12
