# Pricing per Perplexity Agent API docs:
# https://docs.perplexity.ai/docs/agent-api/models#xai
# Context-based tiers: <=200k / >200k.
base_model = "xai/grok-4.6"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh"]

[cost]
input = 2.00
output = 6.00
cache_read = 0.50

[[cost.tiers]]
tier = { type = "context", size = 200_000 }
input = 4.00
output = 12.00
cache_read = 1.00
