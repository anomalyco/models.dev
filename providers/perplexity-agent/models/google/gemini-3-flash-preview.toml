schema = 2
name = "Gemini 3 Flash Preview"
description = "Fast Gemini model balancing multimodal reasoning, tool use, and cost"
family = "gemini-flash"
open_weights = false
knowledge = "2025-01"
release_date = "2025-12-17"

[modalities]
input = ["text", "image", "video", "audio", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
temperature = true

[limit]
context = 1_048_576
output = 65_536

[cost.text.input]
price = 0.5
cache = { read = 0.05 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 0.5
cache = { read = 0.05 }

[cost.text.output]
price = 3

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 3
