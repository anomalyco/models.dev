# Pricing: https://docs.perplexity.ai/docs/agent-api/models (accessed 2026-08-27)
# Context tiers: <=200k / >200k. Cache-read = 10% of input rate.
base_model = "google/gemini-3.1-pro-preview"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh", "max"]

[cost]
input = 2.00
output = 12.00
cache_read = 0.20

[[cost.tiers]]
tier = { type = "context", size = 200_000 }
input = 4.00
output = 18.00
cache_read = 0.40
