# Perplexity Agent API pricing:
# https://docs.perplexity.ai/docs/agent-api/models (accessed 2026-08-27)
# Callable ID is perplexity/kimi-k3 (not moonshot-ai/).
# Effort: minimal|low|medium|high|xhigh|max (minimal→low; xhigh/max→max).
# Reasoning tokens billed at the output-token rate.
base_model = "moonshotai/kimi-k3"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["minimal", "low", "medium", "high", "xhigh", "max"]

[cost]
input = 3.00
output = 15.00
cache_read = 0.30
