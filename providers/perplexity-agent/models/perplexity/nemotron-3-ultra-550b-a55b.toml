# Perplexity Agent API pricing:
# https://docs.perplexity.ai/docs/agent-api/models (accessed 2026-08-27)
# Callable ID is perplexity/nemotron-3-ultra-550b-a55b.
# Effort list matches prior Perplexity Agent Nemotron Super entry on this host.
