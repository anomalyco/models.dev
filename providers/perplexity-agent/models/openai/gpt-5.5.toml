# Perplexity Agent API: https://docs.perplexity.ai/docs/agent-api/models.md (USD per MTok: input, output, cache read);
#   prices match GET https://api.perplexity.ai/v1/models (2026-10-21). reasoning.effort = minimal|low|medium|high|xhigh|max
#   (https://docs.perplexity.ai/api-reference/agent-post.md); this file's effort list is unchanged from v1.
#   Images: PNG, JPEG, WEBP, GIF; documents via input_file.
# Context tier above 272K. Service tiers flex (0.5x) and priority (2x) per the models page.
# Agent API tool fees (https://docs.perplexity.ai/docs/getting-started/pricing#tool-pricing, accessed 2026-10-22): web_search
#   with search_type "web" is $2.50 per 1,000 invocations (cost.web_search). Not representable in v2 (no per-call field or
#   search type condition): web_search with search_type fast $0.001, image_search $0.0025, fetch_url $0.0005,
#   people_search and finance_search $0.005, sandbox $0.03 per session.
# Token-only multipliers (object factor, so cost.web_search is unscaled): flex and priority change token rates only (https://docs.perplexity.ai/docs/getting-started/pricing).
schema = 2
base_model = "openai/gpt-5.5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
service_tier = ["flex", "priority"]

[cost.text.input]
price = 5
cache = { read = 0.5 }

[cost.text.output]
price = 30

[cost.web_search]
price = 2.5

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = { text = 2 }

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = { text = 0.5 }
