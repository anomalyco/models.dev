# Pricing: https://docs.perplexity.ai/docs/agent-api/models (accessed 2026-08-27)
# Context tiers: <=272k / >272k. Cache-read $0.50/1M (PRICING calculator).
# Priority Fast mode is 2x listed rates via service_tier=priority (not modeled here).
base_model = "openai/gpt-5.6-sol"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh", "max"]

[cost]
input = 5.00
output = 30.00
cache_read = 0.50

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 10.00
output = 45.00
cache_read = 0.50
