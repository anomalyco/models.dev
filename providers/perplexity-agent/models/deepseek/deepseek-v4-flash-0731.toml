# Perplexity Agent (OpenAI-compatible relay) pricing per:
# https://docs.perplexity.ai/docs/agent-api/models#deepseek
# Reasoning tokens billed at the output rate (no separate CoT price).
# Effort: reasoning_effort = low|high|max
# Retired: absent from GET /v1/models and rejected as "not supported" (live probe 2026-10-21).
# Agent API tool fees (https://docs.perplexity.ai/docs/getting-started/pricing#tool-pricing, accessed 2026-10-22): web_search
#   with search_type "web" is $2.50 per 1,000 invocations (cost.web_search). Not representable in v2 (no per-call field or
#   search type condition): web_search with search_type fast $0.001, image_search $0.0025, fetch_url $0.0005,
#   people_search and finance_search $0.005, sandbox $0.03 per session.
schema = 2
base_model = "deepseek/deepseek-v4-flash-0731"
status = "deprecated"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[cost.text.input]
price = 0.13
cache = { read = 0.028 }

[cost.text.output]
price = 0.26

[cost.web_search]
price = 2.5
