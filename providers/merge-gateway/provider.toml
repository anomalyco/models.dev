# Reasoning request surfaces (sources accessed 2026-07-21):
# - Reasoning support and controls are vendor-route capabilities. Use the exact
#   model response from GET /v1/models and inspect
#   vendors.<vendor>.capabilities.reasoning; do not infer support solely from a
#   compatibility endpoint's request shape.
#   https://docs.merge.dev/merge-gateway/features/reasoning
#   https://docs.merge.dev/merge-gateway/api-overview/models/list
# - OpenAI and Anthropic compatibility endpoints accept their native request
#   shapes when the selected vendor route advertises the corresponding control.
#   https://docs.merge.dev/merge-gateway/get-started
# - This npm package calls POST /v1/ai-sdk/chat/completions and maps
#   `providerOptions.mergeGateway.thinking` to
#   `thinking = { type = "enabled"|"disabled", budget_tokens = N }`.
#   https://github.com/merge-api/merge-gateway-ai-sdk-provider/blob/main/src/chat/index.ts
# Mid-conversation flags (sources accessed 2026-10-20):
# - effort_updates = false on every chat model: /v1/ai-sdk/chat/completions has no
#   effort control at all, only `thinking`, and no per-turn configuration update.
#   https://docs.merge.dev/merge-gateway/capabilities/reasoning (surface table)
# - tools.updates = false: a Chat Completions `tools` array only; Gateway documents no
#   tool addition/removal mechanism.
#   https://docs.merge.dev/merge-gateway/capabilities/tool-calling
# - system_updates is unset: the AI SDK provider sends later system messages in place,
#   but Gateway doesn't document how each vendor route handles them.
# Prompt caching follows the vendor route. `explicit` routes (Anthropic, Claude and Nova on
# Bedrock, Z.AI) forward cache_control markers and place one themselves on reused prompts;
# `automatic` routes (OpenAI, Azure, Google Gemini, DeepSeek, Qwen, Mistral, xAI, Fireworks,
# Baseten) cache on their own. Model files set `capabilities.cache` from their default route.
#   https://docs.merge.dev/merge-gateway/capabilities/prompt-caching
name = "Merge Gateway"
env = ["MERGE_GATEWAY_API_KEY"]
npm = "merge-gateway-ai-sdk-provider"
api = "https://api-gateway.merge.dev/v1/ai-sdk"
doc = "https://docs.merge.dev/merge-gateway"
