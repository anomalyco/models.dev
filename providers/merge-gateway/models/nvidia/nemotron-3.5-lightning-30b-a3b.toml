# Toggle: thinking.type = "enabled"|"disabled"; enabled requires thinking.budget_tokens.
# https://docs.merge.dev/merge-gateway/capabilities/reasoning
schema = 2
base_model = "nvidia/nemotron-3.5-lightning"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
tools = { supported = true }

[limit]
context = 1_000_000

[cost.text.input]
price = 0

[cost.text.output]
price = 0
