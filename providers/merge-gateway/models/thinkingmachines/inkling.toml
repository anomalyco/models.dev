# Cache: default route baseten is in the automatic caching family, https://docs.merge.dev/merge-gateway/capabilities/prompt-caching
schema = 2
base_model = "thinkingmachines/inkling"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true
effort_updates = false
tools = { supported = true, updates = false }
cache = { supported = true, implicit = true }

[limit]
context = 1_048_000
output = 32_000

[cost.text.input]
price = 1
cache = { read = 0.17 }

[cost.text.output]
price = 4.05
