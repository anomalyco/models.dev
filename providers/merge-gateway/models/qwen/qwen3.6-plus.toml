# Toggle: thinking.type = "enabled"|"disabled"; enabled requires thinking.budget_tokens.
# https://docs.merge.dev/merge-gateway/capabilities/reasoning
# Source: https://api-gateway.merge.dev/v1/models?model=qwen%2Fqwen3.6-plus (accessed 2026-07-21)
# Selected route reasoning.controls = ["thinking"], disable_supported = true.
# Cache: default route alibaba is in the automatic caching family, https://docs.merge.dev/merge-gateway/capabilities/prompt-caching
schema = 2
base_model = "alibaba/qwen3.6-plus"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
effort_updates = false
tools = { supported = true, updates = false }
cache = { supported = true, implicit = true }

[limit]
output = 250_000

[cost.text.input]
price = 0.276
cache = { read = 0.0276, write = 0.345 }

[cost.text.output]
price = 1.651
