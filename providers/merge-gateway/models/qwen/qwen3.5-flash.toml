# Toggle: thinking.type = "enabled"|"disabled"; enabled requires thinking.budget_tokens.
# https://docs.merge.dev/merge-gateway/capabilities/reasoning
# Cache: default route alibaba is in the automatic caching family, https://docs.merge.dev/merge-gateway/capabilities/prompt-caching
schema = 2
base_model = "alibaba/qwen3.5-flash"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
effort_updates = false
tools = { supported = true, updates = false }
cache = { implicit = true }

[limit]
output = 250_000

[cost.text.input]
price = 0.029
cache = { read = 0.0029, write = 0.03625 }

[cost.text.output]
price = 0.287
