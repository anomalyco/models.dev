# Source: https://api-gateway.merge.dev/v1/models?model=openai%2Fgpt-4o-2024-11-20 (accessed 2026-07-21)
# Cache: default route openai is in the automatic caching family, https://docs.merge.dev/merge-gateway/capabilities/prompt-caching
schema = 2
base_model = "openai/gpt-4o-2024-11-20"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
structured_output = true
effort_updates = false
tools = { supported = true, updates = false }
cache = { implicit = true }

[cost.text.input]
price = 2.5
cache = { read = 1.25 }

[cost.text.output]
price = 10
