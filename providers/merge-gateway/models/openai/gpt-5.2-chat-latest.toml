# Source: https://api-gateway.merge.dev/v1/models?model=openai%2Fgpt-5.2-chat-latest (accessed 2026-07-21)
# Cache: default route openai is in the automatic caching family, https://docs.merge.dev/merge-gateway/capabilities/prompt-caching
schema = 2
base_model = "openai/gpt-5.2-chat-latest"
name = "GPT-5.2 Chat Latest"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = false }
structured_output = true
effort_updates = false
tools = { supported = true, updates = false }
cache = { supported = true, implicit = true }

[cost.text.input]
price = 1.75
cache = { read = 0.175 }

[cost.text.output]
price = 14
