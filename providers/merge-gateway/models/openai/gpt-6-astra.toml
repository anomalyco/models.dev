# Cache: default route openai is in the automatic caching family, https://docs.merge.dev/merge-gateway/capabilities/prompt-caching
schema = 2
base_model = "openai/gpt-6-astra"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
effort_updates = false
tools = { supported = true, updates = false }
cache = { supported = true, implicit = true }

[cost.text.input]
price = 10
cache = { read = 1, write = 12.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 20
cache = { read = 2, write = 25 }

[cost.text.output]
price = 50

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 75
