# Source: https://api-gateway.merge.dev/v1/models?model=openai%2Fgpt-5-chat-latest (accessed 2026-07-21)

base_model = "openai/gpt-5-chat-latest"
base_model_omit = ["limit.input"]
name = "GPT-5 Chat Latest"
reasoning = false

[cost]
input = 1.25
output = 10
cache_read = 0.125

[limit]
context = 128_000
output = 16_384

[modalities]
input = ["text", "image", "pdf"]
