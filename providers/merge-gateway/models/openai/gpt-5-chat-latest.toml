# Source: https://api-gateway.merge.dev/v1/models?model=openai%2Fgpt-5-chat-latest (accessed 2026-07-21)
schema = 2
base_model = "openai/gpt-5-chat-latest"
base_model_omit = ["limit.input"]
name = "GPT-5 Chat Latest"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = false }
structured_output = true

[limit]
context = 128_000
output = 16_384

[cost.text.input]
price = 1.25
cache = { read = 0.125 }

[cost.text.output]
price = 10
