# Source: https://api-gateway.merge.dev/v1/models?model=openai%2Fgpt-5-chat-latest (accessed 2026-07-21)
# Cache: default route openai is in the automatic caching family, https://docs.merge.dev/merge-gateway/capabilities/prompt-caching
schema = 2
base_model = "openai/gpt-5-chat-latest"
base_model_omit = ["limit.input"]
name = "GPT-5 Chat Latest"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = false }
structured_output = true
cache = { implicit = true }

[limit]
context = 128_000
output = 16_384

[cost.text.input]
price = 1.25
cache = { read = 0.125 }

[cost.text.output]
price = 10
