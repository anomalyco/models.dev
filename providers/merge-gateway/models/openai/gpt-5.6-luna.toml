# Source: https://api-gateway.merge.dev/v1/models?model=openai%2Fgpt-5.6-luna (accessed 2026-07-21)
# Merge Gateway GET /v1/models?model=openai/gpt-5.6-luna (accessed 2026-07-14):
# the OpenAI vendor route advertises configurable `reasoning.effort` and disable support.
# Effort values: https://openai.com/index/gpt-5-6/
base_model = "openai/gpt-5.6-luna"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "xhigh", "max"]

[cost]
input = 0.2
output = 1.2
cache_read = 0.02
cache_write = 0.25
