# Source: https://api-gateway.merge.dev/v1/models?model=openai%2Fgpt-5.4-mini (accessed 2026-07-21)
schema = 2
base_model = "openai/gpt-5.4-mini"
name = "GPT-5.4 Mini"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true

[cost.text.input]
price = 0.75
cache = { read = 0.075 }

[cost.text.output]
price = 4.5

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 2

[experimental.modes.fast]
service_tier = "priority"
body = { service_tier = "priority" }
