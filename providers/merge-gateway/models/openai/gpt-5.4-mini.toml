# Source: https://api-gateway.merge.dev/v1/models?model=openai%2Fgpt-5.4-mini (accessed 2026-07-21)

base_model = "openai/gpt-5.4-mini"
name = "GPT-5.4 Mini"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "xhigh"]

[cost]
input = 0.75
output = 4.5
cache_read = 0.075

[modalities]
input = ["text", "image", "pdf"]

[experimental.modes.fast]
cost = { input = 1.5, output = 9, cache_read = 0.15 }
provider = { body = { service_tier = "priority" } }
