# Source: https://api-gateway.merge.dev/v1/models?model=openai%2Fgpt-5.6-terra (accessed 2026-07-21)
# Merge Gateway GET /v1/models?model=openai/gpt-5.6-terra (accessed 2026-07-14):
# the OpenAI vendor route advertises configurable `reasoning.effort` and disable support.
# Effort values: https://openai.com/index/gpt-5-6/
# Cache: default route openai is in the automatic caching family, https://docs.merge.dev/merge-gateway/capabilities/prompt-caching
schema = 2
base_model = "openai/gpt-5.6-terra"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
effort_updates = false
tools = { supported = true, updates = false }
cache = { supported = true, implicit = true }

[cost.text.input]
price = 2
cache = { read = 0.2, write = 2.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 4
cache = { read = 0.4, write = 5 }

[cost.text.output]
price = 12

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 18
