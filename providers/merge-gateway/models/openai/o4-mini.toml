# Source: https://api-gateway.merge.dev/v1/models?model=openai%2Fo4-mini (accessed 2026-07-21)
# Cache: default route openai is in the automatic caching family, https://docs.merge.dev/merge-gateway/capabilities/prompt-caching
schema = 2
base_model = "openai/o4-mini"
name = "o4 Mini"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
tools = { supported = true }
cache = { implicit = true }

[cost.text.input]
price = 1.1
cache = { read = 0.275 }

[cost.text.output]
price = 4.4
