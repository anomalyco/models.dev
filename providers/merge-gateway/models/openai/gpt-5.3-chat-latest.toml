# Source: https://api-gateway.merge.dev/v1/models?model=openai%2Fgpt-5.3-chat-latest (accessed 2026-07-21)
# Cache: default route openai is in the automatic caching family, https://docs.merge.dev/merge-gateway/capabilities/prompt-caching
schema = 2
base_model = "openai/gpt-5.3-chat-latest"
name = "GPT-5.3 Chat Latest"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
structured_output = true
tools = { supported = true }
cache = { implicit = true }

[cost.text.input]
price = 1.75
cache = { read = 0.175 }

[cost.text.output]
price = 14
