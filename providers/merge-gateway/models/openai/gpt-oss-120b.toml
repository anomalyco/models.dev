# Source: https://api-gateway.merge.dev/v1/models?model=openai%2Fgpt-oss-120b (accessed 2026-07-21)
# Merge Gateway GET /v1/models?model=openai/gpt-oss-120b (accessed 2026-07-16):
# parasail and fireworks routes report `supports_reasoning = true` with
# `configurable = false` and no controls, so the model reasons on the gateway
# but callers have no reasoning control.
schema = 2
base_model = "openai/gpt-oss-120b"
name = "GPT-OSS 120B"

[capabilities]
tools = { supported = false }
reasoning = { supported = true }
structured_output = false
effort_updates = false

[limit]
context = 128_000
output = 32_000

[cost.text.input]
price = 0.05

[cost.text.output]
price = 0.25
