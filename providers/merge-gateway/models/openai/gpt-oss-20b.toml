# Merge Gateway GET /v1/models?model=openai/gpt-oss-20b (accessed 2026-07-16):
# routes reporting `supports_reasoning = true` carry `configurable = false` and
# no controls, so the model reasons on the gateway but callers have no
# reasoning control.
base_model = "openai/gpt-oss-20b"
reasoning_options = []
tool_call = false
structured_output = false

[cost]
input = 0.04
output = 0.2
cache_read = 0.02
