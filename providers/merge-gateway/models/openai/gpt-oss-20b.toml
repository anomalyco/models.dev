# Source: https://api-gateway.merge.dev/v1/models?model=openai%2Fgpt-oss-20b (accessed 2026-07-21)
# Merge Gateway GET /v1/models?model=openai/gpt-oss-20b (accessed 2026-07-16):
# routes reporting `supports_reasoning = true` carry `configurable = false` and
# no controls, so the model reasons on the gateway but callers have no
# reasoning control.
schema = 2
base_model = "openai/gpt-oss-20b"
name = "GPT-OSS 20B"

[capabilities]
tools = { supported = false }
reasoning = { supported = true }
structured_output = false
effort_updates = false

[limit]
context = 128_000
output = 32_000

[cost.text.input]
price = 0.04
cache = { read = 0.02 }

[cost.text.output]
price = 0.15
