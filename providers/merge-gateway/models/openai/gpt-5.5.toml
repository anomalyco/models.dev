# Source: https://api-gateway.merge.dev/v1/models?model=openai%2Fgpt-5.5 (accessed 2026-07-21)
# Cache: default route openai is in the automatic caching family, https://docs.merge.dev/merge-gateway/capabilities/prompt-caching
schema = 2
base_model = "openai/gpt-5.5"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true
effort_updates = false
tools = { supported = true, updates = false }
cache = { supported = true, implicit = true }

[cost.text.input]
price = 5
cache = { read = 0.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 10
cache = { read = 1 }

[cost.text.output]
price = 30

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 45

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 2.5

[experimental.modes.fast]
service_tier = "priority"
body = { service_tier = "priority" }
