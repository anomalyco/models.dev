# Source: https://api-gateway.merge.dev/v1/models?model=xai%2Fgrok-4.20-0309-reasoning (accessed 2026-07-21)
# Cache: default route xai is in the automatic caching family, https://docs.merge.dev/merge-gateway/capabilities/prompt-caching
schema = 2
base_model = "xai/grok-4.20-0309-reasoning"
name = "Grok 4.20"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true
tools = { supported = true }
cache = { implicit = true }

[limit]
output = 1_000_000

[cost.text.input]
price = 1.25
cache = { read = 0.2 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 2.5
cache = { read = 0.4 }

[cost.text.output]
price = 2.5

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 5
