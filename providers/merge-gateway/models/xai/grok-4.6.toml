# Cache: default route xai is in the automatic caching family, https://docs.merge.dev/merge-gateway/capabilities/prompt-caching
schema = 2
base_model = "xai/grok-4.6"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
tools = { supported = true }
cache = { implicit = true }

[cost.text.input]
price = 2
cache = { read = 0.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 4
cache = { read = 1 }

[cost.text.output]
price = 6

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 12
