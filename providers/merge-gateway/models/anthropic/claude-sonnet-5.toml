# Toggle: thinking.type = "enabled"|"disabled"; enabled requires thinking.budget_tokens.
# https://docs.merge.dev/merge-gateway/capabilities/reasoning
# Source: https://api-gateway.merge.dev/v1/models?model=anthropic%2Fclaude-sonnet-5 (accessed 2026-07-21)
# Merge Gateway GET /v1/models?model=anthropic/claude-sonnet-5 (accessed 2026-07-14):
# the Anthropic route advertises configurable `reasoning.effort` and disable support.
# Cache: default route anthropic is in the explicit caching family, https://docs.merge.dev/merge-gateway/capabilities/prompt-caching
schema = 2
base_model = "anthropic/claude-sonnet-5"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
tools = { supported = true }
cache = { implicit = true, explicit = { ttl = ["5m", "1h"] } }

[cost.text.input]
price = 2
cache = { read = 0.2, write = 2.5 }

[cost.text.output]
price = 10
