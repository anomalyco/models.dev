# Source: https://api-gateway.merge.dev/v1/models?model=anthropic%2Fclaude-sonnet-5 (accessed 2026-07-21)
# Merge Gateway GET /v1/models?model=anthropic/claude-sonnet-5 (accessed 2026-07-14):
# the Anthropic route advertises configurable `reasoning.effort` and disable support.
schema = 2
base_model = "anthropic/claude-sonnet-5"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 2
cache = { read = 0.2, write = 2.5 }

[cost.text.output]
price = 10
