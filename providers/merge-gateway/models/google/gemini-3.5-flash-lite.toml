# Toggle: thinking.type = "enabled"|"disabled"; enabled requires thinking.budget_tokens.
# https://docs.merge.dev/merge-gateway/capabilities/reasoning
# Cache: default route google is in the automatic caching family, https://docs.merge.dev/merge-gateway/capabilities/prompt-caching
schema = 2
base_model = "google/gemini-3.5-flash-lite"
name = "Gemini 3.5 Flash-Lite"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
effort_updates = false
tools = { supported = true, updates = false }
cache = { supported = true, implicit = true }

[cost.text.input]
price = 0.3
cache = { read = 0.03 }

[cost.text.output]
price = 2.5
