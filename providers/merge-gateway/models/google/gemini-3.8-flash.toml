# Cache: default route google is in the automatic caching family, https://docs.merge.dev/merge-gateway/capabilities/prompt-caching
schema = 2
base_model = "google/gemini-3.8-flash"

[capabilities]
reasoning = { supported = true }
structured_output = true
tools = { supported = true }
cache = { implicit = true }

