# Source: https://api-gateway.merge.dev/v1/models?model=google%2Fgemini-2.5-pro (accessed 2026-07-21)

base_model = "google/gemini-2.5-pro"

[[reasoning_options]]
type = "budget_tokens"
min = 128
max = 32_768

[cost]
input = 1.25
output = 10
cache_read = 0.125

[[cost.tiers]]
tier = { type = "context", size = 200_000 }
input = 2.5
output = 15
cache_read = 0.25

[modalities]
input = ["text", "image", "audio", "pdf"]
