# Output limit: capped at the 2,048 context; the vector size it listed is not a token limit, and the sync caps it the same way.
# Source: https://api-gateway.merge.dev/v1/models?model=google%2Fgemini-embedding-001 (accessed 2026-07-21)
# Embeddings: POST /v1/ai-sdk/embeddings (merge-gateway-ai-sdk-provider embedding model)
schema = 2
base_model = "google/gemini-embedding-001"

[capabilities]
structured_output = false

[limit]
output = 2_048

[api.embeddings]
sdk = { opencodeai = "none" }

[cost.text.input]
price = 0.15

[cost.text.output]
price = 0
