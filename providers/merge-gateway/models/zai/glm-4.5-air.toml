# Toggle: thinking.type = "enabled"|"disabled"; enabled requires thinking.budget_tokens.
# https://docs.merge.dev/merge-gateway/capabilities/reasoning
# Source: https://api-gateway.merge.dev/v1/models?model=zai%2Fglm-4.5-air (accessed 2026-07-21)
# Cache: default route zai is in the explicit caching family, https://docs.merge.dev/merge-gateway/capabilities/prompt-caching
schema = 2
base_model = "zhipuai/glm-4.5-air"
name = "GLM-4.5 Air"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = false
effort_updates = false
tools = { supported = true, updates = false }
cache = { implicit = true, explicit = true }

[limit]
context = 128_000

[cost.text.input]
price = 0.2
cache = { read = 0.03, write = 0 }

[cost.text.output]
price = 1.1
