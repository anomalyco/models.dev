# Adzuki AI (https://adzukiai.com) — OpenAI-compatible gateway, chat completions
# only. The request body is proxied verbatim to the lab's deployment (via JD
# Cloud MaaS); nothing below is renamed or remapped by the gateway.
# Cost: https://adzukiai.com/pricing.json (checked 2026-10-28), USD per 1M tokens.
# Cache: automatic prefix cache on the upstream; hits are billed at the
#   `cache_read` rate published in the same file.
# Effort: reasoning_effort = low|high|max (default max)
# No toggle: on the upstream thinking.type only accepts "enabled", as
# documented in providers/zai/models/glm-5.3.toml.

schema = 2
base_model = "zhipuai/glm-5.3"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 2.2857
cache = { read = 0.5714 }

[cost.text.output]
price = 8.0
