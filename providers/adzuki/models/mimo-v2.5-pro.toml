# Served by Adzuki AI (https://adzukiai.com) — OpenAI-compatible gateway, chat
# completions only. Price: https://adzukiai.com/pricing.json (checked 2026-10-28).
# Reasoning params are forwarded verbatim to the upstream relay, so the control
# surface below matches the lab's own entry in this repo rather than a remapping.
schema = 2
base_model = "xiaomi/mimo-v2.5-pro"

[capabilities]
reasoning = { supported = true, toggle = true }
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.8571
cache = { read = 0.0071 }

[cost.text.output]
price = 1.7143
