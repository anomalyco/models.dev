# Adzuki AI (https://adzukiai.com) — OpenAI-compatible gateway, chat completions
# only. The request body is proxied verbatim to the lab's deployment (via JD
# Cloud MaaS); nothing below is renamed or remapped by the gateway.
# Cost: https://adzukiai.com/pricing.json (checked 2026-10-28), USD per 1M tokens.
# Cache: automatic prefix cache on the upstream; hits are billed at the
#   `cache_read` rate published in the same file.
# Toggle: thinking.type = adaptive|disabled
# No effort levels: output_config.effort is ignored upstream
#   (providers/minimax/models/MiniMax-M3.toml).

schema = 2
base_model = "minimax/MiniMax-M3"

[capabilities]
reasoning = { supported = true, toggle = true }
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.2
cache = { read = 0.24 }

[cost.text.output]
price = 4.8
