# Adzuki AI (https://adzukiai.com) — OpenAI-compatible gateway, chat completions
# only. The request body is proxied verbatim to the lab's deployment (via JD
# Cloud MaaS); nothing below is renamed or remapped by the gateway.
# Cost: https://adzukiai.com/pricing.json (checked 2026-10-28), USD per 1M tokens.
# Cache: automatic prefix cache on the upstream; hits are billed at the
#   `cache_read` rate published in the same file.
# Toggle: enable_thinking = true|false (hybrid model)
# Effort: reasoning_effort = low|medium|xhigh (default xhigh; "high" is
#   accepted as an alias of xhigh)
# Budget: thinking_budget = 0..262144 tokens; cannot be combined with
#   reasoning_effort
# Full caller surface copied from providers/alibaba/models/qwen3.8-max.toml.

schema = 2
base_model = "alibaba/qwen3.8-max"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "xhigh"], budget = { min = 0, max = 262_144 } }
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 3.4286
cache = { read = 0.4286 }

[cost.text.output]
price = 10.2857
