# Adzuki AI (https://adzukiai.com) — OpenAI-compatible gateway, chat completions
# only. The request body is proxied verbatim to the lab's deployment (via JD
# Cloud MaaS); nothing below is renamed or remapped by the gateway.
# Cost: https://adzukiai.com/pricing.json (checked 2026-10-28), USD per 1M tokens.
# Cache: automatic prefix cache on the upstream; hits are billed at the
#   `cache_read` rate published in the same file.
# Effort: reasoning_effort = low|high|max (default max); always thinks
# No toggle: providers/moonshotai/models/kimi-k3.1-pro.toml documents none.

schema = 2
base_model = "moonshotai/kimi-k3.1-pro"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 3.7143
cache = { read = 0.3714 }

[cost.text.output]
price = 19.4286
