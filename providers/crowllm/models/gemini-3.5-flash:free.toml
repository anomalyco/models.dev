# CrowLLM relays this model on POST /v1/chat/completions (OpenAI-compatible).
# cost is the gateway's live billing rate: USD/MTok = 2 x model_ratio, output = input x completion_ratio.
# Source: https://crowllm.com/api/pricing (accessed 2026-10-07).
# Effort: extra_body.google.thinking_config.thinking_level = minimal|low|medium|high (forwarded to generationConfig.thinkingConfig)
# reasoning_options mirror providers/google for the same model on this surface.
# Live gateway row: model_ratio=0, completion_ratio=4, cache_ratio=None, enable_groups=['free', 'pro'].
base_model = "google/gemini-3.5-flash"
name = "Gemini 3.5 Flash (free)"
reasoning_options = [{ type = "effort", values = ["minimal", "low", "medium", "high"] } ]

[cost]
input = 0
output = 0
