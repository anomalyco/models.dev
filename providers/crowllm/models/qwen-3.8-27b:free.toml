# CrowLLM relays this model on POST /v1/chat/completions (OpenAI-compatible).
# cost is the gateway's live billing rate: USD/MTok = 2 x model_ratio, output = input x completion_ratio,
# cache_read = input x cache_ratio (service/text_quota.go bills cached prompt tokens at cache_ratio of a fresh one).
# Source: https://crowllm.com/api/pricing (accessed 2026-10-12).
# Served id, verbatim from GET https://crowllm.com/v1/models (accessed 2026-10-12): "qwen-3.8-27b:free".
# Toggle: enable_thinking = true|false (Qwen hybrid thinking)
# Effort: reasoning_effort = low|medium|xhigh (top-level, forwarded verbatim)
# reasoning_options mirror providers/cortecs for the same model on this surface.
# Set adjusted from providers/nebius: `none` dropped: this gateway turns thinking off with the `enable_thinking` toggle published above, and no Qwen source agrees on a none level.
# Live gateway row: model_ratio=0, completion_ratio=1, cache_ratio=None, enable_groups=['free', 'pro'].
base_model = "alibaba/qwen3.8-27b"
name = "Qwen3.8 27B (free)"
reasoning_options = [{ type = "toggle" }, { type = "effort", values = ["low", "medium", "xhigh"] } ]

[cost]
input = 0
output = 0
