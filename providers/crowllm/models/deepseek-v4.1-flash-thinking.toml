# CrowLLM relays this model on POST /v1/chat/completions (OpenAI-compatible).
# cost is the gateway's live billing rate: USD/MTok = 2 x model_ratio, output = input x completion_ratio.
# Source: https://crowllm.com/api/pricing (accessed 2026-10-09).
# Served id, verbatim from GET https://crowllm.com/v1/models (accessed 2026-10-09): "deepseek-v4.1-flash-thinking".
# Always-on alias: reasoning is enabled for this id and cannot be turned off here;
# `deepseek-v4.1-flash` is the id that takes the thinking control.
# Effort: reasoning_effort = low|high|max (top-level, forwarded verbatim)
# reasoning_options mirror providers/deepseek for the same model on this surface.
# Live gateway row: model_ratio=0.075, completion_ratio=3.333333333333, cache_ratio=None, enable_groups=['pro'].
base_model = "deepseek/deepseek-v4.1-flash"
name = "DeepSeek V4.1 Flash Thinking"
reasoning_options = [{ type = "effort", values = ["low", "high", "max"] } ]

[cost]
input = 0.15
output = 0.5
