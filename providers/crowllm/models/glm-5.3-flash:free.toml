# CrowLLM relays this model on POST /v1/chat/completions (OpenAI-compatible).
# cost is the gateway's live billing rate: USD/MTok = 2 x model_ratio, output = input x completion_ratio,
# cached input = input x cache_ratio (service/text_quota.go bills a cached prompt token at cache_ratio of a fresh one).
# Source: https://crowllm.com/api/pricing (accessed 2026-10-30).
# Served id, verbatim from GET https://crowllm.com/v1/models (accessed 2026-10-30): "glm-5.3-flash:free".
# Zero-rated shelf: the gateway row carries model_ratio=0 and enable_groups includes free,
# so no credit is spent on any field below.
# Effort: reasoning_effort = low|high|max (top-level, forwarded verbatim)
# The reasoning controls mirror providers/zhipuai for the same model on this surface.
# Live gateway row: model_ratio=0, completion_ratio=3, cache_ratio=0.2, enable_groups=['pro','free','starter'].
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }

[cost.text.input]
price = 0
cache = { read = 0 }

[cost.text.output]
price = 0
