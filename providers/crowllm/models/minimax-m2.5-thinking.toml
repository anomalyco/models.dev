# CrowLLM relays this model on POST /v1/chat/completions (OpenAI-compatible).
# cost is the gateway's live billing rate: USD/MTok = 2 x model_ratio, output = input x completion_ratio,
# cached input = input x cache_ratio (service/text_quota.go bills a cached prompt token at cache_ratio of a fresh one).
# Source: https://crowllm.com/api/pricing (accessed 2026-10-23).
# Served id, verbatim from GET https://crowllm.com/v1/models (accessed 2026-10-23): "minimax-m2.5-thinking".
# Thinking is on by default for this id; it is switched off with the none level, not a toggle.
# Effort: reasoning_effort = none|minimal|low|medium|high (top-level; dto/openai_request.go:38, forwarded verbatim to the upstream channel); `none` is the level that turns thinking off on this id
# The reasoning controls mirror providers/greenpt for the same model on this surface.
# Live gateway row: model_ratio=0.125, completion_ratio=4.76, cache_ratio=0.1, enable_groups=['pro'].
schema = 2
base_model = "minimax/MiniMax-M2.5"
name = "MiniMax-M2.5 Thinking"

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high"] }

[cost.text.input]
price = 0.25
cache = { read = 0.025 }

[cost.text.output]
price = 1.19
