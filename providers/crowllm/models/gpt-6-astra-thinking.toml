# CrowLLM relays this model on POST /v1/chat/completions (OpenAI-compatible).
# cost is the gateway's live billing rate: USD/MTok = 2 x model_ratio, output = input x completion_ratio,
# cached input = input x cache_ratio (service/text_quota.go bills a cached prompt token at cache_ratio of a fresh one).
# Source: https://crowllm.com/api/pricing (accessed 2026-11-21).
# Served id, verbatim from GET https://crowllm.com/v1/models (accessed 2026-11-22): "gpt-6-astra-thinking".
# Always-on alias: reasoning is enabled for this id and cannot be turned off here;
# `gpt-6-astra` is the id that takes the thinking control.
# Effort: reasoning_effort = low|medium|high|xhigh|max (top-level, forwarded verbatim)
# The reasoning controls mirror providers/openai for the same model on this surface.
# Live gateway row (no separate row in /api/pricing; priced from `gpt-6-astra`): model_ratio=2.5, completion_ratio=4.998, cache_ratio=0.1, enable_groups=['pro'].
# Freeform custom tools are not published: the gateway keeps a custom tool payload in its chat-completions request struct (relaykit/dto/openai_request.go, ToolCallRequest.Custom), but a grammar/format enforcement check needs a funded key, which this review did not have. No freeform value is claimed without that evidence.
schema = 2
base_model = "openai/gpt-6-astra"
name = "GPT-6 Astra Thinking"

[capabilities]
cache = { implicit = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 5.0
cache = { read = 0.5 }

[cost.text.output]
price = 24.99
