# CrowLLM relays this model on POST /v1/chat/completions (OpenAI-compatible).
# cost is the gateway's live billing rate: USD/MTok = 2 x model_ratio, output = input x completion_ratio,
# cached input = input x cache_ratio (service/text_quota.go bills a cached prompt token at cache_ratio of a fresh one).
# Source: https://crowllm.com/api/pricing (accessed 2026-10-23).
# Served id, verbatim from GET https://crowllm.com/v1/models (accessed 2026-10-23): "gemini-3.8-flash".
# Effort: extra_body.google.thinking_config.thinking_level = low|medium|high (forwarded to generationConfig.thinkingConfig)
# The reasoning controls mirror providers/google for the same model on this surface.
# Live gateway row: model_ratio=0.5, completion_ratio=1.75, cache_ratio=0.1, enable_groups=['pro'].
schema = 2
base_model = "google/gemini-3.8-flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[cost.text.input]
price = 1
cache = { read = 0.1 }

[cost.text.output]
price = 1.75
