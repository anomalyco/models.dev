# CrowLLM relays this model on POST /v1/chat/completions (OpenAI-compatible).
# cost is the gateway's live billing rate: USD/MTok = 2 x model_ratio, output = input x completion_ratio,
# cached input = input x cache_ratio (service/text_quota.go bills a cached prompt token at cache_ratio of a fresh one).
# Source: https://crowllm.com/api/pricing (accessed 2026-10-23).
# Served id, verbatim from GET https://crowllm.com/v1/models (accessed 2026-10-23): "glm-4.7-think:free".
# Always-on alias: reasoning is enabled for this id and cannot be turned off here;
# `glm-4.7:free` is the id that takes the thinking control.
# The reasoning controls mirror providers/zhipuai for the same model on this surface.
# Live gateway row: model_ratio=0, completion_ratio=1, cache_ratio=None, enable_groups=['free', 'pro'].
schema = 2
base_model = "zhipuai/glm-4.7"
name = "GLM-4.7 Think (free)"

[capabilities]
reasoning = { supported = true }

[cost.text.input]
price = 0

[cost.text.output]
price = 0
