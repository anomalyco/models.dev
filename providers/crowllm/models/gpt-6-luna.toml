# CrowLLM relays this model on POST /v1/chat/completions (OpenAI-compatible).
# cost is the gateway's live billing rate: USD/MTok = 2 x model_ratio, output = input x completion_ratio.
# Source: https://crowllm.com/api/pricing (accessed 2026-10-09).
# Served id, verbatim from GET https://crowllm.com/v1/models (accessed 2026-10-09): "gpt-6-luna".
# Effort: reasoning_effort = none|low|medium|high|xhigh|max (top-level, forwarded verbatim)
# reasoning_options mirror providers/openai for the same model on this surface.
# Live gateway row: model_ratio=0.05, completion_ratio=4, cache_ratio=None, enable_groups=['pro'].
base_model = "openai/gpt-6-luna"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh", "max"] } ]

[cost]
input = 0.1
output = 0.4
