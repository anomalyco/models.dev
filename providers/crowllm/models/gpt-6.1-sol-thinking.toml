# CrowLLM relays this model on POST /v1/chat/completions (OpenAI-compatible).
# cost is the gateway's live billing rate: USD/MTok = 2 x model_ratio, output = input x completion_ratio,
# cached input = input x cache_ratio (service/text_quota.go bills a cached prompt token at cache_ratio of a fresh one).
# Source: https://crowllm.com/api/pricing (accessed 2026-10-23).
# Served id, verbatim from GET https://crowllm.com/v1/models (accessed 2026-10-23): "gpt-6.1-sol-thinking".
# Always-on alias: reasoning is enabled for this id and cannot be turned off here;
# `gpt-6.1-sol` is the id that takes the thinking control.
# Effort: reasoning_effort = low|medium|high|xhigh|max (top-level, forwarded verbatim)
# The reasoning controls mirror providers/openai for the same model on this surface.
# Live gateway row: model_ratio=0.7, completion_ratio=6.421428571429, cache_ratio=0.1, enable_groups=['pro'].
schema = 2
base_model = "openai/gpt-6.1-sol"
name = "GPT-6.1 Sol Thinking"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 1.4
cache = { read = 0.14 }

[cost.text.output]
price = 8.99
