# CrowLLM relays this model on POST /v1/chat/completions (OpenAI-compatible).
# cost is the gateway's live billing rate: USD/MTok = 2 x model_ratio, output = input x completion_ratio,
# cached input = input x cache_ratio (service/text_quota.go bills a cached prompt token at cache_ratio of a fresh one).
# Source: https://crowllm.com/api/pricing (accessed 2026-10-23).
# Served id, verbatim from GET https://crowllm.com/v1/models (accessed 2026-10-23): "qwen3.8-omni-flash-thinking".
# Thinking is on by default for this id; it is switched off with the none level, not a toggle.
# Effort: reasoning_effort = none|low|medium|xhigh (top-level, forwarded verbatim); `none` is the level that turns thinking off on this id
# The reasoning controls mirror providers/alibaba for the same model on this surface.
# Live gateway row: model_ratio=0.075, completion_ratio=2.133333333333, cache_ratio=0.106667, enable_groups=['pro'].
schema = 2
base_model = "alibaba/qwen3.8-omni-flash"
name = "Qwen3.8 Omni Flash Thinking"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "xhigh"] }

[cost.text.input]
price = 0.15
cache = { read = 0.016 }

[cost.text.output]
price = 0.32
