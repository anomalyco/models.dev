# CrowLLM relays this model on POST /v1/chat/completions (OpenAI-compatible).
# cost is the gateway's live billing rate: USD/MTok = 2 x model_ratio, output = input x completion_ratio.
# Source: https://crowllm.com/api/pricing (accessed 2026-10-08).
# Served id, verbatim from GET https://crowllm.com/v1/models (accessed 2026-10-08): "laguna-xs-2-1:free".
# Toggle: chat_template_kwargs.enable_thinking = true|false (forwarded verbatim to the serving stack; same API as the lab's own host entry)
# reasoning_options mirror providers/poolside for the same model on this surface.
# Live gateway row: model_ratio=0, completion_ratio=1, cache_ratio=None, enable_groups=['free', 'pro'].
base_model = "poolside/laguna-xs-2.1"
name = "Laguna XS 2.1 (free)"
reasoning_options = [{ type = "toggle" } ]

[cost]
input = 0
output = 0
