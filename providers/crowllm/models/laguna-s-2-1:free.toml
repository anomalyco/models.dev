# CrowLLM relays this model on POST /v1/chat/completions (OpenAI-compatible).
# cost is the gateway's live billing rate: USD/MTok = 2 x model_ratio, output = input x completion_ratio,
# cached input = input x cache_ratio (service/text_quota.go bills a cached prompt token at cache_ratio of a fresh one).
# Source: https://crowllm.com/api/pricing (accessed 2026-10-23).
# Served id, verbatim from GET https://crowllm.com/v1/models (accessed 2026-10-23): "laguna-s-2-1:free".
# Toggle: chat_template_kwargs.enable_thinking = true|false (forwarded verbatim to the serving stack; same API as the lab's own host entry)
# The reasoning controls mirror providers/poolside for the same model on this surface.
# Live gateway row: model_ratio=0, completion_ratio=0, cache_ratio=None, enable_groups=['free', 'pro'].
schema = 2
base_model = "poolside/laguna-s-2.1"
name = "Laguna S 2.1 (free)"

[capabilities]
reasoning = { supported = true, toggle = true }

[cost.text.input]
price = 0

[cost.text.output]
price = 0
