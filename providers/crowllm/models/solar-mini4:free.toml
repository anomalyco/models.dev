# CrowLLM relays this model on POST /v1/chat/completions (OpenAI-compatible).
# cost is the gateway's live billing rate: USD/MTok = 2 x model_ratio, output = input x completion_ratio,
# cached input = input x cache_ratio (service/text_quota.go bills a cached prompt token at cache_ratio of a fresh one).
# Source: https://crowllm.com/api/pricing (accessed 2026-11-23).
# Served id, verbatim from GET https://crowllm.com/v1/models (accessed 2026-11-23): "solar-mini4:free".
# Effort: reasoning_effort top-level, forwarded verbatim; the ladder mirrors the same lab model on
# another OpenAI-compatible gateway in this repo (providers/kilo).
# Live gateway row: model_ratio=0, completion_ratio=1, cache_ratio=n/a, enable_groups=['pro','free'].
# Re-checked on 2026-11-23 against /v1/models and /api/pricing: still served, still zero-rated.
schema = 2
base_model = "upstage/solar-mini4"
name = "Solar Mini 4 (free)"

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 0.0
cache = { read = 0.0 }

[cost.text.output]
price = 0.0
