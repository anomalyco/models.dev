# cost is the gateway's live billing rate: USD/MTok = 2 x model_ratio, output = input x completion_ratio,
# cached input = input x cache_ratio (service/text_quota.go bills a cached prompt token at cache_ratio of a fresh one).
# Source: https://crowllm.com/api/pricing (accessed 2026-10-23).
# Served id, verbatim from GET https://crowllm.com/v1/models (accessed 2026-10-23): "minimax-m2.7".
# Effort: reasoning_effort = high (top-level; dto/openai_request.go:38, forwarded verbatim to the upstream channel)
# The reasoning controls mirror providers/kilo for the same model on this surface.
# Live gateway row: model_ratio=0.135, completion_ratio=4.481481481481, cache_ratio=0.2, enable_groups=['pro'].
schema = 2
base_model = "minimax/MiniMax-M2.7"

[capabilities]
reasoning = { supported = true, effort = ["high"] }

[cost.text.input]
