# CrowLLM relays this model on POST /v1/chat/completions (OpenAI-compatible).
# cost is the gateway's live billing rate: USD/MTok = 2 x model_ratio, output = input x completion_ratio,
# cached input = input x cache_ratio (service/text_quota.go bills a cached prompt token at cache_ratio of a fresh one).
# Source: https://crowllm.com/api/pricing (accessed 2026-11-23).
# Served id, verbatim from GET https://crowllm.com/v1/models (accessed 2026-11-23): "deepseek-v4-flash:free".
# This id carries the `:free` suffix but is NOT zero-rated: the suffix names the free-account shelf, and this
# entry bills a small per-token rate. The zero-rated ids are listed separately at price 0.
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|high|max (top-level, forwarded verbatim)
# The reasoning controls mirror providers/deepseek for the same model on this surface.
# Live gateway row: model_ratio=0.075, completion_ratio=4, cache_ratio=0.033333333333, enable_groups=['free','pro'].
# Re-checked on 2026-11-23 against /v1/models and /api/pricing.
schema = 2
base_model = "deepseek/deepseek-v4-flash"
name = "DeepSeek V4 Flash (free-tier id)"

[capabilities]
cache = { implicit = true }
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }

[cost.text.input]
price = 0.15
cache = { read = 0.005 }

[cost.text.output]
price = 0.6
