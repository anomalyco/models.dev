# CrowLLM relays this model on POST /v1/chat/completions (OpenAI-compatible).
# cost is the gateway's live billing rate: USD/MTok = 2 x model_ratio, output = input x completion_ratio.
# Source: https://crowllm.com/api/pricing (accessed 2026-10-07).
# Always-on alias: reasoning is enabled for this id and cannot be turned off here;
# `glm-5.2` is the id that takes the thinking control.
# Effort: reasoning_effort = high|max (top-level, forwarded verbatim)
# reasoning_options mirror providers/zhipuai for the same model on this surface.
base_model = "zhipuai/glm-5.2"
name = "GLM-5.2 Thinking"
reasoning_options = [{ type = "effort", values = ["high", "max"] } ]

[cost]
input = 0.99
output = 2.99
