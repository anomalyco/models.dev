# CrowLLM relays this model on POST /v1/chat/completions (OpenAI-compatible).
# cost is the gateway's live billing rate: USD/MTok = 2 x model_ratio, output = input x completion_ratio.
# Source: https://crowllm.com/api/pricing (accessed 2026-10-09).
# Served id, verbatim from GET https://crowllm.com/v1/models (accessed 2026-10-09): "openai/gpt-oss-safeguard-20b:free".
# Effort: reasoning_effort = low|medium|high (top-level, forwarded verbatim)
# reasoning_options mirror providers/groq for the same model on this surface.
# Set adjusted from providers/kilo: gpt-oss family baseline; providers/kilo authors only high.
# Live gateway row: model_ratio=0, completion_ratio=1, cache_ratio=None, enable_groups=['free', 'pro'].
base_model = "openai/gpt-oss-safeguard-20b"
name = "GPT OSS Safeguard 20B (free)"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high"] } ]

[cost]
input = 0
output = 0
