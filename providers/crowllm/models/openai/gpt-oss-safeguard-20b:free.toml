# CrowLLM relays this model on POST /v1/chat/completions (OpenAI-compatible).
# cost is the gateway's live billing rate: USD/MTok = 2 x model_ratio, output = input x completion_ratio.
# Source: https://crowllm.com/api/pricing (accessed 2026-10-07).
# Effort: reasoning_effort = low|medium|high (top-level, forwarded verbatim)
# reasoning_options mirror providers/kilo for the same model on this surface.
# Live gateway row: model_ratio=0, completion_ratio=1, cache_ratio=None, enable_groups=['free', 'pro', 'starter'].
base_model = "openai/gpt-oss-safeguard-20b"
name = "GPT OSS Safeguard 20B (free)"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high"] } ]

[cost]
input = 0
output = 0
