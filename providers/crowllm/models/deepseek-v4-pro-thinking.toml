# cost is the gateway's live billing rate: USD/MTok = 2 x model_ratio, output = input x completion_ratio,
# cache_read = input x cache_ratio (service/text_quota.go bills cached prompt tokens at cache_ratio of a fresh one).
# Source: https://crowllm.com/api/pricing (accessed 2026-10-12).
# Served id, verbatim from GET https://crowllm.com/v1/models (accessed 2026-10-12): "deepseek-v4-pro-thinking".
# Always-on alias: reasoning is enabled for this id and cannot be turned off here;
# `deepseek-v4-pro` is the id that takes the thinking control.
# Effort: reasoning_effort = low|high|max (top-level, forwarded verbatim)
# reasoning_options mirror providers/deepseek for the same model on this surface.
# Live gateway row: model_ratio=0.275, completion_ratio=3.272727272727, cache_ratio=0.1, enable_groups=['pro'].
base_model = "deepseek/deepseek-v4-pro"
name = "DeepSeek V4 Pro Thinking"
reasoning_options = [{ type = "effort", values = ["low", "high", "max"] } ]

