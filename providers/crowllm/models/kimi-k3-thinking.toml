# CrowLLM relays this model on POST /v1/chat/completions (OpenAI-compatible).
# cost is the gateway's live billing rate: USD/MTok = 2 x model_ratio, output = input x completion_ratio,
# cached input = input x cache_ratio (service/text_quota.go bills a cached prompt token at cache_ratio of a fresh one).
# Source: https://crowllm.com/api/pricing (accessed 2026-11-21).
# Served id, verbatim from GET https://crowllm.com/v1/models (accessed 2026-11-21): "kimi-k3-thinking".
# Always-on alias: reasoning is enabled for this id and cannot be turned off here;
# `kimi-k3` is the id that takes the thinking control.
# Effort: reasoning_effort = low|high|max (top-level, forwarded verbatim)
# The reasoning controls mirror providers/moonshotai for the same model on this surface.
# Live gateway row (no separate row in /api/pricing; priced from `kimi-k3`): model_ratio=1.245, completion_ratio=5.21686746988, cache_ratio=0.089558232932, enable_groups=['pro'].
schema = 2
base_model = "moonshotai/kimi-k3"
name = "Kimi K3 Thinking"

[capabilities]
cache = { implicit = true }
reasoning = { supported = true, effort = ["low", "high", "max"] }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 2.49
cache = { read = 0.223 }

[cost.text.output]
price = 12.99
