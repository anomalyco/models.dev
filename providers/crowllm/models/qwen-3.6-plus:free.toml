# CrowLLM relays this model on POST /v1/chat/completions (OpenAI-compatible).
# cost is the gateway's live billing rate: USD/MTok = 2 x model_ratio, output = input x completion_ratio.
# Source: https://crowllm.com/api/pricing (accessed 2026-10-09).
# Served id, verbatim from GET https://crowllm.com/v1/models (accessed 2026-10-09): "qwen-3.6-plus:free".
# Toggle: enable_thinking = true|false (Qwen hybrid thinking)
# Budget: thinking_budget = integer reasoning tokens; the gateway only forwards it for Qwen thinking-budget models
# reasoning_options mirror providers/alibaba for the same model on this surface.
# Live gateway row: model_ratio=0, completion_ratio=1, cache_ratio=None, enable_groups=['pro', 'free'].
base_model = "alibaba/qwen3.6-plus"
name = "Qwen3.6 Plus (free)"
reasoning_options = [{ type = "toggle" }, { type = "budget_tokens" } ]

[cost]
input = 0
output = 0
