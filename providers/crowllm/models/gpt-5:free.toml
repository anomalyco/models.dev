# CrowLLM relays this model on POST /v1/chat/completions (OpenAI-compatible).
# cost is the gateway's live billing rate: USD/MTok = 2 x model_ratio, output = input x completion_ratio.
# Source: https://crowllm.com/api/pricing (accessed 2026-10-07).
# Served id, verbatim from GET https://crowllm.com/v1/models (accessed 2026-10-07): "gpt-5:free".
# Effort: reasoning_effort = minimal|low|medium|high (top-level, forwarded verbatim)
# reasoning_options mirror providers/openai for the same model on this surface.
# Live gateway row: model_ratio=0, completion_ratio=8, cache_ratio=None, enable_groups=['free', 'pro'].
base_model = "openai/gpt-5"
name = "GPT-5 (free)"
reasoning_options = [{ type = "effort", values = ["minimal", "low", "medium", "high"] } ]

[cost]
input = 0
output = 0
