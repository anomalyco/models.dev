# CrowLLM relays this model on POST /v1/chat/completions (OpenAI-compatible).
# cost is the gateway's live billing rate: USD/MTok = 2 x model_ratio, output = input x completion_ratio,
# cached input = input x cache_ratio (service/text_quota.go bills a cached prompt token at cache_ratio of a fresh one).
# Source: https://crowllm.com/api/pricing (accessed 2026-10-23).
# Served id, verbatim from GET https://crowllm.com/v1/models (accessed 2026-10-23): "gpt-5.6-sol:free".
# Off is effort=none; graded levels, no toggle.
# Effort: reasoning_effort = none|low|medium|high|xhigh|max (top-level, forwarded verbatim)
# The reasoning controls mirror providers/openai for the same model on this surface.
# Live gateway row: model_ratio=0, completion_ratio=3.191780821918, cache_ratio=0.1, enable_groups=['free', 'pro'].
schema = 2
base_model = "openai/gpt-5.6-sol"
name = "GPT-5.6 Sol (free)"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 0

[cost.text.output]
price = 0
