# CrowLLM relays this model on POST /v1/chat/completions (OpenAI-compatible).
# cost is the gateway's live billing rate: USD/MTok = 2 x model_ratio, output = input x completion_ratio.
# Source: https://crowllm.com/api/pricing (accessed 2026-10-08).
# Served id, verbatim from GET https://crowllm.com/v1/models (accessed 2026-10-08): "gpt-6-astra".
# Effort: reasoning_effort = low|medium|high|xhigh|max (top-level, forwarded verbatim)
# reasoning_options mirror providers/openai for the same model on this surface.
# Live gateway row: model_ratio=2.5, completion_ratio=3.998, cache_ratio=None, enable_groups=['pro'].
base_model = "openai/gpt-6-astra"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh", "max"] } ]

[cost]
input = 5
output = 19.99
