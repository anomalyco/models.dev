# CrowLLM relays this model on POST /v1/chat/completions (OpenAI-compatible).
# cost is the gateway's live billing rate: USD/MTok = 2 x model_ratio, output = input x completion_ratio,
# cached input = input x cache_ratio (service/text_quota.go bills a cached prompt token at cache_ratio of a fresh one).
# Source: https://crowllm.com/api/pricing (accessed 2026-11-23).
# Served id, verbatim from GET https://crowllm.com/v1/models (accessed 2026-11-23): "glm-4.7-flash:free".
# Reasoning: toggle only. The lab entry (providers/zhipuai/models/glm-4.7-flash.toml) publishes a binary
# thinking.type switch and no graded effort, and every host in this repo that serves this model
# (zhipuai, zai, openrouter, kilo as ["none","high"]) is toggle-only or partial, so no effort ladder is declared.
# Toggle: thinking.type = enabled|disabled (default enabled)
# Live gateway row: model_ratio=0, completion_ratio=0, cache_ratio=n/a, enable_groups=['free','pro'].
# Re-checked on 2026-11-23 against /v1/models and /api/pricing: still served, still zero-rated.
schema = 2
base_model = "zhipuai/glm-4.7-flash"
name = "GLM-4.7 Flash (free)"

[capabilities]
reasoning = { supported = true, default = { type = "toggle", value = true }, toggle = true }

[cost.text.input]
price = 0.0
cache = { read = 0.0 }

[cost.text.output]
price = 0.0
