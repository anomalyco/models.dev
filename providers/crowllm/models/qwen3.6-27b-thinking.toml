# CrowLLM relays this model on POST /v1/chat/completions (OpenAI-compatible).
# cost is the gateway's live billing rate: USD/MTok = 2 x model_ratio, output = input x completion_ratio,
# cached input = input x cache_ratio (service/text_quota.go bills a cached prompt token at cache_ratio of a fresh one).
# Source: https://crowllm.com/api/pricing (accessed 2026-10-23).
# Served id, verbatim from GET https://crowllm.com/v1/models (accessed 2026-10-23): "qwen3.6-27b-thinking".
# Always-on alias: reasoning is enabled for this id and cannot be turned off here;
# `qwen3.6-27b` is the id that takes the thinking control.
# Budget: thinking_budget = .. reasoning tokens; relaykit/dto/openai_request.go keeps the field for any qwen* upstream model and drops it for the rest
# The reasoning controls mirror providers/alibaba for the same model on this surface.
# Live gateway row: model_ratio=0.15, completion_ratio=6.633333333333, cache_ratio=0.1, enable_groups=['pro'].
schema = 2
base_model = "alibaba/qwen3.6-27b"
name = "Qwen3.6 27B Thinking"

[capabilities]
reasoning = { supported = true, budget = {} }

[cost.text.input]
price = 0.3
cache = { read = 0.03 }

[cost.text.output]
price = 1.99
