# CrowLLM relays this model on POST /v1/chat/completions (OpenAI-compatible).
# cost is the gateway's live billing rate: USD/MTok = 2 x model_ratio, output = input x completion_ratio.
# Source: https://crowllm.com/api/pricing (accessed 2026-10-09).
# Served id, verbatim from GET https://crowllm.com/v1/models (accessed 2026-10-09): "minimax-m3".
# Toggle: thinking.type = enabled|disabled
# reasoning_options mirror providers/minimax for the same model on this surface.
# Live gateway row: model_ratio=0.15, completion_ratio=4.166666666667, cache_ratio=None, enable_groups=['pro'].
base_model = "minimax/MiniMax-M3"
reasoning_options = [{ type = "toggle" } ]

[cost]
input = 0.3
output = 1.25
