# CrowLLM relays this model on POST /v1/chat/completions (OpenAI-compatible).
# cost is the gateway's live billing rate: USD/MTok = 2 x model_ratio, output = input x completion_ratio,
# cached input = input x cache_ratio (service/text_quota.go bills a cached prompt token at cache_ratio of a fresh one).
# Source: https://crowllm.com/api/pricing (accessed 2026-10-23).
# Served id, verbatim from GET https://crowllm.com/v1/models (accessed 2026-10-23): "mistral-medium-3.5:free".
# Effort: reasoning_effort = high (top-level; dto/openai_request.go:38, forwarded verbatim to the upstream channel)
# The reasoning controls mirror providers/aimlapi for the same model on this surface.
# Live gateway row: model_ratio=0, completion_ratio=3, cache_ratio=None, enable_groups=['free', 'pro'].
schema = 2
base_model = "mistral/mistral-medium-3-5"
name = "Mistral Medium 3.5 (free)"

[capabilities]
reasoning = { supported = true, effort = ["high"] }

[cost.text.input]
price = 0

[cost.text.output]
price = 0
