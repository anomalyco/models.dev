# CrowLLM relays this model on POST /v1/chat/completions (OpenAI-compatible).
# cost is the gateway's live billing rate: USD/MTok = 2 x model_ratio, output = input x completion_ratio,
# cached input = input x cache_ratio (service/text_quota.go bills a cached prompt token at cache_ratio of a fresh one).
# Source: https://crowllm.com/api/pricing (accessed 2026-10-23).
# Served id, verbatim from GET https://crowllm.com/v1/models (accessed 2026-10-23): "qwen3.8-flash-thinking".
# Always-on alias: reasoning is enabled for this id and cannot be turned off here;
# `qwen3.8-flash` is the id that takes the thinking control.
# Effort: reasoning_effort = low|medium|xhigh (top-level, forwarded verbatim)
# Budget: thinking_budget = ..262144 reasoning tokens; relaykit/dto/openai_request.go keeps the field for any qwen* upstream model and drops it for the rest
# The reasoning controls mirror providers/alibaba for the same model on this surface.
# Live gateway row: model_ratio=0.075, completion_ratio=2.133333333333, cache_ratio=0.106667, enable_groups=['pro'].
schema = 2
base_model = "alibaba/qwen3.8-flash"
name = "Qwen3.8 Flash Thinking"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "xhigh"], budget = { max = 262_144 } }

[cost.text.input]
price = 0.15
cache = { read = 0.016 }

[cost.text.output]
price = 0.32
