# CrowLLM relays this model on POST /v1/chat/completions (OpenAI-compatible).
# cost is the gateway's live billing rate: USD/MTok = 2 x model_ratio, output = input x completion_ratio,
# cached input = input x cache_ratio (service/text_quota.go bills a cached prompt token at cache_ratio of a fresh one).
# Source: https://crowllm.com/api/pricing (accessed 2026-10-23).
# Served id, verbatim from GET https://crowllm.com/v1/models (accessed 2026-10-23): "nemotron-3-super-120b-a12b:free".
# Off is effort=none; graded levels, no toggle.
# Effort: reasoning_effort = none|low|medium (top-level, kept in the body the gateway forwards to the serving stack)
# The reasoning controls mirror providers/boundless for the same model on this surface.
# Live gateway row: model_ratio=0, completion_ratio=1, cache_ratio=None, enable_groups=['free', 'pro'].
schema = 2
base_model = "nvidia/nemotron-3-super-120b-a12b"
name = "Nemotron 3 Super 120B A12B (free)"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium"] }

[cost.text.input]
price = 0

[cost.text.output]
price = 0
