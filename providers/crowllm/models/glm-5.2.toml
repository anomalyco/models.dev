# CrowLLM relays this model on POST /v1/chat/completions (OpenAI-compatible).
# cost is the gateway's live billing rate: USD/MTok = 2 x model_ratio, output = input x completion_ratio,
# cache_read = input x cache_ratio (service/text_quota.go bills cached prompt tokens at cache_ratio of a fresh one).
# Source: https://crowllm.com/api/pricing (accessed 2026-10-13).
# Served id, verbatim from GET https://crowllm.com/v1/models (accessed 2026-10-13): "glm-5.2".
# Effort: reasoning_effort = high|max (top-level, forwarded verbatim)
# reasoning_options mirror providers/zhipuai for the same model on this surface.
# Live gateway row: model_ratio=0.495, completion_ratio=3.020202020202, cache_ratio=0.1, enable_groups=['pro'].
base_model = "zhipuai/glm-5.2"
reasoning_options = [{ type = "effort", values = ["high", "max"] } ]

[cost]
input = 0.99
output = 2.99
cache_read = 0.099
