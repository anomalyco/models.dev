# CrowLLM relays this model on POST /v1/chat/completions (OpenAI-compatible).
# cost is the gateway's live billing rate: USD/MTok = 2 x model_ratio, output = input x completion_ratio,
# cached input = input x cache_ratio (service/text_quota.go bills a cached prompt token at cache_ratio of a fresh one).
# Source: https://crowllm.com/api/pricing (accessed 2026-10-23).
# Served id, verbatim from GET https://crowllm.com/v1/models (accessed 2026-10-23): "hy4-preview".
# Effort: reasoning_effort = low|high (top-level, forwarded verbatim)
# The reasoning controls mirror providers/aimlapi for the same model on this surface.
# Live gateway row: model_ratio=0.415, completion_ratio=2.397590361446, cache_ratio=0.1, enable_groups=['pro'].
schema = 2
base_model = "tencent/hy4-preview"

[capabilities]
reasoning = { supported = true, effort = ["low", "high"] }

[cost.text.input]
price = 0.83
cache = { read = 0.083 }

[cost.text.output]
price = 1.99
