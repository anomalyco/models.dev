# CrowLLM relays this model on POST /v1/chat/completions (OpenAI-compatible).
# cost is the gateway's live billing rate: USD/MTok = 2 x model_ratio, output = input x completion_ratio.
# Source: https://crowllm.com/api/pricing (accessed 2026-10-07).
# reasoning_options mirror providers/meta for the same model on this surface.
base_model = "meta/muse-spark-1.1"
name = "Muse Spark 1.1 (free)"
reasoning_options = [{ type = "effort", values = ["minimal", "low", "medium", "high", "xhigh"] } ]

[cost]
input = 0
output = 0
