# CrowLLM relays this model on POST /v1/chat/completions (OpenAI-compatible).
# cost is the gateway's live billing rate: USD/MTok = 2 x model_ratio, output = input x completion_ratio,
# cache_read = input x cache_ratio (service/text_quota.go bills cached prompt tokens at cache_ratio of a fresh one).
# Source: https://crowllm.com/api/pricing (accessed 2026-10-12).
# Served id, verbatim from GET https://crowllm.com/v1/models (accessed 2026-10-12): "gpt-5.5-instant:free".
# Effort: reasoning_effort = low|medium|high (top-level, forwarded verbatim)
# reasoning_options mirror providers/zenmux for the same model on this surface.
# Live gateway row: model_ratio=0, completion_ratio=6, cache_ratio=None, enable_groups=['free', 'pro'].
base_model = "openai/gpt-5.5-instant"
name = "GPT-5.5 Instant (free)"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high"] } ]

[cost]
input = 0
output = 0
