# Sources (accessed 2026-08-16):
# https://api.koscompute.com/v1/models
# https://api.koscompute.com/openapi.json
# Disable: reasoning_effort = none
# Enable/effort: reasoning_effort = low|medium|high
# Tool-call reasoning is returned and replayed in reasoning_content.

base_model = "alibaba/qwen3.8-27b"
description = "Dense 27B vision-language model for coding, agent tasks, and image understanding"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high"]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.35
output = 2.20
cache_read = 0.09

# Full 262,144-token text-only context; the serving router enforces the
# 131,072-token limit for multimodal requests.
[limit]
context = 262_144

[modalities]
input = ["text", "image"]
