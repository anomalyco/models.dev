# Served at abltr with a 1,000,000-token context; the upstream checkpoint is 256k.
# abltr serves this deployment with reasoning always on; no request-level reasoning control (toggle/effort/budget) is exposed.
# Sources: https://abltr.ai/models and https://abltr.ai/src/js/data/models.js (accessed 2026-11-22)
schema = 2
v2_only = true
base_model = "alibaba/qwen3.8-27b"
name = "Qwen3.8 27B · Uncensored · Thinking"
description = "Qwen3.8 27B · Uncensored · Thinking serves an uncensored or abliterated community build behind abltr's OpenAI-compatible endpoint. It accepts tools, json, reasoning. Context is 1M. Rates are $1.2 per 1M input tokens and $3.6 per 1M output tokens."

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true

[limit]
context = 1000000

[cost.text.input]
price = 1.2

[cost.text.output]
price = 3.6

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
