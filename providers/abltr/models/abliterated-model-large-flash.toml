# Sources: https://abltr.ai/models and https://abltr.ai/src/js/data/models.js (accessed 2026-11-22)
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"
name = "Abliterated Model Large Flash"
description = "Abliterated Model Large Flash serves an uncensored or abliterated community build behind abltr's OpenAI-compatible endpoint. It accepts tools, json. Context is 1M. Rates are $1.03 per 1M input tokens and $2.06 per 1M output tokens."

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
structured_output = true

[limit]
context = 1000000

[cost.text.input]
price = 1.03

[cost.text.output]
price = 2.06
