# Sources: https://abltr.ai/models and https://abltr.ai/src/js/data/models.js (accessed 2026-11-22)
schema = 2
base_model = "google/gemma-4-26b-a4b-it"
name = "SuperGemma 4 26B · Uncensored"
description = "SuperGemma 4 26B · Uncensored serves an uncensored or abliterated community build behind abltr's OpenAI-compatible endpoint. It accepts tools, json. Context is 128k. Rates are $0.2 per 1M input tokens and $0.6 per 1M output tokens."

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = false }
structured_output = true

[limit]
context = 128000

[cost.text.input]
price = 0.2

[cost.text.output]
price = 0.6
