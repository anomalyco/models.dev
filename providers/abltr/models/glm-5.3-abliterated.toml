# Sources: https://abltr.ai/models and https://abltr.ai/src/js/data/models.js (accessed 2026-11-22)
schema = 2
base_model = "zhipuai/glm-5.3"
name = "GLM-5.3 · Abliterated"
description = "GLM-5.3 · Abliterated serves an uncensored or abliterated community build behind abltr's OpenAI-compatible endpoint. It accepts tools, json, reasoning. Context is 1M. Rates are $1.19 per 1M input tokens and $2.38 per 1M output tokens."

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
structured_output = true

[limit]
context = 1000000

[cost.text.input]
price = 1.19

[cost.text.output]
price = 2.38
