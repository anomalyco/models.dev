# Reasoning: reasoning_effort = low|high|max (default max), forwarded by abltr's OpenAI-compatible endpoint.
# Sources: https://abltr.ai/models and https://abltr.ai/src/js/data/models.js (accessed 2026-11-22)
schema = 2
base_model = "zhipuai/glm-5.3"
name = "GLM 5.3 · Standard"
description = "GLM 5.3 · Standard serves a published checkpoint behind abltr's OpenAI-compatible endpoint. It accepts tools, json, reasoning. Context is 1M. Rates are $1.52 per 1M input tokens and $2.75 per 1M output tokens."

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "max" }, effort = ["low", "high", "max"] }
structured_output = true

[cost.text.input]
price = 1.52

[cost.text.output]
price = 2.75
