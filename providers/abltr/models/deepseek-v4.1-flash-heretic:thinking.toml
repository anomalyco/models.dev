# abltr serves this deployment with reasoning always on; no request-level reasoning control (toggle/effort/budget) is exposed.
# Sources: https://abltr.ai/models and https://abltr.ai/src/js/data/models.js (accessed 2026-11-22)
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"
name = "DeepSeek V4.1 Flash · Heretic · Thinking"
description = "DeepSeek V4.1 Flash · Heretic · Thinking serves an uncensored or abliterated community build behind abltr's OpenAI-compatible endpoint. It accepts tools, json, reasoning. Context is 512k. Rates are $0.24 per 1M input tokens and $0.97 per 1M output tokens."

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true

[limit]
context = 512000

[cost.text.input]
price = 0.24

[cost.text.output]
price = 0.97
