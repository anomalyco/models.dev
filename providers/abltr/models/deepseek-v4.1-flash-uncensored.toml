# abltr serves this deployment with reasoning always on; no request-level reasoning control (toggle/effort/budget) is exposed.
# Sources: https://abltr.ai/models and https://abltr.ai/src/js/data/models.js (accessed 2026-11-22)
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"
name = "DeepSeek V4.1 Flash · Uncensored"
description = "DeepSeek V4.1 Flash · Uncensored serves an uncensored or abliterated community build behind abltr's OpenAI-compatible endpoint. It accepts tools, json, reasoning. Context is 1M. Rates are $0.4 per 1M input tokens and $1.61 per 1M output tokens."

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true

[cost.text.input]
price = 0.4

[cost.text.output]
price = 1.61
