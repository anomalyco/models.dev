# Off: reasoning_effort = "none" (omit the field for the model default, which reasons); Effort: reasoning_effort = "low"|"high"|"max" (lab set, default max). Live-verified 2026-09-11: none returns no reasoning_content
# https://api.pgsgrove.com/docs/reasoning (accessed 2026-09-11)
base_model = "moonshotai/kimi-k3"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "high", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 3.75
output = 15.00
cache_read = 0.45

[limit]
output = 32_768
