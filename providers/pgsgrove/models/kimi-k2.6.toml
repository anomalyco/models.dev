# Toggle: reasoning_effort = "none" disables reasoning; omit the field to reason (default). No graded levels on this model.
# https://api.pgsgrove.com/docs/reasoning (accessed 2026-09-11)
base_model = "moonshotai/kimi-k2.6"

[[reasoning_options]]
type = "toggle"

[interleaved]
field = "reasoning_content"

[cost]
