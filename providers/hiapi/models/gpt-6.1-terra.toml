# Effort: live probe 2026-11-25, reasoning_effort none|low|medium|high|xhigh|max return 200; minimal is rejected with 400.
# Prices: https://hiapi.ai/en/pricing (accessed 2026-11-25), USD per 1M tokens.
# Request controls: https://hiapi.ai/docs/models.json (accessed 2026-11-25).
# Verified live 2026-11-25: POST https://api.hiapi.ai/v1/chat/completions returns 200; tool calls returned.
schema = 2
base_model = "openai/gpt-6.1-terra"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
cache = { implicit = true }

[cost.text.input]
price = 0.25
cache = { read = 0.0125 }

[cost.text.output]
price = 1.25
