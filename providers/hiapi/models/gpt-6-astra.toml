# Effort: live probe 2026-11-25, reasoning_effort low|medium|high return 200; none, minimal, xhigh and max are rejected with 400 invalid_parameter.
# Prices: https://hiapi.ai/en/pricing (accessed 2026-11-25), USD per 1M tokens.
# Request controls: https://hiapi.ai/docs/models.json (accessed 2026-11-25).
# Verified live 2026-11-25: POST https://api.hiapi.ai/v1/chat/completions returns 200 (streaming too); usage reports cached_tokens.
schema = 2
base_model = "openai/gpt-6-astra"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
cache = { implicit = true }

[cost.text.input]
price = 2.5
cache = { read = 0.25 }

[cost.text.output]
price = 12.5
