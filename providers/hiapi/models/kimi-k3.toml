# Limits: HiAPI model metadata caps output at 131,072 tokens and context at 1,000,000.
# Prices: https://hiapi.ai/docs/models.json `pricing` (unit usd_per_1m_tokens, accessed 2026-11-27), copied as listed; no currency conversion.
# Request controls: https://hiapi.ai/docs/models.json (accessed 2026-11-25).
# Verified live 2026-11-25 on https://api.hiapi.ai/v1 and again 2026-11-27 on https://api.hiapi.sh/v1: POST /chat/completions returns 200.
schema = 2
base_model = "moonshotai/kimi-k3"

[limit]
context = 1_000_000
output = 131_072

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 2.32
cache = { read = 0.232 }

[cost.text.output]
price = 11.6
