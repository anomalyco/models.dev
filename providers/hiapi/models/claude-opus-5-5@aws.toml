# Prices: https://hiapi.ai/docs/models.json `pricing` (unit usd_per_1m_tokens, accessed 2026-11-27), copied as listed; no currency conversion.
# Cache write: the catalog lists the 5m write price (cacheWrite); the 1h write is derived as 2x input (Anthropic multiplier).
# Request controls: https://hiapi.ai/docs/models.json (accessed 2026-11-25).
# Verified live 2026-11-25 on https://api.hiapi.ai/v1 and again 2026-11-27 on https://api.hiapi.sh/v1: POST /chat/completions returns 200; system content accepts cache_control (explicit cache).
schema = 2
base_model = "anthropic/claude-opus-5-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
cache = { explicit = { ttl = ["5m", "1h"] } }

[cost.text.input]
price = 3.05284
cache = { read = 0.152642, write = { "5m" = 3.81605, "1h" = 6.10568 } }

[cost.text.output]
price = 15.2642
