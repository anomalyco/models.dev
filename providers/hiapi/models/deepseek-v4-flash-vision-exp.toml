# Effort: reasoning_effort is passed through to the lab; values follow providers/deepseek (DeepSeek first-party).
# Prices: https://hiapi.ai/en/pricing (accessed 2026-11-25), USD per 1M tokens.
# Request controls: https://hiapi.ai/docs/models.json (accessed 2026-11-25).
# Verified live 2026-11-25: POST https://api.hiapi.sh/v1/chat/completions returns 200.
schema = 2
base_model = "deepseek/deepseek-v4-flash-vision-exp"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.286
cache = { read = 0.08918 }

[cost.text.output]
price = 0.858
