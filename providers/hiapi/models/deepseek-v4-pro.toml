# Toggle: thinking.type = enabled|disabled (reasoning_effort = "none" also disables thinking); both checked live 2026-11-27 on api.hiapi.sh: reasoning_tokens = 0, no reasoning_content.
# Prices: https://hiapi.ai/docs/models.json `pricing` (unit usd_per_1m_tokens, accessed 2026-11-27), copied as listed; no currency conversion.
# Request controls: https://hiapi.ai/docs/models.json (accessed 2026-11-25).
# Verified live 2026-11-25 on https://api.hiapi.ai/v1 and again 2026-11-27 on https://api.hiapi.sh/v1: POST /chat/completions returns 200; tool calls returned.
# Effort: reasoning_effort = low|high|max, passed through; follows providers/deepseek and zenmux. "low" checked live 2026-11-27.
# Limits: https://hiapi.ai/docs/models.json lists context 1,000,000 / output 384,000 (accessed 2026-11-27); equal to the lab entry, so no [limit] override.
schema = 2
base_model = "deepseek/deepseek-v4-pro"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.5
cache = { read = 0.05 }

[cost.text.output]
price = 4.5
