# Cyber v1: Nodecode's abliterated model for authorized security testing and pentest
# agents: DeepSeek V4.1 Flash 1017 with its refusal direction abliterated (named on nodecode.ai/cyber),
# so it inherits the lab entry (base_model) and overrides only what this host serves differently.
# Sources (accessed 2026-11-12):
#   https://nodecode.ai/cyber  (model card)
#   https://nodecode.ai/docs/cyber  (1,048,576-token context; reasoning arrives in
#     `message.reasoning` on chat completions; tool calls)
#   https://nodecode.ai/docs/pricing#what-a-call-costs  (USD per 1M tokens: 0.33 input,
#     0.009 cached input, 1.32 output; cached input of a request over 262,144 input tokens
#     pays 4x the cached price; every token 50% off from Friday 00:00 to Monday 00:00
#     Amsterdam time)
#   GET https://api.nodecode.ai/v1/models  (context_length 1048576, max_output_tokens 131072)
# Reasoning probes, live 2026-11-12 against https://api.nodecode.ai/v1, model nodecode-cyber-v1,
#   temperature 0, same short arithmetic prompt on every API:
#   Chat Completions: chat_template_kwargs.thinking=false -> no reasoning, 2 completion tokens
#     (default: 226 reasoning chars, 105 tokens), so toggle = true. thinking.type=disabled is
#     ignored there.
#   Responses: served; output carries a reasoning item before the message.
#   Messages (x-api-key auth): served; thinking.type=disabled -> no thinking block,
#     enabled/default -> thinking blocks.
# Effort, live probe 2026-11-12 on Chat Completions plus the serving engine's encoding:
#   reasoning_effort="bogus" -> HTTP 400, the complete validated enum:
#     "Input should be 'none', 'minimal', 'low', 'medium', 'high', 'xhigh' or 'max'".
#   Of those, the engine takes low, high, xhigh and max (HTTP 200); minimal and medium -> HTTP 400
#     "DeepSeek V4.1 reasoning_effort must be low, high, xhigh, max, or an integer within [1, 100]";
#     none -> 200 with thinking off (0 reasoning chars).
#   The engine (vLLM, tokenizers/deepseek_v41_encoding.py, inspected on the serving host
#     2026-11-12) renders the level as a numeric reasoning budget at the head of the prompt in
#     thinking mode: low=50, high=75, xhigh=75, max=100; unset = high. So the distinct levels are
#     low|high|max with default high, the same ladder as DeepSeek's own deepseek-flash.
#   Output length did not separate the levels on a short arithmetic prompt (4 runs each, reasoning
#     chars: low 678-1477, high 978-1532, max 675-1030, same answer), so the ladder rests on the
#     validation and the encoding, not on that prompt.
#   The same budget is reached from the other APIs: Responses reasoning.effort low->low,
#     medium/high->high, xhigh->xhigh, none/minimal->thinking off; Messages output_config.effort
#     low->low, medium/high->high, xhigh->xhigh, max->max.
# top_k, live probe 2026-11-12 on Chat Completions (thinking off, temperature 1.5, 5 runs each):
#   top_k=1 -> 4 of 5 answers open with the same word; no top_k -> 5 different words.
#   top_k="abc" -> HTTP 400 "body.top_k: Input should be a valid integer". So top_k = true.
# Reasoning arrives in message.reasoning on Chat Completions; reasoning_field = "reasoning" is
#   valid in v2, but v1's interleaved.field only allows reasoning_content|reasoning_details,
#   so it is left unset.
# Weekend multiplier: Amsterdam midnight written as 23:00 UTC (CET, UTC+1); during
# Dutch summer time the window starts and ends an hour earlier in UTC.
# Image input, live probe 2026-11-12 on Chat Completions (thinking off): a 64x64 red image as a
#   JPEG, PNG, GIF and WebP data URL each -> HTTP 200 "Red" (197 prompt tokens), so the base model's
#   image input is inherited.
# Weights: nodecode.ai/cyber names the checkpoint (pqhaz/DeepSeek-V4.1-Flash-1017-heretic,
#   https://huggingface.co/pqhaz/DeepSeek-V4.1-Flash-1017-heretic) and says "The weights are a
#   public Hugging Face checkpoint", so open_weights is inherited (true).
# Release date: the model was first listed as Cyber v1 on nodecode.ai/pricing on 2026-10-19.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"
name = "Cyber v1"
description = "Abliterated DeepSeek V4.1 Flash 1017 for authorized security testing and pentest agents"
release_date = "2026-10-19"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "high" }, toggle = true, effort = ["low", "high", "max"] }
cache = { implicit = true }

[limit]
context = 1_048_576
output = 131_072

# Chat Completions first keeps v1 output unchanged; all three share https://api.nodecode.ai/v1.
[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.33
cache = { read = 0.009 }

[[cost.text.input.overrides]]
when = { context = { gt = 262_144 } }
cache = { read = 0.036 }

[cost.text.output]
price = 1.32

[[cost.multipliers]]
when = { any = [{ utc_days = { in = ["fri", "sat"] } }, { all = [{ utc_days = { in = ["thu"] } }, { utc_hours = { gte = "23:00" } }] }, { all = [{ utc_days = { in = ["sun"] } }, { utc_hours = { lt = "23:00" } }] }] }
factor = 0.5
