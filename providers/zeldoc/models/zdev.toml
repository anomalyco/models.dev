# Zeldoc publishes no API reference or documented toggle, effort, or token budget.
# https://docs.zeldoc.ai/ (accessed 2026-06-25)
schema = 2
name = "ZDev"
description = "Coding model for repository understanding, refactors, and agentic engineering tasks"
open_weights = false
release_date = "2026-08-26"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
temperature = true

[limit]
context = 1_000_000
output = 131_072

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0

[cost.text.output]
price = 0
