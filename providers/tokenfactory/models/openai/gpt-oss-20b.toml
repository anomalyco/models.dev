# Token Factory catalog (https://tokenfactory.iamsaif.ai/api/portal/v1/models), read 2026-07-28.
# All model metadata inherited from models/openai/gpt-oss-20b; only Token Factory pricing is overridden.
# reasoning_options reflect the gpt-oss reasoning-effort control.
base_model = "openai/gpt-oss-20b"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high"] }]

[cost]
input = 0.05
output = 0.20
