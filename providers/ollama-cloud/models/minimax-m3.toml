# Cost from https://ollama.com/pricing (accessed 2026-09-15).
schema = 2
name = "minimax-m3"
description = "MiniMax multimodal coding model for long-context reasoning and agent tasks"
family = "minimax-m3"
open_weights = true
knowledge = "2025-01"
release_date = "2026-05-31"

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "max"] }
temperature = true

[limit]
context = 512_000
output = 131_072

[cost.text.input]
price = 0.6
cache = { read = 0.12 }

[cost.text.output]
price = 2.4
