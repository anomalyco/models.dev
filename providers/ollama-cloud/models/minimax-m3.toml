# Cost from https://ollama.com/pricing (accessed 2026-09-15).
# Lab identity: minimax/MiniMax-M3 (Ollama library page https://ollama.com/library/minimax-m3).
# Structured output: false. "Ollama's cloud currently does not support structured outputs" (https://docs.ollama.com/capabilities/structured-outputs, 2026-10-21).
# Cache: implicit. Ollama prices cached input (https://ollama.com/pricing) and reports `prompt_eval_cached_count` / `cached_input_tokens`
#   (https://docs.ollama.com/api/usage); there is no request field, and Anthropic `cache_control` is unsupported (https://docs.ollama.com/api/anthropic-compatibility).
# Mid-conversation flags unset: Ollama doesn't document them and there was no OLLAMA_API_KEY to test. Ollama Cloud serves Chat Completions,
#   Responses (stateless) and Completions under /v1, Anthropic Messages at /v1/messages, and native /api/chat and /api/generate.
# Knowledge: unsourced. "2025-01" is kept from the earlier Ollama file; the MiniMax model card and lab file state no cutoff.
schema = 2
base_model = "minimax/MiniMax-M3"
name = "minimax-m3"
knowledge = "2025-01"
description = "MiniMax multimodal coding model for long-context reasoning and agent tasks"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "max"] }
structured_output = false
cache = { implicit = true }

[limit]
context = 512_000
output = 131_072

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.6
cache = { read = 0.12 }

[cost.text.output]
price = 2.4
