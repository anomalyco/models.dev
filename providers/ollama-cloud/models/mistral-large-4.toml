# Cost from https://ollama.com/pricing (accessed 2026-10-06): mistral-large-4
# $1.36 input / $0.14 cached input / $4.18 output per MTok. Context 1M and
# text/image input from https://ollama.com/library/mistral-large-4:cloud
# (matches inherited limit/modalities, so no limit override).
# Effort: OpenAI POST /v1/chat/completions accepts `reasoning_effort` or
# `reasoning.effort` with model-defined levels; copy lab native set none|high.
# Sources: https://docs.ollama.com/openai,
# https://docs.mistral.ai/models/mistral-large-4-0,
# providers/mistral/models/mistral-large-4.toml (reasoning_effort none|high).
# Price (2026-10-21): $0.68 input / $0.07 cached / $2.09 output per MTok on https://ollama.com/pricing and https://ollama.com/library/mistral-large-4 (was $1.36 / $0.14 / $4.18).
# Structured output: false. "Ollama's cloud currently does not support structured outputs" (https://docs.ollama.com/capabilities/structured-outputs, 2026-10-21).
# Cache: implicit. Ollama prices cached input (https://ollama.com/pricing) and reports `prompt_eval_cached_count` / `cached_input_tokens`
#   (https://docs.ollama.com/api/usage); there is no request field, and Anthropic `cache_control` is unsupported (https://docs.ollama.com/api/anthropic-compatibility).
# Mid-conversation flags unset: Ollama doesn't document them and there was no OLLAMA_API_KEY to test. Ollama Cloud serves Chat Completions,
#   Responses (stateless) and Completions under /v1, Anthropic Messages at /v1/messages, and native /api/chat and /api/generate.
schema = 2
base_model = "mistral/mistral-large-4"

[capabilities]
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = false
cache = { supported = true, implicit = true }

[cost.text.input]
price = 0.68
cache = { read = 0.07 }

[cost.text.output]
price = 2.09
