# Kimi K3.1 Pro on Ollama Cloud (model ID `kimi-k3.1-pro`).
# Sources (accessed 2026-11-07):
# - https://ollama.com/library/kimi-k3.1-pro (1M context; Text, Image; vision, tools, thinking; $2.00 input, $0.20 cached, $10.00 output)
# - https://ollama.com/pricing (kimi-k3.1-pro: $2.00 input, $0.20 cached input, $10.00 output per 1M tokens)
# - https://ollama.com/api/show (capabilities: vision, thinking, completion, tools; kimi-k3.context_length 1048576)
# - https://platform.kimi.ai/docs/guide/kimi-k3-1-pro-quickstart (reasoning_effort low|high|max, default max; Moonshot says K3.1 Pro always thinks)
# - Live POST https://ollama.com/v1/chat/completions (2026-11-07): no reasoning_effort returns a `reasoning` field; `reasoning_effort=none` returns content and no reasoning field, so this host can turn thinking off. Unknown effort strings also return 200, so the level list stays low|high|max.
# Modalities: the library page says Text, Image. The lab file also lists video; Ollama does not, so input drops video. Image types match the other Ollama Cloud Kimi entry.
# Structured output: false. "Ollama's cloud currently does not support structured outputs" (https://docs.ollama.com/capabilities/structured-outputs, accessed 2026-10-21).
# Cache: implicit. Ollama prices cached input (https://ollama.com/pricing) and reports `prompt_eval_cached_count` / `cached_input_tokens`
#   (https://docs.ollama.com/api/usage); there is no request field, and Anthropic `cache_control` is unsupported (https://docs.ollama.com/api/anthropic-compatibility).
# Mid-conversation flags unset: Ollama doesn't document them. Ollama Cloud serves Chat Completions,
#   Responses (stateless) and Completions under /v1, Anthropic Messages at /v1/messages, and native /api/chat and /api/generate.
# max_tokens_field: Ollama's OpenAI-compatible Chat API lists max_tokens and not max_completion_tokens (https://docs.ollama.com/api/openai-compatibility, accessed 2026-10-24); live probe 2026-10-24 ignored max_completion_tokens
schema = 2
base_model = "moonshotai/kimi-k3.1-pro"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = false
cache = { implicit = true }

[api.chat-completions]
compatibility = { max_tokens_field = "max_tokens" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 2
cache = { read = 0.2 }

[cost.text.output]
price = 10
