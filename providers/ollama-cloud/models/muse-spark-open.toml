# Cost from https://ollama.com/pricing (accessed 2026-10-15): muse-spark-open $1.25 input / $0.15 cached / $4.25 output per MTok.
# Library: https://ollama.com/library/muse-spark-open (1M context, Text+Image input, vision/tools/thinking/cloud tags, 822B params).
# Toggle: native POST /api/chat and /api/generate take `think = false|true`; /api/show lists `false` as a thinking value (https://docs.ollama.com/capabilities/thinking).
# Effort: reasoning_effort / reasoning.effort = low|medium|high|max on OpenAI POST /v1/chat/completions (Ollama's levels, default high;
#   the lab's native set is low|medium|high|xhigh with no off switch: https://huggingface.co/meta-models/Muse-Spark-Open-816B-A42B).
# Sources: https://docs.ollama.com/capabilities/thinking, https://docs.ollama.com/openai
# Reasoning: POST https://ollama.com/api/show reports thinking.values [false, low, medium, high, max] (default high) (2026-10-21); Ollama applies a model's named levels exactly and `false` disables thinking (https://docs.ollama.com/api/openai-compatibility).
# Structured output: false. "Ollama's cloud currently does not support structured outputs" (https://docs.ollama.com/capabilities/structured-outputs, 2026-10-21).
# Cache: implicit. Ollama prices cached input (https://ollama.com/pricing) and reports `prompt_eval_cached_count` / `cached_input_tokens`
#   (https://docs.ollama.com/api/usage); there is no request field, and Anthropic `cache_control` is unsupported (https://docs.ollama.com/api/anthropic-compatibility).
# Mid-conversation flags unset: Ollama doesn't document them and there was no OLLAMA_API_KEY to test. Ollama Cloud serves Chat Completions,
#   Responses (stateless) and Completions under /v1, Anthropic Messages at /v1/messages, and native /api/chat and /api/generate.
schema = 2
base_model = "meta/muse-spark-open"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "max"] }
structured_output = false
cache = { supported = true, implicit = true }

[cost.text.input]
price = 1.25
cache = { read = 0.15 }

[cost.text.output]
price = 4.25
