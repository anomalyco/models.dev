# Cost from https://ollama.com/pricing (accessed 2026-09-15). Ollama bills
# Base (off-peak) and Peak (2x, 12:00-18:00 UTC Mon-Fri) rates; the schema
# cannot express time-based tiers, so the Base rate is recorded. See
# https://github.com/anomalyco/models.dev/issues/5913.
# Lab identity: deepseek/deepseek-v4-flash (Ollama library page https://ollama.com/library/deepseek-v4-flash).
# Retired: POST https://ollama.com/api/show returns "deepseek-v4-flash:0731 was retired on September 25, 2026" (2026-10-21); it is no longer in https://ollama.com/v1/models.
# Structured output: false. "Ollama's cloud currently does not support structured outputs" (https://docs.ollama.com/capabilities/structured-outputs, 2026-10-21).
# Cache: implicit. Ollama prices cached input (https://ollama.com/pricing) and reports `prompt_eval_cached_count` / `cached_input_tokens`
#   (https://docs.ollama.com/api/usage); there is no request field, and Anthropic `cache_control` is unsupported (https://docs.ollama.com/api/anthropic-compatibility).
# Mid-conversation flags unset: Ollama doesn't document them and there was no OLLAMA_API_KEY to test. Ollama Cloud serves Chat Completions,
#   Responses (stateless) and Completions under /v1, Anthropic Messages at /v1/messages, and native /api/chat and /api/generate.
schema = 2
base_model = "deepseek/deepseek-v4-flash"
name = "deepseek-v4-flash"
description = "Fast DeepSeek model for efficient chat, coding help, and agent loops"
status = "deprecated"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["high", "max"] }
structured_output = false
cache = { supported = true, implicit = true }

[limit]
context = 1_048_576
output = 1_048_576

[cost.text.input]
price = 0.22
cache = { read = 0.007 }

[cost.text.output]
price = 0.66
