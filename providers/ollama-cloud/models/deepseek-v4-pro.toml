# Cost from https://ollama.com/pricing (accessed 2026-09-15). Ollama bills
# Base (off-peak) and Peak (2x, 12:00-18:00 UTC Mon-Fri) rates; the schema
# cannot express time-based tiers, so the Base rate is recorded. See
# https://github.com/anomalyco/models.dev/issues/5913.
# Lab identity: deepseek/deepseek-v4-pro (Ollama library page https://ollama.com/library/deepseek-v4-pro).
schema = 2
base_model = "deepseek/deepseek-v4-pro"
name = "deepseek-v4-pro"
description = "Flagship DeepSeek model for coding, reasoning, and agentic work"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["high", "max"] }

[limit]
context = 1_048_576
output = 1_048_576

[cost.text.input]
price = 0.66
cache = { read = 0.022 }

[cost.text.output]
price = 1.98
