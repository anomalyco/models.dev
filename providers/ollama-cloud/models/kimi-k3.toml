# Cost from https://ollama.com/pricing (accessed 2026-09-15).
# Ollama Cloud direct API model ID verified from https://docs.ollama.com/api/tags.
# Library page documents Kimi K3 as a cloud thinking model with 1M context
# and text/image input.
# Sources accessed 2026-07-27:
# https://docs.ollama.com/api/tags
# https://ollama.com/library/kimi-k3:cloud
schema = 2
base_model = "moonshotai/kimi-k3"
name = "kimi-k3"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true

[cost.text.input]
price = 3
cache = { read = 0.3 }

[cost.text.output]
price = 15
