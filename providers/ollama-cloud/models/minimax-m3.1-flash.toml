# Cost from https://ollama.com/pricing and https://ollama.com/library/minimax-m3.1-flash (accessed 2026-10-19): $0.15 input, $0.015 cached input, $0.60 output per 1M tokens.
# Reasoning effort low|medium|high|xhigh|max from first-party MiniMax API (thinking always on; disabled returns 400): https://platform.minimax.io/docs/api-reference/text-openai-api, https://platform.minimax.io/docs/api-reference/text-anthropic-api and providers/minimax/models/MiniMax-M3.1-Flash.toml; Ollama OpenAI passthrough via reasoning_effort / reasoning.effort: https://docs.ollama.com/openai
# Structured output: false. "Ollama's cloud currently does not support structured outputs" (https://docs.ollama.com/capabilities/structured-outputs, 2026-10-21).
# Cache: implicit. Ollama prices cached input (https://ollama.com/pricing) and reports `prompt_eval_cached_count` / `cached_input_tokens`
#   (https://docs.ollama.com/api/usage); there is no request field, and Anthropic `cache_control` is unsupported (https://docs.ollama.com/api/anthropic-compatibility).
# Mid-conversation flags unset: Ollama doesn't document them and there was no OLLAMA_API_KEY to test. Ollama Cloud serves Chat Completions,
#   Responses (stateless) and Completions under /v1, Anthropic Messages at /v1/messages, and native /api/chat and /api/generate.
schema = 2
base_model = "minimax/MiniMax-M3.1-Flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = false
cache = { implicit = true }

[cost.text.input]
price = 0.15
cache = { read = 0.015 }

[cost.text.output]
price = 0.6
