# Cost from https://ollama.com/pricing and https://ollama.com/library/hy4 (accessed 2026-11-22): hy4 $0.834 input / $0.042 cached input /
#   $2.501 output per MTok. The library page lists a 1M-token context and vision, tools and thinking.
# Effort: OpenAI POST /v1/chat/completions accepts `reasoning_effort` with model-defined levels (https://docs.ollama.com/openai);
#   Tencent's set none|high, as on Tencent TokenHub (providers/tencent-tokenhub/models/hy4.toml). none turns reasoning off, so no toggle.
# Layout, cache and structured-output notes follow this host's other cloud models (providers/ollama-cloud/models/mistral-large-4.toml).
# Structured output: false. "Ollama's cloud currently does not support structured outputs" (https://docs.ollama.com/capabilities/structured-outputs, 2026-10-21).
# Cache: implicit. Ollama prices cached input (https://ollama.com/pricing) and reports `prompt_eval_cached_count` / `cached_input_tokens`
#   (https://docs.ollama.com/api/usage); there is no request field, and Anthropic `cache_control` is unsupported (https://docs.ollama.com/api/anthropic-compatibility).
# Mid-conversation flags unset: Ollama doesn't document them and there was no OLLAMA_API_KEY to test. Ollama Cloud serves Chat Completions,
#   Responses (stateless) and Completions under /v1, Anthropic Messages at /v1/messages, and native /api/chat and /api/generate.
# max_tokens_field: Ollama's OpenAI-compatible Chat API lists max_tokens and not max_completion_tokens (https://docs.ollama.com/api/openai-compatibility, accessed 2026-10-24); live probe 2026-10-24 ignored max_completion_tokens
schema = 2
base_model = "tencent/hy4"
name = "hy4"

[capabilities]
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = false
cache = { implicit = true }

[api.chat-completions]
compatibility = { max_tokens_field = "max_tokens" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.834
cache = { read = 0.042 }

[cost.text.output]
price = 2.501
