# Pricing: catalog credit rates x 0.01 USD/credit, expressed per million tokens
# Source: https://router.hostinger.com/v1/models (public catalog: supported_parameters, pricing, limits)
# No reasoning control: this model's row in the keyless catalog lists no reasoning or
# reasoning_effort in supported_parameters (unlike its Claude siblings), and a 2026-10-22
# probe returned byte-identical completions at effort "none" and "high" (1006 tokens).
# Controls return when the catalog lists them and a probe shows an effect
schema = 2
base_model = "anthropic/claude-fable-5"

[capabilities]
reasoning = { supported = true }
structured_output = true
cache = { supported = true, implicit = false, explicit = { ttl = ["5m", "1h"] } }

[cost.text.input]
price = 12
cache = { read = 1.2, write = { "5m" = 15, "1h" = 24 } }

[cost.text.output]
price = 60
