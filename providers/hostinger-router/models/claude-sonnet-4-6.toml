# Hostinger Router relays chat/completions and /messages for Claude; reasoning params pass through unchanged.
# Toggle: reasoning = {"enabled": true|false} (supported_parameters: reasoning)
# Effort: reasoning_effort = "low"|"medium"|"high"|"max" (supported_parameters: reasoning_effort; matches lab and OpenRouter peer set, no xhigh on this generation)
# Source: https://router.hostinger.com/v1/models
base_model = "anthropic/claude-sonnet-4-6"
structured_output = true

[limit]
output = 128_000

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "max"]

[cost]
input = 3.6
output = 18
cache_read = 0.36
cache_write = 4.5
