# Pricing: catalog credit rates x 0.01 USD/credit, expressed per million tokens
# Source: https://router.hostinger.com/v1/models (public catalog: supported_parameters, pricing, limits)
# Toggle: reasoning = {"enabled": true|false} (catalog supported_parameters: reasoning)
# Effort: reasoning_effort = "low"|"medium"|"high"|"xhigh"|"max" (catalog: reasoning_effort)
# "none" lives in the toggle, not the ladder: effort=max burned all 8000 max_tokens on thinking
# while toggle off completed in 1652 (2026-10-22 probe), so off is a separate wire control here
schema = 2
base_model = "anthropic/claude-sonnet-5"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { supported = true, implicit = false, explicit = { ttl = ["5m", "1h"] } }

[cost.text.input]
price = 2.4
cache = { read = 0.24, write = { "5m" = 3, "1h" = 4.8 } }

[cost.text.output]
price = 12
