# Hostinger Router relays chat/completions and /messages for Claude; reasoning params pass through unchanged.
# Toggle: reasoning = {"enabled": true|false} (supported_parameters: reasoning)
# Effort: reasoning_effort = "low"|"medium"|"high"|"xhigh"|"max" (supported_parameters: reasoning_effort)
# Source: https://router.hostinger.com/v1/models
base_model = "anthropic/claude-sonnet-5"
structured_output = true

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh", "max"]

[cost]
input = 2.4
output = 12
cache_read = 0.24
cache_write = 3
