# https://commandcode.ai/models/step-3-7-flash
# Effort: reasoning_effort (Chat) / output_config.effort (Messages) = low|medium|high
base_model = "stepfun/step-3.7-flash"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[interleaved]
field = "reasoning_content"

[cost]
cache_read = 0.04
input = 0.2
output = 1.15
