# Pricing & Limits: https://commandcode.ai/docs/resources/pricing-limits#flint-free
# Same model as providers/opencode/models/flint-40b-free.toml: the free route for recursive/flint,
#   which the live catalog serves as recursive/flint-v1.0 at 262_144 tokens of context.
# Reasoning: always on. No live probe was run (no Command Code key was available), so no graded
#   levels are claimed even though other hosts of the same model publish them: this host rejects
#   reasoning_effort = none/minimal (see provider.toml), and its sibling entries (Ling 3.1 Flash,
#   LongCat 2.0, Qwen 3.6 Plus) all came back with no caller control exposed.
schema = 2
base_model = "recursive/flint"
name = "Flint (free)"

[capabilities]
reasoning = { supported = true }

[cost.text.input]
price = 0
cache = { read = 0 }

