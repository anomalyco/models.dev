# Source: https://commandcode.ai/docs/provider (accessed 2026-10-14)
# Model catalog + pricing: https://commandcode.ai/models and
# https://api.commandcode.ai/provider/v1/models
# Reasoning: First-party Moonshot publishes kimi-k2.7-code with no caller-facing reasoning
#   control; Highspeed is the same surface. The kimi-k2.6 sibling does have a toggle,
#   but 2.7-Code is a separate surface contract.
# Output ceiling: capped at the host context window (prompt plus completion).
schema = 2
base_model = "moonshotai/kimi-k2.7-code-highspeed"

[capabilities]
reasoning = { supported = true }
structured_output = true

[limit]
output = 262_000
context = 262_000

[cost.text.input]
price = 1.9
cache = { read = 0.38 }

[cost.text.output]
price = 8
