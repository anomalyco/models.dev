# Source: https://commandcode.ai/docs/provider (accessed 2026-10-20)
# Model catalog + pricing: https://commandcode.ai/models and
# https://api.commandcode.ai/provider/v1/models
# Effort: reasoning_effort = low|high|max
# No off: reasoning_effort = off is rejected by the upstream provider.
base_model = "moonshotai/kimi-k2.6"
reasoning_options = [{ type = "effort", values = ["low", "high", "max"] }]

[limit]
context = 256000

[cost]
input = 0.95
output = 4
cache_read = 0.16
