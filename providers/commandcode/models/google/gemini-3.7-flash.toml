# https://commandcode.ai/models/gemini-3-7-flash
# CommandCode bills cache writes only on this Gemini Flash model; the host's
# sibling Flash pages publish no cache-write rate, so the other entries omit it.
base_model = "google/gemini-3.7-flash"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
cache_read = 0.15
cache_write = 0.08334
input = 1.5
output = 7.5
