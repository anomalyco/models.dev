# Source: https://commandcode.ai/docs/provider (accessed 2026-10-29)
# Live catalog: https://api.commandcode.ai/provider/v1/models
# Pricing: https://commandcode.ai/models and https://commandcode.ai/docs/resources/pricing-limits
# Reasoning: the four levels the base model and its peers publish; lab default is xhigh.
#   Live 2026-10-29: low and xhigh both accepted (reasoning tokens 130 vs 509).
schema = 2
base_model = "meta/muse-spark-open"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }

[cost.text.input]
price = 1.25
cache = { read = 0.15 }

[cost.text.output]
price = 4.25
