# Source: https://commandcode.ai/docs/provider (accessed 2026-10-14)
# Model catalog + pricing: https://commandcode.ai/models and
# https://api.commandcode.ai/provider/v1/models
# Reasoning controls follow the native/established-peer thinking-only baseline.
# Baseline: providers/minimax/models/MiniMax-M2.5.toml and
# providers/alibaba-token-plan/models/MiniMax-M2.5.toml
schema = 2
base_model = "minimax/MiniMax-M2.5"

[capabilities]
reasoning = { supported = true }

[limit]
context = 200_000

[cost.text.input]
price = 0.3
cache = { read = 0.03 }

[cost.text.output]
price = 1.2
