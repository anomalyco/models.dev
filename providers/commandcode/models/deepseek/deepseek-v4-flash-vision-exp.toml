# Source: https://commandcode.ai/docs/provider (accessed 2026-10-14)
# Model catalog + pricing: https://commandcode.ai/models and
# https://api.commandcode.ai/provider/v1/models
# Pricing: off-peak base rates; peak 01:00-04:00 and 06:00-10:00 UTC Mon-Fri is 2x (cost.multipliers).
#   https://commandcode.ai/docs/resources/pricing-limits (accessed 2026-10-21): "Off-peak rate shown (17h/day) ·
#   peak $0.30 / $1.20 · 01–04 & 06–10 UTC, Mon–Fri (7h/day)". Peak cache-read rate is not listed; the factor follows
#   the "2x" rule and DeepSeek first-party (providers/deepseek), which doubles every rate at peak.
# Toggle: reasoning_effort = off|low (verified off yields zero reasoning tokens)
schema = 2
base_model = "deepseek/deepseek-v4-flash-vision-exp"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true

[cost.text.input]
price = 0.15
cache = { read = 0.003 }

[cost.text.output]
price = 0.6

[[cost.multipliers]]
when = { utc_days = { in = ["mon", "tue", "wed", "thu", "fri"] }, any = [{ all = [{ utc_hours = { gte = "01:00" } }, { utc_hours = { lt = "04:00" } }] }, { all = [{ utc_hours = { gte = "06:00" } }, { utc_hours = { lt = "10:00" } }] }] }
factor = 2
