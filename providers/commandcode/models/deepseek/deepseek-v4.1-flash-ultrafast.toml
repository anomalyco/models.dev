# The accelerated V4.1 Flash endpoint. The host lists a flat rate for it, with no off-peak note,
#   so it carries no peak multiplier.
# Reasoning follows the same model on this host (deepseek-v4.1-flash): toggle through
#   reasoning_effort = off, graded low|high|max.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"
name = "DeepSeek V4.1 Flash Ultrafast"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
context = 1_048_576

[cost.text.input]
price = 2.4
cache = { read = 0.048 }

[cost.text.output]
price = 9.6
