# Source: https://commandcode.ai/docs/provider (accessed 2026-10-20)
# Model catalog + pricing: https://commandcode.ai/models and
# https://api.commandcode.ai/provider/v1/models
# No caller control: reasoning is emitted inline in `content` with `reasoning_tokens = 0`; omitted, `low`, and `thinking.type = disabled|enabled` all returned step-by-step answers; `off` is rejected.
base_model = "zhipuai/glm-5"
reasoning_options = []

[limit]
context = 200000

[cost]
input = 1
output = 3.2
cache_read = 0.2
