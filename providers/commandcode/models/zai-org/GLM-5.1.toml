# Source: https://commandcode.ai/docs/provider (accessed 2026-11-15)
# Live catalog: https://api.commandcode.ai/provider/v1/models
# Pricing: https://commandcode.ai/models and https://commandcode.ai/docs/resources/pricing-limits
# Reasoning: always on, no caller control. The lab's control is a thinking toggle, and this host
#   publishes no graded levels for GLM-5.1: the reasoning_effort mapping starts at GLM-5.2
#   (high|max), and the same-generation GLM-5 entry here was probed as always on (off rejected,
#   thinking.type a no-op, graded values indistinguishable). none/minimal are rejected host-wide
#   (provider.toml).
# Limit: the 200_000 context is the host's live catalog context_length.
schema = 2
base_model = "zhipuai/glm-5.1"

[capabilities]
reasoning = { supported = true }
structured_output = true

[cost.text.input]
price = 1.4
cache = { read = 0.26 }

[cost.text.output]
price = 4.4
