# Source: https://commandcode.ai/docs/provider (accessed 2026-10-29)
# Live catalog: https://api.commandcode.ai/provider/v1/models
# Pricing: https://commandcode.ai/models and https://commandcode.ai/docs/resources/pricing-limits
# Reasoning: always on. Qwen3.7 Plus reasons with reasoning_effort omitted (273 reasoning
#   tokens) and rejects reasoning_effort = off. enable_thinking = false still reasons (214)
#   and thinking_budget = 32 is ignored (248), so there is no caller control this host
#   exposes.
schema = 2
base_model = "alibaba/qwen3.7-plus"

[capabilities]
reasoning = { supported = true }

[cost.text.input]
price = 0.4
cache = { read = 0.08 }

[cost.text.output]
price = 1.6
