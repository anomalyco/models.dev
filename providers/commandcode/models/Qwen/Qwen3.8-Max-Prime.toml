# Source: https://commandcode.ai/docs/provider (accessed 2026-10-29)
# Live catalog: https://api.commandcode.ai/provider/v1/models
# Pricing: https://commandcode.ai/models and https://commandcode.ai/docs/resources/pricing-limits
# Reasoning: always on. Qwen3.8 Max Prime reasons with reasoning_effort omitted (75
#   reasoning tokens) and rejects reasoning_effort = off. enable_thinking = false still
#   reasons (65) and thinking_budget = 32 is ignored (70), so there is no caller control
#   this host exposes.
schema = 2
base_model = "alibaba/qwen3.8-max-prime"

[capabilities]
reasoning = { supported = true }

[cost.text.input]
price = 4
cache = { read = 0.5 }

[cost.text.output]
price = 12
