# Source: https://commandcode.ai/docs/provider (accessed 2026-10-14)
# Model catalog + pricing: https://commandcode.ai/models and
# https://api.commandcode.ai/provider/v1/models
# Mid-conversation flags follow Anthropic's own API for this model: Command Code serves it via @ai-sdk/anthropic. See providers/anthropic/models/claude-opus-4-8.toml.
# tools.updates follows Anthropic's own Messages API, which this route proxies (live 2026-11-17 there: add, redefine and removal 3/3); not re-tested here (no key).
schema = 2
base_model = "anthropic/claude-opus-4-8"

[capabilities]
tools = { supported = true, updates = ["add", "remove", "replace"] }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
system_updates = true

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 5
cache = { read = 0.5, write = 6.25 }

[cost.text.output]
price = 25
