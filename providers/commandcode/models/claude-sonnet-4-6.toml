# Source: https://commandcode.ai/docs/provider (accessed 2026-10-14)
# Model catalog + pricing: https://commandcode.ai/models and
# https://api.commandcode.ai/provider/v1/models
base_model = "anthropic/claude-sonnet-4-6"

reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "max"] }, { type = "budget_tokens" }]

[cost]
input = 3
output = 15
cache_read = 0.3
cache_write = 3.75

[provider]
npm = "@ai-sdk/anthropic"
