#   HTTP 403 "The free Ling 3.1 Flash tier has been retired."
schema = 2
base_model = "inclusionai/ling-3.1-flash"
status = "deprecated"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[cost.text.input]
price = 0
