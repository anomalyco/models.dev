# Source: https://commandcode.ai/docs/provider (accessed 2026-10-14)
# Model catalog + pricing: https://commandcode.ai/models and
# https://api.commandcode.ai/provider/v1/models
# Output ceiling: capped at the host context window (prompt plus completion).
# Live /chat/completions (2026-10-14): reasoning_effort = minimal|none -> HTTP 400 invalid option.
schema = 2
base_model = "thinkingmachines/inkling"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "max"] }

[limit]
output = 256_000
context = 256_000

[cost.text.input]
price = 1
cache = { read = 0.17 }

[cost.text.output]
price = 4.05
