# https://commandcode.ai/models/inkling-small
# Effort: reasoning_effort = none|minimal|low|medium|high|max (off is effort=none)
base_model = "thinkingmachines/inkling-small"

[[reasoning_options]]
type = "effort"
values = ["none", "minimal", "low", "medium", "high", "max"]

[cost]
cache_read = 0.1
input = 0.5
output = 1.2
