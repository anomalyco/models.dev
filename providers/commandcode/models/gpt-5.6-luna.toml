# Live /chat/completions (2026-10-14): reasoning_effort = none -> HTTP 400 invalid option.
base_model = "openai/gpt-5.6-luna"
structured_output = true

reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 0.2
output = 1.2
cache_read = 0.02
cache_write = 0.25

[[cost.tiers]]
tier = { type = "context", size = 272000 }
input = 0.4
output = 1.8
cache_read = 0.04
cache_write = 0.5
