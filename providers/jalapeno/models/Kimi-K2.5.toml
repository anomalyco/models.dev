# Toggle: chat_template_kwargs.thinking true|false
# Pricing: Jalapeno Cloud USD per million tokens (marketplace / plugin catalog)
# Limits: GET https://api.jalapeno-cloud.ai/v1/models id=Kimi-K2.5 (2026-08-17)
# Prices: GET https://www.jalapeno-cloud.ai/token-api/v1/models/<modelId> priceRows (USD per 1M, 2026-10-21)
schema = 2
base_model = "moonshotai/kimi-k2.5"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
output = 180_224

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.6
cache = { read = 0.1 }

[cost.text.output]
price = 3
