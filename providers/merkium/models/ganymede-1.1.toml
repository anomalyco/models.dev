# Source: Merkium first-party API, https://chat.merkium.nl/api/v1/models (is_free = true),
# live-tested Oct 20, 2026.
# Reasoning: always on, no caller control. reasoning_content is returned on every request;
# reasoning=false, reasoning={enabled:false} and reasoning_effort are accepted but did not
# disable or grade it in live tests.
schema = 2
base_model = "merkium/ganymede-1.1"

[capabilities]
reasoning = { supported = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0

[cost.text.output]
price = 0











