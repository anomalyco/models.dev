# Served by M82 Router (https://m82router.com), an OpenAI-compatible, NPR-prepaid gateway.
# Source: https://m82router.com/api/documentation (read 2026-10-08). M82 publishes prices in NPR;
# USD below = NPR per million tokens / 162.099 (M82's fixed NPR/USD peg on that date).

# Beta limits: every reply is capped at 4,096 output tokens; text-only input (no image_url parts);
# JSON mode is not advertised as verified. Tool calls and streaming are verified.
# Reasoning: always on, returned as `reasoning_content`; no client toggle or effort control.
base_model = "deepseek/deepseek-v4-pro"
structured_output = false
status = "beta"
reasoning_options = []

[interleaved]
field = "reasoning_content"

[cost]
input = 1.32
output = 3.96
cache_read = 0.044

[limit]
context = 1_048_576
output = 4_096
