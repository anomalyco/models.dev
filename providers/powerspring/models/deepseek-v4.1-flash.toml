# Source: https://api.powerspring.eu/v1/models (accessed 2026-11-14): context_length 1048576,
# max_output_tokens 393216; images, tools, json_schema, reasoning, reasoning_off.
# Effort: reasoning_effort = none|low|high on Chat Completions. "none" turns thinking off.
# low|high follow the relay peers (providers/opencode-go/models/deepseek-v4.1-flash.toml,
# providers/requesty/models/deepseek-v4.1-flash.toml); "max" is left out because Powerspring
# rejects it with 400.
# Live check 2026-11-14 (Chat Completions, one short prompt): every listed level answered;
# reasoning text per level: none 0, low 197 chars, high 297 chars.
# Reasoning text: Chat Completions returns it in message.reasoning_content.
# Cache: automatic, billed at the cached input price (https://powerspring.eu/docs/billing).
# Prices: USD per million tokens, converted from Powerspring's EUR prices at the ECB reference
# rate of 2026-11-13 (1 EUR = 1.1052 USD).
# Lowest price shown; a request goes to the cheapest available server and can cost up to
# USD 0.696276 input / USD 2.088828 output per million tokens.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high"] }
cache = { implicit = true }
structured_output = true

[limit]
context = 1_048_576
output = 393_216

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.21120372
cache = { read = 0.0058023 }

[cost.text.output]
price = 0.63477162
