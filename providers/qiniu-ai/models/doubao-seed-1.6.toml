# Modalities: Qiniu's model square lists text, image and video input (the lab lists text only), so the generic kinds are kept.
# Toggle: thinking.type = enabled|disabled (Qiniu chat completions `thinking`, Anthropic/OpenAI style;
# Qiniu says model support varies). https://developer.qiniu.com/aitokenapi/13390/chat-completions
# Status: deprecated. Qiniu's model square lists retirement_at 2026-08-14 (retired).
# Prices: Qiniu model square (https://www.qiniu.com/ai/models, accessed 2026-10-21), CNY per 1K tokens
# converted at 6.9 CNY/USD (the rate behind the square's own USD figures), rounded to 8 decimals.
# Output-length band: inputs up to 32K with at most 200 output tokens cost less; v2 has no condition for it.
schema = 2
base_model = "bytedance-seed/seed-1-6"
name = "Doubao-Seed 1.6"
status = "deprecated"

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
output = 32_000

[cost.text.input]
price = 0.11594203

[[cost.text.input.overrides]]
when = { context = { gt = 32_000 } }
price = 0.17391304

[[cost.text.input.overrides]]
when = { context = { gt = 128_000 } }
price = 0.34782609

[cost.text.output]
price = 1.15942029

[[cost.text.output.overrides]]
when = { context = { gt = 32_000 } }
price = 2.31884058

[[cost.text.output.overrides]]
when = { context = { gt = 128_000 } }
price = 3.47826087
