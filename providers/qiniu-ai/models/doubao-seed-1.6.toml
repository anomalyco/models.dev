# Modalities: Qiniu's model square lists text, image and video input (the lab lists text only), so the generic kinds are kept.
schema = 2
base_model = "bytedance-seed/seed-1-6"
name = "Doubao-Seed 1.6"

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = false

[limit]
output = 32_000
