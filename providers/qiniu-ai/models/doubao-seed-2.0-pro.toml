# Toggle: thinking.type = enabled|disabled (Qiniu chat completions `thinking`, Anthropic/OpenAI style;
# Qiniu says model support varies). https://developer.qiniu.com/aitokenapi/13390/chat-completions
# Status: deprecated. Qiniu's model square lists retirement_at 2026-11-24 (scheduled for retirement).
# Prices: Qiniu model square (https://www.qiniu.com/ai/models, accessed 2026-10-21), CNY per 1K tokens
# converted at 6.9 CNY/USD (the rate behind the square's own USD figures), rounded to 8 decimals.
# Web search: 0.004 CNY per search on top of tokens; not expressible in v2.
schema = 2
base_model = "bytedance-seed/seed-2.0-pro"
name = "Doubao Seed 2.0 Pro"
status = "deprecated"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
temperature = true

[cost.text.input]
price = 0.46376812
cache = { read = 0.09275362 }

[[cost.text.input.overrides]]
when = { context = { gt = 32_000 } }
price = 0.69565217
cache = { read = 0.13913043 }

[[cost.text.input.overrides]]
when = { context = { gt = 128_000 } }
price = 1.39130435
cache = { read = 0.27826087 }

[cost.text.output]
price = 2.31884058

[[cost.text.output.overrides]]
when = { context = { gt = 32_000 } }
price = 3.47826087

[[cost.text.output.overrides]]
when = { context = { gt = 128_000 } }
price = 6.95652174
