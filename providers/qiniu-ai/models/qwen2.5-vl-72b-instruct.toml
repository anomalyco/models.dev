# Modalities: Qiniu's model square lists video input and the lab's header cites Model Studio video support (no MIME types yet),
# so the generic kind is kept. The square's audio input isn't in the model card and is left out.
# Status: deprecated. Qiniu's model square lists retirement_at 2026-06-02 (retired).
# Prices: Qiniu model square (https://www.qiniu.com/ai/models, accessed 2026-10-21), CNY per 1K tokens
# converted at 6.9 CNY/USD (the rate behind the square's own USD figures), rounded to 8 decimals.
schema = 2
base_model = "alibaba/qwen2-5-vl-72b-instruct"
name = "Qwen 2.5 VL 72B Instruct"
status = "deprecated"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic", "video"]
output = ["text"]

[capabilities]
structured_output = true

[limit]
context = 128_000

[cost.text.input]
price = 2.31884058

[cost.text.output]
price = 6.95652174
