# Status: deprecated. Absent from Qiniu's model square and GET /v1/models on 2026-10-21.
# Modalities: image and video formats from the Model Studio vision guide, Image limits and Video limits (https://www.alibabacloud.com/help/en/model-studio/vision).
# Audio stays generic: no audio format is documented for Qwen2.5-VL.
schema = 2
name = "Qwen 2.5 VL 7B Instruct"
description = "Qwen vision-language model for visual reasoning, documents, and agent tasks"
open_weights = false
release_date = "2025-08-05"
status = "deprecated"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic", "audio", "video/mp4", "video/x-msvideo", "video/x-matroska", "video/quicktime", "video/x-flv", "video/x-ms-wmv"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
structured_output = false
temperature = true

[limit]
context = 128_000
output = 8_192
