# Status: deprecated. Qiniu's model square lists retirement_at 2026-03-31 (retired).
# Prices: Qiniu model square (https://www.qiniu.com/ai/models, accessed 2026-10-21), CNY per 1K tokens
# converted at 6.9 CNY/USD (the rate behind the square's own USD figures), rounded to 8 decimals.
# Modalities: image formats from the Volcengine Ark image understanding, 图片格式说明 table (https://www.volcengine.com/docs/82379/1362931);
# video formats from the Volcengine Ark video understanding, 视频格式说明 table (https://www.volcengine.com/docs/82379/1895586).
schema = 2
name = "Doubao-Seed 1.6 Thinking"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"
open_weights = false
release_date = "2025-08-15"
status = "deprecated"

[modalities]
input = ["image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/tiff", "image/x-icon", "image/x-icns", "image/sgi", "image/jp2", "image/heic", "text", "video/mp4", "video/x-msvideo", "video/quicktime"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
structured_output = true
temperature = true

[limit]
context = 256_000
output = 32_000

