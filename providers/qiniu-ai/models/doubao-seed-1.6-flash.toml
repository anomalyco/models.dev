# Modalities: Qiniu's model square lists video input, which the lab has no MIME types for, so the generic kind is kept.
schema = 2
base_model = "bytedance-seed/seed-1-6-flash"
name = "Doubao-Seed 1.6 Flash"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/tiff", "image/x-icon", "image/x-icns", "image/sgi", "image/jp2", "image/heic", "video"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = false
