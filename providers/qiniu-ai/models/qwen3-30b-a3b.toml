# Toggle: thinking.type = enabled|disabled (Qiniu chat completions `thinking`, Anthropic/OpenAI style;
# Qiniu says model support varies). https://developer.qiniu.com/aitokenapi/13390/chat-completions
# Status: deprecated. Qiniu's model square lists retirement_at 2026-07-07 (retired).
# Prices: Qiniu model square (https://www.qiniu.com/ai/models, accessed 2026-10-21), CNY per 1K tokens
# converted at 6.9 CNY/USD (the rate behind the square's own USD figures), rounded to 8 decimals.
schema = 2
base_model = "alibaba/qwen3-30b-a3b"
status = "deprecated"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
context = 40_000
output = 4_096

[cost.text.input]
price = 0.10869565

[cost.text.output]
price = 0.43478261

[[cost.text.output.overrides]]
when = { thinking = { equals = true } }
price = 1.08695652
