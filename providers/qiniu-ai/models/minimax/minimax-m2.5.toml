# Prices: Qiniu model square (https://www.qiniu.com/ai/models, accessed 2026-10-21), CNY per 1K tokens
# converted at 6.9 CNY/USD (the rate behind the square's own USD figures), rounded to 8 decimals.
# Reasoning: always on. MiniMax accepts and ignores thinking.type = disabled (providers/minimax), so no toggle.
schema = 2
base_model = "minimax/MiniMax-M2.5"
name = "Minimax/Minimax-M2.5"

[capabilities]
reasoning = { supported = true }
structured_output = false

[limit]
output = 128_000

[cost.text.input]
price = 0.30434783

[cost.text.output]
price = 1.2173913
