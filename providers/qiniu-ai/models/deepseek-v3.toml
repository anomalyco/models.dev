# Status: deprecated. Qiniu's model square lists retirement_at 2026-10-09 (retired).
# Prices: Qiniu model square (https://www.qiniu.com/ai/models, accessed 2026-10-21), CNY per 1K tokens
# converted at 6.9 CNY/USD (the rate behind the square's own USD figures), rounded to 8 decimals.
# Batch inference: input 0.001 / output 0.004 CNY per 1K (Qiniu batch API); v2 has no batch condition, so only real-time prices are recorded.
schema = 2
base_model = "deepseek/deepseek-v3"
status = "deprecated"

[capabilities]
tools = { supported = true }
structured_output = false

[limit]
context = 128_000
output = 16_000

[cost.text.input]
price = 0.28985507

[cost.text.output]
price = 1.15942029
