# Reasoning HTTP format (accessed 2026-10-09):
# OpenAI Chat: reasoning.enabled = true|false, or reasoning_effort = "none" to
# disable. Effort: reasoning_effort or reasoning.effort = low|medium|high.
# OpenAI Responses: reasoning.effort; reasoning.summary returns a summary.
# Anthropic Messages: thinking.type = enabled|adaptive|disabled, or
# output_config.effort.
# https://openscale.so/docs
base_model = "deepseek/deepseek-v4.1-flash"
interleaved = { field = "reasoning_content" }

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high"]

[cost]
input = 0.06
output = 0.24
cache_read = 0.003

[limit]
context = 1_048_568
