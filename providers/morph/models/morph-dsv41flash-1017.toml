# Source: https://docs.morphllm.com/llms.txt and https://www.morphllm.com/api/models/json?prices=list (direct API list rates; accessed 2026-10-25).
# Live probes (api.morphllm.com, 2026-10-25): chat, tool_choice required, json_schema, /v1/messages and every reasoning_effort value below returned 200;
# reasoning arrives in reasoning_content (Chat Completions) and thinking blocks (Messages). max_tokens 500000 was accepted.
# Shares morph-dsv41flash's serving pool and list prices.
# Images (live 2026-10-25): PNG, JPEG, GIF, WebP, BMP and TIFF read; HEIC not read.
# Effort: Morph documents none|low|high|xhigh|max (medium maps to high, minimal to low; an integer 1-100 is also accepted). JSON mode disables reasoning.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 1_048_576
output = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.12
cache = { read = 0.008 }

[cost.text.output]
price = 0.8
