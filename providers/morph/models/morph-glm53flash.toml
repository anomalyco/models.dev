# Source: https://docs.morphllm.com/llms.txt and https://www.morphllm.com/api/models/json?prices=list (direct API list rates; accessed 2026-10-25).
# Live probes (api.morphllm.com, 2026-10-25): chat, tool_choice required, json_schema, /v1/messages and every reasoning_effort value below returned 200;
# reasoning arrives in reasoning_content (Chat Completions) and thinking blocks (Messages). max_tokens 500000 was accepted.
# Images (live 2026-10-25): PNG, JPEG, GIF, WebP, BMP and TIFF read; HEIC not read.
# Video: MP4 read live 2026-10-25 (video_url data URL). PDF is not served.
# Effort: every value listed was accepted live; Morph documents no per-level mapping.
# Standby: service_tier = "standby" is best-effort capacity billed at 50% of input, cached input and output (https://docs.morphllm.com/llms.txt#fast-models); a busy fleet returns 429 resource_unavailable.
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/gif", "image/webp", "image/bmp", "image/tiff", "video/mp4"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true }
service_tier = ["standby"]

[limit]
context = 1_048_576
output = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.2
cache = { read = 0.04 }

[cost.text.output]
price = 0.7

[[cost.multipliers]]
when = { service_tier = { equals = "standby" } }
factor = { text = 0.5 }
