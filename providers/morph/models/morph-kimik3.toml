# Source: https://docs.morphllm.com/llms.txt and https://www.morphllm.com/api/models/json?prices=list (direct API list rates; accessed 2026-10-25).
# Live probes (api.morphllm.com, 2026-10-25): chat, tool_choice required, json_schema, /v1/messages and every reasoning_effort value below returned 200;
# reasoning arrives in reasoning_content (Chat Completions) and thinking blocks (Messages). max_tokens 500000 was accepted.
# Images (live 2026-10-25): PNG, JPEG, GIF, WebP, BMP and TIFF read; HEIC not read.
# Video is not served (input_modalities text + image). reasoning_effort minimal returns 400.
# tools.updates is add only, on Chat Completions: a system message carrying `tools` and no `content` (https://docs.morphllm.com/sdk/components/dynamic-tool-loading); called live 2026-10-25.
# Standby: service_tier = "standby" is best-effort capacity billed at 50% of input, cached input and output (https://docs.morphllm.com/llms.txt#fast-models); a busy fleet returns 429 resource_unavailable.
schema = 2
base_model = "moonshotai/kimi-k3"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/gif", "image/webp", "image/bmp", "image/tiff"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true }
service_tier = ["standby"]

[limit]
output = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
capabilities = { tools = { updates = true } }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 2.5
cache = { read = 0.29 }

[cost.text.output]
price = 14

[[cost.multipliers]]
when = { service_tier = { equals = "standby" } }
factor = { text = 0.5 }
