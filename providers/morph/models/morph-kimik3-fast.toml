# Source: https://docs.morphllm.com/llms.txt and https://www.morphllm.com/api/models/json?prices=list (direct API list rates; accessed 2026-10-25).
# Live probes (api.morphllm.com, 2026-10-25): chat, tool_choice required, json_schema, /v1/messages and every reasoning_effort value below returned 200;
# reasoning arrives in reasoning_content (Chat Completions) and thinking blocks (Messages). max_tokens 500000 was accepted.
# Latency-tuned SKU of the same Kimi K3 weights.
# Images (live 2026-10-25): PNG, JPEG, GIF, WebP, BMP and TIFF read; HEIC not read.
# reasoning_effort minimal, xhigh and max return 400.
# tools.updates is add only, on Chat Completions: a system message carrying `tools` and no `content` (https://docs.morphllm.com/sdk/components/dynamic-tool-loading); called live 2026-10-25.
schema = 2
base_model = "moonshotai/kimi-k3"
name = "Kimi K3 Fast"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/gif", "image/webp", "image/bmp", "image/tiff"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[limit]
output = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
capabilities = { tools = { updates = true } }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 6
cache = { read = 0.6 }

[cost.text.output]
price = 22.5
