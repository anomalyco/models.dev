# Source: https://docs.morphllm.com/llms.txt and https://www.morphllm.com/api/models/json?prices=list (direct API list rates; accessed 2026-10-25).
# Live probes (api.morphllm.com, 2026-10-25): chat, tool_choice required, json_schema and /v1/messages return 200; reasoning arrives in
# reasoning_content (Chat Completions) and thinking blocks (Messages).
# Output limit: max_tokens shares the 1,048,576-token window; 1,048,577 returns 400 "Max tokens must not exceed 1048576".
# Off: reasoning_effort = none returned 0 reasoning tokens on every probe; thinking.type = disabled is ignored, so there is no toggle.
# Serves the DeepSeek-V4-Flash-0731 checkpoint (bf16).
# Effort: reasoning_effort = none|low|high|max, the native DeepSeek V4 levels plus none (off). Morph documents no xhigh for this model.
# Standby: service_tier = "standby" bills input, cached input and output at 50% (https://docs.morphllm.com/llms.txt#fast-models); a busy fleet returns 429 resource_unavailable.
schema = 2
base_model = "deepseek/deepseek-v4-flash-0731"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true
cache = { implicit = true }
service_tier = ["standby"]

[limit]
context = 1_048_576
output = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.141953125
cache = { read = 0.0359375 }

[cost.text.output]
price = 0.399625

[[cost.multipliers]]
when = { service_tier = { equals = "standby" } }
factor = { text = 0.5 }
