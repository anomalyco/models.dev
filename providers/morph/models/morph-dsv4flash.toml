# Source: https://docs.morphllm.com/llms.txt and https://www.morphllm.com/api/models/json?prices=list (direct API list rates; accessed 2026-10-25).
# Live probes (api.morphllm.com, 2026-10-25): chat, tool_choice required, json_schema, /v1/messages and every reasoning_effort value below returned 200;
# reasoning arrives in reasoning_content (Chat Completions) and thinking blocks (Messages). max_tokens 500000 was accepted.
# Serves the DeepSeek-V4-Flash-0731 checkpoint (bf16).
# Effort: Same controls as V4.1 Flash, all accepted live; Morph documents them as none|low|high|xhigh|max (medium maps to high, minimal to low; an integer 1-100 is also accepted). JSON mode disables reasoning.
# Standby: service_tier = "standby" is best-effort capacity billed at 50% of input, cached input and output (https://docs.morphllm.com/llms.txt#fast-models); a busy fleet returns 429 resource_unavailable.
schema = 2
base_model = "deepseek/deepseek-v4-flash-0731"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true }
service_tier = ["standby"]

[limit]
context = 1_048_576
output = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.141953125
cache = { read = 0.0359375 }

[cost.text.output]
price = 0.399625

[[cost.multipliers]]
when = { service_tier = { equals = "standby" } }
factor = { text = 0.5 }
