# Source: https://docs.morphllm.com/llms.txt and https://www.morphllm.com/api/models/json?prices=list (direct API list rates, 1,048,576 context
# and max output, cached input $0.29; accessed 2026-11-07).
# Effort: reasoning_effort = low|high|max, Kimi K3.1 Pro's native levels (always on:
# https://huggingface.co/moonshotai/Kimi-K3.1-Pro). Morph's docs list accepted values for Kimi K3 and K3 Fast only, so `none` is left out here.
# Messages: "Every Fast Model also serves Anthropic's Messages wire format" at POST /v1/messages (https://docs.morphllm.com/llms.txt).
# Input: the feed lists text and image only, like morph-kimik3, which rejects video; image formats follow morph-kimik3 (lab list minus HEIC/HEIF).
# Not carried over from morph-kimik3: the docs scope service_tier = "standby" and system-message dynamic tool loading to morph-kimik3.
schema = 2
base_model = "moonshotai/kimi-k3.1-pro"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[limit]
output = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 2.5
cache = { read = 0.29 }

[cost.text.output]
price = 14
