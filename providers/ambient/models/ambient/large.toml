# Mid-conversation: Ambient serves this model on POST /v1/chat/completions; reasoning and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://api.ambient.xyz/openapi.json
schema = 2
base_model = "zhipuai/glm-5.2"
name = "Ambient Large"
description = "Flagship GLM model for hybrid reasoning, coding, and agentic engineering"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["high", "max"] }
structured_output = true
effort_updates = false

[limit]
context = 202_752
output = 202_752

[cost.text.input]
price = 0.6
cache = { read = 0.15, write = 0 }

[cost.text.output]
price = 2
