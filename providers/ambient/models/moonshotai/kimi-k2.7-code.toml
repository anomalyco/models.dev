# Kimi K2.7 Code always reasons; disabling thinking is rejected and it exposes
# no effort or budget control. https://platform.kimi.ai/docs/guide/use-kimi-k2-thinking-model
# Mid-conversation: Ambient serves this model on POST /v1/chat/completions; reasoning and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://api.ambient.xyz/openapi.json
# Status: deprecated; no longer listed by GET https://api.ambient.xyz/v1/models (checked 2026-10-20).
schema = 2
base_model = "moonshotai/kimi-k2.7-code"
status = "deprecated"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
structured_output = true
temperature = true
effort_updates = false

[cost.text.input]
price = 0.69
cache = { read = 0.14, write = 0 }

[cost.text.output]
price = 3.49
