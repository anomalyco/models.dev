# Ambient documents no toggle, effort, or budget field for this model; reasoning
# output does not itself establish a control. https://docs.ambient.xyz
schema = 2
base_model = "moonshotai/kimi-k2.6"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.95
cache = { read = 0.2, write = 0 }

[cost.text.output]
price = 4
