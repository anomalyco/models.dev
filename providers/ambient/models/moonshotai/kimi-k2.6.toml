# Ambient documents no toggle, effort, or budget field for this model; reasoning
# output does not itself establish a control. https://docs.ambient.xyz
# Mid-conversation: Ambient serves this model on POST /v1/chat/completions; reasoning and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://api.ambient.xyz/openapi.json
# Input MIME types: the lab's image list; Ambient's catalog reports image input without formats (https://api.ambient.xyz/v1/models).
# Status: deprecated; no longer listed by GET https://api.ambient.xyz/v1/models (checked 2026-10-20).
schema = 2
base_model = "moonshotai/kimi-k2.6"
status = "deprecated"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
structured_output = true
effort_updates = false

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.95
cache = { read = 0.2, write = 0 }

[cost.text.output]
price = 4
