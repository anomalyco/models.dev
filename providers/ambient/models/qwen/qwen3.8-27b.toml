# Toggle: reasoning.enabled = true|false
# Effort: reasoning.effort = low|medium|xhigh
# Ambient request schema: https://api.ambient.xyz/openapi.json
# Model controls: https://openrouter.ai/api/v1/models (qwen/qwen3.8-27b)
base_model = "alibaba/qwen3.8-27b"
description = "Qwen vision-language model for visual reasoning, documents, and agent tasks"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "xhigh"]

[cost]
input = 0.32
output = 3.2
cache_read = 0.16
cache_write = 0

[limit]
context = 32_768
output = 8_192

[modalities]
input = ["text", "image"]
