# Prices and limits: https://api.sparrowcodes.com/v1/models (accessed 2026-11-11)
# Served on OpenAI-compatible Chat Completions; reasoning_effort accepts low, medium and high.
schema = 2
base_model = "openai/gpt-6-luna"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[api.chat-completions]

[cost.text.input]
price = 0.1
cache = { read = 0.01 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 0.2

[cost.text.output]
price = 0.5

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 0.75
