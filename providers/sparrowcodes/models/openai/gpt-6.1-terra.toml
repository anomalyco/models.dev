# Source: https://api.sparrowcodes.com/v1/models (accessed 2026-11-11): pricing_usd, context_length,
# max_output_tokens and input_modalities. Served on Chat Completions only.
# Gateway validation: reasoning_effort must be minimal, low, medium or high (anything else, e.g. max or none, is a 400).
# reasoning_effort is sent as Responses reasoning.effort.
# freeform: not supported here. The gateway converts only `function` tools for the Responses upstream and
# drops custom tools (internal/gateway/provider_responses.go), so no grammar formats are listed.
# Modalities: input_modalities lists text only for this model on this host.
schema = 2
base_model = "openai/gpt-6.1-terra"

[modalities]
input = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[api.chat-completions]

[cost.text.input]
price = 1
cache = { read = 0.05 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 2

[cost.text.output]
price = 5

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 7.5
