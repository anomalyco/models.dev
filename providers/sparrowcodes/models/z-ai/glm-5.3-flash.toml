# Source: https://api.sparrowcodes.com/v1/models (accessed 2026-11-11): pricing_usd, context_length,
# max_output_tokens and input_modalities. Served on Chat Completions only.
# Gateway validation: reasoning_effort must be minimal, low, medium or high (anything else, e.g. max or none, is a 400).
# reasoning_effort is forwarded unchanged; low/high are the values both this gateway and the model accept.
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "high"] }

[limit]
context = 1_048_576

[api.chat-completions]

[cost.text.input]
price = 0.0399
cache = { read = 0.03 }

[cost.text.output]
price = 0.0784
