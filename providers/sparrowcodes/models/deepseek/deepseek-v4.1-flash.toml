# Prices and limits: https://api.sparrowcodes.com/v1/models (accessed 2026-11-11)
# Served on OpenAI-compatible Chat Completions; reasoning_effort accepts low, medium and high.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "high"] }

[limit]
context = 1_048_576
output = 131_072

[api.chat-completions]

[cost.text.input]
price = 0.15
cache = { read = 0.005 }

[cost.text.output]
price = 0.6
