# Prices and limits: https://api.sparrowcodes.com/v1/models (accessed 2026-11-11)
# Served on OpenAI-compatible Chat Completions; reasoning_effort accepts low, medium and high.
schema = 2
base_model = "alibaba/qwen3.7-plus"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[limit]
output = 65_536

[api.chat-completions]

[cost.text.input]
price = 0.32
cache = { read = 0.064 }

[cost.text.output]
price = 1.28
