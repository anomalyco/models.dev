# Source: https://api.sparrowcodes.com/v1/models (accessed 2026-11-11): pricing_usd, context_length,
# max_output_tokens and input_modalities. Served on Chat Completions only.
# Gateway validation: reasoning_effort must be minimal, low, medium or high (anything else, e.g. max or none, is a 400).
# Reasoning controls: upstream exposes an on/off switch (enable_thinking) and a thinking budget (thinking_budget).
# This gateway's documented surface exposes neither: its only reasoning parameter is reasoning_effort, it has no
# off value, and it does not document any graded effect of reasoning_effort on this model, so no control is listed.
# Modalities: input_modalities lists text only for this model on this host.
# Cache: upstream prompt caching is automatic (no markers); cache reads are reported in
# usage.prompt_tokens_details.cached_tokens and billed at the cache read price below.
schema = 2
base_model = "alibaba/qwen3.7-plus"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
cache = { implicit = true }
reasoning = { supported = true }

[limit]
output = 65_536

[api.chat-completions]

[cost.text.input]
price = 0.32
cache = { read = 0.064 }

[cost.text.output]
price = 1.28
