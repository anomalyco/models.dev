# Source: https://api.sparrowcodes.com/v1/models (accessed 2026-11-11): pricing_usd, context_length,
# max_output_tokens and input_modalities. Served on Chat Completions only.
# Gateway validation: reasoning_effort must be minimal, low, medium or high (anything else, e.g. max or none, is a 400).
# reasoning_effort is forwarded, but this model only has on/off thinking upstream and the gateway has no
# off value, so no caller control is listed.
# Modalities: input_modalities lists text only for this model on this host.
schema = 2
base_model = "alibaba/qwen3.7-flash"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true }

[limit]
output = 65_536

[api.chat-completions]

[cost.text.input]
price = 0.035
cache = { read = 0.007 }

[cost.text.output]
price = 0.15
