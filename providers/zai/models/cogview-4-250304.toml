# Sources (accessed 2026-11-25):
# - Pricing: https://docs.z.ai/guides/overview/pricing ($0.01 per image)
# - Model: https://docs.z.ai/guides/image/cogview-4
# - API: https://docs.z.ai/api-reference/image/generate-image
# Model code is cogview-4-250304 (https://docs.bigmodel.cn/api-reference/模型-api/图像生成). Live 2026-11-25 on api.z.ai:
# cogview-4-250304 returns an image URL; plain cogview-4 returns 1211 "Unknown Model".
schema = 2
v2_only = true
base_model = "zhipuai/cogview-4"

[api.images]
sdk = { opencodeai = "@opencode/ai/providers/zai/images" }

[cost.image.output]
unit = "image"
price = 0.01
