# Sources (accessed 2026-10-19):
# - Pricing (USD): https://docs.z.ai/guides/overview/pricing
# - Model: https://docs.z.ai/guides/vlm/glm-5.3-flash
# - Thinking: https://docs.z.ai/guides/capabilities/thinking-mode, https://docs.z.ai/guides/capabilities/thinking
# - Caching (automatic, no write price): https://docs.z.ai/guides/capabilities/cache
# - Chat API (temperature and top_p, no top_k; images jpg/png; video mp4/mkv/mov): https://docs.z.ai/api-reference/llm/chat-completion
# Effort: reasoning_effort = low|high|max (default max); thinking.type only accepts enabled
# Mid-conversation (checked live 2026-10-19 on api.z.ai and open.bigmodel.cn): a late system message
# is accepted and keeps the cache; adding or removing tools between turns drops it.
# Changing reasoning_effort between turns also drops the cache.
schema = 2
base_model = "zhipuai/glm-5.3-flash"
name = "GLM-5.3-FlashX"
description = "High-speed GLM-5.3-Flash serving option for coding and agent workflows"
release_date = "2026-09-18"

[modalities]
input = ["text", "image/jpeg", "image/png", "video/mp4", "video/quicktime", "video/x-matroska", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, default = { type = "effort", value = "max" }, effort = ["low", "high", "max"] }
structured_output = true
top_k = false
system_updates = true
effort_updates = false
cache = { supported = true, implicit = true, explicit = false }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.37
cache = { read = 0.075, write = 0 }

[cost.text.output]
price = 1.25
