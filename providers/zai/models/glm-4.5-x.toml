# Sources (accessed 2026-10-19):
# - Pricing (USD): https://docs.z.ai/guides/overview/pricing
# - Model: https://docs.z.ai/guides/llm/glm-4.5
# - Thinking: https://docs.z.ai/guides/capabilities/thinking-mode, https://docs.z.ai/guides/capabilities/thinking
# - Caching (automatic, no write price): https://docs.z.ai/guides/capabilities/cache
# - Chat API (temperature and top_p, no top_k; images jpg/png; video mp4/mkv/mov): https://docs.z.ai/api-reference/llm/chat-completion
# Toggle: thinking.type = enabled|disabled (default enabled)
# Mid-conversation (checked live 2026-10-19 on api.z.ai and open.bigmodel.cn): a late system message
# is accepted and keeps the cache; adding or removing tools between turns drops it.
schema = 2
v2_only = true
base_model = "zhipuai/glm-4.5"
name = "GLM-4.5-X"
description = "High-speed GLM-4.5 serving option for latency-sensitive reasoning, coding, and agent workflows"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, default = { type = "toggle", value = true }, toggle = true }
top_k = false
system_updates = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.messages]
base_url = "https://api.z.ai/api/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/zai-coding-plan/messages" }

[api.responses]
base_url = "https://api.z.ai/api/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/zai-coding-plan/responses" }

[cost.text.input]
price = 2.2
cache = { read = 0.45, write = 0 }

[cost.text.output]
price = 8.9
