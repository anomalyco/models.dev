schema = 2
name = "GLM-5V-Turbo"
description = "Fast GLM vision model for screenshots, documents, and multimodal agent tasks"
family = "glm"
open_weights = false
release_date = "2026-04-01"

[modalities]
input = ["text", "image", "video", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true }
temperature = true

[limit]
context = 200_000
output = 131_072

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.2
cache = { read = 0.24, write = 0 }

[cost.text.output]
price = 4
