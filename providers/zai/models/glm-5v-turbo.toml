# Sources (accessed 2026-10-19):
# - Pricing (USD): https://docs.z.ai/guides/overview/pricing
# - Model: https://docs.z.ai/guides/vlm/glm-5v-turbo
# - Thinking: https://docs.z.ai/guides/capabilities/thinking-mode, https://docs.z.ai/guides/capabilities/thinking
# - Caching (automatic, no write price): https://docs.z.ai/guides/capabilities/cache
# - Chat API (temperature and top_p, no top_k; images jpg/png; video mp4/mkv/mov): https://docs.z.ai/api-reference/llm/chat-completion
# Not on the current pricing page; price kept from the previous catalog entry.
# Toggle: thinking.type = enabled|disabled (default enabled)
# Mid-conversation (live 2026-10-23 on api.z.ai and open.bigmodel.cn, ~7k-token first user message):
# a late system message is followed and keeps the cache in place (~7.5k cached, same as the control).
# effort_updates: left out. Flipping thinking.type on the next request keeps the cache (reasoning tokens
# ~100 vs 0), but there's no in-history effort message, so it doesn't count.
# Adding or removing tools between turns drops the cache (2026-10-19).
# Per-API flags: system_updates sits on [api.chat-completions] only. The late system message was checked on Chat Completions (live 2026-10-23); the Anthropic-compatible Messages and Responses endpoints have no documented or tested in-place system message.
schema = 2
base_model = "zhipuai/glm-5v-turbo"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, default = { type = "toggle", value = true }, toggle = true }
top_k = false
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
capabilities = { system_updates = true }

[api.messages]
base_url = "https://api.z.ai/api/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/zai-coding-plan/messages" }

[api.responses]
base_url = "https://api.z.ai/api/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/zai-coding-plan/responses" }

[cost.text.input]
price = 1.2
cache = { read = 0.24, write = 0 }

[cost.text.output]
price = 4
