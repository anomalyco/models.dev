# Cached input: https://docs.z.ai/guides/overview/pricing (accessed 2026-10-17).
# GLM-4.5V cached input is $0.11 per 1M tokens.
schema = 2
name = "GLM-4.5V"
description = "GLM vision model for visual reasoning, documents, and multimodal agents"
family = "glm"
open_weights = true
knowledge = "2025-04"
release_date = "2025-08-11"

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true }
temperature = true

[limit]
context = 64_000
output = 16_384

[cost.text.input]
price = 0.6
cache = { read = 0.11 }

[cost.text.output]
price = 1.8
