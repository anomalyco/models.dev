# Cached input: https://docs.z.ai/guides/overview/pricing (accessed 2026-10-17).
# GLM-4.6V cached input is $0.05 per 1M tokens.
schema = 2
name = "GLM-4.6V"
description = "GLM vision model for visual reasoning, documents, and multimodal agents"
family = "glm"
open_weights = true
knowledge = "2025-04"
release_date = "2025-12-08"

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true }
temperature = true

[limit]
context = 128_000
output = 32_768

[cost.text.input]
price = 0.3
cache = { read = 0.05 }

[cost.text.output]
price = 0.9
