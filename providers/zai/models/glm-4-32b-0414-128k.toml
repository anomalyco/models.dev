# Sources (accessed 2026-11-25):
# - Pricing (USD, $0.1/MTok input and output, no cached-input price): https://docs.z.ai/guides/overview/pricing
# - Model: https://docs.z.ai/guides/llm/glm-4-32b-0414-128k
# - Chat API (temperature and top_p, no top_k): https://docs.z.ai/api-reference/llm/chat-completion
# Live 2026-11-25 on api.z.ai: Chat Completions, Messages (/api/anthropic/v1) and Responses (/api/v1) all answer;
# tool calls and response_format json_object work; a repeated ~3k-token prompt reports no cached tokens, so cache = false.
# Tools: tool_choice supports only auto on Chat Completions (https://docs.z.ai/api-reference/llm/chat-completion,
#   https://docs.z.ai/guides/capabilities/function-calling) and none|auto on Responses, which takes the BigModel Response
#   API format (https://docs.bigmodel.cn/cn/guide/develop/responses/introduction), so [api.responses] adds none. Messages
#   documents no tool_choice. No strict tool mode.
schema = 2
base_model = "zhipuai/glm-4-32b-0414-128k"

[capabilities]
tools = { supported = true, choice = ["auto"] }
structured_output = true
top_k = false
cache = false

[api.chat-completions]
compatibility = { max_tokens_field = "max_tokens" }

[api.messages]
base_url = "https://api.z.ai/api/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/zai-coding-plan/messages" }

[api.responses]
base_url = "https://api.z.ai/api/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/zai-coding-plan/responses" }
capabilities = { tools = { choice = ["auto", "none"] } }

[cost.text.input]
price = 0.1

[cost.text.output]
price = 0.1
