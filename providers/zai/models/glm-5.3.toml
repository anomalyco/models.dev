base_model = "zhipuai/glm-5.3"
# GLM-5.3 always reasons (thinking cannot be disabled); effort levels
# low|high|max with default max.
# https://docs.z.ai/guides/llm/glm-5.3

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 1.4
output = 4.4
cache_read = 0.26
cache_write = 0
