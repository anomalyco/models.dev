# GLM-5.3-Flash reasons by default; effort levels low|high|max, and thinking can
# be suppressed with {"thinking": {"type": "disabled"}}.
# https://z.ai/blog/glm-5.3-flash
# Pricing: https://docs.z.ai/guides/overview/pricing (accessed 2026-09-19)
# Served by https://api.z.ai/api/paas/v4 (verified against GET /models 2026-08-26).
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.15
cache = { read = 0.03, write = 0 }

[cost.text.output]
price = 0.5
