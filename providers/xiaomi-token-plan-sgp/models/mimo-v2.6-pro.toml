# Wire-tested on SGP: reasoning_effort = none|low|medium|high.
# none disables thinking; distinct low/medium/high depth is not established.
# thinking.type = enabled|disabled is also accepted.
# Source: https://mimo.mi.com/docs/en-US/tokenplan/Token%20Plan/quick-access
base_model = "xiaomi/mimo-v2.6-pro"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high"] }]

[interleaved]
field = "reasoning_content"

[cost]
input = 0
output = 0
cache_read = 0
