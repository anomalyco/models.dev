# Source: Intility AI model catalog (provided by Intility, 2026-11-19): id glm-5-3, "GLM-5.3 744B",
#   contextLength 400000, input text only, endpoint v1/chat/completions.
#   Docs: https://build.intility.com/docs/external/inference/get-started/
# Prices are listed in NOK per 1M tokens (input 20, cached input 5, output 75), converted to USD at
#   1 USD = 9.2978 NOK (mid-market, 2026-11-02, https://currencybeacon.com/rates/USD/NOK).
# Cache: a cached-input price is published but the mechanism isn't documented, so implicit.
# Effort: reasoning_effort = low|high|max (default max). Served on vLLM with the stock GLM-5.3 chat template,
#   which maps low and high and treats any other value as Max: https://huggingface.co/zai-org/GLM-5.3/blob/main/chat_template.jinja
# Reasoning comes back in delta.reasoning (checked live on POST /v1/chat/completions, 2026-11-19). reasoning_field = "reasoning"
#   is valid in v2, but v1's interleaved.field only allows reasoning_content|reasoning_details, so it is left unset rather than wrong.
schema = 2
base_model = "zhipuai/glm-5.3"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "max" }, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 400_000

[cost.text.input]
price = 2.15
cache = { read = 0.54 }

[cost.text.output]
price = 8.07
