schema = 2
name = "SolCard Inference Base"
description = "General-purpose abliterated model with zero data retention"
open_weights = false
release_date = "2026-10-26"
last_updated = "2026-11-01"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
temperature = true

[limit]
context = 150_000
input = 150_000
output = 8_192

[cost.text.input]
price = 1.25
cache = { read = 0.125 }

[cost.text.output]
price = 3.75
