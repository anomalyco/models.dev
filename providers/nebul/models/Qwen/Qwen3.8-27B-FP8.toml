# Effort: reasoning_effort (Nebul docs: accepted for reasoning-capable models, ignored
# only by non-reasoning models). Set is OpenRouter's low|medium|xhigh intersected with
# Nebul's documented value set; Nebul has no toggle and xhigh is undocumented on it.
# https://docs.nebul.io/docs/inference-api/advanced-topics/reasoning
base_model = "alibaba/qwen3.8-27b"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["low", "medium"]

[cost]
input = 0.21
output = 0.74
cache_read = 0.05
