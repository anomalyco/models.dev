# Effort: reasoning_effort = none|low|medium|high|max. Thinking is ON by default,
# and none turns it off. Live probes on 2026-09-23 returned 200 OK for every
# listed level. The set matches the same-surface peer baseline, because minimal
# and xhigh showed no distinct effect. The catalog reports supports_reasoning =
# false for this ID, and that is a false negative. Traces arrive in
# reasoning_content. The context and costs match the Nebul API on 2026-09-23.
base_model = "nvidia/nemotron-3-super-120b-a12b"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "max"]

[cost]
input = 0.32
output = 0.69
cache_read = 0.08

[limit]
context = 1_000_000
