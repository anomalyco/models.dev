# Efforts mirror Nebul's documented host-wide reasoning_effort enum (its docs
# note the effort-to-budget mapping is model-specific guidance):
# https://docs.nebul.io/docs/inference-api/advanced-topics/reasoning. Same-surface
# peers expose a toggle only, with no effort values to intersect.
base_model = "nvidia/nemotron-3-super-120b-a12b"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "max"]

[cost]
input = 0.32
output = 0.69
cache_read = 0.08

[limit]
context = 1_000_000
