# Hybrid reasoning; Nebul exposes no caller control for it (its docs cover
# reasoning_effort only): https://docs.nebul.io/docs/inference-api/advanced-topics/reasoning
base_model = "nvidia/nemotron-3-super-120b-a12b"

reasoning_options = []

[interleaved]
field = "reasoning_content"

[cost]
input = 0.32
output = 0.69
cache_read = 0.08

[limit]
context = 1_000_000
