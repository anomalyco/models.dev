# Effort: reasoning_effort = none|low|medium|high|max. Thinking is ON by default,
# and none turns it off. Live probes on 2026-09-23 returned 200 OK for every
# listed level. The set matches the same-surface peer baseline, because minimal
# and xhigh showed no distinct effect. The catalog reports supports_reasoning =
# false for this ID, and that is a false negative. Traces arrive in
# reasoning_content. Cache: the catalog bills cached input tokens and documents
# no explicit cache-control markers, so prompt caching is implicit.
# The context and costs match the Nebul API on 2026-09-23.
schema = 2
base_model = "nvidia/nemotron-3-super-120b-a12b"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"] }
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[limit]
context = 1_000_000

[cost.text.input]
price = 0.32
cache = { read = 0.08 }

[cost.text.output]
price = 0.69
