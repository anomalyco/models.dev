# The costs match https://api.inference.nebul.io/v1/model/info on 2026-09-23.
# Cache: the catalog bills cached input tokens and documents no explicit
# cache-control markers, so prompt caching is implicit.
schema = 2
base_model = "mistral/mistral-large-2512"

[capabilities]
cache = { implicit = true }

[cost.text.input]
price = 0.6
cache = { read = 0.15 }

[cost.text.output]
price = 1.73
