# Model reasons always-on; /model/info advertises no reasoning_efforts for it and
# Nebul's docs cover reasoning_effort only: https://docs.nebul.io/docs/inference-api/advanced-topics/reasoning
base_model = "meta/muse-glimmer-30b"

reasoning_options = []

[interleaved]
field = "reasoning_content"

[cost]
input = 0.7
output = 3.5
cache_read = 0.35
