# Reasoning control per Nebul's docs: GET /v1/model/info `reasoning_efforts` is the
# per-model source of truth for "the reasoning_effort values each model meaningfully
# accepts" (https://docs.nebul.io/docs/inference-api/models/model-catalog). It
# advertises an empty list for this model, and the Chat Completions API documents no
# on/off toggle (https://docs.nebul.io/docs/inference-api/models/chat-completions),
# so this host exposes no caller control here.
# Traces arrive in message.reasoning (Nebul docs), so interleaved = true
base_model = "zhipuai/glm-5.3"
reasoning_options = []

interleaved = true

[cost]
input = 1.47
output = 4.62
cache_read = 0.35

[limit]
context = 1_048_576
