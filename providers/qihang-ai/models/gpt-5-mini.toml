# knowledge: unsourced host value kept from the v1 file so v1 doesn't change.
schema = 2
base_model = "openai/gpt-5-mini"
base_model_omit = ["limit.input"]
name = "GPT-5-Mini"
description = "Compact GPT model for low-latency assistance and high-volume workloads"
knowledge = "2024-09-30"

[capabilities]
reasoning = { supported = true }

[limit]
context = 200_000
output = 64_000

[cost.text.input]
price = 0.04

[cost.text.output]
price = 0.29
