# knowledge: unsourced host value kept from the v1 file so v1 doesn't change.
schema = 2
base_model = "google/gemini-3-pro-preview"
description = "Advanced Gemini model for complex reasoning, coding, and multimodal analysis"
knowledge = "2025-11"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "audio/wav", "audio/mp3", "audio/aiff", "audio/aac", "audio/ogg", "audio/flac", "audio/mpeg", "audio/m4a", "audio/l16", "audio/opus", "audio/alaw", "audio/mulaw", "audio/webm", "video/mp4", "video/mpeg", "video/mov", "video/avi", "video/x-flv", "video/mpg", "video/webm", "video/wmv", "video/3gpp"]
output = ["text"]

[capabilities]
reasoning = { supported = true }

[limit]
context = 1_000_000
output = 65_000

[cost.text.input]
price = 0.57

[cost.text.output]
price = 3.43
