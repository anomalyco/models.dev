# Sources (accessed 2026-11-27):
# - Model ID, price and context: GET https://api.levanto.ai/v1/models (needs a key; the
#   `levanto.ai` block of each entry has `pricing` in USD per 1M tokens and `context_tokens`).
#   The same prices are on the Models page of https://platform.levanto.ai.
# - Structured output and tools work as in the OpenAI API: https://docs.levanto.ai/llms/advanced
#   and https://docs.levanto.ai/integrations/langchain.
# - Cache: implicit; usage reports prompt_tokens_details.cached_tokens and cached input is billed at
#   the cache read price. A conversation stays on one model so its cache keeps working
#   (https://docs.levanto.ai/llms/advanced#conversations).
# - Live check 2026-11-27: Chat Completions answered with this ID; reasoning comes back in
#   message.reasoning_content.
# Toggle: reasoning_effort = "none" turns reasoning off (checked live); reasoning is on otherwise.
# Input: text and images (checked live with PNG); audio and video are not offered here.
#   JPEG and WebP are the formats other hosts of this model list.
schema = 2
base_model = "xiaomi/mimo-v2.6-pro"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.516
cache = { read = 0.00432 }

[cost.text.output]
price = 1.044
