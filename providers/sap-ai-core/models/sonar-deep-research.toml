# Not all models support the full range of configuration options. Where possible, orchestration maps unsupported values to the closest equivalent.
# Reasoning support: https://help.sap.com/docs/sap-ai-core/generative-ai/reasoning?locale=en-US (accessed 2026-07-14)
schema = 2
name = "sonar-deep-research"
description = "Sonar search model for current answers, retrieval, and citation-backed chat"
family = "sonar-deep-research"
open_weights = false
knowledge = "2025-01"
release_date = "2025-02-01"
last_updated = "2025-09-01"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
temperature = false

[limit]
context = 128_000
output = 32_768

[cost.text.input]
price = 2

[cost.text.output]
price = 8
reasoning = 3
