name = "gemini-2.5-pro"
base_model = "google/gemini-2.5-pro"
last_updated = "2025-06-05"
attachment = true
# Vertex Gemini adapter: $.generationConfig.thinkingConfig.thinkingBudget is 0 (off), -1 (dynamic), or 128..32768. https://cloud.google.com/vertex-ai/generative-ai/docs/thinking (accessed 2026-06-25)
reasoning_options = [{ type = "budget_tokens", min = 128, max = 32768 }]
tool_call = true
structured_output = true
open_weights = false

[cost]
input = 0.87
output = 6.47
cache_read = 0.09

[[cost.tiers]]
tier = { type = "context", size = 200000 }
input = 1.67
output = 9.66

[limit]
context = 1000000
output = 65536

[modalities]
input = ["text", "image", "audio", "video", "pdf"]
output = ["text"]
