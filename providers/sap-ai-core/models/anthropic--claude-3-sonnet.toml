# Cost: Anthropic list price (https://docs.anthropic.com/en/docs/about-claude/pricing), used as a USD proxy.
#   SAP AI Core bills capacity units (CU): per-model GenAI-token rates (SAP Note 3437766; public calculator
#   https://ai-core-calculator.cfapps.eu10.hana.ondemand.com/) x 1.90385 CU per GenAI token, at a CU price set by the SAP contract. There is no public USD rate.
schema = 2
name = "anthropic--claude-3-sonnet"
description = "Balanced Claude model for coding, analysis, agent workflows, and cost control"
family = "claude-sonnet"
open_weights = false
knowledge = "2023-08-31"
release_date = "2024-03-04"
status = "deprecated"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true

[limit]
context = 200_000
output = 4_096

[cost.text.input]
price = 3
cache = { read = 0.3, write = 3.75 }

[cost.text.output]
price = 15
