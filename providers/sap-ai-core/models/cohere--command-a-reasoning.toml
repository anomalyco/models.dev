# Deployed as version "2508" on SAP AI Core; older versions share the same model name and can be selected at deployment time.
# Not all models support the full range of configuration options. Where possible, orchestration maps unsupported values to the closest equivalent.
# model_params.thinking = {"type": "enabled", "token_budget": N} or {"type": "disabled"}; token_budget >= 1. https://docs.cohere.com/docs/reasoning (accessed 2026-07-14)
# Reasoning support: https://help.sap.com/docs/sap-ai-core/generative-ai/reasoning?locale=en-US (accessed 2026-07-14)
# Cost: Cohere list price (https://cohere.com/pricing, as in providers/cohere), used as a USD proxy.
#   SAP AI Core bills capacity units (CU): per-model GenAI-token rates (SAP Note 3437766; public calculator
#   https://ai-core-calculator.cfapps.eu10.hana.ondemand.com/) x 1.90385 CU per GenAI token, at a CU price set by the SAP contract. There is no public USD rate.
# Deprecated: the SAP AI Core calculator (https://ai-core-calculator.cfapps.eu10.hana.ondemand.com/, 2026-10-21) listed with retirement date 2026-08-30 (version 2508).
schema = 2
base_model = "cohere/command-a-reasoning-08-2025"
name = "cohere--command-a-reasoning"
status = "deprecated"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["none", "minimal", "low", "medium", "high"], budget = { min = 1 } }

[cost.text.input]
price = 2.5

[cost.text.output]
price = 10
