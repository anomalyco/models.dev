# Cost: SAP AI Core bills capacity units (CU); CU prices aren't comparable to USD.
#   Per-model GenAI-token rates (SAP Note 3437766; public calculator
#   https://ai-core-calculator.cfapps.eu10.hana.ondemand.com/) are multiplied by 1.90385 CU per GenAI token; CU price is contract-specific.
# SAP orchestration reasoning and native extra_body passthrough: https://sap.github.io/ai-sdk/docs/js/orchestration/chat-completion#reasoning-content
# Native controls only (matching the lab baseline); SAP orchestration maps top-level reasoning_effort to internal thinking_budget values for Qwen models rather than forwarding reasoning_effort to Bailian.
# Toggle: config.modules.prompt_templating.model.params.extra_body.enable_thinking true|false.
# Budget: config.modules.prompt_templating.model.params.extra_body.thinking_budget (reasoning tokens; host bounds not documented).
# Native control: https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions
# Callable model name: https://github.com/SAP/ai-sdk-js/pull/2613 (scripts/sap-models.json; no alibaba-- prefix).
schema = 2
base_model = "alibaba/qwen3.6-plus"

[capabilities]
reasoning = { supported = true, toggle = true, budget = {} }
