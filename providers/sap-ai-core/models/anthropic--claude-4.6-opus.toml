# Bedrock Claude 4.6 prefers $.thinking.type = "adaptive" plus $.output_config.effort = "low"|"medium"|"high"|"max"; manual enabled budget_tokens >= 1024 is deprecated. Converse prefixes both paths with $.additionalModelRequestFields. https://docs.anthropic.com/en/docs/build-with-claude/extended-thinking (accessed 2026-06-25)
# Cost: Anthropic list price (https://docs.anthropic.com/en/docs/about-claude/pricing), used as a USD proxy.
#   SAP AI Core bills capacity units (CU): per-model GenAI-token rates (SAP Note 3437766; public calculator
#   https://ai-core-calculator.cfapps.eu10.hana.ondemand.com/) x 1.90385 CU per GenAI token, at a CU price set by the SAP contract. There is no public USD rate.
schema = 2
base_model = "anthropic/claude-opus-4-6"
name = "anthropic--claude-4.6-opus"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "max"], budget = { min = 1_024 } }

[cost.text.input]
price = 5
cache = { read = 0.5, write = 6.25 }

[cost.text.output]
price = 25
