# Cost: SAP AI Core bills capacity units (CU); CU prices aren't comparable to USD.
#   Per-model GenAI-token rates (SAP Note 3437766; public calculator
#   https://ai-core-calculator.cfapps.eu10.hana.ondemand.com/) are multiplied by 1.90385 CU per GenAI token; CU price is contract-specific.
# SAP AI Core maps harmonized reasoning_effort to each provider's native setting; unsupported levels map to the closest equivalent.
# https://sap.github.io/ai-sdk/docs/js/orchestration/chat-completion (reasoning)
schema = 2
base_model = "alibaba/qwen3.7-max"

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high"] }
