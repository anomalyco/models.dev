# Azure OpenAI deployment adapter: raw Chat uses top-level $.reasoning_effort = "none"|"low"|"medium"|"high"|"xhigh"; "none" is off. https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/reasoning (accessed 2026-06-25)
# Cost: Azure OpenAI list price (https://azure.microsoft.com/en-us/pricing/details/cognitive-services/openai-service/, as in providers/azure), used as a USD proxy.
#   SAP AI Core bills capacity units (CU): per-model GenAI-token rates (SAP Note 3437766; public calculator
#   https://ai-core-calculator.cfapps.eu10.hana.ondemand.com/) x 1.90385 CU per GenAI token, at a CU price set by the SAP contract. There is no public USD rate.
schema = 2
base_model = "openai/gpt-5.5"
name = "gpt-5.5"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true

[cost.text.input]
price = 5
cache = { read = 0.5 }

[cost.text.output]
price = 30
