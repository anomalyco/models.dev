# Vertex Gemini 3.x adapter: $.generationConfig.thinkingConfig.thinkingLevel accepts "minimal", "low", "medium", or "high"; mutually exclusive with the legacy $.generationConfig.thinkingConfig.thinkingBudget. https://cloud.google.com/vertex-ai/generative-ai/docs/thinking (accessed 2026-07-09)
# Cost: Vertex AI list price (https://cloud.google.com/vertex-ai/generative-ai/pricing), used as a USD proxy.
#   SAP AI Core bills capacity units (CU): per-model GenAI-token rates (SAP Note 3437766; public calculator
#   https://ai-core-calculator.cfapps.eu10.hana.ondemand.com/) x 1.90385 CU per GenAI token, at a CU price set by the SAP contract. There is no public USD rate.
schema = 2
base_model = "google/gemini-3.5-flash"
name = "gemini-3.5-flash"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 1.5
cache = { read = 0.15 }

[cost.text.output]
price = 9

[cost.audio.input]
price = 1.5
