# Cost: SAP AI Core bills capacity units (CU); CU prices aren't comparable to USD.
#   Per-model GenAI-token rates (SAP Note 3437766; public calculator
#   https://ai-core-calculator.cfapps.eu10.hana.ondemand.com/) are multiplied by 1.90385 CU per GenAI token; CU price is contract-specific.
# SAP orchestration accepts reasoning_effort = none|minimal|low|medium|high in addition to native Bailian controls.
# https://sap.github.io/ai-sdk/docs/js/orchestration/chat-completion#reasoning-content
# User-reported probes (2026-11-20): those five levels work; xhigh returns 400 in orchestration (200 via Direct LLM Access).
# Budget: config.modules.prompt_templating.model.params.thinking_budget (reasoning tokens; host bounds not documented).
# Native control: https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions
# Callable model name: https://github.com/SAP/ai-sdk-js/pull/2613 (scripts/sap-models.json; no alibaba-- prefix).
schema = 2
base_model = "alibaba/qwen3.7-plus"

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high"], budget = {} }
