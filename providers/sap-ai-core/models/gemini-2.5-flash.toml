# Vertex Gemini adapter: $.generationConfig.thinkingConfig.thinkingBudget is 0 (off), -1 (dynamic), or 1..24576. https://cloud.google.com/vertex-ai/generative-ai/docs/thinking (accessed 2026-06-25)
# Cost: Vertex AI list price (https://cloud.google.com/vertex-ai/generative-ai/pricing), used as a USD proxy.
#   SAP AI Core bills capacity units (CU): per-model GenAI-token rates (SAP Note 3437766; public calculator
#   https://ai-core-calculator.cfapps.eu10.hana.ondemand.com/) x 1.90385 CU per GenAI token, at a CU price set by the SAP contract. There is no public USD rate.
# Deprecated: the SAP AI Core calculator (https://ai-core-calculator.cfapps.eu10.hana.ondemand.com/, 2026-10-21) listed with retirement date 2026-10-16 (version 001).
schema = 2
base_model = "google/gemini-2.5-flash"
name = "gemini-2.5-flash"
status = "deprecated"

[capabilities]
reasoning = { supported = true, toggle = true, budget = { min = 0, max = 24_576 } }
structured_output = true

[cost.text.input]
price = 0.3
cache = { read = 0.03 }

[cost.text.output]
price = 2.5

[cost.audio.input]
price = 1
