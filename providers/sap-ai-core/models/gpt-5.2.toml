# Azure OpenAI deployment adapter: raw Chat uses top-level $.reasoning_effort = "none"|"minimal"|"low"|"medium"|"high"; "none" is off. https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/reasoning (accessed 2026-06-25)
schema = 2
base_model = "openai/gpt-5.2"
name = "gpt-5.2"
open_weights = false

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 1.25
cache = { read = 0.12 }

[cost.text.output]
price = 9.44
