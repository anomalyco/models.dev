# China platform (api.moonshot.cn). Prices are published in CNY at https://platform.kimi.com/docs/pricing/chat
# (accessed 2026-10-19): input ¥13.00, cache hit ¥2.60, output ¥54.00.
# CNY→USD rate: 6.693661, 2026-10-20, source: https://open.er-api.com/v6/latest/USD
# Capabilities match the global platform (same docs at https://platform.kimi.com/docs); see
# providers/moonshotai/models/kimi-k2.7-code-highspeed.toml for the live checks.
# Mid-conversation flags (2026-10-27): not tested live on api.moonshot.cn (our key returns 401 there). They mirror
#   providers/moonshotai/models/kimi-k2.7-code-highspeed.toml, where they were checked live on all three APIs, because the CN docs are the
#   same: a `developer` message on Responses is handled as a system instruction (https://platform.kimi.com/docs/api/responses).
#   system_updates holds on every API. No tools.updates: dynamic tool loading is K3 family only
#   (https://platform.kimi.com/docs/guide/use-dynamic-tool-loading); on the global platform both forms return 400 for this model.
# Tools (live 2026-10-26; https://platform.kimi.ai/docs/guide/use-tool-choice): Chat Completions and Messages take auto and
#   none. required (Messages `any`) and a named tool return 400 "incompatible with thinking enabled", and thinking can't
#   be turned off (https://platform.kimi.ai/docs/api/models-overview).
#   Responses accepts only auto (none/required return 400; https://platform.kimi.ai/docs/api/responses), so [api.responses]
#   overrides choice. strict: Chat Completions defaults function tools to strict = true, Responses function tools take strict,
#   Messages has no strict field but needs MFJS input schemas and is served by the Chat Completions backend
#   (https://platform.kimi.ai/docs/api/chat, https://platform.kimi.ai/docs/api/messages).
schema = 2
base_model = "moonshotai/kimi-k2.7-code"
name = "Kimi K2.7 Code HighSpeed"

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none"] }
reasoning = { supported = true }
structured_output = true
system_updates = true
stream_usage = true
prompt_cache_key = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/moonshot/responses" }
capabilities = { tools = { choice = ["auto"] } }

[api.messages]
base_url = "https://api.moonshot.cn/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/moonshot/messages" }

[cost.text.input]
price = 1.9421
cache = { read = 0.3884 }

[cost.text.output]
price = 8.0673
