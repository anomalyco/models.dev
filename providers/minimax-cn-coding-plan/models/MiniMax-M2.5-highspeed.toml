# Plan requests for M2.5/M2.7 are routed to MiniMax-M3.1-Flash from 2026-10-19
#   (https://platform.minimaxi.com/docs/faq/models, https://platform.minimaxi.com/docs/m-plan/intro).
# Caching: requests are served by MiniMax-M3.1-Flash, so they get its automatic prefix cache
#   (≥512 tokens, no cache_control; https://platform.minimaxi.com/docs/api-reference/text-prompt-caching).
schema = 2
name = "MiniMax-M2.5-highspeed"
description = "High-speed MiniMax model for low-latency coding and agent workflows"
family = "minimax"
open_weights = true
release_date = "2026-02-13"
status = "deprecated"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = false
cache = { supported = true, implicit = { min_tokens = 512 }, explicit = false }

[limit]
context = 204_800
output = 131_072

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
