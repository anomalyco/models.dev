# Native template has no effort/toggle/budget branches; serving passes it through.
# https://huggingface.co/RekaAI/reka-flash-3.1/blob/main/tokenizer_config.json
# low/medium/high pass generic vLLM validation but have no effect; none returns 400.
# API alias serves the 3.1 checkpoint; dates below refer to that checkpoint.
# Weights: https://huggingface.co/RekaAI/reka-flash-3.1
# https://reka.ai/labs/research/reinforcement-learning-for-reka-flash-3-1
# Direct API catalog and USD pricing (2026-09-22):
# https://inference.api.reka.ai/v1/site/models?capability=chat
name = "Reka Flash 3"
description = "Efficient model for low-latency assistance, extraction, and routine automation"
family = "reka"
release_date = "2025-07-10"
last_updated = "2025-07-10"
attachment = false
reasoning = true
temperature = true
tool_call = false
structured_output = true
open_weights = true
reasoning_options = []

[interleaved]
field = "reasoning_content"

[cost]
input = 0.1
output = 0.2

[limit]
context = 65536
output = 65536

[modalities]
input = ["text"]
output = ["text"]
