# Direct API catalog and USD pricing (2026-09-22):
# https://inference.api.reka.ai/v1/site/models?capability=chat
# This API alias serves Qwen/Qwen3.8-Flash-Next, not the closed Flash model.
# Effort: reasoning_effort = none|low|medium|xhigh; none disables thinking.
base_model = "alibaba/qwen3.8-flash-next"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "xhigh"] }]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.3
output = 1.2
