# Generated by bun models:sync reka from https://api.reka.ai/v1/site/chat-models.
# Prices are USD per million tokens; lab facts are inherited via base_model.
# Reka model docs: https://docs.reka.ai/chat/models.md
# Effort: top-level reasoning_effort = none|minimal|low|medium|high|xhigh|max. "none" turns thinking off; silence is the model's default.
# Cache: prompt prefixes are cached automatically and billed at cache.read (https://docs.reka.ai/pricing.md).
# Input: text and image per Reka's listing; this host takes no video or pdf.
schema = 2
base_model = "zhipuai/glm-5.3-flash"
name = "GLM 5.3 Flash"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.15
cache = { read = 0.015 }

[cost.text.output]
price = 0.5
