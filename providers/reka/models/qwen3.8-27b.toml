# Effort: reasoning_effort = none|low|medium|xhigh; none disables thinking.
# Live verified 2026-09-22; catalog false is a marketplace forwarding policy.
# none -> reasoning_tokens=0; low -> 51 on identical arithmetic input.
# Budget: thinking_token_budget, forwarded to vLLM (live verified at 1 and 256).
# Direct API catalog and USD pricing (2026-09-22):
# https://inference.api.reka.ai/v1/site/models?capability=chat
base_model = "alibaba/qwen3.8-27b"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "xhigh"] }, { type = "budget_tokens" }]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.2
output = 2.5

[limit]
output = 131072
