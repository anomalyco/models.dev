# Default: thinking off unless a thinking/effort signal enables it.
# Active backends clamp output as low as 43200; see ../README.md for evidence.
# Public catalog context is 262144; its output 131072 exceeds this serving cap.
# Toggle: chat_template_kwargs.thinking = true|false (live verified 2026-09-22).
# Direct API catalog and USD pricing (2026-09-22):
# https://inference.api.reka.ai/v1/site/models?capability=chat
# Effort: reasoning_effort = low|high|max (forwarded to the serving engine).
base_model = "deepseek/deepseek-v4-flash-0731"
reasoning_options = [{ type = "toggle" }, { type = "effort", values = ["low", "high", "max"] }]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.11
output = 0.66

[limit]
context = 262144
output = 43200
