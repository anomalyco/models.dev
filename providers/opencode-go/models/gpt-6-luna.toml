# Pricing and controls: https://developers.openai.com/api/docs/models/gpt-6-luna
# Pricing and endpoint (Responses): https://opencode.ai/v2/docs/console/go/ (accessed 2026-10-21).
# Effort: reasoning.effort = none|low|medium|high|xhigh|max (not verified on Go: no Go subscription key was available)
# Mid-conversation flags (system_updates, effort_updates, tools.updates) follow providers/openai/models/gpt-6-luna.toml (Go is a passthrough: opencode.ai/inference/go/... proxies the same upstreams, https://opencode.ai/v2/docs/console/go/).
#   Surface: Responses carries the in-history messages (configuration_update for effort_updates; additional_tools for tools.updates).
# Tools follow OpenAI's Responses API: https://developers.openai.com/api/docs/guides/function-calling (strict, tool_choice, custom tools with text, lark or regex format), tool_search per model page https://developers.openai.com/api/docs/models; Go passes requests through.
# Responses cache writes: 30m at 1.25x input, 12h at 2.5x. https://developers.openai.com/api/docs/guides/prompt-caching
# tools.updates (live 2026-11-17 through Zen, the request shapes @opencode/ai sends: gpt-6-astra, gpt-5.6-sol, claude-opus-5-5, claude-haiku-5-5): add, a redefinition (the call uses the new schema) and a removal all work, 3/3 each.
schema = 2
base_model = "openai/gpt-6-luna"

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none", "required", "tool"], search = true, freeform = ["text", "lark", "regex"], updates = ["add", "remove", "replace"] }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
system_updates = true
effort_updates = true

[api.responses]
base_url = "https://opencode.ai/inference/go/openai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }

[cost.text.input]
price = 0.1
cache = { read = 0.01, write = { "30m" = 0.125, "12h" = 0.25 } }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 0.2
cache = { read = 0.02, write = { "30m" = 0.25, "12h" = 0.5 } }

[cost.text.output]
price = 0.5

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 0.75
