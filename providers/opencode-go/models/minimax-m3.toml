schema = 2
base_model = "minimax/MiniMax-M3"
description = "MiniMax multimodal coding model for long-context reasoning and agent tasks"

[capabilities]
reasoning = { supported = true, toggle = true }

[limit]
context = 1_000_000
output = 131_072

[api.messages]
base_url = "https://opencode.ai/inference/go/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic" }

[cost.text.input]
price = 0.3
cache = { read = 0.06 }

[[cost.text.input.overrides]]
when = { context = { gt = 512_000 } }
price = 0.6
cache = { read = 0.12 }

[cost.text.output]
price = 1.2

[[cost.text.output.overrides]]
when = { context = { gt = 512_000 } }
price = 2.4
