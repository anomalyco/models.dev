# Pricing and endpoint (Chat Completions): https://opencode.ai/v2/docs/console/go/ (accessed 2026-10-21).
# Toggle: reasoning_effort = none|low|medium|high (none turns thinking off; low/medium/high behave identically —
#   Xiaomi has one thinking switch, https://mimo.mi.com/docs/zh-CN/api/chat/responses). Live on Go 2026-10-26:
#   none -> 0 reasoning tokens, default/high -> thinking on. thinking.type = disabled also works on V2.6.
# Mid-conversation flags (system_updates, effort_updates, tools.updates) follow providers/xiaomi/models/mimo-v2.6-pro.toml (Go is a passthrough: opencode.ai/inference/go/... proxies the same upstreams, https://opencode.ai/v2/docs/console/go/).
# effort_updates: left out. Changing thinking.type on the next request keeps the cache, but there's no in-history effort message, so it doesn't count.
# Tools follow Xiaomi's API: https://mimo.mi.com/static/docs/api/chat/openai-api.md (tool_choice only auto, function strict); Go passes requests through.
schema = 2
base_model = "xiaomi/mimo-v2.6-pro"

[capabilities]
tools = { supported = true, strict = true, choice = ["auto"] }
reasoning = { supported = true, default = { type = "toggle", value = true }, toggle = true }
system_updates = true

[api.chat-completions]
base_url = "https://opencode.ai/inference/go/openai/v1"
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.435
cache = { read = 0.003625 }

[cost.text.output]
price = 0.87
