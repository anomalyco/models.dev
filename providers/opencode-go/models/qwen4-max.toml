# https://opencode.ai/docs/go/#endpoints
# https://help.aliyun.com/en/model-studio/anthropic-api-messages
# Toggle (Messages): thinking.type = enabled|disabled
# Effort: low|high|xhigh, default high (Alibaba launch notes 2026-11-16: the middle level is high, not medium)
# Budget: thinking.budget_tokens with thinking.type = enabled
# Modalities: inherited from the lab, PDF included: Alibaba's Anthropic-compatible Messages API takes PDF document blocks for qwen3.8-max and the qwen4 series (https://www.alibabacloud.com/help/en/model-studio/pdf-understanding, accessed 2026-11-20).
# family: "qwen4-max" (not the lab's broader family): the OpenCode app shows only the newest model per family by default, so a shared family would hide this model or Qwen3.8 Max.
# Tools follow Alibaba's API: https://www.alibabacloud.com/help/en/model-studio/qwen-function-calling (Qwen models reject tool_choice required); Go passes requests through.
# Cache: implicit by default; explicit cache_control with ttl 5m (1.25x input) or 1h (2x input) on Messages (Alibaba launch notes 2026-11-16). Prices from Alibaba's Qwen4 Max price sheet.
schema = 2
base_model = "alibaba/qwen4-max"
family = "qwen4-max"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "tool"] }
reasoning = { supported = true, toggle = true, effort = ["low", "high", "xhigh"], budget = { max = 262_144 } }
structured_output = true
system_updates = true
cache = { implicit = true, explicit = { ttl = ["5m", "1h"] } }

[api.messages]
base_url = "https://opencode.ai/inference/go/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic" }

[cost.text.input]
price = 1.5
cache = { read = 0.075, write = { "5m" = 1.875, "1h" = 3 } }

[cost.text.output]
price = 4.5
