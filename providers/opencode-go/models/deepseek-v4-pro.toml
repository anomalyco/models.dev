# Pricing and endpoint (Chat Completions): https://opencode.ai/v2/docs/console/go/ (accessed 2026-10-21).
# Go lists Off-Peak and Peak prices; Peak is 01:00-04:00 and 06:00-10:00 UTC, Monday through Friday, and every other hour is Off-Peak.
# Base prices are Off-Peak; the multiplier doubles them at Peak. Go doesn't mention DeepSeek's Chinese-holiday exception, so none is applied.
# Effort: reasoning_effort = high|max (not verified on Go: no Go subscription key was available)
# Mid-conversation flags unset: Go documents none, and no Go subscription key was available to test them.
schema = 2
base_model = "deepseek/deepseek-v4-pro"
name = "DeepSeek V4 Pro (New)"
description = "Flagship DeepSeek model for coding, reasoning, and agentic work"

[capabilities]
reasoning = { supported = true, effort = ["high", "max"] }
structured_output = true

[api.chat-completions]
base_url = "https://opencode.ai/inference/go/openai/v1"
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.66
cache = { read = 0.022 }

[cost.text.output]
price = 1.98

[[cost.multipliers]]
when = { utc_days = { in = ["mon", "tue", "wed", "thu", "fri"] }, any = [{ all = [{ utc_hours = { gte = "01:00" } }, { utc_hours = { lt = "04:00" } }] }, { all = [{ utc_hours = { gte = "06:00" } }, { utc_hours = { lt = "10:00" } }] }] }
factor = 2
