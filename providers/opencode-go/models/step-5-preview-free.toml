# StepFun Chat supports reasoning_effort = low|medium|high.
# https://platform.stepfun.ai/docs/en/guides/models/step-5-preview
# Mid-conversation flags (system_updates, effort_updates, tools.updates) follow providers/stepfun/models/step-5-preview.toml (Go is a passthrough: opencode.ai/inference/go/... proxies the same upstreams, https://opencode.ai/v2/docs/console/go/).
schema = 2
base_model = "stepfun/step-5-preview"
name = "Step 5 Preview Free"
status = "deprecated"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
output = 65_536

[api.chat-completions]
base_url = "https://opencode.ai/inference/go/openai/v1"
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0
cache = { read = 0 }

[cost.text.output]
price = 0
