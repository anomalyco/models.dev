schema = 2
name = "MiMo V2.5"
description = "MiMo omni model for text, image, video, audio, and agents"
family = "mimo-v2.5"
open_weights = true
knowledge = "2024-12"
release_date = "2026-04-22"

[modalities]
input = ["text", "image", "audio", "video"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true

[limit]
context = 1_000_000
output = 128_000

[api.chat-completions]
base_url = "https://opencode.ai/inference/go/openai/v1"
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.14
cache = { read = 0.0028 }

[cost.text.output]
price = 0.28
