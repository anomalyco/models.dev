# Pricing and endpoint (Chat Completions): https://opencode.ai/v2/docs/console/go/ (accessed 2026-10-21).
# Deprecated: GET https://opencode.ai/inference/go/v1/models no longer lists this ID, and https://opencode.ai/docs/go lists only MiMo V2.6 Pro and Flash (2026-11-24).
# Mid-conversation flags (system_updates, effort_updates, tools.updates) follow providers/xiaomi/models/mimo-v2.5.toml (Go is a passthrough: opencode.ai/inference/go/... proxies the same upstreams, https://opencode.ai/v2/docs/console/go/).
schema = 2
base_model = "xiaomi/mimo-v2.5"
name = "MiMo V2.5"
description = "MiMo omni model for text, image, video, audio, and agents"
status = "deprecated"

[capabilities]
reasoning = { supported = true }

[limit]
context = 1_000_000
output = 128_000

[api.chat-completions]
base_url = "https://opencode.ai/inference/go/openai/v1"
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.14
cache = { read = 0.0028 }

[cost.text.output]
price = 0.28
