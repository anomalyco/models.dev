schema = 2
base_model = "xiaomi/mimo-v2.5"
name = "MiMo V2.5"
description = "MiMo omni model for text, image, video, audio, and agents"

[capabilities]
reasoning = { supported = true }

[limit]
context = 1_000_000
output = 128_000

[api.chat-completions]
base_url = "https://opencode.ai/inference/go/openai/v1"
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.14
cache = { read = 0.0028 }

[cost.text.output]
price = 0.28
