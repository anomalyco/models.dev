# Effort: reasoning_effort = none|low|medium|high (live probe 2026-09-22: these four pass;
# xhigh|max|minimal|adaptive|default → 400; none → 0 reasoning tokens; thinking.type also
# honored, but none ∈ effort so no separate toggle)
# https://mimo.mi.com/docs/api/chat/openai-api (accessed 2026-09-22)
base_model = "xiaomi/mimo-v2.6-flash"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high"] }]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.14
output = 0.28
cache_read = 0.0028
