# Pricing and endpoint (Responses): https://opencode.ai/v2/docs/console/go/.
# Modalities, capabilities, limits and effort levels supplied by the operator on 2026-11-03.
# Effort: reasoning.effort = minimal|low|medium|high|xhigh|max (accepted on Zen Responses, live 2026-11-05; not verified on Go: no Go subscription key was available).
schema = 2
name = "Crouton Alpha Free"
description = "Stealth reasoning model with text, image, video and PDF input and tool use"
open_weights = false
release_date = "2026-11-03"

[modalities]
input = ["text", "image", "video", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
temperature = true

[limit]
context = 1_048_576
output = 270_000

[api.responses]
base_url = "https://opencode.ai/inference/go/openai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }

[cost.text.input]
price = 0
cache = { read = 0 }

[cost.text.output]
price = 0
