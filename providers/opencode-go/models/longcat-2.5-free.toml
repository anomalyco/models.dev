# Toggle: thinking.type = enabled|disabled
# Pricing and endpoint (Chat Completions): https://opencode.ai/v2/docs/console/go/.
# Mid-conversation flags left out: meituan has no provider file for meituan/longcat-2.5 to follow (Go is a passthrough: opencode.ai/inference/go/... proxies the same upstreams, https://opencode.ai/v2/docs/console/go/).
schema = 2
base_model = "meituan/longcat-2.5"
name = "LongCat 2.5 Free"

[capabilities]
reasoning = { supported = true, toggle = true }

[api.chat-completions]
base_url = "https://opencode.ai/inference/go/openai/v1"
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0
cache = { read = 0 }

[cost.text.output]
price = 0
