# Toggle: thinking.type = enabled|disabled
# Pricing and endpoint (Chat Completions): https://opencode.ai/v2/docs/console/go/ (accessed 2026-10-21).
# Mid-conversation flags left out: meituan has no provider file for meituan/longcat-2.5-preview to follow (Go is a passthrough: opencode.ai/inference/go/... proxies the same upstreams, https://opencode.ai/v2/docs/console/go/).
schema = 2
base_model = "meituan/longcat-2.5-preview"
name = "LongCat 2.5 Preview Free"
status = "deprecated"

[capabilities]
reasoning = { supported = true, toggle = true }

[api.chat-completions]
base_url = "https://opencode.ai/inference/go/openai/v1"
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0
cache = { read = 0 }

[cost.text.output]
price = 0
