# Pricing and endpoint (Chat Completions): https://opencode.ai/v2/docs/console/go/ (accessed 2026-10-21).
# Effort: reasoning_effort = low|medium|high|xhigh|max (not verified on Go: no Go subscription key was available)
# Mid-conversation flags (system_updates, effort_updates, tools.updates) follow providers/minimax/models/MiniMax-M3.1-Flash.toml (Go is a passthrough: opencode.ai/inference/go/... proxies the same upstreams, https://opencode.ai/v2/docs/console/go/).
# Tools follow MiniMax's API: https://platform.minimax.io/docs/api-reference/text-chat-anthropic (ToolChoice: only auto); Go passes requests through.
schema = 2
base_model = "minimax/MiniMax-M3.1-Flash"
name = "MiniMax M3.1 Flash Free"
status = "deprecated"

[capabilities]
tools = { supported = true, choice = ["auto"] }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
system_updates = true

[api.chat-completions]
base_url = "https://opencode.ai/inference/go/openai/v1"
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0
cache = { read = 0 }

[cost.text.output]
price = 0
