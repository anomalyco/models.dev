schema = 2
name = "Qwen3.7 Plus"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"
family = "qwen3.7-plus"
open_weights = false
release_date = "2026-06-02"

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true, budget = { max = 262_144 } }
temperature = true

[limit]
context = 1_000_000
output = 65_536

[api.messages]
base_url = "https://opencode.ai/inference/go/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic" }

[cost.text.input]
price = 0.4
cache = { read = 0.04, write = 0.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 256_000 } }
price = 1.2
cache = { read = 0.12, write = 1.5 }

[cost.text.output]
price = 1.6

[[cost.text.output.overrides]]
when = { context = { gt = 256_000 } }
price = 4.8
