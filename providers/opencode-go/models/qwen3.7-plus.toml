# Pricing and endpoint (Anthropic Messages): https://opencode.ai/v2/docs/console/go/ (accessed 2026-10-21).
# Toggle: thinking.type = enabled|disabled (not verified on Go: no Go subscription key was available)
# Budget: thinking.budget_tokens with thinking.type = enabled (not verified on Go: no Go subscription key was available)
# family: kept as "qwen3.7-plus" (not the lab's broader family): the OpenCode app shows only the newest model per family by default, so a shared family would hide this model behind a newer sibling.
# Mid-conversation flags (system_updates, effort_updates, tools.updates) follow providers/alibaba/models/qwen3.7-plus.toml (Go is a passthrough: opencode.ai/inference/go/... proxies the same upstreams, https://opencode.ai/v2/docs/console/go/).
# effort_updates: left out. Changing thinking.type or thinking.budget_tokens on the next request keeps the cache, but there's no in-history effort message, so it doesn't count.
schema = 2
base_model = "alibaba/qwen3.7-plus"
family = "qwen3.7-plus"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"

[capabilities]
reasoning = { supported = true, toggle = true, budget = { max = 262_144 } }
system_updates = true

[limit]
output = 65_536

[api.messages]
base_url = "https://opencode.ai/inference/go/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic" }

[cost.text.input]
price = 0.4
cache = { read = 0.04, write = 0.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 256_000 } }
price = 1.2
cache = { read = 0.12, write = 1.5 }

[cost.text.output]
price = 1.6

[[cost.text.output.overrides]]
when = { context = { gt = 256_000 } }
price = 4.8
