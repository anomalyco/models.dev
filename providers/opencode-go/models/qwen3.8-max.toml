# https://opencode.ai/docs/go/#endpoints
# https://help.aliyun.com/en/model-studio/anthropic-api-messages
# Toggle (Messages): thinking.type = enabled|disabled
# Effort (Messages): output_config.effort = low|medium|xhigh
base_model = "alibaba/qwen3.8-max"
description = "2.4-trillion-parameter multimodal flagship for coding, professional work, and long-horizon agentic workflows"
family = "qwen3.8-max"
reasoning_options = [
  { type = "toggle" },
  { type = "effort", values = ["low", "medium", "xhigh"] },
  { type = "budget_tokens", max = 262_144 },
]
structured_output = true

[cost]
input = 2
output = 6
cache_read = 0.25
cache_write = 2.5

[modalities]
input = ["text", "image", "video"]
