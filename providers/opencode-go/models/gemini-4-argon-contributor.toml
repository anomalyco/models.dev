# Sources: https://opencode.ai/docs/go/#endpoints and https://opencode.ai/docs/go/#usage-limits
# Contributor tier: prompts and completions may be used to train future Google models,
# so Go requires the workspace's consent to paid endpoints that train on request data.
schema = 2
base_model = "google/gemini-4-argon"
name = "Gemini 4 Argon Contributor"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[api.generate-content]
base_url = "https://opencode.ai/inference/go/google/v1beta"
sdk = { aisdk = "@ai-sdk/google" }

[cost.text.input]
price = 4
cache = { read = 0.2 }

[cost.text.output]
price = 20

[cost.audio.input]
price = 4
