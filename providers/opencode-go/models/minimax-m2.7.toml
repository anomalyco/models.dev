# knowledge: the host's value, unsourced (no official cutoff found). Kept so v1 doesn't lose it.
# Mid-conversation flags (system_updates, effort_updates, tools.updates) follow providers/minimax/models/MiniMax-M2.7.toml (Go is a passthrough: opencode.ai/inference/go/... proxies the same upstreams, https://opencode.ai/v2/docs/console/go/).
schema = 2
base_model = "minimax/MiniMax-M2.7"
knowledge = "2025-01"
description = "MiniMax model for chat, coding, office work, and agentic tasks"
status = "deprecated"

[capabilities]
reasoning = { supported = true }

[api.messages]
base_url = "https://opencode.ai/inference/go/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic" }

[cost.text.input]
price = 0.3
cache = { read = 0.06, write = 0.375 }

[cost.text.output]
price = 1.2
