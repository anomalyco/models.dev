# Pricing and endpoint (Chat Completions): https://opencode.ai/v2/docs/console/go/ (Go list price from 2026-10-22).
# Effort: reasoning_effort = low|medium|high|xhigh|max, same upstream as minimax-m3.1-flash-free.
# Mid-conversation flags unset: Go documents none.
schema = 2
base_model = "minimax/MiniMax-M3.1-Flash"
name = "MiniMax M3.1 Flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[api.chat-completions]
base_url = "https://opencode.ai/inference/go/openai/v1"
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.15
cache = { read = 0.015 }

[cost.text.output]
price = 0.6
