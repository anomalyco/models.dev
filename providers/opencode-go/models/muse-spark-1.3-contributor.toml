# Capability metadata follows Muse Spark 1.2 pending public 1.3 specifications.
# Dates reflect first confirmed availability, not a public Meta announcement.
# https://research.meta.ai/blog/introducing-muse-code-and-muse-spark-1-2
# https://dev.meta.ai/docs/models
# Pricing and endpoint (Responses): https://opencode.ai/v2/docs/console/go/ (accessed 2026-10-21).
# Effort: reasoning.effort = minimal|low|medium|high|xhigh (not verified on Go: no Go subscription key was available)
# Mid-conversation flags unset: Go documents none, and no Go subscription key was available to test them.
schema = 2
base_model = "meta/muse-spark-1.3"
name = "Muse Spark 1.3 Contributor"
description = "Muse Spark 1.3 is a multimodal reasoning model from Meta for coding and agentic workflows."

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh"] }
structured_output = true

[api.responses]
base_url = "https://opencode.ai/inference/go/openai/v1"
sdk = { aisdk = "@ai-sdk/openai" }

[cost.text.input]
price = 0.1
cache = { read = 0.002 }

[cost.text.output]
price = 0.2
