# Same model, route and price as providers/opencode/models/gpt-6-luna-decision.toml, served on OpenCode Go at
#   POST https://opencode.ai/inference/go/systemone/v1/systemone (also POST /inference/go/openai/v1/decisions) and billed
#   against the Go subscription. Decision requests need no x-opencode-session header.
#   https://opencode.ai/v2/docs/console/go/ (accessed 2026-11-23).
schema = 2
v2_only = true
base_model = "openai/gpt-6-luna"
type = "decision"
name = "GPT-6 Luna Decision"
description = "GPT-6 Luna on OpenAI's Decisions API, returning typed yes/no, choice and score answers about text and images"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["decision"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
cache = { implicit = { min_tokens = 1_024 } }

[api.systemone]
base_url = "https://opencode.ai/inference/go/systemone/v1"
sdk = { aisdk = "@ai-sdk/typesafe-ai", opencodeai = "@opencode/ai/providers/opencode/decisions" }
compatibility = { media_input = "state" }

[cost.text.input]
price = 0.1
cache = { read = 0.01, write = { "30m" = 0.125, "12h" = 0.25 } }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 0.2
cache = { read = 0.02, write = { "30m" = 0.25, "12h" = 0.5 } }

[cost.text.output]
price = 0
