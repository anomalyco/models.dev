# https://opencode.ai/docs/go/#endpoints
# https://help.aliyun.com/en/model-studio/anthropic-api-messages
# Toggle (Messages): thinking.type = enabled|disabled
# Effort (Messages): output_config.effort = low|medium|xhigh
# Pricing and endpoint (Anthropic Messages): https://opencode.ai/v2/docs/console/go/ (accessed 2026-10-21).
# Budget: thinking.budget_tokens with thinking.type = enabled (not verified on Go: no Go subscription key was available)
# Mid-conversation flags (system_updates, effort_updates, tools.updates) follow providers/alibaba/models/qwen3.8-flash.toml (Go is a passthrough: opencode.ai/inference/go/... proxies the same upstreams, https://opencode.ai/v2/docs/console/go/).
# Tools follow Alibaba's API: https://www.alibabacloud.com/help/en/model-studio/qwen-function-calling (Qwen models reject tool_choice required); Go passes requests through.
schema = 2
base_model = "alibaba/qwen3.8-flash"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "tool"] }
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "xhigh"], budget = {} }
structured_output = true
system_updates = true

[api.messages]
base_url = "https://opencode.ai/inference/go/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic" }

[cost.text.input]
price = 0.15
cache = { read = 0.016, write = 0.2 }

[cost.text.output]
price = 0.47
