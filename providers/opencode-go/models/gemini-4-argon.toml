# Pricing and endpoint (Gemini generateContent): https://opencode.ai/v2/docs/console/go/ (same prices as the Zen row).
# Go lists Gemini 4 Argon at 50% off ($2/$10/$0.10, struck-through $4/$20/$0.20) through November 30, 2026; the multiplier restores list prices from 2026-12-01.
# Effort: generationConfig.thinkingConfig.thinkingLevel = low|medium|high
# Cache: implicit (cached tokens reported without cache markers), as on Zen.
# Mid-conversation flags (system_updates, effort_updates, tools.updates) follow providers/google/models/gemini-4-argon.toml (Go is a passthrough: opencode.ai/inference/go/... proxies the same upstreams, https://opencode.ai/v2/docs/console/go/).
schema = 2
base_model = "google/gemini-4-argon"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[api.generate-content]
base_url = "https://opencode.ai/inference/go/google/v1beta"
sdk = { aisdk = "@ai-sdk/google", opencodeai = "@opencode/ai/providers/google" }

[cost.text.input]
price = 2
cache = { read = 0.1 }

[cost.text.output]
price = 10

[cost.audio.input]
price = 2

[[cost.multipliers]]
when = { date = { gte = "2026-12-01" } }
factor = 2
