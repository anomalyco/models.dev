# StepFun Chat supports reasoning_effort = low|medium|high.
# https://platform.stepfun.ai/docs/en/guides/models/step-5-preview
# Pricing and endpoint (Chat Completions): https://opencode.ai/v2/docs/console/go/ (accessed 2026-10-21).
# Effort: reasoning_effort = low|medium|high (not verified on Go: no Go subscription key was available)
# Mid-conversation flags unset: Go documents none, and no Go subscription key was available to test them.
schema = 2
base_model = "stepfun/step-5-preview"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
output = 65_536

[api.chat-completions]
base_url = "https://opencode.ai/inference/go/openai/v1"
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1
cache = { read = 0.1 }

[cost.text.output]
price = 2.7
