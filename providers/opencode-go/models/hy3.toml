# Pricing and endpoint (Chat Completions): https://opencode.ai/v2/docs/console/go/ (accessed 2026-10-21).
# Effort: reasoning_effort = none|low|high (not verified on Go: no Go subscription key was available)
# Mid-conversation flags left out: tencent has no provider file for tencent/hy3 to follow (Go is a passthrough: opencode.ai/inference/go/... proxies the same upstreams, https://opencode.ai/v2/docs/console/go/).
schema = 2
base_model = "tencent/hy3"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high"] }

[api.chat-completions]
base_url = "https://opencode.ai/inference/go/openai/v1"

[cost.text.input]
price = 0.14
cache = { read = 0.035 }

[cost.text.output]
price = 0.58
