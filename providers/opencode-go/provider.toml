name = "OpenCode Go"
env = ["OPENCODE_API_KEY"]
npm = "@ai-sdk/openai-compatible"
# Shared Go inference base (accessed 2026-10-12): `/inference/go/v1` serves the
# same chat completions, responses, messages, and Gemini paths as
# `/inference/v1`, billed against the Go subscription. Requests require
# `x-opencode-session`. https://opencode.ai/v2/docs/console/go/
api = "https://opencode.ai/inference/go/v1"
doc = "https://opencode.ai/v2/docs/console/go/"
