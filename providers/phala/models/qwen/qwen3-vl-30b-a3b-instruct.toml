# Source (accessed 2026-10-25): https://inference.phala.com/v1/models
# Modalities: catalog input_modalities text,image (no video/pdf listed).
# Limits: catalog context_length 128000, max_output_length 32768
# Cache: catalog pricing.input_cache_read
schema = 2
base_model = "alibaba/qwen3-vl-30b-a3b-instruct"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
structured_output = true
cache = { implicit = true }

[limit]
context = 128_000

[cost.text.input]
price = 0.2
cache = { read = 0.03 }

[cost.text.output]
price = 0.7
