# Source (accessed 2026-10-25): https://inference.phala.com/v1/models
# Toggle: reasoning.enabled = true|false; budget: reasoning.max_tokens (gateway src/middleware/reasoning.rs).
# Budget: native baseline; effect test inconclusive (about 1 reasoning token even without a budget, 2026-10-25).
# Limits: catalog context_length 40960, max_output_length 16384
# Cache: catalog pricing.input_cache_read
schema = 2
base_model = "alibaba/qwen3-32b"

[capabilities]
reasoning = { supported = true, toggle = true, budget = {} }
cache = { implicit = true }

[limit]
context = 40_960

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.12
cache = { read = 0.052 }

[cost.text.output]
price = 0.5
