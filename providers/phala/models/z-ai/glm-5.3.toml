# Source (accessed 2026-10-25): https://inference.phala.com/v1/models
# Effort: reasoning_effort = low|high|max (accepted 2026-10-25)
# Limits: catalog context_length 1048576
# Cache: catalog pricing.input_cache_read
schema = 2
base_model = "zhipuai/glm-5.3"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.4
cache = { read = 0.26 }

[cost.text.output]
price = 4.4
