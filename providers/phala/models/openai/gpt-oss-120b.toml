# Source (accessed 2026-10-25): https://inference.phala.com/v1/models
# Effort: reasoning_effort = low|medium|high (accepted 2026-10-25)
# Reasoning: reasoning.enabled=false and reasoning_effort=max rejected (live-tested 2026-10-25)
schema = 2
base_model = "openai/gpt-oss-120b"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 0.15

[cost.text.output]
price = 0.6
