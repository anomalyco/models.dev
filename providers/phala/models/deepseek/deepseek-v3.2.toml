# Source (accessed 2026-10-25): https://inference.phala.com/v1/models
# Toggle: reasoning.enabled = true|false (gateway src/middleware/reasoning.rs; live-tested 2026-10-25)
# Limits: catalog context_length 163840, max_output_length 64000
# Cache: catalog pricing.input_cache_read
schema = 2
base_model = "deepseek/deepseek-v3.2"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
cache = { implicit = true }

[limit]
context = 163_840

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1
cache = { read = 0.5 }

[cost.text.output]
price = 1
