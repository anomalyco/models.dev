# Source (accessed 2026-10-25): https://inference.phala.com/v1/models
# Toggle: reasoning.enabled = true|false (gateway src/middleware/reasoning.rs; live-tested 2026-10-25)
# Effort: reasoning_effort = low|high|max (accepted 2026-10-25)
# Limits: catalog context_length 1048576, max_output_length 393216
# Cache: catalog pricing.input_cache_read
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
cache = { implicit = true }

[limit]
context = 1_048_576
output = 393_216

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.75
cache = { read = 0.15 }

[cost.text.output]
price = 1.6
