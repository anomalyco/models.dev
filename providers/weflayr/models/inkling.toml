# Prices: Weflayr catalog (GET https://gateway.weflayr.com/v1/models, accessed 2026-11-25),
# lowest-priced deployment (together, GLOBAL).
schema = 2
base_model = "thinkingmachines/inkling"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[limit]
context = 256_000
output = 256_000

[cost.text.input]
price = 1
cache = { read = 0.17 }

[cost.text.output]
price = 4.05
