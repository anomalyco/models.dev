# Prices: Weflayr catalog (GET https://gateway.weflayr.com/v1/models, accessed 2026-11-25),
# lowest-priced deployment (mistral, GLOBAL).
schema = 2
base_model = "mistral/mistral-large-4"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "high" }, effort = ["low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 1.36
cache = { read = 0.14 }

[cost.text.output]
price = 4.18
