# Prices: Weflayr catalog (GET https://gateway.weflayr.com/v1/models, accessed 2026-11-25),
# lowest-priced deployment (google, GLOBAL).
schema = 2
base_model = "google/gemini-3-flash-preview"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "high" }, effort = ["minimal", "low", "medium", "high"] }
structured_output = true

[limit]
output = 65_000

[cost.text.input]
price = 0.5
cache = { read = 0.05 }

[cost.text.output]
price = 3
