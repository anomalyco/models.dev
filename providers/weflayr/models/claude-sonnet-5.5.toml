# Prices: Weflayr catalog (GET https://gateway.weflayr.com/v1/models, accessed 2026-11-25),
# lowest-priced deployment (anthropic, GLOBAL).
schema = 2
base_model = "anthropic/claude-sonnet-5-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"], default = { type = "effort", value = "high" } }
structured_output = true

[cost.text.input]
price = 2
cache = { read = 0.1, write = { "5m" = 2.5, "1h" = 4 } }

[cost.text.output]
price = 10
