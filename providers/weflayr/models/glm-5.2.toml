# Prices: Weflayr catalog (GET https://gateway.weflayr.com/v1/models, accessed 2026-11-25),
# lowest-priced deployment (alibaba, GLOBAL).
schema = 2
base_model = "zhipuai/glm-5.2"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "max" }, toggle = true, effort = ["high", "max"] }
structured_output = true

[limit]
output = 128_000

[cost.text.input]
price = 1.4
cache = { read = 0.28 }

[cost.text.output]
price = 4.4
