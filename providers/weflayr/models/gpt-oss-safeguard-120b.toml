# Prices: Weflayr catalog (GET https://gateway.weflayr.com/v1/models, accessed 2026-11-25),
# lowest-priced deployment (bedrock, us-east-1).
schema = 2
base_model = "openai/gpt-oss-safeguard-120b"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
context = 128_000
output = 16_000

[cost.text.input]
price = 0.15

[cost.text.output]
price = 0.6
