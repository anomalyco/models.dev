# Prices: Weflayr catalog (GET https://gateway.weflayr.com/v1/models, accessed 2026-11-25),
# lowest-priced deployment (meta, GLOBAL).
schema = 2
base_model = "meta/muse-wonder-1.0"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh", "max"], default = { type = "effort", value = "max" } }
structured_output = true

[cost.text.input]
price = 4
cache = { read = 0.2 }

[cost.text.output]
price = 20
