# Prices: Weflayr catalog (GET https://gateway.weflayr.com/v1/models, accessed 2026-11-25),
# lowest-priced deployment (alibaba, GLOBAL).
schema = 2
base_model = "alibaba/qwen-plus"

[capabilities]
reasoning = { supported = true, default = { type = "toggle", value = false }, toggle = true, budget = {  } }
