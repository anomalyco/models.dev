# Prices: Weflayr catalog (GET https://gateway.weflayr.com/v1/models, accessed 2026-11-25),
# lowest-priced deployment (azure, GLOBAL).
schema = 2
base_model = "openai/gpt-6-astra"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 10
cache = { read = 1, write = { "5m" = 12.5, "1h" = 25 } }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 20
cache = { read = 2, write = { "5m" = 25, "1h" = 50 } }

[cost.text.output]
price = 50

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 75
