# Prices: Weflayr catalog (GET https://gateway.weflayr.com/v1/models, accessed 2026-11-25),
# lowest-priced deployment (mistral, GLOBAL).
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "max" }, effort = ["low", "high", "max"] }
structured_output = true

[limit]
output = 131_000

[cost.text.input]
price = 0.15
cache = { read = 0.03 }

[cost.text.output]
price = 0.5
