# Prices: Weflayr catalog (GET https://gateway.weflayr.com/v1/models, accessed 2026-11-25),
# lowest-priced deployment (openai, GLOBAL).
schema = 2
base_model = "openai/gpt-6.2-astra"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 8
cache = { read = 0.4, write = { "5m" = 10, "1h" = 20 } }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 16
cache = { read = 0.8, write = { "5m" = 20, "1h" = 40 } }

[cost.text.output]
price = 40

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 60
