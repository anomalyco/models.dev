# https://entrim.ai/ai-models/deepseek/deepseek-v4-1-flash-1017-api (pricing and reasoning controls, accessed 2026-10-28)
# Limits from GET https://api.entrim.ai/v1/models: max_input_tokens 1048576, max_output_tokens 393216.
# Effort: reasoning_effort = none|low|high|max (none = thinking off, default high).
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 1_048_576
output = 393_216

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.2
cache = { read = 0.005 }

[cost.text.output]
price = 0.6
