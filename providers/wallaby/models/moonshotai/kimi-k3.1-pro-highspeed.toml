# Pricing: https://wallabytoken.com/pricing.json (accessed 2026-11-05), USD per 1M tokens.
# Same weights as kimi-k3.1-pro, served at 2-3x the speed; cached reads are
# priced the same, fresh input and output cost 2x.
schema = 2
base_model = "moonshotai/kimi-k3.1-pro-highspeed"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 3.6
cache = { read = 0.18 }

[cost.text.output]
price = 18.0
