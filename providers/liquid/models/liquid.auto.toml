# Liquid Auto compares a published score for each model with the estimated charge, then runs the
# auction, so the underlying model and price vary per request. No fixed price is published.
# Docs: https://inference.ai.exchange/docs/auto
# Model list and limits: GET https://router.inference.ai.exchange/v1/models (accessed 2026-11-04)
schema = 2
name = "Liquid Auto"
description = "Chooses a model for each request by comparing its published score with the estimated charge on the Liquid Inference exchange"
family = "auto"
open_weights = false
release_date = "2026-10-20"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif", "audio/wav", "audio/mpeg", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
structured_output = true
temperature = true

[limit]
context = 2_000_000
output = 1_048_576
