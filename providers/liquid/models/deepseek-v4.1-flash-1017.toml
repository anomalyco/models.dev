# Id, limits and features: GET https://router.inference.ai.exchange/v1/models (accessed 2026-11-04)
# Prices: the auction picks an offer for each request, so the charge varies, and these are a guide.
#   Median rates of the 7 offers with tools in GET https://router.inference.ai.exchange/v1/exchange/book
#   on 2026-11-04: input 0.049, cache read 0.0016, output 0.196. Each adds the exchange fee
#   (https://inference.ai.exchange/docs/fees).
# Cache: the exchange plans caching for each job, with no buyer setting
#   (https://inference.ai.exchange/docs/caching). Each offer quotes its own read rate.
# Effort: reasoning_effort = none|low|high|max, passed to the seller as written. Levels follow the lab's API.
# No toggle: Chat Completions dispatch sends sellers only reasoning_effort. It drops thinking.type,
#   enable_thinking, chat_template_kwargs and reasoning.enabled.
# Off is reasoning_effort = none, which the host forwards. Live probe on 2026-11-08:
#   none gave 0 reasoning tokens and high gave 20 on the same offer.
# No budget: 1 of the 7 offers declare reasoning.budget_tokens.
# reasoning_field is unset: the host returns "reasoning", which v1's interleaved.field does not allow.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 1_048_576

[cost.text.input]
price = 0.059
cache = { read = 0.0026 }

[cost.text.output]
price = 0.206
