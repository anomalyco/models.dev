# Toggle: enable_thinking = true|false
# Served locally by MTPLX; the id is the one MTPLX reports on /v1/models.
# Runs on the user's own Mac, so there is no per-token cost. Image input is
# supported, video is not. Thinking is switched with the enable_thinking
# request field (this family has no graded effort levels).
base_model = "alibaba/qwen3.5-9b"
name = "Qwen3.5 9B (MTPLX Optimized Speed)"

[[reasoning_options]]
type = "toggle"

[cost]
input = 0
output = 0

[modalities]
input = ["text", "image"]
output = ["text"]
