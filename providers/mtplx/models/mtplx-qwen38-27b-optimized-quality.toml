# Served locally by MTPLX; the id is the one MTPLX reports on /v1/models.
# Runs on the user's own Mac, so there is no per-token cost. Image input is
# supported, video is not. Reasoning effort is the reasoning_effort request
# field (low, medium, high, xhigh); enable_thinking = false turns thinking off.
base_model = "alibaba/qwen3.8-27b"
name = "Qwen3.8 27B (MTPLX Optimized Quality)"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh"]

[cost]
input = 0
output = 0

[modalities]
input = ["text", "image"]
output = ["text"]
