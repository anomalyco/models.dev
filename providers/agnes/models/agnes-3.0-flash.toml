# Release month uses 2026-09 (secondary catalogs report September 2026; no first-party date published).
name = "Agnes 3.0 Flash"
description = "A new-generation Agnes AI text model with stronger Agnes Code task execution, tool orchestration, and trustworthy delivery."
release_date = "2026-09"
last_updated = "2026-09"
attachment = true
reasoning = true
tool_call = true
structured_output = true
temperature = true
open_weights = false

[cost]
input = 0
output = 0

[limit]
context = 512_000
output = 65_536

[modalities]
input = ["text", "image"]
output = ["text"]

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "toggle" # API: {"chat_template_kwargs": {"enable_thinking": true}}
