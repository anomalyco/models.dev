# Reasoning HTTP format (Watt Cloud, AU site):
# Docs (https://www.watt-cloud.com/docs/inference/features/deep-thinking/)
# document the thinking toggle via chat_template_kwargs.thinking
# (cURL/Python/JS/Go examples send thinking = true) and
# enumerate GLM-5.1/5/4.7 (hybrid, reasoning on by default)
# and MiniMax-M2.x (thinking-only); DeepSeek/Kimi are named
# generically in the intro.
# Model reasoning controls in providers/watt/models mirror the
# lab entries (providers/deepseek, providers/zhipuai,
# providers/moonshotai, providers/alibaba,
# providers/tencent-token-plan, models/minimax) per the
# relay rule in AGENTS.md: relays copy the underlying lab's
# controls instead of leaving them off while the host is
# untested.
# TODO(live audit, WATT_API_KEY required): POST
# https://api.watt-cloud.com/v1/chat/completions to confirm -
# (a) reasoning_effort / thinking_budget are forwarded (the
#     levels mirror the lab entries),
# (b) thinking = false disables thinking on the toggled IDs,
# (c) the always-on IDs (Kimi-K2.7-Code, Kimi-K3, GLM-5.3,
#     MiniMax-M3, Kimi-K2.5) ignore thinking = false,
# (d) reasoning is returned as reasoning_content,
# (e) GET /v1/models requires auth (403 unauthenticated) -
#     verify listed IDs and per-model limits against the catalog.
# If the audit shows a control this host does not honor,
# remove it with the observed behavior in the comment.
# Pricing and limits in providers/watt/models are from the Watt
# Cloud official catalog (2026-10-23), one cited row per model file.
# Sources:
# https://www.watt-cloud.com/
# https://www.watt-cloud.com/docs/inference/features/deep-thinking/
# https://www.watt-cloud.com/models/
# https://api.watt-cloud.com/v1/models (auth required)
name = "Watt Cloud"
env = ["WATT_API_KEY"]
npm = "@ai-sdk/openai-compatible"
opencodeai = "@opencode/ai/providers/openai-compatible"
api = "https://api.watt-cloud.com/v1"
doc = "https://www.watt-cloud.com/docs/"
