# Reasoning HTTP format (sibling deployment of Jalapeno Cloud, AU site):
# Docs (https://www.watt-cloud.com/docs/inference/features/deep-thinking)
# document chat_template_kwargs.thinking = true|false as the thinking toggle.
# TODO(live audit): confirm against POST https://api.watt-cloud.com/v1/chat/completions
# before PR — on Jalapeno thinking=true emits reasoning_content /
# reasoning_tokens; thinking=false drops reasoning_tokens on GLM-5.1;
# dedicated always-on IDs still reason when thinking=false.
# Interleaved reasoning is returned as reasoning_content.
# Do not invent reasoning_effort / thinking_budget unless this host is
# shown to honor those fields.
# Pricing and limits in providers/watt/models are from the Watt
# Cloud official catalog (2026-10-23).
# Sources:
# https://www.watt-cloud.com/
# https://api.watt-cloud.com/v1/models
name = "Watt Cloud"
env = ["WATT_API_KEY"]
npm = "@ai-sdk/openai-compatible"
opencodeai = "@opencode/ai/providers/openai-compatible"
api = "https://api.watt-cloud.com/v1"
doc = "https://www.watt-cloud.com/docs/"
