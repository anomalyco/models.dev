# Effort: reasoning_effort = low|high|max (always-on; the
# zhipuai lab entry authors effort only and the Watt
# toggle docs do not list GLM-5.3)
# Pricing & limits: Watt catalog (2026-10-23), GLM-5.3 row:
# 1.4/4.4 USD per MTok, context 1_048_576
schema = 2
base_model = "zhipuai/glm-5.3"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.40

[cost.text.output]
price = 4.40
