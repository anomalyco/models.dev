# Toggle: chat_template_kwargs.thinking (Watt docs:
# https://www.watt-cloud.com/docs/inference/features/deep-thinking/)
# Pricing & limits: Watt catalog (2026-10-23), Hy4-preview row:
# 0.83/2.5 USD per MTok, context 1_048_576, output 131_072; no Jalapeno twin
schema = 2
base_model = "tencent/hy4-preview"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
context = 1_048_576
output = 131_072

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.83

[cost.text.output]
price = 2.5
