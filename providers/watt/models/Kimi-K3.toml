# Toggle: chat_template_kwargs.thinking true|false
# (relay peers author toggle + graded effort; the
# effort levels are queued for the live audit in
# provider.toml)
# Pricing & limits: Watt catalog (2026-10-23), Kimi-K3 row:
# 3/15 USD per MTok, context 1_048_576, output 131_072 (lab limits, inherited)
schema = 2
base_model = "moonshotai/kimi-k3"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 3.0

[cost.text.output]
price = 15.0
