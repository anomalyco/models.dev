# Toggle: chat_template_kwargs.thinking true|false (Watt docs:
# https://www.watt-cloud.com/docs/inference/features/deep-thinking/)
# Effort: reasoning_effort = low|high|max
# Pricing & limits: Watt catalog (2026-10-23), DeepSeek-V4-Pro row:
# 1.6/3.38 USD per MTok, context 1_048_576
schema = 2
base_model = "deepseek/deepseek-v4-pro"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.60

[cost.text.output]
price = 3.380
