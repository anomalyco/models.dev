# Toggle: chat_template_kwargs.thinking (Watt docs:
# https://www.watt-cloud.com/docs/inference/features/deep-thinking/)
# Pricing & limits: Watt catalog (2026-10-23), GLM-5.3-Flash row:
# 0.15/0.5 USD per MTok, context 1_048_576; no Jalapeno twin
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
context = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.15

[cost.text.output]
price = 0.5
