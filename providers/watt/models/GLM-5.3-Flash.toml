# Effort: reasoning_effort = low|high|max (always-on; the
# zhipuai lab entry authors effort only and the Watt
# toggle docs do not list GLM-5.3-Flash)
# Pricing & limits: Watt catalog (2026-10-23), GLM-5.3-Flash row:
# 0.15/0.5 USD per MTok, context 1_048_576
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
context = 1_048_576

[api.chat-completions]
