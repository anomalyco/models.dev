# DotHoosh bills in Toman (IRT) from a prepaid wallet. Its Toman price is derived from the
# vendor's USD list price: USD price x 77/60 (5% margin, 10% USD acquisition premium, 1% payment
# fee, 10% VAT), converted at the gateway's current USD/IRT rate. The costs below are that USD
# figure before conversion, so they do not depend on the exchange rate (checked 2026-10-24).
# https://gateway.dothoosh.com/models
# Images and files are not accepted on any DotHoosh route yet (text only).
# Gateway wire facts (DotHoosh verifies request fields per vendor against captured
# vendor responses and refuses unverified ones with HTTP 400):
# - Anthropic Messages at /anthropic/v1/messages (x-api-key). Toggle: thinking.type =
#   adaptive|disabled; Effort: output_config.effort = low|medium|high|xhigh|max (both forwarded).
# Long prompts are billed at the vendor's long-context tier (whole request), exactly as the vendor bills DotHoosh.
schema = 2
base_model = "anthropic/claude-haiku-5-5"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[api.messages]
base_url = "https://gateway.dothoosh.com/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.128336
cache = { read = 0.012837, write = { "5m" = 0.16042, "1h" = 0.256669 } }

[[cost.text.input.overrides]]
when = { context = { gt = 100_000 } }
price = 0.64167
cache = { read = 0.064168, write = { "5m" = 0.802086, "1h" = 1.283335 } }

[cost.text.output]
price = 0.64167

[[cost.text.output.overrides]]
when = { context = { gt = 100_000 } }
price = 3.208337
