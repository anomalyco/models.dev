# DotHoosh bills in Toman (IRT) from a prepaid wallet. Its Toman price is derived from the
# vendor's USD list price: USD price x 77/60 (5% margin, 10% USD acquisition premium, 1% payment
# fee, 10% VAT), converted at the gateway's current USD/IRT rate. The costs below are that USD
# figure before conversion, so they do not depend on the exchange rate (checked 2026-10-24).
# https://gateway.dothoosh.com/models
# Images and files are not accepted on any DotHoosh route yet (text only).
# Gateway wire facts (DotHoosh verifies request fields per vendor against captured
# vendor responses and refuses unverified ones with HTTP 400):
# - Chat Completions. Effort: reasoning_effort = low|high|max (forwarded); always thinks.
schema = 2
base_model = "moonshotai/kimi-k3"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 3.850003
cache = { read = 0.385001 }

[cost.text.output]
price = 19.250002
