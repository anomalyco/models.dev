# First-party MiniMax API model overview lists a 1,000,000-token context.
# https://platform.minimax.io/docs/guides/text-generation
schema = 2
name = "MiniMax-M3"
description = "MiniMax multimodal model for long-context coding, perception, and agent planning"
family = "minimax"
open_weights = true
release_date = "2026-06-01"
last_updated = "2026-06-25"

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true }
temperature = true

[limit]
context = 1_000_000
output = 512_000

[cost.text.input]
price = 0.3
cache = { read = 0.06 }

[[cost.text.input.overrides]]
when = { context = { gt = 512_000 } }
price = 0.6
cache = { read = 0.12 }

[cost.text.output]
price = 1.2

[[cost.text.output.overrides]]
when = { context = { gt = 512_000 } }
price = 2.4
