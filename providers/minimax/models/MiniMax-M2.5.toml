# Closed to new users 2026-10-19, retired 2026-11-18
#   (https://platform.minimax.io/docs/faq/models). Prices are from before the model left the pricing page.
# Thinking is always on; thinking.type = disabled is accepted and ignored.
# Caching: cache_control (explicit) and, from M2.1, an automatic prefix cache from 512 input
#   tokens; M2 caches only with cache_control (checked live 2026-10-19).
# tools.updates: adding or removing a tool busts the cache (prefix order is tools, system, messages; live on api.minimax.io 2026-10-22).
schema = 2
name = "MiniMax-M2.5"
description = "Prior MiniMax coding model for agent workflows, office edits, and automation"
family = "minimax"
open_weights = true
release_date = "2026-02-12"
status = "deprecated"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = false
cache = { implicit = { min_tokens = 512 }, explicit = true }

[limit]
context = 204_800
output = 131_072

[api.messages]

[api.chat-completions]
base_url = "https://api.minimax.io/v1"
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/minimax/chat" }
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
base_url = "https://api.minimax.io/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/minimax/responses" }

[cost.text.input]
price = 0.3
cache = { read = 0.03, write = 0.375 }

[cost.text.output]
price = 1.2
