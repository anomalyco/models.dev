# Sources (accessed 2026-10-28):
# - API: POST https://api.minimax.io/v1/image_generation (https://platform.minimax.io/docs/api-reference/image-generation-t2i)
# - Pricing: https://platform.minimax.io/docs/pricing/overview#models/image ($0.0035 per image)
schema = 2
v2_only = true
base_model = "minimax/image-01"

[api.images]
base_url = "https://api.minimax.io/v1"
sdk = { aisdk = "none", opencodeai = "@opencode/ai/providers/minimax/images" }

[cost.image.output]
unit = "image"
price = 0.0035
