# knowledge = "2025-04" # Not listed on model page.
# Listed as retired; still answers for existing keys (checked 2026-10-19)
#   (https://platform.minimax.io/docs/faq/models). Prices are from before the model left the pricing page.
# Thinking is always on; thinking.type = disabled is accepted and ignored.
# Caching: cache_control (explicit) and, from M2.1, an automatic prefix cache from 512 input
#   tokens; M2 caches only with cache_control (checked live 2026-10-19).
# tools.updates: adding or removing a tool busts the cache (prefix order is tools, system, messages; live on api.minimax.io 2026-10-22).
schema = 2
name = "MiniMax-M2"
description = "Efficient open MiniMax model built for coding agents and tool-heavy workflows"
family = "minimax"
open_weights = true
release_date = "2025-10-27"
status = "deprecated"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = false
cache = { explicit = true }

[limit]
context = 204_800
output = 131_072

[cost.text.input]
price = 0.3

[cost.text.output]
price = 1.2
