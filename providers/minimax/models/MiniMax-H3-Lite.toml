# Sources (accessed 2026-11-12):
# - API: POST https://api.minimax.io/v2/video_generation (https://platform.minimax.io/docs/api-reference/video-generation-v2-create)
# - Pricing: https://platform.minimax.io/docs/pricing/overview#models/video (USD per second of output and of input video;
#   input images are billed per image after the first 5 per task)
#   USD per second: output 768P $0.04, 480P $0.025; input video 768P $0.04, 480P $0.025; input image $0.02 each after the first 5
# Not modeled: the free quota of 5 input images per task; audio input is free.
schema = 2
v2_only = true
base_model = "minimax/MiniMax-H3-Lite"

[api.videos]
base_url = "https://api.minimax.io"
path = "/v2/video_generation"
sdk = { aisdk = "none", opencodeai = "none" }

[cost.video.output]
unit = "second"
price = 0.04

[[cost.video.output.overrides]]
when = { resolution = { equals = "480P" } }
price = 0.025

[cost.video.input]
unit = "second"
price = 0.04

[[cost.video.input.overrides]]
when = { resolution = { equals = "480P" } }
price = 0.025

[cost.image.input]
unit = "image"
price = 0.02
