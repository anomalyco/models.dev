# Sources (reviewed 2026-11-09): https://jadai.freesrv.com/docs
#   Live mirror: https://gist.github.com/HKHOP/b9de716e077daedc7c07f10508df1155
#   Endpoint:      https://jadai.freesrv.com/v1 — /docs#endpoint; src/routes/openai.ts
#   Auth:          JAD_API_KEY, Authorization: Bearer jad_... — /docs#authentication
#   Model IDs:     jad-ai, jad-go, jad-code — /docs#models; src/ai/models.ts
#   Docs:          https://jadai.freesrv.com/docs
name = "Jad AI"
env = ["JAD_API_KEY"]
npm = "@ai-sdk/openai-compatible"
opencodeai = "@opencode/ai/providers/openai-compatible"
# OpenAI-compatible gateway: POST https://jadai.freesrv.com/v1/chat/completions.
# The three model IDs are Jad's curated routing pools, not upstream model names.
# Reasoning toggle is a request body field: "thinking": true | false (default true).
api = "https://jadai.freesrv.com/v1"
doc = "https://jadai.freesrv.com/docs"
