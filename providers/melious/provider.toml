# Melious AI GmbH relays open-weight models built by other labs on European
# infrastructure. It is not the lab for any model it serves, so every model entry
# here uses base_model. Raw HTTP is POST /v1/chat/completions; the OpenAI SDK works
# by pointing base_url at the API.
# Reasoning: two documented controls on POST /v1/chat/completions. `reasoning_effort`
# takes none|minimal|low|medium|high|xhigh|max and folds them to three levels before
# they reach the model (minimal -> low, xhigh and max -> high); `none` turns reasoning
# off. Only glm-5.3 / glm-5.3-flash receive xhigh and max as sent.
# `chat_template_kwargs = { "enable_thinking": false|true }` also switches reasoning
# off and on, and `reasoning_effort` wins when both are sent. No reasoning budget is
# forwarded, so no entry here uses `budget`. The host accepts any effort string
# without a 4xx, including undocumented ones, so acceptance is not evidence: levels
# come from each vendor API restricted to what this host forwards, and the off state
# is confirmed by usage.reasoning_tokens = 0 with no reasoning_content.
# Off is reachable through reasoning_effort, so an entry whose model has graded levels
# and a measured off state publishes `none` inside its effort list rather than a
# toggle; glm-5.3 and glm-5.3-flash are the exception -- `none` measures in their
# shallow band (1-17 / 1-27 reasoning tokens), not at 0, so they publish the lab's
# low/high/max only. Models with no graded level (kimi-k2.6, kimi-k2.7-code) publish
# `toggle` alone. The catalog's own reasoning_type is not a reliable guide for either
# the off state or the grades (models typed always-on accept an off switch, and typed
# hybrid ones ignore it), so every entry was measured on this deployment. Reasoning
# text is returned in choices[].message.reasoning_content.
# https://melious.ai/docs/reference/chat-completions#reasoning (accessed 2026-10-28)
# Decisions: Clef and Clef Flash are served on POST /v1/systemone, not chat
# completions. They bill input tokens only, reject image input, and run without
# caller reasoning control.
# https://melious.ai/docs/reference/systemone (accessed 2026-10-20)
# Routing: a flavour is selected with a model-ID suffix (`:balanced`, `:speed`,
# `:price`, `:eco`, `:batch`). A bare chat model ID resolves to `balanced`, which is
# what the ids and prices here describe; only bare ids are published. A `preset`
# field biases routing, not reasoning depth.
# https://melious.ai/docs/concepts/routing (accessed 2026-09-14)
# Caching: usage.cached_tokens are prompt tokens served from the prefix cache and
# are billed at a cheaper cache-read rate, recorded as cost.cache_read.
name = "Melious"
npm = "@ai-sdk/openai-compatible"
opencodeai = "@opencode/ai/providers/openai-compatible"
api = "https://api.melious.ai/v1"
env = ["MELIOUS_API_KEY"]
doc = "https://melious.ai/docs/reference/models"
