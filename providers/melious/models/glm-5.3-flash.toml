# Cost: Melious list price for the default `balanced` route -- EUR 0.10 in / EUR 0.40
# out / EUR 0.02 cache read per 1M tokens -- converted at 1.1150 USD/EUR (ECB euro
# reference rate, 2026-10-27; list prices re-checked against
# GET /v1/models?include_meta=true on 2026-10-28 and were unchanged).
# Sources: GET https://api.melious.ai/v1/models?include_meta=true and
# https://melious.ai/hub/models/glm-5.3-flash (both accessed 2026-09-14)
# FX: https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/eurofxref-graph-usd.en.html
# Effort: the lab's low/high/max (default max), which is also what this host
# forwards; medium and xhigh are not published because the lab has neither. `none`
# is accepted but is not an off state on this deployment (1-27 reasoning tokens, no
# 0-token sample), so it is not published either. Measured on 2026-10-28, 5 samples
# per level across an easy and a hard prompt: none (1-27) and low (1-36) sit in one
# shallow band, high stays at 12-27, while medium (211-3170) and max (210-532)
# reason -- so low/high are the shallow end of this host's ladder, published because
# they are the lab's levels. With no control sent the host reasons shallowly (18),
# not at the lab's max default, so no default is claimed.
# https://melious.ai/docs/reference/chat-completions#reasoning (accessed 2026-10-28)
# Reasoning text is returned in choices[].message.reasoning_content. cache_read:
# usage.cached_tokens are billed at Melious's discounted prefix-cache rate.
# modalities.input: this host routes ["text", "image", "video"], narrower than the
# lab's ["text", "image", "video", "pdf"].
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[modalities]
input = ["text", "image/jpeg", "image/png", "video/mp4", "video/x-matroska", "video/quicktime"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.1115
cache = { read = 0.0223 }

[cost.text.output]
price = 0.446
