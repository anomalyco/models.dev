# Cost: Melious lists EUR; converted at 1.17 USD/EUR (ECB reference rate, captured 2026-08-20).
# Sources: https://melious.ai/hub/models and
# GET https://api.melious.ai/v1/models?include_meta=true
# limit.output: no published cap; max_tokens = 262_144 is accepted on
# this host, verified against the live API.
# Effort: reasoning_effort = low|medium|high
# (https://melious.ai/docs/reference/chat-completions). No off state: an explicit
# "none" still returns reasoning, so this host exposes no toggle.
# Reasoning text comes back in message.reasoning_content.
base_model = "mistral/mistral-small-2603"
structured_output = true
reasoning_options = [{ type = "effort", values = ["low", "medium", "high"] }]

[cost]
input = 0.1755
output = 0.702

[limit]
context = 262_144
output = 262_144

[interleaved]
field = "reasoning_content"
