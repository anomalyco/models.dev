# Cost: Melious list price for the bare model ID -- the default `balanced` route
# -- EUR 0.20 in / EUR 1.00 out / EUR 0.05 cache read per 1M tokens, converted
# at 1.1592 USD/EUR (ECB euro reference rate, 2026-09-11).
# Sources: GET https://api.melious.ai/v1/models?include_meta=true and
# https://melious.ai/hub/models/muse-glimmer-30b (both accessed 2026-09-15)
# FX: https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/eurofxref-graph-usd.en.html
# Effort: reasoning_effort is the only reasoning control this host exposes, and
# it forwards no lab-native thinking field and no reasoning budget. Measured
# against this deployment on 2026-09-15, it has no effect on this model:
# reasoning_effort="none" still returns reasoning (reasoning_content
# 1222/1130/548 chars across three prompts), and none/low/medium/high produce no
# ordered difference (median 1130/1130/1130/1130 chars). reasoning_options is
# therefore [] -- this model reasons, with no caller control on this host. That
# is an affirmative measurement, not an untested default.
# https://melious.ai/docs/reference/chat-completions (accessed 2026-09-15)
# Reasoning text is returned in choices[].message.reasoning_content.
# cache_read: usage.cached_tokens are billed at Melious's discounted
# prefix-cache rate.
# limit.context: this deployment serves 128_000 tokens, not the lab's 131_072.
# limit.output: max_output_tokens is null for this model, so output is capped at
# the served context rather than inheriting the lab's larger 131_072.

base_model = "meta/muse-glimmer-30b"
reasoning_options = []

[cost]
input = 0.23184
output = 1.1592
cache_read = 0.05796

[limit]
context = 128_000
output = 128_000

[interleaved]
field = "reasoning_content"
