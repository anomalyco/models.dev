# Cost: Melious list price for the default `balanced` route -- EUR 0.60 in / EUR 2.40
# out / EUR 0.16 cache read per 1M tokens -- converted at 1.1592 USD/EUR (ECB euro
# reference rate, 2026-09-11).
# Sources: GET https://api.melious.ai/v1/models?include_meta=true and
# https://melious.ai/hub/models/deepseek-r1-0528 (both accessed 2026-09-14)
# FX: https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/eurofxref-graph-usd.en.html
# Effort: reasoning_effort, the only reasoning control this host exposes. It forwards
# no lab-native thinking field and has no reasoning budget, so no toggle or
# budget_tokens here. OpenRouter records no caller control for this model; that enum
# is not reachable through this API. The host accepts any effort string without a 4xx,
# so acceptance proves nothing; the values below are the documented ladder
# (low|medium|high) plus none, which was measured to be a real off state --
# reasoning_effort="none" returns usage.reasoning_tokens = 0 and no reasoning_content.
# Because none is reachable, this is an effort list with none rather than a toggle.
# minimal/xhigh/max are accepted but are undocumented and did not produce behaviour
# distinct from high, so they are not authored. Measured 2026-09-14 against
# api.melious.ai/v1/chat/completions on glm-5.3, deepseek-v4-pro and kimi-k2.7-code.
# https://melious.ai/docs/reference/chat-completions (accessed 2026-09-14)
# Reasoning text is returned in choices[].message.reasoning_content. cache_read:
# usage.cached_tokens are billed at Melious's discounted prefix-cache rate.
# limit.context: the catalog reports 164_000 for this deployment, not the lab's
# 128_000.
base_model = "deepseek/deepseek-r1"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high"] }]

[cost]
input = 0.69552
output = 2.78208
cache_read = 0.185472

[limit]
context = 164_000

[interleaved]
field = "reasoning_content"
