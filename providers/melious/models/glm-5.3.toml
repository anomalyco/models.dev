# Cost: Melious list price for the default `balanced` route -- EUR 1.00 in / EUR 3.00
# out / EUR 0.20 cache read per 1M tokens -- converted at 1.1150 USD/EUR (ECB euro
# reference rate, 2026-10-27; list prices re-checked against
# GET /v1/models?include_meta=true on 2026-10-28 and were unchanged).
# Sources: GET https://api.melious.ai/v1/models?include_meta=true and
# https://melious.ai/hub/models/glm-5.3 (both accessed 2026-09-14)
# FX: https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/eurofxref-graph-usd.en.html
# Effort: reasoning_effort is the only effort control this host exposes; it forwards no
# reasoning budget, so no budget_tokens. Off is reachable through the effort field
# (reasoning_effort="none") and through chat_template_kwargs = { enable_thinking =
# false }, with effort winning when both are sent -- so off lives in this effort list
# and there is no separate toggle.
# Levels: the endpoint accepts none, minimal, low, medium, high, xhigh and max, folds
# them to three before they reach the model (minimal -> low, xhigh and max -> high,
# none -> off) -- except on glm-5.3 and glm-5.3-flash, which receive xhigh and max as
# sent. Measured against this deployment on 2026-10-28, 8 samples per level across an
# easy and a hard prompt: none (1-17 reasoning tokens, 0-32 chars of reasoning_content)
# and low (1-30) are one and the same off state, high stays at 7-117 tokens and never
# above 288 chars, while the levels that actually reason are medium (388-6003), xhigh
# (484-5870) and max (553-1990) -- a clean gap, 117 vs 388, with no sample crossing it.
# low and high are therefore not published: they are accepted, but acceptance is not
# evidence, and here both behave like off. medium, xhigh and max are published as the
# documented levels that reason; they do not order against each other. With no control
# sent the host reasons shallowly (13-22 tokens), not like Z.ai's native max default,
# so no default is claimed.
# https://melious.ai/docs/reference/chat-completions#reasoning (accessed 2026-10-28)
# Reasoning text is returned in choices[].message.reasoning_content. cache_read:
# usage.cached_tokens are billed at Melious's discounted prefix-cache rate.
schema = 2
base_model = "zhipuai/glm-5.3"

[capabilities]
reasoning = { supported = true, effort = ["none", "medium", "xhigh", "max"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.115
cache = { read = 0.223 }

[cost.text.output]
price = 3.345
