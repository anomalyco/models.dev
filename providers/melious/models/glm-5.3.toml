# Cost: Melious list price for the default `balanced` route -- EUR 1.00 in / EUR 3.00
# out / EUR 0.20 cache read per 1M tokens -- converted at 1.1150 USD/EUR (ECB euro
# reference rate, 2026-10-27; list prices re-checked against
# GET /v1/models?include_meta=true on 2026-10-28 and were unchanged).
# Sources: GET https://api.melious.ai/v1/models?include_meta=true and
# https://melious.ai/hub/models/glm-5.3 (both accessed 2026-09-14)
# FX: https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/eurofxref-graph-usd.en.html
# Effort: the lab's low/high/max (default max), which is also what this host
# forwards; medium and xhigh are not published because the lab has neither. `none`
# is accepted but is not an off state on this deployment (1-17 reasoning tokens, no
# 0-token sample), so it is not published either. Measured on 2026-10-28, 8 samples
# per level across an easy and a hard prompt: none (1-17) and low (1-30) sit in one
# shallow band, high stays at 7-117, while medium (388-6003) and max (553-1990)
# reason -- so low/high are the shallow end of this host's ladder, published because
# they are the lab's levels. With no control sent the host reasons shallowly
# (13-22), not at the lab's max default, so no default is claimed.
# https://melious.ai/docs/reference/chat-completions#reasoning (accessed 2026-10-28)
# Reasoning text is returned in choices[].message.reasoning_content. cache_read:
# usage.cached_tokens are billed at Melious's discounted prefix-cache rate.
schema = 2
base_model = "zhipuai/glm-5.3"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.115
cache = { read = 0.223 }

[cost.text.output]
price = 3.345
