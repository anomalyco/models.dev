# Cost: Melious list price for the bare model ID -- the default `balanced` route
# -- EUR 0.40 in / EUR 2.00 out / EUR 0.10 cache read per 1M tokens, converted
# at 1.1592 USD/EUR (ECB euro reference rate, 2026-09-11).
# Sources: GET https://api.melious.ai/v1/models?include_meta=true and
# https://melious.ai/hub/models/minimax-m3 (both accessed 2026-09-15)
# FX: https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/eurofxref-graph-usd.en.html
# Effort: reasoning_effort is the only reasoning control this host exposes, and
# it forwards no lab-native thinking field and no reasoning budget, so no toggle
# or budget_tokens. Measured against this deployment on 2026-09-15 over six
# prompts with two repeats per level (n=12 per level): reasoning_effort="none"
# is a real off state -- usage.reasoning_tokens = 0 and no reasoning_content on
# all 12 samples. low, medium and high do not form a ladder: medians 262/345/263
# chars over ranges 115-675 / 115-602 / 153-704 that overlap almost entirely,
# with medium above high on 1 of 6 prompts. high exceeds low on 5 of 6 prompts
# here, but the two medians are 263 and 262 chars while medium sits above both,
# so there is no usable ordering. They are therefore not published as separate
# grades. Because off is reachable through the effort field this is an effort
# list containing none, not a toggle.
# https://melious.ai/docs/reference/chat-completions (accessed 2026-09-15)
# Reasoning text is returned in choices[].message.reasoning_content.
# cache_read: usage.cached_tokens are billed at Melious's discounted
# prefix-cache rate.
# limit.context: this deployment serves 1_000_000 tokens, not the lab's
# 1_048_576.

base_model = "minimax/MiniMax-M3"
reasoning_options = [{ type = "effort", values = ["none", "high"] }]

[cost]
input = 0.46368
output = 2.3184
cache_read = 0.11592

[limit]
context = 1_000_000

[interleaved]
field = "reasoning_content"
