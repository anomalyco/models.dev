# Cost: Melious list price for the bare model ID -- the default `balanced` route
# -- EUR 0.04 in / EUR 0.20 out per 1M tokens, converted at 1.1592 USD/EUR (ECB
# euro reference rate, 2026-09-11). The hub's per-flavour panel quotes EUR 0.15
# in / EUR 0.60 out for `balanced`; the models endpoint above is what the bare
# ID is billed at, so that is what is published here.
# Sources: GET https://api.melious.ai/v1/models?include_meta=true and
# https://melious.ai/hub/models/gpt-oss-120b (both accessed 2026-09-15)
# FX: https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/eurofxref-graph-usd.en.html
# Effort: reasoning_effort is the only reasoning control this host exposes, and
# it forwards no lab-native thinking field and no reasoning budget, so no toggle
# or budget_tokens. This is the one model on this deployment where the
# documented low/medium/high ladder really grades. Measured on 2026-09-15 over
# six prompts with two repeats per level (n=12 per level): median
# reasoning_content is 177 chars at low, 309 at medium and 647 at high; high
# exceeds low on 6 of 6 prompts and medium falls between the two on 6 of 6.
# "none" is not an off state (328 chars median, between low and medium), so it
# is not published as a value.
# https://melious.ai/docs/reference/chat-completions (accessed 2026-09-15)
# Reasoning text is returned in choices[].message.reasoning_content.

base_model = "openai/gpt-oss-120b"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high"] }]

[cost]
input = 0.046368
output = 0.23184

[interleaved]
field = "reasoning_content"
