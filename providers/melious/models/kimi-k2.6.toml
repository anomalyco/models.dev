# Cost: Melious list price for the default `balanced` route -- EUR 0.60 in / EUR 3.60
# out / EUR 0.15 cache read per 1M tokens -- converted at 1.1150 USD/EUR (ECB euro
# reference rate, 2026-10-27; prices re-checked against
# GET /v1/models?include_meta=true on 2026-10-28).
# Sources: GET https://api.melious.ai/v1/models?include_meta=true and
# https://melious.ai/hub/models/kimi-k2.6 (both accessed 2026-10-28)
# FX: https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/eurofxref-graph-usd.en.html
# Toggle: reasoning_effort = "none" turns reasoning off, any other value turns it on;
# chat_template_kwargs = { enable_thinking = false } does the same, and reasoning_effort
# wins when both are sent.
# No graded effort: the lab's control is the on/off Thinking / Instant pair, and the
# graded values do not order on this deployment (low 336-460, medium 238-261,
# high 192-388 reasoning tokens, overlapping both ways, same result on 2026-09-14).
# https://huggingface.co/moonshotai/Kimi-K2.6 (Thinking and Instant modes)
# https://melious.ai/docs/reference/chat-completions#reasoning (accessed 2026-10-28)
# Reasoning text is returned in choices[].message.reasoning_content. cache_read:
# usage.cached_tokens are billed at Melious's discounted prefix-cache rate.
# limit.context: the catalog reports 256_000 for this deployment, not the lab's
# 262_144. limit.output: max_output_tokens is null for this model, so output is capped
# at the served context rather than inheriting the lab's larger 262_144.
schema = 2
base_model = "moonshotai/kimi-k2.6"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
context = 256_000
output = 256_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.669
cache = { read = 0.16725 }

[cost.text.output]
price = 4.014
