# Cost: Melious list price for the bare model ID -- the default `balanced` route
# -- EUR 0.07 in / EUR 0.42 out / EUR 0.02 cache read per 1M tokens, converted
# at 1.1592 USD/EUR (ECB euro reference rate, 2026-09-11). The hub's per-flavour
# panel quotes EUR 0.20 in / EUR 0.60 out for `balanced`; the models endpoint
# above is what the bare ID is billed at, so that is what is published here.
# Sources: GET https://api.melious.ai/v1/models?include_meta=true and
# https://melious.ai/hub/models/qwen3-235b-a22b-instruct (both accessed 2026-09-15)
# FX: https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/eurofxref-graph-usd.en.html
# cache_read: usage.cached_tokens are billed at Melious's discounted
# prefix-cache rate.

base_model = "alibaba/qwen3-235b-a22b-instruct-2507"

[cost]
input = 0.081144
output = 0.486864
cache_read = 0.023184
