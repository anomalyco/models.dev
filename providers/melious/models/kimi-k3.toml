# Cost: Melious list price for the default `balanced` route -- EUR 2.85 in / EUR 14.25
# out / EUR 0.71 cache read per 1M tokens -- converted at 1.1150 USD/EUR (ECB euro
# reference rate, 2026-10-27; prices re-checked against
# GET /v1/models?include_meta=true on 2026-10-28). The cache-read list price moved
# from EUR 0.75 to EUR 0.71 since 2026-10-21.
# Sources: GET https://api.melious.ai/v1/models?include_meta=true and
# https://melious.ai/hub/models/kimi-k3 (both accessed 2026-10-28)
# FX: https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/eurofxref-graph-usd.en.html
# Effort: reasoning_effort is the only effort control this host exposes; it forwards
# no lab-native thinking field and no reasoning budget, so no toggle or budget_tokens.
# Off is reachable through the effort field (reasoning_effort="none") and through
# chat_template_kwargs = { enable_thinking = false }, with effort winning when both
# are sent -- so off lives in this effort list and there is no separate toggle. The HF
# card's own ladder is reasoning_effort = low|high|max with default max and no off, so
# it describes the lab's API rather than this relay, which honours the off state
# measured below. No default is recorded: the omitted field only shows that reasoning
# is on, not at which grade.
# Levels: the endpoint accepts none, minimal, low, medium, high, xhigh and max, folds
# them to three before they reach the model (minimal -> low, xhigh and max -> high,
# none -> off) and only glm-5.3 / glm-5.3-flash receive xhigh/max as sent. max is
# therefore not published: on a hard prompt it overlaps high without consistently
# exceeding it (1030-3621 vs 416-1999 reasoning tokens), which is what the documented
# fold predicts, and acceptance is not evidence.
# Measured against this deployment on 2026-10-28, 2 samples per level on a fixed
# trivial prompt plus the field omitted: none returns usage.reasoning_tokens = 0 with
# no reasoning_content (0/0), while low (109-124), medium (101-143), high (69-112) and
# the omitted default all reason, overlapping in both directions. A second fixed
# prompt that demands long reasoning keeps low lowest (50-366) but orders the rest by
# variance rather than by level: medium 3817/9919, max 1030/3621, high 416/1999 --
# medium measured above high, the same inversion the DeepSeek entries record.
# low/medium/high are therefore published as documented forwarded levels, not as an
# observed order. The same test on 2026-09-14 reached the same conclusion.
# https://huggingface.co/moonshotai/Kimi-K3 (reasoning_effort low|high|max, default max)
# https://melious.ai/docs/reference/chat-completions#reasoning (accessed 2026-10-28)
# Reasoning text is returned in choices[].message.reasoning_content. cache_read:
# usage.cached_tokens are billed at Melious's discounted prefix-cache rate.
# limit.context: the catalog reports 1_000_000 for this deployment, not the lab's
# 1_048_576.
schema = 2
base_model = "moonshotai/kimi-k3"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true

[limit]
context = 1_000_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 3.17775
cache = { read = 0.79165 }

[cost.text.output]
price = 15.88875
