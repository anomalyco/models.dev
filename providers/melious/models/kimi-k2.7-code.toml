# Cost: Melious list price for the default `balanced` route -- EUR 0.55 in / EUR 2.95
# out / EUR 0.15 cache read per 1M tokens -- converted at 1.1150 USD/EUR (ECB euro
# reference rate, 2026-10-27; prices re-checked against
# GET /v1/models?include_meta=true on 2026-10-28).
# Sources: GET https://api.melious.ai/v1/models?include_meta=true and
# https://melious.ai/hub/models/kimi-k2.7-code (both accessed 2026-10-28)
# FX: https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/eurofxref-graph-usd.en.html
# Toggle: reasoning_effort = "none" turns reasoning off on this host, any other value
# turns it on; chat_template_kwargs = { enable_thinking = false } does the same, and
# reasoning_effort wins when both are sent. The lab forces thinking on (no Instant
# mode), so the off state is this host's, measured at usage.reasoning_tokens = 0 with
# no reasoning_content.
# No graded effort: the values do not order on this deployment (low 56-101, medium
# 52-56, high 101-154 reasoning tokens).
# https://huggingface.co/moonshotai/Kimi-K2.7-Code (forced thinking, no instant mode)
# https://melious.ai/docs/reference/chat-completions#reasoning (accessed 2026-10-28)
# Reasoning text is returned in choices[].message.reasoning_content. cache_read:
# usage.cached_tokens are billed at Melious's discounted prefix-cache rate.
schema = 2
base_model = "moonshotai/kimi-k2.7-code"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.61325
cache = { read = 0.16725 }

[cost.text.output]
price = 3.28925
