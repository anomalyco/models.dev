# Cost: Melious list price for the bare model ID -- the default `balanced` route
# -- EUR 0.10 in / EUR 0.20 out / EUR 0.04 cache read per 1M tokens, converted
# at 1.1592 USD/EUR (ECB euro reference rate, 2026-09-11). The hub's per-flavour
# panel quotes EUR 0.15 in / EUR 0.20 out for `balanced`; the models endpoint
# above is what the bare ID is billed at, so that is what is published here.
# Sources: GET https://api.melious.ai/v1/models?include_meta=true and
# https://melious.ai/hub/models/qwen3.5-9b (both accessed 2026-09-15)
# FX: https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/eurofxref-graph-usd.en.html
# Effort: reasoning_effort is the only reasoning control this host exposes, and
# it forwards no lab-native thinking field and no reasoning budget. Measured
# against this deployment on 2026-09-15 over six prompts with two repeats per
# level (n=12 per level), it has no effect on this model:
# reasoning_effort="none" still returns reasoning (median 1321 chars, range
# 954-7953, never zero), and none/low/medium/high produce no ordered difference
# (medians 1321/1235/1234/1321, high above low on only 1 of 6 prompts).
# reasoning_options is therefore [] -- this model reasons, with no caller
# control on this host. That is an affirmative measurement, not an untested
# default.
# https://melious.ai/docs/reference/chat-completions (accessed 2026-09-15)
# Reasoning text is returned in choices[].message.reasoning_content.
# cache_read: usage.cached_tokens are billed at Melious's discounted
# prefix-cache rate.
# limit.context: this deployment serves 262_000 tokens, not the lab's 262_144.
# modalities.input: this host routes ["text", "image"], narrower than the lab's
# ["text", "image", "video"].

base_model = "alibaba/qwen3.5-9b"
reasoning_options = []

[cost]
input = 0.11592
output = 0.23184
cache_read = 0.046368

[limit]
context = 262_000

[modalities]
input = ["text", "image"]

[interleaved]
field = "reasoning_content"
