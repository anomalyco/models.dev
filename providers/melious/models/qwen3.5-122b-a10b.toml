# Cost: Melious list price for the bare model ID -- the default `balanced` route
# -- EUR 0.10 in / EUR 0.30 out / EUR 0.12 cache read per 1M tokens, converted
# at 1.1592 USD/EUR (ECB euro reference rate, 2026-09-11). The hub's per-flavour
# panel quotes EUR 0.22 in / EUR 1.98 out for `balanced`; the models endpoint
# above is what the bare ID is billed at, so that is what is published here.
# Sources: GET https://api.melious.ai/v1/models?include_meta=true and
# https://melious.ai/hub/models/qwen3.5-122b-a10b (both accessed 2026-09-15)
# FX: https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/eurofxref-graph-usd.en.html
# Effort: reasoning_effort is the only reasoning control this host exposes, and
# it forwards no lab-native thinking field and no reasoning budget, so no toggle
# or budget_tokens. Measured against this deployment on 2026-09-15 over six
# prompts with two repeats per level (n=12 per level): reasoning_effort="none"
# is a real off state -- usage.reasoning_tokens = 0 and no reasoning_content on
# all 12 samples. low, medium and high do not form a ladder: medians
# 1624/1741/1682 chars over ranges 1141-2703 / 1140-3370 / 1140-3110 that
# overlap almost entirely, with medium above high on 4 of 6 prompts. high does
# exceed low on all 6 prompts here, but by about 4% (median 1682 vs 1624) while
# medium exceeds high on 4 of them, so that is drift, not a caller-visible
# grade. Contrast gpt-oss-120b on this same host, where high is 3.7x low and
# medium falls between the two on every prompt. They are therefore not published
# as separate grades. Because off is reachable through the effort field this is
# an effort list containing none, not a toggle.
# https://melious.ai/docs/reference/chat-completions (accessed 2026-09-15)
# Reasoning text is returned in choices[].message.reasoning_content.
# cache_read: usage.cached_tokens are billed at Melious's discounted
# prefix-cache rate.
# limit.context: this deployment serves 262_000 tokens, not the lab's 262_144.
# modalities.input: this host routes ["text", "image"], narrower than the lab's
# ["text", "image", "video", "audio"].

base_model = "alibaba/qwen3.5-122b-a10b"
reasoning_options = [{ type = "effort", values = ["none", "high"] }]

[cost]
input = 0.11592
output = 0.34776
cache_read = 0.139104

[limit]
context = 262_000

[modalities]
input = ["text", "image"]

[interleaved]
field = "reasoning_content"
