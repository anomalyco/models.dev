# Cost: Melious list price for the bare model ID -- the default `balanced` route
# -- EUR 0.25 in / EUR 0.50 out per 1M tokens, converted at 1.1592 USD/EUR (ECB
# euro reference rate, 2026-09-11).
# Sources: GET https://api.melious.ai/v1/models?include_meta=true and
# https://melious.ai/hub/models/gemma-3-27b-it (both accessed 2026-09-15)
# FX: https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/eurofxref-graph-usd.en.html
# limit.context: this deployment serves 40_000 tokens, not the lab's 131_072.
# limit.output: max_output_tokens is null for this model, so output is capped at
# the served context rather than inheriting the lab's larger 131_072.

base_model = "google/gemma-3-27b-it"

[cost]
input = 0.2898
output = 0.5796

[limit]
context = 40_000
output = 40_000
