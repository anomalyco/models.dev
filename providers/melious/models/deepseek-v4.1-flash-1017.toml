# Cost: Melious list price for the default `balanced` route -- EUR 0.30 in / EUR 1.20
# out / EUR 0.03 cache read per 1M tokens -- converted at 1.1225 USD/EUR (ECB euro
# reference rate, 2026-10-19).
# Sources: GET https://api.melious.ai/v1/models?include_meta=true and
# https://melious.ai/hub/models/deepseek-v4.1-flash-1017 (both accessed 2026-10-19)
# FX: https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/eurofxref-graph-usd.en.html
# Effort: reasoning_effort is the only reasoning control this host exposes, and it
# forwards no lab-native thinking field and no reasoning budget, so no toggle or
# budget_tokens. This is the same Melious surface measured on 2026-09-14 for the
# earlier deepseek-v4.1-flash deployment: reasoning_effort="none" is a real off state
# (usage.reasoning_tokens = 0 and no reasoning_content), while low/medium/high all
# return reasoning with no ordered difference in depth, so they are not published as
# separate grades. The host also accepts undocumented values without a 4xx, so
# acceptance is not evidence. Because off is reachable through the effort field this
# is an effort list containing none, not a toggle.
# https://melious.ai/docs/reference/chat-completions (accessed 2026-10-19)
# Reasoning text is returned in choices[].message.reasoning_content. cache_read:
# usage.cached_tokens are billed at Melious's discounted prefix-cache rate.
base_model = "deepseek/deepseek-v4.1-flash-1017"
structured_output = true
reasoning_options = [{ type = "effort", values = ["none", "high"] }]

[cost]
input = 0.33675
output = 1.347
cache_read = 0.033675

[interleaved]
field = "reasoning_content"
