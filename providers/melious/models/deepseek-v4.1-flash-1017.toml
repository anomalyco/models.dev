# Cost: Melious list price for the default `balanced` route -- EUR 0.30 in / EUR 1.20
# out / EUR 0.03 cache read per 1M tokens -- converted at 1.1150 USD/EUR (ECB euro
# reference rate, 2026-10-27; list prices re-checked against
# GET /v1/models?include_meta=true on 2026-10-28 and were unchanged).
# Sources: GET https://api.melious.ai/v1/models?include_meta=true and
# https://melious.ai/hub/models/deepseek-v4.1-flash-1017 (both accessed 2026-10-19)
# FX: https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/eurofxref-graph-usd.en.html
# Effort: reasoning_effort is the host's only graded control; no reasoning budget is
# forwarded, so no budget_tokens. Published levels are the lab's low/high/max plus the
# host's off state `none`, which lives inside the effort list -- no toggle. The host
# folds max into high for this model (documented), so max is not a distinct depth here;
# it is kept to match the lab's level set.
# medium is not published: the lab maps it to high, and it does not separate here
# (87-151 vs 82-164, with low at 82-196, so all three overlap in one band).
# Measured on 2026-10-28, 3 samples per level: none returns
# usage.reasoning_tokens = 0 with no reasoning_content.
# https://melious.ai/docs/reference/chat-completions#reasoning (accessed 2026-10-28)
# Reasoning text is returned in choices[].message.reasoning_content. cache_read:
# usage.cached_tokens are billed at Melious's discounted prefix-cache rate.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.3345
cache = { read = 0.03345 }

[cost.text.output]
price = 1.338
