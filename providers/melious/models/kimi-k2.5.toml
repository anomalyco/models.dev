# Cost: converted from Melious's EUR list price for the default `balanced`
# route at 1.1535 USD/EUR (ECB euro reference rate, 2026-08-07).
# Sources: https://melious.ai/hub/models/kimi-k2.5 and https://melious.ai/pricing
# Limit: the hub states a 256000 served context but publishes no parameters.max_tokens,
# so output is capped at the served context rather than inheriting the lab's larger value.
base_model = "moonshotai/kimi-k2.5"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high"] }]

[cost]
input = 0.5767
output = 2.9414
cache_read = 0.1384

[limit]
context = 256_000
output = 256_000

[modalities]
input = ["text", "image"]
