# Cost: Melious list price for the default `balanced` route -- EUR 0.50 in / EUR 2.55
# out / EUR 0.12 cache read per 1M tokens -- converted at 1.1592 USD/EUR (ECB euro
# reference rate, 2026-09-11).
# Sources: GET https://api.melious.ai/v1/models?include_meta=true and
# https://melious.ai/hub/models/kimi-k2.5 (both accessed 2026-09-14)
# FX: https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/eurofxref-graph-usd.en.html
# Effort: reasoning_effort is the only reasoning control this host exposes, and it
# forwards no lab-native thinking field and no reasoning budget. Measured against this
# deployment on 2026-09-14, it has no effect on this model: reasoning_effort="none"
# still returns reasoning (reasoning_content 1_177/1_714/1_100 chars across repeat
# samples), and low/medium/high produce no ordered difference. reasoning_options is
# therefore [] -- this model reasons, with no caller control on this host. That is an
# affirmative measurement, not an untested default.
# https://melious.ai/docs/reference/chat-completions (accessed 2026-09-14)
# Reasoning text is returned in choices[].message.reasoning_content. cache_read:
# usage.cached_tokens are billed at Melious's discounted prefix-cache rate.
# limit.context: the catalog reports 262_000 for this deployment, not the lab's
# 262_144. limit.output: max_output_tokens is null for this model, so output is capped
# at the served context rather than inheriting the lab's larger 262_144.
# modalities.input: this host routes ["text", "image"], narrower than the lab's
# ["text", "image", "video"].
# Deprecated: no longer listed on https://melious.ai/hub/models (44 models, accessed
# 2026-10-21); its hub page no longer loads.
schema = 2
base_model = "moonshotai/kimi-k2.5"
status = "deprecated"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true

[limit]
context = 262_000
output = 262_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.5796
cache = { read = 0.139104 }

[cost.text.output]
price = 2.95596
