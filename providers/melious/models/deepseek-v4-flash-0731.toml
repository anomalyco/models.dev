# Cost: Melious list price for the default `balanced` route -- EUR 0.10 in / EUR 0.25
# out / EUR 0.02 cache read per 1M tokens -- converted at 1.1150 USD/EUR (ECB euro
# reference rate, 2026-10-27; list prices re-checked against
# GET /v1/models?include_meta=true on 2026-10-28 and were unchanged).
# Sources: GET https://api.melious.ai/v1/models?include_meta=true and
# https://melious.ai/hub/models/deepseek-v4-flash-0731 (both accessed 2026-09-14)
# FX: https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/eurofxref-graph-usd.en.html
# Effort: reasoning_effort is the only effort control this host exposes; it forwards no
# reasoning budget, so no budget_tokens. Off is reachable through the effort field
# (reasoning_effort="none") and through chat_template_kwargs = { enable_thinking =
# false }, with effort winning when both are sent -- so off lives in this effort list
# and there is no separate toggle.
# Levels: the endpoint accepts none, minimal, low, medium, high, xhigh and max, folds
# them to three before they reach the model (minimal -> low, xhigh and max -> high,
# none -> off) and only glm-5.3 / glm-5.3-flash receive xhigh/max as sent. xhigh and
# max are therefore not published for this model: acceptance is not evidence, and
# measured here max lands in high's own band (150-197 vs 163-261 reasoning tokens over
# 3 samples), which is what the documented fold predicts.
# Measured against this deployment on 2026-10-28, 3 samples per level, fixed prompt:
# none always returns usage.reasoning_tokens = 0 with no reasoning_content; low stays
# lowest (72-85); medium (175-241) and high (163-261) both run well above low but do
# not order against each other, so medium is published as a documented forwarded level,
# not as a measured step between low and high. With no control sent, reasoning is on
# (137-271 tokens).
# https://melious.ai/docs/reference/chat-completions#reasoning (accessed 2026-10-28)
# Reasoning text is returned in choices[].message.reasoning_content. cache_read:
# usage.cached_tokens are billed at Melious's discounted prefix-cache rate.
schema = 2
base_model = "deepseek/deepseek-v4-flash-0731"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.1115
cache = { read = 0.0223 }

[cost.text.output]
price = 0.27875
