# Reasoning control (verified against sference-platform, 2026-09-17):
# OpenAI Chat: POST https://api.sference.com/v1/chat/completions and
# Responses: POST https://api.sference.com/v1/responses.
# Toggle: enable_thinking = true|false — except the GLM-5.3 family
# (GLM-5.3, GLM-5.3-Flash, and the GLM-5.2 alias, which dispatches to
# GLM-5.3 weights): those checkpoints always reason and thinking-off
# requests are rejected with a 400, so they carry no toggle.
# Effort: reasoning_effort (chat) / reasoning.effort (responses); invalid
# values are rejected with a 400 listing the accepted enum
# none|minimal|low|medium|high|xhigh. Distinct levels per model:
# DeepSeek V4 family high|xhigh (xhigh collapses to max; lower levels
# enable thinking at the default depth), DeepSeek V4.1 low|high|xhigh
# (encoder aliases low=50 / high=75 / max=100 on its numeric 1-100
# reasoning budget, which it also accepts directly — the only model with
# a numeric budget; others refuse it with a 400), Kimi K3 and
# GLM-5.3-Flash low|high|xhigh (mapped onto template low|high|max).
# GLM-5.3 and GLM-5.2 have no effort control (levels accepted but
# ignored). Effort options are hand-authored per model because the public
# catalog does not surface which levels each model acts on.
# Sources:
# https://sference.com/docs/models
# https://sference.com/docs/quickstart
name = "sference"
env = ["SFERENCE_API_KEY"]
npm = "@ai-sdk/openai-compatible"
api = "https://api.sference.com/v1"
doc = "https://sference.com/docs/models"
