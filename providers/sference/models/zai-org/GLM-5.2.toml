# Synced from GET /v1/models. GLM-5.2 is an alias whose lane dispatches to
# GLM-5.3 weights, so it behaves like GLM-5.3: thinking cannot be disabled
# (thinking-off requests are rejected with a 400) and there is no effort
# control — reasoning_options is empty. Verified against sference-platform
# thinking_policy, 2026-09-17.
base_model = "zhipuai/glm-5.2"
name = "GLM 5.2"
reasoning_options = []

[interleaved]
field = "reasoning_content"

[cost]
input = 1.2
output = 4.2
cache_read = 0.26

[limit]
context = 1_048_576
