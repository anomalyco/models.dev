# Synced from GET /v1/models.
# Toggle: enable_thinking = true|false (verified live 2026-09-17: off → 200,
# no reasoning pass).
# Effort: reasoning_effort = low|high|xhigh (chat) / reasoning.effort
# (responses) — V4.1's encoder aliases low=50, high=75, max=100 on its numeric
# 1-100 reasoning budget (minimal→50, medium→75, xhigh→100), and also accepts
# an integer budget in [1, 100] directly (out of range → 400). Verified live
# 2026-09-17: budget 30 < low < xhigh produce distinct reasoning depths.
base_model = "deepseek/deepseek-v4.1-flash"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "xhigh"]

[cost]
input = 0.5
output = 1.5
cache_read = 0.05

[limit]
context = 1_048_576
