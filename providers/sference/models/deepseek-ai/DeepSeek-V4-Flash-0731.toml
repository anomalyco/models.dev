# Synced from GET /v1/models.
# Toggle: enable_thinking = true|false
# Effort: reasoning_effort = high|xhigh (chat) / reasoning.effort (responses) —
# the checkpoint encoder accepts max|high only (xhigh collapses to max); lower
# levels enable thinking at the default depth, so only high and xhigh are
# advertised. Verified against sference-platform, 2026-09-17.
base_model = "deepseek/deepseek-v4-flash-0731"
name = "DeepSeek V4 Flash (0731)"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["high", "xhigh"]

[cost]
input = 0.28
output = 0.56
cache_read = 0.07

[limit]
context = 1_048_576
