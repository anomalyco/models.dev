# Sources (accessed 2026-10-19):
# - Plan and supported models: https://docs.bigmodel.cn/cn/coding-plan/overview, https://docs.bigmodel.cn/cn/coding-plan/latest-model
# - Thinking (Coding Plan effort mapping): https://docs.bigmodel.cn/cn/guide/capabilities/thinking
# Subscription plan billed in credits, so no per-token cost.
# Effort: none|minimal|low map to low, medium|high to high, xhigh|max to max; disabling thinking maps to low.
# Tools: tool_choice supports only auto on Chat Completions and none|auto on Responses; no strict tool mode
#   (https://docs.bigmodel.cn/cn/guide/capabilities/function-calling, https://docs.bigmodel.cn/cn/guide/develop/responses/introduction),
#   so [api.responses] adds none. Messages documents no tool_choice.
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[capabilities]
tools = { supported = true, choice = ["auto"] }
reasoning = { supported = true, default = { type = "effort", value = "max" }, effort = ["low", "high", "max"] }
structured_output = true
top_k = false
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content", max_tokens_field = "max_tokens" }

[api.messages]
base_url = "https://open.bigmodel.cn/api/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/zai-coding-plan/messages" }

[api.responses]
base_url = "https://open.bigmodel.cn/api/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/zai-coding-plan/responses" }
capabilities = { tools = { choice = ["auto", "none"] } }

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
