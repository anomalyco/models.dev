# GLM-5.3 Highspeed is tier-gated on the coding endpoint: served as-is on
# eligible (higher) plan tiers, 403 "not available on plan" on lower tiers
# (#7331 tested a single lower tier). First-hand verified served via
# open.bigmodel.cn/api/coding/paas/v4 on 2026-09-17.
# https://docs.bigmodel.cn/cn/coding-plan/latest-model
base_model = "zhipuai/glm-5.3"
name = "GLM-5.3 Highspeed"

# Effort levels mirror the base GLM-5.3 (low, high, max).
[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 0
output = 0
cache_read = 0
cache_write = 0
