# Native Chat API (POST https://api.cohere.com/v2/chat), sources accessed 2026-10-19:
# - Parameters: https://docs.cohere.com/reference/chat (temperature, p, k; response_format; tool_choice
#   REQUIRED|NONE; strict_tools; thinking; system messages anywhere in `messages`; usage.cached_tokens)
# - Live probes (2026-10-19):
#   * A system message after an assistant turn returns 200 and stays in place (cached_tokens covers the
#     prefix before it) -> system_updates = true.
#   * Prompt prefixes are cached automatically (usage.cached_tokens), with no request field to control it
#     and no cache price; billed_units.input_tokens did not drop on cache hits.
#   * The API has no per-turn effort control -> effort_updates = false.
#   * Tools are a request-level list with no add/remove mechanism; adding a tool to an otherwise identical
#     request dropped cached_tokens (e.g. 6032 -> 112 on Command A) -> tools.updates = false.
# Structured output: https://docs.cohere.com/docs/structured-outputs; live response_format json_object +
#   json_schema returned schema-valid JSON.
# Reasoning (https://docs.cohere.com/docs/reasoning, https://docs.cohere.com/reference/chat):
# Toggle: thinking.type = "enabled" (default) | "disabled". Budget: thinking.token_budget (positive integer;
#   leave at least 1K tokens for the response). Live: switching thinking off between turns rewrote the
#   cached prefix (Command A Reasoning: 6144 -> 480 cached tokens; Command A+: 0 cached in 2/2 runs).
# Tools: tool_choice returns 400 "tool_choice is not supported for this model"; strict_tools = true is accepted.
# Pricing: $2.50/$10 per 1M as added on launch day (2026-06-09, models.dev commit 7b65a7c6d by Cohere's team).
#   Open question: https://cohere.com/pricing lists Command A+ under "Free" ("API key" $0, "Model download" $0)
#   since launch (Wayback captures 2026-06-14 through 2026-10-07); unchanged until Cohere confirms.
schema = 2
base_model = "cohere/command-a-plus-05-2026"

[capabilities]
tools = { supported = true, strict = true, choice = ["auto"], updates = false }
reasoning = { supported = true, default = { type = "toggle", value = true }, toggle = true, budget = { min = 1 } }
structured_output = true
system_updates = true
effort_updates = false
cache = { implicit = true }

[cost.text.input]
price = 2.5

[cost.text.output]
price = 10
