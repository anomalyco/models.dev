# Prices: https://inferris.ai/models.json (accessed 2026-11-06), USD per 1M tokens.
# Reasoning effort: Inferris forwards reasoning_effort (Chat Completions) and reasoning.effort, documented
# as model-dependent at https://inferris.ai/api-reference/chat-completions; the levels are the lab's.
# Context window: the Inferris gateway caps glm-5.3 at 131,072 tokens (its registry, read 2026-11-06); max output inherited from the lab.
schema = 2
base_model = "zhipuai/glm-5.3"

[limit]
context = 131_072

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }

[cost.text.input]
price = 0.84
cache = { read = 0.156 }

[cost.text.output]
price = 2.64
