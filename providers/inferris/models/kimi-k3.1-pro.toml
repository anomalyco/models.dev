# Prices: https://inferris.ai/models.json (accessed 2026-11-06), USD per 1M tokens.
schema = 2
base_model = "moonshotai/kimi-k3.1-pro"

# Text input only (models.json input_modalities). Reasoning is always on with no control
# (https://inferris.ai/api-reference/reasoning). Context window as the lab value (confirmed by Inferris 2026-11-06); max output inherited from the lab.
[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true }

[cost.text.input]
price = 1.2
cache = { read = 0.12 }

[cost.text.output]
price = 6.0
