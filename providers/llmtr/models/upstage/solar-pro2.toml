# Hand-authored from LLMTR's public catalog https://llmtr.com/api/models (accessed 2026-08-16).
# Effort: $.reasoning_effort
# Values follow the first-party Upstage baseline. LLMTR's gateway additionally
# accepts `low` and `medium` (its per-model 400 reads
# `Supported: minimal, low, medium, high`), but measured against
# POST /v1/chat/completions on 2026-08-16 they are not distinct controls:
# `minimal` and `low` both return no reasoning tokens, while `medium` and
# `high` both return them. Two real bands, so the baseline pair is authored
# rather than the wider accepted set.
base_model = "upstage/solar-pro2"

[cost]
input = 0.15
output = 0.6

[[reasoning_options]]
type = "effort"
values = ["minimal", "high"]
