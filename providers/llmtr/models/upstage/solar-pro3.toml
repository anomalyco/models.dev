# Hand-authored from LLMTR's public catalog https://llmtr.com/api/models (accessed 2026-08-16).
# Effort: $.reasoning_effort
# Values follow the first-party Upstage baseline. LLMTR's gateway additionally
# accepts `none` and `minimal` (its per-model 400 reads
# `Supported: none, minimal, low, medium, high`), but measured against
# POST /v1/chat/completions on 2026-08-16 they are not distinct controls:
# `none`, `minimal` and `low` all return no reasoning tokens, so they are three
# spellings of the same off path. `medium` and `high` both return reasoning.
schema = 2
base_model = "upstage/solar-pro3"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[cost.text.input]
price = 0.15

[cost.text.output]
price = 0.6
