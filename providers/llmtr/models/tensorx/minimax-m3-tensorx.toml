# Generated by bun models:sync llmtr from https://llmtr.com/v1/models.
# Prices are USD per million tokens; lab facts are inherited via base_model.
# Reasoning is always on; LLMTR exposes no control for this route.
schema = 2
base_model = "minimax/MiniMax-M3"
name = "MiniMax-M3 (TensorX)"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = false

[cost.text.input]
price = 0.4
cache = { read = 0.1 }

[cost.text.output]
price = 2
