# Generated by bun models:sync llmtr from https://llmtr.com/v1/models.
# Prices are USD per million tokens; lab facts are inherited via base_model.
# Reasoning is always on; LLMTR exposes no control for this route.
schema = 2
base_model = "moonshotai/kimi-k3"
name = "Kimi K3 (TensorX)"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = false
temperature = true

[cost.text.input]
price = 3
cache = { read = 0.75 }

[cost.text.output]
price = 15
