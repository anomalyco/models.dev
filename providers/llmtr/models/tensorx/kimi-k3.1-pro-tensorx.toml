# Generated by bun models:sync llmtr from https://llmtr.com/v1/models.
# Prices are USD per million tokens; lab facts are inherited via base_model.
# Effort: reasoning_effort = low|high|max
schema = 2
base_model = "moonshotai/kimi-k3.1-pro"
name = "Kimi K3.1 Pro (TensorX)"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = false
temperature = true

[cost.text.input]
price = 3
cache = { read = 0.75 }

[cost.text.output]
price = 15
