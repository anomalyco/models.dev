# Prices and limits from https://llmtr.com/v1/models; lab facts are inherited via base_model.
# Reasoning measured against POST https://llmtr.com/v1/chat/completions (2026-10-22).
# Measured: no reasoning by default or with prompt_mode = "reasoning"; reasoning_effort -> 400 "does not expose a thinking mode".
schema = 2
base_model = "mistral/mistral-medium-3-5"
name = "Mistral Medium 3.5 (GreenPT)"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = false }
structured_output = false

[limit]
context = 180_000
output = 16_384

[cost.text.input]
price = 2.216743

[cost.text.output]
price = 11.083716
