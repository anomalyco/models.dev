# Prices and limits from https://llmtr.com/v1/models; lab facts are inherited via base_model.
# Reasoning measured against POST https://llmtr.com/v1/chat/completions (2026-10-22).
# Toggle: $.thinking.type = enabled|disabled (DeepSeek native field, forwarded by the gateway).
# Measured: reasons by default; thinking.type = disabled -> no reasoning.
# reasoning_effort -> 400 "reasoning level cannot be set", so no effort is listed.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"
name = "DeepSeek V4.1 Flash (GreenPT)"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = false

[cost.text.input]
price = 0.270935
cache = { read = 0.013547 }

[cost.text.output]
price = 1.354676
