# Prices and limits from https://llmtr.com/v1/models; lab facts are inherited via base_model.
# Reasoning measured against POST https://llmtr.com/v1/chat/completions (2026-10-22).
# Measured: no reasoning by default; enable_thinking = true and thinking_budget are rejected
# upstream (400); reasoning_effort -> 400 "reasoning level cannot be set".
schema = 2
base_model = "alibaba/qwen-plus"

[capabilities]
reasoning = { supported = false }
structured_output = false

[cost.text.input]
price = 0.4

[cost.text.output]
price = 1.2
