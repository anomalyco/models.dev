# Hand-authored from LLMTR's public catalog https://llmtr.com/api/models (accessed 2026-08-16).
# reasoning_options measured against POST https://llmtr.com/v1/chat/completions (2026-08-16).
# Toggle: $.enable_thinking = true|false (Alibaba native field, forwarded by the gateway).
# reasoning is overridden to true: this route does emit reasoning on demand even though the base
# entry has reasoning = false. Measured 2026-08-16 - default and enable_thinking=false emit no
# reasoning_content, enable_thinking=true emits ~256-286 reasoning tokens (reproduced 3x).
# reasoning_effort is rejected here with "does not expose a thinking mode", which is exactly why
# an effort-only probe missed this control.
base_model = "alibaba/qwen3-max"
reasoning = true

[cost]
input = 1.2
output = 6

[limit]
context = 256_000

[[reasoning_options]]
type = "toggle"
