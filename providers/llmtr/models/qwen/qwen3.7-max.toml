# Prices and limits from https://llmtr.com/v1/models; lab facts are inherited via base_model.
# Reasoning measured against POST https://llmtr.com/v1/chat/completions (2026-10-22).
# Toggle: $.enable_thinking = true|false (Alibaba native field, forwarded by the gateway).
# Budget: $.thinking_budget (integer reasoning tokens).
# Measured: thinking_budget 64 -> 64 reasoning tokens; enable_thinking = false and the gateway's
# $.reasoning = false both turn reasoning off.
schema = 2
base_model = "alibaba/qwen3.7-max"

[capabilities]
reasoning = { supported = true, toggle = true, budget = {} }
structured_output = false

[limit]
context = 256_000

[cost.text.input]
price = 2.5

[cost.text.output]
price = 7.5
