# Hand-authored from LLMTR's public catalog https://llmtr.com/api/models (accessed 2026-08-16).
# reasoning_options measured against POST https://llmtr.com/v1/chat/completions (2026-08-16).
# Toggle: $.enable_thinking = true|false (Alibaba native field, forwarded by the gateway).
# Measured: thinking is on by default (~750-854 reasoning tokens) and enable_thinking=false switches it off (reproduced). $.reasoning, :think/:fast and reasoning_effort are inert or rejected here.
base_model = "alibaba/qwen3.6-plus"

[cost]
input = 0.5
output = 3

[[reasoning_options]]
type = "toggle"
