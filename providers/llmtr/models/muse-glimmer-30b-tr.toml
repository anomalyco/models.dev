# Limits, modalities and pricing from https://llmtr.com/api/models (accessed
# 2026-08-16). Tool calling verified against POST /v1/chat/completions on the
# same date. Reasoning is on by default here: a plain request already returns
# reasoning output, and `reasoning: true` keeps it on. LLMTR advertises no
# graded effort levels for this route, so the control is a plain toggle.
# Toggle: reasoning = true|false
name = "Muse Glimmer 30B (TR)"
description = "Turkey-hosted 128K vision model for agent and reasoning work under data residency"
release_date = "2026-08-14"
last_updated = "2026-08-16"
attachment = true
reasoning = true
temperature = true
tool_call = true
open_weights = false
reasoning_options = [{ type = "toggle" }]

[cost]
input = 2.0
output = 5.0
cache_read = 0.5

[limit]
context = 131_072
output = 131_072

[modalities]
input = ["text", "image"]
output = ["text"]
