# Prices and limits from https://llmtr.com/v1/models; lab facts are inherited via base_model.
# Reasoning measured against POST https://llmtr.com/v1/chat/completions (2026-10-22).
# Measured: no reasoning tokens by default; reasoning_effort and reasoning.effort -> 400
# "does not expose a thinking mode".
schema = 2
base_model = "openai/gpt-5.1"
base_model_omit = ["limit.input"]

[capabilities]
reasoning = { supported = false }
structured_output = true

[limit]
context = 128_000

[cost.text.input]
price = 1.25

[cost.text.output]
price = 10
