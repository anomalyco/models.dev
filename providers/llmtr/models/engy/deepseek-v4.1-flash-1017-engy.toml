# Prices and limits from https://llmtr.com/v1/models; lab facts are inherited via base_model.
# Reasoning measured against POST https://llmtr.com/v1/chat/completions (2026-10-22).
# Toggle: $.reasoning = true|false (or the :think suffix); $.thinking.type is forwarded and works too.
# Measured: reasons by default; thinking.type = disabled -> no reasoning; reasoning_effort -> 400 (on/off only).
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"
name = "DeepSeek V4.1 Flash 1017 (engy)"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = false

[limit]
context = 1_048_576

[cost.text.input]
price = 0.04
cache = { read = 0.008 }

[cost.text.output]
price = 0.08
