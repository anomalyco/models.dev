# Generated by bun models:sync llmtr from https://llmtr.com/v1/models.
# Prices are USD per million tokens; lab facts are inherited via base_model.
# Effort: reasoning_effort = minimal|low|medium|high|xhigh
schema = 2
base_model = "meta/muse-spark-1.3"
name = "Muse Spark 1.3 Contributor"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "video/mp4", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh"] }
structured_output = true

[cost.text.input]
price = 0.1
cache = { read = 0.002 }

[cost.text.output]
price = 0.2
