# Prices: GET https://vibetoken.cn/api/models/deepseek/deepseek-v4-flash/pricing (2026-10-30), what the host charges:
# input/output = list x (1 - discount); cache reads and writes bill at list.
# CNY converted to USD at 1 CNY = 0.15011 USD (ECB reference rate, 2026-10-29).
# Off-peak hours bill lower; the standard (peak) rate is listed.
# Toggle: thinking.type = enabled|disabled (tested 2026-09-29 on the upstream
# route VibeToken forwards these fields to unchanged: reasons by default,
# `thinking.type = "disabled"` turns it off; `reasoning_effort = "none"` does
# not)
# Effort: reasoning_effort = low|high|max, as in the lab entry (forwarded
# unchanged)
schema = 2
base_model = "deepseek/deepseek-v4-flash"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.15011
cache = { read = 0.006004 }

[cost.text.output]
price = 0.60044
