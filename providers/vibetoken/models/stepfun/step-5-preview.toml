# Prices: GET https://vibetoken.cn/api/models/stepfun/step-5-preview/pricing (2026-10-30), what the host charges:
# input/output = list x (1 - discount); cache reads and writes bill at list.
# CNY converted to USD at 1 CNY = 0.15011 USD (ECB reference rate, 2026-10-29).
# Same upstream controls as providers/novita-ai/models/stepfun/step-5-preview.toml (VibeToken forwards them unchanged):
# Effort: reasoning_effort = low|medium|high (native baseline)
schema = 2
base_model = "stepfun/step-5-preview"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[limit]
output = 64_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.945693
cache = { read = 0.105077 }

[cost.text.output]
price = 2.70198
