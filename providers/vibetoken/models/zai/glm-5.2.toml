# Prices: GET https://vibetoken.cn/api/models/zai/glm-5.2/pricing (2026-10-30), what the host charges:
# input/output = list x (1 - discount); cache reads and writes bill at list.
# CNY converted to USD at 1 CNY = 0.15011 USD (ECB reference rate, 2026-10-29).
# Same upstream controls as providers/novita-ai/models/zai-org/glm-5.2.toml (VibeToken forwards them unchanged):
# Effort: reasoning_effort = none|high|max; none suppresses reasoning. Native graded baseline retained.
schema = 2
base_model = "zhipuai/glm-5.2"

[capabilities]
reasoning = { supported = true, effort = ["none", "high", "max"] }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.140836
cache = { read = 0.30022 }

[cost.text.output]
price = 3.992926
