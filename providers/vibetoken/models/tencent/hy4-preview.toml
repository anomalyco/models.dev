# Prices: GET https://vibetoken.cn/api/models/tencent/hy4-preview/pricing (2026-10-30), what the host charges:
# input/output = list x (1 - discount); cache reads and writes bill at list.
# CNY converted to USD at 1 CNY = 0.15011 USD (ECB reference rate, 2026-10-29).
# Same upstream controls as providers/novita-ai/models/tencent/hy4-preview.toml (VibeToken forwards them unchanged):
# Effort: reasoning_effort = none|high; none suppresses reasoning. Native effort baseline retained; accepted aliases are not additional distinct levels.
schema = 2
base_model = "tencent/hy4-preview"

[capabilities]
reasoning = { supported = true, effort = ["none", "high"] }

[limit]
context = 1_000_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.810594
cache = { read = 0.045033 }

[cost.text.output]
price = 2.431782
