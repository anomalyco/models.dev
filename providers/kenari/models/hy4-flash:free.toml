# Source: https://kenari.id/v1/models and https://kenari.id/api/public/pricing (accessed 2026-11-16).
# Price: :free models cost Rp 0 within daily and per-minute limits (https://kenari.id/en/docs/free-models).
# Reasoning: kenari publishes no reasoning_options for this id (reasoning true, reasoning_toggle false), so the baseline is the
#   lab's native set: reasoning_effort = none|high, as on providers/vercel/models/tencent/hy4-flash.toml and
#   providers/crossmodel/models/tencent/hy4-flash.toml (Novita probe 2026-11-16: none disables, bad values 400). Kenari docs: https://kenari.id/en/docs/reasoning.
# Effort: reasoning_effort (Chat completions), reasoning.effort (Responses), output_config.effort (Messages).
# Off: reasoning_effort = none (listed level), so no separate toggle.
schema = 2
base_model = "tencent/hy4-flash"
family = "hy-flash-free"
name = "Hy4 flash (Free)"

[capabilities]
reasoning = { supported = true, effort = ["none", "high"] }

[cost.text.input]
price = 0

[cost.text.output]
price = 0
