# Source: https://kenari.id/v1/models and https://kenari.id/api/public/pricing (accessed 2026-10-21).
# Price: per generated image (pricing_lines output_image, Rp 350), / 17,500 IDR per USD.
# kenari publishes no reasoning options for this id; the baseline is the model's
# own lab entry (providers/google/models/gemini-3-pro-image.toml), per AGENTS.md.
schema = 2
base_model = "google/gemini-3-pro-image"

[capabilities]
reasoning = { supported = true, effort = ["low", "high"] }

[cost.image.output]
unit = "image"
price = 0.02
