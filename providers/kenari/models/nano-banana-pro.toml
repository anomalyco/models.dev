# Kenari relay of google/gemini-3-pro-image - authored 2026-10-11 from the provider's public API:
#   https://kenari.id/v1/models          (capabilities, context, reasoning options)
#   https://kenari.id/api/public/pricing  (prices; usd_idr_rate = 17500)
# IDR prices were converted to USD per 1M tokens by dividing by that rate.
# Billed per unit, not per token, so the per-token `cost` above is 0:
#   USD 0.02 per output image - output_image on the images endpoint
# kenari publishes no reasoning options for this id; the baseline is the model's
# own lab entry (providers/google/models/gemini-3-pro-image.toml), per AGENTS.md.
base_model = "google/gemini-3-pro-image"

[[reasoning_options]]
type = "effort"
values = ["low", "high"]

[cost]
input = 0
output = 0
