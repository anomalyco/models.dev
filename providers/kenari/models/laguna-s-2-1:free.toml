# Source: https://kenari.id/v1/models and https://kenari.id/api/public/pricing (accessed 2026-10-23).
# Price: :free models cost Rp 0 (https://kenari.id/en/docs/free-models).
# Reasoning: the catalog lists no reasoning fields for this id. With no listed levels kenari
#   sends the requested reasoning_effort unchanged (https://kenari.id/en/docs/reasoning), so the
#   effort list is the native one (providers/kilo/models/poolside/laguna-s-2.1.toml: none|high).
#   No toggle: reasoning_toggle is false.
schema = 2
base_model = "poolside/laguna-s-2.1"
name = "Laguna S 2.1 (Free)"

[limit]
# catalog context_length for this id is 262_144 (/v1/models); the base says 1_048_576
context = 262_144

[capabilities]
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = true

[cost.text.input]
price = 0

[cost.text.output]
price = 0
