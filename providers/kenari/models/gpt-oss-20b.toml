# Lab: openai/gpt-oss-20b (catalog owned_by openai, id gpt-oss-20b).
# Source: https://kenari.id/v1/models and https://kenari.id/api/public/pricing (accessed 2026-10-21).
# Price: PAYG per token, micro-IDR per 1M / 1e6 / 17,500 IDR per USD (usd_idr_rate in /api/public/pricing), rounded to 8 decimals.
# Reasoning: catalog reasoning_options ["low","medium","high"], reasoning_toggle true (https://kenari.id/en/docs/reasoning).
# Effort: reasoning_effort (Chat completions), reasoning.effort (Responses), output_config.effort (Messages).
# Toggle: reasoning = { enabled = false } on Chat completions (needs reasoning_toggle = true).
schema = 2
base_model = "openai/gpt-oss-20b"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high"] }

[cost.text.input]
price = 0.036
cache = { read = 0.00371429 }

[cost.text.output]
price = 0.15428571
