# Source: https://kenari.id/v1/models and https://kenari.id/api/public/pricing (accessed 2026-10-21).
# Price: per generated image (pricing_lines output_image, Rp 150), / 17,500 IDR per USD.
# kenari publishes no reasoning options for this id; the baseline is the model's
# own lab entry (providers/google/models/gemini-3.1-flash-lite-image.toml), per AGENTS.md.
# Images: POST /v1/images/generations (https://kenari.id/en/docs/images)
schema = 2
base_model = "google/gemini-3.1-flash-lite-image"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "high"] }
structured_output = false

[api.images]
sdk = { opencodeai = "@opencode/ai/providers/openai-compatible/images" }

[cost.image.output]
unit = "image"
price = 0.00857143
