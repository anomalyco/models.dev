# Kenari relay of alibaba/qwen3.8-max - authored 2026-10-02 from the provider's public API:
#   https://kenari.id/v1/models          (capabilities, context, reasoning options)
#   https://kenari.id/api/public/pricing  (prices; usd_idr_rate = 17500)
# IDR prices were converted to USD per 1M tokens by dividing by that rate.
# kenari publishes no reasoning options for this id; the baseline was copied
# from the same lab model on alibaba (providers/alibaba/models/qwen3.8-max.toml), per AGENTS.md.
# Toggle: enable_thinking true|false (hybrid)
# Effort: reasoning_effort = low|medium|xhigh (default xhigh); high accepted as alias → xhigh
# Budget: thinking_budget (0..262144) cannot be combined with reasoning_effort
base_model = "alibaba/qwen3.8-max"

reasoning_options = [
  { type = "toggle" },
  { type = "effort", values = ["low", "medium", "xhigh"] },
  { type = "budget_tokens", min = 0, max = 262144 },
]

[cost]
input = 2.4
output = 6.86
cache_read = 0.2971
cache_write = 2.97

[modalities]
input = ["text"]
