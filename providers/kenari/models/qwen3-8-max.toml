# Source: https://kenari.id/v1/models and https://kenari.id/api/public/pricing (accessed 2026-10-21).
# Price: PAYG per token, micro-IDR per 1M / 1e6 / 17,500 IDR per USD (usd_idr_rate in /api/public/pricing), rounded to 8 decimals.
# Reasoning: the catalog lists no reasoning fields for this id. With no listed levels Kenari sends the requested
#   reasoning_effort unchanged (https://kenari.id/en/docs/reasoning), so the effort list is the native Alibaba one
#   (providers/alibaba/models/qwen3.8-max.toml: low|medium|xhigh). No toggle: reasoning_toggle is false. No budget:
#   reasoning.max_tokens "may be ignored" by level-based models, per the same page.
schema = 2
base_model = "alibaba/qwen3.8-max"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "xhigh"] }

[cost.text.input]
price = 2.4
cache = { read = 0.29714286, write = 2.97142857 }

[cost.text.output]
price = 6.85714286
