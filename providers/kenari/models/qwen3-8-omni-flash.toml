# Source: https://kenari.id/v1/models and https://kenari.id/api/public/pricing (accessed 2026-10-23).
# Price: PAYG per token, micro-IDR per 1M / 1e6 / 17,500 IDR per USD (usd_idr_rate in /api/public/pricing), rounded to 8 decimals.
# Reasoning: the catalog lists no reasoning fields for this id. With no listed levels kenari
#   sends the requested reasoning_effort unchanged (https://kenari.id/en/docs/reasoning), so the
#   effort list is the native one (providers/alibaba/models/qwen3.8-omni-flash.toml: none|low|medium|xhigh).
#   No toggle: reasoning_toggle is false.
schema = 2
base_model = "alibaba/qwen3.8-omni-flash"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "xhigh"] }
structured_output = true

[cost.text.input]
price = 0.14285714
cache = { read = 0.01428571 }

[cost.text.output]
price = 0.42857143
