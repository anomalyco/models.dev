# Source: https://kenari.id/v1/models and https://kenari.id/api/public/pricing (accessed 2026-11-16).
# Price: PAYG per token, micro-IDR per 1M / 1e6 / 17,500 IDR per USD (usd_idr_rate in /api/public/pricing), rounded to 8 decimals.
# Reasoning: catalog reasoning_options ["minimal","low","medium","high","xhigh","max"], reasoning_toggle false (https://kenari.id/en/docs/reasoning).
#   Narrowed to minimal..xhigh: Meta documents max for the Standard tier only (providers/meta/models/muse-spark-1.3-contributor.toml), and `max` was not probed here.
# Effort: reasoning_effort (Chat completions), reasoning.effort (Responses), output_config.effort (Messages).
# Modalities: kenari lists text, image, video, pdf and file input, no audio (lab lists audio/mpeg and audio/wav).
schema = 2
base_model = "meta/muse-spark-1.3"
name = "Muse Spark 1.3 Contributor"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "video/mp4", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh"] }

[cost.text.input]
price = 0.11428571
cache = { read = 0.01142857 }

[cost.text.output]
price = 0.22857143
