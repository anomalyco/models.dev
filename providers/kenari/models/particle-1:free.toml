# Source: https://kenari.id/v1/models and https://kenari.id/api/public/pricing (accessed 2026-11-16).
# Price: :free models cost Rp 0 within daily and per-minute limits (https://kenari.id/en/docs/free-models).
# Reasoning: catalog reasoning_options ["none","minimal","low","medium","high","xhigh","max"], reasoning_toggle false (https://kenari.id/en/docs/reasoning).
#   Particle's native ladder is none|low|high|max (https://docs.particle.ai/reasoning); kenari maps the other levels onto it.
# Effort: reasoning_effort (Chat completions), reasoning.effort (Responses), output_config.effort (Messages).
# Off: reasoning_effort = none (listed level), so no separate toggle.
schema = 2
base_model = "particle-ai/particle-1"
name = "Particle-1 (Free)"

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }

[cost.text.input]
price = 0

[cost.text.output]
price = 0
