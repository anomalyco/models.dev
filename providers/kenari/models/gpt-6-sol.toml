# Source: https://kenari.id/v1/models and https://kenari.id/api/public/pricing (accessed 2026-10-23).
# Price: PAYG per token, micro-IDR per 1M / 1e6 / 17,500 IDR per USD (usd_idr_rate in /api/public/pricing), rounded to 8 decimals.
# Reasoning: catalog reasoning_options ["none", "low", "medium", "high", "xhigh", "max"], reasoning_toggle false (https://kenari.id/en/docs/reasoning).
# Effort: reasoning_effort (Chat completions), reasoning.effort (Responses), output_config.effort (Messages).
# Off: reasoning_effort = none (listed level), so no separate toggle.
schema = 2
base_model = "openai/gpt-6-sol"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[cost.text.input]
price = 2.28571429
cache = { read = 0.22857143, write = 2.28571429 }

[cost.text.output]
price = 11.42857143
