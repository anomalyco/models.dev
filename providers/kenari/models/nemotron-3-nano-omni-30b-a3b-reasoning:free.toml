# Source: https://kenari.id/v1/models and https://kenari.id/api/public/pricing (accessed 2026-10-23).
# Price: :free models cost Rp 0 (https://kenari.id/en/docs/free-models).
# Reasoning: the catalog carries no controls for this id, so the entry describes the model:
#   The same-base entry on Requesty authors the model's five native levels, and an empty
#   catalog row describes kenari's translation rather than the model's own controls.
#   No toggle: the model exposes a graded effort rather than an on/off switch.
# Levels: ["none", "low", "medium", "high", "max"] (providers/requesty/models/nemotron-3-nano-omni-30b-a3b-reasoning.toml).
# Effort: reasoning_effort (Chat completions), reasoning.effort (Responses), output_config.effort (Messages).
# Off: reasoning_effort = none (listed level), so no separate toggle.
schema = 2
base_model = "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"
name = "Nemotron 3 Nano Omni 30B A3B Reasoning (Free)"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"] }
structured_output = true

[cost.text.input]
price = 0

[cost.text.output]
price = 0
