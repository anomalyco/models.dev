# Source: https://kenari.id/v1/models and https://kenari.id/api/public/pricing (accessed 2026-10-23).
# Price: :free models cost Rp 0 (https://kenari.id/en/docs/free-models).
# Reasoning: catalog reasoning_options ["none", "low", "high", "max"], reasoning_toggle false (https://kenari.id/en/docs/reasoning).
# Effort: reasoning_effort (Chat completions), reasoning.effort (Responses), output_config.effort (Messages).
# Off: reasoning_effort = none (listed level), so no separate toggle.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true

[cost.text.input]
price = 0

[cost.text.output]
price = 0
