# Source: https://kenari.id/v1/models and https://kenari.id/api/public/pricing (accessed 2026-10-23).
# Price: :free models cost Rp 0 (https://kenari.id/en/docs/free-models).
# Reasoning: catalog reasoning_options ["none", "medium", "high"], reasoning_toggle false (https://kenari.id/en/docs/reasoning).
# Effort: reasoning_effort (Chat completions), reasoning.effort (Responses), output_config.effort (Messages).
# Off: reasoning_effort = none (listed level), so no separate toggle.
# Lane: /v1/models lists reasoning_options ["none","medium","high"] for both this id and the paid
#   `nemotron-3-ultra-550b-a55b`; only reasoning_toggle differs (false here, true on the paid lane).
#   So this file authors the levels and no toggle. The paid file predates this PR and authors
#   toggle-only, which disagrees with its own catalog row's levels.
schema = 2
base_model = "nvidia/nemotron-3-ultra-550b-a55b"

[capabilities]
reasoning = { supported = true, effort = ["none", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 0

[cost.text.output]
price = 0
