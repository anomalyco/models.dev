# Source: https://kenari.id/v1/models and https://kenari.id/api/public/pricing (accessed 2026-11-16).
# Price: PAYG per token, micro-IDR per 1M / 1e6 / 17,500 IDR per USD (usd_idr_rate in /api/public/pricing), rounded to 8 decimals.
# Reasoning: kenari publishes no reasoning_options for this id (reasoning_toggle false), so the baseline is Muse Wonder 1.0's
#   documented levels (providers/meta/models/muse-wonder-1.0.toml): minimal|low|medium|high|xhigh|max (https://kenari.id/en/docs/reasoning).
# Effort: reasoning_effort (Chat completions), reasoning.effort (Responses), output_config.effort (Messages).
# Modalities: kenari lists text, image, pdf and file input only (lab also lists video and audio).
# Output: max_output_tokens 131,072 per /v1/models (the lab states no output limit).
schema = 2
base_model = "meta/muse-wonder-full"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh", "max"] }

[limit]
output = 131_072

[cost.text.input]
price = 4.8
cache = { read = 0.24 }

[cost.text.output]
price = 24
