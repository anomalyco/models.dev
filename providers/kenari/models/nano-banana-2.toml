# Source: https://kenari.id/v1/models and https://kenari.id/api/public/pricing (accessed 2026-10-21).
# Price: per generated image (pricing_lines output_image, Rp 250), / 17,500 IDR per USD.
# Reasoning: catalog reasoning_options ["minimal","high"], reasoning_toggle false (https://kenari.id/en/docs/reasoning).
# Effort: reasoning_effort (Chat completions), reasoning.effort (Responses), output_config.effort (Messages).
# Images: POST /v1/images/generations (https://kenari.id/en/docs/images)
schema = 2
base_model = "google/gemini-3.1-flash-image"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "high"] }

[api.images]
sdk = { opencodeai = "@opencode/ai/providers/openai-compatible/images" }

[cost.image.output]
unit = "image"
price = 0.01428571
