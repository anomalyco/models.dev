# River serves GLM-5.3-Flash at `zai-org/GLM-5.3-Flash`.
# GLM always reasons; Chat `reasoning_effort`: `low`, `high`, `max`.
# Reasoning returns in `reasoning_content` and bills as output.
# https://docs.river.ai/guides/inference-controls/ (accessed 2026-10-16)
# https://docs.river.ai/guides/inference-models/ (accessed 2026-10-16)
base_model = "zhipuai/glm-5.3-flash"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.12
output = 0.40
reasoning = 0.40
cache_read = 0.024

[limit]
context = 1_048_576
