# River serves Nemotron-3.5-Super-VL-120B-A12B at
# `nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4`.
# River documents no reasoning controls for this model. The lab entry and the
# same-model peers (first-party `nvidia`, relay `openrouter`) expose `toggle`
# only, so this entry keeps that baseline instead of inventing graded efforts.
# River's wire expresses off as `reasoning_effort: "none"`; there is no separate
# on/off field.
# Reasoning returns in `reasoning_content` and bills as output.
# Pricing (USD per 1M tokens): input 0.07, cached 0.024, output 0.37.
# Limits: context 1,048,576; max output 131,072 (River: 128K).
# https://docs.river.ai/guides/inference-models/ (accessed 2026-10-16)
base_model = "nvidia/nemotron-3.5-super-vl-120b-a12b"

reasoning_options = [{ type = "toggle" }]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.07
output = 0.37
reasoning = 0.37
cache_read = 0.024

[limit]
output = 131_072
