# River serves Nemotron-3.5-Super-VL-120B-A12B at
# `nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4`.
# River documents no reasoning controls for this model, so the accepted set was
# verified live on POST /v1/chat/completions (2026-10-16): `none` (off),
# `minimal`, `low`, `medium`, `high`, `xhigh` each return 200, `none` with 0
# reasoning tokens and every graded level above it. The set matches the
# same-model peer `providers/opencode/models/nemotron-3.5-super-vl-free.toml`
# (`none,minimal,low,medium,high,xhigh`); vercel's peer is `none,low,medium,high`
# and kilo's is `none,high`.
# There is no separate on/off field, so off is expressed as `effort = none`.
# Reasoning returns in `reasoning_content` and bills as output.
# Pricing (USD per 1M tokens): input 0.07, cached 0.024, output 0.37.
# Limits: context 1,048,576; max output 131,072 (River: 128K).
# https://docs.river.ai/guides/inference-models/ (accessed 2026-10-16)
base_model = "nvidia/nemotron-3.5-super-vl-120b-a12b"

[[reasoning_options]]
type = "effort"
values = ["none", "minimal", "low", "medium", "high", "xhigh"]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.07
output = 0.37
reasoning = 0.37
cache_read = 0.024

[limit]
output = 131_072
