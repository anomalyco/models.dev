# Cache: none. The model page lists no cached-input price (prefix caching is enabled per model:
# https://developers.cloudflare.com/workers-ai/features/prompt-caching/).
# Mid-conversation: not probed (the account must first accept the Llama 3.2 license); no effort control.
schema = 2
base_model = "meta/llama-3.2-11b-vision-instruct"
name = "Llama 3.2 11B Vision Instruct"
description = "Open Llama multimodal model for image understanding and text reasoning"

[capabilities]
tools = { supported = false }
cache = false
structured_output = false
effort_updates = false

[limit]
output = 128_000

[cost.text.input]
price = 0.0485

[cost.text.output]
price = 0.676
