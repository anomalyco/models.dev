# https://developers.cloudflare.com/workers-ai/models/clef-omni/
# Images: embedded PNG, JPEG or WebP (model page). Audio (up to 4 clips) and video (up to 2) are separate `audio` and
# `videos` lists; the input schema takes any audio/* or video/* data URL and names audio/wav, audio/mpeg, video/mp4 and
# video/webm (https://developers.cloudflare.com/workers-ai/models/clef-omni/schema-input.json).
# API: POST /accounts/{ACCOUNT_ID}/ai/run/@cf/cloudflare/clef-omni (https://developers.cloudflare.com/workers-ai/models/clef-omni/).
schema = 2
type = "decision"
name = "Clef Omni"
description = "Mixture-of-experts multimodal decision model for typed questions over text, structured state, and media"
open_weights = true
release_date = "2026-10-09"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "audio/wav", "audio/mpeg", "video/mp4", "video/webm"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = true
temperature = true

[limit]
context = 65_536
output = 65_536

[api.workers-ai-run]
base_url = "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/run"
sdk = { aisdk = "none", opencodeai = "@opencode/ai/providers/cloudflare-workers-ai/decisions" }

[cost.text.input]
price = 0.15

[cost.text.output]
price = 0
