# https://developers.cloudflare.com/workers-ai/models/clef/
schema = 2
type = "decision"
name = "Clef"
description = "Multimodal decision model for typed questions over text, structured state, and images"
open_weights = true
release_date = "2026-09-29"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = true
temperature = true

[limit]
context = 65_536
output = 65_536

[cost.text.input]
price = 0.24

[cost.text.output]
price = 0
