# Effort: reasoning_effort = none|high; none selects instant mode.
# Source: Workers AI /ai/models/search?format=openrouter (2026-09-18).
# Per-model Search config normalizes low/medium to high; these are aliases,
# not distinct levels despite the generic sync-input.json effort enum.
schema = 2
base_model = "moonshotai/kimi-k2.6"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = true

[limit]
output = 256_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.95
cache = { read = 0.16 }

[cost.text.output]
price = 4
