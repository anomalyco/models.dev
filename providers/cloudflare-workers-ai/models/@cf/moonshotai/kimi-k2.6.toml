# Effort: reasoning_effort = none|high; none selects instant mode.
# Source: Workers AI /ai/models/search?format=openrouter (2026-09-18).
# Per-model Search config normalizes low/medium to high; these are aliases,
# not distinct levels despite the generic sync-input.json effort enum.
# Cache: implicit prefix caching; cached-input price on the model page (https://developers.cloudflare.com/workers-ai/features/prompt-caching/).
# Images: jpeg/png/gif/webp data URLs accepted live 2026-10-19; bmp, tiff and heic rejected (code 8006).
# Mid-conversation: Live 2026-10-19 (/ai/v1/chat/completions, x-session-affinity, ~7k-token prefix): a late system message keeps the cached prefix and is honored;
# switching reasoning_effort none<->high keeps the cached history (3 runs); adding or removing a tool drops the cached history (tools render ahead of it).
schema = 2
base_model = "moonshotai/kimi-k2.6"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "high"] }
cache = { implicit = true }
structured_output = true
system_updates = true
effort_updates = true

[limit]
output = 256_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.95
cache = { read = 0.16 }

[cost.text.output]
price = 4
