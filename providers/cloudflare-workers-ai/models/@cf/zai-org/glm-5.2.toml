# Context and output limits verified against Cloudflare Workers AI's OpenAI-compatible endpoint.
# https://developers.cloudflare.com/workers-ai/models/glm-5.2/
base_model = "zhipuai/glm-5.2"
name = "Glm 5.2"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
input = 1.4
output = 4.4
cache_read = 0.26

[limit]
context = 262_144
output = 256_000
