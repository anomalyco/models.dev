# Effort: reasoning_effort = none|high|max; none disables thinking.
# Source: Workers AI /ai/models/search?format=openrouter (2026-09-18).
# Context and output limits verified against Cloudflare Workers AI's OpenAI-compatible endpoint.
# https://developers.cloudflare.com/workers-ai/models/glm-5.2/
base_model = "zhipuai/glm-5.2"
name = "Glm 5.2"

[[reasoning_options]]
type = "effort"
values = ["none", "high", "max"]

[cost]
input = 1.4
output = 4.4
cache_read = 0.26

[limit]
context = 262_144
output = 256_000
