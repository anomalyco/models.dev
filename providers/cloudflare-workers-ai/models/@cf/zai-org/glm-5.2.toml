# Effort: reasoning_effort = none|high|max; none disables thinking.
# Source: Workers AI /ai/models/search?format=openrouter (2026-09-18).
# Context and output limits verified against Cloudflare Workers AI's OpenAI-compatible endpoint.
# https://developers.cloudflare.com/workers-ai/models/glm-5.2/
# Cache: implicit prefix caching; cached-input price on the model page (https://developers.cloudflare.com/workers-ai/features/prompt-caching/).
# Mid-conversation: Live 2026-10-19 (/ai/v1/chat/completions, x-session-affinity, ~7k-token prefix): a late system message keeps the cached prefix and is honored;
# changing reasoning_effort reads 0 cached tokens on the first request after the switch; adding or removing a tool drops the cached history (tools render ahead of it).
schema = 2
base_model = "zhipuai/glm-5.2"
name = "Glm 5.2"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "high", "max"] }
cache = { supported = true, implicit = true }
structured_output = true
system_updates = true
effort_updates = false

[limit]
context = 262_144
output = 256_000

[cost.text.input]
price = 1.4
cache = { read = 0.26 }

[cost.text.output]
price = 4.4
