# Cloudflare Workers AI host for Z.ai GLM-5.3 (paid plan / AI Gateway credits).
# Context window and pricing from Cloudflare model page.
# Toggle: chat_template_kwargs.enable_thinking = true|false (default true)
# Effort: reasoning_effort = low|medium|high
# https://developers.cloudflare.com/workers-ai/models/glm-5.3/
# https://developers.cloudflare.com/workers-ai/models/glm-5.3/sync-input.json
# https://developers.cloudflare.com/ai/models/%40cf/zai-org/glm-5.3/
base_model = "zhipuai/glm-5.3"
name = "Glm 5.3"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
input = 1.4
output = 4.4
cache_read = 0.26

[limit]
context = 1_048_576
