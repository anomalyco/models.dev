# https://developers.cloudflare.com/workers-ai/models/phoenix-1.0/
# API: POST /accounts/{ACCOUNT_ID}/ai/run/<model> (https://developers.cloudflare.com/workers-ai/get-started/rest-api/).
# Request: JSON { prompt, width, height, num_steps, guidance, negative_prompt, seed }; response is the raw JPEG
#   (schema output image/jpeg; live check 2026-10-25).
# No [cost]: $0.00583 per 512x512 tile plus $0.00011 per step (https://developers.cloudflare.com/workers-ai/platform/pricing/, accessed 2026-10-25);
#   a tile price plus a step price has no cost form.
schema = 2
v2_only = true
base_model = "leonardo/phoenix-1.0"

[modalities]
input = ["text"]
output = ["image/jpeg"]

[api.workers-ai-run]
base_url = "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/run"
sdk = { aisdk = "none", opencodeai = "@opencode/ai/protocols/cloudflare-workers-ai-images" }
