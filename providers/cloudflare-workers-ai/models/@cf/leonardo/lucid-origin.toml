# https://developers.cloudflare.com/workers-ai/models/lucid-origin/
# API: POST /accounts/{ACCOUNT_ID}/ai/run/<model> (https://developers.cloudflare.com/workers-ai/get-started/rest-api/).
# Request: JSON { prompt, width, height, steps, guidance, seed }; response JSON { result: { image } } holding a base64
#   JPEG (live check 2026-10-25).
# No [cost]: $0.006996 per 512x512 tile plus $0.000132 per step (https://developers.cloudflare.com/workers-ai/platform/pricing/, accessed 2026-10-25);
#   a tile price plus a step price has no cost form.
schema = 2
v2_only = true
base_model = "leonardo/lucid-origin"

[modalities]
input = ["text"]
output = ["image/jpeg"]

[api.workers-ai-run]
base_url = "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/run"
sdk = { aisdk = "none", opencodeai = "@opencode/ai/protocols/cloudflare-workers-ai-images" }
