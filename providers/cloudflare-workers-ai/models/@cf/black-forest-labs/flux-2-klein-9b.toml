# https://developers.cloudflare.com/workers-ai/models/flux-2-klein-9b/
# API: POST /accounts/{ACCOUNT_ID}/ai/run/<model> (https://developers.cloudflare.com/workers-ai/get-started/rest-api/).
# Request: multipart fields only (prompt, width, height, steps, input_image_0...); response JSON { result: { image } }
#   holding a base64 JPEG. Reference images PNG, JPEG and WebP accepted (live check 2026-10-25).
# No [cost]: $0.015 for the first output megapixel, $0.002 per subsequent output megapixel and $0.002 per input image
#   megapixel (https://developers.cloudflare.com/workers-ai/platform/pricing/, accessed 2026-10-25); first/subsequent megapixel pricing has no cost unit or condition.
schema = 2
v2_only = true
base_model = "black-forest-labs/flux-2-klein-9b"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp"]
output = ["image/jpeg"]

[api.workers-ai-run]
base_url = "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/run"
sdk = { aisdk = "none", opencodeai = "@opencode/ai/protocols/cloudflare-workers-ai-images" }
