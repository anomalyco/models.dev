# https://developers.cloudflare.com/workers-ai/models/flux-1-schnell/
# API: POST /accounts/{ACCOUNT_ID}/ai/run/<model> (https://developers.cloudflare.com/workers-ai/get-started/rest-api/).
# Request: JSON { prompt, steps } (width and height are rejected); response JSON { result: { image } } holding a base64
#   JPEG (live check 2026-10-25).
# No [cost]: $0.0000528 per 512x512 tile plus $0.0001056 per step (https://developers.cloudflare.com/workers-ai/platform/pricing/, accessed 2026-10-25);
#   a tile price plus a step price has no cost form.
schema = 2
v2_only = true
base_model = "black-forest-labs/flux-1-schnell"

[modalities]
input = ["text"]
output = ["image/jpeg"]

[api.workers-ai-run]
base_url = "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/run"
sdk = { aisdk = "none", opencodeai = "@opencode/ai/providers/cloudflare-workers-ai/images" }
