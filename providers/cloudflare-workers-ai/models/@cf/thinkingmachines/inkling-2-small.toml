schema = 2
name = "Inkling 2 Small"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"
open_weights = true
release_date = "2026-11-09"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "max"] }
structured_output = true
temperature = true

[limit]
context = 1_048_576
output = 1_048_576

[cost.text.input]
price = 0.3
cache = { read = 0.1 }

[cost.text.output]
price = 1
