# Native `/ai/run` schema documents no reasoning toggle, effort, or token
# budget for this reasoning-only model.
# https://developers.cloudflare.com/workers-ai/models/deepseek-r1-distill-qwen-32b/sync-input.json (accessed 2026-06-25)
# Cache: none. The model page lists no cached-input price (prefix caching is enabled per model:
# https://developers.cloudflare.com/workers-ai/features/prompt-caching/), and live repeats read 0 cached tokens.
# Mid-conversation: Live 2026-10-19 (/ai/v1/chat/completions, x-session-affinity, ~7k-token prefix): a late system message is accepted but adds no role header (+14 tokens), i.e. it is merged into the leading system prompt, as in the model's chat template.
# No prefix cache on this model, so effort and tool changes keep nothing.
schema = 2
base_model = "deepseek/deepseek-r1"
name = "Deepseek R1 Distill Qwen 32B"

[capabilities]
tools = { supported = false }
reasoning = { supported = true }
cache = { supported = false }
structured_output = false
system_updates = false
effort_updates = false

[limit]
context = 80_000
output = 80_000

[cost.text.input]
price = 0.497

[cost.text.output]
price = 4.881
