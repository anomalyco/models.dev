# Image MIME types: Cloudflare lists none; this ID serves DeepSeek V4.1 Flash 1017 (models/deepseek/deepseek-v4.1-flash-1017),
# so the lab's formats apply: https://api-docs.deepseek.com/guides/vision (JPEG, PNG, GIF, WebP).
# Cache: implicit prefix caching; cached-input price on Search, and live repeats read cached tokens (https://developers.cloudflare.com/workers-ai/features/prompt-caching/).
# Mid-conversation: live 2026-10-23 (/ai/v1/chat/completions, x-session-affinity, ~7k-token first user message): a system message after the assistant turn keeps the cached prefix and is followed.
# system_updates left out: undocumented. Neither Workers AI nor DeepSeek documents where a late system message goes on this model; the live result above is server behavior only.
schema = 2
name = "Deepseek V4.1 Flash 1017"
description = "Fast DeepSeek model for efficient chat, coding help, and agent loops"
family = "deepseek"
open_weights = true
release_date = "2026-10-17"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
cache = { implicit = true }
structured_output = true
temperature = true

[limit]
context = 1_048_576
output = 1_048_576

[cost.text.input]
price = 0.3
cache = { read = 0.006 }

[cost.text.output]
price = 1.2
