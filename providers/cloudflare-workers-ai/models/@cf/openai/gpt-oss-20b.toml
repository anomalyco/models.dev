# Effort: reasoning_effort = low|medium|high (default medium), per the model page.
# Live 2026-10-19: low and high change reasoning length; none is rejected (Invalid input).
# https://developers.cloudflare.com/workers-ai/models/gpt-oss-20b/ (accessed 2026-10-19)
# Cache: none. The model page lists no cached-input price (prefix caching is enabled per model:
# https://developers.cloudflare.com/workers-ai/features/prompt-caching/), and live repeats read 0 cached tokens.
# Mid-conversation: Live 2026-10-19 (/ai/v1/chat/completions, x-session-affinity, ~7k-token prefix): a late system message is accepted and honored (+18 tokens),
# but with no prefix cache its placement can't be confirmed, so system_updates is unset.
# Effort and tools render in the leading system/developer messages; no cache to keep.
schema = 2
base_model = "openai/gpt-oss-20b"
description = "Open-weight GPT model for self-hosted reasoning and instruction-following workloads"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
cache = false
structured_output = true
effort_updates = false

[limit]
context = 128_000
output = 16_384

[cost.text.input]
price = 0.2

[cost.text.output]
price = 0.3
