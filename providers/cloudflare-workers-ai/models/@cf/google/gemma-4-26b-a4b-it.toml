# Toggle: chat_template_kwargs.enable_thinking = true|false (default: true).
# The model's input schema has no reasoning_effort, and Search reports only
# { mandatory: false, default_enabled: true }. Live 2026-10-19: reasoning_effort = none
# still returned reasoning; enable_thinking = false disabled it.
# https://developers.cloudflare.com/workers-ai/models/gemma-4-26b-a4b-it/sync-input.json (accessed 2026-10-19)
# Cache: implicit prefix caching (https://developers.cloudflare.com/workers-ai/features/prompt-caching/); Search reports a cached-input price and live
# repeats read cached tokens (the model page lists no cached price).
# Mid-conversation: Live 2026-10-19 (/ai/v1/chat/completions, x-session-affinity, ~7k-token prefix): a late system message keeps the cached prefix and is honored;
# no effort control; adding or removing a tool drops the cached history (tools render ahead of it).
schema = 2
base_model = "google/gemma-4-26b-a4b-it"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true }
cache = { implicit = true }
structured_output = true
system_updates = true
effort_updates = false

[limit]
context = 256_000
output = 16_384

[api.chat-completions]
compatibility = { replay_reasoning = true }

[cost.text.input]
price = 0.1
cache = { read = 0.05 }

[cost.text.output]
price = 0.3
