# Sources (accessed 2026-11-12):
# - Model ID and output specs: https://ai.byteplus.com/ark/region:ap-southeast-1/docs/model-list.md
# - USD list prices (per million tokens): https://ai.byteplus.com/ark/region:ap-southeast-1/docs/model-pricing.md
# - API: async POST https://ark.ap-southeast.bytepluses.com/api/v3/contents/generations/tasks, then poll
#   GET .../tasks/{id}: https://ai.byteplus.com/ark/region:ap-southeast-1/docs/create-video-generation-task-api.md
#   @ai-sdk/bytedance (https://www.npmjs.com/package/@ai-sdk/bytedance, 2.0.84) posts to contents/generations/tasks
#   and defaults to this base URL; it reads ARK_API_KEY rather than BYTEPLUS_API_KEY.
# Billed per million tokens; tokens ~= (input video seconds + output seconds) x width x height x fps / 1024,
# exact count in usage.completion_tokens.
# Prices: $2.5 for every resolution (480p, 720p, 1080p); offline inference (service_tier = "flex") $1.25, 50% of online.
# Not in BytePlus's current deprecation batches: https://ai.byteplus.com/ark/region:ap-southeast-1/docs/model-deprecation-notice.md
schema = 2
v2_only = true
base_model = "bytedance-seed/seedance-1.0-pro"

[capabilities]
service_tier = ["flex"]

[api.videos]
base_url = "https://ark.ap-southeast.bytepluses.com/api/v3"
sdk = { aisdk = "@ai-sdk/bytedance", opencodeai = "@opencode/ai/providers/byteplus/videos" }

[cost.video.output]
price = 2.5

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.5
