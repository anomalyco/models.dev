# Model ID from BytePlus ModelArk model list (accessed 2026-11-12).
# USD pricing, per million tokens.
schema = 2
base_model = "bytedance-seed/seed-2.1-turbo"

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.5
cache = { read = 0.1 }

[cost.text.output]
price = 2.5
