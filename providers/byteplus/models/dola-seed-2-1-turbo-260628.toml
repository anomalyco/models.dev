# Model ID from BytePlus ModelArk model list: https://ai.byteplus.com/ark/region:ap-southeast-1/docs/model-list
# USD pricing from BytePlus ModelArk pricing page: https://ai.byteplus.com/ark/region:ap-southeast-1/docs/model-pricing
# BytePlus ModelArk is the overseas brand of Volcengine Ark: same Ark API surface,
# different base URL (ark.ap-southeast.bytepluses.com) and API key.
# The dola- prefix is the ModelArk international naming for this model; the domestic
# Volcengine Ark serves the same weights as doubao-seed-2-1-turbo-260628.
# Effort: reasoning_effort = none|minimal|low|medium|high|xhigh|max
# none/minimal disable thinking, so no separate toggle: sending effort alone already
# enables it, and thinking.type=disabled + a graded effort is rejected.
# (same Ark API as the volcengine Ark entry for this model family)
schema = 2
base_model = "bytedance-seed/seed-2.1-turbo"

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.5
cache = { read = 0.1 }

[cost.text.output]
price = 2.5
