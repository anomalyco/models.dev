# Model ID from BytePlus ModelArk model list: https://ai.byteplus.com/ark/region:ap-southeast-1/docs/model-list
# USD pricing from BytePlus ModelArk pricing page: https://ai.byteplus.com/ark/region:ap-southeast-1/docs/model-pricing
# USD pricing, per million tokens. Tiered by prompt length.
schema = 2
base_model = "bytedance-seed/seed-2.0-mini"

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true

# BytePlus Ark accepts max_tokens up to 131_072 for this model (same as volcengine Ark).
[limit]
output = 131_072

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.1
cache = { read = 0.02 }

[[cost.text.input.overrides]]
when = { context = { gt = 128_000 } }
price = 0.2
cache = { read = 0.04 }

[cost.text.output]
price = 0.4

[[cost.text.output.overrides]]
when = { context = { gt = 128_000 } }
price = 0.8
