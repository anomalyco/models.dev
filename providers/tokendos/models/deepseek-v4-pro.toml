# Prices: TokenDos public pricing monitor https://www.tokendos.com/tokendos-pricing (snapshot 2026-10-22).
# Served id: raw_model "deepseek-v4-pro" in OpenAI protocol (/v1), $0.1/$0.3 per MTok input/output.
# Cache read: $0.003333 per MTok, same snapshot row.
# Reasoning: the effort ladder of providers/deepseek/models/deepseek-v4-pro.toml with the lab's on/off folded into `none`,
#   the off value on this chat-completions surface (AGENTS.md toggle table: effort carrying `none` needs no `toggle`). No caller-set budget is published — /v1 has no budget field.
schema = 2
base_model = "deepseek/deepseek-v4-pro"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }

[cost.text.input]
price = 0.1
cache = { read = 0.003333 }

[cost.text.output]
price = 0.3
