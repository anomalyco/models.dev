# Augure is the lab for this model (first-party host), so this is a full definition.
# Sources (accessed 2026-10-27): https://augureai.ca/docs/models (256K context, 16,384
# output cap, CAD prices; reasoning_effort accepted and ignored, thinking always off),
# https://augureai.ca/docs/api (image_url and PDF file parts on every model; temperature
# and top_p, no top_k), and https://augureai.ca/docs/changelog (launched 2026-08-20).
# Prices: CAD 0.60 in / 2.00 out per 1M tokens, converted to USD at the Bank of Canada
# rate of 1.4038 CAD per USD (2026-10-27), rounded to 2 decimals. Cached input is billed
# at the standard input rate.
# Knowledge cutoff is not published by Augure.
schema = 2
name = "Tofino 3"
description = "Augure's fast everyday model: bilingual (English and Quebec French) drafting, translation, extraction and classification, thinking always off, served in Canada only"
open_weights = false
release_date = "2026-08-20"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = false }
structured_output = true
stream_usage = true
temperature = true
top_p = true
top_k = false

[limit]
context = 262_144
output = 16_384

[cost.text.input]
price = 0.43

[cost.text.output]
price = 1.42
