# Augure Open (preview): GLM-5.3 open weights hosted in Canada for developer API keys.
# Sources (accessed 2026-10-27): https://augureai.ca/docs/models (256K context, 49,152
# output cap, CAD prices; text only, image and file parts get 400 unsupported_content;
# messages reach the model unchanged; response_format goes to the model's own structured
# decoding; thinking returned as reasoning_content; reasoning_effort accepted, "none"
# served as "low", "no setting shortens the thinking as served today"), and
# https://augureai.ca/docs/changelog (added 2026-10-16). Augure's API has temperature and
# top_p but no top_k.
# Effort: authored as always-on with no caller control. Augure's model page states, for
# this route only, that reasoning_effort is "Accepted. 'none' is served as 'low'; no setting
# shortens the thinking as served today" (https://augureai.ca/docs/models). The lab's
# low|high|max set is therefore not exposed here. open-qwen-3.8-flash-next differs by
# design: its row says the field is "Sent to the model unchanged", so that file lists the
# lab's native levels.
schema = 2
base_model = "zhipuai/glm-5.3"
status = "beta"

[capabilities]
reasoning = { supported = true }
structured_output = true
stream_usage = true
top_k = false

[limit]
context = 262_144
output = 49_152

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 2.14

[cost.text.output]
price = 4.99
