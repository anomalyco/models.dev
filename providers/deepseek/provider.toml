name = "DeepSeek"
env = ["DEEPSEEK_API_KEY"]
npm = "@ai-sdk/openai-compatible"
# OpenAI Chat is POST `/chat/completions`: `thinking.type = enabled|disabled`
# and `reasoning_effort = low|high|max`. Both current models map minimal→low,
# medium/xhigh→high, and ultra→max; low/high/max remain distinct native levels.
# Anthropic Messages is POST `/anthropic/v1/messages`: `thinking.type` and
# `output_config.effort = low|high|max`; `thinking.budget_tokens` is ignored.
# https://api-docs.deepseek.com/guides/thinking_mode/ (accessed 2026-09-20)
# https://api-docs.deepseek.com/guides/anthropic_api (accessed 2026-06-25)
doc = "https://api-docs.deepseek.com/quick_start/pricing"
api = "https://api.deepseek.com"
