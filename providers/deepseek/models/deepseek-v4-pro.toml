# `deepseek-v4-pro` is being retired. From 2026-09-14 12:00 Beijing time until
# V4.1 Pro ships, requests route to V4.1 Flash and bill at Flash prices.
# Until then the live model remains DeepSeek-V4-Pro-0813 at Pro rates below.
# Prefer `deepseek-flash`. https://api-docs.deepseek.com/quick_start/pricing
# (accessed 2026-09-10)
# https://mp.weixin.qq.com/s/qg0NU3NNUbp1co2PdkAPAg (accessed 2026-09-10)
# Costs are off-peak USD/MTok (peak = 2x; peak hours UTC weekdays 01:00-04:00 and 06:00-10:00).
# Reasoning tokens are billed at the output rate (no separate CoT price).
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = high|max (OpenAI); output_config.effort (Anthropic)
# Pro maps low→high. https://api-docs.deepseek.com/guides/thinking_mode/
# (accessed 2026-09-10)
base_model = "deepseek/deepseek-v4-pro-0813"
name = "DeepSeek V4 Pro"
