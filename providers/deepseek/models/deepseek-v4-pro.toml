# `deepseek-v4-pro` serves DeepSeek-V4-Pro-0813 (GA 2026-08-13: https://api-docs.deepseek.com/news/news260813/).
# Pro has no vision support (pricing page).
# Sources (api-docs.deepseek.com, accessed 2026-10-19):
# - Models & pricing: https://api-docs.deepseek.com/quick_start/pricing
#   Off-peak rates are half of peak. Peak is 01:00-04:00 and 06:00-10:00 UTC, Mon-Fri, excluding
#   Chinese public holidays. Base prices below are off-peak; the multiplier doubles them at peak.
#   Reasoning tokens are billed at the output rate (no separate CoT price).
# - Thinking: https://api-docs.deepseek.com/guides/thinking_mode
#   Toggle: thinking.type = enabled|disabled (default enabled)
#   Effort: reasoning_effort = low|high|max (default high; minimal->low, medium/xhigh->high;
#   `none` is also accepted and disables thinking). Anthropic format: output_config.effort.
#   `low` is a distinct level, not mapped to high: the thinking_mode mapping table lists low->low,
#   the 2026-08-13 changelog introduces "three thinking effort levels: low / high / max"
#   (https://api-docs.deepseek.com/updates/#date-2026-08-13), and GET /models reports
#   effort.supported_levels = [low, high, max] for both models.
# - Chat Completions params (max_tokens <= 393216, stream_options.include_usage, no top_k):
#   https://api-docs.deepseek.com/api/create-chat-completion
# - Context caching (automatic disk cache, no write price, no TTL): https://api-docs.deepseek.com/guides/kv_cache
# - GET /models reports context_window 1048576 and max_output_tokens 393216.
# Mid-conversation: the docs allow system messages mid-conversation on Chat Completions
# (https://api-docs.deepseek.com/guides/tool_calls#inserting-tool-calls-mid-conversation), but Pro
# moves them to the leading system prompt: GET /models reports system_prompt_update = "leading-only"
# and a late system message drops the prompt cache to 0 hits (3/3 live runs, 2026-10-19), so
# system_updates = false. A late user message keeps the cache.
# Changing reasoning effort, the thinking toggle, or the tool list between turns drops the
# prompt cache (prompt_cache_hit_tokens drops to 0-256), checked live 2026-10-19.
# APIs: Chat Completions and the Anthropic-compatible Messages API (https://api-docs.deepseek.com/guides/anthropic_api), both confirmed live 2026-10-22.
schema = 2
base_model = "deepseek/deepseek-v4-pro-0813"
name = "DeepSeek V4 Pro"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, default = { type = "effort", value = "high" }, toggle = true, effort = ["low", "high", "max"] }
structured_output = true
top_k = false
stream_usage = true
cache = { implicit = true }

[limit]
context = 1_048_576
output = 393_216

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.messages]
base_url = "https://api.deepseek.com/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.66
cache = { read = 0.022 }

[cost.text.output]
price = 1.98
reasoning = 1.98

[[cost.multipliers]]
when = { utc_days = { in = ["mon", "tue", "wed", "thu", "fri"] }, not = { holiday = { equals = "CN" } }, any = [{ all = [{ utc_hours = { gte = "01:00" } }, { utc_hours = { lt = "04:00" } }] }, { all = [{ utc_hours = { gte = "06:00" } }, { utc_hours = { lt = "10:00" } }] }] }
factor = 2
