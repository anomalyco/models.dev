schema = 2
base_model = "zhipuai/glm-5.3-flash"
name = "GLM 5.3 Flash"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
context = 1_048_576
output = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.15
cache = { read = 0.075, write = 0 }

[cost.text.output]
price = 0.69
