# Mid-conversation: Inceptron serves this model on POST /v1/chat/completions; reasoning and tools are per-request fields with no per-turn effort or tool-change mechanism (effort_updates = false, tools.updates = false). https://docs.inceptron.io
# Input MIME types: the lab's image list; Inceptron's catalog reports image input without formats (https://api.inceptron.io/v1/models).
schema = 2
base_model = "moonshotai/kimi-k2.7-code"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
structured_output = true
temperature = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.56
cache = { read = 0.15, write = 0 }

[cost.text.output]
price = 3.1
