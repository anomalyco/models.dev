# AMD Token Factory catalog (accessed 2026-10-21): https://developer.amd.com.cn/radeon/api/tokenfactory/model?id=model_gateway%3AClef
# Section "Public Free Model APIs"; pricing note "Free to use. Points show relative usage, not a charge.", so every price is 0.
# Decision model: POST /v1/systemone with a state and typed questions (choice, noul or score).
# Tags: Decision, Vision input.
# Images: AMD documents no placement; a top-level `images` list next to `state`, as on vLLM's and vLLM-SR's /v1/systemone (https://docs.vllm.ai/en/latest/models/structured_decisions_models/, https://huggingface.co/Cloudflare/clef).
schema = 2
v2_only = true
base_model = "cloudflare/clef"

[capabilities]
structured_output = true

[api.systemone]
base_url = "https://developer.amd.com.cn/radeon/api/v1"
sdk = { aisdk = "@ai-sdk/typesafe-ai", opencodeai = "@opencode/ai/providers/typesafe-ai/decisions" }
compatibility = { media_input = "root" }

[cost.text.input]
price = 0

[cost.text.output]
price = 0
