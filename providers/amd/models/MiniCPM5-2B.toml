# Live probes against the AMD Radeon Cloud Model API (accessed 2026-09-14):
# GET /v1/models reports 131072 context, text-only input, tools, and
# reasoning. reasoning_effort is accepted as low|medium|high (none / minimal /
# xhigh / max return 422) but is inert on this host: no separated reasoning is
# ever returned and reasoning_tokens stays 0, so the model answers inline in
# content. No caller control over reasoning is published.
# Tools and json_object both work; image input is refused with 400.
# Token Factory catalog (accessed 2026-10-21):
# https://developer.amd.com.cn/radeon/api/tokenfactory/model?id=model_gateway%3AMiniCPM5-2B
# - Section "Public Free Model APIs", badge "Free"; pricing note "Free to use. Points show relative usage, not a
#   charge." The listed 0.035 / 0.07 / 0.0007 per MTok are usage points, so every price is 0. The earlier
#   $0.124 / $0.7425 / $0.124 came from the same field before the endpoint went free.
# - vision: false, context_length 131072, supported_parameters temperature, max_tokens, top_p, stream,
#   response_format, tools, tool_choice (no top_k).
# APIs on this host: OpenAI Chat Completions (/v1/chat/completions), /v1/models.
# Mid-conversation behavior is undocumented and could not be probed (no key), so those flags stay unset.
schema = 2
base_model = "openbmb/minicpm5-2b"

[capabilities]
reasoning = { supported = true }
top_k = false

[cost.text.input]
price = 0
cache = { read = 0 }

[cost.text.output]
price = 0
