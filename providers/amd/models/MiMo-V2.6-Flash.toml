# AMD Token Factory catalog (accessed 2026-10-21): https://developer.amd.com.cn/radeon/api/tokenfactory/model?id=model_gateway%3AMiMo-V2.6-Flash
# Section "Public Free Model APIs"; pricing note "Free to use. Points show relative usage, not a charge.", so every price is 0.
# vision: true, context_length 1048576, tools and reasoning true; supported_parameters temperature, max_tokens, top_p,
#   stream, response_format, tools, tool_choice (no top_k). Image formats are not documented: the lab's image types are used.
# reasoning_effort values are unverified on this host (no key), so no effort list is published.
# capability "VLM (Vision)": input is text plus the lab's image types (no audio or video listed).
# APIs on this host: OpenAI Chat Completions (/v1/chat/completions), /v1/models.
schema = 2
v2_only = true
base_model = "xiaomi/mimo-v2.6-flash"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true
top_k = false

[cost.text.input]
price = 0
cache = { read = 0 }

[cost.text.output]
price = 0
