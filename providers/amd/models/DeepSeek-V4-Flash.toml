# Reasoning control verified against the AMD Token Factory API (accessed 2026-08-16):
# POST https://developer.amd.com.cn/radeon/api/v1/chat/completions validates
# reasoning_effort with enum none|minimal|low|medium|high|xhigh|max (invalid
# values return 400). thinking.* and budget controls are silently ignored and no
# reasoning_content is ever returned, so there is no toggle and no interleaved
# channel on this host.
# Token Factory catalog (accessed 2026-10-21):
# https://developer.amd.com.cn/radeon/api/tokenfactory/model?id=model_gateway%3ADeepSeek-V4-Flash
# - display name "DeepSeek-V4-Flash-0731"; vision: false; context_length 1048576, higher than the lab entry's
#   1_000_000, so [limit] overrides it.
# - Section "Public Free Model APIs", badge "Free"; pricing note "Free to use. Points show relative usage, not a
#   charge." The listed 0.14 / 0.28 / 0.0028 per MTok are usage points, so every price is 0.
# - supported_parameters temperature, max_tokens, top_p, stream, response_format, tools, tool_choice (no top_k).
# APIs on this host: OpenAI Chat Completions (/v1/chat/completions), /v1/models.
# Mid-conversation behavior is undocumented and could not be probed (no key), so those flags stay unset.
schema = 2
base_model = "deepseek/deepseek-v4-flash-0731"

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
top_k = false

[limit]
context = 1_048_576

[cost.text.input]
price = 0
cache = { read = 0 }

[cost.text.output]
price = 0
