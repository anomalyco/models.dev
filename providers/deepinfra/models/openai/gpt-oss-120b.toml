# Lab identity: https://deepinfra.com/openai/gpt-oss-120b (Hugging Face repo openai/gpt-oss-120b)
# Output cap: max_output_tokens = 131072 on https://api.deepinfra.com/models/openai/gpt-oss-120b (checked 2026-11-24),
#   the lab's 131,072, so it's inherited.
schema = 2
base_model = "openai/gpt-oss-120b"
description = "Open-weight GPT model for self-hosted reasoning and instruction-following workloads"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
cache = { implicit = true }
prompt_cache_key = true

[cost.text.input]
price = 0.037
cache = { read = 0.0185 }

[cost.text.output]
price = 0.17
