schema = 2
name = "GPT OSS 20B"
description = "Open-weight GPT model for self-hosted reasoning and instruction-following workloads"
family = "gpt-oss"
open_weights = true
release_date = "2025-08-05"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
temperature = true
service_tier = ["flex", "priority"]

[limit]
context = 131_072
output = 16_384

[cost.text.input]
price = 0.03

[cost.text.output]
price = 0.14

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.5

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
