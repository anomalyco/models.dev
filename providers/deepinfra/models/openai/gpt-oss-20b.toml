# Lab identity: https://deepinfra.com/openai/gpt-oss-20b (Hugging Face repo openai/gpt-oss-20b)
schema = 2
base_model = "openai/gpt-oss-20b"
description = "Open-weight GPT model for self-hosted reasoning and instruction-following workloads"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
service_tier = ["flex", "priority"]

[limit]
output = 16_384

[cost.text.input]
price = 0.03

[cost.text.output]
price = 0.14

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.5

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
