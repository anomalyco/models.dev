schema = 2
base_model = "minimax/MiniMax-M3"

[capabilities]
reasoning = { supported = true }
structured_output = true
cache = { supported = true, implicit = true }
prompt_cache_key = true
service_tier = ["flex"]

[limit]
context = 524_288

[cost.text.input]
price = 0.28
cache = { read = 0.056 }

[cost.text.output]
price = 1.1

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
