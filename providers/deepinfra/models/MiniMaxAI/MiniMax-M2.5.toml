# Lab identity: https://deepinfra.com/MiniMaxAI/MiniMax-M2.5 (Hugging Face repo MiniMaxAI/MiniMax-M2.5)
# knowledge: the host's value, unsourced; the lab's model card and docs state no cutoff. Kept so v1 doesn't lose it.
schema = 2
base_model = "minimax/MiniMax-M2.5"
name = "MiniMax M2.5"
description = "MiniMax model for chat, coding, office work, and agentic tasks"
knowledge = "2025-06"
status = "deprecated"

[capabilities]
reasoning = { supported = true }
cache = { implicit = true }
prompt_cache_key = true
service_tier = ["priority"]

[limit]
context = 196_608

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.15
cache = { read = 0.03 }

[cost.text.output]
price = 1.15

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.5
