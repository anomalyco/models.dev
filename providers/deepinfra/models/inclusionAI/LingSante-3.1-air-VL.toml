# Price and context: https://api.deepinfra.com/models/list?type=text-generation (inclusionAI/LingSante-3.1-air-VL, read 2026-11-26):
#   $0.06 input, $0.18 output per 1M tokens, cached input at 0.2x ($0.012); 131,072-token context (the lab's 262,144 isn't
#   served here); tags tools, reasoning, structured-output, multimodal, input-video.
# Image formats: jpg, png, webp (https://docs.deepinfra.com/chat/vision, Limitations). Video: catalog tag input-video; Deep Infra
#   documents no video formats.
# Toggle: reasoning.enabled = true|false (reasoning_effort = "none" also disables); https://docs.deepinfra.com/chat/reasoning
#   Controls copied from this host's Ling-3.0-flash-VL (providers/deepinfra/models/inclusionAI/Ling-3.0-flash-VL.toml, which
#   LingSante is fine-tuned from): binary thinking switch, no graded effort. Not re-probed on this ID.
schema = 2
base_model = "inclusionai/lingsante-3.1-air-vl"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp", "video"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
cache = { implicit = true }
prompt_cache_key = true

[limit]
context = 131_072

[cost.text.input]
price = 0.06
cache = { read = 0.012 }

[cost.text.output]
price = 0.18
