# Toggle: reasoning.enabled = true|false (DeepInfra OpenAI Chat Completions).
# https://docs.deepinfra.com/chat/reasoning
# https://mimo.mi.com/docs/zh-CN/api/chat/openai-api
# Mid-conversation (live probe, Chat Completions, 2026-10-21; notes/deepinfra-baseten-v2-2026-10-21/probe.ts): a system message after turn 1 is moved to the front or rejected (cached prefix lost); changing reasoning_effort between turns keeps the cached prefix; adding a tool between turns drops the cached prefix.
schema = 2
base_model = "xiaomi/mimo-v2.6-pro"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true }
structured_output = true
cache = { supported = true, implicit = true }
prompt_cache_key = true
system_updates = false
effort_updates = true

[cost.text.input]
price = 0.43
cache = { read = 0.0036 }

[cost.text.output]
price = 0.87
