# Output limit: capped at the 524,288 context; no host cap is documented and the 1,048,576 from the base model or host listing is larger.
# Mid-conversation (live probe, Chat Completions, 2026-10-21; notes/deepinfra-baseten-v2-2026-10-21/probe.ts):
#   a system message after turn 1 is moved to the front or rejected (cached prefix lost) [cached/prompt tokens, control -> test: 11136/11275 -> None/11291; 11136/11275 -> None/11291]
#   adding a tool between turns drops the cached prefix [cached/prompt tokens, control -> test: 10880/10987 -> None/11029; 10880/10987 -> None/11029]
# Reasoning field: reasoning_content, the field Inkling's chat template reads back (https://huggingface.co/thinkingmachines/Inkling). Same as this host's
#   Inkling Small, whose reasoning reached the model when sent back in reasoning_content on an earlier assistant turn (live 2026-11-23 through OpenRouter's Deep Infra route).
schema = 2
base_model = "thinkingmachines/inkling"
status = "deprecated"

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
structured_output = true
cache = { implicit = true }
prompt_cache_key = true

[limit]
context = 524_288
output = 524_288

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.95
cache = { read = 0.16 }

[cost.text.output]
price = 4.05
