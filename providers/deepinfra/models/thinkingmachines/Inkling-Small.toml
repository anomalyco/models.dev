# Output limit: capped at the 524,288 context; no host cap is documented and the 1,048,576 from the base model or host listing is larger.
# Mid-conversation (live probe, Chat Completions, 2026-10-21; notes/deepinfra-baseten-v2-2026-10-21/probe.ts):
#   a system message after turn 1 is kept in place (cached prefix survives, instruction followed) [cached/prompt tokens, control -> test: 11776/11915 -> 11904/11931; 11776/11915 -> 11904/11931]
#   adding a tool between turns drops the cached prefix [cached/prompt tokens, control -> test: 11520/11627 -> None/11669; 11520/11627 -> None/11669]
# Reasoning field: reasoning_content, the field Inkling's chat template reads back (https://huggingface.co/thinkingmachines/Inkling-Small). Deep Infra's reasoning
#   reached the model when sent back in reasoning_content on an earlier assistant turn (live 2026-11-23 through OpenRouter's Deep Infra route).
schema = 2
base_model = "thinkingmachines/inkling-small"

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
structured_output = true
cache = { implicit = true }
prompt_cache_key = true
system_updates = true

[limit]
context = 524_288
output = 524_288

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.45
cache = { read = 0.1 }

[cost.text.output]
price = 1.2
