schema = 2
name = "Llama 4 Maverick 17B FP8"
description = "Open multimodal Llama model for strong reasoning and fast responses"
family = "llama"
open_weights = true
release_date = "2025-04-05"
status = "deprecated"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = true
service_tier = ["flex", "priority"]

[limit]
context = 1_048_576
output = 16_384

[cost.text.input]
price = 0.2

[cost.text.output]
price = 0.8

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.5

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
