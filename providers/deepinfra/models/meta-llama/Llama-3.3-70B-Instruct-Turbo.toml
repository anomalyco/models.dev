schema = 2
name = "Llama 3.3 70B Turbo"
description = "Compact Llama instruction model for fast chat and local deployment"
family = "llama"
open_weights = true
release_date = "2024-12-06"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
structured_output = true
service_tier = ["flex"]

[limit]
context = 131_072
output = 16_384

[cost.text.input]
price = 0.1

[cost.text.output]
price = 0.32

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
