# Lab identity: https://deepinfra.com/meta-llama/Llama-3.3-70B-Instruct-Turbo (Hugging Face repo meta-llama/Llama-3.3-70B-Instruct-Turbo)
schema = 2
base_model = "meta/llama-3.3-70b-instruct"
name = "Llama 3.3 70B Turbo"
description = "Compact Llama instruction model for fast chat and local deployment"

[capabilities]
structured_output = true
service_tier = ["flex"]

[limit]
context = 131_072
output = 16_384

[cost.text.input]
price = 0.1

[cost.text.output]
price = 0.32

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
