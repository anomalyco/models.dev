schema = 2
name = "Llama 4 Scout 17B"
description = "Open multimodal Llama model for long-context analysis and efficient agents"
family = "llama"
open_weights = true
release_date = "2025-04-05"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
structured_output = true
service_tier = ["flex", "priority"]

[limit]
context = 327_680
output = 16_384

[cost.text.input]
price = 0.1

[cost.text.output]
price = 0.3

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.5

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
