# Lab identity: https://deepinfra.com/meta-llama/Llama-4-Scout-17B-16E-Instruct (Hugging Face repo meta-llama/Llama-4-Scout-17B-16E-Instruct)
schema = 2
base_model = "meta/llama-4-scout-17b-instruct"
name = "Llama 4 Scout 17B"
description = "Open multimodal Llama model for long-context analysis and efficient agents"

[capabilities]
structured_output = true
service_tier = ["flex", "priority"]

[limit]
context = 327_680

[cost.text.input]
price = 0.1

[cost.text.output]
price = 0.3

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.5

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
