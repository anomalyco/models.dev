# Model-specific reasoning HTTP values (accessed 2026-06-25):
# reasoning_effort = "low"|"medium"|"high"|"xhigh"; "none" disables reasoning.
# Sources:
# https://docs.deepinfra.com/api-reference/chat-completions/openai-chat-completions
# https://deepinfra.com/deepseek-ai/DeepSeek-V4-Pro/api
schema = 2
base_model = "deepseek/deepseek-v4-pro"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
cache = { supported = true, implicit = true }
prompt_cache_key = true
service_tier = ["flex", "priority"]

[limit]
context = 1_048_576
output = 16_384

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.3
cache = { read = 0.1 }

[cost.text.output]
price = 2.6

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.5

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
