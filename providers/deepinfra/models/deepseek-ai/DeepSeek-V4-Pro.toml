# Toggle: reasoning.enabled = true|false (reasoning_effort = "none" also disables).
# Effort: reasoning_effort = low|high|max, the DeepSeek V4 levels (minimal->low,
# medium/xhigh->high per https://api-docs.deepseek.com/guides/thinking_mode).
# DeepInfra's schema lists the generic none..max enum for every model and
# documents no per-model mapping, so the lab's levels apply.
# Sources:
# https://docs.deepinfra.com/chat/reasoning
# https://docs.deepinfra.com/api-reference/chat-completions/openai-chat-completions
# https://deepinfra.com/deepseek-ai/DeepSeek-V4-Pro/api
# Mid-conversation (live probe, Chat Completions, 2026-10-21; notes/deepinfra-baseten-v2-2026-10-21/probe.ts):
#   a system message after turn 1 is moved to the front or rejected (cached prefix lost) [cached/prompt tokens, control -> test: 13824/14137 -> 0/14151; 13824/14137 -> 0/14151]
#   changing reasoning_effort between turns drops the cached prefix [cached/prompt tokens, control -> test: 14336/14441 -> 0/14533 (reasoning tokens 73 -> 68); 13568/13801 -> 0/13893 (reasoning tokens 85 -> 90)]
#   adding a tool between turns drops the cached prefix [cached/prompt tokens, control -> test: 13824/14072 -> 0/14123; 13824/14072 -> 0/14123]
schema = 2
base_model = "deepseek/deepseek-v4-pro"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }
prompt_cache_key = true
service_tier = ["flex", "priority"]

[limit]
context = 1_048_576
output = 16_384

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.3
cache = { read = 0.1 }

[cost.text.output]
price = 2.6

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.5

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
