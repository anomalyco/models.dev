# Lab identity: https://deepinfra.com/deepseek-ai/DeepSeek-R1-0528 (Hugging Face repo deepseek-ai/DeepSeek-R1-0528)
# Mid-conversation (live probe, Chat Completions, 2026-10-21; notes/deepinfra-baseten-v2-2026-10-21/probe.ts):
#   a system message after turn 1 is moved to the front or rejected (cached prefix lost) [cached/prompt tokens, control -> test: 14720/14772 -> 0/14786; 14720/14772 -> 0/14786]
#   adding a tool between turns drops the cached prefix [cached/prompt tokens, control -> test: 14656/14722 -> 64/14807; 14656/14722 -> 384/14807]
schema = 2
base_model = "deepseek/deepseek-r1-0528"
name = "DeepSeek-R1-0528"
description = "DeepSeek reasoning model for multi-step analysis, math, coding, and tools"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
structured_output = true
cache = { supported = true, implicit = true }
prompt_cache_key = true
service_tier = ["flex"]
system_updates = false

[limit]
output = 64_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.5
cache = { read = 0.35 }

[cost.text.output]
price = 2.15

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
