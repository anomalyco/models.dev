# Lab identity: https://deepinfra.com/deepseek-ai/DeepSeek-R1-0528 (Hugging Face repo deepseek-ai/DeepSeek-R1-0528)
schema = 2
base_model = "deepseek/deepseek-r1-0528"
name = "DeepSeek-R1-0528"
description = "DeepSeek reasoning model for multi-step analysis, math, coding, and tools"

[capabilities]
reasoning = { supported = true }
structured_output = true
cache = { supported = true, implicit = true }
prompt_cache_key = true
service_tier = ["flex"]

[limit]
output = 64_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.5
cache = { read = 0.35 }

[cost.text.output]
