# Model-specific reasoning HTTP values (accessed 2026-06-25):
# reasoning_effort = "low"|"medium"|"high"|"xhigh"; "none" disables reasoning.
# Sources:
# https://docs.deepinfra.com/api-reference/chat-completions/openai-chat-completions
# https://deepinfra.com/deepseek-ai/DeepSeek-V4-Flash/api
# Toggle: reasoning.enabled = true|false (reasoning_effort = "none" also disables); https://docs.deepinfra.com/chat/reasoning
schema = 2
base_model = "deepseek/deepseek-v4-flash"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
cache = { supported = true, implicit = true, explicit = { ttl = ["5m", "1h"], min_tokens = 1_024 } }
prompt_cache_key = true
service_tier = ["flex", "priority"]

[limit]
context = 1_048_576
output = 16_384

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.09
cache = { read = 0.018, explicit = { write = { "5m" = 0.1125, "1h" = 0.18 } } }

[cost.text.output]
price = 0.18

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.5

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
