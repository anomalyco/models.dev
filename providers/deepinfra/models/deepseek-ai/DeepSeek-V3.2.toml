# Lab identity: https://deepinfra.com/deepseek-ai/DeepSeek-V3.2 (Hugging Face repo deepseek-ai/DeepSeek-V3.2)
schema = 2
base_model = "deepseek/deepseek-v3.2"
name = "DeepSeek-V3.2"
description = "DeepSeek chat model for instruction following, coding, and analysis"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
cache = { supported = true, implicit = true }
prompt_cache_key = true
service_tier = ["flex"]

[limit]
context = 163_840

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.26
cache = { read = 0.13 }

[cost.text.output]
price = 0.38

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
