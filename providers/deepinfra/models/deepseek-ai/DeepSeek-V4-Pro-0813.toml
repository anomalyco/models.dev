# Toggle: reasoning.enabled = true|false
# Effort: reasoning_effort = high|max
# https://docs.deepinfra.com/api-reference/chat-completions/openai-chat-completions
schema = 2
base_model = "deepseek/deepseek-v4-pro-0813"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["high", "max"] }
structured_output = true

[limit]
context = 1_048_576

[cost.text.input]
price = 1.3
cache = { read = 0.1 }

[cost.text.output]
price = 2.6
