# Toggle: reasoning.enabled = true|false
# Effort: reasoning_effort = high|max
# https://docs.deepinfra.com/api-reference/chat-completions/openai-chat-completions
# Mid-conversation (live probe, Chat Completions, 2026-10-21; notes/deepinfra-baseten-v2-2026-10-21/probe.ts): a system message after turn 1 is moved to the front or rejected (cached prefix lost); changing reasoning_effort between turns drops the cached prefix; adding a tool between turns drops the cached prefix.
schema = 2
base_model = "deepseek/deepseek-v4-pro-0813"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true, effort = ["high", "max"] }
structured_output = true
cache = { supported = true, implicit = true }
prompt_cache_key = true
service_tier = ["flex", "priority"]
system_updates = false
effort_updates = false

[limit]
context = 1_048_576

[cost.text.input]
price = 1.3
cache = { read = 0.1 }

[cost.text.output]
price = 2.6

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.5

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
