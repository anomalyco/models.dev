# Toggle: reasoning.enabled = true|false (reasoning_effort = "none" also disables); https://docs.deepinfra.com/chat/reasoning
# Effort: reasoning_effort = low|high|max, the DeepSeek V4 levels (minimal->low,
# medium/xhigh->high per https://api-docs.deepseek.com/guides/thinking_mode).
# DeepInfra's schema lists the generic none..max enum for every model and
# documents no per-model mapping, so the lab's levels apply.
# Mid-conversation (live probe, Chat Completions, 2026-10-21; notes/deepinfra-baseten-v2-2026-10-21/probe.ts):
#   a system message after turn 1 is kept in place (cached prefix survives, instruction followed) [cached/prompt tokens, control -> test: 15104/15417 -> 15104/15431; 15104/15417 -> 15104/15431]
#   changing reasoning_effort between turns drops the cached prefix [cached/prompt tokens, control -> test: 15616/15721 -> 0/15800 (reasoning tokens 0 -> 96); 14848/15081 -> 0/15160 (reasoning tokens 0 -> 85)]
#   adding a tool between turns drops the cached prefix [cached/prompt tokens, control -> test: 15104/15352 -> 0/15403; 15104/15352 -> 0/15403]
schema = 2
base_model = "deepseek/deepseek-v4-flash-0731"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }
prompt_cache_key = true
service_tier = ["flex", "priority"]
system_updates = true
effort_updates = false

[limit]
context = 1_048_576

[cost.text.input]
price = 0.06
cache = { read = 0.015 }

[cost.text.output]
price = 0.18

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.5

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
