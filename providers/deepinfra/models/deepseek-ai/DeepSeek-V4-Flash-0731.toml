# Model-specific reasoning HTTP values (accessed 2026-08-01):
# reasoning_effort = "low"|"medium"|"high"|"xhigh"|"max"; "none" disables reasoning.
# Sources:
# https://docs.deepinfra.com/api-reference/chat-completions/openai-chat-completions
# https://deepinfra.com/deepseek-ai/DeepSeek-V4-Flash-0731/api
# https://api.deepinfra.com/v1/inference/deepseek-ai/DeepSeek-V4-Flash-0731
base_model = "deepseek-ai/DeepSeek-V4-Flash-0731"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh", "max"]

[cost]
input = 0.09
output = 0.18
cache_read = 0.018

[limit]
context = 1_048_576
output = 16_384
