# Effort: reasoning_effort = none|low|high|max; none disables reasoning.
# Graded levels match native DeepSeek; reasoning.enabled = false is equivalent to none.
# https://docs.deepinfra.com/chat/reasoning
# https://api.deepinfra.com/models/deepseek-ai/DeepSeek-V4-Flash-Vision-Exp/schema/openai-chat-completions
# https://api-docs.deepseek.com/guides/thinking_mode
base_model = "deepseek/deepseek-v4-flash-vision-exp"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "high", "max"]

[cost]
input = 0.44
output = 1.32
cache_read = 0.14

[limit]
context = 1_048_576
