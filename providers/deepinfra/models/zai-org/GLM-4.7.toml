# Lab identity: https://deepinfra.com/zai-org/GLM-4.7 (Hugging Face repo zai-org/GLM-4.7)
# Toggle: reasoning.enabled = true|false (reasoning_effort = "none" also disables); https://docs.deepinfra.com/chat/reasoning
# Mid-conversation (live probe, Chat Completions, 2026-10-21; notes/deepinfra-baseten-v2-2026-10-21/probe.ts):
#   a system message after turn 1 is moved to the front or rejected (cached prefix lost) [cached/prompt tokens, control -> test: 12576/12615 -> 0/12628; 12576/12615 -> 0/12628]
#   adding a tool between turns drops the cached prefix [cached/prompt tokens, control -> test: 12416/12436 -> 96/12496; 12416/12436 -> 96/12496]
schema = 2
base_model = "zhipuai/glm-4.7"
description = "Flagship GLM model for hybrid reasoning, coding, and agentic engineering"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true }
structured_output = true
cache = { implicit = true }
prompt_cache_key = true
service_tier = ["flex"]

[limit]
context = 202_752
output = 16_384

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.4
cache = { read = 0.08 }

[cost.text.output]
price = 1.75

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
