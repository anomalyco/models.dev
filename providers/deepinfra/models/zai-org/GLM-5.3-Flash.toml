# Effort: reasoning_effort = low|high|max; thinking cannot be disabled.
# https://docs.z.ai/guides/llm/glm-5.3-flash
# https://docs.deepinfra.com/api-reference/chat-completions/openai-chat-completions
# Mid-conversation (live probe, Chat Completions, 2026-10-21; notes/deepinfra-baseten-v2-2026-10-21/probe.ts): a system message after turn 1 is kept in place (cached prefix survives, instruction followed); changing reasoning_effort between turns drops the cached prefix; adding a tool between turns drops the cached prefix.
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { supported = true, implicit = true }
prompt_cache_key = true
system_updates = true
effort_updates = false

[limit]
context = 1_048_576

[cost.text.input]
price = 0.15
cache = { read = 0.03 }

[cost.text.output]
price = 0.5
