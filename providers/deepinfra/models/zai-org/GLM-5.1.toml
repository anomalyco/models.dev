# https://deepinfra.com/zai-org/GLM-5.1
# https://deepinfra.com/docs/advanced/max_tokens_limit
# Lab identity: https://deepinfra.com/zai-org/GLM-5.1 (Hugging Face repo zai-org/GLM-5.1)
# Toggle: reasoning.enabled = true|false (reasoning_effort = "none" also disables); https://docs.deepinfra.com/chat/reasoning
schema = 2
base_model = "zhipuai/glm-5.1"
description = "Flagship GLM model for hybrid reasoning, coding, and agentic engineering"
status = "deprecated"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
cache = { supported = true, implicit = true }
prompt_cache_key = true
service_tier = ["flex"]

[limit]
context = 202_752
output = 16_384

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.05
cache = { read = 0.205 }

[cost.text.output]
price = 3.5

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
