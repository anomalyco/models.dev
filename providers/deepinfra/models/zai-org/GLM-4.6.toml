# Lab identity: https://deepinfra.com/zai-org/GLM-4.6 (Hugging Face repo zai-org/GLM-4.6)
# Toggle: reasoning.enabled = true|false (reasoning_effort = "none" also disables); https://docs.deepinfra.com/chat/reasoning
# Mid-conversation (live probe, Chat Completions, 2026-10-21; notes/deepinfra-baseten-v2-2026-10-21/probe.ts):
#   a system message after turn 1 is moved to the front or rejected (cached prefix lost) [cached/prompt tokens, control -> test: 12608/12624 -> 0/12637; 12608/12624 -> 0/12637]
#   adding a tool between turns drops the cached prefix [cached/prompt tokens, control -> test: 12416/12445 -> 64/12505; 12416/12445 -> 64/12505]
schema = 2
base_model = "zhipuai/glm-4.6"
description = "Flagship GLM model for hybrid reasoning, coding, and agentic engineering"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true }
structured_output = true
cache = { supported = true, implicit = true }
prompt_cache_key = true
service_tier = ["flex"]
system_updates = false

[limit]
context = 202_752

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.5
cache = { read = 0.1 }

[cost.text.output]
price = 2

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
