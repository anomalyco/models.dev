# Lab identity: https://deepinfra.com/zai-org/GLM-4.7-Flash (Hugging Face repo zai-org/GLM-4.7-Flash)
schema = 2
base_model = "zhipuai/glm-4.7-flash"
description = "Efficient GLM model for fast reasoning, coding, and agent workflows"
status = "deprecated"

[capabilities]
reasoning = { supported = true }
structured_output = true
cache = { supported = true, implicit = true }
prompt_cache_key = true
service_tier = ["flex"]

[limit]
context = 202_752
output = 16_384

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.06
cache = { read = 0.01 }

[cost.text.output]
price = 0.4

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
