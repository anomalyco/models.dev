schema = 2
name = "GLM-4.7-Flash"
description = "Efficient GLM model for fast reasoning, coding, and agent workflows"
family = "glm-flash"
open_weights = true
knowledge = "2025-04"
release_date = "2026-01-19"
status = "deprecated"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
structured_output = true
temperature = true
cache = { supported = true, implicit = true }
prompt_cache_key = true
service_tier = ["flex"]

[limit]
context = 202_752
output = 16_384

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.06
cache = { read = 0.01 }

[cost.text.output]
price = 0.4

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
