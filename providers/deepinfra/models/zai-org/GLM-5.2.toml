# Toggle: reasoning.enabled = true|false (reasoning_effort = "none" also disables).
# Effort: reasoning_effort = high|max, GLM 5.2's levels (low|medium map to high,
# xhigh to max per https://docs.bigmodel.cn/cn/guide/capabilities/thinking-mode).
# DeepInfra's schema lists the generic none..max enum for every model and
# documents no per-model mapping, so the lab's levels apply.
# Sources:
# https://docs.deepinfra.com/api-reference/chat-completions/openai-chat-completions
# https://deepinfra.com/zai-org/GLM-5.2/api
# https://deepinfra.com/docs/advanced/max_tokens_limit
# Mid-conversation (live probe, Chat Completions, 2026-10-21; notes/deepinfra-baseten-v2-2026-10-21/probe.ts):
#   a system message after turn 1 is moved to the front or rejected (cached prefix lost) [cached/prompt tokens, control -> test: 12544/12624 -> 0/12638; 12544/12624 -> 0/12638]
#   changing reasoning_effort between turns drops the cached prefix [cached/prompt tokens, control -> test: 12800/12929 -> 0/12929 (reasoning tokens 69 -> 55); 12160/12289 -> 0/12289 (reasoning tokens 85 -> 64)]
#   adding a tool between turns drops the cached prefix [cached/prompt tokens, control -> test: 12352/12434 -> 0/12484; 12352/12434 -> 0/12484]
schema = 2
base_model = "zhipuai/glm-5.2"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true, effort = ["high", "max"] }
structured_output = true
cache = { implicit = true, explicit = { ttl = ["5m", "1h"], min_tokens = 1_024 } }
prompt_cache_key = true
service_tier = ["flex", "priority"]
system_updates = false
effort_updates = false

[limit]
context = 1_048_576
output = 32_768

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.75
cache = { read = 0.14, explicit = { write = { "5m" = 0.9375, "1h" = 1.5 } } }

[cost.text.output]
price = 2.4

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.5

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
