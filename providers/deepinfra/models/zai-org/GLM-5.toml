# Lab identity: https://deepinfra.com/zai-org/GLM-5 (Hugging Face repo zai-org/GLM-5)
# Toggle: reasoning.enabled = true|false (reasoning_effort = "none" also disables); https://docs.deepinfra.com/chat/reasoning
schema = 2
base_model = "zhipuai/glm-5"
description = "Flagship GLM model for hybrid reasoning, coding, and agentic engineering"
status = "deprecated"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
cache = { supported = true, implicit = true }
prompt_cache_key = true
service_tier = ["flex"]

[limit]
context = 202_752
output = 16_384

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.6
cache = { read = 0.12 }

[cost.text.output]
price = 2.08

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
