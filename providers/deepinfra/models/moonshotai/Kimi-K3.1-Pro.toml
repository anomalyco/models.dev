# DeepInfra OpenAI chat (POST https://api.deepinfra.com/v1/openai/chat/completions)
# model = "moonshotai/Kimi-K3.1-Pro".
# Prices, cached-read rate, service tiers and max_output_tokens (accessed 2026-11-07):
#   https://api.deepinfra.com/models/moonshotai/Kimi-K3.1-Pro ($2 in, cached read 0.1x, $10 out,
#   priority 1.5x, flex 0.8x; no explicit cache write price, so caching is implicit only)
# Context 1,048,576: https://api.deepinfra.com/v1/openai/models
# Request fields (prompt_cache_key, service_tier, response_format):
#   https://api.deepinfra.com/models/moonshotai/Kimi-K3.1-Pro/schema/openai-chat-completions
# Always-on reasoning; effort via top-level reasoning_effort = "low"|"high"|"max", the lab's native
# levels (providers/moonshotai/models/kimi-k3.1-pro.toml), as on DeepInfra's Kimi-K3. Not probed live.
# Image formats: jpg, png, webp (https://docs.deepinfra.com/chat/vision, Limitations).
schema = 2
base_model = "moonshotai/kimi-k3.1-pro"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }
prompt_cache_key = true
service_tier = ["flex", "priority"]

[limit]
output = 943_718

[cost.text.input]
price = 2
cache = { read = 0.2 }

[cost.text.output]
price = 10

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.5

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
