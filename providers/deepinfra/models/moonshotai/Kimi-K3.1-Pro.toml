schema = 2
base_model = "moonshotai/kimi-k3.1-pro"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
cache = { implicit = true }
prompt_cache_key = true
service_tier = ["flex", "priority"]

[cost.text.input]
price = 2
cache = { read = 0.2 }

[cost.text.output]
price = 10

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.5

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
