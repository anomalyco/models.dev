# Lab identity: https://deepinfra.com/moonshotai/Kimi-K2.5 (Hugging Face repo moonshotai/Kimi-K2.5)
# Toggle: reasoning.enabled = true|false (reasoning_effort = "none" also disables); https://docs.deepinfra.com/chat/reasoning
schema = 2
base_model = "moonshotai/kimi-k2.5"
description = "Kimi multimodal agent model for visual understanding, coding, and planning"
status = "deprecated"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
temperature = true
cache = { implicit = true }
prompt_cache_key = true
service_tier = ["flex", "priority"]

[limit]
output = 32_768

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.45
cache = { read = 0.07 }

[cost.text.output]
price = 2.25

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.5

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
