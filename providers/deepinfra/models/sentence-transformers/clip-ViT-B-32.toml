# Catalog (accessed 2026-11-08): https://api.deepinfra.com/models/list (type "embeddings", not deprecated),
#   model page https://deepinfra.com/sentence-transformers/clip-ViT-B-32; price 5e-7 cents per input token = $0.005/MTok, max_tokens 77.
# API: OpenAI-compatible POST https://api.deepinfra.com/v1/openai/embeddings, "supports the OpenAI embeddings API for all embedding models" (https://docs.deepinfra.com/apis/embeddings.md).
# Input: DeepInfra documents image content parts on this route only for the Nemotron 3.5 Embed models, so only text is listed.
schema = 2
v2_only = true
base_model = "sentence-transformers/clip-vit-b-32"

[modalities]
input = ["text"]
output = ["embedding"]

[api.embeddings]
sdk = { opencodeai = "none" }

[cost.text.input]
price = 0.005

[cost.text.output]
price = 0
