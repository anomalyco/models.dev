# Catalog (accessed 2026-11-08): https://api.deepinfra.com/models/list (type "embeddings", not deprecated),
#   model page https://deepinfra.com/sentence-transformers/all-mpnet-base-v2; price 5e-7 cents per input token = $0.005/MTok, max_tokens 512.
# API: OpenAI-compatible POST https://api.deepinfra.com/v1/openai/embeddings, "supports the OpenAI embeddings API for all embedding models" (https://docs.deepinfra.com/apis/embeddings.md).
# Context inherits the lab: DeepInfra's max_tokens 512 is above the model's trained sequence length.
schema = 2
v2_only = true
base_model = "sentence-transformers/all-mpnet-base-v2"

[api.embeddings]
sdk = { opencodeai = "none" }

[cost.text.input]
price = 0.005

[cost.text.output]
price = 0
