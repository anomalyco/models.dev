schema = 2
base_model = "alibaba/qwen3.5-9b"

[capabilities]
reasoning = { supported = true }
structured_output = true
service_tier = ["flex", "priority"]

[cost.text.input]
price = 0.1

[cost.text.output]
price = 0.15

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.5

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
