# Lab identity: https://deepinfra.com/Qwen/Qwen3.5-397B-A17B (Hugging Face repo Qwen/Qwen3.5-397B-A17B)
# Mid-conversation (live probe, Chat Completions, 2026-10-21; notes/deepinfra-baseten-v2-2026-10-21/probe.ts):
#   adding a tool between turns drops the cached prefix [cached/prompt tokens, control -> test: 14784/15794 -> None/15854; 14784/16114 -> None/16174]
schema = 2
base_model = "alibaba/qwen3.5-397b-a17b"
name = "Qwen 3.5 397B A17B"
description = "Qwen vision-language model for visual reasoning, documents, and agent tasks"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
structured_output = true
cache = { supported = true, implicit = true }
prompt_cache_key = true
service_tier = ["flex", "priority"]

[limit]
output = 81_920

[cost.text.input]
price = 0.45
cache = { read = 0.22 }

[cost.text.output]
price = 3

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.5

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
