# Image formats: jpg, png, webp (https://docs.deepinfra.com/chat/vision, Limitations).
schema = 2
base_model = "alibaba/qwen3-vl-30b-a3b-instruct"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp"]
output = ["text"]

[capabilities]
structured_output = true
service_tier = ["flex", "priority"]

[cost.text.input]
price = 0.15

[cost.text.output]
price = 0.6

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.5

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
