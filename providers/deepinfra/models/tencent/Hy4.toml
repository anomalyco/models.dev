# Price: https://api.deepinfra.com/models/list (tencent/Hy4, read 2026-11-22): $0.834 input, $0.042 cached input, $2.501 output per MTok;
#   1,048,576-token context. Controls and layout follow this host's Hy4-preview entry.
# Effort: reasoning_effort = none|high; none disables reasoning (no separate toggle).
# https://docs.deepinfra.com/chat/reasoning
# https://cloud.tencent.com/document/product/1823/131208
schema = 2
base_model = "tencent/hy4"

[capabilities]
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = true
cache = { implicit = true }
prompt_cache_key = true

[cost.text.input]
price = 0.834
cache = { read = 0.042 }

[cost.text.output]
price = 2.501
