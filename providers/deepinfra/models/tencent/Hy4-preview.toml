# Effort: reasoning_effort = none|high; none disables reasoning (no separate toggle).
# https://docs.deepinfra.com/chat/reasoning
# https://cloud.tencent.com/document/product/1823/131208
schema = 2
base_model = "tencent/hy4-preview"

[capabilities]
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = true
cache = { supported = true, implicit = true }
prompt_cache_key = true

[limit]
context = 1_048_576

[cost.text.input]
price = 0.834
cache = { read = 0.042 }

[cost.text.output]
price = 2.501
