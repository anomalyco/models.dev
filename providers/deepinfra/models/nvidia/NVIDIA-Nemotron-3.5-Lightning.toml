# Price and context: https://api.deepinfra.com/models/list?type=text-generation (nvidia/NVIDIA-Nemotron-3.5-Lightning, read 2026-11-24): $0.06 input, $0.16 output per 1M tokens,
#   cached input at 0.5x ($0.03); 262,144-token context; tags tools, structured-output.
# Toggle: reasoning.enabled = true|false (reasoning_effort = "none" also disables); https://docs.deepinfra.com/chat/reasoning
#   The model card's control is enable_thinking on/off only (https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16).
#   Default off: the card says thinking is on by default, but this deployment doesn't reason unless asked (probe below).
# Reasoning probe (live 2026-11-24, OpenRouter pinned to Deep Infra: provider.only = ["deepinfra"], allow_fallbacks = false;
#   the account's own Deep Infra balance was empty, so direct calls returned 402):
#   reasoning tokens: default 0 (4 of 4 trials), enabled=false 0, none 0; any effort turns it on (minimal..xhigh 397-792, no ordering).
schema = 2
base_model = "nvidia/nemotron-3.5-lightning"

[capabilities]
reasoning = { supported = true, toggle = true, default = { type = "toggle", value = false } }
structured_output = true
cache = { implicit = true }
prompt_cache_key = true

[cost.text.input]
price = 0.06
cache = { read = 0.03 }

[cost.text.output]
price = 0.16
