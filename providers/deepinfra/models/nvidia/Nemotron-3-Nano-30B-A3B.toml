schema = 2
base_model = "nvidia/nemotron-3-nano-30b-a3b"
status = "deprecated"

[capabilities]
reasoning = { supported = true, toggle = true }
cache = { supported = true, implicit = true }
prompt_cache_key = true
service_tier = ["flex", "priority"]

[cost.text.input]
price = 0.05
cache = { read = 0.025 }

[cost.text.output]
price = 0.2

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.5

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
