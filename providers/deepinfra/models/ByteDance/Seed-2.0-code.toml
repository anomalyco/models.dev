# Effort: reasoning_effort = none|low|medium|high
# https://docs.deepinfra.com/chat/reasoning
base_model = "bytedance-seed/seed-2.0-code"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high"] }]

[cost]
input = 0.5
output = 3
cache_read = 0.1

[[cost.tiers]]
tier = { type = "context", size = 128_000 }
input = 1
output = 6
cache_read = 0.2

[limit]
context = 256_000

[modalities]
input = ["text", "image"]
