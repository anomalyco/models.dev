# Effort: reasoning_effort = none|low|medium|high
# https://docs.deepinfra.com/chat/reasoning
schema = 2
base_model = "bytedance-seed/seed-2.0-code"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true

[limit]
context = 256_000

[cost.text.input]
price = 0.5
cache = { read = 0.1 }

[[cost.text.input.overrides]]
when = { context = { gt = 128_000 } }
price = 1
cache = { read = 0.2 }

[cost.text.output]
price = 3

[[cost.text.output.overrides]]
when = { context = { gt = 128_000 } }
price = 6
