# Effort: reasoning_effort = none|low|medium|high
# https://docs.deepinfra.com/chat/reasoning
# Image formats: jpg, png, webp (https://docs.deepinfra.com/chat/vision, Limitations).
# Mid-conversation (live probe, Chat Completions, 2026-10-21; notes/deepinfra-baseten-v2-2026-10-21/probe.ts):
#   a system message after turn 1 is moved to the front or rejected (cached prefix lost) [cached/prompt tokens, control -> test: 14904/14941 -> 0/14959; 14904/14941 -> 0/14959]
#   changing reasoning_effort between turns drops the cached prefix [cached/prompt tokens, control -> test: 15160/15237 -> 0/15238 (reasoning tokens 0 -> 175); 14392/14597 -> 0/14598 (reasoning tokens 0 -> 82)]
#   adding a tool between turns drops the cached prefix [cached/prompt tokens, control -> test: 14904/14949 -> 0/15000; 15160/15269 -> 0/15320]
schema = 2
base_model = "bytedance-seed/seed-2.0-code"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
cache = { implicit = true }
prompt_cache_key = true

[limit]
context = 256_000

[cost.text.input]
price = 0.5
cache = { read = 0.1 }

[[cost.text.input.overrides]]
when = { context = { gt = 128_000 } }
price = 1
cache = { read = 0.2 }

[cost.text.output]
price = 3

[[cost.text.output.overrides]]
when = { context = { gt = 128_000 } }
price = 6
