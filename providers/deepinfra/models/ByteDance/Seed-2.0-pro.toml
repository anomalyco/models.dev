# Image formats: jpg, png, webp (https://docs.deepinfra.com/chat/vision, Limitations).
# Mid-conversation (live probe, Chat Completions, 2026-10-21; notes/deepinfra-baseten-v2-2026-10-21/probe.ts):
#   a system message after turn 1 is moved to the front or rejected (cached prefix lost) [cached/prompt tokens, control -> test: 14904/14940 -> 0/14958; 14904/14940 -> 0/14958]
#   adding a tool between turns drops the cached prefix [cached/prompt tokens, control -> test: 14904/14950 -> 0/15001; 15160/15270 -> 0/15321]
schema = 2
base_model = "bytedance-seed/seed-2.0-pro"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
structured_output = true
cache = { implicit = true }
prompt_cache_key = true

[cost.text.input]
price = 0.5
cache = { read = 0.1 }

[[cost.text.input.overrides]]
when = { context = { gt = 128_000 } }
price = 1
cache = { read = 0.2 }

[cost.text.output]
price = 3

[[cost.text.output.overrides]]
when = { context = { gt = 128_000 } }
price = 6
