# Image formats: jpg, png, webp (https://docs.deepinfra.com/chat/vision, Limitations).
schema = 2
base_model = "bytedance-seed/seed-2.0-pro"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true
cache = { supported = true, implicit = true }
prompt_cache_key = true

[cost.text.input]
price = 0.5
cache = { read = 0.1 }

[[cost.text.input.overrides]]
when = { context = { gt = 128_000 } }
price = 1
cache = { read = 0.2 }

[cost.text.output]
price = 3

[[cost.text.output.overrides]]
when = { context = { gt = 128_000 } }
price = 6
