# Price, context and tags: https://api.deepinfra.com/models/list?type=text-generation (ByteDance/Seed-1.8, read 2026-11-24): "$0.25 in $2 out $0.05 cached <= 128K,
#   $0.5 in $4 out $0.1 cached" per 1M tokens (pricing.full); 256,000-token context; tags tools, multimodal, structured-output.
# Image formats: jpg, png, webp (https://docs.deepinfra.com/chat/vision, Limitations).
# Effort: reasoning_effort = none|low|medium|high; none disables reasoning (https://docs.deepinfra.com/chat/reasoning). Copied from
#   this host's Seed-2.0-code, whose live probe showed reasoning_effort changing reasoning on Deep Infra (reasoning tokens 0 -> 175 / 0 -> 82).
#   Not probed for Seed 1.8 itself: the Deep Infra account had no balance and Seed 1.8 isn't on OpenRouter.
schema = 2
base_model = "bytedance-seed/seed-1-8"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
cache = { implicit = true }
prompt_cache_key = true

[cost.text.input]
price = 0.25
cache = { read = 0.05 }

[[cost.text.input.overrides]]
when = { context = { gt = 128_000 } }
price = 0.5
cache = { read = 0.1 }

[cost.text.output]
price = 2

[[cost.text.output.overrides]]
when = { context = { gt = 128_000 } }
price = 4
