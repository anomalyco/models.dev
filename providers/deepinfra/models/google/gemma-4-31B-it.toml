# Image formats: jpg, png, webp (https://docs.deepinfra.com/chat/vision, Limitations).
# Video input: catalog tag input-video; DeepInfra documents no video formats and the lab lists none.
schema = 2
base_model = "google/gemma-4-31b-it"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp", "video"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
service_tier = ["flex", "priority"]

[cost.text.input]
price = 0.2

[cost.text.output]
price = 0.4

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.5

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
