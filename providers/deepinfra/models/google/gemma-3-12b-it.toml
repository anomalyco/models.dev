schema = 2
base_model = "google/gemma-3-12b-it"

[capabilities]
structured_output = true
service_tier = ["flex", "priority"]

[cost.text.input]
price = 0.05

[cost.text.output]
price = 0.15

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.5

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
