# Pricing from https://aicraftapi.net/pricing.html (accessed 2026-11-20), USD per million tokens.
# Model id as published in the AICraft Model Catalog.
# Native decision model: POST /v1/systemone (System One format) or POST /v1/decisions (OpenAI Decisions format); /v1/chat/completions is refused (https://aicraftapi.net/docs.html).
schema = 2
base_model = "typesafe/jev-1.13.0"

[capabilities]
reasoning = { supported = false }

[api.systemone]
sdk = { aisdk = "@ai-sdk/typesafe-ai", opencodeai = "@opencode/ai/providers/typesafe-ai/decisions" }

[api.decisions]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "none" }

[cost.text.input]
price = 0.0464

[cost.text.output]
price = 0
