name = "Inference"
env = ["INFERENCE_API_KEY"]
npm = "@ai-sdk/openai-compatible"
# Models are synced from https://api.inference.net/v1/models (public). Reasoning
# is controlled with reasoning_effort on POST /v1/chat/completions; each model's
# accepted levels are its `reasoning_efforts`, where `none` turns reasoning off.
# https://docs.inference.net/api/reasoning
api = "https://api.inference.net/v1"
doc = "https://docs.inference.net/api/api-quickstart"
