# Pricing, limits, and reasoning controls from the inference.net public
# model catalog: https://inference.net/models (accessed 2026-08-14).
base_model = "anthropic/claude-fable-5"

[[reasoning_options]]
type = "effort"
values = ["none", "minimal", "low", "medium", "high", "xhigh", "max"]

[cost]
input = 10
output = 50
cache_read = 1
cache_write = 12.5
