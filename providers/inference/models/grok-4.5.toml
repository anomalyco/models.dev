# Pricing, limits, and reasoning controls from the inference.net public
# model catalog: https://inference.net/models (accessed 2026-08-14).
base_model = "xai/grok-4.5"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
input = 2
output = 6
cache_read = 0.3

[[cost.tiers]]
tier = { type = "context", size = 200_000 }
input = 4
output = 12
cache_read = 0.6
