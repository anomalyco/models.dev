# Pricing, limits, and reasoning controls from the inference.net public
# model catalog: https://inference.net/models (accessed 2026-08-14).
base_model = "openai/gpt-5.6-terra"

[[reasoning_options]]
type = "effort"
values = ["none", "minimal", "low", "medium", "high", "xhigh"]

[cost]
input = 2
output = 12
cache_read = 0.2
cache_write = 2.5

[[cost.tiers]]
tier = { type = "context", size = 272_000 }
input = 4
output = 18
cache_read = 0.4
