# Image MIME types: https://docs.inference.net/api/vision (Limitations: "webp, png, gif and jpg/jpeg", accessed 2026-10-21).
schema = 2
name = "Google Gemma 3"
description = "Open Gemma instruction model for efficient chat and self-hosted deployments"
family = "gemma"
open_weights = true
knowledge = "2024-12"
release_date = "2025-01-01"

[modalities]
input = ["text", "image/webp", "image/png", "image/gif", "image/jpeg"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true

[limit]
context = 125_000
output = 4_096

[cost.text.input]
price = 0.15

[cost.text.output]
price = 0.3
