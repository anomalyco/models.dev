# Sources (accessed 2026-10-22): GET https://router.sokkan.ch/v1/models (pricing in USD per 1M tokens,
#   context_length, max_output_tokens, availability "on_demand"), https://router.sokkan.ch/docs
# Effort: reasoning_effort = none|low|medium|high; none disables thinking (no separate toggle).
# Live 2026-10-22 (max_tokens 64, one call per value): "none" -> no reasoning, answer in 2 tokens; low/medium/high
#   and omitted -> finish "length" at 64 tokens of reasoning; "bogus" -> HTTP 422 listing the accepted enum.
#   The Qwen-native enable_thinking, chat_template_kwargs.enable_thinking and thinking_budget are rejected (HTTP 400).
# Zone: EU. Cached input is billed at the input price.
schema = 2
base_model = "alibaba/qwen3.5-397b-a17b"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }

[limit]
output = 32_768

[cost.text.input]
price = 1
cache = { read = 1 }

[cost.text.output]
price = 6
