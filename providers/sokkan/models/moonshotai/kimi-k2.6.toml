# Sources (accessed 2026-10-22): GET https://router.sokkan.ch/v1/models (pricing in USD per 1M tokens,
#   context_length, max_output_tokens, availability "on_demand"), https://router.sokkan.ch/docs
# Toggle: reasoning_effort = "none" (off) | "low"|"medium"|"high" (on); thinking is on when omitted. Binary, not graded.
# Live 2026-10-22 (max_tokens 64, one call per value): "none" -> 0 reasoning_tokens, answer in 2 tokens;
#   low/medium/high/omitted -> 64 reasoning_tokens ("bogus" is also accepted and keeps thinking on);
#   the Moonshot-native thinking.type = "disabled" is ignored on this host (64 reasoning_tokens).
# Zone: CH. Cached input is billed at the input price.
schema = 2
base_model = "moonshotai/kimi-k2.6"

[capabilities]
reasoning = { supported = true, toggle = true }

[limit]
context = 131_072
output = 32_768

[cost.text.input]
price = 0.85
cache = { read = 0.85 }

[cost.text.output]
price = 4.15
