# Reasoning HTTP format (accessed 2026-08-04):
# OpenAI Chat: POST https://inference.coralbricks.ai/v1/chat/completions.
# Reasoning models stream interleaved thinking via a `reasoning` delta field
# (OpenRouter-style). Toggle: reasoning.enabled = true|false (verified 2026-08-04:
# enabled=false yields reasoning_tokens=0). Effort and token budget: not
# documented. Streaming always returns usage in the final chunk.
# Sources:
# https://www.coralbricks.ai/docs
name = "CoralBricks"
env = ["CORAL_API_KEY"]
npm = "@ai-sdk/openai-compatible"
doc = "https://www.coralbricks.ai/docs"
api = "https://inference.coralbricks.ai/v1"
