# glm-5.3-fast is the one ID CoralBricks advertises for this model since it renamed its public model IDs on 2026-10-04.
# The earlier ID, glm-5.3-fp4, was listed here beside it until 2026-10-13. The gateway still accepts it as an alias at
# the same rates, and https://www.coralbricks.ai/api/public/models lists it under deprecatedSlugs for this model.
# Pricing per https://www.coralbricks.ai/pricing and https://www.coralbricks.ai/api/public/models (accessed 2026-10-04):
# input $1.12, output $4.40, cache write $1.68 per 1M tokens; cached input is free.
# Effort: reasoning_effort = low|high|max. Verified live against
# POST https://inference.coralbricks.ai/v1/chat/completions (2026-10-04): all three return HTTP 200 on this ID.
base_model = "zhipuai/glm-5.3"
reasoning_options = [{ type = "effort", values = ["low", "high", "max"] }]
interleaved = true

[limit]
context = 1_048_576
output = 131_072

[cost]
input = 1.12
output = 4.4
cache_read = 0
cache_write = 1.68
