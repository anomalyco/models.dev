# Reasoning controls copied from the providers/openai/models/gpt-5.4-nano.toml lab baseline.
# Effort: reasoning_effort = none|low|medium|high|xhigh
base_model = "openai/gpt-5.4-nano"
name = "GPT-5.4 Nano"
attachment = false

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "xhigh"]

[cost]
input = 0.2
output = 1.25
cache_read = 0.02

[modalities]
input = ["text"]
