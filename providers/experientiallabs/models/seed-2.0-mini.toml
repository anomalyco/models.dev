# Reasoning controls copied from the providers/openrouter/models/bytedance-seed/seed-2.0-mini.toml relay peer baseline.
# Effort: reasoning_effort = minimal|low|medium|high
# Toggle and budget controls from the source are not emitted: the Experiential Labs OpenAI-compatible chat surface exposes no native on/off or budget request field - enable_thinking and thinking are translated to reasoning_effort and thinking_budget is rejected on unqualified routes (live-tested 2026-10-07; see platform.experientiallabs.ai/llms.txt).
base_model = "bytedance-seed/seed-2.0-mini"

[[reasoning_options]]
type = "effort"
values = ["minimal", "low", "medium", "high"]

[cost]
input = 0.1
output = 0.4
cache_read = 0.1

[[cost.tiers]]
tier = { type = "context", size = 128_001 }
input = 0.2
output = 0.8

[limit]
context = 262_144
input = 131_072
output = 131_072
