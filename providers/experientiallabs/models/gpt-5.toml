# Reasoning controls copied from the providers/openai/models/gpt-5.toml lab baseline.
base_model = "openai/gpt-5"
attachment = false

[[reasoning_options]]
type = "effort"
values = ["minimal", "low", "medium", "high"]

[cost]
input = 1.25
output = 10
cache_read = 0.125

[modalities]
input = ["text"]
