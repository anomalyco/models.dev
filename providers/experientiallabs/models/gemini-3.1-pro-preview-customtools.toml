# Reasoning controls copied from the providers/google/models/gemini-3.1-pro-preview-customtools.toml lab baseline.
base_model = "google/gemini-3.1-pro-preview-customtools"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
input = 2
output = 12
cache_read = 0.2
cache_write = 0.575

[limit]
input = 1_048_576
