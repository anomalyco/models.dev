# Reasoning controls copied from the providers/alibaba/models/qwen3.8-flash.toml lab baseline.
# Toggle: enable_thinking true|false (hybrid)
# Effort: reasoning_effort = low|medium|xhigh (not yet in the API reference; see
# Budget: thinking_budget (Max Reasoning 262K)
base_model = "alibaba/qwen3.8-flash"
temperature = true

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "xhigh"]

[[reasoning_options]]
type = "budget_tokens"
max = 262_144

[cost]
input = 0.15
output = 0.47
cache_read = 0.016

[limit]
input = 868_928
