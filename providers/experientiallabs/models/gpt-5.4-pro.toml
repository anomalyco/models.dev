# Source: https://api.experientiallabs.ai/api/models/gpt-5.4-pro
# List prices in USD per million tokens; temporary promotions are excluded.
# Reasoning baseline: providers/openai/models/gpt-5.4-pro.toml; restricted to all default serving routes.
# Effort: top-level reasoning_effort = medium|high|xhigh.
# Host protocol: https://platform.experientiallabs.ai/docs/openai-compatibility
schema = 2
base_model = "openai/gpt-5.4-pro"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["medium", "high", "xhigh"] }
structured_output = true

[cost.text.input]
price = 30

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 60

[cost.text.output]
price = 180

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 270
