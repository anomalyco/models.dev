# Reasoning controls copied from the providers/moonshotai/models/kimi-k3.toml lab baseline.
# Effort: reasoning_effort = "low" | "high" | "max" (default "max").
base_model = "moonshotai/kimi-k3"
temperature = true

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 3
output = 15
cache_read = 0.23

[limit]
input = 1_048_576
