# Reasoning controls copied from the providers/minimax/models/MiniMax-M3.toml lab baseline.
# Toggle and budget controls from the source are not emitted: the Experiential Labs chat surface exposes no native on/off or budget request field - enable_thinking is translated to reasoning_effort, which the MiniMax serving route rejects entirely (live-tested 2026-10-07 on minimax-m3: HTTP 400 unsupported_parameter, param reasoning_effort) (see platform.experientiallabs.ai/llms.txt).
# Reasoning controls: none emitted - the lab/peer baseline documents no effort levels, and its toggle/budget controls have no native request fields on this surface: enable_thinking is translated to reasoning_effort, which the MiniMax serving route rejects entirely (live-tested 2026-10-07 on minimax-m3: HTTP 400 unsupported_parameter, param reasoning_effort). reasoning_effort is the only reasoning wire and passes through unchanged where the route supports it (platform.experientiallabs.ai/llms.txt).
base_model = "minimax/MiniMax-M3"
name = "Minimax M3"
attachment = false
structured_output = true
reasoning_options = []

[cost]
input = 0.3
output = 1.2
cache_read = 0.06

[limit]
context = 1_000_000
input = 1_000_000

[modalities]
input = ["text"]
