# Reasoning controls copied from the providers/anthropic/models/claude-opus-4-5.toml lab baseline.
base_model = "anthropic/claude-opus-4-5"
name = "Claude Opus 4.5"
structured_output = true

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[[reasoning_options]]
type = "budget_tokens"
min = 1_024

[cost]
input = 5
output = 25

[limit]
input = 200_000
