# Reasoning controls copied from the providers/anthropic/models/claude-opus-5.toml lab baseline.
base_model = "anthropic/claude-opus-5"
temperature = true
structured_output = true

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh", "max"]

[cost]
input = 5
output = 25
cache_read = 0.5

[limit]
input = 1_000_000
