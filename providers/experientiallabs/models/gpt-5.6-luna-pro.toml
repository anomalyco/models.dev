# Reasoning controls copied from the providers/openai/models/gpt-5.6-luna.toml lab baseline.
# Effort: reasoning_effort = none|low|medium|high|xhigh|max
base_model = "openai/gpt-5.6-luna"
name = "GPT-5.6 Luna Pro"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "xhigh", "max"]

[cost]
input = 0.2
output = 1.2
cache_read = 0.02

[[cost.tiers]]
tier = { type = "context", size = 272_001 }
input = 0.4
output = 1.8
cache_read = 0.04
