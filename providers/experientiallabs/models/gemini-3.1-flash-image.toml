# Reasoning controls copied from the providers/google/models/gemini-3.1-flash-image.toml lab baseline.
# Effort: reasoning_effort = minimal|high
base_model = "google/gemini-3.1-flash-image"
name = "Nano Banana 2 (Gemini 3.1 Flash Image)"
structured_output = true

[[reasoning_options]]
type = "effort"
values = ["minimal", "high"]

[cost]
input = 0.5
output = 3

[limit]
context = 65_536
input = 65_536

[modalities]
input = ["text", "image"]
