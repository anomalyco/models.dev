# Reasoning controls copied from the providers/openai/models/gpt-5-mini.toml lab baseline.
# Effort: reasoning_effort = minimal|low|medium|high
base_model = "openai/gpt-5-mini"
attachment = false

[[reasoning_options]]
type = "effort"
values = ["minimal", "low", "medium", "high"]

[cost]
input = 0.25
output = 2
cache_read = 0.025

[modalities]
input = ["text"]
