# Reasoning controls copied from the providers/openai/models/gpt-5.4-mini.toml lab baseline.
# Effort: reasoning_effort = none|low|medium|high|xhigh
base_model = "openai/gpt-5.4-mini"
name = "GPT-5.4 Mini"
attachment = false

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "xhigh"]

[cost]
input = 0.75
output = 4.5
cache_read = 0.075

[modalities]
input = ["text"]
