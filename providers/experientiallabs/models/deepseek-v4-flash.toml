# Reasoning controls copied from the providers/deepseek/models/deepseek-v4-flash.toml lab baseline.
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|high|max https://api-docs.deepseek.com/quick_start/pricing (accessed 2026-09-10)
base_model = "deepseek/deepseek-v4-flash"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
