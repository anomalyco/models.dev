# Reasoning controls copied from the providers/xai/models/grok-4.3.toml lab baseline.
# Effort: reasoning_effort = none|low|medium|high
base_model = "xai/grok-4.3"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high"]

[cost]
input = 1.25
output = 2.5
cache_read = 0.2

[limit]
input = 1_000_000
