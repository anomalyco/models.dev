# Reasoning controls copied from the providers/openai/models/gpt-5.1.toml lab baseline.
# Effort: reasoning_effort = none|low|medium|high
base_model = "openai/gpt-5.1"
attachment = false

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high"]

[cost]
input = 1.25
output = 10
cache_read = 0.125

[modalities]
input = ["text"]
