# Source: https://api.experientiallabs.ai/api/models/gpt-5.1
# List prices in USD per million tokens; temporary promotions are excluded.
# Reasoning baseline: providers/openai/models/gpt-5.1.toml; restricted to all default serving routes.
# Effort: top-level reasoning_effort = none|low|medium|high.
# Host protocol: https://platform.experientiallabs.ai/docs/openai-compatibility
schema = 2
base_model = "openai/gpt-5.1"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 1.25
cache = { read = 0.125 }

[cost.text.output]
price = 10
