# Reasoning controls copied from the providers/anthropic/models/claude-sonnet-5.toml lab baseline.
base_model = "anthropic/claude-sonnet-5"
structured_output = true

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh", "max"]

[cost]
input = 2
output = 10
cache_read = 0.2

[limit]
input = 1_000_000
