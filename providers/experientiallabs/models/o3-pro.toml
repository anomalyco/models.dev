# Reasoning controls copied from the providers/openai/models/o3-pro.toml lab baseline.
# Effort: reasoning_effort = low|medium|high
base_model = "openai/o3-pro"
name = "o3 Pro"
attachment = false

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
input = 20
output = 80
cache_read = 20

[limit]
input = 100_000

[modalities]
input = ["text"]
