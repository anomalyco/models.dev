# Reasoning controls copied from the providers/openrouter/models/bytedance-seed/seed-2.0-lite.toml relay peer baseline.
# Toggle: reasoning.enabled = true|false https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
base_model = "bytedance-seed/seed-2.0-lite"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["minimal", "low", "medium", "high"]

[cost]
input = 0.25
output = 2
cache_read = 0.25

[[cost.tiers]]
tier = { type = "context", size = 128_001 }
input = 0.5
output = 4

[limit]
context = 262_144
input = 131_072
output = 131_072
