# Reasoning controls copied from the providers/openai/models/gpt-6-astra.toml lab baseline.
# Effort: reasoning_effort = low|medium|high|xhigh|max
base_model = "openai/gpt-6-astra"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh", "max"]

[cost]
input = 10
output = 50
cache_read = 1

[modalities]
input = ["text", "image"]
