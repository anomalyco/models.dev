# Reasoning controls copied from the providers/google/models/gemini-2.5-flash-lite.toml lab baseline.
base_model = "google/gemini-2.5-flash-lite"
name = "Gemini 2.5 Flash Lite"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "budget_tokens"
min = 512
max = 24_576

[cost]
input = 0.1
output = 0.4
cache_read = 0.01

[limit]
input = 1_048_576
