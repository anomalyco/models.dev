# Reasoning controls copied from the providers/alibaba/models/qwen3.8-max.toml lab baseline.
# Effort: reasoning_effort = low|medium|xhigh
# Toggle and budget controls from the source are not emitted: the Experiential Labs chat surface exposes no native on/off or budget request field - thinking_budget is rejected and enable_thinking is translated to reasoning_effort (live-tested 2026-10-07 on qwen3.5-122b-a10b and qwen3.5-27b: HTTP 400 unsupported_parameter; x-experiential-ignored-parameters ["enable_thinking->translated(reasoning_effort)"]) (see platform.experientiallabs.ai/llms.txt).
base_model = "alibaba/qwen3.8-max"
structured_output = true

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "xhigh"]

[cost]
input = 2
output = 6
cache_read = 0.25

[limit]
input = 868_928

[modalities]
input = ["text", "image", "video"]
