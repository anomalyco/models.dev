# Reasoning controls copied from the providers/alibaba/models/qwen3.8-max.toml lab baseline.
# Toggle: enable_thinking true|false (hybrid)
# Effort: reasoning_effort = low|medium|xhigh (default xhigh); high accepted as alias → xhigh
# Budget: thinking_budget (0..262144) cannot be combined with reasoning_effort
base_model = "alibaba/qwen3.8-max"
structured_output = true

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "xhigh"]

[[reasoning_options]]
type = "budget_tokens"
min = 0
max = 262_144

[cost]
input = 2
output = 6
cache_read = 0.25

[limit]
input = 868_928

[modalities]
input = ["text", "image", "video"]
