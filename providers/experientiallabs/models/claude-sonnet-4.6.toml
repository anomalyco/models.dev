# Reasoning controls copied from the providers/anthropic/models/claude-sonnet-4-6.toml lab baseline.
base_model = "anthropic/claude-sonnet-4-6"
structured_output = true

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "max"]

[[reasoning_options]]
type = "budget_tokens"
min = 1_024

[cost]
input = 3
output = 15

[limit]
input = 1_000_000
output = 128_000
