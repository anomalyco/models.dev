# Reasoning controls copied from the providers/deepseek/models/deepseek-v4-pro.toml lab baseline.
# Toggle: thinking.type = enabled|disabled on /chat/completions.
# Effort: reasoning_effort = low|high|max; default high.
base_model = "deepseek/deepseek-v4-pro"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 1.44
output = 2.88
cache_read = 0.1215

[limit]
context = 1_048_576
input = 655_360
output = 393_216
