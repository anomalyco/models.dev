# Reasoning controls copied from the providers/google/models/gemini-3.5-flash.toml lab baseline.
# Effort: reasoning_effort = minimal|low|medium|high
base_model = "google/gemini-3.5-flash"

[[reasoning_options]]
type = "effort"
values = ["minimal", "low", "medium", "high"]

[cost]
input = 1.5
output = 9
cache_read = 0.15
cache_write = 0.233333

[limit]
input = 1_048_576
