# Reasoning controls copied from the providers/alibaba/models/qwen3.7-plus.toml lab baseline.
# Toggle: enable_thinking true|false
# Budget: thinking_budget (integer reasoning tokens)
base_model = "alibaba/qwen3.7-plus"
structured_output = true

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 0.4
output = 1.6
cache_read = 0.08

[limit]
input = 868_928
output = 131_072

[modalities]
input = ["text", "image"]
