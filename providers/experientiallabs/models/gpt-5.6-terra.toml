# Reasoning controls copied from the providers/openai/models/gpt-5.6-terra.toml lab baseline.
# Effort: reasoning_effort = none|low|medium|high|xhigh|max
base_model = "openai/gpt-5.6-terra"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "xhigh", "max"]

[cost]
input = 2
output = 12
cache_read = 0.2
