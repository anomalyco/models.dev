# Reasoning controls copied from the providers/openai/models/o3.toml lab baseline.
# Effort: reasoning_effort = low|medium|high
base_model = "openai/o3"
attachment = false

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
input = 2
output = 8
cache_read = 0.5
cache_write = 2.5

[limit]
input = 100_000

[modalities]
input = ["text"]
