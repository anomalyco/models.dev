# Reasoning controls copied from the providers/anthropic/models/claude-sonnet-4-5.toml lab baseline.
# Toggle and budget controls from the source are not emitted: the Experiential Labs chat surface exposes no native on/off or budget request field - thinking_budget is rejected on the Anthropic serving route (live-tested 2026-10-07 on claude-haiku-4.5 and claude-sonnet-4.5: HTTP 400 unsupported_parameter) (see platform.experientiallabs.ai/llms.txt).
# Reasoning controls: none emitted - the lab/peer baseline documents no effort levels, and its toggle/budget controls have no native request fields on this surface: thinking_budget is rejected on the Anthropic serving route (live-tested 2026-10-07 on claude-haiku-4.5 and claude-sonnet-4.5: HTTP 400 unsupported_parameter). reasoning_effort is the only reasoning wire and passes through unchanged where the route supports it (platform.experientiallabs.ai/llms.txt).
base_model = "anthropic/claude-sonnet-4-5"
name = "Claude Sonnet 4.5"
structured_output = true
reasoning_options = []

[cost]
input = 3
output = 15

[limit]
input = 200_000
