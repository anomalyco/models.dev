# Reasoning controls copied from the providers/google/models/gemini-3.6-flash.toml lab baseline.
base_model = "google/gemini-3.6-flash"

[[reasoning_options]]
type = "effort"
values = ["minimal", "low", "medium", "high"]

[cost]
input = 0.75
output = 3.75
cache_read = 0.075
cache_write = 0.116667

[limit]
input = 1_048_576
