# Reasoning controls copied from the providers/anthropic/models/claude-opus-4-8.toml lab baseline.
# Effort: reasoning_effort = low|medium|high|xhigh|max
base_model = "anthropic/claude-opus-4-8"
name = "Claude Opus 4.8 (Fast)"
structured_output = true

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh", "max"]

[cost]
input = 10
output = 50
cache_read = 1

[limit]
input = 1_000_000
