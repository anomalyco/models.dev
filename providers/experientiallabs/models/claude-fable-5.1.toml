# Reasoning controls copied from the providers/anthropic/models/claude-fable-5-1.toml lab baseline.
base_model = "anthropic/claude-fable-5-1"
structured_output = true

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh", "max"]

[cost]
input = 10
output = 50
cache_read = 0.25

[limit]
input = 1_000_000

[modalities]
input = ["text", "image"]
