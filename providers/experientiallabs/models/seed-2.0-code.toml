# Reasoning controls copied from the providers/openrouter/models/bytedance-seed/seed-2.0-code.toml relay peer baseline.
# Toggle: reasoning.enabled = true|false
# Effort: reasoning.effort = low|medium|high
base_model = "bytedance-seed/seed-2.0-code"
name = "Seed-2.0-Code"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
input = 0.5
output = 3
cache_read = 0.5

[[cost.tiers]]
tier = { type = "context", size = 128_001 }
input = 1
output = 6

[limit]
input = 131_072
