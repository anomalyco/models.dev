# Reasoning controls copied from the providers/openrouter/models/deepseek/deepseek-v4.1-flash.toml relay peer baseline.
# Effort: reasoning_effort = low|high|max
# Toggle and budget controls from the source are not emitted: the Experiential Labs chat surface exposes no native on/off or budget request field - thinking_budget is rejected and thinking/enable_thinking are translated to reasoning_effort (live-tested 2026-10-07 on deepseek-v4-pro-0813: HTTP 400 unsupported_parameter; x-experiential-ignored-parameters ["thinking->translated(reasoning_effort)"]; the route's own error lists supported efforts low|high|max) (see platform.experientiallabs.ai/llms.txt).
base_model = "deepseek/deepseek-v4.1-flash"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 0.3
output = 1.2
reasoning = 1.2
cache_read = 0.006
cache_write = 0.3

[limit]
context = 1_048_576
input = 655_360
output = 393_216
