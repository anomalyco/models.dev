# Source: https://api.experientiallabs.ai/api/models/claude-opus-5.5
# List prices in USD per million tokens; temporary promotions are excluded.
# Reasoning baseline: providers/anthropic/models/claude-opus-5-5.toml; restricted to all default serving routes.
# Effort: top-level reasoning_effort = low|medium|high|xhigh|max.
# Host protocol: https://platform.experientiallabs.ai/docs/openai-compatibility
schema = 2
base_model = "anthropic/claude-opus-5-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
temperature = true

[limit]
input = 1_000_000

[cost.text.input]
price = 4
cache = { read = 0.2, write = 5 }

[cost.text.output]
price = 20
