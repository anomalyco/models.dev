# Source: https://api.experientiallabs.ai/api/models/gpt-5.6-sol
# List prices in USD per million tokens; temporary promotions are excluded.
# Reasoning baseline: providers/openai/models/gpt-5.6-sol.toml; restricted to all default serving routes.
# Effort: top-level reasoning_effort = none|low|medium|high|xhigh.
# Host protocol: https://platform.experientiallabs.ai/docs/openai-compatibility
schema = 2
base_model = "openai/gpt-5.6-sol"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true

[cost.text.input]
price = 4
cache = { read = 0.4, write = 5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 8
cache = { read = 0.8 }

[cost.text.output]
price = 20

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 30
