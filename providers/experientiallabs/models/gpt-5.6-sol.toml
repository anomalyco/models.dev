# Reasoning controls copied from the providers/openai/models/gpt-5.6-sol.toml lab baseline.
# Effort: reasoning_effort = none|low|medium|high|xhigh|max
base_model = "openai/gpt-5.6-sol"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "xhigh", "max"]

[cost]
input = 4
output = 20
reasoning = 20
cache_read = 0.4
cache_write = 5

[[cost.tiers]]
tier = { type = "context", size = 272_001 }
input = 8
output = 30
cache_read = 0.8
