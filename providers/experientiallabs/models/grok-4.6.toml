# Reasoning controls copied from the providers/xai/models/grok-4.6.toml lab baseline.
# Effort: reasoning_effort = low|medium|high|xhigh
base_model = "xai/grok-4.6"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh"]

[cost]
input = 2
output = 6
cache_read = 0.5

[limit]
input = 372_000
output = 128_000

[modalities]
input = ["text", "image", "pdf"]
