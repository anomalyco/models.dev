# Source: https://api.experientiallabs.ai/api/models/o4-mini
# List prices in USD per million tokens; temporary promotions are excluded.
# Reasoning baseline: providers/openai/models/o4-mini.toml; restricted to all default serving routes.
# Effort: top-level reasoning_effort = low|medium|high.
# Host protocol: https://platform.experientiallabs.ai/docs/openai-compatibility
schema = 2
base_model = "openai/o4-mini"
name = "o4 Mini"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
input = 100_000

[cost.text.input]
price = 1.1
cache = { read = 0.275, write = 1.375 }

[cost.text.output]
price = 4.4
