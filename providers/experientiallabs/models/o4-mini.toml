# Reasoning controls copied from the providers/openai/models/o4-mini.toml lab baseline.
# Effort: reasoning_effort = low|medium|high
base_model = "openai/o4-mini"
name = "o4 Mini"
attachment = false

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
input = 1.1
output = 4.4
cache_read = 0.275

[limit]
input = 100_000

[modalities]
input = ["text"]
