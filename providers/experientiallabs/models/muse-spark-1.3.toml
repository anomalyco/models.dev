# Reasoning controls copied from the providers/meta/models/muse-spark-1.3.toml lab baseline.
# Effort: reasoning_effort (Chat Completions) or reasoning.effort (Responses) = minimal|low|medium|high|xhigh|max
base_model = "meta/muse-spark-1.3"
attachment = false

[[reasoning_options]]
type = "effort"
values = ["minimal", "low", "medium", "high", "xhigh"]

[cost]
input = 1.25
output = 4.25
cache_read = 0.15

[limit]
input = 1_032_192
output = 16_384

[modalities]
input = ["text"]
