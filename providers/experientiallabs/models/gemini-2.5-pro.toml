# Reasoning controls copied from the providers/google/models/gemini-2.5-pro.toml lab baseline.
# Toggle and budget controls from the source are not emitted: the Experiential Labs chat surface exposes no native on/off or budget request field - thinking_budget is rejected and enable_thinking is translated to reasoning_effort on the Google serving routes (live-tested 2026-10-07 on gemini-2.5-flash, gemini-2.5-pro and gemma-4-26b-a4b-it: HTTP 400 unsupported_parameter; on gemma-4-26b-a4b-it x-experiential-ignored-parameters ["enable_thinking->translated(reasoning_effort)"]) (see platform.experientiallabs.ai/llms.txt).
# Reasoning controls: none emitted - the lab/peer baseline documents no effort levels, and its toggle/budget controls have no native request fields on this surface: thinking_budget is rejected and enable_thinking is translated to reasoning_effort on the Google serving routes (live-tested 2026-10-07 on gemini-2.5-flash, gemini-2.5-pro and gemma-4-26b-a4b-it: HTTP 400 unsupported_parameter; on gemma-4-26b-a4b-it x-experiential-ignored-parameters ["enable_thinking->translated(reasoning_effort)"]). reasoning_effort is the only reasoning wire and passes through unchanged where the route supports it (platform.experientiallabs.ai/llms.txt).
base_model = "google/gemini-2.5-pro"
reasoning_options = []

[cost]
input = 1.25
output = 10
cache_read = 0.125

[[cost.tiers]]
tier = { type = "context", size = 200_001 }
input = 2.5
output = 15
cache_read = 0.25

[limit]
input = 1_048_576
