# Source: https://api.experientiallabs.ai/api/models/gpt-6-luna
# List prices in USD per million tokens; temporary promotions are excluded.
# Reasoning baseline: providers/openai/models/gpt-6-luna.toml; restricted to all default serving routes.
# Effort: top-level reasoning_effort = none|low|medium|high|xhigh|max.
# Host protocol: https://platform.experientiallabs.ai/docs/openai-compatibility
schema = 2
base_model = "openai/gpt-6-luna"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
temperature = true

[cost.text.input]
price = 0.1
cache = { read = 0.01, write = 0.125 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 0.2
cache = { read = 0.02 }

[cost.text.output]
price = 0.5

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 0.75
