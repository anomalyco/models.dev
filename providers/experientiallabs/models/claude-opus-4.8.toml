# Source: https://api.experientiallabs.ai/api/models/claude-opus-4.8
# List prices in USD per million tokens; temporary promotions are excluded.
# Reasoning baseline: providers/anthropic/models/claude-opus-4-8.toml; restricted to all default serving routes.
# Effort: top-level reasoning_effort = low|medium|high|xhigh|max.
# Host protocol: https://platform.experientiallabs.ai/docs/openai-compatibility
schema = 2
base_model = "anthropic/claude-opus-4-8"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = false
temperature = true

[limit]
input = 1_000_000

[cost.text.input]
price = 5

[cost.text.output]
price = 25
