# Reasoning controls copied from the providers/alibaba/models/qwen3.7-flash.toml lab baseline.
# Toggle: enable_thinking true|false
# Budget: thinking_budget (integer reasoning tokens, maximum 262144)
base_model = "alibaba/qwen3.7-flash"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "budget_tokens"
max = 262_144

[cost]
input = 0.03
output = 0.13
cache_read = 0.006

[[cost.tiers]]
tier = { type = "context", size = 32_001 }
input = 0.1
output = 0.4
cache_read = 0.02

[limit]
input = 934_464
output = 65_536
