# Models, inputs and lifecycle (accessed 2026-10-28): https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/supported-models, https://docs.databricks.com/aws/en/machine-learning/retired-models-policy
# Reasoning (accessed 2026-10-28): https://docs.databricks.com/aws/en/machine-learning/model-serving/query-reason-models
# Effort (values listed for this endpoint): Chat `reasoning_effort` / Responses `reasoning.effort` = none|low|medium|high|xhigh|max; `medium` is the default.
# Pricing (accessed 2026-10-28): DBU rates from https://www.databricks.com/product/pricing/proprietary-foundation-model-serving x USD 0.070/DBU (`prop_model_serving` in https://www.databricks.com/en-pricing-assets/data/pricing/cards.json: Anthropic, Google and OpenAI on AWS Premium/Enterprise, every region).
# Standard DBU per 1M input/output/cache-read/cache-write tokens: 28.571/142.857/2.857/35.714 short and 57.143/214.29/5.714/71.429 long.
# The pricing page marks this model with a 10% DBU uplift when regional processing (data residency) is enabled: the 1.1x multiplier when region is not global.
# Long-context rows (above 272K input tokens) are the pricing page's "Long context" rates.
# Priority: request `service_tier = "priority"` (https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/priority-mode); priority DBU rates are 2x standard for every short- and long-context row.
# Batch inference is billed per DBU-hour, not per token; not modeled.
# Cache: `cache_control` is Claude-only and no other cache control is documented; the pricing page lists cache-read rates, so caching is implicit.
# Cache writes: the pricing page lists a cache-write rate for this model, and the OpenAI Responses path is a native passthrough that "supports the full set of OpenAI Responses parameters" (https://docs.databricks.com/aws/en/machine-learning/model-serving/query-open-responses-models), so the write price is kept; no Databricks-specific write control is documented, so only implicit caching is recorded.
# Images: JPEG, PNG, WebP, non-animated GIF, up to 500 per request (https://docs.databricks.com/aws/en/machine-learning/model-serving/query-vision-models); formats match the lab.
# Limits: supported-models says "For OpenAI, Google Gemini, and Anthropic models, the context window and maximum output tokens match the values published by the respective model provider", so the lab's limits apply.
# structured_output: response_format json_schema on pay-per-token chat models (https://docs.databricks.com/aws/en/machine-learning/model-serving/structured-outputs).
# store = false: "Stored responses is not supported" (Responses API reference above).
# system_updates = false: Chat Completions takes the system role "only once, as the first message in a conversation" and Responses input roles are user|assistant (https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/api-reference). effort_updates and tools.updates are undocumented and untested (no Databricks key).
# APIs: Chat Completions, and the OpenAI Responses API at /serving-endpoints/responses (https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/api-reference#responses-api). supported-models says the model isn't in AI Playground and points to the Responses API; query-reason-models documents Chat `reasoning_effort` for it as well.
# max_tokens_field: the Foundation Model API chat request documents max_tokens and not max_completion_tokens (https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/api-reference, accessed 2026-10-28)
schema = 2
base_model = "openai/gpt-6-sol"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
store = false
cache = { implicit = true }
service_tier = ["priority"]

[limit]
image = { max_per_request = 500 }

[api.chat-completions]
compatibility = { max_tokens_field = "max_tokens" }

[api.responses]
base_url = "https://${DATABRICKS_HOST}/serving-endpoints"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[cost.text.input]
price = 2
cache = { read = 0.2, write = 2.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 4
cache = { read = 0.4, write = 5 }

[cost.text.output]
price = 10

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 15

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 2

[[cost.multipliers]]
when = { not = { region = { equals = "global" } } }
factor = 1.1

[experimental.modes.fast]
service_tier = "priority"
body = { service_tier = "priority" }
