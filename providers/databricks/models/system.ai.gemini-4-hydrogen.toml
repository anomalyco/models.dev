# Models, inputs and lifecycle (accessed 2026-11-24): https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/supported-models, https://docs.databricks.com/aws/en/machine-learning/retired-models-policy
# Unity Gateway only: supported-models names this model only by its model service name, system.ai.gemini-4-hydrogen, and says pay-per-token serving-endpoint queries aren't supported, so the model ID is that name. Requests go to the provider's /ai-gateway/mlflow/v1 base (https://docs.databricks.com/aws/en/ai-gateway/query-model-services).
# Inputs: supported-models says the Databricks integration supports text input only; image, video and audio are not supported.
# Reasoning (accessed 2026-11-24): https://docs.databricks.com/aws/en/machine-learning/model-serving/query-reason-models
# Effort: Chat `reasoning_effort` = low|medium|high|xhigh. Databricks doesn't list this model in query-reason-models, so Google's own levels are used (providers/google); untested.
# Pricing (accessed 2026-11-24): DBU rates from https://www.databricks.com/product/pricing/proprietary-foundation-model-serving x USD 0.070/DBU (`prop_model_serving` in https://www.databricks.com/en-pricing-assets/data/pricing/cards.json: Anthropic, Google, OpenAI and SpaceXAI on AWS Premium/Enterprise, every region).
# Standard DBU per 1M input/output/cache-read/cache-write tokens: 26.786/133.929/1.339/33.482 (USD 0.09373 and 2.34374, rounded to Google's 0.09375 and 2.34375).
# The pricing page marks this model with a 10% DBU uplift when regional processing (data residency) is enabled: the 1.1x multiplier when region is not global.
# Priority: the pricing page lists priority rates (1.8x), but the priority-mode page doesn't list this model, so service_tier is not recorded.
# Batch inference is billed per DBU-hour, not per token; not modeled.
# Cache: `cache_control` is Claude-only and no other cache control is documented; the pricing page lists cache-read rates, so caching is implicit.
# Cache writes: the pricing page lists a cache-write rate; no Databricks cache control is documented, so only implicit caching is recorded.
# Global endpoint: supported-models says this model requires cross geography routing to be enabled. Databricks provides it through Google Vertex AI.
# Limits: one response segment, capped by Google at 65,536 output tokens including thinking; long decode continuation isn't supported (supported-models). That matches the lab.
# structured_output: response_format json_schema on pay-per-token chat models (https://docs.databricks.com/aws/en/machine-learning/model-serving/structured-outputs).
# system_updates = false: Chat Completions takes the system role "only once, as the first message in a conversation" and Responses input roles are user|assistant (https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/api-reference). effort_updates and tools.updates are undocumented and untested (no Databricks key).
# APIs: Chat Completions only (supported-models).
# max_tokens_field: the Foundation Model API chat request documents max_tokens and not max_completion_tokens (https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/api-reference, accessed 2026-10-28)
schema = 2
base_model = "google/gemini-4-hydrogen"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { max_tokens_field = "max_tokens" }

[cost.text.input]
price = 1.875
cache = { read = 0.09375, write = 2.34375 }

[cost.text.output]
price = 9.375

[[cost.multipliers]]
when = { not = { region = { equals = "global" } } }
factor = 1.1
