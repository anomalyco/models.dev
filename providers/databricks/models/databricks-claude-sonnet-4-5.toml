# Models, inputs and lifecycle (accessed 2026-10-20): https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/supported-models, https://docs.databricks.com/aws/en/machine-learning/retired-models-policy
# Reasoning (accessed 2026-10-20): https://docs.databricks.com/aws/en/machine-learning/model-serving/query-reason-models
# Budget: Chat `thinking = { type = "enabled", budget_tokens = N }`; N >= 1024 and must be less than `max_tokens`.
# Pricing (accessed 2026-10-20): DBU rates from https://www.databricks.com/product/pricing/proprietary-foundation-model-serving x USD 0.070/DBU (`prop_model_serving` in https://www.databricks.com/en-pricing-assets/data/pricing/cards.json: Anthropic, Google and OpenAI on AWS Premium/Enterprise, every region).
# The pricing page marks this model with a 10% DBU uplift when regional processing (data residency) is enabled: the 1.1x multiplier when region is not global.
# Batch inference is billed per DBU-hour, not per token; not modeled.
# Images: JPEG, PNG, GIF, WebP; up to 100 per API request, larger than 8000x8000 px rejected (https://docs.databricks.com/aws/en/machine-learning/model-serving/query-vision-models).
# Cache: `cache_control` on Databricks-hosted Claude (https://docs.databricks.com/aws/en/machine-learning/model-serving/score-foundation-models#prompt-caching); 5m and 1h write prices from the pricing page.
# structured_output: response_format json_schema on pay-per-token chat models (https://docs.databricks.com/aws/en/machine-learning/model-serving/structured-outputs).
# system_updates = false: Chat Completions takes the system role "only once, as the first message in a conversation" and Responses input roles are user|assistant (https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/api-reference). effort_updates and tools.updates are undocumented and untested (no Databricks key).
# APIs: Chat Completions, and the Anthropic Messages API at /serving-endpoints/anthropic/v1/messages for Anthropic pay-per-token models (https://docs.databricks.com/aws/en/machine-learning/model-serving/query-anthropic-messages, https://docs.databricks.com/aws/en/machine-learning/model-serving/query-reason-models).
schema = 2
base_model = "anthropic/claude-sonnet-4-5"

[capabilities]
reasoning = { supported = true, budget = { min = 1_024 } }
structured_output = true
cache = { explicit = { ttl = ["5m", "1h"] } }

[limit]
image = { max_per_request = 100, max_width = 8_000, max_height = 8_000 }

[api.chat-completions]

[api.messages]
base_url = "https://${DATABRICKS_HOST}/serving-endpoints/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 3
cache = { read = 0.3, write = { "5m" = 3.75, "1h" = 6 } }

[cost.text.output]
price = 15

[[cost.multipliers]]
when = { not = { region = { equals = "global" } } }
factor = 1.1
