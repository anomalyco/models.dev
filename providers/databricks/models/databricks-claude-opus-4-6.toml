# Chat uses `thinking = { type = "enabled", budget_tokens = N }`; N >= 1024
# and must be less than `max_tokens`.
# https://docs.databricks.com/aws/en/machine-learning/model-serving/query-reason-models (accessed 2026-06-25)
schema = 2
base_model = "anthropic/claude-opus-4-6"

[capabilities]
reasoning = { supported = true, budget = { min = 1_024 } }

[cost.text.input]
price = 5
cache = { read = 0.5, write = 6.25 }

[cost.text.output]
price = 25

[[cost.multipliers]]
when = { service_tier = { equals = "fast" } }
factor = 6

[experimental.modes.fast]
body = { speed = "fast" }
headers = { anthropic-beta = "fast-mode-2026-02-01" }
