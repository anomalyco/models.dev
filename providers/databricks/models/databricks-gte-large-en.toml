# Models, inputs and lifecycle (accessed 2026-11-08): https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/supported-models ("GTE Large (En)", endpoint databricks-gte-large-en, model https://huggingface.co/Alibaba-NLP/gte-large-en-v1.5, 1024 dimensions, 8192-token window, not normalized), https://docs.databricks.com/aws/en/machine-learning/retired-models-policy
# API: POST /ai-gateway/mlflow/v1/embeddings ("MLflow Embeddings API", https://docs.databricks.com/aws/en/ai-gateway/query-model-services). Not live-tested (no Databricks key).
# Pricing (accessed 2026-11-08): 1.857 DBU per 1M input tokens (https://www.databricks.com/product/pricing/foundation-model-serving) x USD 0.070/DBU (`foundation_model_apis` in https://www.databricks.com/en-pricing-assets/data/pricing/cards.json, AWS US East (N. Virginia); other regions are USD 0.070-0.112/DBU, not modeled).
# The databricks:generate script only picks chat-completions endpoints; it reports this file as orphaned but doesn't delete it.
schema = 2
v2_only = true
base_model = "alibaba/gte-large-en-v1.5"

[api.embeddings]
sdk = { opencodeai = "none" }

[cost.text.input]
price = 0.13

[cost.text.output]
price = 0
