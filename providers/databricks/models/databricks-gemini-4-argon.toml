# Models, inputs and lifecycle (accessed 2026-10-28): https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/supported-models, https://docs.databricks.com/aws/en/machine-learning/retired-models-policy
# Reasoning (accessed 2026-10-28): https://docs.databricks.com/aws/en/machine-learning/model-serving/query-reason-models
# Effort: Chat `reasoning_effort` = low|medium|high; `medium` is the default, reasoning can't be disabled, and none/minimal are rejected.
# Pricing (accessed 2026-10-28): DBU rates from https://www.databricks.com/product/pricing/proprietary-foundation-model-serving x USD 0.070/DBU (`prop_model_serving` in https://www.databricks.com/en-pricing-assets/data/pricing/cards.json: Anthropic, Google, OpenAI and SpaceXAI on AWS Premium/Enterprise, every region).
# Standard DBU per 1M input/output/cache-read tokens: 35.714/178.571/1.786.
# The pricing page marks this model with a 10% DBU uplift when regional processing (data residency) is enabled: the 1.1x multiplier when region is not global.
# Gemini 4 Argon promotion: listed rates are 50% off through 2026-11-30; the standard rates, twice those shown, apply from 2026-12-01.
# Priority: the pricing page lists priority rates (1.8x), but the priority-mode page doesn't list this endpoint, so service_tier is not recorded.
# Audio uses the text rates: the page shows one row when modalities share a price.
# Batch inference is billed per DBU-hour, not per token; not modeled.
# Cache: `cache_control` is Claude-only and no other cache control is documented; the pricing page lists cache-read rates, so caching is implicit.
# Global endpoint: supported-models says this model requires cross geography routing to be enabled.
# Images: JPEG, PNG, WebP only, up to 50 per API request (https://docs.databricks.com/aws/en/machine-learning/model-serving/query-vision-models); video and audio follow the lab.
# supported-models lists text, image, video and audio for this endpoint; PDF is left out, as in the Gemini 3.5 Flash file.
# structured_output: response_format json_schema on pay-per-token chat models (https://docs.databricks.com/aws/en/machine-learning/model-serving/structured-outputs).
# system_updates = false: Chat Completions takes the system role "only once, as the first message in a conversation" and Responses input roles are user|assistant (https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/api-reference). effort_updates and tools.updates are undocumented and untested (no Databricks key).
# max_tokens_field: the Foundation Model API chat request documents max_tokens and not max_completion_tokens (https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/api-reference, accessed 2026-10-28)
schema = 2
base_model = "google/gemini-4-argon"

[modalities]
input = [
  "text",
  "image/png",
  "image/jpeg",
  "image/webp",
  "video/mp4",
  "video/mpeg",
  "video/mov",
  "video/avi",
  "video/x-flv",
  "video/mpg",
  "video/webm",
  "video/wmv",
  "video/3gpp",
  "audio/wav",
  "audio/mp3",
  "audio/aiff",
  "audio/aac",
  "audio/ogg",
  "audio/flac",
  "audio/mpeg",
  "audio/m4a",
  "audio/l16",
  "audio/opus",
  "audio/alaw",
  "audio/mulaw",
  "audio/webm",
]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[limit]
image = { max_per_request = 50 }

[api.chat-completions]
compatibility = { max_tokens_field = "max_tokens" }

[cost.text.input]
price = 2.5
cache = { read = 0.125 }

[cost.text.output]
price = 12.5

[cost.audio.input]
price = 2.5
cache = { read = 0.125 }

[[cost.multipliers]]
when = { date = { gte = "2026-12-01" } }
factor = 2

[[cost.multipliers]]
when = { not = { region = { equals = "global" } } }
factor = 1.1
