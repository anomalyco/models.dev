# Models, inputs and lifecycle (accessed 2026-11-24): https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/supported-models, https://docs.databricks.com/aws/en/machine-learning/retired-models-policy
# Inputs: supported-models lists text and image, so video is dropped; image formats follow the lab. query-vision-models doesn't list this endpoint, so no image limit is recorded.
# Availability: pay-per-token in us-east-1 only (supported-models).
# Reasoning (accessed 2026-11-24): https://docs.databricks.com/aws/en/machine-learning/model-serving/query-reason-models
# Effort: Chat `reasoning_effort` = low|high|max (default max), always thinking. supported-models says the model supports adjustable effort but query-reason-models doesn't list its values, so Moonshot's own controls are used (providers/moonshotai); untested.
# Pricing (accessed 2026-11-24): DBU rates from https://www.databricks.com/product/pricing/foundation-model-serving x USD 0.070/DBU (`foundation_model_apis` in https://www.databricks.com/en-pricing-assets/data/pricing/cards.json, AWS US East (N. Virginia); other regions are USD 0.070-0.112/DBU, not modeled).
# Standard DBU per 1M input/output/cache-read tokens: 28.571/142.857/2.857.
# The pricing page marks this model with a 10% DBU uplift when regional processing (data residency) is enabled: the 1.1x multiplier when region is not global.
# Priority: neither the pricing page nor the priority-mode page lists this endpoint.
# Provisioned throughput (per DBU-hour) is not modeled.
# Cache: `cache_control` is Claude-only and no other cache control is documented; the pricing page lists cache-read rates, so caching is implicit.
# Limits: maximum output 1,048,576 tokens (https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/limits), matching the lab.
# structured_output: response_format json_schema on pay-per-token chat models (https://docs.databricks.com/aws/en/machine-learning/model-serving/structured-outputs).
# system_updates = false: Chat Completions takes the system role "only once, as the first message in a conversation" and Responses input roles are user|assistant (https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/api-reference). effort_updates and tools.updates are undocumented and untested (no Databricks key).
# max_tokens_field: the Foundation Model API chat request documents max_tokens and not max_completion_tokens (https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/api-reference, accessed 2026-10-28)
schema = 2
base_model = "moonshotai/kimi-k3.1-pro"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { max_tokens_field = "max_tokens" }

[cost.text.input]
price = 2
cache = { read = 0.2 }

[cost.text.output]
price = 10

[[cost.multipliers]]
when = { not = { region = { equals = "global" } } }
factor = 1.1
