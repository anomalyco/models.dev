# Chat uses `thinking.budget_tokens` 128..32768; reasoning cannot be disabled;
# native Gemini -1 requests dynamic thinking but is not a numeric budget.
# https://ai.google.dev/gemini-api/docs/thinking (accessed 2026-06-25)
schema = 2
base_model = "google/gemini-2.5-pro"

[capabilities]
reasoning = { supported = true, budget = { min = 128, max = 32_768 } }
structured_output = true

[cost.text.input]
price = 1.25
cache = { read = 0.125 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 2.5
cache = { read = 0.25 }

[cost.text.output]
price = 10

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 15
