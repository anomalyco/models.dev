# Models, inputs and lifecycle (accessed 2026-11-24): https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/supported-models, https://docs.databricks.com/aws/en/machine-learning/retired-models-policy
# Reasoning (accessed 2026-11-24): https://docs.databricks.com/aws/en/machine-learning/model-serving/query-reason-models
# Toggle: `thinking.type` = adaptive|disabled. Effort: Messages `output_config.effort` = low|medium|high|xhigh|max. query-reason-models doesn't list this endpoint, so Anthropic's own controls for this model are used (providers/anthropic), passed through the Anthropic Messages API, which lists system.ai.claude-sonnet-5; untested.
# Sampling: supported-models says temperature, top_p and top_k return HTTP 400; the lab file already marks them unsupported.
# Pricing (accessed 2026-11-24): DBU rates from https://www.databricks.com/product/pricing/proprietary-foundation-model-serving x USD 0.070/DBU (`prop_model_serving` in https://www.databricks.com/en-pricing-assets/data/pricing/cards.json: Anthropic, Google, OpenAI and SpaceXAI on AWS Premium/Enterprise, every region).
# Standard DBU per 1M input/output/cache-read/5m-write/1h-write tokens: 28.571/142.857/2.857/35.714/57.143.
# The pricing page marks this model with a 10% DBU uplift when regional processing (data residency) is enabled: the 1.1x multiplier when region is not global.
# Batch inference is billed per DBU-hour, not per token; not modeled.
# Images: JPEG, PNG, GIF, WebP; up to 100 per API request, larger than 8000x8000 px rejected (https://docs.databricks.com/aws/en/machine-learning/model-serving/query-vision-models).
# Cache: `cache_control` on Databricks-hosted Claude (https://docs.databricks.com/aws/en/machine-learning/model-serving/score-foundation-models#prompt-caching); 5m and 1h write prices from the pricing page.
# structured_output: response_format json_schema on pay-per-token chat models (https://docs.databricks.com/aws/en/machine-learning/model-serving/structured-outputs).
# system_updates = false: Chat Completions takes the system role "only once, as the first message in a conversation" and Responses input roles are user|assistant (https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/api-reference). effort_updates and tools.updates are undocumented and untested (no Databricks key).
# APIs: Chat Completions, and the Anthropic Messages API at /serving-endpoints/anthropic/v1/messages for Anthropic pay-per-token models (https://docs.databricks.com/aws/en/machine-learning/model-serving/query-anthropic-messages).
# max_tokens_field: the Foundation Model API chat request documents max_tokens and not max_completion_tokens (https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/api-reference, accessed 2026-10-28)
schema = 2
base_model = "anthropic/claude-sonnet-5"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { explicit = { ttl = ["5m", "1h"] } }

[limit]
image = { max_per_request = 100, max_width = 8_000, max_height = 8_000 }

[api.chat-completions]
compatibility = { max_tokens_field = "max_tokens" }

[api.messages]
base_url = "https://${DATABRICKS_HOST}/serving-endpoints/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 2
cache = { read = 0.2, write = { "5m" = 2.5, "1h" = 4 } }

[cost.text.output]
price = 10

[[cost.multipliers]]
when = { not = { region = { equals = "global" } } }
factor = 1.1
