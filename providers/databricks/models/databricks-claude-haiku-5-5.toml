# Toggle: Messages `thinking.type` = adaptive|disabled
# Effort: Messages `output_config.effort` = low|medium|high; Databricks defaults to `medium` and rejects none, xhigh and max.
# Models, inputs and lifecycle (accessed 2026-10-28): https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/supported-models, https://docs.databricks.com/aws/en/machine-learning/retired-models-policy
# Reasoning (accessed 2026-10-28): https://docs.databricks.com/aws/en/machine-learning/model-serving/query-reason-models
# Pricing (accessed 2026-10-28): DBU rates from https://www.databricks.com/product/pricing/proprietary-foundation-model-serving x USD 0.070/DBU (`prop_model_serving` in https://www.databricks.com/en-pricing-assets/data/pricing/cards.json: Anthropic, Google, OpenAI and SpaceXAI on AWS Premium/Enterprise, every region).
# Standard DBU per 1M input/output/cache-read/5m-write/1h-write tokens: 1.429/7.143/0.143/1.786/2.857 short and 7.143/35.714/0.714/8.929/14.286 long.
# Long context: the pricing page lists separate short- and long-context rows but doesn't state the threshold (it doesn't for the GPT rows either, which use OpenAI's 272K). This uses the lab's boundary: Anthropic's long-context rate for this model starts above 100K input tokens (providers/anthropic), and the Databricks long/short ratios match Anthropic's.
# The pricing page marks this model with a 10% DBU uplift when regional processing (data residency) is enabled: the 1.1x multiplier when region is not global.
# Batch inference is billed per DBU-hour, not per token; not modeled.
# Images: JPEG, PNG, GIF, WebP; up to 100 per API request, larger than 8000x8000 px rejected (https://docs.databricks.com/aws/en/machine-learning/model-serving/query-vision-models).
# Cache: `cache_control` on Databricks-hosted Claude (https://docs.databricks.com/aws/en/machine-learning/model-serving/score-foundation-models#prompt-caching); 5m and 1h write prices from the pricing page.
# structured_output: Anthropic Messages `output_config.format` (https://docs.databricks.com/aws/en/machine-learning/model-serving/query-anthropic-messages); Chat Completions `response_format` returns HTTP 400 for this model.
# system_updates, effort_updates and tools.updates are undocumented on Databricks and untested (no Databricks key).
# APIs: Anthropic Messages API at /serving-endpoints/anthropic/v1/messages only (https://docs.databricks.com/aws/en/machine-learning/model-serving/query-anthropic-messages). query-reason-models documents this model's reasoning controls on Messages only.
schema = 2
base_model = "anthropic/claude-haiku-5-5"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high"] }
structured_output = true
cache = { explicit = { ttl = ["5m", "1h"] } }

[limit]
image = { max_per_request = 100, max_width = 8_000, max_height = 8_000 }

[api.messages]
base_url = "https://${DATABRICKS_HOST}/serving-endpoints/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.1
cache = { read = 0.01, write = { "5m" = 0.125, "1h" = 0.2 } }

[[cost.text.input.overrides]]
when = { context = { gt = 100_000 } }
price = 0.5
cache = { read = 0.05, write = { "5m" = 0.625, "1h" = 1 } }

[cost.text.output]
price = 0.5

[[cost.text.output.overrides]]
when = { context = { gt = 100_000 } }
price = 2.5

[[cost.multipliers]]
when = { not = { region = { equals = "global" } } }
factor = 1.1
