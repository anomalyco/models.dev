# Chat `reasoning_effort = low|medium|high`; Responses uses `reasoning.effort`.
# https://docs.databricks.com/aws/en/machine-learning/model-serving/query-reason-models (accessed 2026-06-25)
schema = 2
base_model = "openai/gpt-5.5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[cost.text.input]
price = 5
cache = { read = 0.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 10
cache = { read = 1 }

[cost.text.output]
price = 30

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 45

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 2.5

[experimental.modes.fast]
service_tier = "priority"
body = { service_tier = "priority" }
