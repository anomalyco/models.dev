# Models, inputs and lifecycle (accessed 2026-10-20): https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/supported-models, https://docs.databricks.com/aws/en/machine-learning/retired-models-policy
# Deprecated: Kimi K2.7 pay-per-token retirement date 2026-10-30 (retired-models-policy).
# Effort: Chat `reasoning_effort` = low|medium|high, `medium` default (query-reason-models, accessed 2026-07-11; the endpoint is no longer listed there).
# Pricing (accessed 2026-10-20): DBU rates from https://www.databricks.com/product/pricing/foundation-model-serving x USD 0.070/DBU (`foundation_model_apis` in https://www.databricks.com/en-pricing-assets/data/pricing/cards.json, AWS US East (N. Virginia); other regions are USD 0.070-0.112/DBU, not modeled). Kimi K2.7 is 13.571/57.143/2.714 DBU per 1M input/output/cache-read tokens.
# Images: JPEG, PNG, WebP, GIF, up to 30 per Chat Completions request (https://docs.databricks.com/aws/en/machine-learning/model-serving/query-vision-models); video follows the lab.
# Cache: `cache_control` is Claude-only and no other cache control is documented; the pricing page lists cache-read rates, so caching is implicit.
# structured_output: response_format json_schema on pay-per-token chat models (https://docs.databricks.com/aws/en/machine-learning/model-serving/structured-outputs).
# system_updates = false: Chat Completions takes the system role "only once, as the first message in a conversation" and Responses input roles are user|assistant (https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/api-reference). effort_updates and tools.updates are undocumented and untested (no Databricks key).
schema = 2
base_model = "moonshotai/kimi-k2.7-code"
status = "deprecated"

[modalities]
input = [
  "text",
  "image/jpeg",
  "image/png",
  "image/gif",
  "image/webp",
  "video/mp4",
  "video/mpeg",
  "video/mov",
  "video/avi",
  "video/x-flv",
  "video/mpg",
  "video/webm",
  "video/wmv",
  "video/3gpp",
]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
system_updates = false
cache = { supported = true, implicit = true }

[limit]
image = { max_per_request = 30 }

[cost.text.input]
price = 0.95
cache = { read = 0.19 }

[cost.text.output]
price = 4
