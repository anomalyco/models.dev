# Pricing source: https://hostlinku.com/models/claude-fable-5-2 and https://api.hostlinku.com/api/public/models/claude-fable-5-2
#   Performance (USD/MTok): input $4.424, output $22.12, cache_read $0.1106, cache_write_5m $5.53, cache_write_1h $8.848, web_search $5.53/1k
#   Economy (USD/MTok): input $1.5, output $7.5, cache_read $0.0375, cache_write_5m $1.875, cache_write_1h $3, web_search $12.5/1k
# Note: GET /api/public/models/claude-fable-5-2 lists modes.performance.prices.webSearchPer1kCredits = 5.53 (0.553 multiplier on the $10 official rate) and modes.economy.prices.webSearchPer1kCredits = 12.5 (fixed economy web_search rate).
# Multi-mode catalog: default cost matches service mode "performance"; economy overrides use when.mode.
# APIs: /v1/messages (native Anthropic Messages) and /v1/chat/completions; cache breakpoints follow Anthropic explicit caching.
# Effort: $.output_config.effort = "low"|"medium"|"high"|"xhigh"|"max" on /v1/messages
schema = 2
base_model = "anthropic/claude-fable-5-2"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 512 } }

[api.messages]
base_url = "https://api.hostlinku.com/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[api.chat-completions]
base_url = "https://api.hostlinku.com/v1"

[cost.text.input]
price = 4.424
cache = { read = 0.1106, write = { "5m" = 5.53, "1h" = 8.848 } }

[[cost.text.input.overrides]]
when = { mode = { equals = "economy" } }
price = 1.5
cache = { read = 0.0375, write = { "5m" = 1.875, "1h" = 3 } }

[cost.text.output]
price = 22.12

[[cost.text.output.overrides]]
when = { mode = { equals = "economy" } }
price = 7.5

[cost.web_search]
price = 5.53

[[cost.web_search.overrides]]
when = { mode = { equals = "economy" } }
price = 12.5
