# Pricing source: https://hostlinku.com/models/claude-sonnet-5 and https://api.hostlinku.com/api/public/models/claude-sonnet-5/pricing
# Multi-mode catalog: default cost matches service mode "performance"; economy overrides use when.mode.
# APIs: /v1/messages (native Anthropic Messages) and /v1/chat/completions; cache breakpoints follow Anthropic explicit caching.
# Toggle: $.thinking.type = "adaptive"|"disabled"
# Effort: $.output_config.effort = "low"|"medium"|"high"|"xhigh"|"max"
schema = 2
base_model = "anthropic/claude-sonnet-5"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 1_024 } }

[api.messages]
base_url = "https://api.hostlinku.com/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[api.chat-completions]
base_url = "https://api.hostlinku.com/v1"

[cost.text.input]
price = 1.12
cache = { read = 0.112, write = { "5m" = 1.4, "1h" = 2.24 } }

[[cost.text.input.overrides]]
when = { mode = { equals = "economy" } }
price = 0.375
cache = { read = 0.0375, write = { "5m" = 0.46875, "1h" = 0.75 } }

[cost.text.output]
price = 5.6

[[cost.text.output.overrides]]
when = { mode = { equals = "economy" } }
price = 1.875

[cost.web_search]
price = 16

[[cost.web_search.overrides]]
when = { mode = { equals = "economy" } }
price = 12.5
