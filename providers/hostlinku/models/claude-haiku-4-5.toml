# Pricing source: https://hostlinku.com/models/claude-haiku-4-5 and https://api.hostlinku.com/api/public/models/claude-haiku-4-5/pricing
#   Economy (USD/MTok): input $0.1875, output $0.9375, cache_read $0.01875, cache_write_5m $0.234375, cache_write_1h $0.375, web_search $12.5/1k
# Service mode: offered in "economy" (runtime pricing & availability via GET /v1/models).
# APIs: /v1/messages (native Anthropic Messages) and /v1/chat/completions; cache breakpoints follow Anthropic explicit caching.
# Budget: integer $.thinking.budget_tokens (min 1024)
schema = 2
base_model = "anthropic/claude-haiku-4-5-20251001"

[capabilities]
reasoning = { supported = true, budget = { min = 1_024 } }
structured_output = true
cache = { explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 4_096 } }

[api.messages]
base_url = "https://api.hostlinku.com/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[api.chat-completions]
base_url = "https://api.hostlinku.com/v1"

[cost.text.input]
price = 0.1875
cache = { read = 0.01875, write = { "5m" = 0.234375, "1h" = 0.375 } }

[cost.text.output]
price = 0.9375

[cost.web_search]
price = 12.5
