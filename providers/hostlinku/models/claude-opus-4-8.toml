# Pricing source: https://hostlinku.com/models/claude-opus-4-8 and https://api.hostlinku.com/api/public/models/claude-opus-4-8/pricing
#   Performance (USD/MTok): input $2.765, output $13.825, cache_read $0.2765, cache_write_5m $3.45625, cache_write_1h $5.53, web_search $15.8/1k
#   Economy (USD/MTok): input $0.9375, output $4.6875, cache_read $0.09375, cache_write_5m $1.171875, cache_write_1h $1.875, web_search $12.5/1k
# Multi-mode catalog: default cost matches service mode "performance"; economy overrides use when.mode.
# APIs: /v1/messages (native Anthropic Messages) and /v1/chat/completions; cache breakpoints follow Anthropic explicit caching.
# Effort: $.output_config.effort = "low"|"medium"|"high"|"xhigh"|"max" on /v1/messages
schema = 2
base_model = "anthropic/claude-opus-4-8"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 1_024 } }

[api.messages]
base_url = "https://api.hostlinku.com/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[api.chat-completions]
base_url = "https://api.hostlinku.com/v1"

[cost.text.input]
price = 2.765
cache = { read = 0.2765, write = { "5m" = 3.45625, "1h" = 5.53 } }

[[cost.text.input.overrides]]
when = { mode = { equals = "economy" } }
price = 0.9375
cache = { read = 0.09375, write = { "5m" = 1.171875, "1h" = 1.875 } }

[cost.text.output]
price = 13.825

[[cost.text.output.overrides]]
when = { mode = { equals = "economy" } }
price = 4.6875

[cost.web_search]
price = 15.8

[[cost.web_search.overrides]]
when = { mode = { equals = "economy" } }
price = 12.5
