# Pricing source: https://hostlinku.com/models/claude-fable-5-1 and https://api.hostlinku.com/api/public/models/claude-fable-5-1
#   Performance (USD/MTok): input $5.53, output $27.65, cache_read $0.13825, cache_write_5m $6.9125, cache_write_1h $11.06, web_search $5.53/1k
# Note: GET /api/public/models/claude-fable-5-1 lists modes.performance.prices.webSearchPer1kCredits = 5.53 (0.553 multiplier on the $10 official rate).
# Service mode: offered in "performance" (runtime pricing & availability via GET /v1/models).
# APIs: /v1/messages (native Anthropic Messages) and /v1/chat/completions; cache breakpoints follow Anthropic explicit caching.
# Effort: $.output_config.effort = "low"|"medium"|"high"|"xhigh"|"max" on /v1/messages
schema = 2
base_model = "anthropic/claude-fable-5-1"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 512 } }

[api.messages]
base_url = "https://api.hostlinku.com/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[api.chat-completions]
base_url = "https://api.hostlinku.com/v1"

[cost.text.input]
price = 5.53
cache = { read = 0.13825, write = { "5m" = 6.9125, "1h" = 11.06 } }

[cost.text.output]
price = 27.65

[cost.web_search]
price = 5.53
