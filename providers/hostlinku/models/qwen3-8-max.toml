# Pricing source: https://hostlinku.com/models/qwen3-8-max and https://api.hostlinku.com/api/public/models/qwen3-8-max/pricing
# Service mode: offered in "performance" (runtime pricing & availability via GET /v1/models).
# Toggle: $.enable_thinking = true|false
# Effort: $.reasoning_effort = "low"|"medium"|"xhigh"
# Budget: $.thinking_budget (0..262144)
schema = 2
base_model = "alibaba/qwen3.8-max"

[capabilities]
