# Pricing source: https://hostlinku.com/models/gpt-5-6-luna and https://api.hostlinku.com/api/public/models/gpt-5-6-luna/pricing
#   Economy (USD/MTok): input $0.125, output $0.75, cache_read $0.0125, web_search $12.5/1k, (>=272000 tok: in $0.25, out $1.125, cache_read $0.025)
# Service mode: offered in "economy" (runtime pricing & availability via GET /v1/models).
# Freeform probe (2026-11-17, live on https://api.hostlinku.com): /v1/responses and /v1/chat/completions
# were probed with custom tool grammar (syntax "regex" ZZ[0-9]{3} against prompt "APPLE" and syntax
# "lark" LK[0-9]{3} against prompt "BANANA"). Grammar constraints are not consistently enforced across
# Hostlinku's gateway (e.g. gpt-6-sol returned "APPLE"/"BANANA" and gpt-5-5 rejected grammar tools with 400),
# so freeform is omitted.
schema = 2
base_model = "openai/gpt-5.6-luna"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true }

[api.responses]
base_url = "https://api.hostlinku.com/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.chat-completions]
base_url = "https://api.hostlinku.com/v1"

[cost.text.input]
price = 0.125
cache = { read = 0.0125 }

[[cost.text.input.overrides]]
when = { context = { gte = 272_000 } }
price = 0.25
cache = { read = 0.025 }

[cost.text.output]
price = 0.75

[[cost.text.output.overrides]]
when = { context = { gte = 272_000 } }
price = 1.125

[cost.web_search]
price = 12.5
