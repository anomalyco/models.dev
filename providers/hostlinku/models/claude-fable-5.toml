# Pricing source: https://hostlinku.com/models/claude-fable-5 and https://api.hostlinku.com/api/public/models/claude-fable-5/pricing
# Multi-mode catalog: default cost matches service mode "performance"; economy overrides use when.mode.
# APIs: /v1/messages (native Anthropic Messages) and /v1/chat/completions; cache breakpoints follow Anthropic explicit caching.
# Effort: $.output_config.effort = "low"|"medium"|"high"|"xhigh"|"max" on /v1/messages
schema = 2
base_model = "anthropic/claude-fable-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 512 } }

[api.messages]
base_url = "https://api.hostlinku.com/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[api.chat-completions]
base_url = "https://api.hostlinku.com/v1"

[cost.text.input]
price = 5.6
cache = { read = 0.56, write = { "5m" = 7, "1h" = 11.2 } }

[[cost.text.input.overrides]]
when = { mode = { equals = "economy" } }
price = 1.875
cache = { read = 0.1875, write = { "5m" = 2.34375, "1h" = 3.75 } }

[cost.text.output]
price = 28

[[cost.text.output.overrides]]
when = { mode = { equals = "economy" } }
price = 9.375

[cost.web_search]
price = 16

[[cost.web_search.overrides]]
when = { mode = { equals = "economy" } }
price = 12.5
