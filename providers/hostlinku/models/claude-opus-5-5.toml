# Pricing source: https://hostlinku.com/models/claude-opus-5-5 and https://api.hostlinku.com/api/public/models/claude-opus-5-5/pricing
#   Performance (USD/MTok): input $2.212, output $11.06, cache_read $0.1106, cache_write_5m $2.765, cache_write_1h $4.424, web_search $15.8/1k
#   Economy (USD/MTok): input $0.75, output $3.75, cache_read $0.0375, cache_write_5m $0.9375, cache_write_1h $1.5, web_search $12.5/1k
# Multi-mode catalog: default cost matches service mode "performance"; economy overrides use when.mode.
# APIs: /v1/messages (native Anthropic Messages) and /v1/chat/completions; cache breakpoints follow Anthropic explicit caching.
# Effort: $.output_config.effort = "low"|"medium"|"high"|"xhigh"|"max" on /v1/messages
schema = 2
base_model = "anthropic/claude-opus-5-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 512 } }

[api.messages]
base_url = "https://api.hostlinku.com/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[api.chat-completions]
base_url = "https://api.hostlinku.com/v1"

[cost.text.input]
price = 2.212
cache = { read = 0.1106, write = { "5m" = 2.765, "1h" = 4.424 } }

[[cost.text.input.overrides]]
when = { mode = { equals = "economy" } }
price = 0.75
cache = { read = 0.0375, write = { "5m" = 0.9375, "1h" = 1.5 } }

[cost.text.output]
price = 11.06

[[cost.text.output.overrides]]
when = { mode = { equals = "economy" } }
price = 3.75

[cost.web_search]
price = 15.8

[[cost.web_search.overrides]]
when = { mode = { equals = "economy" } }
price = 12.5
