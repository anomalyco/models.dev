# Pricing source: https://hostlinku.com/models/gpt-6-1-sol and https://api.hostlinku.com/api/public/models/gpt-6-1-sol
#   Performance (USD/MTok): input $0.7268, output $3.634, cache_read $0.03634, cache_write_5m $0.9085, cache_write_1h $1.4536, web_search $15.8/1k, (>=272000 tok: in $5.056, out $18.96)
#   Economy (USD/MTok): input $0.125, output $0.625, cache_read $0.00625, cache_write_5m $0.15625, cache_write_1h $0.15625, web_search $12.5/1k, (>=272000 tok: in $0.25, out $0.9375)
# Multi-mode catalog: default cost matches service mode "performance"; economy overrides use when.mode.
# Freeform probe (2026-11-17, live on https://api.hostlinku.com): /v1/responses and /v1/chat/completions
# were probed with custom tool grammar (syntax "regex" ZZ[0-9]{3} against prompt "APPLE" and syntax
# "lark" LK[0-9]{3} against prompt "BANANA"). Grammar constraints are not consistently enforced across
# upstream routes (e.g. gpt-6-sol returned "APPLE"/"BANANA" and gpt-5-5 rejected grammar tools with 400),
# so freeform is omitted.
schema = 2
base_model = "openai/gpt-6.1-sol"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true }

[api.responses]
base_url = "https://api.hostlinku.com/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.chat-completions]
base_url = "https://api.hostlinku.com/v1"

[cost.text.input]
price = 0.7268
cache = { read = 0.03634, write = { "5m" = 0.9085, "1h" = 1.4536 } }

[[cost.text.input.overrides]]
when = { context = { gte = 272_000 } }
price = 5.056
cache = { read = 0.2528, write = { "5m" = 6.32, "1h" = 6.32 } }

[[cost.text.input.overrides]]
when = { mode = { equals = "economy" } }
price = 0.125
cache = { read = 0.00625, write = { "5m" = 0.15625, "1h" = 0.15625 } }

[[cost.text.input.overrides]]
when = { context = { gte = 272_000 }, mode = { equals = "economy" } }
price = 0.25
cache = { read = 0.0125, write = { "5m" = 0.3125, "1h" = 0.3125 } }

[cost.text.output]
price = 3.634

[[cost.text.output.overrides]]
when = { context = { gte = 272_000 } }
price = 18.96

[[cost.text.output.overrides]]
when = { mode = { equals = "economy" } }
price = 0.625

[[cost.text.output.overrides]]
when = { context = { gte = 272_000 }, mode = { equals = "economy" } }
price = 0.9375

[cost.web_search]
price = 15.8

[[cost.web_search.overrides]]
when = { mode = { equals = "economy" } }
price = 12.5
