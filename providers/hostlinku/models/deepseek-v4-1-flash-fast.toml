# Pricing source: https://hostlinku.com/models/deepseek-v4-1-flash-fast and https://api.hostlinku.com/api/public/models/deepseek-v4-1-flash-fast
#   Dedicated (USD/MTok): input $0.2825, output $1.13, cache_read $0.00565
# Limits note: GET https://api.hostlinku.com/api/public/models/deepseek-v4-1-flash-fast and GET /v1/models report binary 1M/384K figures (1_048_576 context / 393_216 output = 2^20 / 384*1024); [limit] is omitted so the entry inherits the lab's decimal 1_000_000 / 384_000 window without exceeding base_model.
# Service mode: offered in "dedicated" (runtime pricing & availability via GET /v1/models).
# Toggle: thinking.type = enabled|disabled (reasoning_effort = "none" also disables)
# Effort: reasoning_effort = low|high|max
# Live probe 2026-11-17 on https://api.hostlinku.com/v1/chat/completions: default returns reasoning_content; thinking.type="disabled" + reasoning_effort="none" suppresses reasoning.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"
name = "DeepSeek-V4.1-Flash Fast"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.2825
cache = { read = 0.00565 }

[cost.text.output]
price = 1.13
