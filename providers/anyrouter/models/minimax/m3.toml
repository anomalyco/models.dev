# Host contract (GET /api/v1/models?all=1, read 2026-09-24, re-verified
# 2026-09-27): context_length=1048576, input_modalities=[text, image, video],
# capabilities=[chat, coding, reasoning, agentic, vision, function-calling,
# structured-output, streaming].
# Context and modalities match the lab entry, so only cost and
# reasoning_options are authored.
# AnyRouter forwards `reasoning_effort` to the serving route without
# validating it. Probed https://anyrouter.dev/api/v1/chat/completions on
# 2026-09-27: this route (backend `openrouter-pool`) accepts none, minimal,
# low, medium, high, xhigh, max. Every rung is accepted here, so this
# publishes the graded core.
# Honored effect measured the same day: `none`=349 (one run 0), low=611,
# medium=551, high=846, so depth rises with the value and `none` reaches 0.
# Same prompt each time, mean of two runs at max_tokens=700.
# Effort: reasoning_effort = low|medium|high
base_model = "minimax/MiniMax-M3"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high"] }]

[cost]
input = 0.3
output = 1.2
