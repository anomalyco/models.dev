# Host contract (GET /api/v1/models?all=1, read 2026-09-24, re-verified
# 2026-09-27): context_length=1048576, max_completion_tokens=16384,
# capabilities=[chat, coding, reasoning, agentic, vision, function-calling,
# structured-output, streaming], price 0.3/1.2. Context and modalities match the
# lab entry; the host caps output at 16384, well under the lab's 512000, so
# output is the one override.
# Reasoning: chat takes the flat `reasoning_effort`, `none` is the disable
# sentinel, and there is no toggle or budget on this surface (see the provider
# header).
# Both providers/minimax and the OpenRouter peer publish this model as
# toggle-only, so the ladder has to earn itself here: probed
# /api/v1/chat/completions 2026-09-27, `none` returned 0 reasoning tokens and
# `high` returned 1188 with a prompt that forces multi-step work, and on the
# earlier run of the same day low=611, medium=551, high=846 — graded depth that
# tracks the value, with a real off position. All seven rungs are accepted; the
# route was out of upstream credit for `low` and `medium` on the second run, so
# their numbers are from the first.
# Effort: reasoning_effort = none|low|medium|high
base_model = "minimax/MiniMax-M3"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high"] }]

[cost]
input = 0.3
output = 1.2

[limit]
output = 16_384
