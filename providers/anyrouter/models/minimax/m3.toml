# Host contract (GET /api/v1/models?all=1, read 2026-09-24, re-verified
# 2026-09-27): context_length=1048576, max_completion_tokens=16384,
# capabilities=[chat, coding, reasoning, agentic, vision, function-calling,
# structured-output, streaming], price 0.3/1.2. Context and modalities match the
# lab entry; the host caps output at 16384, well under the lab's 512000, so
# output is the one override.
# Reasoning: no caller control is published. providers/minimax and the
# OpenRouter peer both publish this model as toggle-only, and the chat surface
# has no toggle to forward (the host documents the toggle as a
# Responses-endpoint control, `reasoning.enabled`, and the upstreams refuse the
# `reasoning` object with 400 "property 'reasoning' is unsupported").
# Probed /api/v1/chat/completions 2026-09-27: the route does take the flat
# `reasoning_effort` — `none` returned 0 reasoning tokens and `high` 1188, with
# low=611, medium=551, high=846 on the first run of the day — but low/medium did
# not separate from each other at that sample size, and the route then ran out
# of upstream credit (402 → 502) so the ladder could not be re-measured. A
# graded ladder neither baseline supports is therefore not published; the
# measurement is recorded here and the ask for published per-listing values is
# in the PR. See the provider header.
base_model = "minimax/MiniMax-M3"
reasoning_options = []

[cost]
input = 0.3
output = 1.2

[limit]
output = 16_384
