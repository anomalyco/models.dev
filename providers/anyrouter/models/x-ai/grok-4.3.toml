# Host contract (GET /api/v1/models?all=1, read 2026-09-24, re-verified
# 2026-09-27): context_length=1000000, input_modalities=[text],
# capabilities=[chat, streaming, function-calling, coding].
# Text-only on this route, so modalities narrow to [text] and attachment drops
# to false.
# AnyRouter forwards `reasoning_effort` without validating it. This route is
# BYOK-only and returned 404/502 on every value, so it is unverified on this
# host and falls back to the lab entry's effort set.
# Effort: reasoning_effort = none|low|medium|high
base_model = "xai/grok-4.3"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high"] }]
attachment = false

[cost]
input = 1.25
output = 2.5

[modalities]
input = ["text"]
