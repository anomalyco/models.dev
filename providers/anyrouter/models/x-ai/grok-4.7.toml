# Host contract (GET /api/v1/models?all=1, read 2026-09-24, re-verified
# 2026-09-27): context_length=500000, input_modalities=[text, image],
# capabilities=[chat, streaming, function-calling, coding, vision, reasoning].
# No pdf on this route, so modalities narrow to [text, image].
# AnyRouter forwards `reasoning_effort` without validating it. This route is
# BYOK-only and returned 404/502 on every value, so it is unverified on this
# host and falls back to the lab entry's effort set.
# Effort: reasoning_effort = low|medium|high|xhigh
base_model = "xai/grok-4.7"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "xhigh"] }]

[cost]
input = 1.6
output = 4.8

[modalities]
input = ["text", "image"]
