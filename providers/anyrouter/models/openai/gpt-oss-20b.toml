# Host contract (GET /api/v1/models?all=1, read 2026-09-24, re-verified
# 2026-09-27): context_length=131072, input_modalities=[text],
# capabilities=[chat, reasoning, function-calling, streaming, coding].
# Context and modalities match the lab entry, so only cost and
# reasoning_options are authored.
# AnyRouter forwards `reasoning_effort` to the serving route without
# validating it. Probed https://anyrouter.dev/api/v1/chat/completions on
# 2026-09-27: this route (backend `huggingface-pool`) accepts low, medium,
# high. It rejects none, minimal, xhigh, max with 400. That is the complete
# accepted set; the upstream names it: `reasoning_effort` must be one of
# `low`, `medium`, or `high`.
# Effort: reasoning_effort = low|medium|high
base_model = "openai/gpt-oss-20b"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high"] }]

[cost]
input = 0.03
output = 0.14
