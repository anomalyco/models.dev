# Host contract (GET /api/v1/models?all=1, read 2026-09-24, re-verified
# 2026-09-27): context_length=1000000, input_modalities=[text, image],
# capabilities=[chat, streaming, function-calling, vision, coding].
# Context is 1000000 and only text/image are served here.
# AnyRouter forwards `reasoning_effort` without validating it. This route is
# BYOK-only and returned 404/502 on every value, so it is unverified on this
# host and falls back to the lab entry's effort set.
# Effort: reasoning_effort = minimal|low|medium|high
base_model = "google/gemini-3.5-flash"
reasoning_options = [{ type = "effort", values = ["minimal", "low", "medium", "high"] }]

[cost]
input = 1.5
output = 9

[limit]
context = 1_000_000

[modalities]
input = ["text", "image"]
