# Effort: reasoning_effort = minimal|low|medium|high (Google lab + OpenRouter peers)
base_model = "google/gemini-3.5-flash"
reasoning_options = [{ type = "effort", values = ["minimal", "low", "medium", "high"] }]

[cost]
input = 1.5
output = 9

[limit]
context = 1_000_000

[modalities]
input = ["text", "image"]
