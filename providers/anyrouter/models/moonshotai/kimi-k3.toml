# Host contract (GET /api/v1/models?all=1, read 2026-09-24, re-verified
# 2026-09-27): context_length=1048576, input_modalities=[text, image, video],
# capabilities=[chat, reasoning, streaming, function-calling, vision, coding,
# agentic].
# Context and modalities match the lab entry, so only cost and
# reasoning_options are authored.
# AnyRouter forwards `reasoning_effort` without validating it. This route is
# BYOK-only and returned 404/502 on every value, so it is unverified on this
# host and falls back to the lab entry.
# Toggle: unverified on this host. No toggle field was accepted on any route
#     that could be reached — `reasoning: true` and `reasoning: false` both
#     return 400. Kept from the lab entry and flagged in the PR.
# Effort: reasoning_effort = low|high|max
base_model = "moonshotai/kimi-k3"
reasoning_options = [
  { type = "toggle" },
  { type = "effort", values = ["low", "high", "max"] },
]

[cost]
input = 3
output = 15
