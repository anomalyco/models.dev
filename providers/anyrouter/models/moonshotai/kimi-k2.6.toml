# Host contract (GET /api/v1/models?all=1, read 2026-09-24, re-verified
# 2026-09-27): context_length=262144, input_modalities=[text, image],
# supported_parameters=[max_tokens, temperature, top_p, stop, stream],
# capabilities=[chat, reasoning, streaming, function-calling, vision].
# Context matches the lab entry; no video on this route, so modalities narrow
# from the lab's [text, image, video]. Price 0.95/4.0 matches the OpenRouter
# peer.
# Toggle: reasoning.enabled = true|false (Moonshot lab + OpenRouter peers)
base_model = "moonshotai/kimi-k2.6"
reasoning_options = [{ type = "toggle" }]

[cost]
input = 0.95
output = 4

[modalities]
input = ["text", "image"]
