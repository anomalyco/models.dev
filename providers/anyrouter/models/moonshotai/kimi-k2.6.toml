# Host contract (GET /api/v1/models?all=1, read 2026-09-24, re-verified
# 2026-09-27): context_length=262144, max_completion_tokens not declared,
# capabilities=[chat, reasoning, streaming, function-calling, vision],
# price 0.95/4. No video on this route, so modalities narrow to [text, image].
# Reasoning: providers/moonshotai and the OpenRouter peer both publish this
# model as toggle-only, and the chat surface has no toggle to forward (see the
# provider header) — so the only caller control left is the host's documented
# disable sentinel, `none`, which is what this publishes.
# Unverified on this host: every effort value returns 502 "All upstream
# providers failed" for a plain key, because the serving routes are BYOK-only.
# Effort: reasoning_effort = none
base_model = "moonshotai/kimi-k2.6"
reasoning_options = [{ type = "effort", values = ["none"] }]

[cost]
input = 0.95
output = 4

[modalities]
input = ["text", "image"]
