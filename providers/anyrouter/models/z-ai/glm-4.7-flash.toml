# Host contract (GET /api/v1/models?all=1, read 2026-09-24, re-verified
# 2026-09-27): context_length=200000, input_modalities=[text],
# capabilities=[chat, reasoning, streaming, function-calling, coding].
# Context and modalities match the lab entry, so only cost and
# reasoning_options are authored.
# AnyRouter forwards `reasoning_effort` to the serving route without
# validating it. Probed https://anyrouter.dev/api/v1/chat/completions on
# 2026-09-27: this route accepts every value sent, including a nonsense one.
# This route validates nothing — it accepts every value sent, including a
# nonsense one — so the graded core is published for consistency with the rest
# of the provider.
# Effort: reasoning_effort = low|medium|high
base_model = "zhipuai/glm-4.7-flash"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high"] }]

[cost]
input = 0.06
output = 0.4
