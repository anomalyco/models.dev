# Host contract (GET /api/v1/models?all=1, read 2026-09-24, re-verified
# 2026-09-27): context_length=200000, input_modalities=[text],
# capabilities=[chat, reasoning, streaming, function-calling, coding].
# Context and modalities match the lab entry, so only cost and
# reasoning_options are authored.
# AnyRouter forwards `reasoning_effort` to whichever route serves the request
# without validating it, so the rungs a route accepts are whatever that
# route's upstream allows. Measured live on 2026-09-27, `low` and `high` are
# accepted on every route reachable from a plain key, while `medium` and
# `xhigh` are rejected with 400 on some of them, so this publishes the
# intersection only.
# Effort: reasoning_effort = low|high
base_model = "zhipuai/glm-4.7-flash"
reasoning_options = [{ type = "effort", values = ["low", "high"] }]

[cost]
input = 0.06
output = 0.4
