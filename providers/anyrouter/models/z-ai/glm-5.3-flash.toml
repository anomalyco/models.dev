# Host contract (GET /api/v1/models?all=1, read 2026-09-24, re-verified
# 2026-09-27): context_length=1048576, input_modalities=[text, image, video],
# capabilities=[chat, streaming, reasoning, coding, agentic, function-calling,
# vision].
# Context is 1048576 and no pdf, so modalities narrow to [text, image, video].
# AnyRouter forwards `reasoning_effort` without validating it. This route is
# BYOK-only and returned 404/502 on every value, so it is unverified on this
# host and falls back to the lab entry's effort set.
# Effort: reasoning_effort = low|high|max
base_model = "zhipuai/glm-5.3-flash"
reasoning_options = [{ type = "effort", values = ["low", "high", "max"] }]

[cost]
input = 0.15
output = 0.5

[limit]
context = 1_048_576

[modalities]
input = ["text", "image", "video"]
