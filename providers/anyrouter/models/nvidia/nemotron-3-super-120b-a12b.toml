# Host contract (GET /api/v1/models?all=1, read 2026-09-24, re-verified
# 2026-09-27): context_length=262144, max_completion_tokens not declared,
# capabilities=[chat, streaming], price 0.085/0.4. Context and modalities match
# the lab entry, so only cost and reasoning_options are authored.
# Reasoning: providers/nvidia publishes this model as toggle-only and the
# OpenRouter peer as toggle + low|medium + budget_tokens, none of which this
# host can forward on chat (see the provider header), so the ladder is measured
# instead. Probed /api/v1/chat/completions 2026-09-27 with a prompt that forces
# multi-step work: `none` returned 0 reasoning tokens, and mean of 3 at
# max_tokens=1500, low=663 and high=916, so depth tracks the value. All seven
# rungs are accepted; the peer also publishes `medium` and the lab publishes no
# graded rung at all, so the graded core is published and `high` is included
# because it is accepted and measurably deeper than `low`. No budget is
# published: `reasoning.max_tokens` is a Responses-endpoint control per the
# host's docs, not a chat one.
# Effort: reasoning_effort = none|low|medium|high
base_model = "nvidia/nemotron-3-super-120b-a12b"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high"] }]

[cost]
input = 0.085
output = 0.4
