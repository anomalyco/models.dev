# Router preset on the AnyRouter gateway; the served model is chosen per
# request. Host contract (GET /api/v1/models?all=1, read 2026-09-24,
# re-verified 2026-09-27): context_length=1000000, max_completion_tokens=64000,
# capabilities=[chat, streaming, function-calling, coding, vision]. The
# preset's own supported_parameters ([max_tokens, temperature, top_p, stop,
# stream]) is the legacy model-level projection the host documents, not a
# promise shared by every route; the members it resolves do take tools and
# reasoning.
# No [cost]: the preset bills whichever route it resolves at that route's rate,
# so there is no single per-token price. Free hops are $0.
# Reasoning: no caller control is published. Probed /api/v1/chat/completions
# 2026-09-27: every rung is accepted (200), but the member this preset resolved
# (meta/muse-glimmer-30b) reports no reasoning tokens for any value, so no
# rung — including the off sentinel — can be shown to change anything, and a
# rung that is merely accepted is not a control. Chat takes the flat
# `reasoning_effort` and has no toggle (see the provider header).
name = "AnyRouter Latest"
description = "Router to the latest stable production chat model serving traffic, with automatic fallback"
family = "model-router"
release_date = "2026-06-08"
last_updated = "2026-06-08"
attachment = false
reasoning = true
reasoning_options = []
temperature = true
tool_call = true
structured_output = false
open_weights = false

[limit]
context = 1_000_000
output = 64_000

[modalities]
input = ["text"]
output = ["text"]
