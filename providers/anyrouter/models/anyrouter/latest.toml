# Router preset on the AnyRouter gateway. Host contract (GET
# /api/v1/models?all=1, read 2026-09-24, re-verified 2026-09-27):
# context_length=1000000, max output 64000, input_modalities=[text],
# capabilities=[chat, streaming, function-calling, coding, vision]. `cost` is
# the primary route's rate; the preset bills per hop.
# Bills at each hop's rate.
# AnyRouter forwards `reasoning_effort` to whichever route serves the request
# without validating it, so the rungs a route accepts are whatever that
# route's upstream allows. Measured live on 2026-09-27, `low` and `high` are
# accepted on every route reachable from a plain key, while `medium` and
# `xhigh` are rejected with 400 on some of them, so this publishes the
# intersection only.
# Effort: reasoning_effort = low|high
name = "AnyRouter Latest"
description = "Router to the latest stable production chat model serving traffic, with automatic fallback"
family = "model-router"
release_date = "2026-06-08"
last_updated = "2026-06-08"
attachment = false
reasoning = true
reasoning_options = [{ type = "effort", values = ["low", "high"] }]
temperature = true
tool_call = true
structured_output = false
open_weights = false

[cost]
input = 1.5
output = 9.0

[limit]
context = 1_000_000
output = 64_000

[modalities]
input = ["text"]
output = ["text"]
