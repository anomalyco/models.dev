# Preset router across the top tool-calling models for autonomous agents,
# ranked by agentic score, with automatic fallback.
# Host contract (GET /api/v1/models?all=1, re-verified 2026-09-27):
# context_length=1000000, top_provider.max_completion_tokens=65536,
# input_modalities=[text], supported_parameters=[max_tokens, temperature,
# top_p, stop, stream] (no reasoning or response_format controls of its
# own), and capabilities=[chat, streaming, function-calling, coding] (no
# structured-output). `cost` is the primary route's rate
# (google-agent-platform gemini-3.5-flash); the router bills per hop.
# https://anyrouter.dev/model/anyrouter/hermes
name = "AnyRouter Hermes"
description = "Router across the top tool-calling models for autonomous agents, ranked by agentic score, with automatic fallback"
family = "model-router"
release_date = "2026-06-08"
last_updated = "2026-06-08"
attachment = false
reasoning = true
temperature = true
tool_call = true
structured_output = false
open_weights = false
reasoning_options = []

[cost]
input = 1.5
output = 9.0

[limit]
context = 1_000_000
output = 65_536

[modalities]
input = ["text"]
output = ["text"]
