# Router preset on the AnyRouter gateway. Host contract (GET
# /api/v1/models?all=1, read 2026-09-24, re-verified 2026-09-27):
# context_length=1000000, max output 131072, input_modalities=[text],
# capabilities=[chat, streaming, function-calling]. `cost` is the primary
# route's rate; the preset bills per hop.
# Free plan 10 requests/day, paid plans 1000/day; never deducts credits.
# AnyRouter forwards `reasoning_effort` to the serving route without
# validating it. Probed https://anyrouter.dev/api/v1/chat/completions on
# 2026-09-27: this route (backend `openrouter-pool`) accepts none, minimal,
# low, medium, high, xhigh, max. Every rung is accepted here, so this
# publishes the graded core.
# Effort: reasoning_effort = low|medium|high
name = "AnyRouter Free"
description = "Router across free platform models and the donated free pool, with automatic fallback and no credit deduction"
family = "model-router"
release_date = "2026-06-08"
last_updated = "2026-06-08"
attachment = false
reasoning = true
reasoning_options = [{ type = "effort", values = ["low", "medium", "high"] }]
temperature = true
tool_call = true
structured_output = false
open_weights = false

[cost]
input = 0
output = 0

[limit]
context = 1_000_000
output = 131_072

[modalities]
input = ["text"]
output = ["text"]
