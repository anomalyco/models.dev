# Router preset on the AnyRouter gateway; the served model is chosen per
# request. Host contract (GET /api/v1/models?all=1, read 2026-09-24,
# re-verified 2026-09-27): context_length=1000000, max_completion_tokens=131072,
# capabilities=[chat, streaming, function-calling], price 0/0. The preset's own
# supported_parameters ([max_tokens, temperature, top_p, stop, stream]) is the
# legacy model-level projection the host documents, not a promise shared by
# every route; the members it resolves do take tools and reasoning. Free plan 10
# requests/day, paid plans 1000/day; never deducts credits.
# Reasoning: chat takes the flat `reasoning_effort`, `none` is the disable
# sentinel, and there is no toggle on this surface (see the provider header).
# Probed 2026-09-27 with a prompt that forces multi-step work, mean of two runs
# at max_tokens=700: `none` = 0, low = 535, medium = 580, high = 697 reasoning
# tokens, so `none` is a real off position and depth rises with the value. All
# seven rungs are accepted; `none` plus the graded core is published.
# Effort: reasoning_effort = none|low|medium|high
name = "AnyRouter Free"
description = "Router across free platform models and the donated free pool, with automatic fallback and no credit deduction"
family = "model-router"
release_date = "2026-06-08"
last_updated = "2026-06-08"
attachment = false
reasoning = true
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high"] }]
temperature = true
tool_call = true
structured_output = false
open_weights = false

[cost]
input = 0
output = 0

[limit]
context = 1_000_000
output = 131_072

[modalities]
input = ["text"]
output = ["text"]
