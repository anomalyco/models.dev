# Router preset on the AnyRouter gateway. Host contract (GET
# /api/v1/models?all=1, read 2026-09-24, re-verified 2026-09-27):
# context_length=1000000, max output 131072, input_modalities=[text],
# capabilities=[chat, streaming, function-calling]. `cost` is the primary
# route's rate; the preset bills per hop.
# Free plan 10 requests/day, paid plans 1000/day; never deducts credits.
# AnyRouter forwards `reasoning_effort` to whichever route serves the request
# without validating it, so the rungs a route accepts are whatever that
# route's upstream allows. Measured live on 2026-09-27, `low` and `high` are
# accepted on every route reachable from a plain key, while `medium` and
# `xhigh` are rejected with 400 on some of them, so this publishes the
# intersection only.
# Effort: reasoning_effort = low|high
name = "AnyRouter Free"
description = "Router across free platform models and the donated free pool, with automatic fallback and no credit deduction"
family = "model-router"
release_date = "2026-06-08"
last_updated = "2026-06-08"
attachment = false
reasoning = true
reasoning_options = [{ type = "effort", values = ["low", "high"] }]
temperature = true
tool_call = true
structured_output = false
open_weights = false

[cost]
input = 0
output = 0

[limit]
context = 1_000_000
output = 131_072

[modalities]
input = ["text"]
output = ["text"]
