# Host contract (GET /api/v1/models?all=1, read 2026-09-24, re-verified
# 2026-09-27): context_length=1048576, input_modalities=[text, image],
# supported_parameters=[max_tokens, temperature, top_p, stop, stream],
# capabilities=[chat, streaming, function-calling, coding, reasoning, vision].
# Context and modalities both match the lab entry, so only context is
# overridden, from the lab's 1000000. Flat 0.155/0.62 USD/MTok, with no >200k
# context tier.
# Toggle: reasoning.enabled = true|false
# Effort: reasoning_effort = low|high|max (DeepSeek lab + OpenRouter peers).
base_model = "deepseek/deepseek-v4.1-flash"
reasoning_options = [
  { type = "toggle" },
  { type = "effort", values = ["low", "high", "max"] },
]

[cost]
input = 0.155
output = 0.62

[limit]
context = 1_048_576
