# Host contract (GET /api/v1/models?all=1, read 2026-09-24, re-verified
# 2026-09-27): context_length=1048576, input_modalities=[text, image],
# capabilities=[chat, streaming, function-calling, coding, reasoning, vision].
# Only context differs from the lab entry.
# AnyRouter forwards `reasoning_effort` to the serving route without
# validating it. Probed https://anyrouter.dev/api/v1/chat/completions on
# 2026-09-27: this route (backend `nvidia-byok`) accepts none, low, high,
# xhigh, max, and rejects `minimal` and `medium` with 400. That leaves
# low|high as the graded set, and `none` is a real off position here
# (reasoning_tokens drops to 0).
# Honored effect measured the same day: `none`=0, low=537, high=700, so `none`
# is a real off position and depth rises with the value.
# Same prompt each time, mean of two runs at max_tokens=700.
# Effort: reasoning_effort = none|low|high
base_model = "deepseek/deepseek-v4.1-flash"
reasoning_options = [{ type = "effort", values = ["none", "low", "high"] }]

[cost]
input = 0.155
output = 0.62

[limit]
context = 1_048_576
