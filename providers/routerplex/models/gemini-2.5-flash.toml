# Source: https://routerplex.com/api/models (accessed 2026-11-10).
# Cost is the RouterPlex sell price (USD / 1M tokens), equal to what the gateway bills.
# cache_read is listed only where cached prompt tokens bill below the input rate.
# Toggle: `reasoning_effort` = none disables thinking; budget: `thinking_budget` (Gemini `thinkingConfig.thinkingBudget`).
schema = 2
base_model = "google/gemini-2.5-flash"

[capabilities]
reasoning = { supported = true, toggle = true, budget = { min = 0, max = 24_576 } }

[cost.text.input]
price = 0.3

[cost.text.output]
price = 2.5
