# Source: https://routerplex.com/api/models (accessed 2026-10-20).
# Cost is the RouterPlex sell price (USD / 1M tokens), equal to what the gateway bills.
# cache_read is listed only where cached prompt tokens bill below the input rate.
# Toggle: `thinking.type` = enabled|disabled.
base_model = "moonshotai/kimi-k2.6"

[[reasoning_options]]
type = "toggle"

[interleaved]
field = "reasoning_content"

[cost]
input = 0.95
output = 4
cache_read = 0.08

[limit]
context = 256_000
