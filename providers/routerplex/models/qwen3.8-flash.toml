# Source: https://routerplex.com/api/models (accessed 2026-11-10).
# Cost is the RouterPlex sell price (USD / 1M tokens), equal to what the gateway bills.
# cache_read is listed only where cached prompt tokens bill below the input rate.
# Toggle: `enable_thinking` true|false. Effort: `reasoning_effort` = low|medium|xhigh. Budget: `thinking_budget` up to 262144.
# Text-only on this host: the RouterPlex catalog (https://routerplex.com/api/models) lists
# qwen3.8-flash with "vision": false, and image input is rejected upstream.
schema = 2
base_model = "alibaba/qwen3.8-flash"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "xhigh"], budget = { max = 262_144 } }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.15
cache = { read = 0.016 }

[cost.text.output]
price = 0.47
