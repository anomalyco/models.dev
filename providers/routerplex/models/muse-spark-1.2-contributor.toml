# Source: https://routerplex.com/api/models (accessed 2026-10-20).
# Cost is the RouterPlex sell price (USD / 1M tokens), equal to what the gateway bills.
# cache_read is listed only where cached prompt tokens bill below the input rate.
# Contributor edition: Meta may train on prompts and completions sent to this id.
# On this host it is text-only and does not accept tools.
base_model = "meta/muse-spark-1.2"
name = "Muse Spark 1.2 Contributor"
tool_call = false
attachment = false

[[reasoning_options]]
type = "effort"
values = ["minimal", "low", "medium", "high", "xhigh"]

[cost]
input = 0.1
output = 0.2
cache_read = 0.008

[modalities]
input = ["text"]
