# Source: https://routerplex.com/api/models (accessed 2026-11-10).
# Cost is the RouterPlex sell price (USD / 1M tokens), equal to what the gateway bills.
# cache_read is listed only where cached prompt tokens bill below the input rate.
schema = 2
base_model = "openai/gpt-5.6-luna"
base_model_omit = ["limit.input"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }

[limit]
context = 258_000

[cost.text.input]
price = 0.2
cache = { read = 0.016 }

[cost.text.output]
price = 1.2
