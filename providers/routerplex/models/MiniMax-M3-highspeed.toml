# Source: https://routerplex.com/api/models (accessed 2026-11-10).
# Cost is the RouterPlex sell price (USD / 1M tokens), equal to what the gateway bills.
# cache_read is listed only where cached prompt tokens bill below the input rate.
# Toggle: `thinking.type` = enabled|disabled.
schema = 2
base_model = "minimax/MiniMax-M3"
name = "MiniMax-M3-highspeed"
description = "Low-latency MiniMax M3 variant for interactive coding and agent loops"

[capabilities]
reasoning = { supported = true, toggle = true }

[limit]
context = 1_000_000

[cost.text.input]
price = 0.45
cache = { read = 0.06 }

[cost.text.output]
price = 1.8
