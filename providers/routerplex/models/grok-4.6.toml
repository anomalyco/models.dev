# Source: https://routerplex.com/api/models (accessed 2026-11-10).
# Cost is the RouterPlex sell price (USD / 1M tokens), equal to what the gateway bills.
# cache_read is listed only where cached prompt tokens bill below the input rate.
schema = 2
base_model = "xai/grok-4.6"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }

[cost.text.input]
price = 2

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 4

[cost.text.output]
price = 6

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 12
