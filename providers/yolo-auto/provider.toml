name = "Yolo-Auto"
npm = "@ai-sdk/openai-compatible"
env = ["YOLO_AUTO_API_KEY"]
# Flat subscription: one plan covers every model; per-token cost published as 0.0
# (same convention as providers/opencode). The two model ids are host-owned
# auto-router aliases whose server-side backing models rotate without changing
# the id, so the model files assert only the alias contract.
# Toggle: chat_template_kwargs.enable_thinking (or .thinking) true|false.
# Effort: top-level reasoning_effort; accepted levels are advertised per model
# by GET /v1/models ("thinking" field). https://yolo-auto.com/docs (accessed 2026-09-22)
api = "https://yolo-auto.com/v1"
doc = "https://yolo-auto.com/docs"
