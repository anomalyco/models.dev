# Host-owned lightweight auto-router alias, defined inline (no base_model):
# the backing model rotates behind this id (it changed on 2026-09-18) while
# the contract below holds, so no lab-specific facts are asserted. Same
# pattern as openrouter/auto and llmgateway/auto.
# Verified against the live host on 2026-09-22:
# - Toggle: chat_template_kwargs.enable_thinking = true|false reaches upstream
#   verbatim on this host (live-verified: default replies carry a reasoning
#   chain; enable_thinking false yields none). reasoning_effort changes nothing
#   on this alias, and GET /v1/models omits the thinking levels field here.
# - tool_call verified live.
name = "Yolo Small Auto"
description = "Lightweight auto-router alias: always-thinking server-side model selection behind one flat subscription"
family = "auto"
release_date = "2026-09-18"
last_updated = "2026-09-22"
attachment = false
reasoning = true
reasoning_options = [
  { type = "toggle" },
]
temperature = true
tool_call = true
structured_output = true
open_weights = false

# No separate output cap is published; the gateway clamps max_tokens to
# (context - prompt). output = 131072 is the conservative value enforced on
# every plan and the docs-recommended client window, achievable as output with a
# short prompt; context keeps the advertised 262144.
[limit]
context = 262_144
output = 131_072

[modalities]
input = ["text"]
output = ["text"]

[cost]
input = 0.0
output = 0.0
