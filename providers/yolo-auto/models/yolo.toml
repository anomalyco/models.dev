# Host-owned auto-router alias, defined inline (no base_model): the backing
# model is selected server-side and rotates without changing this id, so no
# lab-specific facts are asserted. Same pattern as openrouter/auto and
# llmgateway/auto.
name = "Yolo Auto"
description = "Flagship auto-router alias: server-side model selection behind one flat subscription"
family = "auto"
release_date = "2026-08-27"
last_updated = "2026-09-22"
attachment = true
reasoning = true
# Toggle: chat_template_kwargs.enable_thinking = true|false (host-published
# control; GET /v1/models advert thinking levels for this id).
# Effort: top-level reasoning_effort = minimal|low|medium|high|xhigh; the
# gateway translates the level onto the current backend's thinking control.
reasoning_options = [
  { type = "toggle" },
  { type = "effort", values = ["minimal", "low", "medium", "high", "xhigh"] },
]
temperature = false
tool_call = true
structured_output = true
open_weights = false

[limit]
context = 262_144
output = 262_144

[modalities]
input = ["text", "image"]
output = ["text"]

[cost]
input = 0.0
output = 0.0
