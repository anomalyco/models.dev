# Chat `reasoning_effort`, Messages `output_config.effort`, and Responses
# `reasoning.effort` accept low/medium/high (accessed 2026-09-21).
# https://platform.stepfun.ai/docs/en/guides/models/step-5-preview
# Verified live: GET https://api.stepfun.ai/v1/models lists step-5-preview
# with reasoning_effort_support_list ["low", "medium", "high"] and
# max_input_tokens 1024000; POST /v1/chat/completions succeeds.
# The model card specifies maximum output of 64k tokens:
# https://platform.stepfun.ai/docs/en/guides/models/step-5-preview
# Pricing (USD/MTok): input 1.00, output 2.70, cache_read 0.05 (95% cache
# discount), matching existing mirrors and vendor reporting.
schema = 2
base_model = "stepfun/step-5-preview"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
context = 1_024_000
input = 1_024_000
output = 65_536

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1
cache = { read = 0.05 }

[cost.text.output]
price = 2.7
