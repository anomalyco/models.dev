# Sources (accessed 2026-11-24):
# - Pricing (USD per 1M tokens): 0.36 input, 0.07 cache hit, 1.15 output: https://platform.stepfun.ai/docs/en/guides/pricing/details
# - Caching: automatic prefix cache from 256 tokens: https://platform.stepfun.ai/docs/en/guides/developer/prompt-cache
# - Chat Completions only; the Messages and Responses APIs don't list this model.
# max_tokens_field: StepFun's Chat Completions API documents max_tokens and not max_completion_tokens (https://platform.stepfun.com/docs/zh/api-reference/chat/chat-completion-create, accessed 2026-10-24)
schema = 2
base_model = "stepfun/step-1o-turbo-vision"

[capabilities]
cache = { implicit = { min_tokens = 256 } }

[api.chat-completions]
compatibility = { max_tokens_field = "max_tokens" }

[cost.text.input]
price = 0.36
cache = { read = 0.07 }

[cost.text.output]
price = 1.15
