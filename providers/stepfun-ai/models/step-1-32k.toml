# Retired 2026-07-08 (replacement: step-1o-turbo-vision): https://platform.stepfun.ai/docs/en/guides/model-migration
# Prices are from before the model left the pricing page: China list CNY 15 / 3 / 70 (input / cache hit / output per
#   1M tokens) at 7.2973 CNY/USD, the rate used when the file was added; not re-converted since the model is retired.
#   The global platform's own USD price was never recorded, and StepFun's archived global pricing page is
#   client-rendered with no table. These are the China-derived prices v1 already published, kept as-is.
# knowledge, release_date and limits are unsourced; StepFun no longer documents this model.
schema = 2
name = "Step 1 (32K)"
description = "StepFun flash model for efficient multimodal reasoning, coding, and tool use"
