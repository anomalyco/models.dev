# Sources (accessed 2026-10-21):
# - Model card (256K context, text only): https://platform.stepfun.ai/docs/en/guides/models/step-3.5-flash
# last_updated comes from the lab; the previous host value (2026-06-15) had no source.
# - Pricing (USD per 1M tokens): 0.10 input, 0.02 cache hit, 0.30 output: https://platform.stepfun.ai/docs/en/guides/pricing/details
# - Structured output (JSON Schema applies to step-5-preview, step-3.7-flash, step-3.5-flash, step-3.5-flash-2603):
#   https://platform.stepfun.ai/docs/en/guides/developer/json-mode
# - Caching: automatic prefix cache from 256 tokens, no cache_control; cache writes bill at the cache-miss input
#   price: https://platform.stepfun.ai/docs/en/guides/developer/prompt-cache
# Effort: reasoning_effort (Chat) and output_config.effort (Messages) = low|high, as recorded on 2026-06-25. The
#   current docs list low/high only for step-3.5-flash-2603 and don't name step-3.5-flash's levels; needs a live check.
# No Responses API for this model (Responses supports only step-5-preview and step-3.7-flash).
# Chat Completions returns reasoning in both `reasoning` and `reasoning_content`.
# Sampling: Chat documents temperature and top_p; Messages also documents top_k (0-500).
# Mid-conversation flags (system_updates, effort_updates, tools.updates) unset: undocumented, and no StepFun key to test.
schema = 2
base_model = "stepfun/step-3.5-flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "high"] }
structured_output = true
cache = { implicit = { min_tokens = 256 } }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.1
cache = { read = 0.02 }

[cost.text.output]
price = 0.3
