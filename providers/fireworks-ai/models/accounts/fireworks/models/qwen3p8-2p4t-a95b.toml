# Fireworks' page retains a qwen3p8-max URL slug, but identifies the served model as
# Qwen3.8-2.4T-A95B with API path accounts/fireworks/models/qwen3p8-2p4t-a95b;
# it also documents serverless pricing, 262K context, and text-only input:
# https://fireworks.ai/models/fireworks/qwen3p8-max (accessed 2026-09-04)
# The model requires thinking and accepts reasoning_effort low|medium|xhigh:
# https://huggingface.co/Qwen/Qwen3.8-2.4T-A95B/raw/main/README.md (accessed 2026-09-04)
# Fireworks returns reasoning in reasoning_content:
# https://docs.fireworks.ai/api-reference/post-chatcompletions (accessed 2026-09-04)
# Structured output: response_format json_schema is supported (https://docs.fireworks.ai/structured-responses/structured-response-formatting)
#   and returned schema-shaped JSON without being asked for JSON in a live test (2026-10-21).
# Cache: prompt caching is on by default for every Serverless model, prefix-based, no request field; route with `user` or
#   `x-session-affinity` (https://docs.fireworks.ai/guides/prompt-caching).
# Mid-conversation, live Chat Completions tests (2026-10-21): ~8k-token prefix, one x-session-affinity key, and a control turn that hit the cache:
#   system_updates = false: a system message after the first turn returns 400 "jinja template rendering failed. System message must be at the beginning.".
#   effort_updates = false: changing reasoning_effort low → medium on the last turn left 0/0 cached tokens in 2 trials.
#   tools.updates = false: adding a second tool on the last turn left 0/0 cached tokens in 2 trials (tools render before the messages).
#   Fireworks also serves Anthropic Messages (POST /inference/v1/messages) and Responses (POST /inference/v1/responses); only Chat Completions was tested.
schema = 2
base_model = "alibaba/qwen3.8-2.4t-a95b"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "xhigh"] }
structured_output = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 2
cache = { read = 0.25 }

[cost.text.output]
price = 6
