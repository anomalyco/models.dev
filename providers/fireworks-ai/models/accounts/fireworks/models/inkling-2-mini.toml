# Fireworks Inkling 2 Mini (accounts/fireworks/models/inkling-2-mini):
# - Model card (accessed 2026-11-26): https://fireworks.ai/models/fireworks/inkling-2-mini — Serverless $0.15 / $0.015 / $0.50 per 1M
#   input / cached input / output, Context Length 1040k tokens (GET /v1/accounts/fireworks/models/inkling-2-mini: contextLength 1048576,
#   the lab's window, so no limit override), Huggingface thinkingmachines/Inkling-2-Mini.
# - Pricing table, Inkling 2 Mini row: https://docs.fireworks.ai/serverless/pricing (accessed 2026-11-26) — Standard $0.15 / $0.015 / $0.50,
#   Priority $0.1875 / $0.01875 / $0.625 (1.25x) per 1M input / cached input / output. Priority uses service_tier = "priority"
#   (https://docs.fireworks.ai/serverless/serverless-modes); a priority request answered live (2026-11-26).
# - Tools and images: the model card says Function Calling and image input "Not Supported", but live Chat Completions on this ID
#   (2026-11-26) returned a required tool call, and named both colors of a base64 PNG split red/blue. Thinking Machines documents PNG and
#   JPEG (https://tinker-docs.thinkingmachines.ai/cookbook/inkling/images/), which Fireworks also accepts
#   (https://docs.fireworks.ai/guides/querying-vision-language-models#known-limitations), so input lists those two.
# - Effort: reasoning_effort = minimal|low|medium|high|xhigh|max. With raw_output = true each renders a "Thinking effort level" system line:
#   minimal 0.1, low 0.2, medium 0.7, high 0.9 (also the default), xhigh and max 0.99 (Tinker also documents max as xhigh), live 2026-11-26.
#   Unknown values are a 400. No toggle: reasoning_effort = "none" and thinking.type = "disabled" both render level 0 and still returned
#   ~40 reasoning tokens on a one-line arithmetic prompt (low 36-43, max 59-64), so reasoning can't be turned off here, unlike on
#   Thinking Machines' own API (providers/thinkingmachines/models/thinkingmachines/Inkling-2-Mini.toml).
#   Reasoning API: https://docs.fireworks.ai/api-reference/post-chatcompletions
# - Structured output: response_format json_schema returned schema-shaped JSON live (2026-11-26);
#   https://docs.fireworks.ai/structured-responses/structured-response-formatting
# - Cache: prompt caching is on by default for every Serverless model, prefix-based, no request field
#   (https://docs.fireworks.ai/guides/prompt-caching).
# - APIs: Chat Completions, Responses (POST /inference/v1/responses) and Anthropic Messages (POST /inference/v1/messages) all answered on
#   this ID live (2026-11-26). https://docs.fireworks.ai/guides/response-api, https://docs.fireworks.ai/api-reference/anthropic-messages
schema = 2
base_model = "thinkingmachines/inkling-2-mini"

[modalities]
input = ["text", "image/png", "image/jpeg"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.15
cache = { read = 0.015 }

[cost.text.output]
price = 0.5

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.25

[experimental.modes.priority]
body = { service_tier = "priority" }
