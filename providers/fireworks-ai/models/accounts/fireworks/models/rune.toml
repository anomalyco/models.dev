# Rune 26B-A4B on Fireworks Serverless: accounts/fireworks/models/rune (Ready, created 2026-10-20)
# https://app.fireworks.ai/models/fireworks/rune (accessed 2026-10-28)
# Pricing: Standard $0.042 input / $0.0084 cached input / $0 output, no Priority tier, US capacity with no premium:
#   https://docs.fireworks.ai/serverless/pricing (Decision models section)
# Decision model: POST /inference/v1/systemone with a state and typed questions (noul, choice, score); chat completions
#   and completions return 400. https://docs.fireworks.ai/api-reference/post-systemone
#   Live 2026-10-28: noul and score questions answered, usage.output_tokens = 0.
#   The same model also takes the OpenAI-format body at POST /inference/v1/decisions
#   (https://docs.fireworks.ai/api-reference/post-decisions), which no SDK entry point targets on Fireworks yet.
# Cache: usage.cached_input_tokens counts state tokens served from the prompt cache (post-systemone).
schema = 2
v2_only = true
base_model = "surogate/rune-26b-a4b"

[capabilities]
cache = { implicit = true }

[api.systemone]
base_url = "https://api.fireworks.ai/inference/v1"
sdk = { aisdk = "@ai-sdk/typesafe-ai", opencodeai = "@opencode/ai/providers/typesafe-ai/decisions" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.042
cache = { read = 0.0084 }

[cost.text.output]
price = 0
