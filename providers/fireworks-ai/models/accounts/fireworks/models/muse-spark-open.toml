# Sources (accessed 2026-10-15):
# https://fireworks.ai/models/fireworks/muse-spark-open — model path accounts/fireworks/models/muse-spark-open; Serverless $1.25 / $0.15 / $4.25 per 1M tokens (input/cached input/output); Context Length 1M tokens; Function Calling Supported; Image Input Supported; Provider Meta; Inputs text and images, output text
# https://app.fireworks.ai/models/fireworks/muse-spark-open — Standard Uncached $1.25/M, Cached $0.15/M, Output $4.25/M; usage example max_tokens 131072 (inherited output limit)
# Native reasoning: https://dev.meta.ai/docs/muse-spark-open/prompting — reasoning_effort low|medium|high|xhigh (default xhigh); reasoning cannot be turned off, none|max rejected
# Lab context/modalities: https://dev.meta.ai/docs/muse-spark-open — 1,048,576-token context; text, image, audio, and video input with text output (Fireworks serves text+image subset)
# Image types: the lab lists generic image input, so every format Fireworks accepts. Fireworks documents .png, .jpg/.jpeg, .gif, .bmp, .tiff and .ppm
#   (https://docs.fireworks.ai/guides/querying-vision-language-models#known-limitations); webp and avif also decoded in live tests (2026-10-21), heic failed.
# Structured output: response_format json_schema is supported (https://docs.fireworks.ai/structured-responses/structured-response-formatting)
#   and returned schema-shaped JSON without being asked for JSON in a live test (2026-10-21).
# Cache: prompt caching is on by default for every Serverless model, prefix-based, no request field; route with `user` or
#   `x-session-affinity` (https://docs.fireworks.ai/guides/prompt-caching).
# Mid-conversation, live Chat Completions tests (2026-10-21): ~8k-token prefix, one x-session-affinity key, and a control turn that hit the cache:
#   system_updates = true: after a system message sent after the first turn, 7936 of 7992 prompt tokens still came from the cache, so it stays in place.
#   effort_updates = false: changing reasoning_effort low → high on the last turn left 0/0 cached tokens in 2 trials.
#   tools.updates = false: adding a second tool on the last turn left 0/0 cached tokens in 2 trials (tools render before the messages).
#   Fireworks also serves Anthropic Messages (POST /inference/v1/messages) and Responses (POST /inference/v1/responses); only Chat Completions was tested.
schema = 2
base_model = "meta/muse-spark-open"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/gif", "image/bmp", "image/tiff", "image/x-portable-pixmap", "image/webp", "image/avif"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
system_updates = true
cache = { implicit = true }

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 1.25
cache = { read = 0.15 }

[cost.text.output]
price = 4.25
