# Fireworks' published schema does not document this model's toggle or "max"
# effort mapping. https://docs.fireworks.ai/guides/reasoning (accessed 2026-06-25)
name = "GLM 5.2"
description = "Flagship GLM model for hybrid reasoning, coding, and agentic engineering"
family = "glm"
release_date = "2026-06-16"
last_updated = "2026-06-16"
attachment = false
reasoning = true
temperature = true
tool_call = true
open_weights = true

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["high", "max"]

[cost]
input = 1.4
output = 4.4
cache_read = 0.14

[limit]
context = 1_048_575
output = 131_072

[modalities]
input = ["text"]
output = ["text"]

[experimental.modes.priority]
cost = { input = 1.75, output = 5.5, cache_read = 0.175 }
provider = { body = { service_tier = "priority" } }
