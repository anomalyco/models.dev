# $.reasoning_effort = "low" | "medium" | "high".
# https://docs.fireworks.ai/guides/reasoning (accessed 2026-06-25)
schema = 2
name = "MiniMax-M3"
description = "Fireworks text-only MiniMax coding model for long-context reasoning and agent tasks"
family = "minimax"
open_weights = true
release_date = "2026-06-12"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
temperature = true

[limit]
context = 512_000
output = 512_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.3
cache = { read = 0.06 }

[cost.text.output]
price = 1.2

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.5

[experimental.modes.priority]
body = { service_tier = "priority" }
