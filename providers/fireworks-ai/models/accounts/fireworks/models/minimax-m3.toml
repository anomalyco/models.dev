# $.reasoning_effort = "low" | "medium" | "high".
# https://docs.fireworks.ai/guides/reasoning (accessed 2026-06-25)
# Lab identity: MiniMax M3 (List Models displayName "Minimax M3", modelType minimax_m3_vl, 428B):
#   GET https://api.fireworks.ai/v1/accounts/fireworks/models (2026-10-21)
# Serving: GET https://api.fireworks.ai/v1/serverless/models lists text input only and
#   context_length 512000 (the lab serves 1M with image and video input).
schema = 2
base_model = "minimax/MiniMax-M3"
description = "Fireworks text-only MiniMax coding model for long-context reasoning and agent tasks"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[limit]
context = 512_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.3
cache = { read = 0.06 }

[cost.text.output]
price = 1.2

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.5

[experimental.modes.priority]
body = { service_tier = "priority" }
