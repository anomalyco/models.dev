# GET /v1/serverless/models lists MiniMax M2.7 as Priority-only at
# $1.20 / $0.60 / $1.20 per 1M (input / cached input / output) with a
# 196,608-token context on 2026-09-16.
# $.reasoning_effort = "low" | "medium" | "high" (same Fireworks surface as MiniMax M3).
# https://docs.fireworks.ai/guides/reasoning
base_model = "minimax/MiniMax-M2.7"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
input = 1.2
output = 1.2
cache_read = 0.6

[limit]
context = 196_608

[provider]
body = { service_tier = "priority" }
