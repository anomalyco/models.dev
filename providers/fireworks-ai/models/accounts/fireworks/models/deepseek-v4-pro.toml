# GET /v1/serverless/models lists DeepSeek V4 Pro on Standard and Priority
# at $1.20 / $0.60 / $1.20 per 1M (input / cached input / output) on
# 2026-09-16. Both serving modes currently have the same price.
# Toggle: thinking.type = enabled|disabled (reasoning_effort = none|false also disables)
# Effort: reasoning_effort = high|max; low/medium promote to high, xhigh to max
# Reasoning API: https://docs.fireworks.ai/api-reference/post-chatcompletions (accessed 2026-09-15)
# Peer surface: providers/fireworks-ai/models/accounts/fireworks/models/deepseek-v4-pro-0813.toml
base_model = "deepseek/deepseek-v4-pro"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["high", "max"]

[cost]
input = 1.2
output = 1.2
cache_read = 0.6

[experimental.modes.priority]
cost = { input = 1.2, output = 1.2, cache_read = 0.6 }
provider = { body = { service_tier = "priority" } }
