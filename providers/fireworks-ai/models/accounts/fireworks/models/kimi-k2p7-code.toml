# Fireworks documents thinking.type = "enabled", but no explicit disabled
# value for this model. https://docs.fireworks.ai/guides/reasoning (accessed 2026-06-25)
name = "Kimi K2.7 Code"
description = "Kimi coding model for software agents, refactors, and repository reasoning"
family = "kimi-k2"
release_date = "2026-06-12"
last_updated = "2026-06-16"
attachment = true
reasoning = true
temperature = true
tool_call = true
open_weights = true

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "toggle"

[cost]
input = 0.95
output = 4
cache_read = 0.19

[limit]
context = 262_000
output = 262_000

[modalities]
input = ["text", "image"]
output = ["text"]

[experimental.modes.priority]
cost = { input = 1.425, output = 6, cache_read = 0.285 }
provider = { body = { service_tier = "priority" } }
