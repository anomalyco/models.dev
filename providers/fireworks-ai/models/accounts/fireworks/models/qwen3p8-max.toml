schema = 2
base_model = "alibaba/qwen3.8-max"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }

[limit]
context = 262_144

[cost.text.input]
price = 2
cache = { read = 0.25 }

[cost.text.output]
price = 6

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.5

[experimental.modes.priority]
body = { service_tier = "priority" }
