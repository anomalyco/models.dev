# Off is effort=none; graded levels, no toggle
# Effort: reasoning_effort = none|low|medium|high|xhigh|max (https://docs.fireworks.ai/api-reference/post-chatcompletions, accessed 2026-10-27)
#   high and max select the same prompt tier as xhigh (also the default when omitted); false and thinking.type = disabled match none.
#   Live Chat Completions, temperature 0, "Is 391 prime? Answer yes or no." (2026-10-27), value -> prompt / reasoning tokens over 2 trials:
#   none 24 / 0, 0; low 52 / 239, 238; medium 22 / 228, 228; xhigh 64 / 173, 132; high 64 / 133, 129; max 64 / 132, 129; omitted 64 / 173, 136.
#   A harder prompt gave low 4109, medium 16397, xhigh 33114 (max identical) reasoning tokens; adaptive returns 400.
#   Limitation: on that harder prompt every off path still returned reasoning_content despite the no-thinking prompt
#   (none 29406, false 19836, thinking.type = disabled 23174 tokens), so off is not guaranteed on hard prompts.
# Image types: the lab's image types that Fireworks accepts. Fireworks documents .png, .jpg/.jpeg, .gif, .bmp, .tiff and .ppm
#   (https://docs.fireworks.ai/guides/querying-vision-language-models#known-limitations); webp and avif also decoded in live tests (2026-10-21), heic failed.
# Structured output: response_format json_schema is supported (https://docs.fireworks.ai/structured-responses/structured-response-formatting)
#   and returned schema-shaped JSON without being asked for JSON in a live test (2026-10-21).
# Cache: prompt caching is on by default for every Serverless model, prefix-based, no request field; route with `user` or
#   `x-session-affinity` (https://docs.fireworks.ai/guides/prompt-caching).
# Mid-conversation, live Chat Completions tests (2026-10-21): ~8k-token prefix, one x-session-affinity key, and a control turn that hit the cache:
#   system_updates = false: a system message after the first turn returns 400 "jinja template rendering failed. System message must be at the beginning.".
#   tools.updates = false: adding a second tool on the last turn left 0/0 cached tokens in 2 trials (tools render before the messages).
#   Fireworks also serves Anthropic Messages (POST /inference/v1/messages) and Responses (POST /inference/v1/responses); only Chat Completions was tested.
schema = 2
base_model = "alibaba/qwen3.8-max"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "xhigh"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 262_144

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 2
cache = { read = 0.25 }

[cost.text.output]
price = 6

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.5

[experimental.modes.priority]
body = { service_tier = "priority" }
