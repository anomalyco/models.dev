# Pricing: https://docs.fireworks.ai/serverless/pricing (accessed 2026-08-29)
# Released on Fireworks Serverless API 2026-08-28.
# Thinking-only model: reasoning cannot be disabled (reasoning_effort="none"
# and thinking.type="disabled" both return 400). Unlike GLM 5.2 (two tiers,
# low/medium collapse to high), GLM 5.3 has three distinct effort tiers:
# verified empirically 2026-09-04 — same prompt yields ~10/25/198 reasoning
# tokens for low/high/max. max/xhigh select max.
# https://docs.fireworks.ai/api-reference/post-chatcompletions
# Serving limits verified 2026-09-07: GET /v1/models reports context_length
# 1_048_576; an over-limit probe (1_200_012 prompt tokens) was rejected with
# "model maximum context length: 1048573" — the enforced prompt cap, recorded
# here. Fireworks performs no pre-flight max_tokens validation at all
# (262_144, 524_288, and 2_000_000 all accepted), so a request-side output
# ceiling is untestable by probes; output = 262_144 per the Baseten-
# documented generation ceiling for the same weights. The Z.ai lab default
# (1M / 128K, https://docs.z.ai/guides/llm/glm-5.3) understates Fireworks
# serving.
# Structured output: response_format json_schema is supported (https://docs.fireworks.ai/structured-responses/structured-response-formatting)
#   and returned schema-shaped JSON without being asked for JSON in a live test (2026-10-21).
# Cache: prompt caching is on by default for every Serverless model, prefix-based, no request field; route with `user` or
#   `x-session-affinity` (https://docs.fireworks.ai/guides/prompt-caching).
# Mid-conversation, live Chat Completions tests (2026-10-21): ~8k-token prefix, one x-session-affinity key, and a control turn that hit the cache:
#   system_updates = true: after a system message sent after the first turn, 8717 of 8739 prompt tokens still came from the cache, so it stays in place.
#   effort_updates = false: changing reasoning_effort low → high on the last turn left 10/10 cached tokens in 2 trials.
#   tools.updates = false: adding a second tool on the last turn left 93/68 cached tokens in 2 trials (tools render before the messages).
#   Fireworks also serves Anthropic Messages (POST /inference/v1/messages) and Responses (POST /inference/v1/responses); only Chat Completions was tested.
schema = 2
base_model = "zhipuai/glm-5.3"
name = "GLM 5.3"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
system_updates = true
effort_updates = false
cache = { implicit = true }

[limit]
context = 1_048_573
output = 262_144

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.4
cache = { read = 0.26 }

[cost.text.output]
price = 4.4

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.25

[experimental.modes.priority]
body = { service_tier = "priority" }
