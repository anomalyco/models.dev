# GPT OSS 120B on Fireworks Serverless: accounts/fireworks/models/gpt-oss-120b
# Lab identity: OpenAI gpt-oss-120b (List Models displayName "OpenAI gpt-oss-120b", modelType gpt_oss,
#   116.8B parameters, FP4): GET https://api.fireworks.ai/v1/accounts/fireworks/models (2026-10-21)
# Effort: reasoning_effort = low|medium|high (https://docs.fireworks.ai/guides/reasoning)
# Deprecation: List Models reports deprecationDate 2026-11-07 (2026-10-21).
schema = 2
base_model = "openai/gpt-oss-120b"
description = "Open-weight GPT model for self-hosted reasoning and instruction-following workloads"
status = "deprecated"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }

[cost.text.input]
price = 0.15
cache = { read = 0.015 }

[cost.text.output]
price = 0.6

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.2

[experimental.modes.priority]
body = { service_tier = "priority" }
