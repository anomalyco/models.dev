schema = 2
base_model = "nvidia/nemotron-3.5-lightning"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[cost.text.input]
price = 0.05
cache = { read = 0.01 }

[cost.text.output]
price = 0.2

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.25

[experimental.modes.priority]
body = { service_tier = "priority" }
