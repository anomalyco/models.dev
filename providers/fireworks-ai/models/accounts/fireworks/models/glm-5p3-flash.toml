# Pricing: https://fireworks.ai/models/fireworks/glm-5p3-flash (accessed 2026-09-02)
# Released on Fireworks Serverless API 2026-08-26.
# Thinking-only model: reasoning cannot be disabled. Three distinct effort
# tiers like Fireworks GLM 5.3 (NOT the two-tier GLM 5.2 collapse): verified
# empirically 2026-09-04 — same prompt yields ~9/17/559 reasoning tokens for
# low/high/max. max/xhigh select max.
# https://docs.fireworks.ai/api-reference/post-chatcompletions
# Serving limits verified 2026-09-07: GET /v1/models reports context_length
# 1_048_576; an over-limit probe (1_200_012 prompt tokens) was rejected with
# "model maximum context length: 1048573" — the enforced prompt cap, recorded
# here (the lab default is 1M context). Output stays at the inherited
# 131_072: Fireworks performs no pre-flight max_tokens validation (up to
# 2_000_000 accepted), and Baseten documents 131_072 for GLM-5.3-Flash.
# Image types: the lab's image types that Fireworks accepts. Fireworks documents .png, .jpg/.jpeg, .gif, .bmp, .tiff and .ppm
#   (https://docs.fireworks.ai/guides/querying-vision-language-models#known-limitations); webp and avif also decoded in live tests (2026-10-21), heic failed.
# Structured output: response_format json_schema is supported (https://docs.fireworks.ai/structured-responses/structured-response-formatting)
#   and returned schema-shaped JSON without being asked for JSON in a live test (2026-10-21).
# Cache: prompt caching is on by default for every Serverless model, prefix-based, no request field; route with `user` or
#   `x-session-affinity` (https://docs.fireworks.ai/guides/prompt-caching).
# Mid-conversation, live Chat Completions tests (2026-10-21): ~8k-token prefix, one x-session-affinity key, and a control turn that hit the cache:
#   system_updates = true: after a system message sent after the first turn, 8384 of 8419 prompt tokens still came from the cache, so it stays in place.
#   effort_updates = false: changing reasoning_effort low → high on the last turn left 0/0 cached tokens in 2 trials.
#   tools.updates = false: adding a second tool on the last turn left 0/0 cached tokens in 2 trials (tools render before the messages).
#   Fireworks also serves Anthropic Messages (POST /inference/v1/messages) and Responses (POST /inference/v1/responses); only Chat Completions was tested.
schema = 2
base_model = "zhipuai/glm-5.3-flash"
name = "GLM 5.3 Flash"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
system_updates = true
effort_updates = false
cache = { implicit = true }

[limit]
context = 1_048_573

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.15
cache = { read = 0.03 }

[cost.text.output]
price = 0.5

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.25

[experimental.modes.priority]
body = { service_tier = "priority" }
