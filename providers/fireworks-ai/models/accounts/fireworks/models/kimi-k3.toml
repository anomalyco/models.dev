# Image types: the lab's image types that Fireworks accepts. Fireworks documents .png, .jpg/.jpeg, .gif, .bmp, .tiff and .ppm
#   (https://docs.fireworks.ai/guides/querying-vision-language-models#known-limitations); webp and avif also decoded in live tests (2026-10-21), heic failed.
# Structured output: response_format json_schema is supported (https://docs.fireworks.ai/structured-responses/structured-response-formatting)
#   and returned schema-shaped JSON without being asked for JSON in a live test (2026-10-21).
# Cache: prompt caching is on by default for every Serverless model, prefix-based, no request field; route with `user` or
#   `x-session-affinity` (https://docs.fireworks.ai/guides/prompt-caching).
# Mid-conversation, live Chat Completions tests (2026-10-21): ~8k-token prefix, one x-session-affinity key, and a control turn that hit the cache:
#   system_updates = true: after a system message sent after the first turn, 8056 of 8122 prompt tokens still came from the cache, so it stays in place.
#   effort_updates = false: changing reasoning_effort low → high on the last turn left 0/0 cached tokens in 2 trials.
#   Changing the top-level tools list on the last turn left 0/0 cached tokens in 2 trials (tools render before the messages), which doesn't count as tools.updates.
# Mid-conversation, live Chat Completions test (2026-10-27): tools.updates = true (add only): Kimi's tool-carrying system message
#   ({role: "system", tools: [...]}, no content) after the last user turn was answered with a call to the added tool and kept the cache
#   [cached/prompt tokens, control -> test: 8230/8231 -> 8192/8341]. A late system message was obeyed in the same run [8230/8231 -> 8192/8250].
#   Fireworks also serves Anthropic Messages (POST /inference/v1/messages) and Responses (POST /inference/v1/responses); only Chat Completions was tested,
#   so both flags sit on [api.chat-completions] only.
schema = 2
base_model = "moonshotai/kimi-k3"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "max"], budget = { min = 1_024 } }
structured_output = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
capabilities = { system_updates = true, tools = { updates = true } }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 3
cache = { read = 0.3 }

[cost.text.output]
price = 15

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.25

[experimental.modes.priority]
body = { service_tier = "priority" }
