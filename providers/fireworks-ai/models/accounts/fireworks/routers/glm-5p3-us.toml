# US-only Serverless route for GLM 5.3: same model, served only from US capacity. Call it on https://us.api.fireworks.ai
#   (https://docs.fireworks.ai/serverless/us-only-serverless). The API echoes the underlying accounts/fireworks/models/glm-5p3.
# Pricing: https://docs.fireworks.ai/serverless/pricing ("GLM 5.3 (US)" row, accessed 2026-11-24): Standard $2.10 / $0.39 / $6.60, Priority $2.625 / $0.4875 / $8.25
#   per 1M input / cached input / output. US-only routes are 1.5x the global price.
# Live 2026-11-24 on us.api.fireworks.ai: Chat Completions (with service_tier = "priority"), Responses and Messages all answered on accounts/fireworks/routers/glm-5p3-us.
#   This route isn't in GET /v1/serverless/models.
# Reasoning, modalities and structured output follow the global sibling models/glm-5p3, and so do the
#   mid-conversation flags live-tested there (not re-tested on this route, same host and API).
# Cache: prompt caching is on by default for every Serverless model, prefix-based, no request field
#   (https://docs.fireworks.ai/guides/prompt-caching).
# Thinking-only: effort low|high|max, no toggle (same as the global route).
schema = 2
base_model = "zhipuai/glm-5.3"
name = "GLM 5.3 (US)"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
system_updates = true
cache = { implicit = true }

[limit]
context = 1_048_573
output = 262_144

[api.chat-completions]
base_url = "https://us.api.fireworks.ai/inference/v1"
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
base_url = "https://us.api.fireworks.ai/inference/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
base_url = "https://us.api.fireworks.ai/inference/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 2.1
cache = { read = 0.39 }

[cost.text.output]
price = 6.6

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.25

[experimental.modes.priority]
body = { service_tier = "priority" }
