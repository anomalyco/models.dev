# Version-tracking standard-path router for the current flagship GLM.
# FireConnect documents glm-latest as a Latest (standard path) alias that
# moves to the current model automatically:
# https://docs.fireworks.ai/ecosystem/fireconnect/models
# Current target is GLM 5.3 (accounts/fireworks/models/glm-5p3). FireConnect
# main maps ROUTER_SPEC_ALIASES["glm-latest"] = "glm-5p3" and resolves
# candidates ["glm-5p3", "glm-5p2"] preferring the first present in catalog:
# https://github.com/fw-ai/fireconnect/blob/main/packages/setup-cli/lib/fireworks/model-specs.mjs
# Pricing matches GLM 5.3 Standard on the serverless pricing page (accessed
# 2026-09-15): $1.40 / $0.26 / $4.40 per 1M (input / cached input / output).
# Priority tier: $1.75 / $0.325 / $5.50.
# https://docs.fireworks.ai/serverless/pricing
# Limits, reasoning, and interleaved field match the sibling
# accounts/fireworks/models/glm-5p3 entry (thinking-only; effort low/high/max).
# Structured output: response_format json_schema is supported (https://docs.fireworks.ai/structured-responses/structured-response-formatting)
#   and returned schema-shaped JSON without being asked for JSON in a live test (2026-10-21).
# Cache: prompt caching is on by default for every Serverless model, prefix-based, no request field; route with `user` or
#   `x-session-affinity` (https://docs.fireworks.ai/guides/prompt-caching).
# Mid-conversation, live Chat Completions tests (2026-10-21): ~8k-token prefix, one x-session-affinity key, and a control turn that hit the cache:
#   system_updates = true: after a system message sent after the first turn, 8077 of 8099 prompt tokens still came from the cache, so it stays in place.
#   effort_updates = false: changing reasoning_effort low → high on the last turn left 10/8 cached tokens in 2 trials.
#   tools.updates = false: adding a second tool on the last turn left 93/224 cached tokens in 2 trials (tools render before the messages).
#   Fireworks also serves Anthropic Messages (POST /inference/v1/messages) and Responses (POST /inference/v1/responses); only Chat Completions was tested.
schema = 2
base_model = "zhipuai/glm-5.3"
name = "GLM Latest"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
system_updates = true
effort_updates = false
cache = { implicit = true }

[limit]
context = 1_048_573
output = 262_144

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 1.4
cache = { read = 0.26 }

[cost.text.output]
price = 4.4

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.25

[experimental.modes.priority]
body = { service_tier = "priority" }
