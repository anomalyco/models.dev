# Version-tracking Fast serving-path router for the current Kimi flagship.
# Same quality as kimi-latest / pinned kimi-k3; Fast path aims for 100+ tok/s
# at a higher $/token. Currently resolves to Kimi K3 Fast.
# Docs: https://docs.fireworks.ai/ecosystem/fireconnect/models
# Serving paths: https://docs.fireworks.ai/serverless/serving-paths
# Pricing (Kimi K3 Fast row, accessed 2026-09-15):
# https://docs.fireworks.ai/serverless/pricing — $4.50 / $0.45 / $22.50
# per 1M (input / cached input / output). Pinned peer:
# accounts/fireworks/routers/kimi-k3-fast.
# Toggle: thinking.type = enabled|disabled (or thinking object)
# Effort: reasoning_effort = low|medium|high|max
# Budget: thinking.budget_tokens (N >= 1024); conflicts with reasoning_effort
# https://docs.fireworks.ai/guides/reasoning
# Image types: the lab's image types that Fireworks accepts. Fireworks documents .png, .jpg/.jpeg, .gif, .bmp, .tiff and .ppm
#   (https://docs.fireworks.ai/guides/querying-vision-language-models#known-limitations); webp and avif also decoded in live tests (2026-10-21), heic failed.
# Structured output: response_format json_schema is supported (https://docs.fireworks.ai/structured-responses/structured-response-formatting)
#   and returned schema-shaped JSON without being asked for JSON in a live test (2026-10-21).
# Cache: prompt caching is on by default for every Serverless model, prefix-based, no request field; route with `user` or
#   `x-session-affinity` (https://docs.fireworks.ai/guides/prompt-caching).
# Mid-conversation, live Chat Completions tests (2026-10-21): ~8k-token prefix, one x-session-affinity key, and a control turn that hit the cache:
#   system_updates = true: after a system message sent after the first turn, 7256 of 7322 prompt tokens still came from the cache, so it stays in place.
#   effort_updates = false: changing reasoning_effort low → high on the last turn left 0/0 cached tokens in 2 trials.
#   tools.updates = false: adding a second tool on the last turn left 0/0 cached tokens in 2 trials (tools render before the messages).
#   Fireworks also serves Anthropic Messages (POST /inference/v1/messages) and Responses (POST /inference/v1/responses); only Chat Completions was tested,
#   so system_updates sits on [api.chat-completions] only.
schema = 2
base_model = "moonshotai/kimi-k3"
name = "Kimi Fast Latest"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "image/bmp"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "max"], budget = { min = 1_024 } }
structured_output = true
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }
capabilities = { system_updates = true }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 4.5
cache = { read = 0.45 }

[cost.text.output]
price = 22.5
