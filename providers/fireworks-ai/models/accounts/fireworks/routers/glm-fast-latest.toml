# Version-tracking Fast serving-path alias for the current flagship GLM Fast
# router. Same weights/quality as the pinned Fast path; higher $/token than
# Standard; aims for 100+ tok/s (Fireworks serving paths).
#
# Current target (2026-09-15): GLM 5.3 Fast
# (accounts/fireworks/routers/glm-5p3-fast). FireConnect prefers
# glm-5p3-fast over glm-5p2-fast when the newer Fast router is in the
# serverless catalog:
#   https://github.com/fw-ai/fireconnect/blob/main/packages/setup-cli/lib/fireworks/model-specs.mjs
#   (GLM_FAST_LATEST_BASE_CANDIDATES = ["glm-5p3-fast", "glm-5p2-fast"])
# Docs:
#   https://docs.fireworks.ai/ecosystem/fireconnect/models
#     (glm-fast-latest: Fast text-only agent loops, 1M context)
#   https://docs.fireworks.ai/serverless/serving-paths
#   https://docs.fireworks.ai/serverless/pricing
#     (GLM 5.3 Fast: $2.10 / $0.39 / $6.60 per 1M input / cached / output)
# Peer limits/reasoning match authored glm-5p3-fast (thinking-only effort
# low|high|max; context 1_048_572; output 262_144).
# Structured output: response_format json_schema is supported (https://docs.fireworks.ai/structured-responses/structured-response-formatting)
#   and returned schema-shaped JSON without being asked for JSON in a live test (2026-10-21).
# Cache: prompt caching is on by default for every Serverless model, prefix-based, no request field; route with `user` or
#   `x-session-affinity` (https://docs.fireworks.ai/guides/prompt-caching).
# Mid-conversation, live Chat Completions tests (2026-10-21): ~8k-token prefix, one x-session-affinity key, and a control turn that hit the cache:
#   system_updates = true: after a system message sent after the first turn, 8237 of 8259 prompt tokens still came from the cache, so it stays in place.
#   effort_updates = false: changing reasoning_effort low → high on the last turn left 0/8 cached tokens in 2 trials.
#   tools.updates = false: adding a second tool on the last turn left 93/224 cached tokens in 2 trials (tools render before the messages).
#   Fireworks also serves Anthropic Messages (POST /inference/v1/messages) and Responses (POST /inference/v1/responses); only Chat Completions was tested.
schema = 2
base_model = "zhipuai/glm-5.3"
name = "GLM 5.3 Fast (Latest)"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
system_updates = true
cache = { implicit = true }

[limit]
context = 1_048_572
output = 262_144

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 2.1
cache = { read = 0.39 }

[cost.text.output]
price = 6.6
