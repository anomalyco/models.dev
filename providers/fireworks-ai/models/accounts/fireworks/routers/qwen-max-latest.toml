# Version-tracking standard-path alias for Qwen 3.8 Max, advertised by
# https://api.fireworks.ai/v1/serverless/models on 2026-09-16 as
# accounts/fireworks/routers/qwen-max-latest. The same response supplies
# standard and Priority pricing, text/image input, and the Priority recipe.
# Toggle: thinking.type = enabled|disabled (matches the pinned Qwen 3.8 Max route).
schema = 2
base_model = "alibaba/qwen3.8-max"
name = "Qwen Max Latest (Qwen3.8 Max)"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }

[limit]
context = 262_144

[cost.text.input]
price = 2
cache = { read = 0.25 }

[cost.text.output]
price = 6

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.5

[experimental.modes.priority]
body = { service_tier = "priority" }
