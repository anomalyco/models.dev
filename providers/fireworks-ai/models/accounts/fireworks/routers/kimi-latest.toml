# Version-tracking Standard-path router for the current Kimi flagship
# (currently Kimi K3). Short ID `kimi-latest` expands to
# accounts/fireworks/routers/kimi-latest.
# https://docs.fireworks.ai/ecosystem/fireconnect/models
# Pricing matches Kimi K3 Standard / Priority (USD per 1M tokens):
# Standard $3.00 / $0.30 / $15.00, Priority $3.75 / $0.375 / $18.75
# https://docs.fireworks.ai/serverless/pricing
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|medium|high|max
# Budget: thinking.budget_tokens (min 1024; conflicts with reasoning_effort)
# https://docs.fireworks.ai/guides/reasoning
schema = 2
base_model = "moonshotai/kimi-k3"
name = "Kimi Latest"
release_date = "2026-07-27"
last_updated = "2026-09-15"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "max"], budget = { min = 1_024 } }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 3
cache = { read = 0.3 }

[cost.text.output]
price = 15

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.25

[experimental.modes.priority]
body = { service_tier = "priority" }
