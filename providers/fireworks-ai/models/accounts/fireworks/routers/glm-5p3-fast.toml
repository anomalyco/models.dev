# Fast serving-path router for GLM 5.3 — same model, faster serving (the
# chat-completions response echoes the underlying
# accounts/fireworks/models/glm-5p3):
# https://docs.fireworks.ai/serverless/serving-paths
# Router is live on Fireworks accounts but not yet listed on the public
# pricing page (which currently lists GLM 5.2 Fast only). Pricing confirmed
# from a Fireworks account rate card (2026-09-07): $2.10 / $0.39 / $6.60
# per 1M (input / cached input / output) — a 1.5x premium over GLM 5.3
# standard, matching the GLM 5.2 Fast premium over GLM 5.2.
# Limits and release verified 2026-09-07: GET /v1/models reports
# context_length 1_048_576 and a created timestamp of 2026-08-28 (identical
# to glm-5p3 — router launched with the base model); an over-limit probe
# (1_200_012 prompt tokens) was rejected
# with "model maximum context length: 1048572" — the enforced prompt cap
# sits 4 tokens below the advertised context_length, so that value is
# recorded here. Fireworks performs no pre-flight max_tokens validation
# (2_000_000 accepted); output = 262_144 per the Baseten/Vercel-documented
# generation ceiling for the same weights.
# Thinking-only, effort tiers identical to the sibling glm-5p3 entry:
# low/high/max (max/xhigh select max).
# Structured output: response_format json_schema is supported (https://docs.fireworks.ai/structured-responses/structured-response-formatting)
#   and returned schema-shaped JSON without being asked for JSON in a live test (2026-10-21).
# Cache: prompt caching is on by default for every Serverless model, prefix-based, no request field; route with `user` or
#   `x-session-affinity` (https://docs.fireworks.ai/guides/prompt-caching).
# Mid-conversation, live Chat Completions tests (2026-10-21): ~8k-token prefix, one x-session-affinity key, and a control turn that hit the cache:
#   system_updates = true: after a system message sent after the first turn, 8877 of 8899 prompt tokens still came from the cache, so it stays in place.
#   effort_updates = false: changing reasoning_effort low → high on the last turn left 8/0 cached tokens in 2 trials.
#   tools.updates = false: adding a second tool on the last turn left 8/224 cached tokens in 2 trials (tools render before the messages).
#   Fireworks also serves Anthropic Messages (POST /inference/v1/messages) and Responses (POST /inference/v1/responses); only Chat Completions was tested.
schema = 2
base_model = "zhipuai/glm-5.3"
name = "GLM 5.3 Fast"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
system_updates = true
effort_updates = false
cache = { supported = true, implicit = true }

[limit]
context = 1_048_572
output = 262_144

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 2.1
cache = { read = 0.39 }

[cost.text.output]
price = 6.6
