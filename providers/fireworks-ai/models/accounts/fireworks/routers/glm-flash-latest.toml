# Version-tracking router alias for the current GLM Flash model on Fireworks
# Serverless (currently GLM 5.3 Flash / accounts/fireworks/models/glm-5p3-flash).
# Short ID glm-flash-latest; canonical path accounts/fireworks/routers/glm-flash-latest.
# Sources (accessed 2026-09-15):
# - Alias target: FireConnect ROUTER_SPEC_ALIASES maps glm-flash-latest → glm-5p3-flash
#   https://github.com/fw-ai/fireconnect/blob/main/packages/setup-cli/lib/fireworks/model-specs.mjs
# - FireConnect models doc: glm-flash-latest is vision-capable GLM for image tasks
#   https://docs.fireworks.ai/ecosystem/fireconnect/models
# - Pricing / base model page (GLM 5.3 Flash Standard): $0.15 / $0.03 / $0.50 per 1M
#   (input / cached input / output)
#   https://docs.fireworks.ai/serverless/pricing
#   https://fireworks.ai/models/fireworks/glm-5p3-flash
# Limits, reasoning controls, and modalities match the sibling pinned
# accounts/fireworks/models/glm-5p3-flash entry (thinking-only effort low/high/max;
# Fireworks text+image serverless surface).
# Image types: the lab's image types that Fireworks accepts. Fireworks documents .png, .jpg/.jpeg, .gif, .bmp, .tiff and .ppm
#   (https://docs.fireworks.ai/guides/querying-vision-language-models#known-limitations); webp and avif also decoded in live tests (2026-10-21), heic failed.
# Structured output: response_format json_schema is supported (https://docs.fireworks.ai/structured-responses/structured-response-formatting)
#   and returned schema-shaped JSON without being asked for JSON in a live test (2026-10-21).
# Cache: prompt caching is on by default for every Serverless model, prefix-based, no request field; route with `user` or
#   `x-session-affinity` (https://docs.fireworks.ai/guides/prompt-caching).
# Mid-conversation, live Chat Completions tests (2026-10-21): ~8k-token prefix, one x-session-affinity key, and a control turn that hit the cache:
#   system_updates = true: after a system message sent after the first turn, 8832 of 8899 prompt tokens still came from the cache, so it stays in place.
#   effort_updates = false: changing reasoning_effort low → high on the last turn left 0/0 cached tokens in 2 trials.
#   tools.updates = false: adding a second tool on the last turn left 0/0 cached tokens in 2 trials (tools render before the messages).
#   Fireworks also serves Anthropic Messages (POST /inference/v1/messages) and Responses (POST /inference/v1/responses); only Chat Completions was tested.
schema = 2
base_model = "zhipuai/glm-5.3-flash"
name = "GLM Flash Latest (GLM 5.3 Flash)"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
system_updates = true
effort_updates = false
cache = { implicit = true }

[limit]
context = 1_048_573

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.15
cache = { read = 0.03 }

[cost.text.output]
price = 0.5

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.25

[experimental.modes.priority]
body = { service_tier = "priority" }
