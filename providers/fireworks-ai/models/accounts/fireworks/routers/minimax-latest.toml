# Version-tracking router for the latest MiniMax model on Fireworks Serverless.
# Currently resolves to accounts/fireworks/models/minimax-m3 (MiniMax M3):
# - https://docs.fireworks.ai/ecosystem/fireconnect/models (minimax-latest)
# - FireConnect ROUTER_SPEC_ALIASES: "minimax-latest" -> "minimax-m3"
#   https://github.com/fw-ai/fireconnect/blob/0ff8a6c5/packages/setup-cli/lib/fireworks/model-specs.mjs
# Pricing matches MiniMax M3 standard serverless (input / cached input / output):
# $0.30 / $0.06 / $1.20; Priority $0.45 / $0.09 / $1.80
# - https://docs.fireworks.ai/serverless/pricing
# - https://fireworks.ai/models/fireworks/minimax-m3
# Context/output ceilings and text-only modalities match the pinned minimax-m3
# sibling on this host (Fireworks serverless context 512k).
# Effort: $.reasoning_effort = "low" | "medium" | "high" (same surface as
# accounts/fireworks/models/minimax-m3).
# https://docs.fireworks.ai/guides/reasoning
# Structured output: response_format json_schema is supported (https://docs.fireworks.ai/structured-responses/structured-response-formatting)
#   and returned schema-shaped JSON without being asked for JSON in a live test (2026-10-21).
# Cache: prompt caching is on by default for every Serverless model, prefix-based, no request field; route with `user` or
#   `x-session-affinity` (https://docs.fireworks.ai/guides/prompt-caching).
# Mid-conversation, live Chat Completions tests (2026-10-21): ~8k-token prefix, one x-session-affinity key, and a control turn that hit the cache:
#   system_updates = false: after a system message sent after the first turn, cached tokens fell to 114 in 1 trials while the control turns hit, so it is moved to the top.
#   effort_updates = false: changing reasoning_effort low → high on the last turn left 107/133/107 cached tokens in 3 trials.
#   tools.updates = false: adding a second tool on the last turn left 123/207 cached tokens in 2 trials (tools render before the messages).
#   Fireworks also serves Anthropic Messages (POST /inference/v1/messages) and Responses (POST /inference/v1/responses); only Chat Completions was tested.
schema = 2
base_model = "minimax/MiniMax-M3"
name = "MiniMax Latest"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 512_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.3
cache = { read = 0.06 }

[cost.text.output]
price = 1.2

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.5

[experimental.modes.priority]
body = { service_tier = "priority" }
