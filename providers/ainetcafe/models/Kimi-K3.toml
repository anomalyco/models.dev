# Effort: reasoning_effort = low|high|max (top-level OpenAI Chat field, passed through as-is).
# No toggle: thinking is always on at this gateway; thinking.type = "disabled" is accepted but ignored.
# model = "Kimi-K3" (case-sensitive at this gateway).
# Default context 256K; 1M is enabled per account on request, so the limit here is the default.
# Max output 32K per the host guides (https://ainetcafe.com/k3/guides/kilo-code.html, cline.html, openhands.html).
# Pricing: https://ainetcafe.com/k3/compare.html
schema = 2
base_model = "moonshotai/kimi-k3"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
context = 262_144
output = 32_768

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 2.1
cache = { read = 0.3 }

[cost.text.output]
price = 10.5
