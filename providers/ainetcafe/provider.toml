# ainetcafe serves Kimi K3 from its own cluster (native MXFP4 weights).
# OpenAI Chat: POST https://microquickjs.com/v1/chat/completions
# Anthropic Messages: POST https://microquickjs.com/v1/messages
# Reasoning is always on for Kimi-K3 (reasoning_content is returned); no documented
# toggle or effort field at the gateway. Docs: https://ainetcafe.com/k3/guides/
name = "ainetcafe"
env = ["AINETCAFE_API_KEY"]
npm = "@ai-sdk/openai-compatible"
api = "https://microquickjs.com/v1"
doc = "https://ainetcafe.com/k3/guides/"
