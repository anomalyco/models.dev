# Pricing: https://docs.zerogpu.ai/docs/model-catalog (accessed 2026-10-12)
# Effort: reasoning_effort = low|high|max; thinking cannot be disabled.
# Image and PDF input are accepted; video is not.
# Verified against https://api.zerogpu.ai/v1/chat/completions (2026-10-12);
# strict json_schema response_format verified 2026-11-03.
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[modalities]
input = ["text", "image/jpeg", "image/png", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 1_048_576
output = 32_768

[cost.text.input]
price = 0.1
cache = { read = 0.015 }

[cost.text.output]
price = 0.35
