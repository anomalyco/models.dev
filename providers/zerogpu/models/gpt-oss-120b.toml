# Pricing: https://docs.zerogpu.ai/docs/model-catalog (accessed 2026-10-12)
# Effort: reasoning_effort = low|medium|high on /v1/chat/completions,
# reasoning.effort on /v1/responses.
# Verified against https://api.zerogpu.ai/v1 (2026-10-12);
# strict json_schema response_format verified 2026-11-03.
# No custom tools: a plain-text custom tool comes back as an ordinary function call with JSON
#   arguments, and grammar-constrained custom tools aren't passed to the model, so freeform is
#   left out (live 2026-11-05 on /v1/chat/completions).
# Cache: none. A ~5.2k-token system prefix sent four times, with the same and then a new
#   user message, returned usage.prompt_tokens_details.cached_tokens = 0 every time
#   (live 2026-11-05, three runs).
schema = 2
base_model = "openai/gpt-oss-120b"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
cache = false

[cost.text.input]
price = 0.15

[cost.text.output]
price = 0.6
