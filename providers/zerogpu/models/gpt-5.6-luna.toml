# Pricing: https://api-dashboard.zerogpu.ai/api/models and
#   https://docs.zerogpu.ai/docs/model-catalog (2026-11-05): input $0.20/M, output $1.20/M,
#   cached input $0.20/M. ZeroGPU bills Luna cache hits at the full input price, not
#   OpenAI's discounted rate.
# Cache: implicit prefix caching, no markers needed. Live 2026-11-05 on
#   https://api.zerogpu.ai/v1/chat/completions: a ~5.3k-token system prefix resent with a
#   new user message returned usage.prompt_tokens_details.cached_tokens = 5,309.
# Effort: reasoning_effort = none|low|medium|high|xhigh|max; none disables reasoning.
# Verified against https://api.zerogpu.ai/v1/chat/completions (2026-10-12);
# strict json_schema response_format verified 2026-11-03.
# Context: 272,000 tokens per https://docs.zerogpu.ai/api-reference/models/gpt-5-6-luna
schema = 2
base_model = "openai/gpt-5.6-luna"
base_model_omit = ["limit.input"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 272_000

[cost.text.input]
price = 0.2
cache = { read = 0.2 }

[cost.text.output]
price = 1.2
