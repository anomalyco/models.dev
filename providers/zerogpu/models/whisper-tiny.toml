# Pricing: https://docs.zerogpu.ai/docs/audio (accessed 2026-10-12)
# $0.02 per minute of uploaded audio, rounded up with a one-minute minimum (minimum not expressible in v2).
# Endpoints: POST /v1/audio/transcriptions and /v1/audio/translations
# (response_format json, text, verbose_json, srt).
schema = 2
v2_only = true
base_model = "openai/whisper-tiny"

[api.transcriptions]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/protocols/openai-transcription" }

[cost.audio.input]
unit = "minute"
price = 0.02
