# Pricing: https://docs.zerogpu.ai/docs/model-catalog (accessed 2026-10-12)
# Toggle: chat_template_kwargs.enable_thinking = true|false (thinking is off by default).
# Image and video input are accepted; audio input is rejected.
# Verified against https://api.zerogpu.ai/v1/chat/completions (2026-10-12).
base_model = "alibaba/qwen3.6-35b-a3b"
reasoning_options = [{ type = "toggle" }]

[cost]
input = 0.20
output = 1.50
cache_read = 0.20

[limit]
output = 16_384

[modalities]
input = ["text", "image", "video"]
