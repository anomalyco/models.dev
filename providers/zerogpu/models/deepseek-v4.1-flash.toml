# Pricing: https://docs.zerogpu.ai/docs/model-catalog (accessed 2026-10-12)
# Toggle: thinking.type = enabled|disabled (thinking is off by default).
# Effort: reasoning_effort = low|high|max (applies when thinking is enabled).
# Text-only on this host.
# Verified against https://api.zerogpu.ai/v1/chat/completions (2026-10-12);
# strict json_schema response_format verified 2026-11-03.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 1_048_576
output = 65_536

[cost.text.input]
price = 0.3
cache = { read = 0.003 }

[cost.text.output]
price = 1.2
