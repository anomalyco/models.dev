# Pricing: https://docs.zerogpu.ai/docs/model-catalog (accessed 2026-10-12)
# Effort: reasoning_effort = none|low|medium|high|xhigh (max is ignored).
# PDF input via a "file" content part.
# Verified against https://api.zerogpu.ai/v1/chat/completions (2026-10-12);
# strict json_schema response_format verified 2026-11-03.
# tools.freeform: /v1/chat/completions takes custom tools in all three formats. A plain-text
#   tool returned the requested text, and regex ZZ[0-9]{3} and the equivalent lark grammar both
#   returned ZZ plus three digits when asked for "hello world" (live 2026-11-05).
# Cache: implicit prefix caching, no markers needed. Live 2026-11-05 on
#   https://api.zerogpu.ai/v1/chat/completions: a ~5k-token system prefix resent with a
#   new user message returned usage.prompt_tokens_details.cached_tokens = 4,864.
schema = 2
base_model = "openai/gpt-5.4-nano"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, freeform = ["text", "lark", "regex"] }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.2
cache = { read = 0.02 }

[cost.text.output]
price = 1.25
