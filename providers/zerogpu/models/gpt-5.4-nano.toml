# Pricing: https://docs.zerogpu.ai/docs/model-catalog (accessed 2026-10-12)
# Effort: reasoning_effort = none|low|medium|high|xhigh (max is ignored).
# PDF input via a "file" content part.
# Verified against https://api.zerogpu.ai/v1/chat/completions (2026-10-12).
base_model = "openai/gpt-5.4-nano"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh"] }]

[cost]
input = 0.20
output = 1.25
cache_read = 0.02

[modalities]
input = ["text", "image", "pdf"]
