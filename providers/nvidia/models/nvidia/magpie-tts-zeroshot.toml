# Type speech: text in, audio out "in wav format" (https://build.nvidia.com/nvidia/magpie-tts-zeroshot); the zero-shot
# voice prompt is reference audio, whose format the card doesn't list.
# Description from the catalog entry (https://build.nvidia.com/models.md, accessed 2026-10-21).
schema = 2
type = "speech"
name = "magpie-tts-zeroshot"
description = "Expressive text-to-speech that clones a voice from a short audio sample"
open_weights = true
release_date = "2025-05-22"
last_updated = "2025-06-12"

[modalities]
input = ["text", "audio"]
output = ["audio/wav"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false

[limit]
context = 0
output = 4_096

[cost.text.input]
price = 0

[cost.text.output]
price = 0
