# Toggle: chat_template_kwargs.enable_thinking = true|false
# Mid-conversation (live 2026-10-21, ~8k-token prefix, control turn then changed turn): a late system message was
# followed and kept the cache in 2 of 2 trials; adding a tool dropped the cache to 0.
schema = 2
base_model = "nvidia/nemotron-3.5-super-vl-120b-a12b"

[capabilities]
reasoning = { supported = true, toggle = true }
system_updates = true
tools = { supported = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0

[cost.text.output]
price = 0
