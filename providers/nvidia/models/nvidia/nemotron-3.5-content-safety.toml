# NIM wire syntax (verified against integrate.api.nvidia.com/v1, 2026-10-01):
#   Toggle: chat_template_kwargs = { "enable_thinking": true | false }  (default: false)
# Pricing: free endpoint on NVIDIA's API trial tier; no list rate is published.
# https://build.nvidia.com/nvidia/nemotron-3.5-content-safety
schema = 2
base_model = "nvidia/nemotron-3.5-content-safety"

[capabilities]
reasoning = { supported = true, toggle = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0

[cost.text.output]
price = 0
