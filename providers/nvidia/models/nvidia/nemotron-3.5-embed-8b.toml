# Catalog: https://build.nvidia.com/models.md lists nemotron-3.5-embed-8b as a Preview API (accessed 2026-11-08).
# Live 2026-11-08: POST https://integrate.api.nvidia.com/v1/embeddings returns 4096-dimensional vectors for text and
#   for PNG and JPEG data URLs (input_type "passage"; one JPEG retry hit a transient 500).
# Card: https://build.nvidia.com/nvidia/nemotron-3_5-embed-8b/modelcard
# Price: 0, NVIDIA's hosted API is a free trial with no per-token rate (see provider.toml).
schema = 2
v2_only = true
base_model = "nvidia/nemotron-3.5-embed-8b"

[api.embeddings]
sdk = { opencodeai = "none" }

[cost.text.input]
price = 0

[cost.text.output]
price = 0
