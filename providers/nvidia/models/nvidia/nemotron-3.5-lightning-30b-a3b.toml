# Sources (accessed 2026-08-11):
# - https://build.nvidia.com/nvidia/nemotron-3.5-lightning-30b-a3b
# - https://integrate.api.nvidia.com/v1/models
# Toggle: chat_template_kwargs.enable_thinking = true|false
# https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
# Mid-conversation (live 2026-10-21, ~8k-token prefix, control turn then changed turn): a late system message was
# followed and kept the cache in 2 of 2 trials; adding a tool dropped the cache to 0.
schema = 2
base_model = "nvidia/nemotron-3.5-lightning"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
system_updates = true
tools = { supported = true, updates = false }

[cost.text.input]
price = 0

[cost.text.output]
price = 0
