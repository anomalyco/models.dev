# NIM Chat schema: `reasoning_budget` is -1..32768 (default 16384); -1 means
# unlimited/no budget enforcement, not reasoning off. `/think` and `/no_think`
# go in a system message; video and audio requests should use `/no_think`.
# https://docs.api.nvidia.com/nim/reference/nvidia-nemotron-3-nano-omni-30b-a3b-reasoning-infer
# Mid-conversation (live 2026-10-21, ~8k-token prefix, control turn then changed turn): a late system message was
# followed and kept the cache in 2 of 2 trials (system_updates = true). Tool changes couldn't be measured (503
# ResourceExhausted).
schema = 2
base_model = "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"
name = "Nemotron 3 Nano Omni"

[capabilities]
reasoning = { supported = true, toggle = true, budget = { min = -1, max = 32_768 } }
structured_output = true
system_updates = true

[cost.text.input]
price = 0

[cost.text.output]
price = 0
