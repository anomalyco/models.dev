# NIM wire schema (accessed 2026-10-16): the published OpenAPI omits reasoning
# controls, but the endpoint validates a top-level `reasoning_effort` — an invalid
# value is rejected with "expected one of `none`, `minimal`, `low`, `medium`,
# `high`, `xhigh`, `max`" (probed 2026-10-16 against integrate.api.nvidia.com).
# `none` suppresses the reasoning_content side channel and `max` yields the longest
# reasoning (verified live). The schema marks chat_template_kwargs.enable_thinking
# const true and states setting false "does not stop reasoning generation" (probe:
# completion_tokens unchanged, reasoning_content hidden), so it is not a real
# toggle. Responses separate reasoning_content from the final content.
# https://docs.api.nvidia.com/nim/reference/stepfun-ai-step-5-preview-infer
#
# Limits: max_tokens accepts 1,048,576 and rejects 1,048,577 ("Max tokens must not
# exceed 1048576", probed 2026-10-16); prompt + output must fit the 1,048,576-token
# context window. No separate lower output cap is published for this NIM route
# (the 64k output cap on StepFun's first-party card applies to their own API).
#
# Pricing: hosted on NVIDIA's API trial tier and currently free — no separate list
# rate is published for this ID. Source: this model's catalog card,
# https://build.nvidia.com/stepfun-ai/step-5-preview (governed by the
# NVIDIA API Trial Terms of Service).
base_model = "stepfun/step-5-preview"

reasoning_options = [{ type = "effort", values = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }]
structured_output = false
temperature = true

[interleaved]
field = "reasoning_content"

[cost]
input = 0.0
output = 0.0

[limit]
context = 1_048_576
input = 1_048_576
output = 1_048_576

[modalities]
input = ["text", "image"]
