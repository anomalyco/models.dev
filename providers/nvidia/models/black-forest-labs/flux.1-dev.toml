# Live 2026-10-21: POST https://ai.api.nvidia.com/v1/genai/black-forest-labs/flux.1-dev validates the request (422
# on an
# unsupported height). The genai endpoint takes prompt, steps, cfg_scale and seed, no temperature; context and
# output come from the lab (0: prompts aren't chat tokens).
# Output: the genai endpoint has no output_format and returns one base64 artifact; live 2026-10-21 the bytes were JPEG
# (FF D8 FF E0 JFIF), so output overrides the lab's jpeg/png/webp.
# Knowledge 2024-08: kept from NVIDIA's earlier entry; unsourced (the lab publishes no cutoff).
schema = 2
base_model = "black-forest-labs/flux-1-dev"
name = "FLUX.1-dev"
knowledge = "2024-08"

[modalities]
input = ["text"]
output = ["image/jpeg"]

[cost.text.input]
price = 0

[cost.text.output]
price = 0
