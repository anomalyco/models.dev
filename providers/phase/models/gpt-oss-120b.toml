# Source: https://router.phase.xyz/v1/models (2026-11-12). Plus $0.001 fixed fee per call.
# Reasoning control: the router forwards the OpenAI `reasoning_effort` request field to the upstream unchanged
# (low | medium | high); other reasoning fields (`thinking`, `reasoning`) are not forwarded.
schema = 2
base_model = "openai/gpt-oss-120b"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[limit]
output = 4_096

[cost.text.input]
price = 0.0385

[cost.text.output]
price = 0.1768
