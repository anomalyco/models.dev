# Prices and limits: https://inferenceapis.com/pricing and https://inferenceapis.com/models (accessed 2026-09-17)
# Thinking cannot be disabled on this model; reasoning_effort = "low" is the minimum.
base_model = "zhipuai/glm-5.3-flash"
reasoning_options = [{ type = "effort", values = ["low", "high"] }]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.2
output = 0.66
cache_read = 0.04
