# Perplexity Agent API (accessed 2026-10-21): https://docs.perplexity.ai/docs/agent-api/models.md (prices, service tiers),
#   https://docs.perplexity.ai/api-reference/agent-post.md (POST /v1/agent; /v1/responses alias for OpenAI SDKs;
#   reasoning.effort = minimal|low|medium|high|xhigh|max), https://docs.perplexity.ai/docs/getting-started/integrations/vercel-ai-sdk.md
#   (@ai-sdk/open-responses). Images: PNG, JPEG, WEBP, GIF (https://docs.perplexity.ai/docs/agent-api/image-attachments.md);
#   documents via input_file (PDF and others, model-dependent). Effort: the model's own levels within the Agent API enum.
#   Tool fees (web_search $0.0025 per call, etc.) have no v2 field.
# "Nemotron 3.5 Super ... 1,048,576-token context window and up to 131,072 output tokens. It accepts text input only."
schema = 2
v2_only = true
base_model = "nvidia/nemotron-3.5-super-vl-120b-a12b"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true }
structured_output = true

[limit]
output = 131_072

[api.responses]
base_url = "https://api.perplexity.ai/v1"
sdk = { aisdk = "@ai-sdk/open-responses" }

[cost.text.input]
price = 0.2
cache = { read = 0.04 }

[cost.text.output]
price = 0.5
