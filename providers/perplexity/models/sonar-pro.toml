# Lifecycle: "Sonar Chat Completions support ended on September 27, 2026. Synchronous and streaming requests keep
#   working: they are being reformulated as Agent API requests, rolling out gradually by model."
#   (https://docs.perplexity.ai/docs/agent-api/migrate-from-sonar/overview.md, accessed 2026-10-21), so the model is
#   deprecated. The Sonar model pages and the Sonar API reference now redirect to that page.
# Token prices: the Sonar table on the pricing page, last archived with it on 2026-09-13
#   (https://web.archive.org/web/20260913155539/https://docs.perplexity.ai/docs/getting-started/pricing); the current
#   pricing page no longer lists Sonar. A live POST /v1/sonar on 2026-10-21 still answered; usage.cost billed tokens at
#   rates that differ from that table plus a request_cost of $0.0025 (the Agent API web_search fee), so the listed
#   prices may be stale for reformulated requests.
# Not representable in v2 (no per-request unit): request fee per 1,000 requests by search context size, $6 low /
#   $10 medium / $14 high; with Pro Search (web_search_options.search_type = "pro") $14 / $18 / $22 (archived pricing page).
schema = 2
base_model = "perplexity/sonar-pro"
status = "deprecated"

[cost.text.input]
price = 3

[cost.text.output]
price = 15
