# The OpenAI model (base_model) on a ChatGPT plan through Sign in with ChatGPT. Only what differs or is route-specific
#   is set here.
# Availability: in the list OpenCode offers for Sign in with ChatGPT
#   (https://github.com/anomalyco/opencode/blob/dev/packages/core/src/plugin/provider/chatgpt.ts). Each account's own list
#   comes from GET https://api.openai.com/v1/models with its token
#   (https://developers.openai.com/siwc/token-sharing-open-source/models-and-inference).
# Reasoning: same Responses API as `openai`, so the same effort values.
# Tools: function and custom tools are supported; hosted tools (image generation, file search, Code Interpreter,
#   computer use, MCP, tool_search) are not
#   (https://developers.openai.com/siwc/token-sharing-open-source/preview-limitations). Custom tool grammars,
#   structured output and mid-conversation updates aren't confirmed live on this route yet, so they're left out.
# Fast: the UI guidelines show a Fast mode toggle that "uses your plan or credits faster"
#   (https://developers.openai.com/siwc/ui-ux-guidelines); it is the `priority` service tier, as on `openai` and
#   Codex. Service tiers an account can't use fail with subscription_sharing_unsupported_capability.
# Cost: 0, as the other subscription providers publish it: usage counts against the ChatGPT plan, with no per-token
#   price.
# Cache: no lifetime is documented for this route and prompt_cache_retention is rejected, so only `implicit = true` is
#   set.
schema = 2
v2_only = true
base_model = "openai/gpt-6.1-sol"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
service_tier = ["priority"]

[capabilities.cache]
implicit = true

[api.responses]

[cost.text.input]
price = 0
cache = { read = 0 }

[cost.text.output]
price = 0

[experimental.modes.fast]
service_tier = "priority"
body = { service_tier = "priority" }
