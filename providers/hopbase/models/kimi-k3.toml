# Verified live 2026-10-31 against POST https://api.hop-base.com/v1/chat/completions with this exact
# model ID: non-streaming, streaming (stream_options.include_usage returns usage), and a
# tool call (tool_choice auto) that returned a well-formed function call.
# Limits: 1,048,576-token context, max_tokens capped at 32,768 (https://hop-base.com/llms.txt).
# Images: base64 data URLs only (image URLs return HTTP 400, per the same source); a red PNG data
# URL returned "Red". Video input is not offered, so input is limited to text and images here.
# Reasoning: always on (reasoning tokens reported on every request, including with no reasoning
# parameters). HopBase does not apply reasoning_effort on this model: low, high, max, none and an
# invalid value ("banana") all return HTTP 200 (a native endpoint would reject the invalid value), and
# reasoning tokens do not move with the level (two runs each on the same prompt, 2026-10-31:
# low 380/625, high 449/459, max 210/423, omitted 495/506; none still reasons). Thinking cannot be
# turned off and effort is not honoured, so no controls are declared.
# The trace is returned in message.reasoning_content only when the request sets
# include_reasoning = true; without it, only usage.completion_tokens_details.reasoning_tokens.
# Structured output: json_schema with strict = true returned an enum-valid object.
# Cache: repeating a ~2.5K-token prefix returned cached_tokens = 2500.
# tool_choice none|required|named all honoured.
# Also checked through @ai-sdk/openai-compatible 1.0.60 (generateText, streamText, tool round trip).
# Pricing: HopBase self-serve price, USD (https://hop-base.com/pricing, also in https://hop-base.com/llms.txt).
schema = 2
base_model = "moonshotai/kimi-k3"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true }
structured_output = true
stream_usage = true
cache = { implicit = true }

[limit]
output = 32_768

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.95
cache = { read = 0.195 }

[cost.text.output]
price = 9.75
