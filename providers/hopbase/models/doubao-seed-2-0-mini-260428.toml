# Verified live 2026-10-31 against POST https://api.hop-base.com/v1/chat/completions with this exact
# model ID: non-streaming, streaming (stream_options.include_usage returns usage), and a
# tool call (tool_choice auto) that returned a well-formed function call.
# Limits: 256K context, up to 128K output (https://hop-base.com/llms.txt); max_tokens=131072 -> 200,
# 131073 -> HTTP 400 "expected a value <= 131072".
# tool_choice none|required|named all honoured.
# Effort: reasoning_effort = none|minimal|low|medium|high|xhigh|max, all accepted live; none and
# minimal return 0 reasoning tokens, so no separate toggle is declared (thinking.type = disabled is
# also accepted). An unknown value returns HTTP 400. Relative effort was not benchmarked.
# Reasoning text is returned in message.reasoning_content and delta.reasoning_content.
# Images: a red PNG data URL returned "Red"; HopBase documents image input (public URL or base64)
# but not video, so input is limited to text and common image types here.
# Structured output: json_schema with strict = true returned an enum-valid object.
# Pricing: HopBase list price, USD; base rates equal the official Volcano Engine CNY list price
# converted at 6.8 CNY/USD (2026-10-31). Tiers follow HopBase billing, not Volcano's table: a single
# long-context tier when input is greater than 32,768 tokens (long_context.threshold = 32768 in
# https://api.hop-base.com/api/v1/models/pricing); no further tier on this host.
schema = 2
base_model = "bytedance-seed/seed-2.0-mini"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
stream_usage = true

[limit]
output = 131_072

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.0295
cache = { read = 0.0059 }

[[cost.text.input.overrides]]
when = { context = { gt = 32_768 } }
price = 0.0589
cache = { read = 0.0118 }

[cost.text.output]
price = 0.2942

[[cost.text.output.overrides]]
when = { context = { gt = 32_768 } }
price = 0.5883
