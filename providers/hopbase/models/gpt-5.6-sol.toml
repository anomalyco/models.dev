# Verified live 2026-10-31 against POST https://api.hop-base.com/v1/chat/completions with this exact
# model ID: non-streaming, streaming (stream_options.include_usage returns usage), and a
# tool call (tool_choice auto) that returned a well-formed function call.
# Effort: reasoning_effort = none|low|medium|high|xhigh accepted; max returns HTTP 400 "does not
# support 'max' with this model. Supported values are: 'none', 'low', 'medium', 'high', and 'xhigh'".
# No plaintext reasoning is returned on Chat Completions, so no reasoning_field.
# Limits: max_tokens=128000 -> 200, 128001 -> HTTP 400 (matches the lab file).
# Images: a red PNG data URL returned "Red". Structured output: json_schema with strict = true
# returned an enum-valid object. Cache: repeating a ~2.4K-token prefix returned cached_tokens = 2417.
# tool_choice none|required|named all honoured.
# Freeform: with tool_choice=required and the prompt asking for the input 'hello world', a custom
# tool with regex grammar ZZ[0-9]{3} returned "ZZ000" and a lark grammar
# start: "ZZ" DIGIT DIGIT DIGIT returned "ZZ000" (twice each, so the grammar is enforced); a
# custom tool with format type text returned free text.
# Also checked through @ai-sdk/openai-compatible 1.0.60 (generateText, streamText, tool round trip).
# Pricing: HopBase self-serve price, USD (https://hop-base.com/pricing, also in https://hop-base.com/llms.txt).
schema = 2
base_model = "openai/gpt-5.6-sol"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"], freeform = ["text", "lark", "regex"] }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true
stream_usage = true
cache = { implicit = true }

[cost.text.input]
price = 2.6
cache = { read = 0.26 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 5.2
cache = { read = 0.52 }

[cost.text.output]
price = 13

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 19.5
