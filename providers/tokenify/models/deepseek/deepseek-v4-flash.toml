# Pricing: GET https://api.tokenify.dev/v1/models and https://www.tokenify.dev/pricing/
# (accessed 2026-10-02), USD per 1M tokens. Reasoning tokens are billed at the
# output rate.
# Toggle: thinking.type = enabled|disabled; also reasoning.enabled = true|false and
# reasoning_effort = none (off). Measured on this host 2026-10-02, /v1/chat/completions:
#   off (reasoning.enabled=false / thinking disabled / reasoning_effort=none): 18/18 runs at 0 reasoning tokens over three sessions
# Effort: reasoning_effort is forwarded to the model as sent. Host docs, verbatim
# (https://www.tokenify.dev/llms-full.txt, "Coming from DeepSeek"): ""none" and "minimal" disable
# thinking, "low"/"medium"/"high"/"max" leave it on and are passed to the model as the depth."
# Values listed match the first-party DeepSeek entry (providers/deepseek): low, high, max.
#   effort, short prompt (median of 4, measured after the host began forwarding it): low 183.5 medium 124 high 124 max 170
#   effort, 5-person seating puzzle (2026-10-02, after forwarding; median and range of 3 runs): low 2501 (1839-3016), max 2539 (2393-6763) — small effect on this model
# Reasoning is returned in message.reasoning_content when on, absent when off.
base_model = "deepseek/deepseek-v4-flash-0731"

reasoning_options = [{ type = "toggle" }, { type = "effort", values = ["low", "high", "max"] }]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.22
output = 0.66
reasoning = 0.66
cache_read = 0.014
