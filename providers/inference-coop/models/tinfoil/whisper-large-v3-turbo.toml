# Sources (accessed 2026-11-02):
# - https://git.inference.coop/co-op/docs/src/branch/main/models.md
# - the gateway's authoritative LiteLLM config:
#   https://git.inference.coop/code/litellm/src/branch/main/config.yaml
# Speech-to-text on the Tinfoil tier (TEE enclaves). Tinfoil bills per REQUEST, not per
# token: $0.01 per request per the config (the model list's older "$0.05/1M input tokens"
# line is superseded by the config, which the docs name as the authoritative source).
# v2 cost has no per-request unit, so no cost is published here.
# API: POST https://gateway.inference.coop/v1/audio/transcriptions (multipart, OpenAI
# Whisper format; language/prompt/temperature accepted, response carries
# text/language/duration/segments).
schema = 2
base_model = "openai/whisper-large-v3-turbo"

[api.transcriptions]
sdk = { opencodeai = "@opencode/ai/protocols/openai-transcription" }
