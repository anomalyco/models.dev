# Source: https://git.inference.coop/co-op/docs/src/branch/main/models.md (accessed 2026-11-01):
# served on the Tinfoil tier (TEE enclaves), $0.65/$1.45 per 1M tokens with $0.13 cached input, 1M context.
# Reasoning surface, cache, and context copied from the underlying host entry
# (providers/tinfoil/models/deepseek-v4-1-flash.toml); reasoning_effort accepted by the
# gateway (probe, 2026-11-01). Implicit caching verified live through the gateway
# (2026-11-02): a repeated 1,599-token prompt returned cached_tokens = 1536.
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }
cache = { implicit = true }
structured_output = true

[limit]
context = 1_048_576

[cost.text.input]
price = 0.65
cache = { read = 0.13 }

[cost.text.output]
price = 1.45
