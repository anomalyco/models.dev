# Source: https://git.inference.coop/co-op/docs/src/branch/main/models.md (accessed 2026-11-01):
# served on the Regolo tier (EU hosting, zero data retention), $0.70/$3.94 per 1M tokens, 262K
# context, image input verified working through the gateway.
# Modality set and output limit copied from the underlying host entry
# (providers/regolo-ai/models/qwen3.5-122b.toml). The co-op gateway disables thinking for
# this model at the host level (chat_template_kwargs: {enable_thinking: false} in the
# gateway's LiteLLM config, https://git.inference.coop/code/litellm/src/branch/main/config.yaml),
# so it is non-reasoning here despite the lab metadata; verified live 2026-11-02
# (responses carry no reasoning_content and answer directly).
schema = 2
base_model = "alibaba/qwen3.5-122b-a10b"
name = "Qwen3.5-122B"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
reasoning = { supported = false }

[limit]
output = 16_384

[cost.text.input]
price = 0.7

[cost.text.output]
price = 3.94
