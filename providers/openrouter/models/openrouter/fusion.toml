# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates unset: a router, so placement depends on the model it picks
# effort_updates = false: no per-turn effort control
schema = 2
name = "Fusion"
description = "General-purpose chat model for instruction following, writing, and analysis"
open_weights = false
release_date = "2026-06-13"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = false
temperature = false
effort_updates = false

[limit]
context = 1_000_000
output = 128_000
