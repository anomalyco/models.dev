# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates unset: a router, so placement depends on the model it picks
# effort_updates = false: no per-turn effort control
schema = 2
name = "Body Builder (beta)"
description = "Preview model for early access evaluation, prototyping, and compatibility testing"
open_weights = false
release_date = "2025-12-05"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = false
temperature = false
effort_updates = false

[limit]
context = 128_000
output = 128_000
