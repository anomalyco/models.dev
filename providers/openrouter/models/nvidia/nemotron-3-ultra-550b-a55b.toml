# Toggle: reasoning.enabled = true|false
# https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = false: hoisted on DeepInfra, Venice (live)
# effort_updates = false: configuration_update is rejected with a 400 for this model (https://openrouter.ai/docs/guides/best-practices/reasoning-tokens#mid-conversation-effort)
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
base_model = "nvidia/nemotron-3-ultra-550b-a55b"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "medium", "high"], budget = {} }
structured_output = true
system_updates = false
effort_updates = false

[limit]
context = 262_144
output = 182_520

[cost.text.input]
price = 0.6
cache = { read = 0.12 }

[cost.text.output]
price = 2.4
