# Toggle: reasoning.enabled = true|false
# https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
base_model = "nvidia/nemotron-3-super-120b-a12b"
structured_output = false

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "medium"]

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 0.085
output = 0.4

[limit]
output = 16_384
