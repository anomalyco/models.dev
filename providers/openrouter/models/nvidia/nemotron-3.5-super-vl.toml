# Toggle: reasoning.enabled = true|false
# https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
schema = 2
name = "Nemotron 3.5 Super VL"
description = "Nemotron multimodal model for visual reasoning and agentic AI workflows"
family = "nemotron"
open_weights = true
release_date = "2026-10-15"

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true }
structured_output = true
temperature = true

[limit]
context = 1_048_576
output = 235_929

[cost.text.input]
price = 0.15
cache = { read = 0.02 }

[cost.text.output]
price = 0.5
