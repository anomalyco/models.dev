# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = false: served only on Amazon Bedrock Converse, which takes no mid-conversation system message for this model
# effort_updates = false: no per-turn effort control
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
base_model = "amazon/nova-lite-v1"
description = "Efficient model for low-latency assistance, extraction, and routine automation"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = false }
structured_output = false
system_updates = false
effort_updates = false

[cost.text.input]
price = 0.06

[cost.text.output]
price = 0.24
