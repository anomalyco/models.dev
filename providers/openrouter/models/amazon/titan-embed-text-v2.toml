# Synced from https://openrouter.ai/api/v1/models?output_modalities=embeddings (prices per token)
# https://openrouter.ai/docs/api/api-reference/embeddings/submit-an-embedding-request
schema = 2
v2_only = true
type = "embedding"
name = "Titan Text Embeddings V2"
description = "Text embedding model"
open_weights = false
release_date = "2026-10-26"

[modalities]
input = ["text"]
output = ["embedding"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }

[limit]
context = 8_192
output = 0

[api.embeddings]
base_url = "https://openrouter.ai/api/v1"
sdk = { aisdk = "@openrouter/ai-sdk-provider", opencodeai = "none" }

[cost.text.input]
price = 0.02
