# Toggle: reasoning.enabled = true|false
# https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
schema = 2
base_model = "zhipuai/glm-5-turbo"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = false

[limit]
context = 202_752

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.2
cache = { read = 0.24 }

[cost.text.output]
price = 4
