# Modalities (OpenRouter's documented formats, narrowed to the lab's list where it has one): image: https://openrouter.ai/docs/guides/overview/multimodal/image-understanding; video: https://openrouter.ai/docs/guides/overview/multimodal/videos
# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = true: forwarded in place (live: cache prefix kept on Friendli, InferenceNet)
# effort_updates = false: configuration_update is rejected with a 400 for this model (https://openrouter.ai/docs/guides/best-practices/reasoning-tokens#mid-conversation-effort)
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
base_model = "zhipuai/glm-5.3-flash"
description = "GLM vision model for visual reasoning, documents, and multimodal agents"

[modalities]
input = ["text", "image/jpeg", "image/png", "video/mp4"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
system_updates = true
effort_updates = false

[limit]
context = 1_048_576
output = 943_718

[cost.text.input]
price = 0.047076
cache = { read = 0.006 }

[cost.text.output]
price = 0.16
