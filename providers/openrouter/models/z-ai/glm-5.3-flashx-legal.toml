schema = 2
name = "GLM 5.3 FlashX Legal"
description = "GLM vision model for visual reasoning, documents, and multimodal agents"
family = "glm"
open_weights = false
release_date = "2026-11-02"

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
temperature = true

[limit]
context = 1_048_576
output = 131_072

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.37
cache = { read = 0.075 }

[cost.text.output]
price = 1.25
