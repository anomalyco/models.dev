# Toggle: reasoning.enabled = true|false
# https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
schema = 2
base_model = "zhipuai/glm-5.1"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
context = 204_800
output = 128_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.966
cache = { read = 0.1794 }

[cost.text.output]
price = 3.036
