# Toggle: reasoning.enabled = true|false
# https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = true: forwarded in place (live: cache prefix kept on Wafer, CoreWeave)
# effort_updates = false: configuration_update is rejected with a 400 for this model (https://openrouter.ai/docs/guides/best-practices/reasoning-tokens#mid-conversation-effort)
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
base_model = "zhipuai/glm-5.2"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "high", "xhigh"] }
structured_output = true
system_updates = true
effort_updates = false

[limit]
context = 1_048_576
output = 943_718

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.0341
cache = { read = 0.033 }

[cost.text.output]
price = 7
