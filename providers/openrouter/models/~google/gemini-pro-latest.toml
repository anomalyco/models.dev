# OpenRouter alias currently redirects to Gemini 3.1 Pro Preview.
# https://openrouter.ai/~google/gemini-pro-latest
schema = 2
name = "Gemini Pro Latest"
description = "Advanced Gemini model for complex reasoning, coding, and multimodal analysis"
family = "gemini-pro"
open_weights = false
knowledge = "2025-01"
release_date = "2026-04-27"

[modalities]
input = ["audio", "application/pdf", "image", "text", "video"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
temperature = true

[limit]
context = 1_048_576
output = 943_718

[cost.text.input]
price = 2
cache = { read = 0.1, write = 0.1875 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 4
cache = { read = 0.4 }

[cost.text.output]
price = 10
reasoning = 10

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 18
