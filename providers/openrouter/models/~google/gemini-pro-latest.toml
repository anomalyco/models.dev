# OpenRouter alias currently redirects to Gemini 3.1 Pro Preview.
# https://openrouter.ai/~google/gemini-pro-latest
# Modalities (OpenRouter's documented formats, narrowed to the lab's list where it has one): audio: https://openrouter.ai/docs/guides/overview/multimodal/audio; image: https://openrouter.ai/docs/guides/overview/multimodal/image-understanding; video: https://openrouter.ai/docs/guides/overview/multimodal/videos
# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = false: Gemini has one systemInstruction, so it is hoisted (live: cache prefix lost; https://openrouter.ai/docs/guides/best-practices/prompt-caching#google-gemini)
# effort_updates = false: configuration_update is rejected with a 400 for this model (https://openrouter.ai/docs/guides/best-practices/reasoning-tokens#mid-conversation-effort)
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
# Cache: implicit on Gemini 2.5+; cache_control uses only the last breakpoint, 5m TTL (https://openrouter.ai/docs/guides/best-practices/prompt-caching#google-gemini)
schema = 2
name = "Gemini Pro Latest"
description = "Advanced Gemini model for complex reasoning, coding, and multimodal analysis"
family = "gemini-pro"
open_weights = false
knowledge = "2025-01"
release_date = "2026-04-27"

[modalities]
input = ["audio/wav", "audio/mpeg", "audio/aiff", "audio/aac", "audio/ogg", "audio/flac", "audio/mp4", "application/pdf", "image/png", "image/jpeg", "image/webp", "image/gif", "text", "video/mp4", "video/mpeg", "video/mov", "video/webm"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
temperature = true
system_updates = false
effort_updates = false
cache = { supported = true, implicit = true, explicit = { ttl = ["5m"], max_breakpoints = 1 } }

[limit]
context = 1_048_576
output = 943_718

[cost.text.input]
price = 2
cache = { read = 0.1, write = 0.1875 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 4
cache = { read = 0.4 }

[cost.text.output]
price = 10
reasoning = 10

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 18
