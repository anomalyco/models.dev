# OpenRouter alias currently redirects to Gemini 3.5 Flash.
# https://openrouter.ai/~google/gemini-flash-latest
schema = 2
name = "Gemini Flash Latest"
description = "Fast Gemini model balancing multimodal reasoning, tool use, and cost"
family = "gemini-flash"
open_weights = false
knowledge = "2025-01-01"
release_date = "2026-04-27"

[modalities]
input = ["text", "image", "video", "application/pdf", "audio"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
temperature = true

[limit]
context = 1_048_576
output = 65_536

[cost.text.input]
price = 0.75
cache = { read = 0.075, write = 0.041667 }

[cost.text.output]
price = 3.75
reasoning = 3.75
