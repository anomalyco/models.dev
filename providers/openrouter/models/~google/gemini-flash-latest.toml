# OpenRouter alias currently redirects to Gemini 3.5 Flash.
# https://openrouter.ai/~google/gemini-flash-latest
# Modalities (OpenRouter's documented formats, narrowed to the lab's list where it has one): image: https://openrouter.ai/docs/guides/overview/multimodal/image-understanding; video: https://openrouter.ai/docs/guides/overview/multimodal/videos; audio: https://openrouter.ai/docs/guides/overview/multimodal/audio
# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = false: Gemini has one systemInstruction, so it is hoisted (live: cache prefix lost; https://openrouter.ai/docs/guides/best-practices/prompt-caching#google-gemini)
# effort_updates = false: configuration_update is rejected with a 400 for this model (https://openrouter.ai/docs/guides/best-practices/reasoning-tokens#mid-conversation-effort)
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
# Cache: implicit on Gemini 2.5+; cache_control uses only the last breakpoint, 5m TTL (https://openrouter.ai/docs/guides/best-practices/prompt-caching#google-gemini)
schema = 2
name = "Gemini Flash Latest"
description = "Fast Gemini model balancing multimodal reasoning, tool use, and cost"
family = "gemini-flash"
open_weights = false
knowledge = "2025-01-01"
release_date = "2026-04-27"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif", "video/mp4", "video/mpeg", "video/mov", "video/webm", "application/pdf", "audio/wav", "audio/mpeg", "audio/aiff", "audio/aac", "audio/ogg", "audio/flac", "audio/mp4"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
temperature = true
system_updates = false
effort_updates = false
cache = { supported = true, implicit = true, explicit = { ttl = ["5m"], max_breakpoints = 1 } }

[limit]
context = 1_048_576
output = 65_536

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.75
cache = { read = 0.075, write = 0.041667 }

[cost.text.output]
price = 3.75
reasoning = 3.75

[cost.image.input]
price = 0.75

[cost.audio.input]
price = 0.75
cache = { read = 0.075 }

[cost.web_search]
price = 14
