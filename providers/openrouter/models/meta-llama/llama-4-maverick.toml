# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = true: forwarded in place (live: cache prefix kept on DigitalOcean)
# effort_updates = false: no per-turn effort control
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
base_model = "meta/llama-4-maverick-17b-instruct"
name = "Llama 4 Maverick"
description = "Open multimodal Llama model for strong reasoning and fast responses"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = false }
structured_output = true
system_updates = true
effort_updates = false

[limit]
context = 524_288

[cost.text.input]
price = 0.1875
cache = { read = 0.05 }

[cost.text.output]
price = 0.6525
