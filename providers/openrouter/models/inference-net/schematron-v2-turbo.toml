# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = true: forwarded in place (live: cache prefix kept on InferenceNet)
# effort_updates = false: no per-turn effort control
schema = 2
name = "Schematron V2 Turbo"
description = "Efficient model for low-latency assistance, extraction, and routine automation"
open_weights = true
release_date = "2026-09-12"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = true
temperature = true
system_updates = true
effort_updates = false

[limit]
context = 128_000
output = 8_192

[cost.text.input]
price = 0.03
cache = { read = 0.03 }

[cost.text.output]
price = 0.15
