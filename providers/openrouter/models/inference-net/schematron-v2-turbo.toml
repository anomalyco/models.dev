# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates unset: live probes disagreed (in place on InferenceNet; hoisted on InferenceNet)
# effort_updates = false: no per-turn effort control
schema = 2
base_model = "inference-net/schematron-v2-turbo"
description = "Efficient model for low-latency assistance, extraction, and routine automation"

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = true
effort_updates = false

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.03
cache = { read = 0.03 }

[cost.text.output]
price = 0.15
