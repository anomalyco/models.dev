# Modalities (OpenRouter's documented formats, narrowed to the lab's list where it has one): audio: https://openrouter.ai/docs/guides/overview/multimodal/audio
# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = false: hoisted on Mistral (live)
# effort_updates = false: no per-turn effort control
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
base_model = "mistral/voxtral-small-24b-2507"
description = "Efficient Mistral model for fast chat, extraction, and production assistants"

[modalities]
input = ["text", "audio/wav", "audio/mpeg", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
structured_output = true

[limit]
output = 26_214

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.1
cache = { read = 0.01 }

[cost.text.output]
price = 0.3

[cost.audio.input]
unit = "minute"
price = 0.006
