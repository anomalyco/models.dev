# Synced from https://openrouter.ai/api/v1/models?output_modalities=transcription
# Input: wav, mp3, flac, m4a, ogg, webm, aac ("varies by provider"). Priced per second of input
# audio, or per token when pricing.completion is set.
# https://openrouter.ai/docs/guides/overview/multimodal/stt
schema = 2
v2_only = true
type = "transcription"
name = "Voxtral Mini Transcribe 3"
description = "Speech-to-text model"
open_weights = false
release_date = "2026-10-20"

[modalities]
input = ["audio/wav", "audio/mpeg", "audio/flac", "audio/mp4", "audio/ogg", "audio/webm", "audio/aac"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }

[limit]
context = 65_536
output = 52_428

[api.transcriptions]
base_url = "https://openrouter.ai/api/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/protocols/openai-transcription" }

[cost.audio.input]
unit = "second"
price = 0.0000583333
