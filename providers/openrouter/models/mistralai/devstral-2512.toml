# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = false: hoisted on Mistral (live)
# effort_updates = false: no per-turn effort control
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
base_model = "mistral/devstral-2512"
description = "Mistral coding agent model for repository tasks and software engineering workflows"

[modalities]
input = ["text", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
structured_output = true
system_updates = false
effort_updates = false

[limit]
output = 209_715

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.4
cache = { read = 0.04 }

[cost.text.output]
price = 2
