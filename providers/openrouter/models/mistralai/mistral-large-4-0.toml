# Modalities (OpenRouter's documented formats, narrowed to the lab's list where it has one): image: https://openrouter.ai/docs/guides/overview/multimodal/image-understanding
# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = false: hoisted on Mistral (live)
# effort_updates = false: configuration_update is rejected with a 400 for this model (https://openrouter.ai/docs/guides/best-practices/reasoning-tokens#mid-conversation-effort)
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
name = "Mistral Large 4"
description = "Flagship Mistral model for advanced reasoning, coding, and multilingual work"
family = "mistral-large"
open_weights = false
release_date = "2026-10-06"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = true
temperature = true
system_updates = false
effort_updates = false

[limit]
context = 1_048_576
output = 262_144

[cost.text.input]
price = 0.68
cache = { read = 0.07 }

[cost.text.output]
price = 2.09
