# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = false: hoisted on Mistral (live)
# effort_updates = false: there's no in-history effort message (configuration_update is rejected with a 400); a top-level reasoning.effort change doesn't count.
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
# Effort: reasoning.effort = low|medium|high. OpenRouter's /models still lists the preview's none|high, but none and
#   reasoning.enabled = false return 400 from Mistral ("supported values: high, low, medium"); low, medium and high
#   return 200 with reasoning tokens (live 2026-10-31). The sync overrides OpenRouter's metadata for this model.
# Cache: automatic. OpenRouter lists a cached-input price for this model and has no caching section for this lab (live 2026-11-04, direct, Responses with prompt_cache_key: an immediate re-send was served from cache; 11 of 18 later checks warm, the oldest at 10 min: https://github.com/ngvoicu/cache-ttl-probe/blob/main/results/openrouter-direct/R11-2026-11-04T19-00-15.json)
schema = 2
base_model = "mistral/mistral-large-4"
description = "Flagship Mistral model for advanced reasoning, coding, and multilingual work"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.7
cache = { read = 0.07 }

[cost.text.output]
price = 2.1
