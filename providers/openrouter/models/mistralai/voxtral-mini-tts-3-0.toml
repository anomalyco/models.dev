# Synced from https://openrouter.ai/api/v1/models?output_modalities=speech
# Output: response_format mp3 (audio/mpeg) or pcm (audio/pcm). Priced per input character, or
# per second of output audio when only pricing.completion is set, or per token when both are.
# https://openrouter.ai/docs/guides/overview/multimodal/tts
schema = 2
v2_only = true
type = "speech"
name = "Voxtral TTS 3"
description = "Text-to-speech model"
open_weights = false
release_date = "2026-10-20"

[modalities]
input = ["text"]
output = ["audio/mpeg", "audio/pcm"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }

[limit]
context = 4_096
output = 3_276

[api.speech]
base_url = "https://openrouter.ai/api/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/protocols/openai-speech" }

[cost.text.input]
unit = "character"
price = 13
