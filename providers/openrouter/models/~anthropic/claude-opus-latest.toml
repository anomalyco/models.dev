# This route maps effort through top-level `verbosity`, not `reasoning.effort`.
# https://openrouter.ai/docs/api/reference/parameters#verbosity (accessed 2026-06-25)
schema = 2
name = "Claude Opus Latest"
description = "Flagship Claude model for deep reasoning, coding, and long-horizon agents"
family = "claude-opus"
open_weights = false
release_date = "2026-04-21"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
temperature = false

[limit]
context = 1_000_000
output = 128_000

[cost.text.input]
price = 4
cache = { read = 0.2, write = 5 }

[cost.text.output]
price = 20
