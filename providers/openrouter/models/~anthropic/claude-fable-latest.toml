# This route maps effort through top-level `verbosity`, not `reasoning.effort`.
# https://openrouter.ai/docs/api/reference/parameters#verbosity (accessed 2026-06-25)
schema = 2
name = "Claude Fable Latest"
description = "Claude model for creative writing, analysis, and controlled agent workflows"
family = "claude-fable"
open_weights = false
release_date = "2026-06-09"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
temperature = false

[limit]
context = 1_000_000
output = 128_000

[cost.text.input]
price = 10
cache = { read = 0.25, write = 12.5 }

[cost.text.output]
price = 50
