# Toggle: reasoning.enabled = true|false
# https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = true: forwarded in place (live: cache prefix kept on Poolside)
# effort_updates = false: no per-turn effort control
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
# Deprecated: GET /api/v1/models lists expiration_date 2026-10-31
schema = 2
name = "Laguna S 2.1"
description = "Reasoning model for deliberate analysis, multi-step problem solving, and tool use"
family = "laguna-s"
open_weights = true
release_date = "2026-07-21"
status = "deprecated"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true }
structured_output = false
temperature = true
system_updates = true
effort_updates = false

[limit]
context = 1_048_576
output = 131_072

[cost.text.input]
price = 0.09
cache = { read = 0.009 }

[cost.text.output]
price = 0.18
