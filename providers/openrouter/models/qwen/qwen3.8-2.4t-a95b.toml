# Sources (accessed 2026-08-16):
# https://openrouter.ai/qwen/qwen3.8-2.4t-a95b
# https://openrouter.ai/api/v1/models (id qwen/qwen3.8-2.4t-a95b)
# https://huggingface.co/Qwen/Qwen3.8-2.4T-A95B
# Pricing: $2 / $6 per 1M (cache_read $0.25). Context up to 1_048_576;
# top_provider max_completion_tokens 262_144. Text-only (not multimodal Max).
# Reasoning mandatory; efforts low|medium|xhigh (no toggle / no none).
# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates unset: live probes showed no cache signal, so placement is unknown
# effort_updates = false: configuration_update is rejected with a 400 for this model (https://openrouter.ai/docs/guides/best-practices/reasoning-tokens#mid-conversation-effort)
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
base_model = "alibaba/qwen3.8-2.4t-a95b"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "xhigh"] }
structured_output = true
effort_updates = false

[limit]
context = 1_048_576
output = 909_000

[cost.text.input]
price = 2
cache = { read = 0.25 }

[cost.text.output]
price = 6
