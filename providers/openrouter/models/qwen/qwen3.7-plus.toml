# Toggle: reasoning.enabled = true|false
# https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
schema = 2
base_model = "alibaba/qwen3.7-plus"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
output = 131_072

[cost.text.input]
price = 0.32
cache = { read = 0.064, write = 0.4 }

[[cost.text.input.overrides]]
when = { context = { gt = 256_000 } }
price = 0.96
cache = { read = 0.192, write = 1.2 }

[cost.text.output]
price = 1.28

[[cost.text.output.overrides]]
when = { context = { gt = 256_000 } }
price = 3.84
