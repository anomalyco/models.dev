# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = false: hoisted on Alibaba (live)
# effort_updates = false: no per-turn effort control
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
base_model = "alibaba/qwen3-coder-flash"

[capabilities]
tools = { supported = true, updates = false }
structured_output = false
system_updates = false
effort_updates = false

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.195
cache = { read = 0.039, write = 0.24375 }

[[cost.text.input.overrides]]
when = { context = { gt = 32_000 } }
price = 0.325
cache = { read = 0.065, write = 0.40625 }

[[cost.text.input.overrides]]
when = { context = { gt = 128_000 } }
price = 0.52
cache = { read = 0.104, write = 0.65 }

[cost.text.output]
price = 0.975

[[cost.text.output.overrides]]
when = { context = { gt = 32_000 } }
price = 1.625

[[cost.text.output.overrides]]
when = { context = { gt = 128_000 } }
price = 2.6
