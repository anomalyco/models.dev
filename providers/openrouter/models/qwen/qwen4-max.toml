schema = 2
base_model = "alibaba/qwen4-max"
description = "Qwen vision-language model for visual reasoning, documents, and agent tasks"

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "xhigh"] }
structured_output = true
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }

[limit]
output = 131_072

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 1.5
cache = { read = 0.075, write = 1.875 }

[cost.text.output]
price = 4.5
