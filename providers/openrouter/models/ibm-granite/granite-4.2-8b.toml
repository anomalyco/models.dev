# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = true: forwarded in place (live: cache prefix kept on CoreWeave)
# effort_updates = false: configuration_update is rejected with a 400 for this model (https://openrouter.ai/docs/guides/best-practices/reasoning-tokens#mid-conversation-effort)
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
name = "Granite 4.2 8B"
description = "Reasoning model for deliberate analysis, multi-step problem solving, and tool use"
family = "granite"
open_weights = true
release_date = "2026-08-31"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "high"] }
structured_output = true
temperature = true
system_updates = true
effort_updates = false

[limit]
context = 131_072
output = 117_964

[cost.text.input]
price = 0.06
cache = { read = 0.015 }

[cost.text.output]
price = 0.25
