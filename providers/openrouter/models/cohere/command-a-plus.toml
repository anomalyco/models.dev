# Toggle: reasoning.enabled = true|false
# https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
schema = 2
name = "Command A+"
description = "Cohere command model for multilingual enterprise agents, tools, and chat"
family = "command-a"
open_weights = false
release_date = "2026-09-22"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true }
structured_output = true
temperature = true

[limit]
context = 192_000
output = 64_000

[cost.text.input]
price = 0.3
cache = { read = 0.15 }

[cost.text.output]
price = 1.5
