schema = 2
name = "GPT Terra Latest"
description = "GPT model for general reasoning, writing, coding, and tool-assisted tasks"
family = "gpt-terra"
open_weights = false
knowledge = "2026-02-16"
release_date = "2026-09-11"

[modalities]
input = ["application/pdf", "image", "text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
temperature = false

[limit]
context = 1_050_000
output = 128_000

[cost.text.input]
price = 2
cache = { read = 0.2, write = 2.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 4
cache = { read = 0.4, write = 5 }

[cost.text.output]
price = 12

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 18
