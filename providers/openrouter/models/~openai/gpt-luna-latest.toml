schema = 2
name = "GPT Luna Latest"
description = "GPT model for general reasoning, writing, coding, and tool-assisted tasks"
family = "gpt-luna"
open_weights = false
knowledge = "2026-02-16"
release_date = "2026-09-11"

[modalities]
input = ["application/pdf", "image", "text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
temperature = false

[limit]
context = 1_050_000
output = 128_000

[cost.text.input]
price = 0.1
cache = { read = 0.01, write = 0.125 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 0.2
cache = { read = 0.02, write = 0.25 }

[cost.text.output]
price = 0.5

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 0.75
