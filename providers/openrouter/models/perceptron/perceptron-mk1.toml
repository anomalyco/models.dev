# Toggle: reasoning.enabled = true|false
# https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
# Modalities (OpenRouter's documented formats, narrowed to the lab's list where it has one): image: https://openrouter.ai/docs/guides/overview/multimodal/image-understanding; video: https://openrouter.ai/docs/guides/overview/multimodal/videos
# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates unset: live probes showed no cache signal, so placement is unknown
# effort_updates = false: no per-turn effort control
schema = 2
name = "Perceptron Mk1"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"
open_weights = false
release_date = "2026-05-12"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif", "video/mp4", "video/mpeg", "video/mov", "video/webm"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true, toggle = true }
structured_output = true
temperature = true
effort_updates = false

[limit]
context = 32_768
output = 8_192

[cost.text.input]
price = 0.15

[cost.text.output]
price = 1.5
