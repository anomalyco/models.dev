# Mid-conversation: system_updates = true: forwarded to Claude in place (live 2026-10-23 on claude-haiku-5.5 pinned to Anthropic: cache kept and followed on Chat Completions, Messages with the system message after the last user turn, and Responses with top-level cache_control)
# effort_updates = true: per-message output_config on Messages (beta mid-conversation-output-config-2026-07-01), and configuration_update on Chat Completions, keep the cache, as on Anthropic's own API (Chat live 2026-10-19 on Opus 5.5, Fable 5.1) (https://openrouter.ai/docs/guides/best-practices/reasoning-tokens#mid-conversation-effort) Top level: OpenRouter documents the in-history update on Chat Completions, Responses and Messages and converts between them, so it holds on every listed API.
# tools.updates = true on [api.messages] only (/api/v1/messages): tool_addition/tool_removal system blocks with anthropic-beta inline-tools-2026-09-15 keep the cache (live 2026-10-23, beta header sent on every turn). Add works by tool_reference only (by value is rejected), and the block can't sit right before a user message. Chat Completions drops the blocks. https://openrouter.ai/docs/api/api-reference/anthropic-messages/create-messages
# Cache: cache_control (top-level or per block), 4 breakpoints, 5m/1h TTL, 1h write = 2x input; min tokens per model (https://openrouter.ai/docs/guides/best-practices/prompt-caching#anthropic-claude)
schema = 2
base_model = "anthropic/claude-opus-5-5"
description = "Flagship Claude model for deep reasoning, coding, and long-horizon agents"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
system_updates = true
effort_updates = true
cache = { explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, min_tokens = 512 } }

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }
capabilities = { tools = { updates = true } }

[cost.text.input]
price = 4
cache = { read = 0.2, write = { "5m" = 5, "1h" = 8 } }

[cost.text.output]
price = 20

[cost.web_search]
price = 10
