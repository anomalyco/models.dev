# Mid-conversation, tool and cache flags backfilled 2026-11-18 from claude-fable-5.1.toml on this host (same API layout; the sync doesn't carry them).
schema = 2
base_model = "anthropic/claude-fable-5-2"
description = "Claude model for creative writing, analysis, and controlled agent workflows"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, min_tokens = 512 } }
system_updates = true
effort_updates = true

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 8
cache = { read = 0.2, write = { "5m" = 10, "1h" = 16 } }

[cost.text.output]
price = 40

[cost.web_search]
price = 10
