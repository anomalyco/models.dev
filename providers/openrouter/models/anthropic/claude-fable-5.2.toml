schema = 2
name = "Claude Fable 5.2"
description = "Claude model for creative writing, analysis, and controlled agent workflows"
family = "claude-fable"
open_weights = false
release_date = "2026-11-07"

[modalities]
input = ["text", "image", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
temperature = false

[limit]
context = 1_000_000
output = 128_000

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 8
cache = { read = 0.2, write = 10 }

[cost.text.output]
price = 40

[cost.web_search]
price = 10
