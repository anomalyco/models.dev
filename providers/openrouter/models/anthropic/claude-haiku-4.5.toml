# Toggle: reasoning.enabled = true|false
# https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = false: hoisted into the system prompt for this Claude model (live: cache prefix lost)
# effort_updates = false: no per-turn effort control
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
# Cache: cache_control (top-level or per block), 4 breakpoints, 5m/1h TTL, 1h write = 2x input; min tokens per model (https://openrouter.ai/docs/guides/best-practices/prompt-caching#anthropic-claude)
schema = 2
base_model = "anthropic/claude-haiku-4-5"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true }
structured_output = true
system_updates = false
effort_updates = false
cache = { supported = true, implicit = false, explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, min_tokens = 4_096 } }

[cost.text.input]
price = 1
cache = { read = 0.1, write = { "5m" = 1.25, "1h" = 2 } }

[cost.text.output]
price = 5

[cost.web_search]
price = 10
