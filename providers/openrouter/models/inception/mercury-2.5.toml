# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = false: hoisted on Inception (live)
# effort_updates = false: configuration_update is rejected with a 400 for this model (https://openrouter.ai/docs/guides/best-practices/reasoning-tokens#mid-conversation-effort)
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
base_model = "inception/mercury-2.5"
description = "Reasoning model for deliberate analysis, multi-step problem solving, and tool use"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = true
system_updates = false
effort_updates = false

[cost.text.input]
price = 0.04
cache = { read = 0.004 }

[cost.text.output]
price = 0.15
