# Toggle: reasoning.enabled = true|false
# https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = false: hoisted on Wafer (live)
# effort_updates = false: configuration_update is rejected with a 400 for this model (https://openrouter.ai/docs/guides/best-practices/reasoning-tokens#mid-conversation-effort)
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
base_model = "moonshotai/kimi-k3"
description = "Kimi multimodal agent model for visual understanding, coding, and planning"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true
temperature = true
system_updates = false
effort_updates = false

[limit]
output = 943_718

[cost.text.input]
price = 0.239
cache = { read = 0.21 }

[cost.text.output]
price = 11.936
