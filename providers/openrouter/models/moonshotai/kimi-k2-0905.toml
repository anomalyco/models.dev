# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = true: forwarded in place (live: cache prefix kept on Novita)
# effort_updates = false: no per-turn effort control
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
base_model = "moonshotai/kimi-k2-0905"
description = "Kimi model for long-context chat, coding, and agentic reasoning"

[capabilities]
tools = { supported = true, updates = false }
structured_output = true
system_updates = true
effort_updates = false

[cost.text.input]
price = 0.6

[cost.text.output]
price = 2.5
