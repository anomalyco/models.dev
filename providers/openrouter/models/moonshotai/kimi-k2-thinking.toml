# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = true: forwarded in place (live: cache prefix kept on Novita)
# effort_updates = false: no per-turn effort control
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
base_model = "moonshotai/kimi-k2-thinking"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
structured_output = true
system_updates = true
effort_updates = false

[limit]
output = 98_304

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_details" }

[cost.text.input]
price = 0.6
cache = { read = 0.15 }

[cost.text.output]
price = 2.5
