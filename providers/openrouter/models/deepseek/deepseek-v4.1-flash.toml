# Toggle: reasoning.enabled = true|false
# https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
schema = 2
base_model = "deepseek/deepseek-v4.1-flash"
description = "Fast DeepSeek model for efficient chat, coding help, and agent loops"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true

[limit]
context = 1_048_576
output = 943_718

[cost.text.input]
price = 0.0352
cache = { read = 0.0016 }

[cost.text.output]
price = 0.0112
