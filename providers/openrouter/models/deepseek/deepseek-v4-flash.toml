# Toggle: reasoning.enabled = true|false
# https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
schema = 2
base_model = "deepseek/deepseek-v4-flash"

[capabilities]
reasoning = { supported = true, effort = ["none", "high", "xhigh"] }
structured_output = true

[limit]
context = 1_048_576
output = 943_717

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.091
cache = { read = 0.0182 }

[cost.text.output]
price = 0.182
