# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = false: hoisted on StreamLake (live)
# effort_updates = false: no per-turn effort control
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
base_model = "deepseek/deepseek-chat"

[capabilities]
tools = { supported = true, updates = false }
structured_output = true
system_updates = false
effort_updates = false

[limit]
context = 163_840
output = 16_000

[cost.text.input]
price = 0.2574

[cost.text.output]
price = 1.0287
