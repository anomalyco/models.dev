# Toggle: reasoning.enabled = true|false
# https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates unset: live probes disagreed (in place on GMICloud, Cloudflare; hoisted on Reka)
# effort_updates = false: configuration_update is rejected with a 400 for this model (https://openrouter.ai/docs/guides/best-practices/reasoning-tokens#mid-conversation-effort)
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
# Cache: automatic (https://openrouter.ai/docs/guides/best-practices/prompt-caching#deepseek; live 2026-11-04, direct, Responses with prompt_cache_key: an immediate re-send was served from cache; 37 of 42 later checks warm, the oldest at 2 h: https://github.com/ngvoicu/cache-ttl-probe/blob/main/results/openrouter-direct/R8-2026-11-04T18-59-51.json)
schema = 2
base_model = "deepseek/deepseek-v4-pro"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["none", "high", "xhigh"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 1_048_576
output = 393_216

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.9
cache = { read = 0.25 }

[cost.text.output]
price = 1.5
