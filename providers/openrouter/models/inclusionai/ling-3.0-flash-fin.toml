# Toggle: reasoning.enabled = true|false
# https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
schema = 2
name = "Ling 3.0 Flash Fin"
description = "Efficient model for low-latency assistance, extraction, and routine automation"
family = "ling"
open_weights = false
release_date = "2026-08-27"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, toggle = true }
structured_output = false
temperature = true

[limit]
context = 262_144
output = 32_768

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.042
cache = { read = 0.0084 }

[cost.text.output]
price = 0.1232
