# Toggle: reasoning.enabled = true|false
# https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = true: forwarded in place (live: cache prefix kept on DeepInfra)
# effort_updates = false: no per-turn effort control
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
name = "Ling 3.1 Flash"
description = "Efficient model for low-latency assistance, extraction, and routine automation"
family = "ling"
open_weights = false
release_date = "2026-10-02"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true }
structured_output = true
temperature = true
system_updates = true
effort_updates = false

[limit]
context = 262_144
output = 235_929

[cost.text.input]
price = 0.075
cache = { read = 0.015 }

[cost.text.output]
price = 0.225
