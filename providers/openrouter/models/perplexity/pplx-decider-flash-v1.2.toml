# Modalities (OpenRouter's documented formats, narrowed to the lab's list where it has one): image: https://openrouter.ai/docs/guides/overview/multimodal/image-understanding
schema = 2
type = "decision"
name = "Decider Flash V1.2"
description = "Decision model for typed evaluation of shared state"
open_weights = false
release_date = "2026-10-16"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = false
temperature = false

[limit]
context = 262_144
output = 0

[api.systemone]
sdk = { aisdk = "none" }

[api.decisions]
base_url = "https://openrouter.ai/api/alpha"
sdk = { opencodeai = "none" }

[cost.text.input]
price = 0.01

[cost.text.output]
price = 0
