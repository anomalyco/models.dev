# Modalities (OpenRouter's documented formats, narrowed to the lab's list where it has one): image: https://openrouter.ai/docs/guides/overview/multimodal/image-understanding
# Mid-conversation: system_updates = true: OpenAI keeps mid-conversation system/developer messages in place (live 2026-10-23 on gpt-4.1-nano pinned to OpenAI: cache kept and followed on Chat Completions, Responses and Messages)
# effort_updates = false: configuration_update is rejected with a 400 for this model (https://openrouter.ai/docs/guides/best-practices/reasoning-tokens#mid-conversation-effort)
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
# Cache: automatic from 1,024 tokens; GPT-5.6+ explicit prompt_cache_breakpoint, 30m TTL (https://openrouter.ai/docs/guides/best-practices/prompt-caching#openai)
schema = 2
name = "GPT-6.1 Sol Pro"
description = "Frontier GPT model for professional reasoning, coding, and multimodal work"
family = "gpt"
open_weights = false
release_date = "2026-09-29"

[modalities]
input = ["application/pdf", "image/png", "image/jpeg", "image/webp", "image/gif", "text"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
temperature = false
system_updates = true
cache = { implicit = { min_tokens = 1_024 }, explicit = { ttl = ["30m"], min_tokens = 1_024 } }

[limit]
context = 1_050_000
output = 128_000

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 2
cache = { read = 0.1, write = 2.5 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 4
cache = { read = 0.2, write = 5 }

[cost.text.output]
price = 10

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 15

[cost.web_search]
price = 10
