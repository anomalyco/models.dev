# Toggle: reasoning.enabled = true|false
# https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
schema = 2
base_model = "openai/o4-mini"

[modalities]
input = ["image", "text", "application/pdf"]
output = ["text"]

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[cost.text.input]
price = 1.1
cache = { read = 0.275 }

[cost.text.output]
price = 4.4
