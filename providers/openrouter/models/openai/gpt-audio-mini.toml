# Mid-conversation: system_updates = true: OpenAI keeps mid-conversation system/developer messages in place (live 2026-10-23 on gpt-4.1-nano pinned to OpenAI: cache kept and followed on Chat Completions, Responses and Messages). This model has no prompt caching here, so there is no cached prefix to lose
# effort_updates = false: no per-turn effort control
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
base_model = "openai/gpt-audio-mini"
description = "Speech generation model for controllable voice, narration, and audio delivery"

[capabilities]
tools = { supported = true }
structured_output = true
system_updates = true

[cost.text.input]
price = 0.6

[cost.text.output]
price = 2.4

[cost.audio.input]
price = 0.6

[cost.audio.output]
price = 2.4
