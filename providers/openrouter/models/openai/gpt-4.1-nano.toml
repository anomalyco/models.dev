# Modalities (OpenRouter's documented formats, narrowed to the lab's list where it has one): image: https://openrouter.ai/docs/guides/overview/multimodal/image-understanding
# Mid-conversation: system_updates = true: OpenAI keeps mid-conversation system/developer messages in place (live 2026-10-23 on gpt-4.1-nano pinned to OpenAI: cache kept and followed on Chat Completions, Responses and Messages)
# effort_updates = false: no per-turn effort control
# tools.updates = true on [api.responses] only (/api/v1/responses, add only): an `additional_tools` input item keeps the cache (live 2026-10-23, pinned to OpenAI). OpenRouter's Responses docs don't mention it (https://openrouter.ai/docs/api/reference/responses/overview); lab mechanism: https://developers.openai.com/api/docs/guides/prompt-caching. Chat Completions has no mechanism.
# Cache: automatic from 1,024 tokens (https://openrouter.ai/docs/guides/best-practices/prompt-caching#openai)
schema = 2
base_model = "openai/gpt-4.1-nano"

[modalities]
input = ["image/jpeg", "image/png", "image/gif", "image/webp", "text", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
structured_output = true
system_updates = true
cache = { implicit = { min_tokens = 1_024 } }

[limit]
output = 942_818

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }
capabilities = { tools = { updates = true } }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.1
cache = { read = 0.03 }

[cost.text.output]
price = 0.4

[cost.web_search]
price = 10
