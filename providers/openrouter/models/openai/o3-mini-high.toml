# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = true: OpenAI keeps mid-conversation system/developer messages in place (live: cache prefix kept on gpt-4.1, gpt-5.4, gpt-6-sol)
# effort_updates = false: configuration_update is rejected with a 400 for this model (https://openrouter.ai/docs/guides/best-practices/reasoning-tokens#mid-conversation-effort)
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
# Cache: automatic from 1,024 tokens (https://openrouter.ai/docs/guides/best-practices/prompt-caching#openai)
schema = 2
name = "o3 Mini High"
description = "O-series reasoning model for hard analysis, math, coding, and planning"
family = "o"
open_weights = false
knowledge = "2023-10-31"
release_date = "2025-02-12"

[modalities]
input = ["text", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["high"] }
structured_output = true
temperature = false
system_updates = true
effort_updates = false
cache = { supported = true, implicit = { min_tokens = 1_024 } }

[limit]
context = 200_000
output = 100_000

[cost.text.input]
price = 1.1
cache = { read = 0.55 }

[cost.text.output]
price = 4.4
