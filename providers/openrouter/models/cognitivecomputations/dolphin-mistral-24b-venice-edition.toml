# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = false: hoisted on Venice (live)
# effort_updates = false: no per-turn effort control
schema = 2
base_model = "cognitivecomputations/dolphin-mistral-24b-venice-edition"
description = "Mistral model for multilingual chat, reasoning, and tool-assisted workflows"

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = false
system_updates = false
effort_updates = false

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.2

[cost.text.output]
price = 0.9
