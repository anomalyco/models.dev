schema = 2
name = "Muse Spark 1.3 Contributor"
description = "Open Llama multimodal model for image understanding and text reasoning"
family = "muse"
open_weights = false
release_date = "2026-09-02"

[modalities]
input = ["text", "image", "video", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
temperature = true

[limit]
context = 1_048_576
output = 943_718

[cost.text.input]
price = 0.1
cache = { read = 0.002 }

[cost.text.output]
price = 0.2
