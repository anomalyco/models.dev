schema = 2
name = "Muse Ember"
description = "Open Llama multimodal model for image understanding and text reasoning"
family = "muse"
open_weights = false
release_date = "2026-11-09"

[modalities]
input = ["text", "image", "video", "application/pdf", "audio"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
temperature = true

[limit]
context = 1_048_576
output = 943_718

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.1
cache = { read = 0.004, write = 0.125 }

[cost.text.output]
price = 0.5

[cost.web_search]
price = 2.5
