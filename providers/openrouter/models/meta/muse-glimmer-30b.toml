# Sources:
# https://openrouter.ai/meta/muse-glimmer-30b
# https://openrouter.ai/api/v1/models/meta/muse-glimmer-30b/endpoints
# Effort: reasoning_effort = low|medium|high|xhigh
# https://huggingface.co/meta-models/Muse-Glimmer-30B
# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = false: hoisted on DeepInfra (live)
# effort_updates = false: configuration_update is rejected with a 400 for this model (https://openrouter.ai/docs/guides/best-practices/reasoning-tokens#mid-conversation-effort)
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
base_model = "meta/muse-glimmer-30b"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
system_updates = false
effort_updates = false

[limit]
output = 16_384

[cost.text.input]
price = 0.3
cache = { read = 0.04 }

[cost.text.output]
price = 1.2
