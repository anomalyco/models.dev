# Modalities (OpenRouter's documented formats, narrowed to the lab's list where it has one): image: https://openrouter.ai/docs/guides/overview/multimodal/image-understanding; video: https://openrouter.ai/docs/guides/overview/multimodal/videos; audio: https://openrouter.ai/docs/guides/overview/multimodal/audio
# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = false: hoisted on BaseTen (live)
# effort_updates = false: configuration_update is rejected with a 400 for this model (https://openrouter.ai/docs/guides/best-practices/reasoning-tokens#mid-conversation-effort)
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
base_model = "meta/muse-spark-open"
description = "Open Llama multimodal model for image understanding and text reasoning"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif", "video/mp4", "video/mpeg", "video/mov", "video/webm", "application/pdf", "audio/wav", "audio/mpeg"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
system_updates = false
effort_updates = false

[limit]
output = 943_718

[cost.text.input]
price = 1.25
cache = { read = 0.15 }

[cost.text.output]
price = 4.25
