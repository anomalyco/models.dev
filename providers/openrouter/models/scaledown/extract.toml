# Modalities (OpenRouter's documented formats, narrowed to the lab's list where it has one): image: https://openrouter.ai/docs/guides/overview/multimodal/image-understanding
# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates unset: live probes showed no cache signal, so placement is unknown
# effort_updates = false: no per-turn effort control
schema = 2
name = "Extract"
description = "Multimodal model for analyzing text, images, documents, and rich media"
open_weights = false
release_date = "2026-10-13"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = false
temperature = false
effort_updates = false

[limit]
context = 1_000_000
output = 900_000

[cost.text.input]
price = 0.04

[cost.text.output]
price = 0
