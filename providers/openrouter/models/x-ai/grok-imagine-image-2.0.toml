# Synced from https://openrouter.ai/api/v1/models?output_modalities=image. Prices are the Images API
# endpoint pricing lines (/api/v1/images/models/{id}/endpoints): per image, per megapixel or per token.
# Resolution and quality tiers are overrides on the first line; a request that omits them is billed at
# the provider's default tier. No [cost] when a price has no CostV2 form (per-request or font fees,
# unlisted or per-job pricing).
# https://openrouter.ai/docs/guides/overview/multimodal/image-generation
schema = 2
v2_only = true
base_model = "xai/grok-imagine-image-2.0"

[api.images]
base_url = "https://openrouter.ai/api/v1"
sdk = { aisdk = "@openrouter/ai-sdk-provider", opencodeai = "@opencode/ai/providers/openrouter/images" }

[cost.image.input]
unit = "image"
price = 0.01

[cost.image.output]
unit = "image"
price = 0.04

[[cost.image.output.overrides]]
when = { quality = { equals = "low" }, resolution = { equals = "2K" } }
price = 0.06

[[cost.image.output.overrides]]
when = { quality = { equals = "medium" }, resolution = { equals = "1K" } }
price = 0.06

[[cost.image.output.overrides]]
when = { quality = { equals = "medium" }, resolution = { equals = "2K" } }
price = 0.08
