# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = false: served only on Amazon Bedrock Converse, which takes no mid-conversation system message for this model
# effort_updates = false: no per-turn effort control
schema = 2
name = "Palmyra X5"
description = "General-purpose chat model for instruction following, writing, and analysis"
family = "palmyra"
open_weights = false
release_date = "2026-01-21"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = false
temperature = true
system_updates = false
effort_updates = false

[limit]
context = 1_040_000
output = 8_192

[cost.text.input]
price = 0.6

[cost.text.output]
price = 6
