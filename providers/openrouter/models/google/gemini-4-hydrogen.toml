schema = 2
name = "Gemini 4 Hydrogen"
description = "Gemini multimodal model for text, image, audio, video, and document tasks"
family = "gemini"
open_weights = false
release_date = "2026-11-12"

[modalities]
input = ["audio", "application/pdf", "image", "text", "video"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
temperature = true

[limit]
context = 1_048_576
output = 943_718

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 1.5
cache = { read = 0.075, write = 0.083333 }

[cost.text.output]
price = 7.5
reasoning = 7.5

[cost.audio.input]
price = 1.5
cache = { read = 0.075 }

[cost.image.input]
price = 1.5

[cost.web_search]
price = 14
