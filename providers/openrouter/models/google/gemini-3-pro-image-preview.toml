# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = false: Gemini has one systemInstruction, so it is hoisted (live: cache prefix lost; https://openrouter.ai/docs/guides/best-practices/prompt-caching#google-gemini)
# effort_updates = false: no per-turn effort control
schema = 2
base_model = "google/gemini-3-pro-image-preview"

[capabilities]
reasoning = { supported = true }
structured_output = true
system_updates = false
effort_updates = false

[api.chat-completions]

[api.images]
sdk = { opencodeai = "@opencode/ai/protocols/openai-images" }

[cost.text.input]
price = 2
cache = { read = 0.2, write = 0.375 }

[cost.text.output]
price = 12
reasoning = 12

[cost.image.input]
price = 2

[cost.image.output]
price = 120

[cost.web_search]
price = 14
