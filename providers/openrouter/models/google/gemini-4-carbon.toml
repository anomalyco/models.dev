schema = 2
base_model = "google/gemini-4-carbon"
description = "Gemini multimodal model for text, image, audio, video, and document tasks"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
temperature = true

[limit]
output = 943_718

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 2
cache = { read = 0.1, write = 0.1875 }

[cost.text.output]
price = 10
reasoning = 10

[cost.audio.input]
price = 2
cache = { read = 0.1 }

[cost.image.input]
price = 2

[cost.web_search]
price = 14
