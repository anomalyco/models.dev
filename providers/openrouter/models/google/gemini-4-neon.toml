schema = 2
base_model = "google/gemini-4-neon"
description = "Gemini multimodal model for text, image, audio, video, and document tasks"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
temperature = true
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 3
cache = { read = 0.15, write = 0.083333 }

[cost.text.output]
price = 15
reasoning = 15

[cost.audio.input]
price = 3
cache = { read = 0.15 }

[cost.image.input]
price = 3

[cost.web_search]
price = 14
