# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = false: Gemini has one systemInstruction, so it is hoisted (live: cache prefix lost; https://openrouter.ai/docs/guides/best-practices/prompt-caching#google-gemini)
# effort_updates = false: no per-turn effort control
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
# Cache: implicit on Gemini 2.5+; cache_control uses only the last breakpoint, 5m TTL (https://openrouter.ai/docs/guides/best-practices/prompt-caching#google-gemini)
schema = 2
base_model = "google/gemini-2.5-pro-preview"
description = "Advanced Gemini model for complex reasoning, coding, and multimodal analysis"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, budget = { min = 128, max = 32_768 } }
structured_output = true
cache = { implicit = { min_tokens = 4_096 }, explicit = { ttl = ["5m"], max_breakpoints = 1, min_tokens = 4_096 } }

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 1.25
cache = { read = 0.125, write = 0.375 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 2.5
cache = { read = 0.25 }

[cost.text.output]
price = 10
reasoning = 10

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 15

[cost.image.input]
price = 1.25

[cost.audio.input]
price = 1.25
cache = { read = 0.125 }

[[cost.audio.input.overrides]]
when = { context = { gt = 200_000 } }
price = 2.5
cache = { read = 0.25 }

[cost.web_search]
price = 14
