# Toggle: reasoning.enabled = true|false
# https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
schema = 2
base_model = "google/gemini-2.5-flash"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
output = 65_535

[cost.text.input]
price = 0.3
cache = { read = 0.03, write = 0.083333 }

[cost.text.output]
price = 2.5
reasoning = 2.5
