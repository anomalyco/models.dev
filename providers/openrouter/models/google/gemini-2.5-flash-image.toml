# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = false: Gemini has one systemInstruction, so it is hoisted (live: cache prefix lost; https://openrouter.ai/docs/guides/best-practices/prompt-caching#google-gemini)
# effort_updates = false: no per-turn effort control
schema = 2
base_model = "google/gemini-2.5-flash-image"

[capabilities]
structured_output = true
system_updates = false
effort_updates = false

[limit]
output = 8_192

[api.chat-completions]

[api.images]
sdk = { opencodeai = "@opencode/ai/protocols/openai-images" }

[cost.text.input]
price = 0.3
cache = { read = 0.03, write = 0.083333 }

[cost.text.output]
price = 2.5
reasoning = 2.5

[cost.image.input]
price = 0.3

[cost.image.output]
price = 30

[cost.web_search]
price = 14
