# Toggle: reasoning.enabled = true|false
# https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
schema = 2
base_model = "google/gemini-2.5-flash-lite"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
output = 65_535

[cost.text.input]
price = 0.1
cache = { read = 0.01, write = 0.083333 }

[cost.text.output]
price = 0.4
reasoning = 0.4
