# Toggle: reasoning.enabled = true|false
# https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
schema = 2
base_model = "google/gemini-nano-banana-2.1"
description = "Image model for prompt-driven generation, editing, and visual design workflows"

[modalities]
input = ["image", "text"]
output = ["text", "image"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "minimal", "high"] }
structured_output = true
temperature = true

[limit]
context = 65_536
output = 58_982

[cost.text.input]
price = 1.5

[cost.text.output]
price = 7.5
