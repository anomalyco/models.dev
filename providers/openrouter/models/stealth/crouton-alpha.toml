schema = 2
name = "Crouton Alpha"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"
family = "alpha"
open_weights = false
release_date = "2026-11-03"

[modalities]
input = ["text", "image", "video", "application/pdf", "audio"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
temperature = true

[limit]
context = 1_048_576
output = 943_718

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0

[cost.text.output]
price = 0
