# Toggle: reasoning.enabled = true|false
# https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
# Modalities (OpenRouter's documented formats, narrowed to the lab's list where it has one): image: https://openrouter.ai/docs/guides/overview/multimodal/image-understanding
# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = true: forwarded in place (live: cache prefix kept on InferenceNet, Relace)
# effort_updates = false: configuration_update is rejected with a 400 for this model (https://openrouter.ai/docs/guides/best-practices/reasoning-tokens#mid-conversation-effort)
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
name = "DeepSeek Flash Latest"
description = "Fast DeepSeek model for efficient chat, coding help, and agent loops"
family = "deepseek-flash"
open_weights = false
release_date = "2026-09-14"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true
temperature = true
system_updates = true
effort_updates = false

[limit]
context = 1_048_576
output = 943_718

[cost.text.input]
price = 0.07
cache = { read = 0.008 }

[cost.text.output]
price = 0.5
