# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = false: hoisted on Parasail (live)
# effort_updates = false: no per-turn effort control
schema = 2
base_model = "gryphe/mythomax-l2-13b"
description = "Open-weight instruction model for adaptable chat and self-hosted production workloads"

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = true
system_updates = false
effort_updates = false

[limit]
context = 8_192
output = 3_686

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.08

[cost.text.output]
price = 0.11
