# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = false: hoisted on Tencent (live)
# effort_updates = false: configuration_update is rejected with a 400 for this model (https://openrouter.ai/docs/guides/best-practices/reasoning-tokens#mid-conversation-effort)
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
base_model = "tencent/hy3"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "high"] }
structured_output = true
system_updates = false
effort_updates = false

[limit]
context = 262_144

[cost.text.input]
price = 0.132
cache = { read = 0.033 }

[[cost.text.input.overrides]]
when = { utc_hours = { lt = "16:00" } }
price = 0.132
cache = { read = 0.033 }

[[cost.text.input.overrides]]
when = { utc_hours = { gte = "16:00" } }
price = 0.0825
cache = { read = 0.020625 }

[cost.text.output]
price = 0.528

[[cost.text.output.overrides]]
when = { utc_hours = { lt = "16:00" } }
price = 0.528

[[cost.text.output.overrides]]
when = { utc_hours = { gte = "16:00" } }
price = 0.33
