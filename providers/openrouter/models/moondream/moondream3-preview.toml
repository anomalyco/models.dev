name = "Moondream 3 Preview"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"
release_date = "2026-10-15"
last_updated = "2026-10-15"
attachment = true
reasoning = true
temperature = true
tool_call = false
structured_output = false
