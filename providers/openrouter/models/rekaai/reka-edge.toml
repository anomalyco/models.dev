# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = false: dropped on Reka (live)
# effort_updates = false: no per-turn effort control
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
base_model = "rekaai/reka-edge"
description = "Multimodal model for analyzing text, images, documents, and rich media"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = false }
structured_output = true
system_updates = false
effort_updates = false

[cost.text.input]
price = 0.1

[cost.text.output]
price = 0.1
