# OpenRouter lists text and image input. Image MIME types follow Liquid's d1.2 Image Requirements:
# https://github.com/Liquid4All/docs/blob/d4c58eb76305b9d20d7167ee7d1fffcb976aea98/lfm/models/d1.mdx#L1220-L1224
# https://openrouter.ai/api/v1/models?output_modalities=decisions
schema = 2
base_model = "liquid/d1.2"
name = "d1 Latest"
description = "Decision model for typed evaluation of shared state"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp"]
output = ["decision"]

[capabilities]
structured_output = false

[api.systemone]
sdk = { aisdk = "@ai-sdk/typesafe-ai", opencodeai = "@opencode/ai/providers/openrouter/decisions" }
compatibility = { media_input = "state" }

[cost.text.input]
price = 0.02

[cost.text.output]
price = 0
