# OpenRouter lists text and images for this route. Image formats follow https://docs.liquid.ai/lfm/models/d1.
# https://openrouter.ai/api/v1/models?output_modalities=decisions
schema = 2
base_model = "liquid/d1.2-ultra"
name = "d1-ultra Latest"
description = "Decision model for typed evaluation of shared state"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp"]
output = ["decision"]

[capabilities]
structured_output = false

[api.systemone]
sdk = { aisdk = "@ai-sdk/typesafe-ai", opencodeai = "@opencode/ai/providers/openrouter/decisions" }
compatibility = { media_input = "state" }

[cost.text.input]
price = 0.042

[cost.text.output]
price = 0
