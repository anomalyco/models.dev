# Toggle: reasoning.enabled = true|false
# https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = true: forwarded in place (live: cache prefix kept on Seed)
# effort_updates = false: configuration_update is rejected with a 400 for this model (https://openrouter.ai/docs/guides/best-practices/reasoning-tokens#mid-conversation-effort)
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
base_model = "bytedance-seed/seed-2.0-mini"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high"] }
system_updates = true
effort_updates = false

[limit]
context = 262_144
output = 131_072

[cost.text.input]
price = 0.1

[[cost.text.input.overrides]]
when = { context = { gt = 128_000 } }
price = 0.2

[cost.text.output]
price = 0.4

[[cost.text.output.overrides]]
when = { context = { gt = 128_000 } }
price = 0.8
