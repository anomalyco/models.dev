# Toggle: reasoning.enabled = true|false
# Effort: reasoning.effort = low|medium|high
# https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
schema = 2
base_model = "bytedance-seed/seed-2.0-code"
description = "Coding model for repository understanding, refactors, and agentic engineering tasks"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }

[cost.text.input]
price = 0.5

[[cost.text.input.overrides]]
when = { context = { gt = 128_000 } }
price = 1

[cost.text.output]
price = 3

[[cost.text.output.overrides]]
when = { context = { gt = 128_000 } }
price = 6
