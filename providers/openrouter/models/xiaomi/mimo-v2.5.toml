# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = true: forwarded in place (live: cache prefix kept on Xiaomi)
# effort_updates = false: no per-turn effort control
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
# Deprecated: GET /api/v1/models lists expiration_date 2026-10-21
schema = 2
base_model = "xiaomi/mimo-v2.5"
status = "deprecated"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true }
structured_output = true
system_updates = true
effort_updates = false

[limit]
context = 1_050_000
output = 945_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_details" }

[cost.text.input]
price = 0.119
cache = { read = 0.00255 }

[cost.text.output]
price = 0.238
