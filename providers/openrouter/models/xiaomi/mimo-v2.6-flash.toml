# Toggle: reasoning.enabled = true|false
# https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
schema = 2
base_model = "xiaomi/mimo-v2.6-flash"
description = "MiMo flash model for fast multimodal assistance and agent workflows"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true

[limit]
context = 1_050_000

[cost.text.input]
price = 0.14
cache = { read = 0.0028 }

[cost.text.output]
price = 0.28
