# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = true: forwarded in place (live: cache prefix kept on Featherless, InferenceNet)
# effort_updates = false: configuration_update is rejected with a 400 for this model (https://openrouter.ai/docs/guides/best-practices/reasoning-tokens#mid-conversation-effort)
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
base_model = "stepfun/step-5-preview"
description = "StepFun flash model for efficient multimodal reasoning, coding, and tool use"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
temperature = true
system_updates = true
effort_updates = false

[limit]
context = 1_048_576
output = 64_000

[cost.text.input]
price = 1
cache = { read = 0.1 }

[cost.text.output]
price = 2.7
