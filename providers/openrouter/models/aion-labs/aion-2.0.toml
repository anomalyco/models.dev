# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = true: forwarded in place (live: cache prefix kept on AionLabs)
# effort_updates = false: no per-turn effort control
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
name = "Aion-2.0"
description = "Reasoning model for deliberate analysis, multi-step problem solving, and tool use"
open_weights = false
release_date = "2026-02-23"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
structured_output = false
temperature = true
system_updates = true
effort_updates = false

[limit]
context = 131_072
output = 32_768

[cost.text.input]
price = 0.8
cache = { read = 0.2 }

[cost.text.output]
price = 1.6
