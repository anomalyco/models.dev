# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates unset: live probes showed no cache signal, so placement is unknown
# effort_updates = false: no per-turn effort control
schema = 2
base_model = "aion-labs/aion-rp-llama-3.1-8b"
description = "Open Llama instruction model for multilingual chat, reasoning, and coding"

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = false

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.8

[cost.text.output]
price = 1.6
