# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = true: forwarded in place (live: cache prefix kept on Decart, Wafer)
# effort_updates = false: configuration_update is rejected with a 400 for this model (https://openrouter.ai/docs/guides/best-practices/reasoning-tokens#mid-conversation-effort)
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
name = "GLM Latest"
description = "Flagship GLM model for hybrid reasoning, coding, and agentic engineering"
family = "glm"
open_weights = false
release_date = "2026-08-19"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
temperature = true
system_updates = true
effort_updates = false

[limit]
context = 1_048_576
output = 943_718

[cost.text.input]
price = 0.079
cache = { read = 0.055 }

[cost.text.output]
price = 1.4
