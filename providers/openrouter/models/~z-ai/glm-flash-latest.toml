# Modalities (OpenRouter's documented formats, narrowed to the lab's list where it has one): image: https://openrouter.ai/docs/guides/overview/multimodal/image-understanding; video: https://openrouter.ai/docs/guides/overview/multimodal/videos
# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = true: forwarded in place (live: cache prefix kept on OpenInference)
# effort_updates = false: configuration_update is rejected with a 400 for this model (https://openrouter.ai/docs/guides/best-practices/reasoning-tokens#mid-conversation-effort)
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
name = "GLM Flash Latest"
description = "GLM vision model for visual reasoning, documents, and multimodal agents"
family = "glm-flash"
open_weights = false
release_date = "2026-08-27"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif", "video/mp4", "video/mpeg", "video/mov", "video/webm"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
temperature = true
system_updates = true
effort_updates = false

[limit]
context = 1_048_576
output = 943_718

[cost.text.input]
price = 0.059076
cache = { read = 0.006 }

[cost.text.output]
price = 0.16
