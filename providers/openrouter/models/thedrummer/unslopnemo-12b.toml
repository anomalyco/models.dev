# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = true: forwarded in place (live: cache prefix kept on Parasail)
# effort_updates = false: no per-turn effort control
schema = 2
base_model = "thedrummer/unslopnemo-12b"
description = "Open-weight instruction model for adaptable chat and self-hosted production workloads"

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = true
system_updates = true
effort_updates = false

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.4

[cost.text.output]
price = 0.4
