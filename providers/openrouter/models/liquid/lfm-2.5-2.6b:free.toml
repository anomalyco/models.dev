# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = true: forwarded in place (live: cache prefix kept on Liquid)
# effort_updates = false: no per-turn effort control
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
name = "LFM2.5-2.6B (free)"
description = "Free provider route for experiments, demos, and cost-sensitive chat workloads"
family = "liquid"
open_weights = true
release_date = "2026-08-11"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
structured_output = true
temperature = true
system_updates = true
effort_updates = false

[limit]
context = 65_536
output = 8_192

[cost.text.input]
price = 0

[cost.text.output]
price = 0
