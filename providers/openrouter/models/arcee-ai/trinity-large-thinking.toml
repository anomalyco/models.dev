# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = true: forwarded in place (live: cache prefix kept on Arcee AI)
# effort_updates = false: no per-turn effort control
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
base_model = "arcee-ai/trinity-large-thinking"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
structured_output = false
system_updates = true
effort_updates = false

[limit]
context = 262_144
output = 80_000

[cost.text.input]
price = 0.25
cache = { read = 0.06 }

[cost.text.output]
price = 0.8
