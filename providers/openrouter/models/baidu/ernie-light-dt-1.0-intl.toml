schema = 2
name = "ERNIE-Light-DT-1.0"
description = "Reasoning model for deliberate analysis, multi-step problem solving, and tool use"
family = "ernie"
open_weights = false
release_date = "2026-11-10"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true
temperature = true

[limit]
context = 1_024_000
output = 131_072

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 1.13
cache = { read = 0.113 }

[cost.text.output]
price = 3.94
