# Sources: https://developer.ant-ling.com/en/docs/models/ling/#ling-30-flash
# Pricing: https://developer.ant-ling.com/en/docs/models/price (accessed 2026-10-30); CNY prices: 0.14 input, 0.42 output, 0.028 cache read
#   These are the current promotional CNY rows (price page: Ling-3.0-flash and -VL are on a 72% discount);
#   the page states original prices resume when the promotion ends.
# CNY→USD rate: 6.6666666667, 2026-10-30, source: https://open.er-api.com/v6/latest/USD
# Toggle: `thinking.type = "enabled" | "disabled"` (default: enabled).
schema = 2
base_model = "inclusionai/ling-3.0-flash"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true, default = { type = "toggle", value = true } }
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.messages]
base_url = "https://api.ant-ling.com/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.021
cache = { read = 0.0042 }

[cost.text.output]
price = 0.063
