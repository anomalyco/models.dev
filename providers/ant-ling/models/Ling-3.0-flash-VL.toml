# Sources: https://developer.ant-ling.com/en/docs/models/ling/#ling-30-flash-vl
# Pricing: https://developer.ant-ling.com/en/docs/models/price (accessed 2026-10-30); CNY prices: 0.14 input, 0.42 output, 0.028 cache read
# CNY→USD rate: 6.6666666667, 2026-10-30, source: https://open.er-api.com/v6/latest/USD
# Toggle: `thinking.type = "enabled" | "disabled"` (default: enabled).
# Tools/cache: strict tool calling, tool_choice and implicit caching are live on both
#   chat-completions and messages; not yet documented on the pages above.
# VL pricing: this endpoint bills VL on the same Ling-3.0-flash row above (0.14 / 0.42 / 0.028 CNY).
#   OpenRouter's separate VL pricing is a different host and is not evidence for this endpoint.
# Modalities: `input` narrows the base image/video types to the formats the Ant Ling API accepts;
#   `output = ["text"]` must stay because the schema requires it whenever [modalities] is present.
schema = 2
base_model = "inclusionai/ling-3.0-flash-vl"

[modalities]
input = [
  "text", 
  "image/jpeg",
  "image/png", 
  "video/mp4",
  "video/quicktime",
  "video/x-ms-wmv"
]
output = ["text"]

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "none", "required"] }
reasoning = { supported = true, toggle = true, default = { type = "toggle", value = true } }
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.messages]
base_url = "https://api.ant-ling.com/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.021
cache = { read = 0.0042 }

[cost.text.output]
price = 0.063
