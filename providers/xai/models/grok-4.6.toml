# Sources: https://docs.x.ai/developers/models/grok-4.6 and https://docs.x.ai/developers/pricing
base_model = "xai/grok-4.6"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[experimental.modes.fast]
provider = { body = { service_tier = "priority" } }

[experimental.modes.fast.cost]
input = 4
output = 12
cache_read = 1

[cost]
input = 2
output = 6
cache_read = 0.5

[[cost.tiers]]
tier = { type = "context", size = 200_000 }
input = 4
output = 12
cache_read = 1

[modalities]
input = ["text", "image", "pdf"]
