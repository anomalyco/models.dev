# Image and video MIME types: https://docs.x.ai/developers/rest-api-reference/inference/videos (image inputs JPEG, PNG or WebP; video inputs and generated videos are .mp4)
# API: POST https://api.x.ai/v1/videos/generations (https://docs.x.ai/developers/rest-api-reference/inference/videos.md).
schema = 2
type = "video"
name = "Grok Imagine Video"
description = "Image model for prompt-driven generation, editing, and visual design workflows"
family = "grok"
open_weights = false
release_date = "2026-01-28"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp", "video/mp4"]
output = ["video/mp4"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 1_024
output = 0

[api.videos]
sdk = { opencodeai = "@opencode/ai/protocols/xai-video" }
