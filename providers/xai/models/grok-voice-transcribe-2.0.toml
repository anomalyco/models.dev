# Sources:
# - https://docs.x.ai/developers/models/grok-voice-transcribe-2.0
# - https://docs.x.ai/developers/model-capabilities/audio/speech-to-text
# - https://docs.x.ai/developers/pricing (Speech to Text: $0.10/hr REST, $0.20/hr streaming)
# REST POST /v1/stt and streaming wss://api.x.ai/v1/stt; default STT model.
# Not listed by the models endpoints, so xAI sync keeps this file as authored.
# API: POST https://api.x.ai/v1/stt (https://docs.x.ai/developers/rest-api-reference/inference/voice.md).
# Pricing (accessed 2026-11-12): https://docs.x.ai/developers/pricing (Speech to Text: $0.10 / hr REST = $0.0016667 / min, $0.20 / hr streaming = $0.0033333 / min)
schema = 2
v2_only = true
base_model = "xai/grok-voice-transcribe-2.0"

[api.transcriptions]
sdk = { opencodeai = "none" }

[cost.audio.input]
unit = "minute"
price = 0.0016667

[[cost.audio.input.overrides]]
when = { websocket = { equals = true } }
price = 0.0033333
