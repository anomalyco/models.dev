# Reasoning: none forwarded. This host rebuilds each deepinfra request from a
# fixed parameter map and sends nothing else: frequency_penalty,
# max_completion_tokens, max_tokens, messages, model, n, presence_penalty, stop,
# stream, stream_options, temperature, tool_choice, tools, top_p. It has no
# reasoning_effort and no thinking field.
# https://platform.hopscotchlabs.ai/models
base_model = "moonshotai/kimi-k2.6"
reasoning_options = []

[cost]
input = 0.75
output = 3.5

[limit]
output = 16_384
