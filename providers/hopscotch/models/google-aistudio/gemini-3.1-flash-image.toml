# Effort: reasoning_effort = minimal|high
# https://platform.hopscotchlabs.ai/models
base_model = "google/gemini-3.1-flash-image"

[[reasoning_options]]
type = "effort"
values = ["minimal", "high"]

[cost]
input = 0.5
output = 60
cache_read = 0.5
cache_write = 0.5

[limit]
context = 65_536
output = 65_536
