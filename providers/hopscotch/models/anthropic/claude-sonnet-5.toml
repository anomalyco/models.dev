# Toggle: thinking.type = enabled|disabled
# Effort: not forwarded. The anthropic parameter map sends thinking and no
# reasoning_effort or output_config, so only the controls below can travel.
# https://platform.hopscotchlabs.ai/models
base_model = "anthropic/claude-sonnet-5"
structured_output = true

[[reasoning_options]]
type = "toggle"

[cost]
input = 2
output = 10
cache_read = 0.2
cache_write = 2.5
