# https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-nvidia-nvidia-nemotron-nano-12b-v2-vl-bf16.html
# https://aws.amazon.com/bedrock/pricing/ (US Standard pricing)
# Live 2026-09-09: maxTokens=8192 accepted; reasoning_config=high returned no reasoningContent.
# Live Converse 2026-09-23: maxTokens at the Bedrock ceiling returned
# "maximum context length is 131072 tokens" from the serving backend.
# Service tiers: priority|flex (Converse serviceTier.type; Mantle service_tier), per model card + live 2026-10-19. Prices: AmazonBedrock us-east-1 price list (1.75x/0.5x; exact SKU prices where AWS rounds).
schema = 2
base_model = "nvidia/nemotron-nano-12b-v2-vl"
name = "NVIDIA Nemotron Nano 12B v2 VL BF16"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = false }
structured_output = true
service_tier = ["flex", "priority"]

[limit]
context = 131_072
output = 8_192

[cost.text.input]
price = 0.2

[cost.text.output]
price = 0.6

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.75

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.5
