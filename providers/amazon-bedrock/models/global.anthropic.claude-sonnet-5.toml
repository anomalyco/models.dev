# Sources: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-sonnet-5.html
# https://platform.claude.com/docs/en/build-with-claude/thinking-troubleshooting
# API: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Converse.html
# Live US/global Sonnet 5 schema probes, 2026-09-09: outputConfig.textFormat rejected (output_config.format: Extra inputs are not permitted).
# Toggle: additionalModelRequestFields.thinking.type = adaptive|disabled (Converse); thinking.type (InvokeModel).
# Effort: additionalModelRequestFields.output_config.effort (Converse); output_config.effort (InvokeModel).
# v2 cache: cachePoint (ttl "1h" where listed) per https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html; 1h write = 2x input (AmazonBedrockFoundationModels price list). No implicit hits seen live (2026-10-19).
# Mid-conversation (Converse, live 2026-10-19): role "system" messages and toolAddition/toolRemoval blocks (with anthropic_beta mid-conversation-tool-changes-2026-07-01) per https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Message.html; Converse messages carry no per-turn outputConfig (dropped), so no effort updates.
schema = 2
base_model = "anthropic/claude-sonnet-5"
name = "Claude Sonnet 5 (Global)"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = false
system_updates = true
effort_updates = false
cache = { supported = true, explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 1_024 } }

[cost.text.input]
price = 2
cache = { read = 0.2, write = { "5m" = 2.5, "1h" = 4 } }

[cost.text.output]
price = 10
