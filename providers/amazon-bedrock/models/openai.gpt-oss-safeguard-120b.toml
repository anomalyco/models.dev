# Model ID, Runtime Converse support and limits: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-oss-safeguard-120b.html
# Standard US East (N. Virginia) pricing: https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrock/current/us-east-1/index.json
# Native reasoning controls: https://huggingface.co/openai/gpt-oss-safeguard-120b
# Effort: additionalModelRequestFields.reasoning_effort = low|medium|high, following the GPT-OSS Converse request mapping.
# https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-openai.html
# Live Converse check 2026-09-09 (us-east-1): reasoning_effort=low returns reasoningContent.
# Service tiers: priority|flex (Converse serviceTier.type; Mantle service_tier), per model card + live 2026-10-19. Prices: AmazonBedrock us-east-1 price list (1.75x/0.5x; exact SKU prices where AWS rounds).
# Mid-conversation (Converse): AWS documents system-role messages and tool changes for Claude only (https://docs.aws.amazon.com/bedrock/latest/userguide/claude-messages-mid-conversation-system.html); live 2026-10-19 this model rejects them ("This model doesn't support system messages"). No per-turn effort on Converse.
# APIs: Bedrock Mantle (https://docs.aws.amazon.com/bedrock/latest/userguide/bedrock-mantle.html) lists this ID in GET /v1/models; the listed Mantle APIs answered live in us-east-1 on 2026-10-23 (/v1 for open-weight models, /openai/v1 for OpenAI, xAI and Gemma 4, /anthropic/v1 for Claude).
# tools.strict: Converse toolSpec.strict (structured outputs: https://docs.aws.amazon.com/bedrock/latest/userguide/structured-output.html); the model card lists Structured outputs on bedrock-runtime: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-oss-safeguard-120b.html
#   Mantle Chat Completions has no documented strict tool use: the structured outputs page lists Converse, InvokeModel and Mantle's Anthropic Messages
#   as supported APIs, not Mantle Chat Completions, so strict sits on [api.converse] only.
schema = 2
base_model = "openai/gpt-oss-safeguard-120b"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
service_tier = ["flex", "priority"]

[limit]
context = 128_000
output = 16_384

[api.converse]
capabilities = { tools = { strict = true } }

[api.chat-completions]
base_url = "https://bedrock-mantle.${AWS_REGION}.api.aws/v1"
sdk = { aisdk = "@ai-sdk/amazon-bedrock/mantle", opencodeai = "@opencode/ai/providers/amazon-bedrock/mantle/chat" }

[cost.text.input]
price = 0.15

[[cost.text.input.overrides]]
when = { service_tier = { equals = "priority" } }
price = 0.26

[[cost.text.input.overrides]]
when = { service_tier = { equals = "flex" } }
price = 0.07

[cost.text.output]
price = 0.6

[[cost.text.output.overrides]]
when = { service_tier = { equals = "priority" } }
price = 1.05

[[cost.text.output.overrides]]
when = { service_tier = { equals = "flex" } }
price = 0.3
