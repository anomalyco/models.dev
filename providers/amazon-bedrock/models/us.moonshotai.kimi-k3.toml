# Sources: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-moonshot-ai-kimi-k3.html
# https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
# US CRIS standard pricing; cache_write is the 30-minute rate.
# Reasoning is always on; no Bedrock Converse effort control is documented or verified.
# Live Converse 2026-09-23: reasoning_effort accepted invalid strings, numbers,
# and objects exactly like an unrelated unknown field; low/max probes showed no
# verified effect. The bare model ID was rejected; an inference profile is required.
# Global and US profiles returned reasoningContent.
# Bedrock supports text and image input, but not the base model's video input.
# Live Converse 2026-09-23: maxTokens=128000 accepted; 128001 rejected with
# "exceeds the model limit of 128000".
# v2 cache: implicit per the model card; cache reads verified live on Converse 2026-10-19 (explicit cachePoint unsupported on Converse).
# Service tiers: priority|flex (Converse serviceTier.type; Mantle service_tier), per model card + live 2026-10-19. Prices: AmazonBedrock us-east-1 price list (1.75x/0.5x; exact SKU prices where AWS rounds).
# Mid-conversation (Converse): AWS documents system-role messages and tool changes for Claude only (https://docs.aws.amazon.com/bedrock/latest/userguide/claude-messages-mid-conversation-system.html); live 2026-10-19 this model rejects them ("This model doesn't support system messages"). No per-turn effort on Converse.
# Modalities: Converse image blocks are png|jpeg|gif|webp (https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_ImageBlock.html); the model card says Bedrock does not support video input for Kimi K3.
# tools.strict: Converse toolSpec.strict (structured outputs: https://docs.aws.amazon.com/bedrock/latest/userguide/structured-output.html); the model card lists Structured outputs on bedrock-runtime: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-moonshot-ai-kimi-k3.html
schema = 2
base_model = "moonshotai/kimi-k3"
name = "Kimi K3 (US)"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true, strict = true }
reasoning = { supported = true }
structured_output = true
cache = { implicit = true }
service_tier = ["flex", "priority"]

[limit]
output = 128_000

[api.converse]
legacy_interleaved = true

[cost.text.input]
price = 3.3
cache = { read = 0.33, write = { "30m" = 4.125 } }

[cost.text.output]
price = 16.5

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.75

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.5
