# EU cross-Region profile verified by ListInferenceProfiles (eu-west-1, 2026-09-08).
# Pricing: https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrock/current/eu-west-1/index.json
# Standard eu-west-1 reference rates, USD/MTok; rates vary by source Region. Cache writes billed at input rate; no surcharge.
# Cache billing: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html
# Reasoning: https://docs.aws.amazon.com/nova/latest/nova2-userguide/extended-thinking.html
# Toggle: additionalModelRequestFields.reasoningConfig.type = enabled|disabled (Converse).
# Effort: additionalModelRequestFields.reasoningConfig.maxReasoningEffort = low|medium|high.
# High effort requires omitting temperature, topP, topK, and maxTokens.
# Bedrock output cap: US Converse boundary check (2026-09-09) accepts 65,535 and rejects 65,536.
# Lab specs: https://docs.aws.amazon.com/nova/latest/nova2-userguide/what-is-nova-2.html
# v2 cache: implicit for all text prompts; explicit cachePoint in system/messages, 5m TTL, 4 checkpoints per https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html; its "1K" minimum is approximate (981-token write live), so no min_tokens.
# Structured outputs: Converse rejects outputConfig ("This model doesn't support the outputConfig field", live 2026-10-19).
# Service tiers: priority|flex (Converse serviceTier.type; Mantle service_tier), per model card + live 2026-10-19. Prices: AmazonBedrock us-east-1 price list (1.75x/0.5x; exact SKU prices where AWS rounds).
# Mid-conversation (Converse): AWS documents system-role messages and tool changes for Claude only (https://docs.aws.amazon.com/bedrock/latest/userguide/claude-messages-mid-conversation-system.html); live 2026-10-19 this model rejects them ("This model doesn't support system messages"). No per-turn effort on Converse.
# Modalities: Converse images png|jpeg|gif|webp (https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_ImageBlock.html); video MP4, MOV, MKV, WebM, FLV, MPEG/MPG, WMV, 3GP (https://docs.aws.amazon.com/nova/latest/userguide/modalities-video.html);
# documents PDF, CSV, TXT, HTML, Markdown (https://docs.aws.amazon.com/nova/latest/userguide/modalities-document.html). DOC/DOCX/XLS/XLSX are also supported but have no v1 modality, so they are left out.
# tools.choice: Converse toolChoice auto/any/tool (no none on Converse): https://docs.aws.amazon.com/nova/latest/userguide/tool-choice.html
schema = 2
base_model = "amazon/nova-2-lite"
name = "Nova 2 Lite (EU)"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "video/mp4", "video/quicktime", "video/x-matroska", "video/webm", "video/x-flv", "video/mpeg", "video/x-ms-wmv", "video/3gpp", "application/pdf", "text/csv", "text/plain", "text/html", "text/markdown"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "required", "tool"] }
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high"] }
structured_output = false
cache = { implicit = true, explicit = { ttl = ["5m"], max_breakpoints = 4, targets = ["system", "messages"] } }
service_tier = ["flex", "priority"]

[limit]
output = 65_535

[cost.text.input]
price = 0.374
cache = { read = 0.0935, write = 0.374 }

[cost.text.output]
price = 3.157

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.75

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.5
