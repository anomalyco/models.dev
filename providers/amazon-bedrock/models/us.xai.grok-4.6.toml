# https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-xai-grok-4-6.html
# Runtime Converse profile; Geo CRIS Standard pricing. Structured outputs are Mantle-only.
# Effort: additionalModelRequestFields.reasoning.effort = low|medium|high|xhigh.
# Live 2026-09-09: nested effort=high returns reasoningContent; maxTokens=500000 accepted.
# v2 cache: implicit per the model card; cache reads verified live on Converse 2026-10-19 (explicit cachePoint unsupported on Converse).
# Mid-conversation (Converse): AWS documents system-role messages and tool changes for Claude only (https://docs.aws.amazon.com/bedrock/latest/userguide/claude-messages-mid-conversation-system.html); live 2026-10-19 this model rejects them ("This model doesn't support system messages"). No per-turn effort on Converse.
# Service tiers: the model card's priority/flex apply to Mantle; Converse rejects both live (2026-10-19), so none are set on this profile.
schema = 2
base_model = "xai/grok-4.6"
name = "Grok 4.6 (US)"
last_updated = "2026-08-18"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = false
cache = { implicit = true }

[cost.text.input]
price = 2.2
cache = { read = 0.55 }

[cost.text.output]
price = 6.6
