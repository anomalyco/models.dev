# https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-minimax-minimax-m2-1.html
# https://aws.amazon.com/bedrock/pricing/ (US Standard pricing)
# MiniMax M2.1 has always-on thinking, matching the first-party API.
# Live Converse 2026-09-11: reasoningContent returned and outputConfig.textFormat enforced a JSON schema.
# Live Converse 2026-09-23: maxTokens at the Bedrock ceiling returned
# "maximum context length is 196608 tokens" from the serving backend.
# Service tiers: priority|flex (Converse serviceTier.type; Mantle service_tier), per model card + live 2026-10-19. Prices: AmazonBedrock us-east-1 price list (1.75x/0.5x; exact SKU prices where AWS rounds).
# Mid-conversation (Converse, live 2026-10-19): role "system" messages are rejected ("This model doesn't support system messages"), so no tool updates either; Converse has no per-turn effort.
schema = 2
base_model = "minimax/MiniMax-M2.1"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
structured_output = true
system_updates = false
effort_updates = false
service_tier = ["flex", "priority"]

[limit]
context = 196_608

[api.converse]
compatibility = { replay_reasoning = true }

[cost.text.input]
price = 0.3

[cost.text.output]
price = 1.2

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.75

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.5
