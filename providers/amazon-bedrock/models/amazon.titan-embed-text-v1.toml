# Model card (in-region only; InvokeModel): https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-amazon-titan-embeddings-g1---text.html
# Pricing: https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrock/current/us-east-1/index.json (USE1-TitanEmbeddingsG1-Text-input-tokens, $0.0001 per 1K tokens)
# API: InvokeModel (POST /model/{modelId}/invoke, the model's own JSON body): https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_InvokeModel.html
#   @ai-sdk/amazon-bedrock's embedding model calls InvokeModel for Titan, Cohere and Nova embeddings; @opencode/ai's Bedrock provider only routes Converse.
schema = 2
v2_only = true
base_model = "amazon/titan-embed-text-v1"

[api.invoke-model]
sdk = { opencodeai = "none" }

[cost.text.input]
price = 0.1
