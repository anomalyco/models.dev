# Sources: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-haiku-5-5.html
# https://platform.claude.com/docs/en/about-claude/pricing
# Geo inference ID au.anthropic.claude-haiku-5-5; Bedrock regional endpoints carry a 10% premium over global endpoints.
# Toggle: additionalModelRequestFields.thinking.type = adaptive|disabled (Converse); thinking.type (InvokeModel) — disabled only at high effort or below.
# Effort: additionalModelRequestFields.output_config.effort (Converse); output_config.effort (InvokeModel) — low, medium, high, xhigh, max; default medium.
# Structured outputs not supported on Bedrock runtime.
# v2 cache: cachePoint (ttl "1h" where listed) per https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html; 1h write = 2x input (AmazonBedrockFoundationModels price list). No implicit hits seen live (2026-10-19).
# Mid-conversation (Converse): role "system" messages (https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Message.html) on Opus 4.8 and the Claude 5 family (https://docs.aws.amazon.com/bedrock/latest/userguide/claude-messages-mid-conversation-system.html).
# Per-turn effort: left out. This file only lists Converse, where a per-message output_config is silently dropped and only a top-level effort change exists, which doesn't count. The in-history effort message (a per-turn system message carrying output_config, https://docs.aws.amazon.com/bedrock/latest/userguide/claude-messages-adaptive-thinking.html) needs InvokeModel or Mantle Messages, which this file doesn't list.
# tools.updates: left out. This file only lists Converse, which has no field for tool_addition/tool_removal; AWS documents mid-conversation tool changes only for the Anthropic Messages body (InvokeModel, Mantle Messages). The 2026-10-19 Converse test only worked by passing the blocks and beta through additionalModelRequestFields, which isn't a documented Converse feature.
# tools.strict: Converse toolSpec.strict (structured outputs: https://docs.aws.amazon.com/bedrock/latest/userguide/structured-output.html); the model card lists Structured outputs on bedrock-runtime: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-haiku-5-5.html
# tools.choice: Converse toolChoice auto/any/tool, no none (https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_ToolChoice.html); Claude takes any and tool: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-anthropic-claude-messages-tool-use.html
# tools.search: left out. Bedrock offers the tool search tool through InvokeModel only, not Converse: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-anthropic-claude-messages-tool-use.html#model-parameters-anthropic-claude-tool-search-tool
schema = 2
base_model = "anthropic/claude-haiku-5-5"
name = "Claude Haiku 5.5 (AU)"

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "required", "tool"] }
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
system_updates = true
cache = { explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 512 } }

[cost.text.input]
price = 0.11
cache = { read = 0.011, write = { "5m" = 0.1375, "1h" = 0.22 } }

[[cost.text.input.overrides]]
when = { context = { gt = 100_000 } }
price = 0.55
cache = { read = 0.055, write = { "5m" = 0.6875, "1h" = 1.1 } }

[cost.text.output]
price = 0.55

[[cost.text.output.overrides]]
when = { context = { gt = 100_000 } }
price = 2.75
