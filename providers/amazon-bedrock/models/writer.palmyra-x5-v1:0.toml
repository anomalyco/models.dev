# https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-palmyra-x5.html
# https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-writer-palmyra-x5.html
# https://aws.amazon.com/bedrock/pricing/ — us-east-1 standard, USD per 1M tokens.
# Bedrock accepts text only and documents no caller-selectable reasoning control.
schema = 2
base_model = "writer/palmyra-x5"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
reasoning = { supported = true }

[limit]
context = 1_040_000
input = 1_040_000

[cost.text.input]
price = 0.6

[cost.text.output]
price = 6
