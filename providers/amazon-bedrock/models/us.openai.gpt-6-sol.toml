# US cross-Region inference profile — served by Bedrock core (Converse), not Mantle, so no [api] override.
# Profile ID verified via ListInferenceProfiles (ACTIVE) on 2026-09-22; AWS has not published a GPT-6 Sol model card yet.
# Geo CRIS pricing = OpenAI API list rates + AWS's 10% fee (as stated on the GPT-6 Astra card): https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-6-astra.html
# Converse effort: additionalModelRequestFields.reasoning.effort = none|low|medium|high|xhigh|max (Bedrock's validation error on the Luna twin lists these; matches OpenAI-native Sol).
# Live Converse check 2026-09-22 (eu-west-1, global profile): tool call + tool-result round trip; effort low/xhigh/max accepted.
# v2 cache: Converse supports implicit caching only (cachePoint unsupported) per https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html and the model card; implicit write/read verified live 2026-10-19.
schema = 2
base_model = "openai/gpt-6-sol"
name = "GPT-6 Sol (US)"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { supported = true, implicit = { min_tokens = 1_024 }, explicit = false }

[cost.text.input]
price = 2.2
cache = { read = 0.22, write = { "30m" = 2.75 } }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 4.4
cache = { read = 0.44, write = { "30m" = 5.5 } }

[cost.text.output]
price = 11

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 16.5
