# India cross-Region inference profile served by Bedrock Runtime (Converse).
# Exact ID, ap-south-1/ap-south-2 availability, Geo CRIS prices and capabilities: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-56-luna.html
# Bedrock 1,050,000-token context: https://developers.openai.com/api/docs/guides/amazon-bedrock
# Effort follows the native model and existing Runtime profiles: https://developers.openai.com/api/docs/models/gpt-5.6-luna
# Cache rates: AWS-published Responses pricing; the card's API coverage can lag live behavior.
# Converse effort: additionalModelRequestFields.reasoning.effort = none|low|medium|high|xhigh|max; reasoning_effort is rejected.
# Live check 2026-09-09 (ap-south-1): nested reasoning.effort=none returns 200.
# v2 cache: Converse supports implicit caching only (cachePoint unsupported) per https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html and the model card; implicit write/read verified live 2026-10-19.
# Mid-conversation (Converse): AWS documents system-role messages and tool changes for Claude only (https://docs.aws.amazon.com/bedrock/latest/userguide/claude-messages-mid-conversation-system.html); live 2026-10-19 this model rejects them ("This model doesn't support system messages"). No per-turn effort on Converse.
schema = 2
base_model = "openai/gpt-5.6-luna"
name = "GPT-5.6 Luna (India)"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = { min_tokens = 1_024 } }

[cost.text.input]
price = 0.22
cache = { read = 0.022, write = { "30m" = 0.275 } }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 0.44
cache = { read = 0.044, write = { "30m" = 0.55 } }

[cost.text.output]
price = 1.32

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 1.98
