# https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-palmyra-x5.html
# https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-writer-palmyra-x5.html
# https://aws.amazon.com/bedrock/pricing/ — us-east-1 standard, USD per 1M tokens.
# Bedrock accepts text only and documents no caller-selectable reasoning control.
# Structured outputs: Converse rejects outputConfig ("This model doesn't support the outputConfig field", live 2026-10-19).
# Mid-conversation (Converse): AWS documents system-role messages and tool changes for Claude only (https://docs.aws.amazon.com/bedrock/latest/userguide/claude-messages-mid-conversation-system.html); live 2026-10-19 this model rejects them ("This model doesn't support system messages"). No per-turn effort on Converse.
# Status: Legacy 2026-09-21, EOL 2027-03-21 per https://docs.aws.amazon.com/bedrock/latest/userguide/model-lifecycle.html.
schema = 2
base_model = "writer/palmyra-x5"
name = "Palmyra X5 (US)"
status = "deprecated"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
structured_output = false

[limit]
context = 1_040_000
input = 1_040_000

[cost.text.input]
price = 0.6

[cost.text.output]
price = 6
