# https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-deepseek-deepseek-v3-1.html
# Runtime ID; Mantle uses deepseek.v3.1. Prices are US Standard.
# Toggle: additionalModelRequestFields.reasoning_config = "high"; omit for default mode, matching V3.2.
# Live 2026-09-09: high returns reasoningContent; maxTokens=81920 accepted (card's 8K is not the cap).
# Service tiers: priority|flex (Converse serviceTier.type; Mantle service_tier), per model card + live 2026-10-19. Prices: AmazonBedrock us-east-1 price list (1.75x/0.5x; exact SKU prices where AWS rounds).
# Mid-conversation (Converse): AWS documents system-role messages and tool changes for Claude only (https://docs.aws.amazon.com/bedrock/latest/userguide/claude-messages-mid-conversation-system.html); live 2026-10-19 this model rejects them ("This model doesn't support system messages"). No per-turn effort on Converse.
# Status: Legacy 2026-09-30, EOL 2027-03-30 per https://docs.aws.amazon.com/bedrock/latest/userguide/model-lifecycle.html.
schema = 2
base_model = "deepseek/deepseek-v3.1"
last_updated = "2025-09-18"
status = "deprecated"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true }
structured_output = true
system_updates = false
effort_updates = false
service_tier = ["flex", "priority"]

[limit]
context = 163_840
output = 81_920

[api.converse]
compatibility = { replay_reasoning = true }

[cost.text.input]
price = 0.58

[cost.text.output]
price = 1.68

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.75

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.5
