# Sources: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-sonnet-4-5.html
# https://platform.claude.com/docs/en/build-with-claude/thinking-troubleshooting
# Pricing: https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrockFoundationModels/current/ap-northeast-1/index.json
# JP source ap-northeast-1: regional on-demand USD/MTok; cache_write is the 5-minute rate.
# Toggle: additionalModelRequestFields.thinking.type = enabled|disabled (Converse); thinking.type (InvokeModel).
# Budget: additionalModelRequestFields.thinking.budget_tokens (Converse); thinking.budget_tokens (InvokeModel).
# v2 cache: cachePoint (ttl "1h" where listed) per https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html; 1h write = 2x input (AmazonBedrockFoundationModels price list). No implicit hits seen live (2026-10-19).
# Mid-conversation (Converse, live 2026-10-19): role "system" messages and toolAddition/toolRemoval blocks (with anthropic_beta mid-conversation-tool-changes-2026-07-01) per https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Message.html; Converse messages carry no per-turn outputConfig (dropped), so no effort updates.
schema = 2
base_model = "anthropic/claude-sonnet-4-5-20250929"
name = "Claude Sonnet 4.5 (JP)"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true, budget = { min = 1_024 } }
structured_output = true
system_updates = false
effort_updates = false
cache = { supported = true, explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 1_024 } }

[cost.text.input]
price = 3.3
cache = { read = 0.33, write = { "5m" = 4.125, "1h" = 6.6 } }

[cost.text.output]
price = 16.5
