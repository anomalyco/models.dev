# v2 cache: cachePoint (ttl "1h" where listed) per https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html; 1h write = 2x input (AmazonBedrockFoundationModels price list). No implicit hits seen live (2026-10-19).
# Mid-conversation (Converse): role "system" messages (https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Message.html) on Opus 4.8 and the Claude 5 family (https://docs.aws.amazon.com/bedrock/latest/userguide/claude-messages-mid-conversation-system.html);
# toolAddition/toolRemoval by reference with anthropic_beta mid-conversation-tool-changes-2026-07-01 (https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-anthropic-claude-messages-tool-use.html).
# Per-turn effort is a system-message output_config on InvokeModel only (https://docs.aws.amazon.com/bedrock/latest/userguide/claude-messages-adaptive-thinking.html); a Converse Message has no such field, so effort_updates = false.
# APIs: Bedrock Mantle (https://docs.aws.amazon.com/bedrock/latest/userguide/bedrock-mantle.html) lists this ID in GET /v1/models; the listed Mantle APIs answered live in us-east-1 on 2026-10-23 (/v1 for open-weight models, /openai/v1 for OpenAI, xAI and Gemma 4, /anthropic/v1 for Claude).
# Per-API flags: tools.updates sits on [api.messages] (Mantle Messages / InvokeModel), where AWS documents tool_addition/tool_removal. Converse has no documented tool change block; it only worked by passing the beta and deferred tools through additionalModelRequestFields. system_updates stays top-level: Converse documents role "system" messages and the Messages API documents mid-conversation system messages.
# tools.strict: Converse toolSpec.strict (structured outputs: https://docs.aws.amazon.com/bedrock/latest/userguide/structured-output.html); the model card lists Structured outputs on bedrock-runtime: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-fable-5.html
# tools.choice: Converse toolChoice auto/any/tool, no none (https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_ToolChoice.html); Claude takes any and tool: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-anthropic-claude-messages-tool-use.html
# tools.search: on [api.messages] only. AWS documents the tool search tool through InvokeModel, not Converse (https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-anthropic-claude-messages-tool-use.html#model-parameters-anthropic-claude-tool-search-tool); Mantle Messages ran tool_search_tool_regex_20251119 with deferred tools live on Opus 4.7, 4.8, 5, 5.5 and Sonnet 5 (2026-10-26); Fable 5 is in Anthropic's tool search model table.
# Per-API tools.choice: Mantle Messages takes Anthropic's tool_choice, including none (live 2026-10-26 on the other Claude models here; Fable 5 itself returned "data retention mode 'default' is not available for this model" for the test account), so choice is set per API: Converse's list on [api.converse], the same plus none on [api.messages]. Strict tools hold on both APIs (Mantle Messages rejected a strict schema without additionalProperties: false; structured outputs list Mantle Messages: https://docs.aws.amazon.com/bedrock/latest/userguide/structured-output.html).
schema = 2
base_model = "anthropic/claude-fable-5"

[capabilities]
tools = { supported = true, strict = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
system_updates = true
cache = { explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 512 } }

[api.converse]
capabilities = { tools = { choice = ["auto", "required", "tool"] } }

[api.messages]
base_url = "https://bedrock-mantle.${AWS_REGION}.api.aws/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/amazon-bedrock/mantle/messages" }
capabilities = { tools = { updates = true, choice = ["auto", "none", "required", "tool"], search = true } }

[cost.text.input]
price = 10
cache = { read = 1, write = { "5m" = 12.5, "1h" = 20 } }

[cost.text.output]
price = 50
