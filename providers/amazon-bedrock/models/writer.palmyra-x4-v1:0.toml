# https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-palmyra-x4.html
# https://aws.amazon.com/bedrock/pricing/ — us-east-1 standard, USD per 1M tokens.
# Bedrock's documented request has no caller-selectable reasoning control.
# Structured outputs: Converse rejects outputConfig ("This model doesn't support the outputConfig field", live 2026-10-19).
# Mid-conversation (Converse, live 2026-10-19): role "system" messages are rejected ("This model doesn't support system messages"), so no tool updates either; Converse has no per-turn effort.
schema = 2
base_model = "writer/palmyra-x4"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
structured_output = false
system_updates = false
effort_updates = false

[limit]
context = 122_880
output = 8_192

[cost.text.input]
price = 2.5

[cost.text.output]
price = 10
