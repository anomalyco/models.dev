# https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-google-gemma-4-26b-a4b.html
# https://github.com/aws-samples/bedrock-claude-chatbot/blob/eeb2fa35339081d34ea9caa4e4d39cf1c189770a/agent/chat_agent.py
# Effort: reasoning.effort = none|high on Mantle Responses, matching the Gemma 4 31B surface.
# Live 2026-09-09: high returns reasoning; strict JSON schema and max_output_tokens=32768 accepted.
# https://aws.amazon.com/bedrock/pricing/ (US Standard pricing)
# Service tiers: priority|flex (Converse serviceTier.type; Mantle service_tier), per model card + live 2026-10-19. Prices: AmazonBedrock us-east-1 price list (1.75x/0.5x; exact SKU prices where AWS rounds).
# Mid-conversation (Mantle Responses, live 2026-10-19): system/developer messages accepted; configuration_update rejected ("not supported with this model"); additional_tools accepted.
# Modalities: the model card lists image and video input on Mantle (Responses / Chat Completions) and Bedrock names no formats.
# Image MIME types are the base model's (Gemini API formats). `video` stays generic: neither Bedrock nor Google's Gemma docs name a video format.
schema = 2
base_model = "google/gemma-4-26b-a4b-it"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "video"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = true }
reasoning = { supported = true, effort = ["none", "high"] }
structured_output = true
system_updates = true
effort_updates = false
service_tier = ["flex", "priority"]

[api.responses]
base_url = "https://bedrock-mantle.${AWS_REGION}.api.aws/openai/v1"
sdk = { aisdk = "@ai-sdk/amazon-bedrock/mantle", opencodeai = "@opencode/ai/providers/amazon-bedrock/mantle/responses" }

[cost.text.input]
price = 0.13

[cost.text.output]
price = 0.4

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.75

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.5
