# US cross-Region inference profile — served by Bedrock core (Converse), not Mantle, so no [api] override.
# Profile ID verified via ListInferenceProfiles from us-east-1 and ca-central-1.
# Geo CRIS pricing (= in-region): https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-56-terra.html
# Cache rates: AWS-published Responses pricing; the card's API coverage can lag live behavior.
# Converse effort: additionalModelRequestFields.reasoning.effort = none|low|medium|high|xhigh|max.
# Effort levels incl. "none" verified on the Global twin: global.openai.gpt-5.6-terra.toml
# v2 cache: Converse supports implicit caching only (cachePoint unsupported) per https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html and the model card; implicit write/read verified live 2026-10-19.
# Mid-conversation (Converse): AWS documents system-role messages and tool changes for Claude only (https://docs.aws.amazon.com/bedrock/latest/userguide/claude-messages-mid-conversation-system.html); live 2026-10-19 this model rejects them ("This model doesn't support system messages"). No per-turn effort on Converse.
# Structured outputs: Converse json_schema via outputConfig.textFormat plus additionalModelRequestFields.text.format.strict (model card "JSON Schema output on bedrock-runtime"); enforced live 2026-10-19.
# Modalities: Converse image blocks are png|jpeg|gif|webp (https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_ImageBlock.html); the model card says Converse rejects document blocks, so no application/pdf here.
schema = 2
base_model = "openai/gpt-5.6-terra"
base_model_omit = ["cost.context_over_200k", "experimental.modes.fast"]
name = "GPT-5.6 Terra (US)"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = { min_tokens = 1_024 } }

[cost.text.input]
price = 2.2
cache = { read = 0.22, write = { "30m" = 2.75 } }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 4.4
cache = { read = 0.44, write = { "30m" = 5.5 } }

[cost.text.output]
price = 13.2

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 19.8
