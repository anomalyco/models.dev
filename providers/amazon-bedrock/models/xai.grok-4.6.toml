# Source: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-xai-grok-4-6.html
# Mantle Responses; US Standard in-Region pricing.
# Effort: reasoning.effort = low|medium|high|xhigh (always on).
# v2 cache: implicit per the model card (Mantle).
# Service tiers: priority|flex (Converse serviceTier.type; Mantle service_tier), per model card + live 2026-10-19. Prices: AmazonBedrock us-east-1 price list (1.75x/0.5x; exact SKU prices where AWS rounds).
# Mid-conversation (Mantle Responses, live 2026-10-19): system/developer messages accepted; configuration_update rejected ("not supported with this model"); additional_tools accepted.
schema = 2
base_model = "xai/grok-4.6"
last_updated = "2026-08-18"

[capabilities]
tools = { supported = true, updates = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
system_updates = true
effort_updates = false
cache = { supported = true, implicit = true, explicit = false }
service_tier = ["flex", "priority"]

[api.responses]
base_url = "https://bedrock-mantle.${AWS_REGION}.api.aws/openai/v1"
sdk = { aisdk = "@ai-sdk/amazon-bedrock/mantle" }

[cost.text.input]
price = 2.2
cache = { read = 0.55 }

[cost.text.output]
price = 6.6

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.75

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.5
