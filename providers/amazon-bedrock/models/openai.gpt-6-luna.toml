# Mantle in-region route (Responses API); the us./global. Converse profiles are separate files.
# Mantle lists openai.gpt-6-luna in us-east-1 only (GET /v1/models, 2026-09-23); AWS has not published a GPT-6 Luna model card yet.
# In-region pricing = OpenAI API list rates + AWS's 10% fee (as stated on the GPT-6 Astra card): https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-6-astra.html
# Effort: none|low|medium|high|xhigh|max (Mantle's own validation error lists these).
# Columns: input / 30m cache write / cache read / output (USD per 1M tokens)
base_model = "openai/gpt-6-luna"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 0.11
output = 0.55
cache_read = 0.011
cache_write = 0.1375

[[cost.tiers]]
tier = { size = 272_000 }
input = 0.22
output = 0.825
cache_read = 0.022
cache_write = 0.275

[provider]
npm = "@ai-sdk/amazon-bedrock/mantle"
api = "https://bedrock-mantle.${AWS_REGION}.api.aws/openai/v1"
shape = "responses"
