# EU cross-Region profile verified by ListInferenceProfiles (eu-west-1, 2026-09-08).
# Model: https://docs.aws.amazon.com/nova/latest/userguide/what-is-nova.html
# Pricing: https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrock/current/eu-west-1/index.json
# Standard eu-west-1 reference rates, USD/MTok; rates vary by source Region. Cache writes billed at input rate; no surcharge.
# Cache billing: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html
# v2 cache: cachePoint in system/messages, 5m TTL, 4 checkpoints per https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html; its "1K" minimum is approximate (981-token write live), so no min_tokens.
# Structured outputs: Converse rejects outputConfig ("This model doesn't support the outputConfig field", live 2026-10-19).
# Service tiers: priority|flex (Converse serviceTier.type; Mantle service_tier), per model card + live 2026-10-19. Prices: AmazonBedrock us-east-1 price list (1.75x/0.5x; exact SKU prices where AWS rounds).
# Mid-conversation (Converse): AWS documents system-role messages and tool changes for Claude only (https://docs.aws.amazon.com/bedrock/latest/userguide/claude-messages-mid-conversation-system.html); live 2026-10-19 this model rejects them ("This model doesn't support system messages"). No per-turn effort on Converse.
schema = 2
base_model = "amazon/nova-pro"
name = "Nova Pro (EU)"

[capabilities]
tools = { supported = true, updates = false }
structured_output = false
system_updates = false
cache = { supported = true, explicit = { ttl = ["5m"], max_breakpoints = 4, targets = ["system", "messages"] } }
service_tier = ["flex", "priority"]

[cost.text.input]
price = 0.92
cache = { read = 0.23, write = 0.92 }

[cost.text.output]
price = 3.68

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.75

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.5
