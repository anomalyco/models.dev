# Sources: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-moonshot-ai-kimi-k3.html
# https://platform.kimi.ai/docs/guide/use-thinking-models (K3 always reasons; reasoning_effort low/high/max, default max)
# https://platform.kimi.ai/docs/guide/use-reasoning-effort
# Bedrock GA 2026-09-18. In-Region entry mirrors Global CRIS standard pricing; cache_write is the 30-minute rate.
# Bedrock does not support video inputs for this model, unlike the base moonshotai/kimi-k3 entry.
# Effort: reasoning_effort = low|high|max (default max). Thinking is always on; no toggle.
base_model = "moonshotai/kimi-k3"
reasoning_options = [{ type = "effort", values = ["low", "high", "max"] }]

[cost]
input = 3.00
output = 15.00
cache_read = 0.30
cache_write = 3.75

[modalities]
input = ["text", "image"]
