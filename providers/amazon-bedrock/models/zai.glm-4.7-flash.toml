# https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-zai-glm-4-7-flash.html
# https://aws.amazon.com/bedrock/pricing/ (US Standard pricing)
# Toggle: additionalModelRequestFields.reasoning_config = "high"; omit for default mode, matching GLM-4.7.
# Live 2026-09-09: high returns reasoningContent; maxTokens=131072 accepted (card's 4K is not the cap).
# Live Converse 2026-09-23: maxTokens at the Bedrock ceiling returned
# "maximum context length is 202752 tokens" from the serving backend.
# Service tiers: priority|flex (Converse serviceTier.type; Mantle service_tier), per model card + live 2026-10-19. Prices: AmazonBedrock us-east-1 price list (1.75x/0.5x; exact SKU prices where AWS rounds).
# Mid-conversation (Converse, live 2026-10-19): role "system" messages are rejected ("This model doesn't support system messages"), so no tool updates either; Converse has no per-turn effort.
schema = 2
base_model = "zhipuai/glm-4.7-flash"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true }
structured_output = true
system_updates = false
effort_updates = false
service_tier = ["flex", "priority"]

[limit]
context = 202_752

[api.converse]
compatibility = { replay_reasoning = true }

[cost.text.input]
price = 0.07

[cost.text.output]
price = 0.4

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.75

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.5
