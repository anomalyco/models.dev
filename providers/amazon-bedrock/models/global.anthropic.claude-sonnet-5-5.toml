# Bedrock runtime serves on-demand traffic through the global inference profile (global.anthropic.claude-sonnet-5-5);
# geo profiles us./eu.anthropic.claude-sonnet-5-5 are also available. The bare ID is supported only through bedrock-mantle, not this provider.
# https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-sonnet-5-5.html
# Pricing and reasoning: https://platform.claude.com/docs/en/models/sonnet-5-5/overview
# Cache read $0.10/MTok (50% reduction effective 2026-10-07): https://aws.amazon.com/bedrock/pricing/
# https://www.anthropic.com/pricing and https://platform.claude.com/docs/en/about-claude/pricing#prompt-caching (5% of $2 input)
# Lowest thinking setting is between_tools, not disabled; no true off toggle.
schema = 2
base_model = "anthropic/claude-sonnet-5-5"
name = "Claude Sonnet 5.5 (Global)"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = false

[cost.text.input]
price = 2
cache = { read = 0.1, write = 2.5 }

[cost.text.output]
price = 10
