# Bedrock runtime serves on-demand traffic through the global inference profile (global.anthropic.claude-sonnet-5-5);
# geo profiles us./eu.anthropic.claude-sonnet-5-5 are also available. The bare ID is supported only through bedrock-mantle, not this provider.
# https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-sonnet-5-5.html
# Pricing and reasoning: https://platform.claude.com/docs/en/models/sonnet-5-5/overview
# Cache read $0.10/MTok (50% reduction effective 2026-10-07): https://aws.amazon.com/bedrock/pricing/
# https://www.anthropic.com/pricing and https://platform.claude.com/docs/en/about-claude/pricing#prompt-caching (5% of $2 input)
# Lowest thinking setting is between_tools, not disabled; no true off toggle.
# v2 cache: cachePoint (ttl "1h" where listed) per https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html; 1h write = 2x input (AmazonBedrockFoundationModels price list). No implicit hits seen live (2026-10-19).
# Mid-conversation (Converse): role "system" messages (https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Message.html) on Opus 4.8 and the Claude 5 family (https://docs.aws.amazon.com/bedrock/latest/userguide/claude-messages-mid-conversation-system.html);
# toolAddition/toolRemoval by reference with anthropic_beta mid-conversation-tool-changes-2026-07-01 (https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-anthropic-claude-messages-tool-use.html).
# Per-turn effort is a system-message output_config on InvokeModel only (https://docs.aws.amazon.com/bedrock/latest/userguide/claude-messages-adaptive-thinking.html); a Converse Message has no such field, so effort_updates = false.
# tools.updates: AWS's tool-changes list omits Sonnet 5.5; Anthropic's docs include it and Converse accepted toolRemoval live (2026-10-19).
schema = 2
base_model = "anthropic/claude-sonnet-5-5"
name = "Claude Sonnet 5.5 (Global)"

[capabilities]
tools = { supported = true, updates = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
system_updates = true
effort_updates = false
cache = { explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 512 } }

[cost.text.input]
price = 2
cache = { read = 0.1, write = { "5m" = 2.5, "1h" = 4 } }

[cost.text.output]
price = 10
