# Sources: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-moonshot-ai-kimi-k3.html
# India geographic cross-Region profile, available from ap-south-1 and ap-south-2.
# India CRIS standard pricing from the model card; cache_write is the 30-minute rate.
# Bedrock supports text and image input, but not the base model's video input.
# v2 cache: implicit per the model card; explicit cachePoint is unsupported on Converse.
# Service tiers: priority|flex per the model card (1.75x/0.5x of Standard).
# Modalities: Converse image blocks are png|jpeg|gif|webp (https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_ImageBlock.html); the model card says Bedrock does not support video input for Kimi K3.
# tools.strict: Converse toolSpec.strict (structured outputs: https://docs.aws.amazon.com/bedrock/latest/userguide/structured-output.html); the model card lists Structured outputs on bedrock-runtime.
# Runtime APIs: the model card lists Responses, Chat Completions and Converse, and recommends Chat Completions. Converse has known limitations with prior reasoning blocks and attached PDF/HTML documents.
# Reasoning effort (model card): Responses reasoning.effort and Chat Completions/InvokeModel reasoning_effort = none|low|medium|high|xhigh|max (default max). Converse accepts but does not validate the field.
# Chat Completions compatibility: reasoning_content is recorded live in anomalyco/opencode#66148 (K3.1 tool-call replay); Bedrock uses max_tokens, not max_completion_tokens.
# OpenCode Runtime entrypoints are added by anomalyco/opencode#66148. Converse stays first to preserve the v1 default.
schema = 2
base_model = "moonshotai/kimi-k3"
name = "Kimi K3 (India)"
recommended_api = "chat-completions"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true, strict = true }
reasoning = { supported = true }
structured_output = true
cache = { implicit = true }
service_tier = ["flex", "priority"]

[limit]
output = 128_000

[api.converse]
legacy_interleaved = true

[api.chat-completions]
base_url = "https://bedrock-runtime.${AWS_REGION}.amazonaws.com/openai/v1"
sdk = { aisdk = "none", opencodeai = "@opencode/ai/providers/amazon-bedrock/chat" }
compatibility = { reasoning_field = "reasoning_content", max_tokens_field = "max_tokens" }

[api.responses]
base_url = "https://bedrock-runtime.${AWS_REGION}.amazonaws.com/openai/v1"
sdk = { aisdk = "none", opencodeai = "@opencode/ai/providers/amazon-bedrock/responses" }

[cost.text.input]
price = 3.3
cache = { read = 0.33, write = { "30m" = 4.125 } }

[cost.text.output]
price = 16.5

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.75

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.5
