# Model ID, Runtime APIs and limits: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-oss-120b.html
# Standard US East (N. Virginia) pricing: https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrock/current/us-east-1/index.json
# Effort: additionalModelRequestFields.reasoning_effort = low|medium|high (Converse).
# Request mapping: https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-openai.html
# AWS documents 16K max output, but live Converse (2026-09-23) generated 60000 output tokens
# (stopReason max_tokens), accepts maxTokens=128000 and rejects larger values, and processed a
# 129575-token prompt; the backend reports "maximum context length (131072)".
# Service tiers: priority|flex (Converse serviceTier.type; Mantle service_tier), per model card + live 2026-10-19. Prices: AmazonBedrock us-east-1 price list (1.75x/0.5x; exact SKU prices where AWS rounds).
# Mid-conversation (Converse): AWS documents system-role messages and tool changes for Claude only (https://docs.aws.amazon.com/bedrock/latest/userguide/claude-messages-mid-conversation-system.html); live 2026-10-19 this model rejects them ("This model doesn't support system messages"). No per-turn effort on Converse.
schema = 2
base_model = "openai/gpt-oss-120b"
name = "gpt-oss-120b"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
system_updates = false
effort_updates = false
service_tier = ["flex", "priority"]

[limit]
output = 128_000

[cost.text.input]
price = 0.15

[cost.text.output]
price = 0.6

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.75

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.5
