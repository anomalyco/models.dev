# https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-zai-glm-5-3.html
# https://aws.amazon.com/bedrock/pricing/ (Z AI > GLM 5.3, US CRIS Standard; cache_write is the 30-minute rate)
# Effort: additionalModelRequestFields.reasoning_effort = low|medium|high|xhigh|max, matching the model card's "effort configurable" list.
# Live Converse 2026-10-21 (us-east-1, us-east-2, us-west-2; US and Global profiles): none and minimal are rejected
# ("Unsupported value: 'none' is not supported with this model"); reasoning length grows low < medium < high < xhigh < max.
# The bare zai.glm-5.3 ID is rejected; an inference profile is required.
# maxTokens=128000 accepted; 128001 and 131072 rejected ("exceeds the model limit of 128000").
# Text input only: image content blocks are rejected. Tool calls and streamed reasoning verified.
# v2 cache: implicit; cache reads verified live on Converse 2026-10-19 (explicit cachePoint unsupported on Converse).
# Service tiers: serviceTier.type = priority|flex accepted live (2026-10-19); AWS publishes no GLM 5.3 tier prices, so no multipliers.
# Mid-conversation (Converse): AWS documents system-role messages and tool changes for Claude only (https://docs.aws.amazon.com/bedrock/latest/userguide/claude-messages-mid-conversation-system.html); live 2026-10-19 this model rejects them ("This model doesn't support system messages"). No per-turn effort on Converse.
# Cache: the model card lists implicit caching for Responses/Chat Completions only; kept implicit because Converse returned cache reads live (2026-10-19).
schema = 2
base_model = "zhipuai/glm-5.3"
name = "GLM-5.3 (US)"

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = true }
service_tier = ["flex", "priority"]

[limit]
output = 128_000

[api.converse]
compatibility = { replay_reasoning = true }

[cost.text.input]
price = 1.848
cache = { read = 0.3432, write = { "30m" = 2.31 } }

[cost.text.output]
price = 5.808
