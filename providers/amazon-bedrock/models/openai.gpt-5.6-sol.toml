# Mantle Responses model ID, route and pricing: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-56-sol.html
# Effort: reasoning.effort = none|low|medium|high|xhigh|max; https://developers.openai.com/api/docs/models/gpt-5.6-sol
# Bedrock context window: https://developers.openai.com/api/docs/guides/amazon-bedrock
# In-region Standard pricing for US commercial Regions.
# Columns: input / 30m cache write / cache read / output (USD per 1M tokens)
# v2 cache: implicit + prompt_cache_breakpoint (30m TTL only, 4 writes, 1,024 min) on Mantle Responses per https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html and the model card; verified live 2026-10-19.
schema = 2
base_model = "openai/gpt-5.6-sol"
base_model_omit = ["cost.context_over_200k", "experimental.modes.fast"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
prompt_cache_key = true
cache = { supported = true, implicit = { min_tokens = 1_024 }, explicit = { ttl = ["30m"], max_breakpoints = 4, min_tokens = 1_024 } }

[api.responses]
base_url = "https://bedrock-mantle.${AWS_REGION}.api.aws/openai/v1"
sdk = { aisdk = "@ai-sdk/amazon-bedrock/mantle" }

[cost.text.input]
price = 4.4
cache = { read = 0.44, write = { "30m" = 5.5 } }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 8.8
cache = { read = 0.88, write = { "30m" = 11 } }

[cost.text.output]
price = 22

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 33
