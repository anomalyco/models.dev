# Model IDs, routes, limits and Global CRIS pricing: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-6-2-sol.html
# Global cross-Region profile on bedrock-runtime; this entry uses Converse. The model card lists Standard as its only service tier.
# Reasoning: additionalModelRequestFields.reasoning.effort = low|medium|high|xhigh|max; all accepted and effort=none rejected live, 2026-11-17.
# Converse tools: toolSpec.strict enforces JSON schemas; toolChoice supports auto, any (required), and named tool (live 2026-11-17).
# JSON Schema output requires outputConfig.textFormat.type=json_schema and additionalModelRequestFields.text.format.strict=true; encode the schema as a JSON string. The card covers streaming and non-streaming calls.
# Converse accepts user text/image blocks and rejects document blocks and images inside toolResult, per the model card. Documents use Runtime Responses input_file.
# Image formats: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_ImageBlock.html
# Converse caching is implicit only; native cachePoint is unsupported. The card documents the 1,024-token minimum and 30m cache-write prices.
schema = 2
base_model = "openai/gpt-6.2-sol"
name = "GPT-6.2 Sol (Global)"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true, strict = true, choice = ["auto", "required", "tool"] }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { implicit = { min_tokens = 1_024 } }

[cost.text.input]
price = 2
cache = { read = 0.1, write = { "30m" = 2.5 } }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 4
cache = { read = 0.2, write = { "30m" = 5 } }

[cost.text.output]
price = 10

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 15
