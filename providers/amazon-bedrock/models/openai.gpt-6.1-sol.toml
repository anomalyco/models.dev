# Mantle in-region route (Responses API); the us. Converse profile is a separate file.
# Model IDs, routes and Standard pricing: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-6-1-sol.html
# OpenAI-native limits, pricing and effort (low|medium|high|xhigh|max, no none): https://developers.openai.com/api/docs/models/gpt-6.1-sol
# In-region Standard pricing for us-east-1 (Mantle); 10% premium over OpenAI list rates per AWS card.
# Ultrafast via service_tier=ultrafast at 6x Standard (Mantle us-east-1): https://developers.openai.com/api/docs/guides/ultrafast-mode
# Ultrafast availability: https://aws.amazon.com/about-aws/whats-new/2026/10/openai-gpt-sol-ultrafast-amazon/
# Ultrafast is 6x Standard per Bedrock Astra card and OpenAI ultrafast table: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-6-astra.html and https://developers.openai.com/api/docs/pricing?latest-pricing=ultrafast
# Columns: input / 30m cache write / cache read / output (USD per 1M tokens)
schema = 2
base_model = "openai/gpt-6.1-sol"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[api.responses]
base_url = "https://bedrock-mantle.${AWS_REGION}.api.aws/openai/v1"
sdk = { aisdk = "@ai-sdk/amazon-bedrock/mantle" }

[cost.text.input]
price = 2.2
cache = { read = 0.11, write = 2.75 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 4.4
cache = { read = 0.22, write = 5.5 }

[cost.text.output]
price = 11

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 16.5

[[cost.multipliers]]
when = { service_tier = { equals = "ultrafast" } }
factor = 6

[experimental.modes.ultrafast]
body = { service_tier = "ultrafast" }
