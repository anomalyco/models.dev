# Model ID, Mantle /openai/v1/responses route, 1M context and US pricing: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-55.html
# The 272K input-token boundary is a pricing tier, not the context cap.
# Bedrock capabilities: https://developers.openai.com/api/docs/guides/amazon-bedrock
# Effort: reasoning.effort = none|low|medium|high|xhigh; https://developers.openai.com/api/docs/models/gpt-5.5
# v2 cache: implicit only, 1,024-token minimum, no write fee per https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html.
# Mid-conversation (Mantle Responses, live 2026-10-19): system/developer messages accepted; configuration_update rejected ("not supported with this model"); additional_tools accepted.
schema = 2
base_model = "openai/gpt-5.5"
base_model_omit = ["cost.tiers", "cost.context_over_200k", "experimental.modes.fast", "limit.input"]
last_updated = "2026-06-01"

[capabilities]
tools = { supported = true, updates = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true
system_updates = true
effort_updates = false
cache = { implicit = { min_tokens = 1_024 } }

[limit]
context = 1_000_000

[api.responses]
base_url = "https://bedrock-mantle.${AWS_REGION}.api.aws/openai/v1"
sdk = { aisdk = "@ai-sdk/amazon-bedrock/mantle", opencodeai = "@opencode/ai/providers/amazon-bedrock/mantle/responses" }

[cost.text.input]
price = 5.5
cache = { read = 0.55 }

[cost.text.output]
price = 33
