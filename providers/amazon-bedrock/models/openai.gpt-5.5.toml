# Model ID, Mantle /openai/v1/responses route, 1M context and US pricing: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-55.html
# The 272K input-token boundary is a pricing tier, not the context cap.
# Bedrock capabilities: https://developers.openai.com/api/docs/guides/amazon-bedrock
# Effort: reasoning.effort = none|low|medium|high|xhigh; https://developers.openai.com/api/docs/models/gpt-5.5
schema = 2
base_model = "openai/gpt-5.5"
base_model_omit = ["cost.tiers", "cost.context_over_200k", "experimental.modes.fast", "limit.input"]
last_updated = "2026-06-01"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true

[limit]
context = 1_000_000

[api.responses]
base_url = "https://bedrock-mantle.${AWS_REGION}.api.aws/openai/v1"
sdk = { aisdk = "@ai-sdk/amazon-bedrock/mantle" }

[cost.text.input]
price = 5.5
cache = { read = 0.55 }

[cost.text.output]
price = 33
