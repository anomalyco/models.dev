# https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-moonshot-ai-kimi-k2-5.html
# https://github.com/aws-samples/bedrock-claude-chatbot/blob/eeb2fa35339081d34ea9caa4e4d39cf1c189770a/agent/chat_agent.py
# Toggle: additionalModelRequestFields.reasoning_config = "high"; omit for default non-thinking mode.
# Live 2026-09-09: high/omitted returns/omits reasoningContent; maxTokens=16384 accepted.
# Live Converse 2026-09-09: inferenceConfig.temperature accepts both 0 and 1.
# Runtime Converse; US Standard pricing.
# Live Converse 2026-09-23: maxTokens at the Bedrock ceiling returned
# "maximum context length is 262144 tokens" from the serving backend.
# Service tiers: priority|flex (Converse serviceTier.type; Mantle service_tier), per model card + live 2026-10-19. Prices: AmazonBedrock us-east-1 price list (1.75x/0.5x; exact SKU prices where AWS rounds).
# Mid-conversation (Converse): AWS documents system-role messages and tool changes for Claude only (https://docs.aws.amazon.com/bedrock/latest/userguide/claude-messages-mid-conversation-system.html); live 2026-10-19 this model rejects them ("This model doesn't support system messages"). No per-turn effort on Converse.
# Modalities: Converse image blocks are png|jpeg|gif|webp (https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_ImageBlock.html); the model card lists image but not video input.
schema = 2
base_model = "moonshotai/kimi-k2.5"
release_date = "2026-01-27"
last_updated = "2026-02-06"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true }
structured_output = true
temperature = true
system_updates = false
effort_updates = false
service_tier = ["flex", "priority"]

[limit]
output = 16_384

[api.converse]
compatibility = { replay_reasoning = true }

[cost.text.input]
price = 0.6

[cost.text.output]
price = 3

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.75

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.5
