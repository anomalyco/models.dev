# Bedrock model IDs, routes, limits and pricing: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-6-astra.html
# Bedrock context window: https://developers.openai.com/api/docs/guides/amazon-bedrock
# Mantle Regional: us-east-1 (Standard + Ultrafast) and us-west-2 (Standard only); this entry carries In-Region Standard pricing.
# Ultrafast via service_tier=ultrafast at 6x Standard: https://developers.openai.com/api/docs/guides/ultrafast-mode
# Effort levels match OpenAI-native Astra (Low..Max, no "none"): https://developers.openai.com/api/docs/models/gpt-6-astra
# Columns: input / 30m cache write / cache read / output (USD per 1M tokens)
schema = 2
base_model = "openai/gpt-6-astra"
base_model_omit = ["cost.context_over_200k", "experimental.modes.fast"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true

[api.responses]
base_url = "https://bedrock-mantle.${AWS_REGION}.api.aws/openai/v1"
sdk = { aisdk = "@ai-sdk/amazon-bedrock/mantle" }

[cost.text.input]
price = 11
cache = { read = 1.1, write = 13.75 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 22
cache = { read = 2.2, write = 27.5 }

[cost.text.output]
price = 55

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 82.5

[[cost.multipliers]]
when = { service_tier = { equals = "ultrafast" } }
factor = 6

[experimental.modes.ultrafast]
body = { service_tier = "ultrafast" }
