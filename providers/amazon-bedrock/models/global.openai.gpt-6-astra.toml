# Global cross-Region inference profile — served by Bedrock core (Converse), not Mantle, so no [api] override.
# Bedrock model IDs, routes, limits and Global CRIS pricing: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-6-astra.html
# Converse Ultrafast: additionalModelRequestFields.service_tier=ultrafast at 6x Standard: https://developers.openai.com/api/docs/guides/ultrafast-mode
# Cache rates: AWS-published Responses pricing; the card's API coverage can lag live behavior.
# Converse effort: additionalModelRequestFields.reasoning.effort = low|medium|high|xhigh|max.
# Live check 2026-09-09 (us-east-1): outputConfig.textFormat enforces JSON schema despite a conflicting user instruction.
# Effort levels match OpenAI-native Astra (Low..Max, no "none"): https://developers.openai.com/api/docs/models/gpt-6-astra
# v2 cache: Converse supports implicit caching only (cachePoint unsupported) per https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html and the model card; implicit write/read verified live 2026-10-19.
schema = 2
base_model = "openai/gpt-6-astra"
base_model_omit = ["cost.context_over_200k", "experimental.modes.fast"]
name = "GPT-6 Astra (Global)"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { supported = true, implicit = { min_tokens = 1_024 }, explicit = false }

[cost.text.input]
price = 10
cache = { read = 1, write = { "30m" = 12.5 } }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 20
cache = { read = 2, write = { "30m" = 25 } }

[cost.text.output]
price = 50

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 75

[[cost.multipliers]]
when = { service_tier = { equals = "ultrafast" } }
factor = 6

[experimental.modes.ultrafast]
body = { additionalModelRequestFields = { service_tier = "ultrafast" } }
