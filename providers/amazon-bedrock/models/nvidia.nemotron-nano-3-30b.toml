# https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-nvidia-nemotron-nano-3-30b.html
# AWS documents a 256K Bedrock context window; inherit the matching 262,144-token lab context.
# https://aws.amazon.com/bedrock/pricing/ (US Standard pricing)
# Live 2026-09-09: maxTokens=8192 accepted; chat_template_kwargs.enable_thinking had no visible effect.
# Service tiers: priority|flex (Converse serviceTier.type; Mantle service_tier), per model card + live 2026-10-19. Prices: AmazonBedrock us-east-1 price list (1.75x/0.5x; exact SKU prices where AWS rounds).
# Mid-conversation (Converse, live 2026-10-19): role "system" messages are rejected ("This model doesn't support system messages"), so no tool updates either; Converse has no per-turn effort.
schema = 2
base_model = "nvidia/nemotron-3-nano-30b-a3b"
name = "NVIDIA Nemotron Nano 3 30B"
last_updated = "2025-12-23"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
structured_output = true
system_updates = false
effort_updates = false
service_tier = ["flex", "priority"]

[limit]
output = 8_192

[cost.text.input]
price = 0.06

[[cost.text.input.overrides]]
when = { service_tier = { equals = "priority" } }
price = 0.11

[cost.text.output]
price = 0.24

[[cost.text.output.overrides]]
when = { service_tier = { equals = "priority" } }
price = 0.42

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.5
