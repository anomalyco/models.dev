# Global cross-Region inference profile — served by Bedrock core (Converse), not Mantle, so no [api] override.
# Verified from eu-west-1: returns 200 with reasoning effort set.
# Global pricing and Runtime capabilities: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-56-sol.html
# Cache rates: AWS-published Responses pricing; the card's API coverage can lag live behavior.
# Converse effort: additionalModelRequestFields.reasoning.effort = none|low|medium|high|xhigh|max (none verified 2026-09-09).
# v2 cache: Converse supports implicit caching only (cachePoint unsupported) per https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html and the model card; implicit write/read verified live 2026-10-19.
# Mid-conversation (Converse, live 2026-10-19): role "system" messages are rejected ("This model doesn't support system messages"), so no tool updates either; Converse has no per-turn effort.
schema = 2
base_model = "openai/gpt-5.6-sol"
base_model_omit = ["cost.context_over_200k", "experimental.modes.fast"]
name = "GPT-5.6 Sol (Global)"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = false
system_updates = false
effort_updates = false
cache = { supported = true, implicit = { min_tokens = 1_024 }, explicit = false }

[cost.text.input]
price = 4
cache = { read = 0.4, write = { "30m" = 5 } }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 8
cache = { read = 0.8, write = { "30m" = 10 } }

[cost.text.output]
price = 20

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 30
