# https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-palmyra-x4.html
# https://aws.amazon.com/bedrock/pricing/ — us-east-1 standard, USD per 1M tokens.
# Bedrock's documented request has no caller-selectable reasoning control.
# Structured outputs: Converse rejects outputConfig ("This model doesn't support the outputConfig field", live 2026-10-19).
# Mid-conversation (Converse): AWS documents system-role messages and tool changes for Claude only (https://docs.aws.amazon.com/bedrock/latest/userguide/claude-messages-mid-conversation-system.html); live 2026-10-19 this model rejects them ("This model doesn't support system messages"). No per-turn effort on Converse.
# Status: Legacy 2026-09-09, EOL 2027-03-09 per https://docs.aws.amazon.com/bedrock/latest/userguide/model-lifecycle.html.
schema = 2
base_model = "writer/palmyra-x4"
name = "Palmyra X4 (US)"
status = "deprecated"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
structured_output = false
system_updates = false
effort_updates = false

[limit]
context = 122_880
output = 8_192

[cost.text.input]
price = 2.5

[cost.text.output]
price = 10
