# https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-deepseek-deepseek-r1.html
# https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-deepseek.html
# Runtime accepts 32,768 output tokens; 8,192 is the quality recommendation.
# R1 has always-on reasoning and no reasoning toggle, effort, or budget parameter.
# US Standard pricing; use the us.deepseek.r1-v1:0 profile for on-demand Converse.
# Live US profile (us-east-1, 2026-09-09): toolConfig rejected with HTTP 400,
# "This model doesn't support tool use." with AUTO or omitted toolChoice.
# Mid-conversation (Converse): AWS documents system-role messages and tool changes for Claude only (https://docs.aws.amazon.com/bedrock/latest/userguide/claude-messages-mid-conversation-system.html); live 2026-10-19 this model rejects them ("This model doesn't support system messages"). No per-turn effort on Converse.
# Status: Legacy 2026-09-30, EOL 2027-03-30 per https://docs.aws.amazon.com/bedrock/latest/userguide/model-lifecycle.html.
schema = 2
base_model = "deepseek/deepseek-r1"
status = "deprecated"

[capabilities]
tools = { supported = false }
reasoning = { supported = true }

[cost.text.input]
price = 1.35

[cost.text.output]
price = 5.4
