# Model ID and Mantle /v1/responses route: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-oss-120b.html
# Standard US East (N. Virginia) pricing: https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrock/current/us-east-1/index.json
# Effort: reasoning.effort = low|medium|high (Responses).
# Native controls: https://huggingface.co/openai/gpt-oss-120b
# Live Mantle 2026-09-23: /v1/responses and /v1/chat/completions accept 131072
# output tokens and reject 131073 with "exceeds model maximum (131072)".
# A high-effort response generated 100000 output tokens (hit max_output_tokens).
# A 130975-token prompt completed; 131175 failed with "max_model_len 131072".
base_model = "openai/gpt-oss-120b"
name = "gpt-oss-120b"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high"] }]

[cost]
input = 0.15
output = 0.60

[limit]
output = 131_072

[provider]
npm = "@ai-sdk/amazon-bedrock/mantle"
api = "https://bedrock-mantle.${AWS_REGION}.api.aws/v1"
shape = "responses"
