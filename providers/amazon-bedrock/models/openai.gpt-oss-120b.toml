# Model ID and Mantle /v1/responses route: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-oss-120b.html
# Standard US East (N. Virginia) pricing: https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrock/current/us-east-1/index.json
# Effort: reasoning.effort = low|medium|high (Responses).
# Native controls: https://huggingface.co/openai/gpt-oss-120b
# Live Mantle 2026-09-23: /v1/responses and /v1/chat/completions accept 131072
# output tokens and reject 131073 with "exceeds model maximum (131072)".
# A high-effort response generated 100000 output tokens (hit max_output_tokens).
# A 130975-token prompt completed; 131175 failed with "max_model_len 131072".
# Service tiers: priority|flex (Converse serviceTier.type; Mantle service_tier), per model card + live 2026-10-19. Prices: AmazonBedrock us-east-1 price list (1.75x/0.5x; exact SKU prices where AWS rounds).
# Mid-conversation (Mantle Responses, live 2026-10-19): system/developer messages accepted; configuration_update rejected ("not supported with this model"); additional_tools rejected (input does not deserialize).
schema = 2
base_model = "openai/gpt-oss-120b"
name = "gpt-oss-120b"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
system_updates = true
effort_updates = false
service_tier = ["flex", "priority"]

[limit]
output = 131_072

[api.responses]
base_url = "https://bedrock-mantle.${AWS_REGION}.api.aws/v1"
sdk = { aisdk = "@ai-sdk/amazon-bedrock/mantle", opencodeai = "@opencode/ai/providers/amazon-bedrock/mantle/responses" }

[cost.text.input]
price = 0.15

[cost.text.output]
price = 0.6

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.75

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.5
