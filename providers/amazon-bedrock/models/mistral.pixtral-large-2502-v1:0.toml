# https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-mistral-ai-pixtral-large.html
# https://aws.amazon.com/bedrock/pricing/ — us-east-1 standard, USD per 1M tokens.
# Structured outputs: Converse rejects outputConfig ("This model doesn't support the outputConfig field", live 2026-10-19).
# Mid-conversation (Converse): AWS documents system-role messages and tool changes for Claude only (https://docs.aws.amazon.com/bedrock/latest/userguide/claude-messages-mid-conversation-system.html); live 2026-10-19 this model rejects them ("This model doesn't support system messages"). No per-turn effort on Converse.
# Service tiers: the model card lists priority/flex, but Converse rejects both live ("The provided service tier is not supported for this model", 2026-10-19), so none are set.
schema = 2
base_model = "mistral/pixtral-large-2502"

[capabilities]
tools = { supported = true, updates = false }
structured_output = false
system_updates = false

[cost.text.input]
price = 2

[cost.text.output]
price = 6
