# Sources: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-sonnet-4.html
# https://docs.aws.amazon.com/bedrock/latest/APIReference/API_ListInferenceProfiles.html
# https://platform.claude.com/docs/en/build-with-claude/thinking-troubleshooting
# Pricing: https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrockFoundationModels/current/us-east-1/index.json
# Supported source AWS_REGION values: us-east-1, us-east-2, us-west-2, eu-west-1, ap-northeast-1.
# Profile verified from us-east-1, eu-west-1, and ap-northeast-1; native bedrock-runtime Converse/InvokeModel surface.
# Global on-demand USD/MTok from us-east-1; 5-minute cache writes. Legacy, EOL October 14, 2026.
# Live US-family probe, 2026-09-09: Legacy access denied (404) without active use in the last 30 days.
# Toggle: additionalModelRequestFields.thinking.type = enabled|disabled (Converse); thinking.type (InvokeModel).
# Budget: additionalModelRequestFields.thinking.budget_tokens (Converse); thinking.budget_tokens (InvokeModel).
# v2 cache: cachePoint (ttl "1h" where listed) per https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html; 1h write = 2x input (AmazonBedrockFoundationModels price list). No implicit hits seen live (2026-10-19).
# Mid-conversation (Converse): role "system" messages (https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Message.html) on Opus 4.8 and the Claude 5 family (https://docs.aws.amazon.com/bedrock/latest/userguide/claude-messages-mid-conversation-system.html);
# toolAddition/toolRemoval by reference with anthropic_beta mid-conversation-tool-changes-2026-07-01 (https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-anthropic-claude-messages-tool-use.html).
# Per-turn effort is a system-message output_config on InvokeModel only (https://docs.aws.amazon.com/bedrock/latest/userguide/claude-messages-adaptive-thinking.html); a Converse Message has no such field, so effort_updates = false.
schema = 2
base_model = "anthropic/claude-sonnet-4-20250514"
name = "Claude Sonnet 4 (Global)"
status = "deprecated"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true, budget = { min = 1_024 } }
system_updates = false
effort_updates = false
cache = { explicit = { ttl = ["5m"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 1_024 } }

[cost.text.input]
price = 3
cache = { read = 0.3, write = 3.75 }

[cost.text.output]
price = 15
