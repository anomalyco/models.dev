# Sources: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-sonnet-5-5.html
# https://platform.claude.com/docs/en/models/sonnet-5-5/whats-new-sonnet-5-5
# Cache read $0.10/MTok (50% reduction effective 2026-10-07): https://aws.amazon.com/bedrock/pricing/
# https://www.anthropic.com/pricing and https://platform.claude.com/docs/en/about-claude/pricing#prompt-caching (5% of $2 input)
# Bedrock runtime serves on-demand traffic through the global inference profile (global.anthropic.claude-sonnet-5-5).
# Live global Sonnet 5.5 probes, 2026-09-29: outputConfig.textFormat rejected (output_config.format: Extra inputs are not permitted);
# thinking.type=disabled rejected in favor of between_tools, so there is no off toggle.
# Effort: additionalModelRequestFields.output_config.effort (Converse); output_config.effort (InvokeModel).
# v2 cache: cachePoint (ttl "1h" where listed) per https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html; 1h write = 2x input (AmazonBedrockFoundationModels price list). No implicit hits seen live (2026-10-19).
schema = 2
base_model = "anthropic/claude-sonnet-5-5"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = false
cache = { supported = true, explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 512 } }

[cost.text.input]
price = 2
cache = { read = 0.1, write = { "5m" = 2.5, "1h" = 4 } }

[cost.text.output]
price = 10
