# APAC cross-Region profile verified by ListInferenceProfiles (ap-southeast-2, 2026-09-08).
# Model: https://docs.aws.amazon.com/nova/latest/userguide/what-is-nova.html
# Pricing: https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrock/current/ap-southeast-2/index.json
# Standard ap-southeast-2 reference rates, USD/MTok; rates vary by source Region. Cache writes billed at input rate; no surcharge.
# Cache billing: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html
# v2 cache: implicit for all text prompts; explicit cachePoint in system/messages, 5m TTL, 4 checkpoints per https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html; its "1K" minimum is approximate (981-token write live), so no min_tokens.
# Structured outputs: Converse rejects outputConfig ("This model doesn't support the outputConfig field", live 2026-10-19).
# Mid-conversation (Converse): AWS documents system-role messages and tool changes for Claude only (https://docs.aws.amazon.com/bedrock/latest/userguide/claude-messages-mid-conversation-system.html); live 2026-10-19 this model rejects them ("This model doesn't support system messages"). No per-turn effort on Converse.
schema = 2
base_model = "amazon/nova-micro"
name = "Nova Micro (APAC)"

[capabilities]
tools = { supported = true }
structured_output = false
cache = { implicit = true, explicit = { ttl = ["5m"], max_breakpoints = 4, targets = ["system", "messages"] } }

[cost.text.input]
price = 0.037
cache = { read = 0.00925, write = 0.037 }

[cost.text.output]
price = 0.148
