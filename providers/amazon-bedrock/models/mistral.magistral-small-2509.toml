# https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-mistral-ai-magistral-small-2509.html
# https://huggingface.co/mistralai/Magistral-Small-2509 — reasoning via the model's think tokens, no effort/budget field.
# https://aws.amazon.com/bedrock/pricing/ — us-east-1 standard, USD per 1M tokens.
schema = 2
base_model = "mistral/magistral-small-2509"

[capabilities]
reasoning = { supported = true }
structured_output = true

[limit]
context = 128_000
output = 40_000

[cost.text.input]
price = 0.5

[cost.text.output]
price = 1.5
