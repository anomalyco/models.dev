# Open Uncensored: one OpenAI compatible API for uncensored and abliterated open-weight models,
# routed across inference providers (Venice, NanoGPT, abliteration.ai, ...). Prices are listed
# on each model's page. No account: prepaid API keys.
# Docs: https://openuncensored.com/docs  Agent guide: https://openuncensored.com/agents.md
name = "Open Uncensored"
npm = "@ai-sdk/openai-compatible"
opencodeai = "@opencode/ai/providers/openai-compatible"
env = ["OPENUNCENSORED_API_KEY"]
api = "https://openuncensored.com/api/v1"
doc = "https://openuncensored.com/docs"
