# Served by Open Uncensored through nanogpt. Price as
# listed on https://openuncensored.com/models/mimo-v2.6-flash-abliterated
# Model facts (dates, limits, reasoning controls) follow models.dev's entry for the host we
# measure it on: providers/nano-gpt/models/xiaomi/mimo-v2.6-flash-abliterated.toml
# Input is text only: the router replaces image parts with a note for text models.
# Standalone (no base_model): the hosts serving this model do not say whose weights it is, and
# several unrelated Hugging Face repos share the name, so there is no lab identity to point to.
schema = 2
name = "MiMo V2.6 Flash Abliterated"
description = "A MiMo V2.6 Flash finetune with refusal-direction ablation, image input, a 1M-token context window, separate reasoning output, and tool calling."
family = "mimo"
open_weights = true
release_date = "2026-09-25"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = false

[limit]
context = 1_048_576
input = 1_048_576
output = 65_536

[cost.text.input]
price = 0.5

[cost.text.output]
price = 1.5
