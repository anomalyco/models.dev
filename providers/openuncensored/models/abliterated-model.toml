# Served by Open Uncensored through abliteration-ai, nanogpt. Price as
# listed on https://openuncensored.com/models/abliterated-model
# Model facts (dates, limits, reasoning controls) follow models.dev's entry for the host we
# measure it on: providers/abliteration-ai/models/abliterated-model.toml
# Input is text only: the router replaces image parts with a note for text models.
# Reasoning: off is reasoning_effort=none; graded levels, no toggle (probed live through
# https://openuncensored.com/api/v1 on 2026-11-08: none returns no reasoning, low/high do).
schema = 2
base_model = "abliteration-ai/abliterated-model"

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = false

[cost.text.input]
price = 1

[cost.text.output]
price = 3
