# Served by Open Uncensored through abliteration-ai, nanogpt, at the serving provider's per-token
# price with no markup: https://openuncensored.com/models/abliterated-model
# Model facts (dates, limits, reasoning controls) follow models.dev's entry for the host we
# measure it on: providers/abliteration-ai/models/abliterated-model.toml
# Input is text only: the router replaces image parts with a note for text models.
schema = 2
name = "Abliterated Model"
description = "Multimodal model for analyzing text, images, documents, and rich media"
open_weights = true
release_date = "2026-01-06"
last_updated = "2026-07-28"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, toggle = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh", "max"] }
structured_output = false
temperature = true

[limit]
context = 150_000
input = 150_000
output = 8_192

[cost.text.input]
price = 1

[cost.text.output]
price = 3
