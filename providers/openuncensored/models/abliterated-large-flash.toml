# Served by OpenUncensored. Price as listed on https://openuncensored.com/models/abliterated-large-flash
# and in https://api.openuncensored.com/v1/models (USD per token there, per million here; 2026-11-24).
# Name, description and date come from the lab file, which follows the maker's own entry
# (providers/abliteration-ai/models/abliterated-model-large-flash.toml). Limits are the maker's, also via
# the lab: a 1,048,576-token context with up to 262,144 output tokens (https://docs.abliteration.ai/models).
# abliteration.ai serves this model first, so those limits hold on this route; Venice (1,000,000 / 131,072) is a
# fallback, and the router retries a request an upstream rejects on the next one.
# Accepts image input: the router passes images through for this model.
# Reasoning: reasoning_effort, passed through to the host unmodified. abliteration.ai serves this model
# first and documents its levels for it as "Off, low, high, max"
# (https://docs.abliteration.ai/capabilities/thinking). Probed through https://api.openuncensored.com/v1,
# answered by abliteration.ai: none returns no reasoning (2026-11-08); low, high and max all reason, and
# max used more reasoning tokens than high on the same prompt (212 and 250 vs 150, 2026-11-12).
schema = 2
base_model = "abliteration-ai/abliterated-model-large-flash"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "max"] }
structured_output = true

[cost.text.input]
price = 1

[cost.text.output]
price = 2
