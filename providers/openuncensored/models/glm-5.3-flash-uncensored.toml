# Served by OpenUncensored. Price as listed on https://openuncensored.com/models/glm-5.3-flash-uncensored
# and in https://api.openuncensored.com/v1/models (USD per token there, per million here; 2026-11-24).
# Model facts (dates, limits, reasoning controls) follow models.dev's entry for the host we
# measure it on: providers/nano-gpt/models/z-ai/glm-5.3-flash-uncensored.toml
# Input is text only: the router replaces image parts with a note for text models.
# Standalone (no base_model): the hosts serving this model do not say whose weights it is, and
# several unrelated Hugging Face repos share the name, so there is no lab identity to point to.
# Sampling: the router forwards temperature, top_p and top_k unchanged (supported_parameters in
# https://api.openuncensored.com/v1/openrouter/models), and the upstream APIs take all three
# (https://docs.nano-gpt.com/api-reference/endpoint/chat-completion).
schema = 2
name = "GLM 5.3 Flash Uncensored"
description = "GLM 5.3 Flash Uncensored is an uncensored fine-tune of the efficient 320B mixture-of-experts reasoning model, built for unrestricted chat, creative writing, coding, agentic work, tool use, and long-context tasks."
family = "glm-flash"
open_weights = true
release_date = "2026-07-29"
last_updated = "2026-08-27"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
temperature = true
top_p = true
top_k = true

[limit]
context = 1_048_576
input = 1_048_576
output = 32_768

[cost.text.input]
price = 0.12

[cost.text.output]
price = 0.5
