# Served by OpenUncensored. Price as listed on https://openuncensored.com/models/deepseek-v4.1-flash-uncensored-thinking
# and in https://api.openuncensored.com/v1/models (USD per token there, per million here; 2026-11-24).
# Model facts (dates, limits, reasoning controls) follow models.dev's entry for the host we
# measure it on: providers/nano-gpt/models/deepseek/deepseek-v4.1-flash-uncensored:thinking.toml
# Input is text only: the router replaces image parts with a note for text models.
# Standalone (no base_model): the hosts serving this model do not say whose weights it is, and
# several unrelated Hugging Face repos share the name, so there is no lab identity to point to.
# Sampling: the router forwards temperature, top_p and top_k unchanged (supported_parameters in
# https://api.openuncensored.com/v1/openrouter/models), and the upstream APIs take all three
# (https://docs.nano-gpt.com/api-reference/endpoint/chat-completion).
schema = 2
name = "DeepSeek V4.1 Flash Uncensored Thinking"
description = "A lower-refusal finetune of DeepSeek V4.1 Flash with text input, optional reasoning, and tool calling. Supports a context window of up to 1M tokens."
family = "deepseek"
open_weights = true
release_date = "2026-10-01"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high"] }
structured_output = false
temperature = true
top_p = true
top_k = true

[limit]
context = 1_048_576
input = 1_048_576
output = 65_536

[cost.text.input]
price = 0.33

[cost.text.output]
price = 1.32
