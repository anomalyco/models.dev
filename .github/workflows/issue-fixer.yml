name: Issue Fixer

on:
  issues:
    types: [opened]
  repository_dispatch:
    types: [missing-model]

permissions:
  contents: read

concurrency: issue-fixer-${{ github.event.issue.number || github.event.client_payload.issue_number }}

jobs:
  fix:
    if: >-
      github.repository == 'anomalyco/models.dev'
      && !contains(github.event.issue.labels.*.name, 'provider:openai')
      && github.event.client_payload.provider != 'openai'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || github.event.client_payload.issue_number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: dev
          persist-credentials: false

      - name: Load issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ISSUE_FILE="$RUNNER_TEMP/issue.json"
          gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json number,title,body,labels > "$ISSUE_FILE"
          echo "ISSUE_FILE=$ISSUE_FILE" >> "$GITHUB_ENV"

      - name: Install opencode
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Move git metadata out of the workspace
        run: mv .git "$RUNNER_TEMP/repo.git"

      - name: Run issue fixer
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_PERMISSION: '{"bash":"deny"}'
        run: |
          set -euo pipefail
          EVENTS_FILE="$RUNNER_TEMP/issue-fixer-events.jsonl"
          PROMPT_FILE="$RUNNER_TEMP/issue-fixer-prompt.md"
          mkdir -p "$RUNNER_TEMP/out"

          jq -r '
            "A new GitHub issue was opened in anomalyco/models.dev.\n\n"
            + "Issue #\(.number): \(.title)\n\n"
            + "Body:\n" + (.body // "") + "\n\n"
            + "Decide whether this is an actionable model catalog data fix.\n\n"
            + "If it asks for a model to be added or for factual model/provider metadata to be corrected, make the minimal TOML changes in the repository. Do not use Bash. Do not create branches, commits, comments, or pull requests yourself.\n\n"
            + "If it is a feature request, a request to track a new kind of information, a question, or any miscellaneous non-catalog-data request, do not edit files. Respond briefly that it needs maintainer review and no automated fix was opened."
          ' "$ISSUE_FILE" > "$PROMPT_FILE"

          opencode run --agent issue-fixer -m opencode/muse-spark-1.3 --variant xhigh --format json < "$PROMPT_FILE" | tee "$EVENTS_FILE"

          if ! jq -ers 'map(select(.type == "text") | .part.text) | last | select(length > 0)' "$EVENTS_FILE" > "$RUNNER_TEMP/out/response.md"; then
            echo "Issue fixer did not produce a final response." >&2
            exit 1
          fi

      - name: Save changes
        env:
          GIT_DIR: ${{ runner.temp }}/repo.git
          GIT_WORK_TREE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/out/changes.patch"
          jq -r .title "$ISSUE_FILE" > "$RUNNER_TEMP/out/title.txt"

      - name: Upload changes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-fixer
          path: ${{ runner.temp }}/out
          retention-days: 3

  publish:
    needs: fix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || github.event.client_payload.issue_number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: dev
          persist-credentials: false

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          opencode-app-id: ${{ vars.OPENCODE_APP_ID }}
          opencode-app-secret: ${{ secrets.OPENCODE_APP_SECRET }}

      - name: Download changes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: issue-fixer
          path: ${{ runner.temp }}/out

      - name: Apply changes
        id: apply
        run: |
          set -euo pipefail
          PATCH="$RUNNER_TEMP/out/changes.patch"
          if [ ! -s "$PATCH" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git apply --index "$PATCH"
          while IFS= read -r path; do
            case "$path" in
              models/*.toml|providers/*.toml) ;;
              *) echo "Unexpected changed path: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --cached --no-renames --name-only)
          git diff --cached --no-renames --raw --no-abbrev | awk '$2 != "100644" && $2 != "000000" { print "Unexpected file mode: " $0; bad = 1 } END { exit bad }' >&2
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Comment on issue
        if: steps.apply.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
        run: |
          if [ -s "$RUNNER_TEMP/out/response.md" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/out/response.md"
          fi

      - name: Create pull request
        if: steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
          BRANCH: issue-${{ github.event.issue.number || github.event.client_payload.issue_number }}
        run: |
          set -euo pipefail
          ISSUE_TITLE="$(cat "$RUNNER_TEMP/out/title.txt")"
          TITLE="fix: ${ISSUE_TITLE:0:200}"

          git switch -c "$BRANCH"
          git commit -m "$TITLE"
          git push --force origin "$BRANCH"

          if [ -n "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base dev --json number --jq '.[0].number')" ]; then
            exit 0
          fi

          PR_BODY="$RUNNER_TEMP/issue-fixer-pr-body.md"
          {
            cat "$RUNNER_TEMP/out/response.md"
            echo
            echo "Closes #$ISSUE_NUMBER"
            echo
            echo "Automated by the issue fixer: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$PR_BODY"

          gh pr create --repo "$GITHUB_REPOSITORY" --base dev --head "$BRANCH" --title "$TITLE" --body-file "$PR_BODY"
