name: Pricing Updater

on:
  schedule:
    - cron: "0 0 * * 1" # Monday 00:00 UTC — sync only unless a provider has scheduled: true
  workflow_dispatch:
    inputs:
      providers:
        description: Comma-separated provider dirs to update (e.g. groq or groq,nebius)
        required: true
        type: string

permissions:
  contents: write

jobs:
  sync:
    if: github.event.repository.fork
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Sync fork dev from upstream
        env:
          UPSTREAM_REPO: anomalyco/models.dev
        run: |
          set -euo pipefail

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null \
            || git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream dev
          git checkout dev
          git pull --ff-only origin dev

          if git rev-parse HEAD >/dev/null && [ "$(git rev-parse HEAD)" = "$(git rev-parse upstream/dev)" ]; then
            echo "dev is already synced with upstream/dev."
            exit 0
          fi

          if git merge --ff-only upstream/dev; then
            echo "Fast-forwarded dev to upstream/dev."
          elif git merge upstream/dev -m "chore: sync dev from ${UPSTREAM_REPO}"; then
            echo "Merged upstream/dev into dev."
          else
            echo "Failed to sync dev with upstream/dev due to merge conflicts." >&2
            exit 1
          fi

          git push origin dev

  providers:
    needs: sync
    if: |
      always() &&
      (needs.sync.result == 'success' || needs.sync.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Build provider matrix
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_PROVIDERS: ${{ github.event.inputs.providers }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -z "$REQUESTED_PROVIDERS" ]; then
              echo "No providers requested." >&2
              exit 1
            fi

            matrix="$(
              jq -c --arg requested "$REQUESTED_PROVIDERS" '
                ($requested | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))) as $want |
                {include: [.[] | select(.provider as $p | $want | index($p) != null)]}
              ' .github/pricing-updater/providers.json
            )"

            unknown="$(
              jq -r --arg requested "$REQUESTED_PROVIDERS" '
                ($requested | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))) as $want |
                ($want - ([.[] | .provider])) | .[]
              ' .github/pricing-updater/providers.json
            )"
            if [ -n "$unknown" ]; then
              echo "Unknown provider(s) not in .github/pricing-updater/providers.json:" >&2
              echo "$unknown" >&2
              exit 1
            fi
          else
            matrix="$(
              jq -c '{include: [.[] | select(.scheduled == true) | {provider, branch_slug}]}' \
                .github/pricing-updater/providers.json
            )"
          fi

          if [ "$(echo "$matrix" | jq '.include | length')" -eq 0 ]; then
            echo "No providers selected for this run."
          else
            echo "Providers selected:"
            echo "$matrix" | jq -r '.include[] | "  - \(.provider)"'
          fi

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  update:
    needs: providers
    if: |
      always() &&
      needs.providers.result == 'success' &&
      fromJSON(needs.providers.outputs.matrix).include[0] != null
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.providers.outputs.matrix) }}
    concurrency: pricing-updater-${{ matrix.provider }}
    env:
      PROVIDER: ${{ matrix.provider }}
      BRANCH_SLUG: ${{ matrix.branch_slug }}

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install opencode
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Run pricing updater agent
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_PERMISSION: '{"bash":"deny"}'
          OPENCODE_CONFIG_CONTENT: |
            {
              "$schema": "https://opencode.ai/config.json",
              "mcp": {
                "narev": {
                  "type": "remote",
                  "url": "https://mcp.narev.ai",
                  "enabled": true,
                  "oauth": false,
                  "timeout": 30000
                }
              }
            }
        run: |
          set -o pipefail

          opencode run --agent pricing-updater -m opencode/glm-5.2 <<EOF
          Refresh token pricing for provider: ${PROVIDER}

          Scope this run to providers/${PROVIDER}/ only.
          EOF

      - name: Check changed paths
        if: success()
        run: |
          while IFS= read -r line; do
            path="${line:3}"
            case "$path" in
              "providers/${PROVIDER}"/*) ;;
              *)
                echo "Unexpected change outside providers/${PROVIDER}/: $path" >&2
                exit 1
                ;;
            esac
          done < <(git status --porcelain)

      - name: Validate models
        if: success()
        run: bun validate

      - name: Push branch
        if: success()
        env:
          UPSTREAM_REPO: anomalyco/models.dev
        run: |
          if [ -z "$(git status --porcelain -- "providers/${PROVIDER}")" ]; then
            echo "No pricing changes for ${PROVIDER}."
            exit 0
          fi

          git config user.name "narevBull"
          git config user.email "290319999+narevBull@users.noreply.github.com"

          SNAPSHOT="$RUNNER_TEMP/provider-snapshot"
          rm -rf "$SNAPSHOT"
          cp -a "providers/${PROVIDER}" "$SNAPSHOT/"

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null \
            || git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream dev

          DATE="$(date -u +%Y-%m-%d)"
          BRANCH="chore/${BRANCH_SLUG}-pricing-${DATE}"
          TITLE="chore: update ${BRANCH_SLUG} pricing"

          git fetch --no-tags origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" || true
          git checkout -B "$BRANCH" upstream/dev
          rsync -a "${SNAPSHOT}/" "providers/${PROVIDER}/"
          git add "providers/${PROVIDER}"

          if git diff --cached --quiet; then
            echo "No pricing diff vs upstream/dev for ${PROVIDER}."
            exit 0
          fi

          git commit -m "$TITLE"

          git push --force-with-lease origin "$BRANCH"
          echo "Pushed ${BRANCH} for review (based on upstream/dev)."
