name: Observe Agent Providers

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

# Amazon Bedrock, Vertex and Azure have no API to sync from. observe runs the observer agent (opencode, model key only,
# no GitHub token, no shell, no edits) on each provider's brief, then applies its observations through the sync engine
# and uploads the result like Sync Model Catalogs does. publish runs only .github/sync-models/ with the automation app
# token. Agent results are never safe (risk reason agent-observed), so these pull requests never auto-merge. gaps starts
# Fill Catalog Gap for new and update gaps like Sync Model Catalogs does; removal gaps stay in the pull request body.
permissions:
  contents: read

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  providers:
    if: github.repository == 'anomalyco/models.dev'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.providers.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: dev
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: List agent providers
        id: providers
        run: |
          matrix="$(bun models:sync2 --list=agents)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  observe:
    needs: providers
    if: github.repository == 'anomalyco/models.dev'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.providers.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write
    # Matrix legs share one output: only legs with gaps write it, and empty values never overwrite it.
    outputs:
      gaps: ${{ steps.gaps.outputs.gaps }}
    env:
      PROVIDER: ${{ matrix.provider }}
      NAME: ${{ matrix.name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: dev
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install opencode
        run: curl -fsSL https://opencode.ai/install | bash -s -- --version 1.19.4

      - name: Build prompt
        run: |
          set -euo pipefail
          echo "OUT=$RUNNER_TEMP/sync" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/sync"
          bun models:sync2 "$PROVIDER" --agent-brief --json > "$RUNNER_TEMP/brief.json"
          {
            echo "Check the $NAME (\`$PROVIDER\`) models in models.dev against $NAME's own pages."
            echo "Here is your brief: the sources to read, provider-specific instructions, the fields to report, the current catalog"
            echo "files and the JSON schema your answer must match."
            echo '```json'
            jq . "$RUNNER_TEMP/brief.json" | head -c 120000
            echo '```'
          } > "$RUNNER_TEMP/prompt.md"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/models.dev-release
          role-session-name: models.dev-observe-${{ github.run_id }}
          aws-region: us-east-1

      - name: Fetch secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            OPENCODE_API_KEY,models.dev/release/OPENCODE_API_KEY
          parse-json-secrets: false

      # A clean environment: the model key and nothing else (no AWS or Actions credentials).
      - name: Run observer agent
        run: |
          set -euo pipefail
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 \
            OPENCODE_API_KEY="$OPENCODE_API_KEY" \
            OPENCODE_PERMISSION='{"bash":"deny","task":"deny","edit":"deny","external_directory":"deny"}' \
            OPENCODE_CONFIG_CONTENT='{"snapshot":false,"autoupdate":false,"share":"disabled"}' \
            opencode run --agent observer -m opencode/muse-spark-1.3 --variant xhigh --format json \
            < "$RUNNER_TEMP/prompt.md" | tee "$RUNNER_TEMP/events.jsonl"
          if ! jq -ers 'map(select(.type == "text") | .part.text) | last | select(length > 0)' "$RUNNER_TEMP/events.jsonl" > "$RUNNER_TEMP/answer.md"; then
            echo "::error::the observer gave no final answer"
            exit 1
          fi
          # Edits are denied; check anyway.
          if [ -n "$(git status --porcelain -uall -- models providers)" ]; then
            echo "::error::the observer changed catalog files"
            exit 1
          fi

      - name: Apply observations
        env:
          OPENCODE_API_KEY: ""
        run: |
          set -euo pipefail
          bun models:sync2 "$PROVIDER" --observations="$RUNNER_TEMP/answer.md" --json --report="$OUT/report.md" > "$OUT/result.json"
          jq -e '.provider and (.changes | type == "array") and (.gaps | type == "array")' "$OUT/result.json" > /dev/null
          tee -a "$GITHUB_STEP_SUMMARY" < "$OUT/report.md" > /dev/null

      - name: Check for gaps
        id: gaps
        run: |
          if jq -e 'any(.gaps[]; .kind == "new" or .kind == "update")' "$OUT/result.json" > /dev/null; then
            echo "gaps=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate models
        env:
          OPENCODE_API_KEY: ""
        run: |
          if [ -n "$(git status --porcelain -- models providers)" ]; then bun validate; fi

      - name: Prepare upload
        run: |
          set -euo pipefail
          printf '%s' "$PROVIDER" > "$OUT/provider"
          printf '%s' "$NAME" > "$OUT/name"
          # Never auto-merged, whatever the result says.
          printf 'false' > "$OUT/safe"
          if [ -n "$(git status --porcelain -- models providers)" ]; then
            git add models providers
            git -c user.name=sync -c user.email=sync@localhost commit -q --no-verify -m sync
            git diff --binary HEAD^ HEAD > "$OUT/changes.patch"
          fi

      - name: Upload result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sync-${{ matrix.provider }}
          path: ${{ runner.temp }}/sync
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [providers, observe]
    if: always() && github.repository == 'anomalyco/models.dev' && needs.providers.result == 'success'
    runs-on: ubuntu-latest
    environment: automation
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/models.dev-automation
          role-session-name: models.dev-automation-${{ github.run_id }}
          aws-region: us-east-1

      - name: Fetch secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            AUTOMATION_APP_PRIVATE_KEY,models.dev/automation/AUTOMATION_APP_PRIVATE_KEY
          parse-json-secrets: false

      - name: Create app token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ env.AUTOMATION_APP_PRIVATE_KEY }}
          repositories: models.dev
          permission-contents: write
          permission-pull-requests: write

      - name: Check out publish scripts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          path: trusted
          sparse-checkout: /.github/sync-models/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Holds the push credential; nothing from this checkout runs.
      - name: Check out dev
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: dev
          path: repo
          token: ${{ steps.app.outputs.token }}

      - name: Download results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/sync
          pattern: sync-*

      # publish.sh disables auto-merge on any pull request whose safe flag is false; these are always false.
      - name: Publish
        working-directory: repo
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -uo pipefail
          BOT_NAME="${SLUG}[bot]"
          BOT_EMAIL="$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)+${SLUG}[bot]@users.noreply.github.com" || exit 1
          export BOT_NAME BOT_EMAIL
          failed=0
          for dir in "$RUNNER_TEMP"/sync/sync-*/; do
            [ -f "$dir/changes.patch" ] || continue
            bash ../trusted/.github/sync-models/publish.sh "$dir" || failed=1
          done
          exit "$failed"

  gaps:
    needs: observe
    # Runs when some providers failed, so the others' gaps still start.
    if: always() && github.repository == 'anomalyco/models.dev' && github.ref == 'refs/heads/dev' && needs.observe.outputs.gaps == 'true'
    runs-on: ubuntu-latest
    # The built-in token can start workflows (workflow_dispatch is the exception to its no-trigger rule) and read pull
    # requests; it can't push.
    permissions:
      actions: write
      contents: read
      pull-requests: read

    steps:
      - name: Check out gap scripts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          path: trusted
          sparse-checkout: /.github/sync-models/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Only the ignore lists are read from here.
      - name: Check out dev ignore lists
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: dev
          path: repo
          sparse-checkout: /providers/*/sync-ignore.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/sync
          pattern: sync-*

      - name: Start gap runs
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GAP_LIMIT: 5
        run: bash ../trusted/.github/sync-models/dispatch-gaps.sh "$RUNNER_TEMP/sync"
