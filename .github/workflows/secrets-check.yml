name: Secrets check

# Temporary: proves the release stage role can read every name the workflows ask
# for. Deleted after the migration.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'anomalyco/models.dev'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/models.dev-release
          role-session-name: models.dev-check-${{ github.run_id }}
          aws-region: us-east-1

      - name: Fetch secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            ANTHROPIC_API_KEY,models.dev/release/ANTHROPIC_API_KEY
            BASETEN_API_KEY,models.dev/release/BASETEN_API_KEY
            CLOUDFLARE_API_TOKEN,models.dev/release/CLOUDFLARE_API_TOKEN
            CLOUDFLARE_WORKERS_AI_SYNC_API_TOKEN,models.dev/release/CLOUDFLARE_WORKERS_AI_SYNC_API_TOKEN
            DEEPINFRA_API_KEY,models.dev/release/DEEPINFRA_API_KEY
            DIGITALOCEAN_API_TOKEN,models.dev/release/DIGITALOCEAN_API_TOKEN
            FIREWORKS_API_KEY,models.dev/release/FIREWORKS_API_KEY
            GOOGLE_API_KEY,models.dev/release/GOOGLE_API_KEY
            MERGE_GATEWAY_API_KEY,models.dev/release/MERGE_GATEWAY_API_KEY
            MISTRAL_API_KEY,models.dev/release/MISTRAL_API_KEY
            NOVITA_AI_API_KEY,models.dev/release/NOVITA_AI_API_KEY
            OPENAI_API_KEY,models.dev/release/OPENAI_API_KEY
            OPENCODE_API_KEY,models.dev/release/OPENCODE_API_KEY
            OPENROUTER_API_KEY,models.dev/release/OPENROUTER_API_KEY
            XAI_API_KEY,models.dev/release/XAI_API_KEY
          parse-json-secrets: false

      - name: Check secrets
        env:
          ALIASED: ${{ env.CLOUDFLARE_WORKERS_AI_SYNC_API_TOKEN }}
        run: |
          set -euo pipefail
          check() {
            if [ -n "${!1:-}" ]; then
              echo "$1 ok"
            else
              echo "::error::$1 is empty"
              exit 1
            fi
          }
          check ANTHROPIC_API_KEY
          check BASETEN_API_KEY
          check CLOUDFLARE_API_TOKEN
          check CLOUDFLARE_WORKERS_AI_SYNC_API_TOKEN
          check DEEPINFRA_API_KEY
          check DIGITALOCEAN_API_TOKEN
          check FIREWORKS_API_KEY
          check GOOGLE_API_KEY
          check MERGE_GATEWAY_API_KEY
          check MISTRAL_API_KEY
          check NOVITA_AI_API_KEY
          check OPENAI_API_KEY
          check OPENCODE_API_KEY
          check OPENROUTER_API_KEY
          check XAI_API_KEY
          if [ -z "${ALIASED:-}" ]; then
            echo "::error::env context alias is empty"
            exit 1
          fi
          echo "env alias ok"
