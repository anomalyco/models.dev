name: Migrate secrets

# Temporary: copies the automation environment's GitHub secret into
# models.dev/automation/ and checks that it reads back byte-for-byte.
# Deleted in the `ci: read secrets from aws` commit.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: automation

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/models.dev-automation
          role-session-name: models.dev-migrate-${{ github.run_id }}
          aws-region: us-east-1

      - name: Put AUTOMATION_APP_PRIVATE_KEY
        env:
          V: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [ -n "${V:-}" ] || { echo "::error::AUTOMATION_APP_PRIVATE_KEY is empty"; exit 1; }
          aws secretsmanager put-secret-value --secret-id models.dev/automation/AUTOMATION_APP_PRIVATE_KEY --secret-string "$V" > /dev/null

  check:
    runs-on: ubuntu-latest
    environment: automation

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/models.dev-automation
          role-session-name: models.dev-check-${{ github.run_id }}
          aws-region: us-east-1

      - name: Fetch secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            AUTOMATION_APP_PRIVATE_KEY,models.dev/automation/AUTOMATION_APP_PRIVATE_KEY
          parse-json-secrets: false

      - name: Check AUTOMATION_APP_PRIVATE_KEY
        env:
          G: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          V: ${{ env.AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          report() {
            local name="$1" value="$2"
            [ -n "$value" ] || { echo "::error::$name is empty"; return 1; }
            first="$(printf '%s\n' "$value" | head -1)"
            last="$(printf '%s\n' "$value" | grep -v '^$' | tail -1)"
            case "$first" in
              "-----BEGIN "*) ;;
              *) echo "::error::$name does not start with a PEM header"; return 1 ;;
            esac
            case "$last" in
              "-----END "*) ;;
              *) echo "::error::$name does not end with a PEM footer"; return 1 ;;
            esac
            type="$(printf '%s' "$first" | sed -e 's/^-----BEGIN //' -e 's/-----$//')"
            lines="$(printf '%s\n' "$value" | wc -l | tr -d ' ')"
            hash="$(printf '%s' "$value" | sha256sum | cut -c1-12)"
            printf '%s ok, %s lines, %s, sha256 %s\n' "$name" "$lines" "$type" "$hash"
          }
          report AUTOMATION_APP_PRIVATE_KEY.github "$G"
          report AUTOMATION_APP_PRIVATE_KEY.aws "$V"
          if [ "$(printf '%s' "$G" | sha256sum)" = "$(printf '%s' "$V" | sha256sum)" ]; then
            echo "match=yes"
          else
            echo "::error::AWS value does not match the GitHub secret"
            exit 1
          fi
