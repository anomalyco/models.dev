name: Migrate secrets

# Temporary: copies the repo's GitHub secrets into AWS Secrets Manager.
# Deleted once every secret has two versions.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    if: github.repository == 'anomalyco/models.dev'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/models.dev-release
          role-session-name: models.dev-migrate-${{ github.run_id }}
          aws-region: us-east-1

      - name: Copy secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKERS_AI_SYNC_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_SYNC_API_TOKEN }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          DIGITALOCEAN_API_TOKEN: ${{ secrets.DIGITALOCEAN_API_TOKEN }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          MERGE_GATEWAY_API_KEY: ${{ secrets.MERGE_GATEWAY_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NOVITA_AI_API_KEY: ${{ secrets.NOVITA_AI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          set -euo pipefail
          put() {
            name="$1"
            value="$2"
            if [ -z "$value" ]; then
              echo "::error::$name is empty"
              exit 1
            fi
            aws secretsmanager put-secret-value \
              --secret-id "models.dev/release/$name" \
              --secret-string "$value" > /dev/null
            echo "$name copied"
          }
          put ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"
          put BASETEN_API_KEY "$BASETEN_API_KEY"
          put CLOUDFLARE_API_TOKEN "$CLOUDFLARE_API_TOKEN"
          put CLOUDFLARE_WORKERS_AI_SYNC_API_TOKEN "$CLOUDFLARE_WORKERS_AI_SYNC_API_TOKEN"
          put DEEPINFRA_API_KEY "$DEEPINFRA_API_KEY"
          put DIGITALOCEAN_API_TOKEN "$DIGITALOCEAN_API_TOKEN"
          put FIREWORKS_API_KEY "$FIREWORKS_API_KEY"
          put GOOGLE_API_KEY "$GOOGLE_API_KEY"
          put MERGE_GATEWAY_API_KEY "$MERGE_GATEWAY_API_KEY"
          put MISTRAL_API_KEY "$MISTRAL_API_KEY"
          put NOVITA_AI_API_KEY "$NOVITA_AI_API_KEY"
          put OPENAI_API_KEY "$OPENAI_API_KEY"
          put OPENCODE_API_KEY "$OPENCODE_API_KEY"
          put OPENROUTER_API_KEY "$OPENROUTER_API_KEY"
          put XAI_API_KEY "$XAI_API_KEY"

      # Temporary: does a value exported to GITHUB_ENV by the fetch action show
      # up in the env expression context of a later step?
      - name: Fetch one secret
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            CHECK_SECRET,models.dev/release/OPENCODE_API_KEY
          parse-json-secrets: false

      - name: Check env context
        env:
          ALIASED: ${{ env.CHECK_SECRET }}
        run: |
          set -eu
          test -n "$CHECK_SECRET" && echo "direct env ok"
          if [ -n "${ALIASED:-}" ]; then echo "env context ok"; else echo "env context empty"; fi
