name: Sync Model Catalogs

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

# sync runs repository code and provider API keys with a read-only token. It uploads each provider's result, report and
# catalog patch as data. publish runs only .github/sync-models/ from this commit with a models.dev automation app token
# from the automation environment: it applies each patch, allowing only catalog TOML, opens or updates the provider's
# pull request and auto-merges safe syncs. The app's pull requests run their checks and its merges deploy as usual.
# gaps runs only .github/sync-models/ too and starts Fill Catalog Gap for new gaps nobody is handling yet.
permissions:
  contents: read

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # One job syncs every provider so a run pays for one runner instead of one per provider. Providers are independent:
  # each starts from a clean dev, and a provider that fails neither stops the rest nor leaks its partial changes.
  sync:
    if: github.repository == 'anomalyco/models.dev'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: release
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      gaps: ${{ steps.sync.outputs.gaps }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: dev
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/models.dev-release
          role-session-name: models.dev-sync-${{ github.run_id }}
          aws-region: us-east-1

      - name: Fetch secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            ANTHROPIC_API_KEY,models.dev/release/ANTHROPIC_API_KEY
            BASETEN_API_KEY,models.dev/release/BASETEN_API_KEY
            CLOUDFLARE_WORKERS_AI_SYNC_API_TOKEN,models.dev/release/CLOUDFLARE_WORKERS_AI_SYNC_API_TOKEN
            DASHSCOPE_API_KEY,models.dev/release/DASHSCOPE_API_KEY
            DEEPINFRA_API_KEY,models.dev/release/DEEPINFRA_API_KEY
            DEEPSEEK_API_KEY,models.dev/release/DEEPSEEK_API_KEY
            DIGITALOCEAN_API_TOKEN,models.dev/release/DIGITALOCEAN_API_TOKEN
            FIREWORKS_API_KEY,models.dev/release/FIREWORKS_API_KEY
            GOOGLE_API_KEY,models.dev/release/GOOGLE_API_KEY
            MERGE_GATEWAY_API_KEY,models.dev/release/MERGE_GATEWAY_API_KEY
            MISTRAL_API_KEY,models.dev/release/MISTRAL_API_KEY
            MOONSHOT_API_KEY,models.dev/release/MOONSHOT_API_KEY
            NOVITA_AI_API_KEY,models.dev/release/NOVITA_AI_API_KEY
            OPENAI_API_KEY,models.dev/release/OPENAI_API_KEY
            OPENROUTER_API_KEY,models.dev/release/OPENROUTER_API_KEY
            XAI_API_KEY,models.dev/release/XAI_API_KEY
          parse-json-secrets: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync model catalogs
        id: sync
        env:
          ANTHROPIC_API_KEY: ${{ env.ANTHROPIC_API_KEY }}
          BASETEN_API_KEY: ${{ env.BASETEN_API_KEY }}
          DASHSCOPE_API_KEY: ${{ env.DASHSCOPE_API_KEY }}
          DEEPINFRA_API_KEY: ${{ env.DEEPINFRA_API_KEY }}
          DEEPSEEK_API_KEY: ${{ env.DEEPSEEK_API_KEY }}
          DIGITALOCEAN_API_TOKEN: ${{ env.DIGITALOCEAN_API_TOKEN }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          FIREWORKS_API_KEY: ${{ env.FIREWORKS_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OPENROUTER_API_KEY: ${{ env.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ env.OPENAI_API_KEY }}
          VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}
          LLMGATEWAY_API_KEY: ${{ secrets.LLMGATEWAY_API_KEY }}
          MERGE_GATEWAY_API_KEY: ${{ env.MERGE_GATEWAY_API_KEY }}
          MISTRAL_API_KEY: ${{ env.MISTRAL_API_KEY }}
          MOONSHOT_API_KEY: ${{ env.MOONSHOT_API_KEY }}
          NOVITA_AI_API_KEY: ${{ env.NOVITA_AI_API_KEY }}
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          GOOGLE_API_KEY: ${{ env.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          XAI_API_KEY: ${{ env.XAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_WORKERS_AI_SYNC_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_WORKERS_AI_SYNC_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_AI_SYNC_ACCOUNT_ID: ${{ vars.CLOUDFLARE_WORKERS_AI_SYNC_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_AI_SYNC_API_TOKEN: ${{ env.CLOUDFLARE_WORKERS_AI_SYNC_API_TOKEN }}
        run: |
          set -uo pipefail

          out="$RUNNER_TEMP/sync"
          failures="$RUNNER_TEMP/sync-failures"
          results="$RUNNER_TEMP/sync-results.md"
          providers="$RUNNER_TEMP/sync-providers"
          : > "$failures"
          printf '| provider | result |\n| --- | --- |\n' > "$results"

          base="$(git rev-parse HEAD)"
          changed=false
          gaps=false

          if ! bun models:sync2 --list | jq -r '.include[] | [.provider, .name] | @tsv' > "$providers"; then
            echo "::error::failed to list sync providers"
            printf 'failed=true\nchanged=%s\ngaps=%s\n' "$changed" "$gaps" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS=$'\t' read -r provider name <&3; do
            echo "::group::Sync $name ($provider)"

            # Every provider starts from clean dev, exactly like the old per-provider jobs: nothing a previous
            # provider (or a failed one) left behind can appear in this provider's patch.
            git reset -q --hard "$base"
            git clean -qfd models providers
            dir="$out/sync-$provider"
            rm -rf "$dir"
            mkdir -p "$dir"

            result=ok
            if ! bun models:sync2 "$provider" --json --report="$dir/report.md" < /dev/null > "$dir/result.json"; then
              result="sync failed"
            elif ! jq -e '.provider and (.changes | type == "array") and (.gaps | type == "array")' "$dir/result.json" > /dev/null; then
              result="invalid result"
            elif [ -n "$(git status --porcelain -- models providers)" ] && ! bun validate < /dev/null; then
              result="validation failed"
            fi

            if [ "$result" != ok ]; then
              # Drop this provider's partial changes and keep syncing the rest.
              echo "::error::$provider: $result"
              printf '%s: %s\n' "$provider" "$result" >> "$failures"
              printf '| %s | %s |\n' "$provider" "$result" >> "$results"
              rm -rf "$dir"
              echo "::endgroup::"
              continue
            fi

            has_gaps=false
            if jq -e 'any(.gaps[]; .kind == "new" or .kind == "update")' "$dir/result.json" > /dev/null; then
              has_gaps=true
              gaps=true
            fi

            if [ -z "$(git status --porcelain -- models providers)" ]; then
              echo "No model catalog changes found."
              printf '| %s | unchanged |\n' "$provider" >> "$results"
              # Keep the result only when Fill Catalog Gap may need it.
              if [ "$has_gaps" = true ]; then
                printf '%s' "$provider" > "$dir/provider"
                printf '%s' "$name" > "$dir/name"
              else
                rm -rf "$dir"
              fi
              echo "::endgroup::"
              continue
            fi

            tee -a "$GITHUB_STEP_SUMMARY" < "$dir/report.md" >/dev/null

            git add models providers
            git -c user.name=sync -c user.email=sync@localhost commit -q --no-verify -m sync
            git diff --binary HEAD^ HEAD > "$dir/changes.patch"
            jq -j '.risk.safe' "$dir/result.json" > "$dir/safe"
            printf '%s' "$provider" > "$dir/provider"
            printf '%s' "$name" > "$dir/name"

            printf '| %s | changed |\n' "$provider" >> "$results"
            changed=true
            echo "::endgroup::"
          done 3< "$providers"

          git reset -q --hard "$base"
          git clean -qfd models providers

          printf 'changed=%s\ngaps=%s\n' "$changed" "$gaps" >> "$GITHUB_OUTPUT"
          if [ -s "$failures" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
          cat "$results" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload changes
        if: steps.sync.outputs.changed == 'true' || steps.sync.outputs.gaps == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sync
          path: ${{ runner.temp }}/sync
          if-no-files-found: error
          retention-days: 1

      # Fails the run after the changes other providers produced are safely uploaded, so publish still goes ahead.
      - name: Check for failed providers
        if: steps.sync.outputs.failed == 'true'
        run: |
          echo "These providers did not sync and produced no patch or gaps:"
          cat "$RUNNER_TEMP/sync-failures"
          exit 1

  publish:
    needs: sync
    # Runs when some provider syncs failed, so the others still publish.
    if: always() && github.repository == 'anomalyco/models.dev' && needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: automation
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/models.dev-automation
          role-session-name: models.dev-automation-${{ github.run_id }}
          aws-region: us-east-1

      - name: Fetch secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            AUTOMATION_APP_PRIVATE_KEY,models.dev/automation/AUTOMATION_APP_PRIVATE_KEY
          parse-json-secrets: false

      - name: Create app token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ env.AUTOMATION_APP_PRIVATE_KEY }}
          repositories: models.dev
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Check out publish scripts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          path: trusted
          sparse-checkout: /.github/sync-models/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Holds the push credential; nothing from this checkout runs.
      - name: Check out dev
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: dev
          path: repo
          token: ${{ steps.app.outputs.token }}

      - name: Download changes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sync
          path: ${{ runner.temp }}/sync

      - name: Publish
        working-directory: repo
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -uo pipefail
          BOT_NAME="${SLUG}[bot]"
          BOT_EMAIL="$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)+${SLUG}[bot]@users.noreply.github.com" || exit 1
          export BOT_NAME BOT_EMAIL
          failed=0
          for dir in "$RUNNER_TEMP"/sync/sync-*/; do
            [ -f "$dir/changes.patch" ] || continue
            bash ../trusted/.github/sync-models/publish.sh "$dir" || failed=1
          done
          exit "$failed"

  gaps:
    needs: sync
    # Runs when some provider syncs failed, so the others' gaps still start.
    if: always() && github.repository == 'anomalyco/models.dev' && github.ref == 'refs/heads/dev' && needs.sync.outputs.gaps == 'true'
    runs-on: ubuntu-latest
    # The built-in token can start workflows (workflow_dispatch is the exception to its no-trigger rule) and read pull
    # requests; it can't push.
    permissions:
      actions: write
      contents: read
      pull-requests: read

    steps:
      - name: Check out gap scripts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          path: trusted
          sparse-checkout: /.github/sync-models/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Only the ignore lists are read from here.
      - name: Check out dev ignore lists
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: dev
          path: repo
          sparse-checkout: /providers/*/sync-ignore.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sync
          path: ${{ runner.temp }}/sync

      - name: Start gap runs
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GAP_LIMIT: 5
        run: bash ../trusted/.github/sync-models/dispatch-gaps.sh "$RUNNER_TEMP/sync"
